---
name: Order Processing - Manually Crafted (run.py)
author: Arne Tarara <arne@green-coding.io>
description: >
  Measures the energy cost of processing 99 orders using the manually crafted
  synchronous script (run.py). Uses psycopg3, sequential HTTP notifications,
  and per-row UPDATE commits.

custom_metrics:
  orders_processed:
    unit: orders processed
    sci: True

compose-file: !include docker-compose.yml

services:
  gcb-orders-runner:
    image: gcb_sample_code
    build: .
    environment:
      PG_DSN: "postgresql://orders:orders@gcb-orders-db:5432/orders"
    depends_on:
      gcb-orders-db:
        condition: service_healthy
    volumes:
      - ../../sample-code/setup.py:/opt/app/setup.py:ro
      - ../../sample-code/run.py:/opt/app/run.py:ro

flow:
  - name: Init DB
    hidden: true
    container: gcb-orders-runner
    commands:
      - type: console
        command: python /opt/app/setup.py
        note: Seed database with 99 orders

  - name: Process 99 orders
    container: gcb-orders-runner
    commands:
      - type: console
        command: python /opt/app/run.py
        note: Process all orders sequentially
      - type: console
        command: echo $(date +%s%N) orders_processed=99
        shell: sh
        note: Static count - setup.py always seeds exactly 99 orders
