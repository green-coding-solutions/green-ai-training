---
name: Order Processing - Green AI Optimized (run_green_ai_optimized.py)
author: Arne Tarara <arne@green-coding.io>
description: >
  Measures the energy cost of processing 99 orders using the green AI-optimized
  async script (run_green_ai_optimized.py). Optimized by Claude Opus 4.8 with
  high-effort thinking: concurrent HTTP notifications via aiohttp with a
  semaphore-capped connection pool, batched UPDATE, and a single commit.

custom_metrics:
  orders_processed:
    unit: orders processed
    sci: True

compose-file: !include docker-compose.yml

services:
  gcb-orders-runner:
    image: gcb_sample_code
    build: .
    environment:
      PG_DSN: "postgresql://orders:orders@gcb-orders-db:5432/orders"
    depends_on:
      gcb-orders-db:
        condition: service_healthy
    volumes:
      - ../../sample-code/setup.py:/opt/app/setup.py:ro
      - ../../sample-code/run_green_ai_optimized.py:/opt/app/run_green_ai_optimized.py:ro

flow:
  - name: Init DB
    hidden: true
    container: gcb-orders-runner
    commands:
      - type: console
        command: python /opt/app/setup.py
        note: Seed database with 99 orders

  - name: Process 99 orders
    container: gcb-orders-runner
    commands:
      - type: console
        command: python /opt/app/run_green_ai_optimized.py
        note: Process all orders with concurrent async notifications
      - type: console
        command: echo $(date +%s%N) orders_processed=99
        shell: sh
        note: Static count - setup.py always seeds exactly 99 orders
