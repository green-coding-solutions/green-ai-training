---
name: Bottom Up Benchmark Python List - .insert(0, ...)
author: arne@green-coding.io
description: >
  Measure the energy cost of list.insert(0, ...).
  insert(0, ...) is O(n) — every existing element must be shifted right
  on each call, making it dramatically more expensive as the list grows.

custom_metrics:
  list_operations:
    unit: list operations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/list_insert.py
