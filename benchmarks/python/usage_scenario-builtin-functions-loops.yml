---
name: Bottom Up Benchmark Python Built-in Functions - Hand-written Loops
author: arne@green-coding.io
description: >
  Computes sum, max, frost check and readings per station over 1,000,000 values with hand-written Python loops and a full sort. Copy of test-cases/python/builtin-functions/script.py.

custom_metrics:
  readings_processed:
    unit: readings processed
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/builtin_functions_loops.py
