---
name: Bottom Up Benchmark Idle
author: OpenAI Codex
description: Measure mostly linear idle waiting cost to serve as a baseline benchmark.

custom_metrics:
  idle_seconds:
    unit: idle seconds
    sci: True

services:
  gcb-bottom-up-bench:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: Idle scaling
    container: gcb-bottom-up-bench
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode idle --metric idle_seconds --seconds 1
        note: Idle for 1 second
      - type: console
        command: python /opt/bench/benchmark.py --mode idle --metric idle_seconds --seconds 2
        note: Idle for 2 seconds
      - type: console
        command: python /opt/bench/benchmark.py --mode idle --metric idle_seconds --seconds 5
        note: Idle for 5 seconds
