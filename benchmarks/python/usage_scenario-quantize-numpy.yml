---
name: Bottom Up Benchmark Python Quantize - NumPy (pure Python loop)
author: arne@green-coding.io
description: >
  1-bit sigma-delta quantization of 10M float64 samples using a pure Python
  loop over a NumPy array. The sequential error-feedback loop prevents
  NumPy vectorization, so every iteration pays full Python interpreter overhead.

custom_metrics:
  samples:
    unit: samples
    sci: True

services:
  python:
    image: python:3.12-slim
    setup-commands:
      - command: pip install numpy

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/quantize_numpy.py
