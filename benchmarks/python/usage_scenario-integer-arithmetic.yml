---
name: Bottom Up Benchmark Integer Arithmetic
author: OpenAI Codex
description: Measure the scaling cost of a simple integer arithmetic block.

custom_metrics:
  integer_iterations:
    unit: integer iterations
    sci: True

services:
  gcb-bottom-up-bench:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: Integer arithmetic scaling
    container: gcb-bottom-up-bench
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode integer-arithmetic --metric integer_iterations --size 10 --min-runtime 1.0
        note: Integer arithmetic with logical size 10
      - type: console
        command: sleep 1
        note: Cooldown after size 10
      - type: console
        command: python /opt/bench/benchmark.py --mode integer-arithmetic --metric integer_iterations --size 100 --min-runtime 1.0
        note: Integer arithmetic with logical size 100
      - type: console
        command: sleep 1
        note: Cooldown after size 100
      - type: console
        command: python /opt/bench/benchmark.py --mode integer-arithmetic --metric integer_iterations --size 1000 --min-runtime 1.0
        note: Integer arithmetic with logical size 1000
      - type: console
        command: sleep 1
        note: Cooldown after size 1000
      - type: console
        command: python /opt/bench/benchmark.py --mode integer-arithmetic --metric integer_iterations --size 10000 --min-runtime 1.0
        note: Integer arithmetic with logical size 10000
