---
name: Bottom Up Benchmark Python PyTorch - Inference with no_grad()
author: arne@green-coding.io
description: >
  Forward passes through a 4-layer MLP on CPU with torch.no_grad().
  Gradient tracking is disabled, so PyTorch skips building the computation
  graph on each pass, reducing memory and CPU overhead.
  Runs at 10k and 100k inferences to test linear energy scaling.

custom_metrics:
  inferences:
    unit: inferences
    sci: True

services:
  python:
    image: python:3.12-slim
    setup-commands:
      - command: pip install torch --index-url https://download.pytorch.org/whl/cpu

flow:
  - name: Benchmark 10k
    container: python
    commands:
      - type: console
        command: python -B scripts/pytorch_inference_no_grad.py

  - name: Cooldown
    hidden: true
    container: python
    commands:
      - type: console
        command: sleep 5

  - name: Benchmark 100k
    container: python
    commands:
      - type: console
        command: python -B scripts/pytorch_inference_no_grad_100k.py
