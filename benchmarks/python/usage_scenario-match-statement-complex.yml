---
name: Bottom Up Benchmark Python Conditionals - Complex Match Statement
author: arne@green-coding.io
description: >
  Compare the energy cost of Python conditional dispatch styles.
  This scenario classifies integers from 1 to 1M using an 8-branch match/case
  statement with range and modulo checks.

custom_metrics:
  classifications:
    unit: classifications
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Classify with complex match/case
    container: python
    commands:
      - type: console
        shell: bash
        command: python -B scripts/match_statement_complex.py
