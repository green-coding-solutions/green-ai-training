---
name: Bottom Up Benchmark Python Caching - Repeated Computation
author: arne@green-coding.io
description: >
  Measure the energy cost of recomputing the same result on every call.
  Calls compute() 1M times over 200 unique integer inputs without any caching.
  compute() runs a sum-of-squares loop (O(n)), so identical inputs redo the
  full loop every time.

custom_metrics:
  computations:
    unit: computations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/repeated_computation.py
