---
name: Bottom Up Benchmark Python Conditionals - If Statement
author: arne@green-coding.io
description: >
  Compare the energy cost of simple vs complex if-elif dispatch in Python.
  Simple: 10M random integers 1-10 with equality checks.
  Complex: 10M random integers 1-1M with range and modulo checks.

custom_metrics:
  classifications:
    unit: classifications
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Simple if-elif
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/if_statement_simple.py

  - name: Cooldown
    hidden: true
    container: python
    commands:
      - type: console
        command: sleep 5

  - name: Complex if-elif
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/if_statement_complex.py
