---
name: Bottom Up Benchmark Python String Concatenation - +=
author: arne@green-coding.io
description: >
  Compare += with and without CPython's in-place resize optimization.
  When the string's reference count is 1, CPython can resize the buffer
  in-place (O(n) total). Keeping a second reference (ref = result) raises
  the refcount to 2, forcing a full copy on every iteration (O(n²) total).

custom_metrics:
  string_concatenations:
    unit: string concatenations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/string_concat_plus.py

  - name: Cooldown
    container: python
    hidden: true
    commands:
      - type: console
        command: sleep 5

  - name: Benchmark no_opt
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/string_concat_plus_no_opt.py
