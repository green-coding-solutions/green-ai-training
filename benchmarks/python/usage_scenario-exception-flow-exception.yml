---
name: Bottom Up Benchmark Python Exception Flow - try/except KeyError
author: arne@green-coding.io
description: >
  Uses exceptions as control flow: every missing key raises a KeyError that is
  caught by except. With a ~50% miss rate over 10M lookups this exercises the
  full exception machinery on half of all iterations.

custom_metrics:
  dict_lookups:
    unit: dict lookups
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Exception as control flow (try/except KeyError)
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/exception_flow.py
