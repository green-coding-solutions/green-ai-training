---
name: Bottom Up Benchmark Sequential Memory
author: OpenAI Codex
description: Measure sequential in-memory read and write cost for increasing buffer sizes.

custom_metrics:
  memory_bytes_processed:
    unit: memory bytes processed
    sci: True

services:
  gcb-bottom-up-bench:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: Sequential memory scaling
    container: gcb-bottom-up-bench
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode memory-sequential --metric memory_bytes_processed --size 4096 --min-runtime 1.0
        note: Sequential memory block with 4 KiB buffer
      - type: console
        command: sleep 1
        note: Cooldown after 4 KiB
      - type: console
        command: python /opt/bench/benchmark.py --mode memory-sequential --metric memory_bytes_processed --size 65536 --min-runtime 1.0
        note: Sequential memory block with 64 KiB buffer
      - type: console
        command: sleep 1
        note: Cooldown after 64 KiB
      - type: console
        command: python /opt/bench/benchmark.py --mode memory-sequential --metric memory_bytes_processed --size 1048576 --min-runtime 1.0
        note: Sequential memory block with 1 MiB buffer
