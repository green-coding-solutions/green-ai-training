---
name: Bottom Up Benchmark Python String Concatenation - join()
author: arne@green-coding.io
description: >
  Compare "".join() with and without the no_opt workload variant.
  join() collects parts in a list and allocates the final string once (O(n) total)
  regardless of reference counts. The no_opt variant holds a second reference
  during the loop to mirror the plus_no_opt and fstring_no_opt conditions,
  though it does not affect join()'s complexity.

custom_metrics:
  string_concatenations:
    unit: string concatenations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: "join() (standard)"
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/string_concat_join.py

  - name: Cooldown
    container: python
    hidden: true
    commands:
      - type: console
        command: sleep 5

  - name: "join() (no_opt workload)"
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/string_concat_join_no_opt.py
