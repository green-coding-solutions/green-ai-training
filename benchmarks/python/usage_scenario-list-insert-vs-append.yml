---
name: Bottom Up Benchmark Python List - .append vs .insert(0, ...)
author: arne@green-coding.io
description: >
  Compare the energy cost of list.append() vs list.insert(0, ...).
  append() is O(1) amortized — it adds to the tail with no shifting.
  insert(0, ...) is O(n) — every existing element must be shifted right
  on each call, making it dramatically more expensive as the list grows.

custom_metrics:
  list_operations:
    unit: list operations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: List append (O(1))
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/list_append.py

  - name: Cooldown 1
    hidden: true
    container: python
    commands:
      - type: console
        command: sleep 5

  - name: List insert at front (O(n))
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/list_insert.py
