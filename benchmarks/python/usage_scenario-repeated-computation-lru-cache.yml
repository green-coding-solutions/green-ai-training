---
name: Bottom Up Benchmark Python Caching - LRU Cache
author: arne@green-coding.io
description: >
  Measure the energy cost of memoising repeated calls with functools.lru_cache.
  Calls compute() 1M times over 200 unique integer inputs. Each unique input is
  computed once (sum-of-squares loop, O(n)); all subsequent calls for the same
  input are served directly from the cache.

custom_metrics:
  computations:
    unit: computations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: LRU cache
    container: python
    commands:
      - type: console
        command: python -B scripts/repeated_computation_lru_cache.py
