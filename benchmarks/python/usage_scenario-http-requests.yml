---
name: Bottom Up Benchmark HTTP Requests
author: OpenAI Codex
description: Measure local HTTP request cost against a simple in-container JSON endpoint.

custom_metrics:
  http_requests:
    unit: http requests
    sci: True

services:
  gcb-bottom-up-http-server:
    image: gcb_bottom_up_benchmarks
    build: .
    command: python /opt/bench/benchmark_server.py
  gcb-bottom-up-http-client:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: HTTP request scaling
    container: gcb-bottom-up-http-client
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode wait-http --server-url http://gcb-bottom-up-http-server:8000/health --timeout-seconds 20
        note: Wait for local HTTP server
      - type: console
        command: python /opt/bench/benchmark.py --mode http-requests --metric http_requests --size 1 --min-runtime 1.0 --server-url http://gcb-bottom-up-http-server:8000
        note: HTTP request batch size 1
      - type: console
        command: sleep 1
        note: Cooldown after batch size 1
      - type: console
        command: python /opt/bench/benchmark.py --mode http-requests --metric http_requests --size 10 --min-runtime 1.0 --server-url http://gcb-bottom-up-http-server:8000
        note: HTTP request batch size 10
      - type: console
        command: sleep 1
        note: Cooldown after batch size 10
      - type: console
        command: python /opt/bench/benchmark.py --mode http-requests --metric http_requests --size 100 --min-runtime 1.0 --server-url http://gcb-bottom-up-http-server:8000
        note: HTTP request batch size 100
