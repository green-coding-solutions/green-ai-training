---
name: Bottom Up Benchmark Python HTTP Requests - sync vs aiohttp
author: arne@green-coding.io
description: >
  Compare the energy cost of making 10 HTTP requests using Python's built-in
  urllib (synchronous) versus aiohttp (asynchronous) to https://codetactics.de

custom_metrics:
  http_requests:
    unit: http requests
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie
    setup-commands:
      - command: pip install aiohttp

flow:
  - name: HTTP requests sync (urllib)
    container: python
    commands:
      - type: console
        shell: bash
        command: |
          python -B scripts/http_requests_sync.py
          echo $(date "+%s%N") 'http_requests=10'

  - name: HTTP requests async (aiohttp)
    container: python
    commands:
      - type: console
        shell: bash
        command: |
          python -B scripts/http_requests_async.py
          echo $(date "+%s%N") 'http_requests=10'
