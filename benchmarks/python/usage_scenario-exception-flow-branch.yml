---
name: Bottom Up Benchmark Python Exception Flow - if key in dict
author: arne@green-coding.io
description: >
  Uses an explicit branch condition to guard the lookup: checks membership with
  "if key in dict" before accessing the value. No exception is raised for missing
  keys; the miss path is a normal conditional branch.

custom_metrics:
  dict_lookups:
    unit: dict lookups
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/branch_condition.py
