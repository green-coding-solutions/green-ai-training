---
name: Bottom Up Benchmark Python Built-in Functions - sum/max/any/Counter
author: arne@green-coding.io
description: >
  Same computations with sum(), max(), any() (stops at the first frost reading), collections.Counter and most_common(1).

custom_metrics:
  readings_processed:
    unit: readings processed
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/builtin_functions_builtins.py
