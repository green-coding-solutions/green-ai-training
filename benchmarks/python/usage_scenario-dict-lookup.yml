---
name: Bottom Up Benchmark Dictionary Lookup
author: OpenAI Codex
description: Measure repeated dictionary lookup cost as the keyspace grows.

custom_metrics:
  dict_lookups:
    unit: dictionary lookups
    sci: True

services:
  gcb-bottom-up-bench:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: Dictionary lookup scaling
    container: gcb-bottom-up-bench
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode dict-lookup --metric dict_lookups --size 10 --min-runtime 1.0
        note: Dictionary lookup with 10 keys
      - type: console
        command: sleep 1
        note: Cooldown after 10 keys
      - type: console
        command: python /opt/bench/benchmark.py --mode dict-lookup --metric dict_lookups --size 100 --min-runtime 1.0
        note: Dictionary lookup with 100 keys
      - type: console
        command: sleep 1
        note: Cooldown after 100 keys
      - type: console
        command: python /opt/bench/benchmark.py --mode dict-lookup --metric dict_lookups --size 1000 --min-runtime 1.0
        note: Dictionary lookup with 1000 keys
      - type: console
        command: sleep 1
        note: Cooldown after 1000 keys
      - type: console
        command: python /opt/bench/benchmark.py --mode dict-lookup --metric dict_lookups --size 10000 --min-runtime 1.0
        note: Dictionary lookup with 10000 keys
