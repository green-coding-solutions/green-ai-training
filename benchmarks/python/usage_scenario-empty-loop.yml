---
name: Bottom Up Benchmark Empty Loop
author: OpenAI Codex
description: Measure the energy cost of a simple empty loop at different logical loop sizes.

custom_metrics:
  loop_iterations:
    unit: loop iterations
    sci: True

services:
  gcb-bottom-up-bench:
    image: gcb_bottom_up_benchmarks
    build: .
    cpus: 1
    mem_limit: "512MB"

flow:
  - name: Empty loop scaling
    container: gcb-bottom-up-bench
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode empty-loop --metric loop_iterations --size 10 --min-runtime 1.0
        note: Empty loop with logical size 10
      - type: console
        command: sleep 1
        note: Cooldown after size 10
      - type: console
        command: python /opt/bench/benchmark.py --mode empty-loop --metric loop_iterations --size 100 --min-runtime 1.0
        note: Empty loop with logical size 100
      - type: console
        command: sleep 1
        note: Cooldown after size 100
      - type: console
        command: python /opt/bench/benchmark.py --mode empty-loop --metric loop_iterations --size 1000 --min-runtime 1.0
        note: Empty loop with logical size 1000
      - type: console
        command: sleep 1
        note: Cooldown after size 1000
      - type: console
        command: python /opt/bench/benchmark.py --mode empty-loop --metric loop_iterations --size 10000 --min-runtime 1.0
        note: Empty loop with logical size 10000
