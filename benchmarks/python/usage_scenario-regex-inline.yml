---
name: Bottom Up Benchmark Python Regex - Inline (cache active)
author: arne@green-coding.io
description: >
  Pattern is passed as a string to re.match() on every iteration. Python's re
  module caches compiled patterns internally (up to 512 entries), so after the
  first call the same compiled pattern is reused from cache.

custom_metrics:
  regex_matches:
    unit: regex matches
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Inline regex (Python cache active)
    container: python
    commands:
      - type: console
        command: python -B scripts/regex_inline.py
