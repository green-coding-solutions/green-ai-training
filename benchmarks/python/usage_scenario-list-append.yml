---
name: Bottom Up Benchmark Python List - .append()
author: arne@green-coding.io
description: >
  Measure the energy cost of list.append().
  append() is O(1) amortized — it adds to the tail with no shifting,
  making it the natural choice for building a list incrementally.

custom_metrics:
  list_operations:
    unit: list operations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/list_append.py
