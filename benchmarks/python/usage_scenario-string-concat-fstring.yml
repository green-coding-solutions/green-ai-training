---
name: Bottom Up Benchmark Python String Concatenation - f-string
author: arne@green-coding.io
description: >
  Compare f-string concatenation with and without an explicit second reference.
  f-string interpolation always constructs a new string object and never benefits
  from CPython's in-place resize optimization, making both variants O(n²) total.
  The no_opt variant adds ref = result to confirm the second reference has no
  additional effect beyond what f-string already implies.

custom_metrics:
  string_concatenations:
    unit: string concatenations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: "f-string (standard)"
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/string_concat_fstring.py

  - name: Cooldown
    container: python
    hidden: true
    commands:
      - type: console
        command: sleep 5

  - name: "f-string (no_opt workload)"
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/string_concat_fstring_no_opt.py
