---
name: Bottom Up Benchmark Python Attribute Lookup - Cached Local
author: arne@green-coding.io
description: >
  math.sqrt is bound to a local name once before the loop with sqrt = math.sqrt.
  Each iteration calls sqrt(x) directly, skipping the __getattribute__ lookup
  on the math module that would otherwise happen on every call.

custom_metrics:
  iterations:
    unit: iterations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/attr_lookup_cached.py
