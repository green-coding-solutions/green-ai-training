---
name: Bottom Up Benchmark Python Conditionals - Match Statement
author: arne@green-coding.io
description: >
  Compare the energy cost of simple vs complex match/case dispatch in Python.
  Simple: 10M random integers 1-10 with literal equality checks.
  Complex: 10M random integers 1-1M with range and modulo guard checks.

custom_metrics:
  classifications:
    unit: classifications
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Simple match/case
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/match_statement_simple.py

  - name: Cooldown
    hidden: true
    container: python
    commands:
      - type: console
        command: sleep 5

  - name: Complex match/case
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/match_statement_complex.py
