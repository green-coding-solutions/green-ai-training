---
name: Bottom Up Benchmark Python PyTorch - Inference without no_grad()
author: arne@green-coding.io
description: >
  Forward passes through a 4-layer MLP on CPU without torch.no_grad().
  PyTorch builds a computation graph on every forward pass, incurring extra
  memory allocations and CPU overhead that are unnecessary during inference.
  Runs at 10k and 100k inferences to test linear energy scaling.

custom_metrics:
  inferences:
    unit: inferences
    sci: True

services:
  python:
    image: python:3.12-slim
    setup-commands:
      - command: pip install torch --index-url https://download.pytorch.org/whl/cpu

flow:
  - name: Benchmark 10k
    container: python
    commands:
      - type: console
        command: python -B scripts/pytorch_inference_without_no_grad.py

  - name: Cooldown
    hidden: true
    container: python
    commands:
      - type: console
        command: sleep 5

  - name: Benchmark 100k
    container: python
    commands:
      - type: console
        command: python -B scripts/pytorch_inference_without_no_grad_100k.py
