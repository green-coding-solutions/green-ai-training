---
name: Bottom Up Benchmark Python HTTP Requests - async (httpx)
author: arne@green-coding.io
description: >
  Measure the energy cost of making 10 HTTP requests to https://codetactics.de
  using httpx (asynchronous)

custom_metrics:
  http_requests:
    unit: http requests
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie
    setup-commands:
      - command: pip install httpx

flow:
  - name: HTTP requests async (httpx)
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/http_requests_async.py
