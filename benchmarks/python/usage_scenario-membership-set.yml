---
name: Bottom Up Benchmark Python Membership - Set
author: arne@green-coding.io
description: >
  Measure the energy cost of set membership testing in Python.
  Data arrives as a 10M-element list, is converted to a set (O(n) creation),
  then a single membership check is performed — O(1) hash lookup.
  Benchmarks the full realistic cost: list → set conversion + one lookup.

custom_metrics:
  elements_checked:
    unit: elements checked
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Set membership (O(1))
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/membership_set.py
