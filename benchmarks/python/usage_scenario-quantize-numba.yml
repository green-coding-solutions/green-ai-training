---
name: Bottom Up Benchmark Python Quantize - Numba (JIT compiled)
author: arne@green-coding.io
description: >
  1-bit sigma-delta quantization of 10M float64 samples using the same
  sequential error-feedback loop compiled to native code with Numba @njit.
  A warm-up call on 1 sample is made before timing to exclude JIT compilation.

custom_metrics:
  samples:
    unit: samples
    sci: True

services:
  python:
    image: python:3.12-slim
    setup-commands:
      - command: pip install numpy numba

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/quantize_numba.py
