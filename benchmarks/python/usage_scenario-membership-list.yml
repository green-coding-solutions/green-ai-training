---
name: Bottom Up Benchmark Python Membership - List
author: arne@green-coding.io
description: >
  Measure the energy cost of list membership testing in Python.
  A 10M-element list is built, then a single membership check is performed.
  The needle is absent, forcing a full O(n) linear scan of all 10M elements.

custom_metrics:
  elements_checked:
    unit: elements checked
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: List membership (O(n))
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/membership_list.py
