---
name: Bottom Up Benchmark Sort
author: OpenAI Codex
description: Measure sort cost for growing collections to capture n log n behavior.

custom_metrics:
  sorted_items:
    unit: sorted items
    sci: True

services:
  gcb-bottom-up-bench:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: Sort scaling
    container: gcb-bottom-up-bench
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode sort-items --metric sorted_items --size 100 --min-runtime 1.0
        note: Sorting 100 items
      - type: console
        command: sleep 1
        note: Cooldown after 100 items
      - type: console
        command: python /opt/bench/benchmark.py --mode sort-items --metric sorted_items --size 1000 --min-runtime 1.0
        note: Sorting 1000 items
      - type: console
        command: sleep 1
        note: Cooldown after 1000 items
      - type: console
        command: python /opt/bench/benchmark.py --mode sort-items --metric sorted_items --size 5000 --min-runtime 1.0
        note: Sorting 5000 items
      - type: console
        command: sleep 1
        note: Cooldown after 5000 items
      - type: console
        command: python /opt/bench/benchmark.py --mode sort-items --metric sorted_items --size 10000 --min-runtime 1.0
        note: Sorting 10000 items
