---
name: Bottom Up Benchmark Python Efficient Algorithm - Nested Loop
author: arne@green-coding.io
description: >
  Matches 20,000 payments to 20,000 invoices with a nested loop (O(n·m), up to 400 million comparisons). Copy of test-cases/python/efficient-algorithm/script.py.

custom_metrics:
  payments_matched:
    unit: payments matched
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/efficient_algorithm_nested.py
