---
name: Bottom Up Benchmark Python Regex - Precompile vs Inline vs Forced Recompile
author: arne@green-coding.io
description: >
  Compare the energy cost of three regex usage patterns.
  Python's re module caches compiled patterns internally (up to 512 entries),
  so inline re.match() calls with the same pattern reuse the cache after the
  first call. Only explicit re.purge() before each call forces true recompilation.

custom_metrics:
  regex_matches:
    unit: regex matches
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Pre-compiled regex
    container: python
    commands:
      - type: console
        command: python -B scripts/regex_precompiled.py

  - name: Cooldown 1
    container: python
    commands:
      - type: console
        command: sleep 5

  - name: Inline regex (Python cache active)
    container: python
    commands:
      - type: console
        command: python -B scripts/regex_inline.py

  - name: Cooldown 2
    container: python
    commands:
      - type: console
        command: sleep 5

  - name: Forced recompile (re.purge each iteration)
    container: python
    commands:
      - type: console
        command: python -B scripts/regex_recompile.py
