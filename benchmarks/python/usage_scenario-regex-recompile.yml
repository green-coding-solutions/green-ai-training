---
name: Bottom Up Benchmark Python Regex - Forced Recompile
author: arne@green-coding.io
description: >
  re.purge() is called before every re.match(), flushing the internal cache and
  forcing a full recompilation on each iteration. This is the worst-case pattern
  and represents the true cost of regex compilation.

custom_metrics:
  regex_matches:
    unit: regex matches
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/regex_recompile.py
