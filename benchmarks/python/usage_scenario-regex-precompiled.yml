---
name: Bottom Up Benchmark Python Regex - Precompiled
author: arne@green-coding.io
description: >
  Pattern is compiled once with re.compile() before the loop and reused on
  every iteration. No compilation overhead inside the loop.

custom_metrics:
  regex_matches:
    unit: regex matches
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/regex_precompiled.py
