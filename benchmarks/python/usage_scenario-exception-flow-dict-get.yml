---
name: Bottom Up Benchmark Python Exception Flow - dict.get()
author: arne@green-coding.io
description: >
  Uses the idiomatic dict.get(key) which returns None for missing keys without
  raising an exception. Avoids both exception machinery and an explicit membership
  test, delegating the miss handling to the C-level dict implementation.

custom_metrics:
  dict_lookups:
    unit: dict lookups
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: dict.get() (idiomatic Python)
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/dict_get.py
