---
name: Bottom Up Benchmark Python Attribute Lookup - Repeated
author: arne@green-coding.io
description: >
  math.sqrt() is called inside the loop as math.sqrt(x) on every iteration.
  Each call triggers a __getattribute__ lookup on the math module to resolve
  the function object before invoking it.

custom_metrics:
  iterations:
    unit: iterations
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Repeated attribute lookup
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/attr_lookup_repeated.py
