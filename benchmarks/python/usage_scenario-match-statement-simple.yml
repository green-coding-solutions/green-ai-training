---
name: Bottom Up Benchmark Python Conditionals - Simple Match Statement
author: arne@green-coding.io
description: >
  Compare the energy cost of Python conditional dispatch styles.
  This scenario classifies 10M random integers from 1 to 10 using a 10-branch
  match/case statement with literal equality checks.

custom_metrics:
  classifications:
    unit: classifications
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Classify with simple match/case
    container: python
    commands:
      - type: console
        shell: bash
        command: python -B scripts/match_statement_simple.py
