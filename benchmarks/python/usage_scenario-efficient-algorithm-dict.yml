---
name: Bottom Up Benchmark Python Efficient Algorithm - Set Index
author: arne@green-coding.io
description: >
  Same matching as the nested-loop variant, but the invoice numbers are indexed once in a set, so every payment is an O(1) lookup (O(n + m) total).

custom_metrics:
  payments_matched:
    unit: payments matched
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie

flow:
  - name: Benchmark
    container: python
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/python/scripts/efficient_algorithm_dict.py
