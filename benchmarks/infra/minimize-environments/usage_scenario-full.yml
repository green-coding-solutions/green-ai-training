---
name: Minimize Environments - Full Preview Environment
author: arne@green-coding.io
description: >
  Models one preview environment as the original workflow deploys it for every branch: 3 app replicas, Postgres, Redis and a polling worker (replicaCount=3, postgres/redis/worker enabled).
  The environment idles for 60 seconds, which is what most preview environments do most of the time.
  Energy per environment-minute times the hours an environment exists gives its footprint. An environment
  torn down on merge (or scaled to zero at night) costs nothing for the hours it doesn't exist.
  The app image is built from benchmarks/infra/container-image/Dockerfile.optimized.

custom_metrics:
  environment_minutes:
    unit: environment minutes
    sci: True

services:
  gcb-preview-app-1:
    image: gcb_preview_app
    build:
      context: ../../../test-cases/infra/container-image
      dockerfile: ../../../benchmarks/infra/container-image/Dockerfile.optimized

  gcb-preview-app-2:
    image: gcb_preview_app
    build:
      context: ../../../test-cases/infra/container-image
      dockerfile: ../../../benchmarks/infra/container-image/Dockerfile.optimized

  gcb-preview-app-3:
    image: gcb_preview_app
    build:
      context: ../../../test-cases/infra/container-image
      dockerfile: ../../../benchmarks/infra/container-image/Dockerfile.optimized

  gcb-preview-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      start_period: 10s
      start_interval: 1s

  gcb-preview-redis:
    image: redis:7-alpine

  gcb-preview-worker:
    image: redis:7-alpine
    command: ["sh", "-c", "while true; do redis-cli -h gcb-preview-redis RPOP jobs > /dev/null; sleep 1; done"]
    depends_on:
      - gcb-preview-redis

flow:
  - name: Idle 60 s
    container: gcb-preview-app-1
    commands:
      - type: console
        command: sleep 60
      - type: console
        command: echo $(date +%s%N) environment_minutes=1
        shell: bash
