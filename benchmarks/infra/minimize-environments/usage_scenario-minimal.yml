---
name: Minimize Environments - Minimal Preview Environment
author: arne@green-coding.io
description: >
  Models the minimized preview environment: 1 app replica and a seeded Postgres, no Redis, no worker.
  The environment idles for 60 seconds, which is what most preview environments do most of the time.
  Energy per environment-minute times the hours an environment exists gives its footprint. An environment
  torn down on merge (or scaled to zero at night) costs nothing for the hours it doesn't exist.
  The app image is built from benchmarks/infra/container-image/Dockerfile.optimized.

custom_metrics:
  environment_minutes:
    unit: environment minutes
    sci: True

services:
  gcb-preview-app-1:
    image: gcb_preview_app
    build:
      context: ../../../test-cases/infra/container-image
      dockerfile: ../../../benchmarks/infra/container-image/Dockerfile.optimized

  gcb-preview-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      start_period: 10s
      start_interval: 1s

flow:
  - name: Idle 60 s
    container: gcb-preview-app-1
    commands:
      - type: console
        command: sleep 60
      - type: console
        command: echo $(date +%s%N) environment_minutes=1
        shell: sh
