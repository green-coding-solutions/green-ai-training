---
name: PostgreSQL SELECT column-count Benchmark
author: arne@green-coding.io
description: >
  Measures the marginal energy cost of fetching additional columns from
  PostgreSQL by stepping through 1 → 2 → 4 → 8 → MAX (SELECT *) projected
  columns on the 52-column products table.

  Columns are selected in table-definition order so each tier adds exactly
  the next columns as they sit on disk. The first 8 columns are all compact
  types (BIGSERIAL, VARCHAR(20/200), NUMERIC). The jump to MAX (SELECT *)
  includes the wide TEXT columns — description (~300 chars), specifications
  (~280 chars), three localised descriptions (~220 chars each), and multiple
  JSON blobs — inflating each row from ~50 bytes to ~1.5 KB of payload.

  All steps use the same row count (%(size)s) and repetitions so that the
  only variable is the number of columns PostgreSQL serialises and the client
  deserialises per query.

custom_metrics:
  queries_executed:
    unit: queries
    sci: True

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       benchmark_db
      POSTGRES_USER:     bench
      POSTGRES_PASSWORD: bench123
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U bench -d benchmark_db -c 'SELECT 1 FROM products LIMIT 1' > /dev/null 2>&1"]
      interval:     10s
      timeout:       5s
      retries:       30
      start_period: 120s

  benchmark:
    image: python:3.12-slim
    volumes:
      - ./benchmark.py:/opt/bench/benchmark.py:ro
      - ./requirements.txt:/opt/bench/requirements.txt:ro
    environment:
      PG_HOST:     postgres
      PG_PORT:     "5432"
      PG_DB:       benchmark_db
      PG_USER:     bench
      PG_PASSWORD: bench123
    depends_on:
      postgres:
        condition: service_healthy

flow:

  - name: Install Python dependencies
    container: benchmark
    hidden: true
    commands:
      - type: console
        command: pip install -r /opt/bench/requirements.txt -q
        note: Install psycopg[binary]

  # ── 1 column ──────────────────────────────────────────────────────────────

  - name: SELECT 1 col
    container: benchmark
    commands:
      - type: console
        command: python -B /opt/bench/benchmark.py --mode select-1col-products --size 2500 --repetitions 1000
        note: SELECT id FROM products LIMIT 2500, 1000 repetitions

  - name: Cooldown 1
    container: benchmark
    hidden: true
    commands:
      - type: console
        command: sleep 10
        note: Cooldown between steps

  # ── 2 columns ─────────────────────────────────────────────────────────────

  - name: SELECT 2 cols
    container: benchmark
    commands:
      - type: console
        command: python -B /opt/bench/benchmark.py --mode select-2col-products --size 2500 --repetitions 1000
        note: SELECT id, sku FROM products LIMIT 2500, 1000 repetitions

  - name: Cooldown 2
    container: benchmark
    hidden: true
    commands:
      - type: console
        command: sleep 10
        note: Cooldown between steps

  # ── 4 columns ─────────────────────────────────────────────────────────────

  - name: SELECT 4 cols
    container: benchmark
    commands:
      - type: console
        command: python -B /opt/bench/benchmark.py --mode select-4col-products --size 2500 --repetitions 1000
        note: SELECT id, sku, name, price FROM products LIMIT 2500, 1000 repetitions

  - name: Cooldown 3
    container: benchmark
    hidden: true
    commands:
      - type: console
        command: sleep 10
        note: Cooldown between steps

  # ── 8 columns ─────────────────────────────────────────────────────────────

  - name: SELECT 8 cols
    container: benchmark
    commands:
      - type: console
        command: python -B /opt/bench/benchmark.py --mode select-8col-products --size 2500 --repetitions 1000
        note: SELECT id,sku,name,price,compare_at_price,cost_price,category,subcategory FROM products LIMIT 2500, 1000 repetitions

  - name: Cooldown 4
    container: benchmark
    hidden: true
    commands:
      - type: console
        command: sleep 10
        note: Cooldown between steps

  # ── MAX columns (SELECT *) ─────────────────────────────────────────────────

  - name: SELECT MAX cols
    container: benchmark
    commands:
      - type: console
        command: python -B /opt/bench/benchmark.py --mode select-star-products --size 2500 --repetitions 1000
        note: SELECT * FROM products LIMIT 2500, 1000 repetitions
