---
name: Lazy Images - Lazy Below the Fold
author: arne@green-coding.io
description: >
  Same article with loading="lazy" on all images below the fold, an eager hero image with fetchpriority="high" and explicit width/height.
  Step 1 models visitors who don't scroll, step 2 visitors who read to the end. Every load uses a fresh browser
  context (cold cache). Compare usage_scenario-eager.yml and usage_scenario-lazy.yml per step.

custom_metrics:
  page_loads:
    unit: page loads
    sci: True

compose-file: !include-gmt-helper gmt-playwright-headful.yml

services:
  gcb-lazy-images-nginx:
    image: nginx:alpine
    folder-destination: /usr/share/nginx/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/benchmarks/web/lazy-images/index-lazy.html"]
      start_period: 5s
      start_interval: 1s

  gmt-playwright-nodejs:
    depends_on:
      gcb-lazy-images-nginx:
        condition: service_healthy

flow:
  - name: Load without scrolling 20x
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-lazy-images-nginx/benchmarks/web/lazy-images/index-lazy.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-lazy-images-nginx/benchmarks/web/lazy-images/index-lazy.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: console
        command: echo $(date +%s%N) page_loads=20
        shell: sh
  - name: Load and scroll to the end 10x
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: |
          for (let i = 0; i < 5; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-lazy-images-nginx/benchmarks/web/lazy-images/index-lazy.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
            for (let y = 0; y < 30; y++) {
              await page.mouse.wheel(0, 400);
              await page.waitForTimeout(80);
            }
            await page.waitForLoadState("networkidle");
          }
      - type: playwright
        command: |
          for (let i = 0; i < 5; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-lazy-images-nginx/benchmarks/web/lazy-images/index-lazy.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
            for (let y = 0; y < 30; y++) {
              await page.mouse.wheel(0, 400);
              await page.waitForTimeout(80);
            }
            await page.waitForLoadState("networkidle");
          }
      - type: console
        command: echo $(date +%s%N) page_loads=10
        shell: sh

  - name: Close
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: end
