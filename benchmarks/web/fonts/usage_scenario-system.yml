---
name: Web Fonts - System Font Stack
author: arne@green-coding.io
description: >
  Same page with a system font stack. No font file is downloaded.
  Each load uses a fresh browser context (cold cache), like a first-time visitor.
  Compare usage_scenario-ttf.yml, usage_scenario-woff2.yml and usage_scenario-system.yml by page_loads per joule.

custom_metrics:
  page_loads:
    unit: page loads
    sci: True

compose-file: !include-gmt-helper gmt-playwright-headful.yml

services:
  gcb-fonts-nginx:
    image: nginx:alpine
    folder-destination: /usr/share/nginx/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/benchmarks/web/fonts/index-system.html"]
      start_period: 5s
      start_interval: 1s

  gmt-playwright-nodejs:
    depends_on:
      gcb-fonts-nginx:
        condition: service_healthy

flow:
  - name: Load page 30x (cold cache)
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-fonts-nginx/benchmarks/web/fonts/index-system.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-fonts-nginx/benchmarks/web/fonts/index-system.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-fonts-nginx/benchmarks/web/fonts/index-system.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: console
        command: echo $(date +%s%N) page_loads=30
        shell: bash

  - name: Close
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: end
