# Optimized variant of test-cases/web/text-compression/nginx.conf (gzip on the fly + precompressed static assets)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # text compression for dynamic responses: moderate level, text types only, skip tiny responses
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # serve the .gz files precompressed once at build time (gzip -9) instead of compressing per request
    gzip_static on;

    server {
        listen 80;
        server_name shop.example.com;

        root /var/www/shop/dist;
        index index.html;

        # static frontend: JS bundles, CSS, SVG icons, fonts, product images
        location / {
            try_files $uri $uri/ /index.html;
        }

        # JSON API
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
