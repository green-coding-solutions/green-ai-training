---
name: Text Compression - No Compression
author: arne@green-coding.io
description: >
  nginx with test-cases/web/text-compression/nginx.conf as is: no text compression.
  A Python client fetches index.html (48 KB), app.js (140 KB), style.css (20 KB) and data/products.json (296 KB)
  500 times each over one keep-alive connection, sends Accept-Encoding: gzip and decompresses like a browser.
  Note: client and server share a local Docker network, where transfer is nearly free. The benchmark therefore
  shows the CPU side of compression. Use the transferred_kb metric with a network energy model for the transfer side.

custom_metrics:
  http_requests:
    unit: HTTP requests
    sci: True
  transferred_kb:
    unit: KB transferred

services:
  gcb-shop-nginx:
    image: nginx:alpine
    volumes:
      - ../../../test-cases/web/text-compression/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./site:/var/www/shop/dist:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.html"]
      start_period: 5s
      start_interval: 1s

  gcb-shop-client:
    image: python:3.13-slim
    depends_on:
      gcb-shop-nginx:
        condition: service_healthy

flow:
  - name: Fetch 2000 assets
    container: gcb-shop-client
    commands:
      - type: console
        command: python -B /tmp/repo/benchmarks/web/text-compression/fetch-assets.py --host gcb-shop-nginx --rounds 500
