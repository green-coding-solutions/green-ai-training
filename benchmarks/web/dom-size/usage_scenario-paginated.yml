---
name: DOM Size - Paginated Table
author: arne@green-coding.io
description: >
  Same 10,000 entries in memory, but only one page of 100 rows is rendered, as a table with one element per cell, built in a DocumentFragment.
  Compare usage_scenario-full.yml and usage_scenario-paginated.yml by page_loads per joule.

custom_metrics:
  page_loads:
    unit: page loads
    sci: True

compose-file: !include-gmt-helper gmt-playwright-headful.yml

services:
  gcb-dom-size-nginx:
    image: nginx:alpine
    folder-destination: /usr/share/nginx/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/benchmarks/web/dom-size/index-paginated.html"]
      start_period: 5s
      start_interval: 1s

  gmt-playwright-nodejs:
    depends_on:
      gcb-dom-size-nginx:
        condition: service_healthy

flow:
  - name: Load page 30x
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-dom-size-nginx/benchmarks/web/dom-size/index-paginated.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-dom-size-nginx/benchmarks/web/dom-size/index-paginated.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-dom-size-nginx/benchmarks/web/dom-size/index-paginated.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: console
        command: echo $(date +%s%N) page_loads=30
        shell: bash

  - name: Close
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: end
