<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audit Log</title>
  <!-- Optimized variant of test-cases/web/dom-size/index.html: same 10,000 entries in memory,
       but only one page of 100 rows in the DOM, one element per cell, built off-DOM -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    td { border-bottom: 1px solid #ddd; padding: 0.25rem 0.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Audit Log</h1>
  <table><tbody id="log"></tbody></table>
  <p>
    <button id="prev">Previous</button>
    <span id="page-info"></span>
    <button id="next">Next</button>
  </p>

  <script>
    const ACTIONS = ["login", "logout", "update_profile", "export_report", "delete_item"];
    const PAGE_SIZE = 100;
    const entries = [];
    for (let i = 0; i < 10000; i++) {
      entries.push({
        id: i + 1,
        user: "user" + (i % 250),
        action: ACTIONS[i % ACTIONS.length],
        ts: new Date(Date.UTC(2026, 9, 1, 0, 0, i)).toISOString(),
      });
    }

    const log = document.getElementById("log");
    const pageInfo = document.getElementById("page-info");
    const pages = Math.ceil(entries.length / PAGE_SIZE);
    let currentPage = 0;

    function renderPage() {
      const fragment = document.createDocumentFragment();
      for (const e of entries.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE)) {
        const tr = document.createElement("tr");
        for (const value of [e.id, e.ts, e.user, e.action]) {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        }
        fragment.appendChild(tr);
      }
      log.replaceChildren(fragment);
      pageInfo.textContent = `Page ${currentPage + 1} of ${pages}`;
    }

    document.getElementById("prev").addEventListener("click", () => { if (currentPage > 0) { currentPage--; renderPage(); } });
    document.getElementById("next").addEventListener("click", () => { if (currentPage < pages - 1) { currentPage++; renderPage(); } });
    renderPage();
  </script>
</body>
</html>
