---
name: Unused CSS - Full Stylesheet
author: arne@green-coding.io
description: >
  Loads test-cases/web/unused-css/index.html as is, with the 16 KB stylesheet of which only the layout block is used.
  Every load uses a fresh browser context (cold cache). The absolute byte difference is small, so the difference
  may be within measurement noise on a local network. Compare by page_loads per joule.

custom_metrics:
  page_loads:
    unit: page loads
    sci: True

compose-file: !include-gmt-helper gmt-playwright-headful.yml

services:
  gcb-unused-css-nginx:
    image: nginx:alpine
    folder-destination: /usr/share/nginx/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/test-cases/web/unused-css/index.html"]
      start_period: 5s
      start_interval: 1s

  gmt-playwright-nodejs:
    depends_on:
      gcb-unused-css-nginx:
        condition: service_healthy

flow:
  - name: Load page 50x (cold cache)
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-unused-css-nginx/test-cases/web/unused-css/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-unused-css-nginx/test-cases/web/unused-css/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-unused-css-nginx/test-cases/web/unused-css/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-unused-css-nginx/test-cases/web/unused-css/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-unused-css-nginx/test-cases/web/unused-css/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: console
        command: echo $(date +%s%N) page_loads=50
        shell: bash

  - name: Close
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: end
