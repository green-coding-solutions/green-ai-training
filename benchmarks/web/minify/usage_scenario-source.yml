---
name: Minify Assets - Unminified Sources
author: arne@green-coding.io
description: >
  Loads the booking widget from test-cases/web/minify/src as the original cp-based build ships it: commented, unminified JS and CSS with debug console calls.
  Every load uses a fresh browser context (cold cache). The absolute byte difference is small (a few KB), so the
  difference may be within measurement noise on a local network. Compare by page_loads per joule.

custom_metrics:
  page_loads:
    unit: page loads
    sci: True

compose-file: !include-gmt-helper gmt-playwright-headful.yml

services:
  gcb-minify-nginx:
    image: nginx:alpine
    folder-destination: /usr/share/nginx/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/test-cases/web/minify/src/index.html"]
      start_period: 5s
      start_interval: 1s

  gmt-playwright-nodejs:
    depends_on:
      gcb-minify-nginx:
        condition: service_healthy

flow:
  - name: Load page 50x (cold cache)
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-minify-nginx/test-cases/web/minify/src/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-minify-nginx/test-cases/web/minify/src/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-minify-nginx/test-cases/web/minify/src/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-minify-nginx/test-cases/web/minify/src/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: playwright
        command: |
          for (let i = 0; i < 10; i++) {
            await gmtPlaywrightResetContext();
            const response = await page.goto("http://gcb-minify-nginx/test-cases/web/minify/src/index.html", { waitUntil: "networkidle" });
            if (!response.ok()) throw `Page not accessible. HTTP ${response.status()}`;
          }
      - type: console
        command: echo $(date +%s%N) page_loads=50
        shell: bash

  - name: Close
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: playwright
        command: end
