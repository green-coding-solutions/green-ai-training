<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Animation Benchmark</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    .box {
      position: absolute;
      width: 40px;
      height: 40px;
      will-change: transform;
      animation: slide 1s linear infinite alternate;
    }
    @keyframes slide {
      from { transform: translateX(0px); }
      to   { transform: translateX(300px); }
    }
  </style>
</head>
<body>
  <script>
    for (let i = 0; i < 100; i++) {
      const box = document.createElement('div');
      box.className = 'box';
      box.style.top = (i * 6) + 'px';
      box.style.background = `hsl(${(i * 37) % 360}, 70%, 55%)`;
      document.body.appendChild(box);
    }
    window.frameCount = 0;
    function tick() { window.frameCount++; requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
