---
name: Image Format Encoding Cost
author: Arne Tarara <arne@green-coding.io>
description: >
  Measures energy cost of encoding a lossless BMP source image (p1.bmp) into each
  format (avif, gif, jpg, png, webp) using ImageMagick, repeated 50 times per format.
  BMP is used as the source because it is uncompressed, ensuring no prior compression
  artifacts influence the encoding workload.

custom_metrics:
  image_encodings:
    unit: Image Encodings
    sci: True

services:
  gcb-image-formats-encoder:
    image: dpokidov/imagemagick:latest
    entrypoint: ['tail', '-f', '/dev/null']

flow:

  - name: Encode BMP to AVIF
    container: gcb-image-formats-encoder
    commands:
      - type: console
        # format:/dev/null discards output bytes while still running the full encoder;
        # the prefix is required because /dev/null has no extension for ImageMagick to infer the format from
        command: for i in $(seq 1 50); do magick /tmp/repo/benchmarks/image-formats/files/p1.bmp avif:/dev/null; done
        shell: sh
      - type: console
        command: echo $(date +%s%N) image_encodings=50
        shell: sh

  - name: Encode BMP to GIF
    container: gcb-image-formats-encoder
    commands:
      - type: console
        # format:/dev/null discards output bytes while still running the full encoder;
        # the prefix is required because /dev/null has no extension for ImageMagick to infer the format from
        command: for i in $(seq 1 50); do magick /tmp/repo/benchmarks/image-formats/files/p1.bmp gif:/dev/null; done
        shell: sh
      - type: console
        command: echo $(date +%s%N) image_encodings=50
        shell: sh

  - name: Encode BMP to JPG
    container: gcb-image-formats-encoder
    commands:
      - type: console
        # format:/dev/null discards output bytes while still running the full encoder;
        # the prefix is required because /dev/null has no extension for ImageMagick to infer the format from
        command: for i in $(seq 1 50); do magick /tmp/repo/benchmarks/image-formats/files/p1.bmp jpg:/dev/null; done
        shell: sh
      - type: console
        command: echo $(date +%s%N) image_encodings=50
        shell: sh

  - name: Encode BMP to PNG
    container: gcb-image-formats-encoder
    commands:
      - type: console
        # format:/dev/null discards output bytes while still running the full encoder;
        # the prefix is required because /dev/null has no extension for ImageMagick to infer the format from
        command: for i in $(seq 1 50); do magick /tmp/repo/benchmarks/image-formats/files/p1.bmp png:/dev/null; done
        shell: sh
      - type: console
        command: echo $(date +%s%N) image_encodings=50
        shell: sh

  - name: Encode BMP to WebP
    container: gcb-image-formats-encoder
    commands:
      - type: console
        # format:/dev/null discards output bytes while still running the full encoder;
        # the prefix is required because /dev/null has no extension for ImageMagick to infer the format from
        command: for i in $(seq 1 50); do magick /tmp/repo/benchmarks/image-formats/files/p1.bmp webp:/dev/null; done
        shell: sh
      - type: console
        command: echo $(date +%s%N) image_encodings=50
        shell: sh
