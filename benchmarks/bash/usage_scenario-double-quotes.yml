---
name: Bottom Up Benchmark Bash Double Quote Search
author: Green Coding Solutions
description: >
  Measure the energy cost of bash string searching with double-quoted inline
  patterns. The subject string is 6200 characters; the pattern is a 62-character
  literal absent from the subject and containing no $ ` \ ! characters, so no
  substitution occurs. bash still scans every character of the pattern for
  special characters before the glob match runs.

custom_metrics:
  search_iterations:
    unit: search iterations
    sci: True

services:
  gcb-bash-bench:
    image: ubuntu:24.04
    cpus: 1
    mem_limit: "512MB"
    folder-destination: /opt


flow:
  - name: 10k
    container: gcb-bash-bench
    commands:
      - type: console
        command: bash /opt/benchmarks/bash/benchmark.sh --mode double --size 10000

  - name: Cooldown
    container: gcb-bash-bench
    hidden: true
    commands:
      - type: console
        command: sleep 5

  - name: 100k
    container: gcb-bash-bench
    commands:
      - type: console
        command: bash /opt/benchmarks/bash/benchmark.sh --mode double --size 100000

  - name: Cooldown 2
    container: gcb-bash-bench
    hidden: true
    commands:
      - type: console
        command: sleep 5

  - name: 1M
    container: gcb-bash-bench
    commands:
      - type: console
        command: bash /opt/benchmarks/bash/benchmark.sh --mode double --size 1000000
