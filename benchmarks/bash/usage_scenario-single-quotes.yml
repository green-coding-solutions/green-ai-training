---
name: Bottom Up Benchmark Bash Single Quote Search
author: Green Coding Solutions
description: >
  Measure the energy cost of bash string searching with Single-quoted inline
  patterns. The subject string is 6200 characters; the pattern is a 62-character
  literal absent from the subject. bash extracts Single-quoted content by
  scanning only for the closing apostrophe.

custom_metrics:
  search_iterations:
    unit: search iterations
    sci: True

services:
  gcb-bash-bench:
    image: ubuntu:24.04
    cpus: 1
    mem_limit: "512MB"
    folder-destination: /opt/bench

flow:
  - name: Single-quote search 10k
    container: gcb-bash-bench
    commands:
      - type: console
        command: bash /opt/benchmarks/bash/benchmark.sh --mode single --size 10000
        note: Single-quoted pattern, 10k iterations

  - name: Cooldown
    container: gcb-bash-bench
    hidden: true
    commands:
      - type: console
        command: sleep 5

  - name: Single-quote search 100k
    container: gcb-bash-bench
    commands:
      - type: console
        command: bash /opt/benchmarks/bash/benchmark.sh --mode single --size 100000
        note: Single-quoted pattern, 100k iterations

  - name: Cooldown 2
    container: gcb-bash-bench
    hidden: true
    commands:
      - type: console
        command: sleep 5


  - name: Single-quote search 1M
    container: gcb-bash-bench
    commands:
      - type: console
        command: bash /opt/benchmarks/bash/benchmark.sh --mode single --size 1000000
        note: Single-quoted pattern, 100M iterations