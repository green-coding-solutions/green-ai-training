---
name: Bottom Up Benchmark Bash Log Summary - Single awk Pass
author: arne@green-coding.io
description: >
  Summarizes the static 20,000-line nginx access log log.txt (requests per status class and total bytes).
  Same summary computed by a single awk process over the whole file.
  Compare usage_scenario-subprocess.yml, usage_scenario-builtins.yml and usage_scenario-awk.yml
  by log_lines processed per joule.

custom_metrics:
  log_lines:
    unit: log lines processed
    sci: True

services:
  gcb-bash-bench:
    image: ubuntu:24.04
    cpus: 1
    mem_limit: "512MB"
    folder-destination: /opt

flow:
  - name: Summarize 20k lines
    container: gcb-bash-bench
    commands:
      - type: console
        command: bash /opt/benchmarks/bash/builtins/script-awk.sh /opt/benchmarks/bash/builtins/log.txt
      - type: console
        command: echo $(date +%s%N) log_lines=20000
        shell: bash
