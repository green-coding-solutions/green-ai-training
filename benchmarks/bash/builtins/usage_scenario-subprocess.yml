---
name: Bottom Up Benchmark Bash Log Summary - Subprocess per Field
author: arne@green-coding.io
description: >
  Summarizes the static 20,000-line nginx access log log.txt (requests per status class and total bytes).
  Copy of test-cases/bash/builtins/script.sh. Every log line runs three $(echo | cut) substitutions and up to two $(expr) calls, about 10 processes per line.
  Compare usage_scenario-subprocess.yml, usage_scenario-builtins.yml and usage_scenario-awk.yml
  by log_lines processed per joule.

custom_metrics:
  log_lines:
    unit: log lines processed
    sci: True

services:
  gcb-bash-bench:
    image: ubuntu:24.04
    cpus: 1
    mem_limit: "512MB"
    folder-destination: /opt

flow:
  - name: Summarize 20k lines
    container: gcb-bash-bench
    commands:
      - type: console
        command: bash /opt/benchmarks/bash/builtins/script-subprocess.sh /opt/benchmarks/bash/builtins/log.txt
      - type: console
        command: echo $(date +%s%N) log_lines=20000
        shell: bash
