---
name: Bottom Up Benchmark JSON Roundtrip
author: OpenAI Codex
description: Measure combined JSON parsing and serialization cost for growing payloads.

custom_metrics:
  json_bytes_processed:
    unit: json bytes processed
    sci: True

services:
  gcb-bottom-up-bench:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: JSON roundtrip scaling
    container: gcb-bottom-up-bench
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode json-roundtrip --metric json_bytes_processed --size 1 --min-runtime 1.0
        note: JSON roundtrip with 1 record
      - type: console
        command: sleep 1
        note: Cooldown after 1 record
      - type: console
        command: python /opt/bench/benchmark.py --mode json-roundtrip --metric json_bytes_processed --size 10 --min-runtime 1.0
        note: JSON roundtrip with 10 records
      - type: console
        command: sleep 1
        note: Cooldown after 10 records
      - type: console
        command: python /opt/bench/benchmark.py --mode json-roundtrip --metric json_bytes_processed --size 100 --min-runtime 1.0
        note: JSON roundtrip with 100 records
      - type: console
        command: sleep 1
        note: Cooldown after 100 records
      - type: console
        command: python /opt/bench/benchmark.py --mode json-roundtrip --metric json_bytes_processed --size 1000 --min-runtime 1.0
        note: JSON roundtrip with 1000 records
