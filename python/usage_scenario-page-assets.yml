---
name: Bottom Up Benchmark Page Assets
author: OpenAI Codex
description: Measure local page and image asset transfer cost for increasing image counts.

custom_metrics:
  asset_bytes_transferred:
    unit: asset bytes transferred
    sci: True

services:
  gcb-bottom-up-asset-server:
    image: gcb_bottom_up_benchmarks
    build: .
    command: python /opt/bench/benchmark_server.py
  gcb-bottom-up-asset-client:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: Page asset scaling
    container: gcb-bottom-up-asset-client
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode wait-http --server-url http://gcb-bottom-up-asset-server:8000/health --timeout-seconds 20
        note: Wait for local asset server
      - type: console
        command: python /opt/bench/benchmark.py --mode page-assets --metric asset_bytes_transferred --size 1 --image-bytes 16384 --min-runtime 1.0 --server-url http://gcb-bottom-up-asset-server:8000
        note: Page with 1 image of 16 KiB
      - type: console
        command: sleep 1
        note: Cooldown after 1 image
      - type: console
        command: python /opt/bench/benchmark.py --mode page-assets --metric asset_bytes_transferred --size 5 --image-bytes 16384 --min-runtime 1.0 --server-url http://gcb-bottom-up-asset-server:8000
        note: Page with 5 images of 16 KiB
      - type: console
        command: sleep 1
        note: Cooldown after 5 images
      - type: console
        command: python /opt/bench/benchmark.py --mode page-assets --metric asset_bytes_transferred --size 20 --image-bytes 16384 --min-runtime 1.0 --server-url http://gcb-bottom-up-asset-server:8000
        note: Page with 20 images of 16 KiB
