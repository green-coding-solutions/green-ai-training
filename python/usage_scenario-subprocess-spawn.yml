---
name: Bottom Up Benchmark Subprocess Spawn
author: OpenAI Codex
description: Measure the cost of spawning and waiting for simple subprocess calls.

custom_metrics:
  subprocess_calls:
    unit: subprocess calls
    sci: True

services:
  gcb-bottom-up-bench:
    image: gcb_bottom_up_benchmarks
    build: .

flow:
  - name: Subprocess spawn scaling
    container: gcb-bottom-up-bench
    commands:
      - type: console
        command: python /opt/bench/benchmark.py --mode subprocess-spawn --metric subprocess_calls --size 1 --min-runtime 1.0
        note: Subprocess batch size 1
      - type: console
        command: sleep 1
        note: Cooldown after batch size 1
      - type: console
        command: python /opt/bench/benchmark.py --mode subprocess-spawn --metric subprocess_calls --size 5 --min-runtime 1.0
        note: Subprocess batch size 5
      - type: console
        command: sleep 1
        note: Cooldown after batch size 5
      - type: console
        command: python /opt/bench/benchmark.py --mode subprocess-spawn --metric subprocess_calls --size 10 --min-runtime 1.0
        note: Subprocess batch size 10
      - type: console
        command: sleep 1
        note: Cooldown after batch size 10
      - type: console
        command: python /opt/bench/benchmark.py --mode subprocess-spawn --metric subprocess_calls --size 20 --min-runtime 1.0
        note: Subprocess batch size 20
