---
name: Bottom Up Benchmark Comparison Or-Chain
author: arne@green-coding.io
description: >
  Measure the energy cost of a 5-way equality or-chain
  (value == 1 or value == 2 or value == 3 or value == 4 or value == 5)
  at different inner loop sizes, 1000 repetitions each.

custom_metrics:
  comparison_checks:
    unit: comparison checks
    sci: True

services:
  python:
    image: python:3.15.0b1-slim-trixie
    volumes:
      - ./benchmark.py:/opt/bench/benchmark.py:ro

flow:
  - name: Or-chain comparison 100
    container: python
    commands:
      - type: console
        command: python -B /opt/bench/benchmark.py --mode comparison-or-chain --metric comparison_checks --size 100 --repetitions 1000
        note: Or-chain, size 100, 1000 repetitions

  - name: Cooldown
    container: python
    hidden: true
    commands:
      - type: console
        command: sleep 5
        note: Cooldown

  - name: Or-chain comparison 1000
    container: python
    commands:
      - type: console
        command: python -B /opt/bench/benchmark.py --mode comparison-or-chain --metric comparison_checks --size 1000 --repetitions 1000
        note: Or-chain, size 1000, 1000 repetitions
      - type: console
        command: sleep 1
        note: Cooldown

  - name: Cooldown 2
    container: python
    hidden: true
    commands:
      - type: console
        command: sleep 5
        note: Cooldown


  - name: Or-chain comparison 10000
    container: python
    commands:
      - type: console
        command: python -B /opt/bench/benchmark.py --mode comparison-or-chain --metric comparison_checks --size 10000 --repetitions 1000
        note: Or-chain, size 10000, 1000 repetitions