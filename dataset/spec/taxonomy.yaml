# Taxonomy used by generate.py (job matrix) and verify.py (allowed ids, URL whitelist).
#
# kind: gsf   -> pattern from the GSF catalog, url is the only GSF link the model may cite
# kind: code  -> code-level pattern (mostly from ../../test-cases and ../../benchmarks), no GSF page

categories:
  # weight = target share of the final dataset
  generation:   {weight: 0.33, description: "User asks to write code. No mention of green/energy. Answer is green by default + Green Notes."}
  review:       {weight: 0.22, description: "User pastes code and asks for a review/feedback. Severity-ranked findings incl. bugs."}
  refactor:     {weight: 0.15, description: "User pastes code and asks to optimize/refactor/clean up. Rewritten code + Green Notes."}
  no-change:    {weight: 0.08, description: "Code is already efficient, or the pattern does not apply in this context. Say so, don't invent."}
  general:      {weight: 0.10, description: "Coding/tech questions without an efficiency angle. Normal answer, no Green Notes, no lecture."}
  conceptual:   {weight: 0.06, description: "Questions about green software, trade-offs, when patterns apply. Short and conditional."}
  estimate:     {weight: 0.03, description: "User asks how much energy/carbon a change saves. Directional answer, cite measured facts only, explain how to measure."}
  multi-turn:   {weight: 0.03, description: "Follow-ups and pushback (readability, deadlines, 'just do X'). Model adapts without nagging."}

languages: [python, javascript, typescript, sql, bash, html, css, go, java, rust, dockerfile, yaml]

domains:
  - web backend / REST API
  - frontend / landing page
  - data pipeline / ETL
  - CLI tool / script
  - machine learning inference
  - CI/CD and infrastructure
  - log processing
  - IoT / embedded gateway
  - e-commerce
  - scientific computing

user_styles:
  - terse one-liner ("fix this")
  - detailed request with requirements
  - beginner, unsure what is wrong
  - senior dev, wants only the diff
  - pastes code without any text except "?"
  - non-native English with small typos

patterns:
  # ---------- code-level (Python) ----------
  - {id: string-join, kind: code, name: "Join strings instead of += in loops", languages: [python, java, go], facts: [F-STRCAT], caveat: "not in JavaScript: V8 optimizes += with ropes"}
  - {id: set-membership, kind: code, name: "Set/dict for repeated membership tests", languages: [python, javascript, java, go], facts: [F-MEMB], caveat: "only with repeated lookups"}
  - {id: deque-or-append, kind: code, name: "Avoid list.insert(0) / front insertion", languages: [python, javascript, java], facts: [F-LISTINS]}
  - {id: memoize, kind: code, name: "Memoize repeated pure computations", languages: [python, javascript, java, go], facts: [F-LRU], caveat: "only with repeated inputs; bounded cache size"}
  - {id: regex-precompile, kind: code, name: "Compile regex once, outside loops", languages: [python, javascript, java, go], facts: [F-REGEX], caveat: "small win in Python thanks to re cache; big win for dynamic patterns"}
  - {id: hoist-invariants, kind: code, name: "Hoist loop-invariant work (attribute lookups, len(), constant expressions)", languages: [python, javascript, java, go], facts: [F-ATTR]}
  - {id: simple-conditions, kind: code, name: "Simple equality dispatch / dict lookup instead of complex guard chains", languages: [python, javascript], facts: [F-COND]}
  - {id: avoid-exception-flow, kind: code, name: "No exceptions for expected control flow (dict.get, in)", languages: [python, java], facts: [F-EXC]}
  - {id: keep-star-imports, kind: code, name: "Anti-pattern: changing star imports. Leave them unchanged, report no measurable energy difference", languages: [python], facts: [F-IMPORT], caveat: "never convert from x import * to import x / explicit names"}
  - {id: torch-no-grad, kind: code, name: "torch.inference_mode()/no_grad() for inference", languages: [python], facts: [F-NOGRAD]}
  - {id: vectorize-or-jit, kind: code, name: "Vectorize (NumPy/pandas) or JIT hot numeric loops", languages: [python], facts: [F-NUMBA]}
  - {id: builtin-functions, kind: code, name: "Use built-ins / standard library (sum, any, Counter, sort key) over hand-written loops", languages: [python, javascript]}
  - {id: efficient-algorithm, kind: code, name: "Better algorithm / data structure (avoid O(n^2), use index/heap/bisect)", languages: [python, javascript, java, go, rust]}

  # ---------- code-level (I/O, data, network) ----------
  - {id: async-concurrent-io, kind: gsf, name: "Use async network calls", url: "https://patterns.greensoftware.foundation/development/use-async-instead-of-sync", languages: [python, javascript, typescript, go, java], facts: [F-HTTP]}
  - {id: batch-db-writes, kind: code, name: "Batch database writes (executemany, COPY, bulk insert)", languages: [python, java, go, javascript, sql], facts: [F-PG-INSERT], caveat: "pays off with many rows per batch; small batches differ little"}
  - {id: select-columns, kind: gsf, name: "Reduce transmitted data (select columns, pagination, field selection)", url: "https://patterns.greensoftware.foundation/development/data-handling/reduce-transmitted-data", languages: [sql, python, javascript, typescript, java, go], facts: [F-PG-SELECT, F-PG-COLUMNS]}
  - {id: compress-transmitted, kind: gsf, name: "Compress transmitted data", url: "https://patterns.greensoftware.foundation/development/data-handling/compress-transmitted-data", languages: [python, javascript, go, yaml], facts: [F-COMPRESS, F-COMPRESS-CODECS], caveat: "cheap codec for dynamic responses"}
  - {id: compress-stored, kind: gsf, name: "Compress stored data", url: "https://patterns.greensoftware.foundation/development/data-handling/compress-stored-data", languages: [python, bash, sql], facts: [F-COMPRESS, F-COMPRESS-CODECS, F-COMPRESS-BREAKEVEN], caveat: "not for ephemeral data; prefer fast codecs for frequently compressed data"}

  # ---------- web ----------
  - {id: lazy-load-images, kind: gsf, name: "Defer offscreen images", url: "https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images", languages: [html, javascript], facts: [F-LAZY-IMG], caveat: "only saves when visitors don't scroll to the images; never on the image above the fold"}
  - {id: modern-image-formats, kind: gsf, name: "Serve images in modern formats", url: "https://patterns.greensoftware.foundation/development/media-and-code-efficiency/serve-images-in-modern-formats", languages: [html, css, python, javascript], facts: [F-IMGRENDER, F-IMGENC]}
  - {id: css-animations, kind: code, name: "CSS transforms/keyframes instead of JS-driven animation", languages: [html, css, javascript], facts: [F-ANIM]}
  - {id: remove-unused-css, kind: gsf, name: "Remove unused CSS", url: "https://patterns.greensoftware.foundation/development/media-and-code-efficiency/remove-unused-css", languages: [css, javascript], facts: [F-UNUSED-CSS], caveat: "small stylesheets: bytes only, no measurable client energy"}
  - {id: dom-size, kind: gsf, name: "Avoid excessive DOM size (virtualize, paginate)", url: "https://patterns.greensoftware.foundation/development/web-performance/avoid-excessive-dom-size", languages: [javascript, typescript, html], facts: [F-DOM-SIZE]}
  - {id: text-compression, kind: gsf, name: "Enable text compression", url: "https://patterns.greensoftware.foundation/development/web-performance/enable-text-compression", languages: [yaml, javascript, python], facts: [F-TEXT-COMPRESS], caveat: "precompress static assets; per-request compression costs CPU"}
  - {id: minify-assets, kind: gsf, name: "Minify web assets", url: "https://patterns.greensoftware.foundation/development/web-performance/minify-web-assets", languages: [javascript], facts: [F-MINIFY], caveat: "small bundles: bytes only, no measurable client energy"}
  - {id: system-fonts-and-deps, kind: code, name: "Avoid heavy dependencies / web fonts for trivial tasks", languages: [javascript, html, css], facts: [F-FONTS]}

  # ---------- infra / cloud ----------
  - {id: minimize-environments, kind: gsf, name: "Minimize deployed environments", url: "https://patterns.greensoftware.foundation/development/minimizing-deployed-environments", languages: [yaml], facts: [F-PREVIEW-ENV], caveat: "idle services cost little per minute; the saving is environments that do not exist"}
  - {id: small-container-images, kind: code, name: "Small container images, multi-stage builds, layer caching", languages: [dockerfile], facts: [F-CONTAINER-IMAGE]}
  - {id: bash-builtins, kind: code, name: "Shell: builtins over subprocess forks in loops, single-pass tools", languages: [bash], facts: [F-BASH-SUBPROC]}
  - {id: bash-quoting, kind: code, name: "Shell: single quotes for every literal that needs no expansion", languages: [bash], facts: [F-BASH-QUOTES], caveat: "keep double quotes around variables; absolute saving grows with literal length and loop count"}


  # ---------- meta ----------
  - {id: none, kind: code, name: "No pattern applies (general or already-efficient code)", languages: []}
  - {id: context-tradeoff, kind: code, name: "Pattern deliberately not applied because of context", languages: []}
