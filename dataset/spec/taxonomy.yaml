# Taxonomy used by generate.py (job matrix) and verify.py (allowed ids and languages).
#
# Every pattern is backed by a benchmark in ../../benchmarks with a fact in measured-facts.md.
# languages: only the languages the benchmark measured. verify.py rejects examples in other languages.

categories:
  # weight = target share of the final dataset
  generation:   {weight: 0.35, description: "User asks to write code. No mention of green/energy. Answer is green by default + Green Notes."}
  review:       {weight: 0.22, description: "User pastes code and asks for a review/feedback. Severity-ranked findings incl. bugs."}
  refactor:     {weight: 0.18, description: "User pastes code and asks to optimize/refactor/clean up. Rewritten code + Green Notes."}
  no-change:    {weight: 0.09, description: "Code is already efficient, or the pattern does not apply in this context. Say so, don't invent."}
  conceptual:   {weight: 0.06, description: "Questions about green software, trade-offs, when patterns apply. Short and conditional."}
  estimate:     {weight: 0.06, description: "User asks how much energy/carbon a change saves. Directional answer, cite measured facts only, explain how to measure."}
  multi-turn:   {weight: 0.04, description: "Follow-ups and pushback (readability, deadlines, 'just do X'). Model adapts without nagging."}

languages: [python, sql, bash, html, css, javascript, dockerfile, yaml, nginx]

domains:
  - web backend / REST API
  - frontend / landing page
  - data pipeline / ETL
  - CLI tool / script
  - machine learning inference
  - CI/CD and infrastructure
  - log processing
  - IoT / embedded gateway
  - e-commerce
  - scientific computing

user_styles:
  - terse one-liner ("fix this")
  - detailed request with requirements
  - beginner, unsure what is wrong
  - senior dev, wants only the diff
  - pastes code without any text except "?"
  - non-native English with small typos

patterns:
  # ---------- Python micro-benchmarks ----------
  - {id: string-join, name: "Join strings instead of += in loops", languages: [python], facts: [F-STRCAT], caveat: "f-string concatenation in a loop behaves like +="}
  - {id: set-membership, name: "Set/dict for repeated membership tests", languages: [python], facts: [F-MEMB], caveat: "only with repeated lookups"}
  - {id: deque-or-append, name: "Avoid list.insert(0) / front insertion", languages: [python], facts: [F-LISTINS]}
  - {id: memoize, name: "Memoize repeated pure computations", languages: [python], facts: [F-LRU], caveat: "only with repeated inputs; bounded cache size"}
  - {id: regex-precompile, name: "Compile regex once, outside loops", languages: [python], facts: [F-REGEX], caveat: "small win in Python thanks to re cache; big win for dynamic patterns"}
  - {id: hoist-invariants, name: "Hoist loop-invariant attribute lookups into local variables", languages: [python], facts: [F-ATTR]}
  - {id: simple-conditions, name: "Simple equality conditions instead of complex range/modulo guard chains", languages: [python], facts: [F-COND]}
  - {id: avoid-exception-flow, name: "No exceptions for expected control flow (dict.get, in)", languages: [python], facts: [F-EXC]}
  - {id: keep-star-imports, name: "Anti-pattern: changing star imports. Leave them unchanged, report no measurable energy difference", languages: [python], facts: [F-IMPORT], caveat: "never convert from x import * to import x / explicit names"}
  - {id: torch-no-grad, name: "torch.inference_mode()/no_grad() for inference", languages: [python], facts: [F-NOGRAD]}
  - {id: vectorize-or-jit, name: "JIT-compile hot numeric loops (Numba)", languages: [python], facts: [F-NUMBA]}

  # ---------- I/O, database, compression ----------
  - {id: async-concurrent-io, name: "Use async network calls", languages: [python], facts: [F-HTTP]}
  - {id: batch-db-writes, name: "Batch database writes (executemany, COPY)", languages: [python, sql], facts: [F-PG-INSERT], caveat: "pays off with many rows per batch; small batches differ little"}
  - {id: select-columns, name: "Select only the needed columns instead of SELECT *", languages: [sql, python], facts: [F-PG-SELECT, F-PG-COLUMNS]}
  - {id: compress-transmitted, name: "Compress transmitted data", languages: [bash], facts: [F-COMPRESS, F-COMPRESS-CODECS], caveat: "cheap codec for dynamic responses"}
  - {id: compress-stored, name: "Compress stored data", languages: [bash], facts: [F-COMPRESS, F-COMPRESS-CODECS, F-COMPRESS-BREAKEVEN], caveat: "not for ephemeral data; prefer fast codecs for frequently compressed data"}

  # ---------- web ----------
  - {id: lazy-load-images, name: "Defer offscreen images", languages: [html], facts: [F-LAZY-IMG], caveat: "only saves when visitors don't scroll to the images; never on the image above the fold"}
  - {id: modern-image-formats, name: "Serve images in modern formats", languages: [html], facts: [F-IMGRENDER, F-IMGENC]}
  - {id: css-animations, name: "CSS transforms/keyframes instead of JS-driven animation", languages: [html, css, javascript], facts: [F-ANIM]}
  - {id: remove-unused-css, name: "Remove unused CSS", languages: [css, html], facts: [F-UNUSED-CSS], caveat: "small stylesheets: bytes only, no measurable client energy"}
  - {id: dom-size, name: "Avoid excessive DOM size (paginate)", languages: [javascript, html], facts: [F-DOM-SIZE]}
  - {id: text-compression, name: "Enable text compression", languages: [nginx], facts: [F-TEXT-COMPRESS], caveat: "precompress static assets; per-request compression costs CPU"}
  - {id: minify-assets, name: "Minify web assets", languages: [javascript, css], facts: [F-MINIFY], caveat: "small bundles: bytes only, no measurable client energy"}
  - {id: system-fonts-and-deps, name: "System font stack or small font subsets instead of large web fonts", languages: [css, html], facts: [F-FONTS]}

  # ---------- infra / cloud ----------
  - {id: minimize-environments, name: "Minimize deployed environments", languages: [yaml], facts: [F-PREVIEW-ENV], caveat: "idle services cost little per minute; the saving is environments that do not exist"}
  - {id: small-container-images, name: "Small container images (slim base, runtime dependencies only, dependency layer first)", languages: [dockerfile], facts: [F-CONTAINER-IMAGE]}
  - {id: bash-builtins, name: "Shell: builtins over subprocess forks in loops, single-pass tools", languages: [bash], facts: [F-BASH-SUBPROC]}
  - {id: bash-quoting, name: "Shell: single quotes for every literal that needs no expansion", languages: [bash], facts: [F-BASH-QUOTES], caveat: "keep double quotes around variables; absolute saving grows with literal length and loop count"}


  # ---------- meta ----------
  - {id: none, name: "No pattern applies (already-efficient code)", languages: []}
  - {id: context-tradeoff, name: "Pattern deliberately not applied because of context", languages: []}
