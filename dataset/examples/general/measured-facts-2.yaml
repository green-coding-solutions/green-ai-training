id: nochange-py-star-import-energy-001
category: no-change
language: python
patterns: [keep-star-imports, context-tradeoff]
facts: [F-IMPORT]
messages:
  - role: user
    content: |
      Our linter flags `from utils import *` in ~40 modules. Someone opened a ticket "replace star imports to reduce energy use". Is that a real energy win?

      ```python
      from utils import *

      def handle(order):
          if is_valid(order):
              return price_with_tax(order)
          raise ValueError("invalid order")
      ```
  - role: assistant
    content: |
      No. In Green Metrics Tool micro-benchmarks, `from module import *` and `import module` used the same energy: the module is loaded and executed exactly once either way. Changing the imports in 40 modules would give no measurable energy saving, so I'd leave them as they are and close the ticket as "not an energy issue".

      Your example stays unchanged:

      ```python
      from utils import *

      def handle(order):
          if is_valid(order):
              return price_with_tax(order)
          raise ValueError("invalid order")
      ```

      If you want an energy-related improvement around imports, look for heavy libraries imported at module level in short-lived processes (CLI tools, serverless functions, cron scripts). There, loading the library is the cost: a Python start that imported a large library (sympy) used about 25× the energy of a start without it. Not importing such a library at all on paths that don't need it is where the saving is.
---
id: nochange-py-small-batch-insert-001
category: no-change
language: python
patterns: [batch-db-writes, context-tradeoff]
facts: [F-PG-INSERT]
messages:
  - role: user
    content: |
      Each checkout request writes the order lines (usually 1-30 rows) with executemany. A colleague says we should switch to COPY because it is "20× greener". Should we?

      ```python
      def save_order_lines(cur, order_id, lines):
          cur.executemany(
              "INSERT INTO order_lines (order_id, sku, qty, price_cents) VALUES (%s, %s, %s, %s)",
              [(order_id, l.sku, l.qty, l.price_cents) for l in lines],
          )
      ```
  - role: assistant
    content: |
      No, keep `executemany` here. The large COPY advantage comes from big batches. In Green Metrics Tool measurements with PostgreSQL and psycopg, COPY used about 22× less CPU energy than row-by-row inserts for batches of 5,000 rows. With batches of 100 rows the methods were close (loop ~13 J, `executemany` ~15 J, COPY ~9.5 J for 100 batches), because the per-batch overhead dominates. Your batches are smaller still.

      Your code is already in good shape for this workload:
      - one statement prepared once, executed for a handful of rows,
      - parameters passed safely, no string building,
      - it runs inside the checkout transaction you already have.

      COPY would add code complexity (CSV encoding, error handling) without a measurable gain. It is the right tool for imports, migrations and nightly loads with thousands of rows.
---
id: estimate-sql-select-star-001
category: estimate
language: sql
patterns: [select-columns]
facts: [F-PG-SELECT, F-PG-COLUMNS]
messages:
  - role: user
    content: |
      Our product listing API runs this ~2 million times a day. The products table has ~50 columns, including description, specs and translations as TEXT. The endpoint returns id, name, price and thumbnail_url. How much would we save by selecting only those columns?

      ```sql
      SELECT * FROM products WHERE category_id = $1 ORDER BY popularity DESC LIMIT 48;
      ```
  - role: assistant
    content: |
      Probably a lot, because your situation matches what makes `SELECT *` expensive: a wide table with big text columns that the endpoint throws away.

      **Measured reference:** in Green Metrics Tool measurements with PostgreSQL 16 on a 52-column products table with large text columns, reading 500 rows with `SELECT *` used ~95 J per 1,000 queries, while naming 10 needed columns used ~17 J, about 5.5× less. A column sweep on the same table showed the cost growing with the data each column carries: 4 columns ~32 J, all 52 columns ~465 J for 1,000 queries of 2,500 rows.

      Your exact factor depends on how large your text columns are and how many rows you return (48). I can't turn that into a reliable number for your system without measuring.

      **How to measure your saving:**
      1. Bytes per query: `EXPLAIN (ANALYZE, VERBOSE, BUFFERS)` for both queries, and compare the response size of the endpoint before and after.
      2. Energy: run both queries in a loop against a copy of your data as Green Metrics Tool usage scenarios (the benchmark above is in `benchmarks/sql`) and multiply the per-query difference by 2 million requests per day.

      ```sql
      SELECT id, name, price, thumbnail_url
      FROM products
      WHERE category_id = $1
      ORDER BY popularity DESC
      LIMIT 48;
      ```

      An index on `(category_id, popularity DESC)` helps this query too. With only four columns, you can even make it a covering index (`INCLUDE (name, price, thumbnail_url)`), so PostgreSQL may not need to touch the wide table rows at all.
verify:
  static_only: "PostgreSQL placeholders; second block syntax checked with SQLite"
---
id: conceptual-backup-codec-001
category: conceptual
language: text
patterns: [compress-stored]
facts: [F-COMPRESS-CODECS]
messages:
  - role: user
    content: |
      We compress our nightly database dumps (~200 GB, kept 30 days) with `xz -9` because "smaller is greener". Is that the right choice?
  - role: assistant
    content: |
      Probably not. "Smaller" only counts if the extra compression work is paid back by storage or transfer savings, and the strong codecs are much more expensive to run.

      In Green Metrics Tool measurements on 100 MB of text with default settings:
      - **Compress:** zstd ~16 J, gzip ~67 J, xz ~458 J. xz used about 29× the energy of zstd, and that was xz's default level, not `-9`.
      - **Decompress:** zstd ~5.3 J, xz ~11.7 J. Restores are cheap either way.

      These measurements compare energy only, not file sizes. xz will give you somewhat smaller dumps than zstd at its default level. For 200 GB every night, though, you pay the compression cost every day, while the extra size reduction of xz over a good zstd level is usually modest.

      A practical setup:
      - `zstd -T0 -10` (or a level between 3 and 12, check what your dumps compress to) instead of `xz -9`.
      - Measure once: compress one dump with both and compare size and CPU time (`/usr/bin/time -v`). If xz saves only a few percent of space, that difference costs more to produce than it saves over 30 days.
      - Also check retention. Fewer kept dumps is often a bigger saving than any codec.
---
id: review-bash-report-quoting-001
category: review
language: bash
patterns: [bash-builtins, bash-quoting]
facts: [F-BASH-QUOTES]
messages:
  - role: user
    content: |
      Review this script? It runs every 5 minutes on our build server and prints a status line for each of ~2000 artifact files.

      ```bash
      #!/usr/bin/env bash
      DIR="/srv/artifacts"
      echo "Artifact status report"
      for f in "$DIR"/*.tar.gz; do
          name=$(basename "$f")
          size=$(stat -c %s "$f")
          echo "Artifact: $name - $size bytes"
      done
      echo "Done"
      ```
  - role: assistant
    content: |
      **Workload:** script (every 5 minutes)

      #### [Medium] Two subprocesses per file
      - **Where:** `$(basename "$f")` and `$(stat -c %s "$f")` in the loop
      - **Issue:** every file starts a subshell plus `basename`, and a subshell plus `stat`. With ~2000 files every 5 minutes, that is several million process starts per day for a status line.
      - **Fix:** use parameter expansion for the name, and let one `stat` call (or `find -printf`) report all sizes at once.

      #### [Low] Double quotes for fixed text
      - **Where:** `"Artifact status report"`, `"Done"`, `"/srv/artifacts"`
      - **Issue:** these strings contain nothing to expand. Double-quoted text is scanned for `$`, backticks and backslashes every time the line runs. In Green Metrics Tool micro-benchmarks single quotes used about 24% less CPU energy for that work. With three short strings the absolute effect is small, which is why this is Low, but single quotes are the right default and also prevent accidental expansion.
      - **Fix:** single quotes for every literal, double quotes only around variables.

      ```bash
      #!/usr/bin/env bash
      DIR='/srv/artifacts'
      echo 'Artifact status report'
      shopt -s nullglob
      files=("$DIR"/*.tar.gz)
      if (( ${#files[@]} )); then
          stat -c '%n %s' -- "${files[@]}" | while read -r path size; do
              echo "Artifact: ${path##*/} - $size bytes"
          done
      fi
      echo 'Done'
      ```

      `find "$DIR" -maxdepth 1 -name '*.tar.gz' -printf 'Artifact: %f - %s bytes\n'` does the same in one process, if you don't need the bash loop at all. Both versions assume artifact names without spaces in the `stat | read` step. Use `find -printf` if names can contain spaces.
verify:
  lang: bash
  setup: |
    d="$(mktemp -d)"
    mkdir -p "$d/srv/artifacts"
    for i in 1 2 3 4 5; do head -c $((i * 100)) /dev/zero > "$d/srv/artifacts/build-$i.tar.gz"; done
    cd "$d"
  original_code: |
    DIR="srv/artifacts"
    echo "Artifact status report"
    for f in "$DIR"/*.tar.gz; do
        name=$(basename "$f")
        size=$(stat -c %s "$f")
        echo "Artifact: $name - $size bytes"
    done
    echo "Done"
  green_code: |
    DIR='srv/artifacts'
    echo 'Artifact status report'
    shopt -s nullglob
    files=("$DIR"/*.tar.gz)
    if (( ${#files[@]} )); then
        stat -c '%n %s' -- "${files[@]}" | while read -r path size; do
            echo "Artifact: ${path##*/} - $size bytes"
        done
    fi
    echo 'Done'
  equivalence:
    driver: |
      true
---
id: conceptual-bash-single-quotes-001
category: conceptual
language: text
patterns: [bash-quoting, context-tradeoff]
facts: [F-BASH-QUOTES]
messages:
  - role: user
    content: |
      Is it true that single quotes are faster than double quotes in bash? Should we rewrite our scripts?
  - role: assistant
    content: |
      Yes, and it is worth making single quotes your default. Inside double quotes bash has to scan the text for `$`, backticks and backslashes, while single-quoted text is taken as is. In Green Metrics Tool micro-benchmarks, single quotes used about 24% less CPU energy than double quotes (a long literal in a loop of 1,000,000 iterations), and a second machine confirmed the same saving.

      How to apply it:
      - **Fixed text → single quotes:** `echo 'Backup finished'`, `grep -c 'ERROR'`, `DIR='/srv/data'`.
      - **Anything with a variable or command substitution → double quotes:** `"$file"`, `"Total: $count"`, `"$(date +%F)"`. Never drop the quotes around variables to save work, because unquoted variables cause word-splitting bugs.
      - When you touch a script anyway, convert its fixed strings. For scripts that run constantly or have long literals in loops, it is worth a dedicated pass.

      Set expectations right: for a short script that runs once, the absolute saving is tiny. The bigger wins in slow bash scripts are usually subprocesses inside loops (`$(echo ... | cut ...)`, `expr`, `basename`), which builtins or a single `awk` pass remove. Single quotes are the cheap habit on top, and they also stop accidental expansion.
