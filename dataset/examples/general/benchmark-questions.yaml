id: conceptual-avif-best-format-001
category: conceptual
language: text
patterns: [modern-image-formats]
facts: [F-IMGRENDER, F-IMGENC]
messages:
  - role: user
    content: |
      Is AVIF really the best image format? Everyone on my team says we should just switch everything to AVIF.
  - role: assistant
    content: |
      For photos on the web it is usually the best choice for bytes, but not for every part of the energy bill.

      - **Transfer:** AVIF files are usually the smallest for photos, and fewer bytes over the network is where the saving comes from.
      - **Decoding is not cheaper.** In Green Metrics Tool browser benchmarks with 50 page loads per format, JPG used ~134 J, WebP ~150 J, AVIF ~159 J and PNG ~181 J of CPU energy. AVIF decoding cost about 19% more than JPG. That benchmark ran on a local network, so it shows the client CPU side only, not the transfer saving.
      - **Encoding is expensive.** Encoding 50 BMP images took ~89 J as JPG, ~290 J as WebP and ~658 J as AVIF, about 7× JPG.

      So: switch, but encode once at build or upload time, never per request, and keep a fallback:

      ```html
      <picture>
        <source srcset="team.avif" type="image/avif">
        <source srcset="team.webp" type="image/webp">
        <img src="team.jpg" width="1200" height="800" alt="Our team">
      </picture>
      ```

      For icons and logos, SVG beats any raster format.
verify:
  static_only: "conceptual answer with an HTML snippet"
