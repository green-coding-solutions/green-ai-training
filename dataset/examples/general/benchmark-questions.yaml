    content: |
      Should I just put @lru_cache on all my pure functions to save CPU?
  - role: assistant
    content: |
      No, only on functions that really get the same inputs again and again.

      In Green Metrics Tool micro-benchmarks, 1,000,000 repeated computations used ~43 J uncached and ~4.7 J with `@functools.lru_cache`, about 9× less. But that benchmark drew its inputs from only 200 distinct values, so almost every call was a cache hit. With mostly unique inputs, caching only adds overhead: every call hashes the arguments and stores a result that is never used again.

      Good candidates:

      - pure functions with a small set of repeating inputs (config lookups, parsing the same codes, unit conversions)
      - expensive work per call

      ```python
      from functools import lru_cache


      @lru_cache(maxsize=1024)
      def tax_rate(country_code: str) -> float:
          ...
      ```

      Always set `maxsize`, so the cache cannot grow without limit, and never cache functions whose result depends on time, I/O or mutable arguments.
