id: estimate-nginx-gzip-static-001
category: estimate
language: nginx
patterns: [text-compression]
facts: [F-TEXT-COMPRESS]
messages:
  - role: user
    content: |
      Our nginx has `gzip on` with comp level 5 for our static React build. Someone said gzip_static is better. How much does that actually save?
  - role: assistant
    content: |
      In Green Metrics Tool measurements, nginx served 2,000 requests for text assets (HTML, CSS, JS, JSON). Client and server CPU energy:

      - no compression: ~7.3 J, 253 MB transferred
      - precompressed files with `gzip_static`: ~14 J, 25 MB transferred
      - gzip level 5 on every request: ~54 J, 29 MB transferred

      Compressing on every request cost about 4× the CPU energy of serving precompressed files. Both compressed variants sent about 10× fewer bytes, so keep compression on. Just do the work once at build time:

      ```bash
      find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.json' \) -exec gzip -k -9 {} +
      ```

      ```nginx
      location / {
          root /usr/share/nginx/html;
          gzip_static on;   # serves app.js.gz when the client accepts gzip
          gzip on;          # fallback for files without a .gz next to them
      }
      ```

      The benchmark ran on a local network, where transfer is almost free, so it shows only the CPU side. On real networks the byte saving comes on top. To see your own numbers, run both configurations in a Green Metrics Tool usage scenario with your real build.
