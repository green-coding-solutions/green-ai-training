id: estimate-numba-quantize-loop-001
category: estimate
language: python
patterns: [vectorize-or-jit]
facts: [F-NUMBA]
messages:
  - role: user
    content: |
      Would numba actually help our audio quantization loop? It's a plain python for loop over the samples, files have a few million samples each.
  - role: assistant
    content: |
      Very likely, it is the case JIT is made for. In Green Metrics Tool micro-benchmarks, quantizing 10,000,000 samples used ~40 J in a pure Python loop and ~9.5 J with Numba `@njit`, about 4× less.

      ```python
      import numpy as np
      from numba import njit


      @njit(cache=True)
      def quantize(samples, levels):
          out = np.empty(samples.shape[0], dtype=np.int16)
          step = 2.0 / (levels - 1)
          for i in range(samples.shape[0]):
              out[i] = int(round((samples[i] + 1.0) / step))
          return out
      ```

      - The first call compiles the function. `cache=True` stores the result on disk, so later processes don't pay that again.
      - The input must be a NumPy array, not a Python list.
      - For a one-off script on a single short file, the compile time can eat the gain.

      Your files and machine differ from the benchmark, so measure: time one file with both versions, or run them in a Green Metrics Tool usage scenario.
verify:
  static_only: "needs numba"
