id: estimate-paginate-large-table-001
category: estimate
language: javascript
patterns: [dom-size]
facts: [F-DOM-SIZE]
messages:
  - role: user
    content: |
      How much would we save by paginating our 10k-row admin table instead of rendering all rows at once?
  - role: assistant
    content: |
      A lot on the client. In Green Metrics Tool browser benchmarks, 30 page loads of a table with 10,000 rows (wrapper elements around every cell, rows appended to the live DOM one by one) used ~1036 J and 72 s. The same data paginated to 100 rows per page, as a plain `<table>` built in a `DocumentFragment`, used ~457 J and 36 s. That is about 56% less, about 2.3× less.

      ```javascript
      function renderPage(rows, page, pageSize = 100) {
        const frag = document.createDocumentFragment();
        for (const row of rows.slice(page * pageSize, (page + 1) * pageSize)) {
          const tr = document.createElement('tr');
          for (const value of row) {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          }
          frag.appendChild(tr);
        }
        document.querySelector('#admin tbody').replaceChildren(frag);
      }
      ```

      The benchmark changed two things at once: fewer rows per page and fewer elements per row. Your table's markup decides how much of each you get. If you can, paginate on the server too, so the API sends 100 rows instead of 10,000. To measure your page, load it a fixed number of times in a Green Metrics Tool usage scenario with both versions.
verify:
  static_only: "browser DOM code"
