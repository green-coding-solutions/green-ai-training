id: conceptual-async-three-api-calls-001
category: conceptual
language: text
patterns: [async-concurrent-io]
facts: [F-HTTP]
messages:
  - role: user
    content: |
      Is it worth making our script async? It calls 3 APIs one after another and then combines the results.
  - role: assistant
    content: |
      If the 3 calls don't depend on each other, async mostly saves waiting time. The energy difference is small.

      In Green Metrics Tool micro-benchmarks with Python, 10 HTTP requests took ~9.1 J and 3.1 s with sync `urllib` and ~8.4 J and 2.6 s with async `httpx`. That is about 7% less CPU energy and about 17% less wall time.

      ```python
      import asyncio
      import httpx


      async def fetch_all(urls):
          async with httpx.AsyncClient(timeout=10) as client:
              responses = await asyncio.gather(*(client.get(u) for u in urls))
          return [r.json() for r in responses]
      ```

      - Worth it if the script runs often or the waiting time matters to someone.
      - Not worth it if each call needs the previous result. Then the calls stay sequential anyway.
      - For a script that runs once a day, the extra complexity is the bigger cost.
