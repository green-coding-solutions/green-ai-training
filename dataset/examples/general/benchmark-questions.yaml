    content: |
      brotli compresses better than gzip. Should our API compress its JSON responses with brotli then?
  - role: assistant
    content: |
      Not at its maximum quality, which is the brotli CLI default (quality 11).

      In Green Metrics Tool measurements, compressing 100 MB of text used ~67 J with gzip and ~3019 J with brotli at quality 11, about 45× gzip. API responses are compressed again for every request, so you would pay that cost on every call.

      Decompressing is cheap either way: brotli ~6.7 J and gzip ~9.1 J for 100 MB. Clients don't suffer from brotli.

      So:

      - **Dynamic JSON responses:** gzip at a moderate level. Lower brotli levels are much cheaper than quality 11, but they were not part of the measurement, so test them before switching.
      - **Static assets** (JS, CSS, fonts) that are compressed once at build time and served many times: brotli at maximum quality is fine there.
