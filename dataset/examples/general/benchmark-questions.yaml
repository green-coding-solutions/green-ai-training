id: estimate-bash-builtins-vs-loops-001
category: estimate
language: bash
patterns: [bash-builtins]
facts: [F-BASH-SUBPROC]
messages:
  - role: user
    content: |
      Do I save energy when using bash builtins vs manual loops with cut and expr? Our scripts are full of `$(echo $line | cut -d' ' -f2)`.
  - role: assistant
    content: |
      Yes, a lot. The cost is not the loop, it is the process starts. Every `$(echo | cut)` or `$(expr)` starts new processes, and that dominates everything else.

      In Green Metrics Tool micro-benchmarks summarizing a 20,000-line access log with identical output:

      - a `while read` loop with `$(echo | cut)` and `$(expr)` per field: ~1302 J and 238 s
      - the same loop with builtins only (`read -r` field splitting, `$(( ))`, `case`): ~4.3 J, about 300× less
      - one `awk` pass over the file: ~1.0 J, over 1000× less than the subprocess loop and about 4× less than the builtin loop

      Builtins only:

      ```bash
      total=0
      while read -r _ status bytes; do
          case $status in
              5??) errors=$(( errors + 1 )) ;;
          esac
          total=$(( total + bytes ))
      done < access.log
      echo "bytes=$total errors=${errors:-0}"
      ```

      Or hand the whole file to one tool:

      ```bash
      awk '$2 ~ /^5/ { e++ } { b += $3 } END { print "bytes=" b, "errors=" e+0 }' access.log
      ```

      How much you save depends on how many lines your scripts process. Count the command substitutions inside loops: each one is a process start per line. For your own number, run both versions under `time` (wall and CPU time are a good proxy here) or in a Green Metrics Tool usage scenario.
verify:
  static_only: "needs access.log; snippets are syntax checked"
