id: estimate-css-vs-js-animation-001
category: estimate
language: css
patterns: [css-animations]
facts: [F-ANIM]
messages:
  - role: user
    content: |
      How much more efficient are CSS animations over JS animations? We have a pulsing "live" badge driven by requestAnimationFrame on every page. Is it worth rewriting?
  - role: assistant
    content: |
      In Green Metrics Tool browser benchmarks, a 20-second animation used ~161 J of CPU energy with a JavaScript `requestAnimationFrame` loop that updates styles, and ~145 J with CSS `@keyframes`. That is about 10% less for CSS.

      Where the saving comes from: with `@keyframes` on `transform` and `opacity`, the browser runs the animation itself, often on the compositor. No script runs on every frame.

      ```css
      .live-badge {
        animation: pulse 1.2s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        from { transform: scale(1);    opacity: 1; }
        to   { transform: scale(1.15); opacity: 0.6; }
      }
      ```

      For a badge that is on every page for the whole visit, the rewrite is small and the saving repeats for every visitor, so yes, it is worth it. Two things to keep in mind:

      - Animate only `transform` and `opacity`. A CSS animation of `width`, `top` or `box-shadow` still triggers layout or paint work on every frame.
      - The 10% is from one benchmark. Your badge, page and devices differ, so don't scale the number to your traffic. To see your own number, run the page for a fixed time in a Green Metrics Tool usage scenario once with each version and compare.
verify:
