    content: |
      No. With the same conditions, `match` and `if/elif` differed by about 1% in Green Metrics Tool micro-benchmarks, which is measurement noise. Rewrite for readability if you like, not for energy.

      What made a difference in the same benchmarks was the kind of condition. 10,000,000 classifications used ~46 J with simple equality checks and ~54 J with complex range and modulo conditions, so the simple version used about 16% less.

      For an event router keyed on a type string, a dict lookup keeps the checks simple and is easy to extend:

      ```python
      HANDLERS = {
          "order.created": handle_created,
          "order.paid": handle_paid,
          "order.cancelled": handle_cancelled,
      }


      def route(event):
          handler = HANDLERS.get(event["type"])
          if handler is None:
              raise ValueError(f"unknown event type {event['type']!r}")
          return handler(event)
      ```
