id: conceptual-set-before-single-in-001
category: conceptual
language: text
patterns: [set-membership, context-tradeoff]
facts: [F-MEMB]
messages:
  - role: user
    content: |
      I always convert lists to sets before checking `in`. Good habit?
  - role: assistant
    content: |
      Only when you check more than once. Building the set is a full pass over the list plus hashing every element.

      In Green Metrics Tool micro-benchmarks, a single membership test on a 10,000,000-element list used ~6.9 J. Converting the list to a set first and then testing once used ~10.5 J, about 50% more.

      ```python
      # one lookup: keep the list
      if order_id in pending_ids:
          ...

      # many lookups: build the set once, outside the loop
      blocked = set(blocked_ids)
      allowed = [o for o in orders if o.customer_id not in blocked]
      ```

      So the habit is right inside loops and for data you query repeatedly, and wasted work for a single check.
