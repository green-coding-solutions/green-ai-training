id: multiturn-py-deadline-minimal-fix-001
category: multi-turn
language: python
patterns: [string-join]
messages:
  - role: user
    content: |
      this crashes with TypeError when quantity is an int, fix it quick, demo in 10 minutes

      ```python
      def line_summary(items):
          text = ""
          for it in items:
              text += it["name"] + " x" + it["quantity"] + "\n"
          return text
      ```
  - role: assistant
    content: |
      ```python
      def line_summary(items):
          return "".join(f"{it['name']} x{it['quantity']}\n" for it in items)
      ```

      The f-string converts `quantity` to text, which fixes the `TypeError`. Same output as intended, built in one pass with `join`.
  - role: user
    content: |
      thanks!! works. why join though, was += wrong?
  - role: assistant
    content: |
      `+=` wasn't wrong, just less efficient for long lists. Python strings can't be changed in place, so `text += ...` can create a new string and copy everything built so far on each iteration. With many items, that work grows roughly with the square of the length. `join` computes the final size once and copies every piece once.

      For a five-line summary you won't notice a difference. I used `join` because it is the idiomatic way to build a string from many parts, and the code is shorter.
verify:
  original_code: |
    def line_summary(items):
        return "".join(it["name"] + " x" + str(it["quantity"]) + "\n" for it in items)
  green_code: |
    def line_summary(items):
        return "".join(f"{it['name']} x{it['quantity']}\n" for it in items)
  equivalence:
    driver: |
      print(repr(line_summary([{"name": "Bolt", "quantity": 4}, {"name": "Nut", "quantity": "12"}])))
---
id: multiturn-js-readability-pushback-001
category: multi-turn
language: javascript
patterns: [efficient-algorithm, builtin-functions]
messages:
  - role: user
    content: |
      write a js function that returns the products that appear in both arrays `wishlist` and `inStock` (arrays of product ids, up to 20k each)
  - role: assistant
    content: |
      ```javascript
      const availableWishes = (wishlist, inStock) => {
        const stock = new Set(inStock);
        return wishlist.filter((id) => stock.has(id));
      };
      ```

      **Green Notes**
      - **Set lookup instead of nested search** (reduces E): `inStock.includes(id)` inside the filter would be up to 20k × 20k comparisons. With a set, each id is checked in O(1), so the whole function is linear.
      - Keeps the wishlist order, which is what users see.
  - role: user
    content: |
      our juniors find the arrow one-liners hard to read. can you write it more explicitly? performance should stay the same
  - role: assistant
    content: |
      ```javascript
      function availableWishes(wishlist, inStock) {
        // Put the stock ids into a Set once, so each lookup below is fast.
        const stockIds = new Set(inStock);

        const result = [];
        for (const productId of wishlist) {
          if (stockIds.has(productId)) {
            result.push(productId);
          }
        }
        return result;
      }
      ```

      Same algorithm: one `Set` built once, one pass over the wishlist. The loop version is just as efficient as `filter`. The important part is the `Set`, so the comment explains why it is there, so nobody "simplifies" it back to `includes` later.
verify:
  lang: javascript
  original_code: |
    const availableWishes = (wishlist, inStock) => {
      const stock = new Set(inStock);
      return wishlist.filter((id) => stock.has(id));
    };
  equivalence:
    driver: |
      console.log(JSON.stringify(availableWishes([5, 3, 9, 3, 1, 7], [1, 3, 7, 8])));
      console.log(JSON.stringify(availableWishes([], [1])));
