id: multiturn-py-keep-order-dupes-001
category: multi-turn
language: python
patterns: [set-membership]
messages:
  - role: user
    content: |
      Speed this up? `allowed` has ~50k SKUs, `cart_items` can be a few thousand items when B2B customers upload order lists.

      ```python
      def valid_items(cart_items, allowed):
          return [i for i in cart_items if i["sku"] in allowed]
      ```
  - role: assistant
    content: |
      ```python
      def valid_items(cart_items, allowed):
          allowed_set = allowed if isinstance(allowed, (set, frozenset)) else set(allowed)
          return [i for i in cart_items if i["sku"] in allowed_set]
      ```

      **Green Notes**
      - **Set for repeated lookups** (reduces E): `in allowed` on a 50k-element list scans it for every cart item. With a set, each lookup is O(1). It pays off because you check thousands of items against the same list.
      - If `allowed` comes from a cache that is reused across requests, store it as a `frozenset` there, so it isn't rebuilt per call.
  - role: user
    content: |
      careful, the result has to keep the original order of the cart and duplicates (same SKU twice = two lines). does yours do that?
  - role: assistant
    content: |
      Yes. Only the lookup structure is a set. The list comprehension still walks through `cart_items` in their original order and keeps every item that passes, including repeated SKUs. The output is exactly the same as before, item for item.

      For example:

      ```python
      cart = [{"sku": "B"}, {"sku": "A"}, {"sku": "B"}, {"sku": "X"}]
      valid_items(cart, ["A", "B"])
      # [{'sku': 'B'}, {'sku': 'A'}, {'sku': 'B'}]
      ```

      You'd lose order or duplicates only if you converted `cart_items` itself to a set, which this doesn't do.
verify:
  original_code: |
    def valid_items(cart_items, allowed):
        return [i for i in cart_items if i["sku"] in allowed]
  green_code: |
    def valid_items(cart_items, allowed):
        allowed_set = allowed if isinstance(allowed, (set, frozenset)) else set(allowed)
        return [i for i in cart_items if i["sku"] in allowed_set]
  equivalence:
    driver: |
      cart = [{"sku": "B"}, {"sku": "A"}, {"sku": "B"}, {"sku": "X"}]
      print(valid_items(cart, ["A", "B"]))
      print(valid_items([{"sku": str(i % 30)} for i in range(200)], [str(i) for i in range(0, 60, 4)]))
---
id: multiturn-email-gif-constraint-001
category: multi-turn
language: html
patterns: [modern-image-formats, context-tradeoff]
messages:
  - role: user
    content: |
      I need an animated product demo in our email newsletter. Should I use a video?
  - role: assistant
    content: |
      Not in email. Most email clients (Outlook desktop, Gmail web and apps) don't play `<video>`, so many readers would see nothing or only the fallback. For email, an animated GIF is the format that works almost everywhere.

      Keep it light:
      - **Small dimensions:** 600 px wide is the usual email width. Don't send a 1200 px GIF scaled down in HTML.
      - **Few frames:** 8-12 fps is enough for a UI demo. Cut pauses and repeated frames.
      - **Few colors:** UI screenshots often look fine with 64-128 colors.
      - **Optimize:** `gifsicle -O3 --lossy=80 --colors 128 demo.gif -o demo-small.gif`
      - Make the first frame meaningful, because Outlook desktop shows only that one.
      - Link the GIF to a landing page with the full demo as a real video.
  - role: user
    content: |
      ok makes sense. can you give me the HTML snippet for the email?
  - role: assistant
    content: |
      ```html
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="center" style="padding: 24px 0;">
            <a href="https://example.com/demo?utm_source=newsletter" target="_blank">
              <img src="https://cdn.example.com/email/demo-600.gif"
                   width="600" height="338"
                   alt="Demo: planning a week of shifts with drag and drop"
                   style="display: block; width: 100%; max-width: 600px; height: auto; border: 0;">
            </a>
          </td>
        </tr>
      </table>
      ```

      The fixed `width`/`height` attributes help Outlook, the inline styles let it scale down on phones, and the `alt` text describes the demo for readers with images turned off.
verify:
  static_only: "email HTML"
