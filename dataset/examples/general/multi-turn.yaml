id: multiturn-sql-add-columns-001
category: multi-turn
language: sql
patterns: [select-columns]
facts: [F-PG-SELECT]
messages:
  - role: user
    content: |
      write a query for our mobile app's order history screen: last 20 orders of a customer with order number, date, total and status. table orders(id, customer_id, number, created_at, total_cents, status, shipping_address, billing_address, items_json, internal_notes)
  - role: assistant
    content: |
      ```sql
      SELECT number, created_at, total_cents, status
      FROM orders
      WHERE customer_id = ?
      ORDER BY created_at DESC
      LIMIT 20;
      ```

      **Green Notes**
      - **Only the four columns the screen shows** (reduces network): `items_json` and the address columns can be large, and they would be sent to the phone on every screen load for nothing. `internal_notes` shouldn't reach the app at all. In Green Metrics Tool measurements on a table with large text columns, skipping them made reads about 5.5× to 7× cheaper than `SELECT *`.
        Pattern: Reduce transmitted data
      - **`LIMIT 20`:** the screen shows 20 orders. Load more only when the user scrolls.

      An index on `(customer_id, created_at)` lets the database read exactly those 20 rows.
  - role: user
    content: |
      product wants a small thumbnail of the first item on each row now. the first item's image url is inside items_json. should I just select items_json too?
  - role: assistant
    content: |
      Better not. `items_json` contains every item of the order, and you need one URL from it. Extract it in the query, so only the URL is sent.

      ```sql
      SELECT number,
             created_at,
             total_cents,
             status,
             json_extract(items_json, '$[0].image_url') AS first_item_image
      FROM orders
      WHERE customer_id = ?
      ORDER BY created_at DESC
      LIMIT 20;
      ```

      That's SQLite syntax. In PostgreSQL it is `items_json -> 0 ->> 'image_url'`, and in MySQL `items_json->>'$[0].image_url'`.

      Make sure the URL points to a thumbnail-sized image, e.g. through your image CDN's resize parameter, and not to the full product photo.
verify:
  static_only: "parameterized query; syntax checked with SQLite"
