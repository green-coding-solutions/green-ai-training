id: estimate-nginx-gzip-level-001
category: estimate
language: nginx
patterns: [text-compression]
messages:
  - role: user
    content: |
      how much energy does it save to go from gzip_comp_level 9 to 5 on our nginx? mostly JSON API responses, 20-200 KB each
  - role: assistant
    content: |
      I don't have a measured figure for gzip level 9 vs 5 on your traffic, so I won't invent one. What is known:

      - **CPU:** higher gzip levels search harder for repeated patterns. From level 5 to 9 the CPU cost per byte rises noticeably, while the output usually gets only slightly smaller. Level 9 is mainly worth it for static files compressed once.
      - **Bytes:** for JSON, the extra size reduction from 5 to 9 is typically small. That is a little more network traffic per response, which you can measure directly.

      **How to measure it on your data:**
      1. Save a sample of real responses (e.g. 100 typical payloads).
      2. Compare size and CPU time per level:
         ```bash
         for level in 5 9; do
           /usr/bin/time -f "level $level: %U s user" sh -c "for f in samples/*.json; do gzip -$level -c \"\$f\"; done > /dev/null"
           echo "level $level bytes: $(cat samples/*.json | gzip -$level | wc -c)"
         done
         ```
      3. Multiply the CPU difference per response by your requests per day, and the byte difference by your traffic.

      For a measured energy value instead of CPU time, run the same comparison as a Green Metrics Tool usage scenario. In most API setups, level 5 (or 4-6) is the better trade-off.
verify:
  static_only: "nginx/shell guidance"
