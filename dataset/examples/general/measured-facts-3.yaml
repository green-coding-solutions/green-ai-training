id: review-bash-region-revenue-subprocess-001
category: review
language: bash
patterns: [bash-builtins]
facts: [F-BASH-SUBPROC]
messages:
  - role: user
    content: |
      This runs every night over orders.csv (about 200k lines) and takes almost an hour. Can you review it?

      ```bash
      #!/usr/bin/env bash
      # orders.csv: region,sku,qty,unit_price (no header)
      total=0
      while read line; do
          region=$(echo "$line" | cut -d, -f1)
          qty=$(echo "$line" | cut -d, -f3)
          price=$(echo "$line" | cut -d, -f4)
          amount=$(expr $qty \* $price)
          total=$(expr $total + $amount)
          echo "$region $amount" >> /tmp/region_amounts.txt
      done < orders.csv
      awk '{ s[$1] += $2 } END { for (r in s) print r, s[r] }' /tmp/region_amounts.txt
      echo "Total: $total"
      ```
  - role: assistant
    content: |
      **Workload:** script (nightly batch, 200k lines)

      #### [Bug] Results grow every night
      - **Where:** `>> /tmp/region_amounts.txt`
      - **Issue:** the file is appended to and never cleared, so each run adds its amounts to all previous runs. The per-region sums are wrong from the second night on.
      - **Fix:** don't write an intermediate file at all (see below).

      #### [High] Seven processes per line
      - **Where:** the `while read` loop
      - **Issue:** every line starts three `echo | cut` pipelines and two `expr` calls, around seven process starts per line, more than a million per night. Starting processes is what takes the hour, not the arithmetic. In Green Metrics Tool micro-benchmarks summarizing a 20,000-line log, a loop with `$(echo | cut)` and `$(expr)` per field used ~1302 J, one `awk` pass ~1.0 J, over 1000× less.
      - **Fix:** one `awk` pass computes both the per-region sums and the total:
        ```bash
        #!/usr/bin/env bash
        # orders.csv: region,sku,qty,unit_price (no header)
        awk -F, '{ a = $3 * $4; sum[$1] += a; total += a } END { for (r in sum) print r, sum[r]; print "Total: " total }' orders.csv
        ```
      - **Impact:** E, the run should drop from about an hour to seconds. Output is the same as a correct run of the old script: one line per region (in no fixed order, as before), then the total.

      #### [Low] `read` without `-r`
      - **Where:** `while read line`
      - **Issue:** backslashes in the input are swallowed. The `awk` version doesn't have this problem. If you keep a `while` loop elsewhere, use `while IFS=, read -r region sku qty price` and `$(( ))` arithmetic, so no field needs a subprocess.
verify:
  static_only: "needs orders.csv; the awk one-liner is syntax checked"
