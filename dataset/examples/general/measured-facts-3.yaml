id: refactor-dockerfile-fastapi-slim-001
category: refactor
language: dockerfile
patterns: [small-container-images]
facts: [F-CONTAINER-IMAGE]
messages:
  - role: user
    content: |
      Our CI builds this image on every push to every branch. Can you make it better?

      ```dockerfile
      FROM python:3.12
      RUN apt-get update && apt-get install -y gcc make htop nano wget
      COPY . /srv
      WORKDIR /srv
      RUN pip install -r requirements.txt
      RUN pip install ruff pytest coverage
      CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
      ```
  - role: assistant
    content: |
      ```dockerfile
      FROM python:3.12-slim

      ENV PYTHONDONTWRITEBYTECODE=1 \
          PYTHONUNBUFFERED=1

      WORKDIR /srv

      # dependencies first: this layer is reused until requirements.txt changes
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt

      COPY . .

      USER nobody
      EXPOSE 8080
      CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
      ```

      Add a `.dockerignore` so `.git`, virtualenvs and test data don't end up in the image:

      ```text
      .git
      .venv
      __pycache__
      tests/data
      ```

      **Green Notes**
      - **Slim base, runtime dependencies only** (reduces E, storage, network): `gcc`, `make`, `htop`, `nano`, `wget` and the test tools are gone from the production image. Run ruff and pytest in a CI job or a separate test stage instead. If a dependency needs a compiler, use a build stage and copy only the installed packages. In Green Metrics Tool measurements of a similar change for a small Flask app, the image build used about 7× less energy, while serving requests cost the same.
      - **Dependency layer before the source** (reduces E): a code-only push reuses the cached `pip install` layer instead of reinstalling everything. With a build on every push, this repeats many times a day.
      - **No pip cache** (reduces storage): `--no-cache-dir` keeps downloaded wheels out of the image.
verify:
  static_only: "Dockerfile"
