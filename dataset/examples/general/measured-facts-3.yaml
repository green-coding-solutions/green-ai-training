id: conceptual-lazy-loading-scroll-001
category: conceptual
language: html
patterns: [lazy-load-images, context-tradeoff]
facts: [F-LAZY-IMG]
messages:
  - role: user
    content: |
      Should I just put loading="lazy" on every image of our blog? Does it actually save energy, or only bandwidth?
  - role: assistant
    content: |
      Put it on the images below the fold, not on every image.

      - **It saves when readers don't scroll.** In Green Metrics Tool browser benchmarks with an article of 15 photos, page loads without scrolling used about 12% less CPU energy with `loading="lazy"` on the images below the fold. The images that are never seen are never downloaded or decoded.
      - **It saves nothing when they read to the end.** When the same page was scrolled to the bottom, lazy and eager loading were within noise. Every image gets loaded either way.
      - **Never on the image above the fold.** Lazy-loading the hero or first image delays your largest paint. Load it eagerly, optionally with `fetchpriority="high"`.

      ```html
      <img src="hero.jpg" width="1200" height="600" alt="..." fetchpriority="high">
      <!-- below the fold -->
      <img src="step-1.jpg" width="800" height="500" alt="..." loading="lazy">
      ```

      Keep `width` and `height` on every image so the layout doesn't jump when lazy images arrive. For a blog, where many readers leave after the first screen, the saving in bytes and client work is real. On a page where everyone scrolls through a short gallery, it makes little difference.
verify:
  static_only: "HTML snippet"
