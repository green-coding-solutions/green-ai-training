id: general-css-center-001
category: general
language: css
patterns: [none]
messages:
  - role: user
    content: |
      simplest way to center a div horizontally and vertically inside its parent?
  - role: assistant
    content: |
      With grid on the parent:

      ```css
      .parent {
        display: grid;
        place-items: center;
        min-height: 100vh; /* or any height; the parent needs a height for vertical centering */
      }
      ```

      Flexbox works the same way:

      ```css
      .parent {
        display: flex;
        justify-content: center; /* horizontal */
        align-items: center;     /* vertical */
      }
      ```

      If you only need horizontal centering of a block with a known width, `margin-inline: auto;` on the child is enough.
---
id: general-go-env-default-001
category: general
language: go
patterns: [none]
messages:
  - role: user
    content: |
      In Go, how do I read an environment variable with a default value if it's not set?
  - role: assistant
    content: |
      The standard library has no built-in default, but a small helper does it:

      ```go
      package config

      import "os"

      func getenv(key, fallback string) string {
      	if value, ok := os.LookupEnv(key); ok {
      		return value
      	}
      	return fallback
      }
      ```

      ```go
      port := getenv("PORT", "8080")
      ```

      `os.LookupEnv` tells you whether the variable is set at all, so an explicitly empty `PORT=` is returned as `""`. If empty should also fall back to the default, use `os.Getenv(key)` and check for `""` instead.
---
id: general-py-dict-typing-001
category: general
language: python
patterns: [none]
messages:
  - role: user
    content: |
      how do I type hint a dict that maps user ids (int) to a list of email strings? python 3.12
  - role: assistant
    content: |
      ```python
      emails_by_user: dict[int, list[str]] = {}
      ```

      In function signatures:

      ```python
      def group_emails(rows: list[tuple[int, str]]) -> dict[int, list[str]]:
          result: dict[int, list[str]] = {}
          for user_id, email in rows:
              result.setdefault(user_id, []).append(email)
          return result
      ```

      Since Python 3.9 you can use the built-in `dict` and `list` directly, no `typing.Dict` / `typing.List` needed. If you use the type in several places, give it a name with the 3.12 syntax:

      ```python
      type EmailIndex = dict[int, list[str]]
      ```
verify:
  green_block: 1
  test: |
    assert group_emails([(1, "a@x"), (2, "b@x"), (1, "c@x")]) == {1: ["a@x", "c@x"], 2: ["b@x"]}
---
id: general-naming-function-001
category: general
language: python
patterns: [none]
messages:
  - role: user
    content: |
      need a better name for this function, `process()` is too vague

      ```python
      def process(orders):
          return [o for o in orders if o.status == "paid" and not o.shipped]
      ```
  - role: assistant
    content: |
      Name it after what it returns:

      - `unshipped_paid_orders(orders)`
      - `orders_ready_to_ship(orders)` if "paid and not shipped" is your business definition of ready to ship.

      I'd go with `orders_ready_to_ship`: it describes the meaning, not the implementation, so the name stays correct if the rule later gains a condition (e.g. "address verified").
