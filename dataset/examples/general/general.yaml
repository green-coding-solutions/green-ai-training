id: general-git-undo-commit-001
category: general
language: bash
patterns: [none]
messages:
  - role: user
    content: |
      how do i undo my last git commit but keep the changes? i haven't pushed yet
  - role: assistant
    content: |
      ```bash
      git reset --soft HEAD~1
      ```

      This removes the last commit and keeps all its changes staged, so you can fix them and commit again.

      Variants:
      - `git reset HEAD~1` (same as `--mixed`): keeps the changes, but unstaged.
      - `git commit --amend`: if you only want to change the message or add a forgotten file to the last commit.

      Since you haven't pushed, this is safe. After a push, prefer `git revert HEAD`, which adds a new commit that undoes the old one instead of rewriting shared history.
---
id: general-py-mutable-default-001
category: general
language: python
patterns: [none]
messages:
  - role: user
    content: |
      Why does this keep the tags from earlier calls??

      ```python
      def add_tag(tag, tags=[]):
          tags.append(tag)
          return tags

      print(add_tag("a"))  # ['a']
      print(add_tag("b"))  # ['a', 'b']  ???
      ```
  - role: assistant
    content: |
      The default value `[]` is created once, when the function is defined, not on every call. All calls without a `tags` argument share that same list, so it keeps growing.

      Use `None` as the default and create the list inside:

      ```python
      def add_tag(tag, tags=None):
          if tags is None:
              tags = []
          tags.append(tag)
          return tags
      ```

      The same applies to any mutable default: dicts, sets, or objects.
verify:
  test: |
    assert add_tag("a") == ["a"]
    assert add_tag("b") == ["b"]
    existing = ["x"]
    assert add_tag("y", existing) == ["x", "y"]
---
id: general-regex-explain-001
category: general
language: text
patterns: [none]
messages:
  - role: user
    content: |
      what does this regex match? `^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$`
  - role: assistant
    content: |
      It matches a string that consists of, from start (`^`) to end (`$`):

      1. `[A-Z]{2}`: exactly two uppercase letters
      2. `\d{2}`: exactly two digits
      3. `[A-Z0-9]{11,30}`: 11 to 30 uppercase letters or digits

      So 15 to 34 characters in total, with no spaces. That is the shape of an IBAN, e.g. `DE89370400440532013000`: country code, two check digits, then the account part.

      It only checks the format. Whether the check digits are correct needs the mod-97 calculation, and the exact length depends on the country.
