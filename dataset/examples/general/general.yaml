id: general-js-equality-001
category: general
language: javascript
patterns: [none]
messages:
  - role: user
    content: |
      == vs === in javascript, which one should I use?
  - role: assistant
    content: |
      Use `===` by default.

      - `===` (strict equality) compares value **and** type, without conversion: `1 === "1"` is `false`.
      - `==` (loose equality) converts types before comparing, with rules that are easy to get wrong:

      ```javascript
      0 == "";           // true
      0 == "0";          // true
      "" == "0";         // false
      null == undefined; // true
      [] == false;       // true
      ```

      The one common, deliberate use of `==` is `value == null`, which is true for both `null` and `undefined`. Many teams prefer writing `value === null || value === undefined`, or `value ?? fallback`, to make it explicit. Linters like ESLint's `eqeqeq` rule can enforce `===` everywhere.
---
id: general-docker-logs-001
category: general
language: bash
patterns: [none]
messages:
  - role: user
    content: |
      how can I see the logs of a running docker container and follow them live?
  - role: assistant
    content: |
      ```bash
      docker logs -f web
      ```

      Replace `web` with the container's name or ID.

      Useful options:
      - `--tail 100`: start with only the last 100 lines instead of the whole history.
      - `--since 10m`: only logs from the last 10 minutes.
      - `-t`: show timestamps.

      ```bash
      docker logs -f --tail 100 -t web
      ```

      With Docker Compose, `docker compose logs -f web` does the same for a service, or for all services without a name. `docker ps` shows the names of running containers.
