id: general-py-pytest-scaffold-001
category: general
language: python
patterns: [none]
messages:
  - role: user
    content: |
      Can you write pytest tests for this?

      ```python
      def parse_duration(text: str) -> int:
          """Parses '1h30m', '45m', '2h', '90s' into seconds."""
          units = {"h": 3600, "m": 60, "s": 1}
          total, number = 0, ""
          for ch in text.strip():
              if ch.isdigit():
                  number += ch
              elif ch in units and number:
                  total += int(number) * units[ch]
                  number = ""
              else:
                  raise ValueError(f"invalid duration: {text!r}")
          if number:
              raise ValueError(f"missing unit in: {text!r}")
          return total
      ```
  - role: assistant
    content: |
      ```python
      import pytest

      from durations import parse_duration


      @pytest.mark.parametrize(
          "text, expected",
          [
              ("1h30m", 5400),
              ("45m", 2700),
              ("2h", 7200),
              ("90s", 90),
              ("1h1m1s", 3661),
              ("  10m ", 600),
              ("", 0),
          ],
      )
      def test_valid_durations(text, expected):
          assert parse_duration(text) == expected


      @pytest.mark.parametrize("text", ["10", "1h30", "abc", "h", "1d", "1.5h", "-5m"])
      def test_invalid_durations(text):
          with pytest.raises(ValueError):
              parse_duration(text)
      ```

      Adjust the import to the module where `parse_duration` lives. Note the case `("", 0)`: the function currently returns 0 for an empty string. If that should be an error instead, change the test to expect `ValueError` and add a check in the function.
verify:
  green_block: 0
  setup: |
    import sys, types
    def parse_duration(text: str) -> int:
        units = {"h": 3600, "m": 60, "s": 1}
        total, number = 0, ""
        for ch in text.strip():
            if ch.isdigit():
                number += ch
            elif ch in units and number:
                total += int(number) * units[ch]
                number = ""
            else:
                raise ValueError(f"invalid duration: {text!r}")
        if number:
            raise ValueError(f"missing unit in: {text!r}")
        return total
    sys.modules["durations"] = types.SimpleNamespace(parse_duration=parse_duration)
    class _Raises:
        def __init__(self, exc): self.exc = exc
        def __enter__(self): return self
        def __exit__(self, t, v, tb):
            assert t is not None and issubclass(t, self.exc), "expected exception"
            return True
    class _Mark:
        @staticmethod
        def parametrize(names, cases):
            def deco(fn):
                fn._cases = cases
                return fn
            return deco
    sys.modules["pytest"] = types.SimpleNamespace(raises=_Raises, mark=_Mark())
  test: |
    for case in test_valid_durations._cases:
        test_valid_durations(*case)
    for case in test_invalid_durations._cases:
        test_invalid_durations(case)
