id: refactor-sql-union-all-001
category: refactor
language: sql
patterns: [efficient-algorithm]
messages:
  - role: user
    content: |
      Can this be faster? It builds the combined activity feed export. invoices and refunds have separate id sequences and the type column already keeps the rows apart.

      ```sql
      SELECT 'invoice' AS type, id, customer_id, amount, created_at FROM invoices
      UNION
      SELECT 'refund' AS type, id, customer_id, -amount, created_at FROM refunds
      ORDER BY created_at;
      ```
  - role: assistant
    content: |
      ```sql
      SELECT 'invoice' AS type, id, customer_id, amount, created_at FROM invoices
      UNION ALL
      SELECT 'refund' AS type, id, customer_id, -amount, created_at FROM refunds
      ORDER BY created_at;
      ```

      **Green Notes**
      - **`UNION ALL` instead of `UNION`** (reduces E): `UNION` removes duplicate rows, which forces the database to sort or hash the whole combined result. Your rows can never be duplicates, because the `type` literal differs between the two halves, so that work was always wasted. The result is identical.
      - Keep plain `UNION` only where the two halves can really produce the same row and you need it once.
verify:
  sql:
    compare: true
    ordered: true
    setup: |
      CREATE TABLE invoices (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL, created_at TEXT);
      CREATE TABLE refunds (id INTEGER PRIMARY KEY, customer_id INTEGER, amount REAL, created_at TEXT);
      INSERT INTO invoices VALUES (1, 10, 99.0, '2026-01-01'), (2, 11, 15.5, '2026-01-03'), (3, 10, 20.0, '2026-01-05');
      INSERT INTO refunds VALUES (1, 10, 99.0, '2026-01-02'), (2, 12, 5.0, '2026-01-04');
