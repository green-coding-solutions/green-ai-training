id: gen-sql-keyset-pagination-001
category: generation
language: sql
patterns: [select-columns, efficient-algorithm]
messages:
  - role: user
    content: |
      I need the SQL for an export endpoint that pages through our transactions table (~50M rows, id is the primary key). Clients fetch 1000 rows at a time, we only need id, account_id, amount, booked_at.
  - role: assistant
    content: |
      Use keyset pagination: the client sends the last `id` it received, and you continue from there.

      ```sql
      -- first page: pass 0 as last_id
      SELECT id, account_id, amount, booked_at
      FROM transactions
      WHERE id > ?          -- last_id from the previous page
      ORDER BY id
      LIMIT 1000;
      ```

      The response includes the last `id` of the page, and the client sends it back to get the next page. An empty page means the export is done.

      **Green Notes**
      - **Keyset instead of `OFFSET`** (reduces E): with `LIMIT 1000 OFFSET 40000000` the database reads and throws away 40 million rows to return 1000, and every page gets slower than the one before. `WHERE id > ?` jumps straight into the primary key index, so every page costs the same.
      - **Only the four needed columns** (reduces network): less data read and transferred for 50 million rows.
        Pattern: Reduce transmitted data
verify:
  static_only: "parameterized query; syntax checked with SQLite"
