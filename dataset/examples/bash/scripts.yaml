id: refactor-bash-rename-jpeg-001
category: refactor
language: bash
patterns: [bash-builtins]
messages:
  - role: user
    content: |
      this renames all .jpeg files to .jpg in a folder tree. takes ages on our photo archive (~200k files). can you make it faster?

      ```bash
      #!/usr/bin/env bash
      for f in $(find "$1" -name "*.jpeg"); do
          dir=$(dirname "$f")
          base=$(basename "$f" .jpeg)
          mv "$f" "$dir/$base.jpg"
      done
      ```
  - role: assistant
    content: |
      ```bash
      #!/usr/bin/env bash
      find "$1" -type f -name '*.jpeg' -print0 |
          while IFS= read -r -d '' f; do
              mv -- "$f" "${f%.jpeg}.jpg"
          done
      ```

      **Green Notes**
      - **Parameter expansion instead of `dirname`/`basename`** (reduces E): `${f%.jpeg}.jpg` strips the extension inside bash. The old loop started two extra processes per file, about 400k for your archive, on top of the `mv`.
      - **Bug fix:** `for f in $(find ...)` split file names at spaces, so files like `summer 2024.jpeg` failed. `-print0` with `read -d ''` handles every file name, including spaces and newlines.
      - `-type f` skips directories that happen to end in `.jpeg`.

      If `perl-rename` (`rename`) is installed, `find "$1" -type f -name '*.jpeg' -exec rename 's/\.jpeg$/.jpg/' {} +` also avoids one `mv` process per file.
verify:
  lang: bash
  setup: |
    set -- "$(mktemp -d)"
    mkdir -p "$1/a/b" "$1/c"
    for i in $(seq 1 40); do : > "$1/a/img$i.jpeg"; : > "$1/a/b/pic$i.jpeg"; : > "$1/c/keep$i.png"; done
  equivalence:
    driver: |
      find "$1" -type f | sed "s|^$1||" | sort
  benchmark:
    driver: |
      true
    min_speedup: 1.3
---
id: review-bash-csv-total-001
category: review
language: bash
patterns: [bash-builtins]
messages:
  - role: user
    content: |
      Script from our finance folder, sums the amount column (cents) of the daily sales export. Export has ~500k lines now. Review?

      ```bash
      #!/usr/bin/env bash
      FILE="$1"
      total=0
      for line in $(tail -n +2 "$FILE"); do
          amount=$(echo "$line" | awk -F, '{print $3}')
          total=$((total + amount))
      done
      echo "Total cents: $total"
      ```
  - role: assistant
    content: |
      **Workload:** script (daily batch)

      #### [High] One `awk` process per line
      - **Where:** `amount=$(echo "$line" | awk ...)` inside the loop
      - **Issue:** every line starts a subshell and an `awk` process. For 500k lines that is about a million processes, just to read one column.
      - **Fix:** let a single `awk` read the whole file and do the sum.
      - **Impact:** reduces E by replacing a million process starts with one.

      #### [Bug] Word splitting in `for line in $(...)`
      - **Where:** the `for` loop
      - **Issue:** the loop splits on any whitespace, not on lines. A product name with a space in the CSV turns one line into two "lines", and the amount is read from the wrong field.

      ```bash
      #!/usr/bin/env bash
      awk -F, 'NR > 1 { total += $3 } END { printf "Total cents: %d\n", total }' "$1"
      ```

      If the export can contain quoted fields with commas inside, use a CSV-aware tool (e.g. `mlr --icsv stats1 -a sum -f amount`) instead of splitting on `,`.
verify:
  lang: bash
  setup: |
    set -- "$(mktemp -d)/sales.csv"
    {
      echo "id,product,amount"
      for i in $(seq 1 300); do echo "$i,item$((i % 7)),$((i * 37 % 1000))"; done
    } > "$1"
  equivalence:
    driver: |
      true
  benchmark:
    driver: |
      true
    min_speedup: 5
---
id: gen-bash-disk-alert-001
category: generation
language: bash
patterns: [bash-builtins]
messages:
  - role: user
    content: |
      Write a bash script for cron that checks all mounted filesystems and prints a warning line for every mount whose usage is above a threshold (default 90, can be passed as first arg). Ignore tmpfs and overlay.
  - role: assistant
    content: |
      ```bash
      #!/usr/bin/env bash
      set -euo pipefail

      threshold="${1:-90}"
      status=0

      while read -r source size used avail pcent target; do
          usage="${pcent%\%}"
          if (( usage > threshold )); then
              printf 'WARNING: %s is at %s%% (%s used, %s free)\n' "$target" "$usage" "$used" "$avail"
              status=1
          fi
      done < <(df -h --output=source,size,used,avail,pcent,target -x tmpfs -x overlay -x devtmpfs | tail -n +2)

      exit "$status"
      ```

      **Green Notes**
      - **One `df` call, the rest in bash builtins** (reduces E): `${pcent%\%}` strips the percent sign and `(( ))` compares numbers without starting `cut`, `sed` or `expr` for every mount.
      - **Filtering in `df`:** `-x tmpfs -x overlay -x devtmpfs` drops the pseudo filesystems before bash sees them, instead of a `grep -v` per type.
      - The exit code is 1 if any mount is over the threshold, so cron or a monitoring wrapper can react to it.
verify:
  static_only: "depends on the host's mounts; syntax checked"
---
id: nochange-bash-nightly-backup-001
category: no-change
language: bash
patterns: [bash-builtins, context-tradeoff]
messages:
  - role: user
    content: |
      I read that subshells and external commands in bash are expensive. Should I optimize this? It runs once per night.

      ```bash
      #!/usr/bin/env bash
      set -euo pipefail
      stamp=$(date +%F)
      host=$(hostname -s)
      pg_dump --format=custom shop > "/backups/${host}-shop-${stamp}.dump"
      find /backups -name "${host}-shop-*.dump" -mtime +14 -delete
      ```
  - role: assistant
    content: |
      No, this is fine. The advice about external commands matters inside loops that run thousands or millions of times. Your script starts `date` and `hostname` once each per night. That is a few milliseconds, next to a `pg_dump` that reads the whole database.

      It is already written well:
      - `set -euo pipefail` stops on errors, so a failed dump doesn't go unnoticed.
      - Old backups are deleted with a single `find -delete`, not with a loop that calls `rm` per file.
      - Variables are quoted.

      The only real energy lever here is the dump itself. `--format=custom` is already compressed. Check that you keep only as many old backups as you need, and that the backup isn't also compressed again by another tool afterwards.
---
id: refactor-bash-error-count-001
category: refactor
language: bash
patterns: [bash-builtins]
messages:
  - role: user
    content: |
      Counts ERROR lines across all app logs in a folder for our daily report. Any way to make it leaner?

      ```bash
      #!/usr/bin/env bash
      total=0
      for f in /var/log/myapp/*.log; do
          count=$(cat "$f" | grep "ERROR" | wc -l)
          total=$((total + count))
      done
      echo "errors: $total"
      ```
  - role: assistant
    content: |
      ```bash
      #!/usr/bin/env bash
      shopt -s nullglob
      logs=(/var/log/myapp/*.log)
      total=0
      if (( ${#logs[@]} )); then
          total=$(cat -- "${logs[@]}" | grep -c 'ERROR')
      fi
      echo "errors: $total"
      ```

      **Green Notes**
      - **One pipeline instead of three processes per file** (reduces E): the old loop started `cat`, `grep` and `wc` for every log file. Now there is one `cat` and one `grep` for all files together, and `grep -c` counts without a separate `wc`.
      - **`nullglob`:** if the folder is empty, the old version ran `cat` on the literal pattern `*.log` and printed an error. Now it reports 0.
      - Same result: the number of lines containing `ERROR` across all files.
verify:
  lang: bash
  setup: |
    d="$(mktemp -d)"
    mkdir -p "$d/var/log/myapp"
    for i in 1 2 3; do
      for j in $(seq 1 50); do
        if (( j % (i + 2) == 0 )); then echo "2026-10-06 ERROR job $j failed"; else echo "2026-10-06 INFO job $j ok"; fi
      done > "$d/var/log/myapp/app$i.log"
    done
    cd "$d"
  original_code: |
    total=0
    for f in var/log/myapp/*.log; do
        count=$(cat "$f" | grep "ERROR" | wc -l)
        total=$((total + count))
    done
    echo "errors: $total"
  green_code: |
    shopt -s nullglob
    logs=(var/log/myapp/*.log)
    total=0
    if (( ${#logs[@]} )); then
        total=$(cat -- "${logs[@]}" | grep -c 'ERROR')
    fi
    echo "errors: $total"
  equivalence:
    driver: |
      true
