id: refactor-bash-release-notes-quotes-001
category: refactor
language: bash
patterns: [bash-quoting]
facts: [F-BASH-QUOTES]
messages:
  - role: user
    content: |
      Our release script prints a summary after every deploy. Please clean it up.

      ```bash
      #!/usr/bin/env bash
      APP="shop-backend"
      ENVIRONMENT="$1"
      VERSION="$2"
      echo "=============================="
      echo "Deployment summary"
      echo "=============================="
      echo "Application: $APP"
      echo "Environment: $ENVIRONMENT"
      echo "Version:     $VERSION"
      if [ "$ENVIRONMENT" = "production" ]; then
          echo "Remember to announce the release in #releases"
      fi
      echo "Done."
      ```
  - role: assistant
    content: |
      ```bash
      #!/usr/bin/env bash
      APP='shop-backend'
      ENVIRONMENT="$1"
      VERSION="$2"
      separator='=============================='

      echo "$separator"
      echo 'Deployment summary'
      echo "$separator"
      echo "Application: $APP"
      echo "Environment: $ENVIRONMENT"
      echo "Version:     $VERSION"
      if [[ $ENVIRONMENT == 'production' ]]; then
          echo 'Remember to announce the release in #releases'
      fi
      echo 'Done.'
      ```

      **Green Notes**
      - **Single quotes for fixed text** (reduces E): bash has to scan double-quoted strings for `$`, backticks and backslashes, while single-quoted text is taken as is. In Green Metrics Tool micro-benchmarks single quotes used about 24% less CPU energy for that work ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=dd9bbb4e-b056-4067-8ad2-7b1818a86f10,b265ef9b-adb9-4b56-a14b-ae34fdaa7247,28d92c15-79d7-44ca-8f43-a733fe2e265a,a9533378-71f0-49df-bd5f-1e5f27cda9c2)). For a script that runs once per deploy the absolute saving is tiny, but it is the right default, and it also prevents accidental expansion. For example `"#releases"` is safe today, but a later `"$releases"` typo would silently expand to nothing.
      - **Double quotes kept where variables expand:** `"$1"`, `"$2"` and the lines that print variables stay double-quoted, so values with spaces stay intact.
      - The separator is defined once and reused. `[[ ... ]]` doesn't need quotes around the variable on the left side.
verify:
  lang: bash
  setup: |
    set -- production 4.2.1
  equivalence:
    driver: |
      true
---
id: gen-bash-rotate-logs-001
category: generation
language: bash
patterns: [bash-quoting, bash-builtins]
facts: [F-BASH-QUOTES]
messages:
  - role: user
    content: |
      Write a small bash script that rotates a log file: app.log -> app.log.1, app.log.1 -> app.log.2, ... keep at most N old files (default 5), then create an empty app.log. Path of the log is the first argument.
  - role: assistant
    content: |
      ```bash
      #!/usr/bin/env bash
      set -euo pipefail

      log="${1:?usage: rotate-log.sh <logfile> [keep]}"
      keep="${2:-5}"

      if [[ ! -e $log ]]; then
          echo 'nothing to rotate' >&2
          exit 0
      fi

      # drop everything that would end up beyond the limit, including leftovers from a larger limit
      for old in "$log".*; do
          n="${old##*.}"
          if [[ $n =~ ^[0-9]+$ ]] && (( n >= keep )); then
              rm -f -- "$old"
          fi
      done

      for (( i = keep - 1; i >= 1; i-- )); do
          if [[ -e $log.$i ]]; then
              mv -- "$log.$i" "$log.$(( i + 1 ))"
          fi
      done
      mv -- "$log" "$log.1"
      : > "$log"
      ```

      **Green Notes**
      - **Bash builtins only, apart from `mv`/`rm`** (reduces E): `(( ))` arithmetic and `[[ ]]` tests run inside bash, no `expr`, `seq` or `test` subprocesses.
      - **Single quotes for fixed text:** the message `'nothing to rotate'` needs no expansion. Single-quoted literals skip bash's scan for `$` and backticks. In Green Metrics Tool micro-benchmarks that was about 24% less CPU energy for the quoting work ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=dd9bbb4e-b056-4067-8ad2-7b1818a86f10,b265ef9b-adb9-4b56-a14b-ae34fdaa7247,28d92c15-79d7-44ca-8f43-a733fe2e265a,a9533378-71f0-49df-bd5f-1e5f27cda9c2)). Every path stays double-quoted, so file names with spaces work.
      - `: > "$log"` truncates/creates the file without starting a process.
verify:
  lang: bash
  setup: |
    d="$(mktemp -d)"
    for i in 1 2 3 4 5; do echo "old $i" > "$d/app.log.$i"; done
    echo current > "$d/app.log"
    set -- "$d/app.log" 3
  test: |
    [ "$(cat "$d/app.log.1")" = current ] || { echo 'app.log.1 wrong'; exit 1; }
    [ "$(cat "$d/app.log.2")" = 'old 1' ] || { echo 'app.log.2 wrong'; exit 1; }
    [ "$(cat "$d/app.log.3")" = 'old 2' ] || { echo 'app.log.3 wrong'; exit 1; }
    [ ! -s "$d/app.log" ] || { echo 'app.log not empty'; exit 1; }
    [ ! -e "$d/app.log.4" ] && [ ! -e "$d/app.log.5" ] || { echo 'old files beyond keep remain'; exit 1; }
---
id: review-bash-loop-template-001
category: review
language: bash
patterns: [bash-quoting, hoist-invariants]
facts: [F-BASH-QUOTES]
messages:
  - role: user
    content: |
      This generates a SQL file with one statement per customer id (~300k ids) for our data migration. Takes a while. Review?

      ```bash
      #!/usr/bin/env bash
      while read -r id; do
          header="-- generated by migrate-customers.sh, do not edit by hand, see MIGRATION.md for details and rollback steps"
          echo "$header"
          echo "UPDATE customers SET tier = 'legacy' WHERE id = $id;"
      done < ids.txt > migration.sql
      ```
  - role: assistant
    content: |
      **Workload:** script (one-off migration, 300k iterations)

      #### [Medium] Constant header re-created and printed for every id
      - **Where:** `header="..."` inside the loop
      - **Issue:** the same long double-quoted literal is assigned 300k times, and bash scans it for `$` and backticks each time. In Green Metrics Tool micro-benchmarks, single quotes used about 24% less CPU energy than double quotes for a long literal in a hot loop ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=dd9bbb4e-b056-4067-8ad2-7b1818a86f10,b265ef9b-adb9-4b56-a14b-ae34fdaa7247,28d92c15-79d7-44ca-8f43-a733fe2e265a,a9533378-71f0-49df-bd5f-1e5f27cda9c2)). Here the literal doesn't need to be in the loop at all, and the header only needs to appear once in the file.
      - **Fix:** single-quoted literal, written once before the loop.

      #### [Low] One `echo` per line inside a bash loop
      - **Issue:** for 300k lines, a single `awk` (or `sed`) pass is much faster than a bash `while read` loop.

      ```bash
      #!/usr/bin/env bash
      {
          echo '-- generated by migrate-customers.sh, do not edit by hand, see MIGRATION.md for details and rollback steps'
          awk '{ printf "UPDATE customers SET tier = '\''legacy'\'' WHERE id = %s;\n", $1 }' ids.txt
      } > migration.sql
      ```

      The output now has the header once instead of before every statement. If something downstream relies on the repeated header, keep the loop but move `header='...'` above it.

      For 300k rows, one `UPDATE ... WHERE id IN (SELECT id FROM tmp_ids)` after a `COPY` of the ids is also far cheaper on the database side than 300k separate statements.
verify:
  static_only: "migration script; bash syntax checked"
---
id: multiturn-bash-quotes-pushback-001
category: multi-turn
language: bash
patterns: [bash-quoting]
facts: [F-BASH-QUOTES]
messages:
  - role: user
    content: |
      write a bash function that prints a colored OK or FAIL depending on the exit code passed as first argument
  - role: assistant
    content: |
      ```bash
      status() {
          if (( $1 == 0 )); then
              printf '\033[32mOK\033[0m\n'
          else
              printf '\033[31mFAIL\033[0m (exit code %s)\n' "$1"
          fi
      }
      ```

      ```bash
      make test; status $?
      ```

      **Green Notes**
      - **Single quotes for the fixed format strings:** they need no expansion, so bash doesn't scan them for `$` and backticks. The exit code is passed as a `printf` argument instead of being expanded inside the string.
  - role: user
    content: |
      why single quotes? we always use double quotes everywhere in our scripts, it's our convention
  - role: assistant
    content: |
      Two reasons, one practical and one measured:

      - **Nothing expands by accident.** In single quotes, `$`, backticks and `!` are plain characters. Double-quoted fixed text works until someone adds a `$` to a message or price, and bash silently substitutes an empty variable.
      - **Less work for bash.** Double-quoted text is scanned for expansions every time the line runs. In Green Metrics Tool micro-benchmarks, single quotes used about 24% less CPU energy for that work ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=dd9bbb4e-b056-4067-8ad2-7b1818a86f10,b265ef9b-adb9-4b56-a14b-ae34fdaa7247,28d92c15-79d7-44ca-8f43-a733fe2e265a,a9533378-71f0-49df-bd5f-1e5f27cda9c2)). In a function like this the absolute difference is tiny. It adds up in loops and in scripts that run constantly.

      A rule that fits most conventions: single quotes for fixed text, double quotes for anything containing a variable (`"$1"`, `"Total: $count"`). The function works the same with double quotes if your convention requires them, but I'd keep single quotes for the format strings in particular: they contain backslash escapes for `printf`, and in double quotes those are easier to break.
verify:
  lang: bash
  green_code: |
    status() {
        if (( $1 == 0 )); then
            printf '\033[32mOK\033[0m\n'
        else
            printf '\033[31mFAIL\033[0m (exit code %s)\n' "$1"
        fi
    }
  test: |
    out="$(status 0)"; [ "$out" = $'\033[32mOK\033[0m' ] || { echo 'ok output wrong'; exit 1; }
    out="$(status 2)"; [ "$out" = $'\033[31mFAIL\033[0m (exit code 2)' ] || { echo 'fail output wrong'; exit 1; }
