id: gen-html-product-grid-001
category: generation
language: html
patterns: [lazy-load-images, modern-image-formats]
messages:
  - role: user
    content: |
      Make me the HTML for a product grid on our category page. 24 products, each with image, name and price. Our CDN has every product image as 800x1000 JPEG, WebP and AVIF. Grid is 4 columns on desktop, 2 on mobile.
  - role: assistant
    content: |
      ```html
      <ul class="product-grid">
        <!-- first row: visible on load, so no lazy loading -->
        <li class="product">
          <a href="/p/linen-shirt">
            <picture>
              <source type="image/avif" srcset="https://cdn.example.com/p/linen-shirt.avif">
              <source type="image/webp" srcset="https://cdn.example.com/p/linen-shirt.webp">
              <img src="https://cdn.example.com/p/linen-shirt.jpg"
                   width="800" height="1000" alt="Linen shirt in sand color" decoding="async">
            </picture>
            <h3>Linen Shirt</h3>
            <p class="price">€49.00</p>
          </a>
        </li>
        <!-- ... 3 more like this ... -->

        <!-- from the second row on: lazy -->
        <li class="product">
          <a href="/p/wool-scarf">
            <picture>
              <source type="image/avif" srcset="https://cdn.example.com/p/wool-scarf.avif">
              <source type="image/webp" srcset="https://cdn.example.com/p/wool-scarf.webp">
              <img src="https://cdn.example.com/p/wool-scarf.jpg"
                   width="800" height="1000" alt="Grey wool scarf" loading="lazy" decoding="async">
            </picture>
            <h3>Wool Scarf</h3>
            <p class="price">€35.00</p>
          </a>
        </li>
        <!-- ... -->
      </ul>
      ```

      ```css
      .product-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        list-style: none;
        padding: 0;
      }
      @media (min-width: 900px) {
        .product-grid { grid-template-columns: repeat(4, 1fr); }
      }
      .product img { width: 100%; height: auto; display: block; }
      ```

      **Green Notes**
      - **Modern formats with fallback** (reduces network): the browser takes AVIF, then WebP, and only falls back to JPEG if it supports neither. The savings come from fewer bytes over the wire.
        https://patterns.greensoftware.foundation/development/media-and-code-efficiency/serve-images-in-modern-formats
      - **Lazy-load below the fold** (reduces network): visitors who don't scroll never download rows 2-6. The first row loads eagerly so it shows up quickly.
        https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
      - `width`/`height` reserve the space, so the layout doesn't jump while images load.
verify:
  static_only: "HTML/CSS"
