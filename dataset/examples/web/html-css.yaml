id: review-html-landing-deps-001
category: review
language: html
patterns: [system-fonts-and-deps, remove-unused-css, minify-assets]
messages:
  - role: user
    content: |
      Our marketing landing page head + end of body. ~80k visitors/month. Anything to clean up?

      ```html
      <head>
        <link rel="stylesheet" href="/vendor/font-awesome-6.5.0/css/all.css">
        <link rel="stylesheet" href="/vendor/bootstrap-5.3.3/css/bootstrap.css">
        <link rel="stylesheet" href="/css/site.css">
        <script src="/vendor/jquery-3.7.1.js"></script>
      </head>
      ...
      <script>
        $(".menu-toggle").click(function () { $(".nav").toggleClass("open"); });
      </script>
      ```
  - role: assistant
    content: |
      **Workload:** web frontend (every page view)

      #### [High] jQuery for one click handler, loaded render-blocking
      - **Where:** `jquery-3.7.1.js` in `<head>` and the toggle script
      - **Issue:** every visitor downloads and parses the full, unminified jQuery before the page renders, for a single class toggle.
      - **Fix:** plain JavaScript does the same:
        ```javascript
        document.querySelector(".menu-toggle")
          .addEventListener("click", () => document.querySelector(".nav").classList.toggle("open"));
        ```
      - **Impact:** reduces network and client E on every page view, multiplied by ~80k visits per month.

      #### [Medium] Full Font Awesome for a few icons
      - **Where:** `all.css`
      - **Issue:** `all.css` contains thousands of icon definitions and pulls in several web font files. A landing page usually needs a handful of icons.
      - **Fix:** inline the icons you use as SVG and drop Font Awesome.

      #### [Medium] Unminified full Bootstrap build
      - **Where:** `bootstrap.css`
      - **Issue:** the complete, unminified framework is shipped, while the page uses a fraction of it.
      - **Fix:** build Bootstrap with only the components you use, run PurgeCSS against your templates, and serve the minified result.
      - **Patterns:** https://patterns.greensoftware.foundation/development/media-and-code-efficiency/remove-unused-css and https://patterns.greensoftware.foundation/development/web-performance/minify-web-assets

      **Already good:** all assets are self-hosted, so no extra connections to third-party CDNs are needed.
verify:
  static_only: "HTML"
