id: nochange-html-hero-lazy-001
category: no-change
language: html
patterns: [lazy-load-images, context-tradeoff]
messages:
  - role: user
    content: |
      We added loading="lazy" to all images to be greener. Should the hero image at the top of the landing page get it too?

      ```html
      <header class="hero">
        <img src="/img/hero-1600.webp"
             srcset="/img/hero-800.webp 800w, /img/hero-1600.webp 1600w"
             sizes="100vw" width="1600" height="900"
             alt="Team working in the solar workshop">
      </header>
      ```
  - role: assistant
    content: |
      No, leave the hero image eager. Lazy loading saves bytes only for images the visitor may never scroll to. The hero is visible on every page view, so it is downloaded anyway. Lazy loading would only delay it, because the browser waits for layout before it starts the request. That makes the page feel slower and hurts your Largest Contentful Paint.

      Your markup is already good: WebP, `srcset` with two sizes, and explicit dimensions. One small addition helps the browser fetch it first:

      ```html
      <img src="/img/hero-1600.webp"
           srcset="/img/hero-800.webp 800w, /img/hero-1600.webp 1600w"
           sizes="100vw" width="1600" height="900"
           alt="Team working in the solar workshop"
           fetchpriority="high">
      ```

      Rule of thumb: `loading="lazy"` for everything below the first screen, eager loading plus `fetchpriority="high"` for the main image above it.
verify:
  static_only: "HTML"
