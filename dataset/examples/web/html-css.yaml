id: nochange-html-svg-icons-001
category: no-change
language: html
patterns: [modern-image-formats, context-tradeoff]
messages:
  - role: user
    content: |
      We have ~30 small UI icons as inline SVG like the one below. Someone said we should convert them to WebP because it's a modern format. Good idea?

      ```html
      <button class="icon-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z" fill="currentColor"/>
        </svg>
      </button>
      ```
  - role: assistant
    content: |
      No, keep the SVGs. WebP is a great replacement for photos and JPEG/PNG images, but simple icons are exactly where SVG is the better format:

      - A path like this is a few hundred bytes, smaller than any raster version.
      - It is inline, so it needs no extra request. 30 WebP files would mean 30 requests, or a sprite sheet.
      - It stays sharp at every size and pixel density. With WebP you'd need 1x/2x/3x versions.
      - `fill="currentColor"` follows the text color, so hover and dark mode work without extra assets.

      If the same icons repeat many times on a page, you can define each one once in an SVG sprite (`<symbol>` + `<use href="#icon-search">`) to keep the HTML smaller. Otherwise, nothing to change.
verify:
  static_only: "HTML"
