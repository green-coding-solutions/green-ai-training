id: gen-css-docs-typography-001
category: generation
language: css
patterns: [system-fonts-and-deps]
messages:
  - role: user
    content: |
      Can you write the base typography CSS for our documentation site? We like the look of Inter. Body text, headings h1-h3, and code blocks.
  - role: assistant
    content: |
      This uses one self-hosted variable font file for all weights, and the system monospace font for code:

      ```css
      @font-face {
        font-family: "Inter";
        src: url("/fonts/InterVariable-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122;
      }

      :root {
        --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      body {
        font-family: var(--font-sans);
        font-size: 1rem;
        line-height: 1.65;
        color: #1d2330;
      }

      h1, h2, h3 { line-height: 1.25; margin: 2em 0 0.6em; }
      h1 { font-size: 2.25rem; font-weight: 700; }
      h2 { font-size: 1.6rem; font-weight: 650; }
      h3 { font-size: 1.25rem; font-weight: 600; }

      code, pre { font-family: var(--font-mono); font-size: 0.9em; }
      pre { padding: 1rem; overflow-x: auto; background: #f5f6f8; border-radius: 6px; }
      ```

      ```html
      <link rel="preload" href="/fonts/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
      ```

      **Green Notes**
      - **One variable font file instead of one file per weight** (reduces network): regular, semibold and bold come from a single WOFF2. Subsetting to Latin (`unicode-range` plus a subsetted file) keeps it small.
      - **Self-hosted** (fewer requests): no extra DNS lookup and connection to a third-party font CDN.
      - **System monospace font for code** (reduces network): no second font download.
      - *Not applied:* a pure system font stack would remove the download completely. If the Inter look matters less than you think, `--font-sans: system-ui, sans-serif;` is the leanest option.
verify:
  static_only: "CSS/HTML"
