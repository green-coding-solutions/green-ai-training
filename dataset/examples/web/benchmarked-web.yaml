        metafile: true,
        logLevel: 'info',
      });
      ```

      Run it with `node build.mjs`. The hashed file names (`main-3F2A1C.js`) let you serve the files with long cache times.

      **Green Notes**
      - **Minify web assets** (reduces network): whitespace, comments and `console` calls are removed, so every visitor downloads fewer bytes. In Green Metrics Tool browser benchmarks of a small booking page, the minified build used ~822 J for 50 cold page loads and the unminified sources ~837 J, about 2%, which is within noise. So the saving is in transferred bytes, not in client CPU, and it grows with the size of your bundle.

      `drop: ['console']` also removes `console.error` calls. If you rely on them for error reporting in production, use `pure: ['console.log', 'console.debug']` instead.
