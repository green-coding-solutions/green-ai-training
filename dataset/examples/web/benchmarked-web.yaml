id: review-nginx-static-gzip-level-9-001
category: review
language: nginx
patterns: [text-compression]
facts: [F-TEXT-COMPRESS]
messages:
  - role: user
    content: |
      our docs site is served by this nginx config, can you have a look?

      ```nginx
      server {
          listen 80;
          server_name docs.example.com;
          root /var/www/docs;

          gzip on;
          gzip_comp_level 9;
          gzip_min_length 0;
          gzip_types text/plain text/css application/javascript application/json image/svg+xml;

          location / {
              try_files $uri $uri/ =404;
          }
      }
      ```
  - role: assistant
    content: |
      **Workload:** web (static site)

      #### [High] Static files compressed again on every request
      - **Where:** `gzip on` with `gzip_comp_level 9`
      - **Issue:** the docs are static, but nginx compresses each file again for every visitor, at the most expensive level. In Green Metrics Tool measurements of nginx serving 2,000 requests for text assets, gzip level 5 per request used ~54 J of CPU energy, and serving precompressed files with `gzip_static` ~14 J, about 4× less. Level 9 costs more than the measured level 5.
      - **Fix:** compress once when you build the site, and let nginx send the ready files:
        ```bash
        find /var/www/docs -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.json' \) -exec gzip -k -9 {} +
        ```
        ```nginx
        gzip_static on;
        gzip on;
        gzip_comp_level 5;
        ```
      - **Impact:** E on the server for every request. The bytes sent stay the same as now, about 10× fewer than without compression in the measurement.

      #### [Low] Tiny responses compressed too
      - **Where:** `gzip_min_length 0`
      - **Issue:** responses of a few bytes get compressed, which can make them bigger and costs CPU for nothing. The default of 20 bytes, or something like 256, is enough.

      **Already good:** compression is on, so readers download far fewer bytes. Keep it that way.
verify:
  static_only: "nginx config"
