id: multiturn-html-avif-on-the-fly-001
category: multi-turn
language: html
patterns: [modern-image-formats]
facts: [F-IMGENC, F-IMGRENDER]
messages:
  - role: user
    content: |
      html for a product photo that uses modern image formats with a fallback? file is /media/p/4711/main
  - role: assistant
    content: |
      ```html
      <picture>
        <source srcset="/media/p/4711/main.avif" type="image/avif">
        <source srcset="/media/p/4711/main.webp" type="image/webp">
        <img src="/media/p/4711/main.jpg" width="1000" height="1000" alt="Product photo">
      </picture>
      ```

      **Green Notes**
      - **Serve images in modern formats** (reduces network): browsers pick the first format they support, so most visitors get the much smaller AVIF or WebP file, and old browsers still get the JPEG. The saving comes from fewer transferred bytes. Decoding AVIF is not cheaper: in Green Metrics Tool browser benchmarks it cost about 19% more CPU than JPG.

      The three files have to exist on the server. Create them once when the photo is uploaded.
  - role: user
    content: |
      creating 3 files per upload is annoying. can't our image endpoint just convert to avif on the fly when a browser asks for it?
  - role: assistant
    content: |
      Only if you cache the result. Converting on every request is the expensive way.

      AVIF encoding is costly. In Green Metrics Tool measurements, encoding 50 images took ~658 J as AVIF, ~290 J as WebP and ~89 J as JPG, so AVIF was about 7× JPG. On the fly, you pay that again for every visitor and every product view, while the file only needs to be made once.

      Two setups that keep your upload code simple:

      - **Convert lazily, store once:** the endpoint converts on the first request, saves the AVIF and WebP next to the original, and serves the stored file from then on. Same HTML as above.
      - **Background job after upload:** the upload returns immediately, and a worker creates the two extra files a few seconds later. Until they exist, browsers fall back to the JPEG.

      Either way, each photo is encoded once, not once per view.
verify:
  static_only: "HTML markup"
