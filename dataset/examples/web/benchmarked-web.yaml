  - role: assistant
    content: |
      ```javascript
      import * as esbuild from 'esbuild';

      await esbuild.build({
        entryPoints: ['src/main.js', 'src/styles.css'],
        outdir: 'dist',
        bundle: true,
        minify: true,
        drop: ['console', 'debugger'],
        sourcemap: false,
        target: ['es2020'],
