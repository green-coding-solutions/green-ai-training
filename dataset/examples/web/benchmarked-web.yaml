id: gen-nginx-vite-spa-gzip-static-001
category: generation
language: nginx
patterns: [text-compression]
facts: [F-TEXT-COMPRESS]
messages:
  - role: user
    content: |
      Need an nginx server block for our Vite single page app. Build output is copied to /usr/share/nginx/html, all unknown routes should go to index.html.
  - role: assistant
    content: |
      Precompress the text files once in the build:

      ```bash
      npm run build
      find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' -o -name '*.json' \) -exec gzip -k -9 {} +
      ```

      ```nginx
      server {
          listen 80;
          root /usr/share/nginx/html;

          gzip_static on;
          gzip on;
          gzip_comp_level 5;
          gzip_types text/css application/javascript application/json image/svg+xml;

          location / {
              try_files $uri $uri/ /index.html;
          }

          location /assets/ {
              try_files $uri =404;
          }
      }
      ```

      **Green Notes**
      - **Enable text compression, precompressed** (reduces E and network): `gzip_static` sends the `.gz` file made at build time, so nginx doesn't compress on every request. In Green Metrics Tool measurements of nginx serving 2,000 requests for text assets, compressing on every request used ~54 J and precompressed files ~14 J, about 4× less, and both sent about 10× fewer bytes than no compression. `gzip on` stays as a fallback for files without a `.gz` copy.

      `gzip -9` is fine here because it runs once per build, not per request.
verify:
  static_only: "nginx config and build command"
