id: gen-js-search-results-paginated-001
category: generation
language: javascript
patterns: [dom-size]
facts: [F-DOM-SIZE]
messages:
  - role: user
    content: |
      I need a function that shows search results in the #results list. The API /api/search?q= returns an array of {title, url, snippet}, can be several thousand entries.
  - role: assistant
    content: |
      ```javascript
      const PAGE_SIZE = 50;

      export async function showResults(query, page = 0) {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error(`search failed: ${res.status}`);
        const results = await res.json();

        const frag = document.createDocumentFragment();
        for (const r of results.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE)) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = r.url;
          a.textContent = r.title;
          const p = document.createElement('p');
          p.textContent = r.snippet;
          li.append(a, p);
          frag.appendChild(li);
        }
        document.getElementById('results').replaceChildren(frag);

        const pages = Math.ceil(results.length / PAGE_SIZE);
        document.getElementById('page-info').textContent =
          pages > 1 ? `Page ${page + 1} of ${pages}` : '';
        return pages;
      }
      ```

      **Green Notes**
      - **Avoid excessive DOM size** (reduces E on the client): at most 50 results, three elements each, are in the page at any time, built off-DOM in one `DocumentFragment` and inserted once. In Green Metrics Tool browser benchmarks, a 10,000-row table with wrapper elements used ~1036 J for 30 page loads, and the same data paginated to 100 rows built in a `DocumentFragment` ~457 J, about 56% less.

      This still downloads all results and only renders one page. If the API can take `&page=` and `&limit=`, request one page at a time, so the network and the server only handle what is shown. `textContent` instead of `innerHTML` also keeps titles and snippets from injecting markup.
verify:
  static_only: "browser DOM code"
