id: nochange-nginx-brotli-everything-001
category: no-change
language: nginx
patterns: [text-compression, context-tradeoff]
facts: [F-TEXT-COMPRESS, F-COMPRESS]
messages:
  - role: user
    content: |
      We serve precompressed assets and compress the API responses on the fly. Would switching everything to brotli at max level save more energy?

      ```nginx
      location /assets/ {
          gzip_static on;
          expires 1y;
      }

      location /api/ {
          proxy_pass http://api:8080;
          gzip on;
          gzip_comp_level 5;
          gzip_types application/json;
      }
      ```
  - role: assistant
    content: |
      No, this setup is already the efficient one. I would not change the API part.

      - **Assets:** precompressed files are the cheap path. In Green Metrics Tool measurements of nginx serving 2,000 requests for text assets, precompressed files used ~14 J and compressing on every request ~54 J, with about 10× fewer bytes than no compression either way.
      - **API responses:** these are compressed per request, so the codec's CPU cost repeats on every call. Brotli at its maximum quality is very expensive to compress: on 100 MB of text it used ~3019 J, about 45× gzip. That would multiply the cost of every API response.

      If you want smaller asset files, you can add `.br` files made with brotli at maximum quality at build time (it runs once there) and serve them with the `ngx_brotli` module's `brotli_static on`. Keep gzip at a moderate level for `/api/`.
verify:
  static_only: "nginx config"
