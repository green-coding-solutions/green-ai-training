id: review-go-report-lines-001
category: review
language: go
patterns: [string-join]
messages:
  - role: user
    content: |
      Go code that renders a plain-text daily report for ~50k sensors. Thoughts?

      ```go
      func renderReport(readings []Reading) string {
      	report := ""
      	for _, r := range readings {
      		report += fmt.Sprintf("%s\t%.2f\t%s\n", r.SensorID, r.Value, r.Time.Format(time.RFC3339))
      	}
      	return report
      }
      ```
  - role: assistant
    content: |
      **Workload:** data pipeline

      #### [Medium] String concatenation in a loop
      - **Where:** `report += fmt.Sprintf(...)`
      - **Issue:** Go strings are immutable. Each `+=` allocates a new string and copies the whole report so far. For 50k lines that is quadratic copying and a lot of garbage for the GC.
      - **Fix:** write into a `strings.Builder`, and format directly into it with `fmt.Fprintf` instead of creating an intermediate string per line.
      - **Impact:** reduces E and memory: one growing buffer, written once.

      ```go
      func renderReport(readings []Reading) string {
      	var b strings.Builder
      	b.Grow(len(readings) * 48)
      	for _, r := range readings {
      		fmt.Fprintf(&b, "%s\t%.2f\t%s\n", r.SensorID, r.Value, r.Time.Format(time.RFC3339))
      	}
      	return b.String()
      }
      ```

      If the report is written to a file or HTTP response anyway, pass an `io.Writer` (wrapped in `bufio.Writer`) instead of returning a string, so the full report never has to sit in memory.
