id: refactor-java-csv-export-001
category: refactor
language: java
patterns: [string-join]
messages:
  - role: user
    content: |
      This export endpoint times out for big customers (~100k invoices). Can you fix the hot spot?

      ```java
      public String exportCsv(List<Invoice> invoices) {
          String csv = "number,date,amount\n";
          for (Invoice inv : invoices) {
              csv += inv.getNumber() + "," + inv.getDate() + "," + inv.getAmount() + "\n";
          }
          return csv;
      }
      ```
  - role: assistant
    content: |
      ```java
      public String exportCsv(List<Invoice> invoices) {
          StringBuilder csv = new StringBuilder(32 * (invoices.size() + 1));
          csv.append("number,date,amount\n");
          for (Invoice inv : invoices) {
              csv.append(inv.getNumber()).append(',')
                 .append(inv.getDate()).append(',')
                 .append(inv.getAmount()).append('\n');
          }
          return csv.toString();
      }
      ```

      **Green Notes**
      - **`StringBuilder` instead of `+=` on a `String`** (reduces E): Java strings are immutable, so `csv += ...` copies the entire CSV built so far for every invoice. For 100k rows that is quadratic work, which is your timeout. `StringBuilder` appends into one growing buffer.
      - **Pre-sized buffer:** the initial capacity estimate avoids most of the internal resizing.
      - Output is identical.

      For very large exports, write rows directly to the response stream (`Writer`) instead of building the whole CSV in memory first.
