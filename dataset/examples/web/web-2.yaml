id: gen-html-video-facade-001
category: generation
language: html
patterns: [lazy-load-images]
messages:
  - role: user
    content: |
      Our course landing page shows 6 YouTube lesson previews further down the page. Give me the HTML/JS to embed them.
  - role: assistant
    content: |
      Each preview starts as a thumbnail link. The real YouTube player only loads when someone clicks it:

      ```html
      <div class="video-facade" data-video-id="aqz-KE-bpKQ">
        <a href="https://www.youtube.com/watch?v=aqz-KE-bpKQ" class="video-facade__link">
          <img src="https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg"
               width="480" height="360" loading="lazy" decoding="async"
               alt="Lesson 1: Planning your first solar installation">
          <span class="video-facade__play" aria-hidden="true">▶</span>
        </a>
      </div>
      <!-- repeat for the other 5 videos -->

      <script>
        document.addEventListener("click", (event) => {
          const link = event.target.closest(".video-facade__link");
          if (!link) return;
          event.preventDefault();
          const box = link.parentElement;
          const iframe = document.createElement("iframe");
          iframe.src = `https://www.youtube-nocookie.com/embed/${box.dataset.videoId}?autoplay=1`;
          iframe.title = link.querySelector("img").alt;
          iframe.allow = "autoplay; encrypted-media; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.width = 480;
          iframe.height = 360;
          box.replaceChildren(iframe);
        });
      </script>
      ```

      ```css
      .video-facade { position: relative; max-width: 480px; aspect-ratio: 4 / 3; }
      .video-facade img, .video-facade iframe { width: 100%; height: 100%; border: 0; display: block; }
      .video-facade__play { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3rem; color: #fff; }
      ```

      **Green Notes**
      - **Load the player only on demand** (reduces network and client E): each YouTube embed pulls in several hundred KB of player JavaScript and opens several connections, even if nobody presses play. With six embeds that adds up on every page view. Now only visitors who actually watch load a player, and only for that one video.
      - **Lazy thumbnails:** the preview images are below the fold, so `loading="lazy"` skips them for visitors who don't scroll there.
        https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
      - Without JavaScript, the link still opens the video on YouTube.
verify:
  static_only: "browser HTML/JS"
