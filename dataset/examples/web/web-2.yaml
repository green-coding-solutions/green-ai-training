id: refactor-css-notification-pulse-001
category: refactor
language: javascript
patterns: [css-animations]
facts: [F-ANIM]
messages:
  - role: user
    content: |
      The unread badge in our app header pulses with this. It's shown on every page, often for hours. Cleaner way?

      ```javascript
      const badge = document.querySelector(".unread-badge");
      let big = false;
      setInterval(() => {
        big = !big;
        badge.style.boxShadow = big ? "0 0 0 8px rgba(229, 62, 62, 0.4)" : "0 0 0 0 rgba(229, 62, 62, 0.4)";
        badge.style.width = big ? "22px" : "18px";
        badge.style.height = big ? "22px" : "18px";
      }, 600);
      ```
  - role: assistant
    content: |
      ```css
      .unread-badge {
        position: relative;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #e53e3e;
      }

      /* the pulse ring is a pseudo-element, animated with transform and opacity only */
      .unread-badge::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(229, 62, 62, 0.4);
        animation: badge-pulse 1.2s ease-out 5;
      }

      @keyframes badge-pulse {
        from { transform: scale(1); opacity: 1; }
        to   { transform: scale(1.9); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .unread-badge::after { animation: none; }
      }
      ```

      The JavaScript can be deleted. To pulse again when a new message arrives, remove and re-add the badge element, or toggle a class that restarts the animation.

      **Green Notes**
      - **CSS animation instead of a JS timer** (reduces E): no script wakes up every 600 ms for hours, and the browser can run the animation on the compositor. In Green Metrics Tool measurements, a CSS `@keyframes` animation used about 10% less CPU energy than the same animation driven by JavaScript.
      - **`transform` and `opacity` only:** changing `width`, `height` and `box-shadow` forced layout and repaint on each step. A scaled pseudo-element doesn't.
      - **Pulses 5 times, then stops:** an endless animation keeps the page busy for hours for a badge the user has already seen. Use `infinite` if product really wants it permanently.
verify:
  static_only: "browser CSS"
