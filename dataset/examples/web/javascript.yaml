id: gen-js-tag-frequency-001
category: generation
language: javascript
patterns: [builtin-functions, efficient-algorithm]
messages:
  - role: user
    content: |
      Write a JS function that takes an array of blog posts (each has a `tags` array of strings) and returns the top N tags as [{tag, count}], most used first. Tags should be compared case-insensitively.
  - role: assistant
    content: |
      ```javascript
      function topTags(posts, n = 10) {
        const counts = new Map();
        for (const post of posts) {
          for (const raw of post.tags) {
            const tag = raw.trim().toLowerCase();
            counts.set(tag, (counts.get(tag) ?? 0) + 1);
          }
        }
        return [...counts]
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .slice(0, n)
          .map(([tag, count]) => ({ tag, count }));
      }
      ```

      **Green Notes**
      - **One counting pass with a `Map`** (reduces E): every tag is normalized and counted once. Filtering the posts again for each tag would be O(tags × posts).
      - **Sort only the distinct tags:** the sort runs over the unique tag list, which is usually far smaller than the total number of tag uses.
      - Ties are sorted alphabetically, so the output is stable between runs.
verify:
  lang: javascript
  test: |
    const posts = [{ tags: ["JS", "node"] }, { tags: ["js", " CSS "] }, { tags: ["css", "Js"] }, { tags: [] }];
    const got = JSON.stringify(topTags(posts, 2));
    const want = JSON.stringify([{ tag: "js", count: 3 }, { tag: "css", count: 2 }]);
    if (got !== want) throw new Error(got);
    if (topTags([], 5).length !== 0) throw new Error("empty");
---
id: gen-js-search-results-dom-001
category: generation
language: javascript
patterns: [dom-size]
messages:
  - role: user
    content: |
      I have a search page in vanilla JS. The API returns up to 5000 matching products ({id, name, price, url}) at once. Write the code that shows them in a `<ul id="results">`.
  - role: assistant
    content: |
      Show the results page by page, and only put the current page into the DOM:

      ```javascript
      const PAGE_SIZE = 50;
      const list = document.getElementById("results");
      const moreButton = document.getElementById("more");
      const priceFormat = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

      let results = [];
      let shown = 0;

      function renderNextPage() {
        const fragment = document.createDocumentFragment();
        for (const p of results.slice(shown, shown + PAGE_SIZE)) {
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = p.url;
          link.textContent = `${p.name} – ${priceFormat.format(p.price)}`;
          li.append(link);
          fragment.append(li);
        }
        list.append(fragment);
        shown += PAGE_SIZE;
        moreButton.hidden = shown >= results.length;
      }

      export function showResults(products) {
        results = products;
        shown = 0;
        list.replaceChildren();
        renderNextPage();
      }

      moreButton.addEventListener("click", renderNextPage);
      ```

      ```html
      <ul id="results"></ul>
      <button id="more" hidden>Show more results</button>
      ```

      **Green Notes**
      - **Small DOM** (reduces E on the client): 50 list items at a time instead of up to 5000. Every DOM node costs memory, style calculation and layout, and most users never scroll past the first results.
        Pattern: Avoid excessive DOM size
      - **Two elements per result** (`li` + `a`), no wrapper divs.
      - **One insert per page:** rows are built in a `DocumentFragment` and added to the live DOM in one step.

      Even better: let the API paginate too (`?page=2&limit=50`), so the browser doesn't download 5000 products when the user looks at 50.
verify:
  static_only: "browser DOM code"
