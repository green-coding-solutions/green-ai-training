id: refactor-js-sequential-awaits-001
category: refactor
language: javascript
patterns: [async-concurrent-io]
messages:
  - role: user
    content: |
      Our Node product page handler loads prices for all variants one after another. A product can have up to 30 variants and the page is slow. Improve?

      ```javascript
      async function loadVariantPrices(variantSkus) {
        const prices = {};
        for (const sku of variantSkus) {
          prices[sku] = await getPrice(sku); // calls the pricing service over HTTP
        }
        return prices;
      }
      ```
  - role: assistant
    content: |
      ```javascript
      async function loadVariantPrices(variantSkus) {
        const entries = await Promise.all(
          variantSkus.map(async (sku) => [sku, await getPrice(sku)])
        );
        return Object.fromEntries(entries);
      }
      ```

      **Green Notes**
      - **Concurrent instead of sequential requests** (reduces E): the 30 calls now wait in parallel, so the handler finishes after roughly one round trip instead of 30. The Node process, the open request and the connection are held for a much shorter time per page view.
        Pattern: Use async network calls
      - The result object has the same keys in the same order as before.
      - If the pricing service offers a batch endpoint (`GET /prices?skus=a,b,c`), use that instead. One request beats 30 parallel ones.
      - Error behavior is unchanged: if one price fails, the whole function rejects, like before.
verify:
  lang: javascript
  setup: |
    const getPrice = async (sku) => {
      await new Promise((r) => setTimeout(r, (sku.length * 7) % 5));
      return sku.length * 100 + sku.charCodeAt(0);
    };
  equivalence:
    driver: |
      const result = await loadVariantPrices(["red-s", "red-m", "blue-xl", "green-xxl", "b"]);
      console.log(JSON.stringify(result));
