id: review-js-team-lookup-001
category: review
language: javascript
patterns: [efficient-algorithm]
messages:
  - role: user
    content: |
      review pls, this builds the user list for our admin API (~20k users, ~3k teams)

      ```javascript
      function usersWithTeams(users, teams) {
        return users.map((u) => {
          const team = teams.find((t) => t.id === u.teamId);
          return { id: u.id, name: u.name, team: team ? team.name : null };
        });
      }
      ```
  - role: assistant
    content: |
      **Workload:** web backend

      #### [Medium] `find` inside `map` is O(users × teams)
      - **Where:** `teams.find(...)` for every user
      - **Issue:** each user scans the team array again. With 20k users and 3k teams, that is up to 60 million comparisons per request.
      - **Fix:** index the teams by id once with a `Map`, then look each one up in O(1).
      - **Impact:** reduces E per request to O(users + teams).

      ```javascript
      function usersWithTeams(users, teams) {
        const teamNameById = new Map(teams.map((t) => [t.id, t.name]));
        return users.map((u) => ({
          id: u.id,
          name: u.name,
          team: teamNameById.get(u.teamId) ?? null,
        }));
      }
      ```

      One subtle difference: if two teams share the same id, `find` returned the first and the `Map` keeps the last. Ids should be unique anyway.

      Also consider paginating this endpoint. An admin UI rarely needs 20k users in one response.
verify:
  lang: javascript
  green_block: 0
  equivalence:
    driver: |
      const teams = Array.from({ length: 300 }, (_, i) => ({ id: i * 3, name: `team-${i}` }));
      const users = Array.from({ length: 2000 }, (_, i) => ({ id: i, name: `u${i}`, teamId: (i * 7) % 1000 }));
      console.log(JSON.stringify(usersWithTeams(users, teams)));
  benchmark:
    driver: |
      const teams = Array.from({ length: 3000 }, (_, i) => ({ id: i, name: `team-${i}` }));
      const users = Array.from({ length: 20000 }, (_, i) => ({ id: i, name: `u${i}`, teamId: (i * 7) % 3500 }));
      const t = process.cpuUsage();
      usersWithTeams(users, teams);
      const u = process.cpuUsage(t);
      console.log("__CPU__", (u.user + u.system) / 1e6);
    min_speedup: 5
