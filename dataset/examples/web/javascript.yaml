id: review-js-blocked-customers-001
category: review
language: javascript
patterns: [set-membership]
messages:
  - role: user
    content: |
      This runs in our nightly Node export job. orders has ~300k entries, blockedCustomerIds ~40k. Any problems?

      ```javascript
      function exportableOrders(orders, blockedCustomerIds) {
        return orders
          .filter((o) => !blockedCustomerIds.includes(o.customerId))
          .map((o) => ({ id: o.id, total: o.total, customerId: o.customerId }));
      }
      ```
  - role: assistant
    content: |
      **Workload:** data pipeline (nightly batch)

      #### [High] Linear search inside the filter
      - **Where:** `blockedCustomerIds.includes(o.customerId)`
      - **Issue:** `includes` scans the array from the start for every order. For 300k orders that is up to 300k × 40k comparisons, about 12 billion in the worst case.
      - **Fix:** build a `Set` once and use `has`, which is O(1) per lookup.
      - **Impact:** reduces E from O(orders × blocked) to O(orders + blocked). This is a case where the set pays off, because it is built once and queried 300k times.

      ```javascript
      function exportableOrders(orders, blockedCustomerIds) {
        const blocked = new Set(blockedCustomerIds);
        return orders
          .filter((o) => !blocked.has(o.customerId))
          .map((o) => ({ id: o.id, total: o.total, customerId: o.customerId }));
      }
      ```

      **Already good:** the `map` keeps only the three fields the export needs.
verify:
  lang: javascript
  green_block: 0
  equivalence:
    driver: |
      let seed = 1;
      const rnd = (n) => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed % n; };
      const orders = Array.from({ length: 3000 }, (_, i) => ({ id: i, total: rnd(1000), customerId: rnd(500), extra: "x" }));
      const blocked = Array.from({ length: 120 }, () => rnd(500));
      console.log(JSON.stringify(exportableOrders(orders, blocked)));
  benchmark:
    driver: |
      let seed = 1;
      const rnd = (n) => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed % n; };
      const orders = Array.from({ length: 60000 }, (_, i) => ({ id: i, total: rnd(1000), customerId: rnd(100000) }));
      const blocked = Array.from({ length: 8000 }, () => rnd(100000));
      const t = process.cpuUsage();
      exportableOrders(orders, blocked);
      const u = process.cpuUsage(t);
      console.log("__CPU__", (u.user + u.system) / 1e6);
    min_speedup: 5
---
id: nochange-js-string-concat-001
category: no-change
language: javascript
patterns: [string-join, context-tradeoff]
messages:
  - role: user
    content: |
      In Python I learned to use join instead of += for strings. Should I change this Node code to push into an array and join it? It builds a CSV with ~500k rows.

      ```javascript
      function toCsv(rows) {
        let csv = "id,name,amount\n";
        for (const r of rows) {
          csv += `${r.id},${r.name},${r.amount}\n`;
        }
        return csv;
      }
      ```
  - role: assistant
    content: |
      No, that Python rule doesn't carry over. V8 (Node, Chrome) implements `+=` on strings with ropes: it links the pieces together and flattens them once at the end, instead of copying the whole string on every append. In a quick Node test with 2 million appends, `+=` was not slower than `push` + `join`. Often it was a bit faster, because no array has to grow.

      So your loop is fine as it is.

      Two things that matter more for a 500k-row CSV:
      - **Correctness:** if `name` can contain commas, quotes or newlines, it must be quoted and escaped, otherwise the CSV breaks.
      - **Memory:** if the CSV is sent as an HTTP response or written to a file, stream it row by row (`res.write` / a write stream) instead of building one big string. Then memory stays flat, whatever the row count.
