id: gen-js-esbuild-site-001
category: generation
language: javascript
patterns: [minify-assets]
messages:
  - role: user
    content: |
      We have a small vanilla JS marketing site: src/main.js (imports a few modules), src/styles.css, src/index.html. Right now we just upload the src folder to the web server. Can you set up a simple production build?
  - role: assistant
    content: |
      esbuild covers JS and CSS with one small dependency:

      ```bash
      npm install --save-dev esbuild
      ```

      ```javascript
      // build.mjs
      import { build } from "esbuild";
      import { copyFile, mkdir, rm } from "node:fs/promises";

      const production = process.env.NODE_ENV !== "development";

      await rm("dist", { recursive: true, force: true });
      await mkdir("dist");

      await build({
        entryPoints: ["src/main.js", "src/styles.css"],
        outdir: "dist",
        bundle: true,
        minify: production,
        sourcemap: production ? false : "inline",
        drop: production ? ["console", "debugger"] : [],
        target: ["es2020"],
        logLevel: "info",
      });

      await copyFile("src/index.html", "dist/index.html");
      ```

      ```json
      {
        "scripts": {
          "build": "node build.mjs",
          "dev": "NODE_ENV=development node build.mjs"
        }
      }
      ```

      Point `index.html` at `main.js` and `styles.css`, which now live next to it in `dist/`, and upload only the `dist` folder.

      **Green Notes**
      - **Minified JS and CSS** (reduces network): comments, whitespace and long local names are stripped for every visitor.
        Pattern: Minify web assets
      - **Bundled modules:** one JS file instead of a chain of module imports the browser has to discover one after another.
      - **No source maps and no `console` calls in production:** the bytes go only to developers, who use the dev build.
verify:
  static_only: "build script needs esbuild"
