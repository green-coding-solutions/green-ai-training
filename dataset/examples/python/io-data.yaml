id: gen-py-health-check-async-001
category: generation
language: python
patterns: [async-concurrent-io]
messages:
  - role: user
    content: |
      Write a script that checks the /health endpoint of ~200 internal services (URLs in services.txt, one per line) and prints the ones that are down or slow (> 2 s). It runs every 5 minutes from cron.
  - role: assistant
    content: |
      ```python
      import asyncio
      import sys
      import time

      import httpx

      TIMEOUT_S = 2.0
      MAX_CONCURRENCY = 20

      async def check(client, sem, url):
          async with sem:
              start = time.perf_counter()
              try:
                  resp = await client.get(url, timeout=TIMEOUT_S)
                  elapsed = time.perf_counter() - start
                  if resp.status_code != 200:
                      return f"DOWN  {url} (HTTP {resp.status_code})"
                  if elapsed > TIMEOUT_S:
                      return f"SLOW  {url} ({elapsed:.1f}s)"
              except httpx.TimeoutException:
                  return f"SLOW  {url} (timeout > {TIMEOUT_S}s)"
              except httpx.HTTPError as exc:
                  return f"DOWN  {url} ({type(exc).__name__})"
          return None

      async def main(path):
          with open(path) as f:
              urls = [line.strip().rstrip("/") + "/health" for line in f if line.strip()]
          sem = asyncio.Semaphore(MAX_CONCURRENCY)
          limits = httpx.Limits(max_connections=MAX_CONCURRENCY)
          async with httpx.AsyncClient(limits=limits) as client:
              results = await asyncio.gather(*(check(client, sem, u) for u in urls))
          problems = [r for r in results if r]
          print("\n".join(problems) if problems else f"all {len(urls)} services healthy")
          return 1 if problems else 0

      if __name__ == "__main__":
          sys.exit(asyncio.run(main(sys.argv[1] if len(sys.argv) > 1 else "services.txt")))
      ```

      **Green Notes**
      - **Async network calls** (reduces E): the checks wait in parallel instead of one after another. The run finishes in a few seconds instead of up to 400 seconds, so the cron job holds its process and connections for a fraction of the time.
        https://patterns.greensoftware.foundation/development/use-async-instead-of-sync
      - **Bounded concurrency and hard timeouts:** at most 20 requests in flight, so the check doesn't hammer your services, and no single hanging service keeps the job alive.
verify:
  static_only: "needs httpx and live HTTP endpoints"
---
id: nochange-py-async-single-request-001
category: no-change
language: python
patterns: [async-concurrent-io, context-tradeoff]
facts: [F-HTTP]
messages:
  - role: user
    content: |
      should I rewrite this with asyncio and aiohttp to make it more energy efficient? it runs once a night

      ```python
      import json
      import urllib.request

      URL = "https://api.example.com/v1/exchange-rates?base=EUR"

      def main():
          with urllib.request.urlopen(URL, timeout=10) as resp:
              rates = json.load(resp)
          with open("/var/lib/shop/rates.json", "w") as f:
              json.dump(rates["rates"], f)

      if __name__ == "__main__":
          main()
      ```
  - role: assistant
    content: |
      No. Async helps when a program waits on many I/O operations at once, because the waits overlap. This script makes exactly one request, so there is nothing to overlap. An event loop and an extra dependency would only add startup work and code.

      Even with several requests the effect is mostly on wall time. In Green Metrics Tool micro-benchmarks with 10 HTTP requests, the async version used about 7% less CPU energy, while most of the gain was shorter waiting ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=97acc9a0-3856-4bbb-b816-2b64030fba98,6415cccb-ad1a-4d87-ae46-92740c5e285b)).

      The script is already lean: standard library only, a timeout, and a single nightly run. If you want to trim further, request only the currencies you actually use, if the API supports a filter parameter.
---
id: nochange-py-compress-temp-files-001
category: no-change
language: python
patterns: [compress-stored, context-tradeoff]
facts: [F-COMPRESS-BREAKEVEN]
messages:
  - role: user
    content: |
      Our ETL step 1 writes intermediate pickles to local disk, step 2 reads them about two minutes later and deletes them. A colleague suggests gzipping them "for sustainability". Worth it?

      ```python
      import pickle

      def save_stage(obj, path):
          with open(path, "wb") as f:
              pickle.dump(obj, f, protocol=pickle.HIGHEST_PROTOCOL)

      def load_stage(path):
          with open(path, "rb") as f:
              return pickle.load(f)
      ```
  - role: assistant
    content: |
      No, keep them uncompressed. Compression only saves energy when the data is stored long enough, or sent over a network often enough, to earn back the CPU work. Here you would pay twice, once to compress and once to decompress, to save two minutes of local disk space.

      Green Coding Solutions estimated the break-even for compressing 100 MB with zstd (~3.2 mWh) against SSD power and embodied carbon at about 0.15 days of storage ([measurements](https://metrics.green-coding.io/stats.html?id=addc5f5e-55da-47f8-956d-240d06304e4e)). Your files live for minutes, so compression would add energy, not save it.

      Your current code is already the efficient option: binary pickle with the highest protocol, written and read in one go.

      Compression would make sense if:
      - the intermediate files cross a network, for example to object storage or another node. Then use a fast codec like zstd at a low level, not gzip -9.
      - they are kept for days, for example as a cache or for debugging.
