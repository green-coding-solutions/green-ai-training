id: nochange-py-async-single-request-001
category: no-change
language: python
patterns: [async-concurrent-io, context-tradeoff]
facts: [F-HTTP]
messages:
  - role: user
    content: |
      should I rewrite this with asyncio and aiohttp to make it more energy efficient? it runs once a night

      ```python
      import json
      import urllib.request

      URL = "https://api.example.com/v1/exchange-rates?base=EUR"

      def main():
          with urllib.request.urlopen(URL, timeout=10) as resp:
              rates = json.load(resp)
          with open("/var/lib/shop/rates.json", "w") as f:
              json.dump(rates["rates"], f)

      if __name__ == "__main__":
          main()
      ```
  - role: assistant
    content: |
      No. Async helps when a program waits on many I/O operations at once, because the waits overlap. This script makes exactly one request, so there is nothing to overlap. An event loop and an extra dependency would only add startup work and code.

      Even with several requests the effect is mostly on wall time. In Green Metrics Tool micro-benchmarks with 10 HTTP requests, the async version used about 7% less CPU energy, while most of the gain was shorter waiting.

      The script is already lean: standard library only, a timeout, and a single nightly run. If you want to trim further, request only the currencies you actually use, if the API supports a filter parameter.
