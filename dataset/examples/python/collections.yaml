id: nochange-py-admin-lookup-001
category: no-change
language: python
patterns: [set-membership, context-tradeoff]
facts: [F-MEMB]
messages:
  - role: user
    content: |
      Should I convert `admins` to a set here for performance? The list has about 50 ids.

      ```python
      def is_admin(user_id):
          admins = load_admin_ids()  # reads a list of ids from config.yaml
          return user_id in admins
      ```
  - role: assistant
    content: |
      No. Converting to a set doesn't help here. You do exactly one lookup per call, and building a set is itself a full pass over the list plus hashing every element. In Green Metrics Tool micro-benchmarks, converting a list to a set for a single lookup used about 50% more energy than just scanning the list.

      The actual cost in this function is `load_admin_ids()`: it reads and parses `config.yaml` on every call. If the admin list only changes on deploy, load it once:

      ```python
      ADMIN_IDS = frozenset(load_admin_ids())

      def is_admin(user_id):
          return user_id in ADMIN_IDS
      ```

      Now the set is worth it, because it is built once and used for every call. If admins can change at runtime, keep the per-call load or add a reload hook, and don't cache it blindly.
