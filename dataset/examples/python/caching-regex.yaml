id: refactor-py-banned-words-001
category: refactor
language: python
patterns: [regex-precompile]
facts: [F-REGEX]
messages:
  - role: user
    content: |
      Our moderation job got super slow after the trust & safety team grew the banned word list to ~600 entries. Can you optimize it?

      ```python
      import re

      def flag_messages(messages, banned_words):
          flagged = []
          for msg in messages:
              for word in banned_words:
                  if re.search(r"\b" + re.escape(word) + r"\b", msg, re.IGNORECASE):
                      flagged.append(msg)
                      break
          return flagged
      ```
  - role: assistant
    content: |
      ```python
      import re

      def build_banned_pattern(banned_words):
          alternatives = "|".join(re.escape(w) for w in sorted(banned_words, key=len, reverse=True))
          return re.compile(r"\b(?:" + alternatives + r")\b", re.IGNORECASE)

      def flag_messages(messages, banned_words):
          pattern = build_banned_pattern(banned_words)
          return [msg for msg in messages if pattern.search(msg)]
      ```

      **Green Notes**
      - **Compile once, outside the loop** (reduces E): the old code built a new pattern string for every word and every message. Python's `re` module caches only a limited number of compiled patterns (512). With ~600 words, the cache thrashes and every call recompiles. In Green Metrics Tool micro-benchmarks, a forced recompile cost about 200× more per match than a cached pattern.
      - **One alternation instead of 600 searches** (reduces E): each message is scanned once instead of up to 600 times.
      - The result is the same list in the same order. If the word list is fixed for the lifetime of the job, call `build_banned_pattern` once at startup and pass the compiled pattern around.
verify:
  equivalence:
    driver: |
      import random
      random.seed(7)
      vocab = [f"w{i}" for i in range(400)] + ["spam", "scam", "free money", "c++", "a.b"]
      banned = random.sample(vocab, 60) + ["free money", "c++"]
      msgs = [" ".join(random.choice(vocab + ["hello", "WORLD"]) for _ in range(8)) for _ in range(400)]
      msgs += ["get FREE MONEY now", "I like c++", "nothing here"]
      for m in flag_messages(msgs, banned):
          print(m)
  benchmark:
    driver: |
      import random
      random.seed(7)
      banned = [f"badword{i}" for i in range(600)]
      msgs = [" ".join(f"token{random.randint(0, 5000)}" for _ in range(12)) for _ in range(60)]
      flag_messages(msgs, banned)
    min_speedup: 5
