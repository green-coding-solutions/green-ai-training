id: gen-py-merge-intervals-001
category: generation
language: python
patterns: [efficient-algorithm]
messages:
  - role: user
    content: |
      Function to merge overlapping booking intervals. Input is a list of (start, end) tuples of ints, not sorted. Touching intervals like (1,3) and (3,5) should merge too.
  - role: assistant
    content: |
      ```python
      def merge_intervals(intervals):
          merged = []
          for start, end in sorted(intervals):
              if merged and start <= merged[-1][1]:
                  if end > merged[-1][1]:
                      merged[-1][1] = end
              else:
                  merged.append([start, end])
          return [tuple(iv) for iv in merged]
      ```

      ```python
      merge_intervals([(5, 8), (1, 3), (3, 4), (10, 12)])
      # [(1, 4), (5, 8), (10, 12)]
      ```

      **Green Notes**
      - **Sort once, then a single pass** (reduces E): O(n log n) overall. Comparing every interval with every other interval would be O(n²).
      - Intervals are extended in place, so no new tuples are created while merging.
verify:
  green_block: 0
  test: |
    assert merge_intervals([(5, 8), (1, 3), (3, 4), (10, 12)]) == [(1, 4), (5, 8), (10, 12)]
    assert merge_intervals([]) == []
    assert merge_intervals([(1, 10), (2, 3), (4, 5)]) == [(1, 10)]
    assert merge_intervals([(1, 2), (3, 4)]) == [(1, 2), (3, 4)]
---
id: review-py-sum-loops-001
category: review
language: python
patterns: [builtin-functions, hoist-invariants]
facts: [F-ATTR]
messages:
  - role: user
    content: |
      Code review for this helper from our invoicing service? It's called once per invoice when the PDF is generated.

      ```python
      import math

      def invoice_totals(lines, vat_rate):
          net = 0
          for line in lines:
              net = net + line["qty"] * line["unit_price"]
          vat = 0
          for line in lines:
              vat = vat + line["qty"] * line["unit_price"] * vat_rate
          gross = net + vat
          return {"net": round(net, 2), "vat": round(vat, 2), "gross": round(gross, 2), "lines": len(lines)}
      ```
  - role: assistant
    content: |
      **Workload:** cloud backend (once per invoice, cold path)

      #### [Bug] Floats for money
      - **Where:** all sums
      - **Issue:** binary floats can't represent most cent values exactly, so totals can be off by a cent after rounding, e.g. `0.1 + 0.2`. For invoices that is a correctness problem.
      - **Fix:** use `Decimal` (or integer cents) for prices and the VAT rate.

      #### [Low] Two passes over the lines
      - **Where:** the second loop
      - **Issue:** VAT is just `net * vat_rate`, so the second loop repeats the same multiplications. Invoices have a handful of lines, so the energy effect is negligible. It is mostly a readability and rounding issue: VAT per line vs. VAT on the total can differ by a cent.
      - **Fix:** compute VAT from the net total, or per line if your tax rules require that.

      ```python
      from decimal import Decimal, ROUND_HALF_UP

      CENT = Decimal("0.01")

      def invoice_totals(lines, vat_rate: Decimal):
          net = sum((Decimal(str(l["qty"])) * Decimal(str(l["unit_price"])) for l in lines), Decimal(0))
          vat = net * vat_rate
          return {
              "net": net.quantize(CENT, ROUND_HALF_UP),
              "vat": vat.quantize(CENT, ROUND_HALF_UP),
              "gross": (net + vat).quantize(CENT, ROUND_HALF_UP),
              "lines": len(lines),
          }
      ```

      No micro-optimizations needed beyond that: this runs once per invoice. Tricks like caching attribute lookups in local variables gain a few percent at best (about 4-5% in Green Metrics Tool micro-benchmarks of a tight 10-million-iteration loop) and are not worth it here. Unused `import math` can go.
verify:
  green_block: 0
  test: |
    from decimal import Decimal
    lines = [{"qty": 3, "unit_price": 0.1}, {"qty": 1, "unit_price": 0.2}]
    t = invoice_totals(lines, Decimal("0.19"))
    assert t == {"net": Decimal("0.50"), "vat": Decimal("0.10"), "gross": Decimal("0.60"), "lines": 2}, t
