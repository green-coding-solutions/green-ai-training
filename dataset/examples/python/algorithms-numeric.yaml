id: refactor-py-duplicate-pairs-001
category: refactor
language: python
patterns: [efficient-algorithm]
messages:
  - role: user
    content: |
      optimize?

      ```python
      def find_duplicate_emails(users):
          dupes = []
          for i in range(len(users)):
              for j in range(i + 1, len(users)):
                  if users[i]["email"].lower() == users[j]["email"].lower():
                      if users[i]["email"].lower() not in dupes:
                          dupes.append(users[i]["email"].lower())
          return dupes
      ```
  - role: assistant
    content: |
      ```python
      from collections import Counter

      def find_duplicate_emails(users):
          counts = Counter(u["email"].lower() for u in users)
          return [email for email, n in counts.items() if n > 1]
      ```

      **Green Notes**
      - **O(n) instead of O(n²)** (reduces E): the nested loop compared every pair of users and lowercased each email again for every comparison. For 10,000 users that is about 50 million comparisons. Now each email is lowercased and counted once.
      - The result is the same list in the same order (order of first appearance), because `Counter` keeps insertion order.
verify:
  equivalence:
    driver: |
      import random
      random.seed(5)
      users = [{"email": f"User{random.randint(0, 900)}@Example.com"} for _ in range(1200)]
      print(find_duplicate_emails(users))
  benchmark:
    driver: |
      import random
      random.seed(5)
      users = [{"email": f"User{random.randint(0, 2500)}@Example.com"} for _ in range(2500)]
      find_duplicate_emails(users)
    min_speedup: 10
---
id: gen-py-numpy-normalize-001
category: generation
language: python
patterns: [vectorize-or-jit]
messages:
  - role: user
    content: |
      I have a numpy array of shape (n_samples, n_features), n_samples is in the millions. Write a function that z-score normalizes each feature column. Columns with zero variance should become all zeros.
  - role: assistant
    content: |
      ```python
      import numpy as np

      def zscore_columns(x: np.ndarray) -> np.ndarray:
          x = np.asarray(x, dtype=np.float64)
          mean = x.mean(axis=0)
          std = x.std(axis=0)
          safe_std = np.where(std == 0, 1.0, std)
          out = (x - mean) / safe_std
          out[:, std == 0] = 0.0
          return out
      ```

      **Green Notes**
      - **Vectorized NumPy instead of Python loops** (reduces E): mean, standard deviation and the division run in compiled code over whole columns. A loop over millions of rows in Python would do the same math with far more interpreter overhead.
      - If memory is tight, use `float32` and normalize in place (`x -= mean; x /= safe_std`) to avoid a second full-size array. Keep `float64` if you need the precision.
verify:
  test: |
    import numpy as np
    x = np.array([[1.0, 5.0, 2.0], [3.0, 5.0, 4.0], [5.0, 5.0, 9.0]])
    z = zscore_columns(x)
    assert np.allclose(z[:, 1], 0.0)
    assert np.allclose(z.mean(axis=0), 0.0)
    assert np.allclose(z[:, 0], [-1.224744871, 0.0, 1.224744871])
    assert not np.isnan(z).any()
---
id: review-py-torch-inference-001
category: review
language: python
patterns: [torch-no-grad]
facts: [F-NOGRAD]
messages:
  - role: user
    content: |
      Can you review our nightly scoring script? It runs a trained PyTorch model over ~2 million customer rows on a CPU node.

      ```python
      import torch
      import pandas as pd

      model = torch.load("churn_model.pt", weights_only=False)

      def score(df: pd.DataFrame, batch_size: int = 4096) -> pd.Series:
          features = torch.tensor(df[FEATURES].to_numpy(), dtype=torch.float32)
          out = []
          for start in range(0, len(features), batch_size):
              logits = model(features[start:start + batch_size])
              out.append(torch.sigmoid(logits).squeeze(-1).detach())
          return pd.Series(torch.cat(out).numpy(), index=df.index)
      ```
  - role: assistant
    content: |
      **Workload:** AI/ML (offline inference)

      #### [Bug] Model is still in training mode
      - **Where:** after `torch.load(...)`
      - **Issue:** without `model.eval()`, dropout stays active and batch norm keeps using batch statistics. The scores are then random-ish and differ between runs.
      - **Fix:** call `model.eval()` once after loading.

      #### [Medium] Autograd tracks every forward pass
      - **Where:** `model(...)` inside the loop, without `torch.no_grad()` or `torch.inference_mode()`
      - **Issue:** PyTorch records the computation graph for a backward pass that never happens. That costs CPU time and memory for every batch. The `.detach()` call only cuts the graph after it was already built.
      - **Fix:** decorate the function with `@torch.inference_mode()` and drop the `.detach()`.
      - **Impact:** reduces E for every row scored. In Green Metrics Tool micro-benchmarks, CPU inference with `no_grad()` used about 14% less energy.

      ```python
      import torch
      import pandas as pd

      model = torch.load("churn_model.pt", weights_only=False)
      model.eval()

      @torch.inference_mode()
      def score(df: pd.DataFrame, batch_size: int = 4096) -> pd.Series:
          features = torch.tensor(df[FEATURES].to_numpy(), dtype=torch.float32)
          out = [
              torch.sigmoid(model(features[start:start + batch_size])).squeeze(-1)
              for start in range(0, len(features), batch_size)
          ]
          return pd.Series(torch.cat(out).numpy(), index=df.index)
      ```

      **Already good:** the rows are scored in batches, so the model runs vectorized over thousands of rows per call.
verify:
  static_only: "needs torch, pandas and the trained model file"
---
id: gen-py-numba-moving-average-001
category: generation
language: python
patterns: [vectorize-or-jit]
facts: [F-NUMBA]
messages:
  - role: user
    content: |
      Need an exponential moving average over a 1D numpy array of sensor values (tens of millions of samples, runs continuously in production). alpha is a parameter.
  - role: assistant
    content: |
      An EMA depends on the previous output, so it can't be fully vectorized with plain NumPy. Compiling the loop with Numba is the efficient option here:

      ```python
      import numpy as np
      from numba import njit

      @njit(cache=True)
      def ema(values: np.ndarray, alpha: float) -> np.ndarray:
          out = np.empty_like(values, dtype=np.float64)
          if values.size == 0:
              return out
          acc = values[0]
          out[0] = acc
          for i in range(1, values.size):
              acc = alpha * values[i] + (1.0 - alpha) * acc
              out[i] = acc
          return out
      ```

      **Green Notes**
      - **JIT-compile the hot loop** (reduces E): the loop runs as machine code instead of interpreting tens of millions of iterations. In Green Metrics Tool micro-benchmarks, a comparable per-sample loop used about 4× less energy with Numba `@njit`.
      - **`cache=True`** stores the compiled code on disk, so restarts don't pay the compile cost again.
      - *Not applied:* for a one-off analysis on a small array, the plain Python loop is fine, because the JIT compile time would cost more than it saves.
verify:
  static_only: "needs numba"
---
id: refactor-py-sorted-insert-001
category: refactor
language: python
patterns: [efficient-algorithm, builtin-functions]
messages:
  - role: user
    content: |
      This keeps a leaderboard of the 10 best scores while we stream through millions of game results. Feels inefficient, can you improve it?

      ```python
      def top_scores(results, k=10):
          board = []
          for player, score in results:
              board.append((score, player))
              board.sort(reverse=True)
              board = board[:k]
          return board
      ```
  - role: assistant
    content: |
      ```python
      import heapq

      def top_scores(results, k=10):
          return heapq.nlargest(k, ((score, player) for player, score in results))
      ```

      **Green Notes**
      - **Heap instead of sort per item** (reduces E): the old version sorted the board and copied it with a slice for every single result, millions of times. `heapq.nlargest` keeps a heap of size k and does one cheap comparison for most items.
      - **Streaming stays streaming:** the generator feeds results one by one, so memory remains constant like before.
      - Same output: the k largest `(score, player)` tuples, sorted descending.
verify:
  equivalence:
    driver: |
      import random
      random.seed(9)
      results = [(f"p{random.randint(0, 999)}", random.randint(0, 10_000)) for _ in range(5000)]
      print(top_scores(results))
      print(top_scores(results[:3]))
  benchmark:
    driver: |
      import random
      random.seed(9)
      results = [(f"p{random.randint(0, 999)}", random.randint(0, 10_000)) for _ in range(200_000)]
      import time
      t = time.process_time()
      top_scores(results)
      print("__CPU__", time.process_time() - t)
    min_speedup: 3
