id: review-py-star-import-dedupe-001
category: review
language: python
patterns: [efficient-algorithm, keep-star-imports]
facts: [F-IMPORT]
messages:
  - role: user
    content: |
      Review please. It merges contact lists from our CRM export (~50k contacts per run).

      ```python
      from crm_helpers import *

      def merge_contacts(a, b):
          merged = list(a)
          for contact in b:
              if not any(normalize_email(c["email"]) == normalize_email(contact["email"]) for c in merged):
                  merged.append(contact)
          return merged
      ```
  - role: assistant
    content: |
      **Workload:** data pipeline

      #### [High] Quadratic duplicate check
      - **Where:** `any(... for c in merged)` inside the loop
      - **Issue:** every contact from `b` is compared with every contact merged so far, and both emails are normalized again for each comparison. With 50k contacts per list that is in the order of billions of `normalize_email` calls.
      - **Fix:** keep a set of normalized emails and check membership in O(1).
      - **Impact:** reduces E from O(n·m) to O(n + m).

      ```python
      from crm_helpers import *

      def merge_contacts(a, b):
          merged = list(a)
          seen = {normalize_email(c["email"]) for c in merged}
          for contact in b:
              key = normalize_email(contact["email"])
              if key not in seen:
                  seen.add(key)
                  merged.append(contact)
          return merged
      ```

      The result is the same list in the same order. One small difference: duplicates *within* `b` were already filtered by the old code too, because each appended contact became part of `merged`. The `seen.add` keeps that behavior.

      **Checked, no change:** `from crm_helpers import *` stays as it is. Changing star imports makes no measurable energy difference.
verify:
