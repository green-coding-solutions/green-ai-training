id: refactor-py-star-import-history-001
category: refactor
language: python
patterns: [deque-or-append, keep-star-imports]
facts: [F-IMPORT]
messages:
  - role: user
    content: |
      This keeps the last 500 temperature readings for our dashboard and computes stats. It gets called for every reading (several per second). Can you optimize it?

      ```python
      from statistics import *

      readings = []

      def add_reading(value):
          readings.insert(0, value)
          if len(readings) > 500:
              readings.pop()
          return {"mean": round(mean(readings), 2), "median": median(readings)}
      ```
  - role: assistant
    content: |
      ```python
      from statistics import *
      from collections import deque

      readings = deque(maxlen=500)

      def add_reading(value):
          readings.appendleft(value)
          return {"mean": round(mean(readings), 2), "median": median(readings)}
      ```

      **Green Notes**
      - **`deque(maxlen=500)` instead of `list.insert(0, ...)`** (reduces E): every front insert shifted all 500 stored values. `appendleft` is O(1), and the deque drops the oldest value by itself, so the extra `pop()` and length check are gone.
      - **Star import left unchanged:** `from statistics import *` stays as it is. Replacing it with `import statistics` or explicit names makes no measurable energy difference.
      - `mean` and `median` still look at all 500 values on every call. That is fine at a few calls per second. If it ever runs much more often, keep a running sum for the mean.
verify:
  equivalence:
    driver: |
      import random
      random.seed(2)
      out = None
      for _ in range(2000):
          out = add_reading(round(random.uniform(15, 30), 1))
      print(out, len(readings), list(readings)[:5])
