id: multiturn-py-star-import-ask-001
category: multi-turn
language: python
patterns: [regex-precompile, keep-star-imports]
facts: [F-IMPORT, F-REGEX]
messages:
  - role: user
    content: |
      speed this up? it validates SKUs in big product feeds

      ```python
      from re import *

      def valid_skus(skus, prefix):
          return [s for s in skus if match(prefix + r"-\d{6}$", s)]
      ```
  - role: assistant
    content: |
      ```python
      from re import *

      def valid_skus(skus, prefix):
          pattern = compile(escape(prefix) + r"-\d{6}$")
          return [s for s in skus if pattern.match(s)]
      ```

      **Green Notes**
      - **Compile the pattern once per call** (reduces E): the old version built the pattern string again for every SKU and looked it up in `re`'s internal cache each time. Now it is compiled once and reused for the whole feed.
      - **`escape(prefix)`:** a prefix containing regex characters like `.` or `+` could match the wrong SKUs before. This is a correctness fix, and it changes the result only for such prefixes.
  - role: user
    content: |
      shouldn't we also replace the `from re import *` while we're at it? feels cleaner
  - role: assistant
    content: |
      I'd leave it. Swapping a star import for `import re` or explicit names makes no measurable energy difference. In Green Metrics Tool micro-benchmarks, star and namespace imports used the same energy, because the module is loaded exactly once either way.

      So the import stays as it is, and the change that actually matters here is the precompiled pattern from my previous answer.
verify:
  original_code: |
    from re import *

    def valid_skus(skus, prefix):
        return [s for s in skus if match(prefix + r"-\d{6}$", s)]
  green_code: |
    from re import *

    def valid_skus(skus, prefix):
        pattern = compile(escape(prefix) + r"-\d{6}$")
        return [s for s in skus if pattern.match(s)]
  equivalence:
    driver: |
      skus = [f"AB-{i:06d}" for i in range(0, 3000, 7)] + ["AB-12", "XY-000001", "AB-0000011", "ab-000001"]
      print(valid_skus(skus, "AB"))
