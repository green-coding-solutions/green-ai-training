id: refactor-dockerfile-flask-dev-tools-001
category: refactor
language: dockerfile
patterns: [small-container-images]
facts: [F-CONTAINER-IMAGE]
messages:
  - role: user
    content: |
      can you clean up the Dockerfile of our Django shop? CI builds it on every push and it takes forever

      ```dockerfile
      FROM python:3.12
      ENV DJANGO_SETTINGS_MODULE=shop.settings.prod
      RUN apt-get update && apt-get install -y gcc libpq-dev postgresql-client nano less
      COPY . /code
      WORKDIR /code
      RUN pip install -r requirements/dev.txt
      RUN python manage.py collectstatic --noinput
      CMD gunicorn shop.wsgi --bind 0.0.0.0:8000 --workers 3
      ```
  - role: assistant
    content: |
      ```dockerfile
      FROM python:3.12-slim

      ENV DJANGO_SETTINGS_MODULE=shop.settings.prod
      WORKDIR /code

      # dependencies first: this layer is reused as long as the requirements do not change
      COPY requirements/base.txt requirements/prod.txt requirements/
      RUN pip install --no-cache-dir -r requirements/prod.txt

      COPY . .
      RUN python manage.py collectstatic --noinput

      USER nobody
      CMD ["gunicorn", "shop.wsgi", "--bind", "0.0.0.0:8000", "--workers", "3"]
      ```

      **Green Notes**
      - **Slim base, runtime dependencies only** (reduces E, storage, network): gcc, the PostgreSQL client, the editors and the dev requirements are gone from the production image. In Green Metrics Tool measurements of a similar change for a small Flask app, the image build used ~124 J instead of ~885 J, about 7× less, while serving requests cost the same. With a build on every push, that saving repeats many times a day.
      - **Dependency layer before the source** (reduces E): `COPY . /code` came before `pip install`, so every code change reinstalled all packages. Now only a change to the requirements files does.
      - **`--no-cache-dir`** (reduces storage): pip's download cache no longer ends up in the image.

      This assumes a `requirements/prod.txt` that includes `base.txt` (`-r base.txt`) and lists `gunicorn`, with test and lint tools only in `dev.txt`. `libpq-dev` and `gcc` were only needed to compile `psycopg2`: use the `psycopg[binary]` wheel instead, or compile in a separate build stage rather than going back to the full image. The container now runs as `nobody`, so media uploads need a mounted volume, not a folder inside `/code`.
verify:
  static_only: "Dockerfile"
---
id: review-dockerfile-node-api-layers-001
category: review
language: dockerfile
patterns: [small-container-images]
facts: [F-CONTAINER-IMAGE]
messages:
  - role: user
    content: |
      Review please, this is the image for our Node API. Builds run in GitHub Actions for every PR.

      ```dockerfile
      FROM node:22
      WORKDIR /srv
      COPY . .
      RUN npm install
      RUN apt-get update && apt-get install -y python3 make g++ git
      ENV NODE_ENV=production
      CMD ["node", "server.js"]
      ```
  - role: assistant
    content: |
      **Workload:** cloud backend (container built in CI)

      #### [High] Dependencies reinstalled on every code change
      - **Where:** `COPY . .` before `RUN npm install`
      - **Issue:** the source is copied first, so any change to any file invalidates the install layer. Every PR build downloads and installs all packages again.
      - **Fix:**
        ```dockerfile
        FROM node:22-slim
        WORKDIR /srv
        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev && npm cache clean --force
        COPY . .
        ENV NODE_ENV=production
        USER node
        CMD ["node", "server.js"]
        ```
      - **Impact:** E on every build. The install layer is now rebuilt only when the lock file changes.

      #### [Medium] Full base image plus build tools in production
      - **Where:** `FROM node:22`, `apt-get install ... make g++ git`
      - **Issue:** the full base image and the compiler toolchain end up in the image you deploy, and so do the dev dependencies, because `npm install` runs before `NODE_ENV=production`. In Green Metrics Tool measurements of a comparable change for a small Flask app (slim base, runtime dependencies only, dependency layer first), the build used about 7× less energy, while serving requests cost the same.
      - **Fix:** the slim base and `npm ci --omit=dev` above. If a native module needs `python3`, `make` and `g++`, install them in a build stage and copy only `node_modules` into the final image.
      - **Impact:** E, storage and network for every build, push, pull and stored copy.

      #### [Low] `npm install` instead of `npm ci`
      - **Where:** `RUN npm install`
      - **Issue:** `npm install` can update the lock file and resolve different versions than you tested. `npm ci` installs exactly what `package-lock.json` says.
verify:
  static_only: "Dockerfile"
---
id: gen-dockerfile-fastapi-uvicorn-001
category: generation
language: dockerfile
patterns: [small-container-images]
facts: [F-CONTAINER-IMAGE]
messages:
  - role: user
    content: |
      Write a Dockerfile for my FastAPI app. Entry point is app/main.py with `app = FastAPI()`, deps in requirements.txt, served with uvicorn on port 8080.
  - role: assistant
    content: |
      ```dockerfile
      FROM python:3.12-slim

      ENV PYTHONDONTWRITEBYTECODE=1 \
          PYTHONUNBUFFERED=1

      WORKDIR /srv

      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt

      COPY app ./app

      USER nobody
      EXPOSE 8080
      CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
      ```

      Add a `.dockerignore` with at least `.git`, `.venv`, `__pycache__` and `tests`, so they are not sent to the build.

      **Green Notes**
      - **Small container image** (reduces E, storage, network): slim base, runtime dependencies only, and no pip cache in the image. In Green Metrics Tool measurements of a small Flask app, an image built this way used about 7× less energy to build than one on the full `python:3.12` base with build tools and dev packages, while serving requests cost the same.
      - **Dependency layer first** (reduces E): `requirements.txt` is copied and installed before the code, so a code change only rebuilds the last layers.

      `uvicorn` has to be in `requirements.txt`. Keep test and lint tools in a separate dev requirements file.
verify:
  static_only: "Dockerfile"
