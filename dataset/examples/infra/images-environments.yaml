id: gen-yaml-pr-preview-teardown-001
category: generation
language: yaml
patterns: [minimize-environments]
facts: [F-PREVIEW-ENV]
messages:
  - role: user
    content: |
      write a GitHub Actions workflow that deploys a preview of our app for every pull request. We use helm, the chart is in ./chart, cluster credentials are in the KUBECONFIG secret.
  - role: assistant
    content: |
      ```yaml
      name: PR preview

      on:
        pull_request:
          types: [opened, synchronize, reopened, closed]

      concurrency:
        group: preview-${{ github.event.pull_request.number }}
        cancel-in-progress: true

      env:
        RELEASE: pr-${{ github.event.pull_request.number }}

      jobs:
        deploy:
          if: github.event.action != 'closed'
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - uses: azure/setup-helm@v4
            - name: Write kubeconfig
              run: echo "${{ secrets.KUBECONFIG }}" > "$RUNNER_TEMP/kubeconfig"
            - name: Deploy preview
              env:
                KUBECONFIG: ${{ runner.temp }}/kubeconfig
              run: >
                helm upgrade --install "$RELEASE" ./chart
                --namespace "$RELEASE" --create-namespace
                --set replicaCount=1
                --set image.tag=${{ github.sha }}
                --wait

        teardown:
          if: github.event.action == 'closed'
          runs-on: ubuntu-latest
          steps:
            - uses: azure/setup-helm@v4
            - name: Write kubeconfig
              run: echo "${{ secrets.KUBECONFIG }}" > "$RUNNER_TEMP/kubeconfig"
            - name: Remove preview
              env:
                KUBECONFIG: ${{ runner.temp }}/kubeconfig
              run: |
                helm uninstall "$RELEASE" --namespace "$RELEASE" --ignore-not-found
                kubectl delete namespace "$RELEASE" --ignore-not-found
      ```

      **Green Notes**
      - **Minimize deployed environments** (reduces E and M): the preview is removed when the PR is merged or closed, so it doesn't run for weeks nobody looks at it. That is where the saving is: in Green Metrics Tool measurements, an idle preview with 3 replicas, Postgres, Redis and a worker used only about 3% more CPU energy per minute than one with 1 replica and Postgres. The hours an environment exists matter far more than its size.
      - **One replica** (reduces M): a preview has a handful of users, so `replicaCount=1` reserves less memory and lets more previews share a node.

      If previews are also left open over nights and weekends, a scheduled job that scales them to zero outside working hours removes most of the remaining hours.
verify:
  static_only: "GitHub Actions workflow"
---
id: review-yaml-compose-preview-stack-001
category: review
language: yaml
patterns: [minimize-environments]
facts: [F-PREVIEW-ENV]
messages:
  - role: user
    content: |
      This compose file is started on our preview host for every feature branch (`docker compose -p <branch> up -d`). Nobody really stops them, we clean up by hand every few weeks. Any feedback?

      ```yaml
      services:
        web:
          image: registry.example.com/shop/web:${TAG}
          deploy:
            replicas: 3
          environment:
            DATABASE_URL: postgres://shop:shop@db/shop
            REDIS_URL: redis://cache:6379
        worker:
          image: registry.example.com/shop/web:${TAG}
          command: python -m shop.worker --poll-interval 1
        cache:
          image: redis:7
        db:
          image: postgres:16
          environment:
            POSTGRES_PASSWORD: shop
          volumes:
            - dbdata:/var/lib/postgresql/data
      volumes:
        dbdata:
      ```
  - role: assistant
    content: |
      **Workload:** CI/CD and infrastructure (preview environments)

      #### [High] Previews run until someone cleans up by hand
      - **Where:** the `up -d` per branch, no teardown
      - **Issue:** every branch keeps a full stack running for weeks after it is merged. The cost of an environment is mostly the hours it exists, not how many services it has.
      - **Fix:** remove the stack when the branch is merged or deleted, from the same CI that starts it:
        ```yaml
        on:
          delete:
        jobs:
          teardown:
            runs-on: [self-hosted, preview]
            steps:
              - run: docker compose -p "${{ github.event.ref }}" down --volumes
        ```
        Also stop all previews at night with a scheduled job, and start one on demand when somebody opens it.
      - **Impact:** E and M, all the idle hours of merged branches go away.

      #### [Low] Three web replicas and a 1-second poller for a preview
      - **Where:** `replicas: 3`, `worker --poll-interval 1`
      - **Issue:** a preview has one or two users. In Green Metrics Tool measurements, an idle preview with 3 app replicas, Postgres, Redis and a polling worker used ~269 J per minute of CPU energy, and one with 1 replica and Postgres ~262 J, about 3% less. So per minute the extra services cost little, but they reserve memory and limit how many previews fit on the host.
      - **Fix:** `replicas: 1`, and only start `worker` and `cache` for branches that need them (a compose profile like `profiles: [jobs]` does that).
      - **Impact:** M, more previews per host.

      #### [Security] Database password in the file
      - **Where:** `POSTGRES_PASSWORD: shop`
      - **Issue:** fine for throwaway data, but if previews ever get a copy of real data, use a generated secret per environment.
verify:
  static_only: "compose file"
