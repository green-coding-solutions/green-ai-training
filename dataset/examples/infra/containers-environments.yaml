id: refactor-dockerfile-node-001
category: refactor
language: dockerfile
patterns: [small-container-images]
messages:
  - role: user
    content: |
      Our Next.js app image is 2.1 GB and CI rebuilds take forever. Can you improve the Dockerfile?

      ```dockerfile
      FROM node:22
      WORKDIR /app
      COPY . .
      RUN npm install
      RUN npm run build
      EXPOSE 3000
      CMD ["npm", "start"]
      ```
  - role: assistant
    content: |
      ```dockerfile
      # syntax=docker/dockerfile:1

      FROM node:22-slim AS deps
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN --mount=type=cache,target=/root/.npm npm ci

      FROM node:22-slim AS build
      WORKDIR /app
      COPY --from=deps /app/node_modules ./node_modules
      COPY . .
      RUN npm run build

      FROM node:22-slim AS runtime
      WORKDIR /app
      ENV NODE_ENV=production
      COPY --from=build /app/.next/standalone ./
      COPY --from=build /app/.next/static ./.next/static
      COPY --from=build /app/public ./public
      USER node
      EXPOSE 3000
      CMD ["node", "server.js"]
      ```

      This needs `output: "standalone"` in `next.config.js`. Also add a `.dockerignore`:

      ```text
      node_modules
      .next
      .git
      *.log
      ```

      **Green Notes**
      - **Multi-stage build with a slim base** (reduces storage and network): the final image contains only the standalone server and static files. No dev dependencies, no build cache, no full Debian toolchain. Every pull on every deploy and node moves far fewer bytes.
      - **Dependency layer cached** (reduces E in CI): `package*.json` is copied before the source, so `npm ci` reruns only when dependencies change, not on every code change. The npm cache mount speeds up the cases where it does rerun.
      - **`.dockerignore`:** the local `node_modules` and `.git` are no longer sent as build context.
      - Also runs as the unprivileged `node` user now.
verify:
  static_only: "Dockerfile"
---
id: gen-dockerfile-go-api-001
category: generation
language: dockerfile
patterns: [small-container-images]
messages:
  - role: user
    content: |
      write a Dockerfile for our Go REST API (module github.com/acme/orders, main package in ./cmd/api, listens on 8080). No cgo.
  - role: assistant
    content: |
      ```dockerfile
      # syntax=docker/dockerfile:1

      FROM golang:1.25 AS build
      WORKDIR /src
      COPY go.mod go.sum ./
      RUN --mount=type=cache,target=/go/pkg/mod go mod download
      COPY . .
      RUN --mount=type=cache,target=/go/pkg/mod \
          --mount=type=cache,target=/root/.cache/go-build \
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /out/api ./cmd/api

      FROM gcr.io/distroless/static-debian12:nonroot
      COPY --from=build /out/api /api
      EXPOSE 8080
      ENTRYPOINT ["/api"]
      ```

      **Green Notes**
      - **Static binary on a distroless base** (reduces storage and network): the runtime image is a few MB plus your binary, instead of a full Go toolchain image of several hundred MB. Faster pulls on every deploy and every autoscaled node.
      - **Cached module and build layers** (reduces E in CI): `go mod download` runs only when `go.mod`/`go.sum` change, and the build cache mount makes rebuilds incremental.
      - `-s -w` strips debug symbols. Drop it if you need symbolized stack traces from production core dumps.
verify:
  static_only: "Dockerfile"
---
id: nochange-dockerfile-alpine-001
category: no-change
language: dockerfile
patterns: [small-container-images, context-tradeoff]
messages:
  - role: user
    content: |
      Would switching this to alpine make it greener? The image is ~180 MB now.

      ```dockerfile
      FROM python:3.13-slim AS build
      WORKDIR /app
      COPY requirements.txt .
      RUN pip wheel --no-cache-dir --wheel-dir /wheels -r requirements.txt

      FROM python:3.13-slim
      WORKDIR /app
      COPY --from=build /wheels /wheels
      RUN pip install --no-cache-dir /wheels/* && rm -rf /wheels
      COPY src/ ./src/
      USER nobody
      CMD ["python", "-m", "src.main"]
      ```
  - role: assistant
    content: |
      Probably not worth it. Your Dockerfile already does the things that matter: slim base, multi-stage build, dependencies installed before the source is copied, no pip cache, nothing left over from the build.

      Alpine would save some tens of MB, but it uses musl instead of glibc. Many Python packages with C extensions ship wheels for musl less often, so pip compiles them from source during the build. That costs CI time and energy on every rebuild, makes builds slower and more fragile, and can make the final image bigger again because of build dependencies. Some numerical libraries also run slower on musl.

      If you want to trim further, check what is actually in the remaining MB:
      - `docker history <image>` shows the size of each layer.
      - Large dependencies you only need in development or for tests don't belong in `requirements.txt` for production.
verify:
  static_only: "Dockerfile"
---
id: review-dockerfile-spring-001
category: review
language: dockerfile
patterns: [small-container-images]
messages:
  - role: user
    content: |
      Review our Spring Boot Dockerfile? We run 12 replicas and redeploy several times a day.

      ```dockerfile
      FROM maven:3.9-eclipse-temurin-21
      WORKDIR /app
      COPY . .
      CMD ["mvn", "spring-boot:run"]
      ```
  - role: assistant
    content: |
      **Workload:** cloud backend

      #### [High] The app is compiled when the container starts
      - **Where:** `CMD ["mvn", "spring-boot:run"]`
      - **Issue:** every container start downloads dependencies and compiles the project. With 12 replicas and several deploys a day, that build runs dozens of times per day, plus on every restart or scale-up. Startup takes minutes, and a Maven Central hiccup can stop your pods from starting.
      - **Fix:** build the jar once in a build stage, and only run it in the final image.
      - **Impact:** reduces E per start and deploy, and pods become ready in seconds.

      #### [Medium] Full JDK and Maven in the runtime image
      - **Where:** `FROM maven:3.9-eclipse-temurin-21`
      - **Issue:** the image carries Maven, the full JDK and the local repository to every node. A JRE is enough to run the jar.
      - **Fix:** multi-stage build with a JRE base, and Spring Boot's layered jar so dependency layers are reused between releases.

      ```dockerfile
      # syntax=docker/dockerfile:1

      FROM maven:3.9-eclipse-temurin-21 AS build
      WORKDIR /src
      COPY pom.xml .
      RUN --mount=type=cache,target=/root/.m2 mvn -q dependency:go-offline
      COPY src ./src
      RUN --mount=type=cache,target=/root/.m2 mvn -q -DskipTests package \
          && java -Djarmode=tools -jar target/*.jar extract --layers --launcher --destination /out

      FROM eclipse-temurin:21-jre
      WORKDIR /app
      COPY --from=build /out/dependencies/ ./
      COPY --from=build /out/spring-boot-loader/ ./
      COPY --from=build /out/snapshot-dependencies/ ./
      COPY --from=build /out/application/ ./
      USER 1000
      ENTRYPOINT ["java", "org.springframework.boot.loader.launch.JarLauncher"]
      ```

      Because the dependency layers rarely change, a new release usually only pushes and pulls the small application layer. Add a `.dockerignore` with `target/` and `.git`. Run the tests in CI, not in the image build.
verify:
  static_only: "Dockerfile"
---
id: gen-gitlab-review-apps-001
category: generation
language: yaml
patterns: [minimize-environments]
messages:
  - role: user
    content: |
      We want review apps in GitLab CI for merge requests. Deploy is `./deploy.sh review $CI_COMMIT_REF_SLUG`, teardown is `./teardown.sh review $CI_COMMIT_REF_SLUG`. Can you write the jobs?
  - role: assistant
    content: |
      ```yaml
      stages: [deploy]

      review:deploy:
        stage: deploy
        script:
          - ./deploy.sh review "$CI_COMMIT_REF_SLUG"
        environment:
          name: review/$CI_COMMIT_REF_SLUG
          url: https://$CI_COMMIT_REF_SLUG.review.example.com
          on_stop: review:stop
          auto_stop_in: 2 days
        rules:
          - if: $CI_PIPELINE_SOURCE == "merge_request_event"

      review:stop:
        stage: deploy
        script:
          - ./teardown.sh review "$CI_COMMIT_REF_SLUG"
        environment:
          name: review/$CI_COMMIT_REF_SLUG
          action: stop
        rules:
          - if: $CI_PIPELINE_SOURCE == "merge_request_event"
            when: manual
        allow_failure: true
      ```

      **Green Notes**
      - **Only for merge requests** (reduces E and M): branches without an MR don't get an environment.
        https://patterns.greensoftware.foundation/development/minimizing-deployed-environments
      - **Automatic teardown:** `on_stop` runs `review:stop` when the MR is merged or closed. `auto_stop_in: 2 days` also stops review apps nobody touched for two days. Without this, forgotten review apps tend to keep running for months.
      - Keep the review app small in `deploy.sh`: one replica and seeded test data instead of a copy of production.
verify:
  static_only: "GitLab CI config, YAML syntax checked"
---
id: gen-k8s-staging-night-scale-001
category: generation
language: yaml
patterns: [minimize-environments]
messages:
  - role: user
    content: |
      Our staging namespace runs 24/7 but nobody uses it outside 7:00-20:00 on weekdays (Europe/Berlin). How can we turn the deployments off at night and on weekends? Plain Kubernetes, no extra operators please.
  - role: assistant
    content: |
      Two CronJobs that scale all deployments in `staging` down in the evening and up in the morning:

      ```yaml
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: staging-scaler
        namespace: staging
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: staging-scaler
        namespace: staging
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments", "deployments/scale"]
          verbs: ["get", "list", "patch", "update"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: staging-scaler
        namespace: staging
      subjects:
        - kind: ServiceAccount
          name: staging-scaler
          namespace: staging
      roleRef:
        kind: Role
        name: staging-scaler
        apiGroup: rbac.authorization.k8s.io
      ---
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: staging-scale-down
        namespace: staging
      spec:
        schedule: "0 20 * * 1-5"
        timeZone: "Europe/Berlin"
        jobTemplate:
          spec:
            template:
              spec:
                serviceAccountName: staging-scaler
                restartPolicy: OnFailure
                containers:
                  - name: kubectl
                    image: bitnami/kubectl:1.33
                    command: ["kubectl", "scale", "deployment", "--all", "--replicas=0", "-n", "staging"]
      ---
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: staging-scale-up
        namespace: staging
      spec:
        schedule: "0 7 * * 1-5"
        timeZone: "Europe/Berlin"
        jobTemplate:
          spec:
            template:
              spec:
                serviceAccountName: staging-scaler
                restartPolicy: OnFailure
                containers:
                  - name: kubectl
                    image: bitnami/kubectl:1.33
                    command: ["kubectl", "scale", "deployment", "--all", "--replicas=1", "-n", "staging"]
      ```

      Friday's 20:00 job turns staging off and Monday's 7:00 job turns it on, so weekends are covered automatically.

      **Green Notes**
      - **Minimize deployed environments** (reduces E and M): staging runs 65 of the 168 hours in a week instead of all of them. If the cluster autoscaler is enabled, the freed nodes are removed too, which is where the real saving is.
        https://patterns.greensoftware.foundation/development/minimizing-deployed-environments
      - *Not applied:* deleting staging completely. You still need a place to test before production, and incidents in production cost more than staging hours.

      The scale-up sets every deployment to 1 replica. If some need more, store the desired count in an annotation and read it in the job. Databases running as StatefulSets are not touched by this.
verify:
  static_only: "Kubernetes manifests, YAML syntax checked"
---
id: review-nginx-brotli-dynamic-001
category: review
language: nginx
patterns: [text-compression, compress-transmitted]
facts: [F-COMPRESS]
messages:
  - role: user
    content: |
      We switched our API gateway to max compression to save bandwidth. CPU on the gateway went up a lot. Is this config ok?

      ```nginx
      brotli on;
      brotli_comp_level 11;
      brotli_types application/json text/plain text/css application/javascript image/png image/jpeg;

      gzip on;
      gzip_comp_level 9;
      gzip_types application/json text/plain text/css application/javascript image/png image/jpeg;
      ```
  - role: assistant
    content: |
      **Workload:** cloud backend (API gateway, every response)

      #### [High] Brotli level 11 on dynamic responses
      - **Where:** `brotli_comp_level 11;`
      - **Issue:** level 11 is meant for static files compressed once at build time. Here it runs on every API response. In Green Metrics Tool measurements, compressing 100 MB with brotli at its default quality 11 took about 45× the energy of gzip ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,8e93a8d2-60b0-4831-905b-764b68257bc7)). The few extra percent of compression don't make up for that on a response that is sent once.
      - **Fix:** level 4-5 for dynamic responses. That keeps most of the size reduction at a fraction of the CPU.
      - **Impact:** reduces E on the gateway for every request, and your CPU usage should drop back.

      #### [Medium] Images in the compression types
      - **Where:** `image/png image/jpeg` in `brotli_types` and `gzip_types`
      - **Issue:** PNG and JPEG are already compressed. Compressing them again burns CPU and saves almost nothing.
      - **Fix:** list only text formats: JSON, HTML, CSS, JavaScript, SVG, plain text.

      #### [Low] gzip level 9
      - **Where:** `gzip_comp_level 9;`
      - **Issue:** gzip is now only a fallback for clients without brotli, and level 9 gains little over level 5.

      ```nginx
      brotli on;
      brotli_comp_level 5;
      brotli_min_length 1024;
      brotli_types application/json text/plain text/css application/javascript image/svg+xml;

      gzip on;
      gzip_comp_level 5;
      gzip_min_length 1024;
      gzip_types application/json text/plain text/css application/javascript image/svg+xml;

      # static assets: precompressed once at build time (brotli -q 11 / gzip -9 there is fine)
      brotli_static on;
      gzip_static on;
      ```

      **Already good:** text compression is enabled for JSON, which is the bulk of an API's traffic.
verify:
  static_only: "nginx config"
---
id: gen-py-gateway-upload-gzip-001
category: generation
language: python
patterns: [compress-transmitted]
messages:
  - role: user
    content: |
      Our IoT gateways send a batch of sensor readings (list of dicts, ~2000 readings, very repetitive keys) as JSON to our ingest API once a minute over LTE. Write the Python function that sends a batch with requests. The API accepts `Content-Encoding: gzip`.
  - role: assistant
    content: |
      ```python
      import gzip
      import json

      import requests

      INGEST_URL = "https://ingest.example.com/v1/readings"

      def encode_batch(readings):
          raw = json.dumps(readings, separators=(",", ":")).encode("utf-8")
          return gzip.compress(raw, compresslevel=6)

      def send_batch(readings, session=None, timeout=10):
          http = session or requests
          resp = http.post(
              INGEST_URL,
              data=encode_batch(readings),
              headers={"Content-Type": "application/json", "Content-Encoding": "gzip"},
              timeout=timeout,
          )
          resp.raise_for_status()
          return resp
      ```

      **Green Notes**
      - **Compress the upload** (reduces network): JSON with the same keys repeated 2000 times compresses very well, typically to a small fraction of its size. Over LTE, fewer bytes mean less radio time on the gateway and less mobile data.
        https://patterns.greensoftware.foundation/development/data-handling/compress-transmitted-data
      - **Moderate level (6):** higher gzip levels cost noticeably more CPU on a small gateway for little extra gain.
      - **Compact JSON separators:** no spaces after `,` and `:`, so there is less to compress and send.
verify:
  green_block: 0
  setup: |
    import sys, types
    sys.modules["requests"] = types.ModuleType("requests")
  test: |
    import gzip, json
    readings = [{"sensor_id": i % 20, "ts": 1700000000 + i, "temperature_c": 21.5, "humidity_pct": 40} for i in range(2000)]
    body = encode_batch(readings)
    assert json.loads(gzip.decompress(body)) == readings
    assert len(body) < len(json.dumps(readings)) / 5
---
id: nochange-py-gzip-jpeg-upload-001
category: no-change
language: python
patterns: [compress-transmitted, context-tradeoff]
messages:
  - role: user
    content: |
      We upload camera snapshots (JPEG, ~400 KB each) from our field devices. Should I gzip the body before upload like we did for the JSON telemetry?

      ```python
      def upload_snapshot(path, session):
          with open(path, "rb") as f:
              resp = session.post(
                  "https://ingest.example.com/v1/snapshots",
                  data=f,
                  headers={"Content-Type": "image/jpeg"},
                  timeout=30,
              )
          resp.raise_for_status()
      ```
  - role: assistant
    content: |
      No. JPEG is already compressed, so gzip finds almost nothing left to remove. Often the output is even a few bytes larger. You would spend CPU on the device and on the server for no transfer savings.

      Your function is already efficient: it streams the file from disk instead of reading it into memory first, and it reuses a session.

      If you want to send fewer bytes for snapshots, change the images themselves:
      - capture at the resolution you actually need on the server,
      - use a lower JPEG quality (e.g. 75-80 is usually fine for monitoring),
      - or encode as WebP or AVIF on the device, if it has the CPU for it.
---
id: conceptual-delete-staging-001
category: conceptual
language: text
patterns: [minimize-environments, context-tradeoff]
messages:
  - role: user
    content: |
      Our sustainability team asks if we should delete our staging and dev environments entirely and test directly in production with feature flags. Would that be greener?
  - role: assistant
    content: |
      Usually not. The GSF pattern is *minimize* deployed environments, not *eliminate* them.

      What you save by deleting staging is its idle compute. What you risk:
      - **Incidents:** a bad release in production affects every user, often needs rollbacks, hotfix builds and repeated deploys, and can corrupt data. All of that has a footprint too, plus the business cost.
      - **Real load for tests:** tests then run against production infrastructure, which needs headroom for that.

      Better ways to get most of the savings:
      - Scale staging to zero outside working hours.
      - Create review environments per pull request and tear them down automatically on merge.
      - Keep non-production environments small: one replica, smaller instances, seeded test data instead of a production copy.
      - Share expensive backing services (databases, search clusters) between preview environments.

      Feature flags and canary releases are great additions, but as a complement to a small staging, not a replacement.
