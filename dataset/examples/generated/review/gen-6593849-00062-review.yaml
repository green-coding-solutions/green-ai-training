- role: assistant
  content: |
    **Workload:** web (static report page, opened by every reader with a cold cache)

    #### [Bug] Invalid `font-family` on captions
    - **Where:** `figcaption { font-family: "Inter" Arial, sans-serif; }`
    - **Issue:** the comma after `"Inter"` is missing. The browser drops the whole declaration, so captions fall back to the body serif font instead of the sans font you meant.
    - **Fix:** use a comma, or better, define the font stacks once as variables (see below). Then the stack is written in one place only.

    #### [Medium] Six TTF font files for a report page
    - **Where:** the six `@font-face` blocks
    - **Issue:** every first-time reader downloads and decodes six uncompressed TTF files. That is a lot of data for a page that is mostly text and numbers. The fonts block text rendering until they arrive, and the page needs the file `fonts/` folder next to it to look right.
    - **Fix:** use the system font stacks. System fonts need no download and no decoding. `tabular-nums` and bold/italic work with them too.
    - **Impact:** reduces client E and network on every cold page load. In Green Metrics Tool micro-benchmarks (30 cold page loads), six local TTF files (about 4 MB) used the most client CPU energy. Two Latin-subset WOFF2 files used about 12% less. The system font stack used about 26% less than the TTF set and about 16% less than the WOFF2 subsets.

    ```css
    :root {
      --text: #1c1f24;
      --muted: #5b6270;
      --rule: #d5d9e0;
      --serif: Charter, "Iowan Old Style", Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    body { font-family: var(--serif); }
    h1, h2, h3 { font-family: var(--sans); }
    pre, code, .cell-output { font-family: var(--mono); }
    table.results { font-family: var(--sans); }
    figcaption { font-family: var(--sans); }
    ```

    Delete all six `@font-face` blocks and the `fonts/` folder. The rest of your rules stay as they are.

    The look will differ a little per OS, so check that the wide numeric columns in `table.results` still line up. If the brand font is a hard requirement, ship at most two Latin-subset WOFF2 files with `font-display: swap` instead of six TTF files.

    **Already good:** `font-variant-numeric: tabular-nums` on numeric cells, and a narrow `max-width` for readable line length.
