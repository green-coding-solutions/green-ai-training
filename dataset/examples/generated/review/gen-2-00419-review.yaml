id: gen-2-00419-review
category: review
language: html
patterns:
- remove-unused-css
facts:
- F-UNUSED-CSS
messages:
- role: user
  content: |
    Hi, I'm new to this. I made a small page that shows our daily log digest. A cron job writes digest.json every night and nginx serves the page to the ops team (about 8 people). I copied the style block from an old dashboard template. It works, but I feel something is wrong with it and I don't know what. Can you review it?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>Daily log digest</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
      .navbar { background: #1f2937; padding: 12px 24px; }
      .navbar a { color: #fff; margin-right: 16px; text-decoration: none; }
      .navbar .dropdown-menu { display: none; position: absolute; }
      .jumbotron { padding: 48px 24px; background: #e5e7eb; }
      .btn { padding: 8px 14px; border: 0; border-radius: 4px; cursor: pointer; }
      .btn-primary { background: #2563eb; color: #fff; }
      .btn-danger { background: #dc2626; color: #fff; }
      .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
      .modal-content { background: #fff; margin: 10% auto; width: 50%; padding: 20px; }
      .carousel { position: relative; overflow: hidden; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #ddd; }
      .footer-links a { color: #6b7280; margin: 0 8px; }
      .container { max-width: 960px; margin: 0 auto; padding: 24px; }
      .cards { display: flex; gap: 16px; margin-bottom: 24px; }
      .card { flex: 1; background: #fff; padding: 16px; border-radius: 6px; }
      .card strong { display: block; font-size: 28px; }
      table.log { width: 100%; border-collapse: collapse; background: #fff; }
      table.log th, table.log td { padding: 6px 10px; border-bottom: 1px solid #ddd; text-align: left; }
      .level-error { color: #b91c1c; font-weight: bold; }
      .level-warn { color: #b45309; }
      .level-info { color: #374151; }
      @media (max-width: 600px) {
        .cards { flex-direction: column; }
        .navbar a { display: block; }
      }
    </style>
    </head>
    <body>
    <div class="container">
      <h1>Daily log digest</h1>
      <div class="cards">
        <div class="card">Total<strong id="total">-</strong></div>
        <div class="card">Errors<strong id="errors">-</strong></div>
        <div class="card">Warnings<strong id="warnings">-</strong></div>
      </div>
      <table class="log">
        <thead><tr><th>Time</th><th>Level</th><th>Host</th><th>Message</th></tr></thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
    <script>
      // levels written by the digest job: ERROR, WARNING, INFO
      fetch('digest.json')
        .then(r => r.json())
        .then(data => {
          document.getElementById('total').textContent = data.total;
          document.getElementById('errors').textContent = data.errors;
          document.getElementById('warnings').textContent = data.warnings;
          document.getElementById('log-body').innerHTML = data.entries.map(e =>
            `<tr><td>${e.time}</td><td class="level-${e.level.toLowerCase()}">${e.level}</td><td>${e.host}</td><td>${e.message}</td></tr>`
          ).join('');
        });
    </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    **Workload:** web (small internal page)

    #### [Security] Log messages are inserted as HTML
    - **Where:** the `innerHTML = data.entries.map(...)` line in the script
    - **Issue:** `e.message` and `e.host` come from log lines, and log lines can contain text an outside user controls (a URL, a user agent, a username). If one contains `<img src=x onerror=...>`, it runs in the browser of everyone who opens the digest.
    - **Fix:** build the cells with `textContent`, which never parses HTML:
      ```javascript
      const tbody = document.getElementById('log-body');
      data.entries.forEach(e => {
        const tr = tbody.insertRow();
        [e.time, e.level, e.host, e.message].forEach((text, i) => {
          const td = tr.insertCell();
          td.textContent = text;
          if (i === 1) td.className = 'level-' + e.level.toLowerCase();
        });
      });
      ```

    #### [Bug] Warning rows have no color
    - **Where:** `.level-warn` in the CSS
    - **Issue:** your comment says the job writes `WARNING`. The script builds the class `level-warning`, but the CSS defines `level-warn`. So warnings get the default text color.
    - **Fix:** rename the rule to `.level-warning`.

    #### [Low] Most of the stylesheet is unused
    - **Where:** the `<style>` block
    - **Issue:** this page uses `.container`, `.cards`, `.card`, `table.log` and the three level classes. Everything for `.navbar`, `.jumbotron`, `.btn*`, `.modal*`, `.carousel`, `.badge` and `.footer-links` belongs to the old dashboard and matches nothing here. The `.navbar a` rule in the media query is dead too.
    - **Fix:** delete those rules. What is left:
      ```html
      <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
        .container { max-width: 960px; margin: 0 auto; padding: 24px; }
        .cards { display: flex; gap: 16px; margin-bottom: 24px; }
        .card { flex: 1; background: #fff; padding: 16px; border-radius: 6px; }
        .card strong { display: block; font-size: 28px; }
        table.log { width: 100%; border-collapse: collapse; background: #fff; }
        table.log th, table.log td { padding: 6px 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .level-error { color: #b91c1c; font-weight: bold; }
        .level-warning { color: #b45309; }
        .level-info { color: #374151; }
        @media (max-width: 600px) {
          .cards { flex-direction: column; }
        }
      </style>
      ```
    - **Impact:** this saves bytes and makes the file easier to read. It does not save measurable CPU. In Green Metrics Tool micro-benchmarks (50 cold page loads), purging a 16 KB stylesheet down to 0.75 KB changed client energy by about 2%, which is within noise. Your page is small and used by about 8 people on an internal network, so do this for tidiness, not for energy.

    **Already good:** one static page, one `fetch` for all data, and no framework or extra CSS file to load.
verify:
  static_only: browser HTML/JS page, needs a browser and a digest.json file
