      import os
      import random
      import tempfile

      random.seed(7)
      path = os.path.join(tempfile.mkdtemp(), "readings.csv")
      with open(path, "w", newline="") as f:
          f.write("sensor,value,status\n")
          for i in range(5000):
              status = "ok" if i % 11 else "bad"
              f.write(f"s{i % 7},{random.randint(0, 1000) / 10},{status}\n")

      run(path, 1.5, -2.0, 90.0)
