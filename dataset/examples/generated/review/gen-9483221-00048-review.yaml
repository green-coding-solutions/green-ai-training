    ```python
    # gw_buffer.py - buffers sensor frames on the gateway, spools them to disk
    from struct import *
    from time import *
    from json import *

    FRAME = '<HHhI'   # sensor id, flags, temp in 0.01 C, uptime in s
    SPOOL = '/var/spool/gw/readings.jsonl'


    def parse_frames(buf):
        out = []
        size = calcsize(FRAME)
        for i in range(0, len(buf) - size + 1, size):
            sid, flags, t, up = unpack(FRAME, buf[i:i + size])
            out.append({'id': sid, 'flags': flags, 'temp': t / 100, 'up': up, 'ts': time()})
        return out


    def flush(readings):
        with open(SPOOL, 'a') as f:
            for r in readings:
                f.write(dumps(r) + '\n')


    def run(port):
        pending = []
        while True:
            data = port.read(64)
            pending += parse_frames(data)
            if len(pending) >= 20:
                flush(pending)
                pending = []
            sleep(0.5)
