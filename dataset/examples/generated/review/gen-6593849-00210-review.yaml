    ```python
    import math
    import time

    import torch


    class VibrationScorer:
        def __init__(self, model_path, publish, threshold=0.8):
            self.model = torch.jit.load(model_path)
            self.publish = publish
            self.threshold = threshold
            self.window = 256
            self.scale = 1.0 / 2048.0
            self.alerts = 0

        def normalize(self, raw):
            out = []
            for v in raw:
                out.append(math.sqrt(abs(v) * self.scale) * (1 if v >= 0 else -1))
            return out

        def score(self, raw):
            x = torch.tensor(self.normalize(raw), dtype=torch.float32).view(1, 1, -1)
            out = self.model(x)
            return float(out.squeeze())

        def run(self, windows):
            for dev_id, raw in windows:
                if len(raw) != self.window:
                    continue
                s = self.score(raw)
                if s > self.threshold:
                    self.alerts += 1
                    self.publish(f"vib/{dev_id}/alert", {"score": s, "ts": time.time()})
    ```

