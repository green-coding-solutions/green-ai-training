  equivalence:
    driver: |
      import os
      import tempfile

      lines = [
          "2026-10-01 08:00:01 [INFO] service started",
          "2026-10-01 08:00:02 [WARN] slow response from db",
          "garbage line without a level",
          "2026-10-01 08:00:03 [ERROR] timeout talking to cache",
          "2026-10-01 08:00:04 [DEBUG] cache miss",
          "2026-10-01 08:00:05 [WARN] retrying",
          "2026-10-01 08:00:06 [FATAL] out of memory",
      ]
      fd, p = tempfile.mkstemp(suffix=".log")
      with os.fdopen(fd, "w") as fh:
          fh.write("\n".join(lines) + "\n")
      try:
          print(build_digest(p), end="")
          print(build_digest(p, "ERROR"), end="")
          print(build_digest(p, "DEBUG"), end="")
      finally:
          os.remove(p)
  test: |-
    import os
    import tempfile

    fd, p = tempfile.mkstemp(suffix=".log")
    with os.fdopen(fd, "w") as fh:
        fh.write("2026-10-01 08:00:01 [TRACE] noisy\n2026-10-01 08:00:02 [ERROR] boom\n")
    try:
        out = build_digest(p)
    finally:
        os.remove(p)
    assert out == "2026-10-01T08:00:02 ERROR boom\n-- summary --\nERROR: 1\n"
