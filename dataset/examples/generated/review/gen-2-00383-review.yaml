    _cust = {"7": {"segment": "b2b"}}
    _rows = [{"order_id": "X", "customer_id": "7", "currency": "EUR", "amount": "1.00"}]
    try:
        enrich(_rows, _cust, {"EUR": 1.0})
        raise AssertionError("incomplete customer record must not be treated as guest")
    except KeyError:
        pass
    _g = enrich([{"order_id": "G", "customer_id": "", "currency": "EUR", "amount": "2.00", "ship_country": "FR"}],
                {}, {"EUR": 1.0})
    assert _g == [{"order_id": "G", "segment": "guest", "country": "FR", "amount_eur": 2.0}]
