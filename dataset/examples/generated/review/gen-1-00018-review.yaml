  test: |-
    import tempfile, gzip, io, contextlib
    d = realpath(tempfile.mkdtemp())
    lines = [
        '1.1.1.1 - - [10/Oct/2026:13:55:36 +0000] "GET /a HTTP/1.1" 200 500',
        '2.2.2.2 - - [10/Oct/2026:13:55:37 +0000] "GET /b HTTP/1.1" 404 -',
        'garbage line',
        '1.1.1.1 - - [10/Oct/2026:13:55:38 +0000] "GET /c HTTP/1.1" 200 300',
    ]
    text = "\n".join(lines) + "\n"
    with open(d + "/access.log", "w") as f:
        f.write(text)
    with gzip.open(d + "/access.log.gz", "wt") as f:
        f.write(text)
    assert parse_line(lines[1]) == ("2.2.2.2", 404, 0)
    assert parse_line(lines[1] + "\n") == ("2.2.2.2", 404, 0)
    assert parse_line("garbage line") is None
    counts, ips = summarize(d + "/access.log")
    assert counts == {2: 2, 4: 1}
    assert ips["1.1.1.1"] == 800
    counts_gz, ips_gz = summarize(d + "/access.log.gz")
    assert counts_gz == counts and ips_gz == ips
    LOG_DIR = d
    def run(arg):
        sys.argv = ["prog", arg]
        buf = io.StringIO()
        with contextlib.redirect_stdout(buf):
            main()
        return buf.getvalue()
    out = run("access.log")
    assert out.splitlines()[0] == "2xx: 2"
    assert "1.1.1.1 800" in out
    assert run("access.log.gz") == out
    assert run("../../etc/passwd").strip() == "no file"
    assert run("/etc/passwd").strip() == "no file"
