    ```python
    CAL_TABLE = """
    TH100:1.00,0.00,-0.50
    TH200:0.98,0.10,-0.25
    PR50:1.00,0.00,0.00
    PR90:1.01,-0.20,0.00
    """

    def calibration(model, fw):
        table = {}
        for line in CAL_TABLE.strip().splitlines():
            name, vals = line.split(":")
            table[name] = [float(v) for v in vals.split(",")]
        gain, offset, drift = table[model]
        major = int(fw.split(".")[0])
        if major >= 3:
            gain *= 1.02
            offset += 0.05
        return {"gain": gain, "offset": offset, "drift": drift}

    def handle_reading(msg):
        cal = calibration(msg["model"], msg["fw"])
        value = msg["raw"] * cal["gain"] + cal["offset"]
        value += cal["drift"] * msg["uptime_h"] / 24
        return round(value, 3)

    def run(readings):
        return [handle_reading(m) for m in readings]
