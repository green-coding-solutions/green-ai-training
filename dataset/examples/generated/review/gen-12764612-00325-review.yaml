    store = RoomStore()
    ids = [store.add_message("r", "u", "t")["id"] for _ in range(MAX_PER_ROOM + 20)]
    assert len(set(ids)) == len(ids)
    assert len(store.latest("r", 5000)) == MAX_PER_ROOM
    assert store.latest("r", 3)[0]["id"] == ids[-1]
    assert [m["id"] for m in store.latest("r", 2)] == [ids[-1], ids[-2]]
    assert parse_limit("-4") == 1
    assert parse_limit("abc") == DEFAULT_LIMIT
    assert parse_limit(None) == DEFAULT_LIMIT
    assert parse_limit("999999") == MAX_PER_ROOM
    assert isinstance(store._rooms["r"], deque)
    assert store.latest("nope") == []
