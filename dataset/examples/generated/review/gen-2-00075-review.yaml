      const cursor = document.getElementById('cursor');
      const count = document.getElementById('count');
      const MAX_LINES = 2000;
      let n = 0;

      function blink(t) {
        cursor.style.opacity = Math.floor(t / 530) % 2 ? 0 : 1;
        requestAnimationFrame(blink);
      }
      requestAnimationFrame(blink);

      const es = new EventSource('/tail/stream?service=ingest');
      es.onmessage = (ev) => {
