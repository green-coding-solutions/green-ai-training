- role: assistant
  content: |
    **Workload:** web (campaign landing page, every ad click is a cold load)

    #### [Bug] `<source>` after `<img>` is ignored
    - **Where:** `.hero <picture>`
    - **Issue:** the browser only looks at `<source>` elements that come before the `<img>`. Right now every visitor gets `hero-app.jpg`, and the AVIF and WebP files are never used.
    - **Fix:** move both `<source>` lines above the `<img>`.

    #### [High] Below-the-fold images load eagerly
    - **Where:** customer logos, the four feature screenshots, the testimonial avatars
    - **Issue:** all of them are downloaded and decoded on every load, but most of your visitors never scroll down to them.
    - **Fix:** add `loading="lazy"`. They already have `width`/`height`, so the layout won't shift. If the logo strip is visible without scrolling on your main breakpoint, keep those six eager.
    - **Impact:** reduces E and network for every visitor who bounces. In Green Metrics Tool page-load benchmarks (an article with 15 photos), lazy-loading the images below the fold used about 12% less CPU energy on loads without scrolling. When visitors scrolled to the end, the difference was noise. So the saving here comes from your bounce traffic.

    #### [Medium] Hero image is lazy-loaded
    - **Where:** `.hero img`
    - **Issue:** the hero is always in view, so `loading="lazy"` saves nothing. The browser just waits for layout before it fetches the biggest image on the page, so the hero renders later.
    - **Fix:** remove `loading="lazy"` from the hero. The header logo stays eager as it is.

