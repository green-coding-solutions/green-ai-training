     }

     function renderLine(line) {
       let html = escapeHtml(line);
    -  for (const [name, url] of Object.entries(config.shortlinks)) {
    -    html = html.replace(new RegExp('\\b' + name + '-(\\d+)\\b', 'g'), `<a href="${url}$1">${name}-$1</a>`);
    -  }
    -  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    -  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    +  for (const { re, repl } of SHORTLINKS) html = html.replace(re, repl);
    +  html = html.replace(IMG_RE, '<img src="$2" alt="$1" loading="lazy">');
    +  html = html.replace(BOLD_RE, '<strong>$1</strong>');
       return html;
     }
    ```

    The shared `g` regexes are safe here because they are only used with `replace`, which resets `lastIndex`. Don't reuse them with `test()` or `exec()`. If a screenshot sits at the very top of the page, drop `loading="lazy"` for that one, since lazy-loading an image that is already visible delays it.

    **Already good:** the output is collected in an array and written once, and each file is read once.
