id: gen-2-00422-review
category: review
language: css
patterns:
- remove-unused-css
facts:
- F-UNUSED-CSS
messages:
- role: user
  content: |
    Review `landing.css`. Diff only please, no rewrite of the whole file.

    The page markup only uses these classes: `nav`, `hero`, `btn`, `btn-primary`, `features`, `feature-card`, `cta`, `footer`. No JS touches classes.

    ```css
    :root { --brand: #4f46e5; --text: #1f2937; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: var(--text); line-height: 1.5; }

    .nav { display: flex; justify-content: space-between; padding: 1rem 2rem; }
    .nav a { color: var(--text); text-decoration: none; margin-left: 1.5rem; }

    .hero { text-align: center; padding: 6rem 1rem; background: linear-gradient(#eef2ff, #fff); }
    .hero h1 { font-size: 3rem  line-height: 1.1; margin: 0 0 1rem; }

    .btn { display: inline-block; padding: .75rem 1.5rem; border-radius: 6px; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-ghost { border: 1px solid var(--brand); color: var(--brand); }

    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; padding: 4rem 2rem; }
    .feature-card { padding: 1.5rem; border: 1px solid #e5e7eb; border-radius: 8px; }

    .pricing-toggle { display: flex; gap: .5rem; }
    .pricing-toggle .active { background: var(--brand); color: #fff; }
    .price-card { padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

    .testimonial-slider { overflow: hidden; display: flex; }
    .testimonial-slide { min-width: 100%; padding: 2rem; }

    .cta { background: var(--brand); color: #fff; text-align: center; padding: 4rem 1rem; }
    .footer { padding: 2rem; font-size: .875rem; color: #6b7280; }

    @media (max-width: 700px) {
      .features { grid-template-columns: 1fr; }
      .testimonial-slide { padding: 1rem; }
      .price-card { padding: 1rem; }
    }
    ```
- role: assistant
  content: |
    **Workload:** web (static landing page)

    #### [Bug] Missing semicolon drops the hero heading style
    - **Where:** `.hero h1`
    - **Issue:** `font-size: 3rem  line-height: 1.1;` is one invalid declaration. The browser discards it, so the `h1` gets neither the font size nor the line height.
    - **Fix:** add the semicolon after `3rem`.

    #### [Low] Dead rules from removed sections
    - **Where:** `.btn-ghost`, `.pricing-toggle`, `.price-card`, `.testimonial-slider`, `.testimonial-slide`, and their copies in the `@media` block
    - **Issue:** none of these classes appear in the markup you listed. They look like leftovers from a pricing toggle and a testimonial slider.
    - **Fix:** delete them (see diff).
    - **Impact:** saves bytes on real networks, not CPU. In Green Metrics Tool micro-benchmarks, purging a 16 KB stylesheet with mostly unused rules down to 0.75 KB changed client energy by about 2% over 50 cold page loads (~783 J vs ~764 J), which is within measurement noise. Worth doing as cleanup, not as an energy fix.

    ```diff
     .hero h1 {
    -  font-size: 3rem  line-height: 1.1; margin: 0 0 1rem;
    +  font-size: 3rem; line-height: 1.1; margin: 0 0 1rem;
     }
    @@
     .btn-primary:hover { background: #4338ca; }
    -.btn-ghost { border: 1px solid var(--brand); color: var(--brand); }
    @@
     .feature-card { padding: 1.5rem; border: 1px solid #e5e7eb; border-radius: 8px; }

    -.pricing-toggle { display: flex; gap: .5rem; }
    -.pricing-toggle .active { background: var(--brand); color: #fff; }
    -.price-card { padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    -
    -.testimonial-slider { overflow: hidden; display: flex; }
    -.testimonial-slide { min-width: 100%; padding: 2rem; }
    -
     .cta { background: var(--brand); color: #fff; text-align: center; padding: 4rem 1rem; }
    @@
     @media (max-width: 700px) {
       .features { grid-template-columns: 1fr; }
    -  .testimonial-slide { padding: 1rem; }
    -  .price-card { padding: 1rem; }
     }
    ```

    Check that no other page links this file before you merge. The diff assumes `landing.css` serves only this page.

    **Already good:** the rules that remain are plain class selectors, with no deep nesting or heavy effects.
verify:
  static_only: CSS only, no runtime to execute
