id: gen-1-00184-review
category: review
language: dockerfile
patterns:
- small-container-images
messages:
- role: user
  content: |
    hello, i have Dockerfile for our ocean model postprocessing (python, xarray, netcdf). we run it on the cluster for many jobs, one container per job. the image is very big and pull is slow on every new node. can you look if something is wrong? thanks

    ```dockerfile
    FROM python:latest

    RUN apt-get update
    RUN apt-get install -y build-essential gfortran libhdf5-dev libnetcdf-dev git wget

    WORKDIR /opt/ocean

    COPY . .

    RUN pip install numpy scipy xarray netCDF4 h5py matplotlib
    RUN pip install -r requirements.txt

    ENV OMP_NUM_THREADS=4
    CMD ["python", "run_model.py", "--config", "configs/default.yaml"]
    ```

    in the folder we have run_model.py, ocean/ (our package), configs/, and data/ with some test netcdf files (a few GB), also .git
- role: assistant
  content: |
    **Workload:** scientific computing (batch jobs, many container starts and image pulls)

    #### [Bug] `apt-get update` in its own layer
    - **Where:** the two separate `RUN apt-get ...` lines
    - **Issue:** Docker caches the `update` layer. Later builds can reuse an old package index, and the `install` step then fails or installs stale packages.
    - **Fix:** run `update`, `install` and the cleanup in one `RUN`. With the multi-stage build below, the final image does not need apt at all.

    #### [Bug] `python:latest`
    - **Where:** `FROM python:latest`
    - **Issue:** the Python version changes without notice. Your numpy/netCDF4 builds can break or give different results between nodes.
    - **Fix:** pin a version, for example `python:3.12-slim`.

    #### [Security] Container runs as root
    - **Where:** no `USER` line
    - **Fix:** create a normal user and switch to it in the final stage.

    #### [High] `COPY . .` sends data, `.git` and everything else into the image
    - **Where:** `COPY . .`
    - **Issue:** your test netCDF files (a few GB) and the `.git` folder become image layers. Every node pulls them for every job. Also, the copy comes before `pip install`, so any edit in your code invalidates the pip layers and everything is reinstalled.
    - **Fix:** add a `.dockerignore`, copy only the code you need, and copy `requirements.txt` first so the dependency layer is cached. Mount the data at runtime with `-v` (or your cluster's shared filesystem).
    - **Impact:** reduces network and storage on every pull and every new node, and avoids rebuilding dependencies on each code change.

    #### [High] Compilers and dev headers in the runtime image
    - **Where:** `build-essential gfortran libhdf5-dev libnetcdf-dev git wget`, and the full `python` base image
    - **Issue:** these are only useful for compiling. The current wheels of numpy, scipy, netCDF4 and h5py already bundle their native libraries, so you most likely do not need them to install. They add a lot of size and attack surface to every container.
    - **Fix:** install packages into a virtualenv in a builder stage and copy only the venv into a `slim` final image. If one package has no wheel for your platform, add the compiler to the builder stage only.
    - **Impact:** reduces E (network, storage) and M (less disk and cache on each node) for every job.

    #### [Medium] pip cache stays in the layer
    - **Where:** both `pip install` lines
    - **Fix:** use `--no-cache-dir`. In the builder stage this no longer matters for the final size, but it keeps the builder small too.

    #### [Low] Two separate pip installs
    - **Where:** `pip install numpy scipy ...` then `pip install -r requirements.txt`
    - **Fix:** put all packages (pinned) in `requirements.txt` and do one install. One layer, and the versions are reproducible.

    ```dockerfile
    # syntax=docker/dockerfile:1
    FROM python:3.12-slim AS builder
    RUN python -m venv /opt/venv
    ENV PATH="/opt/venv/bin:$PATH"
    WORKDIR /build
    # requirements.txt should list numpy, scipy, xarray, netCDF4, h5py, matplotlib (pinned)
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    FROM python:3.12-slim
    RUN useradd --create-home --uid 10001 runner
    COPY --from=builder /opt/venv /opt/venv
    ENV PATH="/opt/venv/bin:$PATH" \
        OMP_NUM_THREADS=4 \
        PYTHONUNBUFFERED=1
    WORKDIR /opt/ocean
    COPY run_model.py ./
    COPY ocean/ ./ocean/
    COPY configs/ ./configs/
    USER runner
    CMD ["python", "run_model.py", "--config", "configs/default.yaml"]
    ```

    ```text
    # .dockerignore
    .git
    data/
    **/__pycache__/
    *.nc
    *.ipynb
    ```

    Run it with the data mounted, for example `docker run -v /path/to/data:/opt/ocean/data:ro ...`. The test files are no longer inside the image, so any path in `configs/default.yaml` that points to `data/` must work with that mount.

    **Already good:** `WORKDIR` is set, `CMD` uses the exec form, and the thread count is set through an environment variable.
verify:
  static_only: Dockerfile review, needs a container build
