    import contextlib, io, sys, tempfile
    from pathlib import Path

    with tempfile.TemporaryDirectory() as d:
        Path(d, "ride1.csv").write_text("lat,lon\n0,0\n0,1\n")
        Path(d, "ride2.csv").write_text("lat,lon\n60,0\n60,1\n")
        sys.argv = ["rides.py", d]
        buf = io.StringIO()
        with contextlib.redirect_stdout(buf):
            main()
        out = buf.getvalue().splitlines()
    assert out == ["ride1.csv: 111.2 km", "ride2.csv: 55.6 km", "total: 166.8 km"], out
