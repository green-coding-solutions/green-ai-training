id: gen-1-00342-review
category: review
language: javascript
patterns:
- system-fonts-and-deps
messages:
- role: user
  content: |
    review

    ```javascript
    import _ from 'lodash';
    import moment from 'moment';
    import numeral from 'numeral';

    export function cartSummary(items, shipDays) {
      const total = _.sumBy(items, (i) => i.price * i.qty);
      const count = _.sumBy(items, 'qty');
      const eta = moment().add(shipDays, 'days').format('ddd, MMM D');
      return {
        count,
        total: numeral(total).format('$0,0.00'),
        eta,
        names: _.uniq(_.map(items, 'name')),
      };
    }
    ```
- role: assistant
  content: |
    **Workload:** web frontend (cart page, runs for every shopper)

    #### [High] Three libraries for a few lines of work
    - **Where:** the `lodash`, `moment` and `numeral` imports
    - **Issue:** the function only sums two fields, formats one date and one price, and removes duplicate names. The browser has all of this built in. Each shopper downloads, parses and runs these libraries to do it. `import _ from 'lodash'` also pulls in the whole library, because a default import defeats tree-shaking. `moment` is in maintenance mode and is large for one date format.
    - **Fix:** use `reduce`, `Set`, `Intl.NumberFormat` and `Intl.DateTimeFormat`. Create the formatters once at module level, since building them is the costly part.
    - **Impact:** reduces network bytes and client CPU on every page view. The same shared page cost is paid again and again, so it adds up with traffic.

    #### [Low] Price math on floats
    - **Where:** `i.price * i.qty`
    - **Issue:** `0.1 * 3`-style products can drift by a fraction of a cent. The formatter hides it for display, but it can show up if you compare totals.
    - **Fix:** if prices come from your API, send integer cents and format at the end.

    ```javascript
    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    const shipDate = new Intl.DateTimeFormat('en-US', {
      weekday: 'short',
      month: 'short',
      day: 'numeric',
    });

    function cartSummary(items, shipDays, now = new Date()) {
      let total = 0;
      let count = 0;
      for (const i of items) {
        total += i.price * i.qty;
        count += i.qty;
      }
      const eta = new Date(now);
      eta.setDate(eta.getDate() + shipDays);
      return {
        count,
        total: money.format(total),
        eta: shipDate.format(eta),
        names: [...new Set(items.map((i) => i.name))],
      };
    }
    ```

    Notes:
    - Output format is the same for `en-US`. Pass the shopper's locale to `Intl` if you sell in more than one market.
    - I added an optional `now` argument so the date is easy to test.
    - If `moment` or `lodash` is already used heavily elsewhere in the same bundle, removing them from this one function saves little. Replace them everywhere or not at all.
verify:
  green_block: 0
  test: |-
    const items = [
      { name: 'Mug', price: 9.5, qty: 2 },
      { name: 'Mug', price: 9.5, qty: 1 },
      { name: 'Cap', price: 20, qty: 1 },
    ];
    const r = cartSummary(items, 3, new Date(2026, 9, 9));
    console.assert(r.count === 4, 'count');
    console.assert(r.total === '$48.50', 'total ' + r.total);
    console.assert(r.eta === 'Mon, Oct 12', 'eta ' + r.eta);
    console.assert(JSON.stringify(r.names) === '["Mug","Cap"]', 'names');
    if (r.count !== 4 || r.total !== '$48.50' || r.eta !== 'Mon, Oct 12' || JSON.stringify(r.names) !== '["Mug","Cap"]') {
      throw new Error('test failed');
    }
