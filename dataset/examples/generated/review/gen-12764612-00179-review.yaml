- role: assistant
  content: |
    **Workload:** web (internal log viewer)

    #### [Security] Log messages are inserted as HTML
    - **Where:** `tr.innerHTML = ...` in the script
    - **Issue:** `r.msg`, `r.level` and `r.ts` come from log data, and logs often contain user input (URLs, user agents, form fields). A line like `<img src=x onerror=...>` runs script in the page of whoever opens the viewer. `r.level` is also placed inside a `class` attribute.
    - **Fix:** build the cells with `textContent` and only accept known levels.

    ```html
    <script>
      const LEVELS = new Set(['error', 'warn', 'info', 'debug']);
      fetch('/api/tail?n=200')
        .then(r => r.json())
        .then(rows => {
          const tbody = document.getElementById('log');
          const frag = document.createDocumentFragment();
          for (const r of rows) {
            const tr = document.createElement('tr');
            const level = LEVELS.has(r.level) ? r.level : 'info';
            for (const [text, cls] of [[r.ts], [level, 'lvl-' + level], [r.msg]]) {
              const td = document.createElement('td');
              td.textContent = text;
              if (cls) td.className = cls;
              tr.appendChild(td);
            }
            frag.appendChild(tr);
          }
          tbody.appendChild(frag);
        });
    </script>
    ```

    The fragment also means the table is touched once instead of 200 times.

    #### [Low] About half of the stylesheet is unused
    - **Where:** `.btn` to `.tooltip` in `<style>`
    - **Issue:** the page has no buttons, modal, carousel, dropdown, navbar, badge, alert, pagination or tooltip. These rules look like a pasted framework chunk.
    - **Fix:** delete them. Keep `.lvl-error`, `.lvl-warn`, `.lvl-info` and add `.lvl-debug` if you use it. These classes are built from a string in the script, so a purge tool will not see them unless you safelist `lvl-*`.
    - **Impact:** saves bytes, not CPU. In Green Metrics Tool micro-benchmarks, purging a 16 KB stylesheet to under 1 KB changed client energy by about 2%, which is within noise. For a small internal page on a fast network, treat this as cleanup. A build step like PurgeCSS is not worth adding for it.

    **Already good:** the page makes one request for 200 rows, and the stylesheet is inline, so there is no extra request.
