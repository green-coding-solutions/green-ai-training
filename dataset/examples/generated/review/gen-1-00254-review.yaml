id: gen-1-00254-review
category: review
language: dockerfile
patterns:
- small-container-images
messages:
- role: user
  content: |
    hi, i am a PhD student and i made a Dockerfile for my diffusion simulation so my labmates can run it on the cluster. it works on my laptop but the image is huge and every small change in run_sim.py takes forever to build again. also my labmate said pip fails for him sometimes. i dont really know docker, can you tell me what is wrong?

    ```dockerfile
    FROM ubuntu:latest

    RUN apt-get update
    RUN apt-get install -y python3 python3-pip build-essential gfortran libopenblas-dev git wget

    COPY . /sim
    WORKDIR /sim

    RUN pip3 install numpy scipy matplotlib pandas h5py
    RUN pip3 install -r requirements.txt

    ENV OMP_NUM_THREADS=4

    CMD ["python3", "run_sim.py", "--config", "configs/diffusion.yaml"]
    ```

    the project folder has run_sim.py, configs/, requirements.txt, and also a data/ folder with the HDF5 input files and a results/ folder from old runs.
- role: assistant
  content: |
    **Workload:** script (batch simulation, run on a cluster by several people)

    #### [Bug] `ubuntu:latest` and system `pip3`
    - **Where:** `FROM ubuntu:latest`, both `pip3 install` lines
    - **Issue:** `latest` moves. Newer Ubuntu releases refuse `pip install` into the system Python ("externally-managed-environment"). So the build works for you and fails for your labmate, depending on when each image was pulled. Results can also change when the base image changes.
    - **Fix:** pin a Python base image, for example `python:3.12-slim`. Then `pip` works without extra flags.

    #### [High] `COPY . /sim` comes before `pip install`
    - **Where:** `COPY . /sim`
    - **Issue:** any change to `run_sim.py` invalidates the layer cache from that line on. All `pip install` steps run again, with a full download of numpy, scipy, and the rest. `data/` and `results/` are also copied into the image, so every build and every pull moves those files too.
    - **Fix:** copy `requirements.txt` first and install, then copy the code. Add a `.dockerignore` so `data/`, `results/`, and `.git` stay out. Mount the input data at run time.
    - **Impact:** reduces E and network on every rebuild and every image pull. Only the small code layer changes between builds.

    #### [High] Build tools and extra packages in the final image
    - **Where:** `apt-get install -y ... build-essential gfortran libopenblas-dev git wget`
    - **Issue:** compilers and `git`/`wget` are not needed to run the simulation. `numpy`, `scipy`, `pandas` and `h5py` ship prebuilt wheels with their own BLAS, so `libopenblas-dev` is not needed either. The apt package lists also stay in the layer.
    - **Fix:** drop the apt step. If one of your packages must compile from source, use a multi-stage build and copy only the installed packages into the final stage.
    - **Impact:** reduces M (storage) and network per pull. Smaller images are pulled on every cluster node.

    #### [Medium] Separate `apt-get update` layer and `pip` cache
    - **Where:** `RUN apt-get update` on its own line, `pip3 install` without `--no-cache-dir`
    - **Issue:** a lone `update` layer can go stale and break the next `install`. The pip download cache is stored in the image but never used again.
    - **Fix:** set `PIP_NO_CACHE_DIR=1`. If you ever need apt, do `update`, `install`, and `rm -rf /var/lib/apt/lists/*` in one `RUN`.

    #### [Low] Runs as root
    - **Where:** no `USER` line
    - **Issue:** many clusters (Apptainer, rootless Podman) expect a normal user, and output files owned by root are annoying.
    - **Fix:** add a non-root user.

    ```dockerfile
    FROM python:3.12-slim

    ENV PIP_NO_CACHE_DIR=1 \
        PYTHONDONTWRITEBYTECODE=1 \
        OMP_NUM_THREADS=4

    WORKDIR /sim

    COPY requirements.txt .
    RUN pip install -r requirements.txt

    COPY run_sim.py ./
    COPY configs/ configs/

    RUN useradd --create-home sim
    USER sim

    CMD ["python", "run_sim.py", "--config", "configs/diffusion.yaml"]
    ```

    `.dockerignore`:

    ```text
    .git
    data/
    results/
    __pycache__/
    *.ipynb
    ```

    Make sure `requirements.txt` lists numpy, scipy, matplotlib, pandas and h5py, so the old `pip3 install numpy ...` line is not needed. Run it with the data mounted:

    ```bash
    docker run --rm -v "$PWD/data:/sim/data:ro" -v "$PWD/results:/sim/results" sim-image
    ```

    The `results` mount must be writable by the `sim` user. If the simulation writes there, create the folder first or pass `--user "$(id -u):$(id -g)"`.

    **Already good:** the config is passed as a file, and `CMD` uses the exec form.
verify:
  static_only: Dockerfile review, needs a Docker daemon and network to build
