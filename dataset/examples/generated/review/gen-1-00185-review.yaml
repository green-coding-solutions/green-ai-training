id: gen-1-00185-review
category: review
language: html
patterns:
- system-fonts-and-deps
- context-tradeoff
messages:
- role: user
  content: |
    Public demo page for our sentiment model endpoint. Review, diff only please.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Sentiment demo</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@400;600&family=Fira+Code:wght@400;500&display=swap">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
      <style>
        body { font-family: 'Roboto', sans-serif; }
        h1, h2 { font-family: 'Open Sans', sans-serif; }
        pre, code { font-family: 'Fira Code', monospace; }
        .result { margin-top: 1rem; }
      </style>
    </head>
    <body>
    <div class="container">
      <h1><i class="fas fa-brain"></i> Sentiment demo</h1>
      <textarea id="text" class="form-control" rows="4"></textarea>
      <button id="go" class="btn btn-primary mt-2"><i class="fas fa-play"></i> Classify</button>
      <div id="out" class="result"></div>
      <pre id="raw"></pre>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <script>
    $('#go').on('click', function () {
      var text = $('#text').val();
      $.ajax({
        url: '/api/predict',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ text: text })
      }).done(function (res) {
        $('#out').html('<b>' + res.label + '</b> (' + _.round(res.score * 100, 1) + '%)');
        $('#raw').text(JSON.stringify(res, null, 2));
      });
    });
    </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    **Workload:** web (public demo page in front of an inference endpoint)

    #### [Security] Response text inserted as HTML
    - **Where:** `$('#out').html('<b>' + res.label + ...)`
    - **Issue:** `res.label` goes into the DOM as markup. If the label ever echoes input or a config value, that is XSS. The fix below uses `textContent`.

    #### [High] Four script libraries for one click handler
    - **Where:** jQuery, Popper, Bootstrap JS, lodash
    - **Issue:** the page uses `$` for one selector, one POST and one text update. It uses lodash for one rounding call. Popper and Bootstrap JS are never used (no modals, dropdowns or tooltips). Every visitor downloads, parses and runs all four before the page is ready.
    - **Fix:** native `fetch`, `textContent` and `Math.round`. Remove all four tags.
    - **Impact:** reduces network and client E on every page view.

    #### [Medium] Three font families, seven weights, plus an icon font
    - **Where:** Google Fonts link, Font Awesome link
    - **Issue:** this is a chain of requests (CSS, then font files) from third-party hosts. The text is two headings, one textarea and a JSON dump. Font Awesome is loaded for two icons.
    - **Fix:** system font stacks, and drop the icons.
    - **Impact:** reduces network bytes and render-blocking requests per visit.

    #### [Low] Full Bootstrap CSS for about five classes
    - **Where:** `bootstrap.min.css`
    - **Issue:** only `container`, `form-control` and `btn` are used. A few lines of CSS cover them. If this page will join a Bootstrap-based site later, keep Bootstrap and drop only the JS.

    ```diff
    -  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@400;600&family=Fira+Code:wght@400;500&display=swap">
    -  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    -  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
       <style>
    -    body { font-family: 'Roboto', sans-serif; }
    -    h1, h2 { font-family: 'Open Sans', sans-serif; }
    -    pre, code { font-family: 'Fira Code', monospace; }
    -    .result { margin-top: 1rem; }
    +    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    +    pre, code { font-family: ui-monospace, monospace; }
    +    textarea { width: 100%; box-sizing: border-box; }
    +    #out { margin-top: 1rem; }
       </style>
     </head>
     <body>
    -<div class="container">
    -  <h1><i class="fas fa-brain"></i> Sentiment demo</h1>
    -  <textarea id="text" class="form-control" rows="4"></textarea>
    -  <button id="go" class="btn btn-primary mt-2"><i class="fas fa-play"></i> Classify</button>
    -  <div id="out" class="result"></div>
    +<main>
    +  <h1>Sentiment demo</h1>
    +  <textarea id="text" rows="4"></textarea>
    +  <button id="go" type="button">Classify</button>
    +  <div id="out"></div>
       <pre id="raw"></pre>
    -</div>
    -<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    -<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    -<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    -<script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    +</main>
     <script>
    -$('#go').on('click', function () {
    -  var text = $('#text').val();
    -  $.ajax({
    -    url: '/api/predict',
    -    method: 'POST',
    -    contentType: 'application/json',
    -    data: JSON.stringify({ text: text })
    -  }).done(function (res) {
    -    $('#out').html('<b>' + res.label + '</b> (' + _.round(res.score * 100, 1) + '%)');
    -    $('#raw').text(JSON.stringify(res, null, 2));
    -  });
    -});
    +document.getElementById('go').addEventListener('click', async () => {
    +  const text = document.getElementById('text').value;
    +  const r = await fetch('/api/predict', {
    +    method: 'POST',
    +    headers: { 'Content-Type': 'application/json' },
    +    body: JSON.stringify({ text })
    +  });
    +  const res = await r.json();
    +  const out = document.getElementById('out');
    +  const label = document.createElement('b');
    +  label.textContent = res.label;
    +  out.replaceChildren(label, ` (${Math.round(res.score * 1000) / 10}%)`);
    +  document.getElementById('raw').textContent = JSON.stringify(res, null, 2);
    +});
     </script>
     </body>
     </html>
    ```

    Behavior notes: the old `.done()` ignored HTTP errors, and so does this version. Add a `r.ok` check if you want an error message. If your brand needs a specific typeface, self-host one `woff2` file with `font-display: swap` instead of three third-party families.
verify:
  static_only: HTML page with browser DOM and a network endpoint; not runnable with stdlib
