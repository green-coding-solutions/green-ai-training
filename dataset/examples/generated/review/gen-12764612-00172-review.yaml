messages:
- role: user
  content: |
    Hello, I make this page for our lab, it show the result of sequencing run, so the collegues can open the link and see the plots. Can you give me feedback please? I am biologist not web developper so maybe something is wrong, my english is not so good sorry.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Run report</title>
      <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 0 12px; }
        figure { margin: 24px 0; }
        img { max-width: 100%; height: auto; }
        .spinner {
          display: inline-block; width: 18px; height: 18px;
          border: 3px solid #ccc; border-top-color: #2a7; border-radius: 50%;
        }
      </style>
    </head>
    <body>
      <h1>Run <span id="run-name"></span> <span class="spinner" id="spin"></span></h1>
      <p id="status">QC is running...</p>

      <figure>
        <img src="plots/overview_quality.png" alt="Overview of read quality">
        <figcaption>Overview, all lanes</figcaption>
      </figure>
      <figure>
        <img src="plots/lane1_coverage.png" alt="Coverage lane 1">
        <figcaption>Coverage, lane 1</figcaption>
      </figure>
      <figure>
        <img src="plots/lane2_coverage.png" alt="Coverage lane 2">
        <figcaption>Coverage, lane 2</figcaption>
      </figure>
      <figure>
        <img src="plots/lane3_coverage.png" alt="Coverage lane 3">
        <figcaption>Coverage, lane 3</figcaption>
      </figure>
      <figure>
        <img src="plots/lane4_coverage.png" alt="Coverage lane 4">
        <figcaption>Coverage, lane 4</figcaption>
      </figure>
      <figure>
        <img src="plots/gc_content.png" alt="GC content">
        <figcaption>GC content per sample</figcaption>
      </figure>
      <figure>
        <img src="plots/duplication.png" alt="Duplication rate">
        <figcaption>Duplication rate</figcaption>
      </figure>

      <script>
        const spin = document.getElementById('spin');
        const statusEl = document.getElementById('status');
        let angle = 0;
        let done = false;

        // run name comes from the link, like report.html#run=R2291
        const params = new URLSearchParams(location.hash.slice(1));
        document.getElementById('run-name').innerHTML = params.get('run') || '';

        function spinLoop() {
          if (done) return;
          angle = (angle + 6) % 360;
          spin.style.transform = 'rotate(' + angle + 'deg)';
          requestAnimationFrame(spinLoop);
        }
        requestAnimationFrame(spinLoop);

        setInterval(async () => {
          const r = await fetch('status.json');
          const s = await r.json();
          if (s.qc === 'finished') {
            done = true;
            spin.style.display = 'none';
            statusEl.textContent = 'QC finished';
          }
        }, 10000);
      </script>
    </body>
    </html>
