- role: assistant
  content: |
    **Workload:** web (static docs page for a CLI tool)

    #### [Bug] The AVIF source can never be chosen
    - **Where:** the `<picture>` in the hero
    - **Issue:** the browser takes the first `<source>` it supports. Every browser supports JPEG, so `hero.jpg` always wins and `hero.avif` is never loaded.
    - **Fix:** put the best format first and the fallback last:
      ```html
      <picture>
        <source srcset="img/hero.avif" type="image/avif">
        <source srcset="img/hero.webp" type="image/webp">
        <img src="img/hero.jpg" width="1600" height="900"
             alt="fieldlog running on a Raspberry Pi in a field cabinet">
      </picture>
      ```
    - **Impact:** network, the smaller file is actually sent.

    #### [High] Photos are served as PNG
    - **Where:** `img/hero.png` (fallback `<img>`), `img/test-rig.png`
    - **Issue:** both are photos of real hardware. PNG is lossless, so photos are very large, and it was the most expensive format to decode. In Green Metrics Tool micro-benchmarks (50 page loads per format, browser CPU energy), PNG used ~181 J, JPG ~134 J, WebP ~150 J and AVIF ~159 J. The bigger saving is fewer transferred bytes, which that test does not measure.
    - **Fix:** use the same `<picture>` pattern for `test-rig`, with a JPG fallback:
      ```html
      <picture>
        <source srcset="img/test-rig.avif" type="image/avif">
        <source srcset="img/test-rig.webp" type="image/webp">
        <img src="img/test-rig.jpg" width="1200" height="800" alt="Test rig with six sensors">
      </picture>
      ```
      Create the files once in `fieldlog docs build`, not on request. In the same micro-benchmarks, AVIF encoding cost about 7× JPG. Only add AVIF if you keep that encoding in the build step. WebP plus JPG is a good, cheaper choice.
    - **Impact:** network and client CPU, per visitor. Biggest for the hero, which every visitor loads.

    #### [Low] Logo is a PNG
    - **Where:** `img/logo.png`
    - **Issue:** a 32×32 logo is tiny. No raster format will help much here, and decode cost is not the problem.
    - **Fix:** if you have the vector source, use `logo.svg`. Otherwise leave it as it is.
    - **Impact:** small, a few requests' worth of bytes.

    **Already good:** `width` and `height` are set on the images, so the layout does not jump. The hero is not lazy-loaded, which is right for the image at the top of the page.
verify:
  static_only: html markup only, no runnable code
