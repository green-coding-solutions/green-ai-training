messages:
- role: user
  content: |
    review pls

    ```html
    <!-- generated by `fieldlog docs build` -> public/index.html -->
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>fieldlog - sensor log collector</title>
      <link rel="stylesheet" href="css/site.css">
    </head>
    <body>
      <header>
        <img src="img/logo.png" width="32" height="32" alt="fieldlog">
        <nav><a href="#install">Install</a> <a href="#usage">Usage</a></nav>
      </header>

      <picture>
        <source srcset="img/hero.jpg" type="image/jpeg">
        <source srcset="img/hero.avif" type="image/avif">
        <img src="img/hero.png" width="1600" height="900"
             alt="fieldlog running on a Raspberry Pi in a field cabinet">
      </picture>

      <section id="install">
        <h2>Install</h2>
        <pre>pipx install fieldlog</pre>
      </section>

      <section id="usage">
        <h2>Usage</h2>
        <p>Our test rig in the lab:</p>
        <img src="img/test-rig.png" width="1200" height="800" alt="Test rig with six sensors">
