id: gen-1-00120-review
category: review
language: html
patterns:
- modern-image-formats
- lazy-load-images
facts:
- F-IMGENC
- F-IMGRENDER
messages:
- role: user
  content: |
    Hi, I make small status page for our IoT gateway (runs on Raspberry Pi in the field cabinet). Technicians open it on phone with SIM card, so connection is slow. Can you look if something is bad in my html? Thanks

    ```html
    <body>
      <header>
        <img src="/static/logo.png" class="logo" style="width:48px">
        <h1>Gateway GW-12</h1>
      </header>

      <section id="site">
        <h2>Site photos</h2>
        <img src="/static/img/site-overview.png" style="width:100%">
        <img src="/static/img/cabinet-front.png" style="width:100%">
        <img src="/static/img/cabinet-inside.png" style="width:100%">
        <img src="/static/img/antenna-roof.png" style="width:100%">
      </section>

      <section id="sensors">
        <h2>Sensors</h2>
        <table id="sensor-table"></table>
      </section>

      <script src="/static/status.js"></script>
    </body>
    ```

    The photos are PNG from my phone camera, about 4000px wide. logo.png is 600x600.
- role: assistant
  content: |
    **Workload:** web frontend served from an embedded gateway (small page, slow mobile link)

    #### [Bug] Images have no `alt` text and no size
    - **Where:** all four site photos and the logo
    - **Issue:** without `alt`, screen readers and broken-image cases show nothing useful. Without `width` and `height`, the page jumps while the photos load.
    - **Fix:** add `alt`, `width` and `height` to every `<img>`. The values below are examples. Use the real pixel size of your files.

    #### [High] Full-size PNG photos sent to a phone
    - **Where:** the four images in `#site`
    - **Issue:** PNG is lossless and made for graphics, not for camera photos. A 4000px photo is shown on a screen about 400 to 800px wide, so most of the bytes are never used. This is the biggest cost on a slow SIM link, and it is paid on every visit.
    - **Fix:** convert the photos once, on your PC or in your deploy script, to WebP (or AVIF) at about 1200px wide. Serve them with `<picture>` and a JPEG fallback.
    - **Impact:** reduces network bytes a lot for photos. The saving comes from the smaller files, not from cheaper decoding. In Green Metrics Tool browser benchmarks, AVIF decoding used about 19% more CPU energy than JPG ([measurements](https://metrics.green-coding.io/stats.html?id=b31ca361-1745-4fac-8e6b-a97ec99bf476)).
    - **Careful:** do not convert on the gateway when a page is requested. In Green Metrics Tool micro-benchmarks, encoding AVIF cost about 7× the energy of encoding JPG, and a Pi is a weak machine for this ([measurements](https://metrics.green-coding.io/stats.html?id=81a932bc-04da-443b-93cf-d4d8468de247)). Encode once, store the files, serve them as static files. WebP is the cheaper choice to encode. AVIF is smaller, but it costs more to encode.

    #### [Medium] All photos load at once
    - **Where:** `#site` images
    - **Issue:** the technician often looks only at the first photo or the sensor table. The other three are still downloaded right away and compete with the page on the slow link.
    - **Fix:** keep the first image eager, and add `loading="lazy"` to the others.
    - **Impact:** reduces network bytes for visits that never scroll down.

    #### [Low] 600x600 PNG logo for a 48px icon
    - **Where:** `logo.png`
    - **Issue:** the file is about 150 times larger in pixel area than what is shown.
    - **Fix:** use an SVG if you have a vector logo. If not, export a 96px WebP or PNG (2× for sharp screens).

    ```html
    <body>
      <header>
        <img src="/static/logo.svg" class="logo" width="48" height="48" alt="Company logo">
        <h1>Gateway GW-12</h1>
      </header>

      <section id="site">
        <h2>Site photos</h2>
        <picture>
          <source srcset="/static/img/site-overview-1200.webp" type="image/webp">
          <img src="/static/img/site-overview-1200.jpg" width="1200" height="800"
               style="width:100%;height:auto" alt="Site overview">
        </picture>
        <picture>
          <source srcset="/static/img/cabinet-front-1200.webp" type="image/webp">
          <img src="/static/img/cabinet-front-1200.jpg" width="1200" height="800"
               style="width:100%;height:auto" loading="lazy" alt="Cabinet, front view">
        </picture>
        <picture>
          <source srcset="/static/img/cabinet-inside-1200.webp" type="image/webp">
          <img src="/static/img/cabinet-inside-1200.jpg" width="1200" height="800"
               style="width:100%;height:auto" loading="lazy" alt="Cabinet, inside view">
        </picture>
        <picture>
          <source srcset="/static/img/antenna-roof-1200.webp" type="image/webp">
          <img src="/static/img/antenna-roof-1200.jpg" width="1200" height="800"
               style="width:100%;height:auto" loading="lazy" alt="Antenna on the roof">
        </picture>
      </section>

      <section id="sensors">
        <h2>Sensors</h2>
        <table id="sensor-table"></table>
      </section>

      <script src="/static/status.js"></script>
    </body>
    ```

    Create the files once on your PC, for example with `cwebp -q 80 -resize 1200 0 in.png -o out.webp`. Then copy them to the gateway.

    **Already good:** the page has no big framework, and the sensor table is filled by one small script.

    **Green Notes**
    - **Serve images in modern formats** (reduces network): WebP with a JPEG fallback sends far fewer bytes for photos than PNG. The files are encoded once, before deploy. https://patterns.greensoftware.foundation/development/media-and-code-efficiency/serve-images-in-modern-formats
    - **Defer offscreen images** (reduces network): the three photos below the first one load only when the technician scrolls to them. https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
    - *Not applied:* a CDN or an image service. A page for a few technicians does not need it, and static files on the gateway are enough.
verify:
  static_only: HTML only, no executable code
