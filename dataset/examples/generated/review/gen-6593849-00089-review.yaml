messages:
- role: user
  content: |
    Review, diff only please. This is the post-processing after our detector model on the CPU box. It runs once per batch, about 5M scored frames each, and it's now slower than the model itself.

    ```python
    import numpy as np

    # per-class temperature, only a handful of classes were calibrated
    CLASS_TEMP = {3: 0.8, 7: 1.4, 12: 0.9}


    def smooth_scores(scores, labels, alpha=0.2):
        """Temperature-scale each frame score, then apply an EMA over time."""
        out = np.empty_like(scores)
        prev = 0.0
        for i in range(len(scores)):
            try:
                t = CLASS_TEMP[int(labels[i])]
            except KeyError:
                t = 1.0
            s = scores[i] / t
            prev = alpha * s + (1.0 - alpha) * prev
            out[i] = prev
        return out
    ```
- role: assistant
  content: |
    **Workload:** AI/ML (inference post-processing, per batch)

    #### [High] Exception used for the common case
    - **Where:** `try: CLASS_TEMP[...] except KeyError`
    - **Issue:** only 3 classes are calibrated, so most frames miss and raise `KeyError`. Raising is the expensive part. In Green Metrics Tool micro-benchmarks with about half the keys missing, `dict.get` used about 12% less CPU energy than `try/except KeyError`. With a miss rate this high here, expect a bigger gap. `try/except` is only cheap when misses are rare.
    - **Fix:** no dict lookup in the loop at all (see the diff below).
    - **Impact:** reduces E on every frame.

    #### [High] Pure Python loop over millions of floats
    - **Where:** the `for i in range(len(scores))` loop
    - **Issue:** the EMA depends on `prev`, so you can't turn it into one NumPy expression. Each iteration runs in the interpreter. In Green Metrics Tool micro-benchmarks, a pure Python quantization loop over 10,000,000 samples used about 4× more CPU energy than the same loop with Numba `@njit`.
    - **Fix:** build a temperature array once and JIT the loop.
    - **Impact:** reduces E per batch. At 5M frames per batch and a long-running service, the one-time compile cost is small.

    ```diff
    -import numpy as np
    +import numpy as np
    +from numba import njit

     CLASS_TEMP = {3: 0.8, 7: 1.4, 12: 0.9}
    +_MAX_LABEL = max(CLASS_TEMP)
    +_TEMPS = np.ones(_MAX_LABEL + 1)
    +for _k, _v in CLASS_TEMP.items():
    +    _TEMPS[_k] = _v


    -def smooth_scores(scores, labels, alpha=0.2):
    -    out = np.empty_like(scores)
    -    prev = 0.0
    -    for i in range(len(scores)):
    -        try:
    -            t = CLASS_TEMP[int(labels[i])]
    -        except KeyError:
    -            t = 1.0
    -        s = scores[i] / t
    -        prev = alpha * s + (1.0 - alpha) * prev
    -        out[i] = prev
    -    return out
    +@njit(cache=True)
    +def _smooth(scores, labels, temps, alpha):
    +    out = np.empty_like(scores)
    +    prev = 0.0
    +    n = temps.shape[0]
    +    for i in range(scores.shape[0]):
    +        lab = labels[i]
    +        t = temps[lab] if 0 <= lab < n else 1.0
    +        prev = alpha * (scores[i] / t) + (1.0 - alpha) * prev
    +        out[i] = prev
    +    return out
    +
    +
    +def smooth_scores(scores, labels, alpha=0.2):
    +    """Temperature-scale each frame score, then apply an EMA over time."""
    +    return _smooth(scores, labels, _TEMPS, alpha)
    ```

    Notes on behavior:
    - Labels outside the table (including negative ones) still get `t = 1.0`, as before.
    - `scores` must be a float array and `labels` an integer array. The old code accepted a labels array of any numeric dtype through `int()`.
    - `cache=True` stores the compiled code on disk, so restarts skip the compile step. If this runs in a fresh process for a few thousand frames, the compile time can outweigh the gain. Keep the plain loop with `dict.get` there.

    **Already good:** the EMA is computed in one pass with no temporary arrays.
