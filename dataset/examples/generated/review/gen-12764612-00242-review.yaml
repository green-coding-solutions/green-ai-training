- role: assistant
  content: |
    **Workload:** data pipeline (static report page, opened by people every morning)

    #### [Bug] Third snapshot uses a local file path
    - **Where:** `<img src="file:///home/etl/out/snap/station_mill.png" ...>`
    - **Issue:** this only works on the machine that runs the job. For everyone else the image is broken, because browsers do not load `file:///` paths from a served page.
    - **Fix:** use the same relative path as the other two: `snap/station_mill.png`. Fix it where the job builds the path.

    #### [Medium] Camera photos are PNG
    - **Where:** the three `snap/station_*.png` images
    - **Issue:** PNG is made for flat graphics. For photos it keeps every pixel exactly, so the files are large and slow to load. The snapshots are photos, so JPEG or WebP fits them better.
    - **Fix:** write a smaller copy once, when the job saves each snapshot, and let the browser pick. Convert each snapshot once in the job. Do not convert on every page view.
    - **Impact:** mostly network, fewer bytes per page view. The client also does less work: in Green Metrics Tool micro-benchmarks (50 page loads per format), the browser used about 134 J for JPG, 150 J for WebP and 181 J for PNG.

    In the page:

    ```html
    <picture>
      <source srcset="snap/station_north.webp" type="image/webp">
      <img src="snap/station_north.jpg" alt="North station" width="1200" height="800">
    </picture>
    ```

    With Pillow in the pipeline step:

    ```python
    from PIL import Image

    img = Image.open("snap/station_north.png").convert("RGB")
    img.save("snap/station_north.jpg", quality=82)
    img.save("snap/station_north.webp", quality=80)
    ```

    #### [Low] AVIF is not needed here
    - **Issue:** AVIF files are the smallest, but encoding is expensive and decoding costs the browser more. In the same micro-benchmarks, AVIF encoding used about 7× the energy of JPG, and decoding used about 19% more than JPG. For three internal snapshots per day, JPG with WebP is enough.

    **Already good:** `width` and `height` are set on every image, `alt` text is there, and the chart as PNG is fine. A chart is flat graphics, which PNG handles well.
