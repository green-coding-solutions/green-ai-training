      CREATE TABLE hosts (
        id INTEGER PRIMARY KEY,
        hostname TEXT NOT NULL UNIQUE,
        ip_address TEXT,
        environment TEXT,
        group_id INTEGER REFERENCES host_groups(id),
        decommissioned_at TEXT,
        inventory_json TEXT,
        ssh_host_keys TEXT,
        notes TEXT,
        last_provision_log TEXT
      );
      INSERT INTO host_groups (id, name) VALUES (1, 'web'), (2, 'sandbox'), (3, 'db');
