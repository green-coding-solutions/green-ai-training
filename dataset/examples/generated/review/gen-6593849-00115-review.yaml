messages:
- role: user
  content: |
    review pls, shop.css from our old 2019 theme, we only use product grid, cart drawer and checkout now

    ```css
    /* shop.css */
    .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .product-card { border: 1px solid #e3e3e3; border-radius: 6px; padding: 12px; background: #fff; }
    .product-card img { width: 100%; height: auto; display: block; }
    .product-title { font-size: 16px; margin: 8px 0 4px; }
    .price { font-weight: 700; color: #111; }
    .price-old { text-decoration: line-through; color: #888; margin-right: 6px; }
    .badge-sale { position: absolute; top: 8px; left: 8px; background: #c0392b; color: #fff; padding: 2px 8px; }
    .btn-cart { background: #0a7d3b; color: #fff; border: 0; padding: 10px 16px; cursor: pointer; }
    .btn-cart:hover { background: #086a32; }

    .cart-drawer { position: fixed; right: 0; top: 0; width: 360px; height: 100%; background: #fff; }
    .cart-drawer .line-item { display: flex; justify-content: space-between; padding: 8px 0; }
    .cart-total { font-weight: 700; border-top: 2px solid #111; padding-top: 8px; }

    .checkout-form input { width: 100%; padding: 8px; border: 1px solid #ccc; }
    .checkout-form .error { backgroud-color: #fdecea; color: #c0392b; }

    .carousel { overflow: hidden; position: relative; }
    .carousel-item { float: left; width: 100%; }
    .carousel-prev, .carousel-next { position: absolute; top: 50%; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); }
    .modal-dialog { margin: 10% auto; width: 500px; background: #fff; }
    .newsletter-popup { position: fixed; bottom: 20px; left: 20px; }
    .wishlist-heart { color: #c0392b; }
    .tabs-legacy li { float: left; list-style: none; }
    ```
- role: assistant
  content: |
    **Workload:** web (e-commerce storefront)

    #### [Bug] Typo in a property name
    - **Where:** `.checkout-form .error`
    - **Issue:** `backgroud-color` is not a valid property. Browsers ignore it, so error messages get no light red background.
    - **Fix:**
      ```css
      .checkout-form .error { background-color: #fdecea; color: #c0392b; }
      ```

    #### [Low] Leftover rules from the old theme
    - **Where:** `.carousel*`, `.modal-*`, `.newsletter-popup`, `.wishlist-heart`, `.tabs-legacy`
    - **Issue:** you say the shop only uses the grid, the cart drawer and checkout. These rules look unused. Check them against your templates and JS first, because classes added at runtime (modals, popups) are easy to miss. In Green Metrics Tool micro-benchmarks of 50 cold page loads, purging a 16 KB stylesheet down to 0.75 KB changed client CPU energy by about 2%, which is within noise.
    - **Fix:** delete the blocks you confirm are dead. For a file this size, a manual clean-up is enough. A PurgeCSS step is only worth it if the stylesheet keeps growing.
    - **Impact:** bytes on the network, mostly for mobile visitors. Not measurable client CPU.

    #### [Low] Minify in the build, not by hand
    - **Where:** `shop.css` as shipped
    - **Issue:** comments and whitespace are sent to every visitor. In Green Metrics Tool micro-benchmarks, a minified build of a small booking page also came out about 2% lower, within noise. The gain is fewer bytes, not less CPU.
    - **Fix:** let your build tool minify (esbuild, cssnano or similar). Keep this readable file as the source.
    - **Impact:** network only, small.

    **Already good:** plain selectors with no deep nesting, and no web fonts or heavy effects in this file.
