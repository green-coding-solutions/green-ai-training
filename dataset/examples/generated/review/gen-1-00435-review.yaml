- role: user
  content: |
    hi, i wrote this node script for our lab. after every measurement run it makes a html page with some stats and the photo of the sample (microscope photo, we export them as png). it works but the page is slow to open and the script gets slow when a run has many readings. i dont really know what is wrong, can you look at it?

    ```js
    const fs = require('fs');
    const path = require('path');

    function summarize(values) {
      var sum = 0;
      for (var i = 0; i < values.length; i++) {
        sum = sum + values[i];
      }
      var mean = sum / values.length;

      var min = values[0];
      var max = values[0];
      for (var i = 0; i < values.length; i++) {
        if (values[i] < min) min = values[i];
        if (values[i] > max) max = values[i];
      }

      // sort a copy so we can get the median
      var sorted = values.slice();
      for (var i = 0; i < sorted.length; i++) {
        for (var j = 0; j < sorted.length - i - 1; j++) {
          if (sorted[j] > sorted[j + 1]) {
            var tmp = sorted[j];
            sorted[j] = sorted[j + 1];
            sorted[j + 1] = tmp;
          }
        }
      }
      var mid = Math.floor(sorted.length / 2);
      var median = sorted.length % 2 === 0
        ? (sorted[mid - 1] + sorted[mid]) / 2
        : sorted[mid];

      var sq = 0;
      for (var i = 0; i < values.length; i++) {
        sq = sq + (values[i] - mean) * (values[i] - mean);
      }
      var std = Math.sqrt(sq / (values.length - 1));

      // how many different values
      var unique = [];
      for (var i = 0; i < values.length; i++) {
        if (unique.indexOf(values[i]) === -1) {
          unique.push(values[i]);
        }
      }

      return { n: values.length, mean: mean, min: min, max: max, median: median, std: std, distinct: unique.length };
    }

    function renderReport(runs, outDir) {
      var html = '<!doctype html><html><body><h1>Measurement runs</h1>';
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        var s = summarize(run.values);
        html += '<h2>' + run.name + '</h2>';
        html += '<p>n=' + s.n + ', mean=' + s.mean.toFixed(3) + ', median=' + s.median.toFixed(3) +
                ', std=' + s.std.toFixed(3) + ', min=' + s.min + ', max=' + s.max +
                ', distinct=' + s.distinct + '</p>';
        html += '<img src="images/' + run.name + '_sample.png">';
        html += '<img src="images/' + run.name + '_plot.png">';
      }
      html += '</body></html>';
      fs.writeFileSync(path.join(outDir, 'report.html'), html);
    }

    module.exports = { summarize: summarize, renderReport: renderReport };
    ```
- role: assistant
  content: |
    **Workload:** script (report generator), with a page that is opened many times

    #### [Bug] Standard deviation is `NaN` for a run with one reading
    - **Where:** `Math.sqrt(sq / (values.length - 1))`
    - **Issue:** with one reading this divides 0 by 0, and the report shows `std=NaN`.
    - **Fix:** return `0` when there is only one value.

    #### [High] Sample photos are served as PNG
    - **Where:** `'<img src="images/' + run.name + '_sample.png">'`
    - **Issue:** PNG is lossless and works well for flat-colour charts. It is a poor fit for microscope photos, which are usually many times larger than a JPEG, WebP or AVIF of the same photo. Every visitor downloads all of it, on every run page. That is probably why the page is slow to open, especially on a phone or a slow link. If the exports are also much larger than the displayed size, you send pixels nobody sees.
    - **Fix:** make web copies of each photo in AVIF, WebP and JPEG, and let the browser choose with `<picture>`. Resize to the display width while you are at it. Do this once when the report is built, not when the page is requested. Keep the original PNG for your analysis. The web copies are lossy and are only for looking at.
    - **Impact:** reduces network bytes for every page view, and E on the client and server with it. The savings come from fewer transferred bytes. In Green Metrics Tool micro-benchmarks, encoding AVIF cost about 7× the energy of encoding JPG, and decoding AVIF in a browser cost about 19% more CPU energy than JPG ([measurements](https://metrics.green-coding.io/stats.html?id=81a932bc-04da-443b-93cf-d4d8468de247), [measurements](https://metrics.green-coding.io/stats.html?id=b31ca361-1745-4fac-8e6b-a97ec99bf476)). So encode once, and serve the files many times. Keep the plots as PNG, since flat-colour charts compress well. SVG would also work.

    #### [High] Hand-written bubble sort for the median
    - **Where:** the two nested `for` loops on `sorted`
    - **Issue:** bubble sort compares every pair, so the work grows with the square of the number of readings. This is the main reason the script gets slow on big runs.
    - **Fix:** use `sort` with a number comparator. Without `(a, b) => a - b`, JavaScript sorts numbers as text, so `10` would come before `9`.
    - **Impact:** reduces E, from quadratic to `n log n` work per run.

    #### [Medium] Counting distinct values with `indexOf`
    - **Where:** the `unique` loop
    - **Issue:** `indexOf` scans the whole `unique` array for every reading, which is quadratic again when most values differ.
    - **Fix:** `new Set(values).size`. One difference: `indexOf` counts every `NaN` as a new value, while a `Set` counts them once.
    - **Impact:** reduces E, from quadratic to linear work.

    ```js
    const fs = require('fs');
    const path = require('path');

    function summarize(values) {
      const n = values.length;

      // sum, min and max in one pass
      let sum = 0;
      let min = values[0];
      let max = values[0];
      for (const v of values) {
        sum += v;
        if (v < min) min = v;
        if (v > max) max = v;
      }
      const mean = sum / n;

      const sorted = [...values].sort((a, b) => a - b);
      const mid = Math.floor(n / 2);
      const median = n % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];

      const sq = values.reduce((acc, v) => acc + (v - mean) * (v - mean), 0);
      const std = n > 1 ? Math.sqrt(sq / (n - 1)) : 0;

      const distinct = new Set(values).size;

      return { n, mean, min, max, median, std, distinct };
    }

    function picture(base, alt) {
      return '<picture>' +
        '<source srcset="images/' + base + '.avif" type="image/avif">' +
        '<source srcset="images/' + base + '.webp" type="image/webp">' +
        '<img src="images/' + base + '.jpg" alt="' + alt + '" loading="lazy">' +
        '</picture>';
    }

    function renderReport(runs, outDir) {
      let html = '<!doctype html><html><body><h1>Measurement runs</h1>';
      for (const run of runs) {
        const s = summarize(run.values);
        html += '<h2>' + run.name + '</h2>';
        html += '<p>n=' + s.n + ', mean=' + s.mean.toFixed(3) + ', median=' + s.median.toFixed(3) +
                ', std=' + s.std.toFixed(3) + ', min=' + s.min + ', max=' + s.max +
                ', distinct=' + s.distinct + '</p>';
        html += picture(run.name + '_sample', 'Sample photo of ' + run.name);
        html += '<img src="images/' + run.name + '_plot.png" alt="Plot of ' + run.name + '">';
      }
      html += '</body></html>';
      fs.writeFileSync(path.join(outDir, 'report.html'), html);
    }

    module.exports = { summarize, renderReport };
    ```

    The web copies come from a separate step that runs once per new photo, for example with `sharp`:

    ```js
    const sharp = require('sharp');

    async function makeWebCopies(srcPng, outBase) {
      const img = sharp(srcPng).resize({ width: 800, withoutEnlargement: true });
      await img.clone().avif({ quality: 50 }).toFile(outBase + '.avif');
      await img.clone().webp({ quality: 80 }).toFile(outBase + '.webp');
      await img.clone().jpeg({ quality: 80 }).toFile(outBase + '.jpg');
    }
    ```

    Please do not write `Math.min(...values)` for the min and max. With very large arrays it can crash with a "too many arguments" error, so the single loop is safer.

    **Already good:** `+=` for building the HTML string is fine in JavaScript, so no change is needed there. The mean and variance code is correct.
