  module: true
  green_block: 0
  test: |
    const assert = require('assert');
    const os = require('os');
    const st = summarize([3, 1, 2, 2, 10]);
    assert.strictEqual(st.n, 5);
    assert.strictEqual(st.median, 2);
    assert.strictEqual(st.min, 1);
    assert.strictEqual(st.max, 10);
    assert.strictEqual(st.distinct, 4);
    assert.strictEqual(summarize([10, 9, 100]).median, 10);
    assert.strictEqual(summarize([5]).std, 0);
    const repDir = fs.mkdtempSync(path.join(os.tmpdir(), 'rep-'));
    renderReport([{ name: 'run1', values: [1, 2, 3, 4] }], repDir);
    const repHtml = fs.readFileSync(path.join(repDir, 'report.html'), 'utf8');
    assert(repHtml.includes('image/avif'));
    assert(repHtml.includes('run1_plot.png'));
