id: gen-1-00041-review
category: review
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    Review this beamline scan report template. Diff only please.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Scan 0412 · Beamline 7</title>
      <link rel="stylesheet" href="report.css">
    </head>
    <body>
      <header>
        <h1>Scan 0412: Fe K-edge XANES</h1>
        <p>Sample FE-22B, 38 frames, ring current 198 mA</p>
      </header>

      <section id="overview">
        <img src="plots/scan_0412_overview.png"
             alt="Normalized absorption vs energy"
             loading="lazy">
      </section>

      <section id="fit">
        <h2>Edge fit</h2>
        <table class="fit-params">
          <tr><th>E0</th><td>7112.3 eV</td></tr>
          <tr><th>chi2</th><td>0.0041</td></tr>
        </table>
      </section>

      <section id="frames">
        <h2>Detector frames</h2>
        <div class="grid">
          <img src="frames/f001.png" alt="Frame 1">
          <img src="frames/f002.png" alt="Frame 2">
          <img src="frames/f003.png" alt="Frame 3">
          <img src="frames/f004.png" alt="Frame 4">
          <img src="frames/f005.png" alt="Frame 5">
          <img src="frames/f006.png" alt="Frame 6">
          <img src="frames/f007.png" alt="Frame 7">
          <img src="frames/f008.png" alt="Frame 8">
        </div>
      </section>
    </body>
    </html>
    ```
- role: assistant
  content: |
    **Workload:** web (static report page)

    #### [Medium] Lazy loading on the image above the fold
    - **Where:** `#overview` image
    - **Issue:** this is the first thing everyone sees, so it always loads anyway. `loading="lazy"` saves nothing here and only delays the first paint.
    - **Fix:**
      ```html
      <img src="plots/scan_0412_overview.png"
           alt="Normalized absorption vs energy"
           width="1200" height="800">
      ```
    - **Impact:** no energy change, but the page shows its main plot sooner.

    #### [Low] Detector frames load eagerly
    - **Where:** `#frames .grid`, all 8 `<img>`
    - **Issue:** the frames sit below the plot and the fit table, and many readers stop before them. In Green Metrics Tool micro-benchmarks, an article with 15 photos used about 12% less CPU energy with `loading="lazy"` when the visitor did not scroll. When the visitor scrolled to the end, there was no measurable difference. So the saving depends on how people read this page.
    - **Fix:** add `loading="lazy"` to the frames (with sizes, see the next finding).
    - **Impact:** M and network, only for visits that do not reach the grid.

    #### [Bug] Frames have no width and height
    - **Where:** `#frames .grid` images
    - **Issue:** a lazy image without dimensions has no height until it loads. The grid collapses, so the browser sees all images as visible and fetches them at once. The layout also jumps while they load.
    - **Fix:** set the real pixel size on every frame (320×240 is assumed here):
      ```html
      <img src="frames/f001.png" alt="Frame 1" width="320" height="240" loading="lazy">
      ```
      Apply the same change to `f002` to `f008`. A CSS `aspect-ratio` on `.grid img` also works.
    - **Impact:** without this, the lazy loading in the previous finding does not work.

    **Already good:** `lang`, `alt` text on all images, and no scripts or extra assets.
verify:
  static_only: plain HTML template, nothing to execute
