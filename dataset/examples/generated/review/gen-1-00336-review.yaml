id: gen-1-00336-review
category: review
language: dockerfile
patterns:
- small-container-images
messages:
- role: user
  content: |
    hi, i am new to docker. i made this Dockerfile for our react app (vite) so CI can build it and we can deploy it. it works but i think something is not good, the image is very big and the build takes long on every push. can you look at it? what is wrong?

    ```dockerfile
    FROM node:20

    WORKDIR /app

    RUN apt-get update && apt-get install -y curl

    COPY . .

    RUN npm install
    RUN npm run build
    RUN npm install -g serve

    ENV NODE_ENV=production
    EXPOSE 3000

    HEALTHCHECK CMD curl -f http://localhost:3000/ || exit 1

    CMD ["serve", "-s", "dist", "-l", "3000"]
    ```
- role: assistant
  content: |
    **Workload:** CI/CD and deployment (static frontend image)

    #### [High] Build tools and sources are shipped in the runtime image
    - **Where:** the single `FROM node:20` stage
    - **Issue:** the final image holds the full Node image, `node_modules` with all dev dependencies, your source code, the npm cache and `serve`. The app is only static files in `dist`. At runtime none of the rest is used.
    - **Fix:** use a multi-stage build. Build in a Node stage, then copy only `dist` into a small `nginx:alpine` image.
    - **Impact:** reduces M and network. Every deploy and every new node pulls and stores the whole image, so a smaller image means fewer bytes moved and less disk used per replica. A static file server also needs less memory than a Node process running `serve`.

    #### [High] `COPY . .` comes before `npm install`
    - **Where:** lines 7-9
    - **Issue:** any change to any file (even a README) invalidates the layer cache, so `npm install` runs again on every push. That repeats downloads and CPU work on every CI run.
    - **Fix:** copy only `package.json` and `package-lock.json` first, run `npm ci`, then copy the rest. Add a `.dockerignore` so `node_modules`, `.git` and `dist` are not sent to the build.
    - **Impact:** reduces E and network per CI run. Dependencies are reinstalled only when the lockfile changes.

    #### [Medium] `npm install` instead of `npm ci`
    - **Where:** `RUN npm install`
    - **Issue:** `npm install` can change versions and may rewrite the lockfile. Builds are not reproducible. `npm ci` installs exactly what the lockfile says and is made for CI.
    - **Fix:** `RUN npm ci`

    #### [Low] `curl` installed only for the health check
    - **Where:** `apt-get install -y curl`
    - **Issue:** this adds a package layer and the apt lists to the image for one command. The `nginx:alpine` image already has `wget`, so you can drop it.
    - **Fix:** use `wget` in the health check (see below).

    Here is the improved version. Single-page apps need a fallback to `index.html`, so it uses a small nginx config.

    ```dockerfile
    FROM node:20-alpine AS build
    WORKDIR /app

    COPY package.json package-lock.json ./
    RUN npm ci

    COPY . .
    RUN npm run build

    FROM nginx:alpine
    COPY nginx.conf /etc/nginx/conf.d/default.conf
    COPY --from=build /app/dist /usr/share/nginx/html

    EXPOSE 80
    HEALTHCHECK CMD wget -qO /dev/null http://127.0.0.1/ || exit 1
    ```

    `nginx.conf`:

    ```text
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri /index.html;
      }
    }
    ```

    `.dockerignore`:

    ```text
    node_modules
    dist
    .git
    *.log
    ```

    The container now listens on port 80, not 3000. Change your port mapping or deployment config to match.

    **Already good:** `WORKDIR` is set, `CMD` uses the exec form, and the build is one `npm run build` step.
verify:
  static_only: Dockerfile review; needs a Docker daemon and a Node project to build
