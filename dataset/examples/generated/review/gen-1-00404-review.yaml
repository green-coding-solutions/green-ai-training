    import sqlite3
    conn = sqlite3.connect(":memory:")
    conn.execute(
        "CREATE TABLE builds (id INTEGER PRIMARY KEY, pipeline TEXT, branch TEXT, "
        "status TEXT, started_at TEXT, duration_s INTEGER, runner TEXT, "
        "commit_sha TEXT, log_text TEXT, artifact_manifest TEXT)"
    )
    conn.executemany(
        "INSERT INTO builds VALUES (?,?,?,?,?,?,?,?,?,?)",
        [
            (1, "api", "main", "failed", "2026-10-01", 100, "r1", "a1", "log", "{}"),
            (2, "api", "dev", "passed", "2026-10-02", 300, "r2", "a2", "log", "{}"),
            (3, "api", "dev", "passed", "2026-10-03", 300, "r2", "a3", "log", "{}"),
            (4, "web", "dev", "passed", "2026-10-03", 50, "r1", "a4", "log", "{}"),
        ],
    )
    rep = pipeline_report(conn, "api", "2026-01-01")
    assert rep["builds"] == 3
    assert rep["failed"] == 1
    assert rep["fail_rate"] == 0.333
    assert rep["avg_duration_s"] == 233.3
    assert rep["longest_build"] == 2
    assert rep["top_runner"] == "r2"
    assert rep["main_broken"] is True
    assert conn.row_factory is None
    empty = pipeline_report(conn, "api", "2027-01-01")
    assert empty["builds"] == 0
    assert empty["longest_build"] is None
    assert empty["top_runner"] is None
    assert empty["main_broken"] is False
