messages:
- role: user
  content: |
    Can you review this helper from our CI tooling? It builds the numbers for the pipeline health comment that our bot posts on every merge request, and it also runs in the nightly report. So it gets called a lot during the day.

    Context and requirements:
    - The `builds` table has a lot of columns (commit info, runner info, timings, `log_text` with the full build log, `artifact_manifest` as JSON, and more). Logs can be several MB for big pipelines.
    - A normal window has a couple of thousand builds per pipeline.
    - Python 3.9 on the runners, standard library only, and I can't change the schema.
    - The returned dict keys must stay the same, because the bot formats them.

    I'm looking for anything wrong or wasteful, ranked by how much it matters.

    ```python
    import sqlite3


    def pipeline_report(conn, pipeline, since):
        """Summary for the CI dashboard / nightly Slack message."""
        conn.row_factory = sqlite3.Row
        rows = conn.execute(
            "SELECT * FROM builds WHERE pipeline = ? AND started_at >= ?",
            (pipeline, since),
        ).fetchall()

        total = 0
        failed = 0
        total_duration = 0
        longest = None
        runner_counts = {}
        for r in rows:
            total += 1
            total_duration += r["duration_s"]
            if r["status"] == "failed":
                failed += 1
            if longest is None or r["duration_s"] > longest["duration_s"]:
                longest = r
            if r["runner"] in runner_counts:
                runner_counts[r["runner"]] += 1
            else:
                runner_counts[r["runner"]] = 1

        top_runner = None
        top_count = 0
        for name in runner_counts:
            if runner_counts[name] > top_count:
                top_runner = name
                top_count = runner_counts[name]

        main_broken = False
        for r in rows:
            if r["branch"] == "main" and r["status"] == "failed":
                main_broken = True
                break

        return {
            "pipeline": pipeline,
            "builds": total,
            "failed": failed,
            "fail_rate": round(failed / total, 3) if total else 0.0,
            "avg_duration_s": round(total_duration / total, 1) if total else 0.0,
            "longest_build": longest["id"] if longest else None,
            "top_runner": top_runner,
            "main_broken": main_broken,
        }
    ```
- role: assistant
  content: |
    **Workload:** data pipeline

    #### [Bug] `row_factory` is changed on the caller's connection
    - **Where:** `conn.row_factory = sqlite3.Row`
    - **Issue:** the setting stays on `conn` after the function returns. Any other code that shares this connection and expects plain tuples will get `Row` objects instead.
    - **Fix:** set it on a cursor, so it only affects this query.

    #### [High] `SELECT *` loads columns you never read
    - **Where:** the query in `pipeline_report`
    - **Issue:** the function uses five columns (`id`, `branch`, `status`, `duration_s`, `runner`). The query reads every column of every build in the window, including `log_text` and `artifact_manifest`. That is several MB of log per big build, read and copied into Python memory just to be thrown away, on every merge request.
    - **Fix:** name the five columns. In Green Metrics Tool micro-benchmarks on PostgreSQL, `SELECT *` on a 52-column table with large text columns used about 7× more CPU energy than selecting 10 named columns (2,500 rows). Your engine and schema differ, so the factor will differ. The saving grows with the size of the skipped columns, and build logs are large.
    - **Pattern:** Reduce transmitted data
    - **Impact:** reduces E and data moved per call. It scales with every MR pipeline and nightly run.

    #### [Medium] Hand-written counting loops
    - **Where:** the main `for` loop, the `runner_counts` loop and the `main_broken` loop
    - **Issue:** three loops do work that `sum`, `max`, `Counter` and `any` do directly. `any` also stops at the first match.
    - **Fix:** use the built-ins. Results stay identical, including ties: `max` and `Counter.most_common` both return the first entry in insertion order, like your strict `>` checks.
    - **Impact:** small reduction in E next to the query fix. Mostly less code to maintain.

    #### [Low] Counting could happen in SQL
    - **Where:** the whole function
    - **Issue:** if the window grows a lot, `COUNT`, `SUM` and `GROUP BY` would move only a few rows instead of thousands.
    - **Fix:** not needed at a couple of thousand rows. I left it out because the tie-breaking for `longest_build` and `top_runner` would need extra care.

    **Already good:** the query is parameterized and runs once, not once per build.

    ```python
    import sqlite3
    from collections import Counter


    def pipeline_report(conn, pipeline, since):
        """Summary for the CI dashboard / nightly Slack message."""
        cur = conn.cursor()
        cur.row_factory = sqlite3.Row
        rows = cur.execute(
            "SELECT id, branch, status, duration_s, runner "
            "FROM builds WHERE pipeline = ? AND started_at >= ?",
            (pipeline, since),
        ).fetchall()

        total = len(rows)
        failed = sum(r["status"] == "failed" for r in rows)
        total_duration = sum(r["duration_s"] for r in rows)
        longest = max(rows, key=lambda r: r["duration_s"], default=None)
        top = Counter(r["runner"] for r in rows).most_common(1)
        main_broken = any(
            r["branch"] == "main" and r["status"] == "failed" for r in rows
        )

        return {
            "pipeline": pipeline,
            "builds": total,
            "failed": failed,
            "fail_rate": round(failed / total, 3) if total else 0.0,
            "avg_duration_s": round(total_duration / total, 1) if total else 0.0,
            "longest_build": longest["id"] if longest else None,
            "top_runner": top[0][0] if top else None,
            "main_broken": main_broken,
        }
    ```

    The returned dict is unchanged, so the bot code needs no edits. If you add a column the report needs later, add it to the `SELECT` list on purpose.
