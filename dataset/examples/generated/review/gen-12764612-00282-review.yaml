    import os, tempfile
    p = os.path.join(tempfile.mkdtemp(), "a.log")
    with open(p, "w") as fh:
        fh.write('10.0.1.12 - - [01/Oct/2026:10:00:00 +0000] "GET / HTTP/1.1" 200 10\nbroken line\n\n10.9.9.9 - - [01/Oct/2026:10:00:01 +0000] "GET / HTTP/1.1" 502 5\n')
    r, e = summarize(p)
    assert r == {"payments": 1, "unowned": 1}, r
    assert e == {"unowned": 1}, e
