    assert host_group("gw-eu-12") == ("gw", "eu")
    assert host_group("weird") == ("other", "other")
    assert parse_line("<134>Oct 25 03:14:07 gw-eu-12 nginx[212]: hi") == (134, "gw-eu-12")
    assert parse_line("garbage") is None
    assert parse_line("") is None
    assert parse_line("<x>Oct 25 03:14:07 gw-eu-12 a: b") is None
    assert host_group.cache_info().maxsize == 1024
