    import gzip as _gz

    assert guess_type("/a/Site.CSS") == "text/css"
    assert guess_type("x.jpeg") == "image/jpeg"
    assert guess_type("x.woff2") == "font/woff2"
    assert guess_type("x.bin") == "application/octet-stream"
    assert guess_type("noext") == "application/octet-stream"

    def call(path, enc=""):
        out = {}
        def sr(status, headers):
            out["status"] = status
            out["headers"] = dict(headers)
        body = b"".join(app({"PATH_INFO": path, "HTTP_ACCEPT_ENCODING": enc}, sr))
        return out, body

    r, b = call("/", "gzip, br")
    assert r["status"].startswith("200")
    assert r["headers"]["Content-Encoding"] == "gzip"
    assert r["headers"]["Vary"] == "Accept-Encoding"
    assert _gz.decompress(b) == HOME_HTML
    assert int(r["headers"]["Content-Length"]) == len(b)

    r, b = call("/", "")
    assert "Content-Encoding" not in r["headers"]
    assert b == HOME_HTML

    r, b = call("/../" + os.path.basename(__file__) if "__file__" in globals() else "/../x.py", "gzip")
    assert r["status"].startswith("404")
    r, b = call("/missing.css", "gzip")
    assert r["status"].startswith("404")

    assert should_compress("a.css", b"x" * 1000)
    assert not should_compress("a.png", b"x" * 1000)
    assert not should_compress("a.css", b"x" * 10)
