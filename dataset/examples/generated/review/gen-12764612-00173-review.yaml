messages:
- role: user
  content: |
    Internal CI dashboard (build list + build detail page), served by nginx to about 40 devs. `buildboard.css` is shipped as-is, no build step for CSS. Review it, diff only please. Templates only use `.builds`, `.build-row`, `.badge*`, `.status-failed`, `.log`, `.err`.

    ```css
    :root { --ok: #1a7f37; --fail: #b42318; --run: #9a6700; --bg: #f6f8fa; }

    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: #1f2328; }

    .builds { width: 100%; border-collapse: collapse; }
    .build-row td { padding: 6px 10px; border-bottom: 1px solid #d0d7de; }

    .badge { display: inline-block; padding: 0 8px; border-radius: 10px; color: #fff; }
    .badge-ok { background: var(--ok); }
    .badge-fail { background: var(--fail); }
    .badge-running { background: var(--run); }

    .status-failed { color: var(--fail)
      font-weight: 600; }

    .log { background: #0d1117; color: #c9d1d9; font: 12px/1.4 ui-monospace, monospace; padding: 12px; overflow: auto; }
    .log .err { color: #ff7b72; }

    /* from the old admin theme */
    .carousel { position: relative; overflow: hidden; }
    .carousel-item { display: none; float: left; width: 100%; }
    .carousel-item.active { display: block; }
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: none; }
    .modal.open { display: flex; align-items: center; justify-content: center; }
    .tooltip { position: absolute; background: #000; color: #fff; padding: 2px 6px; }
    .legacy-ie .builds { zoom: 1; }
    ```
- role: assistant
  content: |
    **Workload:** web (small internal tool, static CSS)

    #### [Bug] Missing semicolon drops two declarations
    - **Where:** `.status-failed`
    - **Issue:** `color: var(--fail)` has no `;`, so the parser reads `var(--fail) font-weight: 600` as one invalid value. Both `color` and `font-weight` are discarded. Failed builds are not styled.
    - **Fix:**
      ```diff
      -.status-failed { color: var(--fail)
      -  font-weight: 600; }
      +.status-failed { color: var(--fail); font-weight: 600; }
      ```

    #### [Low] Unused rules from the old admin theme
    - **Where:** `.carousel*`, `.modal*`, `.tooltip`, `.legacy-ie .builds`
    - **Issue:** none of these classes are in your templates. They are dead bytes.
    - **Fix:**
      ```diff
      -/* from the old admin theme */
      -.carousel { position: relative; overflow: hidden; }
      -.carousel-item { display: none; float: left; width: 100%; }
      -.carousel-item.active { display: block; }
      -.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: none; }
      -.modal.open { display: flex; align-items: center; justify-content: center; }
      -.tooltip { position: absolute; background: #000; color: #fff; padding: 2px 6px; }
      -.legacy-ie .builds { zoom: 1; }
      ```
    - **Impact:** network bytes only. In Green Metrics Tool micro-benchmarks, purging a 16 KB stylesheet down to 0.75 KB changed client energy by about 2%, which is within noise. For 40 users on an internal network this is cleanup, not an energy win. Delete the rules by hand and skip any purge tooling.

    #### [Low] No minification
    - **Where:** serving `buildboard.css` unchanged
    - **Issue:** a stylesheet this small gains only a few bytes from minifying. In the same kind of benchmark, a minified small bundle was about 2% lower, again within noise.
    - **Fix:** none. Adding a CSS build step costs more in upkeep than it saves. Revisit it only if you add one for other reasons.

    **Already good:** no `@import` chains, one stylesheet, a system font stack, colors in custom properties.
verify:
  static_only: CSS only, no runtime to execute
