messages:
- role: user
  content: |
    pls review my code for the landing page, its for pricing section. i think its little slow when scroling on old phones. sorry for my english

    ```javascript
    function getBadgeClass(plan) {
      if (plan.toLowerCase() == 'free' || plan.toLowerCase() == 'starter') {
        return 'badge-free';
      } else if (plan.toLowerCase() == 'pro' || plan.toLowerCase() == 'team') {
        return 'badge-popular';
      } else if (plan.toLowerCase() == 'enterprise') {
        return 'badge-contact';
      }
    }
    ```

    ```javascript
    window.addEventListener('scroll', function () {
      const cards = document.querySelectorAll('.pricing-card');
      for (let i = 0; i < cards.length; i++) {
        const rect = cards[i].getBoundingClientRect();
        cards[i].querySelector('.badge').className =
          'badge ' + getBadgeClass(cards[i].dataset.plan);
        if (rect.top < window.innerHeight - 40) {
          cards[i].classList.add('visible');
        }
      }
    });
    ```
- role: assistant
  content: |
    **Workload:** web (landing page, runs in the browser on every scroll event)

    #### [Bug] Unknown plan gives the class `undefined`
    - **Where:** `getBadgeClass`, no final `else`
    - **Issue:** for a plan like `"custom"` the function returns `undefined`, and the handler builds `'badge undefined'`. That is a real CSS class name on the page.
    - **Fix:** return an empty string for unknown plans.

    #### [High] Badge work repeated on every scroll event
    - **Where:** scroll handler
    - **Issue:** a scroll fires many times per second. Each time you query all cards, look up `.badge`, compute the class and write `className`. The plan never changes while the user scrolls, so only the first run is needed. Writing `className` also makes the browser check styles again each time. This is most visible on old phones.
    - **Fix:** set the badges once after the page loads. Keep only the visibility check in the scroll handler, and read the card list once.
    - **Impact:** reduces E for every scroll event, for every visitor.

    #### [Medium] Chain of repeated `toLowerCase()` and `==` checks
    - **Where:** `getBadgeClass`
    - **Issue:** `plan.toLowerCase()` runs up to 5 times per call, and the branches are tested one after another. A lookup table does one `toLowerCase()` and one lookup, and it is easier to extend. Use `Map`, not a plain object, so a value like `"constructor"` does not match an inherited property.
    - **Fix:** see below.
    - **Impact:** reduces E a little per call. In Green Metrics Tool Python micro-benchmarks, simple equality branches used about 16% less CPU energy than complex conditions. That was Python, so take it as a direction only. In JavaScript the bigger gain is from calling the function far less (see High).

    ```javascript
    const BADGE_CLASS = new Map([
      ['free', 'badge-free'],
      ['starter', 'badge-free'],
      ['pro', 'badge-popular'],
      ['team', 'badge-popular'],
      ['enterprise', 'badge-contact'],
    ]);

    function getBadgeClass(plan) {
      return BADGE_CLASS.get(plan.toLowerCase()) ?? '';
    }
    ```

    ```javascript
    document.addEventListener('DOMContentLoaded', function () {
      const cards = Array.from(document.querySelectorAll('.pricing-card'));

      // badges: once, not on every scroll
      for (const card of cards) {
        card.querySelector('.badge').className =
          ('badge ' + getBadgeClass(card.dataset.plan)).trim();
      }

      // scroll: only the visibility check
      function reveal() {
        for (const card of cards) {
          if (card.getBoundingClientRect().top < window.innerHeight - 40) {
            card.classList.add('visible');
          }
        }
      }
      window.addEventListener('scroll', reveal, { passive: true });
      reveal();
    });
    ```

    For known plans the result is the same as before. Only unknown plans change, from `undefined` to no badge class. The `passive: true` flag tells the browser the handler will not block scrolling.

    **Already good:** the reveal check only adds a class and never removes it, so it does no extra work after a card is visible.
verify:
  green_block: 0
  test: |
    console.assert(getBadgeClass('Pro') === 'badge-popular');
    console.assert(getBadgeClass('custom') === '');
    console.assert(getBadgeClass('constructor') === '');
