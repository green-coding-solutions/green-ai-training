id: gen-1-00162-review
category: review
language: sql
patterns:
- batch-db-writes
facts:
- F-PG-INSERT
sql_dialect: postgres
messages:
- role: user
  content: |
    Hi, can you review our signup import? Context: the landing page form for our product launch stores signups in a small MySQL instance that marketing owns. Every night a Python script dumps the new rows into `import_launch_signups.sql`, and a CI job loads that file into our Postgres 16 with `psql -f`. We get about 20,000 new signups per night during the launch.

    Requirements:
    - the job must be safe to re-run if CI retries it
    - no signup may get lost or duplicated
    - the load should be as cheap as reasonably possible, it runs every night
    - we can change the exporter script if needed

    Table:

    ```sql
    CREATE TABLE signups (
        id           bigserial PRIMARY KEY,
        email        text NOT NULL UNIQUE,
        full_name    text NOT NULL,
        source       text NOT NULL,
        signed_up_at timestamptz NOT NULL
    );
    ```

    Generated file:

    ```sql
    -- import_launch_signups.sql, generated by export_signups.py
    INSERT INTO signups (email, full_name, source, signed_up_at) VALUES ('anna.meier@example.com', 'Anna Meier', 'landing-hero', '2026-10-24 08:14:22');
    INSERT INTO signups (email, full_name, source, signed_up_at) VALUES ('conor.oneil@example.com', 'Conor O'Neil', 'landing-footer', '2026-10-24 08:15:03');
    INSERT INTO signups (email, full_name, source, signed_up_at) VALUES ('li.wei@example.com', 'Li Wei', 'newsletter-popup', '2026-10-24 08:15:41');
    INSERT INTO signups (email, full_name, source, signed_up_at) VALUES ('sofia.r@example.com', 'Sofia Rossi', 'landing-hero', '2026-10-24 08:16:09');
    -- ... about 20,000 more lines like this
    ```

    CI call: `psql "$DATABASE_URL" -f import_launch_signups.sql`
- role: assistant
  content: |
    **Workload:** data pipeline (nightly import job)

    #### [Bug] Names with an apostrophe break the file
    - **Where:** `'Conor O'Neil'`
    - **Issue:** the exporter writes values without escaping quotes. The statement is a syntax error and that signup is lost. A name like `x'); DROP TABLE signups; --` would be a SQL injection, because the file is built from data that visitors typed into a form.
    - **Fix:** stop generating SQL text from user input. Write a CSV with Python's `csv` module, which quotes fields correctly, and load it with `\copy` (see below).

    #### [Bug] Re-running the job is not safe
    - **Where:** plain `INSERT` without `ON CONFLICT`, and `psql -f` without `ON_ERROR_STOP`
    - **Issue:** every statement commits on its own, and psql carries on after an error. A retry inserts nothing new, throws thousands of unique-violation errors, and CI may still report success. A half-failed first run leaves a partial load.
    - **Fix:** load in one transaction, skip emails that already exist, and fail the job on any error:
      ```bash
      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f import_launch_signups.sql
      ```

    #### [High] One statement per signup
    - **Where:** the whole file, one `INSERT` per row
    - **Issue:** 20,000 statements means 20,000 parses, plans and commits. In Green Metrics Tool micro-benchmarks (PostgreSQL 16, 500,000 rows in batches of 5,000), one `execute()` per row used ~384 J, while `COPY ... FROM STDIN` used ~17 J, about 22× less. The gap was small with batches of only 100 rows, so the win comes from your batch being large. 20,000 rows per night is large enough.
    - **Fix:** have the exporter write `signups.csv` (header row, no SQL). Then load it through a temporary staging table, so `ON CONFLICT` still works:
      ```sql
      -- import_launch_signups.sql
      CREATE TEMP TABLE signups_stage (
          email        text,
          full_name    text,
          source       text,
          signed_up_at timestamptz
      ) ON COMMIT DROP;

      \copy signups_stage FROM 'signups.csv' WITH (FORMAT csv, HEADER true)

      INSERT INTO signups (email, full_name, source, signed_up_at)
      SELECT email, full_name, source, signed_up_at
      FROM signups_stage
      ON CONFLICT (email) DO NOTHING;
      ```
      Run it with the `--single-transaction` command above. A retry now inserts nothing twice, and the whole load is one commit.
    - **Impact:** E on the database and the CI runner, every night. It also removes the round trips and per-statement commits.

    **Already good:** the `UNIQUE` constraint on `email` is the right guard. It is what makes `ON CONFLICT` work.

    *Note:* if you must keep a SQL file, put about 1,000 rows into each multi-row `INSERT ... VALUES (...), (...)`. That is cheaper than one row per statement, but still not as cheap as `COPY`, and it keeps the escaping problem.
verify:
  static_only: psql meta-commands (\copy), Postgres COPY and generated import file; not runnable in SQLite
