messages:
- role: user
  content: |
    review pls

    ```python
    import re

    TS = re.compile(r"^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}")

    def fold_log(path):
        """Fold multi-line records (stack traces) into one line per record."""
        out = ""
        current = ""
        for line in open(path):
            line = line.rstrip("\n")
            if TS.match(line):
                if current:
                    out += current + "\n"
                current = line
            else:
