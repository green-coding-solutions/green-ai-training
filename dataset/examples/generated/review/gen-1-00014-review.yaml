id: gen-1-00014-review
category: review
language: yaml
patterns:
- compress-transmitted
- hoist-invariants
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    Review this deploy workflow. Runs on every push and every PR. Diff only, I don't need an essay.

    ```yaml
    name: build-and-publish
    on:
      push:
        branches: [main]
      pull_request:

    jobs:
      build:
        runs-on: ubuntu-latest
        env:
          BUCKET: ${{ vars.ASSET_BUCKET }}
        steps:
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0
          - uses: actions/setup-node@v4
            with:
              node-version: 22
              cache: npm
          - run: npm ci
          - run: npm run build
          - run: npm test -- --reporter junit --outputFile reports/junit.xml
          - name: Package test reports
            run: tar czf reports.tgz reports/
          - uses: actions/upload-artifact@v4
            with:
              name: reports
              path: reports.tgz
              compression-level: 9
              retention-days: 1
          - name: Upload static assets
            run: |
              for f in $(find dist -type f); do
                brotli -q 11 -k "$f"
                aws s3 cp "$f.br" "s3://$BUCKET/$(git rev-parse --short HEAD)/${f#dist/}" \
                  --content-encoding br \
                  --cache-control "public, max-age=31536000, immutable"
              done
    ```
- role: assistant
  content: |
    **Workload:** CI/CD

    #### [Bug] Unquoted `$(find ...)` in the `for` loop
    - **Where:** `for f in $(find dist -type f)`
    - **Issue:** the output is word-split. A file name with a space breaks the loop and uploads the wrong keys.
    - **Fix:** `find -print0` with `read -r -d ''` (below).

    #### [High] Brotli quality 11 on every push and PR
    - **Where:** `brotli -q 11 -k "$f"`
    - **Issue:** PR builds are short-lived previews, so the strongest and slowest codec runs for output that is thrown away. The loop also compresses PNG, JPEG and WOFF2 files, which are already compressed and gain almost nothing.
    - **Fix:** use quality 11 only on `main`, where assets are compressed once and served many times. Use a cheaper quality (5) on PRs. Compress text types only. Upload the rest as they are.
    - **Impact:** reduces E on the runner for every push. In Green Metrics Tool measurements on 100 MB of text, brotli at its default quality 11 used about 45× the CPU energy of gzip to compress. That cost is only worth paying for static assets served many times. Behavior change: binary assets are now uploaded without `Content-Encoding: br`.

    #### [Medium] `git rev-parse` runs once per file
    - **Where:** `$(git rev-parse --short HEAD)` inside the loop
    - **Issue:** the value never changes, but it forks a `git` process for every file.
    - **Fix:** compute it once before the loop.

    #### [Medium] Level 9 on an already gzipped artifact
    - **Where:** `compression-level: 9` on `reports.tgz`
    - **Issue:** `tar czf` already compressed the file, so level 9 on top burns CPU for no size gain. The artifact also lives for one day.
    - **Fix:** `compression-level: 0`.

    ```yaml
          - uses: actions/upload-artifact@v4
            with:
              name: reports
              path: reports.tgz
              compression-level: 0
              retention-days: 1
          - name: Upload static assets
            env:
              BR_Q: ${{ github.ref == 'refs/heads/main' && '11' || '5' }}
            run: |
              sha=$(git rev-parse --short HEAD)
              cache='public, max-age=31536000, immutable'
              find dist -type f -print0 | while IFS= read -r -d '' f; do
                key="s3://$BUCKET/$sha/${f#dist/}"
                case "$f" in
                  *.js|*.css|*.html|*.svg|*.json)
                    brotli -q "$BR_Q" -k -f "$f"
                    aws s3 cp "$f.br" "$key" --content-encoding br --cache-control "$cache"
                    ;;
                  *)
                    aws s3 cp "$f" "$key" --cache-control "$cache"
                    ;;
                esac
              done
    ```

    **Already good:** npm cache is enabled, and the artifact has a one-day retention.
verify:
  static_only: GitHub Actions workflow needs the Actions runner, AWS and brotli
