          {"id": 5, "project_id": 7, "status": "failed", "branch": "fix/cache", "commit_sha": "9988776655aa", "finished_at": D(2026, 10, 18, 3, 30), "duration_s": 410, "log_output": "w" * 50, "env_dump": ""},
