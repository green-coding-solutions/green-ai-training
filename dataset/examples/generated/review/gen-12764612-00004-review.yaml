messages:
- role: user
  content: |
    Review please, diff only. This builds the failed-builds digest we post for each project. `build_runs` has ~40 columns (log_output, env_dump and artifacts_json are big). Postgres, psycopg 3.

    ```python
    def failed_builds_report(conn, project_id, since):
        with conn.cursor() as cur:
            cur.execute(
                """
                SELECT * FROM build_runs
                WHERE project_id = %s AND status = 'failed' AND finished_at >= %s
                ORDER BY finished_at DESC
                """,
                (project_id, since),
            )
            rows = cur.fetchall()
            cols = [d.name for d in cur.description]

        report = ""
        for row in rows:
            r = dict(zip(cols, row))
            report += (
                f"{r['id']}\t{r['branch']}\t{r['commit_sha'][:8]}\t"
                f"{r['finished_at']:%Y-%m-%d %H:%M}\t{r['duration_s']}s\n"
            )
        return report
    ```
- role: assistant
  content: |
    **Workload:** cloud backend

    #### [High] `SELECT *` reads big columns the report never uses
    - **Where:** the `SELECT * FROM build_runs` query
    - **Issue:** the report uses 5 columns, but every failed build also transfers and decodes `log_output`, `env_dump`, `artifacts_json` and the rest. Failed builds are the rows with the longest logs.
    - **Fix:** `SELECT id, branch, commit_sha, finished_at, duration_s`
    - **Impact:** reduces E and network/memory (M) per row. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, naming the 10 needed columns instead of `SELECT *` used about 5.5× to 7× less CPU energy, depending on row count. The gap grows with the size of the skipped columns.

    #### [Low] String built with `+=` in a loop
    - **Where:** `report += ...`
    - **Issue:** every iteration builds a new string. Collect the lines in a list and join once. The per-row `dict(zip(...))` is not needed with explicit columns.
    - **Fix:** list comprehension and `"".join(...)`.
    - **Impact:** reduces E. In Green Metrics Tool micro-benchmarks with 1,000,000 pieces, `+=` used roughly 260× more CPU energy than `"".join()`. For a digest of a few hundred rows the absolute saving is small, but the change is free.

    ```python
    def failed_builds_report(conn, project_id, since):
        with conn.cursor() as cur:
            cur.execute(
                """
                SELECT id, branch, commit_sha, finished_at, duration_s
                FROM build_runs
                WHERE project_id = %s AND status = 'failed' AND finished_at >= %s
                ORDER BY finished_at DESC
                """,
                (project_id, since),
            )
            rows = cur.fetchall()

        lines = [
            f"{id_}\t{branch}\t{sha[:8]}\t{finished:%Y-%m-%d %H:%M}\t{duration}s\n"
            for id_, branch, sha, finished, duration in rows
        ]
        return "".join(lines)
    ```

    Output is identical.

    **Already good:** the query is parameterized, and filtering and sorting happen in SQL.
