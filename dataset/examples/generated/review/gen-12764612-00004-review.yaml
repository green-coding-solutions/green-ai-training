      class Desc:
          def __init__(self, name):
              self.name = name

      class Cur:
          def __enter__(self):
              return self
          def __exit__(self, *a):
              return False
          def execute(self, sql, params):
              s = " ".join(sql.split())
              if s.startswith("SELECT * FROM"):
                  self.cols = ALL
              else:
                  self.cols = [c.strip() for c in s[len("SELECT "):s.index(" FROM")].split(",")]
              project_id, since = params
              rows = [r for r in DATA
                      if r["project_id"] == project_id and r["status"] == "failed" and r["finished_at"] >= since]
              rows.sort(key=lambda r: r["finished_at"], reverse=True)
              self.rows = [tuple(r[c] for c in self.cols) for r in rows]
              self.description = [Desc(c) for c in self.cols]
          def fetchall(self):
              return self.rows

      class Conn:
          def cursor(self):
              return Cur()

