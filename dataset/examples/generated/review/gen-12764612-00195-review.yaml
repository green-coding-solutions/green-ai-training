messages:
- role: user
  content: |
    Please review this query. It is the feature fetch for our nightly rental price model (Postgres). A Python job runs it, and the rows go straight into the model as a feature matrix.

    Requirements:
    - Only listings that are on the current model version and have not been scored yet.
    - Only listings changed since the start of the month.
    - Process at most 5000 listings per run, in a stable order.
    - The feature order must stay: price, bedrooms, bathrooms, area, age, distance, photos, review score.

    `listing_features` is wide. It has about 50 columns, including `description_text`, `raw_payload_json` and `photo_urls_text`. It is rebuilt by the ingestion job.

    ```sql
    SELECT *
    FROM listing_features
    WHERE model_version = 'v7'
      AND scored_at IS NULL
      AND updated_at >= '2026-10-01'
    ORDER BY listing_id
    LIMIT 5000;
    ```

    The columns the model uses are `price`, `bedrooms`, `bathrooms`, `area_sqm`, `age_years`, `dist_center_km`, `n_photos` and `avg_review_score`. The job also needs `listing_id` to write the scores back.
- role: assistant
  content: |
    **Workload:** AI/ML (nightly batch inference, feature fetch)

    #### [Bug] Feature order depends on the table layout
    - **Where:** `SELECT *`
    - **Issue:** `SELECT *` returns columns in table order. If the ingestion job rebuilds the table with a different column order, or someone adds a column, the feature matrix shifts. The model then gets wrong inputs and no error is raised. This query does not guarantee your fixed feature order.
    - **Fix:** name the columns in the order the model expects (see below).

    #### [High] Reads about 40 columns the model never uses
    - **Where:** `SELECT *`
    - **Issue:** the query reads and sends `description_text`, `raw_payload_json`, `photo_urls_text` and all the other wide columns for up to 5000 rows. Your job then drops them. The cost depends on how much data each column holds, not on how many columns there are. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, reading 2,500 rows with only the 10 needed columns used about 7× less energy than `SELECT *`.
    - **Fix:** select only `listing_id` and the eight feature columns:
      ```sql
      SELECT listing_id,
             price,
             bedrooms,
             bathrooms,
             area_sqm,
             age_years,
             dist_center_km,
             n_photos,
             avg_review_score
      FROM listing_features
      WHERE model_version = 'v7'
        AND scored_at IS NULL
        AND updated_at >= '2026-10-01'
      ORDER BY listing_id
      LIMIT 5000;
      ```
    - **Impact:** E and network on the database server and the job, on every run. The rows, their order and the limit stay the same. Only the columns change. In the Python job, read the features by name or by this fixed position, not by `SELECT *` order.

    **Already good:** the filter is explicit, `ORDER BY listing_id` gives a stable order, and `LIMIT` caps the work per run.
