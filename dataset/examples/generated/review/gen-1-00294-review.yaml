id: gen-1-00294-review
category: review
language: javascript
patterns:
- simple-conditions
messages:
- role: user
  content: |
    We have a small Node script at the end of our monorepo pipeline. It reads the job results of the whole matrix (a few thousand jobs per run, exported as JSON by an earlier step) and sorts them into buckets. The exit code decides whether the release gate opens.

    Requirements: it must stay a single file with no dependencies (Node 18+), and the bucket names are used by a dashboard, so they cannot change. Can you review it for correctness first, and then for anything that wastes work?

    ```javascript
    const fs = require('fs');

    const jobs = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));

    function classify(job) {
      const s = job.status.toLowerCase();
      if (s.indexOf('succ') === 0 && job.attempts <= 1) return 'pass';
      if (s.indexOf('succ') === 0 && job.attempts > 1) return 'flaky';
      if (s === 'cancelled' || s === 'canceled' || s === 'skipped') return 'ignored';
      // 137 = OOM kill
      if (s === 'timed_out' || (s === 'failure' && job.exitCode % 128 === 9)) return 'infra';
      if (s === 'failure' && !(job.exitCode > 0 && job.exitCode < 128)) return 'infra';
      return 'broken';
    }

    const summary = { pass: 0, flaky: 0, ignored: 0, infra: 0, broken: 0 };
    for (const job of jobs) {
      summary[classify(job)]++;
    }

    console.log(JSON.stringify(summary));
    process.exit(summary.broken > 0 ? 1 : 0);
    ```
- role: assistant
  content: |
    **Workload:** script (CI step, runs once per pipeline)

    #### [Bug] Successful jobs without `attempts` count as `broken`
    - **Where:** first two `if` lines in `classify`
    - **Issue:** if `job.attempts` is missing, both `undefined <= 1` and `undefined > 1` are false. The job falls through to the end and returns `'broken'`. That can close your release gate for green jobs.
    - **Fix:** treat a missing value as one attempt: `(job.attempts ?? 1) > 1`.
    - **Impact:** correctness. A false `broken` can trigger a rerun of the whole pipeline.

    #### [Bug] `exitCode % 128 === 9` matches more than an OOM kill
    - **Where:** the `infra` line with the `137` comment
    - **Issue:** the modulo also matches plain exit code `9` and `265`. Only `137` (128 + SIGKILL) is an OOM kill. Exit `137` is already covered by the next line, because it is not in the range 1 to 127. So the modulo check only adds the wrong match for `9`.
    - **Fix:** drop it. The rewrite below classifies exit code `9` as `broken`. If you really want it in `infra`, say so in a comment.
    - **Impact:** correctness of the bucket counts.

    #### [Low] Chain of string tests repeated per job
    - **Where:** `classify`
    - **Issue:** every job goes through up to five conditions. `indexOf('succ')` is scanned twice, and the negated range test is hard to read. The work per job is tiny and the script runs once per pipeline, so the energy saving is small. The main gain is that a lookup is simple and each job takes the same short path. It also makes the status spellings explicit.
    - **Fix:** normalize the status once and look it up in a `Map`. Then use a small `switch` on simple equality. Only the exit code range check stays as a comparison.
    - **Impact:** reduces E slightly per job, and mostly improves readability. The prefix match `succ*` becomes an explicit list. Add other spellings to the map if your exporter produces them.

    #### [Low] `process.exit()` right after `console.log`
    - **Where:** last line
    - **Issue:** if stdout is a pipe, `process.exit` can cut off buffered output.
    - **Fix:** set `process.exitCode` and let the process end normally.

    ```javascript
    'use strict';
    const fs = require('fs');

    const STATUS_KIND = new Map([
      ['success', 'ok'],
      ['succeeded', 'ok'],
      ['cancelled', 'ignored'],
      ['canceled', 'ignored'],
      ['skipped', 'ignored'],
      ['timed_out', 'infra'],
      ['failure', 'failure'],
    ]);

    function classify(job) {
      const kind = STATUS_KIND.get(String(job.status).toLowerCase());
      switch (kind) {
        case 'ok':
          return (job.attempts ?? 1) > 1 ? 'flaky' : 'pass';
        case 'ignored':
          return 'ignored';
        case 'infra':
          return 'infra';
        case 'failure':
          // exit codes 1..127 are real test failures, anything else (0, missing, 128+) is infra
          return job.exitCode >= 1 && job.exitCode <= 127 ? 'broken' : 'infra';
        default:
          return 'broken';
      }
    }

    function main(path) {
      const jobs = JSON.parse(fs.readFileSync(path, 'utf8'));
      const summary = { pass: 0, flaky: 0, ignored: 0, infra: 0, broken: 0 };
      for (const job of jobs) {
        summary[classify(job)]++;
      }
      console.log(JSON.stringify(summary));
      process.exitCode = summary.broken > 0 ? 1 : 0;
    }

    if (require.main === module) {
      main(process.argv[2]);
    }

    module.exports = { classify };
    ```

    **Already good:** one pass over the data, one `JSON.parse`, no per-job I/O, and no dependencies. Nothing here needs a heavier change.
verify:
  module: true
  test: |-
    const assert = require('assert');
    assert.strictEqual(classify({ status: 'success', attempts: 1 }), 'pass');
    assert.strictEqual(classify({ status: 'Success', attempts: 3 }), 'flaky');
    assert.strictEqual(classify({ status: 'success' }), 'pass');
    assert.strictEqual(classify({ status: 'success', attempts: null }), 'pass');
    assert.strictEqual(classify({ status: 'cancelled' }), 'ignored');
    assert.strictEqual(classify({ status: 'canceled' }), 'ignored');
    assert.strictEqual(classify({ status: 'skipped' }), 'ignored');
    assert.strictEqual(classify({ status: 'timed_out' }), 'infra');
    assert.strictEqual(classify({ status: 'failure', exitCode: 137 }), 'infra');
    assert.strictEqual(classify({ status: 'failure', exitCode: 0 }), 'infra');
    assert.strictEqual(classify({ status: 'failure' }), 'infra');
    assert.strictEqual(classify({ status: 'failure', exitCode: 1 }), 'broken');
    assert.strictEqual(classify({ status: 'failure', exitCode: 127 }), 'broken');
    assert.strictEqual(classify({ status: 'failure', exitCode: 128 }), 'infra');
    assert.strictEqual(classify({ status: 'neutral' }), 'broken');
