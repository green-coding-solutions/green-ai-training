messages:
- role: user
  content: |
    results viewer for our batch inference jobs takes forever to open. fix this

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Batch inference results</title>
      <style>
        @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/IBMPlexSans-Regular.ttf") format("truetype"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/IBMPlexSans-Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
        @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/IBMPlexSans-Medium.ttf") format("truetype"); font-weight: 500; }
        @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/IBMPlexSans-SemiBold.ttf") format("truetype"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Sans"; src: url("/fonts/IBMPlexSans-Bold.ttf") format("truetype"); font-weight: 700; }
        @font-face { font-family: "IBM Plex Mono"; src: url("/fonts/IBMPlexMono-Regular.ttf") format("truetype"); font-weight: 400; }

        body { font-family: "IBM Plex Sans", sans-serif; margin: 0; color: #1d2330; background: #f6f7f9; }
        .toolbar h1 { font-size: 18px; font-weight: 600; }
        .results { display: flex; flex-direction: column; }
        .row { display: flex; border-bottom: 1px solid #e3e6ea; }
        .row:nth-child(even) { background: #fbfbfc; }
        .cell-wrap { flex: 1; min-width: 0; padding: 6px 10px; }
        .cell-inner { display: flex; align-items: center; gap: 4px; }
        .cell-inner .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .score { font-family: "IBM Plex Mono", monospace; }
        .score.low { color: #b42318; }
      </style>
    </head>
    <body>
      <div class="toolbar">
        <h1>Batch inference results</h1>
        <select id="job">
          <option value="">Pick a job</option>
          <option value="2291">2291 - resnet50 nightly</option>
          <option value="2290">2290 - resnet50 nightly</option>
        </select>
      </div>
      <div class="results"></div>

      <script>
        async function render(jobId) {
          const res = await fetch(`/api/jobs/${jobId}/predictions`);
          const preds = await res.json(); // ~15k predictions per job
          const list = document.querySelector(".results");
          for (const p of preds) {
            const row = document.createElement("div");
            row.className = "row";
            for (const v of [p.sample_id, p.label, p.score.toFixed(3), p.model_version]) {
              const wrap = document.createElement("div");
              wrap.className = "cell-wrap";
              const inner = document.createElement("div");
              inner.className = "cell-inner";
              const span = document.createElement("span");
              span.className = "label";
              span.textContent = v;
              inner.appendChild(span);
              wrap.appendChild(inner);
              row.appendChild(wrap);
            }
