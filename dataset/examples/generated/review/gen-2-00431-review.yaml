- role: assistant
  content: |
    **Workload:** web (landing page, every visitor loads it cold)

    #### [Bug] Typo in the heading font name
    - **Where:** `h1, h2 { font-family: 'Montserat', ... }`
    - **Issue:** `Montserat` is missing an `r`. It matches no `@font-face`, so `h1` and `h2` render in the generic `sans-serif`, not in Montserrat. Only `h3` and `.cta` use the font you loaded.
    - **Fix:** gone after the change below. If you keep custom fonts, correct the name.

    #### [High] Six full TTF files for plain text
    - **Where:** all six `@font-face` blocks
    - **Issue:** the page loads two families as full TTF files, about 4 MB in total, for body text and a few headings. Every first-time visitor downloads and decodes them before the text looks final.
    - **Fix:** use a system font stack and drop the `@font-face` blocks:
      ```css
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.6;
        color: #1d2b24;
      }
      h1, h2, h3, .cta {
        font-family: inherit;
      }
      h1, h2 { font-weight: 700; line-height: 1.2; }
      h3 { font-weight: 600; }
      .hero { padding: 6rem 1.5rem; background: #e8f3ec; }
      .hero p { max-width: 38rem; font-style: italic; }
      .cta {
        display: inline-block;
        padding: 0.8rem 1.6rem;
        border-radius: 6px;
        background: #1f7a4d;
        color: #fff;
        font-weight: 600;
      }
      ```
    - **Impact:** reduces network and client E on every cold load. In Green Metrics Tool micro-benchmarks of 30 cold page loads, six local TTF files (~4 MB) used ~556 J, two Latin-subset WOFF2 files (~55 KB) ~488 J, and the system font stack ~410 J. That is about 26% less than TTF and about 16% less than WOFF2.

    #### [Low] If the brand font is a must
    - **Where:** the font setup as a whole
    - **Issue:** the page will now look like each visitor's OS font. If the design needs Montserrat, keep it small.
    - **Fix:** use one or two Latin-subset WOFF2 files, for example Montserrat 600 and 700 for headings only, and keep the system stack for body text. That was the next best option in the same measurement, at ~12% less than TTF.

    **Already good:** the colors and spacing need no change, and `font-weight` values 400, 600 and 700 are available in system fonts.
