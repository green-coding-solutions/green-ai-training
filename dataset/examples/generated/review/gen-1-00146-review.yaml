id: gen-1-00146-review
category: review
language: python
patterns:
- select-columns
messages:
- role: user
  content: |
    Can you review this script? It's a small CLI we run every night from cron to build a CSV of active customers who haven't ordered since a given date. Marketing uses the CSV for a win-back mailing.

    Requirements: it must keep the same CSV format (id, email, name, last order date, with a header row), it should work on the full table (about 800k customers, around 40 columns, `notes` and `profile_json` can be big), and the date comes from the command line. I'd like to know what is wrong or risky before I put it in the repo.

    ```python
    import csv
    import sqlite3
    import sys


    def main():
        db_path = sys.argv[1]
        cutoff = sys.argv[2]
        out_path = sys.argv[3]

        conn = sqlite3.connect(db_path)
        cur = conn.cursor()
        cur.execute(
            f"SELECT * FROM customers WHERE last_order_at < '{cutoff}' AND status = 'active'"
        )
        rows = cur.fetchall()

        out = open(out_path, "w")
        writer = csv.writer(out)
        writer.writerow(["id", "email", "name", "last_order_at"])
        for row in rows:
            # 0 = id, 1 = email, 2 = name, 5 = last_order_at
            writer.writerow([row[0], row[1], row[2], row[5]])

        print(f"exported {len(rows)} customers")
        conn.close()


    if __name__ == "__main__":
        main()
    ```
- role: assistant
  content: |
    **Workload:** script (nightly batch over a large table)

    #### [Security] SQL built with an f-string
    - **Where:** the `cur.execute(f"...")` call
    - **Issue:** `cutoff` comes straight from the command line and is pasted into the SQL. A bad or accidental value like `2024-01-01' OR '1'='1` changes the query. Even in an internal cron job this is easy to avoid.
    - **Fix:** pass it as a bound parameter: `WHERE last_order_at < ?`.

    #### [Bug] Columns are read by position
    - **Where:** `row[5]` and the comment above it
    - **Issue:** `SELECT *` returns columns in table order. If someone adds or reorders a column, the CSV silently gets the wrong data in `last_order_at`, and the mailing goes out with it.
    - **Fix:** name the columns in the query. Then the positions are fixed by your own SQL.

    #### [High] `SELECT *` reads about 36 columns you throw away
    - **Where:** the query
    - **Issue:** you use 4 columns, but every row also carries `notes`, `profile_json` and the rest. For 800k rows the database reads, copies and hands over all of that, and Python builds a tuple for each of those values just to discard them. The cost grows with the size of the skipped columns, and yours are the large ones.
    - **Fix:** select only `id, email, name, last_order_at`.
    - **Pattern:** Reduce transmitted data
    - **Impact:** E, per row. Less data read, copied and allocated on every run.

    #### [Medium] `fetchall()` holds the whole result in memory
    - **Where:** `rows = cur.fetchall()`
    - **Issue:** all matching rows are loaded before the first line is written. Memory grows with the table, and nothing is written until the query is done.
    - **Fix:** iterate over the cursor and write as you go. Count rows in the loop for the final message.

    #### [Low] Output file is never closed
    - **Where:** `open(out_path, "w")`
    - **Issue:** if the script fails half way, the file may be left unflushed. Without `newline=""`, the `csv` module can write extra blank lines on Windows.
    - **Fix:** use a `with` block and `newline=""`.

    ```python
    import csv
    import sqlite3
    import sys
    from contextlib import closing


    def export_inactive(db_path, cutoff, out_path):
        with closing(sqlite3.connect(db_path)) as conn, open(out_path, "w", newline="") as out:
            cur = conn.execute(
                "SELECT id, email, name, last_order_at FROM customers "
                "WHERE last_order_at < ? AND status = 'active'",
                (cutoff,),
            )
            writer = csv.writer(out)
            writer.writerow(["id", "email", "name", "last_order_at"])
            count = 0
            for row in cur:
                writer.writerow(row)
                count += 1
        return count


    def main():
        db_path, cutoff, out_path = sys.argv[1], sys.argv[2], sys.argv[3]
        count = export_inactive(db_path, cutoff, out_path)
        print(f"exported {count} customers")


    if __name__ == "__main__":
        main()
    ```

    The CSV has the same header and the same four columns in the same order. Row order is whatever the database returns, as before.

    **Already good:** the filter runs in SQL instead of in Python, and the output is written with the `csv` module instead of manual string joins.
verify:
  module: true
  green_block: 0
  test: |-
    import csv, os, sqlite3, tempfile
    d = tempfile.mkdtemp()
    db = os.path.join(d, "t.db")
    out = os.path.join(d, "o.csv")
    c = sqlite3.connect(db)
    c.execute("CREATE TABLE customers (id INTEGER, email TEXT, name TEXT, status TEXT, country TEXT, last_order_at TEXT, notes TEXT, profile_json TEXT)")
    c.executemany("INSERT INTO customers VALUES (?,?,?,?,?,?,?,?)", [
        (1, "a@x.io", "Ann", "active", "DE", "2023-01-05", "n" * 1000, "{}"),
        (2, "b@x.io", "Bob", "active", "FR", "2024-06-01", "n", "{}"),
        (3, "c@x.io", "Cy", "closed", "US", "2022-02-02", "n", "{}"),
        (4, "d@x.io", "Di", "active", "US", "2021-03-03", "n", "{}"),
    ])
    c.commit()
    c.close()
    n = export_inactive(db, "2024-01-01", out)
    assert n == 2, n
    with open(out, newline="") as f:
        rows = list(csv.reader(f))
    assert rows[0] == ["id", "email", "name", "last_order_at"], rows
    assert sorted(rows[1:]) == [["1", "a@x.io", "Ann", "2023-01-05"], ["4", "d@x.io", "Di", "2021-03-03"]], rows
    # Injected SQL would return all 4 rows; as a bound literal "0' OR ..." sorts before every date.
    n2 = export_inactive(db, "0' OR '1'='1", out)
    assert n2 == 0, n2
