- role: assistant
  content: |
    **Workload:** web (static landing page, every visitor loads these images)

    #### [Bug] Hero image has no `alt`
    - **Where:** `.hero` `<img src="/img/hero-office.png">`
    - **Issue:** a missing `alt` makes screen readers read the file name. Use `alt=""` if the image is purely decorative.
    - **Fix:** see the diff below.

    #### [High] Photos are served as PNG
    - **Where:** `hero-office.png`, `team-*.png`
    - **Issue:** PNG is lossless, so photos are large. Every first-time visitor transfers and decodes all of them. In Green Metrics Tool micro-benchmarks (50 page loads per format), PNG used the most client CPU energy: about 181 J, against about 134 J for JPG and about 150 J for WebP.
    - **Fix:** encode the photos once at build time and serve WebP with the JPG as fallback through `<picture>`. Add AVIF only if bytes matter more than CPU. AVIF decoding cost about 19% more than JPG in the same benchmark, and encoding cost about 7× JPG, so never encode it per request.
    - **Impact:** reduces network bytes for every visitor, plus some client decode work (E). The byte saving is the larger part.

    #### [Low] Small icons and logo as PNG
    - **Where:** `logo.png`, `icon-search.png`, `icon-share.png`
    - **Issue:** flat icons are better as vector graphics. SVG is smaller and sharp at any size, and a raster format adds nothing.
    - **Fix:** export them as SVG.
    - **Impact:** fewer requests and bytes (network), small.

    ```html
    <a href="/"><img src="/img/logo.svg" width="120" height="32" alt="Fieldnote"></a>

    <section class="hero">
      <picture>
        <source type="image/webp" srcset="/img/hero-office.webp">
        <img src="/img/hero-office.jpg" width="2400" height="1400" alt="">
      </picture>
      ...
    </section>

    <section id="features">
      <img class="icon" src="/img/icon-search.svg" width="48" height="48" alt="">
      ...
      <img class="icon" src="/img/icon-share.svg" width="48" height="48" alt="">
    </section>

    <section id="team">
      <h2>Team</h2>
      <picture>
        <source type="image/webp" srcset="/img/team-anna.webp">
        <img src="/img/team-anna.jpg" width="400" height="400" alt="Anna, CEO">
      </picture>
      <picture>
        <source type="image/webp" srcset="/img/team-jonas.webp">
        <img src="/img/team-jonas.jpg" width="400" height="400" alt="Jonas, CTO">
      </picture>
      <picture>
        <source type="image/webp" srcset="/img/team-mei.webp">
        <img src="/img/team-mei.jpg" width="400" height="400" alt="Mei, Design">
      </picture>
    </section>
    ```

    Re-export the photos at sizes close to what is displayed. A 2400 px hero is only worth it if it is shown that wide.

    **Already good:** `width` and `height` are set on every image, so the layout does not shift while they load.
