  content: |
    **Workload:** AI/ML (inference preprocessing, per request)

    #### [High] Front insert for every token
    - **Where:** `ids.insert(0, tid)` in `encode_reversed`
    - **Issue:** every insert at index 0 shifts the whole list, so encoding one message is O(n²) in its token count. The cut to `MAX_LEN` only happens after the loop, so a long message pays the full cost. In Green Metrics Tool micro-benchmarks, 1,000,000 × `list.insert(0, x)` used ~1515 J, and 1,000,000 × `list.append(x)` used ~1.2 J.
    - **Fix:** build the ids in reversed token order in one pass, with no front insert.
    - **Impact:** E, on every request. Cost drops from O(n²) to O(n) per message.

    #### [Medium] `try/except KeyError` for a common miss
    - **Where:** the `vocab[tok]` lookup
    - **Issue:** your comment says the input is full of typos and slang, so many tokens are not in the vocab. Each miss raises and catches an exception. In Green Metrics Tool micro-benchmarks with about half of the keys missing, `dict.get(key, default)` used ~67 J and `try/except KeyError` used ~76 J for 10,000,000 lookups, about 12% less with `get`. When misses are rare, `try/except` is cheap. Here they are not.
    - **Fix:** `vocab.get(tok, UNK_ID)`.
    - **Impact:** E, modest but per token.

    Both fixes in one pass:

    ```python
    import numpy as np

    PAD_ID = 0
    UNK_ID = 1
    MAX_LEN = 128


    def encode_reversed(text, vocab):
        # right-to-left model, so the newest token goes first
        # input is raw chat messages, lots of typos and slang
        tokens = text.lower().split()
        ids = [vocab.get(tok, UNK_ID) for tok in reversed(tokens)]
        return ids[:MAX_LEN]


    def make_batch(texts, vocab):
        rows = [encode_reversed(t, vocab) for t in texts]
        width = max(len(r) for r in rows)
        batch = np.full((len(rows), width), PAD_ID, dtype=np.int64)
        for i, r in enumerate(rows):
            batch[i, :len(r)] = r
        return batch
    ```

    The output is identical: same reversed order, same `UNK_ID` for unknown tokens, same truncation.

    **Already good:** the batch is one preallocated `np.full` array, and rows are padded to the longest row only, not to `MAX_LEN`.
