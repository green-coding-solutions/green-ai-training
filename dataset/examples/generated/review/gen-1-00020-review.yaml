id: gen-1-00020-review
category: review
language: javascript
patterns:
- regex-precompile
messages:
- role: user
  content: |
    review pls

    ```javascript
    import fs from 'node:fs';
    import readline from 'node:readline';

    const LEVELS = ['DEBUG', 'INFO', 'WARN', 'ERROR'];

    // counts how many log lines mention each service, at or above minLevel
    async function scan(file, services, minLevel) {
      const counts = {};
      for (const s of services) counts[s] = 0;
      let bad = 0;

      const rl = readline.createInterface({ input: fs.createReadStream(file) });
      for await (const line of rl) {
        const m = line.match(
          new RegExp('^(\\S+) (' + LEVELS.join('|') + ') \\[(\\w+)\\] (.*)$')
        );
        if (!m) {
          bad++;
          continue;
        }
        if (LEVELS.indexOf(m[2]) < LEVELS.indexOf(minLevel)) continue;

        for (const svc of services) {
          if (new RegExp('\\b' + svc + '\\b', 'i').test(m[4])) {
            counts[svc]++;
          }
        }
      }
      return { counts, bad };
    }

    export { scan };
    ```
- role: assistant
  content: |
    **Workload:** script / log processing (runs on every line of a large file)

    #### [Bug] Service names go into the regex unescaped
    - **Where:** `new RegExp('\\b' + svc + '\\b', 'i')`
    - **Issue:** a name like `api.v2` also matches `apiXv2`. A name like `cache(` or `c++` throws a `SyntaxError` partway through a long run.
    - **Fix:** escape each name once, before you build its pattern.

    #### [High] Regexes are rebuilt for every log line
    - **Where:** the `line.match(new RegExp(...))` call, and the `new RegExp(...)` inside the `services` loop
    - **Issue:** the line pattern never changes, but it is parsed again for every line. The service patterns depend only on `services`, but they are rebuilt for every line and every service. With millions of lines and several services, the code creates and throws away millions of regex objects. V8 caches compiled patterns, so the real gain is smaller than that count suggests. You still save the string concatenation, the cache lookup and the allocation on every call.
    - **Fix:** build all patterns once, before the loop. Don't add the `g` flag to them. With `.test()`, a shared global regex keeps `lastIndex` between calls and skips matches.
    - **Impact:** reduces E (CPU) per line. The saving grows with file size and with the number of services.

    #### [Low] Minimum level is looked up on every line
    - **Where:** `LEVELS.indexOf(minLevel)` in the loop
    - **Issue:** the value is the same for every line. The cost is small, but moving it out of the loop is free.

    ```javascript
    import fs from 'node:fs';
    import readline from 'node:readline';

    const LEVELS = ['DEBUG', 'INFO', 'WARN', 'ERROR'];
    const LINE_RE = new RegExp('^(\\S+) (' + LEVELS.join('|') + ') \\[(\\w+)\\] (.*)$');
    const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    // counts how many log lines mention each service, at or above minLevel
    async function scan(file, services, minLevel) {
      const minIdx = LEVELS.indexOf(minLevel);
      const counts = {};
      const matchers = services.map((svc) => {
        counts[svc] = 0;
        return [svc, new RegExp('\\b' + escapeRe(svc) + '\\b', 'i')];
      });
      let bad = 0;

      const rl = readline.createInterface({ input: fs.createReadStream(file) });
      for await (const line of rl) {
        const m = LINE_RE.exec(line);
        if (!m) {
          bad++;
          continue;
        }
        if (LEVELS.indexOf(m[2]) < minIdx) continue;

        for (const [svc, re] of matchers) {
          if (re.test(m[4])) counts[svc]++;
        }
      }
      return { counts, bad };
    }

    export { scan };
    ```

    For normal service names, the output is the same. Names that contain regex characters now match literally. Before, they either threw an error or matched too much.

    **Already good:** the file is streamed line by line, so memory use stays flat on large logs.
