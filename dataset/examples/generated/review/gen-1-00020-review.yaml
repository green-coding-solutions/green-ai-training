  equivalence:
    driver: |-
      import os from 'node:os';
      import path from 'node:path';
      const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'scan-'));
      const file = path.join(dir, 'app.log');
      fs.writeFileSync(file, [
        '2026-10-09T10:00:00Z INFO [web] request to auth ok',
        '2026-10-09T10:00:01Z DEBUG [web] cache warm for billing',
        '2026-10-09T10:00:02Z ERROR [job] billing failed, auth token expired',
        '2026-10-09T10:00:03Z WARN [job] AUTH retry for billing',
        'garbage line without header',
        '2026-10-09T10:00:04Z INFO [web] nothing to see',
        '2026-10-09T10:00:05Z ERROR [db] authentication service down',
        ''
      ].join('\n'));
      const r = await scan(file, ['auth', 'billing', 'cache'], 'INFO');
      console.log(JSON.stringify(r));
      fs.rmSync(dir, { recursive: true, force: true });
