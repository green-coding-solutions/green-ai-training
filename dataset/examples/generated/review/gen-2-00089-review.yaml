messages:
- role: user
  content: |
    PDP template, ships with the v3 cleanup PR tomorrow. Review it, just give me the diff, no essay.

    ```html
    <!doctype html>
    <html lang="de">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{ product.name }} | Nordhang Outdoor</title>
      <link rel="stylesheet" href="/static/css/base.css">
      <style>
        .pdp { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 72rem; margin: 0 auto; }
        .pdp__gallery img { width: 100%; height: auto; border-radius: 4px; }
        .pdp__title { font-size: 1.75rem; margin: 0 0 .5rem; }
        .price { font-size: 1.5rem; font-weight: 600; }
        .price--sale { color: #b3261e; }
        .price--old { color: #6b6b6b; text-decoration: line-through; font-size: 1rem; margin-left: .5rem; }
        .buybox label { display: block; margin-bottom: .25rem; }
        .buybox input[type=number] { width: 4rem; }
        .btn-cart { background: #1f4d3a; color: #fff; padding: .75rem 1.5rem; border: 0; }
        /* quick view (removed in PDP v3) */
        .qv-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 900; }
        .qv-modal { position: fixed; top: 10vh; left: 50%; transform: translateX(-50%); width: min(90vw, 48rem); background: #fff; }
        .qv-modal__close { position: absolute; top: .5rem; right: .5rem; }
        .qv-modal__thumbs { display: flex; gap: .25rem; overflow-x: auto; }
        /* BF 2025 */
        .countdown { background: #111; color: #ffd400; text-align: center; padding: .5rem; }
        .countdown__digits { font-variant-numeric: tabular-nums; font-size: 1.25rem; }
        .compare-drawer { position: fixed; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform .3s; }
        .compare-drawer.is-open { transform: none; }
        .compare-drawer__item { display: inline-block; width: 6rem; }
        @media (max-width: 48rem) {
          .pdp { grid-template-columns: 1fr; }
          .qv-modal { top: 0; width: 100vw; height: 100vh; }
          .compare-drawer__item { width: 4rem; }
        }
      </style>
    </head>
    <body>
      <main class="pdp">
        <div class="pdp__gallery">
          <img src="{{ product.image_url }}" alt="{{ product.name }}" width="800" height="800">
        </div>
        <div class="pdp__info">
          <h1 class="pdp__title">{{ product.name }}</h1>
          <p>
            <span class="price price--sale">{{ product.price | money }}</span>
            {% if product.compare_at %}<s class="price-old">{{ product.compare_at | money }}</s>{% endif %}
          </p>
          <form class="buybox" action="/cart/add" method="post">
            <input type="hidden" name="sku" value="{{ product.sku }}">
            <label for="qty">Menge</label>
            <input type="number" id="quantity" name="qty" value="1" min="1">
            <button class="btn-cart" type="submit">In den Warenkorb</button>
          </form>
          <div class="pdp__desc">{{ product.description_html | safe }}</div>
        </div>
      </main>
    </body>
    </html>
    ```
- role: assistant
  content: |
    **Workload:** web (e-commerce product page, rendered on every product view)

    #### [Bug] Old-price class doesn't match the stylesheet
    - **Where:** `<s class="price-old">`
    - **Issue:** the CSS defines `.price--old`. The compare-at price gets no grey color, no smaller size and no spacing. A CSS purge would also flag `.price--old` as unused and delete it, so fix the markup first.
    - **Fix:**
      ```html
      {% if product.compare_at %}<s class="price--old">{{ product.compare_at | money }}</s>{% endif %}
      ```

    #### [Bug] Quantity label is not linked to its input
    - **Where:** `<label for="qty">` / `<input id="quantity">`
    - **Issue:** `for` and `id` don't match. Clicking the label doesn't focus the field, and screen readers announce the input without a label.
    - **Fix:** if no JS targets `#quantity`:
      ```html
      <input type="number" id="qty" name="qty" value="1" min="1">
      ```

    #### [Low] Dead rules for removed components
    - **Where:** the `.qv-*`, `.countdown*` and `.compare-drawer*` rules, plus their two lines in the `@media` block
    - **Issue:** nothing in the v3 markup uses them. The block is inline, so it goes out with every product page response and can't be cached on its own.
    - **Fix:** delete them. The block that remains:
      ```css
      .pdp { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 72rem; margin: 0 auto; }
      .pdp__gallery img { width: 100%; height: auto; border-radius: 4px; }
      .pdp__title { font-size: 1.75rem; margin: 0 0 .5rem; }
      .price { font-size: 1.5rem; font-weight: 600; }
      .price--sale { color: #b3261e; }
      .price--old { color: #6b6b6b; text-decoration: line-through; font-size: 1rem; margin-left: .5rem; }
      .buybox label { display: block; margin-bottom: .25rem; }
      .buybox input[type=number] { width: 4rem; }
      .btn-cart { background: #1f4d3a; color: #fff; padding: .75rem 1.5rem; border: 0; }
      @media (max-width: 48rem) {
        .pdp { grid-template-columns: 1fr; }
      }
      ```
    - **Impact:** network only: fewer bytes on every product view. Client CPU won't change in any way you can measure. In Green Metrics Tool page-load benchmarks, purging a 16 KB stylesheet of mostly unused rules down to 0.75 KB changed client CPU energy by about 2%, which is within measurement noise.
verify:
  static_only: Jinja HTML template with inline CSS, nothing executable to test
