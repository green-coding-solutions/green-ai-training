    import csv
    import sys
    from collections import Counter

    with open("ephemeral_runners.txt") as f:
        EPHEMERAL = f.read().split("\n")

    LEVELS = 64


    def load_samples(path):
        cpu = []
        with open(path, newline="") as f:
            for row in csv.DictReader(f):
                if row["runner_id"] in EPHEMERAL:
                    continue
                cpu.append(float(row["cpu_pct"]))
        return cpu


    def quantize(values, levels=LEVELS, lo=0.0, hi=100.0):
        step = (hi - lo) / levels
        out = []
        for v in values:
            if v < lo:
                v = lo
            elif v > hi:
                v = hi
            idx = int((v - lo) / step)
            if idx >= levels:
                idx = levels - 1
            out.append(idx)
        return out


    def main(path):
        cpu = load_samples(path)
        hist = Counter(quantize(cpu))
        for lvl in sorted(hist):
            print(f"{lvl:2d} {hist[lvl]}")


    if __name__ == "__main__":
        main(sys.argv[1])
