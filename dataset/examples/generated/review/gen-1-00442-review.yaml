id: gen-1-00442-review
category: review
language: html
patterns:
- lazy-load-images
messages:
- role: user
  content: |
    hi, i am new to html. i made this page for our CI. It shows the preview deployments of the open pull requests, with a screenshot of each one that the pipeline takes after deploy. my colleagues say it is slow to open when they are on the VPN but i dont know what is wrong. can you look at it? usually there are about 25 PRs in the list, here i paste only the first rows

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Preview deployments</title>
      <style>
        body { font-family: sans-serif; margin: 0; }
        header { background: #1d2733; color: #fff; padding: 12px 24px; }
        header img { height: 32px; vertical-align: middle; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border-bottom: 1px solid #ddd; padding: 8px 24px; text-align: left; }
        img.shot { width: 160px; height: 100px; object-fit: cover; }
        .ok { color: #1a7f37; }
        .fail { color: #cf222e; }
      </style>
    </head>
    <body>
    <header>
      <img src="img/logo-white.png"> <span>Preview deployments</span>
    </header>
    <table>
      <tr><th>PR</th><th>Branch</th><th>Status</th><th>Preview</th></tr>
      <tr>
        <td>#1201</td><td>feature/login-form</td><td class="ok">deployed</td>
        <td><a href="https://pr-1201.preview.example.com"><img class="shot" src="shots/pr-1201.png"></a></td>
      </tr>
      <tr>
        <td>#1198</td><td>fix/cache-header</td><td class="fail">failed</td>
        <td><a href="https://pr-1198.preview.example.com"><img class="shot" src="shots/pr-1198.png"></a></td>
      </tr>
      <tr>
        <td>#1195</td><td>feature/dark-mode</td><td class="ok">deployed</td>
        <td><a href="https://pr-1195.preview.example.com"><img class="shot" src="shots/pr-1195.png"></a></td>
      </tr>
      <!-- ... same row for all other PRs ... -->
    </table>
    </body>
    </html>
    ```
- role: assistant
  content: |
    **Workload:** web (internal CI dashboard, static page)

    #### [Bug] Images have no alt text
    - **Where:** every `<img class="shot">` and the logo
    - **Issue:** the screenshot is the only content of its link, so screen readers announce a link with no name. It also shows nothing if an image fails to load.
    - **Fix:** add a short `alt`, for example `alt="Screenshot of preview for PR #1201"`. For the logo, `alt=""` is fine because the title text is right next to it.

    #### [Medium] All screenshots load at once
    - **Where:** the `<img class="shot">` in every row
    - **Issue:** the browser downloads all ~25 screenshots when the page opens, although only the first few rows are visible. On a slow VPN link this is most likely what your colleagues feel. The rest is download work for images nobody scrolls to.
    - **Fix:** add `loading="lazy"` to the screenshots below the first screen. Keep the first rows eager, so what people see right away is not delayed. Your CSS already sets a fixed size (160×100) for `.shot`, so lazy images will not make the page jump. Do not add it to the logo: it is above the fold and tiny.
    - **Impact:** reduces network transfer and client work on every visit, in proportion to the number of rows that are never scrolled into view.

    ```html
    <!-- first rows (visible without scrolling): load right away -->
    <td><a href="https://pr-1201.preview.example.com"><img class="shot" src="shots/pr-1201.png" alt="Screenshot of preview for PR #1201"></a></td>

    <!-- all later rows -->
    <td><a href="https://pr-1189.preview.example.com"><img class="shot" src="shots/pr-1189.png" alt="Screenshot of preview for PR #1189" loading="lazy"></a></td>
    ```

    If a script generates the rows, put the rule there: `loading="lazy"` for every row after the first five or six.

    #### [Medium] Screenshots may be much larger than the 160 px they are shown at
    - **Where:** `shots/*.png`
    - **Issue:** the CSS shrinks the picture, but the browser still downloads the whole file. If the pipeline saves full browser screenshots, that is many more pixels than a 160×100 box needs. I can't see the file sizes from here, so check them with `ls -lh shots/`.
    - **Fix:** let the pipeline step also save a small thumbnail, show that in the table, and link it to the full screenshot.
    - **Impact:** reduces network bytes per image. It combines well with lazy loading.

    **Already good:** the image size is fixed in CSS, there is no JavaScript, and the page is plain static HTML.

    More on the pattern: https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
verify:
  static_only: HTML markup review; no runtime code to execute.
