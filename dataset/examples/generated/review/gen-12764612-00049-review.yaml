- role: user
  content: |
    hi, i am new to python. this function makes the "latest news" list for the landing page of our bike shop website. it works, but my friend said "something is not good" and did not tell me what. i dont know what is wrong, can you look at it?

    ```python
    import sqlite3

    def get_conn():
        return sqlite3.connect("site.db")

    def load_updates(category=None):
        conn = get_conn()
        cur = conn.cursor()
        query = "SELECT * FROM posts"
        if category:
            query += f" WHERE category = '{category}'"
        query += " ORDER BY published_at ASC, id ASC"
        cur.execute(query)
        rows = cur.fetchall()
        conn.close()

        updates = []
        for row in rows:
            updates.insert(0, {
                "title": row[1],
                "slug": row[2],
                "date": row[4][:10],
                "summary": row[5],
            })
        return updates
    ```

    the posts table has id, title, slug, category, published_at, summary, body_md, body_html and seo_json. the list should show newest first.
- role: assistant
  content: |
    **Workload:** web

    #### [Security] SQL built from the `category` text
    - **Where:** ``query += f" WHERE category = '{category}'"``
    - **Issue:** if `category` comes from the URL, a visitor can put SQL into it. A quote character already breaks the query.
    - **Fix:** use a `?` placeholder and pass the value separately, as in the code below.

    #### [High] `SELECT *` reads big columns you never use
    - **Where:** `SELECT * FROM posts`
    - **Issue:** the page only needs title, slug, date and summary. But `body_md`, `body_html` and `seo_json` are read for every post and then thrown away. Reading by position (`row[4]`) also breaks if someone adds or moves a column.
    - **Fix:** name the four columns you need.
    - **Impact:** reduces E on every page view, and the saving grows with the size of the skipped columns. In Green Metrics Tool micro-benchmarks on PostgreSQL, a 52-column table with large text columns, reading 2,500 rows, used about 7× less CPU energy when 10 needed columns were named instead of `SELECT *`. Your table is narrower, so expect a smaller gain, but the direction is the same because the article bodies are the large part.

    #### [Medium] `insert(0, ...)` on a list
    - **Where:** `updates.insert(0, {...})` in the loop
    - **Issue:** every front insert moves all items already in the list, so the work grows with the square of the number of posts. You sort oldest first and then flip the order by hand.
    - **Fix:** let the database sort newest first (`ORDER BY published_at DESC, id DESC`) and build the list in order. The result is the same as before.
    - **Impact:** reduces E as the list grows. In Green Metrics Tool micro-benchmarks, 1,000,000 front inserts used over 1000× more CPU energy than 1,000,000 appends. With a few dozen posts the difference is tiny, so this matters most if the list keeps growing.

    ```python
    import sqlite3

    def get_conn():
        return sqlite3.connect("site.db")

    def load_updates(category=None):
        query = "SELECT title, slug, published_at, summary FROM posts"
        params = []
        if category:
            query += " WHERE category = ?"
            params.append(category)
        query += " ORDER BY published_at DESC, id DESC"

        conn = get_conn()
        try:
            rows = conn.execute(query, params).fetchall()
        finally:
            conn.close()

        return [
            {"title": title, "slug": slug, "date": published[:10], "summary": summary}
            for title, slug, published, summary in rows
        ]
    ```

    **Already good:** you close the connection, and the dicts keep the template code simple.
