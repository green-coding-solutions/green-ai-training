    fix this

    ```python
    import re
    import time

    ROUTES = [
        ("GET", "/users/{user_id}", "get_user"),
        ("GET", "/users/{user_id}/orders/{order_id}", "get_order"),
        ("POST", "/users/{user_id}/orders", "create_order"),
        ("GET", "/health", "health"),
    ]

    RECENT = []
    MAX_RECENT = 200


    def match_route(method, path):
        for m, template, handler in ROUTES:
            if m != method:
                continue
            pattern = "^" + re.sub(r"\{(\w+)\}", r"(?P<\1>[^/]+)", template) + "$"
            found = re.match(pattern, path)
            if found:
                return handler, found.groupdict()
        return None, {}


    def record_request(method, path, status):
        RECENT.insert(0, {"method": method, "path": path, "status": status, "ts": time.time()})
        while len(RECENT) > MAX_RECENT:
            RECENT.pop()


    def recent_errors(limit=20):
        return [r for r in RECENT if r["status"] >= 500][:limit]
    ```
- role: assistant
  content: |
    **Workload:** web backend (runs on every request)

    #### [Medium] Route templates are rebuilt on every request
    - **Where:** `match_route`, the `re.sub(...)` and `re.match(pattern, path)` lines
    - **Issue:** for each request, every route with the same method gets its template rewritten into a regex again. The templates never change. Python's `re` cache means the regex is not fully recompiled each time. But the string rewrite, the concatenation and the cache lookup still repeat on every call.
    - **Fix:** build and compile the patterns once at import time. Match with the compiled object.
    - **Impact:** reduces E per request. The work stays the same for every request, so it adds up with traffic. The gain per call is small.

    #### [Low] Front insert into a list
    - **Where:** `record_request`, `RECENT.insert(0, ...)` and the `pop()` loop
    - **Issue:** `insert(0, ...)` moves every element one slot on each request. The list is capped at 200, so this is bounded. It is still a cost you pay on every request, and the trim loop is extra code.
    - **Fix:** use `deque(maxlen=MAX_RECENT)` with `appendleft`. Inserts at the front are O(1) and old entries drop off by themselves.
    - **Impact:** reduces E per request from O(n) to O(1) at a fixed n of 200. Small, but it also removes code.

    ```python
    import re
    import time
    from collections import deque
    from itertools import islice

    ROUTES = [
        ("GET", "/users/{user_id}", "get_user"),
        ("GET", "/users/{user_id}/orders/{order_id}", "get_order"),
        ("POST", "/users/{user_id}/orders", "create_order"),
        ("GET", "/health", "health"),
    ]

    MAX_RECENT = 200
    RECENT = deque(maxlen=MAX_RECENT)


    def _compile(template):
        return re.compile("^" + re.sub(r"\{(\w+)\}", r"(?P<\1>[^/]+)", template) + "$")


    COMPILED_ROUTES = [(m, _compile(t), h) for m, t, h in ROUTES]


    def match_route(method, path):
        for m, pattern, handler in COMPILED_ROUTES:
            if m != method:
                continue
            found = pattern.match(path)
            if found:
                return handler, found.groupdict()
        return None, {}


    def record_request(method, path, status):
        RECENT.appendleft({"method": method, "path": path, "status": status, "ts": time.time()})


    def recent_errors(limit=20):
        return list(islice((r for r in RECENT if r["status"] >= 500), limit))
    ```

    Behavior is the same: newest entries first, at most 200 kept, same match results. `COMPILED_ROUTES` is built once, so routes added to `ROUTES` later at runtime need to be compiled too.

    **Already good:** `recent_errors` stops reading as soon as it has `limit` matches now. The old version built the full list first.
