messages:
- role: user
  content: |
    Review of our `logdigest` morning page, please. Diff only, no essay. Opened by ~40 people on the platform team, mostly just to read the top block and close it.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Log digest</title>
      <link rel="stylesheet" href="digest.css">
    </head>
    <body>
      <h1>Log digest, last 24h</h1>
      <p class="meta">Generated 07:00 UTC, 1.84M events, 3 new error clusters</p>

      <img class="hero" src="img/error-rate-24h.png" width="1600" height="600"
           alt="Error rate, all services, 24h" loading="lazy">

      <h2>Per service</h2>
      <section class="grid">
        <figure><img src="img/svc-ingest.png" width="800" height="400" alt="ingest"></figure>
        <figure><img src="img/svc-parser.png" width="800" height="400" alt="parser"></figure>
        <figure><img src="img/svc-indexer.png" width="800" height="400" alt="indexer"></figure>
        <figure><img src="img/svc-query.png" width="800" height="400" alt="query"></figure>
        <figure><img src="img/svc-alerts.png" width="800" height="400" alt="alerts"></figure>
        <figure><img src="img/svc-archive.png" width="800" height="400" alt="archive"></figure>
        <figure><img src="img/svc-gateway.png" width="800" height="400" alt="gateway"></figure>
        <figure><img src="img/svc-auth.png" width="800" height="400" alt="auth"></figure>
