- role: assistant
  content: |
    **Workload:** web (static report page, read daily by a small team)

    #### [High] Hero image is lazy-loaded
    - **Where:** `img.hero`
    - **Issue:** it is the first thing on the page, so `loading="lazy"` only delays it and adds a deferred-load step. Never lazy-load the image above the fold.
    - **Fix:**
      ```html
      - alt="Error rate, all services, 24h" loading="lazy">
      + alt="Error rate, all services, 24h" fetchpriority="high">
      ```
    - **Impact:** network and perceived load time. Nothing saved, since this image is always needed.

    #### [Medium] Below-the-fold charts load eagerly
    - **Where:** the eight `svc-*.png` images
    - **Issue:** most readers only read the top block and leave, so these eight charts are downloaded and decoded for nothing. In Green Metrics Tool micro-benchmarks, a 15-photo article loaded without scrolling used about 12% less CPU energy with lazy loading. When the reader scrolled to the end, there was no difference. So the saving depends on how people use this page.
    - **Fix:** add `loading="lazy"` to each one. Your `width` and `height` are already set, so layout won't jump.
      ```html
      - <img src="img/svc-ingest.png" width="800" height="400" alt="ingest">
      + <img src="img/svc-ingest.png" width="800" height="400" alt="ingest" loading="lazy">
      ```
    - **Impact:** M and network, only for readers who don't scroll.

    #### [Low] PNG for every chart
    - **Where:** `img/*.png`
    - **Issue:** PNG was the most expensive format to decode in Green Metrics Tool micro-benchmarks (about 181 J for 50 page loads, against about 150 J for WebP and about 134 J for JPG). Those tests used photos, and charts with flat colors compress differently, so check your own files. The main gain from WebP is fewer transferred bytes.
    - **Fix:** write WebP once in the step that generates the page, and keep the PNG as fallback:
      ```html
      - <img src="img/svc-ingest.png" width="800" height="400" alt="ingest" loading="lazy">
      + <picture>
      +   <source srcset="img/svc-ingest.webp" type="image/webp">
      +   <img src="img/svc-ingest.png" width="800" height="400" alt="ingest" loading="lazy">
      + </picture>
      ```
    - **Impact:** network, small. Encode at build time only. Don't convert on request. AVIF is not worth it here: encoding was about 7× the cost of JPG in the same benchmarks, and the page is regenerated daily.

    **Already good:** `width`/`height` on every image, meaningful `alt` text, no JS needed.
verify:
  static_only: HTML-only review; no executable code
