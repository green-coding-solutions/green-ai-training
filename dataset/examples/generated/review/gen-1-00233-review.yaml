id: gen-1-00233-review
category: review
language: javascript
patterns:
- regex-precompile
- vectorize-or-jit
messages:
- role: user
  content: |
    hi, i wrote a small node script to go through our app log and tell me how many ERROR / WARN / TIMEOUT lines there are and the median and average response time. it works on my small test file but on the real log it takes forever and the median looks wrong to me. i dont know what is wrong, can you review it?

    ```javascript
    const fs = require('fs');

    const file = process.argv[2];
    const levels = ['ERROR', 'WARN', 'TIMEOUT'];
    const lines = fs.readFileSync(file, 'utf8').split('\n');

    const counts = {};
    const times = [];

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      for (const level of levels) {
        const re = new RegExp('\\b' + level + '\\b', 'i');
        if (re.test(line)) {
          counts[level] = (counts[level] || 0) + 1;
        }
      }

      const m = line.match(/took (\d+)ms/);
      if (m) {
        times.push(m[1]);
      }
    }

    times.sort();
    const median = times[Math.floor(times.length / 2)];
    const avg = times.reduce((a, b) => a + Number(b), 0) / times.length;

    console.log(counts);
    console.log('median', median, 'avg', avg);
    ```
- role: assistant
  content: |
    **Workload:** script (runs over a large log file)

    #### [Bug] The median is wrong
    - **Where:** `times.push(m[1])` and `times.sort()`
    - **Issue:** `m[1]` is a string, and `sort()` without a comparator sorts as text. So `"100"` comes before `"9"`, and the middle value is not the real median. `avg` works only because of the `Number(b)` in `reduce`.
    - **Fix:** store numbers with `Number(m[1])`. Then sort numerically. A `Float64Array` sorts numerically by default.

    #### [Bug] Empty result prints `NaN` / `undefined`
    - **Where:** `median` and `avg` lines
    - **Issue:** if no line contains `took ...ms`, you divide by zero and read `times[0]` of an empty array.
    - **Fix:** check `times.length === 0` first.

    #### [High] A new RegExp is built for every line and every level
    - **Where:** `new RegExp('\\b' + level + '\\b', 'i')` inside the double loop
    - **Issue:** the pattern text only depends on `level`, not on the line. You still build and compile a new regex object for each line, three times. That is the likely reason it is slow on a big log. The literal `/took (\d+)ms/` is fine, because it is a fixed pattern.
    - **Fix:** build the three regexes once, before the loop, and reuse them. Do not add the `g` flag to them. A global regex keeps a `lastIndex` between `test()` calls and would skip matches.
    - **Impact:** reduces E per line. The saving grows with the number of lines.

    #### [Low] Numbers kept in a plain array, sorted as strings
    - **Where:** `times`
    - **Issue:** a typed array stores plain numbers and sorts them without a comparator function. For a very large log this is cheaper than an array of strings. Gains are modest, because V8 already compiles simple loops well.
    - **Fix:** copy to a `Float64Array` once at the end, then sort and sum with a plain loop.

    I wrote the fixed version as an ES module, so save it as `.mjs`. If you stay on CommonJS, keep `require('fs')` and the `require.main === module` check. The logic is the same.

    ```javascript
    import { readFileSync } from 'node:fs';
    import { fileURLToPath } from 'node:url';

    const LEVELS = ['ERROR', 'WARN', 'TIMEOUT'];
    // built once, reused for every line
    const LEVEL_RES = LEVELS.map((level) => ({
      level,
      re: new RegExp('\\b' + level + '\\b', 'i'),
    }));
    const TOOK_RE = /took (\d+)ms/;

    export function summarize(text) {
      const counts = {};
      const times = [];

      for (const line of text.split('\n')) {
        for (const { level, re } of LEVEL_RES) {
          if (re.test(line)) {
            counts[level] = (counts[level] || 0) + 1;
          }
        }
        const m = TOOK_RE.exec(line);
        if (m) {
          times.push(Number(m[1]));
        }
      }

      if (times.length === 0) {
        return { counts, median: null, avg: null };
      }

      const sorted = Float64Array.from(times).sort(); // numeric sort
      let sum = 0;
      for (let i = 0; i < sorted.length; i++) {
        sum += sorted[i];
      }
      return {
        counts,
        median: sorted[Math.floor(sorted.length / 2)],
        avg: sum / sorted.length,
      };
    }

    if (process.argv[1] === fileURLToPath(import.meta.url)) {
      const file = process.argv[2];
      if (!file) {
        console.error('usage: node logstats.mjs <logfile>');
      } else {
        const { counts, median, avg } = summarize(readFileSync(file, 'utf8'));
        console.log(counts);
        console.log('median', median, 'avg', avg);
      }
    }
    ```

    **Already good:** `\b` word boundaries, so `WARNING` does not count as `WARN`. The fixed `took (\d+)ms` pattern is a literal.

    If the log is several GB, `readFileSync` plus `split` holds the whole file in memory. Read it line by line with `readline` and `fs.createReadStream` instead. The counting code stays the same.
verify:
  module: true
  test: |-
    import assert from 'node:assert';
    const r = summarize('ERROR took 9ms\nwarn took 100ms\nWARNING took 30ms\nok took 2000ms');
    assert.deepStrictEqual(r.counts, { ERROR: 1, WARN: 1 });
    assert.strictEqual(r.median, 100);
    assert.strictEqual(r.avg, 534.75);
    const e = summarize('nothing here');
    assert.strictEqual(e.median, null);
    assert.strictEqual(e.avg, null);
    assert.deepStrictEqual(e.counts, {});
