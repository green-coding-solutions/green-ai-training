id: gen-1-00208-review
category: review
language: javascript
patterns:
- system-fonts-and-deps
- compress-transmitted
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    Can you review this endpoint? It's the backend for our internal log viewer. The dashboard calls it every few seconds per open tab, and we usually have 30-50 tabs open during an incident. A response is typically 1-5 MB of JSON (a few thousand rows).

    What the dashboard needs:
    - rows with `ts`, `level`, `service`, `message`
    - `ts` shown as `YYYY-MM-DD HH:mm:ss`
    - a count per level for the header badges
    - the server must stay responsive under load, because the same process also serves our alert webhooks

    ```javascript
    const http = require('http');
    const zlib = require('zlib');
    const moment = require('moment');
    const _ = require('lodash');
    const { loadLogs } = require('./store');

    const server = http.createServer(async (req, res) => {
      try {
        const url = new URL(req.url, 'http://localhost');
        const level = url.searchParams.get('level');
        const logs = await loadLogs(url.searchParams.get('service'));

        const rows = logs
          .filter((l) => !level || l.level === level)
          .map((l) => ({
            ts: moment(l.ts).format('YYYY-MM-DD HH:mm:ss'),
            level: l.level,
            service: l.service,
            message: l.message,
          }));

        const byLevel = _.countBy(rows, 'level');
        const body = Buffer.from(JSON.stringify({ rows, byLevel }));

        const packed = zlib.brotliCompressSync(body, {
          params: { [zlib.constants.BROTLI_PARAM_QUALITY]: 11 },
        });
        res.writeHead(200, {
          'Content-Type': 'application/json',
          'Content-Encoding': 'br',
        });
        res.end(packed);
      } catch (err) {
        console.error(err);
        res.writeHead(500);
        res.end();
      }
    });

    server.listen(8080);
    ```
- role: assistant
  content: |
    **Workload:** cloud backend (dynamic API, polled by many tabs)

    #### [Bug] `Content-Encoding: br` is sent to every client
    - **Where:** `res.writeHead(200, { 'Content-Encoding': 'br' })`
    - **Issue:** the code never reads `Accept-Encoding`. Any client or proxy that does not accept brotli (curl, scripts, some health checks) gets bytes it cannot decode.
    - **Fix:** check the header and fall back to the plain body. Add `Vary: Accept-Encoding` so caches keep the variants apart.

    #### [High] Brotli quality 11, synchronous, on every request
    - **Where:** `zlib.brotliCompressSync(..., { QUALITY: 11 })`
    - **Issue:** quality 11 is the slowest and most CPU-hungry setting. It is built for assets that are compressed once and served many times. Here every poll of every tab compresses a fresh 1-5 MB body. The `Sync` call also blocks the event loop, so your alert webhooks wait behind it.
    - **Fix:** use async gzip at its default level, and skip compression for small bodies. Dynamic JSON is highly repetitive, so gzip already shrinks it a lot.
    - **Impact:** reduces E on the server for every request. In Green Metrics Tool measurements on a 100 MB text corpus, brotli at its CLI default (quality 11) used about 3019 J to compress, and gzip used about 67 J, roughly 45× less ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,8e93a8d2-60b0-4831-905b-764b68257bc7)). That measures energy only, not output size. If the link is slow and size matters more than CPU, a middle brotli setting is an option, but not quality 11.

    #### [Medium] Two libraries for two tiny jobs
    - **Where:** `moment(l.ts).format(...)` and `_.countBy(rows, 'level')`
    - **Issue:** `moment` is loaded for one fixed format, and `lodash` for one count. Both add load time and memory to every process start, and `moment` is large. Plain JavaScript does both in a few lines, and you can build the rows and counts in a single pass.
    - **Fix:** use `toISOString()` for the timestamp and count while you build the rows.
    - **Impact:** reduces E and M (less to load and keep in memory). The savings are small per request, but they come for free once the two dependencies are gone.
    - **Behavior change:** `moment(...).format()` prints in the server's local time zone. `toISOString()` prints UTC. If the servers run in UTC (usual for containers), the output is identical. Otherwise the dashboard timestamps shift.

    ```javascript
    function formatTs(ts) {
      return new Date(ts).toISOString().slice(0, 19).replace('T', ' ');
    }

    function buildPayload(logs, level) {
      const rows = [];
      const byLevel = {};
      for (const l of logs) {
        if (level && l.level !== level) continue;
        rows.push({ ts: formatTs(l.ts), level: l.level, service: l.service, message: l.message });
        byLevel[l.level] = (byLevel[l.level] || 0) + 1;
      }
      return { rows, byLevel };
    }

    module.exports = { formatTs, buildPayload };
    ```

    ```javascript
    const http = require('http');
    const zlib = require('zlib');
    const { promisify } = require('util');
    const { loadLogs } = require('./store');
    const { buildPayload } = require('./payload');

    const gzip = promisify(zlib.gzip);
    const MIN_COMPRESS_BYTES = 1024;

    const server = http.createServer(async (req, res) => {
      try {
        const url = new URL(req.url, 'http://localhost');
        const logs = await loadLogs(url.searchParams.get('service'));
        const body = Buffer.from(JSON.stringify(buildPayload(logs, url.searchParams.get('level'))));

        const headers = { 'Content-Type': 'application/json', Vary: 'Accept-Encoding' };
        const accepts = /\bgzip\b/.test(req.headers['accept-encoding'] || '');

        if (accepts && body.length >= MIN_COMPRESS_BYTES) {
          const packed = await gzip(body); // default level, off the main thread
          res.writeHead(200, { ...headers, 'Content-Encoding': 'gzip' });
          return res.end(packed);
        }
        res.writeHead(200, headers);
        res.end(body);
      } catch (err) {
        console.error(err);
        res.writeHead(500);
        res.end();
      }
    });

    server.listen(8080);
    ```

    **Already good:** filtering happens before the `map`, only the four needed fields are sent, and errors return a 500 instead of crashing the process.
verify:
  green_block: 0
  test: |-
    const assert = require('assert');
    assert.strictEqual(formatTs('2026-10-09T12:30:45.123Z'), '2026-10-09 12:30:45');
    const logs = [
      { ts: '2026-10-09T12:30:45.123Z', level: 'info', service: 'a', message: 'm1', raw: 'x' },
      { ts: '2026-10-09T12:31:00.000Z', level: 'error', service: 'b', message: 'm2', raw: 'y' },
      { ts: '2026-10-09T12:32:10.999Z', level: 'info', service: 'a', message: 'm3', raw: 'z' },
    ];
    const all = buildPayload(logs, null);
    assert.strictEqual(all.rows.length, 3);
    assert.deepStrictEqual(all.rows[1], { ts: '2026-10-09 12:31:00', level: 'error', service: 'b', message: 'm2' });
    assert.deepStrictEqual(JSON.parse(JSON.stringify(all.byLevel)), { info: 2, error: 1 });
    const onlyInfo = buildPayload(logs, 'info');
    assert.strictEqual(onlyInfo.rows.length, 2);
    assert.deepStrictEqual(JSON.parse(JSON.stringify(onlyInfo.byLevel)), { info: 2 });
