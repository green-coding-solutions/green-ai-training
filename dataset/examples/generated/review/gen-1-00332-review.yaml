  test: |-
    r = summarize([])
    assert r["slowest"] is None and r["total"] == 0 and r["failed"] == []
    r = summarize([
        {"name": "a", "stage": "s1", "status": "passed", "duration": 3},
        {"name": "b", "stage": "s1", "status": "failed", "duration": 3, "retries": 2},
    ])
    assert r["slowest"] == "a"
    assert r["by_stage"] == {"s1": 2}
    assert r["has_retry"] is True
    assert r["avg"] == 3
