      import os
      import tempfile
      from collections import defaultdict
      globals().setdefault("LANG_BY_EXT", {
          ".py": "Python", ".js": "JavaScript", ".ts": "TypeScript",
          ".go": "Go", ".rs": "Rust", ".java": "Java", ".c": "C",
          ".h": "C", ".cpp": "C++", ".sh": "Shell", ".sql": "SQL",
          ".html": "HTML", ".css": "CSS",
      })
      globals().setdefault("SKIP_DIRS", {".git", "node_modules", ".venv", "__pycache__"})

      with tempfile.TemporaryDirectory() as root:
          layout = {
              "a.py": "x = 1\ny = 2\nz = 3\n",
              "b.PY": "print(1)\n",
              "c.json": "{}\n",
              "d.png": "notreallyapng\n",
              "README.md": "# hi\n",
              "Makefile": "all:\n",
              "package-lock.json": "{}\n{}\n",
              "sub/e.js": "a\nb\n",
              "sub/deep/f.sh": "echo hi\n",
              "node_modules/x.js": "skipped\n",
              ".git/config": "skipped\n",
          }
          for rel, text in layout.items():
              path = os.path.join(root, rel)
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as fh:
                  fh.write(text)
          files, lines, skipped = scan(root)
          for lang in sorted(lines):
              print(lang, files[lang], lines[lang])
          print("skipped", skipped)
