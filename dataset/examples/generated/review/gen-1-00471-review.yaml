id: gen-1-00471-review
category: review
language: sql
patterns:
- batch-db-writes
- memoize
messages:
- role: user
  content: |
    ?

    ```sql
    -- import_landing_leads.sql
    -- nightly: leads from the spring landing page forms (~2000 rows)
    INSERT INTO leads (email, campaign, signed_up_at, campaign_views)
    VALUES ('anna.keller@mailbox.example', 'spring-promo', '2026-10-08 21:14:03',
            (SELECT COUNT(*) FROM page_views WHERE campaign = 'spring-promo'));

    INSERT INTO leads (email, campaign, signed_up_at, campaign_views)
    VALUES ('tom.bauer@webmail.example', 'spring-promo', '2026-10-08 21:15:41',
            (SELECT COUNT(*) FROM page_views WHERE campaign = 'spring-promo'));

    INSERT INTO leads (email, campaign, signed_up_at, campaign_views)
    VALUES ('lea.novak@mailbox.example', 'newsletter-footer', '2026-10-08 21:17:09',
            (SELECT COUNT(*) FROM page_views WHERE campaign = 'newsletter-footer'));

    INSERT INTO leads (email, campaign, signed_up_at, campaign_views)
    VALUES ('sam.ortiz@webmail.example', 'spring-promo', '2026-10-08 21:19:52',
            (SELECT COUNT(*) FROM page_views WHERE campaign = 'spring-promo'));

    -- ... 1996 more of these
    ```
- role: assistant
  content: |
    **Workload:** data pipeline

    #### [High] The same aggregate runs for every lead
    - **Where:** `(SELECT COUNT(*) FROM page_views WHERE campaign = ...)` in every `INSERT`
    - **Issue:** `page_views` is not changed by this script, and there are only a few distinct campaigns. Still, the full count is recomputed for each of the ~2000 rows. That is about 2000 scans of a large table to get a handful of different answers.
    - **Fix:** count once per campaign with `GROUP BY`, then join the result to the new leads.
    - **Impact:** reduces E: table scans drop from one per lead to one per run.

    #### [Medium] One statement per row
    - **Where:** ~2000 separate `INSERT ... VALUES` statements
    - **Issue:** each statement is parsed, planned and committed on its own (autocommit), so you pay per-row overhead 2000 times. If one fails halfway, you also get a half-loaded night.
    - **Fix:** insert all rows in one statement. It is atomic and has one commit.
    - **Impact:** reduces E and round trips: 2000 statements become 1. At a few hundred rows the gain is small, but at your size it is worth it.

    Both fixes together:

    ```sql
    -- import_landing_leads.sql
    WITH new_leads (email, campaign, signed_up_at) AS (
      VALUES
        ('anna.keller@mailbox.example', 'spring-promo',      '2026-10-08 21:14:03'),
        ('tom.bauer@webmail.example',   'spring-promo',      '2026-10-08 21:15:41'),
        ('lea.novak@mailbox.example',   'newsletter-footer', '2026-10-08 21:17:09'),
        ('sam.ortiz@webmail.example',   'spring-promo',      '2026-10-08 21:19:52')
        -- ... remaining rows
    )
    INSERT INTO leads (email, campaign, signed_up_at, campaign_views)
    SELECT n.email, n.campaign, n.signed_up_at, COALESCE(v.views, 0)
    FROM new_leads n
    LEFT JOIN (
      SELECT campaign, COUNT(*) AS views
      FROM page_views
      GROUP BY campaign
    ) v ON v.campaign = n.campaign;
    ```

    The result is the same as before. `LEFT JOIN` plus `COALESCE` keeps leads from campaigns with no page views, which got `0` from the old subquery.

    #### [Low] Generated script
    - **Where:** whole file
    - **Issue:** if this script is generated from a CSV or form export, a bulk loader is better than a giant `VALUES` list. Use `COPY` / `\copy` in Postgres, or load a staging table and run the `SELECT` above on it.

    **Already good:** the column list is explicit, and the timestamps are in a sortable format.
