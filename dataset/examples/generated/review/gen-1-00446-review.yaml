id: gen-1-00446-review
category: review
language: go
patterns:
- string-join
messages:
- role: user
  content: "review this handler, diff only please. it's our product search endpoint, hit on every keystroke after 2 chars\
    \ (debounced), up to 500 items per response\n\n```go\npackage api\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\t\"strconv\"\
    \n)\n\nfunc (s *Server) handleProductSearch(w http.ResponseWriter, r *http.Request) {\n\tq := r.URL.Query().Get(\"q\"\
    )\n\tif len(q) < 2 {\n\t\thttp.Error(w, \"query too short\", http.StatusBadRequest)\n\t\treturn\n\t}\n\n\titems, err :=\
    \ s.store.Search(r.Context(), q, 500)\n\tif err != nil {\n\t\ts.log.Error(\"search failed\", \"err\", err)\n\t\thttp.Error(w,\
    \ \"search failed\", http.StatusInternalServerError)\n\t\treturn\n\t}\n\n\tout := \"[\"\n\tfor i, p := range items {\n\
    \t\tif i > 0 {\n\t\t\tout += \",\"\n\t\t}\n\t\tout += `{\"id\":` + strconv.FormatInt(p.ID, 10)\n\t\tout += `,\"sku\":\"\
    ` + p.SKU + `\"`\n\t\tout += `,\"name\":\"` + p.Name + `\"`\n\t\tout += `,\"price\":` + fmt.Sprintf(\"%.2f\", float64(p.PriceCents)/100)\n\
    \t\tout += `}`\n\t}\n\tout += \"]\"\n\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tw.Write([]byte(out))\n\
    }\n```\n"
- role: assistant
  content: "**Workload:** web backend\n\n#### [Security] Unescaped strings in hand-built JSON\n- **Where:** `p.SKU` and `p.Name`\
    \ in the concatenation\n- **Issue:** a name containing `\"` or `\\` or a newline produces invalid JSON. If names are user-editable,\
    \ a crafted name can also inject extra fields into the response.\n- **Fix:** let `encoding/json` build the output (see\
    \ diff).\n\n#### [High] Repeated string concatenation on every request\n- **Where:** the `out +=` chain in the loop\n\
    - **Issue:** Go strings are immutable. Each `+=` allocates a new string and copies everything built so far. That is about\
    \ 5 concatenations per item, so around 2,500 allocations for 500 items, with copy work that grows quadratically with the\
    \ response size. The final `[]byte(out)` copies the whole body once more.\n- **Fix:** encode straight into the `ResponseWriter`.\
    \ If you ever must build text by hand, use `strings.Builder` with `Grow`.\n- **Impact:** reduces E (CPU and allocation/GC\
    \ work) on every search request, and this endpoint is hit on every debounced keystroke.\n\n```text\n import (\n+\t\"encoding/json\"\
    \n \t\"fmt\"\n \t\"net/http\"\n-\t\"strconv\"\n )\n\n+type productJSON struct {\n+\tID    int64       `json:\"id\"`\n\
    +\tSKU   string      `json:\"sku\"`\n+\tName  string      `json:\"name\"`\n+\tPrice json.Number `json:\"price\"`\n+}\n\
    +\n func (s *Server) handleProductSearch(w http.ResponseWriter, r *http.Request) {\n \t...\n-\tout := \"[\"\n-\tfor i,\
    \ p := range items {\n-\t\tif i > 0 {\n-\t\t\tout += \",\"\n-\t\t}\n-\t\tout += `{\"id\":` + strconv.FormatInt(p.ID, 10)\n\
    -\t\tout += `,\"sku\":\"` + p.SKU + `\"`\n-\t\tout += `,\"name\":\"` + p.Name + `\"`\n-\t\tout += `,\"price\":` + fmt.Sprintf(\"\
    %.2f\", float64(p.PriceCents)/100)\n-\t\tout += `}`\n-\t}\n-\tout += \"]\"\n+\tout := make([]productJSON, 0, len(items))\n\
    +\tfor _, p := range items {\n+\t\tout = append(out, productJSON{\n+\t\t\tID:    p.ID,\n+\t\t\tSKU:   p.SKU,\n+\t\t\t\
    Name:  p.Name,\n+\t\t\tPrice: json.Number(fmt.Sprintf(\"%.2f\", float64(p.PriceCents)/100)),\n+\t\t})\n+\t}\n\n \tw.Header().Set(\"\
    Content-Type\", \"application/json\")\n-\tw.Write([]byte(out))\n+\tif err := json.NewEncoder(w).Encode(out); err != nil\
    \ {\n+\t\ts.log.Error(\"encode failed\", \"err\", err)\n+\t}\n }\n```\n\nBehavior notes:\n- `json.Number` keeps the `12.50`\
    \ price format. A plain `float64` would print `12.5`.\n- `make([]productJSON, 0, ...)` keeps an empty result as `[]`.\
    \ A nil slice would encode as `null`.\n- `Encode` adds a trailing newline, and it escapes `<`, `>` and `&` as `\\u003c`\
    \ etc. Both are valid JSON for any client.\n- `Encode` marshals into a buffer before writing, so a failure cannot leave\
    \ a half-written body."
