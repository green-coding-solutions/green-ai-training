- role: assistant
  content: |
    **Workload:** script (local page served by a CLI tool)

    #### [Bug] Body text renders in italic
    - **Where:** the fourth `@font-face` (`Inter-Italic.ttf`)
    - **Issue:** it is declared as `font-style: normal` with weight 400, the same as `Inter-Regular.ttf`. When two faces have the same descriptors, the later one wins, so all regular text uses the italic file. Real `<em>` text has no italic face to match.
    - **Fix:** declare it with `font-style: italic`. This goes away if you drop the custom fonts (see below).

    #### [Medium] Six TTF files for a local status page
    - **Where:** all six `@font-face` rules
    - **Issue:** the browser downloads and decodes up to six full TTF files (about 4 MB) on a cold load, only to draw a table and some headings. Your page is served locally, so there are no network savings to win. The cost is client work on every cold load.
    - **Fix:** use the system font stack, and delete the `@font-face` rules and the `fonts/` folder.
    - **Impact:** reduces client E on every page open. In Green Metrics Tool micro-benchmarks of 30 cold page loads, six local TTF files used ~556 J and the system font stack ~410 J, about 26% less. Two Latin-subset WOFF2 files used ~488 J, about 12% less than TTF. If you need a brand font, use that: one or two WOFF2 subsets instead of full TTFs.

    ```css
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 auto;
      max-width: 960px;
      padding: 1.5rem;
      color: #1b1f24;
    }
    h1, h2 { font-weight: 700; }
    th { font-weight: 600; text-align: left; }
    code, pre, .sha {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    table.authors { width: 100%; border-collapse: collapse; }
    table.authors td, table.authors th { padding: .4rem .6rem; border-bottom: 1px solid #e3e6ea; }
    .delta-up { color: #1a7f37; }
    .delta-down { color: #cf222e; }
    ```

    `th` uses weight 600 because the system fonts have no 500 face, so 500 would just look regular. The text will look a bit different per OS.

    **Already good:** the layout is small and plain, with no unused rules, no scripts and no extra dependencies.
