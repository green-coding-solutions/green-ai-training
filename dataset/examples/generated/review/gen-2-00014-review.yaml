- role: user
  content: |
    ?

    ```css
    /* spectra-viewer.css
     * Styles for viewer.html (v2, Plotly).
     * The v1 Bokeh dashboard was removed in March.
     * Served as-is from /static by the lab's Flask app.
     */

    :root {
      --bg: #fafafa;
      --fg: #222;
      --accent: #1f6feb;
      --border: #d0d7de;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    .toolbar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .toolbar select,
    .toolbar button {
      font: inherit;
      padding: 0.25rem 0.5rem;
    }

    .toolbar button.primary {
      background: var(--accent);
      color: #fff;
      border: 0;
    }

    .plot-area {
      height: calc(100vh-120px);
      min-height: 400px;
    }

    .peak-table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    .peak-table td {
      padding: 4px 8px
      border-bottom: 1px solid var(--border);
    }

    .peak-table tr.selected {
      background: #e7f0ff;
    }

    /* ---- v1 dashboard (Bokeh) ---- */
    .bk-root .bk-toolbar-box {
      position: absolute;
      right: 0;
      top: 0;
    }

    #bokeh-sidebar {
      width: 260px;
      float: left;
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    .spectrum-thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 6px;
    }

    .spectrum-thumb img {
      width: 100%;
      image-rendering: pixelated;
    }
    ```
- role: assistant
  content: |
    **Workload:** web (internal spectra viewer, served by Flask)

    #### [Bug] Invalid `calc()`: the plot area never gets its height
    - **Where:** `.plot-area { height: calc(100vh-120px); }`
    - **Issue:** inside `calc()`, `-` needs a space on both sides. Without the spaces, `100vh-120px` is read as one token with the unit `vh-120px`. The browser drops the whole declaration, so the plot does not fill the window. It falls back to `min-height` or to Plotly's default height.
    - **Fix:**
      ```css
      .plot-area {
        height: calc(100vh - 120px);
        min-height: 400px;
      }
      ```

    #### [Bug] Missing semicolon drops two declarations
    - **Where:** `.peak-table td`, after `padding: 4px 8px`
    - **Issue:** without the `;`, the value runs on to the next semicolon: `4px 8px border-bottom: 1px solid ...`. That is not a valid `padding`, so the browser discards it. You lose both the cell padding and the row borders.
    - **Fix:**
      ```css
      .peak-table td {
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
      }
      ```

    #### [Low] Dead v1 Bokeh rules
    - **Where:** everything below `/* ---- v1 dashboard (Bokeh) ---- */`
    - **Issue:** the header says the Bokeh dashboard is gone, so `.bk-root`, `#bokeh-sidebar` and `.spectrum-thumb*` probably match nothing in `viewer.html`. Before you delete them, run `grep -rE 'bk-|bokeh-sidebar|spectrum-thumb' templates/ static/` to make sure.
    - **Fix:** delete the block.
    - **Impact:** network, a few hundred bytes. This saves bytes, not client CPU. In Green Metrics Tool measurements of 50 cold page loads, a 16 KB stylesheet that was mostly unused rules used ~783 J. Purged and minified to 0.75 KB it used ~764 J, about 2% less, which is within measurement noise. Do it mainly because dead rules confuse the next person who edits the file.

    #### [Low] Served unminified
    - **Where:** "served as-is from /static"
    - **Issue:** the comments and whitespace go over the wire. For a file this small, that is the only cost. In Green Metrics Tool measurements of 50 cold page loads of a small page, unminified JS and CSS used ~837 J and an esbuild-minified build ~822 J, about 2% less, again within noise.
    - **Fix:** if the app already has an asset build step, let it minify this file. Don't add a build pipeline just for this stylesheet. For an internal lab tool, a readable source file is worth more.
    - **Impact:** network, small.

    **Already good:** the active rules are short and flat, use custom properties for colors, and use `tabular-nums` so the peak values line up.
