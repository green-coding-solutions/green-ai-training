    review pls, this scores every transaction batch in our fraud worker

    ```python
    from math import *

    FEATURES = ["log_amount", "hour_sin", "hour_cos", "n_tx_24h", "account_age_days"]


    def features(row):
        h = 2 * pi * row["hour"] / 24
        return {
            "log_amount": log1p(row["amount"]),
            "hour_sin": sin(h),
            "hour_cos": cos(h),
            "n_tx_24h": row["n_tx_24h"],
            "account_age_days": row["account_age_days"],
        }


    def sigmoid(z):
        return 1 / (1 + exp(-z))


    def score(row, model):
        f = features(row)
        z = model["bias"]
        for w, name in zip(model["weights"], FEATURES):
            mu, sd = model["stats"][name]
            z += w * (f[name] - mu) / sd
        return sigmoid(z)


    def score_batch(rows, model, threshold=0.5):
        results = []
        for row in rows:
            p = score(row, model)
            results.append({"id": row["id"], "p": round(p, 4), "flag": p >= threshold})
        return results
