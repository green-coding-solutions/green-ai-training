        ("a1b2c3", "boiler-temp", "plant-3", 1, 0.1, -40.0, b"\x00" * 300000),
    )
    _p = _json.dumps({"ts": 1700000000, "ch": {"t1": 612}})
    assert handle_uplink(_c, "gw/uplink/x' OR '1'='1", _p) is None
    _r = handle_uplink(_c, "gw/uplink/a1b2c3", _p)
    assert _r == [{"site": "plant-3", "sensor": "boiler-temp.t1", "value": 21.2, "ts": 1700000000}]
    assert set(lookup_device(_c, "a1b2c3").keys()) == {"name", "site_id", "enabled", "gain", "bias"}
