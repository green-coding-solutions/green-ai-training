    hello, can you look at my code for the activity feed endpoint? is work fine but some user say the feed is slow when they have many events. i am not so sure what is wrong, maybe the imports? thx

    ```python
    from datetime import *
    import json


    def build_feed(rows, user_id, limit=50, since=datetime.now() - timedelta(days=7)):
        # rows come from the db ordered oldest first
        feed = []
        for row in rows:
            if row["user_id"] != user_id:
                continue
            if row["created"] < since:
                continue
            feed.insert(0, {
                "id": row["id"],
                "text": row["text"],
                "created": row["created"].isoformat(),
            })
        return feed[:limit]


    def feed_response(rows, user_id):
        return json.dumps({"items": build_feed(rows, user_id)})
