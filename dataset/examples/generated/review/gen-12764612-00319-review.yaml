- role: user
  content: |
    hello, can you look at my code for the activity feed endpoint? is work fine but some user say the feed is slow when they have many events. i am not so sure what is wrong, maybe the imports? thx

    ```python
    from datetime import *
    import json


    def build_feed(rows, user_id, limit=50, since=datetime.now() - timedelta(days=7)):
        # rows come from the db ordered oldest first
        feed = []
        for row in rows:
            if row["user_id"] != user_id:
                continue
            if row["created"] < since:
                continue
            feed.insert(0, {
                "id": row["id"],
                "text": row["text"],
                "created": row["created"].isoformat(),
            })
        return feed[:limit]


    def feed_response(rows, user_id):
        return json.dumps({"items": build_feed(rows, user_id)})
    ```
- role: assistant
  content: |
    **Workload:** web (REST API)

    #### [Bug] Default `since` is fixed when the server starts
    - **Where:** `since=datetime.now() - timedelta(days=7)` in the signature
    - **Issue:** Python evaluates default values once, when the function is defined. After the process runs for a few days, "last 7 days" is really "since the last deploy". The window gets longer and longer.
    - **Fix:** use `since=None` and compute it inside the function (see code below).

    #### [High] `insert(0, ...)` for every matching row
    - **Where:** `feed.insert(0, {...})` in `build_feed`
    - **Issue:** each front insert shifts the whole list, so the loop is O(n²) for n matching events. That is why users with many events see a slow feed. In Green Metrics Tool micro-benchmarks, 1,000,000 `list.insert(0, x)` calls used ~1515 J of CPU energy and 1,000,000 `list.append(x)` calls ~1.2 J. The code also builds the whole feed and then throws away everything after `limit`.
    - **Fix:** walk the rows from newest to oldest, append, and stop at `limit`:
      ```python
      from datetime import *
      import json


      def build_feed(rows, user_id, limit=50, since=None):
          # rows come from the db ordered oldest first
          if since is None:
              since = datetime.now() - timedelta(days=7)
          feed = []
          for row in reversed(rows):
              if len(feed) >= limit:
                  break
              if row["user_id"] != user_id:
                  continue
              if row["created"] < since:
                  continue
              feed.append({
                  "id": row["id"],
                  "text": row["text"],
                  "created": row["created"].isoformat(),
              })
          return feed


      def feed_response(rows, user_id):
          return json.dumps({"items": build_feed(rows, user_id)})
      ```
      The result is the same: newest first, at most `limit` items. `rows` must be a list or tuple, because `reversed()` needs a sequence. If it is a generator, call `list(rows)` first.
    - **Impact:** E and M on every feed request. Work is now linear and ends early. Better still, if the SQL query can filter by user and date and `ORDER BY created DESC LIMIT 50`, you do not need to load all rows into Python.

    #### [Low] The star import
    - **Where:** `from datetime import *`
    - **Issue:** nothing to fix. In Green Metrics Tool micro-benchmarks, `from x import *` and `import x` used the same energy (no measurable difference), so I left it as it is. It is not the reason for the slow feed.

    **Already good:** the `json.dumps` call is done once per response, and the filter conditions are simple checks.
