    ```python
    import html
    import re


    def inline_md(text):
        out = html.escape(text)
        out = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", out)
        out = re.sub(r"\[([^\]]+)\]\(([^)]+)\)", r'<a href="\2">\1</a>', out)
        return out


    def render_landing(plans, quotes):
        parts = []
        for plan in plans:
            items = "".join("<li>%s</li>" % inline_md(f) for f in plan["features"])
            parts.append(
                '<section class="plan"><h2>%s</h2><ul>%s</ul></section>'
                % (html.escape(plan["name"]), items)
            )
        for q in quotes:
            # quotes come from the public testimonial form, approved by us
            parts.append("<blockquote>%s</blockquote>" % inline_md(q["text"]))
        return "\n".join(parts)
