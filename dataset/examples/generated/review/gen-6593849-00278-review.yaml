- role: assistant
  content: |
    **Workload:** web (e-commerce product listing)

    #### [Bug] Duplicate `id="add"`
    - **Where:** every "Add to cart" button
    - **Issue:** an `id` must be unique. `getElementById("add")` and `#add` selectors only reach the first button, so the other 23 are easy to break in the cart script.
    - **Fix:** drop the `id` and use `class="add"`. The `data-sku` attribute already identifies the product.

    #### [Medium] Six TTF files for one text font
    - **Where:** the six `@font-face` rules
    - **Issue:** every first-time visitor downloads and parses six uncompressed TTF files for a page that is mostly short names and prices. In Green Metrics Tool micro-benchmarks of 30 cold page loads, six local TTF files (~4 MB) used ~556 J of client and server CPU energy. Two Latin-subset WOFF2 files (~55 KB) used ~488 J (about 12% less), and the system font stack ~410 J (about 26% less than TTF).
    - **Fix:** use the system font stack. If the brand font is a must, ship only two WOFF2 Latin subsets (regular and bold) with `font-display: swap`. The 500, 600 and 900 weights cost one file each and are hardly distinguishable from 400 and 700 here.
    - **Impact:** E on the client and network bytes on every cold visit. The look changes: system fonts have no "Wald" letterforms, and the 900 weight renders as normal bold.

    ```html
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; }
      h1 { font-weight: 700; }
      .name, .price { font-weight: 600; }
      .note { font-style: italic; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    </style>
    ```

    #### [Medium] The hero image is lazy-loaded
    - **Where:** `<img src="/img/hero-mugs.jpg" ... loading="lazy">`
    - **Issue:** it is the first thing visitors see. Lazy loading it delays the largest paint and saves nothing, because the image is always needed.
    - **Fix:** remove `loading="lazy"` from the hero.

    #### [Low] Product images load eagerly
    - **Where:** the `<img>` tags in the grid, 24 products
    - **Issue:** images far below the fold are fetched even when the visitor leaves before scrolling. In Green Metrics Tool micro-benchmarks of an article with 15 photos, lazy loading used ~12% less energy over 20 loads without scrolling (~368 J vs ~325 J). When the visitor scrolled to the end, there was no difference.
    - **Fix:** add `loading="lazy"` to the grid images, but keep the first row (above the fold) eager. Your `width` and `height` attributes are already set, so the layout will not jump.
    - **Impact:** E and network bytes, only for visits that don't reach the lower rows. Shoppers who browse the whole list gain nothing.

    ```html
    <header>
      <img src="/img/hero-mugs.jpg" alt="Handmade stoneware mugs" width="1600" height="600">
      ...
    </header>
    <main class="grid">
      <article>
        <img src="/img/mug-moss.jpg" alt="Moss green mug" width="400" height="400">  <!-- first row: eager -->
        <h2 class="name">Moss mug</h2>
        <p class="price">€24</p>
        <button class="add" data-sku="MUG-MOSS">Add to cart</button>
      </article>
      ...
      <article>  <!-- rows below the fold -->
        <img src="/img/mug-ink.jpg" alt="Ink blue mug" loading="lazy" width="400" height="400">
        ...
      </article>
    </main>
    ```

    **Already good:** `width` and `height` on all images, meaningful `alt` text, and a viewport meta tag.
