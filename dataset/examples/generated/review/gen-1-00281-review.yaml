id: gen-1-00281-review
category: review
language: yaml
patterns:
- minimize-environments
- compress-transmitted
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    review pls

    ```yaml
    # values-staging.yaml (shop chart)
    replicaCount: 6

    autoscaling:
      enabled: true
      minReplicas: 6
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70

    resources:
      requests:
        cpu: "2"
        memory: 4Gi

    postgres:
      instanceClass: db.r6g.2xlarge
      multiAz: true

    ingress:
      host: staging.shop.example.com
      tls: true
      nginxConfig: |
        gzip on;
        gzip_comp_level 9;
        gzip_min_length 0;
        gzip_types text/html image/jpeg image/png video/mp4 application/zip;
        brotli on;
        brotli_comp_level 11;
        brotli_types text/html text/css application/javascript;
        client_max_body_size 10m;
    ```
- role: assistant
  content: |
    **Workload:** cloud backend (e-commerce storefront, staging and ingress config)

    #### [High] Brotli quality 11 on dynamic responses
    - **Where:** `brotli_comp_level 11` (and `gzip_comp_level 9`)
    - **Issue:** nginx compresses every HTML response on the fly, per request. Quality 11 is the most expensive setting. In Green Metrics Tool micro-benchmarks on a 100 MB text corpus, brotli at its default quality 11 used about 3019 J to compress, against about 67 J for gzip at its default level. That is about 45×. The comparison is energy only, not compression ratio. Brotli does compress smaller, but that only pays off for files compressed once.
    - **Fix:** use a moderate gzip level for dynamic responses. Compress static assets once at build time and serve them pre-compressed.
    - **Impact:** reduces E on every request. Decompression is cheap, so clients are not affected.

    #### [Medium] JSON and SVG are not compressed, already-compressed files are
    - **Where:** `gzip_types`
    - **Issue:** product, cart and search responses (`application/json`) are sent as plain text. The list instead contains `image/jpeg`, `image/png`, `video/mp4` and `application/zip`. These formats are already compressed, so gzip burns CPU and saves almost no bytes. `gzip_min_length 0` also compresses tiny responses where the gzip header can make the body larger.
    - **Fix:** list text formats only and set a minimum length.
    - **Impact:** reduces network bytes for API traffic and removes wasted CPU on media.

    #### [Medium] Staging is a full-size copy that runs all day
    - **Where:** `replicaCount`, `autoscaling.minReplicas`, `postgres`
    - **Issue:** six replicas at 2 CPU each, plus a Multi-AZ database, are reserved around the clock. A staging environment is used for a few hours a day, and the autoscaler can never go below six.
    - **Fix:** lower the floor and scale to a minimum outside working hours with a cron-based scaler (for example KEDA). Keep the environment, just shrink it. If you need prod-sized runs for load tests, scale up for the test and back down after.
    - **Impact:** reduces M and idle E, because reserved capacity that does nothing still draws power and holds hardware.

    #### [Low] Single-AZ is enough for staging
    - **Where:** `postgres.multiAz: true`
    - **Issue:** a standby replica doubles the database footprint. Staging data can be rebuilt.
    - **Fix:** set `multiAz: false` and check that no test depends on failover behavior.
    - **Impact:** reduces M. Whether it fits depends on your test goals.

    Suggested config:

    ```yaml
    replicaCount: 2

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70

    postgres:
      instanceClass: db.r6g.2xlarge
      multiAz: false

    ingress:
      host: staging.shop.example.com
      tls: true
      nginxConfig: |
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_vary on;
        gzip_types text/html text/css application/javascript application/json image/svg+xml;
        client_max_body_size 10m;
    ```

    Build your JS and CSS with brotli at quality 11 in the pipeline and serve those files with `brotli_static on;`. That is the one place where the expensive codec is worth it.

    **Already good:** TLS is on, request size is capped, and autoscaling has an upper bound.
verify:
  static_only: Helm values and nginx config; no runnable code
