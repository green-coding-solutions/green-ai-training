- role: assistant
  content: |
    **Workload:** script (static page generated by CI, opened by the team)

    #### [High] Six TTF font files for an internal status page
    - **Where:** the six `@font-face` rules and the `font-family` declarations
    - **Issue:** a first-time visitor downloads and parses about 4 MB of TTF files, and this happens for every deploy page. A status table and a log tail gain nothing from Inter and JetBrains Mono. In Green Metrics Tool browser micro-benchmarks (30 cold page loads), six local TTF files (~4 MB) used ~556 J of client energy. Two Latin-subset WOFF2 files used ~488 J, about 12% less. The system font stack used ~410 J, about 26% less than TTF.
    - **Fix:** drop all `@font-face` rules and use system stacks:

    ```diff
    -    @font-face { font-family: "Inter"; font-weight: 400; src: url("fonts/Inter-Regular.ttf") format("truetype"); }
    -    @font-face { font-family: "Inter"; font-weight: 500; src: url("fonts/Inter-Medium.ttf") format("truetype"); }
    -    @font-face { font-family: "Inter"; font-weight: 600; src: url("fonts/Inter-SemiBold.ttf") format("truetype"); }
    -    @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/Inter-Bold.ttf") format("truetype"); }
    -    @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("fonts/JetBrainsMono-Regular.ttf") format("truetype"); }
    -    @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("fonts/JetBrainsMono-Bold.ttf") format("truetype"); }
    -
    -    body { font-family: "Inter", sans-serif; margin: 2rem auto; max-width: 52rem; color: #1b1f24; }
    +    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 2rem auto; max-width: 52rem; color: #1b1f24; }
    ...
    -    code, pre { font-family: "JetBrains Mono", monospace; font-size: .9rem; }
    +    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9rem; }
    ```
    Also delete the `fonts/` folder from the publish step, so the job uploads less.
    - **Impact:** reduces E on the client for every page view, and network bytes for every published page. It also removes the artifacts you store with each deploy.

    #### [Low] Brand font needed? Use subsets, not TTF
    - **Where:** same `@font-face` block, only if the team wants to keep Inter
    - **Issue:** if you keep a custom font, ship two Latin-subset WOFF2 files (regular and bold) with `font-display: swap`. Do not ship the full TTF set. Text then shows right away instead of waiting for the font.

    **Already good:** the page is static HTML with no JavaScript and no external requests.
verify:
  static_only: html/css page with template placeholders, no executable code
