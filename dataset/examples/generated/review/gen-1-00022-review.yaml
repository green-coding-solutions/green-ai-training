      import json
      seed = 7
      def rnd(n):
          global seed
          seed = (seed * 1103515245 + 12345) % 2147483648
          return seed % n
      cats = ["shoes", "toys", "books", "garden", "kitchen"]
      statuses = ["paid", "shipped", "paid", "refunded", "paid"]
      orders = []
      for i in range(300):
          items = [{"category": cats[rnd(5)], "qty": 1 + rnd(4)} for _ in range(1 + rnd(3))]
          orders.append({"id": i, "total": rnd(500) * 10, "status": statuses[rnd(5)], "items": items})
      print(json.dumps(order_report(orders), sort_keys=True))
      calm = [o for o in orders if o["status"] != "refunded"]
      print(json.dumps(order_report(calm), sort_keys=True))
