    import os
    import tempfile

    p = tempfile.NamedTemporaryFile("w", suffix=".tsv", delete=False, encoding="utf-8")
    p.write("# comment\nfoo\tbar\n\\bcat\\b\tdog\n")
    p.close()
    rules = load_rules(p.name)
    os.unlink(p.name)
    assert len(rules) == 2
    assert scrub_line("Foo foo FOO foo\n", rules) == "bar bar bar bar\n"
    assert scrub_line("Cat and cat\n", rules) == "dog and dog\n"
