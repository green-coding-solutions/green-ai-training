messages:
- role: user
  content: |
    Hi, this is the help page what our GW-400 gateway serve on /help. Installer connect his phone to the setup wifi of the gateway and open it when he is standing at the mast. Mostly they only need the LED table on top, but in the access log i see that all the step photos are allways loaded anyway. Can you make a review pls?

    ```html
