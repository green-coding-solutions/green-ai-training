- role: assistant
  content: |
    **Workload:** web (help page served by an embedded gateway)

    #### [Bug] "2. Antenna" link goes nowhere
    - **Where:** `<a href="#antenna">` in `<nav>` and `<section id="antena">`
    - **Issue:** the section id is misspelled, so tapping the link does not jump to the antenna steps.
    - **Fix:** `<section id="antenna">`.

    #### [Medium] All nine step photos load on every visit
    - **Where:** the `<img>` tags in `#mount`, `#antenna` and `#power`
    - **Issue:** these photos sit far below the LED table, but the browser fetches and decodes all of them as soon as the page opens. That is why they show up in your access log. Most installers only read the LED table, so the gateway sends the photos and the phone decodes them for nothing.
    - **Fix:** add `loading="lazy"` to the step photos. Also give every photo `width` and `height`. Without them, the lazy placeholders have zero height and sit right next to each other, so the browser loads more of them than it needs to. Dimensions also stop the page from jumping while photos arrive. Do **not** lazy-load `front-panel.jpg`. It is above the fold, next to the LED table, and lazy loading would only delay it.
    - **Impact:** reduces E on the phone and on the gateway, and network bytes over the setup Wi-Fi. In Green Metrics Tool page-load measurements of an article with 15 photos, lazy loading the images below the fold used about 12% less CPU energy when visitors did not scroll. When visitors scrolled to the end, there was no difference (about 1%, which is noise). So it saves energy on your typical visit, and the installer who scrolls down to the mounting steps loses nothing.

    ```html
    <section id="leds">
      <h2>Status LEDs</h2>
      <!-- above the fold: keep eager -->
      <img src="/static/img/front-panel.jpg" alt="Front panel with LEDs PWR, NET, LORA, ERR"
           width="800" height="450">
      <!-- table unchanged -->
    </section>

    <section id="mount">
      <h2>1. Mounting on pole</h2>
      <img src="/static/img/mount-01.jpg" alt="Bracket placed on pole" width="800" height="600" loading="lazy">
      <img src="/static/img/mount-02.jpg" alt="Tighten the U-bolts" width="800" height="600" loading="lazy">
      <img src="/static/img/mount-03.jpg" alt="Gateway clipped on bracket" width="800" height="600" loading="lazy">
    </section>

    <section id="antenna">
      <h2>2. Antenna</h2>
      <img src="/static/img/antenna-01.jpg" alt="N-connector on top of the housing" width="800" height="600" loading="lazy">
      <img src="/static/img/antenna-02.jpg" alt="Antenna screwed hand-tight" width="800" height="600" loading="lazy">
      <img src="/static/img/antenna-03.jpg" alt="Self-amalgamating tape over connector" width="800" height="600" loading="lazy">
    </section>

    <section id="power">
      <h2>3. PoE power</h2>
      <img src="/static/img/poe-01.jpg" alt="Open cable gland" width="800" height="600" loading="lazy">
      <img src="/static/img/poe-02.jpg" alt="RJ45 plugged into ETH/PoE port" width="800" height="600" loading="lazy">
      <img src="/static/img/poe-03.jpg" alt="Gland closed, LEDs on" width="800" height="600" loading="lazy">
    </section>
    ```

    ```css
    /* help.css: keep photos responsive when width/height are set */
    img { max-width: 100%; height: auto; }
    ```

    Use the real pixel size of each photo for `width` and `height`. The values above are placeholders.

    **Already good:** the logo is an SVG with fixed dimensions, the viewport meta tag is set, and every photo has useful `alt` text.
