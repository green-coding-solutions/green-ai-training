  test: |
    import sqlite3
    _c = sqlite3.connect(":memory:")
    _c.execute("CREATE TABLE sensors (sensor_id TEXT, site TEXT, kind TEXT, unit TEXT, last_value REAL, last_seen REAL, raw_frame BLOB)")
    _c.executemany(
        "INSERT INTO sensors VALUES (?,?,?,?,?,?,?)",
        [
            ("a", "s1", "temp", "celsius", None, None, None),
            ("b", "s1", "temp", "celsius", 1.5, 1e12, b"x"),
            ("c", "s1", "temp", "celsius", None, 1e12, b"y"),
        ],
    )
    _out = render_metrics(_c, "s1")
    assert 'gw_sensor_value{sensor="a",kind="temp",unit="celsius"} NaN\n' in _out
    assert 'gw_sensor_value{sensor="b",kind="temp",unit="celsius"} 1.5\n' in _out
    assert 'gw_sensor_value{sensor="c",kind="temp",unit="celsius"} NaN\n' in _out
    assert _out.endswith("\n")
    assert render_metrics(_c, "x' OR '1'='1") == "# TYPE gw_sensor_value gauge\n"
