    review pls, click tracking for the landing page heatmap

    ```python
    import time
    import threading
    from flask import Flask, request, jsonify

    app = Flask(__name__)

    click_log = []  # newest first
    _lock = threading.Lock()


    @app.route("/track", methods=["POST"])
    def track():
        data = request.get_json(force=True)
        event = {
            "ts": time.time(),
            "x": data.get("x"),
            "y": data.get("y"),
            "target": data.get("target"),
            "session": request.cookies.get("sid"),
        }
        with _lock:
            click_log.insert(0, event)
        return "", 204


    @app.route("/admin/recent-clicks")
    def recent_clicks():
        n = int(request.args.get("n", 20))
        with _lock:
            return jsonify(click_log[:n])
