    import re
    for ph in PHASES:
        svg = dot_field(phase=ph)
        assert svg.startswith('<svg') and svg.endswith('</svg>')
        radii = [float(v) for v in re.findall(r' r="([-0-9.]+)"', svg)]
        assert radii, "no circles generated"
        assert min(radii) >= 0.15, "negative or tiny radius found"
        fills = set(re.findall(r'fill="(#[0-9a-f]{6})"', svg))
        assert len(fills) > 1
    small = dot_field(width=60, height=60, spacing=6, phase=0.0)
    count = 0
    for row in range(10):
        for col in range(10):
            x, y = col * 6, row * 6
            d = math.sqrt((x - 30) ** 2 + (y - 30) ** 2)
            w = math.sin(d / 40.0) * math.cos(x / 90.0)
            if abs(2.2 * w) >= 0.15:
                count += 1
    assert small.count('<circle') == count
