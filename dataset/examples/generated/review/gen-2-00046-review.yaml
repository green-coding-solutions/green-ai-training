    import os, tempfile
    text = (
        "2\n"
        "Properties=species:S:1:pos:R:3 free_energy=-5.0 energy=-12.5 temperature=310.0\n"
        "C 1.0e-03 -2.5E+00 0\n"
        "O 1.5 .5 -3\n"
    )
    fd, path = tempfile.mkstemp(suffix=".xyz")
    with os.fdopen(fd, "w") as fh:
        fh.write(text)
    frames = list(read_frames(path))
    assert len(frames) == 1
    info, symbols, coords = frames[0]
    assert info == {"energy": -12.5, "temperature": 310.0}, info
    assert symbols == ["C", "O"]
    assert coords.shape == (2, 3)
    assert abs(coords[0, 0] - 1.0e-3) < 1e-12
    assert coords[0, 1] == -2.5 and coords[1, 1] == 0.5 and coords[1, 2] == -3.0
    bad = path + ".bad"
    with open(bad, "w") as fh:
        fh.write("1\nenergy=1.0\nX? 1 2 3\n")
    try:
        list(read_frames(bad))
        raise AssertionError("expected ValueError")
    except ValueError:
        pass
    os.remove(path)
    os.remove(bad)
