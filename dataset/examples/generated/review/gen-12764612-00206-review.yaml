  green_code: |
    LOG=app.log
    declare -A count
    total=0

    while read -r ts level _; do
        hour=${ts:11:2}
        count[$hour:$level]=$(( ${count[$hour:$level]:-0} + 1 ))
        total=$(( total + 1 ))
    done < "$LOG"

    for key in "${!count[@]}"; do
        echo "$key ${count[$key]}"
    done | sort
    echo "total $total"
  equivalence:
    driver: 'true'
