    2026-10-26T14:59:59 WARN  search slow query 1200ms
    2026-10-26T15:00:02 INFO  search ok
    2026-10-26T15:10:10 ERROR payments timeout
    2026-10-26T15:11:00 ERROR payments timeout

    2026-10-26T16:01:01 INFO  web GET /health
