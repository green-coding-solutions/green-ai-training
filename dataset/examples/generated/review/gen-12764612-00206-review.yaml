    while read line; do
        ts=$(echo $line | cut -d' ' -f1)
        level=$(echo $line | cut -d' ' -f2)
        hour=$(echo $ts | cut -c12-13)
        n=$(expr ${count[$hour:$level]:-0} + 1)
        count[$hour:$level]=$n
        total=$(expr $total + 1)
    done < "$LOG"

    for key in "${!count[@]}"; do
