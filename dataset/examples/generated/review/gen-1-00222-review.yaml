    +                            .header("Content-Type", "application/json")
    +                            .POST(BodyPublishers.ofString(features)).build();
    +                    return client.sendAsync(mr, BodyHandlers.ofString());
    +                })
    +                .thenApply(this::requireOk)
    +                .thenApply(this::parse);
    +    }
    +
    +    private String requireOk(HttpResponse<String> r) {
    +        if (r.statusCode() != 200) {
    +            throw new IllegalStateException("upstream " + r.uri() + " returned " + r.statusCode());
    +        }
    +        return r.body();
