    +    private CompletableFuture<Score> scoreOne(String id) {
    +        HttpRequest fr = HttpRequest.newBuilder(URI.create(featureUrl + "/features/" + id))
    +                .timeout(Duration.ofSeconds(5))
    +                .GET().build();
    +        return client.sendAsync(fr, BodyHandlers.ofString())
    +                .thenApply(this::requireOk)
