    +    public List<Score> scoreAll(List<String> userIds) {
    +        Semaphore permits = new Semaphore(MAX_IN_FLIGHT);
    +        List<CompletableFuture<Score>> futures = new ArrayList<>(userIds.size());
    +        for (String id : userIds) {
    +            permits.acquireUninterruptibly();
    +            futures.add(scoreOne(id).whenComplete((s, e) -> permits.release()));
    +        }
    +        return futures.stream().map(CompletableFuture::join).toList();
    +    }
