    Notes on behavior:
    - Output order equals input order.
    - `scoreAll` no longer declares `throws Exception`. A failed user now surfaces as a `CompletionException` from `join()`. Callers that catch `Exception` still compile.
    - `MAX_IN_FLIGHT` is a starting value. Tune it against what the model server can batch. If the model server also offers a batch `/predict` endpoint, one call for all users would cut more round trips than concurrency does.
    - If a batch is usually 1-2 ids, the async path buys you little. Keep it only for the 20-60 id case.
