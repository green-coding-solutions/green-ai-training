messages:
- role: user
  content: |
    hi, im beginner with web. i made landing page for my yoga studio and when i open it on my old laptop the fan become loud after some minutes. the page look fine, only some soft moving shapes in the top. i dont know what is wrong, can you check my code?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Lotus Yoga Studio</title>
      <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #fdf6ee; color: #2b2b2b; }
        .hero { position: relative; overflow: hidden; padding: 140px 24px; text-align: center; }
        .blob { position: absolute; width: 320px; height: 320px; border-radius: 50%;
                background: #f4b6a0; opacity: 0.45; filter: blur(40px); }
        #blob1 { left: 10%; top: 10%; }
        #blob2 { right: 8%; bottom: 5%; background: #a8d5c2; }
        .ring { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px;
                margin: -260px 0 0 -260px; border: 2px dashed #e0a58f; border-radius: 50%; }
        .hero h1, .hero p, .hero a { position: relative; }
        .btn { display: inline-block; padding: 14px 28px; background: #2b2b2b; color: #fff;
               border-radius: 30px; text-decoration: none; }
      </style>
    </head>
    <body>
      <section class="hero">
        <div class="blob" id="blob1"></div>
        <div class="blob" id="blob2"></div>
        <div class="ring" id="ring"></div>
        <h1>Find your calm</h1>
        <p>Small classes. Morning and evening. First lesson is free.</p>
        <a class="btn" href="#book">Book a class</a>
      </section>

      <script>
        var blob1 = document.getElementById('blob1');
        var blob2 = document.getElementById('blob2');
        var ring = document.getElementById('ring');
        var angle = 0;
        var t = 0;

        function tick() {
          angle += 0.4;
          t += 0.01;
          ring.style.transform = 'rotate(' + angle + 'deg)';
          blob1.style.left = (10 + Math.sin(t) * 5) + '%';
          blob1.style.top = (10 + Math.cos(t) * 5) + '%';
          blob2.style.transform = 'translate(' + Math.cos(t) * 40 + 'px,' + Math.sin(t) * 30 + 'px)';
          requestAnimationFrame(tick);
        }
        tick();
      </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    **Workload:** web (landing page)

    #### [Bug] Animation speed depends on the screen refresh rate
    - **Where:** `angle += 0.4` and `t += 0.01` in `tick()`
    - **Issue:** the code adds a fixed step on every frame, not per second. On a 60 Hz screen it looks calm, but on a 144 Hz screen the ring and blobs move more than twice as fast.
    - **Fix:** use CSS animations with a duration in seconds. They run at the same speed on every screen (see the next finding).

    #### [High] Decorative movement is driven by a JavaScript loop that never stops
    - **Where:** the whole `<script>` block, `requestAnimationFrame(tick)`
    - **Issue:** while the tab is visible, your script runs on every frame and writes new styles for three elements. That is likely why the fan gets loud. Changing `left` and `top` on `blob1` also makes the browser recalculate the layout each frame. In Green Metrics Tool micro-benchmarks of a 20-second animation in a real browser, JavaScript `requestAnimationFrame` with style updates used ~161 J of CPU energy and CSS `@keyframes` ~145 J, about 10% less. That test was a single animation. Here the loop is also infinite and runs while the visitor reads.
    - **Fix:** describe the movement in CSS and delete the script. The browser then runs the animation by itself.
      ```html
      <style>
        /* ...your other styles stay the same... */
        #blob1 { left: 10%; top: 10%; animation: drift-a 10s ease-in-out infinite alternate; }
        #blob2 { right: 8%; bottom: 5%; background: #a8d5c2;
                 animation: drift-b 10s ease-in-out infinite alternate; }
        .ring { animation: spin 15s linear infinite; }

        @keyframes spin    { to   { transform: rotate(360deg); } }
        @keyframes drift-a { from { transform: translate(-50px, -30px); }
                             to   { transform: translate(50px, 30px); } }
        @keyframes drift-b { from { transform: translate(40px, -30px); }
                             to   { transform: translate(-40px, 30px); } }
      </style>
      ```
      Remove the whole `<script>` block. Add these lines to the `.ring` rule, because the rotation now comes from the animation: nothing else changes there.
    - **Behavior change:** the blobs now move back and forth along a line, not in a circle. The ring still turns once in about 15 seconds, like on a 60 Hz screen before. The movement is only decoration, so I kept the CSS simple.
    - **Impact:** E on the visitor's device, for as long as the page is open. Only `transform` is animated now, so there is no layout work per frame.

    **Already good:** the text and button use `position: relative`, so they stay above the shapes. The ring already used `transform`, which is the right property to animate.
verify:
  static_only: HTML page with CSS/JS animation, needs a browser to run
