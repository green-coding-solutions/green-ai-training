id: gen-1-00069-review
category: review
language: yaml
patterns:
- minimize-environments
- text-compression
facts:
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    Hello, I review our CI file for the climate model group (we run a small web portal where people look at simulation results, NetCDF slices as JSON). Can you check it please? I am not sure if its good, the pipeline is slow and our cloud bill is big. Sorry for my english.

    ```yaml
    stages:
      - build
      - deploy

    variables:
      PORTAL_IMAGE: registry.example.org/climate/portal:$CI_COMMIT_SHORT_SHA

    build-portal:
      stage: build
      script:
        - docker build -t $PORTAL_IMAGE .
        - docker push $PORTAL_IMAGE

    deploy-dev:
      stage: deploy
      script:
        - helm upgrade --install portal-dev ./chart -n dev --set image=$PORTAL_IMAGE --set replicas=3 --set resources.cpu=4
      environment:
        name: dev

    deploy-test:
      stage: deploy
      script:
        - helm upgrade --install portal-test ./chart -n test --set image=$PORTAL_IMAGE --set replicas=3 --set resources.cpu=4
      environment:
        name: test

    deploy-feature:
      stage: deploy
      script:
        - helm upgrade --install portal-$CI_COMMIT_REF_SLUG ./chart -n feature --set image=$PORTAL_IMAGE --set replicas=3 --set resources.cpu=4 --set ingress.compression.level=9
      environment:
        name: feature/$CI_COMMIT_REF_SLUG
      rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

    deploy-prod:
      stage: deploy
      script:
        - helm upgrade --install portal-prod ./chart -n prod --set image=$PORTAL_IMAGE --set replicas=3 --set resources.cpu=4 --set ingress.compression.level=9 --set ingress.compression.types="application/json,text/html"
      environment:
        name: production
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: manual
    ```
- role: assistant
  content: |
    **Workload:** cloud backend (CI/CD for a web portal)

    #### [High] Feature environments are never removed
    - **Where:** `deploy-feature`
    - **Issue:** every branch gets its own release with 3 replicas and 4 CPUs. There is no `on_stop` job and no expiry, so old branches keep running after the merge. This is the biggest source of idle compute and cost.
    - **Fix:** add `auto_stop_in` and a stop job. Also start with 1 replica and a small CPU request. A review app needs no production size.
    - **Impact:** reduces E and M. Idle pods stop using hardware.

    #### [Medium] `dev` and `test` are the same size as prod and always on
    - **Where:** `deploy-dev`, `deploy-test`
    - **Issue:** both run 3 replicas with 4 CPUs, all day and all night, for a portal that people use in working hours. Both are also updated on every pipeline, including feature branches, so they are overwritten all the time.
    - **Fix:** keep one shared pre-production environment, run it with 1 replica, and scale it to zero outside working hours (a CronJob or your cluster's scheduler). Run `deploy-test` only on the default branch. Do not remove it completely: you still need one place to test before prod.

    #### [Medium] Max compression level on dynamic JSON
    - **Where:** `ingress.compression.level=9` in `deploy-feature` and `deploy-prod`
    - **Issue:** your portal sends JSON slices that are made on request, so the ingress compresses them again and again. In Green Metrics Tool micro-benchmarks on English text, gzip used about 67 J to compress 100 MB, while zstd at its default level used about 16 J ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=2584305c-7a1e-47e2-b6cc-26276962035e,addc5f5e-55da-47f8-956d-240d06304e4e,fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,7b3bb87d-3b43-4f82-be99-0327405205b8,905bd408-6b31-4237-a4da-14b8fad90613,7f213a20-8028-4080-9583-6e465c217bb5,8e93a8d2-60b0-4831-905b-764b68257bc7)). Higher gzip levels cost more CPU for each response. This also contributes to the slow answers. The saving in bytes from level 9 over a moderate level is usually small. These figures compare energy, not compression ratio, so check the size on your own data.
    - **Fix:** use a moderate level (4-6), or zstd if your ingress supports it. Do not set any compression in feature environments, nobody needs it there.
    - **Impact:** reduces E on the ingress for every response.

    #### [Low] Image tag and quoting
    - **Where:** `$PORTAL_IMAGE` in the scripts
    - **Fix:** put it in double quotes in the shell commands (`"$PORTAL_IMAGE"`). It is safe and avoids surprises.

    **Already good:** the image is built once and reused for all deploys. Prod deploy is manual, so only reviewed builds go live. `types` limits compression to text formats. Do not add images or NetCDF files there, they are already compressed or binary.

    ```yaml
    stages:
      - build
      - deploy

    variables:
      PORTAL_IMAGE: registry.example.org/climate/portal:$CI_COMMIT_SHORT_SHA

    build-portal:
      stage: build
      script:
        - docker build -t "$PORTAL_IMAGE" .
        - docker push "$PORTAL_IMAGE"

    deploy-staging:
      stage: deploy
      script:
        - helm upgrade --install portal-staging ./chart -n staging --set image="$PORTAL_IMAGE" --set replicas=1 --set resources.cpu=1
      environment:
        name: staging
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

    deploy-feature:
      stage: deploy
      script:
        - helm upgrade --install "portal-$CI_COMMIT_REF_SLUG" ./chart -n feature --set image="$PORTAL_IMAGE" --set replicas=1 --set resources.cpu=1
      environment:
        name: feature/$CI_COMMIT_REF_SLUG
        on_stop: stop-feature
        auto_stop_in: 3 days
      rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

    stop-feature:
      stage: deploy
      script:
        - helm uninstall "portal-$CI_COMMIT_REF_SLUG" -n feature
      environment:
        name: feature/$CI_COMMIT_REF_SLUG
        action: stop
      rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          when: manual

    deploy-prod:
      stage: deploy
      script:
        - helm upgrade --install portal-prod ./chart -n prod --set image="$PORTAL_IMAGE" --set replicas=3 --set resources.cpu=4 --set ingress.compression.level=5 --set ingress.compression.types="application/json,text/html"
      environment:
        name: production
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: manual
    ```

    Prod keeps its size here because I cannot see the real load. Check the CPU use and scale it down if it is mostly idle. Staging is scaled down by the pipeline, but the nightly scale-to-zero must be set up separately in the cluster. Feature environments stop three days after the last deploy, or when someone runs the stop job.

    **Green Notes**
    - **Minimize deployed environments** (reduces E and M): one small staging instead of dev and test, and feature environments that stop themselves. https://patterns.greensoftware.foundation/development/minimizing-deployed-environments
    - **Enable text compression** (reduces E): keep compression on JSON for prod, but use a moderate level for responses made on request. https://patterns.greensoftware.foundation/development/web-performance/enable-text-compression
verify:
  static_only: GitLab CI YAML, needs GitLab and a Kubernetes cluster
