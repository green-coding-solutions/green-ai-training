id: gen-1-00473-review
category: review
language: javascript
patterns:
- lazy-load-images
- minify-assets
messages:
- role: user
  content: |
    Review please. Diff only, don't rewrite the file. This is the postbuild step in our CI that publishes the visual regression gallery of our component library to the public docs site (a few hundred screenshots per run, PNG).

    ```js
    // scripts/render-gallery.js
    function renderGallery(shots) {
      const figures = shots.map((s) => `
        <figure>
          <img src="${s.path}" alt="${s.name}">
          <figcaption>${s.name} (${s.width}x${s.height})</figcaption>
        </figure>`).join('');
      return `<!doctype html>
    <title>Component gallery</title>
    <main class="grid">${figures}</main>`;
    }

    module.exports = { renderGallery };
    ```

    ```js
    // scripts/bundle.mjs
    import { build } from 'esbuild';

    await build({
      entryPoints: ['src/gallery.js'],
      bundle: true,
      minify: false,
      sourcemap: 'inline',
      outfile: 'dist/gallery.js',
    });
    ```
- role: assistant
  content: |
    **Workload:** CI build step that publishes a public static page (cost is paid per visitor)

    #### [Security] Unescaped names in HTML
    - **Where:** `renderGallery`, `src`, `alt` and `figcaption`
    - **Issue:** `s.name` and `s.path` go into the HTML unescaped. Component or branch names with `"`, `<` or `&` break the markup. On a public page this is also an injection path.
    - **Fix:** escape all interpolated values (see snippet below).

    #### [High] All screenshots load eagerly
    - **Where:** `<img>` in `renderGallery`
    - **Issue:** every visitor downloads every PNG on page load, including the ones far below the fold that most never scroll to. The `<img>` tags also have no `width`/`height`, so the layout jumps while images arrive.
    - **Fix:** add `loading="lazy"` and `decoding="async"`, and set `width`/`height` from the data you already have. Keep the first four eager. They are likely in the first viewport, and lazy-loading them delays the first paint.
    - **Impact:** reduces network bytes and client work per visit. Offscreen images are only fetched when needed.

    #### [Low] Unminified bundle with inline source map on a public page
    - **Where:** `scripts/bundle.mjs`, `minify: false`, `sourcemap: 'inline'`
    - **Issue:** the bundle ships as readable code, and the inline source map embeds the original sources in the same file. Every visitor transfers both.
    - **Fix:** `minify: true` and an external source map that you do not publish (exclude `*.map` from the Pages artifact, or upload it to your error tracker).
    - **Impact:** fewer transferred bytes per visit. For a small bundle this saves network bytes, not measurable client CPU. The cost is one cheap minify pass per build.

    Changed part of `scripts/render-gallery.js` (`module.exports` stays as it is):

    ```js
    const escapeHtml = (v) =>
      String(v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    function renderGallery(shots) {
      const figures = shots.map((s, i) => {
        const name = escapeHtml(s.name);
        const lazy = i >= 4 ? ' loading="lazy" decoding="async"' : '';
        return `
        <figure>
          <img src="${escapeHtml(s.path)}" alt="${name}" width="${s.width}" height="${s.height}"${lazy}>
          <figcaption>${name} (${s.width}x${s.height})</figcaption>
        </figure>`;
      }).join('');
      return `<!doctype html>
    <title>Component gallery</title>
    <main class="grid">${figures}</main>`;
    }
    ```

    Changed part of `scripts/bundle.mjs`:

    ```js
    await build({
      entryPoints: ['src/gallery.js'],
      bundle: true,
      minify: true,
      sourcemap: 'external',
      outfile: 'dist/gallery.js',
    });
    ```

    **Already good:** the page is generated once per CI run and served as a static file, so there is no per-request rendering.
verify:
  green_block: 0
  test: |-
    import assert from 'node:assert/strict';
    const shots = [];
    for (let i = 0; i < 6; i++) {
      shots.push({ name: 'Button' + i, path: 'shots/b' + i + '.png', width: 320, height: 200 });
    }
    shots.push({ name: '<b>"x"&', path: 'shots/x.png', width: 100, height: 50 });
    const html = renderGallery(shots);
    assert.strictEqual((html.match(/loading="lazy"/g) || []).length, 3);
    assert.strictEqual((html.match(/<img /g) || []).length, 7);
    assert.ok(html.includes('width="320" height="200"'));
    assert.ok(!html.includes('<b>'));
    assert.ok(html.includes('&lt;b&gt;&quot;x&quot;&amp;'));
    assert.ok(html.startsWith('<!doctype html>'));
