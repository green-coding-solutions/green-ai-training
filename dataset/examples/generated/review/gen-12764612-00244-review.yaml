messages:
- role: user
  content: |
    Can you review the page below? `evalview` writes it next to `predictions.js` after every training run of our defect classifier. Reviewers open it to check the validation predictions. A run has several thousand samples, and each sample has a 96x96 crop already saved in `crops/`.

    Requirements:
    - plain static files, opened from disk or from the shared drive, no build step, no framework
    - reviewers must still be able to find a sample by its id
    - errors (label != prediction) stay highlighted
    - the confusion matrix stays on top

    Reviewers say the page is slow to open and the laptop fan starts. I want bugs and anything that makes it heavier than it needs to be.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Run 2291 - validation predictions</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
        .row { display: grid; grid-template-columns: 110px 1fr 1fr 100px 100px; align-items: center; }
        .cell { padding: 4px 8px; }
        .thumb { width: 96px; height: 96px; object-fit: cover; }
        .bad { background: #fdecea; }
      </style>
    </head>
    <body>
      <h1>Run 2291: validation predictions</h1>
      <img id="cm" src="plots/confusion_matrix.png" loading="lazy"
           width="640" height="640" alt="Confusion matrix">

      <div id="rows"></div>

      <script src="predictions.js"></script>
      <script>
        const host = document.getElementById('rows');
        for (const p of PREDICTIONS) {
          const row = document.createElement('div');
          row.className = 'row' + (p.pred !== p.label ? ' bad' : '');
          row.innerHTML = `
            <div class="cell"><div class="thumbwrap">
              <img class="thumb" src="crops/${p.id}.jpg" width="96" height="96" alt="">
            </div></div>
            <div class="cell"><span><span>${p.label}</span></span></div>
            <div class="cell"><span><span>${p.pred}</span></span></div>
            <div class="cell"><span>${Math.round(p.conf * 100) / 100}%</span></div>
            <div class="cell"><span>#${p.id}</span></div>`;
          host.appendChild(row);
        }
      </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    **Workload:** web (static report page, heavy on the client)

    #### [Bug] Confidence is shown wrong
    - **Where:** `Math.round(p.conf * 100) / 100` followed by `%`
    - **Issue:** a confidence of 0.97 is shown as `0.97%`. The rounding keeps two decimals of the fraction, so the value is never multiplied into a percentage.
    - **Fix:** `(p.conf * 100).toFixed(1) + '%'`

    #### [High] Every sample is built into one huge live DOM
    - **Where:** the `for (const p of PREDICTIONS)` loop
    - **Issue:** each sample becomes a grid row with several wrapper `div`/`span` elements, and the rows are appended to the live document one by one. With thousands of samples the browser has to build, style and lay out a very large tree, and that is what you hear in the fan. Reviewers look at a few dozen rows at a time.
    - **Fix:** show 100 samples per page as a plain `<table>`, built in a `DocumentFragment`, without the wrapper elements. Add prev/next buttons and an id search, so finding a sample still works. Plain Ctrl+F only sees the current page after this change, so the search box replaces it.
    - **Impact:** reduces client E and M for every page open. In Green Metrics Tool page-load measurements, a table of 10,000 rows with 14 elements per row used about 56% less CPU energy when it was paginated to 100 rows per page as a plain table built in a `DocumentFragment`.

    #### [Medium] The confusion matrix is lazy-loaded
    - **Where:** `<img id="cm" ... loading="lazy">`
    - **Issue:** this is the first thing reviewers see. Lazy loading above the fold only delays it and saves nothing.
    - **Fix:** remove `loading="lazy"` from this image. Its `width` and `height` are already set, which is good.

    #### [Medium] All thumbnails are requested eagerly
    - **Where:** `<img class="thumb" ...>`
    - **Issue:** the browser starts to fetch and decode every crop, including those far below the fold. Pagination already caps this at 100 per page. Lazy loading cuts it further, because most of the rows on a page are off screen.
    - **Fix:** set `img.loading = 'lazy'` on the thumbnails, before `img.src`.
    - **Impact:** reduces client E and network, but only when reviewers don't scroll through the whole page. In Green Metrics Tool measurements of an article with 15 photos, lazy loading used about 12% less energy on page loads without scrolling, and made no difference when the visitor scrolled to the end.

    Here is the page with all four changes:

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Run 2291 - validation predictions</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
        td, th { padding: 4px 8px; text-align: left; }
        .thumb { width: 96px; height: 96px; object-fit: cover; }
        .bad { background: #fdecea; }
      </style>
    </head>
    <body>
      <h1>Run 2291: validation predictions</h1>
      <img id="cm" src="plots/confusion_matrix.png"
           width="640" height="640" alt="Confusion matrix">

      <p>
        <input id="find" type="search" placeholder="Sample id, then Enter">
        <button id="prev">Prev</button>
        <span id="pos"></span>
        <button id="next">Next</button>
      </p>

      <table>
        <thead>
          <tr><th>Crop</th><th>Label</th><th>Prediction</th><th>Confidence</th><th>Sample</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <script src="predictions.js"></script>
      <script>
        const PAGE = 100;
        const pages = Math.ceil(PREDICTIONS.length / PAGE);
        const body = document.getElementById('rows');
        const pos = document.getElementById('pos');
        let page = 0;

        function td(content) {
          const cell = document.createElement('td');
          cell.append(content);
          return cell;
        }

        function show(n) {
          page = Math.max(0, Math.min(n, pages - 1));
          const frag = document.createDocumentFragment();
          for (const p of PREDICTIONS.slice(page * PAGE, (page + 1) * PAGE)) {
            const img = new Image(96, 96);
            img.className = 'thumb';
            img.alt = '';
            img.loading = 'lazy';
            img.src = `crops/${p.id}.jpg`;

            const tr = document.createElement('tr');
            if (p.pred !== p.label) tr.className = 'bad';
            tr.append(
              td(img),
              td(p.label),
              td(p.pred),
              td((p.conf * 100).toFixed(1) + '%'),
              td('#' + p.id)
            );
            frag.appendChild(tr);
          }
          body.replaceChildren(frag);
          pos.textContent = `Page ${page + 1} of ${pages}`;
        }

        document.getElementById('prev').onclick = () => show(page - 1);
        document.getElementById('next').onclick = () => show(page + 1);
        document.getElementById('find').onchange = (e) => {
          const i = PREDICTIONS.findIndex(p => String(p.id) === e.target.value.trim().replace(/^#/, ''));
          if (i >= 0) show(Math.floor(i / PAGE));
        };

        show(0);
      </script>
    </body>
    </html>
    ```

    Behavior differences: only 100 samples are in the page at a time, and the id search jumps to the right page. Labels are now set with `append()` as text instead of `innerHTML`, so a label with `<` in it can't break the page.

    **Already good:** the crops are already 96x96 files, and `width`/`height` are set on every image, so the layout doesn't jump while they load.
verify:
  static_only: HTML page with inline script, needs a browser and image files
