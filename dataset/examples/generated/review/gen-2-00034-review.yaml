- role: assistant
  content: |
    **Workload:** data pipeline (nightly batch ETL)

    #### [Bug] Crash on an empty export
    - **Where:** `write_report`, `fieldnames=list(orders[0].keys())`
    - **Issue:** if a night has no orders, or all of them are test or cancelled, `orders` is empty and `orders[0]` raises `IndexError`. The job fails instead of writing an empty report.
    - **Fix:** use `fieldnames=EXPORT_FIELDS`. The constant is already defined and has the same column order. An empty export then gives a report with only the header.

    #### [High] Front insertion for every row
    - **Where:** `orders.insert(0, {...})` in `load_orders`
    - **Issue:** each `insert(0, ...)` shifts every element already in the list one slot to the right. The loop gets slower with every row, and the total work is O(n²) in the number of orders. On a large export, most of the time goes into moving pointers, not parsing.
    - **Fix:** `append` in the loop and call `orders.reverse()` once at the end. The output is the same newest-first order, and the total work is O(n). A `collections.deque` with `appendleft` would also work, but callers get a list here, so append plus reverse is simpler.
    - **Impact:** E (CPU), and it grows quadratically with export size. In Green Metrics Tool micro-benchmarks, 1,000,000 × `list.insert(0, x)` used ~1515 J, while 1,000,000 × `list.append(x)` used ~1.2 J. That is more than a 1000× difference.

    ```python
    import csv
    import gzip
    from datetime import datetime

    EXPORT_FIELDS = ["order_id", "created_at", "amount", "currency", "country"]


    def load_orders(path):
        """Read the nightly shop export (oldest order first) and return newest first."""
        orders = []
        with gzip.open(path, "rt", encoding="utf-8", newline="") as f:
            for raw in csv.DictReader(f):
                if raw["status"] in ("test", "cancelled"):
                    continue
                orders.append({
                    "order_id": int(raw["order_id"]),
                    "created_at": datetime.fromisoformat(raw["created_at"]),
                    "amount": int(raw["amount_cents"]) / 100,
                    "currency": raw["currency"],
                    "country": raw["country"].strip().upper(),
                })
        orders.reverse()  # export is oldest first, report wants newest first
        return orders


    def write_report(orders, out_path):
        with open(out_path, "w", encoding="utf-8", newline="") as f:
            writer = csv.DictWriter(f, fieldnames=EXPORT_FIELDS)
            writer.writeheader()
            for o in orders:
                writer.writerow({**o, "created_at": o["created_at"].isoformat()})


    def run(export_path, out_path):
        orders = load_orders(export_path)
        write_report(orders, out_path)
        print(f"wrote {len(orders)} orders to {out_path}")
    ```

    **Already good:** the gzip export is read as a stream, and both CSV files are opened with `newline=""`.
