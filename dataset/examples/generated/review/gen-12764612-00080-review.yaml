- role: assistant
  content: |
    **Workload:** script (static report page)

    #### [Medium] The main chart is lazy-loaded
    - **Where:** `<img src="charts/overview.png" ... loading="lazy">`
    - **Issue:** this is the first thing everybody sees. With `loading="lazy"` the browser waits until layout is done before it starts the download, so the top chart appears later. That is probably the slowness you notice. Lazy loading is only for images below the first screen.
    - **Fix:** remove `loading="lazy"` from this image. You can add `fetchpriority="high"` to start it first.
    - **Impact:** M and perceived speed. No energy is saved on this image, because it is always used.

    #### [Medium] The 12 server charts all load at once
    - **Where:** the `<div class="grid">` images
    - **Issue:** they are far below the first screen, but the browser downloads and decodes all of them on every visit. If someone only checks the top chart and closes the page, that work was wasted.
    - **Fix:** add `loading="lazy"` to each of them. You already have `width` and `height`, so the page will not jump while they load.
    - **Impact:** reduces network and client E, but only when people do not scroll to the end. In Green Metrics Tool micro-benchmarks, an article with 15 photos used about 12% less CPU energy on page loads without scrolling. When the visitor scrolled to the end, there was no difference.

    ```html
    <section class="overview">
      <h2>All servers</h2>
      <img src="charts/overview.png" alt="Log lines per hour, all servers"
           fetchpriority="high" width="1200" height="500">
    </section>

    <section class="servers">
      <h2>Per server</h2>
      <div class="grid">
        <figure><img src="charts/web-01.png" alt="web-01 log lines per hour" loading="lazy" width="600" height="300"><figcaption>web-01</figcaption></figure>
        <figure><img src="charts/web-02.png" alt="web-02 log lines per hour" loading="lazy" width="600" height="300"><figcaption>web-02</figcaption></figure>
        <!-- same for the other 10 charts -->
      </div>
    </section>
    ```

    **Already good:** `width` and `height` are set on every image, `alt` texts are clear, and the viewport meta tag is there.
