  test: |-
    import io
    out = io.StringIO()
    run([
        "$N0042,TH-100,650,455,3100*7F",
        "garbage",
        "$N0007,XX-999,1,2,3*00",
        "$N0042,TH-200-R2,6500,500,3000*00",
        "$N0043,TH-100,650,455,3100*7F",
    ], out)
    rows = [json.loads(l) for l in out.getvalue().splitlines()]
    assert len(rows) == 3
    assert rows[0] == {"node": "N0042", "temp_c": 25.0, "hum_pct": 45.5, "batt_mv": 3100}
    assert rows[1]["temp_c"] == 25.5
    assert isinstance(load_calibration("TH-100"), tuple)
