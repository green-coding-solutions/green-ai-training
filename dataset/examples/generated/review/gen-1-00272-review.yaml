- role: assistant
  content: |
    **Workload:** web (static report page, opened every morning)

    #### [Bug] Typo in the `loading` value
    - **Where:** `gw-ams-01.png`, `loading="lazyy"`
    - **Issue:** the browser ignores unknown values, so this image loads eagerly like the ones with no attribute.
    - **Fix:** write `loading="lazy"`.

    #### [Medium] Lazy loading on the image at the top
    - **Where:** `img/overview-all.png` in `.overview`
    - **Issue:** this image is visible as soon as the page opens. With `loading="lazy"` the browser delays it until layout is known, so the most important chart appears later, and nothing is saved because it is always loaded anyway.
    - **Fix:** remove `loading="lazy"` from it. Never lazy-load the image above the fold.
    - **Impact:** no energy gain, only a slower first view.

    #### [Medium] Panel images below the fold load eagerly
    - **Where:** `gw-fra-01`, `gw-fra-02`, `gw-ams-01`, `gw-lon-01`, `gw-lon-02` (and the other gateways in your real file)
    - **Issue:** every panel is downloaded and decoded on each page open, even when the reader only looks at the overview or the first row.
    - **Fix:** add `loading="lazy"` to the panels below the first screen. Keep the first row eager if it is visible without scrolling on your readers' screens.
    - **Impact:** reduces network and client E, only for visits that don't scroll to the panels. In Green Metrics Tool micro-benchmarks, an article with 15 photos used about 12% less CPU energy per page load without scrolling. When the visitor scrolled to the end, there was no difference. If your team always scrolls through all gateways, expect little gain.

    ```html
    <section class="overview">
      <img src="img/overview-all.png" alt="Dropped logs, all gateways" width="1200" height="400">
    </section>

    <section class="grid">
      <figure>
        <img src="img/gw-fra-01.png" alt="gw-fra-01 ingest rate" width="600" height="300">
        <figcaption>gw-fra-01</figcaption>
      </figure>
      <figure>
        <img src="img/gw-fra-02.png" alt="gw-fra-02 ingest rate" width="600" height="300">
        <figcaption>gw-fra-02</figcaption>
      </figure>
      <figure>
        <img src="img/gw-ams-01.png" alt="gw-ams-01 ingest rate" width="600" height="300" loading="lazy">
        <figcaption>gw-ams-01</figcaption>
      </figure>
      <figure>
        <img src="img/gw-ams-02.png" alt="gw-ams-02 ingest rate" width="600" height="300" loading="lazy">
        <figcaption>gw-ams-02</figcaption>
      </figure>
      <figure>
        <img src="img/gw-lon-01.png" alt="gw-lon-01 ingest rate" width="600" height="300" loading="lazy">
        <figcaption>gw-lon-01</figcaption>
      </figure>
      <figure>
        <img src="img/gw-lon-02.png" alt="gw-lon-02 ingest rate" width="600" height="300" loading="lazy">
        <figcaption>gw-lon-02</figcaption>
      </figure>
    </section>
