id: gen-1-00272-review
category: review
language: css
patterns:
- css-animations
messages:
- role: user
  content: |
    ```css
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(120deg, #0b1f3a, #1d4ed8, #0b1f3a);
      background-size: 300% 300%;
      animation: bgshift 12s ease infinite;
    }
    @keyframes bgshift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .shape {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      filter: blur(6px);
      animation: float 6s ease-in-out infinite;
      will-change: top, left;
    }
    .shape.s1 { top: 10%; left: 5%; }
    .shape.s2 { top: 55%; left: 80%; animation-delay: -2s; }
    @keyframes float {
      0%, 100% { margin-top: 0;    margin-left: 0; }
      50%      { margin-top: 24px; margin-left: 16px; }
    }

    .logos { overflow: hidden; }
    .logos-track {
      display: flex;
      width: max-content;
      animation: scroll 30s linear infinite;
    }
    @keyframes scroll {
      from { margin-left: 0; }
      to   { margin-left: -50%; }
    }

    .cta { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); }
      70%  { box-shadow: 0 0 0 18px rgba(37, 99, 235, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    .card {
      opacity: 0;
      transform: translateY(16px);
      animation: reveal 0.5s ease-out forwards;
      will-change: transform, opacity;
    }
    @keyframes reveal {
      to { opacity: 1; transform: none; }
    }
    ```

    ?
- role: assistant
  content: |
    **Workload:** web (landing page, runs for every visitor while the tab is open)

    #### [Bug] Marquee loop distance is wrong
    - **Where:** `@keyframes scroll`
    - **Issue:** a percentage `margin-left` is relative to the width of the container, not the track. `-50%` does not match half of the track, so the loop jumps at the seam.
    - **Fix:** use `transform: translateX(-50%)`. It is relative to the element's own width. The track needs its logo list duplicated once.

    #### [Bug] No reduced-motion fallback
    - **Where:** whole file
    - **Issue:** five infinite or looping animations run for users who asked the OS for less motion. This is also wasted work on their device.
    - **Fix:** add a `prefers-reduced-motion` block (see the code below). The cards need an explicit visible state, or they stay at `opacity: 0`.

    #### [High] Marquee animates `margin-left`
    - **Where:** `.logos-track` / `@keyframes scroll`
    - **Issue:** margin changes trigger layout on every frame, forever, while the strip is on screen. `transform` can run on the compositor without layout or paint.
    - **Fix:** `translateX`, as above.
    - **Impact:** reduces E on every visit, for as long as the page is open.

    #### [High] Hero background repaints every frame
    - **Where:** `.hero` / `@keyframes bgshift`
    - **Issue:** animating `background-position` repaints the full hero area for the whole visit. The effect is subtle, but the cost is constant.
    - **Fix:** move the gradient to a wide `::before` layer and animate its `transform`. Or drop the motion and keep a static gradient.
    - **Impact:** reduces E (CPU/GPU paint work) on every visit.

    #### [High] Floating shapes animate `margin` on a blurred element
    - **Where:** `.shape` / `@keyframes float`
    - **Issue:** margin changes cause layout, and the blur filter has to be recomputed with each move. `will-change: top, left` lists properties that are not animated, so it does nothing useful.
    - **Fix:** animate `transform: translate(...)` and use `will-change: transform`. The blurred layer is then rasterized once and only moved.

    #### [Medium] Pulse animates `box-shadow` forever
    - **Where:** `.cta` / `@keyframes pulse`
    - **Issue:** `box-shadow` is repainted every frame, and `infinite` keeps it going long after the user has seen the button.
    - **Fix:** animate `transform` and `opacity` on a pseudo-element, and run it a few times only.

    #### [Medium] Permanent `will-change` on every card
    - **Where:** `.card`
    - **Issue:** each card keeps its own GPU layer after the 0.5 s reveal is over. This costs memory for nothing. The running animation already gets a layer.
    - **Fix:** remove `will-change`.

    ```css
    .hero { position: relative; overflow: hidden; background: #0b1f3a; }
    .hero::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 300%;
      background: linear-gradient(90deg, #0b1f3a, #1d4ed8, #0b1f3a);
      animation: bgshift 12s ease-in-out infinite alternate;
    }
    .hero > :not(.shape) { position: relative; }
    @keyframes bgshift {
      to { transform: translateX(-66.66%); }
    }

    .shape {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      filter: blur(6px);
      animation: float 6s ease-in-out infinite;
      will-change: transform;
    }
    .shape.s1 { top: 10%; left: 5%; }
    .shape.s2 { top: 55%; left: 80%; animation-delay: -2s; }
    @keyframes float {
      50% { transform: translate(16px, 24px); }
    }

    .logos { overflow: hidden; }
    .logos-track {
      display: flex;
      width: max-content;
      animation: scroll 30s linear infinite;
    }
    @keyframes scroll {
      to { transform: translateX(-50%); }
    }

    .cta { position: relative; isolation: isolate; }
    .cta::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: #2563eb;
      pointer-events: none;
      animation: pulse 2s ease-out 3;
    }
    @keyframes pulse {
      from { transform: scale(1);    opacity: 0.6; }
      to   { transform: scale(1.35); opacity: 0; }
    }

    .card {
      opacity: 0;
      transform: translateY(16px);
      animation: reveal 0.5s ease-out forwards;
    }
    @keyframes reveal {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero::before,
      .shape,
      .logos-track,
      .cta::after { animation: none; }
      .card { animation: none; opacity: 1; transform: none; }
    }
    ```

    **Already good:** the animations are pure CSS, not JavaScript timers. `overflow: hidden` on `.hero` and `.logos` keeps the moving parts clipped.

    Check the result in the browser's Performance panel (paint and layout events per frame) before and after. For energy, compare CPU use with the page left open in a real browser, for example in a Green Metrics Tool usage scenario.
