id: gen-1-00112-review
category: review
language: javascript
patterns:
- lazy-load-images
messages:
- role: user
  content: |
    hello, can you look my code for the shop page? We sell shoes and the category page have 200 products. On phone the page is slow and use many data, customers complain. I put preload for the images so they show fast when scroll, but is still slow :( thank you

    ```javascript
    const grid = document.getElementById('product-grid');
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');

    async function loadProducts() {
      const res = await fetch('/api/products?category=shoes&limit=200');
      const products = await res.json();

      // preload images so they are ready when user scroll
      products.forEach(p => {
        const thumb = new Image();
        thumb.src = p.thumbUrl;
        const big = new Image();
        big.src = p.largeUrl;
      });

      grid.innerHTML = products.map(p => `
        <article class="card" data-id="${p.id}">
          <img src="${p.thumbUrl}" class="thumb" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">${(p.priceCents / 100).toFixed(2)} EUR</p>
          <button class="add" ${cart.includes(p.id) ? 'disabled' : ''}>Add to cart</button>
        </article>
      `).join('');

      grid.querySelectorAll('.card').forEach(card => {
        const p = products.find(x => x.id === Number(card.dataset.id));
        card.querySelector('.thumb').addEventListener('mouseenter', () => {
          card.querySelector('.thumb').src = p.largeUrl;
        });
      });
    }

    loadProducts();
    ```
- role: assistant
  content: |
    **Workload:** web frontend (e-commerce)

    #### [Security] Product data is put into `innerHTML` unescaped
    - **Where:** the template string with `p.name` (in `alt` and in `<h3>`)
    - **Issue:** a product name with `"` or `<` breaks the markup. If names can come from a supplier feed or a user, this is an XSS hole.
    - **Fix:** escape the values, or build the elements with `textContent` and `setAttribute`.

    #### [High] The preload loop downloads every image at page start
    - **Where:** `products.forEach(... new Image() ...)`
    - **Issue:** this requests 200 thumbnails and 200 large images right away, even if the user never scrolls. The browser cannot defer them. This is why the page is slow and uses so much data on the phone. It also competes with the images the user sees first.
    - **Fix:** delete the loop. Use `loading="lazy"` on the thumbnails, so the browser fetches them shortly before they scroll into view. Keep the first row eager, because it is visible at load and lazy loading would only delay it.
    - **Pattern:** https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
    - **Impact:** reduces network transfer and device energy on every visit. The saving is largest for visitors who leave after the first screens.

    #### [Medium] Large images are loaded for all products, but only used on hover
    - **Where:** `big.src = p.largeUrl` in the loop
    - **Issue:** most visitors hover over a few products at most. On touch phones there is no hover at all, so those 200 large files are never used.
    - **Fix:** set the large URL only on the first `mouseenter`, using `{ once: true }`.

    #### [Low] Missing `width` and `height` on the images
    - **Where:** `<img class="thumb">`
    - **Issue:** lazy images without a size make the layout jump when they load. This causes extra layout work.
    - **Fix:** set the size attributes (or CSS `aspect-ratio`).

    #### [Low] `products.find` inside the loop
    - **Where:** the `forEach` over `.card`
    - **Issue:** one linear search per card (O(n²) in total). It is small for 200 items, but it is not needed. With a single delegated listener it disappears.

    ```javascript
    const grid = document.getElementById('product-grid');
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');

    const esc = s => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    async function loadProducts() {
      const res = await fetch('/api/products?category=shoes&limit=200');
      const products = await res.json();
      const byId = new Map(products.map(p => [p.id, p]));

      grid.innerHTML = products.map((p, i) => `
        <article class="card" data-id="${p.id}">
          <img src="${esc(p.thumbUrl)}" class="thumb" width="320" height="320"
               alt="${esc(p.name)}" decoding="async"
               ${i < 4 ? 'fetchpriority="high"' : 'loading="lazy"'}>
          <h3>${esc(p.name)}</h3>
          <p class="price">${(p.priceCents / 100).toFixed(2)} EUR</p>
          <button class="add" ${cart.includes(p.id) ? 'disabled' : ''}>Add to cart</button>
        </article>
      `).join('');

      // one listener for the whole grid; large image only on first hover
      grid.addEventListener('mouseover', e => {
        const img = e.target.closest('.thumb');
        if (!img || img.dataset.zoomed) return;
        const p = byId.get(Number(img.closest('.card').dataset.id));
        img.dataset.zoomed = '1';
        img.src = p.largeUrl;
      });
    }

    loadProducts();
    ```

    I did not change the `limit=200` request. If the category page keeps growing, pagination or a "Show more" button is the next step. It would also reduce the data from the API and the number of DOM nodes.

    **Already good:** the cart is read from `localStorage` once, outside the loop, and the grid is filled with one `innerHTML` write.
verify:
  static_only: browser DOM code (fetch, document, localStorage)
