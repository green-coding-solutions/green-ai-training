messages:
- role: user
  content: |
    hello, I make a onboarding page for new people in our CI team. It is a static html on our internal gitlab pages. It show the pipeline overview on top and then 10 screenshots of the runner setup steps (png, ca. 200 KB each). Can you look if something is wrong? I am not sure about the images, I read something about lazy.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>CI onboarding: runner setup</title>
      <link rel="stylesheet" href="css/onboarding.css">
    </head>
    <body>
      <header>
        <h1>Runner setup for new team members</h1>
        <img src="https://gitlab.example.com/api/v4/projects/42/jobs/artifacts/main/raw/badge.svg?private_token=glpat-9fK2xQ7mLw3Zt8Rb"
             alt="last pipeline status" width="120" height="20">
      </header>

      <main>
        <img src="img/pipeline-overview.png" alt="Pipeline overview" width="1200" height="600" loading="lazy">

        <h2>Step 1: register the runner</h2>
        <img src="img/step-01-register.png" alt="Register runner" width="1000" height="560">
        <h2>Step 2: choose the executor</h2>
        <img src="img/step-02-executor.png" alt="Executor choice" width="1000" height="560">
        <h2>Step 3: set the tags</h2>
        <img src="img/step-03-tags.png" alt="Runner tags" width="1000" height="560">
        <h2>Step 4: cache settings</h2>
        <img src="img/step-04-cache.png" alt="Cache settings" width="1000" height="560">
        <h2>Step 5: first test job</h2>
        <img src="img/step-05-first-job.png" alt="First job" width="1000" height="560">
        <h2>Step 6: read the job log</h2>
        <img src="img/step-06-log.png" alt="Job log" width="1000" height="560">
        <h2>Step 7: retry a failed job</h2>
        <img src="img/step-07-retry.png" alt="Retry button" width="1000" height="560">
        <h2>Step 8: protected branches</h2>
        <img src="img/step-08-protected.png" alt="Protected branches" width="1000" height="560">
        <h2>Step 9: variables</h2>
        <img src="img/step-09-variables.png" alt="CI variables" width="1000" height="560">
        <h2>Step 10: done</h2>
        <img src="img/step-10-done.png" alt="Runner online" width="1000" height="560">
