- role: assistant
  content: |
    **Workload:** web (static internal page)

    #### [Security] Private token in the badge URL
    - **Where:** the badge `<img>` in `<header>`
    - **Issue:** `private_token=glpat-...` is in the page source. Everyone who opens the page can copy it and use it against the GitLab API. It also ends up in browser history and server logs.
    - **Fix:** revoke this token now. Use a public badge, or copy the badge SVG into the pages build and serve it as a local file. Do not put a token in any URL.

    #### [Medium] Lazy loading on the image above the fold
    - **Where:** `img/pipeline-overview.png`
    - **Issue:** this is the first big image the reader sees. With `loading="lazy"` the browser waits for layout before it fetches it, so the main image shows up later and the page jumps. Lazy loading should never be on the image above the fold.
    - **Fix:** remove the attribute. Keep the size attributes you already have.
    - **Impact:** no energy gain, only a slower first view.

    ```html
    <img src="img/pipeline-overview.png" alt="Pipeline overview" width="1200" height="600">
    ```

    #### [Low] Screenshots below the fold load all at once
    - **Where:** steps 1-10
    - **Issue:** all 10 PNGs are fetched when the page opens, even if the reader leaves after step 2. Lazy loading only saves when readers do not scroll to the images. In Green Metrics Tool micro-benchmarks, an article with 15 photos (about 2 MB) loaded 20 times without scrolling used about 12% less CPU energy with `loading="lazy"` below the fold. When the page was scrolled to the end, there was no difference. Readers of an onboarding guide often go through every step, so expect a modest gain here, mainly fewer bytes for people who stop early.
    - **Fix:** add `loading="lazy"` to the step images. Step 1 can stay as it is, because it is close to the top. Your `width` and `height` attributes are already there, so the layout will not jump.

    ```html
    <img src="img/step-02-executor.png" alt="Executor choice" width="1000" height="560" loading="lazy">
    ```

    Do the same for steps 3 to 10.
    - **Impact:** network and client work, small and depends on how far people scroll.

    **Already good:** `width`/`height` on every image, `alt` texts, `lang` on `<html>`.
verify:
  static_only: static HTML page, no executable code
