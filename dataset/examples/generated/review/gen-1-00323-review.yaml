id: gen-1-00323-review
category: review
language: yaml
patterns:
- minimize-environments
messages:
- role: user
  content: |
    Preview deploys for our embedding service (k8s, GPU pool). Review, diff only please.

    ```yaml
    name: preview
    on:
      pull_request_target:
        types: [opened, synchronize, reopened]

    jobs:
      deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              ref: ${{ github.event.pull_request.head.sha }}
          - uses: azure/setup-helm@v4
          - name: Build and push
            run: |
              echo "${{ secrets.REGISTRY_TOKEN }}" | docker login registry.example.com -u ci --password-stdin
              docker build -t registry.example.com/embed-svc:pr-${{ github.event.number }} .
              docker push registry.example.com/embed-svc:pr-${{ github.event.number }}
          - name: Deploy preview
            run: |
              echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig
              export KUBECONFIG=$PWD/kubeconfig
              helm upgrade --install embed-pr-${{ github.event.number }} ./chart \
                --namespace preview-${{ github.event.number }} --create-namespace \
                --set image.tag=pr-${{ github.event.number }} \
                --set replicaCount=2 \
                --set gpu.count=1 \
                --set model.name=bge-large
    ```
- role: assistant
  content: |
    **Workload:** CI/CD for an ML inference service

    #### [Security] Untrusted PR code runs with secrets
    - **Where:** `pull_request_target` plus `checkout` of the PR head SHA
    - **Issue:** `pull_request_target` runs with repo secrets. You then build the PR's Dockerfile, so a fork PR can read `REGISTRY_TOKEN` and `KUBECONFIG_B64`.
    - **Fix:** use `pull_request` and deploy only for same-repo PRs.

    #### [High] Preview is never torn down
    - **Where:** `on.types` has no `closed`, and there is no cleanup job
    - **Issue:** every PR leaves a namespace with two replicas and a GPU behind after merge or close. Idle GPU reservations are the costliest kind of leftover.
    - **Fix:** run a teardown job on `closed` that deletes the namespace.
    - **Pattern:** Minimize deployed environments
    - **Impact:** reduces E and M. Reserved accelerators go back to the pool when the PR ends.

    #### [High] Previews are sized like production
    - **Where:** `replicaCount=2`, `gpu.count=1`
    - **Issue:** most PRs touch config, docs or API glue. They don't need a redundant pair of replicas or a GPU.
    - **Fix:** one replica, no GPU by default. Opt in to a GPU with a `needs-gpu` label. This assumes the chart handles `gpu.count=0`. Inference on CPU is slower, so check that your preview smoke tests still pass.
    - **Impact:** reduces E and M per open PR.

    #### [Medium] Every push redeploys, and runs can overlap
    - **Where:** no `concurrency`
    - **Issue:** quick pushes start parallel builds and deploys for the same PR. Only the last one matters.
    - **Fix:** one concurrency group per PR with `cancel-in-progress`. This also cancels a running deploy when the PR is closed.

    ```diff
     name: preview
     on:
    -  pull_request_target:
    -    types: [opened, synchronize, reopened]
    +  pull_request:
    +    types: [opened, synchronize, reopened, labeled, closed]
    +
    +concurrency:
    +  group: preview-${{ github.event.number }}
    +  cancel-in-progress: true

     jobs:
       deploy:
    +    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
         runs-on: ubuntu-latest
         steps:
           - uses: actions/checkout@v4
    -        with:
    -          ref: ${{ github.event.pull_request.head.sha }}
           - uses: azure/setup-helm@v4
           - name: Build and push
             run: |
               echo "${{ secrets.REGISTRY_TOKEN }}" | docker login registry.example.com -u ci --password-stdin
               docker build -t registry.example.com/embed-svc:pr-${{ github.event.number }} .
               docker push registry.example.com/embed-svc:pr-${{ github.event.number }}
           - name: Deploy preview
             run: |
               echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig
               export KUBECONFIG=$PWD/kubeconfig
               helm upgrade --install embed-pr-${{ github.event.number }} ./chart \
                 --namespace preview-${{ github.event.number }} --create-namespace \
                 --set image.tag=pr-${{ github.event.number }} \
    -            --set replicaCount=2 \
    -            --set gpu.count=1 \
    +            --set replicaCount=1 \
    +            --set gpu.count=${{ contains(github.event.pull_request.labels.*.name, 'needs-gpu') && 1 || 0 }} \
                 --set model.name=bge-large
    +
    +  teardown:
    +    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    +    runs-on: ubuntu-latest
    +    steps:
    +      - name: Delete preview namespace
    +        run: |
    +          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig
    +          export KUBECONFIG=$PWD/kubeconfig
    +          kubectl delete namespace preview-${{ github.event.number }} --ignore-not-found
    ```

    As a safety net for failed teardowns, a nightly job that deletes `preview-*` namespaces older than a few days is cheap to add.
verify:
  static_only: GitHub Actions workflow, needs a cluster, registry and secrets
