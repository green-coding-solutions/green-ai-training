- role: user
  content: |
    review pls, diff only. thermal cam dumps (raw float32, ~20M readings per file) -> 8 bit for the viewer. we run it over a few hundred files every night, one process per file

    ```python
    #!/usr/bin/env python3
    """Convert raw float32 thermal dumps to 8-bit levels."""
    import argparse
    import sys

    import numpy as np


    def quantize(values, lo, hi):
        out = bytearray(len(values))
        span = hi - lo
        for i in range(len(values)):
            v = values[i]
            if v < lo:
                v = lo
            elif v > hi:
                v = hi
            out[i] = int((v - lo) / span * 255)
        return out


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("src")
        ap.add_argument("dst")
        ap.add_argument("--lo", type=float, default=-20.0)
        ap.add_argument("--hi", type=float, default=120.0)
        args = ap.parse_args()

        data = np.fromfile(args.src, dtype=np.float32)
        if data.size == 0:
            print("empty input", file=sys.stderr)
            return 1
        levels = quantize(data, args.lo, args.hi)
        with open(args.dst, "wb") as f:
            f.write(levels)
        print(f"{args.src}: {data.size} samples")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
    ```
- role: assistant
  content: |
    **Workload:** script (nightly batch, hundreds of files with ~20M readings each)

    #### [Bug] Crash on NaN and on `--lo` equal to `--hi`
    - **Where:** `quantize`, the `int(...)` line and `span`
    - **Issue:** a NaN reading passes both range checks, then `int(nan)` raises `ValueError` and kills the file. `--lo == --hi` gives `ZeroDivisionError`. Dead-pixel NaNs are common in thermal dumps.
    - **Fix:** reject `hi <= lo` up front. Map NaN to level 0 explicitly. This is a behavior change: the old code crashed. The explicit check matters for the JIT version too, because a NaN cast to an integer inside compiled code gives an undefined value instead of an error.

    #### [High] Per-sample Python loop over a 20M-element array
    - **Where:** `quantize`
    - **Issue:** every reading goes through the interpreter: an indexing call, two comparisons, a division and an `int()`. That is ~20M iterations per file. This is a CPU-bound numeric loop that runs for hours in total each night, so it is worth compiling. In Green Metrics Tool micro-benchmarks quantizing 10,000,000 samples, a pure Python loop used ~40 J and the same loop with Numba `@njit` ~9.5 J, about 4× less CPU energy. File reading and writing are not part of that figure.
    - **Fix:**
      ```python
      import numpy as np
      from numba import njit


      @njit(cache=True)
      def quantize(values, lo, hi):
          out = np.empty(values.shape[0], dtype=np.uint8)
          span = hi - lo
          for i in range(values.shape[0]):
              v = values[i]
              if v != v:  # NaN
                  out[i] = 0
                  continue
              if v < lo:
                  v = lo
              elif v > hi:
                  v = hi
              out[i] = np.uint8((v - lo) / span * 255)
          return out
      ```
      ```python
      args = ap.parse_args()
      if args.hi <= args.lo:
          ap.error("--hi must be greater than --lo")

      data = np.fromfile(args.src, dtype=np.float32)
      if data.size == 0:
          print("empty input", file=sys.stderr)
          return 1
      levels = quantize(data, args.lo, args.hi)
      levels.tofile(args.dst)
      ```
    - **Impact:** E, per file and every night. Two things to know:
      - You start a fresh process per file. `cache=True` stores the compiled code on disk, so only the first run pays the compile cost.
      - The `bytearray` and `f.write` are gone, so there is no extra copy of the output.

    **Already good:** `np.fromfile` reads the whole dump in one call, and the empty-input check returns a clear error.
