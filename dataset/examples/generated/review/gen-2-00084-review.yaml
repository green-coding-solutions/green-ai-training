    ```python
    import os
    from pathlib import Path

    import requests
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel

    app = FastAPI()

    LABELS = Path(os.environ.get("LABELS_FILE", "labels.txt")).read_text().splitlines()

    MODEL_URLS = {
        "resnet50": os.environ["RESNET_URL"],
        "effnet_b3": os.environ["EFFNET_URL"],
        "vit_b16": os.environ["VIT_URL"],
        "convnext_t": os.environ["CONVNEXT_URL"],
    }


    class PredictRequest(BaseModel):
        image_b64: str
        top_k: int = 3


    def _query(name, url, payload):
        r = requests.post(f"{url}/v2/models/{name}/infer", json=payload)
        r.raise_for_status()
        return r.json()["probs"]


    @app.post("/predict")
    async def predict(req: PredictRequest):
        payload = {"image": req.image_b64}
        all_probs = []
        for name, url in MODEL_URLS.items():
            try:
                all_probs.append(_query(name, url, payload))
            except requests.RequestException:
                continue  # model down, ensemble with the rest

        if not all_probs:
            raise HTTPException(status_code=503, detail="no model available")

        n_classes = len(all_probs[0])
        avg = [sum(p[i] for p in all_probs) / len(MODEL_URLS) for i in range(n_classes)]
        top = sorted(range(n_classes), key=lambda i: avg[i], reverse=True)[: req.top_k]
        return {"labels": [LABELS[i] for i in top], "scores": [avg[i] for i in top]}
    ```

