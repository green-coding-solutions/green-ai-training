      --border: #d5d8dc;
    }

    body { font: 14px/1.45 system-ui, sans-serif; color: var(--fg); margin: 2rem auto; max-width: 70rem; }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    .run-meta { color: var(--muted); font-size: .85rem; }
    .run-meta code { font-size: .8rem; }

    table.cases { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
    table.cases th, table.cases td { border-bottom: 1px solid var(--border); padding: .35rem .6rem; }
    table.cases td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .status-converged { color: var(--ok); }
    .status-stalled { color: var(--warn); }
    .status-diverged { color: var(--fail); font-weight: 600; }

    figure.residuals img { width: 100%; height: auto; }
    figure.residuals figcaption { color: var(--muted); font-size: .8rem; }

    @media print {
      body { max-width: none; margin: 0; }
    }
    ```

    **Already good:** small, flat selectors and one hand-written stylesheet with no framework behind it.
