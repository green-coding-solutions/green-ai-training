    .bk-toolbar:hover { opacity: 1; }
    .bk-tooltip { background: #fff; border: 1px solid var(--border); padding: 4px 6px; }
    .plot-tabs { display: flex; gap: .5rem; border-bottom: 1px solid var(--border); }
    .plot-tabs button { background: none; border: 0; padding: .4rem .8rem; cursor: pointer; }
