- role: assistant
  content: |
    **Workload:** script (generated HTML report)

    #### [Bug] `--fail` is not a valid colour
    - **Where:** `:root`, `--fail: #c0392;`
    - **Issue:** the value has five hex digits. A custom property accepts any value, so the browser only finds the error when `.status-diverged` uses it. At that point `color` falls back to the inherited text colour. Diverged cases come out bold but not red, and that is the one status you most want to spot.
    - **Fix:** `--fail: #c0392b;`

    #### [Low] Dead rules from the old interactive viewer
    - **Where:** `.bk-toolbar`, `.bk-tooltip`, `.plot-tabs`, `.mesh-viewer`, and their entries in `@media print`
    - **Issue:** the template shows a static PNG and a table. None of these classes appear in it. The CSS is inlined, so every run report stores its own copy of these rules. They make up roughly a third of the file.
    - **Fix:** delete them by hand. A file this small doesn't need PurgeCSS in the build.
    - **Impact:** fewer bytes per report and a stylesheet that is easier to read. It saves bytes, not CPU. In Green Metrics Tool measurements, 50 cold page loads with a 16 KB stylesheet of mostly unused rules, compared with the same page purged and minified to 0.75 KB, differed by about 2%. That is within measurement noise.

    ```css
