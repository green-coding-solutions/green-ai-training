id: gen-1-00356-review
category: review
language: html
patterns:
- css-animations
- system-fonts-and-deps
facts:
- F-ANIM
messages:
- role: user
  content: |
    Hello, my CLI tool "nightbackup" write one html report after every run, and we open it on the big monitor in the office, it stay open all day. I made the template with live look. Can you check it and tell me what is wrong? Sorry for my english.

    ```html
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="utf-8">
    <title>Backup report</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body { font-family: 'Roboto', sans-serif; background: #111; color: #eee; margin: 2rem; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #2ecc71; display: inline-block; }
      #sync { width: 18px; height: 18px; border: 3px solid #666; border-top-color: #fff;
              border-radius: 50%; display: inline-block; vertical-align: middle; }
      table { border-collapse: collapse; margin-top: 1rem; font-family: 'Roboto Mono', monospace; }
      td { padding: 4px 16px; border-bottom: 1px solid #333; }
      td.ok { color: #2ecc71; }
      td.fail { color: #e74c3c; }
    </style>
    </head>
    <body>
    <h1><span class="dot" id="live"></span> Backup status</h1>
    <span id="sync"></span> <span id="updated"></span>
    <table id="jobs"></table>

    <script>
    var jobs = {{JOBS_JSON}};   // replaced by the CLI

    var rows = '';
    $.each(jobs, function (i, j) {
      rows += '<tr><td>' + j.name + '</td><td class="' + (j.ok ? 'ok' : 'fail') + '">' +
              j.status + '</td><td>' + j.finished + '</td></tr>';
    });
    $('#jobs').html(rows);

    var visible = true;
    setInterval(function () {
      visible = !visible;
      $('#live').css('opacity', visible ? 1 : 0.2);
    }, 500);

    var angle = 0;
    function spin() {
      angle = (angle + 3) % 360;
      document.getElementById('sync').style.transform = 'rotate(' + angle + 'deg)';
      requestAnimationFrame(spin);
    }
    spin();

    setInterval(function () {
      $('#updated').text('Updated ' + new Date().toLocaleTimeString()).fadeOut(200).fadeIn(200);
    }, 1000);
    </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    **Workload:** script output (static report), but the page runs all day on a monitor

    #### [Security] Unescaped values go into `innerHTML`
    - **Where:** the `rows += ...` string and `$('#jobs').html(rows)`
    - **Issue:** `j.name`, `j.status` and `j.finished` are put into HTML as raw text. A job or file name with `<` in it breaks the page or runs script. Also, make sure the CLI escapes `</script>` inside `{{JOBS_JSON}}`.
    - **Fix:** build the cells with `textContent`, as in the code below.

    #### [Bug] "Updated" shows the wrong time
    - **Where:** last `setInterval`
    - **Issue:** it prints the current clock of the monitor, not the time of the backup run. The page is static, so after two days it still says "Updated 10:41". People will think the data is fresh when it is not.
    - **Fix:** let the CLI write the generation time into the page (`{{GENERATED_AT}}`).

    #### [High] Three JavaScript animation loops that run all day
    - **Where:** `spin()` with `requestAnimationFrame`, the blinking `setInterval`, the `fadeOut/fadeIn` every second
    - **Issue:** the page never changes after it is written, but the browser must run script and update styles all day, forever. The spinner is also misleading, because nothing is syncing. Nobody needs the fade of the "Updated" text.
    - **Fix:** remove the spinner and the fade. Do the blinking dot with a CSS `@keyframes` animation on `opacity`, so the browser handles it without your script. Add `prefers-reduced-motion` so it can be switched off.
    - **Impact:** reduces E on the client for as long as the page is open. In Green Metrics Tool browser benchmarks (20-second animation), a `requestAnimationFrame` loop with style updates used about 161 J CPU energy and CSS `@keyframes` about 145 J, roughly 10% less ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=4a2085fd-6f43-4f26-a3ee-2a6fcd7db594,58ee50a2-7110-4418-beea-df6ffba5425a)). Removing an animation fully saves more than moving it to CSS.

    #### [Medium] jQuery and Google Fonts for a simple table
    - **Where:** the `<link>` to fonts.googleapis.com and the jQuery `<script>`
    - **Issue:** two third-party requests plus font files, only to fill a table and set a font. jQuery is used here for `$.each`, `.html`, `.css`, `.text` and fades, and plain JavaScript does all of it. If the monitor PC has no internet, the page also loads without styles or without the table.
    - **Fix:** use plain DOM code and a system font stack. The page then works offline and has no requests at all.
    - **Impact:** reduces network transfer and parsing on every open of the report.

    Fixed template:

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>Backup report</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #111; color: #eee; margin: 2rem; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #2ecc71; display: inline-block;
             animation: blink 1s infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
      table { border-collapse: collapse; margin-top: 1rem; font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
      td { padding: 4px 16px; border-bottom: 1px solid #333; }
      td.ok { color: #2ecc71; }
      td.fail { color: #e74c3c; }
    </style>
    </head>
    <body>
    <h1><span class="dot"></span> Backup status</h1>
    <p>Report written {{GENERATED_AT}}</p>
    <table id="jobs"></table>

    <script>
    const jobs = {{JOBS_JSON}};   // replaced by the CLI, escape "</" in the JSON

    const table = document.getElementById('jobs');
    for (const j of jobs) {
      const tr = table.insertRow();
      tr.insertCell().textContent = j.name;
      const status = tr.insertCell();
      status.textContent = j.status;
      status.className = j.ok ? 'ok' : 'fail';
      tr.insertCell().textContent = j.finished;
    }
    </script>
    </body>
    </html>
    ```

    If the CLI can write the `<tr>` rows itself (with HTML escaping), you can drop the script completely.

    **Already good:** small single file, no images, no build step.
verify:
  static_only: HTML template with a placeholder filled by a CLI and browser-only behavior; no Python or Node test is possible
