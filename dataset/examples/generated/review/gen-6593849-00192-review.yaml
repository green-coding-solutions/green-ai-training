- role: assistant
  content: |
    **Workload:** web (page served from an embedded gateway)

    #### [Security] Camera credentials in the page source
    - **Where:** `.hero img`
    - **Issue:** `viewer:coldroom7@10.0.4.21` is sent to every visitor, and anyone who opens the page source can read the login and the camera's internal address. Many modern browsers also refuse to load subresources with credentials in the URL, so the hero image may not show at all.
    - **Fix:** let the gateway fetch the snapshot with the credentials stored server-side, and expose it like the other cameras. Rotate the exposed password.

    ```html
    <img src="/snap/door.jpg" width="640" height="360" alt="Loading dock door">
    ```

    #### [Medium] All 12 camera snapshots load eagerly
    - **Where:** `.grid img`
    - **Issue:** every snapshot is requested on page load, even for cameras far below the fold that the operator never scrolls to. Each skipped image is also one request the gateway does not have to serve.
    - **Fix:** add `loading="lazy"` to the images below the fold. Give them `width` and `height` so the grid does not jump when they arrive. Keep the hero and the first row of the grid eager, because they are on screen at load, especially on large monitors.
    - **Impact:** reduces E and network on the client and on the gateway, but only for visits that don't scroll. In Green Metrics Tool micro-benchmarks, an article with 15 photos loaded 20 times without scrolling used about 12% less CPU energy with lazy loading. When the visitor scrolled to the end, there was no difference.

    ```html
    <section class="grid">
      <figure><img src="/snap/cam01.jpg" width="320" height="180" alt="Cam 01"><figcaption>Cam 01</figcaption></figure>
      <figure><img src="/snap/cam02.jpg" width="320" height="180" alt="Cam 02"><figcaption>Cam 02</figcaption></figure>
      <figure><img src="/snap/cam03.jpg" width="320" height="180" alt="Cam 03"><figcaption>Cam 03</figcaption></figure>
      <figure><img src="/snap/cam04.jpg" width="320" height="180" alt="Cam 04"><figcaption>Cam 04</figcaption></figure>
      <figure><img src="/snap/cam05.jpg" width="320" height="180" loading="lazy" alt="Cam 05"><figcaption>Cam 05</figcaption></figure>
      <figure><img src="/snap/cam06.jpg" width="320" height="180" loading="lazy" alt="Cam 06"><figcaption>Cam 06</figcaption></figure>
      <!-- cam07 to cam12: same, with loading="lazy" -->
    </section>
    ```

    **Already good:** the hero image has no `loading="lazy"`, and the thumbnails come from the gateway itself, so no extra origins are involved.
