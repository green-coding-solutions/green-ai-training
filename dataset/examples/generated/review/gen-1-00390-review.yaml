id: gen-1-00390-review
category: review
language: python
patterns:
- vectorize-or-jit
- memoize
facts:
- F-LRU
messages:
- role: user
  content: |
    Can you review this? It's the post-processing for our cryostat sweeps. After every sweep we compute the mean Debye heat capacity of a copper sample from the logged sample temperatures.

    Requirements:
    - A sweep has up to ~2 million readings. The sensor reports in 0.25 K steps between 20 K and 320 K.
    - It runs after every sweep, several times per day, on a shared analysis server.
    - Numbers must stay the same as before (same trapezoid rule, same number of steps). Differences at floating-point rounding level are fine.
    - numpy is available, no other new dependencies.

    ```python
    import math

    R = 8.314462618      # J/(mol K)
    THETA_D = 343.0      # Debye temperature of Cu, K
    N_STEPS = 2000


    def integrand(x):
        if x == 0.0:
            return 0.0
        ex = math.exp(x)
        return x ** 4 * ex / (ex - 1.0) ** 2


    def debye_cv(T):
        """Molar heat capacity in J/(mol K), Debye model, trapezoid rule."""
        if T <= 0:
            raise ValueError("T must be positive")
        xd = THETA_D / T
        h = xd / N_STEPS
        total = 0.5 * (integrand(0.0) + integrand(xd))
        for i in range(1, N_STEPS):
            total += integrand(i * h)
        return 9.0 * R * (T / THETA_D) ** 3 * total * h


    def mean_cv(readings):
        values = []
        for T in readings:
            values.append(debye_cv(T))
        return sum(values) / len(values)
    ```
- role: assistant
  content: |
    **Workload:** scientific computing / batch job (several runs per day)

    #### [High] The same integral is recomputed for every reading
    - **Where:** `mean_cv`, calling `debye_cv(T)` for each reading
    - **Issue:** `debye_cv` is a pure function of `T`. The sensor only reports 0.25 K steps between 20 K and 320 K, so there are about 1,200 distinct temperatures, but you run the integral 2 million times. Almost every call repeats an earlier result.
    - **Fix:** compute once per distinct temperature, then map the results back to the readings. `np.unique(..., return_inverse=True)` does this in one step. Memoizing per value is the same idea. In Green Metrics Tool micro-benchmarks, `functools.lru_cache` used about 9× less CPU energy for 1,000,000 repeated computations drawn from 200 distinct inputs. The gain depends on how often inputs repeat. Here inputs repeat far more often than in that benchmark.
    - **Impact:** E, directly proportional to the repeat factor. This is the biggest win.

    #### [High] Python loop with a function call per integration step
    - **Where:** the `for i in range(1, N_STEPS)` loop calling `integrand(i * h)`
    - **Issue:** each integral costs 2,000 Python function calls, each with a `math.exp` and a few float operations. At 2 million readings that is about 4 billion calls per sweep, all interpreter overhead.
    - **Fix:** evaluate the integrand for all steps and all distinct temperatures as one NumPy array, then sum along the step axis. The trapezoid rule, the nodes and `N_STEPS` stay the same.
    - **Impact:** E, high. The same arithmetic runs in compiled loops instead of the interpreter.

    #### [Bug] Empty input
    - **Where:** `sum(values) / len(values)`
    - **Issue:** an aborted sweep with no readings raises `ZeroDivisionError`, which hides the real cause.
    - **Fix:** raise a clear `ValueError("no readings")`.

    #### [Low] Intermediate list
    - **Where:** `values = []` and `append`
    - **Issue:** a 2-million-element list of floats is built only to be summed. The version below removes it.

    ```python
    import numpy as np

    R = 8.314462618      # J/(mol K)
    THETA_D = 343.0      # Debye temperature of Cu, K
    N_STEPS = 2000


    def debye_cv_many(temps):
        """Molar heat capacity in J/(mol K) for an array of temperatures (trapezoid rule)."""
        temps = np.asarray(temps, dtype=float)
        if np.any(temps <= 0):
            raise ValueError("T must be positive")
        xd = THETA_D / temps
        h = xd / N_STEPS
        x = np.arange(N_STEPS + 1) * h[:, None]      # shape (n_temps, N_STEPS + 1)
        f = np.zeros_like(x)                         # integrand(0) is 0
        xs = x[:, 1:]
        f[:, 1:] = xs ** 4 * np.exp(xs) / np.expm1(xs) ** 2
        total = 0.5 * (f[:, 0] + f[:, -1]) + f[:, 1:-1].sum(axis=1)
        return 9.0 * R * (temps / THETA_D) ** 3 * total * h


    def mean_cv(readings):
        temps = np.asarray(readings, dtype=float)
        if temps.size == 0:
            raise ValueError("no readings")
        unique, inverse = np.unique(temps, return_inverse=True)
        cv = debye_cv_many(unique)
        return float(cv[inverse].mean())
    ```

    Results match the original up to rounding. NumPy sums in a different order than the Python loop, so the last digits can differ.

    **Already good:** the pure `debye_cv` model is easy to test, and the input check for `T <= 0` is kept.

    **Not applied:** Numba or a compiled extension. Once the integral runs about 1,200 times instead of 2 million, NumPy is enough. The array has `n_distinct × 2001` floats, which is small here. If a later instrument reports with much finer resolution (hundreds of thousands of distinct values), process the unique temperatures in chunks, or the array gets large.
verify:
  equivalence:
    driver: |-
      readings = [20.0 + 0.25 * ((i * 37) % 400) for i in range(2000)]
      print(f"{mean_cv(readings):.8f}")
      try:
          mean_cv([])
      except (ValueError, ZeroDivisionError):
          print("empty rejected")
      try:
          mean_cv([10.0, -1.0])
      except ValueError:
          print("negative rejected")
