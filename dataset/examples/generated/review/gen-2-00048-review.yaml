    nightly cdc snapshot job got super slow since the export passed ~3M rows. review?

    ```python
    import csv
    import json
    from datetime import datetime


    def load_changes(path):
        """Read the CDC export (oldest first) and return change records newest first."""
        changes = []
        with open(path, newline="") as f:
            for row in csv.DictReader(f):
                rec = {
                    "id": int(row["id"]),
                    "op": row["op"],
                    "ts": datetime.fromisoformat(row["ts"]),
                    "payload": json.loads(row["payload"]) if row["payload"] else {},
                }
                changes.insert(0, rec)
        return changes


    def latest_state(changes):
        """Keep the newest change per id, drop ids whose newest change is a delete.
        Result is ordered oldest to newest."""
        seen = set()
        result = []
        for rec in changes:
            if rec["id"] in seen:
                continue
            seen.add(rec["id"])
            if rec["op"] == "D":
                continue
            result.insert(0, rec)
        return result


    def write_snapshot(records, out_path):
        with open(out_path, "w") as f:
            writer = csv.writer(f)
            writer.writerow(["id", "op", "ts", "payload"])
            for r in records:
                writer.writerow([r["id"], r["op"], r["ts"].isoformat(), json.dumps(r["payload"])])


    if __name__ == "__main__":
        import sys
        write_snapshot(latest_state(load_changes(sys.argv[1])), sys.argv[2])
    ```
- role: assistant
  content: |
    **Workload:** data pipeline

    #### [Bug] CSV output opened without `newline=""`
    - **Where:** `write_snapshot`, `open(out_path, "w")`
    - **Issue:** the `csv` module writes its own `\r\n` line endings. Without `newline=""`, Windows turns each one into `\r\r\n`, so every row is followed by a blank line.
    - **Fix:** `open(out_path, "w", newline="")`, the same way you already open the input file.

    #### [High] Front insertion shifts the whole list for every row
    - **Where:** `changes.insert(0, rec)` in `load_changes`, `result.insert(0, rec)` in `latest_state`
    - **Issue:** `insert(0, x)` moves every existing element one slot to the right. With ~3M rows, total work grows with the square of the row count. This is why the job slowed down as the export grew. In Green Metrics Tool micro-benchmarks, 1,000,000 × `list.insert(0, x)` used ~1515 J of CPU energy and 1,000,000 × `list.append(x)` ~1.2 J, over 1000× less.
    - **Fix:** append, then reverse once at the end. The output order and the return type (`list`) stay the same.
    - **Impact:** E. Each row becomes O(1) instead of O(n), and each list gets one O(n) `reverse()`. If you ever need to add items at the front one at a time, use `collections.deque.appendleft`.

    ```python
    import csv
    import json
    from datetime import datetime


    def load_changes(path):
        """Read the CDC export (oldest first) and return change records newest first."""
        changes = []
        with open(path, newline="") as f:
            for row in csv.DictReader(f):
                changes.append({
                    "id": int(row["id"]),
                    "op": row["op"],
                    "ts": datetime.fromisoformat(row["ts"]),
                    "payload": json.loads(row["payload"]) if row["payload"] else {},
                })
        changes.reverse()
        return changes


    def latest_state(changes):
        """Keep the newest change per id, drop ids whose newest change is a delete.
        Result is ordered oldest to newest."""
        seen = set()
        result = []
        for rec in changes:
            if rec["id"] in seen:
                continue
            seen.add(rec["id"])
            if rec["op"] == "D":
                continue
            result.append(rec)
        result.reverse()
        return result
    ```

    **Already good:** `csv.DictReader` streams the input file, and the `seen` set gives O(1) lookups per id.
