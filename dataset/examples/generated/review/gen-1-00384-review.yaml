messages:
- role: user
  content: |
    Can you review this Flask backend for our marketing landing page? The page calls `/api/landing` on every visit. We pick the hero text and the highlighted plan from a small PyTorch classifier that guesses the visitor segment from the search term, referrer and device. The classifier is CPU only. The traffic comes mostly from ads, so it is a lot of cold visitors.

    Requirements: the page must feel fast, the response must be smaller on slow mobile connections, and the segment pick must stay stable for the same inputs (we A/B test on it). We also serve our hero images and fonts from the same app for now.

    ```python
    import gzip
    import json
    import zlib

    import torch
    import torch.nn as nn
    from flask import Flask, Response, request

    from content import HERO, PLANS, TESTIMONIALS, FAQ

    app = Flask(__name__)

    SEGMENTS = ["student", "freelancer", "small_team", "agency", "enterprise", "unknown"]


    class SegmentNet(nn.Module):
        def __init__(self, n_in=64, n_out=6):
            super().__init__()
            self.net = nn.Sequential(
                nn.Linear(n_in, 128),
                nn.ReLU(),
                nn.Dropout(0.3),
                nn.Linear(128, n_out),
            )

        def forward(self, x):
            return self.net(x)


    model = SegmentNet()
    model.load_state_dict(torch.load("models/segment.pt", map_location="cpu"))


    def featurize(term, referrer, device):
        feats = [0.0] * 64
        for tok in (term + " " + referrer + " " + device).lower().split():
            feats[zlib.crc32(tok.encode()) % 64] += 1.0
        return feats


    @app.route("/api/landing")
    def landing():
        feats = featurize(
            request.args.get("utm_term", ""),
            request.referrer or "",
            request.args.get("device", "desktop"),
        )
        x = torch.tensor(feats).unsqueeze(0)
        logits = model(x)
        segment = SEGMENTS[int(logits.argmax(dim=1))]

        payload = {
            "segment": segment,
            "hero": HERO[segment],
            "plans": PLANS,
            "testimonials": TESTIMONIALS,
            "faq": FAQ,
        }
        return Response(json.dumps(payload, indent=2), mimetype="application/json")


    @app.after_request
    def compress(resp):
        resp.direct_passthrough = False
        data = gzip.compress(resp.get_data(), compresslevel=9)
        resp.set_data(data)
        resp.headers["Content-Encoding"] = "gzip"
        return resp
    ```
- role: assistant
  content: |
    **Workload:** web backend for a landing page (per visit, high traffic)

    #### [Bug] Model is still in training mode
    - **Where:** `model.load_state_dict(...)`, no `model.eval()`
    - **Issue:** a new `nn.Module` starts in training mode, so `Dropout(0.3)` is active on every request. The same inputs can give different segments. This breaks your A/B stability requirement.
    - **Fix:** call `model.eval()` once after loading.

    #### [Bug] Every response is gzipped, whatever the client or content
    - **Where:** `compress()`
    - **Issue:** it ignores `Accept-Encoding`, so a client that does not send gzip gets bytes it cannot read. It also compresses JPEG and font responses, which are already compressed and gain nothing. It calls `get_data()` on streamed file responses, which loads the whole file into memory. There is no `Vary: Accept-Encoding`, so a shared cache can hand a gzip body to the wrong client.
    - **Fix:** compress only when the client accepts gzip, only for text types, and skip small and already-encoded bodies.

    #### [High] Autograd runs on every request
    - **Where:** `logits = model(x)`
    - **Issue:** without `torch.inference_mode()` (or `no_grad`), PyTorch records a graph that you never use. This happens on every visit.
    - **Impact:** reduces E per request. In Green Metrics Tool micro-benchmarks, 100,000 CPU inferences used about 14% less CPU energy with `torch.no_grad()`. The saving is modest, but it costs one line.

    #### [Medium] Maximum gzip level on a dynamic response
    - **Where:** `compresslevel=9`
    - **Issue:** this JSON is built per request, so you pay the compression CPU on every visit. The top level costs noticeably more CPU than a moderate one for a small extra size reduction. Per request, the work is small, but it adds up with ad traffic.
    - **Fix:** use a moderate level. Fast codecs cost far less than strong ones. In Green Metrics Tool measurements on English text, zstd at its default level used about 4× less energy than gzip at its default level. Those figures compare energy, not output size. Gzip is the safe choice here because every browser supports it. If your reverse proxy can do zstd, you could do the compression there.
    - **Pattern:** Compress transmitted data

    #### [Low] Pretty-printed JSON
    - **Where:** `json.dumps(payload, indent=2)`
    - **Issue:** indentation adds bytes that gzip then has to handle. Compact separators reduce both payload size and compression work.

    ```python
    import gzip
    import json
    import zlib

    import torch
    import torch.nn as nn
    from flask import Flask, Response, request

    from content import HERO, PLANS, TESTIMONIALS, FAQ

    app = Flask(__name__)

    SEGMENTS = ["student", "freelancer", "small_team", "agency", "enterprise", "unknown"]
    COMPRESSIBLE = {
        "application/json", "text/html", "text/css", "text/plain",
        "application/javascript", "image/svg+xml",
    }


    class SegmentNet(nn.Module):
        def __init__(self, n_in=64, n_out=6):
            super().__init__()
            self.net = nn.Sequential(
                nn.Linear(n_in, 128),
                nn.ReLU(),
                nn.Dropout(0.3),
                nn.Linear(128, n_out),
            )

        def forward(self, x):
            return self.net(x)


    model = SegmentNet()
    model.load_state_dict(torch.load("models/segment.pt", map_location="cpu"))
    model.eval()


    def featurize(term, referrer, device):
        feats = [0.0] * 64
        for tok in (term + " " + referrer + " " + device).lower().split():
            feats[zlib.crc32(tok.encode()) % 64] += 1.0
        return feats


    @app.route("/api/landing")
    def landing():
        feats = featurize(
            request.args.get("utm_term", ""),
            request.referrer or "",
            request.args.get("device", "desktop"),
        )
        x = torch.tensor(feats).unsqueeze(0)
        with torch.inference_mode():
            segment = SEGMENTS[int(model(x).argmax(dim=1))]

        payload = {
            "segment": segment,
            "hero": HERO[segment],
            "plans": PLANS,
            "testimonials": TESTIMONIALS,
            "faq": FAQ,
        }
        return Response(json.dumps(payload, separators=(",", ":")), mimetype="application/json")


    @app.after_request
    def compress(resp):
        resp.headers.add("Vary", "Accept-Encoding")
        if (
            resp.direct_passthrough
            or resp.status_code in (204, 304)
            or "Content-Encoding" in resp.headers
            or "gzip" not in request.headers.get("Accept-Encoding", "")
            or resp.mimetype not in COMPRESSIBLE
        ):
            return resp
        data = resp.get_data()
        if len(data) < 1024:
            return resp
        resp.set_data(gzip.compress(data, compresslevel=5))
        resp.headers["Content-Encoding"] = "gzip"
        return resp
    ```

    **Already good:** the model loads once at import, not per request. Hashing with `zlib.crc32` gives stable features across processes, unlike `hash()`.

    One more thing for the hero images and fonts: compress or convert them once at build time and let a CDN or your web server serve them. Don't compress them per request in the app. A stronger codec is fine there, because the work is done once and the result is served many times.
