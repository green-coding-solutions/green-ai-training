- role: assistant
  content: |
    **Workload:** script (build step that generates data for the landing page)

    #### [Bug] Fewer stars than requested
    - **Where:** `for i in range(count)` with `if dist > 1: continue`
    - **Issue:** every rejected point still uses up one loop turn. Only about π/4 of random points in the square fall inside the circle, so `build_stars(200000)` returns clearly fewer than 200,000 stars. The unused `i` also hints that the loop was meant to count stars.
    - **Fix:** loop until you have `count` stars (see the code below). For the same seed, the first stars stay the same. The file just gets the missing ones added at the end.

    #### [Low] Attribute lookups repeated in the loop
    - **Where:** `math.sqrt`, `rng.random` and `stars.append` inside the loop
    - **Issue:** each turn looks up these names again, and `rng.random` four times. In Green Metrics Tool micro-benchmarks, binding `math.sqrt` to a local before a 10,000,000-iteration loop saved about 4-5%. This script runs once per build, so the gain is small. It costs nothing in readability, so it is fine to do it while you fix the loop.
    - **Fix:** bind `rand`, `sqrt` and `append` to locals before the loop (see the code below).
    - **Impact:** E, a few percent of the loop time at most. It only adds up if you call this for much larger counts or on every build.

    Fixed version with both changes:

    ```python
    import json
    import math
    import random

    WIDTH, HEIGHT = 1920, 1080


    def build_stars(count, seed=7):
        rng = random.Random(seed)
        rand = rng.random
        sqrt = math.sqrt
        stars = []
        append = stars.append
        while len(stars) < count:
            x = rand() * 2 - 1
            y = rand() * 2 - 1
            dist = sqrt(x * x + y * y)
            if dist > 1:
                continue
            size = 0.5 + rand() * 1.5
            twinkle = round(2 + rand() * 4, 2)
            fade = 1 - dist * 0.6
            append({
                "x": round(WIDTH / 2 + x * WIDTH / 2, 1),
                "y": round(HEIGHT / 2 + y * HEIGHT / 2, 1),
                "r": round(size * fade, 2),
                "t": twinkle,
            })
        return stars


    if __name__ == "__main__":
        stars = build_stars(200000)
        with open("static/stars.json", "w") as f:
            json.dump(stars, f)
        print(len(stars), "stars")
    ```

    **Already good:** the seeded `random.Random` gives the same output on every build, and `with` closes the file.
