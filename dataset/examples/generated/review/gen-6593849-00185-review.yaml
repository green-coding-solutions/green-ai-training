              (
                  runners[i % 5],
                  statuses[(i * 3) % 5],
                  60_000 + i * 7919,
                  "2026-10-%02d" % (1 + i % 28),
                  "log line " * 50,
                  "ENV=1;" * 20,
              ),
          )
      cfg = types.SimpleNamespace(
          watts={"arm-small": 35.0, "x86-large": 180.0},
          default_watts=90.0,
          pue=1.4,
      )
      report = RunnerEnergyReport(conn, cfg)
      for day in ("2026-10-01", "2026-10-15", "2026-11-01"):
