id: gen-1-00106-review
category: review
language: html
patterns:
- lazy-load-images
- system-fonts-and-deps
messages:
- role: user
  content: |
    Can you review the template for our results page? It's the internal page where the QA engineers look at the crops our defect-detection model flagged after each inference run. About 30 people use it every day, mostly on laptops over the factory Wi-Fi. A run usually has around 600 crops, and the server template repeats the card markup for each one.

    Requirements: keep the filter box (it filters by label, with a short delay while typing), keep the "show confidence" toggle, and keep the look roughly the same. I pasted the head, the header, the first two cards and the script.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Defect Detector - Run results</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <link rel="stylesheet" href="/static/css/results.css">
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    </head>
    <body>
      <header class="top">
        <img src="/static/img/logo-full.png" alt="Defect Detector" loading="lazy">
        <h1><i class="fa-solid fa-microchip"></i> Run {{ run_id }}</h1>
      </header>

      <section class="filters">
        <input id="filter" type="text" placeholder="Filter by label">
        <button id="toggle-conf"><i class="fa-solid fa-eye"></i> Show confidence</button>
      </section>

      <main id="grid" class="grid">
        <figure class="card" data-label="scratch">
          <img src="/runs/1042/crops/000001.jpg">
          <figcaption>scratch <span class="conf">0.94</span></figcaption>
        </figure>
        <figure class="card" data-label="dent">
          <img src="/runs/1042/crops/000002.jpg">
          <figcaption>dent <span class="conf">0.88</span></figcaption>
        </figure>
        <!-- ... ~600 cards -->
      </main>

      <script>
        $('#filter').on('input', _.debounce(function () {
          var q = $(this).val().toLowerCase();
          $('.card').each(function () {
            $(this).toggle(q === '' || $(this).data('label').indexOf(q) !== -1);
          });
        }, 150));

        $('#toggle-conf').on('click', function () {
          $('#grid').toggleClass('show-conf');
        });
      </script>
    </body>
    </html>
    ```

    The CSS only uses Roboto 400 and 700, and Roboto Mono 400 for the confidence numbers.
- role: assistant
  content: |
    **Workload:** web (internal dashboard)

    #### [Bug] Crops have no `alt` and no size
    - **Where:** the `<img>` in every `.card`
    - **Issue:** there is no `alt` text, so screen readers get nothing. There is also no `width`/`height`. This matters for the fix below: lazy images without a reserved size collapse to zero height, so the browser thinks all 600 are "near the viewport" and loads them anyway.
    - **Fix:** add `alt`, `width` and `height` (or a CSS `aspect-ratio` on `.card img`) to match the real crop size.

    #### [High] All ~600 crops load on page open
    - **Where:** the `<img>` in each `.card`
    - **Issue:** the browser fetches every crop, but a QA engineer sees maybe 12-20 cards before scrolling or filtering. Most of the transferred bytes are for images nobody looks at. This repeats on every page view for every user.
    - **Fix:** add `loading="lazy"` to the crops. Your filter hides cards with `display: none`, and the browser does not load lazy images that are hidden, so filtering still works and skips the hidden crops.
    - **Impact:** reduces network and client E per page view. The saving is largest for runs with many crops where people only check a few.
    - **Pattern:** Defer offscreen images

    #### [Medium] Web fonts and a full icon font for two icons
    - **Where:** the Google Fonts `<link>` (7 weights plus a mono family) and the Font Awesome stylesheet
    - **Issue:** the CSS uses only 3 of the weights it requests. The icon font ships its whole glyph set for two icons (chip, eye). Both add extra requests on the critical path, and your engineers sit on factory Wi-Fi.
    - **Fix:** use a system font stack (`system-ui, sans-serif` and `ui-monospace, monospace`) and drop the icons or use a small inline SVG. The look changes slightly. If the brand font is a must, self-host one `woff2` for 400 and 700 only, with `font-display: swap`.
    - **Impact:** reduces network bytes and render-blocking requests on every page load.

    #### [Medium] jQuery and lodash for three small jobs
    - **Where:** the two `<script src>` tags and the inline script
    - **Issue:** two libraries are downloaded and parsed to get a debounce, a class toggle and a show/hide loop. Plain DOM APIs do all three in a few lines. The hide loop also calls `$(this)` and `.data()` for each of 600 cards on every keystroke.
    - **Fix:** use vanilla JS, and read `dataset.label` directly. The behavior stays the same.

    #### [Low] The logo is lazy, but it is the first thing on the page
    - **Where:** `<img src="/static/img/logo-full.png" ... loading="lazy">`
    - **Issue:** lazy loading belongs on images below the fold. For an image that is always visible, it only delays the first paint.
    - **Fix:** remove the attribute from the logo.

    Updated version of the changed parts:

    ```html
    <head>
      <meta charset="utf-8">
      <title>Defect Detector - Run results</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="/static/css/results.css">
    </head>
    <body>
      <header class="top">
        <img src="/static/img/logo-full.png" alt="Defect Detector" width="160" height="40">
        <h1>Run {{ run_id }}</h1>
      </header>

      <section class="filters">
        <input id="filter" type="text" placeholder="Filter by label">
        <button id="toggle-conf" type="button">Show confidence</button>
      </section>

      <main id="grid" class="grid">
        <figure class="card" data-label="scratch">
          <img src="/runs/1042/crops/000001.jpg" alt="Crop 1: scratch" width="224" height="224" loading="lazy">
          <figcaption>scratch <span class="conf">0.94</span></figcaption>
        </figure>
        <!-- ... same for every card -->
      </main>

      <script>
        const grid = document.getElementById('grid');
        const cards = grid.querySelectorAll('.card');
        let timer;

        document.getElementById('filter').addEventListener('input', (e) => {
          clearTimeout(timer);
          timer = setTimeout(() => {
            const q = e.target.value.toLowerCase();
            for (const card of cards) {
              card.style.display = q === '' || card.dataset.label.includes(q) ? '' : 'none';
            }
          }, 150);
        });

        document.getElementById('toggle-conf').addEventListener('click', () => {
          grid.classList.toggle('show-conf');
        });
      </script>
    </body>
    ```

    And in `results.css`:

    ```css
    body { font-family: system-ui, sans-serif; }
    .conf { font-family: ui-monospace, monospace; }
    ```

    Set `width`/`height` to the real crop size. If the model output sizes vary, use `aspect-ratio` in CSS instead.

    **Already good:** the cards are plain `figure` elements, the filter only toggles visibility, and the debounce is a sensible choice for 600 cards.
verify:
  static_only: HTML template with Jinja placeholders and external CDN assets, cannot be run as a standalone program
