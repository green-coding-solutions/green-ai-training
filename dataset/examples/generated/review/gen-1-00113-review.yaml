id: gen-1-00113-review
category: review
language: yaml
patterns:
- compress-transmitted
- memoize
facts:
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    hi, i set up the config for our field gateways (small ARM box, sends sensor data over cellular). it works but the gateway CPU is always busy and the battery backup drains fast. i dont know what is wrong. can you look?

    ```yaml
    gateway:
      id: gw-field-07
      site: north-pumpstation
      mqtt:
        broker: mqtts://ingest.example.com:8883
        topic_prefix: site/north
        qos: 1
        tls_verify: false
      publish:
        interval_s: 5
        batch_size: 50
        compression:
          enabled: true
          algorithm: xz
          level: 9
          apply_to: [telemetry, snapshots, diagnostics]
      enrich:
        calibration:
          source: http://config.internal/api/calibration
          lookup_key: sensor_id
          per_reading: true
          cache:
            enabled: false
      sensors:
        - {id: pump-a-temp, type: temperature, poll_ms: 1000}
        - {id: pump-a-vib, type: vibration, poll_ms: 200}
        - {id: tank-level, type: level, poll_ms: 5000}
      snapshots:
        camera: cam0
        format: jpeg
        every_s: 60
      buffer:
        path: /var/lib/gateway/buffer
        max_mb: 256
    ```
- role: assistant
  content: |
    **Workload:** IoT gateway (runs all day on a small CPU, on battery backup)

    #### [Security] TLS verification is off
    - **Where:** `mqtt.tls_verify: false`
    - **Issue:** the gateway accepts any certificate, so anyone on the cellular path can pose as the broker and read or change the data.
    - **Fix:** set `tls_verify: true` and install the CA certificate on the gateway.

    #### [High] Heavy codec on every batch
    - **Where:** `publish.compression` (`xz`, level 9)
    - **Issue:** a new batch is compressed every 5 seconds, so this runs all day. `xz -9` is a codec for data you compress once and keep for a long time. That is the wrong fit for a small, always-busy CPU.
    - **Fix:** use `zstd` at a low level. Use `gzip` at a moderate level if the ingest side can't decode zstd yet. The receiver must be changed to match.
    - **Impact:** reduces E on the gateway. In Green Metrics Tool micro-benchmarks, compressing 100 MB of English text with default settings used about 16 J with zstd, about 67 J with gzip and about 458 J with xz. Those numbers compare energy only, not file size. xz usually gives smaller output. If your cellular data is billed by the byte, test a higher zstd level on real batches and compare size against CPU time.

    #### [High] Calibration fetched over HTTP for every reading, cache off
    - **Where:** `enrich.calibration` (`per_reading: true`, `cache.enabled: false`)
    - **Issue:** the same sensor gets the same calibration data again and again. The gateway makes a network request for every reading. With a 200 ms vibration sensor, that is several requests per second for data that rarely changes.
    - **Fix:** cache the lookup by `sensor_id`. Give the cache a small size limit and a TTL, and drop entries when the calibration version changes.
    - **Impact:** reduces E and network use. The number of requests drops from one per reading to about one per sensor per TTL. Cache only this static lookup. Do not cache the readings themselves. If a stale calibration would be wrong for your use, keep the TTL short.

    #### [Medium] JPEG snapshots are compressed again
    - **Where:** `compression.apply_to` contains `snapshots`
    - **Issue:** JPEG is already compressed, so the codec spends CPU and gains almost nothing.
    - **Fix:** remove `snapshots` from the list. Compress only the text payloads.

    ```yaml
    gateway:
      id: gw-field-07
      site: north-pumpstation
      mqtt:
        broker: mqtts://ingest.example.com:8883
        topic_prefix: site/north
        qos: 1
        tls_verify: true
      publish:
        interval_s: 5
        batch_size: 50
        compression:
          enabled: true
          algorithm: zstd
          level: 3
          apply_to: [telemetry, diagnostics]
      enrich:
        calibration:
          source: http://config.internal/api/calibration
          lookup_key: sensor_id
          per_reading: true
          cache:
            enabled: true
            max_entries: 64
            ttl_s: 3600
            invalidate_on: calibration_version
      # sensors, snapshots and buffer stay as they are
    ```

    **Already good:** readings are sent in batches of 50, and the local buffer has a size limit.
verify:
  static_only: gateway config YAML for a hypothetical agent; no runnable code
