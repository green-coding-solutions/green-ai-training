id: gen-1-00034-estimate
category: estimate
language: sql
patterns:
- batch-db-writes
facts:
- F-PG-INSERT
messages:
- role: user
  content: |
    ```sql
    -- generated by logship, loaded with: psql -f chunk.sql
    -- ~40k of these per chunk, chunks every few minutes. would batching them save much energy?
    BEGIN;
    INSERT INTO app_log (ts, host, level, service, message) VALUES ('2026-10-08 14:02:11', 'web-03', 'INFO', 'auth', 'login ok user=412');
    INSERT INTO app_log (ts, host, level, service, message) VALUES ('2026-10-08 14:02:11', 'web-03', 'INFO', 'auth', 'login ok user=977');
    INSERT INTO app_log (ts, host, level, service, message) VALUES ('2026-10-08 14:02:12', 'web-01', 'WARN', 'billing', 'retry payment id=88121');
    INSERT INTO app_log (ts, host, level, service, message) VALUES ('2026-10-08 14:02:13', 'web-02', 'ERROR', 'billing', 'gateway timeout id=88121');
    INSERT INTO app_log (ts, host, level, service, message) VALUES ('2026-10-08 14:02:13', 'web-03', 'INFO', 'search', 'query ok ms=31');
    -- ... and so on
    COMMIT;
    ```

    ?
- role: assistant
  content: |
    Yes, it should save energy at this size. I can't give you a number for your system without measuring it, but I can tell you which way it goes and point you to a measured reference.

    **What drives the saving:** you already use one transaction, so commits are not the problem. The cost is that every `INSERT` is a separate statement. The server receives, parses and plans each one separately. With a multi-row `VALUES` list or `COPY`, the server does that work once per batch.

    **Measured reference:** in Green Metrics Tool micro-benchmarks on PostgreSQL 16, inserting 500,000 rows in batches of 5,000 rows used ~384 J of CPU energy with one `execute()` per row. `executemany()` used ~139 J, and `COPY ... FROM STDIN` used ~17 J. That is about 22× less than the per-row loop. Those runs used a Python client, with client and server on the same machine. A `psql -f` script of single-row statements has the same per-statement overhead, but I would not carry the exact figures over to it.

    **Where it matters less:** with batches of only 100 rows, the same benchmark showed small differences (loop ~13 J, `executemany` ~15 J, `COPY` ~9.5 J). Your chunks are large, so batching should pay off for you.

    **How to get your own number:**
    1. Quick check: build one real chunk in both forms. Then run `perf stat -e power/energy-pkg/ psql -q -f chunk_single.sql` and the same command with `chunk_batched.sql`. If RAPL is not available, time each run with `time` and compare CPU time.
    2. Real energy: run both loads as Green Metrics Tool usage scenarios on the same database setup and compare CPU energy. Multiply the difference per chunk by the number of chunks per day.

    **Best option:** if `logship` can write the chunk as a CSV file, load it with one `COPY`:

    ```bash
    psql -q -c 'COPY app_log (ts, host, level, service, message) FROM STDIN WITH (FORMAT csv)' < chunk.csv
    ```

    **If it has to stay SQL statements:** a multi-row `VALUES` list is a good middle step. Put about 1,000 rows in each statement, not all 40k in one:

    ```sql
    BEGIN;
    INSERT INTO app_log (ts, host, level, service, message) VALUES
      ('2026-10-08 14:02:11', 'web-03', 'INFO', 'auth', 'login ok user=412'),
      ('2026-10-08 14:02:11', 'web-03', 'INFO', 'auth', 'login ok user=977'),
      ('2026-10-08 14:02:12', 'web-01', 'WARN', 'billing', 'retry payment id=88121'),
      ('2026-10-08 14:02:13', 'web-02', 'ERROR', 'billing', 'gateway timeout id=88121'),
      ('2026-10-08 14:02:13', 'web-03', 'INFO', 'search', 'query ok ms=31');
    COMMIT;
    ```
verify:
  sql:
    setup: CREATE TABLE app_log (id INTEGER PRIMARY KEY, ts TEXT, host TEXT, level TEXT, service TEXT, message TEXT);
    compare: true
