  content: |
    I read the `?` as the question in your TODO: does swapping `from sympy import *` for explicit imports save energy?

    **No, not measurably.** In Green Metrics Tool micro-benchmarks, 1,000 Python process starts that each ran `from sympy import *` used about 3103 J of CPU energy. The same starts with `import sympy` used about 3093 J. A built-in module showed the same result: `from posix import *` and `import posix` both used about 121 J. That is a tie, so I would close the ticket and leave the imports as they are.

    **What does cost energy is loading sympy at all.** In the same benchmarks, a process start that imports sympy used about 3.1 J and 0.54 s. That is about 25× a start that imports only a built-in module (~0.12 J). Explicit names still load the whole package, so they don't change this.

    **When it matters:**
    - **Long-running workers** (gunicorn, uvicorn): you pay the import once per worker start. Per request it costs nothing, so there is little to gain.
    - **A fresh process per request or per job** (CGI-style, short-lived containers, scale-to-zero cold starts): the import cost repeats every time. Only then is it worth asking whether sympy is needed on this path.

    **How to get your own number:**
    1. See what the import costs: `python -X importtime -c "import shipping_api" 2> imports.txt`, then look at the `sympy` lines.
    2. Compare CPU time for many starts: `perf stat -r 50 python -c "import shipping_api"`, once with the star import and once with explicit names. Expect the two to match within noise.
    3. For real energy, run both variants as Green Metrics Tool usage scenarios on the same machine.

    Don't multiply my figures by your request count. They come from one machine and one setup.
