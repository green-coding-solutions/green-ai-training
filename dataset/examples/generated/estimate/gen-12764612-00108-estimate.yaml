- role: assistant
  content: |
    If you are asking what this costs: the `history.insert(0, ...)` line is the expensive part. Every front insert shifts all stored items by one slot. Step `k` moves `k` items, so a full run does work that grows with the square of `steps`. The Poisson draw is constant work per step.

    **Measured reference:** in Green Metrics Tool micro-benchmarks, 1,000,000 × `list.insert(0, x)` used ~1515 J of CPU energy, and 1,000,000 × `list.append(x)` used ~1.2 J. That is over 1000× less. Those runs used plain integers and no other work per step. Your loop also draws random numbers, so the total will not drop by the same factor. The front insert is the part that goes away.

    **Fix:** append in the loop and flip the list once at the end. The result is the same newest-first list, so `summarize` works unchanged.

    ```python
    import numpy as np

    def simulate_decay(n0, rate, dt, steps, seed=0):
        rng = np.random.default_rng(seed)
        n = n0
        history = []
        for step in range(steps):
            decays = rng.poisson(n * rate * dt)
            n = max(n - decays, 0)
            history.append((step * dt, int(n)))
        history.reverse()  # newest first, one O(n) pass
        return history
    ```

    If you need to read the list while it grows, use `collections.deque` with `appendleft` instead. It inserts at the front in constant time.

    **How to get your own number:**
    1. Quick CPU-time proxy: run both versions with `steps=100_000` under `python -m timeit -n 1 -r 3` or `perf stat`. Then try `steps=200_000` and watch how the old version grows.
    2. Real energy: run each version as a Green Metrics Tool usage scenario on the same machine and compare CPU energy.

    Your `summarize` line with `history[-1][1] * 0 + 500` always evaluates to 500. It works, but it is confusing. Write `n <= 500` instead.
