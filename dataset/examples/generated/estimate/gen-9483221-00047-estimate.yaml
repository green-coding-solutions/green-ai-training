id: gen-9483221-00047-estimate
category: estimate
language: html
patterns:
- dom-size
facts:
- F-DOM-SIZE
messages:
- role: user
  content: |
    Transit survey candidate viewer, ~10k rows from the vetting pipeline. How much energy would we save by paginating? Just give me the diff, no tutorial.

    ```html
    <table id="cand">
      <thead><tr><th>ID</th><th>Period (d)</th><th>Depth (ppm)</th><th>SNR</th><th>Flag</th></tr></thead>
      <tbody></tbody>
    </table>
    <script>
    fetch('/api/candidates.json').then(r => r.json()).then(rows => {
      const tbody = document.querySelector('#cand tbody');
      for (const r of rows) {
        const tr = document.createElement('tr');
        for (const v of [r.id, r.period, r.depth, r.snr, r.flag]) {
          const td = document.createElement('td');
          const div = document.createElement('div');
          div.className = 'cell';
          const span = document.createElement('span');
          span.textContent = v;
          div.appendChild(span);
          td.appendChild(div);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    });
    </script>
    ```
- role: assistant
  content: |
    In Green Metrics Tool browser benchmarks, 30 page loads of a table with 10,000 rows used ~1036 J and 72 s. Each row had wrappers around every cell, and rows were appended to the live DOM one by one, like your code. The same data paginated to 100 rows per page, as a plain `<table>` built in a `DocumentFragment`, used ~457 J and 36 s. That is about 56% less, or about 2.3× less.

    Your table has the same shape: a `div` and a `span` around every cell, appended per row. Don't scale the figure to your traffic. It is one benchmark on one machine.

    Changed part:

    ```html
    <div id="pager">
      <button id="prev">Prev</button> <span id="pos"></span> <button id="next">Next</button>
    </div>
    <script>
    const PAGE = 100;
    fetch('/api/candidates.json').then(r => r.json()).then(rows => {
      const tbody = document.querySelector('#cand tbody');
      const pos = document.getElementById('pos');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      const pages = Math.ceil(rows.length / PAGE);
      let page = 0;

      function render() {
        const frag = document.createDocumentFragment();
        for (const r of rows.slice(page * PAGE, (page + 1) * PAGE)) {
          const tr = document.createElement('tr');
          for (const v of [r.id, r.period, r.depth, r.snr, r.flag]) {
            const td = document.createElement('td');
            td.textContent = v;
            tr.appendChild(td);
          }
          frag.appendChild(tr);
        }
        tbody.replaceChildren(frag);
        pos.textContent = `${page + 1} / ${pages}`;
        prev.disabled = page === 0;
        next.disabled = page === pages - 1;
      }

      prev.onclick = () => { page--; render(); };
      next.onclick = () => { page++; render(); };
      render();
    });
    </script>
    ```

    Behavior changes:
    - Browser find (Ctrl+F) now only sees the current page. If people search the full list, add a filter box that runs over `rows`.
    - The `div.cell` wrapper is gone. Move any `.cell` CSS to `td`.

    To get your own number, load the page 30 times in a Green Metrics Tool usage scenario with each version and compare CPU energy.
verify:
  static_only: HTML page with browser DOM script, needs a browser and a fetch endpoint
