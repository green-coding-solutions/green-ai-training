messages:
- role: user
  content: |
    png -> webp for these charts, how much energy do we save?

    ```html
    <section class="panel">
      <h2>Errors, last 24h</h2>
      <img src="/charts/errors-24h.png" alt="Errors per hour, last 24 hours">
      <h2>Top sources</h2>
      <img src="/charts/top-sources.png" alt="Log volume by source">
      <h2>Ingest lag</h2>
      <img src="/charts/ingest-lag.png" alt="Ingest lag per pipeline">
    </section>
    ```
- role: assistant
  content: |
    I can't give you a number for your charts. I can tell you what drives the saving and what was measured.

    In Green Metrics Tool micro-benchmarks (50 page loads per format, headful browser, CPU energy), the client cost was ~181 J for PNG and ~150 J for WebP. Decoding is cheaper for WebP, but the gap is moderate. The bigger saving is fewer transferred bytes, and that benchmark did not measure it. It depends on how big your PNGs are now.

    If the charts are rendered by your service, encoding matters too. Encoding 50 BMP images cost ~1257 J as PNG and ~290 J as WebP. So WebP is also cheaper to produce. Encode once when the chart is generated, not on each page view.

    Markup with a fallback:

    ```html
    <section class="panel">
      <h2>Errors, last 24h</h2>
      <picture>
        <source srcset="/charts/errors-24h.webp" type="image/webp">
        <img src="/charts/errors-24h.png" alt="Errors per hour, last 24 hours" width="800" height="300">
      </picture>
    </section>
    ```

    Do the same for the other two charts. Setting `width` and `height` avoids layout shifts.

    To get your own number:
    - Compare the file sizes of the PNG and WebP versions of each chart. That is your byte saving.
    - Load the page about 50 times with each version in a Green Metrics Tool usage scenario, or use `perf stat` on the render service as a CPU proxy.
    - Don't scale the figures above. They came from test images, and flat charts can behave differently from photos.
