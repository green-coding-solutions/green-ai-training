id: gen-12764612-00428-estimate
category: estimate
language: bash
patterns:
- compress-stored
facts:
- F-COMPRESS-CODECS
- F-COMPRESS
messages:
- role: user
  content: |
    how much energy do we save if the landing-zone archive goes from `bzip2 -9` to zstd? ~50 GB/day, kept 90 days
- role: assistant
  content: |
    Direction: a clear saving on the CPU side, both when you write the archive and when you read it back. How it nets out against storage depends on file size, which you need to check.

    Measured reference: in Green Metrics Tool micro-benchmarks on English text with default settings, compressing 100 MB used about 106 J with bzip2 and about 16 J with zstd. Decompressing 100 MB used about 52 J with bzip2 and about 5.3 J with zstd. bzip2 is slow in both directions, which matters if you re-read archives for reprocessing or audits.

    Caveats:
    - These are energy figures only, not compression ratios. bzip2 at its best level often gives smaller files than zstd at its default. Over 90 days, stored bytes also cost energy and hardware, so compare the output sizes on your real data.
    - The benchmark used text. Your landing-zone files may be CSV, JSON, Parquet or already-compressed data. Compressed formats gain almost nothing from another codec, so skip compression for those.
    - Don't scale my figures to 50 GB/day. They come from one machine and one corpus.

    To get your own number, run both codecs on a one-day sample:

    ```bash
    sample=/data/landing/2026-10-25
    for codec in 'bzip2 -9' 'zstd'; do
      echo "== $codec"
      /usr/bin/time -f '%e s wall, %U s user' \
        sh -c "tar -cf - '$sample' | $codec > /tmp/test.out"
      ls -l /tmp/test.out | awk '{print $5, "bytes"}'
    done
    ```

    User CPU time is a decent proxy. For energy, wrap the same commands in `perf stat -a -e power/energy-pkg/` if your machine exposes RAPL, or run them as a Green Metrics Tool usage scenario. Multiply the per-day result by your real day count only after you have measured it.

    If zstd's files are close in size to bzip2's, switch. If bzip2's are much smaller and you rarely read the archives, the storage side may decide it, so measure both.
verify:
  static_only: bash estimate answer, measurement snippet needs real data and optional RAPL access
