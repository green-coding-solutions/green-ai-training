messages:
- role: user
  content: |
    how much energy do we save if the shop product images go from jpg to avif? ~40k product pages a day
- role: assistant
  content: |
    I can't give you a reliable number for your shop without measuring. I can give you the direction and what drives it.

    **What drives the saving:** AVIF files are usually much smaller than JPEG for photos, so each page view transfers fewer bytes. That is where the saving comes from. The client and server CPU work goes the other way:

    - **Decoding:** in Green Metrics Tool browser benchmarks with 50 page loads per format, JPG used ~134 J of CPU energy and AVIF ~159 J, so AVIF decoding cost about 19% more. These loads ran on a local network, so they show the CPU side only, not the saved bytes.
    - **Encoding:** encoding 50 BMP images used ~89 J for JPG and ~658 J for AVIF, about 7× more.

    So AVIF is not free. It pays off when the byte saving over real networks is larger than the extra decode cost, and when you encode each image once.

    **For your shop:**
    - Encode once at upload or build time, never per request. With 40k page views a day and a fixed catalog, the encoding cost is paid once per image and the byte saving repeats on every view.
    - Keep a JPEG fallback with `<picture>`, so older browsers still work:

    ```html
    <picture>
      <source srcset="/img/product-123.avif" type="image/avif">
      <img src="/img/product-123.jpg" alt="Blue canvas backpack" width="800" height="800">
    </picture>
    ```

    - Small icons and logos are better as SVG than as any raster format.

    **How to get your own number:**
    1. Take a typical product page and measure the transferred bytes with the browser network panel for the JPG and AVIF versions. This is the main saving.
    2. For CPU, run both versions as a Green Metrics Tool usage scenario on the same machine and compare the CPU energy of repeated page loads.
    3. Multiply the per-page difference by your daily views only after you have both measurements.

    I would not quote a total before step 2. The direction is clear for the network. The size of the net saving depends on your image sizes and your visitors' connections.
