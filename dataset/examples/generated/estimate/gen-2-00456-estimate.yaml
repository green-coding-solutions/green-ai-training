id: gen-2-00456-estimate
category: estimate
language: python
patterns:
- string-join
facts:
- F-STRCAT
messages:
- role: user
  content: |
    how much energy does join save here? MD energy trace, one line per step

    ```python
    def trace_text(steps):
        s = ""
        for i, (e, t) in enumerate(steps):
            s += "%d %.6f %.3f\n" % (i, e, t)
        return s
    ```
- role: assistant
  content: |
    I can't give you a number for your system without measuring. The direction is clear, though: `join` uses less energy, and the gap grows with the number of steps.

    **What drives the saving:** `+=` can copy the growing string again on each step, so the work can grow with the square of the length. `join` builds the pieces first, then allocates the result once and copies each piece once. CPython sometimes extends a string in place, but you can't rely on that.

    **Measured reference:** in Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J of CPU energy with `+=` and ~1.8 J with `"".join()`, roughly 260× less. Your trace has a different number of steps and a different line length, so don't scale that figure to your run. The gap is small for short traces and large for long ones.

    ```python
    def trace_text(steps):
        return "".join("%d %.6f %.3f\n" % (i, e, t) for i, (e, t) in enumerate(steps))
    ```

    The output is identical.

    **How to get your own number:**
    1. Quick CPU-time proxy: run both versions on a real trace with `python -m timeit` or `perf stat`.
    2. Real energy: run each version as a Green Metrics Tool usage scenario on the same machine and compare the CPU energy.

    If the trace goes straight to a file, writing each line with `f.write` also avoids the big string. That was not part of the measurement.
verify:
  equivalence:
    driver: |
      steps = [(-1.5 * i + 0.25, 300 + i * 0.01) for i in range(200)]
      print(repr(trace_text(steps)))
      print(repr(trace_text([])))
  test: assert trace_text([(1.0, 2.0)]) == "0 1.000000 2.000\n"
