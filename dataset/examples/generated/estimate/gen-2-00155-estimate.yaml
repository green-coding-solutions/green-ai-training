messages:
- role: user
  content: |
    ```css
    /* gateway.css: web UI for the GW-200 edge gateway (served by uhttpd from /www)
     * Started from the "AdminLite" template in 2023. We only use the
     * header, the sensor table and the status badges now.
     * PLAT-388: "Purge unused CSS to reduce energy use of the web UI."
     * How much would that actually save us?
     */
    :root {
      --bg: #f4f6f8;
      --fg: #1d2733;
      --ok: #2e7d32;
      --warn: #f9a825;
      --err: #c62828;
    }

    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }

    .gw-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: #263238; color: #fff; }
    .gw-header .fw { font-size: 12px; opacity: .7; }

    .sensor-table { width: 100%; border-collapse: collapse; }
    .sensor-table th, .sensor-table td { padding: 6px 10px; border-bottom: 1px solid #dde3e8; text-align: left; }
    .sensor-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; color: #fff; }
    .badge--online { background: var(--ok); }
    .badge--stale { background: var(--warn); color: #000; }
    .badge--offline { background: var(--err); }

    /* ---- AdminLite template ---- */
    .navbar-collapse { flex-basis: 100%; flex-grow: 1; align-items: center; }
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: 240px; background: #1e282c; overflow-y: auto; }
    .sidebar .nav-item > a:hover { background: rgba(255,255,255,.08); color: #fff; }
    .carousel { position: relative; overflow: hidden; }
    .carousel-item { display: none; transition: transform .6s ease-in-out; }
    .carousel-item.active { display: block; }
    .pricing-card { width: 30%; margin: 0 1.5%; border: 1px solid #e0e0e0; border-radius: 6px; }
    .pricing-card .price { font-size: 2.5rem; font-weight: 700; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1040; }
    .modal-dialog { max-width: 500px; margin: 1.75rem auto; }
    .chart-legend li::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
    .timeline > li:nth-child(odd) { float: left; clear: left; }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .pricing-card { width: 100%; margin: 0 0 1rem; }
    }
    /* ... about 600 more lines of template rules ... */
    ```
    ?
- role: assistant
  content: |
    In client energy, probably nothing you could measure. In bytes, a fair amount.

    **What was measured:** in Green Metrics Tool page-load benchmarks (50 cold loads, headful Firefox, local network), a 16 KB stylesheet with mostly unused rules used ~783 J. The same stylesheet purged and minified to 0.75 KB used ~764 J. That is about 2% less, which is within measurement noise. The browser handles a stylesheet of this size quickly. Removing dead rules does not change much on the CPU side.

    Your file looks like that case: a small UI that uses a few dozen rules, with the rest left over from the template. So don't expect PLAT-388 to lower the energy use of the web UI in a way you could see.

    **What it does save:**
    - **Transferred bytes on every cold load.** This counts most when people open the UI over a slow or metered link, such as a cellular uplink to a remote gateway. On a LAN the difference is hard to notice.
    - **Flash space** on the gateway, plus a stylesheet that is easier to maintain.

    Treat it as a Low-priority cleanup that saves bytes, not as an energy fix. One correctness check before you purge: if your JavaScript builds the badge classes from data (for example `'badge--' + state`), PurgeCSS will not find `badge--online`, `badge--stale` or `badge--offline` in the HTML. Put them on the safelist, or the badges lose their colors.

    **How to measure your case:**
    - Bytes, before and after:

      ```bash
      curl -s -o /dev/null -w '%{size_download}\n' 'http://gateway.local/gateway.css'
      ```

    - Client energy: run cold loads of the status page as a Green Metrics Tool usage scenario, once with the current file and once with the purged file. Compare the two runs. Expect a result inside the noise unless the stylesheet turns out to be much bigger than it looks.
verify:
  static_only: CSS stylesheet and a curl command against a device, nothing to execute
