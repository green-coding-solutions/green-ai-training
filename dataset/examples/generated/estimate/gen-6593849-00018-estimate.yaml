id: gen-6593849-00018-estimate
category: estimate
language: bash
patterns:
- compress-transmitted
facts:
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    switching xz -9 to zstd in this, how much energy do we save? runs daily on ~30 dev laptops, mostly text

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail
    SRC="$HOME/notes-export"
    HOST="$1"
    tar -C "$SRC" -cf - . | xz -9 | ssh "$HOST" "xz -d | tar -C /srv/shared/notes -xf -"
    ```
- role: assistant
  content: |-
    Probably a lot on the compression side. I can't give you a number for your laptops, but here is the measured reference.

    **Measured reference:** in Green Metrics Tool micro-benchmarks, compressing 100 MB of English text with default settings used ~458 J with xz and ~16 J with zstd. That is about 29× less for zstd. Decompressing the same data used ~11.7 J with xz and ~5.3 J with zstd, so the receiving side gains less.

    Two limits on that figure:
    - It was measured at the default levels (xz -6, zstd -3). Your `xz -9` is a stronger setting, so it likely costs more than the measured xz. I have no figure for it.
    - It compares energy only, not file size. xz usually makes smaller files. On a slow link or for long-term storage, that can matter. For a daily transfer of text it often doesn't.

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail
    SRC="$HOME/notes-export"
    HOST="$1"
    tar -C "$SRC" -cf - . | zstd | ssh "$HOST" 'zstd -d | tar -C /srv/shared/notes -xf -'
    ```

    The server needs `zstd` installed too.

    **How to measure your saving:**
    1. Run both versions on a real export with `perf stat` (or `time`) as a CPU-time proxy, and compare the bytes sent.
    2. For energy, run both as a Green Metrics Tool usage scenario on one machine. Then multiply the per-run difference by your runs per day.
