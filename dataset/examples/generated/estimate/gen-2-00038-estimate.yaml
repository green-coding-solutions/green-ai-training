id: gen-2-00038-estimate
category: estimate
language: html
patterns:
- system-fonts-and-deps
facts:
- F-FONTS
messages:
- role: user
  content: |
    Hi, I am quite new here. I made the local web page for our LoRaWAN gateway (GW-410). The gateway serves it from its own flash, and technicians open it on their laptop or phone to check the status. My senior looked at it and said "the fonts are way too heavy, use system fonts, it wastes energy". I don't really understand what is wrong, it looks nice and loads OK for me on the office wifi.

    We have around 1,200 gateways in the field and I think every gateway's page is opened maybe 5 times per day. Some technicians connect over the LTE uplink through VPN. How much energy would we actually save if I switch? Is it worth it? The fonts folder is around 4 MB.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>GW-410 Gateway · Status</title>
      <style>
        @font-face { font-family: "Open Sans"; src: url("/static/fonts/OpenSans-Light.ttf") format("truetype"); font-weight: 300; }
        @font-face { font-family: "Open Sans"; src: url("/static/fonts/OpenSans-Regular.ttf") format("truetype"); font-weight: 400; }
        @font-face { font-family: "Open Sans"; src: url("/static/fonts/OpenSans-Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
        @font-face { font-family: "Open Sans"; src: url("/static/fonts/OpenSans-SemiBold.ttf") format("truetype"); font-weight: 600; }
        @font-face { font-family: "Open Sans"; src: url("/static/fonts/OpenSans-Bold.ttf") format("truetype"); font-weight: 700; }
        @font-face { font-family: "Open Sans"; src: url("/static/fonts/OpenSans-ExtraBold.ttf") format("truetype"); font-weight: 800; }

        body { font-family: "Open Sans", sans-serif; margin: 0; background: #f4f6f8; color: #1d2733; }
        header { background: #12324a; color: #fff; padding: 12px 20px; font-weight: 800; }
        .card { background: #fff; border-radius: 6px; margin: 16px; padding: 16px; }
        .label { font-weight: 300; color: #5b6b7a; }
        .value { font-weight: 600; }
        .ok { color: #1b8a3a; }
        .warn { color: #c47a00; }
      </style>
    </head>
    <body>
      <header>GW-410 · Hall B</header>
      <div class="card">
        <div><span class="label">Uplink</span> <span class="value ok">LTE, -87 dBm</span></div>
        <div><span class="label">LoRa packets (24h)</span> <span class="value">18,442</span></div>
        <div><span class="label">Connected sensors</span> <span class="value">63</span></div>
        <div><span class="label">Firmware</span> <span class="value">2.8.1</span></div>
      </div>
      <div class="card">
        <em>Last config change by technician: 2026-10-20</em>
      </div>
    </body>
    </html>
    ```
- role: assistant
  content: |
    Your page works fine. The problem is what it costs on every load: a status page with a few lines of text pulls in six TTF files, about 4 MB. That is far more than the page itself. I can't give you a per-day number for your fleet, but I can show what was measured and what drives the saving.

    **What was measured** (Green Metrics Tool browser benchmarks, 30 cold page loads, empty cache, fast local network):

    - six local TTF font files (~4 MB): ~556 J
    - two Latin-subset WOFF2 files (~55 KB): ~488 J, about 12% less
    - system font stack: ~410 J, about 26% less than the TTF set

    These numbers count client CPU work only. The network was almost free in that test.

    **What drives the saving for you:**

    - **Cold loads.** The fonts only cost this much when the browser doesn't have them cached. New phones, private windows and cleared caches all count. If the gateway's web server sends no cache headers, the browser may download them again on many visits. Check the response headers in the browser DevTools.
    - **The LTE path.** Over VPN on the cellular uplink, every cold load sends about 4 MB of fonts over a metered, slow link. The measurement above doesn't include this part, and on your setup it is probably the bigger part. It is also the part technicians notice as waiting.
    - **The gateway itself.** It has to read the files from flash and send them. With system fonts it sends a few KB of HTML instead.
    - **Firmware size.** You also free about 4 MB in every firmware image you build and ship.

    **The change:**

    ```html
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0; background: #f4f6f8; color: #1d2733;
      }
      /* delete all six @font-face rules and the /static/fonts/ folder */
    </style>
    ```

    Keep the rest of your CSS as it is. One visible difference: some system fonts have no light or extra-bold weight, so the browser uses the nearest weight it has. Regular, italic and bold look normal everywhere.

    **Why I won't multiply this by 1,200 gateways:** the figures come from one machine, one browser and one test page with an empty cache every time. Your share of cold loads, your devices and your LTE link are all different. Scaling the result up would give a made-up number.

    **How to measure it for your case:**

    - Write a Green Metrics Tool usage scenario that opens the status page with a cold cache, once with the TTF fonts and once with system fonts. Compare the energy per load.
    - For the network side, open DevTools → Network with the cache disabled and compare the transferred bytes of both versions. On the gateway, the web server access log shows how often the font files are actually requested. That tells you how many cold loads you really have.

    So yes, it is worth it. It is a small edit, and it removes about 4 MB from every cold load and from every firmware image.
verify:
  static_only: HTML/CSS snippet; the energy effect needs a browser measurement
