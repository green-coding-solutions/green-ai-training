id: gen-2-00411-estimate
category: estimate
language: bash
patterns:
- compress-stored
facts:
- F-COMPRESS-CODECS
- F-COMPRESS-BREAKEVEN
messages:
- role: user
  content: |
    how much energy do we save if the nightly ETL snapshot archive goes from brotli to zstd? we keep them 14 days

    ```bash
    brotli -q 11 -o "/archive/etl/snapshot-$(date +%F).tar.br" "$SNAP_TAR"
    ```
- role: assistant
  content: |
    A lot on the compression side. In Green Metrics Tool micro-benchmarks, compressing 100 MB of English text with default settings used about 16 J with zstd and about 3019 J with brotli. The brotli CLI default is quality 11, the same as your command. That is about 190× more energy for brotli. Decompressing 100 MB is similar: about 5.3 J for zstd and about 6.7 J for brotli.

    ```bash
    zstd -q -o "/archive/etl/snapshot-$(date +%F).tar.zst" "$SNAP_TAR"
    # restore: zstd -dc snapshot-YYYY-MM-DD.tar.zst | tar -x
    ```

    Notes:
    - These figures compare energy only, not file size. Brotli at quality 11 usually makes smaller files. For data you compress every night and delete after 14 days, the smaller file rarely repays the compression cost. A rough estimate (not a direct measurement) puts the break-even for zstd at about 0.15 days of storage for 100 MB of text.
    - I can't give you a number in joules for your job. It depends on your data type and snapshot size. If the snapshot is mostly already-compressed files (Parquet, ZIP, JPEG), neither codec gains much, and you could store it uncompressed.
    - To measure it, run both commands on a real snapshot in a Green Metrics Tool usage scenario. For a quick CPU-time proxy, use `perf stat` or `time` on each command.
verify:
  static_only: bash commands with external compression tools and env variable; estimate answer
