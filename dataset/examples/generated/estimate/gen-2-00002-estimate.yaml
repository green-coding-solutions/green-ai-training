messages:
- role: user
  content: |
    Hi, I'm pretty new to web stuff. I help with our small online clothing shop. My boss wants to put a number on our sustainability page, like "we saved X kg CO2 by optimizing images". A friend told me our product photos should be WebP or AVIF instead of JPG. I don't really understand what is wrong with JPG?? And how much energy would we actually save if we switch?

    This is how a category page looks. About 40 products per page. We upload the photos as JPG from the camera through the shop admin.

    ```html
    <section class="product-grid">
      <article class="product-card">
        <a href="/products/linen-shirt-sand">
          <img src="/img/products/linen-shirt-sand.jpg" alt="Linen shirt in sand" width="600" height="800">
          <h3>Linen Shirt – Sand</h3>
        </a>
        <p class="price">€49.00</p>
        <button class="add-to-cart" data-sku="LS-SAND-M">Add to cart</button>
      </article>
      <article class="product-card">
        <a href="/products/denim-jacket-blue">
          <img src="/img/products/denim-jacket-blue.jpg" alt="Denim jacket in washed blue" width="600" height="800">
          <h3>Denim Jacket – Washed Blue</h3>
        </a>
        <p class="price">€89.00</p>
        <button class="add-to-cart" data-sku="DJ-BLUE-L">Add to cart</button>
      </article>
      <article class="product-card">
        <a href="/products/wool-scarf-grey">
          <img src="/img/products/wool-scarf-grey.jpg" alt="Wool scarf in grey" width="600" height="800">
          <h3>Wool Scarf – Grey</h3>
        </a>
        <p class="price">€29.00</p>
        <button class="add-to-cart" data-sku="WS-GREY">Add to cart</button>
      </article>
      <!-- ... about 40 cards per category -->
    </section>
    ```
- role: assistant
  content: |
    JPG isn't wrong. The only issue is file size. I can't give you a CO2 number for your shop, because it depends on your photos and your traffic. You can measure it yourself, though.

    **Where the saving comes from**

    At similar visual quality, WebP and AVIF files are usually smaller than JPG. So every product photo sends fewer bytes over the network. Your saving is roughly "bytes saved per photo × photos per page × page views", and that grows with your traffic.

    **What it costs**

    - **Decoding on the visitor's device:** this is slightly *more* work for modern formats. In Green Metrics Tool benchmarks, 50 page loads per format used about 134 J of CPU energy with JPG, 150 J with WebP and 159 J with AVIF. That makes AVIF decoding about 19% more expensive than JPG. The benefit has to come from the smaller files.
    - **Encoding:** in the same benchmarks, encoding 50 images took about 89 J as JPG and 658 J as AVIF, about 7× more. So convert each photo once, when it is uploaded in the shop admin. Never convert per request.

    **The HTML**

    Store the converted files next to the JPG and let the browser choose:

    ```html
    <article class="product-card">
      <a href="/products/linen-shirt-sand">
        <picture>
          <source srcset="/img/products/linen-shirt-sand.avif" type="image/avif">
          <source srcset="/img/products/linen-shirt-sand.webp" type="image/webp">
          <img src="/img/products/linen-shirt-sand.jpg" alt="Linen shirt in sand" width="600" height="800">
        </picture>
        <h3>Linen Shirt – Sand</h3>
      </a>
      <p class="price">€49.00</p>
      <button class="add-to-cart" data-sku="LS-SAND-M">Add to cart</button>
    </article>
    ```

    Browsers that can't show AVIF or WebP still get the JPG, so nothing breaks.

    **How to get a real number for your boss**

    1. Convert 10–20 typical product photos once. Compare the file sizes to the JPGs.
    2. Open a category page with browser DevTools → Network. Note the "transferred" total before and after the switch.
    3. Multiply the bytes saved per page by your monthly page views from your analytics. That gives you a figure you can defend: "X GB less data per month".
    4. To check the visitor-side CPU effect, load the page a fixed number of times with each version in a Green Metrics Tool usage scenario.

    Converting bytes to kg CO2 depends on which network energy model you use, and those models differ a lot. If you publish a CO2 figure, name the model next to it. Otherwise, report the bytes saved, which you measured directly.
verify:
  static_only: HTML snippet only, no runnable code
