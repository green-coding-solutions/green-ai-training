id: gen-1-00445-estimate
category: estimate
language: javascript
patterns:
- lazy-load-images
messages:
- role: user
  content: |
    ```javascript
    const fs = require('fs');
    const path = require('path');

    function renderColumnCards(columns) {
      return columns.map((col) => `
        <section class="col-card">
          <h3>${col.name}</h3>
          <p>${col.nullPct}% null, ${col.distinct} distinct values</p>
          <img src="hist/${col.name}.png" alt="Histogram of ${col.name}">
        </section>`).join('\n');
    }

    function writeReport(dataset, columns, outDir) {
      // TODO: loading="lazy" on the histograms? how much energy would that save?
      const html = `<!doctype html>
    <html>
    <head><meta charset="utf-8"><title>Profile: ${dataset.name}</title>
    <link rel="stylesheet" href="report.css"></head>
    <body>
    <h1>${dataset.name}</h1>
    <p>${dataset.rows} rows, ${columns.length} columns, loaded ${dataset.loadedAt}</p>
    ${renderColumnCards(columns)}
    </body>
    </html>`;
      fs.writeFileSync(path.join(outDir, `${dataset.name}.html`), html);
    }

    module.exports = { writeReport, renderColumnCards };
    ```

    ?
- role: assistant
  content: |
    I read the `?` as the TODO in `writeReport`: how much energy would `loading="lazy"` save? I can't give you a number without measuring, and I won't invent one. The direction is clear, though.

    **What drives the saving:** right now every histogram PNG is fetched and decoded when the page opens, even if the reader never scrolls to it. With lazy loading, the browser only loads images near the viewport. The saving is the bytes and decode work of the images nobody reaches. It grows with the number of columns and shrinks if readers usually scroll through the whole report.

    **When it saves little or nothing:**
    - Reports with only a few columns. Everything is on screen anyway.
    - Pages that are opened rarely, or only from local disk. There is no network cost to save.
    - Readers who always scroll to the bottom. Every image loads in the end.

    **How to get your own number:**
    1. Quick proxy: open a real report in Chrome DevTools, Network tab, with cache disabled. Note the transferred bytes and image count on load. Do it again with the change and compare.
    2. Real energy: run both versions as a Green Metrics Tool browser usage scenario. Load the page, scroll as a typical reader does, and compare CPU energy. If most readers stop after the first screen, scroll only that far.
    3. Multiply the per-open difference by how often the reports are opened.

    The change is cheap and safe, so it is worth making before you have the exact figure. Keep the first images above the fold eager, and add `width` and `height` so the page does not jump while images load.

    ```javascript
    const EAGER_COUNT = 4; // cards likely visible without scrolling

    function renderColumnCards(columns) {
      return columns.map((col, i) => `
        <section class="col-card">
          <h3>${col.name}</h3>
          <p>${col.nullPct}% null, ${col.distinct} distinct values</p>
          <img src="hist/${col.name}.png" alt="Histogram of ${col.name}"
               width="480" height="240"${i >= EAGER_COUNT ? ' loading="lazy"' : ''}>
        </section>`).join('\n');
    }
    ```

    **Green Notes**
    - **Defer offscreen images** (reduces E, network): histograms below the first screen are loaded only when the reader scrolls near them. https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
    - *Not applied:* lazy loading on the first cards. They are visible at once, and delaying them would only slow the first view. Set `width` and `height` to match your real PNG size.
verify:
  test: |-
    const assert = require('assert');
    const cols = Array.from({ length: 30 }, (_, i) => ({ name: 'c' + i, nullPct: 1, distinct: 2 }));
    const html = renderColumnCards(cols);
    assert.strictEqual((html.match(/<img /g) || []).length, 30);
    assert.strictEqual((html.match(/loading="lazy"/g) || []).length, 26);
    assert.ok(html.includes('hist/c0.png'));
    assert.ok(!/hist\/c0\.png"[^>]*loading="lazy"/.test(html));
    assert.ok(/hist\/c29\.png"[^>]*loading="lazy"/.test(html));
