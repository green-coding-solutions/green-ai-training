messages:
- role: user
  content: |
    We run a small web dashboard for our ML inference service (it shows latency, request counts and model versions per deployment). It is used by about 40 engineers, mostly on laptops, and each of them opens it many times a day. Right now the CSS loads 6 local TTF files (Inter in regular, medium, semibold, bold, plus two JetBrains Mono weights), around 4 MB total:

    ```css
    @font-face { font-family: "Inter"; font-weight: 400; src: url("/static/fonts/Inter-Regular.ttf") format("truetype"); }
    @font-face { font-family: "Inter"; font-weight: 500; src: url("/static/fonts/Inter-Medium.ttf") format("truetype"); }
    @font-face { font-family: "Inter"; font-weight: 600; src: url("/static/fonts/Inter-SemiBold.ttf") format("truetype"); }
    @font-face { font-family: "Inter"; font-weight: 700; src: url("/static/fonts/Inter-Bold.ttf") format("truetype"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("/static/fonts/JetBrainsMono-Regular.ttf") format("truetype"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("/static/fonts/JetBrainsMono-Bold.ttf") format("truetype"); }

    body { font-family: "Inter", sans-serif; }
    code, .metric { font-family: "JetBrains Mono", monospace; }
    ```

    Requirements: our designer wants the look to stay close to what we have, and we need tabular numbers in the metric tables. Before I spend a day on this, how much energy would we save if we changed the fonts? I need a number to put in the ticket.
- role: assistant
  content: |
    I can't give you a number for your dashboard, and a made-up one would be worse than none for the ticket. What I can give you is a measured comparison and the direction.

    In Green Metrics Tool browser benchmarks (30 cold page loads, client CPU energy), six local TTF files (~4 MB) used ~556 J. Two Latin-subset WOFF2 files (~55 KB) used ~488 J, about 12% less. The system font stack used ~410 J, about 26% less than TTF.

    The saving depends on how often fonts are really loaded cold. Those runs used an empty cache on every load. Your 40 engineers will have the fonts cached after the first visit, so the repeated saving is likely smaller than in the benchmark. The first load per browser, and every cache clear or font change, still pays for the full 4 MB.

    The cheapest change that keeps the look close is subsetting and converting to WOFF2, with fewer weights:

    ```css
    @font-face {
      font-family: "Inter";
      font-weight: 400 700;
      font-display: swap;
      src: url("/static/fonts/Inter-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+2013-2014, U+2018-201D, U+2022, U+2026;
    }

    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 400;
      font-display: swap;
      src: url("/static/fonts/JetBrainsMono-Regular-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF;
    }

    body { font-family: "Inter", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    code, .metric { font-family: "JetBrains Mono", ui-monospace, monospace; }
    ```

    - Use one variable Inter file for 400-700 if you can. That replaces four files with one.
    - `tabular-nums` works with Inter. It also works with the system stack on most platforms, so the metric tables keep aligned digits either way.
    - Dropping the web fonts completely (`system-ui, ui-monospace`) is the lowest-energy option. It changes the look, so it is a design decision, not a free win.

    To get your own number for the ticket, load the dashboard cold 30 times with each version in a Green Metrics Tool usage scenario and compare the CPU energy. For a quick proxy, check the transferred bytes in the browser dev tools. Then you have a measured figure for your own pages instead of a borrowed one.
