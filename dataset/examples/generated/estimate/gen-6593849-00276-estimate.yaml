id: gen-6593849-00276-estimate
category: estimate
language: bash
patterns:
- bash-quoting
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    We have a build script that generates landing page variants for A/B tests. It runs in CI on every merge to main, roughly 30 merges a week, and builds about 200 variants each time. My manager wants a number for our sustainability report: how many kg CO2 per year do we save if we switch the plain strings to single quotes?

    Requirements: the output files must stay byte-identical, the `$variant` and `$LOCALE` values must still be inserted, and I don't want a big rewrite.

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    OUT="dist/variants"
    LOCALE="${LOCALE:-en}"
    mkdir -p "$OUT"

    for variant in $(seq 1 200); do
      style="body{margin:0;font-family:system-ui,sans-serif;color:#222}.hero{padding:4rem 1rem;text-align:center;background:#f6f8fa}.hero h1{font-size:2.5rem;margin:0 0 1rem}.cta{display:inline-block;padding:.8rem 1.6rem;background:#0a7d3b;color:#fff;border-radius:6px;text-decoration:none}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;padding:2rem}.footer{padding:2rem;font-size:.85rem;color:#666}"
      cta="<a class=\"cta\" href=\"/signup?v=${variant}&lang=${LOCALE}\">Start free</a>"
      footer="<footer class=\"footer\">All rights reserved. Imprint and privacy policy available on request.</footer>"
      {
        echo "<!doctype html><html lang=\"${LOCALE}\"><head><meta charset=\"utf-8\"><style>${style}</style></head>"
        echo "<body><section class=\"hero\"><h1>Ship faster</h1>${cta}</section>${footer}</body></html>"
      } > "${OUT}/variant-${variant}.html"
    done
    ```
- role: assistant
  content: |
    I can't give you a trustworthy kg CO2 figure for this, and I would not put one in a report. The saving is real but very small, and any number I made up would not hold up.

    **Measured reference:** in Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes than with double quotes (1,000,000 iterations: ~314 J vs ~237 J). With 10,000 iterations the saving was about 14%. Bash scans double-quoted text for `$`, backticks and backslashes. It takes single-quoted text as is.

    **Why this doesn't scale to your case:**
    - That figure covers only the quoting work, not the whole script.
    - Your loop runs 200 times per build, far below the iteration counts measured.
    - Your literals are a few hundred characters, not 6,200.
    - Each variant also writes a file. The quoting is a small part of that.

    So the honest answer is directional: a small saving per build, with no reliable total. The change is still free, because it keeps the output identical:

    ```bash
    for variant in $(seq 1 200); do
      style='body{margin:0;font-family:system-ui,sans-serif;color:#222}.hero{padding:4rem 1rem;text-align:center;background:#f6f8fa}.hero h1{font-size:2.5rem;margin:0 0 1rem}.cta{display:inline-block;padding:.8rem 1.6rem;background:#0a7d3b;color:#fff;border-radius:6px;text-decoration:none}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;padding:2rem}.footer{padding:2rem;font-size:.85rem;color:#666}'
      cta="<a class=\"cta\" href=\"/signup?v=${variant}&lang=${LOCALE}\">Start free</a>"
      footer='<footer class="footer">All rights reserved. Imprint and privacy policy available on request.</footer>'
      {
        echo "<!doctype html><html lang=\"${LOCALE}\"><head><meta charset=\"utf-8\"><style>${style}</style></head>"
        echo "<body><section class=\"hero\"><h1>Ship faster</h1>${cta}</section>${footer}</body></html>"
      } > "${OUT}/variant-${variant}.html"
    done
    ```

    - `style` and `footer` have no expansion, so they use single quotes. The footer also loses its escaped quotes.
    - `cta` and the `echo` lines insert `$variant` and `$LOCALE`, so they keep double quotes.
    - Variables stay quoted everywhere else. Don't remove those quotes.

    **How to measure it yourself:**
    1. Run the old and new script in a Green Metrics Tool usage scenario, or at least compare `perf stat` CPU time over 20 or more runs. Check first that `diff -r` shows the outputs are identical.
    2. Expect the difference to be close to measurement noise at this size.
    3. For the report, write "applied single-quote rule, small saving, not measured at our scale". If you want a number, use the measurement from step 1, not an extrapolation from the benchmark.
verify:
  static_only: bash script writes files; no stdlib Python or JavaScript to test
