id: gen-2-00433-estimate
category: estimate
language: html
patterns:
- modern-image-formats
facts:
- F-IMGRENDER
- F-IMGENC
messages:
- role: user
  content: |
    Hello, we have landing page for our small bike rental in Lisbon. Now all pictures are JPG, about 12 pictures on the page. My collegue say we must change all to AVIF and then the website use much less energy. My boss ask me how many percent we will save, he want a number for the sustainability page. Can you tell me the number? We have picture like this now:

    ```html
    <section class="hero">
      <img src="img/hero-bikes.jpg" alt="Rental bikes in front of the shop" width="1600" height="900">
    </section>
    ```
- role: assistant
  content: |
    I can't give you an honest percentage for your site. The measurements I know don't give a number for "JPG to AVIF" on a real page, so any figure would be invented.

    What was measured, in Green Metrics Tool micro-benchmarks:

    - **Viewing:** in 50 page loads per format, the browser used ~134 J for JPG and ~159 J for AVIF. AVIF decoding cost about 19% more CPU on the visitor's device.
    - **Encoding:** encoding 50 images took ~89 J for JPG and ~658 J for AVIF, about 7× more.

    That test ran on a local network, so it does not show the main benefit of AVIF: fewer transferred bytes. Your saving comes from smaller files on the network, and that depends on your photos and quality settings. It is not a fixed percentage. Your colleague may be right on bytes, but "much less energy" is not guaranteed.

    If you want to try it, encode once when you build the site, not on each request, and keep a JPG fallback:

    ```html
    <section class="hero">
      <picture>
        <source srcset="img/hero-bikes.avif" type="image/avif">
        <img src="img/hero-bikes.jpg" alt="Rental bikes in front of the shop" width="1600" height="900">
      </picture>
    </section>
    ```

    To get a number for your boss, measure it:
    1. Convert the 12 pictures and compare the total file size before and after. This is a real number you can quote.
    2. Load the page 20-50 times with an empty cache in both versions, and compare CPU energy with a Green Metrics Tool usage scenario or at least `perf stat`.

    For the sustainability page, write what you measured, for example "page weight went from X MB to Y MB". Don't write an energy percentage you did not measure.
verify:
  static_only: HTML snippet only, no executable code
