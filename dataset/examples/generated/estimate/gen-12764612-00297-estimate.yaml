    ```python
    #!/usr/bin/env python3
    import argparse
    import sys


    def unique_lines(lines):
        # keeps first occurrence, skips blanks and comments
        # would a set save energy here? how much?
        seen = []
        out = []
        for line in lines:
            line = line.strip()
            if not line or line.startswith('#'):
                continue
            if line not in seen:
                seen.append(line)
                out.append(line)
        return out


    def main():
        p = argparse.ArgumentParser()
        p.add_argument('path')
        p.add_argument('-o', '--output', default='-')
        args = p.parse_args()
        with open(args.path, encoding='utf-8') as f:
            result = unique_lines(f)
        dest = sys.stdout if args.output == '-' else open(args.output, 'w', encoding='utf-8')
        try:
            dest.write('\n'.join(result) + '\n')
        finally:
            if dest is not sys.stdout:
                dest.close()


    if __name__ == '__main__':
        main()
    ```

