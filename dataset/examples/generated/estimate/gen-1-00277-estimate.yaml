id: gen-1-00277-estimate
category: estimate
language: python
patterns:
- keep-star-imports
facts:
- F-IMPORT
messages:
- role: user
  content: |
    how much energy do we save per run if I switch these to explicit imports? runs ~150k times a day from cron on the gateways

    ```python
    #!/usr/bin/env python3
    from os import *
    from sys import *

    SPOOL = argv[1] if len(argv) > 1 else "/var/spool/gw"


    def main():
        empty = []
        for name in sorted(listdir(SPOOL)):
            full = path.join(SPOOL, name)
            if path.isfile(full) and path.getsize(full) == 0:
                empty.append(name)
        for name in empty:
            print(name)
        exit(1 if empty else 0)


    if __name__ == "__main__":
        main()
    ```
- role: assistant
  content: |
    None that you can measure. I would leave the imports as they are.

    **Measured reference:** in Green Metrics Tool micro-benchmarks, 1,000 Python process starts that each import a module showed no energy difference between `from x import *` and `import x`. With `posix`, both used ~121 J. With `sympy`, `from sympy import *` used ~3103 J and `import sympy` ~3093 J. The import style does not change the cost. What costs energy is loading a heavy module at all, and your script only loads small built-in modules.

    So there is no per-run saving to multiply by 150k. I won't give a number, because the measured difference is zero within noise.

    A star import can still hurt readability and linters, and `from os import *` replaces the builtin `open` with `os.open`. That is a maintenance reason, not an energy one. If you want explicit imports for that, go ahead, but don't count it as a saving.

    **How to check on your gateways:** compare both versions with a CPU-time proxy over many runs:

    ```bash
    perf stat -r 500 python3 spool_check_star.py /var/spool/gw >/dev/null
    perf stat -r 500 python3 spool_check_explicit.py /var/spool/gw >/dev/null
    ```

    For energy, run the same loop as a usage scenario in the Green Metrics Tool, or read RAPL where the hardware supports it. Expect the two results to be within noise.
verify:
  static_only: estimate answer; the pasted script reads a spool directory and measurement commands need perf
