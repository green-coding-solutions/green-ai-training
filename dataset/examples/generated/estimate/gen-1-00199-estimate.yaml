id: gen-1-00199-estimate
category: estimate
language: html
patterns:
- dom-size
- select-columns
messages:
- role: user
  content: |
    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Audit log</title>
      <link rel="stylesheet" href="/static/admin.css">
    </head>
    <body>
      <h1>API audit log</h1>
      <p id="status">Loading...</p>
      <table id="audit" class="grid">
        <thead>
          <tr><th>Time</th><th>User</th><th>Method</th><th>Path</th><th>Status</th><th>ms</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <script>
        // ~8000 entries per day, support opens this a few times a day
        async function load() {
          const res = await fetch('/api/v1/audit-log?since=0');
          const entries = await res.json();
          const body = document.getElementById('rows');
          for (const e of entries) {
            body.innerHTML += `<tr class="${e.status >= 500 ? 'err' : ''}">
              <td><span>${new Date(e.ts).toLocaleString()}</span></td>
              <td><span>${e.user}</span></td>
              <td><span>${e.method}</span></td>
              <td><span>${e.path}</span></td>
              <td><span>${e.status}</span></td>
              <td><span>${e.ms}</span></td>
            </tr>`;
          }
          document.getElementById('status').textContent = entries.length + ' entries';
        }
        load();
      </script>
    </body>
    </html>
    ```

    ?
- role: assistant
  content: |
    I read this as: "is this wasteful, and how much would fixing it save?" Yes, it is wasteful. I can't give you a joule or CO2 figure without measuring your page, but the cause is clear.

    **Why it costs more than it needs to:**
    - The page builds all ~8000 entries at once. With 6 cells and a `<span>` in each, that is roughly 8000 × 13 = 100,000 DOM nodes. Almost all of them are off screen.
    - `body.innerHTML += ...` inside the loop re-serializes and re-parses everything already in the table on every pass. The work grows quadratically with the number of entries.
    - The API sends the full day's log, even though support reads maybe the first screen.

    **Fix:** page on the server, and render only one page of rows, in one DOM write.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Audit log</title>
      <link rel="stylesheet" href="/static/admin.css">
    </head>
    <body>
      <h1>API audit log</h1>
      <p id="status">Loading...</p>
      <table id="audit" class="grid">
        <thead>
          <tr><th>Time</th><th>User</th><th>Method</th><th>Path</th><th>Status</th><th>ms</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <button id="prev" type="button">Previous</button>
      <button id="next" type="button">Next</button>

      <script>
        const PAGE_SIZE = 50;
        let offset = 0;

        const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        async function load() {
          const res = await fetch(`/api/v1/audit-log?limit=${PAGE_SIZE}&offset=${offset}`);
          const { entries, total } = await res.json();
          document.getElementById('rows').innerHTML = entries.map((e) =>
            `<tr class="${e.status >= 500 ? 'err' : ''}">` +
            `<td>${esc(new Date(e.ts).toLocaleString())}</td>` +
            `<td>${esc(e.user)}</td><td>${esc(e.method)}</td>` +
            `<td>${esc(e.path)}</td><td>${esc(e.status)}</td><td>${esc(e.ms)}</td></tr>`
          ).join('');
          document.getElementById('status').textContent =
            `${offset + 1}-${offset + entries.length} of ${total}`;
          document.getElementById('prev').disabled = offset === 0;
          document.getElementById('next').disabled = offset + PAGE_SIZE >= total;
        }

        document.getElementById('prev').onclick = () => { offset = Math.max(0, offset - PAGE_SIZE); load(); };
        document.getElementById('next').onclick = () => { offset += PAGE_SIZE; load(); };
        load();
      </script>
    </body>
    </html>
    ```

    The endpoint now needs `limit`, `offset` and a `total` count. Add an index on the timestamp column so the query doesn't scan the whole log.

    **Green Notes**
    - **Avoid excessive DOM size** (reduces E on the client): about 50 rows instead of ~8000, so far fewer nodes to build, style and lay out. Pattern
    - **Reduce transmitted data** (reduces network): each request carries one page, not the whole day. Pattern
    - **One DOM write instead of `+=` in a loop** (reduces E): removes the repeated re-parse of the whole table.
    - Behavior change: you can no longer use Ctrl+F across the whole day. If support needs that, add a server-side search parameter.

    **How to measure the saving on your own data:**
    1. Run the old and new page in Chrome DevTools. In the Performance panel, compare scripting plus rendering time. In Lighthouse, compare the DOM element count.
    2. Compare the response size of the audit-log request in the Network tab.
    3. For energy, script both pages as Green Metrics Tool browser scenarios (load page, wait, click "Next" once) and compare the measured CPU energy.
    4. Multiply the per-visit difference by your real visit count. If support opens it only a few times a day, the total saving is small. The fix is still worth it because it is simple and makes the page faster.
verify:
  static_only: HTML page with fetch calls to a backend endpoint; needs a browser and an API
