id: gen-12764612-00092-estimate
category: estimate
language: bash
patterns:
- bash-quoting
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    hi, i'm new to bash. i wrote this to add our cookie banner to every language page of the landing site. it works but a coworker said the quotes are "wrong" and it wastes energy?? i dont understand what is wrong. how much would we save if I fix it?

    ```bash
    #!/bin/bash
    # adds the cookie banner to every language page of the landing site
    SITE_DIR="$1"

    for page in "$SITE_DIR"/*/index.html; do
      lang=$(basename "$(dirname "$page")")
      style="<style>.cookie-banner{position:fixed;bottom:0;left:0;right:0;padding:16px;background:#222;color:#fff;font-family:sans-serif}.cookie-banner button{margin-left:12px;padding:6px 14px;border:0;border-radius:4px;background:#2e7d32;color:#fff;cursor:pointer}</style>"
      banner="<div id=\"cookie-banner\" class=\"cookie-banner\" role=\"dialog\" aria-label=\"Cookie settings\"><span>We use cookies to improve your visit.</span><button type=\"button\" id=\"cookie-accept\">Accept</button></div>"

      if grep -q "cookie-banner" "$page"; then
        echo "skip $lang"
        continue
      fi

      content=$(<"$page")
      before="${content%%</body>*}"
      after="${content#*</body>}"
      printf '%s%s%s</body>%s\n' "$before" "$style" "$banner" "$after" > "$page"
      echo "patched $lang"
    done
    ```
- role: assistant
  content: |-
    Your script is correct. The only thing your coworker means is this: `style`, `banner` and the `grep` pattern use double quotes, but they contain no `$`, backticks or backslash that bash has to expand. Bash still scans double-quoted text for those characters. Single-quoted text is taken as is. The `\"` escapes in `banner` also disappear with single quotes, so the line is easier to read.

    **How much will you save?** I can't give you a reliable number for your site without measuring. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes than with double quotes. That was 1,000,000 iterations: ~314 J vs ~237 J. At 100,000 iterations it was also about 24%, and at 10,000 iterations about 14%.

    Your literals are much shorter than 6,200 characters, and the loop runs once per language page. So expect the same direction, but a very small absolute saving. The saving grows with literal length and loop count. Honestly, this is a tidy-up that costs nothing, not something that will change your footprint.

    Here is the same script with single quotes where nothing needs expanding:

    ```bash
    #!/bin/bash
    # adds the cookie banner to every language page of the landing site
    SITE_DIR="$1"

    for page in "$SITE_DIR"/*/index.html; do
      lang=$(basename "$(dirname "$page")")
      style='<style>.cookie-banner{position:fixed;bottom:0;left:0;right:0;padding:16px;background:#222;color:#fff;font-family:sans-serif}.cookie-banner button{margin-left:12px;padding:6px 14px;border:0;border-radius:4px;background:#2e7d32;color:#fff;cursor:pointer}</style>'
      banner='<div id="cookie-banner" class="cookie-banner" role="dialog" aria-label="Cookie settings"><span>We use cookies to improve your visit.</span><button type="button" id="cookie-accept">Accept</button></div>'

      if grep -q 'cookie-banner' "$page"; then
        echo "skip $lang"
        continue
      fi

      content=$(<"$page")
      before="${content%%</body>*}"
      after="${content#*</body>}"
      printf '%s%s%s</body>%s\n' "$before" "$style" "$banner" "$after" > "$page"
      echo "patched $lang"
    done
    ```

    The output is identical. I kept double quotes around `"$page"`, `"$SITE_DIR"` and `"skip $lang"`, because those need expansion or protect paths with spaces. Never remove quotes around variables.

    **How to measure it yourself:**
    1. Quick CPU-time proxy: copy your site folder, run `time ./add-banner.sh copy-of-site` for the old script, restore the copy, and run it again for the new script. At this size the difference will be inside the noise.
    2. Real energy: run both versions as a Green Metrics Tool usage scenario on the same machine and compare the CPU energy.
