messages:
- role: user
  content: |
    hello, we have small status page on our IoT gateway (runs on a little arm box, 3-4 technicans open it sometimes). The "heartbeat" dot blink every time a new telemetry message came from the sensors. My colegue say I should rewrite it with requestAnimationFrame because it is more smooth and "more modern". I am not sure. Is it better? Or can you make it more efficient?

    ```js
    const dot = document.querySelector('#hb-dot');
    const tempEl = document.querySelector('#temp');
    const ws = new WebSocket(`ws://${location.host}/telemetry`);

    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      tempEl.textContent = msg.temp.toFixed(1);
      dot.classList.toggle('offline', !msg.online);

      // restart blink animation
      dot.classList.remove('blink');
      void dot.offsetWidth;
      dot.classList.add('blink');
    };
    ```

    ```css
    #hb-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #2ecc71;
    }
    #hb-dot.offline { background: #e74c3c; }
    #hb-dot.blink { animation: hb 0.6s ease-out; }

    @keyframes hb {
      from { transform: scale(1.6); opacity: 0.4; }
      to   { transform: scale(1);   opacity: 1; }
    }
    ```
- role: assistant
  content: |
    Keep it as it is. This is already the efficient version, and a `requestAnimationFrame` rewrite would be worse.

    - **The animation runs in CSS.** Your JS only runs when a message arrives. It updates the text and restarts the blink. Between messages no script runs for the dot.
    - **It animates `transform` and `opacity`.** These are the cheap properties to animate, so it is smooth without any JS help.
    - **`requestAnimationFrame` means JS on every frame.** In Green Metrics Tool micro-benchmarks of a 20-second animation in a real browser, JS `requestAnimationFrame` with style updates used ~161 J and CSS `@keyframes` ~145 J. That is about 10% less for CSS. A rewrite would cost you more energy, more code, and a loop you have to start and stop yourself.

    The "smoother" argument does not hold for this animation. The browser can run a CSS animation like this one very well.

    The `void dot.offsetWidth` line is the usual trick to restart a CSS animation. At one message per sensor update, it is fine.

    The 10% difference is also small. For a page that 3-4 technicians open sometimes, there is nothing more to gain here.
verify:
  static_only: needs a browser DOM and a WebSocket server
