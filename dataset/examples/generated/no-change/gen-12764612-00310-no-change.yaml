messages:
- role: user
  content: |
    Diff only please. Anything to change on the images for energy? Model card page for our inference service. The avif/webp/jpg files are built once per release in CI (avifenc, cwebp), not at request time.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>defect-clf v3.2 - model card</title>
      <link rel="stylesheet" href="/static/modelcard.css">
    </head>
    <body>
      <header>
        <svg class="logo" width="28" height="28" viewBox="0 0 28 28" aria-label="Vision Team">
          <path d="M4 4h20v20H4z" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="14" cy="14" r="5" fill="currentColor"/>
        </svg>
        <h1>defect-clf v3.2</h1>
      </header>

      <section id="overview">
        <picture>
          <source type="image/avif" srcset="/img/pipeline-800.avif 800w, /img/pipeline-1600.avif 1600w" sizes="(max-width: 900px) 100vw, 900px">
          <source type="image/webp" srcset="/img/pipeline-800.webp 800w, /img/pipeline-1600.webp 1600w" sizes="(max-width: 900px) 100vw, 900px">
          <img src="/img/pipeline-1600.jpg" srcset="/img/pipeline-800.jpg 800w, /img/pipeline-1600.jpg 1600w"
               sizes="(max-width: 900px) 100vw, 900px" width="1600" height="900"
               alt="Inference pipeline: capture, resize, classify, report">
        </picture>
        <p>Classifies photos of machined parts as OK, scratch or dent.</p>
      </section>

      <section id="eval">
        <h2>Evaluation</h2>
        <picture>
          <source type="image/avif" srcset="/img/confusion-800.avif">
          <source type="image/webp" srcset="/img/confusion-800.webp">
          <img src="/img/confusion-800.jpg" width="800" height="800" loading="lazy"
               alt="Confusion matrix on the held-out test set">
        </picture>
      </section>
    </body>
    </html>
    ```
- role: assistant
  content: |
    No diff. This is already the efficient setup.

    **Green Notes**
    - **Modern image formats** (reduces network): the `<picture>` chain serves AVIF, then WebP, then a JPEG fallback, with `srcset` sizes. Clients get the smallest file they support. The gain is fewer transferred bytes. In Green Metrics Tool micro-benchmarks (50 page loads) AVIF decoding cost about 19% more client CPU than JPEG, so the format pays off through bytes, not decode work.
    - **Encode once** (reduces E): AVIF encoding cost about 7× JPEG in the same benchmarks (50 BMP images). Doing it in CI once per release is the right place. Never do it per request.
    - **Icon as SVG**: the logo is inline SVG, which beats any raster format at that size.
    - **Lazy loading**: only the below-the-fold confusion matrix has `loading="lazy"`. The above-the-fold pipeline image does not, which is correct. The explicit `width` and `height` also avoid layout shifts.

    *Not applied:* anything further. A change here would add build and markup work without a clear saving.
verify:
  static_only: HTML-only example, no executable code
