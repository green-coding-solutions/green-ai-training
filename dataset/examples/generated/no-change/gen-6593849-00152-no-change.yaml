id: gen-6593849-00152-no-change
category: no-change
language: sql
patterns:
- select-columns
- context-tradeoff
facts:
- F-PG-SELECT
- F-PG-COLUMNS
messages:
- role: user
  content: |
    Gateway firmware, SQLite buffer on the device. Diff only please. Reviewer wants `SELECT *` replaced with a column list. The `readings_buffer` table has 6 columns: `id`, `sensor_id`, `ts`, `value`, `status` (all INTEGER or REAL) and `sent` (0/1 flag). The uplink payload uses everything except `sent`. Flush runs every 10 s.

    ```sql
    SELECT *
    FROM readings_buffer
    WHERE sent = 0
    ORDER BY id
    LIMIT 500;

    DELETE FROM readings_buffer
    WHERE id <= :last_acked_id AND sent = 0;
    ```
- role: assistant
  content: |
    No diff needed for energy. The only column you would skip is `sent`, a 0/1 integer. Skipping it saves nothing you could measure.

    The measured gains came from the opposite case. In Green Metrics Tool micro-benchmarks on PostgreSQL, naming 10 columns instead of `SELECT *` on a 52-column table with large text columns used about 5.5-7× less energy. The saving grows with the size of the data in the skipped columns. Your table has 6 narrow columns and no text or blob column, so the saving is close to zero. The query already has `ORDER BY id LIMIT 500` on the primary key, which is the part that matters here.

    If the reviewer wants the list for another reason, it is a fine style change. It makes the payload shape explicit and keeps a future blob column out of the flush query:

    ```diff
    -SELECT *
    +SELECT id, sensor_id, ts, value, status
     FROM readings_buffer
    ```

    Treat that as schema hygiene, not an energy fix. If someone adds a wide column to this table later, the column list starts to pay off.
verify:
  static_only: no code change is proposed as an energy fix; the answer only shows an optional style diff of a SQLite query
