id: gen-1-00175-no-change
category: no-change
language: yaml
patterns:
- minimize-environments
- context-tradeoff
messages:
- role: user
  content: |
    Hello, we have small team (5 dev) and one inference service for sentiment model. I made this github workflow for preview env on every pull request. My manager ask me to make it "more green", like turn off things in the night. Is there something I should to change? I think maybe is already ok but I am not sure

    ```yaml
    name: preview-env

    on:
      pull_request:
        types: [opened, synchronize, reopened, closed]
      schedule:
        - cron: "30 2 * * *"

    concurrency:
      group: preview-${{ github.event.pull_request.number || 'cleanup' }}
      cancel-in-progress: true

    jobs:
      deploy:
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Deploy preview
            run: |
              NS=pr-${{ github.event.pull_request.number }}
              kubectl create namespace $NS --dry-run=client -o yaml | kubectl apply -f -
              kubectl label namespace $NS preview=true --overwrite
              helm upgrade --install sentiment ./chart -n $NS \
                --set image.tag=${{ github.sha }} \
                --set model.variant=distilled-int8 \
                --set replicaCount=1 \
                --set resources.limits.cpu=1 \
                --set resources.limits.memory=2Gi

      teardown:
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        steps:
          - name: Delete preview
            run: kubectl delete namespace pr-${{ github.event.pull_request.number }} --ignore-not-found

      cleanup-stale:
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        steps:
          - name: Delete previews older than 3 days
            run: |
              kubectl get ns -l preview=true \
                -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.creationTimestamp}{"\n"}{end}' |
              while read -r name created; do
                if [ "$(date -d "$created" +%s)" -lt "$(date -d '3 days ago' +%s)" ]; then
                  kubectl delete namespace "$name" --ignore-not-found
                fi
              done
    ```
- role: assistant
  content: |
    This is already a good setup. I would not change it for "green" reasons.

    Why it is already efficient:
    - **Environments only live while needed.** A preview is created when the PR opens and deleted when it closes. That is the main idea of minimizing deployed environments.
    - **A safety net exists.** The nightly job removes previews that are older than 3 days. This catches PRs where the close event was missed or the teardown failed.
    - **Each preview is small.** One replica, 1 CPU, 2Gi memory, and the `distilled-int8` model variant. No GPU is reserved for a preview.
    - **No duplicate runs.** The `concurrency` group cancels old deploys of the same PR when you push again.

    Why I would not add night shutdown here:
    - Previews are short-lived, so a night schedule adds a second lifecycle (scale down, scale up, wake-up failures) for little gain.
    - With 5 developers, a few small CPU pods are cheap. The extra workflow code and the risk of broken previews in the morning would cost more than they save.

    Only if you later see previews that stay open for weeks, for example long-running PRs, would I change one thing: lower the stale limit from 3 days to 1 or 2 days. It is a one-word change in the `date -d` line. Do it only if your team can live with a preview being rebuilt after a pause.

    Tell your manager: the environments are already created on demand and removed automatically, and there is nothing left to switch off at night.
verify:
  static_only: YAML GitHub workflow needing kubectl, helm and a cluster; no code change in the answer
