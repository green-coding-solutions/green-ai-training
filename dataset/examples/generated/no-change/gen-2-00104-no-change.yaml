id: gen-2-00104-no-change
category: no-change
language: python
patterns:
- vectorize-or-jit
- context-tradeoff
facts:
- F-NUMBA
messages:
- role: user
  content: |
    hi, I'm a first year PhD student and I'm new to Python. I wrote this to analyse our calcium imaging recordings. Each recording is a .npy file with about 500 cells × 18000 frames. Our group wants to make the analysis "greener", and a postdoc told me to put numba `@njit` on everything because it makes Python fast. I put `@njit` on `summarize` and it crashed with a long TypingError I don't understand. Did I do something wrong? Is my code bad? It takes about 2 seconds per recording and we run it on maybe 20 recordings a week.

    ```python
    import numpy as np


    def delta_f_over_f(traces, baseline_pct=10):
        """traces: (n_cells, n_frames) raw fluorescence."""
        f0 = np.percentile(traces, baseline_pct, axis=1, keepdims=True)
        return (traces - f0) / f0


    def count_events(dff, threshold=0.5):
        above = dff > threshold
        # rising edges: frame is above, previous frame was not
        onsets = above[:, 1:] & ~above[:, :-1]
        return onsets.sum(axis=1) + above[:, 0]


    def summarize(path, fps=30.0):
        traces = np.load(path)
        dff = delta_f_over_f(traces)
        events = count_events(dff)
        minutes = traces.shape[1] / fps / 60
        rate = events / minutes
        peak = dff.max(axis=1)
        return {
            "n_cells": traces.shape[0],
            "mean_rate_per_min": float(rate.mean()),
            "median_peak_dff": float(np.median(peak)),
            "active_fraction": float((events > 0).mean()),
        }


    if __name__ == "__main__":
        import sys

        stats = summarize(sys.argv[1])
        for key, value in stats.items():
            print(f"{key}: {value:.3f}")
    ```
- role: assistant
  content: |
    Your code is fine, and numba is the wrong tool for it. Remove the `@njit` and keep the code as it is.

    **Why numba doesn't help here**
    - Numba pays off for CPU-bound **pure Python loops** that touch one number at a time. In Green Metrics Tool micro-benchmarks, quantizing 10,000,000 samples in a plain Python `for` loop used about 4× more CPU energy than the same loop compiled with `@njit`. Your code has no such loop.
    - Every step already works on whole arrays: `np.percentile(..., axis=1)`, the comparisons, `&`, `.sum(axis=1)` and `.max(axis=1)` all run in NumPy's compiled code. Numba has nothing left to speed up. On top of that, it would add compile time every time a new process starts.
    - The crash is expected. `@njit` only supports part of Python and NumPy. `np.load` (file reading) doesn't work inside it, and `np.percentile` with `axis=`/`keepdims=` isn't supported either. You would have to rewrite working code into loops just to make numba accept it.

    **Context:** a couple of seconds per recording, a few times a week, is small. Your time spent rewriting and debugging costs more than the script ever will. The greenest choice here is to leave it alone.

    Unchanged:

    ```python
    import numpy as np


    def delta_f_over_f(traces, baseline_pct=10):
        """traces: (n_cells, n_frames) raw fluorescence."""
        f0 = np.percentile(traces, baseline_pct, axis=1, keepdims=True)
        return (traces - f0) / f0


    def count_events(dff, threshold=0.5):
        above = dff > threshold
        # rising edges: frame is above, previous frame was not
        onsets = above[:, 1:] & ~above[:, :-1]
        return onsets.sum(axis=1) + above[:, 0]


    def summarize(path, fps=30.0):
        traces = np.load(path)
        dff = delta_f_over_f(traces)
        events = count_events(dff)
        minutes = traces.shape[1] / fps / 60
        rate = events / minutes
        peak = dff.max(axis=1)
        return {
            "n_cells": traces.shape[0],
            "mean_rate_per_min": float(rate.mean()),
            "median_peak_dff": float(np.median(peak)),
            "active_fraction": float((events > 0).mean()),
        }


    if __name__ == "__main__":
        import sys

        stats = summarize(sys.argv[1])
        for key, value in stats.items():
            print(f"{key}: {value:.3f}")
    ```

    Numba becomes worth a look if you later write a step that really needs a per-frame Python loop, for example a recursive filter where each value depends on the one before. Then put `@njit` on that small loop function only, and keep the file loading and summary code outside it.
verify:
  module: true
  test: |-
    import os
    import tempfile
    import numpy as np

    t = np.array([[10, 10, 20, 20, 10, 20], [5, 5, 5, 5, 5, 5]], dtype=float)
    d = delta_f_over_f(t)
    assert np.allclose(d[0], [0, 0, 1, 1, 0, 1])
    assert np.allclose(d[1], 0)
    assert count_events(d).tolist() == [2, 0]

    with tempfile.TemporaryDirectory() as tmp:
        p = os.path.join(tmp, "rec.npy")
        np.save(p, t)
        s = summarize(p, fps=0.1)
    assert s["n_cells"] == 2
    assert abs(s["mean_rate_per_min"] - 1.0) < 1e-9
    assert abs(s["median_peak_dff"] - 0.5) < 1e-9
    assert abs(s["active_fraction"] - 0.5) < 1e-9
