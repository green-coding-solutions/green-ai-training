- role: user
  content: |
    ?

    ```python
    from urllib.parse import parse_qs

    SORT_COLUMNS = {
        "created": "created_at",
        "total": "total_cents",
        "status": "status",
    }
    MAX_LIMIT = 100


    class BadRequest(Exception):
        def __init__(self, message):
            super().__init__(message)
            self.message = message


    def parse_list_params(query_string):
        params = parse_qs(query_string)

        try:
            limit = int(params.get("limit", ["25"])[0])
            offset = int(params.get("offset", ["0"])[0])
        except ValueError:
            raise BadRequest("limit and offset must be integers")

        if not 1 <= limit <= MAX_LIMIT or offset < 0:
            raise BadRequest("limit or offset out of range")

        column = SORT_COLUMNS.get(params.get("sort", ["created"])[0])
        if column is None:
            raise BadRequest("unknown sort field")

        return limit, offset, column


    def list_orders(db, customer_id, query_string):
        limit, offset, column = parse_list_params(query_string)
        sql = (
            "SELECT id, status, total_cents, created_at FROM orders "
            f"WHERE customer_id = ? ORDER BY {column} DESC LIMIT ? OFFSET ?"
        )
        return db.execute(sql, (customer_id, limit, offset)).fetchall()
    ```
- role: assistant
  content: |
    This is already efficient. I wouldn't change anything for energy.

    - **The `try/except ValueError` is fine.** The exception is only raised for malformed input, and that request ends in a 400 anyway. On the normal path a `try` block costs almost nothing. In Green Metrics Tool micro-benchmarks, `dict.get` used about 12% less energy than `try/except KeyError`, but that was with about half of 10,000,000 lookups missing ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=4753302a-710f-4132-8001-9da3ba960d13,d7ded3f2-f9e7-4781-905e-9782a8305b8f,8f054455-adbc-402d-b593-0191d1061cd8)). Your misses are rare, so the cost of raising almost never applies. Replacing it with a manual "is this a digit string?" check would be longer and would handle `-5` or `+5` less cleanly than `int()`.
    - **Expected misses already avoid exceptions.** `SORT_COLUMNS.get(...)` plus an `is None` check is the right way for a lookup that can legitimately miss.
    - **The sort whitelist is a module-level dict.** It is built once, not per request. It also keeps user input out of the SQL, which is a correctness gain.
    - **The query is lean.** It names four columns, uses `LIMIT`, and caps `limit` at `MAX_LIMIT`, so a client can't pull the whole table in one response.

    One idea that depends on your data: if users page deep into big order histories, a large `OFFSET` makes the database read and skip all earlier rows. Keyset pagination (`WHERE id < ?` with the last id seen) avoids that. For shallow paging it isn't worth the extra complexity.
