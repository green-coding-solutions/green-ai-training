messages:
- role: user
  content: |
    optimize?

    ```nginx
    server {
        listen 80;
        server_name results.lab.example.org;
        root /srv/results/site;

        gzip off;
        gzip_static on;

        location / {
            try_files $uri $uri/index.html =404;
        }

        location /figures/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /data/ {
            types { application/gzip gz; }
            expires 7d;
        }
    }
    ```
- role: assistant
  content: |
    This config is already efficient. I would leave it as it is.

    - **No per-request compression:** `gzip off` with `gzip_static on` serves files that were compressed once at build time. In Green Metrics Tool measurements of nginx serving 2,000 requests for text assets, precompressed files used ~14 J and gzip level 5 on every request ~54 J. Both sent about 10× fewer bytes than no compression.
    - **Nothing wasted on binary files:** the PNG figures and the `.gz` data files are already compressed. Compressing them again would cost CPU and save nothing, and your config doesn't do it.
    - **Long cache times:** `expires` on figures and data means repeat visitors don't fetch them again.

    One thing to check: with `gzip_static on`, nginx only serves a `.gz` file if it exists next to the original. If your report build doesn't create them, nginx sends the plain files and you lose the saving. Add a build step like `gzip -k -9` for the HTML, CSS, JS and JSON files. It runs once per build, so a strong level is fine there.
verify:
  static_only: nginx config
