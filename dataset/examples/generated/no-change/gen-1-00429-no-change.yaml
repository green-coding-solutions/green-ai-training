id: gen-1-00429-no-change
category: no-change
language: javascript
patterns:
- lazy-load-images
- context-tradeoff
messages:
- role: user
  content: |
    hi, i am new to node. i made small script for our lab, after each simulation run it makes one html file with 3 plots (energy, temperature, pressure) so i can send it by mail to my supervisor. the file opens a bit slow on my old laptop and i read that images should be lazy loaded. is something wrong in my code?

    ```javascript
    const fs = require('fs');
    const path = require('path');

    const runDir = process.argv[2];
    const meta = JSON.parse(fs.readFileSync(path.join(runDir, 'meta.json'), 'utf8'));

    function pngToDataUri(file) {
      const buf = fs.readFileSync(path.join(runDir, file));
      return 'data:image/png;base64,' + buf.toString('base64');
    }

    const plots = [
      { file: 'energy.png', title: 'Total energy' },
      { file: 'temperature.png', title: 'Temperature' },
      { file: 'pressure.png', title: 'Pressure' },
    ];

    let html = '<!doctype html><html><head><meta charset="utf-8">';
    html += '<title>Run ' + meta.id + '</title>';
    html += '<style>body{font-family:sans-serif;max-width:900px;margin:2em auto}img{width:100%}</style>';
    html += '</head><body>';
    html += '<h1>Run ' + meta.id + '</h1>';
    html += '<p>Steps: ' + meta.steps + ', dt = ' + meta.dt + ', seed = ' + meta.seed + '</p>';
    for (const p of plots) {
      html += '<h2>' + p.title + '</h2>';
      html += '<img src="' + pngToDataUri(p.file) + '" alt="' + p.title + '">';
    }
    html += '</body></html>';

    fs.writeFileSync(path.join(runDir, 'report.html'), html);
    console.log('wrote report.html');
    ```
- role: assistant
  content: |
    Nothing is wrong. This script is already efficient for what it does, and `loading="lazy"` would not help here.

    - **The images are inline data URIs.** Lazy loading saves network requests for images that are far down the page. Your images are part of the HTML file, so there is nothing to defer. The bytes are already on the laptop when the file opens.
    - **It is one file with no extra requests.** That is the right choice for a report you send by mail.
    - **The script runs once per simulation run.** Reading three PNGs and writing one file costs very little next to the simulation itself.

    If the page feels slow on your old laptop, the likely cause is decoding three large PNGs. Check the pixel size of your plots. If they are much wider than the 900px the page shows, save them at about that width (or twice that, for sharp screens) in your plotting code. That makes the PNGs smaller and the mail attachment lighter, and it needs no change in this script.

    Only change the approach if the report grows. With dozens of plots in one file, write the images as separate files next to the HTML and add `loading="lazy"` to the ones below the first screen. For three plots, keep it as it is.
verify:
  static_only: script reads files from a run directory passed as argv and writes report.html; needs input files
