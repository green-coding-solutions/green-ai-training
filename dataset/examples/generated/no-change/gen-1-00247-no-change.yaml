id: gen-1-00247-no-change
category: no-change
language: java
patterns:
- regex-precompile
- context-tradeoff
messages:
- role: user
  content: |
    fix this, feels slow on big logs

    ```java
    package com.acme.logs;

    import java.io.BufferedReader;
    import java.io.IOException;
    import java.nio.charset.StandardCharsets;
    import java.nio.file.Files;
    import java.nio.file.Path;
    import java.util.HashMap;
    import java.util.Map;
    import java.util.regex.Matcher;
    import java.util.regex.Pattern;

    public final class SlowRequestReport {

        private static final Pattern LINE = Pattern.compile(
            "^(\\d{4}-\\d{2}-\\d{2}T[\\d:.]+Z) (\\w+) \\[([^\\]]+)\\] "
            + "(GET|POST|PUT|DELETE) (\\S+) -> (\\d{3}) in (\\d+)ms$");

        private static final long SLOW_MS = 500;

        public static Map<String, Long> countSlowByPath(Path file) throws IOException {
            Map<String, Long> counts = new HashMap<>();
            try (BufferedReader in = Files.newBufferedReader(file, StandardCharsets.UTF_8)) {
                Matcher m = LINE.matcher("");
                String line;
                while ((line = in.readLine()) != null) {
                    if (!m.reset(line).matches()) {
                        continue;
                    }
                    if (Long.parseLong(m.group(7)) < SLOW_MS) {
                        continue;
                    }
                    counts.merge(m.group(5), 1L, Long::sum);
                }
            }
            return counts;
        }

        public static void main(String[] args) throws IOException {
            countSlowByPath(Path.of(args[0])).entrySet().stream()
                .sorted(Map.Entry.<String, Long>comparingByValue().reversed())
                .limit(20)
                .forEach(e -> System.out.println(e.getValue() + "\t" + e.getKey()));
        }
    }
    ```
- role: assistant
  content: |
    I would not change this code. The regex handling is already in the efficient form:

    - The `Pattern` is a `static final`, so it is compiled once, not per line.
    - One `Matcher` is reused with `reset(line)`, so there is no new matcher object per line.
    - The pattern is anchored and uses specific classes (`\d`, `[^\]]`, `\S+`), so a non-matching line fails fast and there is little backtracking.
    - The file is read in one streaming pass with a `BufferedReader`. Nothing is held in memory except the counts map.
    - The number is only parsed after the line matched.

    So the regex is probably not why it feels slow. A rewrite with `indexOf`/`split` would be more code and more bug risk, with no clear gain.

    To find the real cost, profile one run on a big file, for example with JDK Flight Recorder:

    ```bash
    java -XX:StartFlightRecording=filename=run.jfr,settings=profile -cp . com.acme.logs.SlowRequestReport big.log
    ```

    If most time is in `readLine` and disk reads, the job is I/O bound and the code can't fix that. If time is in `Pattern`/`Matcher` frames, send me the profile. Then it is worth looking at a cheaper pre-check, such as skipping lines that don't contain `ms` before running the regex.
