id: gen-1-00292-no-change
category: no-change
language: java
patterns:
- hoist-invariants
- context-tradeoff
messages:
- role: user
  content: |
    hello, I have this method for our shop checkout and I read that we must move things out of loop to save energy. do I need to change something here? I think maybe cart.getLines().size() is call every time. sorry for my english

    ```java
    public Money totalFor(Cart cart, String countryCode) {
        BigDecimal taxRate = taxRates.rateFor(countryCode);
        BigDecimal net = BigDecimal.ZERO;

        for (int i = 0; i < cart.getLines().size(); i++) {
            CartLine line = cart.getLines().get(i);
            BigDecimal lineNet = line.getUnitPrice()
                    .multiply(BigDecimal.valueOf(line.getQuantity()));
            net = net.add(lineNet);
        }

        BigDecimal tax = net.multiply(taxRate).setScale(2, RoundingMode.HALF_UP);
        return new Money(net.add(tax), cart.getCurrency());
    }
    ```
- role: assistant
  content: |
    No, you don't need to change it. The costly invariant work is already outside the loop: `taxRates.rateFor(countryCode)` runs once, and the tax is computed once after the loop.

    About `cart.getLines().size()`: it is a cheap call on a list, and the JIT usually inlines it. A checkout cart has a handful of lines, and this runs once per checkout. The `BigDecimal` math in the loop costs far more than the `size()` call, and that math is needed. Moving `size()` into a variable would save nothing you could measure.

    One thing to check: look at what `getLines()` does. If it returns the same list or an unmodifiable view, it is fine. If it builds a new copy on each call (for example `List.copyOf(lines)`), then the loop copies the list on every iteration. In that case, call it once:

    ```java
    List<CartLine> lines = cart.getLines();
    for (CartLine line : lines) {
        net = net.add(line.getUnitPrice()
                .multiply(BigDecimal.valueOf(line.getQuantity())));
    }
    ```

    This version is also easier to read. Change to it if you like it, but not for energy reasons, unless `getLines()` copies.

    **Green Notes**
    - **Hoist loop-invariant work** (reduces E): already done for the tax rate and tax. Nothing else in the loop is invariant.
    - *Not applied:* caching `size()` in a local variable. The gain is too small on a short loop that runs once per checkout, and the JIT handles it.
verify:
  static_only: Java code, no Java runtime in the verifier; the method depends on Cart, CartLine, Money and TaxRates types
    that are not defined
