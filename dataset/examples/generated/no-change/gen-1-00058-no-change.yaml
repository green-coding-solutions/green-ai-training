id: gen-1-00058-no-change
category: no-change
language: html
patterns:
- modern-image-formats
- context-tradeoff
facts:
- F-IMGRENDER
- F-IMGENC
messages:
- role: user
  content: |
    hi, I am new to web stuff and I make the product page for our small tea shop. A friend look at it and say "you must change all images to AVIF, it is much greener". Is something wrong with my page? I am not sure what to fix.

    ```html
    <main class="product">
      <img src="img/sencha-front.jpg" width="800" height="800"
           alt="Sencha green tea, 100 g tin" class="product-photo">

      <h1>Sencha Green Tea, 100 g</h1>
      <p class="price">€12.90</p>

      <ul class="trust">
        <li><img src="icons/truck.svg" width="24" height="24" alt="">Free shipping over €40</li>
        <li><img src="icons/leaf.svg" width="24" height="24" alt="">Organic</li>
        <li><img src="icons/return.svg" width="24" height="24" alt="">30 day returns</li>
      </ul>

      <form action="/cart/add" method="post">
        <input type="hidden" name="sku" value="SEN-100">
        <button type="submit">Add to cart</button>
      </form>
    </main>
    ```

    The photo is about 70 KB. The icons are small files.
- role: assistant
  content: |-
    Nothing is wrong with this page. I would not convert it to AVIF.

    ```html
    <main class="product">
      <img src="img/sencha-front.jpg" width="800" height="800"
           alt="Sencha green tea, 100 g tin" class="product-photo">

      <h1>Sencha Green Tea, 100 g</h1>
      <p class="price">€12.90</p>

      <ul class="trust">
        <li><img src="icons/truck.svg" width="24" height="24" alt="">Free shipping over €40</li>
        <li><img src="icons/leaf.svg" width="24" height="24" alt="">Organic</li>
        <li><img src="icons/return.svg" width="24" height="24" alt="">30 day returns</li>
      </ul>

      <form action="/cart/add" method="post">
        <input type="hidden" name="sku" value="SEN-100">
        <button type="submit">Add to cart</button>
      </form>
    </main>
    ```

    **Green Notes**
    - **Icons are already in the best format:** SVG is the right choice for small icons. A raster format like AVIF would not beat it, and you would add a decode step for no gain.
    - **Photo is already small:** a 70 KB JPG at 800×800 is a reasonable size. AVIF would save some bytes on the network, but not much for one image. In Green Metrics Tool micro-benchmarks, AVIF decoding in the browser cost about 19% more CPU energy than JPG, and encoding AVIF cost about 7× JPG. The gain from modern formats comes only from fewer transferred bytes.
    - **Layout is stable:** `width` and `height` are set, so the page does not jump while images load.
    - *Not applied:* AVIF/WebP conversion — one product photo does not justify a new build step.

    If the shop grows to many large photos, convert them once at upload or build time, never on each request. Offer AVIF or WebP with a JPG fallback in a `<picture>` element. Then the byte saving can outweigh the extra encoding cost.
