id: gen-2-00121-no-change
category: no-change
language: dockerfile
patterns:
- small-container-images
- none
facts:
- F-CONTAINER-IMAGE
messages:
- role: user
  content: |
    ?

    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONDONTWRITEBYTECODE=1 \
        PYTHONUNBUFFERED=1

    RUN apt-get update \
     && apt-get install -y --no-install-recommends libpq5 \
     && rm -rf /var/lib/apt/lists/*

    WORKDIR /app

    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY etl/ ./etl/
    COPY sql/ ./sql/

    RUN useradd --create-home --uid 1000 etl
    USER etl

    ENTRYPOINT ["python", "-m", "etl.run"]
    CMD ["--since", "yesterday"]
    ```
- role: assistant
  content: |
    This Dockerfile is already in good shape. I would not change anything.

    - **Slim base, runtime dependencies only:** `python:3.12-slim` with only `libpq5`, installed with `--no-install-recommends`. The apt lists are removed in the same layer. There are no compilers, editors or dev tools in the image.
    - **Dependency layer before the source:** `requirements.txt` is copied and installed before `etl/` and `sql/`. When only your ETL code or SQL files change, Docker reuses the cached pip layer.
    - **No pip cache:** `--no-cache-dir` keeps downloaded wheels out of the image.

    This is the setup that pays off. In Green Metrics Tool benchmarks, a small Python app's image was built without a build cache. A slim base with runtime dependencies only, the dependency layer first and `pip --no-cache-dir` used about 7× less energy to build than a full `python:3.12` image with build tools and dev tools. Serving requests afterwards cost the same with both images. So the saving comes back with every build, pull and stored copy of the image, not while your nightly job runs.

    It also runs as a non-root user, which is good practice for a job that holds database credentials.
verify:
  static_only: Dockerfile, no runnable code to test
