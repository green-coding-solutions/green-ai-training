id: gen-1-00138-no-change
category: no-change
language: bash
patterns:
- compress-transmitted
- context-tradeoff
facts:
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    diff only please. add compression to the upload step in this, rsync -z or gzip before sending, whatever is cheaper

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    VERSION="${1:?usage: publish.sh <version>}"
    DEST='artifacts@store.internal:/srv/releases'
    OUT="build/out/${VERSION}"

    mkdir -p "${OUT}"
    tar -C build/stage -cf - . | zstd -3 -T0 -q -o "${OUT}/app-${VERSION}.tar.zst"

    # media/ holds demo videos (.mp4) and screenshots (.jpg)
    sha256sum "${OUT}"/*.tar.zst "${OUT}"/media/* > "${OUT}/SHA256SUMS"

    rsync -a --partial --info=stats1 "${OUT}/" "${DEST}/${VERSION}/"
    ```
- role: assistant
  content: |
    No diff. Don't add compression here.

    ```diff
    (no change)
    ```

    **Green Notes**
    - **Compression** (reduces E): everything you send is already compressed. The tarball is `.tar.zst`, and `.mp4` and `.jpg` are compressed formats. `rsync -z` or `gzip` would spend CPU on both ends and shrink almost nothing. `SHA256SUMS` is too small to matter.
    - **Codec choice** (reduces E): `zstd -3` is already a cheap codec. In Green Metrics Tool micro-benchmarks on text, zstd used about 4× less energy than gzip. Keep it.
    - **Upload step** (reduces network): `-a --partial` already skips unchanged files and resumes interrupted ones, so nothing is sent twice.

    *Not applied:* `rsync -z` — it only helps with uncompressed text such as logs or JSON. If you start shipping those, compress them with `zstd` before the upload, not gzip or xz.
verify:
  static_only: bash script needs zstd, rsync and a remote artifact host
