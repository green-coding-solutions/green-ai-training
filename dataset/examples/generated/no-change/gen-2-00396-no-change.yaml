id: gen-2-00396-no-change
category: no-change
language: python
patterns:
- string-join
- context-tradeoff
facts:
- F-STRCAT
messages:
- role: user
  content: |
    Our orders service is FastAPI on Python 3.11. A reviewer left this comment on my PR: "never use += on strings, use join, += is O(n²) and wastes CPU". Before I change it, here is the context:

    - `build_link_header` runs on every call to the list endpoints, so it is per request. Peak is a few hundred req/s.
    - The header must stay byte-identical. We have snapshot tests, and two client SDKs parse it.
    - I don't want churn in this PR unless it is actually worth it.

    If it's worth changing, give me the code. If not, tell me why, so I can reply in the PR.

    `api/links.py`:

    ```python
    from urllib.parse import urlencode

    RELS = ("first", "prev", "next", "last")


    def build_link_header(base_url: str, query: dict, page: int, per_page: int, total: int) -> str:
        """RFC 8288 Link header for paginated list endpoints."""
        last = max(1, (total + per_page - 1) // per_page)
        targets = {"first": 1, "prev": page - 1, "next": page + 1, "last": last}

        header = ""
        for rel in RELS:
            target = targets[rel]
            if target < 1 or target > last:
                continue
            params = {**query, "page": target}
            if header:
                header += ", "
            header += f'<{base_url}?{urlencode(params)}>; rel="{rel}"'
        return header
    ```

    `api/routes/orders.py` (the relevant part):

    ```python
    @router.get("/v1/orders", response_model=list[OrderOut])
    def list_orders(
        request: Request,
        response: Response,
        page: int = Query(1, ge=1),
        per_page: int = Query(50, ge=1, le=200),
        status: str | None = None,
        db: Session = Depends(get_db),
    ):
        q = db.query(Order)
        if status:
            q = q.filter(Order.status == status)
        total = q.count()
        items = q.order_by(Order.id).offset((page - 1) * per_page).limit(per_page).all()

        query = {"per_page": per_page}
        if status:
            query["status"] = status
        response.headers["Link"] = build_link_header(
            str(request.url_for("list_orders")), query, page, per_page, total
        )
        response.headers["X-Total-Count"] = str(total)
        return items
    ```
- role: assistant
  content: |
    Not worth changing. Keep the `+=` version in this PR.

    Why the reviewer's rule does not apply here:

    - **The piece count is fixed.** The loop runs at most four times, one per rel, and the header is a few hundred characters at most. The cost of `+=` grows with the *number of pieces*, because each append can copy the string built so far. With four pieces there is nothing to grow.
    - **The measured gap is a large-loop effect.** In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J with `+=` and ~1.8 J with `"".join()`. That is the case to fix: loops where the pieces scale with the data, such as one per row, line or item. Your loop does not scale with anything.
    - **Per request does not change this.** Each request pays the same tiny, constant cost. The `count()` and the page query in the same handler do far more work than building four header entries.

    A short reply for the PR: *"Agreed for loops that grow with the data, like exports and per-row output. This loop has at most four fixed parts, so `join` would not make a measurable difference."*

    If the team prefers `join` for style, this version gives the exact same header string, including order and separators. It is optional and changes nothing measurable:

    ```python
    from urllib.parse import urlencode


    def build_link_header(base_url: str, query: dict, page: int, per_page: int, total: int) -> str:
        """RFC 8288 Link header for paginated list endpoints."""
        last = max(1, (total + per_page - 1) // per_page)
        targets = {"first": 1, "prev": page - 1, "next": page + 1, "last": last}
        return ", ".join(
            f'<{base_url}?{urlencode({**query, "page": target})}>; rel="{rel}"'
            for rel, target in targets.items()
            if 1 <= target <= last
        )
    ```
verify:
  green_block: 0
  equivalence:
    driver: |
      base = "https://api.example.com/v1/orders"
      cases = [
          (base, {"per_page": 50}, 1, 50, 0),
          (base, {"per_page": 50, "status": "open"}, 1, 50, 120),
          (base, {"per_page": 50, "status": "open"}, 2, 50, 120),
          (base, {"per_page": 50, "status": "open"}, 3, 50, 120),
          (base, {"per_page": 50}, 7, 50, 120),
          (base, {"per_page": 1, "status": "a b&c"}, 1, 1, 1),
          (base, {"per_page": 200}, 4, 200, 1000),
      ]
      for c in cases:
          print(repr(build_link_header(*c)))
  test: |-
    h = build_link_header("https://x/v1/orders", {"per_page": 50}, 2, 50, 120)
    assert h == ('<https://x/v1/orders?per_page=50&page=1>; rel="first", '
                 '<https://x/v1/orders?per_page=50&page=1>; rel="prev", '
                 '<https://x/v1/orders?per_page=50&page=3>; rel="next", '
                 '<https://x/v1/orders?per_page=50&page=3>; rel="last"'), h
    assert build_link_header("https://x", {}, 1, 10, 0).count("rel=") == 2
