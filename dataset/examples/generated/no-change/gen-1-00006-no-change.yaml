id: gen-1-00006-no-change
category: no-change
language: bash
patterns:
- compress-stored
- context-tradeoff
facts:
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    hello, i have small script for send the photos and videos from our site visits to the customer. my colleague say I must add z flag to tar becouse it is "more green". is this true? now it make only .tar

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    job_dir="${1:?usage: send_photos.sh <job-dir>}"
    out="/tmp/$(basename "$job_dir")-photos.tar"

    tar -cf "$out" -C "$job_dir" --wildcards '*.jpg' '*.mp4'
    sha256sum "$out" > "$out.sha256"
    scp "$out" "$out.sha256" files.example.com:/srv/customer-drop/
    rm -f "$out" "$out.sha256"
    ```
- role: assistant
  content: |
    No, keep it as it is. Do not add the `z` flag.

    JPEG and MP4 files are already compressed. Gzip finds almost nothing more to remove, so the archive stays about the same size. You would pay the CPU cost of compressing and get no real saving in bytes.

    For scale: in Green Metrics Tool micro-benchmarks, compressing 100 MB of English text with gzip at its default level used about 67 J of CPU energy. Text compresses well, and photos and videos do not, so for your files that work would be wasted.

    Your script is already in good shape for this job:
    - plain `tar -cf` only bundles the files, which is all you need for already-compressed media,
    - the archive is a temporary file and is removed right after the upload,
    - the customer does not need an extra unpack step.

    If you later add text files to the bundle, like CSV reports or logs, compress those. A fast codec such as zstd (`tar --zstd`) costs a fraction of gzip's energy. In the same benchmarks zstd used about 16 J for the same 100 MB of text.
verify:
  static_only: bash script needs scp and a remote host; the answer contains no code change
