id: gen-1-00006-no-change
category: no-change
language: yaml
patterns:
- compress-transmitted
- context-tradeoff
facts:
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    ?

    ```yaml
    # nginx-ingress values for the plant-floor gateway (3 sensor hubs, ~20 req/min total)
    controller:
      config:
        use-gzip: "true"
        gzip-level: "1"
        gzip-min-length: "1024"
        gzip-types: "application/json text/plain text/csv"
        enable-brotli: "false"
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
      service:
        type: NodePort
      metrics:
        enabled: false
    ```
- role: assistant
  content: |-
    Nothing to change. This config is already well matched to the workload.

    - **Cheap codec level.** `gzip-level: "1"` is the right choice for responses that are compressed on every request. In Green Metrics Tool measurements on a text corpus, the heavy codecs cost far more CPU energy than gzip: xz used about 29× and brotli (quality 11) about 190× the energy of zstd, while gzip used about 4× more than zstd ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=2584305c-7a1e-47e2-b6cc-26276962035e,addc5f5e-55da-47f8-956d-240d06304e4e,fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,7b3bb87d-3b43-4f82-be99-0327405205b8,905bd408-6b31-4237-a4da-14b8fad90613,7f213a20-8028-4080-9583-6e465c217bb5,8e93a8d2-60b0-4831-905b-764b68257bc7)). Brotli stays off, which is correct for dynamic JSON.
    - **Sensible filter.** `gzip-min-length: "1024"` skips tiny payloads where headers and CPU cost would eat the gain. Only text types are listed, so already-compressed formats (JPEG, MP4, ZIP) are not touched.
    - **Right-sized.** One replica, small CPU request, no metrics sidecar. At about 20 requests per minute, the compression work is negligible, and anything more elaborate would cost more than it saves.

    If your sensor payloads are large JSON batches over a slow or metered uplink, a higher gzip level could cut bytes further. These facts compare energy, not compression ratio, so check the real ratio on your own payloads before changing it. At this traffic, I would leave it as it is.
