id: gen-1-00406-no-change
category: no-change
language: javascript
patterns:
- hoist-invariants
- context-tradeoff
messages:
- role: user
  content: |
    We have a nightly ETL job in Node 22 that normalizes order rows before they are loaded into the warehouse. About 5 million rows per run, the job takes a while but finishes well inside its window. Requirements:

    - output order must match input order
    - rows older than 90 days are dropped
    - amounts are converted to EUR cents
    - unknown currencies must be reported, not silently dropped

    Before I hand this to the team, I want to know if there are loop-invariant things I forgot to move out of the loop. Anything else you would change for efficiency? Please only change what is worth changing.

    ```javascript
    'use strict';

    const RATES = new Map([
      ['EUR', 1],
      ['USD', 0.92],
      ['GBP', 1.17],
      ['CHF', 1.04],
    ]);
    const SKU_RE = /^([A-Z]{2,4})-(\d{4,8})(?:-([A-Z0-9]+))?$/;
    const DAY_MS = 24 * 60 * 60 * 1000;

    function normalizeRows(rows, runDate) {
      const cutoff = Date.parse(runDate) - 90 * DAY_MS;
      const out = [];
      const unknown = new Map();

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const ts = Date.parse(row.created_at);
        if (ts < cutoff) continue;

        const rate = RATES.get(row.currency);
        if (rate === undefined) {
          unknown.set(row.currency, (unknown.get(row.currency) || 0) + 1);
          continue;
        }

        const m = SKU_RE.exec(row.sku);
        if (m === null) continue;

        out.push({
          orderId: row.order_id,
          brand: m[1],
          item: Number(m[2]),
          variant: m[3] || null,
          amountCents: Math.round(row.amount * rate * 100),
          createdAt: ts,
        });
      }

      return { rows: out, unknown };
    }

    module.exports = { normalizeRows };
    ```
- role: assistant
  content: |
    You didn't forget anything. This code already has the invariants hoisted, so I would not change it.

    What is already right:
    - `cutoff` is computed once, not parsed again for every row.
    - The regex is a module-level literal, so it is compiled once. It has no dynamic parts.
    - `RATES` is a `Map` built once, and each row does one `get()`. The lookup is the same as the existence check, so there is no second lookup.
    - It makes one pass over the data, with no intermediate `filter().map()` arrays. Output order is kept and unknown currencies are counted, as required.
    - Caching `rows.length` in a local would not help. V8 handles that already, and it would only add noise.

    Two small remarks, neither of them an efficiency issue:
    - `Date.parse` returns `NaN` for a malformed `created_at`. Then `ts < cutoff` is false and the row is kept with `createdAt: NaN`. If bad dates should be dropped or reported, add an `Number.isNaN(ts)` check. That is a correctness decision, so it is your call.
    - `Math.round(row.amount * rate * 100)` can be off by one cent on float edge cases. If the warehouse needs exact cents, convert the source amounts as integers.

    One context-dependent idea: if all 5 million rows sit in memory as one parsed JSON array, memory is your biggest cost, not CPU. Reading the input as a stream (for example NDJSON line by line) would lower peak memory. It only pays off if memory limits or swapping are a problem for this job. Otherwise leave the structure as it is.
verify:
  static_only: Answer contains no code block; it confirms the pasted code is already efficient.
