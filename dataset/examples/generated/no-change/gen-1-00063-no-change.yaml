id: gen-1-00063-no-change
category: no-change
language: html
patterns:
- modern-image-formats
- context-tradeoff
facts:
- F-IMGRENDER
- F-IMGENC
messages:
- role: user
  content: |
    Hi, I am new here and this is my first page for the team. It shows the status of our build runners, only people in our office open it (about 10 persons). A colleague looked at it and said "the images are maybe not good, use something modern", but he did not say what. I dont know what is wrong. Can you check?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Runner status</title>
      <link rel="stylesheet" href="status.css">
    </head>
    <body>
      <header>
        <img src="img/logo.svg" alt="Platform team" width="32" height="32">
        <h1>Build runners</h1>
      </header>

      <table>
        <thead>
          <tr><th>Runner</th><th>State</th><th>Last job</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>runner-01</td>
            <td><img src="img/ok.svg" alt="online" width="16" height="16"> online</td>
            <td>deploy-api #4812</td>
          </tr>
          <tr>
            <td>runner-02</td>
            <td><img src="img/busy.svg" alt="busy" width="16" height="16"> busy</td>
            <td>build-web #7730</td>
          </tr>
          <tr>
            <td>runner-03</td>
            <td><img src="img/fail.svg" alt="offline" width="16" height="16"> offline</td>
            <td>test-all #2291</td>
          </tr>
        </tbody>
      </table>

      <h2>Pipeline overview</h2>
      <img src="img/pipeline-overview.jpg" alt="Diagram of the pipeline stages" width="800" height="450">
      <p>Updated by the nightly job. Questions: #platform-team</p>
    </body>
    </html>
    ```
- role: assistant
  content: |-
    Your page is already efficient. I would not change the images.

    - **Icons are SVG.** The logo and the three status icons are vector files, which is the best choice for tiny icons. No raster format (AVIF, WebP, PNG) beats them.
    - **One raster image only.** The pipeline overview is a single JPG with `width` and `height` set. For one image on an internal page, a newer format saves very few bytes.
    - **Newer formats cost more CPU.** In Green Metrics Tool micro-benchmarks, decoding AVIF in the browser used about 19% more CPU energy than JPG. Encoding AVIF cost about 7× JPG. The gain of modern formats comes from fewer transferred bytes, and that is almost nothing for one image shown to 10 people on your office network.

    If you want one small improvement, check whether the diagram can be exported as SVG. Diagrams with flat colors and text are often smaller and sharper as vectors. If you later add many large photos to a public page, convert them once at build time, never per request.
