id: gen-1-00264-no-change
category: no-change
language: sql
patterns:
- select-columns
- context-tradeoff
facts:
- F-PG-SELECT
- F-PG-COLUMNS
messages:
- role: user
  content: |
    hi, our linter is say "SELECT * is bad for performance" on this query in our deploy tool. Should I change it to list the colums? we use all of it in the dashbord page for the environments

    ```sql
    CREATE TABLE deploy_targets (
        id          integer PRIMARY KEY,
        name        text NOT NULL,
        region      text NOT NULL,
        status      text NOT NULL,
        version     text NOT NULL,
        updated_at  timestamptz NOT NULL
    );

    -- called when somebody open the deploy dashboard
    SELECT * FROM deploy_targets ORDER BY name;
    ```

    table has around 40 rows only. thanks!
- role: assistant
  content: |
    You don't need to change it for energy. The linter rule is right in general, but it doesn't fit this case.

    - `SELECT *` costs extra when it reads columns you don't use, especially wide tables with big text columns. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, naming 10 columns instead of `SELECT *` used about 7× less energy at 2,500 rows. The cost scales with the data each column carries.
    - Your table has 6 small columns, and the dashboard uses all of them. There is nothing to skip, so a column list would return the same data.
    - 40 rows once per dashboard open is a tiny workload.

    One reason to list the columns anyway is safety, not energy. If someone later adds a large column to `deploy_targets`, such as a `deploy_log text`, `SELECT *` will start to send it to the dashboard too. At that point, name the columns. If you want to silence the linter now, listing the 6 columns is harmless, but it saves nothing.
verify:
  static_only: No code in the answer; the advice is not to change the query.
