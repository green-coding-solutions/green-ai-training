id: gen-1-00261-no-change
category: no-change
language: bash
patterns:
- bash-builtins
- context-tradeoff
messages:
- role: user
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    logdir=${1:-/var/log/nginx}
    out=/var/lib/node_exporter/textfile/nginx_status.prom

    tmp=$(mktemp "${out}.XXXXXX")
    trap 'rm -f "$tmp"' EXIT

    awk '
      { class = substr($9, 1, 1) "xx"; count[class]++; bytes += $10 }
      END {
        for (class in count)
          printf "nginx_requests_total{class=\"%s\"} %d\n", class, count[class]
        printf "nginx_response_bytes_total %d\n", bytes
      }
    ' "${logdir}/access.log" > "$tmp"

    mv "$tmp" "$out"
    ```

    ?
- role: assistant
  content: |
    This script is already efficient, so I would not change it.

    - **One pass over the log.** `awk` reads `access.log` once and does the counting and summing in memory. There is no `grep | wc` pipeline per status class and no `while read` loop in bash.
    - **Few processes.** The script starts `mktemp`, `awk` and `mv` once per run. That cost does not grow with the size of the log.
    - **Safe output.** The temp file sits next to the target, so `mv` is an atomic rename on the same filesystem. The exporter never reads a half-written file. The `trap` cleans up if `awk` fails.
    - **Quoting is right.** Variables are quoted, and the awk program is in single quotes because it needs no shell expansion.

    The only thing left to look at is how much log `awk` reads on each run. If the file is large and the job runs often, a rotated or time-windowed log means less data to scan. That depends on your setup, so I would leave the script as it is.
verify:
  static_only: bash script reads nginx logs and writes to a system path; no stdlib python/javascript to run
