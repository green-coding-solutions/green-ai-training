- role: user
  content: |
    ```python
    #!/usr/bin/env python3
    """Pre-deploy check: compare artifact checksums with the release manifest."""
    from hashlib import *
    from pathlib import *
    from json import *
    from sys import argv, exit

    CHUNK = 1 << 20


    def digest(path):
        h = sha256()
        with open(path, "rb") as f:
            while chunk := f.read(CHUNK):
                h.update(chunk)
        return h.hexdigest()


    def main(manifest_file, artifact_dir):
        manifest = loads(Path(manifest_file).read_text())
        bad = []
        for name, expected in manifest.items():
            p = Path(artifact_dir) / name
            if not p.is_file() or digest(p) != expected:
                bad.append(name)
        for name in bad:
            print("MISMATCH", name)
        return 1 if bad else 0


    if __name__ == "__main__":
        exit(main(argv[1], argv[2]))
    ```

    ?
- role: assistant
  content: |
    This script is already efficient. I would not change it.

    - **One pass, constant memory:** each artifact is hashed in 1 MiB chunks. Large files are never loaded fully into memory.
    - **No wasted hashing:** `not p.is_file() or digest(p) != expected` skips the hash when the file is missing.
    - **Only the standard library:** a start loads only small built-in modules. Loading a heavy module is what costs energy at start-up. In Green Metrics Tool micro-benchmarks, a Python start that imported `sympy` used about 25× the energy of a start that imported only a built-in module ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=b8705e55-3144-4871-8d37-0835189905ae,a347d140-8e85-456b-bf57-f8c77373c8fa)).

    The star imports (`from hashlib import *`, `from pathlib import *`, `from json import *`) make no measurable difference. In the same micro-benchmarks, 1,000 process starts used about 3103 J with `from sympy import *` and about 3093 J with `import sympy`. Rewriting them would not save energy, so leave them as they are. Change them only if your team wants that style for readability.

    If this check runs on very large artifact sets in every pipeline, the real saving is to hash only files that changed since the last run. For a normal deploy check, that is not worth the extra code.
