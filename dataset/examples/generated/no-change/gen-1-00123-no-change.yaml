id: gen-1-00123-no-change
category: no-change
language: yaml
patterns:
- minimize-environments
- context-tradeoff
messages:
- role: user
  content: |
    hi, im new in our team and I was asked to look at how we run staging. Our CTO read something about too many test servers wasting power. I dont really know what to look for. is something wrong here? we are 4 devs and one customer pilot

    ```yaml
    name: staging-power

    on:
      workflow_dispatch:
        inputs:
          action:
            description: "start or stop"
            required: true
            default: "start"
            type: choice
            options: [start, stop]
      schedule:
        # safety net, stop staging every evening
        - cron: "0 19 * * *"

    env:
      AWS_REGION: eu-central-1
      INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}

    jobs:
      power:
        runs-on: ubuntu-latest
        permissions:
          id-token: write
          contents: read
        steps:
          - uses: aws-actions/configure-aws-credentials@v4
            with:
              role-to-assume: ${{ vars.STAGING_ROLE_ARN }}
              aws-region: ${{ env.AWS_REGION }}

          - name: Start staging
            if: github.event_name == 'workflow_dispatch' && inputs.action == 'start'
            run: |
              aws ec2 start-instances --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

          - name: Stop staging
            if: github.event_name == 'schedule' || inputs.action == 'stop'
            run: |
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID"
    ```
- role: assistant
  content: |
    Nothing wrong here. This setup is already efficient, and I would not change it.

    - **Off by default.** Staging only runs when someone starts it. The instance is not idle at night or on weekends.
    - **Safety net.** The 19:00 schedule stops it if someone forgets. Forgotten test machines are the usual waste, and you have covered that.
    - **Right size for the team.** With 4 devs and one pilot customer, one shared staging VM is enough. More environments would add machines and upkeep.

    Do not add per-PR preview environments or an auto-start on every push. For a team this size they would create more running machines than they remove.

    If you want one small thing to check, look at the instance type in your cloud console. If staging is much bigger than it needs to be, a smaller type saves more than any workflow change. That is an ops question, so I can't judge it from this file.

    Revisit this if the team grows a lot, or if people wait a long time for a shared staging. Then short-lived environments that are deleted when the PR closes can make sense.

    Pattern: Minimize deployed environments
verify:
  static_only: GitHub Actions workflow needs AWS and GitHub, no runnable code
