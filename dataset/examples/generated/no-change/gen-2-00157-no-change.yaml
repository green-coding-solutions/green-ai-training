- role: assistant
  content: |
    Your page has no problem. SVG is already the right format for these images. Converting them to AVIF or WebP would make the page worse, not better, so don't add the conversion step.

    - **Your charts are vector graphics.** In an SVG, lines, bars and labels are saved as shapes and text, not as pixels. A raster copy that looks as sharp is usually larger. It also gets blurry when someone zooms in, and the labels can no longer be selected as text.
    - **Modern formats help with photos.** WebP and AVIF save transferred bytes on photographic images. They also cost CPU. In Green Metrics Tool benchmarks, encoding AVIF used about 7× the energy of JPG, and decoding AVIF in the browser cost about 19% more than JPG. Your job would pay that encoding cost on every run, and only two or three people open the page.
    - **The logo is fine too.** For small logos and icons, SVG beats any raster format.

    Keep the page as it is. Modern formats only matter if the report starts showing photos one day, for example product images. In that case, convert each photo once when it enters the pipeline, not again on every report run.
