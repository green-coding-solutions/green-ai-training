messages:
- role: user
  content: |
    Hi, I'm new to data engineering, so sorry if this is a basic question. Our Airflow job loads the daily orders into the warehouse. At the end it writes this HTML summary page. The charts come from matplotlib with `savefig("charts/rows_per_day.svg")`, and the logo is an SVG file from our design team. Usually two or three people from the data team open the page in the morning.

    A teammate said we should "use modern image formats like AVIF or WebP, they are much more efficient", and that I should convert the charts. I don't really understand what is wrong with what I have now. Should I add a conversion step to the job?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>orders_daily load – 2026-10-23</title>
      <style>
