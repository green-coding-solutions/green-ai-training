messages:
- role: user
  content: |
    fix this, its slow?

    ```sql
    -- deploy_targets: id, env, region, cluster, active (5 small columns)
    SELECT * FROM deploy_targets WHERE active = true ORDER BY env, region;
    ```
- role: assistant
  content: |
    The query is fine as it is. Listing columns would not change anything here.

    - `SELECT *` only costs extra when the table has columns you don't need. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, naming the needed columns used about 5-7× less energy than `SELECT *`. Your table has five small columns, and you likely use all of them. There is nothing to skip.
    - The filter and sort are already simple.

    ```sql
    SELECT * FROM deploy_targets WHERE active = true ORDER BY env, region;
    ```

    If the query is slow, the cause is somewhere else. Check these:
    - Run `EXPLAIN ANALYZE` to see where the time goes.
    - Check how often the query runs, for example once per pipeline step.
    - Check whether the table has grown far beyond a handful of rows.

    If someone later adds a large column to `deploy_targets` (a config blob or a log), name the columns in this query then.
verify:
  static_only: Answer repeats the original query unchanged, no code transformation to test.
