messages:
- role: user
  content: |
    Diff only please. Anything in here worth changing for energy? It runs once per checkout in our shop API.

    ```python
    from decimal import Decimal

    FREE_SHIPPING_FROM = Decimal("75.00")
    NON_DE_SURCHARGE = Decimal("6.00")


    def shipping_fee(weight_g: int, country: str, subtotal: Decimal) -> Decimal:
        if country == "DE" and subtotal >= FREE_SHIPPING_FROM:
            return Decimal("0.00")
        if weight_g <= 500:
            fee = Decimal("3.90")
        elif weight_g <= 2000:
            fee = Decimal("5.90")
        elif weight_g <= 5000:
            fee = Decimal("8.90")
        else:
            fee = Decimal("14.90")
        if country != "DE":
            fee += NON_DE_SURCHARGE
        return fee
    ```
- role: assistant
  content: |
    No diff. Leave it as is.

    - **Cold path:** it runs once per checkout and does at most four comparisons. The Decimal arithmetic costs more than the branching, and neither is measurable next to the request and database work around it.
    - **Conditions are already simple:** there are no modulo checks or stacked guard expressions. In Green Metrics Tool micro-benchmarks with 10,000,000 classifications, simple equality branches used about 16% less than complex range and modulo conditions. Your code is on the cheap side of that, and it runs far too rarely for the difference to matter.
    - **Ranges are needed here:** weight bands are continuous, so they can't become equality checks without a lookup table. That would add code for no gain. `match` would not help either: in the same benchmark it differed from `if/elif` by about 1%, which is noise.

    Only revisit this if profiling shows `shipping_fee` in a bulk path, for example repricing the whole catalog.
verify:
  static_only: answer contains no code; the verdict is that no change is needed
