id: gen-9483221-00020-no-change
category: no-change
language: dockerfile
patterns:
- small-container-images
- context-tradeoff
facts:
- F-CONTAINER-IMAGE
messages:
- role: user
  content: |
    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONDONTWRITEBYTECODE=1 \
        PYTHONUNBUFFERED=1

    WORKDIR /app

    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY pyproject.toml .
    COPY src/ ./src/
    RUN pip install --no-cache-dir --no-deps .

    ENTRYPOINT ["invoicectl"]
    CMD ["--help"]
    ```

    ?
- role: assistant
  content: |
    This Dockerfile is already in the efficient form. I would not change it.

    - **Slim base:** `python:3.12-slim` with no compilers, `git` or editors. In Green Metrics Tool micro-benchmarks, a build with a slim base, runtime dependencies only and a dependency layer before the source used about 7× less energy than a full `python:3.12` build with dev tools. That was a small Flask app built without a cache. Running the app afterwards cost the same with both images, so the saving is in builds, pulls and stored copies.
    - **Layer order:** `requirements.txt` is installed before your source is copied. A code change only rebuilds the last layers.
    - **No pip cache:** `--no-cache-dir` keeps the download cache out of the image.

    Going smaller (Alpine, distroless) is not something I have measurements for. Alpine can also force source builds for packages with compiled wheels, which would cost more build energy than it saves. For a CLI image, the current setup is a good stopping point.
verify:
  static_only: Dockerfile, nothing to execute
