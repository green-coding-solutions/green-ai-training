- role: user
  content: |
    add numba to this, checkout feels slow

    ```python
    SURCHARGE = {"standard": 0.0, "express": 7.5, "overnight": 18.0}

    def shipping_cost(items, method, zone_rates):
        total_weight = 0.0
        for it in items:
            total_weight += it["weight_kg"] * it["qty"]
        base = 0.0
        for limit, rate in zone_rates:
            if total_weight <= limit:
                base = rate
                break
        else:
            last_limit, last_rate = zone_rates[-1]
            base = last_rate + (total_weight - last_limit) * 0.9
        return round(base + SURCHARGE[method], 2)
    ```
- role: assistant
  content: |
    I wouldn't add numba here. This function is not the reason checkout feels slow.

    - **The loops are tiny.** A cart has a handful of items and `zone_rates` has a few tiers. That is microseconds of work per request.
    - **Numba fits the wrong kind of code.** It pays off on hot numeric loops over large arrays. In Green Metrics Tool micro-benchmarks, a pure Python loop over 10,000,000 samples used about 4× the energy of the same loop with `@njit`. Your loops run over a few dicts and tuples, and numba handles those poorly. You would need to rewrite the data into arrays first.
    - **It adds cost.** Compilation happens on the first call in every worker process. That is more than the whole function costs to run. It also adds a heavy dependency to your app.

    The function is already fine: one pass over the items, an early `break` in the tier lookup, no repeated work. Leave it as it is.

    If checkout is slow, profile the request (`cProfile`, or timing around each step). Slow checkouts usually come from database queries, payment or tax API calls, or template rendering. Those are the places to look.
