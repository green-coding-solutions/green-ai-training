id: gen-1-00088-no-change
category: no-change
language: python
patterns:
- simple-conditions
- context-tradeoff
facts:
- F-COND
messages:
- role: user
  content: |
    hi, i am new to python and i build a small web shop for my sister's candle business (flask, around 20 orders a day). i wrote this function for the shipping price. it works but a friend said it looks slow with so many comparisons. what is wrong with it?

    ```python
    def shipping_cents(country, total_cents, weight_g):
        if total_cents >= 6000:
            return 0
        if country == "DE":
            if weight_g <= 500:
                return 399
            elif weight_g <= 2000:
                return 549
            else:
                return 899
        elif country in ("AT", "NL", "BE"):
            if weight_g <= 500:
                return 599
            elif weight_g <= 2000:
                return 799
            else:
                return 1299
        else:
            return 1999
    ```
- role: assistant
  content: |-
    Nothing is wrong with it. It is correct, easy to read, and I would leave it as it is.

    Your friend has a point in theory. Range checks like `weight_g <= 500` are a more expensive kind of condition than plain equality checks. In Green Metrics Tool micro-benchmarks with 10,000,000 classifications, simple equality branches used about 46 J and complex range and modulo conditions about 54 J, so the simple version used about 16% less.

    That gap only shows up when the code runs millions of times. Your function runs once per checkout and does at most four comparisons. The database write, the page render and the payment call cost far more than that. Making this function "faster" would not change anything you could measure, and it would make it harder to read.

    Two notes:
    - Do not rewrite it as `match`. With the same conditions, `match` and `if/elif` differed by about 1% in the same benchmark, which is noise.
    - If you ever price millions of items in a batch job, measure that job first. Only then is it worth looking at these comparisons.
