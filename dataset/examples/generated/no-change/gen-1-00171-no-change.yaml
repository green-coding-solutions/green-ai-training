    fix this

    ```python
    import sys
    import json
    from numpy import *

    LABELS = ["cat", "dog", "bird"]

    W1 = sin(arange(128)).reshape(16, 8).astype(float32)
    b1 = zeros(8, dtype=float32)
    W2 = cos(arange(24)).reshape(8, 3).astype(float32)
    b2 = zeros(3, dtype=float32)


    def predict(batch):
        h = maximum(batch @ W1 + b1, 0)
        logits = h @ W2 + b2
        logits -= logits.max(axis=1, keepdims=True)
        p = exp(logits)
        p /= p.sum(axis=1, keepdims=True)
        return p


    def main():
        rows = [json.loads(line) for line in sys.stdin]
        x = array([r["features"] for r in rows], dtype=float32)
        p = predict(x)
        for r, k in zip(rows, argmax(p, axis=1)):
            print(r["id"], LABELS[k])


    if __name__ == "__main__":
        main()
    ```
- role: assistant
  content: |
    I assume the `from numpy import *` is what bothers you. Nothing here needs fixing, and the code is already efficient.

    - **Star import:** it makes no measurable energy difference. In Green Metrics Tool micro-benchmarks, 1,000 Python process starts with `from sympy import *` used about 3103 J, and with `import sympy` about 3093 J. The cost is loading numpy at all, and you need it. Leave the line as it is.
    - **Inference:** the whole input is one batch, so you do two matrix multiplies for all rows instead of a loop per row.
    - **Softmax:** the max is subtracted first, so it is numerically stable. The division is done in place, so there is no extra array.
    - **Weights:** they are created once at import time, not per call. Everything stays in `float32`.

    One non-energy risk: `import *` from numpy can shadow built-in names such as `sum`, `any` and `all`. This file doesn't use them, so it is safe now. If you add code later that calls those names, use `import numpy as np` for the new code to avoid surprises.
