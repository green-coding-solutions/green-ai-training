id: gen-1-00238-no-change
category: no-change
language: yaml
patterns:
- minimize-environments
- context-tradeoff
messages:
- role: user
  content: |
    Hello, we are small team of 3 people and we make landing page for our client (static site, build with Astro). I read about "minimize deployed enviroments" and I am not sure if we need do something. This is our GitHub workflow. Is it ok or we must change for be more green?

    ```yaml
    name: Deploy landing page

    on:
      push:
        branches: [main]
      pull_request:
        branches: [main]

    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: 20
              cache: npm
          - run: npm ci
          - run: npm run build
          - uses: actions/upload-pages-artifact@v3
            with:
              path: dist

      deploy:
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-latest
        permissions:
          pages: write
          id-token: write
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
        steps:
          - id: deployment
            uses: actions/deploy-pages@v4
    ```
- role: assistant
  content: |-
    It is already fine. You do not need to change it.

    Why it already fits the pattern:
    - There is only one deployed environment: the production site on GitHub Pages. There is no staging server and no preview server that runs all the time.
    - Pull requests only run the build. The `deploy` job runs only on `main`, so a PR creates nothing that stays alive.
    - The static site has no server of its own. There is nothing to scale down or switch off at night.
    - `cache: npm` and `npm ci` avoid downloading packages again on each run.

    Small optional idea: add a `concurrency` group with `cancel-in-progress: true` for pull requests. Then old builds stop when you push again quickly.

    ```yaml
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    ```

    Do not add this to `main` pushes, because you do not want to cancel a running deploy.

    Do not remove the build on pull requests. It catches broken builds before merge, and a failed deploy costs more than one short build.

    The pattern would matter if you add preview or staging servers, for example one per pull request. Then shut them down when the PR closes. For a 3-person static site, the current setup is the right size.
