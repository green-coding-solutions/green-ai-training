messages:
- role: user
  content: |
    Diff only please. CI builds this on every push to the ocean-model repo, tell me what to change.

    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONDONTWRITEBYTECODE=1 \
        PYTHONUNBUFFERED=1

    RUN apt-get update \
        && apt-get install -y --no-install-recommends libgomp1 libgfortran5 \
        && rm -rf /var/lib/apt/lists/*

    WORKDIR /opt/oceansim

    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY src/ ./src/
    COPY configs/ ./configs/

    RUN useradd --system --no-create-home runner
    USER runner

    ENTRYPOINT ["python", "-m", "oceansim.run"]
    ```
- role: assistant
  content: |
    No diff. This Dockerfile is already in the cheap form:

    - **Slim base:** `python:3.12-slim`, with only `libgomp1` and `libgfortran5` added for OpenMP and Fortran-backed libraries. No compilers, git or dev tools.
    - **Layer order:** `requirements.txt` is copied and installed before `src/` and `configs/`. A code-only push reuses the dependency layer.
    - **Lean installs:** `--no-install-recommends`, apt lists removed in the same layer, and `pip --no-cache-dir`.

    In Green Metrics Tool micro-benchmarks, building a small Flask image from a full `python:3.12` base with build tools and dev packages used about 7× more energy than the slim, runtime-only, dependency-first version. Yours already has the second shape. Serving cost was the same for both, so nothing is left to gain at runtime.

    If a wheel for one of your scientific packages is missing for your platform and pip has to compile it, you would need build tools. Do that in a separate build stage, not in this image. Nothing in the file shows that today.
