messages:
- role: user
  content: |
    ```html
    <!-- report.html, written by diskwatch after every run (cron, every 15 min) -->
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>diskwatch: nas-02</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 1.5rem; }
        .row { display: flex; align-items: center; gap: .5rem; margin: .4rem 0; }
        .ok { color: #1a7f37; }
        .warn { color: #b35900; }
      </style>
    </head>
    <body>
      <h1>nas-02 disk status</h1>

      <div class="row ok">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="7" fill="currentColor"/>
        </svg>
        <span>/dev/sda1 &ndash; 41% used</span>
      </div>
      <div class="row warn">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1 L15 14 H1 Z" fill="currentColor"/>
        </svg>
        <span>/dev/sdb1 &ndash; 88% used</span>
      </div>

      <h2>Rack camera (last run)</h2>
      <img src="rack-latest.jpg" width="640" height="360" alt="Server rack, snapshot from the last run">
    </body>
    </html>
    ```

    ?
- role: assistant
  content: |
    This page is already efficient. I would not change it.

    - **Status icons are inline SVG.** For tiny icons, SVG is the right choice. Any raster format, including AVIF, would be larger and need an extra request.
    - **One photo, with `width` and `height` set.** The browser reserves the space and does no layout shift. JPEG is also a good fit for a camera snapshot.
    - **No extra assets.** System font, small inline CSS, no web fonts or scripts.

    Switching `rack-latest.jpg` to AVIF or WebP would not pay off here. The file is rewritten on every run, so the format is encoded every 15 minutes. In Green Metrics Tool micro-benchmarks, encoding AVIF cost about 7× the energy of encoding JPG, and decoding AVIF in the browser cost about 19% more than JPG. The usual gain of modern formats is fewer transferred bytes. For one small image on a status page, that gain is tiny next to the repeated encoding cost.

    Modern formats make sense for large, static photos that you encode once at build or upload time and many visitors download. This page is not that case.
verify:
  static_only: HTML only, no executable code to run
