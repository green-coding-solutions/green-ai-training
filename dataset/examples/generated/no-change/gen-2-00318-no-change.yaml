id: gen-2-00318-no-change
category: no-change
language: html
patterns:
- lazy-load-images
- context-tradeoff
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    lazy load the imgs pls, label page feels slow. fix this

    ```html
    <!-- templates/label.html, rendered by GET /api/v1/shipments/<id>/label.html -->
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Label {{ shipment.tracking_no }}</title>
      <link rel="stylesheet" href="/static/label.css">
    </head>
    <body>
      <header class="bar">
        <img src="/static/img/logo.svg" alt="Shipdock" width="120" height="28">
        <span class="carrier">{{ shipment.carrier_name }}</span>
        <button type="button" onclick="window.print()">Print</button>
      </header>

      <main class="label-wrap">
        <img class="label"
             src="{{ shipment.label_url }}"
             alt="Shipping label {{ shipment.tracking_no }}"
             width="400" height="600">
        <p class="meta">
          {{ shipment.recipient_name }} &middot; {{ shipment.service_level }}
          &middot; created {{ shipment.created_at.strftime('%Y-%m-%d %H:%M') }}
        </p>
      </main>
    </body>
    </html>
    ```
- role: assistant
  content: |
    I'd leave this template as it is. Lazy loading won't help here.

    - **Both images are above the fold.** The logo sits in the header, and the label is the first thing in `main`. Every visitor sees both right away, and the label is the reason the page exists.
    - **Lazy loading only saves when images are never viewed.** In Green Metrics Tool page-load benchmarks with an article of 15 photos, lazy loading the images below the fold used about 12% less energy on loads without scrolling. When visitors scrolled to the end, the difference was about 1%, which is noise. On this page every image is always viewed, so there is nothing to skip.
    - **It can make the page feel slower.** With `loading="lazy"`, the browser waits for layout before it starts fetching the label. Lazy loading should never go on the main image above the fold.

    The template already does the important things right. The `width`/`height` on both images reserve their space, so nothing jumps while they load, and the logo is a small SVG.

    To find what is actually slow, open the browser's Network tab and check whether the time goes into the HTML response or the label image request. If the HTML response waits, the time is spent server-side in `GET /api/v1/shipments/<id>/label.html`. If the label request is the long bar, look at how `shipment.label_url` is produced and how large that file is.
verify:
  static_only: HTML template with Jinja placeholders; answer intentionally keeps the user's markup unchanged
