id: gen-1-00464-no-change
category: no-change
language: javascript
patterns:
- select-columns
- context-tradeoff
messages:
- role: user
  content: |
    hi, i am new to node and wrote this small job that copies our currency list into the warehouse every night. a friend looked and said "SELECT * is bad" but i dont know if it is something wrong here. can you check? it works fine but i want to be sure

    ```javascript
    const { Pool } = require('pg');

    const source = new Pool({ connectionString: process.env.SOURCE_DB_URL });
    const target = new Pool({ connectionString: process.env.WAREHOUSE_DB_URL });

    async function syncCurrencies() {
      // currencies: code, name, symbol, decimals, is_active (about 170 rows)
      const { rows } = await source.query('SELECT * FROM currencies');

      await target.query(
        `INSERT INTO dim_currency (code, name, symbol, decimals, is_active)
         SELECT * FROM unnest($1::text[], $2::text[], $3::text[], $4::int[], $5::bool[])
         ON CONFLICT (code) DO UPDATE
           SET name = EXCLUDED.name,
               symbol = EXCLUDED.symbol,
               decimals = EXCLUDED.decimals,
               is_active = EXCLUDED.is_active`,
        [
          rows.map((r) => r.code),
          rows.map((r) => r.name),
          rows.map((r) => r.symbol),
          rows.map((r) => r.decimals),
          rows.map((r) => r.is_active),
        ]
      );

      console.log(`synced ${rows.length} currencies`);
    }

    syncCurrencies()
      .catch((err) => {
        console.error(err);
        process.exitCode = 1;
      })
      .finally(() => Promise.all([source.end(), target.end()]));
    ```
- role: assistant
  content: |
    Nothing is wrong here. I would not change it.

    `SELECT *` is a problem when you read columns you never use, especially wide or large text columns. Your job uses all 5 columns of `currencies`. There is nothing to skip, so a column list would transfer the same data.

    The rest is already efficient:
    - one read query and one write statement for the whole table, not one insert per row,
    - the upsert (`ON CONFLICT`) is done in the database, so you do not need a lookup per row,
    - it runs once a night on about 170 rows, so any extra tuning would cost more developer time than it could ever save.

    One optional change is about safety, not energy. If someone adds a big column to `currencies` later (for example a long `notes` field), `SELECT *` would start pulling it every night. Then an explicit list is worth it:

    ```javascript
    const { rows } = await source.query(
      'SELECT code, name, symbol, decimals, is_active FROM currencies'
    );
    ```

    Do it if you like that clarity. It is not needed for efficiency today.
verify:
  static_only: needs a running PostgreSQL server and the pg package
