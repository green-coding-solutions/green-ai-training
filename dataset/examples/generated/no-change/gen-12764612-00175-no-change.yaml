messages:
- role: user
  content: |
    Root page of our inventory REST API (`GET /` returns this static file). Looks like some CSS is dead. Diff only, and only if it's worth changing.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Inventory API v2</title>
      <style>
        :root { --fg: #1f2328; --muted: #656d76; --accent: #0969da; }
        body { font: 16px/1.5 system-ui, sans-serif; color: var(--fg); max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.5rem; }
        a { color: var(--accent); }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #d0d7de; }
        code { background: #f6f8fa; padding: .1rem .3rem; border-radius: 4px; }
        .muted { color: var(--muted); }
        .badge-beta { background: #ddf4ff; color: var(--accent); padding: 0 .4rem; border-radius: 999px; font-size: .8rem; }
        .deprecated { text-decoration: line-through; }
        .toast { position: fixed; bottom: 1rem; right: 1rem; background: #1f2328; color: #fff; padding: .5rem 1rem; }
      </style>
    </head>
    <body>
      <h1>Inventory API <span class="muted">v2</span></h1>
      <p>Base URL: <code>https://api.example.com/v2</code>. Interactive docs: <a href="/docs">/docs</a>. Health: <a href="/health">/health</a>.</p>
      <table>
        <thead><tr><th>Method</th><th>Path</th><th>Description</th></tr></thead>
        <tbody>
          <tr><td>GET</td><td><code>/items</code></td><td>List items</td></tr>
          <tr><td>GET</td><td><code>/items/{id}</code></td><td>Get one item</td></tr>
          <tr><td>POST</td><td><code>/items</code></td><td>Create an item</td></tr>
          <tr><td>DELETE</td><td><code>/items/{id}</code></td><td>Delete an item</td></tr>
        </tbody>
      </table>
    </body>
    </html>
    ```
- role: assistant
  content: |
    No energy-relevant diff. Three rules are dead (`.badge-beta`, `.deprecated`, `.toast`), but removing them changes nothing measurable.

    - The CSS is inline, about 15 small rules, so there is no extra request and nothing for a purge tool to shrink.
    - In Green Metrics Tool browser benchmarks with 50 cold page loads, a 16 KB stylesheet with mostly unused rules (~783 J) and the same page purged and minified to 0.75 KB (~764 J) were about 2% apart. That is within noise. Your stylesheet is far smaller than that one.
    - A static page like this is cheap to serve, and a smaller file would only save a few hundred bytes on the network.

    If you want the dead rules gone for tidiness only:

    ```text
    -    .badge-beta { background: #ddf4ff; color: var(--accent); padding: 0 .4rem; border-radius: 999px; font-size: .8rem; }
    -    .deprecated { text-decoration: line-through; }
    -    .toast { position: fixed; bottom: 1rem; right: 1rem; background: #1f2328; color: #fff; padding: .5rem 1rem; }
    ```

    Keep them if you plan to mark endpoints as beta or deprecated soon. Unused-CSS removal starts to matter when you ship a large framework stylesheet and use a small part of it.
verify:
  static_only: HTML/CSS only, no executable code
