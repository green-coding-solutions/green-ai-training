id: gen-1-00346-no-change
category: no-change
language: html
patterns:
- dom-size
- context-tradeoff
messages:
- role: user
  content: |
    I have a small log page for our build server. Requirements:
    - Shows the last 200 lines of the deploy log, nothing more (the server already cuts it to 200).
    - Used by 3 or 4 people on the ops team, on desktop, usually once or twice a day after a failed deploy.
    - Lines with ERROR are red, WARN are orange.
    - No framework, no build step.

    Our tech lead said I should use a virtual list for the DOM because "big DOMs are bad". Is that needed here? This is what I have now:

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Deploy log</title>
      <style>
        body { font-family: monospace; margin: 1rem; }
        #log { white-space: pre-wrap; }
        .line.ERROR { color: #b00020; }
        .line.WARN { color: #c26a00; }
      </style>
    </head>
    <body>
      <h1>Deploy log (last 200 lines)</h1>
      <div id="log"></div>
      <script>
        fetch('/api/deploy-log?lines=200')
          .then(function (r) { return r.text(); })
          .then(function (text) {
            var frag = document.createDocumentFragment();
            text.split('\n').forEach(function (l) {
              if (!l) return;
              var d = document.createElement('div');
              d.className = 'line' +
                (l.indexOf('ERROR') !== -1 ? ' ERROR' :
                 l.indexOf('WARN') !== -1 ? ' WARN' : '');
              d.textContent = l;
              frag.appendChild(d);
            });
            document.getElementById('log').appendChild(frag);
          });
      </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    No, you don't need a virtual list here. Keep the page as it is.

    A DOM size problem starts at thousands of nodes that are re-rendered, scrolled or restyled often. Your page has about 200 simple `div` elements, built once, on a page opened a few times a day. Browsers handle that easily. A virtual list would add scroll math, resize handling and more code to maintain, and it would also break Ctrl+F search, which is what people use most in a log page.

    Your code already does the right things:
    - It builds the nodes in a `DocumentFragment` and inserts them once, so there is only one layout pass.
    - It uses `textContent`, so log text cannot inject HTML.
    - The server limits the response to 200 lines, so the size is bounded.

    Revisit this only if the requirement changes. For example, if people want to load the full log (tens of thousands of lines), then paginate on the server or render in chunks. Until then, a virtual list would cost more than it saves.
verify:
  static_only: HTML page with fetch to a server endpoint, no stdlib runtime to test
