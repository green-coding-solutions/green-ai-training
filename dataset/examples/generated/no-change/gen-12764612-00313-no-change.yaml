messages:
- role: user
  content: |
    fix this

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    SRC=/data/etl/export
    DEST=/archive/etl
    STAMP=$(date +%F)

    mkdir -p "$DEST"
    tar -C "$SRC" -cf - . | zstd -T0 -q -o "$DEST/export-$STAMP.tar.zst"
    zstd -t -q "$DEST/export-$STAMP.tar.zst"
    find "$DEST" -name 'export-*.tar.zst' -mtime +30 -delete
    ```
- role: assistant
  content: |
    Nothing to fix. This script is already the efficient version, and I would leave it as it is.

    - **Codec:** `zstd` at its default level is a cheap choice for data you compress every night. In Green Metrics Tool micro-benchmarks on 100 MB of text, zstd used ~16 J, gzip ~67 J and xz ~458 J. So zstd used about 4× less energy than gzip and xz used about 29× more than zstd.
    - **Compression is worth it here:** the exports are kept 30 days, so the smaller files pay back the compression work. It would not pay for data deleted after minutes.
    - **Pipeline:** `tar ... | zstd` streams the data, so there is no temporary uncompressed archive on disk. Variables are quoted, and the integrity check and the 30-day cleanup are already there.

    If you want smaller files, you can raise the zstd level. Those measurements compare energy at the default level only, and they say nothing about compression ratio. So measure your own export before and after, for example with `perf stat` or `time` as a CPU-time proxy. I would not switch to `xz` just for size unless the archives are stored for months.
verify:
  static_only: bash script that needs zstd and a real export directory
