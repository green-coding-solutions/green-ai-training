    out = render({
        "ffff000011112222aaaa": ["/b/y.bin", "/c/y.bin"],
        "abcdef1234567890abcd": ["/a/x.txt", "/b/x.txt", "/c/x.txt"],
    })
    expected = (
        "abcdef123456  (3 copies)\n"
        "    /a/x.txt\n"
        "    /b/x.txt\n"
        "    /c/x.txt\n"
        "ffff00001111  (2 copies)\n"
        "    /b/y.bin\n"
        "    /c/y.bin"
    )
    assert out == expected, out
    assert render({}) == ""
    big = {f"{i:020x}": [f"/d/{i}/a", f"/d/{i}/b"] for i in range(20000)}
    assert render(big).count("\n") == 20000 * 3 - 1
