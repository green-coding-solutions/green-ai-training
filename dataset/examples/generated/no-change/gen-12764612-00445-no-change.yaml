messages:
- role: user
  content: |
    hi, i am new in devops team. i made this small status page for our build runners, it opens on the big screen in our office. my colleague said "something is wrong with the images, you need to lazy load them". i dont understand what is wrong. can you check?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Runner status</title>
      <link rel="stylesheet" href="status.css">
    </head>
    <body>
      <header>
        <img src="img/logo.svg" alt="Platform team" width="120" height="40">
        <h1>CI runner status</h1>
      </header>
      <main>
        <section>
          <h2>Pipeline overview</h2>
          <img src="img/pipeline-today.png" alt="Pipeline runs per hour, today" width="900" height="360">
        </section>
        <section>
          <h2>Queue time</h2>
          <img src="img/queue-time.png" alt="Median queue time, last 24 hours" width="900" height="240">
        </section>
      </main>
      <footer>Updated every 5 minutes</footer>
    </body>
    </html>
    ```
- role: assistant
  content: |
    Nothing is wrong with the images. I would not add `loading="lazy"` here.

    - **All images are visible on load.** Lazy loading only helps for images below the fold that some visitors never scroll to. Your page is short and sits on a big screen, so everything is seen right away. Lazy loading would only delay the images.
    - **Measured saving needs unseen images.** In Green Metrics Tool micro-benchmarks, an article with 15 photos used about 12% less energy per page load when `loading="lazy"` was set on the images below the fold and the visitor did not scroll. When visitors scrolled to the end, there was no difference.
    - **The markup is already good.** Every image has `width` and `height`, so the layout does not jump while loading. Every image has `alt` text.

    Your page needs no change. If it grows later into a long page with many charts below the first screen, add `loading="lazy"` to those charts only. Keep the logo and the first chart eager.
verify:
  static_only: static HTML, no code to execute
