id: gen-1-00049-no-change
category: no-change
language: sql
patterns:
- compress-stored
- context-tradeoff
sql_dialect: postgres
messages:
- role: user
  content: |
    compress the thumb column?

    ```sql
    CREATE TABLE product_thumbnails (
        product_id   bigint PRIMARY KEY REFERENCES products(id),
        content_type text NOT NULL DEFAULT 'image/jpeg',
        thumb        bytea NOT NULL,   -- JPEG, 10-20 KB, written once at upload
        created_at   timestamptz NOT NULL DEFAULT now()
    );

    -- served by GET /products/:id/thumb
    SELECT content_type, thumb FROM product_thumbnails WHERE product_id = $1;
    ```
- role: assistant
  content: |
    No. The column holds JPEG data, and JPEG is already compressed. A second compression pass finds almost nothing to remove. It only costs CPU on every write and every read.

    The query is also fine. It reads one row by primary key and selects only the two columns it needs.

    There is one small change worth making. Postgres tries to compress large `bytea` values automatically (TOAST). For JPEGs that attempt is wasted work. You can turn it off and keep the values out of line:

    ```sql
    ALTER TABLE product_thumbnails
        ALTER COLUMN thumb SET STORAGE EXTERNAL;
    ```

    This only affects new and updated rows. Existing rows stay as they are until they are rewritten.

    **Green Notes**
    - **Compress stored data** (not applied): already-compressed formats gain nothing from compression, so extra codecs would only add CPU work.
    - **Reduce transmitted data** (reduces E): you already select just the needed columns. https://patterns.greensoftware.foundation/development/data-handling/reduce-transmitted-data

    Compression would make sense for compressible data such as JSON or text payloads that are stored for a long time.
verify:
  static_only: Postgres-specific TOAST storage setting; not runnable in SQLite
