messages:
- role: user
  content: |
    fix this

    ```python
    import torch

    class Predictor:
        def __init__(self, models, labels):
            self.models = models      # name -> loaded torch module
            self.labels = labels      # class index -> label string

        def predict(self, model_name, batch):
            try:
                model = self.models[model_name]
            except KeyError:
                raise ValueError(f"unknown model: {model_name}")

            with torch.inference_mode():
                logits = model(batch)

            out = []
            for i in logits.argmax(dim=1).tolist():
                try:
                    out.append(self.labels[i])
                except KeyError:
                    raise RuntimeError(f"label map has no class {i}")
            return out
    ```
- role: assistant
  content: |-
    Nothing needs fixing. If you are worried about the `try/except KeyError` blocks, leave them as they are.

    - **Misses are errors, not normal flow.** In both places a missing key means a bad request or a broken label map. The exception is only raised when something is wrong. On the normal path, a `try` block that does not raise costs almost nothing.
    - **`dict.get` only wins when misses are common.** In Green Metrics Tool micro-benchmarks with 10,000,000 lookups where about half of the keys were missing, `dict.get` used about 12% less CPU energy than `try/except KeyError`. The cost is in raising the exception. Your lookups should almost never miss.
    - **`get` would make the code worse.** You would need an extra `None` check, and a bad label map could slip through silently. Your explicit errors are better.
    - **The rest is already efficient.** `torch.inference_mode()` is in place, and the model forward pass dominates the cost of this function, not two dict lookups.
