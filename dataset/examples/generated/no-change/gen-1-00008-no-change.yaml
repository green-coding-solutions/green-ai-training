id: gen-1-00008-no-change
category: no-change
language: html
patterns:
- modern-image-formats
- context-tradeoff
facts:
- F-IMGRENDER
- F-IMGENC
messages:
- role: user
  content: |
    Hello, our nightly ETL job make a small html status page after the load finish. The python step save one chart as JPG (row counts per table, 1200x600) and put it in this template. Only the data team open the page, maybe 5 persons in the morning, inside company network.

    My collegue say we must change the chart to AVIF, because "AVIF is the greenest format". I am not sure, is he right? Here is the template, please tell me what to change

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Nightly load status</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        .ok { color: #1a7f37; }
        .fail { color: #cf222e; }
        svg.icon { width: 1em; height: 1em; vertical-align: -0.125em; }
      </style>
    </head>
    <body>
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-ok" viewBox="0 0 16 16"><path d="M6.5 11.5 3 8l1-1 2.5 2.5L12 4l1 1z" fill="currentColor"/></symbol>
        <symbol id="i-fail" viewBox="0 0 16 16"><path d="M4 4l8 8m0-8-8 8" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
      </svg>

      <h1>Nightly load status</h1>
      <ul>
        <li class="ok"><svg class="icon"><use href="#i-ok"/></svg> orders: 182,340 rows</li>
        <li class="ok"><svg class="icon"><use href="#i-ok"/></svg> customers: 12,904 rows</li>
        <li class="fail"><svg class="icon"><use href="#i-fail"/></svg> shipments: timeout, retry at 06:00</li>
      </ul>

      <img src="row-counts.jpg" width="1200" height="600" alt="Row counts per table, last 14 nights">
    </body>
    </html>
    ```
- role: assistant
  content: |
    Your colleague is not right for this page. I would change nothing.

    - **The chart is encoded every night.** In Green Metrics Tool micro-benchmarks, encoding AVIF cost about 7× the energy of encoding JPG. Your job would pay that cost on every run, and only 5 people would look at the result.
    - **Decoding is not cheaper either.** In page-load tests, AVIF decoding cost about 19% more client energy than JPG. The gain of modern formats comes from fewer transferred bytes. On a company network with one 1200x600 chart and 5 viewers, that gain is tiny.
    - **The icons are already the best choice.** An inline SVG sprite is smaller and cheaper than any raster format. The `<img>` also has `width` and `height`, so there is no layout shift.

    Modern formats pay off for images that are encoded once (at build or upload time) and served to many visitors over real networks. Your nightly chart is the opposite case, so keep the JPG.
verify:
  static_only: HTML
