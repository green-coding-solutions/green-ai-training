category: no-change
language: python
patterns:
- vectorize-or-jit
- context-tradeoff
facts:
- F-NUMBA
messages:
- role: user
  content: |
    We have a daily ETL step that prices order lines for the finance export. It runs from cron in a fresh process each night on about 300k lines. My colleague says we should put `@njit` on it because "numba makes numeric code faster", and I'd like to ship that this sprint.

    Requirements: output must stay identical to the cent (finance reconciles against it), no new heavy dependencies on the cron box unless they clearly pay off, and the code should stay easy for the analysts to read. Should I add numba?

    ```python
    import numpy as np

    TIER_BREAKS = np.array([10, 50, 200])
    TIER_DISCOUNT = np.array([0.0, 0.03, 0.07, 0.12])


    def price_lines(qty, unit_cents, cur_idx, fx_to_eur, vat_rate):
        tier = np.searchsorted(TIER_BREAKS, qty, side="right")
        discount = TIER_DISCOUNT[tier]
        gross = qty * unit_cents * (1.0 - discount)
        eur = gross * fx_to_eur[cur_idx]
        net_cents = np.rint(eur).astype(np.int64)
        vat_cents = np.rint(net_cents * vat_rate[cur_idx]).astype(np.int64)
        return net_cents, vat_cents


    def main(path_in, path_out):
        data = np.load(path_in)
        net, vat = price_lines(
            data["qty"],
            data["unit_cents"],
            data["cur_idx"],
            data["fx_to_eur"],
            data["vat_rate"],
        )
        np.savez(path_out, net_cents=net, vat_cents=vat)


    if __name__ == "__main__":
        import sys
        main(sys.argv[1], sys.argv[2])
    ```
- role: assistant
  content: |
    No, leave it as it is. This code is already efficient, and numba would not pay off here.

    - **There is no Python loop to compile.** Every step (`searchsorted`, fancy indexing, the arithmetic, `rint`) already runs in numpy's compiled loops over the whole array. Numba helps when a pure Python `for` loop does the numeric work. In Green Metrics Tool micro-benchmarks, quantizing 10,000,000 samples in such a loop used about 4× less CPU energy with Numba (~40 J vs ~9.5 J). Your code has no such loop, so there is nothing to gain.
    - **The cost would land on every run.** Cron starts a fresh process each night, so numba would compile the function every time unless you add `cache=True` and keep a writable cache directory. That is extra work for a job that handles 300k lines in numpy.
    - **It puts your reconciliation at risk.** A rewrite into explicit loops invites small floating-point differences. Your requirement of identical cents is easier to keep with the code you have.
    - **It adds a heavy dependency** (numba and LLVM) to the cron box and makes the code harder for the analysts to read.

    If a profile later shows a real Python loop over rows in another step (per-line `for` with arithmetic), that would be the place to look at numba. For this function, no change.
verify:
  static_only: Answer contains no code. Original code uses numpy only, and the answer says to keep it unchanged.
