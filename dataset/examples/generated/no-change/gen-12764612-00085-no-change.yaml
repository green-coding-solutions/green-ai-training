id: gen-12764612-00085-no-change
category: no-change
language: html
patterns:
- lazy-load-images
- context-tradeoff
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    hi, im new to html. my ETL script write this status page after every nightly load and I open it in the morning. I read something about lazy loading for images but I dont understand if my page is ok or if I do something wrong. can you check?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Nightly load status</title>
      <style>
        body { font-family: sans-serif; max-width: 900px; margin: 1rem auto; }
        table { border-collapse: collapse; }
        td, th { border: 1px solid #ccc; padding: 4px 8px; }
      </style>
    </head>
    <body>
      <h1>Nightly load: 2026-10-25</h1>
      <p>Status: <strong>OK</strong>, 1,284,330 rows loaded in 14 min.</p>

      <img src="img/dag.png" alt="Task graph of the nightly load" width="860" height="260">

      <h2>Rows per table</h2>
      <img src="img/rows_per_table.png" alt="Bar chart of rows loaded per table" width="860" height="300">

      <h2>Failed rows</h2>
      <table>
        <tr><th>Table</th><th>Rejected</th></tr>
        <tr><td>customers</td><td>12</td></tr>
        <tr><td>orders</td><td>3</td></tr>
      </table>

      <h2>Task duration history</h2>
      <img src="img/duration_history.png" alt="Line chart of task duration over the last 30 nights" width="860" height="300" loading="lazy">
    </body>
    </html>
    ```
- role: assistant
  content: |-
    Your page is already fine. You did not do anything wrong, and I would not change the images.

    - **The first two images load right away.** The task graph and the rows chart are visible when the page opens, so they should not have `loading="lazy"`. Lazy loading an image that is on screen only delays it.
    - **The last image is lazy.** The duration chart is below the table, so the browser can wait for it. That is the right place for `loading="lazy"`.
    - **You set `width` and `height`.** The browser reserves the space, so the page does not jump when the images arrive.

    In Green Metrics Tool micro-benchmarks, lazy loading an article with 15 photos (about 2 MB) used about 12% less CPU energy when the visitor did not scroll. When the visitor scrolled to the end, there was no difference (about 1%, which is noise). Your page has only three images, so the gain is small either way. Keep it as it is.
