messages:
- role: user
  content: |
    We run molecular dynamics simulations on our group cluster. After each run, a script writes one self-contained HTML summary (energy drift, RMSD, temperature table) and mails it to the collaborators. About 40 of these per week.

    Requirements from our PI: the file must stay a single file (no external CSS, no CDN), it must look fine when printed, and she asked me to "trim everything we don't need so the reports are lean and low-footprint". I think that means removing unused CSS. Can you do that for the template below? Please keep the print layout.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>MD run {{ run_id }}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; color: #222; }
      h1 { font-size: 1.4rem; margin-bottom: .2rem; }
      .meta { color: #666; font-size: .85rem; margin-bottom: 1.5rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid #ddd; padding: .35rem .6rem; text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      .warn { background: #fff3cd; }
      .fail { background: #f8d7da; }
      .legend { font-size: .8rem; margin-top: 1rem; }
      .sidebar { float: right; width: 12rem; }
      img.plot { max-width: 100%; margin: 1rem 0; }
      @media print {
        body { margin: 0; max-width: none; }
        .legend { display: none; }
        tr { page-break-inside: avoid; }
      }
    </style>
    </head>
    <body>
    <h1>MD run {{ run_id }}</h1>
    <div class="meta">{{ system }} · {{ n_atoms }} atoms · {{ steps }} steps · finished {{ finished }}</div>
    <img class="plot" src="data:image/png;base64,{{ rmsd_png }}" alt="RMSD over time">
    <table>
      <tr><th>Window</th><th>T (K)</th><th>Drift (kJ/mol)</th><th>RMSD (nm)</th></tr>
      {% for w in windows %}
      <tr class="{{ w.status }}"><td>{{ w.name }}</td><td>{{ w.temp }}</td><td>{{ w.drift }}</td><td>{{ w.rmsd }}</td></tr>
      {% endfor %}
    </table>
    <p class="legend">Yellow: drift above 0.5. Red: run unstable.</p>
    </body>
    </html>
    ```
- role: assistant
  content: |
    I would leave the CSS as it is. It is already tiny, so removing unused rules would not make the report measurably greener.

    - In Green Metrics Tool browser benchmarks with 50 cold page loads, a 16 KB stylesheet with mostly unused rules (~783 J) and the same page purged and minified to 0.75 KB (~764 J) differed by about 2%. That is within measurement noise.
    - Your stylesheet is roughly 1 KB, much smaller than that test file. Only `.sidebar` is unused, and it is a single line.
    - Removing CSS saves bytes, not CPU. Here the bytes are small next to the embedded RMSD plot, which makes up almost all of each mail attachment.

    If you want to tidy up, delete the `.sidebar` rule. Keep everything else, including the `@media print` block, because the print layout needs it. That is housekeeping, not an energy fix.

    If your PI wants smaller reports, look at the base64 plot instead. A smaller image, or a more compact format for it, would shrink the file far more than any CSS change. I have no measurement for your plot, so check the file size before and after.
verify:
  static_only: HTML template with Jinja placeholders; no executable code
