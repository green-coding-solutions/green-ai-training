id: gen-1-00172-no-change
category: no-change
language: css
patterns:
- minify-assets
- context-tradeoff
facts:
- F-MINIFY
messages:
- role: user
  content: |
    Hi, in our CI we have a job what build a small status page for the runners (static html + one css file, deployed to internal nginx, only our team of 8 people open it). My colleague say I must add a minify step with cssnano in the pipeline, because it is more green. I am not sure it is worth. Is this css ok like this? Sorry for my english

    ```css
    /* runner-status.css */
    :root {
      --ok: #2e7d32;
      --warn: #ed6c02;
      --fail: #c62828;
      --bg: #fafafa;
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 1rem;
    }

    table.runners {
      width: 100%;
      border-collapse: collapse;
    }

    table.runners th,
    table.runners td {
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    .status-ok   { color: var(--ok); }
    .status-warn { color: var(--warn); }
    .status-fail { color: var(--fail); font-weight: bold; }

    .stale {
      opacity: 0.5;
    }
    ```
- role: assistant
  content: |-
    Your CSS is fine as it is. I would not add a minify step for this page.

    - **Tiny file.** It is about 30 lines. Minifying would remove only whitespace and comments, so the saving is a few hundred bytes.
    - **Almost no CPU gain.** In Green Metrics Tool micro-benchmarks with 50 cold page loads of a small page, an esbuild minified build used about 2% less client CPU energy than the unminified sources. That is within measurement noise. Minifying saves bytes on the network, not measurable CPU.
    - **Internal network, 8 users.** Bytes are cheap on a local network and very few people load the page. A new CI step, a dependency and a harder-to-read deployed file cost more than they give back.

    The CSS itself is clean: no unused rules, no heavy fonts (`system-ui` needs no download), and no duplicated blocks.

    Minifying starts to make sense when the stylesheet is large, the page is public, or visitors are on slow mobile links. Then the byte saving matters. For this page, leave it out.
