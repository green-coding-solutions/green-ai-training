id: gen-12764612-00365-no-change
category: no-change
language: html
patterns:
- lazy-load-images
- context-tradeoff
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    We run a small sneaker shop. Our product page template is below. Requirements from the ticket:

    1. Lazy-load images so the page uses less energy.
    2. Don't make the page feel slower. The hero image must show immediately.
    3. Don't cause layout jumps.

    Please apply the change to the template. Most customers come from phones and open the page from an ad, so many of them never scroll far.

    ```html
    <main class="product">
      <section class="gallery">
        <img src="/img/aero-runner/main-1200.webp" width="1200" height="900"
             alt="Aero Runner, side view in white" fetchpriority="high">
        <ul class="thumbs">
          <li><img src="/img/aero-runner/t1-160.webp" width="160" height="120" alt="Aero Runner, front"></li>
          <li><img src="/img/aero-runner/t2-160.webp" width="160" height="120" alt="Aero Runner, sole"></li>
          <li><img src="/img/aero-runner/t3-160.webp" width="160" height="120" alt="Aero Runner, back"></li>
        </ul>
      </section>

      <section class="buy">
        <h1>Aero Runner</h1>
        <p class="price">€119.00</p>
        <form action="/cart/add" method="post">
          <select name="size" required>
            <option value="">Size</option>
            <option>40</option><option>41</option><option>42</option><option>43</option>
          </select>
          <button type="submit">Add to cart</button>
        </form>
      </section>
    </main>

    <section class="related">
      <h2>You may also like</h2>
      <a href="/p/aero-trail"><img src="/img/aero-trail/card-400.webp" width="400" height="300" loading="lazy" alt="Aero Trail"></a>
      <a href="/p/city-low"><img src="/img/city-low/card-400.webp" width="400" height="300" loading="lazy" alt="City Low"></a>
      <a href="/p/court-pro"><img src="/img/court-pro/card-400.webp" width="400" height="300" loading="lazy" alt="Court Pro"></a>
      <a href="/p/aero-slide"><img src="/img/aero-slide/card-400.webp" width="400" height="300" loading="lazy" alt="Aero Slide"></a>
    </section>
    ```
- role: assistant
  content: |-
    I would not change anything. The template already does what the ticket asks.

    - **Below the fold:** the four "You may also like" cards already have `loading="lazy"`. That is where lazy loading helps. Visitors who leave before scrolling never download them.
    - **Above the fold:** the hero and the three thumbnails load eagerly, which is right. Lazy-loading the hero delays the largest visible element and makes the page feel slower. That breaks your requirement 2. It also does not save energy, because these images are fetched on every visit anyway.
    - **Layout jumps:** every image has `width` and `height`, so the browser reserves the space before the image arrives.

    In Green Metrics Tool micro-benchmarks on an article with 15 photos, lazy loading below the fold used about 12% less CPU energy on page loads without scrolling. When the visitor scrolled to the end, there was no difference. Your ad traffic, where many people stop near the top, is the case where it pays off. Your template already captures that saving.

    The only candidate would be the thumbnails, but they are small and visible on phones too. Lazy-loading them would save almost nothing and could show empty boxes for a moment.

    To check the real effect on your page, compare page loads with and without scrolling in the browser's network panel. Look at the transferred bytes, or use a CPU-time proxy such as `perf stat` on a scripted browser run.
