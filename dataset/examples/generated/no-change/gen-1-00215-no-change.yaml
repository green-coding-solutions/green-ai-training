id: gen-1-00215-no-change
category: no-change
language: yaml
patterns:
- minimize-environments
- context-tradeoff
messages:
- role: user
  content: |
    fix this?

    ```yaml
    name: mpi-regression
    on:
      pull_request:
        types: [labeled, synchronize]
        paths: ['src/solver/**', 'tests/regression/**']

    concurrency:
      group: mpi-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    jobs:
      regression:
        if: contains(github.event.pull_request.labels.*.name, 'run-hpc-tests')
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
          VM_NAME: mpi-pr-${{ github.event.pull_request.number }}
        steps:
          - uses: actions/checkout@v4
          - name: Create test VM
            run: ./infra/vm.sh create "$VM_NAME" --cores 32 --ttl 2h
          - name: Run regression suite
            run: ./infra/vm.sh run "$VM_NAME" 'mpirun -n 32 pytest tests/regression -q'
          - name: Fetch results
            if: always()
            run: ./infra/vm.sh fetch "$VM_NAME" results/ || true
          - name: Destroy test VM
            if: always()
            run: ./infra/vm.sh destroy "$VM_NAME"
          - uses: actions/upload-artifact@v4
            if: always()
            with:
              name: regression-results
              path: results/
    ```
- role: assistant
  content: |
    Nothing to fix. This already follows the "minimize environments" idea, so I would not change it.

    - The 32-core VM exists only while the tests run. Nothing is left idle between PRs.
    - It starts only for solver or regression changes, and only when someone adds the `run-hpc-tests` label.
    - `cancel-in-progress` stops a stale run when a new commit arrives, so you don't pay for two VMs on one PR.
    - `if: always()` on the destroy step covers failed runs. `--ttl 2h` and `timeout-minutes: 45` are a safety net if the runner dies.

    An off-hours shutdown schedule would add nothing here. The VM never runs outside a job, so there is nothing to schedule away.

    One thing to check outside this file: if `vm.sh destroy` fails, the `--ttl 2h` must really delete the VM on the provider side. If the TTL is only a tag, a leaked VM would stay up, so test that once.

    Scheduled shutdowns, or fewer copies of an environment, matter only when you keep a long-lived shared environment, such as a staging cluster. This workflow has none.
verify:
  static_only: YAML CI workflow, needs GitHub Actions and cloud infrastructure
