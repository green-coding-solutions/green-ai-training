id: gen-1-00283-no-change
category: no-change
language: css
patterns:
- system-fonts-and-deps
- context-tradeoff
messages:
- role: user
  content: |
    fix this

    ```css
    :root {
      --bg: #12141a;
      --fg: #d8dce6;
      --muted: #8a90a0;
      --warn: #e6b450;
      --err: #f26d6d;
      --line: #232733;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    header.toolbar {
      position: sticky;
      top: 0;
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #181b23;
      border-bottom: 1px solid var(--line);
    }

    header.toolbar input[type="search"] {
      flex: 1;
      background: var(--bg);
      color: inherit;
      border: 1px solid var(--line);
      padding: 4px 8px;
      font: inherit;
    }

    table.log { width: 100%; border-collapse: collapse; }
    table.log td { padding: 2px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
    table.log td.ts { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    table.log td.msg { white-space: pre-wrap; word-break: break-word; }

    tr.warn td.lvl { color: var(--warn); }
    tr.error td.lvl { color: var(--err); font-weight: 700; }
    tr.error { background: rgba(242, 109, 109, 0.08); }

    @media (max-width: 600px) {
      table.log td.ts { display: none; }
    }
    ```
- role: assistant
  content: |
    I see nothing to fix. This stylesheet is already lean.

    - **No web fonts:** the monospace system stack means no font download and no extra request. Every OS has one of those fonts, so the page renders at once.
    - **No imports or frameworks:** it is one small file with plain CSS and custom properties, and no `@import` chain.
    - **Cheap selectors:** there are no deep or expensive rules, and no unused blocks that I can see.

    If something looks wrong in the browser, tell me what you see (which element, which browser) and I'll look at that.

    One optional idea, only if the viewer shows many thousands of rows at once: add `content-visibility: auto; contain-intrinsic-size: auto 20px;` to `table.log tr`. That lets the browser skip layout for rows that are off screen. For a few hundred rows it changes nothing, so I'd leave it out until you have long logs.
verify:
  static_only: CSS only, no runnable code and no network or packages needed
