id: gen-1-00128-no-change
category: no-change
language: go
patterns:
- hoist-invariants
- context-tradeoff
messages:
- role: user
  content: "```go\npackage inference\n\nimport \"math\"\n\ntype Normalizer struct {\n\tmean   []float32\n\tinvStd []float32\n\
    }\n\nfunc NewNormalizer(mean, std []float32) *Normalizer {\n\tinv := make([]float32, len(std))\n\tfor i, s := range std\
    \ {\n\t\tinv[i] = 1 / s\n\t}\n\treturn &Normalizer{mean: mean, invStd: inv}\n}\n\n// Apply normalizes a CHW image in place.\n\
    func (n *Normalizer) Apply(pix []float32, hw int) {\n\tfor c := range n.mean {\n\t\tm, s := n.mean[c], n.invStd[c]\n\t\
    \tplane := pix[c*hw : (c+1)*hw]\n\t\tfor i := range plane {\n\t\t\tplane[i] = (plane[i] - m) * s\n\t\t}\n\t}\n}\n\n//\
    \ Softmax writes probabilities into out (same length as logits).\nfunc Softmax(logits, out []float32) {\n\tmaxv := logits[0]\n\
    \tfor _, v := range logits[1:] {\n\t\tif v > maxv {\n\t\t\tmaxv = v\n\t\t}\n\t}\n\tvar sum float32\n\tfor i, v := range\
    \ logits {\n\t\te := float32(math.Exp(float64(v - maxv)))\n\t\tout[i] = e\n\t\tsum += e\n\t}\n\tinv := 1 / sum\n\tfor\
    \ i := range out {\n\t\tout[i] *= inv\n\t}\n}\n```\n\n?\n"
- role: assistant
  content: |-
    This code is already efficient. I would not change it.

    - **Invariants are already hoisted.** `1/std` is computed once in `NewNormalizer`, not per pixel. `Apply` turns the division into a multiply. `mean` and `invStd` are read once per channel, not once per pixel.
    - **No extra allocations in the hot path.** `Apply` works in place on slices of the input. `Softmax` writes into a caller-supplied `out`, so the caller can reuse one buffer across requests.
    - **Softmax divides once.** It computes `1/sum` once and multiplies, instead of dividing every element. Subtracting `maxv` also keeps `Exp` from overflowing.

    Two small things, neither about energy:
    - `Softmax` panics on an empty `logits` slice. Add a `len(logits) == 0` guard if the input can come from outside.
    - Only if a profile shows `Apply` or `Softmax` near the top of your inference time, look at a SIMD or batched version. Until then, the model forward pass will dominate and this code will not matter.
