id: gen-2-00023-no-change
category: no-change
language: css
patterns:
- minify-assets
- context-tradeoff
facts:
- F-MINIFY
- F-FONTS
messages:
- role: user
  content: |
    hi, I'm still learning CSS. Our GitLab CI job generates a test report (report.html + this report.css) after every pipeline and keeps it as a job artifact. A colleague ran Lighthouse on it and it says "Minify CSS". Someone else said unminified CSS wastes energy. I don't understand what is wrong with my file? Do I need to add a minify step to .gitlab-ci.yml? Only our team (6 people) opens the reports, mostly when a test fails.

    ```css
    :root {
      --pass: #1a7f37;
      --fail: #cf222e;
      --skip: #9a6700;
      --border: #d0d7de;
      --muted: #57606a;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #24292f;
      background: #fff;
    }

    header {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
    }

    .summary {
      display: flex;
      gap: 16px;
      color: var(--muted);
    }

    table.results {
      width: 100%;
      border-collapse: collapse;
    }

    table.results th,
    table.results td {
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .status-pass { color: var(--pass); }
    .status-fail { color: var(--fail); font-weight: 600; }
    .status-skip { color: var(--skip); }

    pre.stacktrace {
      margin: 4px 0 0;
      padding: 8px;
      overflow-x: auto;
      background: #f6f8fa;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    ```
- role: assistant
  content: |
    Nothing is wrong with your file. You don't need a minify step for this report.

    Lighthouse flags every file that has whitespace and comments. It does not check whether the saving matters. Minifying only removes those characters, so the file gets a bit smaller. Your stylesheet is already small, so it would lose very few bytes.

    It also does not save measurable CPU energy for small files. In Green Metrics Tool measurements of 50 cold page loads of a small booking page, the minified build used ~822 J and the unminified sources ~837 J. That is about 2% less, which is within measurement noise. Minification saves network bytes, not browser work.

    For your report the byte saving is tiny too: six people open it now and then. A minify step would install and run a tool in every pipeline, which is more work than it saves. It also makes the CSS harder to read when someone debugs the report.

    What is already good:
    - **System font stack:** no web font to download. That is the cheapest choice for fonts.
    - **Small and focused:** simple selectors, shared colors as variables, no large unused rule sets.

    Minification is worth it for a large stylesheet or bundle that many visitors download over real networks. Then you run it once in the build of that site, not for an internal CI artifact.
verify:
  static_only: CSS stylesheet, no runtime behavior to test
