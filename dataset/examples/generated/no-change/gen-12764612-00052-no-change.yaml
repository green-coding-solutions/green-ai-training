    ```python
    from decimal import Decimal, ROUND_HALF_UP
    from flask import Flask, request, jsonify

    app = Flask(__name__)

    MAX_CART_LINES = 50
    TAX_RATES = {"DE": Decimal("0.19"), "FR": Decimal("0.20"), "NL": Decimal("0.21")}
    FREE_SHIPPING_FROM = Decimal("60.00")


    def line_total(unit_price, qty, discount_pct):
        gross = Decimal(unit_price) * qty
        return gross * (Decimal(100) - Decimal(discount_pct)) / Decimal(100)


    @app.post("/cart/quote")
    def quote():
        body = request.get_json()
        lines = body["lines"][:MAX_CART_LINES]
        country = body.get("country", "DE")

        net = Decimal("0")
        for line in lines:
            net += line_total(line["unit_price"], line["qty"], line.get("discount_pct", 0))

        tax = net * TAX_RATES[country]
        shipping = Decimal("0.00") if net >= FREE_SHIPPING_FROM else Decimal("4.90")
        total = (net + tax + shipping).quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)

        return jsonify({"net": str(net.quantize(Decimal("0.01"))), "total": str(total)})
    ```

