messages:
- role: user
  content: |
    Hi, I'm pretty new to this so sorry if this is a dumb question. I wrote a small CLI for our team called `pixeldiff`. It takes Playwright screenshots of our app, compares them pixel by pixel with the baseline PNGs, and writes `pixeldiff-report/index.html`. Then it opens the report in the browser. Only the developer who ran it looks at it, on their own laptop, and the folder gets deleted on the next run.

    Our frontend lead ran Lighthouse on the report out of curiosity. It says "Serve images in next-gen formats" and lists every PNG. Now I'm not sure if my page is wrong. Should the CLI convert all the screenshots to AVIF or WebP before it writes the report?

    This is what the report looks like (shortened, normally there are 5-20 failed tests):

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>pixeldiff report – 3 of 48 screens changed</title>
      <link rel="stylesheet" href="report.css">
    </head>
    <body>
      <header>
        <h1>pixeldiff report</h1>
        <p>Run 2026-10-21 14:02 · branch <code>feature/checkout-redesign</code> · threshold 0.1%</p>
        <p class="summary"><strong>3 changed</strong>, 45 unchanged (unchanged screens are not shown)</p>
      </header>

      <main>
        <section class="case" id="checkout-step-2">
          <h2>checkout / step-2 <span class="delta">2.41% pixels differ</span></h2>
          <div class="triple">
            <figure>
              <img src="img/checkout-step-2.baseline.png" width="1280" height="800" alt="Baseline: checkout step 2">
              <figcaption>Baseline</figcaption>
            </figure>
            <figure>
              <img src="img/checkout-step-2.actual.png" width="1280" height="800" alt="Actual: checkout step 2">
              <figcaption>Actual</figcaption>
            </figure>
            <figure>
              <img src="img/checkout-step-2.diff.png" width="1280" height="800" alt="Diff: changed pixels in red">
              <figcaption>Diff</figcaption>
            </figure>
          </div>
        </section>

        <section class="case" id="cart-empty">
          <h2>cart / empty <span class="delta">0.37% pixels differ</span></h2>
          <div class="triple">
            <figure>
              <img src="img/cart-empty.baseline.png" width="1280" height="800" alt="Baseline: empty cart">
              <figcaption>Baseline</figcaption>
            </figure>
            <figure>
              <img src="img/cart-empty.actual.png" width="1280" height="800" alt="Actual: empty cart">
              <figcaption>Actual</figcaption>
            </figure>
            <figure>
              <img src="img/cart-empty.diff.png" width="1280" height="800" alt="Diff: changed pixels in red">
              <figcaption>Diff</figcaption>
            </figure>
          </div>
        </section>
      </main>
    </body>
    </html>
    ```
- role: assistant
  content: |
    Your page is fine. Keep the PNGs. Lighthouse checks every page as if it were a public website loaded over a network. Your report is not one, so this audit doesn't apply.

    Why converting would not pay off here:
    - **No network transfer.** The browser opens the report from the local disk. Modern formats save energy mainly by sending fewer bytes. Client-side decoding cost differs only moderately between formats. If nothing goes over a network, there is almost nothing to save.
    - **Extra encoding on every run.** Playwright already writes PNGs. Converting them means a second encode for every baseline, actual and diff image, on every run, for a report that gets deleted afterwards. Encoding is not cheap. In Green Metrics Tool benchmarks, encoding 50 images to AVIF used ~658 J, about 7× the cost of JPG.
    - **Exact pixels matter.** A visual diff report has to show the same pixels your tool compared. Lossy AVIF or WebP adds compression artifacts. These can hide a small change, or show "changes" that are not real, and that defeats the purpose of the report.

    The report is already lean:
    - only the changed screens get images, the 45 unchanged ones are skipped,
    - `width` and `height` are set, so the layout does not jump while the images load,
    - plain HTML, one stylesheet, no scripts.

    This changes only if you start publishing the reports to a shared server that many people open, for example from CI. Even then, keep the images lossless so the diffs stay exact.
verify:
  static_only: HTML report template with no executable code; the answer recommends no change
