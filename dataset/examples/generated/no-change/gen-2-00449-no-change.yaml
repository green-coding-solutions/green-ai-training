id: gen-2-00449-no-change
category: no-change
language: dockerfile
patterns:
- none
- context-tradeoff
facts:
- F-CONTAINER-IMAGE
messages:
- role: user
  content: |
    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONDONTWRITEBYTECODE=1 \
        PYTHONUNBUFFERED=1

    WORKDIR /app

    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY app/ ./app/
    COPY models/intent-classifier.onnx ./models/intent-classifier.onnx

    RUN useradd --system --no-create-home appuser
    USER appuser

    EXPOSE 8000
    CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ```

    ?
- role: assistant
  content: |
    This Dockerfile is already efficient. I would not change it.

    - **Slim base:** `python:3.12-slim` carries no compilers, git or dev tools. In Green Metrics Tool micro-benchmarks, building a small Flask image from a full `python:3.12` base with build tools and dev packages used about 7× more energy than a slim base with runtime dependencies only. Serving requests cost the same with both.
    - **Layer order:** `requirements.txt` is installed before the source and the model are copied. A code change only rebuilds the last layers, so CI does not reinstall packages on every push.
    - **No pip cache:** `--no-cache-dir` keeps downloaded wheels out of the image.

    I would also not add a multi-stage build. There are no build tools in the final image, so a second stage would remove nothing. It would only make the file longer.

    One thing to watch: the model file is copied last, so a new model rebuilds only that layer. If the model changes on every push, that layer is re-pushed and re-pulled each time. If it changes rarely, you are fine.
verify:
  static_only: Dockerfile needs a Docker build and network access
