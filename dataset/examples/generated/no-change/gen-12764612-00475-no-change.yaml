    ```python
    import logging

    log = logging.getLogger(__name__)


    def load_team_members(db, team_id):
        rows = db.execute(
            "SELECT user_id FROM team_members WHERE team_id = ?", (team_id,)
        ).fetchall()
        return [r[0] for r in rows]


    def remove_member(db, request):
        team_id = request["team_id"]
        target_id = request["target_id"]
        actor_id = request["actor_id"]

        members = load_team_members(db, team_id)

        if actor_id not in members:
            log.warning("actor %s is not in team %s", actor_id, team_id)
            return {"status": 403, "error": "not a team member"}

        if target_id not in members:
            return {"status": 404, "error": "target is not in this team"}

        db.execute(
            "DELETE FROM team_members WHERE team_id = ? AND user_id = ?",
            (team_id, target_id),
        )
        db.commit()
        return {"status": 200, "removed": target_id}
    ```

