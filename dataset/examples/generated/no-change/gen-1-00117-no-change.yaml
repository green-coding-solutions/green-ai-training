id: gen-1-00117-no-change
category: no-change
language: bash
patterns:
- compress-stored
- context-tradeoff
facts:
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    ```bash
    #!/usr/bin/env bash
    # keep yesterday's uploaded frames for audit/debugging of the vision model
    set -euo pipefail

    SRC=/var/lib/vision-api/uploads
    DEST=/mnt/audit/vision-api
    KEEP_DAYS=7
    day=$(date -d yesterday +%F)
    out="$DEST/uploads-$day.tar"

    mkdir -p "$DEST"
    cd "$SRC/$day"
    find . -name '*.jpg' -print0 | tar -cf "$out" --null -T -
    sha256sum "$out" > "$out.sha256"

    find "$DEST" -name 'uploads-*.tar*' -mtime +"$KEEP_DAYS" -delete
    echo "archived $day"
    ```

    ?
- role: assistant
  content: |
    This script is fine as it is. I would not change anything.

    - **No compression on purpose.** The archive holds JPEG frames. JPEG is already compressed, so gzip, xz or zstd would spend CPU and shrink the tar by very little.
    - **Short retention.** The tar is deleted after 7 days. Compression only pays off for data you store for a long time, and a week of audit files is a short time.
    - **One pass.** `find ... | tar` reads each file once, and the cleanup is a single `find -delete`. No subprocess per file.

    Quoting is also correct: single quotes for literals, double quotes around the variables.

    One thing to watch for later: if you add text files such as JSON predictions to this archive, compress those parts. Use a fast codec like zstd, not xz or brotli. In Green Metrics Tool micro-benchmarks on 100 MB of text, zstd used about 4× less energy than gzip to compress. Keep the JPEGs uncompressed in the tar.
verify:
  static_only: bash script that needs a populated uploads directory and /mnt/audit; no code change in the answer
