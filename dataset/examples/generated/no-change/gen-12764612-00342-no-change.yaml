messages:
- role: user
  content: |
    Hi, I am new to frontend and I made this page for our team. It shows the endpoints of our REST API with method, path, last status and p95 latency. It works, but I read that big pages can be bad for performance and I am not sure if I did something wrong. Can you look?

    ```javascript
    const PAGE_SIZE = 25;
    let page = 1;

    function showError(status) {
      document.querySelector('#pager').textContent = `Could not load (HTTP ${status})`;
    }

    async function loadEndpoints() {
      const res = await fetch(`/api/endpoints?page=${page}&limit=${PAGE_SIZE}`);
      if (!res.ok) {
        showError(res.status);
        return;
      }
      const { items, total } = await res.json();

      const tbody = document.querySelector('#endpoints tbody');
      const frag = document.createDocumentFragment();
      for (const e of items) {
        const tr = document.createElement('tr');
        for (const value of [e.method, e.path, e.status, e.p95Ms]) {
          const td = document.createElement('td');
          td.textContent = value;
          tr.appendChild(td);
        }
        frag.appendChild(tr);
      }
      tbody.replaceChildren(frag);

      const pages = Math.ceil(total / PAGE_SIZE);
      document.querySelector('#pager').textContent = `Page ${page} of ${pages}`;
    }

    document.querySelector('#next').addEventListener('click', () => { page++; loadEndpoints(); });
    document.querySelector('#prev').addEventListener('click', () => { if (page > 1) { page--; loadEndpoints(); } });
    loadEndpoints();
    ```
- role: assistant
  content: |
    You did nothing wrong. This code already avoids the big-DOM problem, so I would not change it.

    - **Small pages:** the server returns one page of rows (`limit=PAGE_SIZE`), so the browser never holds the whole list. In Green Metrics Tool browser benchmarks, a 10,000-row table built from many wrapper elements per row used about 56% less CPU energy when it was paginated to 100 rows per page as a plain `<table>` built in a `DocumentFragment`. Your page already has that shape, with smaller pages.
    - **Plain elements:** one `<td>` per value, no extra wrappers around cells.
    - **One DOM update per page:** you build the rows in a fragment and swap them in once with `replaceChildren`. This also clears the old rows.
    - **Safe text:** `textContent` does not interpret HTML, so a strange path value cannot inject markup.

    One thing to keep: make sure the API caps `limit` on the server. Then nobody can ask for `limit=100000` and bring the big table back.
verify:
  static_only: needs a browser DOM and a fetch endpoint
