id: gen-1-00415-no-change
category: no-change
language: javascript
patterns:
- system-fonts-and-deps
- context-tradeoff
messages:
- role: user
  content: |
    hi, i am student and i made small script to test our image classifier that runs on the lab server. it works but my friend say it looks too simple and i should use axios and lodash and maybe a progress bar package. i dont know whats wrong with it, can you look?

    ```javascript
    // classify.js  (node 20)
    import { readFile, readdir } from "node:fs/promises";
    import path from "node:path";

    const ENDPOINT = process.env.MODEL_URL ?? "http://lab-gpu-01:8080/predict";
    const LABELS = ["cat", "dog", "bird", "other"];

    function argmax(scores) {
      let best = 0;
      for (let i = 1; i < scores.length; i++) {
        if (scores[i] > scores[best]) best = i;
      }
      return best;
    }

    async function main() {
      const dir = process.argv[2];
      if (!dir) {
        console.error("usage: node classify.js <image-dir>");
        process.exit(1);
      }

      const names = (await readdir(dir)).filter((n) => n.endsWith(".jpg"));
      const images = await Promise.all(
        names.map(async (n) => (await readFile(path.join(dir, n))).toString("base64"))
      );

      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ images }),
      });
      if (!res.ok) throw new Error(`model server returned ${res.status}`);

      const { scores } = await res.json();
      names.forEach((n, i) => {
        console.log(`${n}\t${LABELS[argmax(scores[i])]}`);
      });
    }

    main().catch((err) => {
      console.error(err.message);
      process.exit(1);
    });
    ```
- role: assistant
  content: |
    Nothing is wrong with it. Your friend's advice would make it worse, so I would not add those packages.

    - **No dependencies.** Node 20 already has `fetch`, so axios adds nothing here. Every package adds install size, download time and code that has to be kept up to date.
    - **lodash is not needed.** Your `argmax` is a single pass with no extra arrays, and `filter`, `map` and `forEach` cover the rest.
    - **One request for all images.** You send one batch call instead of one request per image. This is the part that matters most for a model server.
    - **Good error handling.** You check `res.ok`, print a clear message and exit with a non-zero code.

    A progress bar is not worth it for a short lab script. It is extra code and an extra package for a few seconds of waiting.

    One thing to watch if your image folders get big: the script reads every image into memory and sends them all in one request. If a folder has thousands of images, send them in chunks of a few hundred. For a normal test folder, what you have is fine.
verify:
  static_only: needs a running model server and image files on disk
