id: gen-6593849-00003-no-change
category: no-change
language: python
patterns:
- simple-conditions
- context-tradeoff
facts:
- F-COND
messages:
- role: user
  content: |
    We run a small online shop for garden tools (about 300 orders a day). I'm cleaning up the checkout module and I want to know if this shipping fee function should be rewritten.

    Requirements:
    - The result must stay exactly the same (fees are in cents, finance checks them).
    - I would like to keep the code easy to read for the next dev.
    - Someone told me the range checks are "complex conditions" and slow. Is that true here?

    ```python
    EU = {"DE", "FR", "NL", "AT", "BE", "ES", "IT", "PL"}

    def shipping_fee_cents(country, weight_g, subtotal_cents, is_member):
        if subtotal_cents >= 7500 and country in EU:
            return 0
        if is_member and subtotal_cents >= 5000 and country == "DE":
            return 0
        if country == "DE":
            if 0 < weight_g <= 1000:
                return 490
            elif 1000 < weight_g <= 5000:
                return 690
            elif 5000 < weight_g <= 20000:
                return 1290
            raise ValueError("parcel too heavy for standard shipping")
        if country in EU:
            if 0 < weight_g <= 2000:
                return 990
            elif 2000 < weight_g <= 10000:
                return 1590
            raise ValueError("parcel too heavy for EU shipping")
        return 2490
    ```
- role: assistant
  content: |-
    No, leave it as it is.

    Complex conditions do cost a bit more than simple ones. In Green Metrics Tool micro-benchmarks over 10,000,000 classifications, simple equality branches used about 16% less CPU energy than complex range and modulo conditions (~46 J vs ~54 J). But that is a loop with ten million calls. Your function runs once per order, so a few range comparisons per checkout are far too small to matter. The database query, the payment call and rendering the page cost much more.

    The code is also already in a good shape:
    - The cheap cases come first: the free-shipping checks return early.
    - The bands are short, ordered `elif` chains. Each one reads like the fee table.
    - A rewrite would not keep the same behavior for free. Turning bands into equality checks or a lookup table would add a second place where the boundaries live. That risks an off-by-one in the fees, and finance would see it.

    If this function ever runs over millions of rows, for example a bulk repricing job, measure it then. Until that point, readability wins.
