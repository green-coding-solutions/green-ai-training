        ],
        "cta": {"url": "/signup?plan=pro&ref=lp", "label": "Start now"},
    }
    page = render_page(content)
    assert "<title>Ship &amp; Grow</title>" in page
    assert "Faster &lt;launches&gt;" in page
    assert page.count('<article class="feature">') == 2
    assert "&lt;b&gt;seconds&lt;/b&gt;" in page
    assert "&quot;built in&quot;" in page
    assert 'href="/signup?plan=pro&amp;ref=lp"' in page
    assert unescape("&amp;") == "&"
    import tempfile, os, json as _json
    d = tempfile.mkdtemp()
    src = os.path.join(d, "content.json")
    dest = os.path.join(d, "index.html")
    with open(src, "w", encoding="utf-8") as fh:
        _json.dump(content, fh)
    main(src, dest)
    with open(dest, encoding="utf-8") as fh:
        assert fh.read() == page
    print("ok")
