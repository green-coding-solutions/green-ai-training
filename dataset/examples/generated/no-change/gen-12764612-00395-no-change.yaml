- role: assistant
  content: |-
    This is already in good shape. I would not change it.

    - **Format fallback:** AVIF first, then WebP, then JPEG. Browsers that support AVIF or WebP get fewer bytes. The rest still get a working JPEG. The savings of modern formats come mainly from fewer transferred bytes. In Green Metrics Tool micro-benchmarks, decoding AVIF cost about 19% more client CPU energy than JPG, so the byte saving is the reason to use it.
    - **Sizes and priority:** `srcset` with `sizes` lets small screens skip the 1600 px file. `width` and `height` are set, so the layout does not jump. The hero is eager with `fetchpriority="high"`, which is right for the image above the fold.
    - **Lazy loading:** only the diagram below the fold has `loading="lazy"`. In the same benchmarks, lazy loading saved about 12% on page loads where visitors did not scroll, and made no difference when they scrolled to the end. So it helps here and does no harm.
    - **Logo:** the inline SVG is the right choice for a small icon. No raster format beats it.

    One thing to check outside this file: the AVIF and WebP files should be encoded once in your build or upload step, never per request. AVIF encoding cost about 7× JPG encoding in the measurements.
