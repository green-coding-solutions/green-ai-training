id: gen-1-00186-no-change
category: no-change
language: html
patterns:
- lazy-load-images
- context-tradeoff
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    hello, this is the product page of our shop (handmade leather bags). my boss say the page must be "green" so I want put loading="lazy" on all images, also the big one. is this ok or I forget something? thx

    ```html
    <main class="product">
      <section class="product-gallery">
        <img src="/img/bag-milano-main.jpg" alt="Milano leather bag, front view"
             width="900" height="900" fetchpriority="high">
        <ul class="thumbs">
          <li><img src="/img/bag-milano-thumb-1.jpg" alt="Side view" width="120" height="120"></li>
          <li><img src="/img/bag-milano-thumb-2.jpg" alt="Inside pocket" width="120" height="120"></li>
          <li><img src="/img/bag-milano-thumb-3.jpg" alt="Strap detail" width="120" height="120"></li>
        </ul>
      </section>

      <section class="product-info">
        <h1>Milano shoulder bag</h1>
        <p class="price">189,00 €</p>
        <button class="add-to-cart" type="button">Add to cart</button>
      </section>

      <section class="related">
        <h2>You may also like</h2>
        <div class="related-grid">
          <a href="/p/roma"><img src="/img/bag-roma.jpg" alt="Roma tote" width="300" height="300" loading="lazy" decoding="async"></a>
          <a href="/p/torino"><img src="/img/bag-torino.jpg" alt="Torino backpack" width="300" height="300" loading="lazy" decoding="async"></a>
          <a href="/p/napoli"><img src="/img/bag-napoli.jpg" alt="Napoli clutch" width="300" height="300" loading="lazy" decoding="async"></a>
          <a href="/p/verona"><img src="/img/bag-verona.jpg" alt="Verona belt bag" width="300" height="300" loading="lazy" decoding="async"></a>
        </div>
      </section>
    </main>
    ```
- role: assistant
  content: |-
    Your page is already done right. I would not change it, and I would not add `loading="lazy"` to the big image.

    - **Main image and thumbnails:** They are in the first screen, so every visitor sees them at once. Lazy loading here saves nothing and can only delay the picture people came to see. The main image also has `fetchpriority="high"`, which is the correct hint for it.
    - **"You may also like" images:** They are below the fold and already have `loading="lazy"`. This is the only place where the pattern fits.
    - **`width` and `height` on every image:** The browser reserves the space, so the layout does not jump while images load.

    Also keep in mind that lazy loading only saves work when visitors do not scroll to the images. In Green Metrics Tool micro-benchmarks with an article of 15 photos, lazy loading used about 12% less energy on page loads without scrolling. When the visitor scrolled to the end, there was no difference. Your related products are a small part of the page, so the gain here is small anyway.

    Your boss's goal is already met on this page. A new rule like "lazy on all images" would make the first screen worse, not greener.
