id: gen-1-00293-no-change
category: no-change
language: python
patterns:
- select-columns
- context-tradeoff
facts:
- F-PG-SELECT
- F-PG-COLUMNS
messages:
- role: user
  content: |
    hello, our dev tool say "SELECT * is bad for performence" on this function. It is for the start page of our company site, Postgres with psycopg 3. Do I must change it? I am not sure becuase table is very small

    ```python
    from flask import render_template

    def landing_page(conn):
        with conn.cursor() as cur:
            cur.execute("SELECT * FROM landing_features WHERE is_active ORDER BY position")
            rows = cur.fetchall()

        features = [
            {"id": r[0], "title": r[1], "icon": r[2], "position": r[3]}
            for r in rows
        ]
        return render_template("landing.html", features=features)
    ```

    Table is: `id int, title varchar(80), icon varchar(40), position int, is_active bool`. Always 6 or 7 rows.
- role: assistant
  content: |
    No, you don't have to change it. The warning is right for wide tables, but it doesn't fit this one.

    - The table has 5 narrow columns, and you use 4 of them. The only column you skip is a boolean.
    - There are 6 or 7 rows. There is no large text column to drag over the wire.
    - In Green Metrics Tool micro-benchmarks, naming 10 columns instead of `SELECT *` used about 5.5× to 7× less energy. That was on a 52-column products table with large text columns. The saving grows with the size of the columns you skip, and here there is almost nothing to skip.

    If you want to quiet the tool, naming the columns is harmless:

    ```python
    cur.execute(
        "SELECT id, title, icon, position FROM landing_features "
        "WHERE is_active ORDER BY position"
    )
    ```

    Do it for clarity, not for energy. It also stops a surprise later: if someone adds a long `description` or a JSON column to this table and the page doesn't show it, `SELECT *` would start loading it on every request. At that point, name the columns.
verify:
  static_only: needs a running PostgreSQL, psycopg and Flask
