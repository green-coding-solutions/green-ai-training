messages:
- role: user
  content: |
    Motion CSS for our marketing landing page. Anything to change? Diff only please.

    ```css
    .hero h1,
    .hero p,
    .hero .cta {
      opacity: 0;
      transform: translateY(16px);
      animation: rise 600ms ease-out forwards;
    }
    .hero p   { animation-delay: 120ms; }
    .hero .cta { animation-delay: 240ms; }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .plan-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      background: var(--surface);
      transition: transform 200ms ease, box-shadow 200ms ease;
    }
    .plan-card:hover,
    .plan-card:focus-within {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.12);
    }

    .plan-card .badge {
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero h1,
      .hero p,
      .hero .cta {
        opacity: 1;
        transform: none;
        animation: none;
      }
      .plan-card {
        transition: none;
      }
    }
    ```
- role: assistant
  content: |-
    No diff. This is already the cheap form.

    **Green Notes**
    - **CSS animations** (reduces E): the hero entrance uses `@keyframes` and the card hover uses `transition`, so the browser runs them without any JavaScript on the main thread. In Green Metrics Tool micro-benchmarks, a 20-second animation used about 10% less CPU energy with CSS `@keyframes` than with a `requestAnimationFrame` loop that updates styles. You have no such loop to replace.
    - **One-shot motion:** the entrance runs for under a second, and the hover only runs while a card is hovered or focused. Nothing animates continuously, so there is nothing left to cut.
    - **Reduced motion:** the `prefers-reduced-motion` block skips the animation completely for users who ask for it.
    - *Not applied:* any rewrite or extra tuning. It would add code and change nothing measurable here.
