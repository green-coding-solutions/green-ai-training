- context-tradeoff
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    PR review on our ensemble summary page. Reviewer wants `loading="lazy"` on every `<img>` "for energy". People open this on their workstation monitors after each run. Most only look at the four overview maps, and few scroll through the members. Diff only please.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>ENS-2026-09 · ensemble summary</title>
      <link rel="stylesheet" href="report.css">
    </head>
    <body>
      <header>
        <h1>ENS-2026-09 · 30-member ensemble, SSP2-4.5</h1>
        <p>Model rev <code>a91f3c2</code> · finished 2026-10-21 04:12 UTC ·
           <a href="ens-2026-09_mean.nc">ensemble mean (NetCDF)</a></p>
      </header>

      <section class="overview">
        <h2>Ensemble mean, 2041–2060 vs 1995–2014</h2>
        <div class="grid-4">
          <figure><img src="maps/tas_anom.png" width="320" height="200" alt="Near-surface temperature anomaly"><figcaption>tas (K)</figcaption></figure>
          <figure><img src="maps/pr_anom.png" width="320" height="200" alt="Precipitation anomaly"><figcaption>pr (mm/day)</figcaption></figure>
          <figure><img src="maps/psl_anom.png" width="320" height="200" alt="Sea-level pressure anomaly"><figcaption>psl (hPa)</figcaption></figure>
          <figure><img src="maps/siconc_anom.png" width="320" height="200" alt="Sea-ice concentration anomaly"><figcaption>siconc (%)</figcaption></figure>
        </div>
      </section>

      <section class="members">
        <h2>Per-member tas anomaly</h2>
        <div class="grid-6">
          <figure><img src="members/r1i1p1f1_tas.png" width="200" height="125" loading="lazy" alt="Member r1i1p1f1"><figcaption>r1i1p1f1</figcaption></figure>
          <figure><img src="members/r2i1p1f1_tas.png" width="200" height="125" loading="lazy" alt="Member r2i1p1f1"><figcaption>r2i1p1f1</figcaption></figure>
          <!-- r3 ... r30 generated by make_summary.py, same markup -->
        </div>
      </section>

      <section class="diagnostics">
        <h2>Spread and drift</h2>
        <img src="diag/spread_timeseries.png" width="960" height="320" loading="lazy" alt="Ensemble spread over time">
        <img src="diag/drift_control.png" width="960" height="320" loading="lazy" alt="Control run drift">
      </section>
    </body>
    </html>
    ```
- role: assistant
  content: |
    No diff. The page already uses lazy loading where it helps. Adding it to the four maps would make the page worse.

    - **Overview maps:** they fill the first screen on a workstation monitor, and they are the reason people open the page. They load on every visit anyway, so `loading="lazy"` saves nothing there. It can also delay them, because the browser only fetches a lazy image after layout shows it is near the viewport. Keep them eager.
    - **Member panels and diagnostics:** these are already lazy, and this is the case where lazy loading pays off. In Green Metrics Tool measurements of an article with 15 photos, lazy loading below the fold used about 12% less CPU energy on page loads without scrolling. When visitors scrolled to the end, the difference was about 1%, which is noise. Your readers mostly stop after the maps, so you already get that saving.

    What to tell the reviewer: lazy loading saves energy only for images people never scroll to. Images above the fold are the one place where it costs you.
verify:
  static_only: html page, no runnable code
