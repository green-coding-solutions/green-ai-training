id: gen-2-00036-no-change
category: no-change
language: nginx
patterns:
- text-compression
- context-tradeoff
facts:
- F-TEXT-COMPRESS
messages:
- role: user
  content: |
    Perf audit ticket says: "Enable gzip for /media and raise gzip_comp_level to 9 to cut bandwidth." /media is product photos (JPEG and WebP, ~40k SKUs). /assets is our Vite build, CI already writes .gz next to every JS/CSS file. Just give me the diff.

    ```nginx
    upstream shop_api {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 443 ssl http2;
        server_name shop.example.com;

        ssl_certificate     /etc/ssl/shop/fullchain.pem;
        ssl_certificate_key /etc/ssl/shop/privkey.pem;

        root /srv/shop/public;

        gzip on;
        gzip_comp_level 4;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_proxied any;
        gzip_types application/json text/plain;

        location /assets/ {
            gzip_static on;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /srv/shop/media/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location /api/ {
            proxy_pass http://shop_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri /index.html;
        }
    }
    ```
- role: assistant
  content: |
    No diff. Both changes would cost CPU and save no bandwidth worth having. The config already does the right thing.

    - **gzip for /media:** JPEG and WebP are already compressed. Running gzip over them burns CPU on every request and the output is barely smaller, sometimes larger. Leaving `image/*` out of `gzip_types` is correct.
    - **/assets:** `gzip_static on` with `.gz` files from CI is the efficient setup. The files are compressed once per build, not on every request. In Green Metrics Tool benchmarks with nginx serving 2,000 text asset requests, compression sent about 10× fewer bytes, and compressing per request cost about 4× the CPU energy of serving precompressed files.
    - **`gzip_comp_level 9`:** The only thing still compressed on the fly is API JSON. Each response gets compressed fresh, so a higher level adds CPU work to every API call. For responses that differ every time, a moderate level is the right trade-off. If the audit wants proof, compare response size and nginx CPU time at both levels under the same `wrk` load before changing it.

    One thing to check, not change: JS and CSS are not in `gzip_types`, so a missing `.gz` file in a build is served uncompressed. A CI check that every `.js`/`.css` file has a matching `.gz` file keeps that from happening silently.

    Suggested reply for the ticket: "Images are already compressed formats. Static assets are precompressed at build time. Not applied."
verify:
  static_only: nginx config, no runnable code in the answer
