id: gen-1-00361-no-change
category: no-change
language: bash
patterns:
- bash-builtins
- context-tradeoff
messages:
- role: user
  content: |
    Post-run summary for our MD jobs. Thermo files are ~3M lines. Diff only please, anything to cut?

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    thermo=${1:?usage: $0 thermo.dat [summary.txt]}
    out=${2:-summary.txt}

    host=$(hostname -s)
    stamp=$(date +%F)

    {
      printf 'host %s\ndate %s\n' "$host" "$stamp"
      awk '
        /^#/ { next }
        NF >= 3 {
          n++
          e = $3
          sum += e
          if (n == 1 || e < min) min = e
          if (n == 1 || e > max) max = e
        }
        END {
          if (n == 0) { print "no data" > "/dev/stderr"; exit 1 }
          printf "frames %d\nmean %.6f\nmin %.6f\nmax %.6f\n", n, sum / n, min, max
        }
      ' "$thermo"
    } > "$out"

    printf 'summary written to %s\n' "$out"
    ```
- role: assistant
  content: |-
    No diff. This is already the efficient shape.

    - **One pass over the big file.** A single `awk` process reads the 3M lines once and keeps count, sum, min and max in memory. A `while read` loop in bash, or one `awk`/`sort`/`head` call per statistic, would be much more work.
    - **Only two forks, once per run.** `hostname` and `date` run one time each. Replacing `date` with `printf '%(%F)T'` would save a fork, but the cost is tiny next to reading the file and the simulation that made it. It would not pay off, so leave it.
    - **No useless pipes.** The file goes straight into `awk`, and `set -euo pipefail` plus the empty-data check make failures visible.

    **Green Notes**
    - *Not applied:* shell builtins instead of `hostname`/`date`. The forks run once per job, so the saving is too small to justify the change.
    - Builtins would matter if this ran per line or per file inside a loop over thousands of items. Here it does not.
