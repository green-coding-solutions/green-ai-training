id: gen-12764612-00072-no-change
category: no-change
language: bash
patterns:
- bash-quoting
- context-tradeoff
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    fix this

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    SRC="./dist"
    DEST="${1:-/var/www/landing}"

    echo "Building landing page..."
    npm run build --silent

    echo "Publishing to $DEST"
    rsync -a --delete "$SRC"/ "$DEST"/
    echo "Done"
    ```
- role: assistant
  content: |
    Nothing needs fixing. This script is fine as it is.

    - **Quoting:** `"$SRC"`, `"$DEST"` and `"${1:-...}"` must stay in double quotes. They need expansion, and the quotes protect paths with spaces.
    - **Plain literals:** `"./dist"`, `"Building landing page..."` and `"Done"` could be single-quoted. But it makes no practical difference here. In Green Metrics Tool micro-benchmarks, single quotes used about 24% less CPU energy than double quotes. That was for a 6,200-character literal assigned 1,000,000 times in a loop. Your literals are a few characters long and run once per deploy. The time is spent in `npm run build` and `rsync`.
    - **Safety:** `set -euo pipefail` and a single `rsync` call are the right shape for a publish step.

    If your linter asks for single quotes on plain literals, change those three by hand. Treat it as style, not as an energy fix.
verify:
  static_only: bash deploy script needs npm and rsync; no measurable change proposed
