id: gen-12764612-00301-no-change
category: no-change
language: html
patterns:
- lazy-load-images
- context-tradeoff
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    hi, I am new and I build the cart page for our small tea shop. it works but a friend say "something is wrong with your images, they are not optimized". I am not sure what is wrong. can you look?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Your cart - Kettle &amp; Leaf</title>
      <link rel="stylesheet" href="/css/cart.css">
    </head>
    <body>
      <header>
        <img src="/img/logo.svg" alt="Kettle &amp; Leaf" width="140" height="40">
      </header>

      <main>
        <h1>Your cart (3 items)</h1>
        <ul class="cart-items">
          <li>
            <img src="/img/products/sencha-80.webp" alt="Sencha green tea, 100 g" width="80" height="80">
            <span class="name">Sencha, 100 g</span>
            <span class="price">8.90 EUR</span>
          </li>
          <li>
            <img src="/img/products/earl-grey-80.webp" alt="Earl Grey, 100 g" width="80" height="80">
            <span class="name">Earl Grey, 100 g</span>
            <span class="price">7.50 EUR</span>
          </li>
          <li>
            <img src="/img/products/chamomile-80.webp" alt="Chamomile, 50 g" width="80" height="80">
            <span class="name">Chamomile, 50 g</span>
            <span class="price">5.20 EUR</span>
          </li>
        </ul>

        <p class="total">Total: 21.60 EUR</p>
        <a class="button" href="/checkout">Go to checkout</a>
      </main>
    </body>
    </html>
    ```
- role: assistant
  content: |-
    I see nothing wrong with the images. This page is already in good shape.

    - **Small files.** The thumbnails are 80×80 WebP, and the logo is an SVG. A vector logo is the right choice for something this small.
    - **Sizes are set.** `width` and `height` are on every image, so the page does not jump while it loads.
    - **Good alt texts.** They describe the products.

    You may have been told to add `loading="lazy"`. Don't do it here. All four images are at the top of a short page, so visitors see them right away. Lazy loading only helps for images below the fold, and only when visitors don't scroll down to them. In Green Metrics Tool micro-benchmarks with a 15-photo article, lazy loading used about 12% less energy on page loads without scrolling. When the visitor scrolled to the end, there was no measurable difference. On visible images it would only delay them and add work.

    Lazy loading becomes useful if the cart grows into a long list, or if you add a "You may also like" row far below the checkout button. Put `loading="lazy"` on those images, not on the ones above.

    Your friend may have meant something else, like a very large product photo on another page. If so, send that page and I'll look at it.
