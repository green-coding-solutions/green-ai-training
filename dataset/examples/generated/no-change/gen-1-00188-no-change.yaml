id: gen-1-00188-no-change
category: no-change
language: yaml
patterns:
- text-compression
- context-tradeoff
messages:
- role: user
  content: |
    Hello, we have online shop with many product photos. I want to make the site more fast and save bandwith, so I think to add the images to gzip types in our ingress config. Is this good idea? Here is the configmap now:

    ```yaml
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ingress-nginx-controller
      namespace: ingress-nginx
    data:
      use-gzip: "true"
      gzip-level: "4"
      gzip-min-length: "1024"
      gzip-types: >-
        text/html text/css text/plain text/xml
        application/javascript application/json
        application/xml image/svg+xml
      proxy-body-size: "20m"
      keep-alive: "75"
      enable-brotli: "false"
    ```

    I want to add image/jpeg, image/webp and also application/zip for the downloads of price lists.
- role: assistant
  content: |-
    No, please don't add them. JPEG, WebP and ZIP are already compressed. Gzip cannot make them much smaller, so nginx would spend CPU on every image request and send almost the same bytes. Your page would not get faster, and the ingress would use more energy.

    Your config is already good for this job:
    - It compresses only text formats: HTML, CSS, JS, JSON, XML and SVG. SVG is text, so it belongs in the list.
    - `gzip-level: "4"` is a moderate level. It is a good choice for responses that are compressed again on every request.
    - `gzip-min-length: "1024"` skips tiny responses, where the gzip header and CPU cost are not worth it.

    To really reduce the bytes of your photos, work on the files, not the ingress:
    - Encode them once at upload or build time as WebP or AVIF, in sizes that match what the page shows.
    - Add `loading="lazy"` for images below the fold.
    - Send the right size per device with `srcset`.

    For the price lists, a ZIP is fine as it is. If they are CSV or JSON, add `text/csv` to `gzip-types` and serve them uncompressed from storage.
