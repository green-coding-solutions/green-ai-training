id: gen-1-00056-no-change
category: no-change
language: html
patterns:
- css-animations
- context-tradeoff
facts:
- F-ANIM
messages:
- role: user
  content: |
    We have a small status page that the gateway serves from its own flash on a Raspberry Pi class box. Technicians open it on a tablet in the plant to check if the Modbus bridge is alive.

    Requirements:
    - a green "heartbeat" dot that pulses while the bridge is online
    - when the bridge is offline the dot turns red and stops pulsing
    - the page asks /api/bridge every 5 seconds
    - no frameworks, the box has little space

    Before I ship it, can you check if the animation part can be made more energy efficient? The tablets run on battery all shift.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Bridge status</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        .row { display: flex; align-items: center; gap: .75rem; font-size: 1.25rem; }
        .dot { width: 18px; height: 18px; border-radius: 50%; background: #c62828; }
        .dot.online { background: #2e7d32; animation: beat 1.4s ease-in-out infinite; }
        @keyframes beat {
          0%, 100% { transform: scale(1); opacity: 1; }
          50%      { transform: scale(1.35); opacity: .6; }
        }
      </style>
    </head>
    <body>
      <div class="row">
        <span id="dot" class="dot"></span>
        <span id="label">Checking...</span>
      </div>
      <script>
        const dot = document.getElementById('dot');
        const label = document.getElementById('label');

        async function poll() {
          try {
            const res = await fetch('/api/bridge', { cache: 'no-store' });
            const data = await res.json();
            dot.classList.toggle('online', data.online === true);
            label.textContent = data.online ? 'Bridge online' : 'Bridge offline';
          } catch (e) {
            dot.classList.remove('online');
            label.textContent = 'Gateway unreachable';
          }
        }

        poll();
        setInterval(poll, 5000);
      </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    The animation part is already in the efficient form. I would not change it.

    - **CSS keyframes, not a JS loop.** The pulse runs as a `@keyframes` rule. In Green Metrics Tool micro-benchmarks of a 20-second animation in a real browser, a `requestAnimationFrame` loop with style updates used about 161 J of CPU energy, and CSS `@keyframes` about 145 J, roughly 10% less. You already have the cheaper one.
    - **JS only changes state.** The script runs once every 5 seconds to toggle a class and set the label. It does not drive any frames.
    - **Cheap properties.** The keyframes change only `transform` and `opacity`, and the dot is tiny. Nothing here forces layout work on each frame.
    - **No animation when offline.** The `animation` rule sits on `.online` only, so the dot is static when the bridge is down.

    **Green Notes**
    - **CSS animation** (reduces E): already used for the pulse, nothing to move out of JavaScript.
    - *Not applied:* any rewrite of the polling or the animation. The page is one dot and one label, so a change would cost more in readability than it could save on the tablet.

    Ship it as is.
verify:
  static_only: HTML page with browser-only CSS animation and fetch calls; no stdlib or numpy code to run
