    fix this

    ```python
    import sys
    from datetime import datetime, timezone

    COLUMNS = ("sensor_id", "ts", "temp_c", "humidity")


    def format_row(rec):
        ts = datetime.fromtimestamp(rec["ts"], tz=timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        values = (rec["sensor_id"], ts, f"{rec['temp_c']:.2f}", f"{rec['humidity']:.1f}")
        return "|".join(str(v) for v in values)


    def build_load_file(records):
        lines = ["|".join(COLUMNS)]
        for rec in records:
            if rec.get("temp_c") is None or rec.get("humidity") is None:
                continue
            lines.append(format_row(rec))
        return "\n".join(lines) + "\n"


    def main():
        records = [
            {"sensor_id": "s-01", "ts": 1760000000, "temp_c": 21.456, "humidity": 40.04},
            {"sensor_id": "s-02", "ts": 1760000060, "temp_c": None, "humidity": 38.0},
            {"sensor_id": "s-03", "ts": 1760000120, "temp_c": 19.0, "humidity": 55.55},
        ]
        sys.stdout.write(build_load_file(records))


    if __name__ == "__main__":
        main()
    ```
- role: assistant
  content: |
    Nothing to fix here. This code already builds the output the efficient way.

    - **One join at the end.** Rows go into a list and `"\n".join(lines)` makes the string once. Repeated `+=` on a growing string is the slow version. In Green Metrics Tool micro-benchmarks with 1,000,000 pieces, `+=` used about 469 J and `"".join()` about 1.8 J.
    - **The f-strings are fine.** They format single values inside one row. They are not used to grow the file string across the loop. That would behave like `+=`.
    - **Bad rows are skipped early.** Rows with missing values never get formatted.

    If this job feels slow, the cause is not string building. Measure with a profiler or `time` on a real input to find it, and change only what shows up.
