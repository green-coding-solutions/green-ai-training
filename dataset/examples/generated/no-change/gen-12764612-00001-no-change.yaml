id: gen-12764612-00001-no-change
category: no-change
language: html
patterns:
- lazy-load-images
- none
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    hi, I made the landing page for my sister's pottery studio. A friend looked at it and said "your images are not right", but he did not say what. I am a beginner and I can't see the problem. Can you check?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Clay &amp; Fire Pottery Studio</title>
      <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <header>
        <h1>Clay &amp; Fire</h1>
        <nav>
          <a href="#classes">Classes</a>
          <a href="#shop">Shop</a>
          <a href="#visit">Visit</a>
        </nav>
      </header>

      <section class="hero">
        <img src="img/studio-hero.jpg" alt="Wheel-thrown bowls drying on a wooden shelf" width="1600" height="900">
        <h2>Hand-made bowls, mugs and vases</h2>
        <a class="button" href="#classes">Book a class</a>
      </section>

      <section id="classes">
        <h2>Classes</h2>
        <p>Beginner evenings every Tuesday. Clay and glaze are included.</p>
        <img src="img/class-evening.jpg" alt="Students at the wheel" width="1200" height="800" loading="lazy">
      </section>

      <section id="shop">
        <h2>From the shop</h2>
        <img src="img/mugs.jpg" alt="Set of four speckled mugs" width="800" height="800" loading="lazy">
        <img src="img/vase.jpg" alt="Tall blue vase" width="800" height="800" loading="lazy">
      </section>

      <footer id="visit">
        <p>12 Mill Lane, open Tue-Sat 10:00-18:00</p>
      </footer>
    </body>
    </html>
    ```
- role: assistant
  content: |-
    I don't see a problem with the images. This is already the right setup, so I would not change anything.

    - **The hero image loads right away.** It has no `loading="lazy"`, and that is correct. It is the first thing visitors see. Lazy-loading it would only delay it.
    - **The three images further down have `loading="lazy"`.** The browser skips them until a visitor scrolls near them.
    - **Every image has `alt`, `width` and `height`.** The page won't jump around while images load, and screen readers get a description.

    On energy: in Green Metrics Tool micro-benchmarks, an article with 15 photos used about 12% less energy when visitors did not scroll to the images. When visitors scrolled to the end, there was no difference. So the saving depends on how people use your page, and it does no harm either way. Your page has only three images below the fold, so the effect will be small.

    Your friend may have meant something else, like image file size or the look of the page. If you ask him, I can look at that part. As far as lazy loading goes, the code is fine as it is.
