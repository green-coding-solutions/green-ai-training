id: gen-1-00291-no-change
category: no-change
language: java
patterns:
- string-join
- context-tradeoff
messages:
- role: user
  content: |
    hi, im new to java. i wrote this class for our gateway that collects sensor values and sends them over mqtt. a tutorial said string concatenation in java is slow and bad. is something wrong in my code? not sure what to fix

    ```java
    package io.plantlink.gateway;

    import java.time.Instant;
    import java.util.List;

    public class ReadingFormatter {

        private static final String SEP = ",";

        public String topicFor(String siteId, String deviceId) {
            return "sites/" + siteId + "/devices/" + deviceId + "/telemetry";
        }

        public String toCsvLine(String deviceId, Instant ts, List<Double> channels) {
            StringBuilder sb = new StringBuilder(64);
            sb.append(deviceId).append(SEP).append(ts.toEpochMilli());
            for (double v : channels) {
                sb.append(SEP).append(v);
            }
            return sb.toString();
        }

        public String toBatchPayload(List<String> lines) {
            StringBuilder sb = new StringBuilder(lines.size() * 48);
            for (String line : lines) {
                sb.append(line).append('\n');
            }
            return sb.toString();
        }
    }
    ```
- role: assistant
  content: |
    Nothing is wrong here. The tutorial is right about one case, and your code already avoids it.

    The slow case is `+=` on a string inside a loop. Strings in Java cannot be changed, so each `+=` copies the whole string built so far. The work grows quickly with the number of loop steps.

    Your code is fine for these reasons:
    - `toCsvLine` and `toBatchPayload` build their strings with `StringBuilder` in a loop. This is the Java equivalent of `join` in Python. It appends into one buffer and copies the text once at the end.
    - You pass a starting capacity to `StringBuilder`, so the buffer rarely has to grow.
    - `topicFor` uses `+`, but only in one expression with no loop. The compiler turns that into a single efficient concatenation. Changing it to `StringBuilder` would make the code longer and give no real gain.

    I would leave the class as it is.

    If you want to cut the cost of this gateway further, look at how many MQTT messages you send and how large they are. On small devices, radio and network use usually costs more than string building. You already batch lines in `toBatchPayload`. Whether you can send bigger batches depends on how quickly the data must arrive.
