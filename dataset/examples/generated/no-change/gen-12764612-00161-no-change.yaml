id: gen-12764612-00161-no-change
category: no-change
language: bash
patterns:
- compress-transmitted
- context-tradeoff
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    hi, i made this script to put our landing page on the server. my friend said i should compress everything to save energy but i dont really know if i did it right. should i also gzip the images folder? is something wrong here?

    ```bash
    #!/bin/bash
    set -e

    SITE=/home/mara/landing/dist
    HOST=deploy@web1.example.com

    cd "$SITE"

    # compress the text files
    for f in *.html css/*.css js/*.js; do
      gzip -9 -k -f "$f"
    done

    # images are in dist/img (6 jpg and webp files)
    rsync -av --delete "$SITE"/ "$HOST":/var/www/landing/
    echo 'done'
    ```
- role: assistant
  content: |
    Nothing is wrong. This is already a good setup, and I would not change it.

    - **The text files are compressed once, at deploy time.** `gzip -9 -k` writes a `.gz` next to each HTML, CSS and JS file. The server can then send the ready-made file and does not compress on every request. In Green Metrics Tool micro-benchmarks, gzip took about 67 J to compress 100 MB of text. Your text files are far smaller, and this runs once per deploy.
    - **Do not gzip the images.** JPG and WebP are already compressed. Gzip would burn CPU and the files would stay about the same size. Leaving `img/` alone is right.
    - **`rsync` without `-z` is right too.** The text is already compressed and the images do not shrink, so `-z` would only add work.

    One thing to check, because it decides whether the `.gz` files are used at all: your nginx must have `gzip_static on;` in the site config. Without it, the server ignores the `.gz` files and sends the plain ones.

    Optional: `rsync` only sends files that changed, so repeat deploys are already cheap.
verify:
  static_only: deploy script needs ssh and rsync access to a remote host
