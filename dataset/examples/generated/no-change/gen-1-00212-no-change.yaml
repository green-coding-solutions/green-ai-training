id: gen-1-00212-no-change
category: no-change
language: typescript
patterns:
- select-columns
- context-tradeoff
messages:
- role: user
  content: |
    hello, i have small tool for our support team to read the app logs. the logs is in sqlite file, around 3000 rows per day and we delete after 14 days. my colegue say I should not use SELECT * and only choose columns, is this right for my code? i think its ok but not sure

    ```typescript
    import Database from "better-sqlite3";

    interface LogRow {
      id: number;
      ts: string;
      level: string;
      service: string;
      message: string;
      request_id: string;
    }

    const db = new Database("./logs.db", { readonly: true });

    export function getLogsForRequest(requestId: string): LogRow[] {
      const stmt = db.prepare("SELECT * FROM logs WHERE request_id = ? ORDER BY ts");
      return stmt.all(requestId) as LogRow[];
    }

    export function printRequest(requestId: string) {
      const rows = getLogsForRequest(requestId);
      for (const r of rows) {
        console.log(`${r.ts} [${r.level}] ${r.service}: ${r.message}`);
        if (r.level === "ERROR") {
          console.log(`  request=${r.request_id} id=${r.id}`);
        }
      }
    }
    ```
- role: assistant
  content: |
    Your code is fine. Keep `SELECT *` here.

    - Your table has only 6 columns, and your code uses all of them. `SELECT *` and an explicit list read the same data, so there is nothing to skip.
    - The data is small: about 3000 rows per day, 14 days kept. A lookup by request returns a few rows.
    - The `SELECT *` advice matters when a wide table has big columns you don't need, like long text or blobs. Then the unused columns are read and transferred for nothing. That is not your case.

    One thing is worth checking: is there an index on `request_id`? Without it, every lookup scans the whole table.

    ```sql
    CREATE INDEX IF NOT EXISTS idx_logs_request_id ON logs (request_id, ts);
    ```

    With this index the query finds the rows directly and returns them already in `ts` order. At about 40,000 rows a scan is still cheap, so this is only worth doing if you see slow lookups.

    Later, if you add a big column (for example a full stack trace or a JSON payload) and your code does not print it, name the columns you need at that point. Until then, an explicit list only adds code you have to keep in sync with the table.
verify:
  static_only: TypeScript with better-sqlite3 (native package), review of an already efficient query; no stdlib-only runnable
    code
