id: gen-12764612-00407-no-change
category: no-change
language: yaml
patterns:
- minimize-environments
- context-tradeoff
facts:
- F-PREVIEW-ENV
messages:
- role: user
  content: |
    hello, we are small group (6 persons) in ocean modelling. We have one shared test enviroment for our result browser, all people use it to check the new runs before we publish. I was reading about "minimal environments" and now I worry that my yaml is wasting power. Should I remove redis and make it more small? Or what I should change?

    ```yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: result-browser
      namespace: ocean-test
    spec:
      replicas: 1
      selector:
        matchLabels: {app: result-browser}
      template:
        metadata:
          labels: {app: result-browser}
        spec:
          containers:
            - name: app
              image: registry.ocean-lab.example/result-browser:2.4
              env:
                - name: DATABASE_URL
                  value: postgresql://browser@postgres:5432/results
                - name: REDIS_URL
                  value: redis://redis:6379/0
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 512Mi}
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redis
      namespace: ocean-test
    spec:
      replicas: 1
      selector:
        matchLabels: {app: redis}
      template:
        metadata:
          labels: {app: redis}
        spec:
          containers:
            - name: redis
              image: redis:7-alpine
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits: {memory: 64Mi}
    ```

    Postgres is in other file, it is also one pod.
- role: assistant
  content: |
    No change needed. This is already a small setup, and removing Redis would not help in a way you can measure.

    - **One shared environment:** six people share one copy, with one app replica, one Redis pod and one Postgres pod. This is the layout you want. There is no per-branch or per-person copy to remove.
    - **Small requests:** the CPU and memory requests are low, so the cluster reserves little for this namespace.
    - **Idle services cost little:** in Green Metrics Tool micro-benchmarks, a preview environment idling for 60 seconds with 3 app replicas, Postgres, Redis and a worker used ~269 J CPU energy. With 1 app replica and Postgres it used ~262 J, about 3% less. Redis alone is a smaller part of that gap.

    If the app really needs Redis, keep it. Removing it means changing the app, and that is a bigger cost than the saving.

    The real saving is in hours, not in services. If nobody uses this environment at night or on weekends, you can scale both deployments to zero then, for example with a CronJob that runs `kubectl scale --replicas=0`. If people or long jobs use it at odd hours, leave it as it is.
verify:
  static_only: Kubernetes manifests, no runnable code
