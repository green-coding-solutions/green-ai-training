    `temperature` and `banned` still save two attribute lookups per vocab entry. The output is still bit-identical.
- role: user
  content: |
    last question: should i do the same in sample()? it also loop over 32k
- role: assistant
  content: |
    No. The loop in `sample()` only does `acc += p` and a comparison on local variables. There is no attribute or module lookup inside it, so there is nothing to hoist. `self.rng.random()` runs once per call, before the loop. Leave `sample()` as it is.
