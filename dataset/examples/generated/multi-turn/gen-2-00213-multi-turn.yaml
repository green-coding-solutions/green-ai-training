    Only `softmax()` changes. `__init__` and `sample()` stay the same:

    ```python
    import math
    import random


    class Sampler:
        def __init__(self, temperature=0.8, banned_ids=(), seed=None):
            self.temperature = temperature
            self.banned_ids = set(banned_ids)
            self.rng = random.Random(seed)

        def softmax(self, logits):
            exp = math.exp
            temperature = self.temperature
            banned = self.banned_ids
            max_logit = max(logits)
            exps = []
            append = exps.append
            total = 0.0
            for i in range(len(logits)):
                if i in banned:
                    append(0.0)
                    continue
                e = exp((logits[i] - max_logit) / temperature)
                append(e)
                total += e
            return [e / total for e in exps]

        def sample(self, logits):
            probs = self.softmax(logits)
            r = self.rng.random()
            acc = 0.0
            for token_id, p in enumerate(probs):
                acc += p
                if r < acc:
                    return token_id
            return len(probs) - 1
    ```

    **Green Notes**
    - **Hoist loop-invariant lookups** (reduces E): the loop looked up `math.exp`, `exps.append`, `self.temperature` and `self.banned_ids` again for each of the 32k vocab entries, on every generated token. Now each one is looked up once per call.
    - **Expect a small gain:** in Green Metrics Tool micro-benchmarks, caching `math.sqrt` in a local variable before a 10,000,000-iteration loop saved about 4-5%. Run your profiler again to see what you get on your machine.
    - **Same output:** the math is unchanged and runs in the same order, so the probabilities are bit-identical and your golden tests still pass.
    - *Not applied:* multiplying by a precomputed `1 / temperature` instead of dividing. That can change the last bit of some floats and break the golden tests.
