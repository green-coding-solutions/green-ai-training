messages:
- role: user
  content: |
    hi, we run a small local LLM on CPU for an offline asistant. I wrote own sampler because we need to ban some tokens (logit bias from llama-cpp is not enough for us). profiler say softmax() is called for every generated token and it loop over the full vocab, 32k entries. can you make it faster? output must stay exactly same, we have golden tests with fixed seed

    ```python
    import math
    import random


    class Sampler:
        def __init__(self, temperature=0.8, banned_ids=(), seed=None):
            self.temperature = temperature
            self.banned_ids = set(banned_ids)
            self.rng = random.Random(seed)

        def softmax(self, logits):
            max_logit = max(logits)
            exps = []
            total = 0.0
            for i in range(len(logits)):
                if i in self.banned_ids:
                    exps.append(0.0)
                    continue
                e = math.exp((logits[i] - max_logit) / self.temperature)
                exps.append(e)
                total += e
            return [e / total for e in exps]

        def sample(self, logits):
            probs = self.softmax(logits)
            r = self.rng.random()
            acc = 0.0
            for token_id, p in enumerate(probs):
                acc += p
                if r < acc:
                    return token_id
            return len(probs) - 1
    ```
