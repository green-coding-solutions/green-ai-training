    ok we use this. now boss say hero only need github stars, he remove the other two. please update
- role: assistant
  content: |
    With one request there is nothing to run in parallel, so plain `requests` is the right choice. The `SOURCES` dict is no longer needed.

    ```python
    import requests


    def get_github_stars():
        try:
            r = requests.get(
                "https://api.github.com/repos/acme/acme-app", timeout=3.0
            )
            r.raise_for_status()
            return r.json()["stargazers_count"]
        except (requests.RequestException, KeyError, ValueError):
            return None
    ```

    It returns `None` if the API fails, so the template can hide the number like before. Keep the route as plain `def`.

    **Green Notes**
    - *Not applied:* async I/O. It only helps when several calls overlap, and this page makes a single request.
