    ```python
    import csv
    import re

    _PHONE_JUNK = re.compile(r"[^\d+]")
    _INTL_ZEROS = re.compile(r"^00")
    _EMAIL = re.compile(r"^[^@\s]+@[^@\s]+\.[a-z]{2,}$")

    def clean_rows(path, sku_prefix):
        prefix_re = re.compile("^" + re.escape(sku_prefix) + r"[-_ ]*")
        out = []
        with open(path, newline="") as f:
            for row in csv.DictReader(f):
                sku = prefix_re.sub("", row["sku"].strip().upper())
                phone = _PHONE_JUNK.sub("", row["phone"])
                if _INTL_ZEROS.match(phone):
                    phone = "+" + phone[2:]
                email = row["email"].strip().lower()
                if not _EMAIL.match(email):
                    email = ""
                out.append({"sku": sku, "phone": phone, "email": email})
        return out
    ```

    **Green Notes**
    - **Compile regex once** (reduces E): the SKU pattern was rebuilt as a string for every row. It is now compiled once per call. The three fixed patterns are module-level constants.
    - **`re.escape(sku_prefix)`:** a prefix with regex characters such as `.` or `+` could match the wrong SKUs before. The result changes only for such prefixes.
