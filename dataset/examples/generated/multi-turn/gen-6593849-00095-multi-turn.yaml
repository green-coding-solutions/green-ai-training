id: gen-6593849-00095-multi-turn
category: multi-turn
language: javascript
patterns:
- minify-assets
facts:
- F-MINIFY
messages:
- role: user
  content: |
    I'm building the landing page for a bike repair shop (one HTML page, one script, about 3 KB of JS). I want a build step that minifies the script before deploy. Requirements: just npm, no config files, output goes to dist/, and I keep editing js/main.js as the source. The script:

    ```javascript
    const form = document.querySelector('#booking-form');
    const status = document.querySelector('#booking-status');

    document.querySelectorAll('a[href^="#"]').forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        const target = document.querySelector(link.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Sending...';
      const data = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch('/api/booking', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!res.ok) {
          throw new Error('Server answered ' + res.status);
        }
        status.textContent = 'Thanks! We will call you to confirm.';
        form.reset();
      } catch (err) {
        console.error('Booking failed', err);
        status.textContent = 'Something went wrong. Please call us.';
      }
    });
    ```
- role: assistant
  content: |
    esbuild fits: one dev dependency, no config file, one npm script.

    ```bash
    npm install --save-dev esbuild
    ```

    ```json
    {
      "scripts": {
        "build": "esbuild js/main.js --minify --outfile=dist/main.min.js"
      }
    }
    ```

    Then point the page at the built file:

    ```html
    <script src="dist/main.min.js" defer></script>
    ```

    Run `npm run build` before each deploy. Keep `js/main.js` as your source.

    **Green Notes**
    - **Minify** (reduces network): the build shortens names and removes whitespace, so fewer bytes are sent. For a script this small, expect little on the client CPU side. In Green Metrics Tool micro-benchmarks on a small booking page, minified JS and CSS used about 2% less client energy than the sources, which is within measurement noise. The real gain is fewer bytes on slow mobile connections.
    - **No `--drop:console`:** that flag would also remove your `console.error('Booking failed', err)`, which is the only trace of a failed booking in the browser.
- role: user
  content: |
    ok. two things. my brother wants to debug on the live site sometimes, so I need source maps. and I want to put in the README that the minify step "cuts the site's energy use". can you write that line? with a percentage if possible
- role: assistant
  content: |
    Add `--sourcemap`. It writes `dist/main.min.js.map` next to the script, and esbuild adds the link comment itself.

    ```json
    {
      "scripts": {
        "build": "esbuild js/main.js --minify --sourcemap --outfile=dist/main.min.js"
      }
    }
    ```

    Deploy both files. Browsers only fetch the map when devtools is open, so normal visitors don't download it.

    For the README, I would not claim an energy cut. The measured difference for small bundles was about 2%, within noise, so a percentage would not be honest. This line is accurate:

    ```text
    The build step minifies the JavaScript to reduce the bytes sent to visitors.
    ```

    If you want a number for your own site, measure it. Load the page 50 times with an empty cache, once with `js/main.js` and once with the minified file, and compare CPU time or energy. Expect the difference to be small for 3 KB of JS.
