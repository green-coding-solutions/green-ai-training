- role: assistant
  content: |
    Fine. Keep your original function as it is. It is correct, and the energy gain here is small.

    In Green Metrics Tool micro-benchmarks with 10 HTTP requests, async `httpx` used about 7% less CPU energy than sync `urllib`, and about 17% less wall time. For a dozen nodes the gain is mostly time, not CPU.

    If the poll overlaps with the next cron run when nodes are down, lower `timeout=5` to what a healthy node needs, for example `timeout=2`. That bounds the worst case without any new code structure.
