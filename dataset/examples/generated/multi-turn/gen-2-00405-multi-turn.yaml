- role: user
  content: |
    gateway poll is slow, fix this

    ```python
    import json
    import logging
    import urllib.request

    log = logging.getLogger("gateway")

    NODES = [f"http://10.0.4.{i}/api/reading" for i in range(21, 33)]


    def poll_all():
        readings = {}
        for url in NODES:
            try:
                with urllib.request.urlopen(url, timeout=5) as r:
                    readings[url] = json.loads(r.read())
            except Exception as exc:
                log.warning("node %s failed: %s", url, exc)
                readings[url] = None
        return readings
    ```
- role: assistant
  content: |
    ```python
    import asyncio
    import json
    import logging

    import httpx

    log = logging.getLogger("gateway")

    NODES = [f"http://10.0.4.{i}/api/reading" for i in range(21, 33)]


    async def fetch(client, url):
        try:
            r = await client.get(url)
            r.raise_for_status()
            return url, r.json()
        except (httpx.HTTPError, json.JSONDecodeError) as exc:
            log.warning("node %s failed: %s", url, exc)
            return url, None


    async def poll_all_async():
        async with httpx.AsyncClient(timeout=5) as client:
            results = await asyncio.gather(*(fetch(client, u) for u in NODES))
        return dict(results)


    def poll_all():
        return asyncio.run(poll_all_async())
    ```

    **Green Notes**
    - **Concurrent network calls** (reduces E): the 12 nodes are polled at the same time, so the poll takes about as long as the slowest node, not the sum of all. A dead node now costs one 5 s timeout, not 5 s on top of every other node.
    - `poll_all()` keeps the same signature and the same result shape (`None` for a failed node), so callers do not change. Only the exceptions I catch are narrower: network, HTTP status and bad JSON errors.
