    ```python
    import sys
    import unicodedata
    from collections import Counter


    def normalize_host(host):
        host = unicodedata.normalize("NFKC", host.strip().lower().rstrip("."))
        if host.startswith("www."):
            host = host[4:]
        try:
            return host.encode("idna").decode("ascii")
        except UnicodeError:
            return host


    def main():
        counts = Counter()
        for line in sys.stdin:
            parts = line.split()
            if len(parts) < 2:
                continue
            counts[normalize_host(parts[1])] += 1
        for host, n in counts.most_common(20):
