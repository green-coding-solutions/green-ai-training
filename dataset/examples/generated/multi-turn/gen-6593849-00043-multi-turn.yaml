id: gen-6593849-00043-multi-turn
category: multi-turn
language: css
patterns:
- css-animations
facts:
- F-ANIM
messages:
- role: user
  content: |
    hello, i need css for small animation in our etl status page. We have three boxes: Extract, Transform, Load, and a line between the boxes. When the line have class "running", a small dot must go from left to right again and again. Only css please, the js only add the class.
- role: assistant
  content: |
    ```css
    .flow {
      position: relative;
      width: 80px;
      height: 2px;
      background: #9aa5b1;
    }

    .flow::after {
      content: '';
      position: absolute;
      top: -3px;
      left: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2f80ed;
      opacity: 0;
    }

    .flow.running::after {
      opacity: 1;
      animation: flow-dot 1.2s linear infinite;
    }

    @keyframes flow-dot {
      from { transform: translateX(0); }
      to   { transform: translateX(72px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow.running::after { animation: none; }
    }
    ```

    **Green Notes**
    - **CSS keyframes instead of a JS loop** (reduces E): the browser runs the animation itself, and your JS only toggles the class.
    - **Animation only while running:** an idle line has no animation at all, so nothing runs when the pipeline is idle.
- role: user
  content: |
    thanks it work. but my colleague say is better with setInterval in JS, because then we can stop it and change the speed. why css is better?
- role: assistant
  content: |
    CSS can do both, so you don't lose control. Here is the same animation with pause and speed:

    ```css
    .flow.running::after {
      opacity: 1;
      animation: flow-dot var(--flow-speed, 1.2s) linear infinite;
    }

    .flow.paused::after {
      animation-play-state: paused;
    }
    ```

    JS toggles `paused` to stop and start the dot. It sets `--flow-speed` to change the speed.

    On energy: in Green Metrics Tool micro-benchmarks, a 20-second animation driven by `requestAnimationFrame` with style updates used about 10% more CPU energy than the same animation in CSS `@keyframes`. For one small dot the absolute difference is tiny. It grows when the page stays open for hours or when many lines animate. If your colleague needs JS for some other logic, that is fine. The animation itself can still stay in CSS.
- role: user
  content: |
    ok good. one more thing: the speed must follow rows per second. JS get this number every 5 second from our backend. can JS set the duration direct?
- role: assistant
  content: |
    Yes. Set the custom property once when a new number arrives. You don't need to touch it every frame.

    ```javascript
    function setFlowSpeed(lineEl, rowsPerSecond) {
      const seconds = Math.min(3, Math.max(0.4, 600 / Math.max(rowsPerSecond, 1)));
      lineEl.style.setProperty('--flow-speed', seconds + 's');
    }
    ```

    More rows per second gives a shorter duration, so the dot moves faster. The clamp keeps the dot from being too slow or too fast. When the duration changes, the dot may jump a little once. For a status indicator that is fine.

    **Green Notes**
    - **CSS keyframes instead of a JS loop** (reduces E): JS runs only every few seconds to update one property. The browser does the per-frame work.
verify:
  static_only: CSS and browser animation, needs a real browser to run
