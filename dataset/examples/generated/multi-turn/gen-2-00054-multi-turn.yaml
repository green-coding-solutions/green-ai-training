    ```python
    #!/usr/bin/env python3
    """Expand shorthand in support ticket exports.

    usage: expand.py abbrevs.tsv < tickets.txt > expanded.txt
    """
    import sys


    def load_abbrevs(path):
        table = {}
        with open(path, encoding="utf-8") as fh:
            for line in fh:
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                short, full = line.split("\t", 1)
                table[short.lower()] = full
        return table


    def expand_line(line, table):
        words = []
        expanded = 0
        for word in line.split():
            full = table.get(word.lower())
            if full is None:
                words.append(word)
            else:
                words.append(full)
                expanded += 1
        return " ".join(words), expanded


    def main():
        if len(sys.argv) != 2:
            sys.exit(__doc__)
        table = load_abbrevs(sys.argv[1])
        total = 0
        for line in sys.stdin:
            text, n = expand_line(line, table)
            print(text)
            total += n
        print(f"expanded {total} words", file=sys.stderr)


    if __name__ == "__main__":
        main()
    ```

    `expand_line` now returns the text and the count. `.get()` without a default returns `None` on a miss, which works here because every value in the table is a string. stdout is unchanged, so the redirect into `expanded.txt` stays clean.
