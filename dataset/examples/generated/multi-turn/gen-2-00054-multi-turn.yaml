    slow on the yearly ticket export (couple GB). fix?

    ```python
    #!/usr/bin/env python3
    """Expand shorthand in support ticket exports.

    usage: expand.py abbrevs.tsv < tickets.txt > expanded.txt
    """
    import sys


    def load_abbrevs(path):
        table = {}
        with open(path, encoding="utf-8") as fh:
            for line in fh:
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                short, full = line.split("\t", 1)
                table[short.lower()] = full
        return table


    def expand_line(line, table):
        words = []
        for word in line.split():
            try:
                words.append(table[word.lower()])
            except KeyError:
                words.append(word)
        return " ".join(words)


    def main():
        if len(sys.argv) != 2:
            sys.exit(__doc__)
        table = load_abbrevs(sys.argv[1])
        for line in sys.stdin:
            print(expand_line(line, table))


    if __name__ == "__main__":
        main()
    ```
