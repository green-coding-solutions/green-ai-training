    Sure, here it is with `try/except` and the counter:

    ```python
    #!/usr/bin/env python3
    """Expand shorthand in support ticket exports.

    usage: expand.py abbrevs.tsv < tickets.txt > expanded.txt
    """
    import sys


    def load_abbrevs(path):
        table = {}
        with open(path, encoding="utf-8") as fh:
            for line in fh:
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                short, full = line.split("\t", 1)
                table[short.lower()] = full
        return table


    def expand_line(line, table):
        words = []
        expanded = 0
        for word in line.split():
            try:
                full = table[word.lower()]
            except KeyError:
                words.append(word)
            else:
                words.append(full)
                expanded += 1
        return " ".join(words), expanded


    def main():
        if len(sys.argv) != 2:
            sys.exit(__doc__)
        table = load_abbrevs(sys.argv[1])
        total = 0
        for line in sys.stdin:
            text, n = expand_line(line, table)
            print(text)
            total += n
        print(f"expanded {total} words", file=sys.stderr)


    if __name__ == "__main__":
        main()
    ```

    The `else` branch keeps the `try` body to the lookup alone, so only a missing key is caught. If the export run time ever matters again, the `.get()` version from before is a drop-in swap.
verify:
  module: true
  test: |-
    import os
    import tempfile

    table = {"asap": "as soon as possible", "pls": "please", "thx": "thanks"}
    assert expand_line("pls reply ASAP thx", table) == ("please reply as soon as possible thanks", 3)
    assert expand_line("no shorthand here\n", table) == ("no shorthand here", 0)
    assert expand_line("   ", table) == ("", 0)
    assert expand_line("Pls  check   logs", table) == ("please check logs", 1)

    with tempfile.TemporaryDirectory() as d:
        p = os.path.join(d, "abbrevs.tsv")
        with open(p, "w", encoding="utf-8") as fh:
            fh.write("# comment\n\nASAP\tas soon as possible\nfyi\tfor your information\n")
        t = load_abbrevs(p)
        assert t == {"asap": "as soon as possible", "fyi": "for your information"}
        assert expand_line("FYI deploy asap", t) == ("for your information deploy as soon as possible", 2)
