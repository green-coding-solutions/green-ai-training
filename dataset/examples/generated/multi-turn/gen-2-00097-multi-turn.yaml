    OK, all rows on one page then. The table stays flat and is inserted in one step, so Ctrl+F finds every ID:

    ```javascript
    // predictions.js — results viewer for batch scoring jobs
    const API = '/api/batch-jobs';

    function scoreClass(score) {
      if (score >= 0.9) return 'high';
      if (score >= 0.5) return 'mid';
      return 'low';
    }

    function buildRow(p) {
      const tr = document.createElement('tr');
      const cells = [p.id, p.input_preview, p.label, p.score.toFixed(3), `${p.latency_ms} ms`];
      for (const value of cells) {
        const td = document.createElement('td');
        td.textContent = value;
        tr.appendChild(td);
      }
      tr.children[3].className = `score ${scoreClass(p.score)}`;
      return tr;
    }

    async function loadPredictions(jobId) {
      const res = await fetch(`${API}/${jobId}/predictions`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const preds = await res.json();

      const frag = document.createDocumentFragment();
      for (const p of preds) {
        frag.appendChild(buildRow(p));
      }
      document.querySelector('#pred-table tbody').replaceChildren(frag);
      document.getElementById('pred-count').textContent = `${preds.length} predictions`;
    }

    document.getElementById('job-select').addEventListener('change', (e) => {
      loadPredictions(e.target.value).catch(console.error);
    });
    ```

    Remove the prev/next buttons and `page-info` from the HTML. Each row still has half as many elements, the page reflows once instead of 30k times, and the `textContent` fix stays.

    If loading still feels slow, an ID search box over `preds` that jumps to the matching row would let you bring paging back without losing the lookup.
