    we still support torch 1.8 on one box. is inference_mode there? also don't want to touch more lines than needed
- role: assistant
  content: |
    `inference_mode()` came in torch 1.9, so 1.8 doesn't have it. Use `no_grad()`. It exists in all versions and gives the same saving here.

    ```diff
     def score_file(model, path):
         x = torch.from_numpy(np.load(path)).float()
    -    out = model(x)
    +    with torch.no_grad():
    +        out = model(x)
         return out.softmax(dim=-1).argmax(dim=-1).tolist()
    ```

    Same three lines, nothing else touched. The measured figure above was for `no_grad()`, so it applies as is.
- role: user
  content: |
    ok. can we wrap the whole main loop in it instead, one with block, so I can drop the one in score_file?
- role: assistant
  content: |
    You can, but I'd keep it in `score_file`. Both give the same results and the same saving. The difference is scope.

    With the block in `main`, any code you later add to `score_file` or the loop runs without autograd too. That's fine today. It becomes a problem if someone reuses `score_file` from another module, where the block is missing and gradients are tracked again without any sign of it.

    If you still prefer one block in `main`:

    ```diff
    -    out = model(x)
    +    out = model(x)
    ...
         for p in sorted(Path(args.folder).glob("*.npy")):
    -        labels = score_file(model, p)
    -        print(f"{p.name}\t{labels}")
    +        with torch.no_grad():
    +            labels = score_file(model, p)
    +        print(f"{p.name}\t{labels}")
    ```

    Enter the block once per file here. If you want a single block around the whole loop, move the `for` loop under one `with torch.no_grad():`. Either way, remove the block from `score_file`.
