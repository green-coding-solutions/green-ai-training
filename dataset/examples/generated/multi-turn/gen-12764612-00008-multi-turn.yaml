- role: assistant
  content: |
    Use the f-string, it is a good way to format one line. The `+=` is the part that costs. An f-string appended in a loop behaves like any other `+=`.

    In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces took ~469 J with `+=`, ~455 J with f-string concatenation in a loop, and ~1.8 J with `"".join()`. That is roughly 260× less CPU energy for `join`.

    You can keep the f-string and drop the list bookkeeping by joining a generator:

    ```python
    import numpy as np

    def format_predictions(ids, probs, labels, threshold=0.5):
        """Build the TSV report for a batch of classifier outputs."""
        def line(i, row):
            best = int(np.argmax(row))
            score = float(row[best])
            name = labels[best] if score >= threshold else "unknown"
            return f"{i}\t{name}\t{score:.4f}"

        rows = (line(i, row) for i, row in zip(ids, probs))
        return "\n".join(["id\tlabel\tscore", *rows]) + "\n"
    ```

    **Green Notes**
    - **Join instead of `+=`** (reduces E): each line is still an f-string, and the report is built once at the end.

    If your batches are always a few dozen rows, the difference is small and your `+=` version is fine. It matters for large batches.
