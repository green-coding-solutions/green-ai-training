    ```python
    import numpy as np

    def format_predictions(ids, probs, labels, threshold=0.5):
        """Build the TSV report for a batch of classifier outputs."""
        lines = ["id\tlabel\tscore"]
        for i, row in zip(ids, probs):
            best = int(np.argmax(row))
            score = float(row[best])
            name = labels[best] if score >= threshold else "unknown"
            lines.append(f"{i}\t{name}\t{score:.4f}")
        return "\n".join(lines) + "\n"
    ```

    The output is identical, including the trailing newline.

    **Green Notes**
    - **Join instead of `+=`** (reduces E): the loop now collects lines in a list and builds the string once at the end. With `+=`, the work to extend the string grows with the report size, once per row.
