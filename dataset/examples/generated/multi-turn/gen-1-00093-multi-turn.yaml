id: gen-1-00093-multi-turn
category: multi-turn
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    hello, this is the page we make after detector run, reviewers open it to check the predictions. Many pictures and it open slow. can you add lazy loading to the images, thx

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Detector run 2291 - review</title>
      <link rel="stylesheet" href="review.css">
    </head>
    <body>
      <h1>Run 2291: predictions to review</h1>
      <p class="meta">Model: det-v7, 24 images, threshold 0.45</p>

      <section class="worst">
        <h2>Lowest confidence</h2>
        <img src="out/2291/overlay_0001.jpg" alt="Overlay 1">
      </section>

      <section class="grid">
        <figure><img src="out/2291/overlay_0002.jpg" alt="Overlay 2"><figcaption>0002 - 0.52</figcaption></figure>
        <figure><img src="out/2291/overlay_0003.jpg" alt="Overlay 3"><figcaption>0003 - 0.55</figcaption></figure>
        <figure><img src="out/2291/overlay_0004.jpg" alt="Overlay 4"><figcaption>0004 - 0.58</figcaption></figure>
        <figure><img src="out/2291/overlay_0005.jpg" alt="Overlay 5"><figcaption>0005 - 0.61</figcaption></figure>
        <figure><img src="out/2291/overlay_0006.jpg" alt="Overlay 6"><figcaption>0006 - 0.63</figcaption></figure>
        <figure><img src="out/2291/overlay_0007.jpg" alt="Overlay 7"><figcaption>0007 - 0.66</figcaption></figure>
      </section>
    </body>
    </html>
    ```
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Detector run 2291 - review</title>
      <link rel="stylesheet" href="review.css">
    </head>
    <body>
      <h1>Run 2291: predictions to review</h1>
      <p class="meta">Model: det-v7, 24 images, threshold 0.45</p>

      <section class="worst">
        <h2>Lowest confidence</h2>
        <img src="out/2291/overlay_0001.jpg" width="1280" height="720" alt="Overlay 1">
      </section>

      <section class="grid">
        <figure><img src="out/2291/overlay_0002.jpg" width="640" height="360" loading="lazy" alt="Overlay 2"><figcaption>0002 - 0.52</figcaption></figure>
        <figure><img src="out/2291/overlay_0003.jpg" width="640" height="360" loading="lazy" alt="Overlay 3"><figcaption>0003 - 0.55</figcaption></figure>
        <figure><img src="out/2291/overlay_0004.jpg" width="640" height="360" loading="lazy" alt="Overlay 4"><figcaption>0004 - 0.58</figcaption></figure>
        <figure><img src="out/2291/overlay_0005.jpg" width="640" height="360" loading="lazy" alt="Overlay 5"><figcaption>0005 - 0.61</figcaption></figure>
        <figure><img src="out/2291/overlay_0006.jpg" width="640" height="360" loading="lazy" alt="Overlay 6"><figcaption>0006 - 0.63</figcaption></figure>
        <figure><img src="out/2291/overlay_0007.jpg" width="640" height="360" loading="lazy" alt="Overlay 7"><figcaption>0007 - 0.66</figcaption></figure>
      </section>
    </body>
    </html>
    ```

    **Green Notes**
    - **Defer offscreen images** (reduces network): the grid images now load only when the reviewer scrolls near them. The big image at the top stays eager, because it is above the fold and lazy loading there would make the page look slower.
    - I set `width` and `height` on all images. Please change them to the real pixel size of your overlays. The browser then reserves the space, and the page does not jump when an image arrives.
- role: user
  content: |
    ok thanks. but our reviewers always scroll to the very end, they must check every image. so lazy is useless for us? maybe I remove it

    ```html
    <figure><img src="out/2291/overlay_0002.jpg" width="640" height="360" loading="lazy" alt="Overlay 2"><figcaption>0002 - 0.52</figcaption></figure>
    ```
- role: assistant
  content: |
    You are right, for your case it brings almost nothing. Lazy loading only saves bytes for images that are never reached. If everybody scrolls to the end, every image is loaded anyway.

    In Green Metrics Tool browser benchmarks with an article of 15 photos, loading without scrolling used about 12% less CPU energy with lazy images. When the visitor scrolled to the end, the difference was about 1% more, which is noise.

    So you can remove it, and the page is not worse:

    ```html
    <figure><img src="out/2291/overlay_0002.jpg" width="640" height="360" alt="Overlay 2"><figcaption>0002 - 0.52</figcaption></figure>
    ```

    Keep the `width` and `height`. They stop the layout jumping and they cost nothing.

    One case to keep lazy loading: reviewers who often stop after the first rows, for example when they only check the worst predictions. Then the later images are never needed. If you do not know, ask a few reviewers how far they usually go.
verify:
  static_only: HTML markup
