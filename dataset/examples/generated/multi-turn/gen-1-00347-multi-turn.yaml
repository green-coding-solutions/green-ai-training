- role: user
  content: |
    ?

    ```python
    HEADLINES = {
        "offer": "Start free for 30 days. No card needed.",
        "returning": "Welcome back. Your workspace is waiting.",
        "community": "Join 12,000 makers who ship with us.",
        "education": "Free for students and teachers.",
        "default": "Ship your product faster.",
    }


    def hero_variant(medium, source):
        if medium is None:
            medium = ""
        if source is None:
            source = ""
        if medium.strip().lower() == "cpc" or medium.strip().lower() == "ppc" or medium.strip().lower() == "paid":
            return "offer"
        elif medium.strip().lower() == "email" or medium.strip().lower() == "newsletter":
            return "returning"
        elif medium.strip().lower() == "social" or source.strip().lower() in ("twitter", "x", "linkedin", "facebook", "mastodon"):
            return "community"
