    assert scan(["# todo: a\n"], ["TODO"], ignore_case=True) == [(1, "todo", "a")]
    assert scan(["# todo: a\n"], ["TODO"]) == []
    assert scan(["// FIXME(ann): x\n"], ["FIXME"], owner="ann") == [(1, "FIXME", "x")]
    assert scan(["// FIXME(ann): x\n"], ["FIXME"], owner="bob") == []
