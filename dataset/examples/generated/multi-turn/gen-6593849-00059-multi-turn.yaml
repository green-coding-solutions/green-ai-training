    **Green Notes**
    - **Memoize repeated pure computations** (reduces E): a shared dependency is walked again for every path that reaches it, and each top-level package starts a new walk. With the cache, every package is expanded once. In Green Metrics Tool micro-benchmarks, 1,000,000 computations over 200 distinct inputs used about 9× less CPU energy with `lru_cache`. The gain depends on repeated inputs, and a lockfile graph has many.
    - **`frozenset` return**: a cached value is shared between callers, so it must not be mutable. `len()` and `|=` work the same on it.
    - `maxsize=None` is safe here: the cache can't grow beyond the number of packages. `GRAPH` is filled once in `main()`, before the first call. If it ever changes later, call `transitive.cache_clear()`.
- role: user
  content: |
    transitive() is imported by two other tools and they call .discard()/.add() on the result. can't change the return type. keep it a set
- role: assistant
  content: |
    Keep the cache private and return a fresh set from the public function:

    ```python
    import functools


    @functools.lru_cache(maxsize=None)
    def _transitive(pkg):
        seen = set()
        for dep in GRAPH.get(pkg, []):
            seen.add(dep)
            seen |= _transitive(dep)
        return frozenset(seen)


    def transitive(pkg):
        return set(_transitive(pkg))
    ```

    In `main()`, count with `len(_transitive(p))` so the loop over all packages makes no copies.

    **Green Notes**
    - **Memoize repeated pure computations** (reduces E): the recursion still expands each package once. Callers get a new `set` on every call, so their `.discard()` and `.add()` can't change cached data.
    - The copy is linear in the result size. That is far cheaper than the repeated graph walks it replaces.
