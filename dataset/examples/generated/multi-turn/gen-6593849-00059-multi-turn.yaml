messages:
- role: user
  content: |
    depweight is crawling on our monorepo lockfile (~4k packages, lots of shared deps). diff only please

    ```python
    #!/usr/bin/env python3
    """depweight: print transitive dependency counts from a lockfile graph."""
    import argparse
    import json
    import sys

    GRAPH = {}


    def load_graph(path):
        with open(path) as f:
            data = json.load(f)
        return {name: entry.get("deps", []) for name, entry in data["packages"].items()}


    def transitive(pkg):
        seen = set()
        for dep in GRAPH.get(pkg, []):
            seen.add(dep)
            seen |= transitive(dep)
        return seen


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("lockfile")
        ap.add_argument("--min", type=int, default=0)
        args = ap.parse_args()
        GRAPH.update(load_graph(args.lockfile))
        rows = [(len(transitive(p)), p) for p in GRAPH]
        for count, name in sorted(rows, reverse=True):
            if count >= args.min:
                print(f"{count:5d}  {name}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
    ```
- role: assistant
  content: |
    ```diff
     import argparse
    +import functools
     import json
     import sys
    @@
    +@functools.lru_cache(maxsize=None)
     def transitive(pkg):
         seen = set()
