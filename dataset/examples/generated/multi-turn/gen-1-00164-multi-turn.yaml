  green_block: -1
  test: |-
    import os
    import re
    import tempfile

    p = os.path.join(tempfile.mkdtemp(), "rules.txt")
    with open(p, "w", encoding="utf-8") as fh:
        fh.write("email\t[\\w.+-]+@[\\w-]+\\.[\\w.]+\n")
        fh.write("# comment\n\n")
        fh.write("ipv4\t\\b\\d{1,3}(?:\\.\\d{1,3}){3}\\b\n")
    rules = load_rules(p)
    assert len(rules) == 2
    assert redact_line("a bob@x.io from 10.0.0.1", rules) == "a <email> from <ipv4>"
    assert redact_line("nothing here", rules) == "nothing here"
