id: gen-1-00465-multi-turn
category: multi-turn
language: css
patterns:
- modern-image-formats
- context-tradeoff
facts:
- F-IMGENC
messages:
- role: user
  content: |
    I maintain `docgen`, a small CLI that builds our static docs site and copies the CSS into `dist/`. I need the CSS for the hero header on the landing page. Requirements:

    - full-width photo background, source is `img/hero.jpg` (1600x600)
    - dark overlay so the white title stays readable
    - min height 24rem, text centered, background covers the box
    - a solid dark color shows while the image loads
    - must still look fine in older browsers

    The build step can create other image files next to the jpg if that helps.
- role: assistant
  content: |
    ```css
    .hero {
      display: grid;
      place-items: center;
      min-height: 24rem;
      color: #fff;
      text-align: center;
      background-color: #1d2733;
      background-size: cover;
      background-position: center;

      /* Fallback for older browsers: plain JPEG */
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("img/hero.jpg");

      /* Browsers that know image-set() with type() pick the first format they support */
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        image-set(
          url("img/hero.avif") type("image/avif"),
          url("img/hero.webp") type("image/webp"),
          url("img/hero.jpg") type("image/jpeg")
        );
    }
    ```

    Browsers that do not understand the second `background-image` ignore it and keep the first one. The gradient sits outside `image-set()`, so the overlay works in both cases.

    Your build step needs to write `hero.avif` and `hero.webp` next to `hero.jpg`.

    **Green Notes**
    - **Modern formats with a JPEG fallback** (reduces network): the hero is loaded on every visit to the landing page. A smaller AVIF or WebP file means fewer transferred bytes for each visitor.
    - **Encode at build time only:** AVIF encoding is expensive, so `docgen` should do it once per build, never per request.
    - **Solid `background-color`:** the header looks right while the image loads, with no extra request.
- role: user
  content: |
    hmm, our CI is already slow and the runner only has `cwebp` installed. I don't want to add an AVIF encoder just for one header image. Can we do just webp + jpg?
- role: assistant
  content: |
    Yes, that is a reasonable call for one image.

    ```css
    .hero {
      display: grid;
      place-items: center;
      min-height: 24rem;
      color: #fff;
      text-align: center;
      background-color: #1d2733;
      background-size: cover;
      background-position: center;

      background-image:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("img/hero.jpg");

      background-image:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        image-set(
          url("img/hero.webp") type("image/webp"),
          url("img/hero.jpg") type("image/jpeg")
        );
    }
    ```

    In your build script, one extra call is enough:

    ```bash
    cwebp -q 80 img/hero.jpg -o dist/img/hero.webp
    ```

    You can skip the call when `hero.jpg` has not changed since the last build. That keeps CI time flat.

    **Green Notes**
    - **WebP + JPEG fallback** (reduces network): most of the byte saving over a plain JPEG comes from the smaller file, and WebP gets it with a cheaper encode. In Green Metrics Tool micro-benchmarks that encoded 50 BMP images, AVIF used about 658 J of CPU energy and WebP about 290 J ([measurements](https://metrics.green-coding.io/stats.html?id=81a932bc-04da-443b-93cf-d4d8468de247)). That is another reason to skip AVIF for a single header image.
    - **No AVIF here:** you can add it later if the landing page gets a lot of traffic and the build has a fast encoder.
verify:
  static_only: CSS only, needs a browser to render; no stdlib or numpy check possible
