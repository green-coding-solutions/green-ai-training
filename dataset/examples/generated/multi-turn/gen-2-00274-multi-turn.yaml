    import http.server
    import threading

    class _Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            body = (
                b'{"level": "error"}\n{"level": "warn"}\n{"level": "error"}\n'
                b'not json\n{"msg": "x"}\n'
            )
            self.send_response(200)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    _srv = http.server.ThreadingHTTPServer(("127.0.0.1", 0), _Handler)
    threading.Thread(target=_srv.serve_forever, daemon=True).start()
    _port = _srv.server_address[1]
    fetch_tail.__globals__["TAIL_URL"] = "http://{host}/logs/tail?lines=2000"

    _good = f"127.0.0.1:{_port}"
    _bad = "127.0.0.1:1"
    report, failed = collect([_good, _bad])
    assert list(report) == [_good], report
    c = report[_good]
    assert c["error"] == 2 and c["warn"] == 1, c
    assert c["unparsed"] == 1 and c["unknown"] == 1, c
    assert list(failed) == [_bad], failed

    report2, failed2 = collect([])
    assert report2 == {} and failed2 == {}
    _srv.shutdown()
