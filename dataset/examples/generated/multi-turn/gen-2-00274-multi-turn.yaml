    ```python
    import json
    import urllib.request
    from collections import Counter

    HOSTS = [f"app-{i:02d}.internal" for i in range(1, 26)]
    TAIL_URL = "http://{host}:9100/logs/tail?lines=2000"


    def fetch_tail(host):
        with urllib.request.urlopen(TAIL_URL.format(host=host)) as resp:
            return resp.read().decode("utf-8", errors="replace").splitlines()


    def summarize(lines):
        levels = Counter()
        for line in lines:
            try:
                entry = json.loads(line)
            except json.JSONDecodeError:
