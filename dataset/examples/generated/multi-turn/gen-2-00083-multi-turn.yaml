  test: |-
    seen = []
    handle_advert("00:00:00:00:00:01", -80, b"", lambda t, r: seen.append((t, r)))
    handle_advert("00:00:00:00:00:02", -80, b"", lambda t, r: seen.append((t, r)))
    assert seen == []
    assert take_unknown_count() == 2
    assert take_unknown_count() == 0
    handle_advert("C4:7C:8D:6A:11:02", -60, struct.pack("<hHB", -150, 9000, 50), lambda t, r: seen.append((t, r)))
    assert seen[0][0] == "site/cold-room-1/temp_hum"
    assert seen[0][1] == {"temp_c": -1.5, "humidity": 90.0, "battery": 50, "rssi": -60}
    handle_advert("C4:7C:8D:6A:11:02", -60, struct.pack("<hHB", -140, 9000, 50), lambda t, r: seen.append((t, r)))
    assert len(seen) == 1
    assert take_unknown_count() == 0
