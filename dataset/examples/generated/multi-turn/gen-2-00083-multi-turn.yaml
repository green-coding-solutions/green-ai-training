      def pub(topic, reading):
          print(topic, sorted(reading.items()))

      adverts = [
          ("11:22:33:44:55:66", -80, b"\x00"),
          ("C4:7C:8D:6A:11:02", -61, struct.pack("<hHB", 412, 5530, 87)),
          ("AA:BB:CC:DD:EE:FF", -90, b""),
          ("C4:7C:8D:6A:11:02", -60, struct.pack("<hHB", 415, 5520, 87)),
          ("E8:31:CD:0F:42:9A", -70, bytes([1, 64])),
          ("C4:7C:8D:6A:11:7F", -66, struct.pack("<hHB", -150, 9000, 50)),
