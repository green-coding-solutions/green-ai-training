- role: assistant
  content: |
    ```python
    import struct
    import time

    # BLE sensors in the warehouse, keyed by MAC
    SENSORS = {
        "C4:7C:8D:6A:11:02": {"room": "cold-room-1", "kind": "temp_hum"},
        "C4:7C:8D:6A:11:7F": {"room": "cold-room-2", "kind": "temp_hum"},
        "E8:31:CD:0F:42:9A": {"room": "loading-dock", "kind": "door"},
    }

    last_seen = {}


    def decode_temp_hum(data):
        temp, hum, batt = struct.unpack("<hHB", data[:5])
        return {"temp_c": temp / 100, "humidity": hum / 100, "battery": batt}


    def decode_door(data):
        return {"open": bool(data[0]), "battery": data[1]}


    DECODERS = {"temp_hum": decode_temp_hum, "door": decode_door}


    def handle_advert(mac, rssi, data, publish):
        """Called by the scanner for every BLE advertisement it sees."""
        sensor = SENSORS.get(mac)
        if sensor is None:
            return  # phones, headphones, forklifts...

        now = time.monotonic()
        try:
            if now - last_seen[mac] < 10:
                return  # rate limit: one reading per sensor every 10 s
        except KeyError:
            pass
        last_seen[mac] = now

        reading = DECODERS[sensor["kind"]](data)
        reading["rssi"] = rssi
        publish(f"site/{sensor['room']}/{sensor['kind']}", reading)
    ```

    **Green Notes**
    - **`SENSORS.get(mac)` instead of `try/except KeyError`** (reduces E): every advertisement hits this lookup, and most of them are misses. Each miss used to create, raise and catch an exception. Now a miss is a plain `None` check. In Green Metrics Tool micro-benchmarks with about half the keys missing, `dict.get` used about 12% less CPU energy than `try/except KeyError`. With mostly foreign adverts, your miss rate is higher than that.

    *Not changed:* the `last_seen` `try/except` misses only once per sensor, on its first advert. Exceptions are cheap when they are rarely raised, so it can stay.

    The BLE scan itself also costs CPU. If the gateway is still busy after this, check whether your scanner library can filter by MAC or manufacturer data before calling `handle_advert`.
