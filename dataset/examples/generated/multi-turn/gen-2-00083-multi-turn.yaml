    Count them in the miss branch and let your once-a-minute publish job read and reset the counter:

    ```python
    unknown_adverts = 0


    def take_unknown_count():
        """Return foreign adverts seen since the last call and reset the counter."""
        global unknown_adverts
        count, unknown_adverts = unknown_adverts, 0
        return count


    def handle_advert(mac, rssi, data, publish):
        """Called by the scanner for every BLE advertisement it sees."""
        global unknown_adverts
        sensor = SENSORS.get(mac)
        if sensor is None:
            unknown_adverts += 1
            return
        # ... rest unchanged
    ```

    In the minute job: `publish("site/gateway/unknown_adverts", {"count": take_unknown_count()})`.

    This works as-is if the scanner callbacks and the minute job run on the same asyncio loop (e.g. with bleak). If they run on different threads, guard the read-and-reset with a `threading.Lock`.
