id: gen-1-00352-multi-turn
category: multi-turn
language: javascript
patterns:
- set-membership
- context-tradeoff
messages:
- role: user
  content: |
    ?

    ```javascript
    const STOP_IDS = [2, 50256, 50257];

    function createSampler({ bannedTokenIds, temperature = 1.0 }) {
      function maskLogits(logits) {
        const out = new Float32Array(logits.length);
        for (let id = 0; id < logits.length; id++) {
          out[id] = bannedTokenIds.includes(id) ? -Infinity : logits[id];
        }
        return out;
      }

      function sample(logits, rand = Math.random) {
        const masked = maskLogits(logits);
        let max = -Infinity;
        for (let i = 0; i < masked.length; i++) {
          if (masked[i] > max) max = masked[i];
        }
        const probs = new Float64Array(masked.length);
        let sum = 0;
        for (let i = 0; i < masked.length; i++) {
          probs[i] = Math.exp((masked[i] - max) / temperature);
          sum += probs[i];
        }
        let r = rand() * sum;
        for (let i = 0; i < probs.length; i++) {
          r -= probs[i];
          if (r <= 0) return i;
        }
        return probs.length - 1;
      }

      return { sample };
    }

    function isStop(id) {
      return STOP_IDS.includes(id);
    }
    ```
- role: assistant
  content: |
    The slow part is `bannedTokenIds.includes(id)` inside `maskLogits`. It runs once per vocabulary entry on every generated token, and each call scans the whole banned array. Make it a `Set` that is built once.

    ```javascript
    const STOP_IDS = [2, 50256, 50257];

    function createSampler({ bannedTokenIds, temperature = 1.0 }) {
      const banned = new Set(bannedTokenIds);

      function maskLogits(logits) {
        const out = new Float32Array(logits.length);
        for (let id = 0; id < logits.length; id++) {
          out[id] = banned.has(id) ? -Infinity : logits[id];
        }
        return out;
      }

      function sample(logits, rand = Math.random) {
        const masked = maskLogits(logits);
        let max = -Infinity;
        for (let i = 0; i < masked.length; i++) {
          if (masked[i] > max) max = masked[i];
        }
        const probs = new Float64Array(masked.length);
        let sum = 0;
        for (let i = 0; i < masked.length; i++) {
          probs[i] = Math.exp((masked[i] - max) / temperature);
          sum += probs[i];
        }
        let r = rand() * sum;
        for (let i = 0; i < probs.length; i++) {
          r -= probs[i];
          if (r <= 0) return i;
        }
        return probs.length - 1;
      }

      return { sample };
    }

    function isStop(id) {
      return STOP_IDS.includes(id);
    }
    ```

    **Green Notes**
    - **Set for repeated membership tests** (reduces E): the old mask did vocabulary size × banned list size comparisons for every token. Now each check is one hash lookup. The `Set` is built once in `createSampler`, not per step, so the first step already pays back the build cost.
    - Output is identical. Only the lookup changed.
- role: user
  content: |
    ok. banned list can change at runtime now (admin endpoint). also should isStop be a Set too?
- role: assistant
  content: |
    Add a `setBanned` method that rebuilds the `Set` only when the list changes, never per step.

    Keep `isStop` as it is. It checks 3 ids, so the array scan is already trivial. A `Set` would not make it cheaper and would only add code.

    ```javascript
    const STOP_IDS = [2, 50256, 50257];

    function createSampler({ bannedTokenIds, temperature = 1.0 }) {
      let banned = new Set(bannedTokenIds);

      function setBanned(ids) {
        banned = new Set(ids);
      }

      function maskLogits(logits) {
        const out = new Float32Array(logits.length);
        for (let id = 0; id < logits.length; id++) {
          out[id] = banned.has(id) ? -Infinity : logits[id];
        }
        return out;
      }

      function sample(logits, rand = Math.random) {
        const masked = maskLogits(logits);
        let max = -Infinity;
        for (let i = 0; i < masked.length; i++) {
          if (masked[i] > max) max = masked[i];
        }
        const probs = new Float64Array(masked.length);
        let sum = 0;
        for (let i = 0; i < masked.length; i++) {
          probs[i] = Math.exp((masked[i] - max) / temperature);
          sum += probs[i];
        }
        let r = rand() * sum;
        for (let i = 0; i < probs.length; i++) {
          r -= probs[i];
          if (r <= 0) return i;
        }
        return probs.length - 1;
      }

      return { sample, setBanned };
    }

    function isStop(id) {
      return STOP_IDS.includes(id);
    }
    ```

    **Green Notes**
    - **Rebuild on update, not per step** (reduces E): an admin change costs one `Set` build. Every token after that uses plain lookups. Swapping the whole `Set` also means a running step never sees a half-updated list.
    - *Not applied:* `Set` for `STOP_IDS`. A set only pays off with many elements or many lookups. Three ids give you neither.
verify:
  equivalence:
    driver: |
      const logits = new Float32Array(200);
      for (let i = 0; i < 200; i++) logits[i] = Math.sin(i * 1.7) * 3;
      const banned = [];
      for (let i = 0; i < 200; i += 3) banned.push(i);
      const s = createSampler({ bannedTokenIds: banned, temperature: 0.8 });
      let seed = 12345;
      const rng = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const out = [];
      for (let k = 0; k < 20; k++) out.push(s.sample(logits, rng));
      console.log(out.join(','));
      console.log([0, 2, 5, 50256, 50257].map(isStop).join(','));
  test: |-
    function check(cond, msg) {
      if (!cond) throw new Error('assertion failed: ' + msg);
    }
    const s = createSampler({ bannedTokenIds: [1, 2] });
    const lg = new Float32Array([0, 10, 10, 0]);
    check(s.sample(lg, () => 0.5) === 0, 'banned 1,2 -> 0');
    s.setBanned([0, 1, 3]);
    check(s.sample(lg, () => 0.5) === 2, 'after setBanned -> 2');
    check(isStop(50256) === true, 'isStop(50256)');
    check(isStop(7) === false, 'isStop(7)');
