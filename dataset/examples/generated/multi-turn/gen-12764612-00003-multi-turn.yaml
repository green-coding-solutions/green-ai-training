    **Green Notes**
    - **JIT-compile the hot numeric loop** (reduces E): this is a CPU-bound loop over millions of floats, which is the case Numba fits. In Green Metrics Tool micro-benchmarks, quantizing 10M samples in a pure Python loop used about 4× more CPU energy than the same loop under `@njit`.
    - **`round` → `np.rint`:** both round half to even, so results are the same. A NaN sample raised `ValueError` before. Now it gives an undefined integer, so reject NaN upstream if that can happen.
    - **Warm-up:** the first call compiles. `cache=True` stores the result on disk, and one call at startup keeps the first request fast.
- role: user
  content: |
    we don't want numba in the service image, and no jit warmup on the first request. can't we do it without?
- role: assistant
  content: |
    Yes. Vectorize with numpy. The loop runs in compiled code, with no JIT and no extra dependency beyond numpy.

    ```python
    import numpy as np


    def quantize(samples, scale, lo=-32768, hi=32767):
        q = np.rint(np.asarray(samples, dtype=np.float64) / scale)
        return np.clip(q, lo, hi).astype(np.int32).tolist()
    ```

    `handle_ingest` stays as it is.

    **Green Notes**
    - **Vectorize instead of JIT** (reduces E): the per-sample Python loop is gone, which is the same kind of saving the Numba version gave. I have no measurement for this exact numpy version, so I won't put a number on it.
    - **Same results:** `np.rint` rounds half to even like `round`, and the clip is unchanged. As before, NaN is not handled, and it no longer raises.
    - **Not applied:** Numba. Nothing is compiled at runtime, so there is no warm-up and no cache directory to manage.
