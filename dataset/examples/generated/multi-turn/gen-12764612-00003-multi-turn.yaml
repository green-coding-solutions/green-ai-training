- role: user
  content: |
    ingest endpoint, batches up to ~2M float samples per request, quantize is the hot spot. add numba, diff only

    ```python
    import json
    import logging

    log = logging.getLogger("ingest")


    def quantize(samples, scale, lo=-32768, hi=32767):
        out = []
        for s in samples:
            q = int(round(s / scale))
            if q < lo:
                q = lo
            elif q > hi:
                q = hi
            out.append(q)
        return out


    def handle_ingest(body):
        payload = json.loads(body)
        scale = float(payload.get("scale", 0.01))
        q = quantize(payload["samples"], scale)
        log.info("device=%s n=%d", payload["device_id"], len(q))
        return json.dumps({"device": payload["device_id"], "count": len(q), "samples": q})
    ```
