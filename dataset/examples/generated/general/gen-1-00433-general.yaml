id: gen-1-00433-general
category: general
language: bash
patterns:
- none
messages:
- role: user
  content: |
    Summary line at the end of my eval script always prints 0 / 0. Diff only.

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    RESULTS=/var/log/infer/results.tsv
    THRESHOLD_PCT=85
    LOW_LOG=/tmp/low_conf.txt
    low=0
    total=0

    : > "$LOW_LOG"

    cat "$RESULTS" | while IFS=$'\t' read -r req_id label score_pct; do
      total=$((total + 1))
      if (( score_pct < THRESHOLD_PCT )); then
        low=$((low + 1))
        echo "low confidence: $req_id ($label, $score_pct)" >> "$LOW_LOG"
      fi
    done

    echo "low confidence: $low / $total"
    ```
- role: assistant
  content: |-
    The pipe runs the `while` loop in a subshell. `low` and `total` are updated there and lost when the loop ends. Read the file with a redirect instead:

    ```diff
    -cat "$RESULTS" | while IFS=$'\t' read -r req_id label score_pct; do
    +while IFS=$'\t' read -r req_id label score_pct; do
       total=$((total + 1))
       if (( score_pct < THRESHOLD_PCT )); then
         low=$((low + 1))
         echo "low confidence: $req_id ($label, $score_pct)" >> "$LOW_LOG"
       fi
    -done
    +done < "$RESULTS"
    ```

    Now the loop runs in the main shell, so the counters survive.

    If the last line of the file has no trailing newline, `read` returns non-zero for it and that line is skipped. Use `while IFS=$'\t' read -r ... || [[ -n $req_id ]]; do` if that can happen.
