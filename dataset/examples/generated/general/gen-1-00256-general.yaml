id: gen-1-00256-general
category: general
language: html
patterns:
- none
messages:
- role: user
  content: |
    hi, i am new to CI stuff. i made a github pages site and a workflow that should publish it, but the page stays blank and shows only the text of my tags. i think my index.html is wrong? its in the folder docs

    ```html
    <!DOCTYPE html>
    <html>
    <head>
      <title>Build status</title>
    </head>
    <body>
      <h1>Build status</h1>
      <p>Last deploy: today</p>
      &lt;ul&gt;
        &lt;li&gt;build: ok&lt;/li&gt;
        &lt;li&gt;tests: ok&lt;/li&gt;
      &lt;/ul&gt;
    </body>
    </html>
    ```
- role: assistant
  content: |
    The problem is in the list. You wrote the tags as HTML entities: `&lt;` and `&gt;` mean "show a `<` or `>` character". The browser prints them as text and does not treat them as tags.

    Use real angle brackets:

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Build status</title>
    </head>
    <body>
      <h1>Build status</h1>
      <p>Last deploy: today</p>
      <ul>
        <li>build: ok</li>
        <li>tests: ok</li>
      </ul>
    </body>
    </html>
    ```

    I also added `lang="en"` and `<meta charset="utf-8">`. They are not the cause of your problem, but they are good defaults. The charset line avoids broken special characters.

    If the page is still blank or shows an old version after you push, check these:

    - **Pages source:** in the repo, go to Settings → Pages. Make sure it publishes from the branch and folder you expect (for example `/docs` on `main`), or from "GitHub Actions" if your workflow deploys it.
    - **File name:** it must be `index.html`, all lowercase, in the folder that is published.
    - **Workflow run:** open the Actions tab and check that the last run is green and the deploy step finished.
    - **Cache:** do a hard refresh (Ctrl+Shift+R). Pages can take a minute to update.
verify:
  static_only: Plain HTML answer, no runnable code
