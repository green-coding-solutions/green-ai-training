id: gen-1-00305-general
category: general
language: sql
patterns:
- none
messages:
- role: user
  content: |
    hello, i have table with predictions from my model and i want to get only the last prediction for every model_id, but my query give me all rows. i am not sure how to do it, sorry for my english

    ```sql
    SELECT model_id, input_id, score, created_at
    FROM predictions
    GROUP BY model_id
    ORDER BY created_at DESC;
    ```
- role: assistant
  content: |
    `GROUP BY` collapses rows but does not pick "the latest one" for you. `ORDER BY` only sorts the final result. Some databases also reject your query, because `input_id`, `score` and `created_at` are not in the `GROUP BY`.

    Use `ROW_NUMBER()` to rank the rows inside each model, then keep rank 1:

    ```sql
    SELECT model_id, input_id, score, created_at
    FROM (
        SELECT model_id, input_id, score, created_at,
               ROW_NUMBER() OVER (
                   PARTITION BY model_id
                   ORDER BY created_at DESC, input_id DESC
               ) AS rn
        FROM predictions
    ) ranked
    WHERE rn = 1
    ORDER BY model_id;
    ```

    - `PARTITION BY model_id` makes a separate ranking for each model.
    - `ORDER BY created_at DESC` puts the newest row first, so it gets `rn = 1`.
    - `input_id DESC` is a tie-breaker. If two rows have the same `created_at`, you still get exactly one row per model.

    If you want all tied rows instead, use `RANK()` instead of `ROW_NUMBER()`.

    In PostgreSQL there is a shorter form:

    ```sql
    SELECT DISTINCT ON (model_id) model_id, input_id, score, created_at
    FROM predictions
    ORDER BY model_id, created_at DESC, input_id DESC;
    ```
