id: gen-1-00329-general
category: general
language: html
patterns:
- none
messages:
- role: user
  content: |
    Log viewer page, the "Apply" button clears my level filter and reloads the page instead of filtering. Diff only please.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Ingest log viewer</title>
    </head>
    <body>
      <form id="filters">
        <label for="level">Level</label>
        <select id="level">
          <option value="">all</option>
          <option value="ERROR">ERROR</option>
          <option value="WARN">WARN</option>
          <option value="INFO">INFO</option>
        </select>
        <button id="apply">Apply</button>
      </form>

      <pre id="out"></pre>

      <script>
        const lines = [
          "2026-10-08T10:01:02Z INFO worker started",
          "2026-10-08T10:01:09Z WARN queue depth high",
          "2026-10-08T10:02:41Z ERROR upstream timeout"
        ];
        const out = document.getElementById("out");
        document.getElementById("apply").addEventListener("click", () => {
          const level = document.getElementById("level").value;
          out.textContent = lines.filter(l => l.includes(" " + level + " ")).join("\n");
        });
      </script>
    </body>
    </html>
    ```
- role: assistant
  content: |-
    A `<button>` inside a `<form>` defaults to `type="submit"`. The click handler runs, then the form submits and the page reloads.

    ```diff
    -    <button id="apply">Apply</button>
    +    <button id="apply" type="button">Apply</button>
    ```

    With `type="button"` no submit happens, so the filter result stays on the page.

    If you want Enter in the form to apply the filter too, keep the submit button and handle the form event instead:

    ```diff
    -    <button id="apply" type="button">Apply</button>
    +    <button id="apply">Apply</button>
    ...
    -    document.getElementById("apply").addEventListener("click", () => {
    +    document.getElementById("filters").addEventListener("submit", (e) => {
    +      e.preventDefault();
           const level = document.getElementById("level").value;
    ```

    Also, with "all" selected, `level` is `""`, so the filter looks for `"  "` (two spaces) and matches nothing. Fix that too:

    ```diff
    -      out.textContent = lines.filter(l => l.includes(" " + level + " ")).join("\n");
    +      out.textContent = lines.filter(l => !level || l.includes(" " + level + " ")).join("\n");
    ```
