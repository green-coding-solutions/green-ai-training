id: gen-1-00054-general
category: general
language: html
patterns:
- none
messages:
- role: user
  content: |
    ```html
    <header>
      <nav>
        <a href="#features">Features</a>
        <a href="#pricing">Pricing</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section id="features">
        <h2>Features</h2>
        <p>Track your habits with one tap.</p>
      </section>

      <section id="prices">
        <h2>Pricing</h2>
        <p>Free for one user. $4 per month for teams.</p>
      </section>

      <section id="contact-us">
        <h2>Contact</h2>
        <form action="/contact" method="post">
          <label for="email">Your email</label>
          <input type="email" id="mail" name="email" required>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    ```

    ?
- role: assistant
  content: |-
    You have two mismatched names. In both cases the link and its target must use exactly the same value.

    1. **Nav links:** "Features" works, but "Pricing" and "Contact" do nothing. The links point to `#pricing` and `#contact`, while the sections have `id="prices"` and `id="contact-us"`.
    2. **Form label:** `<label for="email">` points to an id that doesn't exist. The input has `id="mail"`. Clicking the label doesn't focus the field, and screen readers don't connect the two.

    Fixed:

    ```html
    <nav>
      <a href="#features">Features</a>
      <a href="#pricing">Pricing</a>
      <a href="#contact">Contact</a>
    </nav>

    <section id="pricing">
      <h2>Pricing</h2>
      <p>Free for one user. $4 per month for teams.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form action="/contact" method="post">
        <label for="email">Your email</label>
        <input type="email" id="email" name="email" required>
        <button type="submit">Send</button>
      </form>
    </section>
    ```

    The `name="email"` on the input is a separate thing. It is the field name sent to the server, so it can stay as it is.
