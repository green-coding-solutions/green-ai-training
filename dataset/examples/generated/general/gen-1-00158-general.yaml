id: gen-1-00158-general
category: general
language: sql
patterns:
- none
sql_dialect: postgres
messages:
- role: user
  content: |
    Postgres on our gateway box. Latest reading per device. Diff only.

    ```sql
    SELECT device_id, reading_c, MAX(recorded_at) AS recorded_at
    FROM sensor_readings
    WHERE gateway_id = 'gw-07'
    GROUP BY device_id;
    ```

    ERROR: column "sensor_readings.reading_c" must appear in the GROUP BY clause or be used in an aggregate function
- role: assistant
  content: |
    ```sql
    SELECT DISTINCT ON (device_id) device_id, reading_c, recorded_at
    FROM sensor_readings
    WHERE gateway_id = 'gw-07'
    ORDER BY device_id, recorded_at DESC;
    ```

    `MAX(recorded_at)` does not tell Postgres which row's `reading_c` to return. `DISTINCT ON (device_id)` keeps the first row per device, and the `ORDER BY ... recorded_at DESC` makes that the newest one. The `ORDER BY` must start with the `DISTINCT ON` column.

    If two rows for a device share the same `recorded_at`, add a tiebreaker such as `, id DESC`.
verify:
  static_only: Postgres-specific DISTINCT ON, not runnable in SQLite
