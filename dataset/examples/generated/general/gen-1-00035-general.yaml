id: gen-1-00035-general
category: general
language: dockerfile
patterns:
- none
messages:
- role: user
  content: |
    Why does this fail with "exec ./server: no such file or directory" on alpine? Just give me the diff.

    ```dockerfile
    FROM golang:1.22 AS build
    WORKDIR /src
    COPY go.mod go.sum ./
    RUN go mod download
    COPY . .
    RUN go build -o /out/server ./cmd/checkout

    FROM alpine:3.20
    WORKDIR /app
    COPY --from=build /out/server .
    EXPOSE 8080
    CMD ["./server"]
    ```
- role: assistant
  content: |-
    The binary is dynamically linked against glibc (the `golang` image is Debian-based), and Alpine uses musl. The loader the binary asks for doesn't exist, so you get "no such file or directory" even though the file is there.

    Fix: build a static binary.

    ```diff
    -RUN go build -o /out/server ./cmd/checkout
    +RUN CGO_ENABLED=0 go build -o /out/server ./cmd/checkout
    ```

    If you need cgo (for example for a C library), build on `golang:1.22-alpine` instead, so the build and runtime libc match.
