id: gen-1-00449-general
category: general
language: yaml
patterns:
- none
messages:
- role: user
  content: |
    ```yaml
    name: ocean-flux
    channels:
      - defaults
      - conda-forge
    dependencies:
      - python=3.11
      - numpy=1.26
      - scipy=1.11
      - netcdf4
      - dask
      - jupyterlab
      pip:
        - xarray==2023.12.0
        - cftime==1.6.3
    ```

    ?
- role: assistant
  content: |-
    This is a conda `environment.yml`, but it is not valid YAML as written. The `pip:` key sits at the same level as the list items under `dependencies`. A list can't contain a key like that, so `conda env create -f environment.yml` fails with a parse error.

    `pip:` has to be a list item itself:

    ```yaml
    name: ocean-flux
    channels:
      - conda-forge
      - defaults
    dependencies:
      - python=3.11
      - numpy=1.26
      - scipy=1.11
      - netcdf4
      - dask
      - jupyterlab
      - pip
      - pip:
          - xarray==2023.12.0
          - cftime==1.6.3
    ```

    Changes:
    - `- pip:` is now a list item, and its packages are indented below it.
    - `- pip` is listed as a dependency, so conda installs its own pip into the environment.
    - `conda-forge` now comes before `defaults`. Conda uses channels in the order given, so this makes `conda-forge` the preferred source. Mixing the two channels can cause solver conflicts for packages like `netcdf4`.

    Version syntax differs between the two sections. Conda specs use a single `=` (`numpy=1.26`), while pip specs use `==` (`xarray==2023.12.0`). Don't mix them.

    `xarray` and `cftime` are also on conda-forge. Installing them with conda avoids having two package managers manage the same environment. Keep them under `pip:` only if you need a version conda-forge doesn't have.
