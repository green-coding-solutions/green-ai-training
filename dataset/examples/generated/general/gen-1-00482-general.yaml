id: gen-1-00482-general
category: general
language: html
patterns:
- none
messages:
- role: user
  content: |
    I'm building a small static page that shows a few dozen lines of an application log in a table. It's for our support team, who open it from a shared drive. Requirements:

    - columns: time, level (INFO / WARN / ERROR), source, message
    - the level should be easy to spot, but color-blind people must be able to read it too
    - the table is wider than most laptop screens because of long messages, so it needs to scroll sideways, and keyboard users must be able to scroll it
    - screen readers should announce the table with a proper title and column headers
    - plain HTML and CSS only, no JavaScript

    Here is what I have now:

    ```html
    <div style="overflow:auto">
      <table>
        <tr><td>2026-10-12 08:14:02</td><td style="color:red">ERROR</td><td>payment-svc</td><td>Upstream timeout after 30s</td></tr>
        <tr><td>2026-10-12 08:14:05</td><td style="color:orange">WARN</td><td>payment-svc</td><td>Retrying request 1/3</td></tr>
      </table>
    </div>
    ```

    How should I structure this?
- role: assistant
  content: |
    Use a real table structure (caption, header cells with `scope`), make the scroll container focusable and labelled, and put the level in text, not only in color.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Application log</title>
      <style>
        .log-scroll {
          overflow-x: auto;
          border: 1px solid #ccc;
        }
        .log-scroll:focus-visible {
          outline: 3px solid #0b57d0;
          outline-offset: 2px;
        }
        table.log {
          border-collapse: collapse;
          width: 100%;
          font: 14px/1.4 system-ui, sans-serif;
        }
        .log caption {
          text-align: left;
          font-weight: 600;
          padding: 0.5rem;
        }
        .log th, .log td {
          padding: 0.35rem 0.6rem;
          border-bottom: 1px solid #e3e3e3;
          text-align: left;
          vertical-align: top;
        }
        .log td.msg {
          font-family: ui-monospace, monospace;
          white-space: pre-wrap;
          min-width: 24rem;
        }
        .lvl {
          display: inline-block;
          min-width: 4.5em;
          padding: 0 0.4em;
          border: 2px solid currentColor;
          border-radius: 3px;
          font-weight: 700;
          text-align: center;
        }
        .lvl-info  { color: #1a5fb4; }
        .lvl-warn  { color: #8a4b00; border-style: dashed; }
        .lvl-error { color: #a30000; background: #fde8e8; }
      </style>
    </head>
    <body>
      <div class="log-scroll" role="region" aria-labelledby="log-title" tabindex="0">
        <table class="log">
          <caption id="log-title">Application log, 12 October 2026</caption>
          <thead>
            <tr>
              <th scope="col">Time</th>
              <th scope="col">Level</th>
              <th scope="col">Source</th>
              <th scope="col">Message</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><time datetime="2026-10-12T08:14:02">2026-10-12 08:14:02</time></td>
              <td><span class="lvl lvl-error">ERROR</span></td>
              <td>payment-svc</td>
              <td class="msg">Upstream timeout after 30s</td>
            </tr>
            <tr>
              <td><time datetime="2026-10-12T08:14:05">2026-10-12 08:14:05</time></td>
              <td><span class="lvl lvl-warn">WARN</span></td>
              <td>payment-svc</td>
              <td class="msg">Retrying request 1/3</td>
            </tr>
          </tbody>
        </table>
      </div>
    </body>
    </html>
    ```

    What changed and why:

    - **`<caption>`, `<thead>`, `scope="col"`**: screen readers announce the table title and read the column name for each cell.
    - **`tabindex="0"` on the scroll container**: keyboard users can focus it and scroll with the arrow keys. Without it, a scrollable `div` is unreachable by keyboard in most browsers.
    - **`role="region"` with `aria-labelledby`**: gives the focusable container a name, so it is announced as "Application log, region" and not as an unnamed element.
    - **Level as text plus a visual cue**: the word is always there. The border style (solid, dashed) and the background on `ERROR` add a second cue that does not depend on hue.
    - **`<time datetime>`**: gives the timestamp a machine-readable value. Drop it if you never need that.
    - **`white-space: pre-wrap` on messages**: keeps line breaks and indentation from multi-line messages, such as stack traces, while still wrapping long lines. Remove `min-width` on `.msg` if you want narrower columns.

    Keep the text colors at a contrast ratio of at least 4.5:1 against their background. The ones above pass on white.
verify:
  static_only: Pure HTML/CSS answer, nothing executable to test
