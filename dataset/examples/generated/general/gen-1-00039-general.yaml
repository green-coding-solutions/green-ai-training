id: gen-1-00039-general
category: general
language: bash
patterns:
- none
messages:
- role: user
  content: |
    hello, i have a small bash script for my model server and i dont understand why it not stop when the python command fail. it print "starting server" and then continue with the next lines even if the model file is missing

    ```bash
    #!/bin/bash
    MODEL_DIR=/opt/models/resnet50
    PORT=8080

    echo "starting server"
    python3 serve.py --model $MODEL_DIR/model.onnx --port $PORT
    echo "server started"
    curl http://localhost:$PORT/health
    ```

    how to make script stop at first error? thx
- role: assistant
  content: |
    By default, bash keeps going after a failed command. Add `set -euo pipefail` near the top:

    ```bash
    #!/bin/bash
    set -euo pipefail

    MODEL_DIR=/opt/models/resnet50
    PORT=8080

    echo "starting server"
    python3 serve.py --model "$MODEL_DIR/model.onnx" --port "$PORT"
    echo "server started"
    curl -fsS "http://localhost:$PORT/health"
    ```

    What the flags do:

    - `-e`: exit when a command returns a non-zero status.
    - `-u`: treat unset variables as an error, so a typo in a variable name does not silently become an empty string.
    - `-o pipefail`: a pipeline fails if any command in it fails, not only the last one.

    Two more things about your script:

    - `python3 serve.py` runs in the foreground. If it is a long-running server, the script waits there and never reaches `echo "server started"`. To start it in the background, use `python3 serve.py ... &`, then wait for the health check (for example in a short retry loop) before you continue.
    - I added quotes around the variables and `-fsS` to `curl`. With `-f`, curl returns an error on HTTP 4xx/5xx, so `set -e` can catch a failed health check.

    If you want a clearer error for the missing model file, check it before starting:

    ```bash
    [ -f "$MODEL_DIR/model.onnx" ] || { echo "model file not found: $MODEL_DIR/model.onnx" >&2; exit 1; }
    ```
verify:
  static_only: bash script that starts a model server and needs python, an ONNX model and a network service
