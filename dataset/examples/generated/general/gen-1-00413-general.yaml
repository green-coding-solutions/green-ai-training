id: gen-1-00413-general
category: general
language: html
patterns:
- none
messages:
- role: user
  content: |
    hello, my ci job publish the html test report to github pages, but when i open the page it have no style and the logo is broken. on my laptop it work fine when i open the file. what is wrong??

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Test report</title>
      <link rel="stylesheet" href="/assets/report.css">
      <script src="/assets/report.js" defer></script>
    </head>
    <body>
      <img src="/assets/logo.png" alt="Company logo">
      <h1>Test report</h1>
      <a href="/details/failures.html">Failures</a>
    </body>
    </html>
    ```

    the site url is https://myteam.github.io/payment-service/
- role: assistant
  content: |-
    The problem is the leading `/` in your paths. A path that starts with `/` is resolved from the root of the domain, not from your project folder.

    On your laptop, the browser opens the file directly, so it can find it. On GitHub Pages, your site lives under `/payment-service/`, so the browser asks for:

    ```text
    https://myteam.github.io/assets/report.css
    ```

    That URL does not exist, so you get a 404. The file is really at `https://myteam.github.io/payment-service/assets/report.css`.

    Remove the leading slash so the paths are relative to the current page:

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Test report</title>
      <link rel="stylesheet" href="assets/report.css">
      <script src="assets/report.js" defer></script>
    </head>
    <body>
      <img src="assets/logo.png" alt="Company logo">
      <h1>Test report</h1>
      <a href="details/failures.html">Failures</a>
    </body>
    </html>
    ```

    For a page in a subfolder, such as `details/failures.html`, go up one level first: `../assets/report.css`.

    If you prefer to keep root-style paths, you can add `<base href="/payment-service/">` in `<head>` and use `assets/...` without the slash. But this hardcodes the repo name, so it breaks if you rename the repo or use a custom domain.

    Two more things to check if files are still missing:
    - GitHub Pages runs on Linux, so file names are case-sensitive. `Logo.png` and `logo.png` are different files.
    - Pages uses Jekyll by default and ignores folders that start with `_`. Add an empty file named `.nojekyll` to the published folder to turn this off.
