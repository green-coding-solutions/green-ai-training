id: gen-1-00393-general
category: general
language: typescript
patterns:
- none
messages:
- role: user
  content: |
    strict mode is on and tsc complains: "'form' is possibly 'null'" and "Property 'elements' does not exist on type 'Element'". Diff only please.

    ```ts
    const form = document.querySelector('#signup');
    const status = document.querySelector('.signup-status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.elements.email.value.trim();
      if (!email) {
        status.textContent = 'Please enter your email.';
        return;
      }
      const res = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      status.textContent = res.ok ? 'Thanks, check your inbox!' : 'Something went wrong.';
    });
    ```
- role: assistant
  content: |
    ```diff
    -const form = document.querySelector('#signup');
    -const status = document.querySelector('.signup-status');
    +const form = document.querySelector<HTMLFormElement>('#signup');
    +const status = document.querySelector<HTMLElement>('.signup-status');
    +
    +if (!form || !status) {
    +  throw new Error('Signup markup is missing');
    +}

     form.addEventListener('submit', async (e) => {
       e.preventDefault();
    -  const email = form.elements.email.value.trim();
    +  const email = String(new FormData(form).get('email') ?? '').trim();
       if (!email) {
    ```

    - `querySelector` returns `Element | null`. The generic gives you `HTMLFormElement`, which has `elements`. It is only a type assertion, so it does not check the element at runtime.
    - The guard narrows both `const` variables. The narrowing also holds inside the async callback, so the `status.textContent` lines need no changes.
    - `FormData.get()` returns `FormDataEntryValue | null`. That is why the value goes through `String(... ?? '')` before `.trim()`. It also avoids the unsafe `elements.email` access. Your `<input>` needs `name="email"`.
    - If you would rather not throw at load time, use `if (form && status) { ... }` around the listener instead.
verify:
  static_only: TypeScript DOM code needs a browser environment and the TypeScript compiler, which are beyond stdlib + numpy.
