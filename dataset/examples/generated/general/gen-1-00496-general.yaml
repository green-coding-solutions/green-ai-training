id: gen-1-00496-general
category: general
language: javascript
patterns:
- none
facts: []
messages:
- role: user
  content: |
    hi, im new to node. my script always says 0 errors but when I open app.log I can see lines with ERROR in them. I dont know what is wrong

    ```javascript
    const fs = require('fs');

    let errors = 0;

    fs.readFile('app.log', 'utf8', (err, data) => {
      if (err) throw err;
      const lines = data.split('\n');
      for (const line of lines) {
        if (line.includes('ERROR')) {
          errors++;
        }
      }
    });

    console.log('Errors found: ' + errors);
    ```
- role: assistant
  content: |
    Your counting code is fine. The problem is the order things run in.

    `fs.readFile` is asynchronous. It starts reading the file and returns right away. Node then runs the next line, `console.log`, while `errors` is still `0`. The callback runs later, after the file is read. By then the script has already printed.

    The easiest fix is the promise version of `fs` with `await`. Then the script waits for the file before it continues. This version uses the modern `import` syntax, so save it as `count-errors.mjs` (or add `"type": "module"` to your `package.json`):

    ```javascript
    import { readFile } from 'node:fs/promises';

    export function countErrors(text) {
      let errors = 0;
      for (const line of text.split('\n')) {
        if (line.includes('ERROR')) errors++;
      }
      return errors;
    }

    async function main() {
      const data = await readFile('app.log', 'utf8');
      console.log('Errors found: ' + countErrors(data));
    }

    if (import.meta.main) {
      main().catch((err) => {
        console.error(err.message);
        process.exit(1);
      });
    }
    ```

    Run it with `node count-errors.mjs`.

    What changed:
    - `await` pauses `main()` until the file content is ready. The count is printed after the loop has run.
    - The counting is in its own function, so you can test it with a small string and no file.
    - `import.meta.main` is true only when you run this file directly. Other files can import `countErrors` without reading `app.log`.
    - `.catch(...)` prints a clear message if `app.log` is missing, instead of a long stack trace.

    If you want to keep your `require` and callback style, there is a smaller fix: move the `console.log` inside the callback, right after the `for` loop. The rule is the same either way. Anything that needs the file content must run after the file is read.
verify:
  module: true
  test: |-
    import assert from 'node:assert';
    assert.strictEqual(countErrors('a\nERROR x\nb\nERROR y\n'), 2);
    assert.strictEqual(countErrors(''), 0);
    assert.strictEqual(countErrors('all fine\nINFO ok'), 0);
