id: gen-1-00481-general
category: general
language: sql
patterns:
- none
messages:
- role: user
  content: |
    fix this, UPDATE says "no such column: o.status" but the column exists

    ```sql
    UPDATE orders AS o
    SET o.status = 'shipped'
    WHERE o.id IN (SELECT order_id FROM shipments WHERE shipped_at IS NOT NULL);
    ```
- role: assistant
  content: |
    In an `UPDATE`, the column on the left side of `SET` must not have a table alias or prefix. Remove `o.` there:

    ```sql
    UPDATE orders AS o
    SET status = 'shipped'
    WHERE o.id IN (SELECT order_id FROM shipments WHERE shipped_at IS NOT NULL);
    ```

    The `o.` prefix is still fine in the `WHERE` clause. Only the `SET` target must be a bare column name.

    If it still fails, check that your SQLite version supports aliases in `UPDATE` (3.25 or newer). Otherwise drop the alias:

    ```sql
    UPDATE orders
    SET status = 'shipped'
    WHERE id IN (SELECT order_id FROM shipments WHERE shipped_at IS NOT NULL);
    ```
verify:
  sql:
    setup: CREATE TABLE orders (id INTEGER PRIMARY KEY, status TEXT); CREATE TABLE shipments (order_id INTEGER, shipped_at
      TEXT); INSERT INTO orders VALUES (1,'new'),(2,'new'),(3,'new'); INSERT INTO shipments VALUES (1,'2026-01-01'),(2,NULL);
    compare: false
