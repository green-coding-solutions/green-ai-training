id: gen-1-00134-general
category: general
language: html
patterns:
- none
messages:
- role: user
  content: |
    hi, i made a small script that writes a status report as an html file and i open it in firefox. but some letters look broken, like "MÃ¼ller" and "GrÃ¶ÃŸe". i dont know what is wrong. this is the file it makes:

    ```html
    <!DOCTYPE html>
    <html>
    <head>
      <title>Backup Report</title>
      <style>
        table { border-collapse: collapse; }
        td, th { border: 1px solid #999; padding: 4px 8px; }
      </style>
    </head>
    <body>
      <h1>Backup Report</h1>
      <table>
        <tr><th>Benutzer</th><th>Größe</th><th>Status</th></tr>
        <tr><td>Müller</td><td>2.1 GB</td><td>OK</td></tr>
        <tr><td>Schäfer</td><td>870 MB</td><td>OK</td></tr>
        <tr><td>Köhler</td><td>4.6 GB</td><td>Fehlgeschlagen</td></tr>
      </table>
    </body>
    </html>
    ```
- role: assistant
  content: |-
    The file has no character encoding declaration. Your script most likely saves it as UTF-8, but the browser doesn't know that and guesses a different encoding (often Windows-1252). Then `ü` (two bytes in UTF-8) is shown as `Ã¼`.

    Add this line as the first thing inside `<head>`:

    ```html
    <!DOCTYPE html>
    <html lang="de">
    <head>
      <meta charset="utf-8">
      <title>Backup Report</title>
      <style>
        table { border-collapse: collapse; }
        td, th { border: 1px solid #999; padding: 4px 8px; }
      </style>
    </head>
    ```

    The rest of the file can stay the same. I also added `lang="de"`, which helps screen readers and spell checkers, but it is not needed for the fix.

    Two more things to check:

    - The `<meta charset>` tag must be within the first 1024 bytes of the file, so keep it at the top of `<head>`.
    - Your script must really write UTF-8. In Python, for example, use `open("report.html", "w", encoding="utf-8")`. Without `encoding=`, Python on Windows may use another encoding, and then the tag and the file would not match.
