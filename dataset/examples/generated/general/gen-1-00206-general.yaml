id: gen-1-00206-general
category: general
language: css
patterns:
- none
messages:
- role: user
  content: |
    Dashboard for our model inference service. Prediction table rows should be sticky-header with the confidence column right-aligned and tabular numbers so they don't jitter when the live values update. Here's what I have, just give me the diff.

    ```css
    .pred-table {
      width: 100%;
      border-collapse: collapse;
      font-family: system-ui, sans-serif;
    }

    .pred-table th,
    .pred-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    .pred-table .conf {
      font-weight: 600;
    }
    ```
- role: assistant
  content: |-
    ```diff
     .pred-table {
       width: 100%;
       border-collapse: collapse;
       font-family: system-ui, sans-serif;
     }

    +.pred-table th {
    +  position: sticky;
    +  top: 0;
    +  background: #fff; /* needed, or rows show through */
    +}
    +
     .pred-table th,
     .pred-table td {
       padding: 6px 10px;
       border-bottom: 1px solid #ddd;
       text-align: left;
     }

     .pred-table .conf {
       font-weight: 600;
    +  text-align: right;
    +  font-variant-numeric: tabular-nums;
     }
    ```

    Notes:
    - `th.conf` needs the right alignment too. Since `.pred-table .conf` has higher specificity than `.pred-table th`, the rule above covers both the header and the cells.
    - Sticky headers stick to the nearest scrolling ancestor. If the table sits in a container with `overflow: auto`, give that container a fixed `max-height`, or the header will not stick.
    - With `border-collapse: collapse`, the bottom border of a sticky `th` scrolls away. If you see that, use `box-shadow: 0 1px 0 #ddd` on the `th` instead.
    - `tabular-nums` only works if the font has tabular figures. `system-ui` fonts usually do.
