id: gen-1-00093-general
category: general
language: typescript
patterns:
- none
messages:
- role: user
  content: |
    I'm building a checkout page for our shop in TypeScript and I need to model the order status properly. Requirements:

    - An order can be `pending`, `paid`, `shipped`, `delivered` or `cancelled`.
    - Only some transitions are allowed: pending → paid or cancelled, paid → shipped or cancelled, shipped → delivered. Everything else must be rejected.
    - I want the compiler to catch typos in status names.
    - Invalid transitions should fail with a clear error, not silently do nothing.

    Right now I just use `status: string` everywhere and it's a mess. What's a clean way to do this?
- role: assistant
  content: |
    Use a string literal union for the statuses and a lookup table for the allowed transitions. The compiler then checks the names, and one small function enforces the rules.

    ```typescript
    const ORDER_STATUSES = [
      "pending",
      "paid",
      "shipped",
      "delivered",
      "cancelled",
    ] as const;

    export type OrderStatus = (typeof ORDER_STATUSES)[number];

    const ALLOWED_TRANSITIONS: Record<OrderStatus, readonly OrderStatus[]> = {
      pending: ["paid", "cancelled"],
      paid: ["shipped", "cancelled"],
      shipped: ["delivered"],
      delivered: [],
      cancelled: [],
    };

    export class InvalidTransitionError extends Error {
      constructor(
        public readonly from: OrderStatus,
        public readonly to: OrderStatus,
      ) {
        super(`Invalid order status transition: ${from} -> ${to}`);
        this.name = "InvalidTransitionError";
      }
    }

    export function canTransition(from: OrderStatus, to: OrderStatus): boolean {
      return ALLOWED_TRANSITIONS[from].includes(to);
    }

    export function transition(from: OrderStatus, to: OrderStatus): OrderStatus {
      if (!canTransition(from, to)) {
        throw new InvalidTransitionError(from, to);
      }
      return to;
    }

    // Use it on an order:
    interface Order {
      id: string;
      status: OrderStatus;
    }

    export function updateStatus(order: Order, next: OrderStatus): Order {
      return { ...order, status: transition(order.status, next) };
    }
    ```

    Why this works:

    - `Record<OrderStatus, ...>` forces you to list every status. If you add `"refunded"` later, the compiler points to the table until you define its transitions.
    - A typo like `"payed"` is a compile error everywhere the type is used.
    - `ORDER_STATUSES` gives you a runtime array too. You can use it to validate values that come from the database or an API:

    ```typescript
    export function isOrderStatus(value: string): value is OrderStatus {
      return (ORDER_STATUSES as readonly string[]).includes(value);
    }
    ```

    Types are erased at runtime, so always validate untrusted input (request bodies, DB rows) with a guard like this before treating it as `OrderStatus`.

    One more thing: the check in `transition` is not enough on its own if two requests update the same order at the same time. In the database, update with a condition, for example `UPDATE orders SET status = 'shipped' WHERE id = $1 AND status = 'paid'`, and treat zero affected rows as a failed transition.
verify:
  module: true
  test: |
    assert transition("pending", "paid") == "paid" if False else True
  static_only: TypeScript code needs a TypeScript toolchain, not available in the stdlib-only checker
