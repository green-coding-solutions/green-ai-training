category: general
language: python
patterns:
- none
messages:
- role: user
  content: |
    hi i am making a small landing page with flask and a contact form. when i submit the form it shows a error 400 Bad Request and i dont know why. what is wrong?

    ```python
    from flask import Flask, render_template, request, redirect, url_for

    app = Flask(__name__)

    @app.route("/")
    def index():
        return render_template("index.html")

    @app.route("/contact", methods=["POST"])
    def contact():
        name = request.form["name"]
        email = request.form["email"]
        message = request.form["message"]
        print(name, email, message)
        return redirect(url_for("index"))

    if __name__ == "__main__":
        app.run(debug=True)
    ```

    and the html form:

    ```html
    <form action="/contact" method="post">
      <input type="text" id="name" placeholder="Your name">
      <input type="email" name="email" placeholder="Your email">
      <textarea name="message"></textarea>
      <button type="submit">Send</button>
    </form>
    ```
- role: assistant
  content: |
    The problem is in the HTML, not in your Python code.

    The first input has an `id` but no `name`. Browsers only send fields that have a `name` attribute. So `name` is missing from the request. `request.form["name"]` then raises a `KeyError`, and Flask turns that into a 400 Bad Request.

    Add `name="name"` to the input:

    ```html
    <form action="/contact" method="post">
      <input type="text" id="name" name="name" placeholder="Your name">
      <input type="email" name="email" placeholder="Your email">
      <textarea name="message"></textarea>
      <button type="submit">Send</button>
    </form>
    ```

    If you want the route to accept forms with missing fields, use `request.form.get("name", "")`. That returns an empty string instead of raising an error. For a contact form it is often better to keep the strict version and add `required` to the inputs, so the browser checks them before sending.
verify:
  static_only: Flask is not in the standard library; the issue is a missing HTML name attribute, no runnable stdlib test.
