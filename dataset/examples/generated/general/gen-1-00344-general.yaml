id: gen-1-00344-general
category: general
language: yaml
patterns:
- none
messages:
- role: user
  content: |
    fix this, 422 on every request

    ```yaml
    openapi: 3.0.3
    info:
      title: Orders API
      version: 1.0.0
    paths:
      /orders:
        post:
          summary: Create order
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/NewOrder'
          responses:
            '201':
              description: Created
    components:
      schemas:
        NewOrder:
          type: object
          required: [customer_id, items]
          properties:
            customer_id:
              type: integer
            items:
              type: array
              items:
                type: object
                required: [sku, quantity]
                properties:
                  sku:
                    type: string
                  quantity:
                    type: integer
                    minimum: 1
            note:
              type: string
              nullable: false
              maxLength: 200
    ```

    my client sends `{"customer_id": "1042", "items": [{"sku": "A-1", "quantity": 2}]}`
- role: assistant
  content: |-
    The spec is fine. The client is wrong: it sends `customer_id` as a string (`"1042"`), but the schema says `integer`. A validator rejects that with 422.

    Fix the client payload:

    ```json
    {"customer_id": 1042, "items": [{"sku": "A-1", "quantity": 2}]}
    ```

    If you can't change the client and want the API to accept both, you have two options:

    - Make the field a string in the schema (`type: string`) and parse it on the server.
    - Turn on type coercion in your validator. Many frameworks (FastAPI/pydantic in lax mode, for example) do this by default, so check whether your validator is running in strict mode.

    One small thing: `nullable: false` on `note` is the default, so you can delete that line. It changes nothing.
