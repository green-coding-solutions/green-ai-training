id: gen-1-00101-general
category: general
language: dockerfile
patterns:
- none
messages:
- role: user
  content: |
    nginx container dies on start after I added USER nginx. Diff only please.

    ```text
    nginx: [emerg] bind() to 0.0.0.0:80 failed (13: Permission denied)
    ```

    ```dockerfile
    FROM node:20-alpine AS build
    WORKDIR /app
    COPY package.json package-lock.json ./
    RUN npm ci
    COPY . .
    RUN npm run build

    FROM nginx:1.27-alpine
    COPY nginx.conf /etc/nginx/conf.d/default.conf
    COPY --from=build /app/dist /usr/share/nginx/html
    USER nginx
    EXPOSE 80
    CMD ["nginx", "-g", "daemon off;"]
    ```
- role: assistant
  content: |
    A non-root user can't bind to ports below 1024. The stock `nginx` image also writes to `/var/cache/nginx` and `/var/run/nginx.pid`, which `nginx` can't write to either. The `nginx-unprivileged` image already handles both.

    ```diff
    -FROM nginx:1.27-alpine
    +FROM nginxinc/nginx-unprivileged:1.27-alpine
     COPY nginx.conf /etc/nginx/conf.d/default.conf
     COPY --from=build /app/dist /usr/share/nginx/html
     USER nginx
    -EXPOSE 80
    -CMD ["nginx", "-g", "daemon off;"]
    +EXPOSE 8080
    ```

    ```diff
    # nginx.conf
    -    listen 80;
    +    listen 8080;
    ```

    The base image already sets `CMD`, so you can drop yours. Change your port mapping to `-p 80:8080`, or update `containerPort` in Kubernetes.
verify:
  static_only: Dockerfile and nginx runtime behavior, needs Docker and the nginx images
