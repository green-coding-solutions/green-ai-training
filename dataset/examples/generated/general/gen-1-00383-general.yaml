id: gen-1-00383-general
category: general
language: python
patterns:
- none
messages:
- role: user
  content: |
    ?

    ```python
    SECTIONS = ["hero", "features", "pricing", "faq"]

    TITLES = {
        "hero": "Ship faster",
        "features": "What you get",
        "pricing": "Simple plans",
        "faq": "Questions",
    }

    renderers = {}
    for name in SECTIONS:
        renderers[name] = lambda: f'<section id="{name}"><h2>{TITLES[name]}</h2></section>'

    def render_page():
        return "\n".join(renderers[s]() for s in SECTIONS)

    print(render_page())
    ```
- role: assistant
  content: |
    The output is wrong: all four sections come out as the `faq` section.

    ```html
    <section id="faq"><h2>Questions</h2></section>
    <section id="faq"><h2>Questions</h2></section>
    <section id="faq"><h2>Questions</h2></section>
    <section id="faq"><h2>Questions</h2></section>
    ```

    A lambda does not copy `name` when you create it. It looks up `name` when it is called. The loop is finished by then, so `name` is the last value, `"faq"`, for every lambda.

    Bind the current value as a default argument:

    ```python
    SECTIONS = ["hero", "features", "pricing", "faq"]

    TITLES = {
        "hero": "Ship faster",
        "features": "What you get",
        "pricing": "Simple plans",
        "faq": "Questions",
    }

    renderers = {}
    for name in SECTIONS:
        renderers[name] = lambda name=name: f'<section id="{name}"><h2>{TITLES[name]}</h2></section>'

    def render_page():
        return "\n".join(renderers[s]() for s in SECTIONS)

    print(render_page())
    ```

    `functools.partial(render_section, name)` with a normal `render_section(name)` function also works. It is often easier to read when the markup grows.
verify:
  test: |-
    out = render_page()
    lines = out.split("\n")
    assert len(lines) == 4
    assert lines[0] == '<section id="hero"><h2>Ship faster</h2></section>'
    assert lines[1] == '<section id="features"><h2>What you get</h2></section>'
    assert lines[2] == '<section id="pricing"><h2>Simple plans</h2></section>'
    assert lines[3] == '<section id="faq"><h2>Questions</h2></section>'
