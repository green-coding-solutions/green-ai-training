messages:
- role: user
  content: |
    Landing page, static HTML/CSS/JS behind nginx. Do we gzip per request or ship pre-gzipped files? Just the short version.
- role: assistant
  content: |
    Pre-gzip at build time and serve with `gzip_static`. Keep compression on for real networks.

    In Green Metrics Tool micro-benchmarks (nginx, 2,000 requests for text assets, client and server CPU energy):
    - No compression: ~7.3 J, 253 MB transferred.
    - Precompressed files (`gzip_static`): ~14 J, 25 MB transferred.
    - gzip level 5 on every request: ~54 J, 29 MB transferred.

    Compression sent about 10× fewer bytes. Per-request gzip cost about 4× the CPU energy of precompressed files, for almost the same byte saving. Precompressed files still cost about 2× no compression, because the client has to decompress them.

    That benchmark ran on a local network, where transfer is almost free. It shows only the CPU side. On real networks the byte saving is what counts, so don't turn compression off.

    ```nginx
    gzip_static on;
    ```

    Your landing page files never change between deploys, so there is no reason to compress them again on each request. Per-request gzip only makes sense for dynamic responses, and there a cheap level is the better choice.
