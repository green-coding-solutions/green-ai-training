id: gen-1-00430-conceptual
category: conceptual
language: text
patterns:
- lazy-load-images
- context-tradeoff
messages:
- role: user
  content: |
    Product wants loading="lazy" on every img on the landing page. Analytics say ~70% of visitors scroll to the footer anyway. Is there still a point? No tutorial, just when it pays off and when it doesn't.
- role: assistant
  content: |-
    Yes, but the gain is smaller than the slogan suggests. It depends on the image.

    **Where it pays off**
    - Images that a good share of visitors never reach. Here, that means the visitors who leave before the footer. Their devices skip those downloads and decodes.
    - Images behind tabs, accordions or carousel slides that most people never open.
    - Pages with many images below the fold. Fewer parallel requests at load also help the first render.

    **Where it doesn't**
    - **The hero and any other above-the-fold image.** Lazy loading delays them and can hurt LCP. Give the hero `fetchpriority="high"` instead, without `loading="lazy"`.
    - **Images almost everyone scrolls to.** The same bytes are still transferred, just later. The timing changes, but nothing is saved.
    - **A few small images.** The saving is too small to matter.

    Most of your visitors reach the footer, so the saving is only the bytes of the images that the early leavers never see. That gain is limited. It costs nothing on the server, though, so it's still worth doing for below-the-fold images.

    ```html
    <img src="hero.avif" width="1200" height="600" fetchpriority="high" alt="...">
    <img src="feature-3.avif" width="600" height="400" loading="lazy" alt="...">
    ```

    Keep `width` and `height` on lazy images so the layout doesn't jump when they load.

    To check the real effect, open the DevTools Network tab. Compare the transferred bytes with no scrolling and with a full scroll, then weight them with your scroll-depth data. Don't expect a fixed percentage.

    Pattern: Defer offscreen images
