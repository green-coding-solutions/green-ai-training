id: gen-1-00430-conceptual
category: conceptual
language: text
patterns:
- lazy-load-images
- context-tradeoff
messages:
- role: user
  content: |
    Product wants loading="lazy" on every img on the landing page. Analytics say ~70% of visitors scroll to the footer anyway. Is there still a point? No tutorial, just when it pays off and when it doesn't.
- role: assistant
  content: |-
    Yes, but the gain is smaller than the slogan suggests, and it depends on the image.

    **Where it pays off**
    - Images that a good share of visitors never reach. Here those are the 30% who leave early. Their devices skip those downloads and decodes.
    - Images behind tabs, accordions or carousel slides that most people never open.
    - Pages with many images below the fold. Fewer parallel requests at load also helps the first render.

    **Where it doesn't**
    - **The hero and any other above-the-fold image.** Lazy loading delays them and can hurt LCP. Use `fetchpriority="high"` on the hero instead, with no `loading="lazy"`.
    - **Images almost everyone scrolls to.** The same bytes are transferred, only later. You get no saving there, just a different timing.
    - **A few small images.** The overhead of the mechanism isn't worth it.

    For a 70% scroll-through page, the saving is roughly the bytes of the images the other 30% never reach, and that is a bounded gain. It is still free on the server side, so it's worth doing for below-the-fold images.

    ```html
    <img src="hero.avif" width="1200" height="600" fetchpriority="high" alt="...">
    <img src="feature-3.avif" width="600" height="400" loading="lazy" alt="...">
    ```

    Keep `width` and `height` on lazy images, so the layout doesn't jump when they load.

    To check the real effect, compare transferred bytes in DevTools (Network tab, no scrolling vs. full scroll) and weight them with your scroll-depth data. Don't expect a fixed percentage.

    Pattern reference: https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
