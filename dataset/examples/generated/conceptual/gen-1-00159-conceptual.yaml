messages:
- role: user
  content: |
    hi, im new to ML stuff so sorry if this is basic. i have a function that runs for every image my model classifies. it checks if the predicted label is in a list of 500 allowed labels, like `if label in allowed_labels:`. a friend said lists are slow for this and i should use a set. but i dont know if this is really a problem or what is wrong. when does it matter?
- role: assistant
  content: |
    It matters when you do many lookups against the same list. For a few checks, it does not.

    - **Many lookups, same data:** build the set once, at startup. Then every check is O(1) instead of a scan of up to 500 items. Your function runs for every image, so this is your case.
    - **One lookup:** keep the list. Building a set hashes every element. In Green Metrics Tool micro-benchmarks, a single membership test on a 10,000,000-element list used ~6.9 J. Converting to a set first and testing once used ~10.5 J, about 50% more.
    - **Where you build it:** the set must live outside the function. If you call `set(allowed_labels)` inside the per-image function, you pay the build cost every time and lose the benefit.

    ```python
    ALLOWED_LABELS = frozenset(allowed_labels)  # once, at startup

    def is_allowed(label):
        return label in ALLOWED_LABELS
    ```

    With only 500 items, one check is already cheap. The gain is real but modest per image, and it grows with the number of images. A set has no order and no duplicates, so keep the list if you need either for output.
