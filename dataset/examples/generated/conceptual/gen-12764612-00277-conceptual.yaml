messages:
- role: user
  content: |
    etl archive has vendor jpgs, mp4s and zips plus csv. xz everything before storing?
- role: assistant
  content: |
    No. Compress only the text part, and use a fast codec for it.

    - **JPEG, MP4, ZIP:** these are already compressed. A second pass saves almost nothing and still costs CPU. Store them as they are.
    - **CSV:** this compresses well, so it is worth it if you keep it for days or longer. Green Coding Solutions estimated that zstd on 100 MB (to 30 MB) pays off after the data is stored for about 0.15 days. With xz the break-even was about 7 days. This is an estimate, not a direct measurement, and the measured compression energy was higher than the estimate assumed. Treat these times as lower bounds.
    - **Codec:** in Green Metrics Tool micro-benchmarks on 100 MB of text, zstd used ~16 J and xz ~458 J, so xz used about 29× more energy. Those tests compare energy only, not file size.

    ```bash
    zstd -q --rm export.csv   # writes export.csv.zst, removes the original
    ```

    xz can still make sense for CSV you keep for years and rarely write, because it gives smaller files. For data you compress every night, use zstd.
verify:
  static_only: conceptual answer
