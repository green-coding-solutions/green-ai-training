id: gen-1-00004-conceptual
category: conceptual
language: text
patterns:
- string-join
- context-tradeoff
facts:
- F-STRCAT
messages:
- role: user
  content: |
    join vs += for building response strings in a python api, always join?
- role: assistant
  content: |
    Use `join` when you build a string from many pieces in a loop. Don't bother when there are only a few pieces.

    **Why it matters:** `+=` in a loop can copy the growing string again and again, so the work grows much faster than the output. `"".join()` sizes the result once and copies each piece once. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used about 469 J with `+=` and about 1.8 J with `"".join()`, roughly 260× less CPU energy ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=732b88b3-e081-409d-a987-d1a929b357e4,527c0154-dbb1-4c82-b98f-838f994af603,2fca8771-9ad9-4ec0-b51f-2ee78ee20865)). An f-string concatenated in a loop behaved like `+=`. That figure is for a very large loop, so don't scale it to your handler.

    **In an API handler:**
    - **Many rows or lines per response** (CSV export, text report, log dump): collect the pieces and join once, or use a generator expression.

    ```python
    def render_lines(rows):
        return "\n".join(f"{r['id']},{r['total']}" for r in rows)
    ```

    - **A few fixed pieces** (a greeting, a header plus a name): use an f-string. Both forms cost about the same here, and the f-string is easier to read.
    - **JSON bodies:** use `json.dumps` or your framework's serializer. Don't assemble JSON by hand.
    - **Very large bodies:** a streaming response with a generator avoids holding the whole string in memory.

    The same idea holds in Java (`StringBuilder`) and Go (`strings.Builder`). It does not hold in JavaScript, because V8 handles `+=` with ropes, so there `+=` is fine.
verify:
  green_block: 0
  test: |-
    assert render_lines([{'id': 1, 'total': 2}, {'id': 3, 'total': 4}]) == "1,2\n3,4"
    assert render_lines([]) == ""
