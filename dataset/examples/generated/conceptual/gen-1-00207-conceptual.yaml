id: gen-1-00207-conceptual
category: conceptual
language: text
patterns:
- modern-image-formats
- context-tradeoff
facts:
- F-IMGRENDER
- F-IMGENC
messages:
- role: user
  content: |
    Inference gateway gets JPEGs from clients, queues them, GPU workers decode + resize + run the model. Plan: transcode every upload to AVIF at the gateway before queueing, to cut bandwidth. Worth it? Short answer, no essay.
- role: assistant
  content: |-
    Probably not. Encoding every upload is the expensive step, and your workers then decode a costlier format.

    - **Encode cost:** in Green Metrics Tool micro-benchmarks, encoding 50 BMP images to AVIF used about 7× the CPU energy of encoding to JPG. Doing that per upload, on the hot path, is the case to avoid. Encode once at build or upload time only when the output is served many times.
    - **Decode cost:** in the same benchmarks, AVIF cost about 19% more than JPG to decode, measured as browser page loads. Your workers decode every image, so that cost repeats per request. Treat the figure as a direction, not a prediction for your decoder.
    - **Bandwidth gain:** the saving from modern formats comes from fewer transferred bytes. That only counts if the link between gateway and workers is a real constraint. On a LAN or inside one cluster, it usually isn't.
    - **Correctness:** AVIF is lossy. Re-encoding an already-lossy JPEG adds artifacts and can shift model outputs. You would need to re-evaluate accuracy.

    Keep the original JPEG through the queue. If the link is slow, resize before queueing instead, as the model needs that size anyway. Check that the output matches what preprocessing produces today.
