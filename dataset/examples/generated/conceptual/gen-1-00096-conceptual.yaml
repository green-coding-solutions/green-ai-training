id: gen-1-00096-conceptual
category: conceptual
language: text
patterns:
- avoid-exception-flow
facts:
- F-EXC
messages:
- role: user
  content: |
    PR review disagreement. Our access-log enricher maps user agent -> bot name with a dict, and the author wrapped the lookup in try/except KeyError. About 90% of lines are normal browsers, so it misses on almost every line. I asked for .get(), he says exceptions are "free in 3.11+" and it's style only. Who's right? Just the verdict, no essay.
- role: assistant
  content: |-
    You are, for this data. The cost is in raising the exception, so it depends on how often the key is missing.

    - **Frequent misses (your case):** `dict.get(key, default)` or an `in` check is cheaper. In Green Metrics Tool micro-benchmarks, 10,000,000 lookups with about half the keys missing used about 12% less CPU energy with `get` than with `try/except KeyError`. An `in` check performed like `get`. With ~90% misses, the gap should be at least that direction.
    - **Rare misses:** `try/except` is cheap when nothing is raised, so there it is fine and style decides.

    Suggested change:

    ```python
    # before
    try:
        bot = BOT_AGENTS[agent]
    except KeyError:
        bot = None

    # after
    bot = BOT_AGENTS.get(agent)
    ```

    Behavior is the same, as long as `None` is not a valid value in the dict. This runs once per log line, so it is worth the one-line change. To check it on your own data, time the enricher on a sample file with `time` or `perf stat`.
