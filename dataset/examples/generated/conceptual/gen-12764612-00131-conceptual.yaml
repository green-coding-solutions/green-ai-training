messages:
- role: user
  content: |
    Short answer please. Our docs site CI is slow-ish and someone wants to add a "css-audit" job on every PR: run PurgeCSS, fail the PR if more than X% of the stylesheet is unused. Stylesheet is ~20 KB. Worth it from an energy point of view, or should we drop it?
- role: assistant
  content: |
    Drop the per-PR gate. Keep the purge as an optional step in the release build.

    - **Client energy:** for small stylesheets there is no measurable gain. In Green Metrics Tool micro-benchmarks (50 cold page loads), a 16 KB stylesheet with mostly unused rules and a purged 0.75 KB version differed by about 2% in client CPU energy. That is within noise.
    - **Bytes:** purging does save bytes on real networks. That is the actual benefit, and it is small at 20 KB.
    - **CI cost:** a job on every PR spends compute on every push, to guard a saving you can't measure on the client. A fail threshold also makes PRs flaky when a class is only used by JS-generated markup.

    If you want the smaller file, run PurgeCSS once in the production build. Safelist classes that are added at runtime. Look again if the stylesheet grows into hundreds of KB, for example a full framework with no tree-shaking.
