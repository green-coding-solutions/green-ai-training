messages:
- role: user
  content: |
    We serve a /v1/catalog endpoint, ~200 KB JSON, same payload for every client until the nightly import. Currently gzip -5 per request in the app. Is it worth building the response once per import and storing it compressed, or is per-request gzip fine?
- role: assistant
  content: |
    Build it once per import. The payload is identical for every client, so per-request compression repeats the same work.

    In Green Metrics Tool micro-benchmarks (nginx, 2,000 requests for text assets, client and server CPU):

    - gzip level 5 on every request used about 4× the CPU energy of serving precompressed files.
    - Both options sent about 10× fewer bytes than no compression. The benchmark ran on a local network, so it shows only the CPU side.
    - Precompressed files still cost about 2× no compression, because the client has to decompress them. On real networks the byte saving is what counts, so keep compression on.

    What to do:

    - Compress once after the nightly import and cache the bytes. Serve them with `Content-Encoding: gzip` and `Vary: Accept-Encoding`.
    - Keep an uncompressed copy for clients that don't send `Accept-Encoding: gzip`.
    - Because you compress only once per day, a slower, stronger codec is fine here. In the same benchmarks brotli at quality 11 cost far more than gzip, which is wasteful per request but acceptable for a one-time build.
    - If some responses are still built per request (per-user or filtered), use a fast codec like zstd or gzip at a low level. In Green Metrics Tool measurements on text, zstd at its default level used about 4× less energy than gzip -6.

    If the endpoint gets only a few requests a day, the difference is negligible. Keep what you have.
verify:
  static_only: conceptual answer
