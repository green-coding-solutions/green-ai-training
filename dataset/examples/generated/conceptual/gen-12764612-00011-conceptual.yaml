facts:
- F-PREVIEW-ENV
messages:
- role: user
  content: |
    We run an IoT gateway platform. Devices (MQTT) talk to a broker, an ingest service, Postgres and a small dashboard. For every firmware branch our CI spins up a full "device simulator" environment on the cluster: 3 ingest replicas, Postgres, Redis, a polling worker, and a fleet of 200 simulated devices.

    Requirements from my side: I want to cut the footprint of this setup. Our plan is to reduce every environment to 1 ingest replica plus Postgres and drop Redis and the worker, because idle services must burn a lot of energy. Is that the right lever? What should we do first, and what can we skip?
- role: assistant
  content: |
    Trimming services is the smaller lever. Start with how long the environments live.

    In Green Metrics Tool micro-benchmarks, a preview environment idling for 60 seconds with 3 app replicas, Postgres, Redis and a polling worker used ~269 J of CPU energy. With 1 app replica and Postgres it used ~262 J, about 3% less. Machine energy differed by less than 1%, because the idle baseline of the machine dominates. So idle extra services cost little per minute.

    What matters is the hours:

    - **Tear down on merge or branch delete.** An environment that does not exist uses nothing. This removes all its hours, not 3% of them.
    - **Scale to zero at night and on weekends.** Simulators nobody is looking at do not need to run.
    - **Share one environment where you can.** Run several firmware branches against one stack, with separate topics or device ID prefixes, instead of one stack per branch.
    - **Add a time-to-live.** A forgotten environment should expire by itself, for example after a day without a push.

    Trimming replicas and dropping Redis and the worker is still fine if the tests don't need them. Fewer services also reserve less memory and can fit on fewer nodes. Just don't expect the energy saving to come from there.

    One caveat for your case: the 200 simulated devices are active load, not idle load. The benchmark above measured idle services only. If the simulators publish constantly, consider fewer devices or a lower publish rate for branch checks, and run the full fleet only on release candidates. Measure it with a usage scenario in Green Metrics Tool, or at least compare node CPU with `perf stat` or your cluster metrics.
verify:
  static_only: conceptual answer
