messages:
- role: user
  content: |
    Internal log dashboard, ships full Bootstrap CSS, we use maybe a tenth of it. Someone wants PurgeCSS in the build to "cut energy". Worth it? Only tell me if there's a diff I should apply.
- role: assistant
  content: |
    No diff to apply for energy reasons.

    In Green Metrics Tool micro-benchmarks (50 cold page loads in a headful browser, local network), a 16 KB stylesheet with mostly unused rules used ~783 J. The same page with the CSS purged and minified to 0.75 KB used ~764 J. That is about 2% less, which is within measurement noise. Parsing a small unused stylesheet costs the client almost nothing.

    What purging does save is bytes on the wire. That matters on slow or metered links and for very large sheets. Neither case was measured, so I can't give you a figure for a full Bootstrap build. A dashboard on an office network gets little from it.

    If you still want it for load time or bandwidth, treat it as a Low item. Check that your dynamic class names, such as severity badges built from log levels, are safelisted. Otherwise the purge will silently strip styles you use at runtime.

    For a real answer, compare page-load CPU time with and without the purge in your own browser profile.
verify:
  static_only: conceptual answer
