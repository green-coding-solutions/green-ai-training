messages:
- role: user
  content: |
    hello, we build a landing page for our shop and the product teaser block load data from postgres. my colegue say "never use SELECT *, its always slow". Is this true? the table have many colums but I dont know if it really matter for a small page
- role: assistant
  content: |
    Not "always", but it can matter a lot. The cost depends on how much data the skipped columns carry.

    In Green Metrics Tool micro-benchmarks (Postgres 16, a 52-column products table with large text columns), reading rows 1,000 times with `SELECT *` used about 5.5× to 7× more CPU energy than naming the 10 needed columns. For a JOIN of orders and order items, with fewer and smaller columns, the gap was smaller: about 2.3× to 4×. The saving grows with the size of the columns you skip.

    For your teaser block, this is the rule:

    - **Wide table with big text columns** (descriptions, specs, HTML): name the columns. A teaser needs maybe a title, slug, price and image.
    - **Small table with a few small columns:** the difference is small. Clarity matters more.
    - **Low traffic page:** the total saving is small, even if the ratio is big.

    ```sql
    SELECT id, name, slug, price, image_url
    FROM products
    WHERE featured
    ORDER BY position
    LIMIT 6;
    ```

    A named column list also protects you later. If someone adds a big column to the table, your page does not start loading it.

    To check on your own system, compare the two queries with `EXPLAIN (ANALYZE, BUFFERS)` and look at the time and the row width. For energy, use a Green Metrics Tool usage scenario.
