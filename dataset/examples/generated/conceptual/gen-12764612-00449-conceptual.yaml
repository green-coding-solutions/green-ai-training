    ```python
    import numpy as np


    def load_series(conn, station_id, start, end):
        with conn.cursor() as cur:
            cur.execute(
                "SELECT * FROM buoy_readings "
                "WHERE station_id = %s AND observed_at >= %s AND observed_at < %s "
                "ORDER BY observed_at",
                (station_id, start, end),
            )
            rows = cur.fetchall()

        t = np.array([r[2] for r in rows], dtype="datetime64[s]")
        temp = np.array([r[5] for r in rows], dtype=float)
        sal = np.array([r[6] for r in rows], dtype=float)
        wave = np.array([r[9] for r in rows], dtype=float)
        return t, temp, sal, wave
    ```

