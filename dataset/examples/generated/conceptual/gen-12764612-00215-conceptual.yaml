id: gen-12764612-00215-conceptual
category: conceptual
language: text
patterns:
- bash-quoting
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    build script for our landing page has html snippets in bash strings, single or double quotes?
- role: assistant
  content: |-
    Use single quotes for any snippet that needs no expansion. Use double quotes only where a variable or command substitution must expand.

    ```bash
    nav='<a href="/pricing">Pricing</a> <a href="/docs">Docs</a>'
    hero="<h1>${PAGE_TITLE}</h1>"
    ```

    Why single quotes fit HTML well:
    - Bash takes single-quoted text as is. It does not scan it for `$`, backticks or backslashes.
    - HTML attributes usually use double quotes, so you don't need any escaping inside.

    Watch out for:
    - **Apostrophes in the text** ("Don't miss out") end the string early. Use double quotes for that snippet, or write `'\''`.
    - **Variables.** Never remove the double quotes around `"$var"` to be "faster". That breaks on spaces and globbing.

    On energy: in Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes at 100,000 iterations, and about 14% less at 10,000 iterations. For short strings in a script that runs once per build, the absolute saving is tiny. It grows with literal length and loop count. So take it as a free default, not a reason to rewrite working scripts.
