messages:
- role: user
  content: |
    landing page form calls 2 APIs on submit (CRM + newsletter). make it async?
- role: assistant
  content: |
    Only if the two calls are independent, and then mostly to cut waiting time. The energy gain is small.

    In Green Metrics Tool micro-benchmarks with Python, 10 HTTP requests used about 7% less CPU energy and about 17% less wall time with async `httpx` than with sync `urllib`. With only 2 calls, expect a gain mostly in response time, not in energy.

    In the browser, you can fire both requests at once:

    ```javascript
    const [crm, newsletter] = await Promise.all([
      fetch('/api/crm', { method: 'POST', body }),
      fetch('/api/newsletter', { method: 'POST', body }),
    ]);
    ```

    - **Worth it** if the visitor waits for both calls before seeing the thank-you message. The wait drops from the sum of the two calls to the slower one.
    - **Not worth it** if the second call needs the result of the first. Then they stay sequential.
    - **Watch the errors.** With `Promise.all`, one failure rejects the whole thing. Use `Promise.allSettled` if one call may fail without blocking the other.
    - A form that gets a few submits a day does not need extra complexity for this. The simple sequential version is fine.
