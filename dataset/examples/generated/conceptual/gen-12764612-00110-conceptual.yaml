id: gen-12764612-00110-conceptual
category: conceptual
language: text
patterns:
- keep-star-imports
facts:
- F-IMPORT
messages:
- role: user
  content: |
    I maintain a small library of analysis helpers for our lab's simulation group (numpy and scipy based, a few thousand lines). Most of our scripts begin with `from numpy import *` or `from scipy.optimize import *`, and a reviewer on my last PR said we should "remove star imports for efficiency" before the cluster allocation review.

    Requirements for the answer: I need to know if explicit imports (`import numpy as np`, or naming the functions) really reduce energy use or CPU time at startup or at runtime. I also want to know what actually does cost energy in the import area, so I can put the right item in the review. Please keep it short and tell me when it would matter and when not.
- role: assistant
  content: |
    No, not in a way you can measure. Star imports are a style issue, not an energy issue.

    In Green Metrics Tool micro-benchmarks with 1,000 Python process starts, `from sympy import *` used ~3103 J and `import sympy` used ~3093 J. With a built-in module, `from posix import *` and `import posix` both used ~121 J. The difference between the two import styles was within noise.

    The reason is that Python loads the whole module either way. The `import` statement does the work. Which names you bind afterwards is cheap. At runtime, `np.mean` and `mean` are both a lookup, so there is no meaningful difference in the loop either.

    What does cost energy is loading a heavy module at all. In the same benchmarks, a process that imported `sympy` used about 3.1 J and 0.54 s, about 25× a process that imported only a built-in module (~0.12 J).

    For your review:

    - **Don't count star-import removal as an energy saving.** It changes nothing you can measure.
    - **Do look at which heavy modules each script loads**, especially for short jobs that start many times, such as array jobs with one Python process per task. A heavy import that a script never uses is worth removing, because the whole module load goes away.
    - **Valid reasons to drop star imports remain**, such as name clashes (`from numpy import *` shadows built-ins like `sum`, `min`, `max` and `abs`) and readability. Argue for them on those grounds, not on energy.

    If you want the numbers for your own cluster, time a batch of process starts with `perf stat` or the Green Metrics Tool, once per import style.
verify:
  static_only: conceptual answer
