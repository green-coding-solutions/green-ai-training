    ```python
    import math
    import random


    def starfield_svg(count, width, height, seed=7):
        rng = random.Random(seed)
        parts = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} {height}">']
        for i in range(count):
            x = rng.random() * width
            y = rng.random() * height
            r = 0.4 + rng.random() * 1.2
            glow = 0.4 + 0.6 * abs(math.sin(i * 0.37))
            parts.append(
                f'<circle cx="{x:.1f}" cy="{y:.1f}" r="{r:.2f}" fill="#fff" opacity="{glow:.2f}"/>'
            )
        parts.append('</svg>')
        return ''.join(parts)


    if __name__ == '__main__':
        with open('dist/hero-stars.svg', 'w') as f:
            f.write(starfield_svg(4000, 1600, 900))
    ```

