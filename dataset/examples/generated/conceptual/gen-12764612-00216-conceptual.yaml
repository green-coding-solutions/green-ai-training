messages:
- role: user
  content: |
    hi, im new to pytorch. i made a small model that picks which hero banner to show on our landing page (based on the visitor country, device and so on). in the code i call model.eval() before predicting. someone told me eval() already turns off the gradient stuff so i dont need anything else. is this true? i am not sure what is the difference
- role: assistant
  content: |
    Not quite. They do two different things:

    - `model.eval()` switches layers like dropout and batch norm to their prediction behavior. It does not stop PyTorch from tracking gradients.
    - `torch.no_grad()` stops PyTorch from building the autograd graph. This is the part that saves work when you only predict.

    For prediction you want both:

    ```python
    import torch


    model.eval()


    def pick_banner(features):
        with torch.no_grad():
            scores = model(features)
        return int(scores.argmax())
    ```

    In Green Metrics Tool micro-benchmarks, 100,000 PyTorch CPU inferences used ~157 J without `torch.no_grad()` and ~135 J with it, about 14% less. The saving comes from not recording operations you will never use for backpropagation. It also frees memory sooner.

    It only matters when the model runs often, for example on every page view. For a model you call a few times a day, it makes no real difference, but it is still a good habit and costs one line.

    Do not use `no_grad()` during training. There you need the gradients.
