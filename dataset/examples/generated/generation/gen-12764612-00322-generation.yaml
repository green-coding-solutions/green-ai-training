messages:
- role: user
  content: |
    bash script: top 10 client IPs in nginx access.log with request count, for a daily cron mail
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -eu

    log=${1:-/var/log/nginx/access.log}
    top=${2:-10}

    if [[ ! -r $log ]]; then
        echo "cannot read $log" >&2
        exit 1
    fi

    printf '%-10s %s\n' 'requests' 'client_ip'
    awk '{ count[$1]++ } END { for (ip in count) printf "%-10d %s\n", count[ip], ip }' "$log" \
        | sort -k1,1nr -k2,2 \
        | head -n "$top"
    ```

    Run it from cron as `top-ips.sh /var/log/nginx/access.log 10 | mail -s 'Top IPs' you@example.com`.

    **Green Notes**
    - **One `awk` pass** (reduces E): counting happens inside a single process, so there is no `cut`, `grep` or `expr` per line. In Green Metrics Tool micro-benchmarks on a 20,000-line access log, one `awk` pass used over 1000× less energy than a `while read` loop that starts several processes per line. Process starts dominate shell scripts.
    - **Single quotes for plain literals** (reduces E): the header strings and the `awk` program use single quotes, so bash does not scan them for `$` or backticks. Double quotes are kept only where `$log`, `$top` or a message with a variable must expand, and variables stay quoted. In Green Metrics Tool micro-benchmarks, assigning a long literal in a loop used about 24% less CPU energy with single quotes. In a script that runs once a day with short strings, the saving is tiny. It is simply the better default.
