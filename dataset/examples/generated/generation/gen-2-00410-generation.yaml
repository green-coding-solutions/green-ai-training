id: gen-2-00410-generation
category: generation
language: python
patterns:
- avoid-exception-flow
facts:
- F-EXC
messages:
- role: user
  content: |
    hello, i need python function for calculate the total of a shopping cart in our webshop. cart is list of dicts, every line have sku, category, price_cents and qty. we have also dict with discount per category in percent, for example {"shoes": 10, "books": 5}. but only few categorys have a discount, most not. function is call every time customer change the cart, so many times. return total in cents please, no floats. thank you
- role: assistant
  content: |
    Here is a function with integer math only. Categories that are not in the discount dict are charged the full price.

    ```python
    from typing import Iterable, Mapping


    def cart_total_cents(lines: Iterable[Mapping], discounts: Mapping[str, int]) -> int:
        total = 0
        for line in lines:
            gross = line["price_cents"] * line["qty"]
            pct = discounts.get(line["category"], 0)
            # round half up, stays in integer cents
            total += (gross * (100 - pct) + 50) // 100
        return total
    ```

    Example: `shoes` at 1000 cents × 2 with 10% off gives 1800. Add `toys` at 500 cents with no discount and the total is 2300.

    **Green Notes**
    - **No exception for expected misses** (reduces E): most categories have no discount, so a missing key is the normal case here. `discounts.get(category, 0)` handles it without raising. In Green Metrics Tool micro-benchmarks with about half of the keys missing, `dict.get` used about 12% less CPU energy than `try/except KeyError`. The function runs on every cart change, so this adds up.
    - *Not applied:* `price_cents`, `qty` and `category` are read with `[]` on purpose. They must exist, so a `KeyError` there shows a real data bug and should not be hidden by a default.
verify:
  test: |-
    discounts = {"shoes": 10, "books": 5}
    lines = [
        {"sku": "A1", "category": "shoes", "price_cents": 1000, "qty": 2},
        {"sku": "B2", "category": "toys", "price_cents": 500, "qty": 1},
    ]
    assert cart_total_cents(lines, discounts) == 2300
    assert cart_total_cents([], discounts) == 0
    assert cart_total_cents(lines, {}) == 2500
    assert cart_total_cents([{"sku": "C", "category": "books", "price_cents": 999, "qty": 1}], discounts) == 949
