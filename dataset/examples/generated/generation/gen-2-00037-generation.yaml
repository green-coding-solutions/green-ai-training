id: gen-2-00037-generation
category: generation
language: python
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    py func: order status -> bootstrap badge class for our shop's order list. pending=warning, paid=info, shipped=primary, delivered=success, cancelled and refunded=danger, anything else=secondary
- role: assistant
  content: |
    ```python
    ORDER_STATUS_BADGE = {
        "pending": "warning",
        "paid": "info",
        "shipped": "primary",
        "delivered": "success",
        "cancelled": "danger",
        "refunded": "danger",
    }


    def status_badge_class(status: str) -> str:
        """Return the Bootstrap badge class for an order status."""
        return "badge bg-" + ORDER_STATUS_BADGE.get(status, "secondary")
    ```

    **Green Notes**
    - **Simple equality conditions** (reduces E): the function runs once for each row in the order list. Each call does one exact-match lookup on the status string. There are no range checks or chained `or`/`lower()` guards. In Green Metrics Tool micro-benchmarks with 10,000,000 classifications, simple equality branches used about 16% less CPU energy than complex range/modulo conditions.
    - **Mapping built once:** the dict is created when the module is imported, not on every call.

    *Not applied:* rewriting this as `match`/`case`. In the same benchmarks, `match` and `if/elif` with the same conditions differed by about 1%, which is noise. Pick whichever reads better to you.

    The lookup is case-sensitive. If statuses can arrive as `"Paid"`, normalize them once where you load the orders, not in this function.
verify:
  test: |-
    assert status_badge_class("pending") == "badge bg-warning"
    assert status_badge_class("paid") == "badge bg-info"
    assert status_badge_class("shipped") == "badge bg-primary"
    assert status_badge_class("delivered") == "badge bg-success"
    assert status_badge_class("cancelled") == "badge bg-danger"
    assert status_badge_class("refunded") == "badge bg-danger"
    assert status_badge_class("on_hold") == "badge bg-secondary"
    assert status_badge_class("") == "badge bg-secondary"
