id: gen-1-00195-generation
category: generation
language: yaml
patterns:
- minimize-environments
messages:
- role: user
  content: |
    Our team builds Fluent Bit parsers and a small Loki stack for log processing. Every dev spins up their own namespace to test pipeline changes (Fluent Bit + Loki + a log generator). People forget to delete them, and the cluster is full of old `logdev-*` namespaces.

    I want a Kubernetes CronJob that cleans these up. Requirements:
    - only touch namespaces with the label `purpose=log-pipeline-dev`
    - default lifetime 48 hours, but a namespace can override it with an annotation
    - a namespace with the label `reaper/keep=true` is never deleted
    - runs in its own namespace `platform-tools`, least-privilege RBAC
    - no overlapping runs

    Please give me the full manifest.
- role: assistant
  content: |
    One file with the service account, RBAC, the script and the CronJob. The reaper runs hourly and deletes only labeled namespaces that are past their lifetime.

    ```yaml
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: ns-reaper
      namespace: platform-tools
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: ns-reaper
    rules:
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "delete"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: ns-reaper
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: ns-reaper
    subjects:
      - kind: ServiceAccount
        name: ns-reaper
        namespace: platform-tools
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ns-reaper-script
      namespace: platform-tools
    data:
      reap.sh: |
        #!/bin/sh
        set -eu
        DEFAULT_TTL_HOURS="${DEFAULT_TTL_HOURS:-48}"

        expired=$(kubectl get namespaces \
          -l 'purpose=log-pipeline-dev,reaper/keep!=true' -o json |
          jq -r --argjson default "$DEFAULT_TTL_HOURS" '
            .items[]
            | select(
                (now - (.metadata.creationTimestamp | fromdateiso8601))
                > ((.metadata.annotations["reaper/ttl-hours"] // $default | tonumber) * 3600)
              )
            | .metadata.name')

        if [ -z "$expired" ]; then
          echo "nothing to delete"
          exit 0
        fi

        for ns in $expired; do
          echo "deleting expired namespace: $ns"
          kubectl delete namespace "$ns" --wait=false
        done
    ---
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: ns-reaper
      namespace: platform-tools
    spec:
      schedule: "17 * * * *"
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 600
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 300
          template:
            spec:
              serviceAccountName: ns-reaper
              restartPolicy: Never
              containers:
                - name: reaper
                  image: alpine/k8s:1.31.0
                  command: ["/bin/sh", "/scripts/reap.sh"]
                  env:
                    - name: DEFAULT_TTL_HOURS
                      value: "48"
                  resources:
                    requests: {cpu: 10m, memory: 32Mi}
                    limits: {cpu: 100m, memory: 128Mi}
                  volumeMounts:
                    - name: script
                      mountPath: /scripts
                      readOnly: true
              volumes:
                - name: script
                  configMap:
                    name: ns-reaper-script
    ```

    Dev namespaces opt in like this. The annotation is optional:

    ```yaml
    apiVersion: v1
    kind: Namespace
    metadata:
      name: logdev-anna-multiline-parser
      labels:
        purpose: log-pipeline-dev
      annotations:
        reaper/ttl-hours: "72"
    ```

    To keep a namespace, run `kubectl label ns <name> reaper/keep=true`.

    **Green Notes**
    - **Expire idle environments automatically** (reduces E and M): a forgotten Fluent Bit + Loki + generator stack keeps using CPU, memory and disk, and it keeps a node from being scaled down. A TTL removes that waste without relying on people to remember. The reaper itself is a tiny job that runs for seconds per hour.
      Pattern: Minimize deployed environments
    - **Minimize, not eliminate:** the 48h default and the per-namespace `reaper/ttl-hours` and `reaper/keep` overrides keep long-running tests possible.
    - **Caveat:** deleting a namespace also deletes its PVCs, so any Loki data in it is gone. That is fine for throwaway test data. For anything you need to keep, use `reaper/keep=true` or a longer TTL.
    - The RBAC cannot limit deletes to labeled namespaces, so the label filter lives only in the script. Keep that script under code review.
verify:
  static_only: Kubernetes manifest, needs a cluster
