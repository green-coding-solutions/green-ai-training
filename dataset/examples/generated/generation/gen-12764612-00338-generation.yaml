- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    out_dir=${1:-decks}
    mkdir -p -- "$out_dir"

    header='units metal
    atom_style atomic
    boundary p p p
    lattice fcc 3.615
    region box block 0 10 0 10 0 10
    create_box 1 box
    create_atoms 1 box
    mass 1 63.546
    pair_style eam
    pair_coeff * * Cu_u3.eam
    timestep 0.002'

    # temperature in tenths of a K, so the loop stays in integer arithmetic
    for ((t10 = 1000; t10 <= 6000; t10++)); do
        temp="$((t10 / 10)).$((t10 % 10))"
        {
            printf '%s\n' "$header"
            printf 'velocity all create %s 12345\n' "$temp"
            printf 'fix 1 all nvt temp %s %s 0.1\n' "$temp" "$temp"
            printf 'run 50000\n'
        } > "$out_dir/deck_$temp.in"
    done
    ```

    This writes 5001 decks, from `deck_100.0.in` to `deck_600.0.in`. Each file is written once, so the header is identical in all of them.

    **Green Notes**
    - **Single quotes for literals** (reduces E): the header and all `printf` formats need no expansion, so they use single quotes. Double quotes are only used where `$temp` or `$out_dir` must expand. In Green Metrics Tool micro-benchmarks, assigning a long literal in a loop used about 24% less CPU energy with single quotes. Your literals are short and the file writes dominate, so the saving here is small.
    - **Builtins only in the loop** (reduces E): `$(( ))` and `printf` run inside the shell. Calling `seq`, `bc` or `awk` per deck would start a process 5001 times, and process starts dominate shell scripts.
    - The variables stay in double quotes on purpose. Quoting them protects against spaces and globbing.
