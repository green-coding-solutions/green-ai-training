id: gen-2-00126-generation
category: generation
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    Our CLI `manual2web` converts a PDF manual into one WebP per page (`pages/page-001.webp` etc., rendered at convert time) and writes an `index.html` for the support portal. I need the Jinja2 template for that index.

    Vars: `title`, `pdf_name`, `pages` (list of dicts: `num`, `src`, `width`, `height`, `heading`, where heading can be None).
    - sticky header: title, a page-jump list, download link to the PDF
    - pages stacked below, full width up to ~900px
    - no JS
    - manuals are 40–200 pages. Analytics: most visitors read the first page or two, then grab the PDF.

    Just the template, skip the essay.
- role: assistant
  content: |
    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{ title }}</title>
      <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #eee; }
        header { position: sticky; top: 0; z-index: 1; display: flex; gap: 1rem; align-items: center;
                 padding: .5rem 1rem; background: #fff; border-bottom: 1px solid #ccc; }
        header h1 { flex: 1; margin: 0; font-size: 1rem; }
        nav { position: relative; }
        nav ol { position: absolute; right: 0; max-height: 60vh; overflow-y: auto; margin: .5rem 0 0;
                 padding: .5rem 1rem .5rem 2.5rem; background: #fff; border: 1px solid #ccc; }
        main { max-width: 900px; margin: 0 auto; padding: 1rem; }
        .page { margin: 0 0 1rem; background: #fff; scroll-margin-top: 4rem; }
        .page img { display: block; width: 100%; height: auto; }
      </style>
    </head>
    <body>
      <header>
        <h1>{{ title }}</h1>
        <nav>
          <details>
            <summary>Pages</summary>
            <ol>
              {%- for p in pages %}
              <li><a href="#p{{ p.num }}">{{ p.heading or "Page " ~ p.num }}</a></li>
              {%- endfor %}
            </ol>
          </details>
        </nav>
        <a href="{{ pdf_name }}" download>Download PDF</a>
      </header>
      <main>
        {%- for p in pages %}
        <figure class="page" id="p{{ p.num }}">
          <img src="{{ p.src }}" width="{{ p.width }}" height="{{ p.height }}"
               alt="{{ title }}, page {{ p.num }}"
               {%- if loop.first %} fetchpriority="high"{% else %} loading="lazy"{% endif %}>
        </figure>
        {%- endfor %}
      </main>
    </body>
    </html>
    ```

    **Green Notes**
    - **Defer offscreen images** (reduces E and network): page 1 loads eagerly. All other pages carry `loading="lazy"`, so a reader who stops after a page or two never fetches the rest of the manual. In Green Metrics Tool browser benchmarks, an article with 15 photos loaded without scrolling used about 12% less CPU energy with lazy images below the fold. When visitors scrolled to the end, there was no difference. Your analytics match the case where it saves.
    - **No lazy on page 1**: it is above the fold. Lazy loading would only delay it, so it gets `fetchpriority="high"` instead.
    - `width`/`height` reserve each page's box before the image loads. This keeps the jump links landing on the right page. It is a layout fix, not an energy one.

    `title` and `heading` come from PDF metadata, so render with `autoescape=True`.
verify:
  static_only: Jinja2 HTML template, needs a template engine and a browser
