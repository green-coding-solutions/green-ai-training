- role: assistant
  content: |
    ```python
    # ppe_monitor/postprocess.py
    from dataclasses import dataclass

    MIN_CONF = 0.4

    # One entry per class id in data.yaml (ppe-v3). Update it together with the export.
    KIND_BY_CLASS = {
        0: "ok",          # helmet
        1: "violation",   # no_helmet
        2: "ok",          # vest
        3: "violation",   # no_vest
        4: "ok",          # gloves
        5: "violation",   # no_gloves
        6: "ok",          # goggles
        7: "violation",   # no_goggles
        8: "person",
        9: "vehicle",     # forklift
        10: "vehicle",    # pallet_jack
    }


    @dataclass
    class Detection:
        class_id: int
        conf: float
        box: tuple[float, float, float, float]  # x1, y1, x2, y2 in px


    def classify(det: Detection) -> str:
        """Return 'violation' | 'ok' | 'person' | 'vehicle' | 'ignore'.

        Low-confidence detections and unknown class ids are ignored.
        """
        if det.conf < MIN_CONF:
            return "ignore"
        return KIND_BY_CLASS.get(det.class_id, "ignore")


    # called for every detection of every frame
    def frame_events(dets: list[Detection]) -> dict[str, int]:
        counts: dict[str, int] = {}
        for d in dets:
            kind = classify(d)
            if kind != "ignore":
                counts[kind] = counts.get(kind, 0) + 1
        return counts
    ```

    **Green Notes**
    - **Simple equality conditions instead of range/modulo guards** (reduces E): `classify` runs for every detection on every frame. A single lookup by class id avoids guards like `class_id < 8 and class_id % 2 == 1`. In Green Metrics Tool micro-benchmarks with 10,000,000 classifications, simple equality branches used about 16% less CPU energy than range/modulo conditions.
    - *Not applied:* `match`/`case`. In the same benchmark, `match` and `if/elif` with the same conditions differed by about 1%, which is noise.

    The table also doesn't rely on the "odd id means no_" rule. If a later export reorders the labels, a parity check would quietly call helmets violations. Here you only edit the table, and any id that isn't listed returns `"ignore"`.
verify:
  test: |-
    b = (0.0, 0.0, 10.0, 10.0)
    assert classify(Detection(1, 0.9, b)) == "violation"
    assert classify(Detection(0, 0.9, b)) == "ok"
    assert classify(Detection(7, 0.41, b)) == "violation"
    assert classify(Detection(6, 0.4, b)) == "ok"
    assert classify(Detection(8, 0.5, b)) == "person"
    assert classify(Detection(9, 0.5, b)) == "vehicle"
    assert classify(Detection(10, 0.5, b)) == "vehicle"
    assert classify(Detection(3, 0.39, b)) == "ignore"
    assert classify(Detection(42, 0.99, b)) == "ignore"
    dets = [
        Detection(1, 0.8, b), Detection(3, 0.7, b), Detection(0, 0.9, b),
        Detection(8, 0.95, b), Detection(9, 0.6, b), Detection(5, 0.2, b),
    ]
    assert frame_events(dets) == {"violation": 2, "ok": 1, "person": 1, "vehicle": 1}
    assert frame_events([]) == {}
