id: gen-2-00172-generation
category: generation
language: bash
patterns:
- bash-quoting
- bash-builtins
facts:
- F-BASH-QUOTES
- F-BASH-SUBPROC
messages:
- role: user
  content: |
    hi, i need a bash script for our iot gateway. we have devices.csv with columns device_id,type (around 3000 sensors). first line is header and the file is exported from excel so maybe it has windows line endings. the script must make the mosquitto acl file. on top a comment that the file is generated, then for every device a block like this:

    ```text
    # device th-0012 (temp)
    user th-0012
    topic write sensors/th-0012/#
    topic read cmd/th-0012
    ```

    lines in csv starting with # are comments, skip them. device id with strange chars must be skiped because they can break the topic. auditor want every device explicit in the file, so one block per device please. also mosquitto should never see a half writen file. usage: gen-acl.sh devices.csv /etc/mosquitto/acl
- role: assistant
  content: |
    The script writes to a temp file in the same directory and then renames it. That way mosquitto only ever sees the old file or the complete new one.

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    devices="${1:?usage: gen-acl.sh <devices.csv> <acl-file>}"
    acl="${2:?usage: gen-acl.sh <devices.csv> <acl-file>}"

    # same directory as the target, so mv is an atomic rename
    tmp="$(mktemp "$acl.XXXXXX")"
    trap 'rm -f -- "$tmp"' EXIT

    count=0
    {
        printf '%s\n' '# generated by gen-acl.sh from devices.csv, do not edit by hand' ''

        {
            read -r _header || true
            while IFS=, read -r id type || [[ -n $id ]]; do
                id="${id%$'\r'}"
                type="${type%$'\r'}"

                [[ -z $id || $id == '#'* ]] && continue
                if [[ ! $id =~ ^[A-Za-z0-9_-]+$ ]]; then
                    printf 'skipping invalid device id: %s\n' "$id" >&2
                    continue
                fi

                printf '# device %s (%s)\nuser %s\ntopic write sensors/%s/#\ntopic read cmd/%s\n\n' \
                    "$id" "${type:-unknown}" "$id" "$id" "$id"
                count=$(( count + 1 ))
            done
        } < "$devices"
    } > "$tmp"

    chmod 0644 "$tmp"   # mktemp creates 0600, mosquitto may run as another user
    mv -f -- "$tmp" "$acl"
    trap - EXIT
    printf 'wrote %d devices to %s\n' "$count" "$acl"
    ```

    The ID check only allows letters, digits, `-` and `_`. That keeps out `/`, `+` and `#`, so a bad ID cannot widen a topic. `count=$(( count + 1 ))` is used instead of `(( count++ ))`, because under `set -e` the second form exits the script when count is 0.

    **Green Notes**
    - **Single quotes for fixed text** (reduces E): the header and all `printf` format strings are single-quoted. Only text that has to expand, such as `"$id"`, `"$type"` and `"$acl"`, stays in double quotes. Bash does not scan single-quoted text for `$`, backticks or backslashes. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes. These strings are short, so the saving here is small. It costs nothing, though, and it grows with the device count.
    - **No subprocess per device** (reduces E): `read -r` splits the fields, parameter expansion strips the `\r`, and `[[ =~ ]]` checks the ID. The loop never starts `cut`, `tr`, `sed` or `grep`. In Green Metrics Tool micro-benchmarks on a 20,000-line log, a loop that used only builtins used about 300× less CPU energy than one that started `cut`/`expr` processes for every field.
verify:
  lang: bash
  setup: |
    d="$(mktemp -d)"
    printf 'device_id,type\r\nth-0012,temp\r\n# old-1,temp\r\nbad/id,hum\r\nhum-7,hum\r\n\r\nlast-1,co2' > "$d/devices.csv"
    set -- "$d/devices.csv" "$d/acl"
  test: |-
    grep -q '^# generated by gen-acl.sh' "$d/acl" || { echo 'header missing'; exit 1; }
    [ "$(grep -c '^user ' "$d/acl")" = 3 ] || { echo 'wrong device count'; exit 1; }
    grep -qx '# device th-0012 (temp)' "$d/acl" || { echo 'th-0012 block wrong'; exit 1; }
    grep -qx 'topic write sensors/hum-7/#' "$d/acl" || { echo 'hum-7 write topic wrong'; exit 1; }
    grep -qx 'topic read cmd/last-1' "$d/acl" || { echo 'last line without newline lost'; exit 1; }
    ! grep -q 'bad' "$d/acl" || { echo 'invalid id not skipped'; exit 1; }
    ! grep -q 'old-1' "$d/acl" || { echo 'comment line not skipped'; exit 1; }
    ! grep -q 'device_id' "$d/acl" || { echo 'csv header not skipped'; exit 1; }
    ! grep -q $'\r' "$d/acl" || { echo 'carriage returns left in output'; exit 1; }
    [ "$(ls "$d" | wc -l)" -eq 2 ] || { echo 'temp file left behind'; exit 1; }
