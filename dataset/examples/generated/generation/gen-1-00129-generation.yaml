id: gen-1-00129-generation
category: generation
language: javascript
patterns:
- compress-transmitted
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    hi, i'm new to node. i need a small script that uploads a file to our internal reports server (POST to something like https://reports.internal.example/upload). the files are CSV exports, usually 20-50 MB. my first try with fs.readFileSync + fetch works but it is really slow on the office wifi and sometimes node runs out of memory. i dont know what is wrong. can you write it properly? i run it like `node upload.js <url> <file>`
- role: assistant
  content: |
    Two things hurt you here: `readFileSync` loads the whole file into memory, and you send every byte of a text file uncompressed. CSV shrinks a lot with gzip. This version streams the file from disk through gzip into the request.

    ```javascript
    const fs = require('node:fs');
    const path = require('node:path');
    const http = require('node:http');
    const https = require('node:https');
    const zlib = require('node:zlib');
    const { pipeline } = require('node:stream/promises');

    // Formats that are already compressed. Gzip would only waste CPU.
    const ALREADY_COMPRESSED = new Set([
      '.gz', '.zip', '.zst', '.7z', '.jpg', '.jpeg', '.png', '.webp', '.mp4',
    ]);

    async function uploadFile(url, filePath) {
      const target = new URL(url);
      const client = target.protocol === 'https:' ? https : http;
      const compress = !ALREADY_COMPRESSED.has(path.extname(filePath).toLowerCase());

      const headers = {
        'Content-Type': 'application/octet-stream',
        'X-Filename': path.basename(filePath),
      };
      if (compress) {
        headers['Content-Encoding'] = 'gzip';
      } else {
        headers['Content-Length'] = (await fs.promises.stat(filePath)).size;
      }

      return new Promise((resolve, reject) => {
        const req = client.request(target, { method: 'POST', headers }, (res) => {
          let body = '';
          res.setEncoding('utf8');
          res.on('data', (chunk) => (body += chunk));
          res.on('end', () => resolve({ status: res.statusCode, body }));
        });
        req.on('error', reject);

        const source = fs.createReadStream(filePath);
        const steps = compress
          ? [source, zlib.createGzip({ level: 6 }), req]
          : [source, req];
        pipeline(...steps).catch(reject);
      });
    }

    if (require.main === module) {
      const [url, file] = process.argv.slice(2);
      if (!url || !file) {
        console.error('usage: node upload.js <url> <file>');
        process.exit(1);
      }
      uploadFile(url, file)
        .then(({ status }) => {
          console.log(`Server replied ${status}`);
          process.exit(status < 300 ? 0 : 1);
        })
        .catch((err) => {
          console.error(`Upload failed: ${err.message}`);
          process.exit(1);
        });
    }

    module.exports = { uploadFile };
    ```

    Your server must accept `Content-Encoding: gzip` on request bodies. Many frameworks do not do this by default. If it does not, ask whoever runs it to turn it on. Otherwise the server will see garbage.

    **Green Notes**
    - **Compress transmitted data** (reduces network and E): CSV is repetitive text, so gzip cuts the bytes on the wire a lot. That also fixes the slow wifi. https://patterns.greensoftware.foundation/development/data-handling/compress-transmitted-data
    - **Fast codec, moderate level** (reduces E): in Green Metrics Tool micro-benchmarks, compressing 100 MB of English text with default settings used about 67 J with gzip, but about 3019 J with brotli at its default quality 11 ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,8e93a8d2-60b0-4831-905b-764b68257bc7)). Node's `createBrotliCompress` also defaults to quality 11. For an upload you compress every time, gzip level 6 is the better choice. The figures compare energy only, not file size.
    - **Streaming instead of `readFileSync`** (reduces memory): only small chunks are held in memory, so a 50 MB file no longer risks running out of memory.
    - **Skip already-compressed files** (reduces E): zip, jpg, mp4 and similar gain nothing from gzip, so they are sent as they are.
verify:
  test: |-
    const assert = require('node:assert');
    const os = require('node:os');

    (async () => {
      const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'up-'));
      const csv = path.join(dir, 'data.csv');
      const text =
        'id,name,value\n' +
        Array.from({ length: 5000 }, (_, i) => `${i},sensor-${i % 10},${i * 3}`).join('\n');
      fs.writeFileSync(csv, text);
      const zip = path.join(dir, 'data.zip');
      const zipBytes = Buffer.from([1, 2, 3, 4, 5]);
      fs.writeFileSync(zip, zipBytes);

      const seen = [];
      const server = http.createServer((req, res) => {
        const chunks = [];
        req.on('data', (c) => chunks.push(c));
        req.on('end', () => {
          seen.push({ enc: req.headers['content-encoding'], raw: Buffer.concat(chunks) });
          res.end('ok');
        });
      });
      await new Promise((r) => server.listen(0, '127.0.0.1', r));
      const url = `http://127.0.0.1:${server.address().port}/upload`;

      const r1 = await uploadFile(url, csv);
      assert.strictEqual(r1.status, 200);
      assert.strictEqual(r1.body, 'ok');
      assert.strictEqual(seen[0].enc, 'gzip');
      assert.ok(seen[0].raw.length < Buffer.byteLength(text) / 2);
      assert.strictEqual(zlib.gunzipSync(seen[0].raw).toString(), text);

      const r2 = await uploadFile(url, zip);
      assert.strictEqual(r2.status, 200);
      assert.strictEqual(seen[1].enc, undefined);
      assert.ok(seen[1].raw.equals(zipBytes));

      server.closeAllConnections();
      server.close();
      console.log('ok');
    })().catch((e) => {
      console.error(e);
      process.exit(1);
    });
