id: gen-1-00273-generation
category: generation
language: bash
patterns:
- bash-builtins
messages:
- role: user
  content: |
    hello, i need small bash script for our nginx acces log (default combined format, around 1 million lines per day). I want to see how many requests we got with status 2xx, 3xx, 4xx and 5xx, and the sum of bytes we send. Script get the log file as first argument. we use it in daily cron. thanks!
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    log=${1:?usage: $0 access.log}

    awk '
    $9 !~ /^[1-5][0-9][0-9]$/ { next }   # skip broken lines
    {
        count[substr($9, 1, 1) "xx"]++
        if ($10 ~ /^[0-9]+$/) bytes += $10   # "-" means no body
        total++
    }
    END {
        for (c = 1; c <= 5; c++) {
            k = c "xx"
            printf "%s %d\n", k, count[k]
        }
        printf "total %d\n", total
        printf "bytes %.0f\n", bytes
    }
    ' "$log"
    ```

    Example output:

    ```text
    1xx 0
    2xx 912345
    3xx 20311
    4xx 7120
    5xx 54
    total 939830
    bytes 48211093522
    ```

    **Green Notes**
    - **One `awk` process for the whole file** (reduces E): the log is read once and all counters are updated in memory. A `while read` loop that calls `cut`, `grep` or `echo | awk` for each line would start several new processes per line, so about 1 million lines would mean millions of forks.
    - **No temporary files and no second pass:** counts and byte sum are collected together, so the file is not read again for each status class.
    - The awk program is in single quotes, so the shell does not scan it for expansions and `$9` reaches awk unchanged.

    The script expects the default `combined` format, where the status is field 9 and the bytes are field 10. If you changed `log_format`, adjust these numbers. For `.gz` logs, use `gzip -dc access.log.gz | awk '...'` instead of unpacking to disk first.
verify:
  static_only: bash script reads an external log file; not executed by the harness
