id: gen-1-00219-generation
category: generation
language: html
patterns:
- modern-image-formats
facts:
- F-IMGRENDER
- F-IMGENC
messages:
- role: user
  content: |
    I need a results page for our deep-sky survey at the university observatory. It's one static HTML file that goes on the department server.

    Requirements:
    - Hero image on top: the stacked mosaic of the Orion Nebula. The files are `orion-1600.jpg` (1600x1000) and `orion-800.jpg` (800x500).
    - Below it a "Single exposures" gallery with 3 photos of 4:3, `exp-a-640.jpg`, `exp-b-640.jpg`, `exp-c-640.jpg` (640x480). Each has a caption with the exposure time (120 s, 180 s, 300 s).
    - Every image needs alt text, and the layout must not jump while images load.
    - Our grad students check the page on old phones and also on the lab desktops, so it has to work in all browsers.
    - Plain CSS in a `<style>` tag, no frameworks.

    Our upload script already makes `.avif` and `.webp` versions next to every jpg (same name, same size).
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Deep-Sky Survey Results: Orion Nebula</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 60rem; padding: 1rem; line-height: 1.5; }
        img { display: block; max-width: 100%; height: auto; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; padding: 0; margin: 0; }
        figure { margin: 0; }
        figcaption { font-size: 0.9rem; color: #444; }
      </style>
    </head>
    <body>
      <h1>Orion Nebula: stacked mosaic</h1>

      <figure>
        <picture>
          <source type="image/avif"
                  srcset="orion-800.avif 800w, orion-1600.avif 1600w"
                  sizes="(min-width: 60rem) 58rem, 100vw">
          <source type="image/webp"
                  srcset="orion-800.webp 800w, orion-1600.webp 1600w"
                  sizes="(min-width: 60rem) 58rem, 100vw">
          <img src="orion-1600.jpg"
               srcset="orion-800.jpg 800w, orion-1600.jpg 1600w"
               sizes="(min-width: 60rem) 58rem, 100vw"
               width="1600" height="1000"
               fetchpriority="high"
               alt="Stacked mosaic of the Orion Nebula showing bright gas clouds around the Trapezium cluster">
        </picture>
        <figcaption>Stacked mosaic, all exposures combined.</figcaption>
      </figure>

      <h2>Single exposures</h2>
      <ul class="gallery" style="list-style: none">
        <li>
          <figure>
            <picture>
              <source type="image/avif" srcset="exp-a-640.avif">
              <source type="image/webp" srcset="exp-a-640.webp">
              <img src="exp-a-640.jpg" width="640" height="480"
                   alt="Single exposure of the Orion Nebula core, short exposure with sharp stars">
            </picture>
            <figcaption>Exposure A: 120 s</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <picture>
              <source type="image/avif" srcset="exp-b-640.avif">
              <source type="image/webp" srcset="exp-b-640.webp">
              <img src="exp-b-640.jpg" width="640" height="480"
                   alt="Single exposure of the Orion Nebula with more visible outer gas">
            </picture>
            <figcaption>Exposure B: 180 s</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <picture>
              <source type="image/avif" srcset="exp-c-640.avif">
              <source type="image/webp" srcset="exp-c-640.webp">
              <img src="exp-c-640.jpg" width="640" height="480"
                   alt="Long single exposure of the Orion Nebula with bright, saturated core">
            </picture>
            <figcaption>Exposure C: 300 s</figcaption>
          </figure>
        </li>
      </ul>
    </body>
    </html>
    ```

    The `<picture>` element lets each browser pick the first format it supports. Old phones fall back to the JPG. The `width` and `height` attributes reserve space, so nothing jumps while images load.

    **Green Notes**
    - **AVIF and WebP with JPG fallback** (reduces network): photos are the bulk of this page's bytes, and the modern formats send fewer bytes for the same picture. The `srcset` also gives small screens the 800 px mosaic instead of the 1600 px one.
    - **Encode once, at upload** (reduces E): in Green Metrics Tool micro-benchmarks, encoding AVIF cost about 7× the energy of encoding JPG. Your upload script does this once per image, which is the right place. Never encode on request.
    - **Decode cost is the trade-off** (reduces E on the client): in the same benchmarks, decoding AVIF cost about 19% more client energy than JPG. The gain here is from fewer transferred bytes, so it pays off most on slow or mobile links.
    - **Hero is not lazy-loaded**: it is above the fold, so it has `fetchpriority="high"` and no `loading="lazy"`.
verify:
  static_only: HTML page, no executable code
