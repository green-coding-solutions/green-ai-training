    **Green Notes**
    - **Modern formats with fallback** (reduces network): each image is a `<picture>` with AVIF first, then WebP, then JPEG. Browsers take the first format they support, and old ones still get the JPEG. The overlays use PNG only as the last fallback, because AVIF and WebP also support alpha and are usually much smaller than PNG.
      https://patterns.greensoftware.foundation/development/media-and-code-efficiency/serve-images-in-modern-formats
    - **Encode at build time only:** in Green Metrics Tool micro-benchmarks, encoding 50 BMP images to AVIF used about 7× the CPU energy of JPEG ([measurements](https://metrics.green-coding.io/stats.html?id=81a932bc-04da-443b-93cf-d4d8468de247)). Keep your build step as the only place that encodes. Do the same for images users upload to the demo later, once at upload time and never per request.
    - **Lazy-load the grid** (reduces network): the 12 cards are below the fold, so they use `loading="lazy"`. The hero has no `loading="lazy"` and gets `fetchpriority="high"`, because it is the first thing visitors see. Width and height attributes reserve the space, so nothing jumps while images load.
      https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
    - **Right-sized files:** `srcset` and `sizes` let a phone take the 400 px file instead of the 1600 px one.
    - *Not applied:* no JavaScript image loader. The browser features above do the job.
