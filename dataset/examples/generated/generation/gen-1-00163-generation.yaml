messages:
- role: user
  content: |
    I'm building a static demo page for our defect-detection model (it classifies photos of machined parts as OK / scratch / dent). Visitors see a hero photo and then a grid of sample inputs. Each sample shows the part photo and, on top of it, the model's saliency heatmap as a semi-transparent overlay, so the overlay needs alpha. Requirements:

    - Hero image on top, full width, max 1200px
    - Grid of sample cards, 3 columns on desktop, 1 on phones, 12 samples in total (3 are enough in the snippet, I will copy the card)
    - Each card: photo, heatmap overlay, the predicted label and confidence as text
    - Our build step already produces `-400`, `-800` and `-1600` widths of every image in `.avif`, `.webp` and `.jpg`. Heatmaps exist as `.avif`, `.webp` and `.png` in 400 and 800.
    - Photos are 4:3

    Just give me the HTML and CSS in one file.
