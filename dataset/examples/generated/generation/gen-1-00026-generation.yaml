id: gen-1-00026-generation
category: generation
language: dockerfile
patterns:
- small-container-images
messages:
- role: user
  content: |
    dockerfile for my mqtt bridge. python 3.12, paho-mqtt + pyserial, bridge.py reads /dev/ttyUSB0 and publishes. runs on a raspberry pi 4
- role: assistant
  content: |
    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONUNBUFFERED=1 \
        PYTHONDONTWRITEBYTECODE=1

    WORKDIR /app

    # Dependencies first, so this layer is reused when only bridge.py changes
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY bridge.py .

    # dialout group gives access to the serial device
    RUN useradd --system --no-create-home --groups dialout bridge
    USER bridge

    CMD ["python", "bridge.py"]
    ```

    ```text
    # .dockerignore
    .git
    __pycache__/
    *.pyc
    .venv/
    *.log
    ```

    Run it with `docker run --device /dev/ttyUSB0 ...`. On some hosts you also need `--group-add dialout`.

    **Green Notes**
    - **`python:3.12-slim` base** (reduces M and network): the image is much smaller than the full `python` image. The Pi pulls fewer bytes on each update and uses less SD card space. Both packages are pure Python, so no compiler or build stage is needed.
    - **Requirements copied before code** (reduces E): rebuilds and redeploys reuse the cached dependency layer. Only the small `bridge.py` layer changes.
    - **`--no-cache-dir` and `.dockerignore`**: pip's download cache and your repo junk stay out of the image.

    *Not applied:* multi-stage build and Alpine. There is nothing to compile, and Alpine's musl libc can cause trouble with wheels on ARM. If you later add a package that builds native code, move the build into a builder stage and copy only the installed packages into the final image.
verify:
  static_only: Dockerfile build needs Docker daemon and a serial device
