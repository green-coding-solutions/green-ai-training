  test: |-
    parse_runner_label.cache_clear()
    assert parse_runner_label("ubuntu-22.04-4core") == Runner("ubuntu", "22.04", 4)
    assert parse_runner_label("windows-2022") == Runner("windows", "2022", 2)
    assert parse_runner_label("macos-14-12core").cores == 12
    assert parse_runner_label(" Ubuntu-22.04-4core ") == Runner("ubuntu", "22.04", 4)
    assert parse_runner_label("windows-2022") == Runner("windows", "2022", 2)
    info = parse_runner_label.cache_info()
    assert info.hits >= 1, info
    try:
        parse_runner_label("solaris-11")
