    I kept Inter as the first font in the stack, so it is used when it is installed on the visitor's machine. Other visitors get their system UI font. Nothing is downloaded, and the page is one self-contained file.

    **Green Notes**
    - **System font stack instead of a web font** (reduces E, network): I did not add `@font-face` or a font download for Inter. In Green Metrics Tool micro-benchmarks over 30 cold page loads, the system font stack used about 26% less client energy than a set of large TTF files and about 16% less than two small WOFF2 subsets. It also avoids the extra requests and the flash of unstyled text.
    - *Not applied:* self-hosted Inter WOFF2. If the brand needs Inter on every device, ship one or two Latin-subset WOFF2 files, not full TTF sets.
