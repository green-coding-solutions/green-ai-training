messages:
- role: user
  content: |
    landing/build.py: add render_pricing(plans) -> html for the pricing section. plans = list of dicts with name, price, features (list of str). escape the text. file starts with:

    ```python
    from html import *
    ```
- role: assistant
  content: |
    ```python
    from html import *


    def render_pricing(plans):
        cards = []
        for plan in plans:
            features = "".join(f"<li>{escape(f)}</li>" for f in plan["features"])
            cards.append(
                '<article class="plan">'
                f'<h3>{escape(plan["name"])}</h3>'
                f'<p class="price">{escape(str(plan["price"]))}</p>'
                f"<ul>{features}</ul>"
                "</article>"
            )
        return '<section id="pricing">' + "".join(cards) + "</section>"
    ```

    `escape` comes from your existing `from html import *`, so I left the import line as it is.

    **Green Notes**
    - **Join instead of `+=`** (reduces E): the cards and list items are collected and joined once, not appended to a string in a loop. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J with `+=` and ~1.8 J with `"".join()`. For a handful of plans the absolute saving is tiny, but it costs nothing in readability.
    - **Star import kept** (no change): switching `from html import *` to `import html` makes no measurable difference. In Green Metrics Tool micro-benchmarks of 1,000 Python process starts, `from sympy import *` used ~3103 J and `import sympy` ~3093 J. What costs energy is loading a heavy module at all, and `html` is a light stdlib module.
verify:
  test: |-
    out = render_pricing([{"name": "Pro <b>", "price": "$9", "features": ["A & B", "C"]}])
    assert out.startswith('<section id="pricing">') and out.endswith("</section>")
    assert "Pro &lt;b&gt;" in out
    assert "<li>A &amp; B</li><li>C</li>" in out
    assert '<p class="price">$9</p>' in out
    assert render_pricing([]) == '<section id="pricing"></section>'
