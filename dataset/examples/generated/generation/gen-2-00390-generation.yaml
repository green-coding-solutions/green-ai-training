messages:
- role: user
  content: |
    hi, we sell on a big marketplace beside our own shop. every 10 minute a cron script read the changed stock from our ERP (i already have `get_changed_stock()` it give dict sku -> quantity, normaly 300 to 1500 skus). now i need to send this to the marketplace. they have only one endpoint per product: `PUT https://api.marketplace.example/v2/inventory/{sku}` with json `{"quantity": 12}` and bearer token. they allow max 10 request in same time, more give 429. sometimes they give 503 also.

    can you write me the function `sync_stock(stock, token)`? it should return the skus what failed so next run can try again. script is normal python, no async in it yet. we can use httpx.
- role: assistant
  content: |
    ```python
    import asyncio
    import logging
    from dataclasses import dataclass
    from urllib.parse import quote

    import httpx

    log = logging.getLogger(__name__)

    API_BASE = "https://api.marketplace.example/v2"
    MAX_CONCURRENT = 10  # marketplace limit, more gives 429
    RETRIES = 3


    @dataclass
    class PushResult:
        sku: str
        ok: bool
        status: int | None = None
        error: str | None = None


    async def _push_one(client: httpx.AsyncClient, sem: asyncio.Semaphore, sku: str, qty: int) -> PushResult:
        status, error = None, None
        async with sem:
            for attempt in range(RETRIES):
                try:
                    resp = await client.put(f"/inventory/{quote(sku, safe='')}", json={"quantity": qty})
                except httpx.TransportError as exc:
                    status, error = None, repr(exc)
                else:
                    if resp.status_code != 429 and resp.status_code < 500:
                        ok = resp.is_success
                        return PushResult(sku, ok, resp.status_code, None if ok else resp.text[:200])
                    status, error = resp.status_code, resp.text[:200]
                if attempt < RETRIES - 1:
                    await asyncio.sleep(2 ** attempt)  # 1 s, 2 s
        return PushResult(sku, False, status, error)


    async def push_stock(stock: dict[str, int], token: str) -> list[PushResult]:
        sem = asyncio.Semaphore(MAX_CONCURRENT)
        async with httpx.AsyncClient(
            base_url=API_BASE,
            headers={"Authorization": f"Bearer {token}"},
            timeout=httpx.Timeout(10.0),
            limits=httpx.Limits(max_connections=MAX_CONCURRENT),
        ) as client:
            return await asyncio.gather(
                *(_push_one(client, sem, sku, qty) for sku, qty in stock.items())
            )


    def sync_stock(stock: dict[str, int], token: str) -> list[str]:
        """Push changed stock levels. Returns the SKUs that failed, so the next run can retry them."""
        if not stock:
            return []
        results = asyncio.run(push_stock(stock, token))
        failed = [r for r in results if not r.ok]
        for r in failed:
            log.warning("stock push failed sku=%s status=%s error=%s", r.sku, r.status, r.error)
        log.info("stock sync: %d ok, %d failed", len(results) - len(failed), len(failed))
        return [r.sku for r in failed]
    ```

    You call it from your normal script: `failed = sync_stock(get_changed_stock(), token)`. `asyncio.run` keeps all the async code inside `sync_stock`. A 429, a 5xx or a network error is retried up to 3 times. Other 4xx errors (for example an unknown SKU) are not retried and come back in the failed list.

    **Green Notes**
    - **Async network calls with a concurrency limit** (reduces E, mostly through wall time): up to 10 PUTs wait on the network at the same time, and the semaphore keeps you under the marketplace limit. For 1500 SKUs that is about 150 rounds of waiting instead of 1500 one after another, so the cron job finishes well inside its 10-minute window and holds the worker for less time. In Green Metrics Tool micro-benchmarks with 10 HTTP requests, async `httpx` used about 7% less CPU energy and about 17% less wall time than sync `urllib`. The main gain is wall time, not CPU energy.
