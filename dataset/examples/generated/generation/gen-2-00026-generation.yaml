id: gen-2-00026-generation
category: generation
language: html
patterns:
- modern-image-formats
facts:
- F-IMGENC
- F-IMGRENDER
messages:
- role: user
  content: |
    Hi, I just joined the platform team and got my first task. I need to make a page for our internal wiki that documents the new on-prem build farm (the machines that run our GitLab CI jobs). It should have a short intro, then one section per rack with a photo and a small table (rack name, runner tags, number of nodes).

    I took the photos with my phone. They are JPGs, about 4000x3000 and 4-6 MB each, and there are 6 racks. The wiki is just static HTML that a CI job copies to our nginx server.

    My lead looked at my first draft and said "the photos are way too heavy, use modern formats". I don't really understand what's wrong, because they look fine on my laptop. A colleague said I could add a small script on the server that converts each photo to AVIF when someone opens the page. Is that the right way to do it?

    Can you write the HTML for me? One rack is enough, I'll copy it for the others.
- role: assistant
  content: |
    The photos look fine on your laptop because the office network is fast. But every visitor still downloads the full camera files, which are much bigger than any screen needs. The fix is to resize and convert each photo once, in the CI job that publishes the wiki. Don't convert on the server each time someone opens the page.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>On-prem build farm</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 0 auto; padding: 1rem; }
        .rack { margin-bottom: 2rem; }
        .rack img { width: 100%; height: auto; border-radius: 4px; }
        table { border-collapse: collapse; margin-top: 0.5rem; }
        th, td { border: 1px solid #ccc; padding: 0.25rem 0.5rem; text-align: left; }
      </style>
    </head>
    <body>
      <h1>On-prem build farm</h1>
      <p>These racks run our self-hosted GitLab CI runners. Each section shows the rack,
         the runner tags it serves and how many nodes it has.</p>

      <section class="rack" id="rack-a">
        <h2>Rack A</h2>
        <picture>
          <source type="image/avif"
                  srcset="img/rack-a-800.avif 800w, img/rack-a-1600.avif 1600w"
                  sizes="(max-width: 60rem) 100vw, 60rem">
          <source type="image/webp"
                  srcset="img/rack-a-800.webp 800w, img/rack-a-1600.webp 1600w"
                  sizes="(max-width: 60rem) 100vw, 60rem">
          <img src="img/rack-a-1600.jpg"
               srcset="img/rack-a-800.jpg 800w, img/rack-a-1600.jpg 1600w"
               sizes="(max-width: 60rem) 100vw, 60rem"
               width="1600" height="1200"
               alt="Rack A, front view: runner nodes mounted above the top-of-rack switch">
        </picture>
        <table>
          <tr><th>Rack</th><td>Rack A</td></tr>
          <tr><th>Runner tags</th><td><code>docker</code>, <code>linux-x64</code></td></tr>
          <tr><th>Nodes</th><td>12</td></tr>
        </table>
      </section>

      <!-- copy the section above for racks B-F -->
    </body>
    </html>
    ```

    **Green Notes**
    - **Serve images in modern formats** (reduces network): the browser takes AVIF if it can, then WebP, then JPEG. With `srcset` it also gets a resized version that fits the screen, not the full camera file. The smaller download is the real saving here.
    - **Encode once in CI, not per visit** (reduces E): add the resize and conversion to the CI job that copies the wiki to nginx, and only redo it when a photo changes. Tools like `avifenc`, `cwebp` or ImageMagick can do this. In Green Metrics Tool benchmarks, encoding images as AVIF used about 7× the CPU energy of JPEG. Your colleague's script would pay that cost again on every page view.
    - **Decoding AVIF costs a bit more** (trade-off): in the same benchmarks, browsers used about 19% more CPU energy to decode AVIF than JPEG. The smaller files make up for it. Keep the JPEG fallback for older browsers.

    `width` and `height` on the `<img>` stop the layout from jumping while the photo loads.
verify:
  static_only: static HTML page, needs a browser and image files to render
