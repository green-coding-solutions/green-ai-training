id: gen-2-00102-generation
category: generation
language: html
patterns:
- remove-unused-css
- system-fonts-and-deps
facts:
- F-UNUSED-CSS
- F-FONTS
messages:
- role: user
  content: |
    static html status page for our kafka -> warehouse ingest jobs. table: job, last success, lag, rows/h, status. a python script fills it every 5 min, use bootstrap or whatever
- role: assistant
  content: |
    This uses a small inline stylesheet instead of Bootstrap. It is written as a Jinja2 template, so change the loop syntax if your script uses something else.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Ingest jobs</title>
      <style>
        body { margin: 2rem; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #222; }
        h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
        .meta { color: #666; margin: 0 0 1rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: .4rem .6rem; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f5f5f5; }
        td.num { text-align: right; font-variant-numeric: tabular-nums; }
        .ok { color: #1a7f37; font-weight: 600; }
        .late { color: #9a6700; font-weight: 600; }
        .failed { color: #cf222e; font-weight: 600; }
      </style>
    </head>
    <body>
      <h1>Kafka &rarr; warehouse ingest</h1>
      <p class="meta">Generated {{ generated_at }}</p>
      <table>
        <thead>
          <tr><th>Job</th><th>Last success</th><th>Lag</th><th>Rows/h</th><th>Status</th></tr>
        </thead>
        <tbody>
          {% for job in jobs %}
          <tr>
            <td>{{ job.name }}</td>
            <td>{{ job.last_success }}</td>
            <td class="num">{{ job.lag }}</td>
            <td class="num">{{ job.rows_per_hour }}</td>
            <td class="{{ job.status | lower }}">{{ job.status }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </body>
    </html>
    ```

    `job.status` should be `OK`, `LATE` or `FAILED`, so it matches the three CSS classes. Render the template with `autoescape=True` so job names cannot break the markup.

    **Green Notes**
    - **Only the CSS the page uses** (reduces network): Bootstrap ships styles for many components this page never uses, and it adds an extra request. The saving is fewer bytes, not client CPU. In Green Metrics Tool page-load measurements, purging a 16 KB stylesheet down to 0.75 KB changed client CPU energy by about 2%, which is within noise.
    - **System font stack** (reduces E, network): the page downloads no font files. In Green Metrics Tool cold page loads, the system font stack used about 26% less CPU energy than a set of TTF web fonts, and about 16% less than two WOFF2 subsets.
verify:
  static_only: HTML template with Jinja2 placeholders, rendered by the user's script
