id: gen-1-00073-generation
category: generation
language: java
patterns:
- avoid-exception-flow
messages:
- role: user
  content: |
    hi, im still learning java. i make a small servlet for a landing page. the link has ?cid=123 for the ad campaign, but many visitors come without it, and some have strange things like cid=abc or cid=. i want to read it as a number. can you write the method? i think i need try catch but not sure
- role: assistant
  content: |
    You don't need `try/catch` here. A missing or bad `cid` is normal on a landing page, so check the text first and return an empty result.

    ```java
    import java.util.OptionalInt;

    public final class CampaignParam {
        // 9 digits always fit in an int, so no overflow check is needed
        private static final int MAX_DIGITS = 9;

        private CampaignParam() {}

        public static OptionalInt parseCampaignId(String raw) {
            if (raw == null) {
                return OptionalInt.empty();
            }
            int len = raw.length();
            if (len == 0 || len > MAX_DIGITS) {
                return OptionalInt.empty();
            }
            int value = 0;
            for (int i = 0; i < len; i++) {
                char c = raw.charAt(i);
                if (c < '0' || c > '9') {
                    return OptionalInt.empty();
                }
                value = value * 10 + (c - '0');
            }
            return OptionalInt.of(value);
        }
    }
    ```

    Use it in your servlet like this:

    ```java
    OptionalInt cid = CampaignParam.parseCampaignId(request.getParameter("cid"));
    if (cid.isPresent()) {
        campaignStats.count(cid.getAsInt());
    }
    ```

    `cid=abc`, `cid=` and a missing `cid` all give `OptionalInt.empty()`. Only plain digits count, so `-5` and ` 42` are also rejected. That fits a campaign id.

    **Green Notes**
    - **Avoid exceptions for expected control flow** (reduces E): `Integer.parseInt` throws `NumberFormatException` on every bad value, and Java builds a stack trace each time. If many visitors have no valid `cid`, that cost is paid on every one of those requests. The digit check costs one pass over a few characters.
    - Bad input is common here, so the manual check is worth it. If bad values were very rare, a plain `try/catch` around `parseInt` would be fine and shorter.
