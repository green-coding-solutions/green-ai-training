    **Green Notes**
    - **Modern image formats** (reduces network): AVIF first, WebP second, JPEG as the fallback. Browsers take the first format they support, and the `srcset` widths stop phones from downloading the 1280 px files. The saving is mostly fewer transferred bytes. In Green Metrics Tool browser benchmarks, decoding AVIF cost about 19% more client CPU energy than JPG, so it is not free on the client side.
    - **Encode once** (reduces E): your CI writes the files once per release, which is the right place. In the same benchmarks, encoding AVIF cost about 7× as much as encoding JPG, so never do it per request.
    - *Not applied:* `loading="lazy"` on the main sample. It is the first thing visitors see, so it has `fetchpriority="high"` instead.
