- role: user
  content: |
    Markup for the model card page of our plant-disease classifier. One big sample at the top (input photo), then a grid of 6 Grad-CAM overlays for the top predictions. CI already writes `<name>-640.{avif,webp,jpg}` and `<name>-1280.{avif,webp,jpg}` into /static/samples once per model release. Names: `sample-main`, `cam-1` to `cam-6`. Main is 1280x853, overlays 640x427. Markup only, no prose please.
