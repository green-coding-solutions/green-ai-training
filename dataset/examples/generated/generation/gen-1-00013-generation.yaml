id: gen-1-00013-generation
category: generation
language: html
patterns:
- modern-image-formats
facts:
- F-IMGRENDER
- F-IMGENC
messages:
- role: user
  content: |
    landing.html for our coworking space. Add a "Spaces" section after the pricing block: 3 cards (Open desk, Meeting room, Phone booth), each with a photo and a short text. Photos are `img/open-desk.jpg`, `img/meeting-room.jpg`, `img/phone-booth.jpg`, all 800x533. Cards already use `.card` and `.card-img` in the stylesheet. Just the diff, no explanations.
- role: assistant
  content: |
    ```html
    <section id="spaces" class="spaces">
      <h2>Spaces</h2>
      <div class="cards">
        <article class="card">
          <picture>
            <source srcset="img/open-desk.avif" type="image/avif">
            <source srcset="img/open-desk.webp" type="image/webp">
            <img class="card-img" src="img/open-desk.jpg" width="800" height="533"
                 alt="Open desk area with long shared tables and daylight">
          </picture>
          <h3>Open desk</h3>
          <p>Pick any free seat. Fast Wi-Fi, coffee and lockers included.</p>
        </article>

        <article class="card">
          <picture>
            <source srcset="img/meeting-room.avif" type="image/avif">
            <source srcset="img/meeting-room.webp" type="image/webp">
            <img class="card-img" src="img/meeting-room.jpg" width="800" height="533"
                 alt="Meeting room with a table for eight and a wall display">
          </picture>
          <h3>Meeting room</h3>
          <p>Seats eight. Book by the hour, screen and whiteboard ready.</p>
        </article>

        <article class="card">
          <picture>
            <source srcset="img/phone-booth.avif" type="image/avif">
            <source srcset="img/phone-booth.webp" type="image/webp">
            <img class="card-img" src="img/phone-booth.jpg" width="800" height="533"
                 alt="Small soundproof phone booth with a stool and a shelf">
          </picture>
          <h3>Phone booth</h3>
          <p>Quiet space for calls. No booking needed.</p>
        </article>
      </div>
    </section>
    ```

    Create the `.avif` and `.webp` files next to the JPGs once, in your build or before commit:

    ```bash
    for f in img/open-desk img/meeting-room img/phone-booth; do
      avifenc "$f.jpg" "$f.avif"
      cwebp -q 80 "$f.jpg" -o "$f.webp"
    done
    ```

    **Green Notes**
    - **AVIF, then WebP, then JPG in `<picture>`** (reduces network): browsers take the first format they support, so most visitors download fewer bytes. The JPG stays as the fallback. The gain is in transferred bytes. In Green Metrics Tool browser benchmarks, decoding AVIF cost about 19% more client CPU energy than JPG, so the format pays off through the network, not the decoder.
    - **Encode once, never per request** (reduces E): in the same micro-benchmarks, encoding AVIF cost about 7× the energy of encoding JPG. Do it at build time and serve the files as static assets.
    - **`width` and `height` on the `<img>`** reserve the space, so the layout does not jump while the photos load.
verify:
  static_only: HTML markup only, no runnable code
