- role: assistant
  content: |
    Your HTML is fine. `<article>` is a block element, so the boxes stack until you put a grid or flex layout on their parent. Add this to your `styles.css`:

    ```css
    /* Pricing section */
    .pricing {
      max-width: 64rem;
      margin: 0 auto;
      padding: 4rem 1.25rem;
      text-align: center;
    }

    /* Phone: one column. Wider screens: three columns. */
    .plans {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    @media (min-width: 48rem) {
      .plans {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Each card is a column, so the button can sit at the bottom */
    .plan {
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
      border: 1px solid #e3ded7;
      border-radius: 0.75rem;
      background: #fff;
      text-align: left;
    }

    .plan--featured {
      border: 2px solid #4a6b50;
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.08);
    }

    .plan h3 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
    }

    .price {
      margin: 0 0 1.25rem;
      font-size: 2rem;
      font-weight: 700;
    }

    .price span {
      font-size: 1rem;
      font-weight: 400;
      color: #5f5f5f;
    }

    .plan ul {
      margin: 0 0 1.5rem;
      padding-left: 1.25rem;
      line-height: 1.6;
    }

    .btn {
      display: block;
      margin-top: auto; /* pushes the button to the bottom of every card */
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      background: #4a6b50;
      color: #fff;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .btn:hover,
    .btn:focus-visible {
      background: #3a5640;
    }
    ```

    Here's why it works:
    - Grid cards stretch to the height of the tallest card in the row.
    - `margin-top: auto` on `.btn` takes up the free space above the button, so all three buttons line up at the bottom.

    **About "minified CSS":** you didn't do anything wrong. A minified file is the same CSS with the spaces, line breaks and comments removed. You keep editing your readable `styles.css` and make the small copy with one command (Node.js needs to be installed):

    ```bash
    npx esbuild styles.css --minify --outfile=styles.min.css
    ```

    Then link the small file in your HTML:

    ```html
    <link rel="stylesheet" href="styles.min.css">
    ```

    Run the command again after every change to `styles.css`. Never edit `styles.min.css` by hand, because the next run overwrites it.

    **Green Notes**
    - **Minify web assets** (reduces network): visitors download fewer bytes for the same page. In Green Metrics Tool browser benchmarks of a small booking page, the minified build used ~822 J for 50 cold page loads and the unminified sources ~837 J. That is about 2%, which is within noise. So for a stylesheet this small, minifying saves a bit of bandwidth, not measurable CPU on your visitors' phones. It's worth doing because it's one command, but your page isn't broken without it.
verify:
  static_only: CSS layout plus an npx esbuild command; nothing to execute with stdlib Python or Node
