- role: user
  content: |
    hi, I'm building my first landing page, it's for my sister's yoga studio. The pricing part looks broken. The three boxes sit one under the other even on my laptop, and the buttons are at different heights because the lists have a different number of items. Can you write the CSS for it? I want 3 boxes side by side on big screens and stacked on the phone.

    Also someone on a discord told me I should "ship a minified css". I have no idea what that means or if I did something wrong lol

    ```html
    <section class="pricing">
      <h2>Classes &amp; Prices</h2>
