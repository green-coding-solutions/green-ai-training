id: gen-1-00030-generation
category: generation
language: sql
patterns:
- select-columns
facts:
- F-PG-SELECT
messages:
- role: user
  content: |
    hi, im new to SQL and building a helpdesk page for our support team. It shows a table of open tickets: ticket number, subject, status, who its assigned to (name) and when it was last updated. newest first.

    my tables are

    ```sql
    CREATE TABLE users (
      id INTEGER PRIMARY KEY,
      name TEXT NOT NULL,
      email TEXT NOT NULL,
      password_hash TEXT NOT NULL,
      avatar_blob BLOB
    );

    CREATE TABLE tickets (
      id INTEGER PRIMARY KEY,
      subject TEXT NOT NULL,
      body TEXT NOT NULL,
      internal_notes TEXT,
      attachments_json TEXT,
      status TEXT NOT NULL,
      assignee_id INTEGER REFERENCES users(id),
      created_at TEXT NOT NULL,
      updated_at TEXT NOT NULL
    );
    ```

    my friend said my first try was "doing something wrong" but I dont really know what. can you write the query the right way?
- role: assistant
  content: |
    Here is a query that returns only what the table shows:

    ```sql
    SELECT t.id,
           t.subject,
           t.status,
           t.updated_at,
           u.name AS assignee
    FROM tickets AS t
    LEFT JOIN users AS u ON u.id = t.assignee_id
    WHERE t.status = 'open'
    ORDER BY t.updated_at DESC, t.id DESC
    LIMIT 50 OFFSET 0;
    ```

    If your first try used `SELECT *`, that is probably what your friend meant. It would also load `body`, `internal_notes`, `attachments_json` and everything from `users`, even though the page never shows them.

    - `LEFT JOIN` keeps unassigned tickets in the list, with `assignee` empty.
    - `LIMIT 50 OFFSET 0` gives one page. For page 2, use `OFFSET 50`.
    - Load `body` and `internal_notes` with a second query by `id` when someone opens a ticket.

    **Green Notes**
    - **Named columns instead of `SELECT *`** (reduces E and network): the list skips the long text columns, the attachment data and the user's hash and avatar. In Green Metrics Tool micro-benchmarks on PostgreSQL, reading 2,500 rows from a 52-column table with large text columns used about 7× less CPU energy when only the 10 needed columns were named. Your tables are smaller, so measure your own case. The saving grows with the size of the skipped columns.
    - **Pagination with `LIMIT`** (reduces network): each request sends 50 rows, not every open ticket.
    - Security bonus: `password_hash` can never leak into the API response by accident.
