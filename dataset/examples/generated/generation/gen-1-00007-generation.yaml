id: gen-1-00007-generation
category: generation
language: python
patterns:
- avoid-exception-flow
facts:
- F-EXC
messages:
- role: user
  content: |
    hi, im new to python. I have a small gateway (raspberry pi) that collects readings from lots of sensors and sends them on. Each reading is a dict like {"sensor_id": "t-104", "value": 21.7, "ts": 1760000000}. I have a dict with calibration offsets, but only about half of the sensors have an entry, the rest are not calibrated yet and should stay as they are. A batch can be some hundred thousand readings. Can you write a function that adds the offset to value? I am not sure if I should use try/except or something else
- role: assistant
  content: |
    Use `dict.get` with a default of `0.0`. A missing sensor then needs no special handling.

    ```python
    def apply_calibration(readings, offsets):
        get_offset = offsets.get
        calibrated = []
        for reading in readings:
            offset = get_offset(reading["sensor_id"], 0.0)
            calibrated.append({**reading, "value": reading["value"] + offset})
        return calibrated
    ```

    It returns new dicts and leaves your input readings unchanged. Uncalibrated sensors get an offset of `0.0`, so their value stays the same.

    **Green Notes**
    - **No exceptions for expected control flow** (reduces E): half of your sensors have no entry, so a `try/except KeyError` would raise and catch an exception for every one of them. In Green Metrics Tool micro-benchmarks with 10 million dict lookups and about half the keys missing, `dict.get` used about 12% less CPU energy than `try/except KeyError` ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=4753302a-710f-4132-8001-9da3ba960d13,d7ded3f2-f9e7-4781-905e-9782a8305b8f,8f054455-adbc-402d-b593-0191d1061cd8)).
    - **Look up the method once:** `offsets.get` is stored in `get_offset` before the loop, so it is not looked up again for every reading. This is a very small gain and is only worth it for big batches like yours.
    - *Not applied:* `try/except`. If almost all sensors were calibrated and a miss was rare, `try/except` would also be cheap, because the cost is in raising the exception. With your 50% misses, `get` is the better choice.
verify:
  test: |-
    offsets = {"a": 0.5, "b": -1.0}
    readings = [
        {"sensor_id": "a", "value": 10.0, "ts": 1},
        {"sensor_id": "x", "value": 3.0, "ts": 2},
        {"sensor_id": "b", "value": 2.0, "ts": 3},
    ]
    res = apply_calibration(readings, offsets)
    assert [r["value"] for r in res] == [10.5, 3.0, 1.0]
    assert [r["ts"] for r in res] == [1, 2, 3]
    assert readings[0]["value"] == 10.0
    assert apply_calibration([], offsets) == []
