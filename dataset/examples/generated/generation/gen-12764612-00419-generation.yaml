- role: assistant
  content: |
    ```python
    from dataclasses import dataclass
    from decimal import Decimal


    @dataclass
    class Line:
        sku: str
        name: str
        qty: int
        unit_price: Decimal


    def render_packing_list(orders):
        parts = []
        for order_id, customer, lines in orders:
            parts.append(f"ORDER {order_id} - {customer}\n")
            total = Decimal("0")
            for line in lines:
                amount = line.unit_price * line.qty
                total += amount
                parts.append(
                    f"  {line.sku:<10} {line.name:<30.30} {line.qty:>3} x "
                    f"{line.unit_price:>8.2f} = {amount:>9.2f}\n"
                )
            parts.append(f"  {'TOTAL':>58} {total:>9.2f}\n\n")
        return "".join(parts)
    ```

    **Green Notes**
    - **`"".join()` instead of `+=`** (reduces E): every piece goes into a list and the text is built once at the end. With a few thousand orders and several lines each, that is tens of thousands of pieces. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces with `+=` used roughly 260× more CPU energy than `"".join()`. An f-string appended in a loop behaved like `+=`, so the f-strings only build the pieces here.
    - If the printer takes a stream, you could also `write()` each order to a file object. The list and `join` is the simplest version that returns a string.
verify:
  test: |-
    out = render_packing_list([
        (1001, "Ann", [
            Line("A-100", "Mug", 2, Decimal("4.50")),
            Line("B-200", "X" * 50, 1, Decimal("10.00")),
        ]),
        (1002, "Bob", []),
    ])
    lines = out.splitlines()
    assert lines[0] == "ORDER 1001 - Ann"
    assert "9.00" in lines[1] and "A-100" in lines[1]
    assert "X" * 30 in lines[2] and "X" * 31 not in lines[2]
    assert lines[3].strip().startswith("TOTAL") and lines[3].strip().endswith("19.00")
    assert lines[4] == ""
    assert lines[5] == "ORDER 1002 - Bob"
    assert lines[6].strip().endswith("0.00")
    assert out.endswith("\n\n")
