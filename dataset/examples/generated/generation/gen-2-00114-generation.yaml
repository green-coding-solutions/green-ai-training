id: gen-2-00114-generation
category: generation
language: html
patterns:
- remove-unused-css
- system-fonts-and-deps
facts:
- F-UNUSED-CSS
- F-FONTS
messages:
- role: user
  content: |
    hi, I need landing page for our small yoga studio "Studio Lumen" in Graz. Only one page: on top the name, short text and a button "Book trial class", then 3 cards for the classes (Hatha, Vinyasa, Yin), a weekly schedule as table and contact form at the bottom (name, email, message, it post to /contact, this already exist on our server). Should look modern and work good on mobile. My friend say I should just put bootstrap from CDN so it look nice, is that ok or you do it different? Plain html please, we host it on cheap shared hosting.
- role: assistant
  content: |
    You don't need Bootstrap for this. Here is the page as one file. Its small inline stylesheet has only the rules this page uses.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Studio Lumen – Yoga in Graz</title>
      <meta name="description" content="Hatha, Vinyasa and Yin yoga in Graz. Book your trial class at Studio Lumen.">
      <style>
        :root {
          --accent: #2f6f5e;
          --accent-dark: #24574a;
          --bg-soft: #f4f1ec;
          --text: #222;
          --muted: #5a5a5a;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          line-height: 1.6;
          color: var(--text);
        }
        h1, h2, h3 { line-height: 1.2; }
        section { padding: 3rem 1.25rem; }
        .wrap { max-width: 60rem; margin: 0 auto; }
        .hero {
          background: linear-gradient(135deg, var(--bg-soft), #e3ece8);
          text-align: center;
          padding: 5rem 1.25rem;
        }
        .hero h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 .5rem; }
        .hero p { color: var(--muted); max-width: 36rem; margin: 0 auto 2rem; }
        .btn {
          display: inline-block;
          background: var(--accent);
          color: #fff;
          padding: .8rem 1.6rem;
          border: 0;
          border-radius: 999px;
          font: inherit;
          font-weight: 600;
          text-decoration: none;
          cursor: pointer;
        }
        .btn:hover, .btn:focus-visible { background: var(--accent-dark); }
        .cards {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
          gap: 1.25rem;
        }
        .card { background: var(--bg-soft); border-radius: .75rem; padding: 1.5rem; }
        .card h3 { margin-top: 0; color: var(--accent); }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; min-width: 24rem; border-collapse: collapse; }
        th, td { padding: .6rem .75rem; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: var(--bg-soft); }
        form { display: grid; gap: 1rem; max-width: 36rem; }
        form .btn { justify-self: start; }
        label { display: grid; gap: .3rem; font-weight: 600; }
        input, textarea {
          font: inherit;
          padding: .65rem .75rem;
          border: 1px solid #bbb;
          border-radius: .5rem;
        }
        input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
        footer { text-align: center; color: var(--muted); padding: 2rem 1rem; font-size: .9rem; }
      </style>
    </head>
    <body>
      <header class="hero">
        <h1>Studio Lumen</h1>
        <p>A small yoga studio in the heart of Graz. Calm classes for beginners and experienced yogis.</p>
        <a class="btn" href="#contact">Book trial class</a>
      </header>

      <main>
        <section id="classes">
          <div class="wrap">
            <h2>Our classes</h2>
            <div class="cards">
              <article class="card">
                <h3>Hatha</h3>
                <p>Slow, steady postures with focus on breathing. A good start if you are new to yoga.</p>
              </article>
              <article class="card">
                <h3>Vinyasa</h3>
                <p>Flowing sequences that link movement and breath. Builds strength and stamina.</p>
              </article>
              <article class="card">
                <h3>Yin</h3>
                <p>Long, quiet holds that release deep tension. Ideal for the end of a busy day.</p>
              </article>
            </div>
          </div>
        </section>

        <section id="schedule">
          <div class="wrap">
            <h2>Weekly schedule</h2>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr><th scope="col">Day</th><th scope="col">Time</th><th scope="col">Class</th></tr>
                </thead>
                <tbody>
                  <tr><td>Monday</td><td>18:00–19:15</td><td>Hatha</td></tr>
                  <tr><td>Tuesday</td><td>07:00–08:00</td><td>Vinyasa</td></tr>
                  <tr><td>Wednesday</td><td>19:00–20:15</td><td>Yin</td></tr>
                  <tr><td>Thursday</td><td>18:00–19:15</td><td>Vinyasa</td></tr>
                  <tr><td>Saturday</td><td>10:00–11:15</td><td>Hatha</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <section id="contact">
          <div class="wrap">
            <h2>Book a trial class</h2>
            <form action="/contact" method="post">
              <label>Name
                <input type="text" name="name" autocomplete="name" required>
              </label>
              <label>Email
                <input type="email" name="email" autocomplete="email" required>
              </label>
              <label>Message
                <textarea name="message" rows="5" required></textarea>
              </label>
              <button class="btn" type="submit">Send</button>
            </form>
          </div>
        </section>
      </main>

      <footer>Studio Lumen · Yoga in Graz</footer>
    </body>
    </html>
    ```

    Put your real class times in the schedule. Check that the field names `name`, `email` and `message` match what `/contact` expects.

    **Green Notes**
    - **Only the CSS this page uses** (reduces network): no framework stylesheet full of rules for components the page doesn't have, and no extra request to a CDN. To be honest about the size of the win: in Green Metrics Tool page-load measurements, a 16 KB stylesheet with mostly unused rules, purged and minified to 0.75 KB, made about 2% difference in client energy, which is within noise. The gain is fewer bytes on real networks, mostly for mobile visitors. It is not CPU.
    - **System font stack** (reduces E, network): the browser downloads no web fonts. In Green Metrics Tool page-load measurements, the system font stack used about 26% less CPU energy than six local TTF font files and about 16% less than two WOFF2 subsets.

    *Not applied:* Bootstrap from a CDN. It makes sense if the site grows into many pages that use many of its components. For one page, most of its rules would never be used.
verify:
  static_only: HTML page with inline CSS, no executable code to test
