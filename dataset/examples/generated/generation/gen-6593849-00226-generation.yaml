messages:
- role: user
  content: |
    hello, i need dockerfile for our company landing page. is made with vite (npm run build make folder dist), have package.json and package-lock.json. only static files, no server code. we want to run it on our small server on port 80. gitlab build it when we push. thank you!
- role: assistant
  content: |-
    This uses two stages. The first builds the site with Node. The second only serves the finished files with nginx.

    ```dockerfile
    FROM node:20-slim AS build
    WORKDIR /app

    COPY package.json package-lock.json ./
    RUN npm ci

    COPY . .
    RUN npm run build

    FROM nginx:1.27-alpine
    COPY --from=build /app/dist /usr/share/nginx/html
    EXPOSE 80
    ```

    Add a `.dockerignore` next to it:

    ```text
    node_modules
    dist
    .git
    ```

    Build and run:

    ```bash
    docker build -t landing .
    docker run -d -p 80:80 landing
    ```

    **Green Notes**
    - **Slim base images** (reduces E, storage, network): `node:20-slim` is used only to build, and the final image is `nginx:1.27-alpine` with just the static files. Node, npm and `node_modules` are not shipped. In Green Metrics Tool micro-benchmarks on a small Flask app, a slim image with runtime dependencies only used about 7× less energy to build than a full `python:3.12` image with dev tools. Serving requests cost the same with both. Your stack is different, so measure your own build. The saving comes from the build, pull and stored copy that repeat on every push.
    - **Dependency layer first** (reduces E): `package*.json` is copied and `npm ci` runs before the source is copied. A change to the page text reuses the cached install layer, as long as your runner keeps the Docker layer cache.
    - **`.dockerignore`** (reduces network): `node_modules` and `.git` are not sent to the build context.
