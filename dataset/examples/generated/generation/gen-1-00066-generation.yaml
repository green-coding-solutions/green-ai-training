id: gen-1-00066-generation
category: generation
language: python
patterns:
- avoid-exception-flow
facts:
- F-EXC
messages:
- role: user
  content: |
    py fn: build the input matrix for our ranking model from a list of user ids. embeddings are in a dict uid -> np array (float32, dim 64), new users have none and get zeros. most of our traffic is new users
- role: assistant
  content: |
    ```python
    import numpy as np

    def build_batch(user_ids, embeddings, dim=64):
        """Return a (len(user_ids), dim) float32 matrix.

        Users without a stored embedding (cold start) get a zero row.
        """
        if not user_ids:
            return np.zeros((0, dim), dtype=np.float32)
        zero = np.zeros(dim, dtype=np.float32)
        rows = [embeddings.get(uid, zero) for uid in user_ids]
        return np.stack(rows)
    ```

    `np.stack` copies the rows, so sharing one `zero` vector is safe.

    **Green Notes**
    - **`dict.get` instead of `try/except KeyError`** (reduces E): most users are misses here, and every miss through `except` raises and catches an exception. In Green Metrics Tool micro-benchmarks with about half the keys missing, `dict.get` used about 12% less CPU energy than `try/except KeyError`.
    - **One shared zero vector** (reduces E and M): no new array is allocated for every cold-start user.
    - *Not applied:* if almost every user had an embedding, `try/except` would be fine too, because the cost is in raising, not in the `try`.
verify:
  test: |-
    e = {1: np.ones(3, dtype=np.float32)}
    b = build_batch([1, 2, 1], e, 3)
    assert b.shape == (3, 3)
    assert b.dtype == np.float32
    assert b[0].sum() == 3 and b[1].sum() == 0 and b[2].sum() == 3
    assert build_batch([], e, 3).shape == (0, 3)
