messages:
- role: user
  content: |
    I need a bash script that builds local landing pages for our plumbing company. Requirements:

    - Input: a text file `cities.txt`, one city per line, format `slug|City Name` (for example `bad-homburg|Bad Homburg`). Right now about 1,500 lines, it will grow.
    - Output: one `<slug>.html` per city in an output directory. All pages share the same template. Only the city name and the slug change (title, meta description, h1, canonical URL, booking link).
    - Usage: `./build_city_pages.sh cities.txt out_dir`
    - Base URL for the canonical link should be configurable with an env var, default `https://example.com`.
    - City names can contain `&` or quotes, so escape them for HTML.
    - Skip empty lines, comment lines starting with `#`, and lines with a slug that is not lowercase letters, digits and dashes. Print a warning for bad slugs.
    - Print how many pages were written at the end.
    - It runs in our CI on every deploy, bash 4+ is fine.
- role: assistant
  content: |-
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    if [[ $# -ne 2 ]]; then
      printf 'Usage: %s cities.txt out_dir\n' "$0" >&2
      exit 1
    fi

    list=$1
    out=$2
    base_url=${BASE_URL:-https://example.com}

    # Bash 5.2 treats & in a replacement as "the matched text". Turn that off.
    shopt -u patsub_replacement 2>/dev/null || true

    mkdir -p -- "$out"

    # Page template, read once. The quoted delimiter means no expansion.
    # Placeholders: city, city, base URL, slug, city, slug.
    IFS= read -r -d '' template <<'HTML' || true
    <!doctype html>
    <html lang='en'>
    <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Plumbers in %s | Acme Pipes</title>
    <meta name='description' content='Acme Pipes: fast, local plumbers in %s. Book online in two minutes.'>
    <link rel='canonical' href='%s/cities/%s.html'>
    <link rel='stylesheet' href='/css/landing.css'>
    </head>
    <body>
    <main>
    <h1>Plumbers in %s</h1>
    <p>Leaks, boilers, blocked drains. We come to you the same day.</p>
    <a class='cta' href='/book?city=%s'>Book a visit</a>
    </main>
    </body>
    </html>
    HTML

    # Result is left in REPLY, so no subshell is needed.
    html_escape() {
      local s=$1
      s=${s//&/&amp;}
      s=${s//</&lt;}
      s=${s//>/&gt;}
      s=${s//\"/&quot;}
      s=${s//\'/&#39;}
      REPLY=$s
    }

    count=0
    while IFS='|' read -r slug city || [[ -n $slug ]]; do
      [[ -z $slug || $slug == '#'* ]] && continue

      if [[ ! $slug =~ ^[a-z0-9-]+$ || -z $city ]]; then
        printf 'warning: skipping line with slug "%s"\n' "$slug" >&2
        continue
      fi

      html_escape "$city"

      # shellcheck disable=SC2059  # the template is our own format string
      printf "$template" "$REPLY" "$REPLY" "$base_url" "$slug" "$REPLY" "$slug" > "$out/$slug.html"

      count=$((count + 1))
    done < "$list"

    printf 'Wrote %d pages to %s\n' "$count" "$out"
    ```

    Keep the heredoc lines and the closing `HTML` flush left in the file. If you indent them, the closing `HTML` line no longer ends the heredoc. The HTML attributes use single quotes. This is valid HTML and is safe here, because `html_escape` turns `'` in city names into `&#39;`.

    The template is a `printf` format, so a literal `%` in it must be written as `%%`. The current template has none. Keep that in mind if you add inline CSS with percentages.

    **Green Notes**
    - **No quote scanning for the template and fixed strings** (reduces E): the template sits in a quoted heredoc and is read once before the loop. The usage message and the warning format use single quotes. Bash does not scan these literals for `$`, backticks or backslashes. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop took about 24% less CPU energy with single quotes than with double quotes. Your strings are shorter, so expect a smaller gain. Variables stay in double quotes.
    - **Builtins instead of forks in the loop** (reduces E): escaping uses parameter expansion, the slug check uses `[[ =~ ]]`, the counter uses `$(( ))`, and `printf` writes each file. No `sed`, `echo | tr` or `$(...)` runs per line. In Green Metrics Tool measurements on a 20,000-line log, a builtin-only loop used about 300× less CPU energy than a loop that started several processes per line.
    - **One `printf` per page** (reduces E): each page is filled and written in a single call, not built up from many `echo` lines.
