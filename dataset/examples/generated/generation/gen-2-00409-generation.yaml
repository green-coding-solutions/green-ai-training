id: gen-2-00409-generation
category: generation
language: python
patterns:
- avoid-exception-flow
facts:
- F-EXC
messages:
- role: user
  content: |
    py fn: turn a batch of texts into padded token id lists for our classifier. vocab is a dict word -> id, words not in it get <unk>
- role: assistant
  content: |
    ```python
    def encode_batch(texts, vocab, max_len=128, unk="<unk>", pad="<pad>"):
        unk_id = vocab[unk]
        pad_id = vocab[pad]
        batch = []
        for text in texts:
            tokens = text.lower().split()[:max_len]
            ids = [vocab.get(tok, unk_id) for tok in tokens]
            ids.extend([pad_id] * (max_len - len(ids)))
            batch.append(ids)
        return batch
    ```

    Texts are cut to `max_len` tokens and padded on the right, so every row has the same length. The split is plain whitespace. If your model uses a subword tokenizer, use that tokenizer instead.

    **Green Notes**
    - **`dict.get` instead of `try/except KeyError`** (reduces E): unknown words are common in text, so a missing key is a normal case here, not an error. Raising and catching an exception for each one is the expensive part. In Green Metrics Tool micro-benchmarks with 10,000,000 dict lookups and about half of the keys missing, `dict.get(key, default)` used ~67 J and `try/except KeyError` ~76 J, about 12% less. If misses are rare, `try/except` is also cheap, because the cost is in raising.
  verify:
    test: |-
      vocab = {"<pad>": 0, "<unk>": 1, "hello": 2, "world": 3}
      assert encode_batch(["Hello brave world"], vocab, max_len=4) == [[2, 1, 3, 0]]
      assert encode_batch(["a b c d e"], vocab, max_len=3) == [[1, 1, 1]]
      assert encode_batch([""], vocab, max_len=2) == [[0, 0]]
      assert encode_batch(["hello", "world hello"], vocab, max_len=2) == [[2, 0], [3, 2]]
