id: gen-1-00189-generation
category: generation
language: javascript
patterns:
- memoize
messages:
- role: user
  content: |
    js function: byte pair encoding for one word, merge ranks in a Map like "l o" -> 0. runs for every word of every request in our tokenizer
- role: assistant
  content: |
    ```javascript
    function createBpe(ranks, maxCache = 50000) {
      const cache = new Map();

      function mergeWord(word) {
        const parts = Array.from(word);
        while (parts.length > 1) {
          let best = -1;
          let bestRank = Infinity;
          for (let i = 0; i < parts.length - 1; i++) {
            const rank = ranks.get(parts[i] + ' ' + parts[i + 1]);
            if (rank !== undefined && rank < bestRank) {
              bestRank = rank;
              best = i;
            }
          }
          if (best === -1) break;
          parts.splice(best, 2, parts[best] + parts[best + 1]);
        }
        return Object.freeze(parts);
      }

      return function bpe(word) {
        let result = cache.get(word);
        if (result === undefined) {
          result = mergeWord(word);
          if (cache.size >= maxCache) {
            cache.delete(cache.keys().next().value); // drop the oldest entry
          }
          cache.set(word, result);
        }
        return result;
      };
    }
    ```

    ```javascript
    const ranks = new Map([['l o', 0], ['lo w', 1], ['e r', 2]]);
    const bpe = createBpe(ranks);
    bpe('lower'); // ['low', 'er']
    ```

    The returned arrays are frozen, so a caller can't change a cached entry by accident. Copy with `[...bpe(w)]` if you need to edit one.

    **Green Notes**
    - **Memoize a pure computation** (reduces E): the merge loop is quadratic in word length, and the same words come back constantly in real text. A repeated word now costs one `Map` lookup.
    - **Bounded cache** (reduces E): the size cap keeps memory flat when a stream has many unique tokens such as IDs or typos. If most of your words are unique, the cache only adds overhead, so check the hit rate.
    - The cache is per `createBpe` instance. Create it once at startup, not per request.
verify:
  green_block: 0
  test: |-
    function eq(actual, expected) {
      const a = JSON.stringify(actual);
      const e = JSON.stringify(expected);
      if (a !== e) throw new Error('expected ' + e + ', got ' + a);
    }
    function ok(cond, msg) {
      if (!cond) throw new Error(msg);
    }
    const ranks = new Map([['l o', 0], ['lo w', 1], ['e r', 2]]);
    const bpe = createBpe(ranks, 3);
    eq([...bpe('lower')], ['low', 'er']);
    eq([...bpe('lower')], ['low', 'er']);
    ok(bpe('lower') === bpe('lower'), 'cached result should be the same object');
    ok(Object.isFrozen(bpe('lower')), 'cached result should be frozen');
    eq([...bpe('xyz')], ['x', 'y', 'z']);
    eq([...bpe('')], []);
    for (const w of ['a', 'b', 'c', 'd', 'e', 'lo', 'low']) bpe(w);
    eq([...bpe('lower')], ['low', 'er']);
    eq([...bpe('lo')], ['lo']);
    console.log('ok');
