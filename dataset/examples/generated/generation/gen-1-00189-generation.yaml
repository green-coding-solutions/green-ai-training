id: gen-1-00189-generation
category: generation
language: python
patterns:
- string-join
facts:
- F-STRCAT
messages:
- role: user
  content: |
    need a fn that turns a header list and a list of float rows into a LaTeX tabular for our paper, 4 sig digits. can be ~1e6 rows
- role: assistant
  content: |
    ```python
    def to_latex_tabular(header, rows, digits=4):
        spec = f".{digits}g"
        lines = [
            r"\begin{tabular}{" + "c" * len(header) + "}",
            r"\hline",
            " & ".join(header) + r" \\",
            r"\hline",
        ]
        lines.extend(
            " & ".join(format(x, spec) for x in row) + r" \\"
            for row in rows
        )
        lines.append(r"\hline")
        lines.append(r"\end{tabular}")
        return "\n".join(lines) + "\n"
    ```

    Every row must have as many values as the header. Wrong lengths are not checked.

    **Green Notes**
    - **Join instead of `+=`** (reduces E): the lines are collected in a list and joined once at the end. Appending to a string in a loop, or with f-strings, copies the growing text again and again. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J with `+=` and ~1.8 J with `"".join()`, roughly 260× less CPU energy. At about 1e6 rows you are in that range.
test_placeholder: null
verify:
  test: |-
    out = to_latex_tabular(["t", "E"], [[0.0, 1.23456], [1.0, 2]])
    expected = (
        "\\begin{tabular}{cc}\n"
        "\\hline\n"
        "t & E \\\\\n"
        "\\hline\n"
        "0 & 1.235 \\\\\n"
        "1 & 2 \\\\\n"
        "\\hline\n"
        "\\end{tabular}\n"
    )
    assert out == expected
    big = to_latex_tabular(["a"], [[i * 0.5] for i in range(1000)])
    assert big.count("\n") == 1000 + 5
    assert to_latex_tabular(["a", "b", "c"], []).startswith("\\begin{tabular}{ccc}\n")
