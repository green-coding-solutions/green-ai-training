    import os, tempfile
    d = tempfile.mkdtemp()
    dp = os.path.join(d, "dict.txt")
    with open(dp, "w", encoding="utf-8") as f:
        f.write("Hello\nworld\ndon't\n\n")
    words = load_words(dp)
    assert words == {"hello", "world", "don't"}
    assert unknown_words(["Hello wrold, don't Wrold", "foo hello"], words) == ["wrold", "foo"]
    assert unknown_words([], words) == []
    tp = os.path.join(d, "t.txt")
    with open(tp, "w", encoding="utf-8") as f:
        f.write("Hello world\n")
    assert main(["spellcheck.py", dp, tp]) == 0
    with open(tp, "w", encoding="utf-8") as f:
        f.write("helo world\n")
    assert main(["spellcheck.py", dp, tp]) == 1
    assert main(["spellcheck.py"]) == 2
