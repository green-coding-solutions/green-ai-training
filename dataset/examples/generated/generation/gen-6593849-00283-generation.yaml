- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    # merge solver snapshots for plotting
    # for every snapshot_*.dat in $1 write a tab separated file into $2
    # first line = header note, skip comment lines (#) and empty lines
    # columns: t x y z vx vy vz rho p T
    set -euo pipefail

    in_dir=$1
    out_dir=$2
    header_note='# columns: t[s] x[m] y[m] z[m] vx[m/s] vy[m/s] vz[m/s] rho[kg/m^3] p[Pa] T[K], SI units, fixed timestep'

    mkdir -p -- "$out_dir"

    for f in "$in_dir"/snapshot_*.dat; do
      [[ -e $f ]] || continue
      name=${f##*/}
      {
        printf '%s\n' "$header_note"
        while read -r t x y z vx vy vz rho p temp _; do
          case $t in
            '#'*|'') continue ;;
          esac
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$t" "$x" "$y" "$z" "$vx" "$vy" "$vz" "$rho" "$p" "$temp"
        done < "$f"
      } > "$out_dir/${name%.dat}.tsv"
    done
    ```

    Usage: `./merge_snapshots.sh run/out plots/`

    **Green Notes**
    - **Single quotes for plain literals** (reduces E): the header note, the `printf` format and the `'#'*` pattern need no expansion, so they use single quotes. Variables keep their double quotes. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes than with double quotes. Your literals are short, so the absolute saving here is small. It grows with literal length and loop count, and the format string runs once per data line.
    - **Builtins in the per-line loop** (reduces E): `read -r` splits the fields, `case` filters the comments, and `printf` is a builtin. No `cut`, `awk` or `$(...)` runs per line. In a log-summary benchmark, a builtin-only loop used about 300× less energy than the same loop with `$(echo | cut)` and `$(expr)` per line.

    Lines with fewer than 10 columns give empty fields, and extra columns are dropped.
verify:
  static_only: bash script, needs snapshot data files
