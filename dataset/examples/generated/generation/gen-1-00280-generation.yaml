messages:
- role: user
  content: |
    hello, i need small Go programm for read our app log files. line looks like this:

    2026-10-09T12:00:01Z ERROR payment timeout user=42 ms=1200

    i want count how many lines for every level (INFO, WARN, ERROR), how many lines have one of some keywords (i give the keywords like "timeout", "Refused", "panic", not care big or small letters) and how many lines have ms= bigger than a limit. files are big, some GB. thx!
- role: assistant
  content: "This reads the file once, line by line. The regex and the lowercase keywords are prepared once, before the loop.\n\
    \n```go\npackage main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"io\"\n\t\"os\"\n\t\"regexp\"\n\t\"sort\"\n\t\"strconv\"\
    \n\t\"strings\"\n)\n\nvar msRe = regexp.MustCompile(`\\bms=(\\d+)`)\n\ntype Summary struct {\n\tByLevel   map[string]int\n\
    \tMatches   int // lines with at least one keyword\n\tSlowLines int // lines with ms >= slowMs\n}\n\nfunc Scan(r io.Reader,\
    \ keywords []string, slowMs int) (Summary, error) {\n\t// Prepared once, not per line.\n\tlowKeywords := make([]string,\
    \ 0, len(keywords))\n\tfor _, k := range keywords {\n\t\tif k != \"\" { // an empty keyword would match every line\n\t\
    \t\tlowKeywords = append(lowKeywords, strings.ToLower(k))\n\t\t}\n\t}\n\n\tsum := Summary{ByLevel: make(map[string]int)}\n\
    \n\tsc := bufio.NewScanner(r)\n\tsc.Buffer(make([]byte, 0, 64*1024), 1024*1024)\n\n\tfor sc.Scan() {\n\t\tline := sc.Text()\n\
    \n\t\tparts := strings.SplitN(line, \" \", 3)\n\t\tif len(parts) >= 2 {\n\t\t\tsum.ByLevel[parts[1]]++\n\t\t}\n\n\t\t\
    if len(lowKeywords) > 0 {\n\t\t\tlower := strings.ToLower(line)\n\t\t\tfor _, k := range lowKeywords {\n\t\t\t\tif strings.Contains(lower,\
    \ k) {\n\t\t\t\t\tsum.Matches++\n\t\t\t\t\tbreak\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\n\t\tif m := msRe.FindStringSubmatch(line);\
    \ m != nil {\n\t\t\tif ms, err := strconv.Atoi(m[1]); err == nil && ms >= slowMs {\n\t\t\t\tsum.SlowLines++\n\t\t\t}\n\
    \t\t}\n\t}\n\treturn sum, sc.Err()\n}\n\nfunc main() {\n\tif len(os.Args) < 2 {\n\t\tfmt.Fprintln(os.Stderr, \"usage:\
    \ logscan <file>\")\n\t\tos.Exit(2)\n\t}\n\tf, err := os.Open(os.Args[1])\n\tif err != nil {\n\t\tfmt.Fprintln(os.Stderr,\
    \ err)\n\t\tos.Exit(1)\n\t}\n\tdefer f.Close()\n\n\tsum, err := Scan(f, []string{\"timeout\", \"Refused\", \"panic\"},\
    \ 1000)\n\tif err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.Exit(1)\n\t}\n\n\tlevels := make([]string, 0, len(sum.ByLevel))\n\
    \tfor l := range sum.ByLevel {\n\t\tlevels = append(levels, l)\n\t}\n\tsort.Strings(levels)\n\tfor _, l := range levels\
    \ {\n\t\tfmt.Printf(\"%-6s %d\\n\", l, sum.ByLevel[l])\n\t}\n\tfmt.Println(\"keyword lines:\", sum.Matches)\n\tfmt.Println(\"\
    slow lines:   \", sum.SlowLines)\n}\n```\n\nChange the keywords and the `1000` limit in `main`. Run it with `go run .\
    \ app.log`.\n\n**Green Notes**\n- **Regex compiled once** (reduces E): `msRe` is a package-level variable. Compiling a\
    \ regex inside the loop would redo the same work for every line of a multi-GB file.\n  https://patterns.greensoftware.foundation/development/media-and-code-efficiency/use-compiled-languages\
    \ is not needed here, because Go is already compiled. The cost is in the loop work, not in the language.\n- **Keywords\
    \ lowercased once** (reduces E): the keyword list never changes, so `ToLower` runs per keyword one time. Only the line\
    \ is lowercased per line.\n- **Single pass, early `break`:** the file is read once. The keyword loop stops at the first\
    \ hit.\n- *Not applied:* parallel workers. For one file on one disk, reading is usually the limit, and it would make the\
    \ code harder to read.\n"
