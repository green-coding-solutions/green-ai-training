id: gen-1-00140-generation
category: generation
language: javascript
patterns:
- efficient-algorithm
messages:
- role: user
  content: |
    hello, i need js function for autocomplet in the signup form of our landing page. we have list of around 80k city names (array of strings). when user is typing, show first 8 city that start with what he typed, not case sensitive. the list never change after page load. thx!
- role: assistant
  content: |
    Sort the list once, then use binary search to find the first match on every keystroke:

    ```javascript
    function createCityIndex(cities) {
      const entries = cities.map((name) => ({ key: name.toLowerCase(), name }));
      entries.sort((a, b) => (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
      return entries;
    }

    function suggestCities(index, typed, limit = 8) {
      const prefix = typed.trim().toLowerCase();
      if (!prefix) return [];

      // first entry whose key is >= prefix
      let lo = 0;
      let hi = index.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (index[mid].key < prefix) lo = mid + 1;
        else hi = mid;
      }

      // all keys with this prefix sit next to each other
      const result = [];
      for (let i = lo; i < index.length && result.length < limit; i++) {
        if (!index[i].key.startsWith(prefix)) break;
        result.push(index[i].name);
      }
      return result;
    }
    ```

    Use it like this:

    ```javascript
    const index = createCityIndex(allCities); // once, at page load

    input.addEventListener("input", () => {
      render(suggestCities(index, input.value));
    });
    ```

    Results come in alphabetical order, not in the original list order.

    **Green Notes**
    - **Sort once, binary search per keystroke** (reduces E): the work per keystroke is O(log n + 8) instead of scanning all 80k names with `filter`. This runs on the visitor's device for every key they press.
    - **Lowercase keys are computed once** in the index, not again for every name on every keystroke.
    - **Early stop:** the loop ends after 8 matches or at the first non-match, so it never touches the rest of the list.
    - *Not applied:* a trie. It uses more memory and more code, and the sorted array is already fast enough for 80k names. For a list of about 200 names, a plain `filter` is fine too.
verify:
  lang: javascript
  green_block: 0
  test: |-
    const check = (got, want) => {
      if (JSON.stringify(got) !== JSON.stringify(want)) throw new Error(JSON.stringify(got));
    };
    const idx = createCityIndex(["Berlin", "bern", "Bergen", "Boston", "berlin", "Paris"]);
    check(suggestCities(idx, "BER"), ["Bergen", "Berlin", "berlin", "bern"]);
    check(suggestCities(idx, "be", 2), ["Bergen", "Berlin"]);
    check(suggestCities(idx, ""), []);
    check(suggestCities(idx, "x"), []);
    check(suggestCities(idx, " par "), ["Paris"]);
