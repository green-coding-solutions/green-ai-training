    .badge {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
    }
    .badge.passed  { background: var(--ok); }
    .badge.failed  { background: var(--fail); }
    .badge.running { background: var(--run); }

    pre.log {
      margin: 1rem 0 0;
      padding: 1rem;
      max-height: 60vh;
      overflow: auto;
      background: var(--header);
      color: #e6e8eb;
      font: 400 13px/1.45 var(--font-mono);
      white-space: pre-wrap;
    }
    ```

    I dropped the six `@font-face` rules and the `fonts/` folder. Text and logs use system font stacks instead. If you need Inter for branding, ship only two Latin-subset WOFF2 files (regular and bold) and keep the system stack as fallback.

    **Green Notes**
    - **System font stack** (reduces E, network): no font files to download, decode or lay out. In Green Metrics Tool micro-benchmarks (30 cold page loads), the system stack used about 26% less client CPU energy than six local TTF files (~4 MB), and about 16% less than two Latin-subset WOFF2 files.
    - **Fewer requests:** the dashboard renders at once, with no wait for fonts and no layout shift when they arrive.
    - *Not applied:* custom fonts. For an internal tool, a native look is fine. If the brand needs Inter, use the WOFF2 subsets, never TTF.
