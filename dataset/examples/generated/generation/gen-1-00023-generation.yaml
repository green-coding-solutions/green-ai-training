- role: assistant
  content: |
    Here is the equalizer in pure CSS. It needs no script.

    ```html
    <div class="equalizer" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <style>
      .equalizer {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 64px;
      }
      .equalizer span {
        width: 8px;
        height: 100%;
        border-radius: 4px;
        background: #3b82f6;
        transform-origin: bottom;
        animation: eq-bounce 1.2s ease-in-out infinite;
      }
      .equalizer span:nth-child(1) { animation-delay: -0.2s; }
      .equalizer span:nth-child(2) { animation-delay: -0.5s; }
      .equalizer span:nth-child(3) { animation-delay: -0.1s; }
      .equalizer span:nth-child(4) { animation-delay: -0.7s; }
      .equalizer span:nth-child(5) { animation-delay: -0.4s; }

      @keyframes eq-bounce {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .equalizer span { animation: none; transform: scaleY(0.6); }
      }
    </style>
    ```

    Put the `.equalizer` block inside `.hero-visual`, and add the `<style>` rules to your stylesheet.

    **Green Notes**
    - **CSS keyframes instead of a JS loop** (reduces E): the bars animate without a `requestAnimationFrame` callback that updates styles on every frame. In Green Metrics Tool browser micro-benchmarks, a 20-second animation with JS style updates used about 161 J CPU energy, and the same animation in CSS `@keyframes` used about 145 J (about 10% less).
    - **Transform only:** `scaleY` changes the bar height visually without changing layout, so the browser does less work per frame.
    - **Reduced motion:** the media query stops the loop for visitors who ask for less motion, so their browser does no animation work.
