  test: |-
    elf = b"\x7fELF\x02\x01\x01\x00" + bytes(8)
    assert format_dump(elf) == "00000000: 7f45 4c46 0201 0100 0000 0000 0000 0000  .ELF............\n"
    assert format_dump(b"") == ""
    assert format_dump(b"abc") == "00000000: " + "6162 63".ljust(39) + "  abc\n"
    out = format_dump(b"A" * 20, offset=0x100)
    lines = out.split("\n")
    assert lines[0] == "00000100: 4141 4141 4141 4141 4141 4141 4141 4141  AAAAAAAAAAAAAAAA"
    assert lines[1] == "00000110: " + "4141 4141".ljust(39) + "  AAAA"
    assert lines[2] == ""
    assert format_dump(b"\x00\x1f\x20\x7e\x7f\xff", width=8) == "00000000: " + "001f 207e 7fff".ljust(19) + "  .. ~..\n"
    assert format_dump(b"xyz", width=3) == "00000000: 7879 7a  xyz\n"
    try:
        format_dump(b"a", width=0)
        raise AssertionError("expected ValueError")
    except ValueError:
        pass
