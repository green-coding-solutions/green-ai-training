messages:
- role: user
  content: |
    hi, i am quite new to docker and not sure what i need to put in the file. i wrote a python job that downloads the stock xml files from our suppliers sftp, turns them into parquet and uploads them to our s3 bucket. it runs once every night.

    files:

    ```text
    stock_etl/
      __init__.py
      fetch.py
      convert.py
      upload.py
      main.py
    requirements.txt
    ```

    requirements.txt has paramiko, lxml, pyarrow and boto3. the job starts with `python -m stock_etl.main`. can you write the Dockerfile for it? i dont know if i need anything special for lxml and pyarrow
- role: assistant
  content: |
    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONDONTWRITEBYTECODE=1 \
        PYTHONUNBUFFERED=1

    WORKDIR /job

    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY stock_etl ./stock_etl

    USER nobody
    CMD ["python", "-m", "stock_etl.main"]
    ```

    You don't need anything special for `lxml` and `pyarrow`. They ship ready-made wheels for Linux, so pip does not need a compiler. If pip ever fails with a compiler error for one package, add only the one system package that package needs.

    Add a `.dockerignore` with at least `.git`, `.venv`, `__pycache__` and any local data folders, so they are not sent to the build.

    **Green Notes**
    - **Small container image** (reduces E, storage, network): slim base, runtime dependencies only, and no pip cache in the image. In Green Metrics Tool micro-benchmarks of a small Flask app, an image built like this used about 7× less energy to build than one on the full `python:3.12` base with build tools and dev packages. Running the app cost the same. The saving repeats with every build, pull and stored copy of the image.
    - **Dependency layer first** (reduces E): `requirements.txt` is installed before your code is copied. A change in `stock_etl/` only rebuilds the last layers, not the whole pip install.

    Keep test and lint tools (pytest, black) in a separate dev requirements file, so they stay out of this image.
verify:
  static_only: Dockerfile
