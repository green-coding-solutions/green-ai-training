category: generation
language: yaml
patterns:
- minimize-environments
messages:
- role: user
  content: |
    ```yaml
    # shop-storefront / argocd / appset-envs.yaml
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata:
      name: shop-envs
      namespace: argocd
    spec:
      generators:
        - list:
            elements:
              - env: dev
              - env: qa1
              - env: qa2
              - env: qa3
      template:
        metadata:
          name: 'shop-{{env}}'
        spec:
          project: default
          source:
            repoURL: https://github.com/acme/shop-storefront.git
            targetRevision: main
            path: deploy/helm/shop
            helm:
              parameters:
                - {name: replicaCount, value: "3"}
          destination:
            server: https://kubernetes.default.svc
            namespace: 'shop-{{env}}'
      # TODO: preview env per PR instead of qa1-qa3, only when we ask for it
    ```
    ?
- role: assistant
  content: |
    I read the TODO as: replace the fixed `qa1`-`qa3` environments with one short-lived preview per PR, created only for PRs with a `preview` label.

    ```yaml
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata:
      name: shop-envs
      namespace: argocd
    spec:
      generators:
        # long-lived: one shared dev environment
        - list:
            elements:
              - env: dev
                pr: "dev"
        # short-lived: one environment per open PR that has the "preview" label
        - pullRequest:
            github:
              owner: acme
              repo: shop-storefront
              labels: [preview]
              tokenRef:
                secretName: github-token
                key: token
            requeueAfterSeconds: 300
      template:
        metadata:
          name: 'shop-{{env}}'
          finalizers:
            - resources-finalizer.argocd.argoproj.io
        spec:
          project: default
          source:
            repoURL: https://github.com/acme/shop-storefront.git
            targetRevision: main
            path: deploy/helm/shop
            helm:
              parameters:
                - {name: replicaCount, value: "1"}
                - {name: resources.requests.cpu, value: 100m}
                - {name: resources.requests.memory, value: 256Mi}
          destination:
            server: https://kubernetes.default.svc
            namespace: 'shop-{{env}}'
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
    ```

    The `list` and `pullRequest` generators produce different parameters, so the template cannot use one `{{env}}` for both. Use a `matrix`-free split instead: put the PR generator in its own `ApplicationSet` named `shop-previews`. It uses `name: 'shop-pr-{{number}}'`, `targetRevision: '{{head_sha}}'` and `namespace: 'shop-pr-{{number}}'`. Keep `dev` in `shop-envs`. The block above shows the shared settings. The split is needed before you apply it.

    **Green Notes**
    - **Environments exist only while needed** (reduces E and M): a preview is created when a PR gets the `preview` label. It is deleted when the PR closes or the label is removed. Three always-on `qa` copies become zero idle copies.
    - **Opt-in label:** PRs that don't need a live environment (docs, config, refactors) never allocate one.
    - **Small footprint for non-prod:** one replica and small requests instead of three full replicas. Pods are packed tighter on fewer nodes.
    - The finalizer and `prune: true` make sure namespace resources are removed with the app. Without them, closed PRs leave orphaned workloads running.

    *Not applied:* nightly scale-down of `dev`. Previews already disappear with the PR, and one shared `dev` is cheap enough that a schedule adds more moving parts than it saves. Also, a preview with one replica won't show scaling or failover bugs, so keep one prod-like environment for those tests.
verify:
  static_only: YAML for ArgoCD ApplicationSet, needs a Kubernetes cluster
