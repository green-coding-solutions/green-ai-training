id: gen-1-00276-generation
category: generation
language: javascript
patterns:
- remove-unused-css
messages:
- role: user
  content: |
    hi, i have small raspberry pi that is a gateway for my temperature sensors. it shows a status page in the browser over wifi. i use tailwind but the page is very slow to open on my phone and i dont know what is wrong. i look in the network tab and the css file is very big, like megabytes. i think something wrong in my setup?

    this is my tailwind.config.js

    ```javascript
    module.exports = {
      content: [],
      theme: { extend: {} },
      plugins: [],
    }
    ```

    files are in `public/index.html` and `public/js/app.js`. in app.js i make the rows for each sensor like this:

    ```javascript
    function row(sensor) {
      const color = sensor.online ? 'green' : 'red';
      return `<li class="p-2 rounded bg-${color}-100 text-${color}-800">
        ${sensor.name}: ${sensor.temp} °C
      </li>`;
    }
    ```

    can you write the config and the npm scripts so the css is small? thank you
- role: assistant
  content: |
    The problem is `content: []`. Tailwind builds only the classes it finds in the files listed there. With an empty list, it can't tell what you use, so a dev build ships the full class set. Tell it where your classes are.

    There is a second problem in `app.js`. Tailwind reads your files as plain text. It cannot see `bg-${color}-100`, because the full class name never appears. Once the config is fixed, those two colors would be removed from the CSS and your rows would have no background. Write the full class names instead:

    ```javascript
    // public/js/app.js
    const STATUS_CLASSES = {
      online: 'bg-green-100 text-green-800',
      offline: 'bg-red-100 text-red-800',
    };

    function row(sensor) {
      const status = sensor.online ? STATUS_CLASSES.online : STATUS_CLASSES.offline;
      return `<li class="p-2 rounded ${status}">
        ${sensor.name}: ${sensor.temp} °C
      </li>`;
    }
    ```

    ```javascript
    // tailwind.config.js
    module.exports = {
      content: ['./public/index.html', './public/js/**/*.js'],
      theme: { extend: {} },
      plugins: [],
    }
    ```

    ```json
    {
      "scripts": {
        "css:dev": "tailwindcss -i ./src/input.css -o ./public/css/app.css --watch",
        "css:build": "NODE_ENV=production tailwindcss -i ./src/input.css -o ./public/css/app.css --minify"
      }
    }
    ```

    `src/input.css` needs these three lines:

    ```css
    @tailwind base;
    @tailwind components;
    @tailwind utilities;
    ```

    Run `npm run css:build` before you copy the files to the Pi. Link `public/css/app.css` in `index.html`. If you add a new folder with HTML or JS later, add its path to `content`.

    **Green Notes**
    - **Unused CSS removed by the `content` list** (reduces network): only the classes you use are sent, so the phone downloads and parses far less CSS on every page load.
      Pattern: Remove unused CSS
    - **Full class names in JS** (correctness): this keeps the purge safe. Tailwind can only keep what it can find in the text.
    - **`--minify` on the production build:** removes whitespace and comments from the CSS, so fewer bytes go over wifi.
verify:
  static_only: needs the tailwindcss npm package and a build step
