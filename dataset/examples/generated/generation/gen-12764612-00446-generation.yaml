messages:
- role: user
  content: |
    hello, i need sql for the "Latest from our blog" part on our homepage (postgres). It show 3 newest posts, only the title, a short text, the cover picture, the date and a link to the post.

    the table is like this, sorry its a big one:

    ```sql
    CREATE TABLE posts (
      id            bigint PRIMARY KEY,
      slug          text NOT NULL,
      title         text NOT NULL,
      excerpt       text,
      cover_url     text,
      body_markdown text NOT NULL,
      body_html     text NOT NULL,
      author_id     bigint,
      status        text NOT NULL,   -- 'draft' or 'published'
      published_at  timestamp,
      seo_title     text,
      seo_description text,
      revision_notes text,
      updated_at    timestamp
    );
    ```

    only published post must be show. The homepage is our most visited page so I want it not slow. thank you!
- role: assistant
  content: |
    ```sql
    SELECT id, slug, title, excerpt, cover_url, published_at
    FROM posts
    WHERE status = 'published'
    ORDER BY published_at DESC, id DESC
    LIMIT 3;
    ```

    The `id` is there as a tie-breaker, so two posts with the same `published_at` always come in the same order. Build the link from `slug`.

    **Green Notes**
    - **Select only the needed columns** (reduces E): the card needs six small fields. `body_markdown` and `body_html` hold the full article, so `SELECT *` would read and send them for every homepage view and the page would throw them away. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, naming 10 needed columns used about 5.5× to 7× less energy than `SELECT *`. The saving grows with the size of the columns you skip.
    - **`LIMIT 3`** keeps the result at the three rows the page shows.
- role: user
  content: |
    thanks! and if later i want to show the author name too, can i just add it?
- role: assistant
  content: |
    Yes. Join the author table and add only the name column:

    ```sql
    SELECT p.id, p.slug, p.title, p.excerpt, p.cover_url, p.published_at,
           a.name AS author_name
    FROM posts p
    JOIN authors a ON a.id = p.author_id
    WHERE p.status = 'published'
    ORDER BY p.published_at DESC, p.id DESC
    LIMIT 3;
    ```

    I assumed an `authors` table with `id` and `name`. If `author_id` can be NULL, use `LEFT JOIN` so those posts do not disappear.

    **Green Notes**
    - **Select only the needed columns** (reduces E): add only `a.name`. Writing `p.*` or `a.*` would bring the long article columns back into every homepage query.
- role: user
  content: |
    ok great
- role: assistant
  content: |
    Glad it helps.

    **Green Notes**
    - **Select only the needed columns** (reduces E): when you add more fields to the card later, name each one in the query. Don't switch back to `SELECT *`, so `body_markdown` and `body_html` stay out of the result.
