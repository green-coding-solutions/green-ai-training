messages:
- role: user
  content: |
    I need the HTML for a landing page for our bike repair workshop "Spoke & Chain" in Leipzig. Requirements:

    - Header with logo (`img/logo.svg`, 160x48) and a nav: Services, Prices, Contact.
    - Hero section with one big photo (`img/hero-workshop.jpg`, 1600x900), headline "Your bike, back on the road" and a button "Book a slot" linking to `#contact`.
    - Services section with 3 cards. Each card has a photo (`img/service-tuneup.jpg`, `img/service-brakes.jpg`, `img/service-wheels.jpg`, all 800x600), a title and 2 lines of text.
    - Gallery section "Our workshop" with 8 photos (`img/gallery-1.jpg` to `img/gallery-8.jpg`, all 600x400).
    - Contact section with address and opening hours.
    - Footer.

    Plain HTML, no framework. The page should be accessible and not jump around while loading.
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Spoke &amp; Chain – Bike repair in Leipzig</title>
      <link rel="preload" as="image" href="img/hero-workshop.jpg">
      <style>
        img { max-width: 100%; height: auto; }
        .cards, .gallery { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
      </style>
    </head>
    <body>
      <header>
        <img src="img/logo.svg" alt="Spoke &amp; Chain" width="160" height="48">
        <nav aria-label="Main">
          <a href="#services">Services</a>
          <a href="#prices">Prices</a>
          <a href="#contact">Contact</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <img src="img/hero-workshop.jpg" alt="Mechanic repairing a bike in the workshop" width="1600" height="900" fetchpriority="high">
          <h1>Your bike, back on the road</h1>
          <a class="button" href="#contact">Book a slot</a>
        </section>

        <section id="services">
          <h2>Services</h2>
          <div class="cards">
            <article>
              <img src="img/service-tuneup.jpg" alt="Bike on a repair stand during a tune-up" width="800" height="600" loading="lazy">
              <h3>Tune-up</h3>
              <p>Gears, brakes and chain checked and adjusted.<br>Ready the same day.</p>
            </article>
            <article>
              <img src="img/service-brakes.jpg" alt="Close-up of a disc brake being fitted" width="800" height="600" loading="lazy">
              <h3>Brakes</h3>
              <p>New pads, cables or discs, bled and tested.<br>Rim and disc brakes.</p>
            </article>
            <article>
              <img src="img/service-wheels.jpg" alt="Wheel being trued in a truing stand" width="800" height="600" loading="lazy">
              <h3>Wheels</h3>
              <p>Truing, spokes and new tyres.<br>Tubeless setup too.</p>
            </article>
          </div>
        </section>

        <section id="prices">
          <h2>Prices</h2>
          <!-- add your price list here -->
        </section>

        <section id="gallery">
          <h2>Our workshop</h2>
          <div class="gallery">
            <img src="img/gallery-1.jpg" alt="Workshop front with bikes outside" width="600" height="400" loading="lazy">
            <img src="img/gallery-2.jpg" alt="Tool wall with wrenches" width="600" height="400" loading="lazy">
            <img src="img/gallery-3.jpg" alt="Row of bikes waiting for pickup" width="600" height="400" loading="lazy">
            <img src="img/gallery-4.jpg" alt="Spare parts shelf" width="600" height="400" loading="lazy">
            <img src="img/gallery-5.jpg" alt="Two mechanics at the work stands" width="600" height="400" loading="lazy">
            <img src="img/gallery-6.jpg" alt="Customer lounge with coffee machine" width="600" height="400" loading="lazy">
            <img src="img/gallery-7.jpg" alt="Wheel truing stand in use" width="600" height="400" loading="lazy">
            <img src="img/gallery-8.jpg" alt="Workshop at dusk with lights on" width="600" height="400" loading="lazy">
          </div>
        </section>

        <section id="contact">
          <h2>Contact</h2>
          <address>
            Spoke &amp; Chain<br>
            Example Street 12, 04109 Leipzig
          </address>
          <p>Mon–Fri 9:00–18:00<br>Sat 10:00–14:00</p>
        </section>
      </main>

      <footer>
        <p>&copy; 2026 Spoke &amp; Chain</p>
      </footer>
    </body>
    </html>
    ```

    Fill in the real street, prices and opening hours. The `width` and `height` attributes on every image reserve space, so the layout does not jump while images load. The alt texts are placeholders: adjust them to match your real photos.

    **Green Notes**
    - **Lazy-load images** (reduces network, E): the 3 service photos and the 8 gallery photos are below the fold, so they get `loading="lazy"` and load only if a visitor scrolls to them. In Green Metrics Tool browser benchmarks, an article with 15 photos loaded without scrolling used about 12% less CPU energy with lazy loading (~325 J vs ~368 J for 20 loads). When visitors scrolled to the end, there was no difference.
    - **Above the fold stays eager**: the logo and the hero photo have no `loading="lazy"`, and the hero has `fetchpriority="high"` plus a preload. Lazy-loading the first visible image would delay it.
