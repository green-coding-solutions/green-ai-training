  content: |
    Webhook inspector page in our API console. Need the "waiting for incoming request" indicator: three dots that pulse one after another. Markup is already there:

    ```html
    <span class="waiting"><i></i><i></i><i></i></span>
    ```

    CSS only, no explanation needed.
- role: assistant
  content: |-
    ```css
    .waiting {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .waiting i {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.25;
      transform: scale(0.8);
      animation: waiting-dot 1.2s ease-in-out infinite;
    }

    .waiting i:nth-child(2) { animation-delay: 0.2s; }
    .waiting i:nth-child(3) { animation-delay: 0.4s; }

    @keyframes waiting-dot {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40%           { opacity: 1;    transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .waiting i { animation: none; opacity: 0.6; }
    }
    ```

    **Green Notes**
    - **CSS keyframes instead of a JS loop** (reduces E): the browser runs the animation itself, so no script wakes up on every frame. In Green Metrics Tool browser benchmarks, a 20-second animation used about 145 J with CSS `@keyframes` against about 161 J with `requestAnimationFrame` style updates, roughly 10% less.
    - **Only `opacity` and `transform` are animated**, and the stagger comes from `animation-delay`. No timers or per-dot state are needed.
