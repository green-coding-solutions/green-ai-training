id: gen-2-00316-generation
category: generation
language: html
patterns:
- remove-unused-css
facts:
- F-UNUSED-CSS
messages:
- role: user
  content: |
    hi, I am backend dev, not frontend, sorry if this is a basic question. Our Flask REST API for meeting room bookings ("roombook") has an HTML page at `/`. When people open the API URL in the browser, they see the list of endpoints and a link to the Swagger docs. I made it with Bootstrap from a CDN because I don't really know CSS:

    ```html
    <head>
      <meta charset="utf-8">
      <title>roombook API</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="container py-4">
      <h1 class="h3">roombook API</h1>
      <table class="table table-sm">
      ...
    ```

    Now Lighthouse in Chrome shows red on "Reduce unused CSS" and I don't understand what is wrong. I only use a table and some colored badges for the HTTP methods. Can you write the template new so it doesn't have this problem? The view passes `endpoints` (list of dicts with `method`, `path`, `summary`), `version` and `docs_url`. Methods are GET, POST, PATCH, DELETE.
- role: assistant
  content: |
    Nothing is broken. Lighthouse flags the page because it downloads the whole Bootstrap stylesheet, but it only uses the table and badge styles. The fix is to ship only the CSS the page needs. Here is the template with a small inline stylesheet and no Bootstrap link. Your Flask view can stay the same:

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>roombook API {{ version }}</title>
      <style>
        body {
          max-width: 56rem;
          margin: 0 auto;
          padding: 2rem 1rem;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          line-height: 1.5;
          color: #1f2328;
        }
        h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
        .meta { margin: 0 0 1.5rem; color: #59636e; }
        a { color: #0969da; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid #d1d9e0; }
        th { font-size: .875rem; color: #59636e; }
        code, .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        code { font-size: .875rem; }
        .badge {
          display: inline-block;
          min-width: 4.5em;
          padding: .1rem .4rem;
          border-radius: .25rem;
          font-size: .75rem;
          font-weight: 600;
          text-align: center;
          color: #fff;
        }
        .method-get { background: #1a7f37; }
        .method-post { background: #0969da; }
        .method-patch { background: #9a6700; }
        .method-delete { background: #cf222e; }
      </style>
    </head>
    <body>
      <h1>roombook API</h1>
      <p class="meta">Version {{ version }} · <a href="{{ docs_url }}">Interactive docs</a></p>
      <table>
        <thead>
          <tr><th>Method</th><th>Path</th><th>Description</th></tr>
        </thead>
        <tbody>
          {% for ep in endpoints %}
          <tr>
            <td><span class="badge method-{{ ep.method | lower }}">{{ ep.method }}</span></td>
            <td><code>{{ ep.path }}</code></td>
            <td>{{ ep.summary }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </body>
    </html>
    ```

    **Green Notes**
    - **Remove unused CSS** (reduces network): the page now carries only the few rules it uses. This also removes the request to the CDN. Be realistic about the gain. In Green Metrics Tool page-load measurements, cutting a 16 KB stylesheet with mostly unused rules down to 0.75 KB changed client CPU energy by about 2%, which is within measurement noise. What you save is bytes and a request on real networks, not CPU.
    - *Not applied:* PurgeCSS or a CSS build step. For one small page, writing the rules by hand is simpler and gives the same result.
verify:
  static_only: Jinja2 HTML template rendered by Flask
