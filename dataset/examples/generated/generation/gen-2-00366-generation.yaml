id: gen-2-00366-generation
category: generation
language: python
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    py func: zigbee cluster id -> name. 0x0001 power, 0x0006 on_off, 0x0008 level, 0x0402 temperature, 0x0405 humidity, 0x0406 occupancy, else "unknown". called on every frame on the gateway
- role: assistant
  content: |
    ```python
    _CLUSTER_NAMES = {
        0x0001: "power",
        0x0006: "on_off",
        0x0008: "level",
        0x0402: "temperature",
        0x0405: "humidity",
        0x0406: "occupancy",
    }


    def cluster_name(cluster_id: int) -> str:
        """Map a Zigbee cluster id to a short name, or 'unknown' if it is not listed."""
        return _CLUSTER_NAMES.get(cluster_id, "unknown")
    ```

    **Green Notes**
    - **Simple equality conditions** (reduces E): every cluster is matched by its exact id in one lookup. There are no range checks or bit masks to evaluate on each frame. In Green Metrics Tool micro-benchmarks, 10,000,000 classifications with simple equality branches used ~46 J, compared with ~54 J for complex range/modulo conditions. That is about 16% less.

    *Not applied:* `match`/`case`. In the same benchmark, `match` and `if/elif` with the same conditions differed by about 1%, which is noise.

    The table expects an `int`. If your frame parser delivers ids as hex strings, convert them once with `int(s, 16)` while parsing.
verify:
  test: |-
    assert cluster_name(0x0001) == "power"
    assert cluster_name(0x0006) == "on_off"
    assert cluster_name(0x0008) == "level"
    assert cluster_name(0x0402) == "temperature"
    assert cluster_name(0x0405) == "humidity"
    assert cluster_name(0x0406) == "occupancy"
    assert cluster_name(0x0300) == "unknown"
    assert cluster_name(0) == "unknown"
    assert cluster_name(1030) == "occupancy"
    print("ok")
