id: gen-1-00081-generation
category: generation
language: css
patterns:
- minify-assets
- system-fonts-and-deps
facts:
- F-MINIFY
- F-FONTS
messages:
- role: user
  content: |
    I need a stylesheet for the results page of our molecular dynamics runs. The HTML is generated by a Python script, so I only need the CSS. Requirements:

    - one file, `results.css`, no build step, our lab's nginx serves it as is (about 20 people use it, internal only)
    - a row of summary cards at the top (`.card`, with `.card__label` and `.card__value`)
    - a results table (`table.runs`) with a sticky header, numbers right-aligned so decimals line up
    - status badges: `.badge--converged` (green), `.badge--diverged` (red), `.badge--running` (amber)
    - light and dark mode following the OS setting
    - printable: no cards background, no sticky header on paper

    Also, should I minify it before I put it on the server? Someone said that's good practice.
- role: assistant
  content: |
    ```css
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --line: #d1d9e0;
      --card: #f6f8fa;
      --ok: #1a7f37;
      --bad: #cf222e;
      --wait: #9a6700;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --line: #30363d;
        --card: #161b22;
        --ok: #3fb950;
        --bad: #f85149;
        --wait: #d29922;
      }
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      line-height: 1.5;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .card {
      padding: 0.75rem 1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .card__label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .card__value {
      display: block;
      font-size: 1.5rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    table.runs {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    table.runs th,
    table.runs td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    table.runs th {
      position: sticky;
      top: 0;
      background: var(--bg);
    }

    table.runs td.num,
    table.runs th.num {
      text-align: right;
      font-family: var(--font-mono);
    }

    .badge {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    .badge--converged { color: var(--ok); }
    .badge--diverged { color: var(--bad); }
    .badge--running { color: var(--wait); }

    @media print {
      body { padding: 0; background: #fff; color: #000; }
      .card { background: none; }
      table.runs th { position: static; background: none; }
    }
    ```

    Put `class="num"` on the numeric `<th>` and `<td>` cells in your generator. The mono font plus `tabular-nums` makes the decimals line up.

    **Green Notes**
    - **System font stack** (reduces network, E): no font files to download, and text renders at once. A web font would be the largest part of this page's weight.
    - *Not applied:* minification. For a stylesheet this small, minifying saves bytes on the network, not measurable CPU. In Green Metrics Tool browser benchmarks, a minified build used only about 2% less client CPU energy than the unminified one, which is within measurement noise. On a lab intranet, a build step would cost you more than it saves. Keep the readable file. Minify later only if the file grows a lot or you serve it over slow links.
verify:
  static_only: CSS
