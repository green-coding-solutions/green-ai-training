- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    # Usage: check_hosts.sh <file>
    set -eu

    if [ "$#" -ne 1 ] || [ ! -r "$1" ]; then
      echo 'usage: check_hosts.sh <file>' >&2
      exit 2
    fi

    awk \
      -v sep=':' \
      -v prefix='line ' \
      -v no_port=': no port' \
      -v bad_port=': bad port' \
      -v ok_label='ok: ' \
      -v bad_label=', bad: ' '
      length($0) == 0 { next }
      index($0, sep) == 0 {
        print prefix NR no_port
        bad++
        next
      }
      {
        port = $0
        sub(/^.*:/, "", port)
        if (port !~ /^[0-9]+$/ || length(port) > 5 || port + 0 < 1 || port + 0 > 65535) {
          print prefix NR bad_port
          bad++
        } else {
          ok++
        }
      }
      END { print ok_label (ok + 0) bad_label (bad + 0) }
    ' "$1"
    ```

    The port is taken after the last colon, so `[::1]:8080` style entries work too. Line numbers count empty lines, so they match your editor.

    **Green Notes**
    - **One `awk` pass instead of a shell loop with subprocesses** (reduces E): a `while read` loop that calls `cut`, `expr` or `grep` per line starts several processes for each of the 40k lines. In Green Metrics Tool micro-benchmarks on a 20,000-line log, a loop with about 10 processes per line used ~1302 J. The same work with shell builtins used ~4.3 J, and one `awk` pass used ~1.0 J.
    - *Not applied:* a pure builtin loop (`read -r`, `case`, `$(( ))`) would also work and is fine for a few hundred lines. For 40k lines the single `awk` pass is simpler and cheaper.
