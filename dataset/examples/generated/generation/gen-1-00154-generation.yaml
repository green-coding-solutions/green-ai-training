id: gen-1-00154-generation
category: generation
language: javascript
patterns:
- deque-or-append
messages:
- role: user
  content: |
    need a frame buffer for our inference service. keep last 32 frames, model wants them newest first
- role: assistant
  content: |
    ```javascript
    class FrameWindow {
      constructor(size = 32) {
        if (!Number.isInteger(size) || size < 1) {
          throw new RangeError('size must be a positive integer');
        }
        this.size = size;
        this.buf = new Array(size);
        this.head = 0; // next write position
        this.count = 0;
      }

      push(frame) {
        this.buf[this.head] = frame; // overwrites the oldest frame when full
        this.head = (this.head + 1) % this.size;
        if (this.count < this.size) this.count++;
      }

      // Newest frame at index 0, as the model expects.
      newestFirst() {
        const out = new Array(this.count);
        for (let i = 0; i < this.count; i++) {
          out[i] = this.buf[(this.head - 1 - i + this.size) % this.size];
        }
        return out;
      }
    }
    ```

    **Green Notes**
    - **Ring buffer instead of `unshift()` + `pop()`** (reduces E): each `push` is one write and no other frame moves. `unshift` shifts every stored frame on every call.
    - **Newest-first order is built on read:** `newestFirst()` copies the frames once per inference call. If you call it less often than you push, you do less work than keeping the array in reverse order all the time.
    - *Not applied:* a linked list or `Array.shift()` queue. With a fixed window, the ring buffer needs no allocation per frame.
    - At 32 frames the difference is small. It grows with window size and frame rate.
verify:
  test: |-
    import assert from 'node:assert';
    const w = new FrameWindow(3);
    assert.deepStrictEqual(w.newestFirst(), []);
    w.push(1); w.push(2);
    assert.deepStrictEqual(w.newestFirst(), [2, 1]);
    w.push(3); w.push(4); w.push(5);
    assert.deepStrictEqual(w.newestFirst(), [5, 4, 3]);
    const one = new FrameWindow(1);
    one.push('a'); one.push('b');
    assert.deepStrictEqual(one.newestFirst(), ['b']);
    assert.throws(() => new FrameWindow(0), RangeError);
    const big = new FrameWindow();
    for (let i = 0; i < 100; i++) big.push(i);
    assert.strictEqual(big.newestFirst().length, 32);
    assert.strictEqual(big.newestFirst()[0], 99);
    assert.strictEqual(big.newestFirst()[31], 68);
