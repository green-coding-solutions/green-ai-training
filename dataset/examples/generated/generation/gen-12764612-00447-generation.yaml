- role: assistant
  content: |
    ```python
    import math

    def wait_scores(wait_seconds, policy):
        log1p = math.log1p
        scale = policy.scale
        cap = policy.cap
        weight = policy.weight
        return [
            min(log1p(max(w, 0) / scale), cap) * weight
            for w in wait_seconds
        ]
    ```

    **Green Notes**
    - **Hoist loop-invariant lookups** (reduces E): `math.log1p`, `policy.scale`, `policy.cap` and `policy.weight` are looked up once, not once per job. With millions of waits per run, that removes several attribute lookups per element. The gain is small. In Green Metrics Tool micro-benchmarks, caching `math.sqrt` in a local before a 10,000,000-iteration loop saved about 4-5%. It only matters because this loop runs on every job.
    - **List comprehension** keeps the per-element work in one tight loop, with no repeated `append` calls.

    The code assumes `policy` does not change while the function runs. If another thread can change it, read the values once per batch, as done here.
verify:
  test: |-
    from types import SimpleNamespace
    p = SimpleNamespace(scale=30.0, cap=3.0, weight=2.0)
    r = wait_scores([0, -5, 30, 1e9], p)
    assert len(r) == 4
    assert r[0] == 0
    assert r[1] == 0
    assert abs(r[2] - math.log1p(1.0) * 2.0) < 1e-12
    assert r[3] == 6.0
    assert wait_scores([], p) == []
