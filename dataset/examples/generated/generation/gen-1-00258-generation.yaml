id: gen-1-00258-generation
category: generation
language: css
patterns:
- modern-image-formats
facts:
- F-IMGENC
messages:
- role: user
  content: |
    Hi, I make a small demo page for my image classifier (upload a photo, it shows the label). I need CSS for the top part: big background photo with the title on it, and 3 example cards under it that each have a picture as background. I have hero.jpg and cat.jpg, dog.jpg, bird.jpg in the img folder. I am not sure how to do the background so it looks good on phone and laptop. Can you write it?
- role: assistant
  content: |
    Here is the CSS. Each background lists AVIF, then WebP, then JPEG. The browser takes the first format it can read.

    ```css
    .hero {
      min-height: 60vh;
      display: grid;
      place-items: center;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      background-color: #222;
      background-size: cover;
      background-position: center;
      /* Fallback for old browsers */
      background-image: url("img/hero.jpg");
      /* Browsers that know image-set() with type() pick the first format they support */
      background-image: image-set(
        url("img/hero.avif") type("image/avif"),
        url("img/hero.webp") type("image/webp"),
        url("img/hero.jpg") type("image/jpeg")
      );
    }

    .examples {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    .card {
      aspect-ratio: 4 / 3;
      border-radius: 8px;
      background-color: #ddd;
      background-size: cover;
      background-position: center;
    }

    .card--cat {
      background-image: url("img/cat.jpg");
      background-image: image-set(
        url("img/cat.avif") type("image/avif"),
        url("img/cat.webp") type("image/webp"),
        url("img/cat.jpg") type("image/jpeg")
      );
    }

    .card--dog {
      background-image: url("img/dog.jpg");
      background-image: image-set(
        url("img/dog.avif") type("image/avif"),
        url("img/dog.webp") type("image/webp"),
        url("img/dog.jpg") type("image/jpeg")
      );
    }

    .card--bird {
      background-image: url("img/bird.jpg");
      background-image: image-set(
        url("img/bird.avif") type("image/avif"),
        url("img/bird.webp") type("image/webp"),
        url("img/bird.jpg") type("image/jpeg")
      );
    }
    ```

    Create the extra files once, on your machine, before you deploy:

    ```bash
    for f in hero cat dog bird; do
      avifenc img/$f.jpg img/$f.avif
      cwebp -q 80 img/$f.jpg -o img/$f.webp
    done
    ```

    `background-size: cover` and `aspect-ratio` make the layout fit phone and laptop. You do not need media queries for that.

    **Green Notes**
    - **Modern image formats** (reduces network): AVIF and WebP files are usually much smaller than the same photo as JPEG, so every visitor downloads fewer bytes. The JPEG line stays as a fallback, so nothing breaks in old browsers.
      Pattern: Serve images in modern formats
    - **Convert at build time, not per request** (reduces E): in Green Metrics Tool micro-benchmarks, encoding 50 BMP images to AVIF cost about 7× the CPU energy of encoding them to JPG. Run the conversion once and serve the files. Do not convert on every upload or request.
    - **Size the source files for the display**: a hero image rarely needs to be wider than about 2000 px. The cards are small, so their files can be much smaller than the hero.
    - *Not applied:* `<picture>` or `srcset`. They are for `<img>` tags. Backgrounds in CSS are fine with `image-set()` here.
verify:
  static_only: CSS only, needs a browser and image files to render
