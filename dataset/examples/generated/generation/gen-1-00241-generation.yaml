id: gen-1-00241-generation
category: generation
language: bash
patterns:
- bash-builtins
- bash-quoting
messages:
- role: user
  content: |
    bash script to make run dirs run_0001...run_5000 each with params.cfg (temperature, seed) for our MD sims
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    n=${1:-5000}
    base=${2:-runs}

    # Build all directory names first, then create them with one mkdir call.
    dirs=()
    for ((i = 1; i <= n; i++)); do
      printf -v id '%04d' "$i"
      dirs+=("$base/run_$id")
    done
    mkdir -p -- "${dirs[@]}"

    # Write one config per run. Everything here is a shell builtin.
    for ((i = 1; i <= n; i++)); do
      printf -v id '%04d' "$i"
      temperature=$((280 + (i % 20) * 5))   # 280..375 K in steps of 5
      seed=$((i * 7919 % 100003))
      printf 'temperature=%d\nseed=%d\n' "$temperature" "$seed" > "$base/run_$id/params.cfg"
    done

    echo "created $n runs in $base"
    ```

    Run it as `./make_runs.sh 5000 runs`. The temperature and seed formulas are placeholders. Swap in your own sweep.

    **Green Notes**
    - **Builtins instead of forks** (reduces E): `printf -v`, `$(( ))` and the `for ((...))` loop all run inside the shell. The usual `$(printf ...)`, `$(seq ...)` or `$(expr ...)` would start a new process for every run, 5000 times or more.
    - **One `mkdir -p` for all directories** (reduces E): one process start instead of 5000.
    - **Single quotes for literals:** the `printf` format strings and `'%04d'` need no expansion, so they use single quotes. Variables stay in double quotes.
    - *Not applied:* `xargs` batching. For about 5000 names the single `mkdir` call is well below the argument-length limit. For several hundred thousand runs, pipe the names through `printf '%s\0' ... | xargs -0 mkdir -p --` instead.
verify:
  static_only: bash script that creates directories and files on disk
