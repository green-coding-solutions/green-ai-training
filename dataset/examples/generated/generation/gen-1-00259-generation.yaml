id: gen-1-00259-generation
category: generation
language: sql
patterns:
- select-columns
facts:
- F-PG-SELECT
messages:
- role: user
  content: |
    hello, i need a sql query for the "similar products" block on our product page (Postgres). The REST endpoint /products/:id/related give back 8 products from the same category, without the product that the customer is looking at now. only products that are in stock, and the best sellers first. The frontend show name, price, small picture and a link to the product.

    table products have around 50 columns, for example id, category_id, slug, name, price_cents, thumbnail_url, in_stock, sales_30d, description (long html), specs (big json), seo_text, and many more. Thank you!
- role: assistant
  content: |
    Here is the query. The values `12` (category) and `345` (current product) are examples. Pass them as bound parameters from your endpoint.

    ```sql
    SELECT id, slug, name, price_cents, thumbnail_url
    FROM products
    WHERE category_id = 12
      AND id <> 345
      AND in_stock
    ORDER BY sales_30d DESC, id
    LIMIT 8;
    ```

    `id` in the `ORDER BY` makes the order stable when two products have the same sales number.

    **Green Notes**
    - **Select only the 5 needed columns** (reduces E and network): the block needs `id`, `slug`, `name`, `price_cents` and `thumbnail_url` for the link, text, price and picture. `SELECT *` would read and send `description`, `specs` and `seo_text` for all 8 rows on every product page view, and the frontend would throw them away. In Green Metrics Tool micro-benchmarks on a wide PostgreSQL table with large text columns, `SELECT *` used about 7× the energy of naming the needed columns. The saving grows with the size of the skipped columns.
    - **`LIMIT 8`** makes the database return only the rows you show.
verify:
