    html page for terraform plan summary. counts of add/change/destroy + table of changed resources. we open it from the CI artifacts
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Terraform plan summary</title>
      <style>
        body {
          margin: 0;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          line-height: 1.5;
          color: #1f2328;
          background: #fff;
        }
        main { max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem; }
        .counts { display: flex; gap: 1rem; margin: 1.5rem 0; padding: 0; list-style: none; }
        .counts li { flex: 1; padding: 0.75rem 1rem; border-radius: 6px; background: #f6f8fa; }
        .counts strong { display: block; font-size: 1.75rem; }
        .add strong { color: #1a7f37; }
        .change strong { color: #9a6700; }
        .destroy strong { color: #cf222e; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #d0d7de; }
        code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
      </style>
    </head>
    <body>
      <main>
        <h1>Terraform plan summary</h1>
        <p>Workspace: <code>production</code></p>

        <ul class="counts">
          <li class="add"><strong>3</strong> to add</li>
          <li class="change"><strong>2</strong> to change</li>
          <li class="destroy"><strong>1</strong> to destroy</li>
        </ul>

        <table>
          <thead>
            <tr><th>Action</th><th>Resource</th><th>Type</th></tr>
          </thead>
          <tbody>
            <tr><td>add</td><td><code>aws_s3_bucket.logs</code></td><td>aws_s3_bucket</td></tr>
            <tr><td>add</td><td><code>aws_iam_role.runner</code></td><td>aws_iam_role</td></tr>
            <tr><td>add</td><td><code>aws_security_group.runner</code></td><td>aws_security_group</td></tr>
            <tr><td>change</td><td><code>aws_instance.api</code></td><td>aws_instance</td></tr>
            <tr><td>change</td><td><code>aws_lb_listener.https</code></td><td>aws_lb_listener</td></tr>
            <tr><td>destroy</td><td><code>aws_instance.legacy_worker</code></td><td>aws_instance</td></tr>
          </tbody>
        </table>
      </main>
    </body>
    </html>
    ```

    Fill the counts and rows from your plan output (for example from `terraform show -json`) when your CI job generates the file.

    **Green Notes**
    - **System font stack** (reduces network and E): no font files to download or decode, which also helps because the artifact page loads cold each time. In Green Metrics Tool browser benchmarks, the system font stack used ~410 J for 30 cold page loads, against ~556 J with six TTF files, about 26% less.
    - The page is one self-contained file with inline CSS. There are no extra requests, and no scripts for such a small page.
