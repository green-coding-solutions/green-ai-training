id: gen-1-00038-generation
category: generation
language: python
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    py func: 3 logits from our sentiment model -> "negative" / "neutral" / "positive"
- role: assistant
  content: |
    ```python
    LABELS = {0: "negative", 1: "neutral", 2: "positive"}


    def predict_label(logits):
        best = max(range(len(logits)), key=logits.__getitem__, default=-1)
        return LABELS.get(best, "unknown")
    ```

    Example:

    ```python
    print(predict_label([0.2, 0.1, 2.3]))  # positive
    print(predict_label([]))               # unknown
    ```

    It works with lists and NumPy arrays. On a tie, the first index wins, like `argmax`.

    **Green Notes**
    - **Dict lookup instead of an if/elif chain** (reduces E): the class index is one equality lookup, so there are no stacked comparisons or range guards on the per-prediction path. In Green Metrics Tool micro-benchmarks (10,000,000 classifications), simple equality branches used about 16% less CPU energy than complex range/modulo conditions ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=123676d7-2121-4b9d-b78e-e065836fc608,a7780e2a-2934-4d26-b2a9-2cda7848adc1)).
    - **Table built once at module level**: nothing is rebuilt per call.
    - *Not applied:* `np.argmax` or `match`. Three values don't need NumPy, and `match` would not change the energy use.
verify:
  green_block: 0
  test: |-
    assert predict_label([0.1, 0.2, 2.0]) == "positive"
    assert predict_label([3, 0, 1]) == "negative"
    assert predict_label([0, 1, 0]) == "neutral"
    assert predict_label([1, 1, 0]) == "negative"
    assert predict_label([]) == "unknown"
