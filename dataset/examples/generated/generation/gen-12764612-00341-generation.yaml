messages:
- role: user
  content: |
    hello, I need html page for our nightly load report. my python step already make the pictures in folder `charts/`, I only need the page. On top is the table with summary (tables loaded, rows in, rows rejected, duration). Then one big chart `charts/rows_per_table.png` (1200x400). Under it we have 8 small histogram of the columns, `charts/hist_order_total.png`, `hist_qty.png`, `hist_discount.png`, `hist_ship_days.png`, `hist_unit_price.png`, `hist_tax.png`, `hist_weight.png`, `hist_age_days.png`, every one 400x300. Colleagues open it in the morning, most of the time they look only to the summary and the big chart, sometimes they go down to see the histograms. Thank you!
- role: assistant
  content: |-
    Here is the page. I left the numbers in the summary table as placeholders for your Python step to fill in.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Nightly load report</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 1240px; padding: 0 1rem; }
        table { border-collapse: collapse; margin-bottom: 1.5rem; }
        th, td { border: 1px solid #ccc; padding: .4rem .8rem; text-align: left; }
        img { max-width: 100%; height: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 1rem; }
        figure { margin: 0; }
        figcaption { font-size: .9rem; color: #555; }
      </style>
    </head>
    <body>
      <h1>Nightly load report</h1>

      <table>
        <tr><th>Tables loaded</th><td>{{ tables_loaded }}</td></tr>
        <tr><th>Rows in</th><td>{{ rows_in }}</td></tr>
        <tr><th>Rows rejected</th><td>{{ rows_rejected }}</td></tr>
        <tr><th>Duration</th><td>{{ duration }}</td></tr>
      </table>

      <h2>Rows per table</h2>
      <img src="charts/rows_per_table.png" width="1200" height="400"
           alt="Rows loaded per table" fetchpriority="high">

      <h2>Column histograms</h2>
      <div class="grid">
        <figure>
          <img src="charts/hist_order_total.png" width="400" height="300" loading="lazy" decoding="async" alt="Histogram of order_total">
          <figcaption>order_total</figcaption>
        </figure>
        <figure>
          <img src="charts/hist_qty.png" width="400" height="300" loading="lazy" decoding="async" alt="Histogram of qty">
          <figcaption>qty</figcaption>
        </figure>
        <figure>
          <img src="charts/hist_discount.png" width="400" height="300" loading="lazy" decoding="async" alt="Histogram of discount">
          <figcaption>discount</figcaption>
        </figure>
        <figure>
          <img src="charts/hist_ship_days.png" width="400" height="300" loading="lazy" decoding="async" alt="Histogram of ship_days">
          <figcaption>ship_days</figcaption>
        </figure>
        <figure>
          <img src="charts/hist_unit_price.png" width="400" height="300" loading="lazy" decoding="async" alt="Histogram of unit_price">
          <figcaption>unit_price</figcaption>
        </figure>
        <figure>
          <img src="charts/hist_tax.png" width="400" height="300" loading="lazy" decoding="async" alt="Histogram of tax">
          <figcaption>tax</figcaption>
        </figure>
        <figure>
          <img src="charts/hist_weight.png" width="400" height="300" loading="lazy" decoding="async" alt="Histogram of weight">
          <figcaption>weight</figcaption>
        </figure>
        <figure>
          <img src="charts/hist_age_days.png" width="400" height="300" loading="lazy" decoding="async" alt="Histogram of age_days">
          <figcaption>age_days</figcaption>
        </figure>
      </div>
    </body>
    </html>
    ```

    **Green Notes**
    - **Lazy-load the histograms** (reduces E and network): they are below the fold and most readers never scroll to them, so the browser skips those downloads and decodes. In Green Metrics Tool micro-benchmarks, an image-heavy article used about 12% less client energy on page loads without scrolling. When the reader scrolled to the end, there was no difference. So the saving depends on how your colleagues really use the page.
    - **The big chart stays eager:** it is above the fold, so it has no `loading="lazy"`. It gets `fetchpriority="high"` so it shows first.
    - **Width and height on every image:** the browser reserves the space, so the page does not jump when a lazy histogram arrives.
