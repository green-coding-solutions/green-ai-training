id: gen-1-00333-generation
category: generation
language: bash
patterns:
- bash-builtins
messages:
- role: user
  content: |
    bash: read coupons.txt (one code per line, may have CRLF and stray spaces), uppercase it, accept only ^[A-Z0-9]{4}-[A-Z0-9]{6}$. valid codes to stdout, invalid ones to stderr with the line number. file is ~50k lines after the campaigns. bash 4+, nothing else installed on the box
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    file=${1:?usage: $0 coupons.txt}
    re='^[A-Z0-9]{4}-[A-Z0-9]{6}$'
    n=0

    while IFS= read -r line || [[ -n $line ]]; do
      ((++n))
      line=${line%$'\r'}                              # strip CR
      line=${line#"${line%%[![:space:]]*}"}           # trim leading space
      line=${line%"${line##*[![:space:]]}"}           # trim trailing space
      if [[ -z $line ]]; then
        continue                                      # skip blank lines
      fi
      code=${line^^}                                  # uppercase
      if [[ $code =~ $re ]]; then
        printf '%s\n' "$code"
      else
        printf 'line %d: invalid code: %s\n' "$n" "$line" >&2
      fi
    done < "$file"
    ```

    Blank lines are skipped, but they still count toward the line numbers.

    **Green Notes**
    - **Shell builtins instead of per-line subprocesses** (reduces E): CR removal, trimming, uppercasing and the format check use parameter expansion and `[[ =~ ]]`. The usual `echo "$l" | tr ... | sed ... | grep -E ...` form would fork several processes for each of the 50k lines. This version forks none.
    - **One open file descriptor** (reduces E): the file is redirected into the loop once, so there is no per-line `cat` or `head`.
    - *Not applied:* a single `awk` pass. For millions of lines it would beat a bash `while read` loop. At 50k lines the builtin version is fine and needs no extra tools.
verify:
  static_only: bash script, no python harness; behavior checked by reading
