messages:
- role: user
  content: |
    hi, i need python function for our detector analysis. we have events from the detector, every event is a dict with "run" and "lumi" (both integer) and other fields like pt and eta. we have a file good_lumis.csv with header run,lumi, it is the list of good data taking periods, around 60k lines. we have about 5 milion events per job and need to keep only the events where (run, lumi) is in this file. order of events must stay same. thank you!
- role: assistant
  content: |-
    ```python
    import csv


    def load_good_lumis(path):
        """Read good_lumis.csv (header: run,lumi) into a set of (run, lumi) pairs."""
        with open(path, newline="") as f:
            return {(int(row["run"]), int(row["lumi"])) for row in csv.DictReader(f)}


    def select_good_events(events, good_lumis):
        """Yield only the events whose (run, lumi) is in good_lumis, in input order."""
        for ev in events:
            if (ev["run"], ev["lumi"]) in good_lumis:
                yield ev
    ```

    Use it like this:

    ```python
    good = load_good_lumis("good_lumis.csv")
    for ev in select_good_events(events, good):
        ...
    ```

    `select_good_events` is a generator, so the 5 million events are not copied into a second list. You can loop over the result only once. Use `list(...)` if you need it twice.

    **Green Notes**
    - **Set for repeated membership tests** (reduces E): the file is read once into a set of `(run, lumi)` tuples, so each of the 5 million checks is O(1) instead of a scan over up to 60k list entries. Building the set costs O(n) once, which only pays off because you look up many times. In Green Metrics Tool micro-benchmarks, a single membership test on a 10,000,000-element list used ~6.9 J, and converting it to a set first and testing once used ~10.5 J. With one lookup, keep the list. With millions of lookups, use the set.
    - **Lazy generator** (reduces M): events are filtered one by one, so memory does not grow with the number of events.
    - Duplicate lines in the CSV collapse into one set entry. This does not change which events are kept.
