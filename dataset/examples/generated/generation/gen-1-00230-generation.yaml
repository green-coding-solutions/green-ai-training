id: gen-1-00230-generation
category: generation
language: typescript
patterns:
- dom-size
messages:
- role: user
  content: |
    Batch inference job writes up to ~80k rows to a JSON file: `{ id, label, confidence, latencyMs }`. I need a TS component for our internal review page. Vanilla DOM, no framework. Rows are fixed height, 28px. No sorting needed. Just the code.
- role: assistant
  content: |
    ```ts
    export interface Prediction {
      id: string;
      label: string;
      confidence: number;
      latencyMs: number;
    }

    const ROW_HEIGHT = 28;
    const OVERSCAN = 8;

    export function mountPredictionTable(
      container: HTMLElement,
      rows: readonly Prediction[],
    ): () => void {
      container.style.overflowY = "auto";

      const spacer = document.createElement("div");
      spacer.style.position = "relative";
      spacer.style.height = `${rows.length * ROW_HEIGHT}px`;
      container.replaceChildren(spacer);

      const pool: HTMLDivElement[] = [];
      let rafId = 0;

      function createRow(): HTMLDivElement {
        const el = document.createElement("div");
        el.style.cssText =
          `position:absolute;left:0;right:0;top:0;height:${ROW_HEIGHT}px;` +
          "display:grid;grid-template-columns:2fr 2fr 1fr 1fr;align-items:center";
        for (let c = 0; c < 4; c++) el.appendChild(document.createElement("span"));
        spacer.appendChild(el);
        return el;
      }

      function render(): void {
        rafId = 0;
        const first = Math.max(0, Math.floor(container.scrollTop / ROW_HEIGHT) - OVERSCAN);
        const span = Math.ceil(container.clientHeight / ROW_HEIGHT) + OVERSCAN * 2;
        const count = Math.max(0, Math.min(rows.length - first, span));

        while (pool.length < count) pool.push(createRow());

        for (let i = 0; i < pool.length; i++) {
          const el = pool[i];
          if (i >= count) {
            el.style.display = "none";
            continue;
          }
          const row = rows[first + i];
          const cells = el.children;
          cells[0].textContent = row.id;
          cells[1].textContent = row.label;
          cells[2].textContent = row.confidence.toFixed(3);
          cells[3].textContent = `${row.latencyMs} ms`;
          el.style.display = "grid";
          el.style.transform = `translateY(${(first + i) * ROW_HEIGHT}px)`;
        }
      }

      function onScroll(): void {
        if (rafId === 0) rafId = requestAnimationFrame(render);
      }

      container.addEventListener("scroll", onScroll, { passive: true });
      render();

      return () => {
        container.removeEventListener("scroll", onScroll);
        if (rafId !== 0) cancelAnimationFrame(rafId);
        container.replaceChildren();
      };
    }
    ```

    ```ts
    // usage
    const res = await fetch("/results/batch-0412.json");
    const rows: Prediction[] = await res.json();
    const unmount = mountPredictionTable(document.getElementById("table")!, rows);
    ```

    The container needs a fixed height in CSS, for example `height: 70vh`.

    **Green Notes**
    - **Avoid excessive DOM size** (reduces E on the client): only the rows in view plus a small buffer exist in the DOM. That is a few dozen row elements instead of 80k rows × 4 cells. Style, layout and memory cost no longer grow with the result size.
      https://patterns.greensoftware.foundation/development/web-performance/avoid-excessive-dom-size
    - Row elements are pooled and reused while scrolling. Scroll does not create or destroy nodes, and updates are limited to one per animation frame.
    - *Not applied:* pagination. For a review page where people scroll through a whole run, windowing keeps the flow. Pagination would also work if you don't need continuous scrolling.

    Browser find (Ctrl+F) only sees rendered rows. If reviewers need to search, add a filter input that narrows `rows` before mounting.
verify:
  static_only: Browser DOM code in TypeScript, needs a browser environment
