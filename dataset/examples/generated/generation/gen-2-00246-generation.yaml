messages:
- role: user
  content: |
    need css for the oauth consent page our auth api renders. app logo + name, list of requested scopes, allow/deny buttons. has to work on mobile
- role: assistant
  content: |
    This CSS expects this markup:

    ```html
    <main class="consent">
      <div class="consent__app">
        <img class="consent__logo" src="/static/apps/acme.png" alt="">
        <h1>Acme CRM wants access to your account</h1>
      </div>
      <ul class="scopes">
        <li class="scope">
          <code class="scope__id">contacts:read</code>
          <p class="scope__desc">View your contacts</p>
        </li>
      </ul>
      <form class="actions" method="post">
        <button class="btn" name="decision" value="deny">Deny</button>
        <button class="btn btn--primary" name="decision" value="allow">Allow</button>
      </form>
      <p class="consent__note">You can revoke access at any time in your account settings.</p>
    </main>
    ```

    ```css
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --text: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --bg: #f6f8fa;
      --card: #ffffff;
      --accent: #0b5cad;
      --accent-text: #ffffff;
      --radius: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .consent {
      width: min(28rem, 100vw - 2rem);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .consent__app { display: flex; align-items: center; gap: 0.75rem; }
    .consent__logo { width: 48px; height: 48px; border-radius: var(--radius); object-fit: cover; flex-shrink: 0; }
    .consent h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }

    .scopes {
      list-style: none;
      margin: 1.25rem 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .scope { padding: 0.75rem 1rem; }
    .scope + .scope { border-top: 1px solid var(--border); }
    .scope__id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .scope__desc { margin: 0.125rem 0 0; }

    .actions { display: flex; gap: 0.75rem; }
    .btn {
      flex: 1;
      font: inherit;
      font-weight: 600;
      padding: 0.625rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .consent__note { margin: 1rem 0 0; font-size: 0.8125rem; color: var(--muted); }

    @media (max-width: 30rem) {
      .consent { padding: 1rem; }
      .actions { flex-direction: column-reverse; } /* Allow on top, Deny below */
    }
    ```

    **Green Notes**
    - **System font stack** (reduces E, network): the page uses fonts that are already on the device, so it downloads and decodes no font files. Many users see this page only once, during login, so most loads are cold. In Green Metrics Tool browser benchmarks with 30 cold page loads, the system font stack used ~410 J. That is about 16% less than two Latin-subset WOFF2 files (~488 J) and about 26% less than six local TTF files of about 4 MB (~556 J).
    - *Not applied:* brand web font. If design needs it, load one Latin-subset WOFF2 file for the `h1` only. In the same benchmark, small WOFF2 subsets were the next best option.
verify:
  static_only: CSS/HTML for a browser page
