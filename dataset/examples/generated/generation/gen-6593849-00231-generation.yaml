messages:
- role: user
  content: |
    hi, i work in a small webshop and we need a python function for the warehouse. Every morning we print a "pick list" as plain text, so the worker can walk thru the warehouse and take the things. On sale days we have maybe 20k orders in one list.

    Input is a list of orders like this:

    ```python
    {"id": 10492, "customer": "Marta Kowalska", "items": [
        {"sku": "MUG-0042", "name": "Blue mug", "qty": 2, "bin": "A-03-2"},
        {"sku": "TEA-0110", "name": "Green tea 100g", "qty": 1, "bin": "C-11-1"},
    ]}
    ```

    Output must be one text. For every order a header line with id and customer, then one line for each item (bin, sku, qty, name), sorted by bin so the worker dont walk back and forth. Empty line between orders. At the end one line with total orders and total units. Please write `build_pick_list(orders)`, thanks!
- role: assistant
  content: |
    ```python
    def build_pick_list(orders):
        parts = []
        total_units = 0

        for order in orders:
            parts.append(f"ORDER {order['id']}  {order['customer']}\n")
            for item in sorted(order["items"], key=lambda i: i["bin"]):
                parts.append(
                    f"  [{item['bin']:<8}] {item['sku']:<12} x{item['qty']:<3} {item['name']}\n"
                )
                total_units += item["qty"]
            parts.append("\n")

        parts.append(f"TOTAL ORDERS: {len(orders)}  TOTAL UNITS: {total_units}\n")
        return "".join(parts)
    ```

    Items are sorted by bin inside each order. The orders keep the order of your input list. If you want the whole list sorted by bin across all orders, that is a different layout, tell me and I change it.

    **Green Notes**
    - **String join** (reduces E): the function collects the lines in a list and builds the text once with `"".join()`. Adding to one big string with `+=` in a loop gets very slow with 20k orders. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces with `+=` used about 469 J of CPU energy and `"".join()` about 1.8 J, roughly 260× less. An f-string added in a loop behaves like `+=`, so the f-strings here are only used to make each single line.
verify:
  module: false
  test: |-
    orders = [
        {"id": 1001, "customer": "Ana", "items": [
            {"sku": "S1", "name": "Mug", "qty": 2, "bin": "B-02-1"},
            {"sku": "S2", "name": "Cup", "qty": 1, "bin": "A-01-1"},
        ]},
        {"id": 1002, "customer": "Bo", "items": [
            {"sku": "S3", "name": "Tea", "qty": 4, "bin": "C-05-3"},
        ]},
    ]
    out = build_pick_list(orders)
    assert out.index("S2") < out.index("S1")
    assert "ORDER 1001  Ana\n" in out
    assert "ORDER 1002  Bo\n" in out
    assert "\n\nORDER 1002" in out
    assert out.endswith("TOTAL ORDERS: 2  TOTAL UNITS: 7\n")
    assert build_pick_list([]) == "TOTAL ORDERS: 0  TOTAL UNITS: 0\n"
