id: gen-1-00207-generation
category: generation
language: html
patterns:
- system-fonts-and-deps
messages:
- role: user
  content: |
    hi, i have a raspberry pi that works as a gateway for 3 temperature/humidity sensors in our workshop. i want a small web page on it that shows the readings. the pi already has an endpoint /api/readings that returns json like this:

    ```json
    [{"name": "Door", "temp_c": 21.4, "humidity": 45}, {"name": "Storage", "temp_c": 18.9, "humidity": 62}]
    ```

    i read that i should use bootstrap and jquery and google fonts to make it look nice but i am not sure what i really need. can you write the page? only people on our local network will open it.
- role: assistant
  content: |
    You don't need any of those three for this page. Plain HTML, a little CSS and the built-in `fetch` are enough.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Workshop sensors</title>
      <style>
        body {
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          max-width: 40rem;
          margin: 2rem auto;
          padding: 0 1rem;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; }
        button { padding: .4rem .8rem; }
        #status { color: #666; margin-left: .5rem; }
      </style>
    </head>
    <body>
      <h1>Workshop sensors</h1>
      <table>
        <thead>
          <tr><th>Sensor</th><th>Temperature</th><th>Humidity</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p><button id="refresh" type="button">Refresh</button><span id="status"></span></p>

      <script>
        const rows = document.getElementById('rows');
        const status = document.getElementById('status');

        async function load() {
          try {
            const res = await fetch('/api/readings');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const readings = await res.json();

            rows.replaceChildren(...readings.map(r => {
              const tr = document.createElement('tr');
              for (const text of [r.name, r.temp_c.toFixed(1) + ' °C', r.humidity + ' %']) {
                const td = document.createElement('td');
                td.textContent = text;
                tr.appendChild(td);
              }
              return tr;
            }));
            status.textContent = 'Updated ' + new Date().toLocaleTimeString();
          } catch (err) {
            status.textContent = 'Could not load readings: ' + err.message;
          }
        }

        document.getElementById('refresh').addEventListener('click', load);
        load();
      </script>
    </body>
    </html>
    ```

    **Green Notes**
    - **No Bootstrap and no jQuery** (reduces E, network): the page is one small file instead of one file plus a CSS framework and a script library. The Pi has to serve and the browser has to parse less, and `fetch` and `replaceChildren` already do what jQuery would do here.
    - **System font stack instead of Google Fonts** (reduces network): the browser uses a font that is already installed, so there are no font downloads and no layout shift while a font loads. It also works when the workshop network has no internet access.
    - **Everything inline, nothing external:** the page makes one request for itself and one for the data. There is no third-party dependency to update or break.
    - **`textContent` instead of `innerHTML`:** sensor names are inserted as plain text, so a strange name cannot inject markup.

    *Not applied:* a CSS framework. For three rows in a table, about 15 lines of CSS are easier to maintain. If the page grows into a full dashboard with many components, a framework could make sense.
verify:
  static_only: HTML page with browser-side fetch; needs a browser and a gateway endpoint
