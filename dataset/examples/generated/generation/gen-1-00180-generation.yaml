    const got = packagesToBuild(files, ".", exists);
    if (JSON.stringify(got) !== JSON.stringify([".", "packages/api"])) throw new Error(JSON.stringify(got));
    if (calls.length !== 5) throw new Error("expected 5 lookups, got " + calls.length);
    const none = packagesToBuild(["a/b.txt"], ".", () => false);
    if (none.length !== 0) throw new Error("expected no packages");
