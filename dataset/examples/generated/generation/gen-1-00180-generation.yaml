    const present = new Set(["package.json", "packages/api/package.json"]);
    const exists = (p) => { calls.push(p); return present.has(p); };
    const files = [
      "packages/api/src/a.js",
      "packages/api/src/b.js",
      "packages/api/test/c.js",
      "docs/x.md",
