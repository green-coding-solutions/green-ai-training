- role: assistant
  content: |
    This covers every class in the markup and nothing else. Replace the Bootstrap link with `<link rel="stylesheet" href="/static/runners.css">`.

    ```css
    /* runners.css: only the rules runners.html uses */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2328;
      background: #f6f8fa;
    }

    a {
      color: #0969da;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: #24292f;
      color: #fff;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.125rem;
    }

    .meta {
      font-size: 0.8125rem;
      color: #afb8c1;
    }

    main {
      padding: 1.5rem;
      overflow-x: auto;
    }

    .runners {
      min-width: 48rem;
      border-collapse: collapse;
      border: 1px solid #d0d7de;
      background: #fff;
    }

    .runners th,
    .runners td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #d0d7de;
      text-align: left;
      white-space: nowrap;
    }

    .runners th {
      background: #f6f8fa;
      font-weight: 600;
    }

    .runners tbody tr:hover {
      background: #f6f8fa;
    }

    .name,
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .muted {
      color: #656d76;
    }

    .outdated {
      color: #a40e26;
    }

    .label,
    .pill {
      display: inline-block;
      border-radius: 0.75rem;
      font-size: 0.75rem;
    }

    .label {
      margin-right: 0.25rem;
      padding: 0 0.4rem;
      border: 1px solid #d0d7de;
    }

    .pill {
      padding: 0.1rem 0.5rem;
      font-weight: 600;
    }

    .pill-online  { background: #dafbe1; color: #116329; }
    .pill-busy    { background: #fff8c5; color: #7d4e00; }
    .pill-offline { background: #ffebe9; color: #a40e26; }
    ```

    Bootstrap's reset (Reboot) is gone too. This file only resets `box-sizing` and the body margin. If other pages share Bootstrap classes or its JS components, keep the link on those pages.

    **Green Notes**
    - **Remove unused CSS** (reduces network): the page now loads a few dozen rules it actually uses, not the whole framework. The gain is bytes, not client CPU. In Green Metrics Tool page-load measurements, cutting a 16 KB stylesheet down to 0.75 KB changed client CPU energy by about 2%, which is within noise.
    - *Not applied:* PurgeCSS or a minifier step in the build. For one small hand-written file on an internal admin page, an extra build tool isn't worth it.
verify:
  static_only: CSS stylesheet for a static HTML page, nothing to execute
