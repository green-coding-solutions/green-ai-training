id: gen-2-00157-generation
category: generation
language: html
patterns:
- remove-unused-css
- system-fonts-and-deps
facts:
- F-UNUSED-CSS
- F-FONTS
messages:
- role: user
  content: |
    Hi, can you make me a landing page for our coffe subscription service "Bean Post"? We need:
    - header with logo text and nav
    - hero with big headline and one button
    - 3 features (how it works)
    - pricing with 2 plans
    - email signup form
    - footer

    We host on Netlify, no build step, we just upload one index.html. I was thinking to use Bootstrap from cdn but whatever is more simple for you is ok. It should look ok on mobile also, a lot of our visitors comes from instagram.
- role: assistant
  content: |
    Here is one self-contained file. It uses a short hand-written stylesheet instead of Bootstrap, so there is nothing extra to load.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Bean Post – Fresh coffee, delivered</title>
      <meta name="description" content="Freshly roasted coffee beans delivered to your door every two weeks.">
      <style>
        :root { --brand: #6b3e26; --accent: #e9a23b; --text: #222; --muted: #666; --bg-alt: #f7f3ef; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); line-height: 1.6; }
        .wrap { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem; }
        header .wrap { display: flex; align-items: center; justify-content: space-between; padding-top: 1rem; padding-bottom: 1rem; }
        .logo { font-weight: 700; font-size: 1.25rem; color: var(--brand); text-decoration: none; }
        nav a { margin-left: 1.25rem; color: var(--text); text-decoration: none; }
        nav a:hover { color: var(--brand); }
        .hero { background: var(--bg-alt); padding: 4rem 0; text-align: center; }
        .hero h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.2; margin: 0 0 .75rem; }
        .hero p { color: var(--muted); max-width: 36rem; margin: 0 auto 1.5rem; }
        .btn { display: inline-block; background: var(--brand); color: #fff; padding: .75rem 1.5rem; border: 0; border-radius: 6px; font: inherit; text-decoration: none; cursor: pointer; }
        .btn:hover { background: #55301d; }
        section { padding: 3.5rem 0; }
        h2 { text-align: center; margin: 0 0 2rem; }
        .grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
        .card { border: 1px solid #e5ded7; border-radius: 8px; padding: 1.5rem; }
        .card h3 { margin-top: 0; }
        .card.featured { border: 2px solid var(--accent); }
        .price { font-size: 2rem; font-weight: 700; color: var(--brand); margin: 0 0 1rem; }
        .price small { font-size: 1rem; font-weight: 400; color: var(--muted); }
        .signup { background: var(--bg-alt); text-align: center; }
        .signup form { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
        .signup input[type=email] { flex: 1 1 260px; max-width: 360px; padding: .75rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
        footer { padding: 2rem 0; text-align: center; color: var(--muted); font-size: .9rem; }
        @media (max-width: 600px) {
          header .wrap { flex-direction: column; gap: .5rem; }
          nav a { margin: 0 .6rem; }
        }
      </style>
    </head>
    <body>
      <header>
        <div class="wrap">
          <a class="logo" href="#">Bean Post</a>
          <nav>
            <a href="#how">How it works</a>
            <a href="#pricing">Pricing</a>
            <a href="#signup">Sign up</a>
          </nav>
        </div>
      </header>

      <main>
        <div class="hero">
          <div class="wrap">
            <h1>Fresh coffee, delivered every two weeks</h1>
            <p>Small-batch beans from local roasters, roasted to order and sent straight to your door.</p>
            <a class="btn" href="#pricing">Choose your plan</a>
          </div>
        </div>

        <section id="how">
          <div class="wrap">
            <h2>How it works</h2>
            <div class="grid">
              <div class="card">
                <h3>1. Pick your taste</h3>
                <p>Fruity, chocolatey or classic. Tell us how you brew and we pick the beans.</p>
              </div>
              <div class="card">
                <h3>2. We roast to order</h3>
                <p>Your beans are roasted a few days before shipping, never sitting in a warehouse.</p>
              </div>
              <div class="card">
                <h3>3. Pause anytime</h3>
                <p>Skip a delivery or cancel with one click. No contract, no hidden fees.</p>
              </div>
            </div>
          </div>
        </section>

        <section id="pricing">
          <div class="wrap">
            <h2>Pricing</h2>
            <div class="grid">
              <div class="card">
                <h3>Solo</h3>
                <p class="price">€14 <small>/ delivery</small></p>
                <p>250 g every two weeks. Enough for one cup a day.</p>
                <a class="btn" href="#signup">Start Solo</a>
              </div>
              <div class="card featured">
                <h3>Duo</h3>
                <p class="price">€24 <small>/ delivery</small></p>
                <p>500 g every two weeks. For two people or serious coffee lovers.</p>
                <a class="btn" href="#signup">Start Duo</a>
              </div>
            </div>
          </div>
        </section>

        <section id="signup" class="signup">
          <div class="wrap">
            <h2>Get 20% off your first bag</h2>
            <form name="signup" method="POST" data-netlify="true">
              <input type="hidden" name="form-name" value="signup">
              <input type="email" name="email" placeholder="you@example.com" aria-label="Email address" required>
              <button class="btn" type="submit">Sign up</button>
            </form>
          </div>
        </section>
      </main>

      <footer>
        <div class="wrap">© 2026 Bean Post · <a href="mailto:hello@beanpost.example">hello@beanpost.example</a></div>
      </footer>
    </body>
    </html>
    ```

    **Green Notes**
    - **Only the CSS the page uses** (reduces network): about 30 short rules instead of a full framework stylesheet. Most of a framework's rules would go unused on a page like this. The benefit is fewer bytes, which matters for mobile visitors coming from Instagram. In Green Metrics Tool page-load measurements, a small stylesheet with mostly unused rules and its purged version differed by about 2% in client CPU energy, which is within noise. So don't expect a CPU saving from this.
    - **System font stack** (reduces E and network): no web font files to download. In Green Metrics Tool page-load measurements, the system font stack used the least client energy, about 26% less than a set of large TTF font files.
    - *Not applied:* PurgeCSS or another CSS build step. The stylesheet is small and hand-written, so there is nothing to purge, and you can keep uploading a single file.

    The `data-netlify="true"` attribute lets Netlify collect the signups. You can find them under **Forms** in the Netlify dashboard.
verify:
  static_only: static HTML/CSS page, no executable code
