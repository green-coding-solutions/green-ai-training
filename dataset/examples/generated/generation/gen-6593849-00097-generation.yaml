messages:
- role: user
  content: |
    hello, i need bash script for ETL. We have csv from our warehouse scanner, columns are sku,qty,location, first line is header. About 500000 lines each night. I want make a file what I can load to postgres with psql. Lines where qty is not a number must be skiped, and tell me how many was skiped. Thank you
- role: assistant
  content: |
    This writes a `COPY ... FROM STDIN` file. It avoids building SQL quotes by hand, and `psql` loads it in one pass.

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    if [[ $# -ne 2 ]]; then
      echo 'usage: csv2copy.sh input.csv output.sql' >&2
      exit 1
    fi

    in=$1
    out=$2
    bad=0
    tab=$'\t'

    {
      printf '%s\n' 'BEGIN;'
      printf '%s\n' 'COPY stock_scan (sku, qty, location) FROM STDIN;'

      {
        read -r _header
        while IFS=, read -r sku qty location _rest; do
          location=${location%$'\r'}
          if [[ ! $qty =~ ^[0-9]+$ || -z $sku || -z $location ]] ||
             [[ $sku$location == *\\* || $sku$location == *"$tab"* ]]; then
            bad=$((bad + 1))
            continue
          fi
          printf '%s\t%s\t%s\n' "$sku" "$qty" "$location"
        done
      } < "$in"

      printf '%s\n' '\.'
      printf '%s\n' 'COMMIT;'
    } > "$out"

    echo "skipped $bad bad lines" >&2
    ```

    Load it with `psql -v ON_ERROR_STOP=1 -f out.sql mydb`.

    Rows are skipped if:
    - `qty` is not a whole number.
    - `sku` or `location` is empty.
    - `sku` or `location` contains a tab or a backslash. Both would break the COPY format.

    A Windows `\r` at the end of the line is removed.

    **Green Notes**
    - **Single quotes for literals** (reduces E): every fixed string (`'%s\t%s\t%s\n'`, `'COPY ...'`, `'\.'`, the usage text) uses single quotes, so bash does not scan it for `$`, backticks or backslashes. Double quotes are only used where a variable must expand (`"$sku"`, `"skipped $bad bad lines"`). In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes. Your literals are short, so the absolute saving here is small. It grows with literal length and loop count, and the `printf` format runs once per row.
    - Quotes around variables are kept on purpose. Removing them would break values with spaces.
