id: gen-1-00110-generation
category: generation
language: javascript
patterns:
- system-fonts-and-deps
messages:
- role: user
  content: |
    express middleware: request id + access log with duration
- role: assistant
  content: |
    ```javascript
    import { randomUUID } from "node:crypto";

    const ID_RE = /^[\w-]{1,64}$/;

    export function requestLogger(log = console.log) {
      return (req, res, next) => {
        const incoming = req.headers["x-request-id"];
        const id = ID_RE.test(incoming || "") ? incoming : randomUUID();
        const start = process.hrtime.bigint();

        req.id = id;
        res.setHeader("X-Request-Id", id);

        res.on("finish", () => {
          const ms = Number(process.hrtime.bigint() - start) / 1e6;
          log(JSON.stringify({
            id,
            method: req.method,
            path: req.originalUrl || req.url,
            status: res.statusCode,
            ms: Math.round(ms * 10) / 10,
          }));
        });

        next();
      };
    }
    ```

    Use it with `app.use(requestLogger());`. Pass your own function, for example `pino.info.bind(pino)`, if you already have a logger. If your app uses CommonJS, swap the `import` for `require("node:crypto")` and the `export` for `module.exports = { requestLogger }`.

    **Green Notes**
    - **Built-ins instead of packages** (reduces E and M): `crypto.randomUUID()` and `process.hrtime.bigint()` ship with Node. You don't need `uuid`, `morgan` or `on-finished`. That means fewer packages to install, scan, ship in the image and load at every process start.
    - **One log line per request, written when the response finishes:** the work is a timer read and one `JSON.stringify`. An incoming `X-Request-Id` is reused only if it matches a safe pattern, so callers can't inject odd text into your logs.
    - *Not applied:* async or batched log shipping. A plain `log` function is enough here. If log volume gets high, buffer in your logger, not in this middleware.
verify:
  test: |-
    import assert from "node:assert";
    import { EventEmitter } from "node:events";

    function run(headers) {
      const lines = [];
      const sent = {};
      const mw = requestLogger((l) => lines.push(l));
      const res = new EventEmitter();
      res.statusCode = 201;
      res.setHeader = (k, v) => { sent[k] = v; };
      const req = { headers, method: "POST", url: "/items" };
      let called = false;
      mw(req, res, () => { called = true; });
      assert.ok(called);
      res.emit("finish");
      return { req, sent, entry: JSON.parse(lines[0]), count: lines.length };
    }

    const a = run({});
    assert.strictEqual(a.count, 1);
    assert.match(a.entry.id, /^[0-9a-f-]{36}$/);
    assert.strictEqual(a.sent["X-Request-Id"], a.entry.id);
    assert.strictEqual(a.req.id, a.entry.id);
    assert.strictEqual(a.entry.method, "POST");
    assert.strictEqual(a.entry.path, "/items");
    assert.strictEqual(a.entry.status, 201);
    assert.ok(typeof a.entry.ms === "number" && a.entry.ms >= 0);

    const b = run({ "x-request-id": "abc-123" });
    assert.strictEqual(b.entry.id, "abc-123");

    const c = run({ "x-request-id": "bad id\nINJECT" });
    assert.notStrictEqual(c.entry.id, "bad id\nINJECT");
    assert.match(c.entry.id, /^[0-9a-f-]{36}$/);
