id: gen-1-00257-generation
category: generation
language: dockerfile
patterns:
- small-container-images
messages:
- role: user
  content: |
    Need a Dockerfile for our gateway agent. Rust, bin name `edge-gw`, Cargo.lock is committed, rustls only (no openssl). It polls Modbus TCP devices and publishes to MQTT. Target is arm64, about 400 gateways that pull over LTE. Just the Dockerfile, I'll adapt it.
- role: assistant
  content: |
    ```dockerfile
    # syntax=docker/dockerfile:1
    FROM rust:1.85-slim-bookworm AS build
    WORKDIR /src

    # Dependency layer: only rebuilds when Cargo.toml/Cargo.lock change
    COPY Cargo.toml Cargo.lock ./
    RUN mkdir src && echo 'fn main() {}' > src/main.rs \
        && cargo build --release --locked \
        && rm -rf src

    COPY src ./src
    RUN touch src/main.rs && cargo build --release --locked

    FROM gcr.io/distroless/cc-debian12:nonroot
    COPY --from=build /src/target/release/edge-gw /usr/local/bin/edge-gw
    USER nonroot
    ENTRYPOINT ["/usr/local/bin/edge-gw"]
    ```

    Add a `.dockerignore` with `target/` and `.git/`. Build with `docker buildx build --platform linux/arm64`.

    Optional, in `Cargo.toml`:

    ```toml
    [profile.release]
    strip = true
    lto = true
    codegen-units = 1
    ```

    **Green Notes**
    - **Multi-stage build with a distroless runtime** (reduces network, M): the toolchain, sources and build cache stay in the build stage. The final image holds only the binary and the C runtime libraries, so each of the 400 gateways pulls and stores far less over LTE.
      No shell or package manager is left in the image, which also shrinks the attack surface.
    - **Dependency layer split** (reduces E): editing `src/` reuses the cached dependency layer, so CI does not recompile all crates on every commit.
    - **`strip` and `lto`** (reduces network): a smaller binary means a smaller image layer. This costs longer release builds, so drop it if CI time matters more.
    - *Not applied:* `scratch` with a musl static build. It saves a few more MB, but it adds a cross-compile target and DNS/allocator quirks. `distroless/cc` is the lower-risk choice here.
    - If the agent reads a serial device, run it with `--device` and `--group-add` for the device's group. The `nonroot` user has no access by default.
verify:
  static_only: Dockerfile needs Docker, network and a Rust project to build
