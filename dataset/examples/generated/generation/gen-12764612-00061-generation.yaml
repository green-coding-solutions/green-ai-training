messages:
- role: user
  content: |
    Hello, I make one html page for our log viewer, the ops people use it all day on second monitor. New log lines come from a function I already have, I just call addLine(text, level) with level "info" or "error". I want the new line is highlighted with yellow (red for error) and then slowly go back to normal in 2 seconds, so the eyes can see what is new. Also small spinner near the title when the connection is lost and we try again. Can you write the page? Dark theme please.
- role: assistant
  content: |
    ```html
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live logs</title>
    <style>
      body { margin: 0; background: #111; color: #ddd; font: 14px/1.4 ui-monospace, monospace; }
      header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1b1b1b; }
      h1 { margin: 0; font-size: 16px; }
      #log { height: calc(100vh - 44px); overflow-y: auto; }
      .line { padding: 2px 12px; white-space: pre-wrap; }
      .line.error { color: #ff8a8a; }

      /* new line highlight: CSS only, JS just sets and removes the class */
      .line.is-new { animation: flash-info 2s ease-out; }
      .line.error.is-new { animation-name: flash-error; }
      @keyframes flash-info  { from { background: #5c5200; } to { background: transparent; } }
      @keyframes flash-error { from { background: #6b1d1d; } to { background: transparent; } }

      /* spinner exists only while reconnecting */
      .spinner { display: none; width: 12px; height: 12px; border: 2px solid #888;
                 border-top-color: transparent; border-radius: 50%; }
      #status.reconnecting .spinner { display: inline-block; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        .line.is-new, .line.error.is-new, #status.reconnecting .spinner { animation: none; }
      }
    </style>
    </head>
    <body>
    <header>
      <h1>Live logs</h1>
      <span id="status"><span class="spinner"></span> <span id="status-text">Connected</span></span>
    </header>
    <div id="log"></div>

    <script>
      const log = document.getElementById('log');
      const status = document.getElementById('status');
      const statusText = document.getElementById('status-text');

      function addLine(text, level = 'info') {
        const el = document.createElement('div');
        el.className = 'line ' + level + ' is-new';
        el.textContent = text;
        el.addEventListener('animationend', () => el.classList.remove('is-new'), { once: true });

        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        log.appendChild(el);
        if (atBottom) log.scrollTop = log.scrollHeight;
      }

      // call setStatus('reconnecting') when the connection is lost, setStatus('connected') when back
      function setStatus(state) {
        status.className = state;
        statusText.textContent = state === 'reconnecting' ? 'Reconnecting…' : 'Connected';
      }
    </script>
    </body>
    </html>
    ```

    Your own code can call `addLine` and `setStatus` as before. I use `textContent`, so log text is never read as HTML.

    **Green Notes**
    - **CSS keyframes instead of JS animation** (reduces E): the fade and the spinner run in CSS, so there is no `requestAnimationFrame` loop or timer writing styles from JavaScript. In Green Metrics Tool micro-benchmarks of a 20-second animation in a real browser, CSS `@keyframes` used about 10% less CPU energy than a JS `requestAnimationFrame` version. A page open all day on a second monitor adds this up.
    - **Animation only while needed:** the spinner is hidden with `display: none` when connected, and the line highlight class is removed on `animationend`. Nothing keeps animating while the page is idle.
    - **Reduced motion:** with `prefers-reduced-motion` the animations are off and the text status still shows.
