messages:
- role: user
  content: |
    Hi, we are a small physics group and we write a N-body solver (name is "nbody-lite"). For the homepage of the project I want in the header a little animation: one star in the middle, a planet go around the star and a moon go around the planet. Planet need 8 s for one round, moon 2 s. It should loop for ever. Please no library, only plain html and css or js, what is more simple. Background of the header is dark, #0b1020. Many students keep this page open while they read the docs, so it shoud not be heavy.
- role: assistant
  content: |
    Here is a header with the orbit done in pure CSS. No JavaScript is needed.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>nbody-lite</title>
      <style>
        .site-header {
          background: #0b1020;
          color: #e6e9f2;
          padding: 2rem 1rem;
          text-align: center;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .orbit-demo {
          position: relative;
          width: 240px;
          height: 240px;
          margin: 0 auto 1rem;
        }

        /* Static orbit path, radius 100px */
        .orbit-demo::before {
          content: "";
          position: absolute;
          inset: 20px;
          border: 1px dashed rgba(230, 233, 242, 0.25);
          border-radius: 50%;
        }

        .star {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 40px;
          height: 40px;
          margin: -20px 0 0 -20px;
          border-radius: 50%;
          background: radial-gradient(circle, #fff6c2 0%, #ffcc4d 60%, #ff9f1c 100%);
          box-shadow: 0 0 24px 6px rgba(255, 204, 77, 0.45);
        }

        .orbit {
          position: absolute;
          animation: spin linear infinite;
        }

        /* Planet ring: same box as the orbit path, one turn in 8 s */
        .orbit-planet {
          inset: 20px;
          animation-duration: 8s;
        }

        .planet {
          position: absolute;
          top: 0;
          left: 50%;
          width: 18px;
          height: 18px;
          margin: -9px 0 0 -9px;
          border-radius: 50%;
          background: #4da3ff;
        }

        /* Moon ring: centered on the planet, one turn in 2 s */
        .orbit-moon {
          top: 50%;
          left: 50%;
          width: 44px;
          height: 44px;
          margin: -22px 0 0 -22px;
          animation-duration: 2s;
        }

        .moon {
          position: absolute;
          top: 0;
          left: 50%;
          width: 6px;
          height: 6px;
          margin: -3px 0 0 -3px;
          border-radius: 50%;
          background: #c9ced9;
        }

        @keyframes spin {
          to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
          .orbit { animation: none; }
        }
      </style>
    </head>
    <body>
      <header class="site-header">
        <div class="orbit-demo" role="img" aria-label="A planet with a moon orbiting a star">
          <div class="star"></div>
          <div class="orbit orbit-planet">
            <div class="planet">
              <div class="orbit orbit-moon">
                <div class="moon"></div>
              </div>
            </div>
          </div>
        </div>
        <h1>nbody-lite</h1>
        <p>A small, fast N-body solver.</p>
      </header>
    </body>
    </html>
    ```

    The moon ring sits inside the planet, so it moves with the planet and also turns on its own. You don't have to calculate any positions.

    **Green Notes**
    - **CSS `@keyframes` instead of a JavaScript animation loop** (reduces E): no script runs on every frame, which matters because students leave the page open for a long time. In Green Metrics Tool browser benchmarks, a 20-second animation used about 10% less CPU energy with CSS `@keyframes` than with `requestAnimationFrame` and style updates.
    - **Only `transform` is animated** (reduces E): the planet and moon move through nested rotations, so the browser doesn't have to recompute layout. The star's glow and the orbit path are static and never repainted.
    - **`prefers-reduced-motion`**: if a visitor turns off animations in their OS, the orbit stops and the browser draws no more animation frames.
