    import math as _m
    import random as _r

    def _ref(walks, steps, seed):
        rng = _r.Random(seed)
        sr = sr2 = 0.0
        for _ in range(walks):
            x = y = 0.0
            for _ in range(steps):
                a = 2 * _m.pi * rng.random()
                x += _m.cos(a)
                y += _m.sin(a)
            r2 = x * x + y * y
            sr += _m.sqrt(r2)
            sr2 += r2
        return sr / walks, sr2 / walks

    assert simulate(1, 0, 1) == (0.0, 0.0)
    assert simulate(50, 200, 7) == simulate(50, 200, 7)
    assert simulate(30, 100, 3) == _ref(30, 100, 3)
    m, m2 = simulate(400, 400, 1)
    assert 15 < m < 20.5, m
    assert 300 < m2 < 500, m2
    try:
        simulate(0, 10)
        raise AssertionError("expected ValueError")
    except ValueError:
        pass
    print("ok")
