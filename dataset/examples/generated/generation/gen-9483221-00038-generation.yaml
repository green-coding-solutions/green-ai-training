- role: assistant
  content: |
    ```python
    # detections.py
    ALERT_CLASSES = [
        "person", "knife", "gun", "backpack", "suitcase", "fire",
        "smoke", "bicycle", "motorcycle", "truck",
        # ... ~150 labels in the real config, loaded once at startup
    ]

    # Built once at import time, reused for every frame.
    _ALERT_SET = frozenset(ALERT_CLASSES)


    def keep_alert_detections(detections, min_score=0.5):
        """detections: list of {"label": str, "score": float, "box": [x1, y1, x2, y2]}
        from the object detector, one list per camera frame (~30 fps, 40 cameras).
        Return only detections with score >= min_score whose label is in ALERT_CLASSES.
        Keep the original order.
        """
        return [
            d for d in detections
            if d["score"] >= min_score and d["label"] in _ALERT_SET
        ]
    ```

    **Green Notes**
    - **Set for repeated membership tests** (reduces E): this function checks a label for every detection of every frame, so the lookups repeat millions of times. A list scan is O(n) per check, the set lookup is O(1). The set is built once at module level. Do not build it inside the function. With a single lookup, converting first costs more than scanning: in Green Metrics Tool micro-benchmarks, one test on a 10,000,000-element list used ~6.9 J, while converting to a set and testing once used ~10.5 J, about 50% more.
    - **Cheap check first:** the `score` comparison runs before the label lookup, so low-confidence detections skip the lookup. The result is the same as checking both.
    - Order and duplicates are kept, because the result is still a plain list filtered in one pass. `ALERT_CLASSES` stays a list, in case other code relies on its order.
verify:
  test: |-
    dets = [
        {"label": "person", "score": 0.9, "box": [0, 0, 1, 1]},
        {"label": "cat", "score": 0.95, "box": [0, 0, 1, 1]},
        {"label": "knife", "score": 0.4, "box": [0, 0, 1, 1]},
        {"label": "truck", "score": 0.5, "box": [0, 0, 1, 1]},
        {"label": "person", "score": 0.7, "box": [2, 2, 3, 3]},
    ]
    out = keep_alert_detections(dets)
    assert [d["box"] for d in out] == [[0, 0, 1, 1], [0, 0, 1, 1], [2, 2, 3, 3]]
    assert [d["label"] for d in out] == ["person", "truck", "person"]
    assert keep_alert_detections([]) == []
    assert len(keep_alert_detections(dets, min_score=0.3)) == 4
