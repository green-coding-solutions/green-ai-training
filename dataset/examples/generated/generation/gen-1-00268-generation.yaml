id: gen-1-00268-generation
category: generation
language: bash
patterns:
- bash-builtins
messages:
- role: user
  content: |
    hi, i need bash script for our inference server. We have folder with many .wav files (around 50k) and a cli `infer --model NAME --input FILE` that print json to stdout. Script must run it for every wav and save result to results/<name>.json. Also I need manifest file with name and size in bytes of every wav, tab separated. Model name should be configurable. Thanks!
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    in_dir=${1:?'usage: run_infer.sh INPUT_DIR [OUT_DIR]'}
    out_dir=${2:-results}
    model=${MODEL:-asr-small}

    mkdir -p "$out_dir"

    # One find call lists names and sizes for all files.
    # Records end with NUL, so odd file names are safe.
    while IFS= read -r -d '' rec; do
      file=${rec%$'\t'*}
      size=${rec##*$'\t'}
      name=${file%.wav}

      # </dev/null: infer must not eat the loop's input
      infer --model "$model" --input "$in_dir/$file" \
        > "$out_dir/$name.json" < /dev/null

      printf '%s\t%s\n' "$name" "$size"
    done < <(find "$in_dir" -maxdepth 1 -type f -name '*.wav' -printf '%f\t%s\0') \
      > "$out_dir/manifest.tsv"
    ```

    Usage:

    ```bash
    MODEL=asr-small ./run_infer.sh /data/audio results
    ```

    **Green Notes**
    - **Shell builtins instead of forks** (reduces E): the name and size are cut out with `${...%...}` and `${...##...}`. This avoids spawning `basename`, `stat` or `sed` for each file. With 50k files that is 100k+ extra processes saved. The only fork per file is `infer`, which is the real work.
    - **One `find` and one manifest redirect:** sizes come from a single `find -printf`. The manifest is opened once for the whole loop, not once per line.
    - *Not applied:* parallel runs (`xargs -P`) or batching. I don't know if `infer` can take many files per call or how much memory a model load needs. If it can take a list of files, one call for many files would save the most, because it would load the model once instead of 50k times.
verify:
  static_only: needs the external infer CLI
