messages:
- role: user
  content: |
    Need one static page for the weekly solver regression results (CFD, runs on the cluster, a script fills in the rows later). Header with the commit and date, table of cases: case, mesh cells, final residual, wall time, status (pass/fail). Below it one convergence plot as a PNG and a notes paragraph. No JS, no framework. Just the file.
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Solver regression results</title>
      <style>
        body {
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          line-height: 1.5;
          max-width: 56rem;
          margin: 0 auto;
          padding: 0 1rem 2rem;
          color: #1f2328;
        }
        .meta { color: #57606a; font-size: 0.9rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #d0d7de; text-align: left; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .pass { color: #1a7f37; }
        .fail { color: #cf222e; font-weight: 600; }
        figure { margin: 1.5rem 0; }
        img { max-width: 100%; height: auto; }
        figcaption { font-size: 0.9rem; color: #57606a; }
      </style>
    </head>
    <body>
      <h1>Solver regression results</h1>
      <p class="meta">Commit <code>a1b2c3d</code> &middot; 2026-10-26</p>

      <table>
        <thead>
          <tr>
            <th>Case</th>
            <th class="num">Mesh cells</th>
            <th class="num">Final residual</th>
            <th class="num">Wall time (s)</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>cavity-2d</td>
            <td class="num">40 000</td>
            <td class="num">3.2e-9</td>
            <td class="num">41</td>
            <td class="pass">pass</td>
          </tr>
          <tr>
            <td>channel-3d</td>
            <td class="num">1 200 000</td>
            <td class="num">8.7e-7</td>
            <td class="num">1 840</td>
            <td class="fail">fail</td>
          </tr>
          <!-- one <tr> per case, filled in by the report script -->
        </tbody>
      </table>

      <figure>
        <img src="convergence.png" width="900" height="500" alt="Residual versus iteration for all cases">
        <figcaption>Residual history per case.</figcaption>
      </figure>

      <h2>Notes</h2>
      <p>Failures are runs whose final residual is above the case tolerance.</p>
    </body>
    </html>
    ```

    **Green Notes**
    - **Remove unused CSS** (reduces network): the page carries only the rules it uses, in one inline `<style>` block, with no CSS framework and no extra request. In Green Metrics Tool page-load benchmarks, a 16 KB mostly unused stylesheet and a purged 0.75 KB one differed by about 2% in client CPU energy, which is within noise. So the gain here is fewer bytes, not measurable CPU.
    - *Not applied:* a build step or minifier. For a page this small it adds more work than it saves.
verify:
  static_only: static HTML page, no scripts
