messages:
- role: user
  content: |
    We run a fraud-scoring model behind an API, about 300 requests per second at peak. For audit and debugging I want to keep one row per prediction in Postgres 16. Please write the table DDL.

    What each row has:
    - model version, timestamp, predicted label, score, latency in ms
    - the feature vector we sent to the model as JSON (usually 6-10 KB, same keys every time)
    - the raw free-text note from the customer (0-5 KB, sometimes empty)
    - the 768-dim embedding of that text as float4 array

    Requirements:
    - we keep 180 days, then it must go
    - writes all day, reads are rare (an engineer looks up a few rows by model version and time range when something looks odd)
    - disk is getting expensive, so I want it to stay small without hurting insert speed
    - monthly partitions are fine
- role: assistant
  content: |
    Here is a partitioned table. The large JSON and text columns use `lz4` TOAST compression, which is cheap enough for a table that is written all day. The embedding is stored without compression.

    ```sql
    CREATE TABLE prediction_audit (
        id            bigint GENERATED ALWAYS AS IDENTITY,
        requested_at  timestamptz NOT NULL DEFAULT now(),
        model_version text        NOT NULL,
        label         text        NOT NULL,
        score         real        NOT NULL,
        latency_ms    integer     NOT NULL,
        features      jsonb       NOT NULL COMPRESSION lz4,
        customer_note text        COMPRESSION lz4,
        embedding     real[]      STORAGE EXTERNAL,
        PRIMARY KEY (id, requested_at)
    ) PARTITION BY RANGE (requested_at);

    CREATE INDEX prediction_audit_lookup_idx
        ON prediction_audit (model_version, requested_at);

    CREATE TABLE prediction_audit_2026_10 PARTITION OF prediction_audit
        FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');
    CREATE TABLE prediction_audit_2026_11 PARTITION OF prediction_audit
        FOR VALUES FROM ('2026-11-01') TO ('2026-12-01');

    -- Retention: drop whole partitions older than 180 days (run monthly).
    -- DROP TABLE prediction_audit_2026_04;
    ```

    Create next month's partition before the month starts. A cron job or `pg_partman` can do this. Check that your build supports `lz4` with `SHOW default_toast_compression;` and `SELECT pg_column_compression(features) FROM prediction_audit LIMIT 5;` after the first inserts.

    **Green Notes**
    - **Compress stored data, with a fast codec** (reduces E and storage): the JSON features repeat the same keys in every row, so they compress well. Only values above about 2 KB are TOASTed and compressed, so the small columns cost nothing extra. This table is written all day, so compression runs on every insert. `lz4` is chosen because it is a fast codec. In Green Metrics Tool micro-benchmarks on a text corpus, the `lz4` CLI used about 6 J to compress 100 MB, and `gzip` used about 67 J. Those numbers compare CLI tools by energy only, not compression ratio. Postgres's `lz4` will not compress as tightly as stronger codecs, but that is the right trade for data written constantly.
      Pattern: Compress stored data
    - **No compression on the embedding** (reduces E): float arrays are close to random bytes and barely shrink. `STORAGE EXTERNAL` keeps them out-of-line without trying to compress them on every write.
    - **Drop partitions instead of `DELETE`** (reduces E): removing 180-day-old data is a metadata operation. It does not rewrite rows, write WAL for each row, or create vacuum work.

    *Not applied:* a heavier codec such as `xz` or `brotli` at high quality. Those cost one to two orders of magnitude more energy to compress, and this data is rewritten constantly, so they would not pay off.
