- role: assistant
  content: |
    ```python
    class BeaconRanger:
        """Turns BLE beacon RSSI readings into rough distances for the gateway."""

        def __init__(self, tx_power=-59, path_loss=2.0, max_range_m=30.0):
            self.tx_power = tx_power          # RSSI at 1 m
            self.path_loss = path_loss        # environment factor, 2.0 = free space
            self.max_range_m = max_range_m

        def distances(self, rssi_batch):
            """Return one distance in meters per RSSI value.
            Log-distance model, values above max_range_m are clipped.
            Batches can have 50k values."""
            tx_power = self.tx_power
            max_range = self.max_range_m
            denom = 10.0 * self.path_loss
            return [
                min(10.0 ** ((tx_power - rssi) / denom), max_range)
                for rssi in rssi_batch
            ]
    ```

    The formula is `d = 10 ** ((tx_power - rssi) / (10 * n))`. The result is a list in the same order as the input. If a reading can be `None` (a missed beacon), filter it out before calling `distances`. Otherwise the comprehension raises a `TypeError`.

    **Green Notes**
    - **Hoist loop-invariant lookups** (reduces E): `self.tx_power`, `self.max_range_m` and `10 * self.path_loss` do not change inside the batch. They are now read once per call, not once per value. In Green Metrics Tool micro-benchmarks, binding `math.sqrt` to a local before a 10,000,000-iteration loop saved about 4-5%. The gain is small, but it costs nothing in readability on a per-batch hot path.
verify:
