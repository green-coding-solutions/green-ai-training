    r = BeaconRanger()
    out = r.distances([-59, -79, -200])
    assert len(out) == 3
    assert abs(out[0] - 1.0) < 1e-9
    assert abs(out[1] - 10.0) < 1e-9
    assert out[2] == 30.0
    assert r.distances([]) == []
    r2 = BeaconRanger(tx_power=-60, path_loss=3.0, max_range_m=100.0)
    assert abs(r2.distances([-90])[0] - 10.0) < 1e-9
