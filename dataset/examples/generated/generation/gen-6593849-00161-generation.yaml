messages:
- role: user
  content: |
    Need the HTML template for the schema drift report our nightly warehouse load writes to the CI artifacts dir. One self-contained file, no JS, no frameworks, opened straight from the artifact browser.

    Content: h1 with the pipeline name, a meta line (run id, finished at), a one-line summary with counts of added / removed / type-changed columns, then one table: table, column, change, old type, new type. Row background by change kind. I'll fill the rows from the script, so just put 3 sample rows in. Only the file please.
- role: assistant
  content: |
    ```html
