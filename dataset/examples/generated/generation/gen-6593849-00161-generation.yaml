    **Green Notes**
    - **Only the CSS the page uses** (reduces network): the stylesheet is written for this page, and every selector matches an element in it. There is no framework CSS to purge later. In Green Metrics Tool browser benchmarks, purging a 16 KB mostly unused stylesheet down to 0.75 KB changed client CPU energy by about 2%, which is within noise. So the saving here is bytes, not CPU, and it is small for a file opened from an artifact browser.
    - *Not applied:* a purge step in the build. The CSS is hand-written and short, so there is nothing to purge. If you add rules for new change kinds, add them only when the script can emit them.
