- role: assistant
  content: |
    Here's a Dockerfile and a `.dockerignore` for the defect inspector service.

    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONDONTWRITEBYTECODE=1 \
        PYTHONUNBUFFERED=1 \
        PIP_DISABLE_PIP_VERSION_CHECK=1 \
        PYTHONPATH=/app/src

    WORKDIR /app

    # Dependencies first: this layer is reused until requirements.txt changes
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    # Model before code: it changes less often than the source
    COPY models/ ./models/
    COPY src/ ./src/

    RUN useradd --system --uid 10001 inspector
    USER inspector

    EXPOSE 8000
    CMD ["uvicorn", "inspector.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ```

    ```text
    # .dockerignore
    .git
    .venv/
    **/__pycache__
    tests/
    notebooks/
    requirements-dev.txt
    ```

    `WORKDIR /app` makes the relative `models/defect_resnet18.onnx` path in `api.py` resolve. The service runs as a non-root user.

    **Green Notes**
    - **Slim base image** (reduces E, M, network): `onnxruntime`, `numpy` and `pillow` ship prebuilt wheels, so the full `python:3.12` image with its compilers and tools adds only size. In Green Metrics Tool measurements of a small Flask app, a slim base with runtime dependencies only and the dependency layer first used about 7× less energy to build. Serving requests afterwards cost the same with both images. So the saving comes back with every build, pull and stored copy.
    - **Runtime dependencies only** (reduces E, M): the image installs `requirements.txt`, not the dev file with pytest, mypy and jupyterlab. `.dockerignore` keeps tests, notebooks and `.git` out of the build context.
    - **Layer order** (reduces E): dependencies, then model, then source. A code change rebuilds only the last small layer. `--no-cache-dir` keeps pip's download cache out of the image.
    - *Not applied:* multi-stage build. Nothing here gets compiled, so a second stage would add steps and save nothing.
