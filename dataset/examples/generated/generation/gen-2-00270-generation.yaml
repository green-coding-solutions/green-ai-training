messages:
- role: user
  content: |
    Landing page hero. Our sharp build step (runs once per deploy) now emits `hero-wide-{960,1600,2400}.{avif,webp,jpg}` (16:9) plus a portrait crop `hero-tall-{480,800}.{avif,webp,jpg}` (4:5) for phones up to 640px. Swap the img for a picture element with art direction. Just the diff.

    ```html
    <section class="hero">
      <div class="hero__media">
        <img src="/img/hero.png" alt="Field engineer checking a solar inverter on a rooftop" class="hero__img">
      </div>
      <div class="hero__copy">
        <h1>Monitoring that keeps up with your fleet</h1>
        <p>Live yield, fault alerts and service tickets for every inverter, in one place.</p>
        <a href="/signup" class="btn btn--primary">Start free trial</a>
        <a href="/demo" class="btn btn--ghost">Book a demo</a>
      </div>
    </section>
    ```
- role: assistant
  content: |
    Replace the `<img>` inside `.hero__media` with:

    ```html
    <picture>
      <source type="image/avif" media="(max-width: 640px)"
              srcset="/img/hero-tall-480.avif 480w, /img/hero-tall-800.avif 800w"
              sizes="100vw" width="800" height="1000">
      <source type="image/webp" media="(max-width: 640px)"
              srcset="/img/hero-tall-480.webp 480w, /img/hero-tall-800.webp 800w"
              sizes="100vw" width="800" height="1000">
      <source media="(max-width: 640px)"
              srcset="/img/hero-tall-480.jpg 480w, /img/hero-tall-800.jpg 800w"
              sizes="100vw" width="800" height="1000">
      <source type="image/avif"
              srcset="/img/hero-wide-960.avif 960w, /img/hero-wide-1600.avif 1600w, /img/hero-wide-2400.avif 2400w"
              sizes="100vw">
      <source type="image/webp"
              srcset="/img/hero-wide-960.webp 960w, /img/hero-wide-1600.webp 1600w, /img/hero-wide-2400.webp 2400w"
              sizes="100vw">
      <img src="/img/hero-wide-1600.jpg"
           srcset="/img/hero-wide-960.jpg 960w, /img/hero-wide-1600.jpg 1600w, /img/hero-wide-2400.jpg 2400w"
           sizes="100vw" width="1600" height="900"
           alt="Field engineer checking a solar inverter on a rooftop" class="hero__img">
    </picture>
    ```

    The browser uses the first source that matches, so the order matters: portrait before wide, and AVIF before WebP before JPEG in each group. The `width`/`height` on the portrait sources give that crop its own aspect ratio, so the layout doesn't shift.

    **Green Notes**
    - **Modern image formats** (reduces network): AVIF and WebP make the largest file on the page smaller, and JPEG stays as the fallback. In Green Metrics Tool browser benchmarks (50 page loads per format), decoding AVIF used about 19% more CPU energy than JPG (~159 J vs ~134 J). So the saving comes from fewer transferred bytes, not from client CPU. The old PNG was the most expensive format to decode in that benchmark (~181 J).
    - **Encode once at build time** (reduces E): in the same benchmarks, encoding 50 images to AVIF used ~658 J and to JPG ~89 J, about 7×. Your sharp step runs once per deploy, which is the right place for it. Don't move AVIF encoding into an on-the-fly resize endpoint.
verify:
  static_only: HTML markup only, no runnable code
