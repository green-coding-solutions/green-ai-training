id: gen-1-00236-generation
category: generation
language: javascript
patterns:
- memoize
messages:
- role: user
  content: |
    I'm writing a small stat-mech helper in Node for a course project and need a function `partitions(n, k)` that returns the number of ways to write n as a sum of positive integers, each at most k (order doesn't matter). If k is left out it should count all partitions of n.

    Requirements:
    - Keep the recursive definition p(n, k) = p(n, k-1) + p(n-k, k), because the lab report has to match the formula.
    - Results must be exact for n up to about 500, so no floating point.
    - We call it for many n and k values in one run (whole tables of them), so it must not redo shared work.
    - Throw a clear error for negative or non-integer n.
    - Plain Node, no dependencies.
- role: assistant
  content: |
    The recursion branches twice and the same (n, k) pairs come up again and again, so the plain version is exponential. A shared `Map` keeps the recursive form and makes each pair cost one computation. `BigInt` keeps the counts exact.

    ```javascript
    const cache = new Map();

    function partitions(n, k = n) {
      if (!Number.isInteger(n) || n < 0) {
        throw new RangeError("n must be a non-negative integer");
      }
      if (!Number.isInteger(k) || k < 0) {
        throw new RangeError("k must be a non-negative integer");
      }
      if (k > n) k = n;           // parts larger than n cannot be used
      if (n === 0) return 1n;     // the empty sum
      if (k === 0) return 0n;     // n > 0 but no allowed parts
      if (k === 1) return 1n;     // only 1+1+...+1

      const key = `${n}:${k}`;
      const hit = cache.get(key);
      if (hit !== undefined) return hit;

      const result = partitions(n, k - 1) + partitions(n - k, k);
      cache.set(key, result);
      return result;
    }

    function clearPartitionCache() {
      cache.clear();
    }
    ```

    ```javascript
    console.log(partitions(5));        // 7n
    console.log(partitions(5, 2));     // 3n
    console.log(partitions(100));      // 190569292n

    // a whole table reuses the same cache
    for (let n = 1; n <= 5; n++) {
      console.log(n, partitions(n));
    }
    ```

    **Green Notes**
    - **Memoize the recursion** (reduces E): the two branches overlap heavily. Without the cache the number of calls grows exponentially. With it, each (n, k) pair is computed once, so a full table is at most about n·k steps.
    - **Cache lives at module level**, so repeated calls in one run share it. This is what makes the table loops cheap.
    - The cache is unbounded and holds up to about n²/2 entries for n = 500. That is fine for this use. If you ever run many different n in a long-lived process, call `clearPartitionCache()` between batches.
    - *Not applied:* a bottom-up table would be even leaner, but you asked to keep the recursive form from the report.
verify:
  green_block: 0
  test: |-
    const assert = (cond, msg) => { if (!cond) throw new Error(msg || "assertion failed"); };
    assert(partitions(0) === 1n);
    assert(partitions(5) === 7n);
    assert(partitions(5, 2) === 3n);
    assert(partitions(10) === 42n);
    assert(partitions(100) === 190569292n);
    assert(partitions(200) === 3972999029388n);
    assert(partitions(7, 20) === partitions(7));
    assert(partitions(4, 0) === 0n);
    let threw = false;
    try { partitions(-1); } catch (e) { threw = e instanceof RangeError; }
    assert(threw);
    threw = false;
    try { partitions(2.5); } catch (e) { threw = e instanceof RangeError; }
    assert(threw);
    clearPartitionCache();
    assert(cache.size === 0);
    assert(partitions(500) > 0n);
