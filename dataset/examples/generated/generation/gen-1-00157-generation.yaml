messages:
- role: user
  content: |
    Hello, I need one small html page for our team, to show the status of the batch job. We run embeddings for all documents every night with our model, and sometimes it take hours. While job is running I want a moving bar and one small point that is blinking. When job is done the bar is full and green. If failed then red. Status I can get from /api/job-status, it return json like {"state": "running"} or "done" or "failed". We have no framework, only plain html. Can you write it? Thanks!
- role: assistant
  content: |
    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Nightly embedding job</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
        .status { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; }
        .dot { width: .75rem; height: .75rem; border-radius: 50%; background: #9ca3af; }
        .bar { position: relative; height: .5rem; background: #e5e7eb; border-radius: .25rem; overflow: hidden; }
        .bar::before { content: ""; position: absolute; inset: 0; background: #9ca3af; }

        [data-state="running"] .dot { background: #d98200; animation: pulse 1.2s ease-in-out infinite; }
        [data-state="running"] .bar::before { background: #d98200; right: auto; width: 40%; animation: slide 1.5s linear infinite; }
        [data-state="done"] .dot, [data-state="done"] .bar::before { background: #16a34a; }
        [data-state="failed"] .dot, [data-state="failed"] .bar::before { background: #dc2626; }

        @keyframes pulse { 50% { opacity: .25; } }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

        @media (prefers-reduced-motion: reduce) {
          .dot, .bar::before { animation: none !important; }
        }
      </style>
    </head>
    <body>
      <h1>Nightly embedding job</h1>
      <div id="job" data-state="unknown">
        <div class="status"><span class="dot"></span><span id="label">Loading...</span></div>
        <div class="bar"></div>
      </div>
      <p><button id="refresh" type="button">Refresh</button></p>

      <script>
        const job = document.getElementById("job");
        const label = document.getElementById("label");
        const text = { running: "Running", done: "Done", failed: "Failed", unknown: "Status not available" };

        function setState(state) {
          if (!(state in text)) state = "unknown";
          job.dataset.state = state;
          label.textContent = text[state];
        }

        async function refresh() {
          try {
            const res = await fetch("/api/job-status");
            setState((await res.json()).state);
          } catch {
            setState("unknown");
          }
        }

        document.getElementById("refresh").addEventListener("click", refresh);
        refresh();
      </script>
    </body>
    </html>
    ```

    **Green Notes**
    - **CSS keyframes, no JavaScript timer** (reduces E): the bar and the dot are animated only with `transform` and `opacity` in `@keyframes`. The browser runs this without calling your JS on every frame. In Green Metrics Tool measurements of a 20-second animation in a real browser, `requestAnimationFrame` with style updates used about 161 J CPU energy and CSS `@keyframes` about 145 J (about 10% less) ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=4a2085fd-6f43-4f26-a3ee-2a6fcd7db594,58ee50a2-7110-4418-beea-df6ffba5425a)).
    - **Animation runs only in the `running` state:** when the job is done or failed, the bar and dot are static. Nothing keeps animating on a tab that stays open for hours.
    - **`prefers-reduced-motion`** turns the animation off for users who ask for it. This also saves the work.

    The bar has no real percentage, because the API only gives `state`. If the job can report progress, set `width` on the bar from that value instead of the sliding animation.
verify:
  static_only: HTML page with fetch to an API endpoint; needs a browser
