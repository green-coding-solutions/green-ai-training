id: gen-2-00118-generation
category: generation
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    need the html for our nightly visual regression report. build info header, first failed diff big at the top, then a grid with all snapshot diffs (~150 pngs). plain html, CI fills it in.
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Visual regression – build #4821</title>
      <style>
        body {
          margin: 0;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          color: #1f2328;
        }
        header { padding: 1rem 1.25rem; border-bottom: 1px solid #d0d7de; }
        header h1 { margin: 0; font-size: 1.4rem; }
        header dl { display: flex; flex-wrap: wrap; gap: 0.25rem 1.5rem; margin: 0.5rem 0 0; }
        header dt { font-weight: 600; }
        header dd { margin: 0; }
        main { padding: 1.25rem; }
        img { display: block; max-width: 100%; height: auto; border: 1px solid #d0d7de; }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
          gap: 1rem;
          list-style: none;
          margin: 0;
          padding: 0;
        }
        figure { margin: 0; }
        figcaption { font-size: 0.85rem; margin-top: 0.25rem; word-break: break-all; }
        .changed figcaption { color: #cf222e; font-weight: 600; }
      </style>
    </head>
    <body>
      <header>
        <h1>Visual regression report</h1>
        <dl>
          <dt>Build</dt><dd>#4821</dd>
          <dt>Branch</dt><dd>main</dd>
          <dt>Commit</dt><dd><code>3f9c2ab</code></dd>
          <dt>Result</dt><dd>3 of 152 snapshots changed</dd>
        </dl>
      </header>

      <main>
        <section>
          <h2>First failure: checkout/payment-form</h2>
          <a href="diffs/checkout-payment-form.diff.png">
            <img src="diffs/checkout-payment-form.diff.png" width="1280" height="720"
                 alt="Diff of checkout/payment-form against the baseline">
          </a>
        </section>

        <section>
          <h2>All snapshots</h2>
          <ul class="grid">
            <!-- one <li> per snapshot, filled in by the CI job -->
            <li class="changed">
              <figure>
                <a href="diffs/checkout-payment-form.diff.png">
                  <img src="diffs/checkout-payment-form.diff.png" width="1280" height="720"
                       alt="Diff of checkout/payment-form" loading="lazy">
                </a>
                <figcaption>checkout/payment-form (changed)</figcaption>
              </figure>
            </li>
            <li>
              <figure>
                <a href="diffs/account-settings.diff.png">
                  <img src="diffs/account-settings.diff.png" width="1280" height="720"
                       alt="Diff of account/settings" loading="lazy">
                </a>
                <figcaption>account/settings</figcaption>
              </figure>
            </li>
          </ul>
        </section>
      </main>
    </body>
    </html>
    ```

    **Green Notes**
    - **Defer offscreen images** (reduces network and E): about 150 grid PNGs load only when someone scrolls to them. Most people open the report, look at the first failure and close it. In Green Metrics Tool browser benchmarks, a page with photos below the fold used about 12% less CPU energy with `loading="lazy"` on loads without scrolling. When visitors scrolled to the end, there was no difference.
    - **First failure loads eagerly:** it sits above the fold, so it has no `loading="lazy"`. Lazy loading it would only delay the image people came for.

    `width` and `height` on every image reserve the space, so the grid doesn't jump while lazy images load. Paths are relative, so the page works as a downloaded CI artifact too.
verify:
  static_only: HTML page
