id: gen-1-00348-generation
category: generation
language: html
patterns:
- lazy-load-images
messages:
- role: user
  content: |
    Model card page for our ViT classifier. Below the metrics table I need a "Misclassified validation samples" section: about 48 thumbnails, each with true label, predicted label and confidence. Click opens the full-size image in a new tab. Thumbs are 256x256 JPEGs in /samples/thumb/, full images in /samples/full/. I'll do the Jinja loop myself, so just give me the markup for the section plus one card, no full page.
- role: assistant
  content: |
    ```html
    <section id="misclassified" aria-labelledby="mis-title">
      <h2 id="mis-title">Misclassified validation samples</h2>

      <ul class="sample-grid">
        <!-- repeat per sample -->
        <li class="sample">
          <a href="/samples/full/val_00417.jpg" target="_blank" rel="noopener">
            <img
              src="/samples/thumb/val_00417.jpg"
              alt="Validation image 417, true label cat, predicted fox"
              width="256" height="256"
              loading="lazy"
              decoding="async">
          </a>
          <p class="meta">
            <span>true: cat</span>
            <span>pred: fox</span>
            <span>conf: 0.91</span>
          </p>
        </li>
      </ul>
    </section>

    <style>
      .sample-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
        list-style: none;
        padding: 0;
      }
      .sample img { width: 100%; height: auto; aspect-ratio: 1; display: block; }
      .sample .meta { display: flex; flex-direction: column; font-size: 0.85rem; margin: 0.25rem 0 0; }
    </style>
    ```

    **Green Notes**
    - **`loading="lazy"` on the thumbnails** (reduces network): the section sits below the metrics table, so most of the 48 images are never fetched unless the reader scrolls there.
    - **`width`/`height` plus `aspect-ratio`**: the browser reserves the space up front, so lazy images do not shift the layout when they load.
    - **Thumbnails in the grid, full images only on click**: the page never downloads the full-size files unless someone opens them.
    - *Not applied:* if this section moves to the top of the page, drop `loading="lazy"` from the first row. Images visible on load should not be deferred.
    - [Defer offscreen images](https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images)
verify:
  static_only: HTML snippet, no executable code
