id: gen-1-00320-generation
category: generation
language: yaml
patterns:
- text-compression
- compress-transmitted
facts:
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    Traefik v3 dynamic config for our log search UI (container `logview`, port 8080). It serves the SPA, a JSON search API and an NDJSON export, plus a /tail endpoint with server-sent events. TLS on websecure, host logs.internal.example.com. Compress what makes sense. Just the file, no essay.
- role: assistant
  content: |
    ```yaml
    http:
      routers:
        logview:
          rule: Host(`logs.internal.example.com`)
          entryPoints: [websecure]
          tls: {}
          middlewares: [logview-compress]
          service: logview

      middlewares:
        logview-compress:
          compress:
            encodings: [zstd, gzip]
            defaultEncoding: gzip
            minResponseBodyBytes: 1024
            excludedContentTypes:
              - text/event-stream
              - application/gzip
              - application/zstd
              - application/zip

      services:
        logview:
          loadBalancer:
            servers:
              - url: http://logview:8080
    ```

    **Green Notes**
    - **Fast codecs for dynamic responses** (reduces network and server E): search results and NDJSON exports are text that is compressed on every request. In Green Metrics Tool micro-benchmarks (CLI defaults, 100 MB of text), zstd used about 16 J and gzip about 67 J to compress, so about 4× less for zstd. That compares energy only, not compression ratio. gzip stays as the fallback for clients without zstd.
      Pattern: Enable text compression
      Pattern: Compress transmitted data
    - **No brotli here:** at its top quality, brotli cost far more to compress (about 3019 J in the same benchmark). It fits static assets compressed once, not per-request API output.
    - **`/tail` is excluded** (`text/event-stream`): compressing a live stream can delay events because of buffering. Already-compressed downloads and tiny bodies (under 1 KB) are skipped, since they gain nothing.
verify:
  static_only: Traefik dynamic config; needs a running Traefik; syntax checked
