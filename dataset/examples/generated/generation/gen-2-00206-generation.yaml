messages:
- role: user
  content: |
    rollup config for our reviews widget (src/reviews-widget.js). need esm + an iife build for shops that just paste a script tag
- role: assistant
  content: |
    ```javascript
    // rollup.config.mjs
    import resolve from '@rollup/plugin-node-resolve';
    import terser from '@rollup/plugin-terser';

    // `rollup -c -w` sets ROLLUP_WATCH, so dev builds stay readable
    const production = !process.env.ROLLUP_WATCH;

    const minify = () =>
      terser({
        compress: {
          // drop debug logging only; keep console.error/warn so shop owners still see real errors
          pure_funcs: ['console.log', 'console.debug'],
          passes: 2,
        },
        // default comment handling keeps /*! ... */ and @license comments
      });

    export default {
      input: 'src/reviews-widget.js',
      plugins: [resolve({ browser: true })],
      output: [
        {
          file: 'dist/reviews-widget.esm.min.js',
          format: 'es',
          sourcemap: true,
          plugins: production ? [minify()] : [],
        },
        {
          file: 'dist/reviews-widget.min.js',
          format: 'iife',
          name: 'ShopReviews',
          sourcemap: true,
          plugins: production ? [minify()] : [],
        },
      ],
    };
    ```

    ```json
    {
      "scripts": {
        "build": "rollup -c",
        "dev": "rollup -c -w"
      }
    }
    ```

    Install with `npm i -D rollup @rollup/plugin-node-resolve @rollup/plugin-terser`.

    **Green Notes**
    - **Minify once at build time** (reduces network): every shop page that embeds the widget downloads fewer bytes. In Green Metrics Tool page-load benchmarks of a small booking page, a minified build used about 2% less client CPU energy, which is within noise. For a widget this size, the gain is in transferred bytes, not client CPU.
    - **Strip debug logging:** `console.log`/`console.debug` calls are removed from the production build. `console.error` and `console.warn` stay, so the widget still behaves the same when something fails.
    - **External source maps:** the `.map` files are separate, so browsers only fetch them when DevTools is open. Shoppers don't download them.
