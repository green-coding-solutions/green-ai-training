id: gen-1-00010-generation
category: generation
language: html
patterns:
- system-fonts-and-deps
facts:
- F-FONTS
messages:
- role: user
  content: |
    Hello, I need one page for order tracking for our small tea shop "Teehaus Klein". Customer write the order number and see the status. Is only one static html file, the status come from our API `GET /api/orders/{id}` and it return json like `{"status": "packed"}`. Status can be ordered, packed, shipped, delivered. Please make it nice and clean, a little bit modern. Thank you!
- role: assistant
  content: |
    One self-contained file. CSS and JS are inline, so the page needs no other requests except the API call.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Track your order – Teehaus Klein</title>
      <style>
        :root {
          --green: #2f6b4f;
          --line: #d9e2dc;
          --text: #1d2b24;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          padding: 2rem 1rem;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          color: var(--text);
          background: #f6f9f7;
        }
        main {
          max-width: 32rem;
          margin: 0 auto;
          padding: 1.5rem;
          background: #fff;
          border-radius: 12px;
          box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
        }
        h1 { margin-top: 0; font-size: 1.5rem; }
        form { display: flex; gap: .5rem; }
        input {
          flex: 1;
          padding: .6rem .8rem;
          border: 1px solid var(--line);
          border-radius: 8px;
          font: inherit;
        }
        button {
          padding: .6rem 1.1rem;
          border: 0;
          border-radius: 8px;
          background: var(--green);
          color: #fff;
          font: inherit;
          cursor: pointer;
        }
        #message { min-height: 1.5rem; margin: 1rem 0 0; }
        ol { list-style: none; margin: 1rem 0 0; padding: 0; }
        li {
          position: relative;
          padding: .5rem 0 .5rem 2rem;
          color: #8a9a91;
        }
        li::before {
          content: "";
          position: absolute;
          left: 0;
          top: .75rem;
          width: 1rem;
          height: 1rem;
          border: 2px solid var(--line);
          border-radius: 50%;
          background: #fff;
        }
        li.done { color: var(--text); }
        li.done::before { background: var(--green); border-color: var(--green); }
      </style>
    </head>
    <body>
      <main>
        <h1>Where is my tea?</h1>
        <form id="track-form">
          <input id="order-id" name="order" placeholder="Order number" required autocomplete="off">
          <button type="submit">Track</button>
        </form>
        <p id="message" role="status"></p>
        <ol id="steps" hidden>
          <li data-step="ordered">Ordered</li>
          <li data-step="packed">Packed</li>
          <li data-step="shipped">Shipped</li>
          <li data-step="delivered">Delivered</li>
        </ol>
      </main>

      <script>
        const form = document.getElementById('track-form');
        const message = document.getElementById('message');
        const steps = document.getElementById('steps');
        const order = ['ordered', 'packed', 'shipped', 'delivered'];

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const id = document.getElementById('order-id').value.trim();
          message.textContent = 'Looking up your order…';
          steps.hidden = true;

          try {
            const res = await fetch('/api/orders/' + encodeURIComponent(id));
            if (res.status === 404) {
              message.textContent = 'We could not find this order number.';
              return;
            }
            if (!res.ok) throw new Error('HTTP ' + res.status);

            const { status } = await res.json();
            const current = order.indexOf(status);
            if (current === -1) throw new Error('Unknown status');

            steps.querySelectorAll('li').forEach((li, i) => {
              li.classList.toggle('done', i <= current);
            });
            steps.hidden = false;
            message.textContent = 'Status: ' + status;
          } catch (err) {
            message.textContent = 'Something went wrong. Please try again later.';
          }
        });
      </script>
    </body>
    </html>
    ```

    The order number goes through `encodeURIComponent`, and the status is written with `textContent`, so nothing from the user or the API is parsed as HTML.

    **Green Notes**
    - **System font stack** (reduces E, network): the page uses the fonts already on the visitor's device, so there are no font files to download or decode. In Green Metrics Tool page-load micro-benchmarks, a system font stack used about 26% less client CPU energy than six local TTF files and about 16% less than two Latin-subset WOFF2 files.
    - **Single file, no external dependencies:** no CSS framework, icon library or font CDN. The only request after load is the API call, made when the customer presses Track.

    *Not applied:* a custom brand font. If you want one later, use one or two WOFF2 files with a Latin subset, not full TTF sets.
verify:
  static_only: HTML page with inline JS that calls a backend API
