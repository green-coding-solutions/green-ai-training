messages:
- role: user
  content: |
    go cli, postgres. print id and email of users inactive 90+ days. users table: id, email, name, bio text, avatar bytea, prefs jsonb, last_login_at, created_at
- role: assistant
  content: "```go\npackage main\n\nimport (\n\t\"bufio\"\n\t\"database/sql\"\n\t\"flag\"\n\t\"fmt\"\n\t\"log\"\n\t\"os\"\n\
    \n\t_ \"github.com/jackc/pgx/v5/stdlib\"\n)\n\nfunc main() {\n\tdays := flag.Int(\"days\", 90, \"inactive for at least\
    \ this many days\")\n\tflag.Parse()\n\n\tdsn := os.Getenv(\"DATABASE_URL\")\n\tif dsn == \"\" {\n\t\tlog.Fatal(\"DATABASE_URL\
    \ is not set\")\n\t}\n\n\tdb, err := sql.Open(\"pgx\", dsn)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tdefer db.Close()\n\
    \n\tconst query = `\n\t\tSELECT id, email\n\t\tFROM users\n\t\tWHERE last_login_at < now() - make_interval(days => $1)\n\
    \t\tORDER BY id`\n\n\trows, err := db.Query(query, *days)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tdefer rows.Close()\n\
    \n\tout := bufio.NewWriter(os.Stdout)\n\tdefer out.Flush()\n\n\tfor rows.Next() {\n\t\tvar id int64\n\t\tvar email string\n\
    \t\tif err := rows.Scan(&id, &email); err != nil {\n\t\t\tlog.Fatal(err)\n\t\t}\n\t\tfmt.Fprintf(out, \"%d\\t%s\\n\",\
    \ id, email)\n\t}\n\tif err := rows.Err(); err != nil {\n\t\tlog.Fatal(err)\n\t}\n}\n```\n\nRun it with `DATABASE_URL=...\
    \ go run . -days 90`. Users who never logged in (`last_login_at IS NULL`) are not listed. Add `OR last_login_at IS NULL`\
    \ if you want them.\n\n**Green Notes**\n- **Only `id` and `email` are selected** (reduces E, network): `bio`, `avatar`\
    \ and `prefs` are never read, so they are not sent from the database or scanned in Go. In Green Metrics Tool micro-benchmarks\
    \ on a 52-column table with large text columns, naming the 10 needed columns used about 5.5× less CPU energy than `SELECT\
    \ *` at 500 rows. The saving grows with the size of the skipped columns.\n  https://patterns.greensoftware.foundation/development/data-handling/reduce-transmitted-data\n\
    - **Rows are streamed to a buffered writer:** nothing is collected in a slice, so memory stays flat for large user tables.\n\
    - *Not applied:* an index on `last_login_at`. For a CLI that runs now and then, a sequential scan is fine. Add the index\
    \ only if this runs often on a big table.\n"
verify:
  static_only: needs a Postgres database and the pgx module
