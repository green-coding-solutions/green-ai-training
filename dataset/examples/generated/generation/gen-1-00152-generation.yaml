id: gen-1-00152-generation
category: generation
language: css
patterns:
- remove-unused-css
- system-fonts-and-deps
facts:
- F-UNUSED-CSS
- F-FONTS
messages:
- role: user
  content: |
    I need a stylesheet for the static status page of our text classification service (sentiment-v3, ONNX Runtime on CPU). The page is generated by a small script after each deploy and served from the same box as the inference API. Markup is below.

    Requirements:
    - plain CSS, no framework, no preprocessor
    - looks fine on a phone, the latency table must not break the layout
    - dark mode that follows the OS setting
    - rows with class `warn` in the table should stand out
    - monospace block for the example request, long lines must scroll, not wrap
    - keep it readable, the team will edit it by hand

    ```html
    <body>
      <header class="site-head">
        <h1>sentiment-v3</h1>
        <span class="badge badge-ok">serving</span>
      </header>
      <main class="wrap">
        <section class="card">
          <h2>Model</h2>
          <dl class="meta">
            <dt>Version</dt><dd>3.2.1</dd>
            <dt>Input</dt><dd>text, max 512 tokens</dd>
            <dt>Runtime</dt><dd>ONNX Runtime, CPU</dd>
          </dl>
        </section>
        <section class="card">
          <h2>Latency by batch size</h2>
          <div class="table-scroll">
            <table class="latency">
              <thead>
                <tr><th>Batch</th><th class="num">p50 ms</th><th class="num">p95 ms</th><th class="num">req/s</th></tr>
              </thead>
              <tbody>
                <tr><td>1</td><td class="num">12</td><td class="num">19</td><td class="num">81</td></tr>
                <tr><td>8</td><td class="num">41</td><td class="num">58</td><td class="num">190</td></tr>
                <tr class="warn"><td>32</td><td class="num">160</td><td class="num">310</td><td class="num">198</td></tr>
              </tbody>
            </table>
          </div>
        </section>
        <section class="card">
          <h2>Example request</h2>
          <pre class="code"><code>curl -s https://ml.example.internal/v3/classify -H 'content-type: application/json' -d '{"text": "great service"}'</code></pre>
        </section>
      </main>
      <footer class="site-foot">Generated after deploy</footer>
    </body>
    ```
- role: assistant
  content: |
    This stylesheet covers only the elements and classes in your markup, with system fonts and no external files.

    ```css
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #5b6475;
      --line: #dde1e8;
      --ok: #1f7a43;
      --ok-bg: #dff3e6;
      --warn-bg: #fff1d6;
      --code-bg: #eef0f4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e6e9ef;
        --muted: #9aa3b5;
        --line: #2c3340;
        --ok: #6fd39a;
        --ok-bg: #173325;
        --warn-bg: #3a2e12;
        --code-bg: #12151b;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .site-head {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }

    .site-head h1 { margin: 0; font-size: 1.25rem; }

    .badge {
      padding: 0.1rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
    }

    .badge-ok { color: var(--ok); background: var(--ok-bg); }

    .wrap {
      max-width: 48rem;
      margin: 0 auto;
      padding: 1rem;
    }

    .card {
      margin-bottom: 1rem;
      padding: 1rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .card h2 { margin: 0 0 0.75rem; font-size: 1.05rem; }

    .meta {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.25rem 1rem;
      margin: 0;
    }

    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; }

    .table-scroll { overflow-x: auto; }

    .latency {
      width: 100%;
      border-collapse: collapse;
    }

    .latency th,
    .latency td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    .latency th { color: var(--muted); font-weight: 600; }
    .latency .num { text-align: right; font-variant-numeric: tabular-nums; }
    .latency tr.warn td { background: var(--warn-bg); font-weight: 600; }

    .code {
      margin: 0;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      white-space: pre;
      background: var(--code-bg);
      border-radius: 6px;
      font: 0.85rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .site-foot {
      padding: 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .wrap { padding: 0.5rem; }
      .card { padding: 0.75rem 1rem; }
      .meta { grid-template-columns: 1fr; }
      .meta dd { margin-bottom: 0.5rem; }
    }
    ```

    **Green Notes**
    - **Only the rules the page uses** (reduces network): there is no framework and no rule for a class that is not in the markup, so the file stays small. For a stylesheet this size, the client-side energy difference is small. In Green Metrics Tool browser benchmarks, a 16 KB mostly-unused stylesheet used ~783 J for 50 cold page loads and a purged 0.75 KB one ~764 J, about 2%, which is within measurement noise. The gain is fewer bytes on real networks, not less CPU.
    - **System font stack** (reduces E on the client): no font files to download or decode. In the same benchmarks, 30 cold page loads with six local TTF files used ~556 J and the system font stack ~410 J, about 26% less.
    - *Not applied:* minification or a build step. For a stylesheet this small, it adds tooling and makes hand edits harder. If you add a state later, such as `.badge-warn`, add its rule at the same time.
verify:
  static_only: CSS only, no runnable code
