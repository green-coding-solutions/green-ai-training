messages:
- role: user
  content: |
    hello, i need python function for calculate shipping price for many parcels. we run it every night for our webshop, around 3 million parcels. each parcel is tuple `(weight_kg, length_cm, width_cm, height_cm)`. we have config object `cfg` with `cfg.volumetric_divisor` (5000), `cfg.step_kg` (0.5), `cfg.base_cents` and `cfg.per_step_cents`. price is base + number of steps * per step, steps is billable weight divided by step size, round up. billable weight is the bigger one of real weight and volumetric weight (l*w*h / divisor). return list of prices in cents. thank you!
- role: assistant
  content: |
    ```python
    import math


    def shipping_cents(parcels, cfg):
        divisor = cfg.volumetric_divisor
        step = cfg.step_kg
        base = cfg.base_cents
        per_step = cfg.per_step_cents
        ceil = math.ceil

        return [
            base + ceil(max(weight, length * width * height / divisor) / step) * per_step
            for weight, length, width, height in parcels
        ]
    ```

    **Green Notes**
    - **Hoist loop-invariant lookups** (reduces E): the four `cfg` values and `math.ceil` are read once, not once per parcel. For 3 million parcels this removes about 15 million attribute lookups. This is a small win. In Green Metrics Tool micro-benchmarks, caching `math.sqrt` in a local before a 10,000,000-iteration loop saved about 4-5%. It is worth it here because the loop runs every night over millions of rows.

    The config is read once at the start, so changing `cfg` while the function runs has no effect on the result. `parcels` can be a list or a generator.
verify:
  test: |-
    from types import SimpleNamespace
    cfg = SimpleNamespace(volumetric_divisor=5000, step_kg=0.5, base_cents=500, per_step_cents=120)
    parcels = [(2.0, 30, 20, 10), (0.5, 50, 40, 30)]
    assert shipping_cents(parcels, cfg) == [980, 3380]
    assert shipping_cents(iter(parcels), cfg) == [980, 3380]
    assert shipping_cents([], cfg) == []
