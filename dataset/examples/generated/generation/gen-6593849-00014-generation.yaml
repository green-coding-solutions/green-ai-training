facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    I need a bash script that writes a markdown model card for every model in our inference registry. Requirements:

    - Input: a TSV file, columns `name`, `version`, `weights_path`, and maybe more columns that we ignore. Lines starting with `#` and empty lines are skipped. About 1,500 models.
    - Output: one file per model, `<out_dir>/<name>-<version>.md`.
    - Each card has a title, the weights path in backticks, and then the same static text for every model: an "Intended use" paragraph and a "Limits" paragraph. The Limits text mentions the price (`$0.002 per 1k tokens`), the `cost_per_1k` field and the `$MAX_TOKENS` variable name of the gateway. These must appear exactly like this in the cards.
    - A "Generated on" line with the date.
    - It should stop with an error on any failure and print usage if the arguments are wrong.

    Plain bash on a normal Linux build agent, no extra tools please.
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    if [[ $# -ne 2 ]]; then
      printf 'usage: %s models.tsv out_dir\n' "$0" >&2
      exit 1
    fi

    models_file=$1
    out_dir=$2

    [[ -r $models_file ]] || { printf 'cannot read %s\n' "$models_file" >&2; exit 1; }
    mkdir -p "$out_dir"

    INTENDED_USE='Intended for batch and online inference inside the platform. Inputs must be preprocessed with the tokenizer shipped next to the weights.'
    LIMITS='Estimated cost is $0.002 per 1k tokens (see `cost_per_1k`). Inputs longer than the value of `$MAX_TOKENS` are rejected by the gateway. Outputs are not guaranteed to be factual.'

    printf -v built '%(%Y-%m-%d)T' -1

    count=0
    while IFS=$'\t' read -r name version weights _; do
      [[ -z $name || $name == '#'* ]] && continue

      card="$out_dir/$name-$version.md"
      {
        printf '# %s %s\n\n' "$name" "$version"
        printf '**Weights:** `%s`\n\n' "$weights"
        printf '## Intended use\n\n%s\n\n' "$INTENDED_USE"
        printf '## Limits\n\n%s\n\n' "$LIMITS"
        printf 'Generated on %s\n' "$built"
      } > "$card"

      count=$((count + 1))
    done < "$models_file"

    printf 'wrote %d model cards to %s\n' "$count" "$out_dir"
    ```

    The static texts use single quotes, so `$0.002`, `` `cost_per_1k` `` and `$MAX_TOKENS` stay literal in the cards. Under double quotes bash would try to expand them.

    **Green Notes**
    - **Single quotes for literals** (reduces E): every string that needs no expansion is single-quoted, and double quotes appear only around variables. Bash scans double-quoted text for `$`, backticks and backslashes, but takes single-quoted text as is. In Green Metrics Tool micro-benchmarks, assigning a long literal in a loop used about 24% less CPU energy with single quotes. The saving per card is tiny, so it only adds up because the script handles about 1,500 files.
    - **Builtins only in the loop**: `read -r`, `printf` and `$(( ))` are used, and the date comes from `printf -v built '%(%Y-%m-%d)T' -1` once before the loop. So no process is started per model.
    - *Not applied:* quotes around variables are kept on purpose, because paths and names may contain spaces.
verify:
  static_only: bash script writing files; no python or javascript to execute in the verifier
