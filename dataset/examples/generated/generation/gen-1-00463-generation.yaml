- role: assistant
  content: |
    This is a k-way merge. Each file is already sorted, so you only need to compare the current head line of each file. A min-heap holds one line per file.

    ```rust
    use std::cmp::Reverse;
    use std::collections::BinaryHeap;
    use std::io::{self, BufRead, Lines};

    pub struct Entry {
        pub ts: u64, // epoch millis
        pub line: String,
    }

    pub struct Merge<R: BufRead> {
        lines: Vec<Lines<R>>,
        // (ts, file index, line): ties on ts go to the lower file index
        heap: BinaryHeap<Reverse<(u64, usize, String)>>,
        failed: Option<io::Error>,
    }

    fn parse_ts(line: &str) -> io::Result<u64> {
        line.split_whitespace()
            .next()
            .and_then(|t| t.parse().ok())
            .ok_or_else(|| {
                io::Error::new(io::ErrorKind::InvalidData, format!("bad timestamp: {line}"))
            })
    }

    impl<R: BufRead> Merge<R> {
        /// Read the next line of file `i` into the heap.
        fn refill(&mut self, i: usize) -> io::Result<()> {
            if let Some(next) = self.lines[i].next() {
                let line = next?;
                let ts = parse_ts(&line)?;
                self.heap.push(Reverse((ts, i, line)));
            }
            Ok(())
        }
    }

    impl<R: BufRead> Iterator for Merge<R> {
        type Item = io::Result<Entry>;

        fn next(&mut self) -> Option<Self::Item> {
            if let Some(e) = self.failed.take() {
                return Some(Err(e));
            }
            let Reverse((ts, i, line)) = self.heap.pop()?;
            if let Err(e) = self.refill(i) {
                self.failed = Some(e);
            }
            Some(Ok(Entry { ts, line }))
        }
    }

    pub fn merge_logs<R: BufRead>(files: Vec<R>) -> Merge<R> {
        let n = files.len();
        let mut m = Merge {
            lines: files.into_iter().map(|f| f.lines()).collect(),
            heap: BinaryHeap::with_capacity(n),
            failed: None,
        };
        for i in 0..n {
            if let Err(e) = m.refill(i) {
                m.failed.get_or_insert(e);
            }
        }
        m
    }
    ```

    Use it like this:

    ```rust
    let files = paths
        .iter()
        .map(|p| std::fs::File::open(p).map(std::io::BufReader::new))
        .collect::<Result<Vec<_>, _>>()?;
    for entry in merge_logs(files) {
        let e = entry?;
        println!("{}", e.line);
    }
    ```

    Behavior to know:
    - A read error or a line without a numeric timestamp is returned once as `Err`. That file stops contributing. The other files keep merging.
    - If a file is not really sorted, the output is not sorted either. The merge trusts the input order.

    **Green Notes**
    - **K-way merge with a heap** (reduces E): each line is touched once and costs O(log k) for k files. Concatenating everything and sorting costs O(n log n) over all lines.
    - **Lazy iterator** (reduces E and M): only one line per file is in memory, so memory is O(k) and not the size of the logs. Output can be piped straight on without temporary files.
    - **Ties by file index in the tuple:** the order is deterministic without a custom comparator or a stable sort.
    - *Not applied:* parsing the whole line into fields. Only the timestamp is parsed, and the line is passed through as is.
