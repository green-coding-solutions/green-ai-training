id: gen-1-00145-generation
category: generation
language: python
patterns:
- set-membership
facts:
- F-MEMB
messages:
- role: user
  content: |
    hi, im still learning python. i have a REST endpoint where our admins paste a list of emails (up to 500 or so) to invite to our app. i need a function that gives back the emails that are new, and the ones who are already members. we have about 20000 members, i get them from the db as a list of strings. emails can have different upper/lower case, and sometimes the admin pastes the same email twice. keep the order of how they pasted. not sure how to do this the right way
- role: assistant
  content: |
    ```python
    def split_invites(requested: list[str], member_emails: list[str]) -> tuple[list[str], list[str]]:
        """Return (new, already_members). Order is kept, duplicates are dropped."""
        members = {e.strip().lower() for e in member_emails}
        seen = set()
        new = []
        already_members = []

        for raw in requested:
            email = raw.strip().lower()
            if not email or email in seen:
                continue
            seen.add(email)
            if email in members:
                already_members.append(email)
            else:
                new.append(email)

        return new, already_members
    ```

    Both results are lowercased and trimmed, so `Bob@X.com` and `bob@x.com` count as the same person. Empty entries are skipped.

    **Green Notes**
    - **Set for repeated membership tests** (reduces E): each request checks up to 500 emails against 20,000 members. With a list, every check scans the list, so this is about 500 × 20,000 comparisons. The set is built once in O(n), then each check is O(1). The `seen` set also makes the duplicate check O(1).
    - *Not applied:* a set for a single lookup. In Green Metrics Tool micro-benchmarks, one membership test on a 10,000,000-element list (~6.9 J) was cheaper than converting it to a set first and testing once (~10.5 J). A set only pays off when you look up many times, as you do here.
verify:
  test: |-
    new, old = split_invites(
        [" Bob@x.com", "carol@x.com", "bob@x.com", "", "ALICE@x.com", "dave@x.com", "carol@x.com"],
        ["alice@x.com", "Bob@X.com ", "erin@x.com"],
    )
    assert new == ["carol@x.com", "dave@x.com"]
    assert old == ["bob@x.com", "alice@x.com"]
    assert split_invites([], ["a@x.com"]) == ([], [])
    assert split_invites(["a@x.com"], []) == (["a@x.com"], [])
