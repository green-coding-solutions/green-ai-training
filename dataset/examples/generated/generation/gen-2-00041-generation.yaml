    **Green Notes**
    - **Exact-match table lookup** (reduces E): each flag costs one hash lookup. There is no `int(flag)` conversion and no chain of range or membership checks. In Green Metrics Tool micro-benchmarks over 10,000,000 classifications, simple equality dispatch used about 16% less CPU energy than complex range and modulo conditions. That matters here because `usable_levels` calls the function twice per level, for every profile.
    - The table is built once at import time, not on every call. Unknown values such as `'6'`, `'7'` or `''` fall back to `'invalid'`, as your docstring says.
    - *Not applied:* `match`/`case`. With the same conditions it measured within about 1% of `if/elif`, which is noise.
