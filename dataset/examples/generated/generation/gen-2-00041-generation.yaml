    def usable_levels(pres, temp, psal, temp_qc, psal_qc):
        """Levels where both TEMP and PSAL are usable. Runs per profile, ~2M profiles per reprocessing."""
        out = []
        for p, t, s, tq, sq in zip(pres, temp, psal, temp_qc, psal_qc):
            if qc_category(tq) == "good" and qc_category(sq) == "good":
