    def qc_category(flag: str) -> str:
        """Argo QC flag (one char, already decoded from the netCDF file) -> category.

        '0'           -> 'unchecked'
        '1', '2'      -> 'good'
        '5', '8'      -> 'good'      (adjusted / interpolated, still usable)
