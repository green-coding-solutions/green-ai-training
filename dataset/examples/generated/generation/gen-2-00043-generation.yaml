  test: |-
    import sqlite3
    from datetime import datetime, timedelta, timezone

    conn = sqlite3.connect(":memory:")
    conn.execute(
        """CREATE TABLE events (
            id INTEGER PRIMARY KEY, ts TEXT, host TEXT, service TEXT, level TEXT,
            logger TEXT, message TEXT, stack_trace TEXT, request_id TEXT, user_id TEXT,
            http_method TEXT, path TEXT, status INTEGER, duration_ms REAL,
            headers_json TEXT, request_body TEXT, raw_line TEXT)"""
    )
    now = datetime.now(timezone.utc)

    def t(mins):
        return (now - timedelta(minutes=mins)).strftime("%Y-%m-%dT%H:%M:%S")

    data = [
        (t(1), "checkout", "ERROR", "payment timeout", "req-1"),
        (t(5), "checkout", "ERROR", "card declined", None),
        (t(3), "checkout", "INFO", "ok", "req-2"),
        (t(30), "checkout", "ERROR", "old error", "req-3"),
        (t(2), "auth", "ERROR", "bad token", "req-4"),
    ]
    for ts, svc, lvl, msg, rid in data:
        conn.execute(
            "INSERT INTO events (ts, service, level, message, request_id, stack_trace, raw_line) "
            "VALUES (?, ?, ?, ?, ?, ?, ?)",
            (ts, svc, lvl, msg, rid, "x" * 5000, "y" * 500),
        )

    res = fetch_recent_errors(conn, "checkout")
    assert res == [(t(1), "req-1", "payment timeout"), (t(5), None, "card declined")], res
    assert all(len(r) == 3 for r in res)
    assert fetch_recent_errors(conn, "auth") == [(t(2), "req-4", "bad token")]
    assert fetch_recent_errors(conn, "search") == []
    assert len(fetch_recent_errors(conn, "checkout", minutes=60)) == 3
