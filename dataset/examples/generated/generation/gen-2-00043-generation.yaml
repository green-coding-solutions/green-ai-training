  content: |
    ```python
    from datetime import datetime, timedelta, timezone


    def fetch_recent_errors(conn, service, minutes=15):
        """ERROR lines of one service from the last `minutes` minutes, newest first."""
        since = (datetime.now(timezone.utc) - timedelta(minutes=minutes)).strftime(
            "%Y-%m-%dT%H:%M:%S"
        )
        cur = conn.execute(
            """
            SELECT ts, request_id, message
            FROM events
            WHERE service = ?
              AND level = 'ERROR'
              AND ts >= ?
            ORDER BY ts DESC
            """,
            (service, since),
        )
        return cur.fetchall()
    ```

    The `ts >= ?` comparison works on text because your `ts` format is fixed-width UTC, so string order matches time order.

    **Green Notes**
    - **Select only the needed columns** (reduces E and M): `format_alert` uses only `ts`, `request_id` and `message`. So the query skips `stack_trace`, `headers_json`, `request_body` and `raw_line`, the large text columns of a log row. This matters most during an incident, when the alert job reads many error rows for each service. In Green Metrics Tool micro-benchmarks on a 52-column PostgreSQL table with large text columns, `SELECT *` used about 5.5-7× the energy of naming the 10 needed columns.
    - **Column order matches the unpacking:** `for ts, request_id, message in rows` needs exactly these three columns in this order. `SELECT *` would fail at that line, because each row would have 17 values.
