id: gen-1-00139-generation
category: generation
language: javascript
patterns:
- minify-assets
- text-compression
messages:
- role: user
  content: |
    hi, I made a small status page for our sensor gateway (Raspberry Pi class box, Node serves it over plain http on the local network). It has src/index.html, src/app.js (imports chart.js and a small helper file) and src/style.css. Right now I just copy the src folder to the device with scp. It works but the page loads slowly when I open it over the site WiFi, and the device storage is almost full. I'm not sure what I'm doing wrong. Can you write me something to prepare the files before copying them?
- role: assistant
  content: |
    Nothing is wrong with your code. The `src` folder is just not meant to be shipped as it is. It holds unminified source, and the browser has to fetch `chart.js` and your helper as separate files. A small build step fixes both. It bundles and minifies the JS and CSS, and it also writes gzip copies once, so the gateway doesn't compress anything while serving.

    Install esbuild on your dev machine, not on the device: `npm install --save-dev esbuild`

    ```javascript
    // build.mjs
    import { build } from 'esbuild';
    import { cp, mkdir, readFile, rm, writeFile } from 'node:fs/promises';
    import { gzipSync } from 'node:zlib';

    await rm('dist', { recursive: true, force: true });
    await mkdir('dist', { recursive: true });

    await build({
      entryPoints: { app: 'src/app.js', style: 'src/style.css' },
      bundle: true,            // chart.js + helper end up in one file
      minify: true,
      target: 'es2019',        // older browsers on old tablets still work
      sourcemap: false,        // do not ship source maps to the device
      legalComments: 'none',
      define: { 'process.env.NODE_ENV': '"production"' },
      outdir: 'dist',
    });

    await cp('src/index.html', 'dist/index.html');

    // Compress once per release. Keep the plain files as a fallback.
    for (const file of ['app.js', 'style.css', 'index.html']) {
      const data = await readFile(`dist/${file}`);
      await writeFile(`dist/${file}.gz`, gzipSync(data, { level: 9 }));
    }

    console.log('dist/ is ready');
    ```

    Then copy only `dist/` to the device:

    ```bash
    node build.mjs && scp -r dist/ pi@gateway.local:/opt/status-ui/
    ```

    Your Node server must send the `.gz` file with the header `Content-Encoding: gzip` when the browser sends `Accept-Encoding: gzip`. Many static file servers can do this for you. Check this once with your browser's network tab.

    **Green Notes**
    - **Minify web assets** (reduces network and storage): the bundle drops whitespace, comments and unused code, and replaces several requests with one. Every page load over WiFi moves fewer bytes, and `dist/` takes less flash space. No source maps are shipped.
      https://patterns.greensoftware.foundation/development/web-performance/minify-web-assets
    - **Enable text compression** (reduces network): gzip is made at build time, so the small CPU of the gateway is not used per request. I used gzip and not Brotli because browsers only ask for Brotli over HTTPS, and your page uses plain http.
      https://patterns.greensoftware.foundation/development/web-performance/enable-text-compression
    - *Not applied:* a CDN or server-side rendering. This is a status page for a few users on a local network, so they would only add complexity.
verify:
  static_only: needs esbuild and a project layout (src/ files); syntax checked only
