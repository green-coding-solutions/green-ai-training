- role: assistant
  content: |
    Here is `mini-cart.css` for that markup. It covers only the classes the drawer uses, and it no longer imports the theme:

    ```css
    /* mini-cart.css: only the rules the drawer markup uses */

    .mini-cart {
      position: fixed;
      inset: 0 0 0 auto;
      width: min(100%, 420px);
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: -4px 0 16px rgb(0 0 0 / 0.15);
      z-index: 1000;
    }

    .mini-cart__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e5e5e5;
    }

    .mini-cart__head h2 {
      margin: 0;
      font-size: 1.125rem;
    }

    .mini-cart__close {
      border: 0;
      background: none;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
    }

    .mini-cart__items {
      flex: 1;
      overflow-y: auto;
      margin: 0;
      padding: 0 1.25rem;
      list-style: none;
    }

    .cart-line {
      display: grid;
      grid-template-columns: 64px 1fr auto auto;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 0;
      border-bottom: 1px solid #eee;
    }

    .cart-line__thumb {
      display: block;
      border-radius: 4px;
      object-fit: cover;
    }

    .cart-line__info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .cart-line__name {
      color: inherit;
      font-weight: 600;
      text-decoration: none;
    }

    .cart-line__name:hover {
      text-decoration: underline;
    }

    .cart-line__variant {
      font-size: 0.875rem;
      color: #666;
    }

    .cart-line__price {
      font-weight: 600;
      white-space: nowrap;
    }

    .qty {
      display: inline-flex;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .qty__btn {
      width: 2rem;
      border: 0;
      background: none;
      font: inherit;
      cursor: pointer;
    }

    .qty__btn:hover {
      background: #f5f5f5;
    }

    .qty__input {
      width: 2.5rem;
      border: 0;
      font: inherit;
      text-align: center;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .qty__input::-webkit-inner-spin-button,
    .qty__input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .mini-cart__foot {
      padding: 1rem 1.25rem;
      border-top: 1px solid #e5e5e5;
    }

    .mini-cart__row {
      display: flex;
      justify-content: space-between;
      margin: 0 0 0.25rem;
    }

    .mini-cart__note {
      margin: 0 0 1rem;
      font-size: 0.8125rem;
      color: #666;
    }

    /* Scoped so these rules can't clash with the theme's .btn on other pages */
    .mini-cart .btn {
      display: block;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .mini-cart .btn--primary {
      background: #1a1a1a;
      color: #fff;
    }

    .mini-cart .btn--primary:hover {
      background: #333;
    }

    .mini-cart__close:focus-visible,
    .qty__btn:focus-visible,
    .mini-cart .btn:focus-visible {
      outline: 2px solid #1a73e8;
      outline-offset: 2px;
    }
    ```

    **Green Notes**
    - **Remove unused CSS** (reduces network): the stub imported the whole theme just to get `.btn`. Three small rules now replace it, so the drawer sends only CSS that its markup uses. In Green Metrics Tool browser benchmarks, a 16 KB stylesheet with mostly unused rules and the same sheet purged and minified to 0.75 KB differed by about 2% in client CPU energy. That is within measurement noise. The gain is fewer bytes on real networks, such as shoppers on mobile data, not less CPU work in the browser.

    Before you ship, check that nothing else on the page got the theme only through this file. If something did, link the theme there directly.
