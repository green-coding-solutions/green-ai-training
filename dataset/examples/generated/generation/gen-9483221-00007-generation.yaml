messages:
- role: user
  content: |
    bash script to put the same .gitignore in every subfolder of ~/projects, skip if there is one already
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    root=${1:-"$HOME/projects"}

    template='# Dependencies
    node_modules/
    .venv/
    __pycache__/

    # Build output
    dist/
    build/
    *.o

    # Environment and local files
    .env
    .env.*
    *.log
    .DS_Store
    .idea/
    .vscode/'

    created=0
    skipped=0

    for dir in "$root"/*/; do
      [[ -d $dir ]] || continue
      if [[ -e ${dir}.gitignore ]]; then
        skipped=$((skipped + 1))
        continue
      fi
      printf '%s\n' "$template" > "${dir}.gitignore"
      created=$((created + 1))
    done

    printf 'created: %d, skipped: %d\n' "$created" "$skipped"
    ```

    Pass another folder as the first argument if it is not `~/projects`. Only direct subfolders are handled, and existing `.gitignore` files are never touched.

    **Green Notes**
    - **Single quotes for literals** (reduces E): the template and the format strings have no `$`, backticks or backslashes, so they are single-quoted and bash does not scan them for expansion. Variables stay in double quotes where they must expand. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a 1,000,000-iteration loop used about 24% less CPU energy with single quotes. Here the template is short and the loop runs once per folder, so the real saving is tiny. It is simply the right default.
    - **Builtins only** (reduces E): the loop uses `[[ ]]`, `$(( ))` and `printf`, so it starts no process per folder. In the same micro-benchmarks, a log-parsing loop that forked `echo | cut` and `expr` per line used about 300× more energy than the builtin version.
  verify:
    static_only: bash script that writes into the user's home directory
