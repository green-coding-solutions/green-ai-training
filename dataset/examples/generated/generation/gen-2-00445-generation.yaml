    **Green Notes**
    - **Lazy loading below the fold** (reduces network and client work): the first two neighbours are likely visible on load, so they stay eager. The rest have `loading="lazy"`. The query image is never lazy, and has `fetchpriority="high"`.
    - **Fixed `width`/`height` on every image:** the browser reserves space, so lazy images don't shift the layout when they load.
    - *Caveat:* in Green Metrics Tool micro-benchmarks, lazy loading cut about 12% of energy on page loads where the visitor did not scroll. When the visitor scrolled to the end, there was no difference. If people usually scroll through all 8 results, the gain is small.
    - **System font stack:** no web font files to download.
