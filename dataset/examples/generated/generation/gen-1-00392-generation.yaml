id: gen-1-00392-generation
category: generation
language: javascript
patterns:
- system-fonts-and-deps
messages:
- role: user
  content: |
    hi, i want to make a small api for short links for our team, like bit.ly but only for us. you post a url and get a short code back, and when you open the code it goes to the url. i followed a tutorial but it say to install express, nanoid, validator, body-parser, cors and lodash. my node_modules is very big now and npm install is slow, i dont know if i am doing something wrong. can you write it for me? node 20
- role: assistant
  content: |
    You are not doing anything wrong. The tutorial just uses a package for every small job. For three routes, Node's built-in modules are enough.

    ```javascript
    const http = require("node:http");
    const { randomBytes } = require("node:crypto");

    const links = new Map(); // code -> target url (kept in memory)

    function newCode() {
      let code;
      do {
        code = randomBytes(5).toString("base64url"); // 7 URL-safe characters
      } while (links.has(code));
      return code;
    }

    // Returns a clean URL string for http(s) links, otherwise null.
    function parseTarget(value) {
      try {
        const url = new URL(value);
        return url.protocol === "http:" || url.protocol === "https:" ? url.href : null;
      } catch {
        return null;
      }
    }

    function readJson(req, limit = 10_000) {
      return new Promise((resolve, reject) => {
        const chunks = [];
        let size = 0;
        req.on("data", (chunk) => {
          size += chunk.length;
          if (size > limit) {
            reject(Object.assign(new Error("body too large"), { status: 413 }));
          } else {
            chunks.push(chunk);
          }
        });
        req.on("end", () => {
          try {
            resolve(JSON.parse(Buffer.concat(chunks).toString("utf8")));
          } catch {
            reject(Object.assign(new Error("invalid JSON"), { status: 400 }));
          }
        });
        req.on("error", reject);
      });
    }

    function send(res, status, body, headers = {}) {
      const payload = body === undefined ? "" : JSON.stringify(body);
      res.writeHead(status, { "Content-Type": "application/json", ...headers });
      res.end(payload);
    }

    function createApp() {
      return http.createServer(async (req, res) => {
        const { pathname } = new URL(req.url, "http://localhost");

        if (req.method === "POST" && pathname === "/links") {
          let body;
          try {
            body = await readJson(req);
          } catch (err) {
            return send(res, err.status || 400, { error: err.message });
          }
          const target = parseTarget(body?.url);
          if (!target) {
            return send(res, 400, { error: "url must be a valid http or https URL" });
          }
          const code = newCode();
          links.set(code, target);
          return send(res, 201, { code, url: target });
        }

        if (req.method === "GET" && pathname.length > 1) {
          const target = links.get(pathname.slice(1));
          if (target) {
            res.writeHead(302, { Location: target });
            return res.end();
          }
        }

        send(res, 404, { error: "not found" });
      });
    }

    module.exports = { createApp };

    if (require.main === module) {
      createApp().listen(3000, () => console.log("listening on :3000"));
    }
    ```

    Try it:

    ```bash
    curl -X POST localhost:3000/links -H 'Content-Type: application/json' -d '{"url":"https://example.com/some/long/path"}'
    ```

    Open `http://localhost:3000/<code>` and it redirects. You have no `npm install` step at all now.

    **Green Notes**
    - **No extra dependencies** (reduces E and M): `crypto.randomBytes` replaces nanoid, `new URL()` replaces validator, and reading the JSON body replaces body-parser. Fewer packages means a smaller install, a smaller container image, less code to load at startup, and fewer packages to keep updated.
    - **Strict URL check:** only `http:` and `https:` are accepted, so `javascript:` links are rejected. A package would not give you this by default.
    - *Not applied:* Express. For three routes `node:http` is enough. If the API grows to many routes with auth and middleware, adding Express is a fair choice then.

    Links are kept in memory, so they are lost on restart. If you need them to survive, write them to a small SQLite or JSON file. Also add a `Access-Control-Allow-Origin` header if a web page on another origin will call the API.
verify:
  module: true
  green_block: 0
  test: |-
    const assert = require("node:assert");
    (async () => {
      const server = createApp();
      await new Promise((resolve) => server.listen(0, resolve));
      const base = `http://127.0.0.1:${server.address().port}`;
      const post = (payload, raw) =>
        fetch(base + "/links", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: raw !== undefined ? raw : JSON.stringify(payload),
        });

      let r = await post({ url: "https://example.com/a?b=1" });
      assert.strictEqual(r.status, 201);
      const j = await r.json();
      assert.strictEqual(j.code.length, 7);
      assert.strictEqual(j.url, "https://example.com/a?b=1");

      r = await fetch(base + "/" + j.code, { redirect: "manual" });
      assert.strictEqual(r.status, 302);
      assert.strictEqual(r.headers.get("location"), "https://example.com/a?b=1");

      assert.strictEqual((await post({ url: "javascript:alert(1)" })).status, 400);
      assert.strictEqual((await post({ url: "nope" })).status, 400);
      assert.strictEqual((await post({})).status, 400);
      assert.strictEqual((await post(null, "{not json")).status, 400);
      assert.strictEqual((await fetch(base + "/zzzzzzz")).status, 404);

      if (server.closeAllConnections) server.closeAllConnections();
      server.close();
    })().catch((e) => {
      console.error(e);
      process.exit(1);
    });
