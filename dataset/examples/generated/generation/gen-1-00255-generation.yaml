id: gen-1-00255-generation
category: generation
language: python
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    py func for our ledger ETL. rows are dicts, `posted_on` is an ISO string 'YYYY-MM-DD'. add `fiscal_quarter`, FY starts in April (Apr-Jun = Q1 ... Jan-Mar = Q4). millions of rows per run, so make it a generator. just the code
- role: assistant
  content: |
    ```python
    from collections.abc import Iterable, Iterator

    # Fiscal year starts in April.
    _QUARTER_BY_MONTH = {
        4: "Q1", 5: "Q1", 6: "Q1",
        7: "Q2", 8: "Q2", 9: "Q2",
        10: "Q3", 11: "Q3", 12: "Q3",
        1: "Q4", 2: "Q4", 3: "Q4",
    }


    def add_fiscal_quarter(rows: Iterable[dict]) -> Iterator[dict]:
        for row in rows:
            month = int(row["posted_on"][5:7])
            quarter = _QUARTER_BY_MONTH.get(month)
            if quarter is None:
                raise ValueError(f"bad month in posted_on: {row['posted_on']!r}")
            yield {**row, "fiscal_quarter": quarter}
    ```

    **Green Notes**
    - **Simple equality lookup instead of range/modulo guards** (reduces E): the month is matched by key, not by a chain like `4 <= m <= 6` or `(m - 4) % 12 // 3`. This runs once per row. In Green Metrics Tool micro-benchmarks of 10,000,000 classifications, simple equality branches used about 16% less CPU energy than complex range/modulo conditions. That benchmark compared `if/elif` branches, not dict lookups, and `match` vs `if/elif` made no difference there, so the gain comes from the simpler condition.
    - **Slicing instead of date parsing:** `[5:7]` reads the month directly. This assumes the strict `YYYY-MM-DD` format, and a month outside 1-12 raises `ValueError` instead of getting a wrong quarter.
verify:
  test: |-
    out = list(add_fiscal_quarter([
        {"id": 1, "posted_on": "2024-04-01"},
        {"id": 2, "posted_on": "2024-06-30"},
        {"id": 3, "posted_on": "2024-07-15"},
        {"id": 4, "posted_on": "2024-12-31"},
        {"id": 5, "posted_on": "2025-01-01"},
        {"id": 6, "posted_on": "2025-03-31"},
    ]))
    assert [r["fiscal_quarter"] for r in out] == ["Q1", "Q1", "Q2", "Q3", "Q4", "Q4"]
    assert out[0]["id"] == 1 and out[0]["posted_on"] == "2024-04-01"
    expected = {m: f"Q{(((m - 4) % 12) // 3) + 1}" for m in range(1, 13)}
    for m, q in expected.items():
        r = next(add_fiscal_quarter([{"posted_on": f"2023-{m:02d}-10"}]))
        assert r["fiscal_quarter"] == q
    import types
    assert isinstance(add_fiscal_quarter([]), types.GeneratorType)
    try:
        list(add_fiscal_quarter([{"posted_on": "2024-13-01"}]))
        raise SystemExit("expected ValueError")
    except ValueError:
        pass
