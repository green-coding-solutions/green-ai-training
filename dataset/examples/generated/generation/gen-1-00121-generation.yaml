messages:
- role: user
  content: |
    API explorer page for our REST API docs. The endpoint list loads from /v1/endpoints, takes a second or two. Need skeleton placeholder rows with a shimmer while it loads. CSS only, no JS, no library. Just the CSS.
- role: assistant
  content: |-
    ```css
    .skeleton-row {
      position: relative;
      overflow: hidden;
      height: 3rem;
      margin-bottom: 0.5rem;
      border-radius: 6px;
      background: #e8ebef;
    }

    .skeleton-row::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: translateX(-100%);
      animation: skeleton-shimmer 1.4s linear infinite;
    }

    @keyframes skeleton-shimmer {
      to {
        transform: translateX(100%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton-row::after {
        animation: none;
      }
    }
    ```

    Remove the placeholder rows from the DOM when the data arrives. Then the animation stops completely.

    **Green Notes**
    - **CSS `@keyframes` instead of a JS-driven animation** (reduces E): the browser runs the shimmer itself, with no script callback on every frame. In Green Metrics Tool micro-benchmarks (20-second animation in a real browser), CSS `@keyframes` used about 145 J of CPU energy and a JavaScript `requestAnimationFrame` version about 161 J, roughly 10% less.
    - **Animate `transform`, not `background-position`** (reduces E): moving a pseudo-element with `transform` avoids layout and repaint of the row on every frame. A `background-position` shimmer repaints the row each frame.
    - **`prefers-reduced-motion`** turns the animation off for users who ask for it, which also saves the work.
