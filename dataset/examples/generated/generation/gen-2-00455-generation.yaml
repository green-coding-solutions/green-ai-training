messages:
- role: user
  content: |
    Need `notify_subscribers(order, subscribers)` for our order service. After an order is paid, POST the order JSON to every partner webhook (fulfillment, accounting, 3PL, usually 5-12 per order). Each subscriber has `url` and `secret`, sign the body with HMAC-SHA256 in `X-Signature`. 5s timeout. Return status per URL, don't raise on failures. httpx is fine. Just the code.
- role: assistant
  content: |
    ```python
    import asyncio
    import hashlib
    import hmac
    import json

    import httpx

    MAX_CONCURRENCY = 10
    TIMEOUT = httpx.Timeout(5.0)


    async def _post(client, sem, sub, body):
        sig = hmac.new(sub["secret"].encode(), body, hashlib.sha256).hexdigest()
        async with sem:
            try:
                resp = await client.post(
                    sub["url"],
                    content=body,
                    headers={"Content-Type": "application/json", "X-Signature": sig},
                )
                return sub["url"], resp.status_code
            except httpx.HTTPError as exc:
                return sub["url"], f"error: {type(exc).__name__}"


    async def notify_subscribers(order: dict, subscribers: list[dict]) -> dict:
        body = json.dumps({"event": "order.paid", "order": order}, sort_keys=True).encode()
        sem = asyncio.Semaphore(MAX_CONCURRENCY)
        async with httpx.AsyncClient(timeout=TIMEOUT) as client:
            results = await asyncio.gather(*(_post(client, sem, s, body) for s in subscribers))
        return dict(results)


    # From sync code: statuses = asyncio.run(notify_subscribers(order, subscribers))
    ```

    Failures are returned per URL and never raised, so one dead endpoint can't hide the results of the others. Retries are left to the caller.

    **Green Notes**
    - **Async concurrent I/O** (reduces E, wall time): the subscriber calls wait on the network, so they overlap instead of running one after another. The body is serialized and the client is created once per order. In Green Metrics Tool micro-benchmarks with 10 HTTP requests, async `httpx` used about 7% less CPU energy and about 17% less wall time than sync `urllib`. At this scale the gain is mostly wall time, and it grows with the number of subscribers.
    - The semaphore caps open connections, so a large subscriber list can't open hundreds of sockets at once.

    *Not applied:* async for single calls. If an order only ever notifies one endpoint, a plain sync `httpx.post` is simpler and saves nothing extra.
