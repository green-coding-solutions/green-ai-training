messages:
- role: user
  content: |
    I need a static HTML page for the weekly review of our skin-lesion classifier (EfficientNet, runs in our clinic's research cluster). A Python job already writes the images into `assets/`, I only need the page. Requirements:

    - Header with model version `v2.3.1`, week number and a short summary line (accuracy 91.4%, 1,248 predictions, 37 flagged for review).
    - The confusion matrix `assets/confusion_matrix.png` (1200x900) directly under the header, it is the first thing the reviewers look at.
    - Below it a grid of Grad-CAM overlays of the flagged cases: `assets/gradcam/case_0412.jpg`, `case_0415.jpg`, `case_0431.jpg`, `case_0447.jpg`, `case_0452.jpg`, `case_0460.jpg` (each 512x512). Under each image the predicted label, the confidence and the true label.
    - Plain CSS in a `<style>` block, no frameworks, no JavaScript. Should look clean on a laptop and on a tablet.
    - Alt texts please, the reviewers use screen readers sometimes.

    The real page will have around 40 overlays, but six is enough to show me the structure.
- role: assistant
  content: |
    Here is the page. Add more `<figure>` blocks in the same form for the remaining cases.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Skin-lesion classifier: weekly review</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0; color: #1d2733; background: #f6f7f9; }
        header, main { max-width: 1100px; margin: 0 auto; padding: 1rem 1.5rem; }
        header p { margin: 0.25rem 0; }
        .matrix img { width: 100%; height: auto; background: #fff; border: 1px solid #d5d9df; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
        figure { margin: 0; background: #fff; border: 1px solid #d5d9df; border-radius: 6px; padding: 0.5rem; }
        figure img { width: 100%; height: auto; display: block; }
        figcaption { font-size: 0.9rem; padding-top: 0.5rem; }
      </style>
    </head>
    <body>
      <header>
        <h1>Skin-lesion classifier: weekly review</h1>
        <p>Model <strong>v2.3.1</strong> · Week 43</p>
        <p>Accuracy 91.4% · 1,248 predictions · 37 flagged for review</p>
      </header>

      <main>
        <section class="matrix">
          <h2>Confusion matrix</h2>
          <img src="assets/confusion_matrix.png" width="1200" height="900"
               alt="Confusion matrix of predicted versus true lesion classes for this week">
        </section>

        <section>
          <h2>Flagged cases (Grad-CAM)</h2>
          <div class="grid">
            <figure>
              <img src="assets/gradcam/case_0412.jpg" width="512" height="512" loading="lazy"
                   alt="Grad-CAM heat map over the lesion in case 0412">
              <figcaption>Case 0412<br>Predicted: nevus (0.62)<br>True: melanoma</figcaption>
            </figure>
            <figure>
              <img src="assets/gradcam/case_0415.jpg" width="512" height="512" loading="lazy"
                   alt="Grad-CAM heat map over the lesion in case 0415">
              <figcaption>Case 0415<br>Predicted: melanoma (0.71)<br>True: nevus</figcaption>
            </figure>
            <figure>
              <img src="assets/gradcam/case_0431.jpg" width="512" height="512" loading="lazy"
                   alt="Grad-CAM heat map over the lesion in case 0431">
              <figcaption>Case 0431<br>Predicted: keratosis (0.58)<br>True: basal cell carcinoma</figcaption>
            </figure>
            <figure>
              <img src="assets/gradcam/case_0447.jpg" width="512" height="512" loading="lazy"
                   alt="Grad-CAM heat map over the lesion in case 0447">
              <figcaption>Case 0447<br>Predicted: nevus (0.66)<br>True: keratosis</figcaption>
            </figure>
            <figure>
              <img src="assets/gradcam/case_0452.jpg" width="512" height="512" loading="lazy"
                   alt="Grad-CAM heat map over the lesion in case 0452">
              <figcaption>Case 0452<br>Predicted: melanoma (0.55)<br>True: nevus</figcaption>
            </figure>
            <figure>
              <img src="assets/gradcam/case_0460.jpg" width="512" height="512" loading="lazy"
                   alt="Grad-CAM heat map over the lesion in case 0460">
              <figcaption>Case 0460<br>Predicted: basal cell carcinoma (0.69)<br>True: keratosis</figcaption>
            </figure>
          </div>
        </section>
      </main>
    </body>
    </html>
    ```

    The captions use made-up labels and confidences. Replace them with the values from your job. I set `width` and `height` on every image, so the browser reserves the space and the layout does not jump while images load. The grid uses `auto-fill`, so it adapts from laptop to tablet without media queries.

    **Green Notes**
    - **Lazy-load offscreen images** (reduces network and E): the Grad-CAM overlays are below the fold, so they carry `loading="lazy"`. With around 40 of them, a reviewer who only checks the summary and the matrix never downloads or decodes them. In Green Metrics Tool micro-benchmarks, an article with 15 photos used about 12% less CPU energy on page loads without scrolling.
    - **Confusion matrix stays eager** (reduces E): it is the first thing people see, so it has no `loading` attribute. Lazy-loading an image above the fold only delays it.
    - *Not applied:* if reviewers always scroll through all 40 cases, lazy loading saves nothing. In the same benchmark, loads that scrolled to the end showed no difference. It is still harmless there, so I kept it.
verify:
  static_only: static HTML page, no executable code
