id: gen-1-00092-generation
category: generation
language: bash
patterns:
- bash-quoting
- bash-builtins
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    hello, i need bash script for make product feed xml for our shop. input is csv file with sku,price,name (about 80000 lines, name can have & or < sign sometimes). output is xml file with one item for each line. we upload it to google shopping evry night. thx
- role: assistant
  content: |
    The name is the last field, so `read` puts any extra commas into it.

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    in_file=${1:?'usage: make_feed.sh skus.csv feed.xml'}
    out_file=${2:?'usage: make_feed.sh skus.csv feed.xml'}

    header='<?xml version="1.0" encoding="UTF-8"?>
    <rss version="2.0" xmlns:g="http://base.google.com/ns/1.0">
    <channel>
    <title>Shop product feed</title>'

    {
      printf '%s\n' "$header"
      while IFS=, read -r sku price name; do
        name=${name//'&'/'&amp;'}
        name=${name//'<'/'&lt;'}
        name=${name//'>'/'&gt;'}
        printf '<item><g:id>%s</g:id><title>%s</title><g:price>%s EUR</g:price></item>\n' \
          "$sku" "$name" "$price"
      done < "$in_file"
      printf '%s\n' '</channel>' '</rss>'
    } > "$out_file"
    ```

    Run it with `./make_feed.sh skus.csv feed.xml`. The CSV must have no header line. Prices are written as they are in the file.

    **Green Notes**
    - **Single quotes for fixed text** (reduces E): the header, the `printf` format and the replacement strings need no expansion, so they use single quotes. Variables like `"$sku"` and `"$header"` keep double quotes. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes than with double quotes ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=dd9bbb4e-b056-4067-8ad2-7b1818a86f10,b265ef9b-adb9-4b56-a14b-ae34fdaa7247,28d92c15-79d7-44ca-8f43-a733fe2e265a,a9533378-71f0-49df-bd5f-1e5f27cda9c2)). Your literals are short, so the saving here is small. It grows with literal length and loop count.
    - **Bash builtins only** (reduces E): the `&`, `<` and `>` escaping uses parameter expansion, not `sed` per line. This avoids about 80,000 process forks per run. Quoting the `'&amp;'` replacement also keeps it literal in Bash 5.2 and newer, where an unquoted `&` in a replacement means "the matched text".
    - **One output redirect** (reduces E): the `{ ... } > "$out_file"` group opens the file once, not once per line.
verify:
  static_only: bash script reading a CSV file and writing a feed file; no deterministic stdout driver
