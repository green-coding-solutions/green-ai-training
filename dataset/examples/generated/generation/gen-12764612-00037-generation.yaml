messages:
- role: user
  content: |
    css for the html report my cli `diffsum` writes. just h1, a meta line, one table (file, added, removed), rows can be .added .removed or .unchanged
- role: assistant
  content: |
    ```css
    body {
      font-family: system-ui, sans-serif;
      max-width: 48rem;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.25rem;
    }

    .meta {
      color: #555;
      margin: 0 0 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th:not(:first-child),
    td:not(:first-child) {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    tr.added td {
      background: #e6f6e6;
    }

    tr.removed td {
      background: #fbe9e9;
    }

    tr.unchanged td {
      color: #777;
    }
    ```

    Put it in a `<style>` block or inline it when `diffsum` writes the file, so the report stays one self-contained HTML file.

    **Green Notes**
    - **No unused CSS** (reduces network): the sheet has rules only for the elements and classes the report uses, and no framework or reset is pulled in. This saves bytes, not CPU. In Green Metrics Tool micro-benchmarks, purging a 16 KB stylesheet to 0.75 KB changed client energy by about 2%, which is within noise. For a small local report, the gain is mostly a smaller file to write, store and send.
    - *Not applied:* a build step to purge or minify the CSS. The sheet is small and hand-written, so a tool would add more than it saves.
verify:
