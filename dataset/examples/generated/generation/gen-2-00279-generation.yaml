    Replace the gallery `alt` texts with short descriptions of each photo. Every image has `width` and `height`, so the browser reserves the space and the layout does not jump when lazy images arrive.

    **Green Notes**
    - **Defer offscreen images** (reduces E, network): the tour cards and the gallery are below the hero, so they use `loading="lazy"`. The browser only fetches and decodes them when the visitor scrolls near them. In Green Metrics Tool measurements of an article with 15 photos, lazy loading below the fold used about 12% less CPU energy on page loads without scrolling. When visitors scrolled to the end, there was no difference (about 1%, which is noise). The gain comes from visitors who book or leave before they reach the gallery.
    - **Hero loads eagerly:** it is the first thing visitors see. Lazy loading it would only delay it, so it has no `loading` attribute and gets `fetchpriority="high"`.
