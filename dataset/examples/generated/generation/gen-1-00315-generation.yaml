id: gen-1-00315-generation
category: generation
language: css
patterns:
- remove-unused-css
- system-fonts-and-deps
messages:
- role: user
  content: |
    hi, i make a small python script that writes a html report from our server logs every night. the page looks wrong, text is very big and the table has no lines. i added bootstrap.min.css because i read it makes pages nice but nothing changed. what is wrong? this is my template:

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Log report</title>
      <link rel="stylesheet" href="bootstrap.min.css">
    </head>
    <body>
      <main class="report">
        <h1>Nightly log report</h1>
        <p class="generated">Generated {{ generated_at }}</p>
        <ul class="summary">
          <li class="count level-error">{{ n_error }} errors</li>
          <li class="count level-warn">{{ n_warn }} warnings</li>
          <li class="count level-info">{{ n_info }} info</li>
        </ul>
        <table class="entries">
          <thead>
            <tr><th>Time</th><th>Level</th><th>Message</th></tr>
          </thead>
          <tbody>
          {% for e in entries %}
            <tr class="level-{{ e.level }}">
              <td class="time">{{ e.time }}</td>
              <td>{{ e.level }}</td>
              <td class="msg">{{ e.msg }}</td>
            </tr>
          {% endfor %}
          </tbody>
        </table>
      </main>
    </body>
    </html>
    ```

    can you write the css so it looks ok? errors red, warnings yellow.
- role: assistant
  content: |
    Bootstrap works through its own class names (`container`, `table`, `table-striped`, ...). Your template uses none of them, so the file loads but styles almost nothing. Your own classes (`report`, `entries`, `level-error`, ...) have no rules yet.

    Replace the Bootstrap link with a small stylesheet that covers only your classes:

    ```html
    <link rel="stylesheet" href="report.css">
    ```

    ```css
    /* report.css: rules only for the classes used in the template */
    body {
      margin: 0;
      font: 16px/1.5 system-ui, sans-serif;
      color: #1b1f23;
      background: #fff;
    }

    .report {
      max-width: 60rem;
      margin: 0 auto;
      padding: 1rem;
    }

    .generated {
      margin-top: 0;
      color: #57606a;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0;
      padding: 0;
      list-style: none;
    }

    .count {
      padding: 0.25rem 0.75rem;
      border-radius: 0.25rem;
      font-weight: 600;
    }

    .entries {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .entries th,
    .entries td {
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid #d0d7de;
      text-align: left;
      vertical-align: top;
    }

    .time,
    .msg {
      font-family: ui-monospace, monospace;
    }

    .time {
      white-space: nowrap;
    }

    .msg {
      overflow-wrap: anywhere;
    }

    .level-error { background: #ffebe9; color: #82071e; }
    .level-warn  { background: #fff8c5; color: #633c01; }
    .level-info  { background: #ddf4ff; color: #0550ae; }
    ```

    The `level-*` rules colour both the summary badges and the table rows. If your script later writes a new level (for example `debug`), add one more `.level-debug` rule.

    **Green Notes**
    - **Remove unused CSS** (reduces network and E): a full framework stylesheet carries rules for many components, and your page uses none of them. Every visitor would still download and parse it before the page renders. The new file has rules only for the 10 or so classes in your template. https://patterns.greensoftware.foundation/development/media-and-code-efficiency/remove-unused-css
    - **System font stack** (reduces network): `system-ui` and `ui-monospace` use fonts already on the device, so no web font download is needed.
    - *Not applied:* PurgeCSS or other purge tooling. For one template with a handful of classes, a hand-written file is simpler. If you later use many Bootstrap components, run a purge step in your build.
verify:
  static_only: CSS-only answer with no runnable code; correctness is checked by reading that every selector matches a class
    in the pasted template.
