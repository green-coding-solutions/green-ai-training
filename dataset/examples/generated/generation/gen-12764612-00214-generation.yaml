messages:
- role: user
  content: |
    I need one self-contained HTML file for the export manifest of our nightly warehouse export. After each run our Airflow task drops it next to the Parquet files, and people open it from a shared drive (file://, no web server).

    Requirements:
    - Single file, CSS inline, no external requests (the shared drive is offline for some people)
    - Header with dataset name, run date, run id
    - Summary line: number of files, total rows, total size
    - Table with columns: file name, rows, size, SHA-256 (the hash should be monospace, it is long)
    - A small "warnings" box that is hidden when there are none
    - Should look clean and print well on A4

    Use placeholder data for 3 files, our task will replace it with a Jinja template later.
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Export manifest: sales_daily</title>
      <style>
        :root {
          --text: #1d2330;
          --muted: #5b6577;
          --line: #d9dee7;
          --bg-soft: #f4f6fa;
          --warn: #8a5a00;
          --warn-bg: #fff6e0;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          padding: 2rem 1rem;
          color: var(--text);
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          line-height: 1.5;
        }
        main { max-width: 60rem; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
        .meta { color: var(--muted); margin: 0 0 1.5rem; }
        .summary {
          background: var(--bg-soft);
          border: 1px solid var(--line);
          border-radius: 6px;
          padding: 0.75rem 1rem;
          margin-bottom: 1.5rem;
        }
        .warnings {
          background: var(--warn-bg);
          border: 1px solid #f0d58a;
