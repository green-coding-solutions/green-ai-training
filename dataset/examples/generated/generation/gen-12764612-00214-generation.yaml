      </style>
    </head>
    <body>
      <main>
        <h1>sales_daily</h1>
        <p class="meta">Run date 2026-10-25 · Run id <span class="hash">scheduled__2026-10-25T02:00:00</span></p>

        <p class="summary"><strong>3 files</strong> · 1,482,310 rows · 412.6 MB</p>

        <div class="warnings" hidden>
          <strong>Warnings</strong>
          <ul>
            <li>Placeholder: 12 rows had a null customer_id.</li>
          </ul>
        </div>

        <table>
