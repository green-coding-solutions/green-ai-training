    </body>
    </html>
    ```

    Remove the `hidden` attribute from the warnings box in your Jinja template only when there are warnings. For the `file://` case, `hidden` is enough, no script needed.

    **Green Notes**
    - **System font stack** (reduces E and network): the page uses `system-ui` for text and `ui-monospace` for hashes. There are no font files to load or decode, which also fits your offline requirement. In Green Metrics Tool micro-benchmarks of 30 cold page loads, a system font stack used about 26% less client energy than six local TTF files and about 16% less than two Latin-subset WOFF2 files.
    - **Inline CSS, no external requests** (reduces network): one file, one read, nothing to fetch. This is right for a small generated report that is opened from a drive.

    *Not applied:* a brand web font. If the designer needs one later, use a WOFF2 subset (in the same benchmark about 12% less than TTF), not full TTF files.
verify:
  static_only: Static HTML/CSS page, no executable code
