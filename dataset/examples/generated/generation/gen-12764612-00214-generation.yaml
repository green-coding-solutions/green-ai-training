              <th class="num">Size</th>
              <th>SHA-256</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>part-0000.parquet</td>
              <td class="num">500,000</td>
              <td class="num">140.2 MB</td>
              <td class="hash">3b1f0c9a5e7d4b2a8c6e1f9d0a3b5c7e2d4f6a8b0c1e3d5f7a9b2c4e6f8a0b1d</td>
            </tr>
            <tr>
              <td>part-0001.parquet</td>
              <td class="num">500,000</td>
              <td class="num">139.8 MB</td>
              <td class="hash">9c2e4a6b8d0f1a3c5e7b9d2f4a6c8e0b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c</td>
            </tr>
            <tr>
              <td>part-0002.parquet</td>
              <td class="num">482,310</td>
              <td class="num">132.6 MB</td>
              <td class="hash">e5a7c9b1d3f2a4c6e8b0d1f3a5c7e9b2d4f6a8c0e1b3d5f7a9c2e4b6d8f0a1c</td>
            </tr>
