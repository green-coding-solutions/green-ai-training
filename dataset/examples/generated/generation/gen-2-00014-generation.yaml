messages:
- role: user
  content: |
    Hi, we have small demo page for our bird image classifier. User upload a photo, the model return top 5 species with confidence bar. Right now we including the whole bootstrap.min.css (~200kb) only for the grid, the button and the progress bars, i think is much to big for this.
    Can you write me small own css file wich replace bootstrap? Html should stay same if possible, the result rows are created from JS with the same markup.

    ```html
    <main class="container">
      <h1>Bird classifier demo</h1>
      <p class="text-muted">Upload a photo, the model return the top 5 species.</p>

      <form id="upload-form" class="row">
        <div class="col-md-8">
          <input class="form-control" type="file" id="image" accept="image/*">
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary" type="submit" id="classify-btn">Classify</button>
        </div>
      </form>

      <div class="row mt-4">
        <div class="col-md-6">
          <img id="preview" class="preview rounded" alt="Uploaded photo">
        </div>
        <div class="col-md-6">
          <ul id="results" class="list-unstyled">
            <li class="result">
              <span class="label">Eurasian blue tit</span>
              <div class="progress"><div class="progress-bar" style="width: 87%"></div></div>
              <span class="score">0.87</span>
            </li>
          </ul>
          <p id="status" class="text-muted small"></p>
        </div>
      </div>
    </main>
    ```
- role: assistant
  content: |
    This keeps your Bootstrap class names, so the HTML and the JS stay the same. Replace the Bootstrap `<link>` with this file:

    ```css
    /* demo.css: replaces bootstrap.min.css for the classifier demo, same class names */
    :root {
      --text: #212529;
      --muted: #6c757d;
      --border: #ced4da;
      --primary: #0d6efd;
      --primary-hover: #0b5ed7;
      --track: #e9ecef;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      color: var(--text);
    }

    .container { max-width: 60rem; margin: 0 auto; padding: 2rem 1rem; }

    /* Grid: one column on mobile, 12 columns from 768px */
    .row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; }
    .row > * { display: grid; align-content: start; } /* controls fill their column */
    .mt-4 { margin-top: 1.5rem; }

    @media (min-width: 768px) {
      .row { grid-template-columns: repeat(12, minmax(0, 1fr)); }
      .col-md-4 { grid-column: span 4; }
      .col-md-6 { grid-column: span 6; }
      .col-md-8 { grid-column: span 8; }
    }

    .form-control,
    .btn {
      padding: .375rem .75rem;
      font: inherit;
      border-radius: .375rem;
    }
    .form-control { border: 1px solid var(--border); background: #fff; }

    .btn { border: 1px solid transparent; cursor: pointer; }
    .btn-primary { color: #fff; background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: .65; cursor: default; }
    .btn:focus-visible,
    .form-control:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .text-muted { color: var(--muted); }
    .small { font-size: .875em; }
    .rounded { border-radius: .375rem; }

    .preview {
      display: block;
      width: 16rem;
      height: 16rem;
      object-fit: cover;
      background: var(--track);
    }

    .list-unstyled { list-style: none; margin: 0; padding: 0; }

    /* Result row: label and score on top, bar below */
    .result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 3rem;
      gap: .25rem .75rem;
      align-items: center;
      margin-bottom: .75rem;
    }
    .result .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result .score {
      grid-column: 2;
      grid-row: 1;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .result .progress { grid-column: 1 / -1; grid-row: 2; }

    .progress {
      display: flex; /* the bar stretches to the track height */
      height: .5rem;
      overflow: hidden;
      background: var(--track);
      border-radius: .25rem;
    }
    .progress-bar { background: var(--primary); }
    ```

    If you use another Bootstrap class later, it needs a rule here too.

    **Green Notes**
    - **Remove unused CSS** (reduces network): the page now loads only the rules it uses, not the whole framework. Don't expect a CPU saving on the client from this. In Green Metrics Tool browser benchmarks, purging a 16 KB stylesheet down to 0.75 KB changed client CPU energy by about 2% over 50 cold page loads, which is within noise. The real gain is the bytes visitors no longer download, and that matters most on slow mobile networks.
    - **System font stack** (reduces network and E): no font files to download. In the same benchmarks, the system font stack used about 26% less CPU energy than six local TTF files over 30 cold page loads.
verify:
  static_only: CSS stylesheet, no runtime to execute
