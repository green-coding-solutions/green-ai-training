- role: assistant
  content: |
    Here is a complete `style.css` for this template. It covers only the classes the page uses, and the Bootstrap import is gone.

    ```css
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2328;
      background: #f6f8fa;
    }

    /* header */
    .topbar {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: .75rem 1.25rem;
      background: #24292f;
      color: #fff;
    }
    .topbar h1 { margin: 0; font-size: 1.1rem; }
    .topbar .meta { color: #c9d1d9; font-size: .9rem; }

    main { padding: 1rem 1.25rem; }

    /* level colours, shared by summary counts and badges */
    .lvl-crit  { --lvl: #8b0000; }
    .lvl-error { --lvl: #cf222e; }
    .lvl-warn  { --lvl: #9a6700; }

    /* summary */
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .count {
      padding: .4rem .75rem;
      border-radius: 6px;
      background: #fff;
      border-left: 4px solid var(--lvl, #8c959f);
    }
    .count b { font-size: 1.1rem; margin-right: .25rem; }

    .badge {
      display: inline-block;
      padding: .1rem .45rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #fff;
      background: var(--lvl, #6e7781);
    }

    /* events table */
    .events {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    .events th,
    .events td {
      padding: .35rem .6rem;
      border-bottom: 1px solid #d0d7de;
      text-align: left;
      vertical-align: top;
    }
    .events thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #eaeef2;
      font-weight: 600;
    }
    .events .ts {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
    }
    .events .msg {
      white-space: pre-wrap;      /* keeps line breaks in stack traces */
      overflow-wrap: anywhere;    /* long tokens like URLs or IDs still wrap */
    }
    .events .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    ```

    The colours assume `level` is `crit`, `error` or `warn`. Any other value gets a grey badge and border instead of breaking. If other pages share this `style.css` and depend on Bootstrap, give the report its own stylesheet.

    **Green Notes**
    - **Only the CSS the page uses** (reduces network): the template uses none of Bootstrap's components. `badge` is the only class name that overlaps, and it is defined here. Every report view now fetches one small file instead of the whole framework. The extra request that `@import` triggers after `style.css` arrives is gone too.
    - This saves bytes, not client CPU. In Green Metrics Tool page-load benchmarks, purging a 16 KB stylesheet with mostly unused rules down to 0.75 KB changed client CPU energy by about 2%, which is within measurement noise. The gain is on real networks.
