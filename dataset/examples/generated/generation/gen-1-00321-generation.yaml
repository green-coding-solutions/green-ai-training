id: gen-1-00321-generation
category: generation
language: javascript
patterns:
- hoist-invariants
messages:
- role: user
  content: |
    Need a function for our order confirmation mail and the invoice table. Input: array of lines `{ sku, name, qty, unitCents, taxClass }`, plus `locale` and `currency`. Output: array of display rows with formatted unit price, net, tax and gross per line. Tax classes: standard 19%, reduced 7%, zero. Orders are usually small, but the bulk re-send job runs it for a few hundred thousand orders. Code only please.
- role: assistant
  content: |
    ```javascript
    // tax rates in basis points (1900 = 19%)
    const TAX_RATE_BP = { standard: 1900, reduced: 700, zero: 0 };

    export function formatOrderLines(lines, locale, currency) {
      // built once per call, not once per line
      const money = new Intl.NumberFormat(locale, { style: 'currency', currency });
      const rows = new Array(lines.length);

      for (let i = 0; i < lines.length; i++) {
        const { sku, name, qty, unitCents, taxClass } = lines[i];
        const rate = TAX_RATE_BP[taxClass];
        if (rate === undefined) {
          throw new Error(`Unknown tax class: ${taxClass}`);
        }

        const netCents = unitCents * qty;
        const taxCents = Math.round((netCents * rate) / 10000);

        rows[i] = {
          sku,
          name,
          qty,
          unit: money.format(unitCents / 100),
          net: money.format(netCents / 100),
          tax: money.format(taxCents / 100),
          gross: money.format((netCents + taxCents) / 100),
        };
      }
      return rows;
    }
    ```

    This assumes a currency with two decimals. For JPY or similar, divide by the currency's minor unit.

    **Green Notes**
    - **Formatter created once per call** (reduces E): `Intl.NumberFormat` has to resolve locale data when it is constructed. The result is the same for every line. Building it inside the loop, or calling `toLocaleString()` per value, repeats that work four times per line. The bulk re-send job does this for every order, so it adds up. If you call the function with the same locale and currency very often, you can also keep one formatter per `locale:currency` key in a small `Map`.
    - **Tax table at module level:** the rates are constants, so no object is created per call. The lookup is a plain property access. An unknown class throws an error instead of returning `NaN`.
    - All math uses integer cents. Only the final display value is divided.

    *Not applied:* caching formatted rows. Prices and lines differ per order, so a cache would rarely hit.
verify:
  test: |-
    import assert from 'node:assert';
    const rows = formatOrderLines(
      [
        { sku: 'A1', name: 'Mug', qty: 2, unitCents: 1000, taxClass: 'standard' },
        { sku: 'B2', name: 'Book', qty: 1, unitCents: 2000, taxClass: 'reduced' },
        { sku: 'C3', name: 'Gift', qty: 3, unitCents: 500, taxClass: 'zero' },
      ],
      'en-US',
      'USD'
    );
    assert.strictEqual(rows.length, 3);
    assert.strictEqual(rows[0].unit, '$10.00');
    assert.strictEqual(rows[0].net, '$20.00');
    assert.strictEqual(rows[0].tax, '$3.80');
    assert.strictEqual(rows[0].gross, '$23.80');
    assert.strictEqual(rows[1].tax, '$1.40');
    assert.strictEqual(rows[1].gross, '$21.40');
    assert.strictEqual(rows[2].tax, '$0.00');
    assert.strictEqual(rows[2].gross, '$15.00');
    assert.throws(() => formatOrderLines([{ sku: 'X', name: 'x', qty: 1, unitCents: 1, taxClass: 'luxury' }], 'en-US', 'USD'));
