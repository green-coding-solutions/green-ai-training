messages:
- role: user
  content: |
    py cli: like tac but show the original line number in front, reads stdin, input can be millions of lines
- role: assistant
  content: |
    ```python
    #!/usr/bin/env python3
    import sys

    NL = "\n"


    def reverse_numbered(lines):
        out = []
        for n, line in enumerate(lines, 1):
            out.append(f"{n}\t{line.rstrip(NL)}")
        out.reverse()
        return out


    def main() -> None:
        out = reverse_numbered(sys.stdin)
        if out:
            sys.stdout.write(NL.join(out) + NL)


    if __name__ == "__main__":
        main()
    ```

    Use it like `tail -n 1000000 app.log | ./rtac.py | head`. The first column is the line number from the original input. A last line without a trailing newline still gets one on output.

    **Green Notes**
    - **Avoid front insertion** (reduces E): the loop appends and reverses once at the end. `out.insert(0, ...)` would shift every stored line on each call, so the work grows with the square of the input size. In Green Metrics Tool micro-benchmarks, 1,000,000 `list.insert(0, x)` calls used ~1515 J and 1,000,000 `list.append(x)` calls used ~1.2 J, over 1000× less.
    - **Single reverse at the end**: `collections.deque.appendleft` would also be fast, but we only need the reverse order once, so a plain list is simpler.
verify:
  module: true
  test: |-
    assert reverse_numbered(["a\n", "b\n", "c"]) == ["3\tc", "2\tb", "1\ta"]
    assert reverse_numbered([]) == []
    assert reverse_numbered(["x\n"]) == ["1\tx"]
    assert reverse_numbered(iter(["\n", "y\n"])) == ["2\ty", "1\t"]
