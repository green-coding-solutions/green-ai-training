messages:
- role: user
  content: |
    Node CLI, reads NDJSON from stdin and POSTs it to an ingest URL given as argv. Usage: `producer | pushndjson https://ingest.internal/v1/events`. Streams can be a few hundred MB. Bearer token from env INGEST_TOKEN. Just the code.
- role: assistant
  content: |
    ```javascript
    #!/usr/bin/env node
    'use strict';
    const http = require('node:http');
    const https = require('node:https');
    const zlib = require('node:zlib');
    const { pipeline } = require('node:stream/promises');

    function pushStream(input, endpoint, { token } = {}) {
      const url = new URL(endpoint);
      const client = url.protocol === 'https:' ? https : http;

      return new Promise((resolve, reject) => {
        const req = client.request(
          url,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-ndjson',
              'Content-Encoding': 'gzip',
              ...(token && { Authorization: `Bearer ${token}` }),
            },
          },
          (res) => {
            res.resume();
            res.on('end', () => {
              if (res.statusCode >= 200 && res.statusCode < 300) resolve(res.statusCode);
              else reject(new Error(`HTTP ${res.statusCode}`));
            });
          }
        );
        req.on('error', reject);
        // stdin -> gzip -> request body, chunk by chunk, nothing is buffered in full
        pipeline(input, zlib.createGzip({ level: 3 }), req).catch(reject);
      });
    }

    module.exports = { pushStream };

    if (require.main === module) {
      const [endpoint] = process.argv.slice(2);
      if (!endpoint) {
        console.error('usage: producer | pushndjson <url>');
        process.exit(2);
      }
      pushStream(process.stdin, endpoint, { token: process.env.INGEST_TOKEN })
        .then((status) => console.error(`done (HTTP ${status})`))
        .catch((err) => {
          console.error(err.message);
          process.exit(1);
        });
    }
    ```

    **Green Notes**
    - **Compress the request body** (reduces network and E): NDJSON repeats the same keys on every line, so it shrinks a lot. Fewer bytes cross the network for every run. The server must accept `Content-Encoding: gzip` on requests, so check that first.
      https://patterns.greensoftware.foundation/development/data-handling/compress-transmitted-data
    - **Moderate gzip level, streamed:** the data is compressed on every run, so a cheap setting makes more sense than a maximum one. In Green Metrics Tool measurements compressing 100 MB of English text, zstd used about 4× less energy than gzip at default settings ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=2584305c-7a1e-47e2-b6cc-26276962035e,addc5f5e-55da-47f8-956d-240d06304e4e,fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,7b3bb87d-3b43-4f82-be99-0327405205b8,905bd408-6b31-4237-a4da-14b8fad90613,7f213a20-8028-4080-9583-6e465c217bb5,8e93a8d2-60b0-4831-905b-764b68257bc7)). If your server and Node version support zstd, it is worth a try. The figure compares energy only, not file size.
    - **Streaming** keeps memory flat for inputs of any size, with no temp file and no full-body buffer.
- role: user
  content: |
    ?
verify:
  module: true
  test: |-
    const { Readable } = require('node:stream');
    (async () => {
      const assert = require('node:assert');
      const lines = Array.from({ length: 1000 }, (_, i) => JSON.stringify({ i, name: 'sensor' }) + '\n');
      let received = null;
      let enc = null;
      let auth = null;
      const server = http.createServer((req, res) => {
        const chunks = [];
        enc = req.headers['content-encoding'];
        auth = req.headers['authorization'];
        req.on('data', (c) => chunks.push(c));
        req.on('end', () => {
          received = Buffer.concat(chunks);
          res.statusCode = 204;
          res.end();
        });
      });
      await new Promise((r) => server.listen(0, '127.0.0.1', r));
      const port = server.address().port;
      const status = await pushStream(Readable.from(lines), `http://127.0.0.1:${port}/ingest`, { token: 'abc' });
      if (server.closeAllConnections) server.closeAllConnections();
      server.close();
      assert.strictEqual(status, 204);
      assert.strictEqual(enc, 'gzip');
      assert.strictEqual(auth, 'Bearer abc');
      const body = zlib.gunzipSync(received).toString('utf8');
      assert.strictEqual(body, lines.join(''));
      assert.ok(received.length < body.length / 4);
    })();
