id: gen-1-00295-generation
category: generation
language: python
patterns:
- keep-star-imports
- efficient-algorithm
facts:
- F-IMPORT
messages:
- role: user
  content: |
    need integrated autocorrelation time for a 1D mcmc chain, numpy only. keep our lab header `from numpy import *`
- role: assistant
  content: |
    Here it is. It keeps your header, computes the autocorrelation with an FFT, and uses Sokal's automatic window:

    ```python
    from numpy import *
    from numpy.fft import rfft, irfft


    def autocorr(x):
        """Normalized autocorrelation of a 1D series, lags 0..n-1."""
        x = asarray(x, dtype=float)
        n = len(x)
        if n < 2:
            raise ValueError("need at least 2 samples")
        x = x - x.mean()
        size = 1 << (2 * n - 1).bit_length()  # zero-pad: no circular wrap
        f = rfft(x, size)
        acf = irfft(f * conj(f), size)[:n]
        if acf[0] == 0:
            raise ValueError("constant series has no autocorrelation")
        return acf / acf[0]


    def integrated_time(x, c=5.0):
        """Integrated autocorrelation time with Sokal's automatic window."""
        acf = autocorr(x)
        taus = 2.0 * cumsum(acf) - 1.0
        inside = arange(len(taus)) < c * taus
        if inside.all():
            return float(taus[-1])  # window never closed: chain is too short
        return float(taus[argmin(inside)])
    ```

    If `integrated_time` returns the last value, the chain is too short for a reliable estimate. A common rule of thumb is to have at least 50 times tau samples.

    **Green Notes**
    - **FFT instead of a direct sum** (reduces E): the direct autocorrelation is O(n²). The FFT version is O(n log n), which matters for long chains and for many chains per run.
    - *Not applied:* changing the `from numpy import *` header. In Green Metrics Tool micro-benchmarks (1,000 Python process starts), `from x import *` and `import x` used practically the same CPU energy. The star import is fine to keep. It does rebind names like `sum`, `max` and `abs` to the NumPy versions, so be careful if you mix in plain-Python code that passes lists or generators to them.
verify:
  test: |-
    import numpy as np
    rng = np.random.default_rng(0)
    y = rng.normal(size=500)
    m = y - y.mean()
    direct = np.correlate(m, m, "full")[len(m) - 1:]
    direct = direct / direct[0]
    assert np.allclose(autocorr(y), direct)
    phi = 0.9
    e = rng.normal(size=20000)
    z = np.empty_like(e)
    z[0] = e[0]
    for i in range(1, len(e)):
        z[i] = phi * z[i - 1] + e[i]
    tau = integrated_time(z)
    assert 8 < tau < 40, tau
    try:
        integrated_time(np.ones(10))
        raise SystemExit("expected ValueError")
    except ValueError:
        pass
