    bouncing "scroll down" arrow for my landing page hero
- role: assistant
  content: |
    ```html
    <a class="scroll-hint" href="#features" aria-label="Scroll to features">
      <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
        <path d="M5 9l7 7 7-7" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <style>
      .scroll-hint {
        position: absolute;
        left: 50%;
        bottom: 1.5rem;
        margin-left: -16px;
        color: #fff;
        animation: scroll-bounce 1.6s ease-in-out infinite;
      }

      @keyframes scroll-bounce {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(10px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .scroll-hint { animation: none; }
      }
    </style>
    ```

    Put it inside your hero section, and give the hero `position: relative` so the arrow sits at its bottom. The `href` needs an element with `id="features"` further down the page.

    **Green Notes**
    - **CSS keyframes instead of JS-driven animation** (reduces E): the arrow only needs `transform`, so the browser runs it without a script loop that writes styles every frame. In Green Metrics Tool browser benchmarks of a 20-second animation, CSS `@keyframes` used ~145 J and a JavaScript `requestAnimationFrame` loop ~161 J, about 10% less for CSS.
    - **Only `transform` is animated** (reduces E): no layout work per frame. The reduced-motion rule also stops the loop for visitors who turn animations off.
