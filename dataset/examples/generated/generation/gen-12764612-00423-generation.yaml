    The columns come back in the order your model expects, so the feature vector is built the same way on every call.

    **Green Notes**
    - **Select only the needed columns** (reduces E and M): the query names the 4 numeric features and skips `bio` and `raw_events_json`. Those large text columns would otherwise be read, copied and sent to the service for every prediction, and then thrown away. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, naming 10 columns instead of `SELECT *` used about 7× less CPU energy when reading 2,500 rows. The saving grows with the size of the columns you skip, so it matters most on a per-request path like this one.
