    bash script for CI: fail the build if any js/css/image in dist/ is over a size limit for our landing page
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    # Fail if built assets are over their size budget (bytes).
    set -euo pipefail

    dist=${1:-dist}
    js_max=$((150 * 1024))
    css_max=$((50 * 1024))
    img_max=$((300 * 1024))

    fail=0
    while read -r size path; do
        case $path in
            *.js)                             max=$js_max ;;
            *.css)                            max=$css_max ;;
            *.jpg|*.jpeg|*.png|*.webp|*.avif) max=$img_max ;;
            *)                                continue ;;
        esac
        if (( size > max )); then
            printf '%s: %d bytes (limit %d)\n' "$path" "$size" "$max"
            fail=1
        fi
    done < <(find "$dist" -type f -printf '%s %p\n')

    exit "$fail"
    ```

    Run it with `./check-budget.sh dist`. It prints each file over its limit and exits 1, so the CI job fails. Change the three limits at the top to fit your page.

    **Green Notes**
    - **Builtins and one `find`** (reduces E): `find -printf` gives size and path in one pass. The loop then uses `read -r`, `case` and `(( ))`, so it starts no process per file. Per-file `stat`, `cut` or `expr` calls would start several processes for every file. In Green Metrics Tool micro-benchmarks on a 20,000-line log, a loop with `$(echo | cut)` and `$(expr)` per line used ~1302 J. The same loop with builtins only used ~4.3 J, about 300× less. Your dist folder is smaller, but the same rule holds on every CI run.
    - **Single quotes** (reduces E): literals with no expansion, like the `printf` format, use single quotes. Variables stay in double quotes.
  verify:
    static_only: bash script using find -printf, no python/js to execute
