messages:
- role: user
  content: |
    hi, i make my first online shop for my sister, she sell knitted wool socks and hats. I have a category page "Winter hats" with 12 products. every product have one photo (hat-01.jpg ... hat-12.jpg, each about 180 KB) and name and price. the page is very slow on my phone and I don't know why. can you write the html for the page? there is also a big banner on top (winter-banner.jpg) with the title text over it. I use plain html and css, no framework, css file is shop.css
- role: assistant
  content: |
    The page is probably slow because the phone downloads all 12 photos (about 2 MB) at once, plus the banner. Here is a version that loads the banner first and the product photos only when needed.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Winter hats | Wool &amp; Co</title>
      <link rel="stylesheet" href="shop.css">
    </head>
    <body>
      <header class="banner">
        <img src="winter-banner.jpg" alt="Hand-knitted winter hats in warm colors"
             width="1200" height="400" fetchpriority="high">
        <h1>Winter hats</h1>
      </header>

      <main>
        <ul class="products">
          <li class="product">
            <img src="hat-01.jpg" alt="Hat 1" width="400" height="400">
            <h2>Hat 1</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-02.jpg" alt="Hat 2" width="400" height="400" loading="lazy">
            <h2>Hat 2</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-03.jpg" alt="Hat 3" width="400" height="400" loading="lazy">
            <h2>Hat 3</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-04.jpg" alt="Hat 4" width="400" height="400" loading="lazy">
            <h2>Hat 4</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-05.jpg" alt="Hat 5" width="400" height="400" loading="lazy">
            <h2>Hat 5</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-06.jpg" alt="Hat 6" width="400" height="400" loading="lazy">
            <h2>Hat 6</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-07.jpg" alt="Hat 7" width="400" height="400" loading="lazy">
            <h2>Hat 7</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-08.jpg" alt="Hat 8" width="400" height="400" loading="lazy">
            <h2>Hat 8</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-09.jpg" alt="Hat 9" width="400" height="400" loading="lazy">
            <h2>Hat 9</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-10.jpg" alt="Hat 10" width="400" height="400" loading="lazy">
            <h2>Hat 10</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-11.jpg" alt="Hat 11" width="400" height="400" loading="lazy">
            <h2>Hat 11</h2>
            <p class="price">€0.00</p>
          </li>
          <li class="product">
            <img src="hat-12.jpg" alt="Hat 12" width="400" height="400" loading="lazy">
            <h2>Hat 12</h2>
            <p class="price">€0.00</p>
          </li>
        </ul>
      </main>
    </body>
    </html>
    ```

    Replace "Hat 1", the alt texts and the prices with the real product data. Keep `width` and `height` on every image, so the page does not jump when the photos arrive. In `shop.css` add `img { max-width: 100%; height: auto; }` so they scale on a phone.

    **Green Notes**
    - **Defer offscreen images** (reduces network and E on the client): `loading="lazy"` on hats 2-12 means a visitor who does not scroll far never downloads those photos. In Green Metrics Tool browser benchmarks of an article with 15 photos, loading it without scrolling used ~325 J with lazy images and ~368 J with all images eager, about 12% less. When the visitors scrolled to the end, there was no difference.
    - **Above the fold stays eager**: the banner and the first hat have no `loading="lazy"`. Lazy loading the first visible image delays it. The banner also has `fetchpriority="high"` so the browser fetches it first.

    *Not applied:* new image formats and resizing. They would help more, but you need to convert the files first. Do that once when you upload, not in the page.
