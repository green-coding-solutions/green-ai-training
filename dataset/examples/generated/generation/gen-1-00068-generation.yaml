messages:
- role: user
  content: |
    I maintain a small CLI, `cronaudit`. It reads crontabs from our servers, flags risky jobs (no output redirect, overlapping schedules, running as root) and writes one self-contained `cronaudit-report.html`. I mail that file to the team every Monday. I need the stylesheet that goes into the `<style>` tag.

    Requirements:
    - Everything inline, no external requests (many people open it offline from the mail attachment)
    - Light and dark mode, following the system setting
    - Severity colors for error / warn / info rows
    - Long commands must wrap, not stretch the table
    - Should print OK on paper (people print it for the ops meeting)
    - Style the elements this generator emits, nothing else. I don't want to pull in a framework for one table.

    This is the template and the row renderer:

    ```python
    PAGE = """<!doctype html>
    <html lang="en"><head><meta charset="utf-8">
    <title>cronaudit report</title>
    <style>{css}</style></head>
    <body>
    <header class="top">
      <h1>cronaudit</h1>
      <p class="meta">{generated} &middot; {hosts} hosts &middot; {total} jobs</p>
    </header>
    <section class="summary">
      <div class="card card-error"><span class="num">{errors}</span> errors</div>
      <div class="card card-warn"><span class="num">{warns}</span> warnings</div>
      <div class="card card-ok"><span class="num">{clean}</span> clean jobs</div>
    </section>
    <table class="findings">
      <thead><tr>
        <th class="col-host">Host</th><th class="col-sched">Schedule</th>
        <th>Command</th><th>Finding</th>
      </tr></thead>
      <tbody>{rows}</tbody>
    </table>
    <footer class="foot">Generated by cronaudit {version}</footer>
    </body></html>"""


    def render_row(f):
        return (
            f'<tr class="sev-{f.severity}">'
            f'<td>{esc(f.host)}</td>'
            f'<td><code>{esc(f.schedule)}</code></td>'
            f'<td><code>{esc(f.command)}</code></td>'
            f'<td>{esc(f.message)}</td></tr>'
        )
    ```

    `f.severity` is `error`, `warn` or `info`.
- role: assistant
  content: |
    This styles only the classes and elements your template emits.

    ```css
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --error: #cf222e;
      --error-bg: #ffebe9;
      --warn: #9a6700;
      --warn-bg: #fff8c5;
      --ok: #1a7f37;
      --ok-bg: #dafbe1;
      --info: #0969da;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --error: #ff7b72;
        --error-bg: #3d1618;
        --warn: #e3b341;
        --warn-bg: #3a2d0b;
        --ok: #3fb950;
        --ok-bg: #12301b;
        --info: #58a6ff;
      }
    }

    body {
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem;
    }

    h1 { margin: 0; font-size: 1.6rem; }

    .top { border-bottom: 1px solid var(--line); margin-bottom: 1rem; }
    .meta { margin: 0.25rem 0 0.75rem; color: var(--muted); }

    .summary { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.25rem; }
    .card {
      flex: 1 1 10rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .card-error { background: var(--error-bg); border-color: var(--error); }
    .card-warn  { background: var(--warn-bg);  border-color: var(--warn); }
    .card-ok    { background: var(--ok-bg);    border-color: var(--ok); }
    .num { display: block; font-size: 1.75rem; font-weight: 700; line-height: 1.2; }

    .findings { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .findings th,
    .findings td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    .findings th { color: var(--muted); font-weight: 600; }
    .col-host  { width: 9rem; }
    .col-sched { width: 10rem; }
    code { font: 0.9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .sev-error td { background: var(--error-bg); }
    .sev-warn td  { background: var(--warn-bg); }
    .sev-error td:first-child { border-left: 4px solid var(--error); }
    .sev-warn td:first-child  { border-left: 4px solid var(--warn); }
    .sev-info td:first-child  { border-left: 4px solid var(--info); }

    .foot { margin-top: 1.5rem; color: var(--muted); font-size: 0.85rem; }

    @media print {
      body { color: #000; background: #fff; max-width: none; padding: 0; }
      .card, .sev-error td, .sev-warn td { background: none; }
      .num { color: #000; }
      thead { display: table-header-group; }
      tr { break-inside: avoid; }
    }
    ```

    **Green Notes**
    - **Remove unused CSS** (reduces network): the stylesheet has one rule per class in your template, plus a few element rules, and no reset or framework. For a report this size the saving is bytes in the mail attachment, not CPU. In Green Metrics Tool browser benchmarks, a 16 KB mostly unused stylesheet used ~783 J for 50 cold page loads, and a purged 0.75 KB one ~764 J, about 2% less, which is within measurement noise.
    - *Not applied:* a purge or minify step. With a hand-written file this small it adds nothing. If you add new classes to `PAGE` or `render_row`, add their rules here and delete the ones you stop using.
