        # results in the same order as `nodes`
        # TODO
        raise NotImplementedError


    def render(service: str, results: list[NodeResult]) -> str:
        ok = [r for r in results if r.failed is None]
        lines = [f"ERROR lines for {service}: {sum(r.errors for r in ok)} "
                 f"({len(ok)}/{len(results)} collectors answered)"]
        for r in results:
            lines.append(f"  {r.node:<40} {r.failed or r.errors}")
        return "\n".join(lines)


    def main(argv: list[str]) -> int:
        if len(argv) != 3:
            print(__doc__, file=sys.stderr)
            return 2
        results = fetch_error_counts(COLLECTORS, argv[1], argv[2])
        print(render(argv[1], results))
        return 0 if all(r.failed is None for r in results) else 1


    if __name__ == "__main__":
        sys.exit(main(sys.argv))
