messages:
- role: user
  content: |
    LLM chat UI for our inference gateway. Tokens get appended to `.token-stream` over SSE, and JS sets `data-state="streaming"` while the response is open and `data-state="done"` at the end. I need a blinking block caret after the last token while streaming. Just the CSS, no explanation of how carets work.
- role: assistant
  content: |
    ```css
    .token-stream[data-state="streaming"]::after {
      content: "";
      display: inline-block;
      width: 0.55ch;
      height: 1.1em;
      margin-left: 2px;
      vertical-align: text-bottom;
      background: currentColor;
      animation: caret-blink 1s steps(1, end) infinite;
    }

    @keyframes caret-blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .token-stream[data-state="streaming"]::after {
        animation: none;
      }
    }
    ```

    **Green Notes**
    - **CSS keyframes instead of a JS timer or `requestAnimationFrame`** (reduces E): the blink runs in the browser's own animation engine. Your SSE handler doesn't need a tick loop and only has to set `data-state`. In Green Metrics Tool micro-benchmarks, a 20-second browser animation used about 10% less CPU energy with CSS `@keyframes` than with a JS `requestAnimationFrame` loop.
    - **Only `opacity` is animated, and only while streaming:** the caret is a pseudo-element that exists only in the `streaming` state. When JS sets `done`, the animation stops and costs nothing. A finished chat tab doesn't keep animating in the background.
    - `prefers-reduced-motion` turns the blink off for users who ask for that. The caret stays visible but static.
