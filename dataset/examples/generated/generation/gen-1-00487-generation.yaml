messages:
- role: user
  content: |
    python func to archive yesterdays raw csv/json files from landing/<date>/ into archive/<date>/ so we can reprocess later, keep 1 year
- role: assistant
  content: |
    ```python
    import gzip
    import shutil
    from pathlib import Path

    # Already compressed formats gain nothing from another pass
    ALREADY_COMPRESSED = {".gz", ".zip", ".zst", ".bz2", ".xz", ".parquet"}


    def archive_landing(landing, archive, day):
        """Move landing/<day>/* to archive/<day>/, gzip-ing text files. Returns the new paths."""
        src_dir = Path(landing) / day
        dst_dir = Path(archive) / day
        dst_dir.mkdir(parents=True, exist_ok=True)

        archived = []
        for src in sorted(src_dir.iterdir()):
            if not src.is_file():
                continue

            if src.suffix.lower() in ALREADY_COMPRESSED:
                dst = dst_dir / src.name
                shutil.move(src, dst)
            else:
                dst = dst_dir / (src.name + ".gz")
                tmp = dst.with_name(dst.name + ".part")
                with open(src, "rb") as fin, gzip.open(tmp, "wb") as fout:
                    shutil.copyfileobj(fin, fout)  # streams, no full file in memory
                tmp.replace(dst)  # only visible once complete
                src.unlink()  # remove the original only after a successful write

            archived.append(dst)
        return archived
    ```

    Reading back works with `gzip.open(path, "rt")` or `zcat`. A failed run leaves the original in `landing/`, so you can simply run it again.

    **Green Notes**
    - **Compress stored data** (reduces E, M): raw CSV/JSON compresses well and sits in the archive for a year, so you keep it on less storage. It is written once and rarely read.
    - **Moderate codec:** `gzip.open` uses its default level, which is cheap enough for a job that compresses every day. In Green Metrics Tool micro-benchmarks compressing 100 MB of English text, zstd used about 4× less CPU energy than gzip (~16 J vs ~67 J) ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=2584305c-7a1e-47e2-b6cc-26276962035e,addc5f5e-55da-47f8-956d-240d06304e4e,fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,7b3bb87d-3b43-4f82-be99-0327405205b8,905bd408-6b31-4237-a4da-14b8fad90613,7f213a20-8028-4080-9583-6e465c217bb5,8e93a8d2-60b0-4831-905b-764b68257bc7)). If your Python has `compression.zstd` (in the standard library of recent versions), swapping it in is a small change. This compares energy only, not file size.
    - **Skip compressed formats:** `.parquet`, `.zip`, `.gz` and similar files are moved as they are. Compressing them again costs CPU and saves almost nothing.

    *Not applied:* xz or brotli at high levels. They give smaller files, but in the same benchmarks they used one to two orders of magnitude more energy than zstd. That only makes sense if storage cost clearly dominates.
verify:
  module: false
  green_block: 0
  test: |-
    import tempfile, gzip
    from pathlib import Path

    with tempfile.TemporaryDirectory() as t:
        land = Path(t) / "landing"
        arch = Path(t) / "archive"
        d = land / "2026-10-11"
        d.mkdir(parents=True)
        text = "a,b\n1,2\n" * 100
        (d / "events.csv").write_text(text)
        (d / "x.parquet").write_bytes(b"PAR1data")

        res = archive_landing(land, arch, "2026-10-11")
        assert sorted(p.name for p in res) == ["events.csv.gz", "x.parquet"]

        out = arch / "2026-10-11"
        with gzip.open(out / "events.csv.gz", "rt") as f:
            assert f.read() == text
        assert (out / "x.parquet").read_bytes() == b"PAR1data"
        assert list(d.iterdir()) == []
        assert not list(out.glob("*.part"))
