id: gen-2-00007-generation
category: generation
language: css
patterns:
- system-fonts-and-deps
facts:
- F-FONTS
messages:
- role: user
  content: |
    I maintain `schemadoc`, a small CLI that reads a Postgres schema and writes a static HTML site: `index.html` plus one page per table. Teams publish the output folder on their internal GitHub Pages, so a lot of devs open these pages every day.

    I'm redoing the theme and need the stylesheet `schemadoc.css` that the generator copies into the output. This is the markup it produces (shortened):

    ```html
    <body>
      <nav class="tables">
        <ul>
          <li><a href="customers.html">customers</a></li>
          <li><a href="orders.html" aria-current="page">orders</a></li>
        </ul>
      </nav>
      <main>
        <h1>orders</h1>
        <p class="table-comment">One row per checkout.</p>
        <table class="columns">
          <thead>
            <tr><th>Column</th><th>Type</th><th>Null</th><th>Default</th></tr>
          </thead>
          <tbody>
            <tr class="pk">
              <td class="col-name">id</td><td class="col-type">bigint</td><td></td>
              <td class="col-default">nextval('orders_id_seq')</td>
            </tr>
            <tr>
              <td class="col-name">note</td><td class="col-type">text</td>
              <td><span class="badge nullable">null</span></td><td class="col-default"></td>
            </tr>
          </tbody>
        </table>
        <h2>Indexes</h2>
        <p><code>orders_customer_id_idx</code> on <code>(customer_id)</code></p>
      </main>
    </body>
    ```

    Requirements:
    - Light and dark mode, following the OS setting
    - Sidebar on the left, it should stack on top on narrow screens
    - Sticky table header for long tables
    - Primary key row highlighted, nullable shown as a small badge
    - Print view without the sidebar
    - No CDN or other external requests, everything has to work from the output folder

    The old theme copies Inter and JetBrains Mono as .ttf files (all weights) into every output folder. I'm not attached to them. It just has to look clean and modern: sans-serif for text, monospace for column names, types and defaults.
- role: assistant
  content: |
    ```css
    /* schemadoc.css: shared by every generated page */

    :root {
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --sidebar-bg: #f6f8fa;
      --accent: #0969da;
      --pk: #8250df;
      --null-bg: #fff8c5;
      --null-fg: #7d4e00;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #9198a1;
        --border: #3d444d;
        --sidebar-bg: #151b23;
        --accent: #4493f8;
        --pk: #ab7df8;
        --null-bg: #3b2e00;
        --null-fg: #e3b341;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      display: grid;
      grid-template-columns: 16rem minmax(0, 1fr);
      min-height: 100vh;
      font: 15px/1.55 var(--font-sans);
      color: var(--fg);
      background: var(--bg);
    }

    a { color: var(--accent); }

    /* Sidebar */
    nav.tables {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      padding: 1rem;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
    }
    nav.tables ul { list-style: none; margin: 0; padding: 0; }
    nav.tables a {
      display: block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--fg);
      text-decoration: none;
    }
    nav.tables a:hover { background: var(--border); }
    nav.tables a[aria-current="page"] { color: var(--accent); font-weight: 600; }

    /* Content */
    main { padding: 1.5rem 2rem; max-width: 72rem; }

    h1, h2 { line-height: 1.25; font-weight: 600; }
    h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
    h2 { font-size: 1.15rem; margin: 2rem 0 0.5rem; }
    .table-comment { color: var(--muted); margin: 0 0 1.5rem; }

    code,
    .col-name,
    .col-type,
    .col-default { font-family: var(--font-mono); font-size: 0.875em; }

    /* Column table */
    table.columns { width: 100%; border-collapse: collapse; }
    table.columns th,
    table.columns td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    table.columns th {
      position: sticky;
      top: 0;
      background: var(--bg);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .col-type { color: var(--muted); }
    tr.pk .col-name { color: var(--pk); font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 0 0.4rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.nullable { background: var(--null-bg); color: var(--null-fg); }

    /* Narrow screens: sidebar on top */
    @media (max-width: 48rem) {
      body { display: block; }
      nav.tables {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }

    /* Print: light colors, no sidebar */
    @media print {
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --fg: #000000;
        --muted: #444444;
        --border: #cccccc;
      }
      body { display: block; }
      nav.tables { display: none; }
      table.columns th { position: static; }
      a { color: inherit; text-decoration: none; }
    }
    ```

    You can remove the step that copies the `.ttf` files from the generator. The stylesheet doesn't reference any font files, so the output folder needs nothing except the HTML and this CSS.

    **Green Notes**
    - **System font stack instead of bundled fonts** (reduces E, network): every reader's browser uses fonts it already has, so it downloads and parses no font files. In Green Metrics Tool page-load benchmarks (30 cold loads), the system font stack used about 26% less client CPU energy than six local TTF files of about 4 MB. It also used about 16% less than two Latin-subset WOFF2 files. Many devs open these pages every day, so this saving repeats on every cold load.
    - *Not applied:* a branded web font. If you later want Inter back, ship one or two Latin-subset WOFF2 files and not the full TTF set. In the same benchmark, the WOFF2 subsets used about 12% less than the TTF files.
verify:
  static_only: CSS stylesheet, no runnable code
