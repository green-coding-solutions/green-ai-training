    **Green Notes**
    - **Lazy-load the screenshots below the fold** (reduces network and client work): steps 2-6 get `loading="lazy"`, so readers who stop after step 1 never download them. In Green Metrics Tool micro-benchmarks, an article with 15 photos used about 12% less CPU energy per page load when the visitor did not scroll. When the visitor scrolled to the end, there was no difference.
    - **Step 1 stays eager:** it is visible on load, and lazy-loading it would only delay the first thing people see.
    - The saving depends on your readers. If most of them read all six steps, the gain is close to zero, but lazy loading does no harm.
