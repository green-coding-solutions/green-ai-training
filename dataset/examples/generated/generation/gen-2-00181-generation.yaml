- role: assistant
  content: |
    Here is CSS for both states. The only JS change is one line that passes the delay to CSS:

    ```javascript
    function showRetry(el, attempt, maxAttempts, delaySec) {
      el.querySelector('.retry-badge__label').textContent = `retry ${attempt}/${maxAttempts}`;
      el.style.setProperty('--retry-delay', `${delaySec}s`);
      el.dataset.state = 'waiting';
      setTimeout(() => { el.dataset.state = 'retrying'; }, delaySec * 1000);
    }
    ```

    ```css
    .retry-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font: 500 0.8125rem/1 system-ui, sans-serif;
      color: #9a6700;
    }

    .retry-ring {
      width: 1rem;
      height: 1rem;
      transform: rotate(-90deg); /* ring starts at 12 o'clock */
    }

    .retry-ring circle {
      fill: none;
      stroke-width: 4;
    }

    .retry-ring__track {
      stroke: #eaeef2;
    }

    .retry-ring__fill {
      stroke: currentColor;
      stroke-dasharray: 100.53; /* 2πr for r=16 */
      stroke-dashoffset: 0;
    }

    /* waiting: the ring empties once over the retry delay */
    .retry-badge[data-state="waiting"] .retry-ring__fill {
      animation: retry-drain var(--retry-delay, 30s) linear forwards;
    }

    /* retrying: a short arc spins until the worker reports back */
    .retry-badge[data-state="retrying"] {
      color: #0969da;
    }

    .retry-badge[data-state="retrying"] .retry-ring__fill {
      stroke-dashoffset: 75;
    }

    .retry-badge[data-state="retrying"] .retry-ring {
      animation: retry-spin 1s linear infinite;
    }

    @keyframes retry-drain {
      to { stroke-dashoffset: 100.53; }
    }

    @keyframes retry-spin {
      from { transform: rotate(-90deg); }
      to   { transform: rotate(270deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .retry-badge[data-state] .retry-ring,
      .retry-badge[data-state] .retry-ring__fill {
        animation: none;
      }
    }
    ```

    When the next attempt calls `showRetry` again, the state goes from `retrying` back to `waiting`. The animation changes back to `retry-drain`, so the ring starts full again.

    **Green Notes**
    - **CSS keyframes instead of JS-driven animation** (reduces E): the browser runs the drain and the spin by itself. Your script only changes the state once per retry, so it has no timer or `requestAnimationFrame` loop that writes styles on every frame. In Green Metrics Tool browser benchmarks, a 20-second CSS `@keyframes` animation used about 10% less CPU energy than the same animation driven by `requestAnimationFrame` with style updates.
    - **Animate only what moves** (reduces E): the spin uses `transform`, and only rows in `waiting` or `retrying` state have an animation. Finished and running rows cost nothing.
