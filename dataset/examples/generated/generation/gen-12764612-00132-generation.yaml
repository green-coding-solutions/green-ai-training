messages:
- role: user
  content: |
    hello, i am new in this job. we have a import that read scanned invoices (pdf to jpg, then OCR) and some of the files get rejected. i must make a html page that show the rejected scans so the ops team can look at them. at the top is the run info (run id, how many files ok / rejected), then one big preview of the newest rejected scan, then a grid of all other rejected thumbnails (about 60, files are in thumbs/, name is like rej-0001.jpg). usually they look at the first few and then close it. i tried to write it myself but the page feel slow and i dont know what is wrong. can you write the full page? the big preview is previews/rej-0001.jpg
- role: assistant
  content: |
    Here is the full page. Only the first 6 thumbnails are shown, the other 54 use the same `<figure>` line with the next file name.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Rejected scans - run 2026-10-26</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 1rem auto; max-width: 70rem; padding: 0 1rem; }
        .summary { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .newest img { width: 100%; max-width: 40rem; height: auto; border: 1px solid #ccc; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: 0.75rem; }
        .grid img { width: 100%; height: auto; display: block; }
        figcaption { font-size: 0.8rem; color: #555; }
      </style>
    </head>
    <body>
      <h1>Rejected scans</h1>
      <div class="summary">
        <div><strong>Run:</strong> 2026-10-26-0300</div>
        <div><strong>OK:</strong> 1412</div>
        <div><strong>Rejected:</strong> 61</div>
      </div>

      <section class="newest">
        <h2>Newest rejected scan</h2>
        <img src="previews/rej-0001.jpg" width="800" height="1100" alt="Newest rejected scan, rej-0001">
      </section>

      <section>
        <h2>Other rejected scans</h2>
        <div class="grid">
          <figure><img src="thumbs/rej-0002.jpg" width="200" height="280" loading="lazy" alt="Rejected scan rej-0002"><figcaption>rej-0002</figcaption></figure>
          <figure><img src="thumbs/rej-0003.jpg" width="200" height="280" loading="lazy" alt="Rejected scan rej-0003"><figcaption>rej-0003</figcaption></figure>
          <figure><img src="thumbs/rej-0004.jpg" width="200" height="280" loading="lazy" alt="Rejected scan rej-0004"><figcaption>rej-0004</figcaption></figure>
          <figure><img src="thumbs/rej-0005.jpg" width="200" height="280" loading="lazy" alt="Rejected scan rej-0005"><figcaption>rej-0005</figcaption></figure>
          <figure><img src="thumbs/rej-0006.jpg" width="200" height="280" loading="lazy" alt="Rejected scan rej-0006"><figcaption>rej-0006</figcaption></figure>
          <figure><img src="thumbs/rej-0007.jpg" width="200" height="280" loading="lazy" alt="Rejected scan rej-0007"><figcaption>rej-0007</figcaption></figure>
          <!-- ... rej-0008 to rej-0061, same line ... -->
        </div>
      </section>
    </body>
    </html>
    ```

    The slowness was most likely the browser loading all 61 images at once, even the ones nobody scrolls down to.

    **Green Notes**
    - **Defer offscreen images** (reduces E and network): the thumbnails have `loading="lazy"`, so the browser fetches them only when someone scrolls near them. Your ops team usually looks at the first few and closes the page, which is the case where this helps. In Green Metrics Tool micro-benchmarks, an article with 15 photos loaded 20 times without scrolling used about 12% less CPU energy with lazy loading. When visitors scrolled to the end, there was no difference.
    - The big preview has no `loading="lazy"`. It is the first thing people see, so it must load right away. Lazy-loading it would only delay it.
    - The `width` and `height` on each image let the browser reserve space, so the grid does not jump while thumbnails arrive.
verify:
  static_only: static HTML page, no executable code
