id: gen-1-00047-generation
category: generation
language: html
patterns:
- modern-image-formats
facts:
- F-IMGRENDER
- F-IMGENC
messages:
- role: user
  content: |
    hi, i am new to web stuff. i trained a small model that find disease on tomato leaves and i want a simple html page for my supervisor with 3 example results. for each one: the original photo, the heatmap from the model, the predicted label and the confidence.

    my files are leaf_01.png, leaf_01_heatmap.png, leaf_02.png ... (1024x1024, around 1.5 MB each, saved with matplotlib). when i open the page it feels slow, i dont know what is wrong. can you write the page?
- role: assistant
  content: |
    The slow part is most likely the six PNG files (about 9 MB in total). Photos and heatmaps overlaid on photos are not what PNG is good at. This page serves them as AVIF or WebP, with JPEG as a fallback for old browsers.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Tomato leaf disease model: example results</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 1rem; }
        .result { margin-bottom: 2.5rem; }
        .pair { display: flex; flex-wrap: wrap; gap: 1rem; }
        figure { margin: 0; }
        img { width: 100%; max-width: 512px; height: auto; }
        figcaption { font-size: 0.9rem; color: #444; }
      </style>
    </head>
    <body>
      <h1>Tomato leaf disease model: example results</h1>

      <section class="result">
        <h2>Example 1: Early blight (confidence 0.94)</h2>
        <div class="pair">
          <figure>
            <picture>
              <source srcset="samples/leaf_01.avif" type="image/avif">
              <source srcset="samples/leaf_01.webp" type="image/webp">
              <img src="samples/leaf_01.jpg" alt="Tomato leaf with brown spots" width="1024" height="1024">
            </picture>
            <figcaption>Input photo</figcaption>
          </figure>
          <figure>
            <picture>
              <source srcset="samples/leaf_01_heatmap.avif" type="image/avif">
              <source srcset="samples/leaf_01_heatmap.webp" type="image/webp">
              <img src="samples/leaf_01_heatmap.jpg" alt="Heatmap of the areas the model used" width="1024" height="1024">
            </picture>
            <figcaption>Model heatmap</figcaption>
          </figure>
        </div>
      </section>

      <section class="result">
        <h2>Example 2: Late blight (confidence 0.88)</h2>
        <div class="pair">
          <figure>
            <picture>
              <source srcset="samples/leaf_02.avif" type="image/avif">
              <source srcset="samples/leaf_02.webp" type="image/webp">
              <img src="samples/leaf_02.jpg" alt="Tomato leaf with dark wet-looking patches" width="1024" height="1024">
            </picture>
            <figcaption>Input photo</figcaption>
          </figure>
          <figure>
            <picture>
              <source srcset="samples/leaf_02_heatmap.avif" type="image/avif">
              <source srcset="samples/leaf_02_heatmap.webp" type="image/webp">
              <img src="samples/leaf_02_heatmap.jpg" alt="Heatmap of the areas the model used" width="1024" height="1024">
            </picture>
            <figcaption>Model heatmap</figcaption>
          </figure>
        </div>
      </section>

      <section class="result">
        <h2>Example 3: Healthy (confidence 0.97)</h2>
        <div class="pair">
          <figure>
            <picture>
              <source srcset="samples/leaf_03.avif" type="image/avif">
              <source srcset="samples/leaf_03.webp" type="image/webp">
              <img src="samples/leaf_03.jpg" alt="Healthy green tomato leaf" width="1024" height="1024">
            </picture>
            <figcaption>Input photo</figcaption>
          </figure>
          <figure>
            <picture>
              <source srcset="samples/leaf_03_heatmap.avif" type="image/avif">
              <source srcset="samples/leaf_03_heatmap.webp" type="image/webp">
              <img src="samples/leaf_03_heatmap.jpg" alt="Heatmap with no strong regions" width="1024" height="1024">
            </picture>
            <figcaption>Model heatmap</figcaption>
          </figure>
        </div>
      </section>
    </body>
    </html>
    ```

    Make the three versions of each PNG once, when you export your results (not on every page view). Keep the original PNGs outside the `samples/` folder:

    ```bash
    for f in samples/*.png; do
      base="${f%.png}"
      magick "$f" -quality 82 "$base.jpg"
      magick "$f" -quality 80 "$base.webp"
      avifenc -q 60 "$f" "$base.avif"
    done
    ```

    Check the heatmaps by eye after converting. If you need transparent overlays, keep those as PNG or WebP, because JPEG has no transparency.

    **Green Notes**
    - **Modern image formats with a JPEG fallback** (reduces network): the `<picture>` element lets the browser pick AVIF or WebP when it can, so far fewer bytes are sent than with PNG. The saving comes from the smaller files. In Green Metrics Tool browser benchmarks, decoding AVIF cost about 19% more CPU energy than JPG, so the gain is on the network side.
    - **Encode once, not per request** (reduces E): converting is the expensive step. In Green Metrics Tool micro-benchmarks, encoding AVIF cost about 7× the energy of encoding JPG for the same images. Running the script once per export and serving the finished files avoids that cost on every visit.
    - *Not applied:* AVIF only. Some older browsers cannot show it, so the WebP and JPEG fallbacks stay.
verify:
  static_only: HTML page and shell conversion commands, needs image tools and image files
