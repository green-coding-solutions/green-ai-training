  module: true
  test: |-
    import os
    import tempfile

    _lines = [
        "2026-10-24T10:00:01Z GET /api/items 200 37.5\n",
        "2026-10-24T10:00:02Z GET /api/items 200 1\n",
        "2026-10-24T10:00:03Z GET /health 200 0.4\n",
        "\n",
        "garbage line without number\n",
        "2026-10-24T10:00:04Z GET / 200 0\n",
        "2026-10-24T10:00:05Z GET / 200 -3\n",
        "2026-10-24T10:00:06Z GET / 200 nan\n",
        "2026-10-24T10:00:07Z GET / 200 inf\n",
        "2026-10-24T10:00:08Z GET / 200 40\n",
        "2026-10-24T10:00:09Z GET / 200 1024\n",
    ]
    _fd, _path = tempfile.mkstemp(suffix=".log")
    with os.fdopen(_fd, "w", encoding="utf-8") as _f:
        _f.writelines(_lines)
    try:
        assert latency_buckets(_path) == {5: 2, 0: 1, -2: 1, 10: 1}, latency_buckets(_path)
        assert latency_buckets(_path, base=10) == {1: 2, 0: 1, -1: 1, 3: 1}, latency_buckets(_path, base=10)
        try:
            latency_buckets(_path, base=1)
        except ValueError:
            pass
        else:
            raise AssertionError("base=1 should raise")
    finally:
        os.remove(_path)

    _fd2, _empty = tempfile.mkstemp(suffix=".log")
    os.close(_fd2)
    try:
        assert latency_buckets(_empty) == {}
    finally:
        os.remove(_empty)
    print("ok")
