id: gen-2-00343-generation
category: generation
language: html
patterns:
- remove-unused-css
- system-fonts-and-deps
facts:
- F-UNUSED-CSS
- F-FONTS
messages:
- role: user
  content: |
    html report template for our licscan cli (license scanner). python string.Template, placeholders $project $generated $rows. rows = table of package / version / license / status (ok, warn, deny)
- role: assistant
  content: |
    This template expects each row as `<tr><td>…</td><td>…</td><td>…</td><td class="s-ok">ok</td></tr>`. Escape package names and license strings with `html.escape()` when you build the rows.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>licscan: $project</title>
    <style>
      body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2328; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
      .meta { color: #59636e; margin: 0 0 1.5rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #d1d9e0; }
      th { background: #f6f8fa; font-weight: 600; }
      td.s-ok { color: #1a7f37; }
      td.s-warn { color: #9a6700; }
      td.s-deny { color: #d1242f; font-weight: 600; }
    </style>
    </head>
    <body>
    <h1>License report: $project</h1>
    <p class="meta">Generated $generated by licscan</p>
    <table>
    <thead><tr><th>Package</th><th>Version</th><th>License</th><th>Status</th></tr></thead>
    <tbody>
    $rows
    </tbody>
    </table>
    </body>
    </html>
    ```

    **Green Notes**
    - **Only the CSS this page uses** (reduces network): nine inline rules. There is no framework stylesheet and no extra request, so the report stays a single small file. The gain is bytes, not CPU. In Green Metrics Tool browser benchmarks, purging a 16 KB stylesheet of mostly unused rules changed client CPU energy by about 2%, which is within noise.
    - **System font stack** (reduces network, E): the browser downloads no font files. In Green Metrics Tool browser benchmarks, the system font stack used about 26% less CPU energy on cold page loads than six TTF font files.
verify:
  static_only: HTML template for Python string.Template, no executable code
