id: gen-1-00143-generation
category: generation
language: css
patterns:
- system-fonts-and-deps
messages:
- role: user
  content: |
    Our Go REST API serves a small /status page for the ops team (embedded with go:embed, one HTML file plus one CSS file). I need the stylesheet. Requirements:

    - Header with the service name and a status pill (ok / degraded / down)
    - A table of endpoints: method badge (GET, POST, PUT, DELETE), path in monospace, p95 latency, status
    - A `<pre>` block for a sample JSON response
    - Light and dark theme that follows the OS setting
    - Readable on a phone, because on-call people open it there
    - No build step, no npm, just plain CSS

    Class names are up to you, I'll adjust the HTML.
- role: assistant
  content: |
    ```css
    :root {
      --bg: #ffffff;
      --fg: #1b1f24;
      --muted: #5b6570;
      --border: #d8dde3;
      --surface: #f5f7f9;
      --ok: #1a7f37;
      --warn: #9a6700;
      --down: #cf222e;

      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --fg: #e6e9ec;
        --muted: #9aa5b1;
        --border: #2b333c;
        --surface: #181e25;
        --ok: #3fb950;
        --warn: #d29922;
        --down: #f85149;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--fg);
      font: 1rem/1.5 var(--font-sans);
    }

    main { max-width: 56rem; margin: 0 auto; }

    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .page-header h1 { margin: 0; font-size: 1.5rem; }

    /* status pill: add .ok, .degraded or .down */
    .pill {
      display: inline-block;
      padding: 0.15rem 0.75rem;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .pill.ok { color: var(--ok); }
    .pill.degraded { color: var(--warn); }
    .pill.down { color: var(--down); }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    th { color: var(--muted); font-size: 0.8125rem; font-weight: 600; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }

    .path, pre, code { font-family: var(--font-mono); font-size: 0.875rem; }

    /* method badge: add .get, .post, .put or .delete */
    .method {
      display: inline-block;
      min-width: 4.5rem;
      padding: 0.1rem 0.5rem;
      border-radius: 0.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      font: 600 0.75rem/1.5 var(--font-mono);
      text-align: center;
    }
    .method.get { color: var(--ok); }
    .method.post { color: var(--warn); }
    .method.put { color: var(--warn); }
    .method.delete { color: var(--down); }

    pre {
      margin: 1.5rem 0 0;
      padding: 1rem;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      tab-size: 2;
    }

    @media (max-width: 40rem) {
      body { padding: 0.75rem; }
      th, td { padding: 0.5rem; }
    }
    ```

    Markup these classes expect:

    ```html
    <header class="page-header">
      <h1>orders-api</h1>
      <span class="pill ok">ok</span>
    </header>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Method</th><th>Path</th><th>p95 (ms)</th><th>Status</th></tr></thead>
        <tbody>
          <tr>
            <td><span class="method get">GET</span></td>
            <td class="path">/v1/orders/{id}</td>
            <td class="num">42</td>
            <td><span class="pill ok">ok</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <pre>{ "status": "ok" }</pre>
    ```

    **Green Notes**
    - **System font stacks, no web fonts** (reduces network): `system-ui` and `ui-monospace` use fonts already on the device. No font files are downloaded, there is no extra request before text appears, and nothing needs to be cached or versioned on your side.
    - **Plain CSS, no framework** (reduces network): this page needs a handful of rules, so one small file replaces a CSS framework and its unused classes. Nothing to update or audit either.
    - Theme switching uses `prefers-color-scheme` and CSS variables, so there is no JavaScript and no second stylesheet.

    *Not applied:* a custom brand font. For an internal ops page it adds a download and no value. If you need one later, self-host a single subset `woff2` with `font-display: swap`.
verify:
  static_only: CSS/HTML only, no executable code
