id: gen-1-00143-generation
category: generation
language: python
patterns:
- regex-precompile
facts:
- F-REGEX
messages:
- role: user
  content: |
    Need `parse_pointing_log(lines)` for our telescope pointing logs. Lines look like:

    `2026-03-14T02:11:45.123 SCI_0042 RA=12h34m56.78s DEC=-12d34m56.7s EXP=300.0 FILT=r`

    Yield dicts with ts, target, ra_deg, dec_deg, exp_s, filt. Skip lines that don't match (comments, headers). Nightly files have a few million lines. Code only.
- role: assistant
  content: |
    ```python
    import re
    from typing import Iterable, Iterator

    _POINTING = re.compile(
        r"^(?P<ts>\S+)\s+(?P<target>\w+)\s+"
        r"RA=(?P<h>\d{1,2})h(?P<rm>\d{1,2})m(?P<rs>\d{1,2}(?:\.\d+)?)s\s+"
        r"DEC=(?P<sign>[+-]?)(?P<d>\d{1,2})d(?P<dm>\d{1,2})m(?P<ds>\d{1,2}(?:\.\d+)?)s\s+"
        r"EXP=(?P<exp>\d+(?:\.\d+)?)\s+FILT=(?P<filt>\w+)\s*$"
    )


    def parse_pointing_log(lines: Iterable[str]) -> Iterator[dict]:
        match = _POINTING.match
        for line in lines:
            m = match(line)
            if m is None:
                continue
            ra_deg = 15.0 * (int(m["h"]) + int(m["rm"]) / 60 + float(m["rs"]) / 3600)
            dec_abs = int(m["d"]) + int(m["dm"]) / 60 + float(m["ds"]) / 3600
            yield {
                "ts": m["ts"],
                "target": m["target"],
                "ra_deg": ra_deg,
                "dec_deg": -dec_abs if m["sign"] == "-" else dec_abs,
                "exp_s": float(m["exp"]),
                "filt": m["filt"],
            }
    ```

    **Green Notes**
    - **Regex compiled once at module level** (reduces E): the pattern is constant, so it is built a single time and reused for every line. In Green Metrics Tool micro-benchmarks, a precompiled pattern used about 18% less CPU energy than inline `re.match(pattern, s)` over 1,000,000 matches. The gain is modest because Python's `re` caches compiled patterns itself. It grows if the pattern is built dynamically per call.
    - **Generator** (reduces M): lines are parsed one at a time, so memory stays flat for files with millions of lines.

    The sign is read as its own group, so declinations like `-00d30m00s` keep their minus sign.
verify:
  test: |-
    import math
    sample = [
        "# pointing log v2",
        "2026-03-14T02:11:45.123 SCI_0042 RA=12h34m56.78s DEC=-12d34m56.7s EXP=300.0 FILT=r",
        "garbage line",
        "2026-03-14T02:17:01.500 CAL_0001 RA=00h05m00s DEC=-00d30m00s EXP=30 FILT=g",
        "2026-03-14T02:20:00.000 SCI_0043 RA=23h59m59.9s DEC=+45d00m00s EXP=60.5 FILT=i",
    ]
    out = list(parse_pointing_log(iter(sample)))
    assert len(out) == 3
    assert out[0]["ts"] == "2026-03-14T02:11:45.123"
    assert out[0]["target"] == "SCI_0042"
    assert math.isclose(out[0]["ra_deg"], 15 * (12 + 34 / 60 + 56.78 / 3600), rel_tol=1e-12)
    assert math.isclose(out[0]["dec_deg"], -(12 + 34 / 60 + 56.7 / 3600), rel_tol=1e-12)
    assert out[0]["exp_s"] == 300.0 and out[0]["filt"] == "r"
    assert math.isclose(out[1]["ra_deg"], 15 * 5 / 60, rel_tol=1e-12)
    assert math.isclose(out[1]["dec_deg"], -0.5, rel_tol=1e-12)
    assert out[2]["dec_deg"] == 45.0 and out[2]["exp_s"] == 60.5
