messages:
- role: user
  content: |
    css for the html report my cli tool writes out. readable tables, clean look
- role: assistant
  content: |
    Here is a self-contained stylesheet. You can inline it in a `<style>` tag, so the report is one file that works offline.

    ```css
    :root {
      --fg: #1f2328;
      --bg: #ffffff;
      --muted: #656d76;
      --line: #d0d7de;
      --stripe: #f6f8fa;
      --accent: #0969da;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3;
        --bg: #0d1117;
        --muted: #8d96a0;
        --line: #30363d;
        --stripe: #161b22;
        --accent: #4493f8;
      }
    }

    body {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }

    h1, h2, h3 {
      line-height: 1.25;
      margin: 1.5em 0 0.5em;
    }

    h1 { font-size: 1.75rem; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.1rem; }

    a { color: var(--accent); }

    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.9em;
    }

    pre {
      padding: 0.75rem 1rem;
      overflow-x: auto;
      background: var(--stripe);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 0.4rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    th {
      position: sticky;
      top: 0;
      background: var(--bg);
      font-weight: 600;
    }

    td.num, th.num { text-align: right; }

    tbody tr:nth-child(even) { background: var(--stripe); }

    .muted { color: var(--muted); }

    @media print {
      body { max-width: none; margin: 0; }
      th { position: static; }
    }
    ```

    **Green Notes**
    - **System font stacks, no web fonts** (reduces network and E): `system-ui` and `ui-monospace` use fonts already on the reader's machine. There is no font file to download, and no render wait for one. A local report with no `@import` or CDN link also opens fully offline.
    - **No CSS framework:** a report needs about 80 lines of CSS, not a full library. This is small enough to inline, so the report stays one file with no extra requests.
    - `font-variant-numeric: tabular-nums` keeps number columns aligned without a special monospace font.

    *Not applied:* a custom brand font. If you need one later, subset it and self-host it. Don't load it from a third-party CDN.
verify:
  static_only: CSS only, no runnable code
