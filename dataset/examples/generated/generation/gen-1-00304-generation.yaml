id: gen-1-00304-generation
category: generation
language: javascript
patterns:
- text-compression
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    hi, we have github actions pipeline for our docs site (vite build, then rsync dist to the nginx server). I need a node script for the step after build, who makes precompressed files so nginx dont need to do it for every request. we have html, css, js, json, svg, and also png, woff2 and some small files. script should be run like `node precompress.js dist`. no npm packages please, only what node have. thanks!
- role: assistant
  content: |
    The script is an ES module, because Vite projects usually have `"type": "module"` in `package.json`. If yours does not, name the file `precompress.mjs`.

    ```javascript
    import fs from 'node:fs/promises';
    import path from 'node:path';
    import zlib from 'node:zlib';
    import { promisify } from 'node:util';
    import { pathToFileURL } from 'node:url';

    const brotli = promisify(zlib.brotliCompress);
    const gzip = promisify(zlib.gzip);

    // Only text formats. PNG, WOFF2, JPEG etc. are already compressed.
    const TEXT_EXT = new Set([
      '.html', '.css', '.js', '.mjs', '.json', '.svg', '.xml', '.txt', '.webmanifest',
    ]);
    const MIN_BYTES = 1024; // tiny files gain nothing

    async function* walk(dir) {
      for (const entry of await fs.readdir(dir, { withFileTypes: true })) {
        const full = path.join(dir, entry.name);
        if (entry.isDirectory()) yield* walk(full);
        else if (entry.isFile()) yield full;
      }
    }

    export async function precompress(dir) {
      const stats = { compressed: 0, skipped: 0 };
      for await (const file of walk(dir)) {
        if (!TEXT_EXT.has(path.extname(file))) {
          stats.skipped++;
          continue;
        }
        const data = await fs.readFile(file);
        if (data.length < MIN_BYTES) {
          stats.skipped++;
          continue;
        }
        // Compressed once at build time, so the slow max levels are fine here.
        const [br, gz] = await Promise.all([
          brotli(data, {
            params: {
              [zlib.constants.BROTLI_PARAM_MODE]: zlib.constants.BROTLI_MODE_TEXT,
              [zlib.constants.BROTLI_PARAM_QUALITY]: 11,
              [zlib.constants.BROTLI_PARAM_SIZE_HINT]: data.length,
            },
          }),
          gzip(data, { level: 9 }),
        ]);
        // Keep a variant only if it is really smaller.
        if (br.length < data.length) await fs.writeFile(file + '.br', br);
        if (gz.length < data.length) await fs.writeFile(file + '.gz', gz);
        stats.compressed++;
      }
      return stats;
    }

    const isMain =
      process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href;

    if (isMain) {
      const dir = process.argv[2];
      if (!dir) {
        console.error('usage: node precompress.js <dir>');
        process.exitCode = 1;
      } else {
        const { compressed, skipped } = await precompress(dir);
        console.log(`compressed ${compressed} files, skipped ${skipped}`);
      }
    }
    ```

    Then turn on the static variants in nginx. `.br` needs the `ngx_brotli` module, and `gzip_static` is built in:

    ```text
    gzip_static on;
    brotli_static on;
    ```

    You can run the script again safely. `.br` and `.gz` files are not in the extension list, so they are skipped.

    **Green Notes**
    - **Precompressed static text** (reduces E, network): the server compresses nothing per request. It sends the ready file, and the browser downloads fewer bytes. See Enable text compression.
    - **Brotli quality 11 only at build time**: in Green Metrics Tool micro-benchmarks, brotli at its default quality 11 used about 45× the CPU energy of gzip to compress 100 MB of text. Decompression was cheap. That cost is paid once per build and the file is served many times. Don't use this level for responses compressed on every request.
    - **Skipped files**: PNG and WOFF2 are already compressed, and files under 1 KB gain nothing, so no CPU is spent on them.
    - *Not applied:* compression of dynamic API responses. That needs a fast level, so it is a different setup.
verify:
  module: true
  test: |-
    import os from 'node:os';
    import fsSync from 'node:fs';
    import assert from 'node:assert';

    const tmp = fsSync.mkdtempSync(path.join(os.tmpdir(), 'pc-'));
    const html = Buffer.from('<p>hello docs</p>\n'.repeat(500));
    const css = Buffer.from('body{color:red}\n'.repeat(200));
    fsSync.writeFileSync(path.join(tmp, 'index.html'), html);
    fsSync.writeFileSync(path.join(tmp, 'small.json'), '{"a":1}');
    fsSync.writeFileSync(path.join(tmp, 'logo.png'), Buffer.alloc(5000, 1));
    fsSync.mkdirSync(path.join(tmp, 'sub'));
    fsSync.writeFileSync(path.join(tmp, 'sub', 'app.css'), css);

    let stats = await precompress(tmp);
    assert.strictEqual(stats.compressed, 2);
    assert.strictEqual(stats.skipped, 2);
    assert.ok(fsSync.existsSync(path.join(tmp, 'index.html.br')));
    assert.ok(fsSync.existsSync(path.join(tmp, 'index.html.gz')));
    assert.ok(fsSync.existsSync(path.join(tmp, 'sub', 'app.css.br')));
    assert.ok(zlib.brotliDecompressSync(fsSync.readFileSync(path.join(tmp, 'index.html.br'))).equals(html));
    assert.ok(zlib.gunzipSync(fsSync.readFileSync(path.join(tmp, 'index.html.gz'))).equals(html));
    assert.ok(zlib.gunzipSync(fsSync.readFileSync(path.join(tmp, 'sub', 'app.css.gz'))).equals(css));
    assert.ok(!fsSync.existsSync(path.join(tmp, 'small.json.br')));
    assert.ok(!fsSync.existsSync(path.join(tmp, 'logo.png.gz')));

    stats = await precompress(tmp);
    assert.strictEqual(stats.compressed, 2);
    assert.ok(!fsSync.existsSync(path.join(tmp, 'index.html.br.br')));
    fsSync.rmSync(tmp, { recursive: true, force: true });

    // The CLI block may have set exitCode = 1 if this file ran as the entry point without args.
    process.exitCode = 0;
    console.log('ok');
