category: generation
language: css
patterns:
- css-animations
facts:
- F-ANIM
messages:
- role: user
  content: |
    hi, im new to web stuff. on my landing page I have a row of customer logos ("trusted by") and I want them move to the left slowly, forever, like a ticker. I tried with javascript like this but it is not good, the logos jump back at the end and my laptop fan start to be loud when the page is open. I dont know what I do wrong

    ```js
    const track = document.querySelector('.logos');
    let x = 0;
    setInterval(() => {
      x -= 1;
      track.style.left = x + 'px';
      if (x < -1200) x = 0;
    }, 10);
    ```

    can you show me how to do it the right way? the html is just a div with 6 img inside
- role: assistant
  content: |
    The jump comes from resetting `x` to 0 when the row has not looped cleanly. The easy fix is to repeat the logos once and move the row by exactly half its width. Then the end looks the same as the start. No JavaScript is needed.

    ```html
    <div class="logo-strip">
      <div class="logo-track">
        <img src="logos/a.svg" alt="Acme">
        <img src="logos/b.svg" alt="Bolt">
        <!-- ...your 6 logos... -->

        <!-- same 6 again, hidden from screen readers -->
        <img src="logos/a.svg" alt="" aria-hidden="true">
        <img src="logos/b.svg" alt="" aria-hidden="true">
        <!-- ... -->
      </div>
    </div>
    ```

    ```css
    .logo-strip {
      overflow: hidden;
    }

    .logo-track {
      display: flex;
      width: max-content;
      animation: logo-scroll 30s linear infinite;
    }

    .logo-track img {
      flex: none;
      height: 32px;
      width: auto;
      padding: 0 24px; /* padding, not gap, so the half-way point is exact */
    }

    @keyframes logo-scroll {
      to { transform: translateX(-50%); }
    }

    .logo-strip:hover .logo-track {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-track { animation: none; }
    }
    ```

    **Green Notes**
    - **CSS animation instead of JS-driven animation** (reduces E on the client): `@keyframes` with `transform` lets the browser run the movement itself. Your version runs JavaScript 100 times a second and changes `left`, which makes the browser redo the layout each time. That is likely why the fan spins up. In Green Metrics Tool browser benchmarks, a 20-second animation driven by `requestAnimationFrame` style updates used ~161 J, and the same animation with CSS `@keyframes` ~145 J, about 10% less. A ticker stays open for as long as the visitor reads the page, so this adds up.
    - **`transform` only** (reduces E): moving with `translateX` does not change the layout of the other elements on the page.

    The hover pause and the reduced-motion rule are for users, not for speed. People who set "reduce motion" in their system get a still row.
verify:
  static_only: browser CSS animation, needs a rendering engine
