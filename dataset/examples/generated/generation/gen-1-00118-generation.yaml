- role: assistant
  content: |
    I filled in the `TODO`: the hero background now has an AVIF/WebP/JPEG chain and a smaller file for narrow screens. Browsers that don't understand `image-set()` with `type()` ignore that line and use the JPEG line before it.

    ```css
    .status-hero {
      min-height: 320px;
      padding: 2rem;
      background-color: #0e1a24;
      background-size: cover;
      background-position: center;
      /* fallback for browsers without image-set() type() support */
      background-image: url("/img/datacenter-hero-1200.jpg");
      background-image: image-set(
        url("/img/datacenter-hero-1200.avif") type("image/avif"),
        url("/img/datacenter-hero-1200.webp") type("image/webp"),
        url("/img/datacenter-hero-1200.jpg") type("image/jpeg")
      );
    }

    @media (min-width: 900px) {
      .status-hero {
        background-image: url("/img/datacenter-hero-2400.jpg");
        background-image: image-set(
          url("/img/datacenter-hero-2400.avif") type("image/avif"),
          url("/img/datacenter-hero-2400.webp") type("image/webp"),
          url("/img/datacenter-hero-2400.jpg") type("image/jpeg")
        );
      }
    }
    ```

    The rest of your CSS stays as it is. Create the variants once in the build job, not on the server per request:

    ```bash
    for w in 1200 2400; do
      convert img/datacenter-hero.jpg -resize "${w}x" -quality 80 "img/datacenter-hero-$w.jpg"
      cwebp -q 78 "img/datacenter-hero-$w.jpg" -o "img/datacenter-hero-$w.webp"
      avifenc --min 25 --max 40 "img/datacenter-hero-$w.jpg" "img/datacenter-hero-$w.avif"
    done
    ```

    **Green Notes**
    - **Modern image formats** (reduces network): AVIF and WebP send fewer bytes than the 1.8 MB JPEG to every visitor of the page. The savings come from the smaller transfer, not from cheaper decoding.
      Pattern: Serve images in modern formats
    - **Encode at build time** (reduces E): in Green Metrics Tool micro-benchmarks, encoding 50 BMP images to AVIF used about 658 J against about 89 J for JPG, roughly 7×. Do this once in CI and cache the output files. Never do it per request.
    - **Right-sized variants** (reduces network): phones get the 1200 px file, not the 2400 px one.
    - *Not applied:* the `.pipeline-card` rules use no images. If you add status icons later, use SVG. A raster format is wasteful for tiny icons.
