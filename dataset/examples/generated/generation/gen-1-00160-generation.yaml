id: gen-1-00160-generation
category: generation
language: bash
patterns:
- bash-quoting
- bash-builtins
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    Need a bash script for our CI pipeline. Takes a services dir and an output dir. For every subdir of services/ it writes <out>/<name>.env with a fixed header (generated-by comment, LOG_FORMAT=json, LOG_LEVEL=info, OTEL endpoint http://otel-collector:4318) plus SERVICE_NAME and IMAGE=registry.example.com/platform/<name>:<GIT_SHA, default dev>. ~400 services. strict mode. No explanation needed, just the script.
- role: assistant
  content: |-
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail
    shopt -s nullglob

    services_dir=${1:?usage: gen-ci-env.sh <services-dir> <out-dir>}
    out_dir=${2:?usage: gen-ci-env.sh <services-dir> <out-dir>}

    mkdir -p "$out_dir"

    for dir in "$services_dir"/*/; do
      dir=${dir%/}
      name=${dir##*/}
      {
        printf '%s\n' '# generated by ci, do not edit'
        printf '%s\n' 'LOG_FORMAT=json'
        printf '%s\n' 'LOG_LEVEL=info'
        printf '%s\n' 'OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318'
        printf 'SERVICE_NAME=%s\n' "$name"
        printf 'IMAGE=registry.example.com/platform/%s:%s\n' "$name" "${GIT_SHA:-dev}"
      } > "$out_dir/$name.env"
    done
    ```

    **Green Notes**
    - **Single quotes for fixed literals** (reduces E): the header lines and printf formats need no expansion, so they are single-quoted. Bash does not scan them for `$`, backticks or backslashes. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes. Your literals are short, so the saving here is small. It only grows with literal length and loop count.
    - **Double quotes kept where expansion is needed**: `"$name"`, `"$out_dir/$name.env"` and `"${GIT_SHA:-dev}"` stay double-quoted, so paths with spaces still work.
    - **Parameter expansion instead of `basename`** (reduces E): `${dir##*/}` runs inside the shell. `$(basename ...)` would fork a process for each of the 400 services.
    - **One redirect per file**: the `{ ...; } > file` group opens each output file once instead of once per line.
