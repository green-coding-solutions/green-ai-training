messages:
- role: user
  content: |
    hi i am new with html. i want make one page for my dog grooming salon "Happy Paws". I have photos: hero.jpg (big photo of a dog in the bath), and 6 photos of dogs after grooming (dog1.jpg to dog6.jpg), and 3 photos of the team (anna.jpg, tom.jpg, mia.jpg). Page should have a big title on top, the gallery, the team, and the opening hours at the bottom. Can you write it? I am not sure how to put the pictures correctly.
- role: assistant
  content: |
    Here is a simple page. All images are in an `img/` folder next to the HTML file.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Happy Paws – Dog Grooming</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
        header { position: relative; }
        header img { width: 100%; height: auto; display: block; }
        header h1 { position: absolute; bottom: 1rem; left: 1rem; margin: 0;
                    color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
        section { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; gap: 1rem;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        .grid img { width: 100%; height: auto; border-radius: 8px; }
        .team figure { margin: 0; text-align: center; }
      </style>
    </head>
    <body>
      <header>
        <img src="img/hero.jpg" alt="A happy dog in the bath at Happy Paws"
             width="1600" height="800" fetchpriority="high">
        <h1>Happy Paws – Dog Grooming</h1>
      </header>

      <section>
        <h2>Our work</h2>
        <div class="grid">
          <img src="img/dog1.jpg" alt="Fluffy white dog after grooming" width="800" height="600" loading="lazy">
          <img src="img/dog2.jpg" alt="Brown poodle with a fresh cut" width="800" height="600" loading="lazy">
          <img src="img/dog3.jpg" alt="Small terrier with a clean coat" width="800" height="600" loading="lazy">
          <img src="img/dog4.jpg" alt="Golden retriever after a bath" width="800" height="600" loading="lazy">
          <img src="img/dog5.jpg" alt="Dachshund wearing a bow" width="800" height="600" loading="lazy">
          <img src="img/dog6.jpg" alt="Husky with a soft brushed coat" width="800" height="600" loading="lazy">
        </div>
      </section>

      <section class="team">
        <h2>Our team</h2>
        <div class="grid">
          <figure>
            <img src="img/anna.jpg" alt="Anna" width="400" height="400" loading="lazy">
            <figcaption>Anna – owner</figcaption>
          </figure>
          <figure>
            <img src="img/tom.jpg" alt="Tom" width="400" height="400" loading="lazy">
            <figcaption>Tom – groomer</figcaption>
          </figure>
          <figure>
            <img src="img/mia.jpg" alt="Mia" width="400" height="400" loading="lazy">
            <figcaption>Mia – groomer</figcaption>
          </figure>
        </div>
      </section>

      <section>
        <h2>Opening hours</h2>
        <p>Mon–Fri 9:00–18:00<br>Sat 9:00–14:00<br>Sun closed</p>
      </section>
    </body>
    </html>
    ```

    Change the `width` and `height` numbers to the real size of your files. The browser then reserves the space, and the page does not jump while images load.

    **Green Notes**
    - **Lazy-load images** (reduces network, E): the gallery and team photos are below the first screen, so they have `loading="lazy"` and load only when a visitor scrolls near them. In Green Metrics Tool micro-benchmarks of an article with 15 photos, loading without scrolling used about 12% less CPU energy. When visitors scrolled to the end, there was no difference. So it helps most for people who only look at the top.
    - **Hero image stays eager** (reduces E): the hero is above the fold, so it has no `loading="lazy"`. It has `fetchpriority="high"` so it loads first.
    - **System font stack** (reduces E): `font-family: system-ui, sans-serif` needs no font download.

    Before you upload, check that your JPG files are not much larger than they are shown. Photos straight from a phone are often several MB.
