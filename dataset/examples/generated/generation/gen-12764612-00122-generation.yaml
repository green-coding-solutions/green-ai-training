  content: |
    css for product grid on our shop category page. cards with image, title, price, sale badge, add to cart button. 4 cols desktop, 2 mobile
- role: assistant
  content: |
    ```css
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    @media (min-width: 900px) {
      .product-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
      }
    }

    .product-card {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e3e3e3;
      border-radius: 8px;
      background: #fff;
    }

    .product-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .product-card__title {
      margin: 0.75rem 0.75rem 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .product-card__price {
      margin: 0.25rem 0.75rem 0.75rem;
      font-weight: 700;
    }

    .product-card__price s {
      margin-right: 0.4rem;
      color: #767676;
      font-weight: 400;
    }

    .product-card__badge {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #c62828;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .product-card__button {
      margin: auto 0.75rem 0.75rem;
      padding: 0.6rem;
      border: 0;
      border-radius: 6px;
      background: #1a1a1a;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .product-card__button:hover,
    .product-card__button:focus-visible {
      background: #000;
    }

    .product-card__button:focus-visible {
      outline: 2px solid #1a1a1a;
      outline-offset: 2px;
    }
    ```

    Markup it expects: `<ul class="product-grid">` with one `<li class="product-card">` per product. Each card holds an `<img>`, the title, a price (use `<s>` for the old price), an optional badge, and a button.

    **Green Notes**
    - **Only the rules the page uses** (reduces network): the sheet covers the grid, card, badge and button, with no framework, reset or unused variants. In Green Metrics Tool micro-benchmarks, shrinking a 16 KB mostly-unused stylesheet to 0.75 KB changed client energy by about 2%, which is within noise. The gain is fewer bytes on real networks, not CPU.
    - *Not applied:* PurgeCSS or a build step. A small hand-written sheet has nothing to purge, and the extra tooling would cost more than it saves.
