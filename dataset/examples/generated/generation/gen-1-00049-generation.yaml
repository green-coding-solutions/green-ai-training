    **Green Notes**
    - **Remove unused CSS** (reduces network): the styles are written for this page only, with no framework stylesheet. The CSS is a few hundred bytes inline, with no extra request. In Green Metrics Tool browser benchmarks (50 cold page loads), a 16 KB mostly unused stylesheet used ~783 J and a purged one ~764 J, about 2%, which is within noise. So the gain here is fewer bytes on real networks, not measurable client CPU.

    The failed row says `files out: 0`. Check that a failed partition really leaves its input files in place.
