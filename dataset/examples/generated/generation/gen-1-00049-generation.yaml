        .meta { margin: .25rem 0 1.5rem; color: #52606d; }
        code { font-family: ui-monospace, monospace; }

        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .card { display: flex; flex-direction: column; padding: 1rem; background: #fff; border: 1px solid #d9e2ec; border-radius: .5rem; }
        .label { font-size: .85rem; color: #52606d; }
        .value { font-size: 1.75rem; font-weight: 600; }
        .value.fail { color: #b42318; }

        .runs { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d9e2ec; }
        .runs th, .runs td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid #e4e7eb; }
        .runs th { background: #f0f4f8; font-size: .85rem; }
        .runs .num { text-align: right; font-variant-numeric: tabular-nums; }

        .badge { padding: .1rem .5rem; border-radius: 1rem; font-size: .8rem; }
        .badge.ok { background: #d1fadf; color: #05603a; }
        .badge.warn { background: #fef0c7; color: #93370d; }
