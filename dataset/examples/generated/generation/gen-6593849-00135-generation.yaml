messages:
- role: user
  content: |
    I need a Python function for our shop's carrier invoice check. Every night we get about 3 million parcels from the warehouse system as `(weight_g, volume_cm3)` tuples, and we have to calculate the shipping cost for each one.

    Requirements:
    - `shipping_costs(parcels, tiers, volumetric_divisor=5000)` returns a list of costs in cents, same order as the input
    - billable weight in kg = the bigger of real weight (weight_g / 1000) and volumetric weight (volume_cm3 / divisor), rounded UP to a full kg
    - `tiers` is a sorted list of `(max_billable_kg, cost_cents)`, e.g. `[(1, 500), (5, 900), (20, 2000)]`. A parcel gets the first tier where its billable kg fits.
    - if a parcel is heavier than the last tier, raise `ValueError` with a clear message
    - stdlib only please
- role: assistant
  content: |
    ```python
    from bisect import bisect_left
    from math import ceil


    def shipping_costs(parcels, tiers, volumetric_divisor=5000):
        limits = [max_kg for max_kg, _ in tiers]
        costs = [cents for _, cents in tiers]
        n_tiers = len(limits)

        # Bind the lookups used on every parcel once, before the loop.
        find_tier = bisect_left
        round_up = ceil
        out = []
        add = out.append

        for weight_g, volume_cm3 in parcels:
            billable_kg = round_up(max(weight_g / 1000, volume_cm3 / volumetric_divisor))
            i = find_tier(limits, billable_kg)
            if i == n_tiers:
                raise ValueError(
                    f"parcel too heavy: {billable_kg} kg billable, "
                    f"largest tier is {limits[-1]} kg"
                )
            add(costs[i])
        return out
    ```

    `bisect_left` finds the first tier with `max_billable_kg >= billable_kg`, which matches "first tier where it fits". Parcels with zero weight and zero volume fall into the first tier.

    **Green Notes**
    - **Hoist loop-invariant lookups** (reduces E): the tier limits and costs are split into lists once, and `bisect_left`, `ceil` and `out.append` are bound to locals before the 3-million-iteration loop, so the loop does not repeat these lookups for every parcel. In Green Metrics Tool micro-benchmarks, caching `math.sqrt` in a local before a 10,000,000-iteration loop saved about 4-5%. So this is a small gain. It is worth it in a loop this hot, and not worth it in cold code.
verify:
  test: |-
    tiers = [(1, 500), (5, 900), (20, 2000)]
    assert shipping_costs([(500, 1000), (2500, 100), (1000, 50000)], tiers) == [500, 900, 2000]
    assert shipping_costs([], tiers) == []
    assert shipping_costs([(0, 0), (1001, 0), (5000, 0)], tiers) == [500, 900, 900]
    assert shipping_costs([(100, 25000)], tiers) == [900]
    assert shipping_costs([(100, 30000)], tiers) == [2000]
    try:
        shipping_costs([(500, 1000), (30000, 1)], tiers)
        raise SystemExit("expected ValueError")
    except ValueError as e:
        assert "too heavy" in str(e)
