id: gen-2-00339-generation
category: generation
language: html
patterns:
- remove-unused-css
- system-fonts-and-deps
facts:
- F-UNUSED-CSS
- F-FONTS
messages:
- role: user
  content: |
    hi, I wrote a small python CLI `photosort`. It sorts camera photos into folders by date, and at the end it writes `summary.html` with jinja2. On my laptop the report looks nice. But when I open it on our NAS box (no internet there) it is just ugly plain text. The table has no borders and the font is different. I don't understand what is wrong, the file is the same?

    I copied the head from a tutorial:

    ```html
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    ```

    I only use bootstrap for the tables and one colored badge for the errors. Can you write me the template so it also works offline? The data I pass:
    - `run` with `started`, `source_dir`, `total`, `moved`, `skipped`, `errors`
    - `folders`: list with `name`, `count`
    - `problems`: list with `path`, `reason`
- role: assistant
  content: |
    Your Python is fine. The page loads Bootstrap and the Inter font from the internet. On the NAS these requests fail, so the browser falls back to its default styles and font. The fix is to put the few rules you actually use into the file itself:

    ```html
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>photosort summary – {{ run.started }}</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
             margin: 2rem; color: #222; line-height: 1.4; }
      h1 { font-size: 1.4rem; margin-bottom: .25rem; }
      h2 { font-size: 1.1rem; margin-top: 2rem; }
      .meta { color: #666; margin-top: 0; }
      table { border-collapse: collapse; margin: .5rem 0; min-width: 24rem; }
      th, td { border: 1px solid #ccc; padding: .35rem .6rem; text-align: left; }
      th { background: #f3f3f3; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .badge { display: inline-block; padding: .1rem .5rem; border-radius: .6rem; color: #fff; font-size: .85rem; }
      .ok { background: #2e7d32; }
      .warn { background: #c62828; }
    </style>
    </head>
    <body>
    <h1>photosort summary</h1>
    <p class="meta">Started {{ run.started }} · source <code>{{ run.source_dir }}</code></p>

    <table>
      <tr><th>Total</th><td class="num">{{ run.total }}</td></tr>
      <tr><th>Moved</th><td class="num">{{ run.moved }}</td></tr>
      <tr><th>Skipped</th><td class="num">{{ run.skipped }}</td></tr>
      <tr><th>Errors</th><td class="num">
        {% if run.errors %}<span class="badge warn">{{ run.errors }}</span>{% else %}<span class="badge ok">0</span>{% endif %}
      </td></tr>
    </table>

    <h2>Folders</h2>
    <table>
      <thead><tr><th>Folder</th><th>Photos</th></tr></thead>
      <tbody>
      {% for f in folders %}
        <tr><td>{{ f.name }}</td><td class="num">{{ f.count }}</td></tr>
      {% endfor %}
      </tbody>
    </table>

    <h2>Problems</h2>
    {% if problems %}
    <table>
      <thead><tr><th>File</th><th>Reason</th></tr></thead>
      <tbody>
      {% for p in problems %}
        <tr><td><code>{{ p.path }}</code></td><td>{{ p.reason }}</td></tr>
      {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p>No problems.</p>
    {% endif %}
    </body>
    </html>
    ```

    Render it with `Environment(autoescape=True)` so file names with `<` or `&` show correctly.

    **Green Notes**
    - **Only the CSS the report uses, inline** (reduces network): about a dozen rules instead of the whole Bootstrap file, and no external request. That is why it now works offline. The energy effect is small: in Green Metrics Tool page-load benchmarks, purging a small stylesheet with mostly unused rules changed client CPU energy by only about 2%, which is within noise. The real gain is fewer bytes and one less dependency.
    - **System font stack instead of a web font** (reduces E and network): nothing to download, and the text looks native on every machine. In Green Metrics Tool page-load benchmarks, the system font stack used about 16% less CPU energy than two small WOFF2 subsets, and about 26% less than a set of large TTF files.
verify:
  static_only: Jinja2 HTML template, rendering needs the jinja2 package
