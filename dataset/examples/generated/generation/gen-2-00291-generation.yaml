messages:
- role: user
  content: |
    need the html page my cli shows after the oauth redirect. "logged in, you can close this tab" + an animated checkmark
- role: assistant
  content: |
    This page is self-contained, with no JS and no external assets. Your CLI's local callback server can return it as a single string.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Logged in</title>
      <style>
        :root { color-scheme: light dark; }
        body {
          margin: 0;
          min-height: 100vh;
          display: grid;
          place-items: center;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          background: Canvas;
          color: CanvasText;
        }
        .card { text-align: center; padding: 2rem; }
        .check { width: 72px; height: 72px; }
        .check circle,
        .check path {
          fill: none;
          stroke: #2da44e;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .check circle {
          stroke-width: 4;
          stroke-dasharray: 189;   /* circumference of r=30 */
          stroke-dashoffset: 189;
          animation: draw 0.6s ease-out forwards;
        }
        .check path {
          stroke-width: 5;
          stroke-dasharray: 42;    /* length of the tick */
          stroke-dashoffset: 42;
          animation: draw 0.35s ease-out 0.5s forwards;
        }
        .msg { animation: rise 0.4s ease-out 0.7s both; }
        h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
        p { margin: 0; opacity: 0.75; }

        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes rise {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
          .check circle, .check path { animation: none; stroke-dashoffset: 0; }
          .msg { animation: none; }
        }
      </style>
    </head>
    <body>
      <main class="card">
        <svg class="check" viewBox="0 0 72 72" aria-hidden="true">
          <circle cx="36" cy="36" r="30"/>
          <path d="M22 37 L32 47 L51 27"/>
        </svg>
        <div class="msg">
          <h1>Logged in</h1>
          <p>You can close this tab and return to your terminal.</p>
        </div>
      </main>
    </body>
    </html>
    ```

    **Green Notes**
    - **CSS keyframes instead of a JS animation loop** (reduces E): the browser runs the stroke drawing and the fade by itself, so no script runs on every frame. In Green Metrics Tool measurements of a 20-second browser animation, CSS `@keyframes` used about 10% less CPU energy than `requestAnimationFrame` with style updates.
    - **Plays once, then stops** (reduces E): `forwards` keeps the final frame, so nothing keeps animating. People often leave these tabs open for hours.

    Users with "reduce motion" enabled see the finished checkmark right away.
verify:
  static_only: HTML/CSS page, needs a browser to render
