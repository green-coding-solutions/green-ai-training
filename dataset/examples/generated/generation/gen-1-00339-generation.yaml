id: gen-1-00339-generation
category: generation
language: bash
patterns:
- bash-quoting
- bash-builtins
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    bash script to split app log into error / warn / other files by level
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    src=${1:?'usage: split-log.sh LOGFILE [OUTDIR]'}
    out=${2:-.}

    mkdir -p "$out"
    exec 3>"$out/error.log" 4>"$out/warn.log" 5>"$out/other.log"

    while IFS= read -r line; do
      case $line in
        *' ERROR '*|*' FATAL '*) printf '%s\n' "$line" >&3 ;;
        *' WARN '*)              printf '%s\n' "$line" >&4 ;;
        *)                       printf '%s\n' "$line" >&5 ;;
      esac
    done < "$src"

    exec 3>&- 4>&- 5>&-
    ```

    It expects the level as a separate word, like `2026-10-09 12:00:01 ERROR db timeout`. Change the `case` patterns if your format differs.

    **Green Notes**
    - **Single quotes for literals, double quotes only for variables** (reduces E): the `case` patterns, `printf` format and usage text need no expansion, so they are single-quoted. Bash does not have to scan them for `$`, backticks or backslashes. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character single-quoted literal in a loop used about 24% less CPU energy than double-quoted. For short strings like these the absolute saving is small. It grows with literal length and loop count.
    - **Output files opened once** (reduces E): `exec 3>...` keeps three file descriptors open. `>> file` inside the loop would open and close a file on every line.
    - **Builtins only in the loop** (reduces E): `read`, `case` and `printf` are shell builtins, so there is no `grep` or `echo | ...` fork per line.
    - *Not applied:* for very large logs, a single `awk` pass would be faster than a bash `while read` loop. Bash is fine for small and medium files.
verify:
  static_only: bash script, needs a log file and shell execution; no stdlib-python or node harness applies
