id: gen-1-00044-generation
category: generation
language: python
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    py func: pick the hero variant for our landing page A/B test from the integer visitor_id. 4 variants, 25% each: control, short_headline, video_hero, social_proof. called on every page render in our Flask view. just the code
- role: assistant
  content: |
    ```python
    def hero_variant(visitor_id: int) -> str:
        bucket = visitor_id % 4
        if bucket == 0:
            return "control"
        if bucket == 1:
            return "short_headline"
        if bucket == 2:
            return "video_hero"
        return "social_proof"
    ```

    **Green Notes**
    - **Simple equality conditions** (reduces E): the modulo runs once, then each branch is a plain `==` check. This avoids repeating `visitor_id % 4` inside range or modulo guards on every branch. In Green Metrics Tool micro-benchmarks, 10,000,000 classifications with simple equality branches used about 16% less CPU energy than complex range/modulo conditions.
    - The same visitor always lands in the same variant, so the page stays consistent across visits.
    - *Not applied:* `match`. It showed no meaningful energy difference from `if` in the same benchmarks, so the plain `if` chain stays.
verify:
  test: |-
    assert hero_variant(0) == "control"
    assert hero_variant(1) == "short_headline"
    assert hero_variant(2) == "video_hero"
    assert hero_variant(3) == "social_proof"
    assert hero_variant(4) == "control"
    assert hero_variant(1001) == "short_headline"
    assert hero_variant(-1) == "social_proof"
    from collections import Counter
    c = Counter(hero_variant(i) for i in range(1000))
    assert set(c.values()) == {250}
