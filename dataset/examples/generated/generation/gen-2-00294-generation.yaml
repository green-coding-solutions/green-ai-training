messages:
- role: user
  content: |
    Inference playground for our image classifier. FastAPI serves `static/playground.css` directly, no bundler. Current file:

    ```css
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --text: #e6e8ee;
      --muted: #8a93a6;
      --accent: #4f8cff;
      --warn: #f0a83a;
      --radius: 6px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .dropzone {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }
    .dropzone.over { border-color: var(--accent); color: var(--text); }
    ```

    Need styles for the new results panel: top-5 predictions as an `<ol>`, each row has label + score and a horizontal confidence bar. JS sets `--p` (0–1) inline on each `<li>`. Top-1 row highlighted. Plus a small latency badge `.latency` that turns amber with `.slow` (JS adds it over 200 ms). Use the existing vars. Only the new rules, no commentary. We also need a minified file for prod.
- role: assistant
  content: |
    Append to `static/playground.css`:

    ```css
    /* <ol class="preds">
         <li class="pred top" style="--p: …"><span class="label">…</span><span class="score">…</span><span class="bar"></span></li>
       </ol>
       <span class="latency slow">…</span> */
    .preds {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }
    .pred {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      align-items: baseline;
    }
    .pred .label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pred .score {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    .pred .bar {
      grid-column: 1 / -1;
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      overflow: hidden;
    }
    .pred .bar::after {
      content: "";
      display: block;
      height: 6px;
      background: var(--muted);
      transform: scaleX(var(--p, 0));
      transform-origin: left;
    }
    .pred.top .label { font-weight: 600; }
    .pred.top .score { color: var(--text); }
    .pred.top .bar::after { background: var(--accent); }

    .latency {
      display: inline-block;
      padding: 1px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font: 12px/1.6 var(--mono);
      color: var(--muted);
    }
    .latency.slow {
      color: var(--warn);
      border-color: var(--warn);
    }
    ```

    Build the min file in your deploy step from the source. Don't keep a hand-minified copy:

    ```bash
    npx esbuild static/playground.css --minify --outfile=static/playground.min.css
    ```

    **Green Notes**
    - **Minify in the build, not by hand** (reduces network): you edit only one file, and the min file never drifts from it. In Green Metrics Tool measurements of a small page, a minified build used about 2% less client CPU energy than unminified sources, which is within measurement noise. For a stylesheet this size, the gain is fewer bytes over the network, not client CPU.
verify:
  static_only: CSS stylesheet and esbuild CLI call; no runtime to execute
