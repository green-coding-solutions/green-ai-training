    import json, os, tempfile
    fd, p = tempfile.mkstemp(suffix=".jsonl")
    with os.fdopen(fd, "w", encoding="utf-8") as f:
        for i in range(120):
            f.write(json.dumps({"id": i, "city": "Berlin"}) + "\n")
        f.write("\n")
    r = recent_signups(p, limit=50)
    assert [x["id"] for x in r] == list(range(119, 69, -1))
    assert len(r) == 50
    assert recent_signups(p, limit=0) == []
    assert [x["id"] for x in recent_signups(p, limit=500)] == list(range(119, -1, -1))
    os.remove(p)
