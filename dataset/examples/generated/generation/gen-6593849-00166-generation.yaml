- role: user
  content: |
    hi, im new to python. i work on our small REST api (reports.py) and need a function date_range_params(query) for the report endpoints. query is a dict like request.args, can have "from" and "to" as YYYY-MM-DD strings. it should return (start, end) as date objects. if "to" is missing use today, if "from" is missing use 30 days before the end. if the format is wrong or from is after to, raise ValueError with a clear message.

    the top of my file looks like this:

