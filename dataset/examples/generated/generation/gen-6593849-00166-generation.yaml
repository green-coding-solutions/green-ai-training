    i dont know if this is ok, someone said star imports are bad. should i change them?
- role: assistant
  content: |
    ```python
    from datetime import *
    from json import *


    def date_range_params(query, days=30, today=None):
        """Return (start, end) as dates from the 'from' and 'to' query values."""
        today = today or date.today()
        raw_start = query.get('from')
        raw_end = query.get('to')

        try:
            end = datetime.strptime(raw_end, '%Y-%m-%d').date() if raw_end else today
            if raw_start:
                start = datetime.strptime(raw_start, '%Y-%m-%d').date()
            else:
                start = end - timedelta(days=days)
        except ValueError:
            raise ValueError("'from' and 'to' must look like YYYY-MM-DD") from None

        if start > end:
            raise ValueError("'from' must not be after 'to'")
        return start, end
    ```

    Your imports work for this function, so I left them as they are. `date`, `datetime` and `timedelta` all come from the `datetime` star import. The `today` argument is only there so you can test the default range without waiting for a certain day.

    You don't need to change them. In a new file, explicit imports like `from datetime import date, datetime, timedelta` are the usual choice, because readers can see where each name comes from. That is about readability, not speed or energy.

    **Green Notes**
    - **Star imports left unchanged:** switching to `import datetime` or to explicit names would not save energy. In Green Metrics Tool micro-benchmarks of 1,000 Python process starts, `from sympy import *` used ~3103 J and `import sympy` ~3093 J, which is no measurable difference.
    - **Plain date parsing, no extra libraries:** the standard library handles the format, so the endpoint pulls in no heavy module.
verify:
  test: |-
    from datetime import date
    assert date_range_params({'from': '2024-01-01', 'to': '2024-01-31'}) == (date(2024, 1, 1), date(2024, 1, 31))
    assert date_range_params({}, today=date(2024, 3, 31)) == (date(2024, 3, 1), date(2024, 3, 31))
    assert date_range_params({'to': '2024-02-10'}, days=10) == (date(2024, 1, 31), date(2024, 2, 10))
    assert date_range_params({'from': '2024-02-01'}, today=date(2024, 2, 5)) == (date(2024, 2, 1), date(2024, 2, 5))
    for bad in ({'from': '01/02/2024'}, {'to': 'abc'}, {'from': '2024-05-02', 'to': '2024-05-01'}):
        try:
            date_range_params(bad)
        except ValueError:
            pass
        else:
            raise AssertionError(bad)
