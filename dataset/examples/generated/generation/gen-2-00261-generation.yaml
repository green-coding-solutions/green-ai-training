    ```python
    IMAGE_CHECK_CONCURRENCY = 20


    async def _image_status(
        client: httpx.AsyncClient, url: str, sem: asyncio.Semaphore
    ) -> int | None:
        async with sem:
            try:
                resp = await client.head(url)
                if resp.status_code == 405:
                    # some CDNs refuse HEAD: open a GET, take the status, close without reading the body
                    async with client.stream("GET", url) as resp:
                        pass
                return resp.status_code
            except (httpx.HTTPError, httpx.InvalidURL):
                return None


    async def find_broken_images(
        client: httpx.AsyncClient, rows: list[ProductRow]
    ) -> dict[str, list[tuple[str, int | None]]]:
        sem = asyncio.Semaphore(IMAGE_CHECK_CONCURRENCY)
        checks = [(row.sku, url) for row in rows for url in row.image_urls]
        statuses = await asyncio.gather(
            *(_image_status(client, url, sem) for _, url in checks)
        )
        broken: dict[str, list[tuple[str, int | None]]] = {}
        for (sku, url), status in zip(checks, statuses):
            if status is None or not 200 <= status < 300:
                broken.setdefault(sku, []).append((url, status))
        return broken
    ```

