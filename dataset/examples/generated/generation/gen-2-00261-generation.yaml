    **Green Notes**
    - **Concurrent async I/O** (reduces E): a full batch is up to about 4,000 HEAD requests. They now run 20 at a time on the client you already have, instead of waiting on each round trip in turn. The worker spends far less time idle. In Green Metrics Tool micro-benchmarks with 10 requests, async `httpx` used about 7% less CPU energy and about 17% less wall time than sync `urllib`. Most of the gain is the waiting time that goes away.

    Behavior notes: images are checked only for rows that pass the price/SKU filter, so the request count stays lower. The semaphore caps open connections so the supplier CDNs don't rate-limit you. Malformed URLs count as broken with status `None`. If a feed repeats a SKU, every row with that SKU is rejected when any of them has a broken image.
