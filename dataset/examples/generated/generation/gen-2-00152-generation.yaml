- role: assistant
  content: |
    Here is `load_batch`. It fetches the whole batch with one query and reads only `id` and the six feature columns:

    ```python
    import numpy as np

    FEATURES = ["amount", "merchant_risk", "txn_count_24h", "avg_amount_30d", "km_from_home", "is_foreign"]
    _FEATURE_COLS = ", ".join(FEATURES)


    def load_batch(conn, txn_ids):
        if not txn_ids:
            return [], np.empty((0, len(FEATURES)), dtype=np.float32)
        placeholders = ", ".join("?" * len(txn_ids))
        rows = conn.execute(
            f"SELECT id, {_FEATURE_COLS} FROM transactions "
            f"WHERE id IN ({placeholders}) ORDER BY id",
            list(txn_ids),
        ).fetchall()
        ids = [r[0] for r in rows]
        X = np.array([r[1:] for r in rows], dtype=np.float32)
        return ids, X
    ```

    - Rows come back sorted by `id`, which matches the order in `score_pending`. `ids` is built from the result, so scores and ids stay aligned even if a row was deleted between the two queries.
    - NULL features become `NaN` in the matrix. If the model can't handle `NaN`, filter or impute those values first.
    - The SQL text is built only from the constant `FEATURES` list. The ids are bound as parameters, so there's no injection risk.

    **Green Notes**
    - **Select only the needed columns** (reduces E): the worker never reads, transfers or decodes `raw_payload`, `device_fingerprint`, `notes` or the other unused columns, and this query runs for every batch it scores. In Green Metrics Tool micro-benchmarks on PostgreSQL with a 52-column table that had large text columns, naming the 10 needed columns instead of using `SELECT *` used between about 5.5× and 7× less CPU energy, depending on the row count. The saving grows with the size of the skipped columns, and a full PSP JSON payload is large.
