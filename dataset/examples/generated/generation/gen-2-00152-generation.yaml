    conn = sqlite3.connect(":memory:")
    conn.execute(
        "CREATE TABLE transactions (id INTEGER PRIMARY KEY, status TEXT, amount REAL, merchant_risk REAL, "
        "txn_count_24h INTEGER, avg_amount_30d REAL, km_from_home REAL, is_foreign INTEGER, "
        "raw_payload TEXT, device_fingerprint TEXT, notes TEXT, fraud_score REAL)"
    )
    conn.executemany(
        "INSERT INTO transactions (id, status, amount, merchant_risk, txn_count_24h, avg_amount_30d, "
        "km_from_home, is_foreign, raw_payload, device_fingerprint, notes) VALUES (?,?,?,?,?,?,?,?,?,?,?)",
        [(i, "pending", 10.0 * i, 0.1 * i, i, 5.0 * i, 2.0 * i, i % 2, "x" * 5000, "fp", "n") for i in range(1, 21)],
    )
    seen = []
    conn.set_trace_callback(seen.append)
    ids, X = load_batch(conn, [7, 3, 15])
    assert ids == [3, 7, 15]
    assert X.dtype == np.float32 and X.shape == (3, 6)
    assert np.allclose(X[0], [30.0, 0.3, 3, 15.0, 6.0, 1])
    assert np.allclose(X[2], [150.0, 1.5, 15, 75.0, 30.0, 1])
    assert seen and all("raw_payload" not in s and "*" not in s for s in seen)
    ids, X = load_batch(conn, [])
    assert ids == [] and X.shape == (0, 6) and X.dtype == np.float32
