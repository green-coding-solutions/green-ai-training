facts:
- F-ANIM
messages:
- role: user
  content: |
    Hi, I build the landing page for our meal planner app. In the hero there is a phone mockup image and I want it float up and down slowly, like it is hovering. Under it a small arrow that bounce, to say "scroll down". The arrow should dissapear when the user start to scroll.

    I tried with javascript but it look jerky:

    ```javascript
    const phone = document.querySelector('.hero-phone');
    let t = 0;
    setInterval(() => {
      t += 0.05;
      phone.style.position = 'relative';
      phone.style.top = Math.sin(t) * 14 + 'px';
    }, 16);
    ```

    Can you write it better? The hero is like this:

    ```html
    <section class="hero">
      <h1>Plan your week in 5 minutes</h1>
      <img class="hero-phone" src="/img/phone-mockup.png" alt="Mealy app on a phone" width="320" height="640">
      <a class="scroll-hint" href="#features">↓</a>
    </section>
    ```
- role: assistant
  content: |
    Let CSS do the motion and keep JavaScript only for hiding the arrow. Delete the `setInterval` code completely.

    ```html
    <section class="hero">
      <h1>Plan your week in 5 minutes</h1>
      <img class="hero-phone" src="/img/phone-mockup.png" alt="Mealy app on a phone" width="320" height="640">
      <a class="scroll-hint" href="#features" aria-label="Scroll to features">↓</a>
    </section>
    ```

    ```css
    .hero-phone {
      display: block;
      margin: 0 auto;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    .scroll-hint {
      display: block;
      width: max-content;
      margin: 1.5rem auto 0;
      font-size: 1.75rem;
      color: #2f7d4a;
      text-decoration: none;
      animation: bounce 1.8s ease-in-out infinite;
      transition: opacity 0.3s ease;
    }

    .scroll-hint.is-gone {
      opacity: 0;
      pointer-events: none;
    }

    .scroll-hint[hidden] {
      display: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-phone,
      .scroll-hint {
        animation: none;
      }
    }
    ```

    ```javascript
    const hint = document.querySelector('.scroll-hint');

    if (hint) {
      const hideHint = () => {
        hint.classList.add('is-gone');
        hint.addEventListener('transitionend', () => {
          hint.hidden = true;
        }, { once: true });
      };

      if (window.scrollY > 0) {
        // Page was reloaded in the middle, the hint makes no sense anymore.
        hint.hidden = true;
      } else {
        window.addEventListener('scroll', hideHint, { once: true, passive: true });
      }
    }
    ```

    The jerky look came from changing `top` from a timer. The timer is not synced with the screen refresh, and every `top` change forces a new layout. `transform` in a keyframe animation avoids both problems.

    **Green Notes**
    - **CSS keyframes instead of JS-driven animation** (reduces E): the browser runs the float and bounce itself, with no JavaScript callback on every frame. In Green Metrics Tool browser benchmarks, a 20-second animation with CSS `@keyframes` used about 10% less CPU energy than the same animation driven by `requestAnimationFrame` with style updates. Visitors often keep a landing page open while they read, so this runs for the whole time the hero is on screen.
    - **One-time scroll listener** (reduces E): `{ once: true }` removes the listener after the first scroll. Setting `hidden` after the fade sets `display: none`, which also stops the bounce animation.
verify:
  static_only: browser DOM and CSS animation, needs a real browser
