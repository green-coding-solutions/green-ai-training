id: gen-1-00331-generation
category: generation
language: html
patterns:
- lazy-load-images
messages:
- role: user
  content: |
    hi, i am making a website for my small yoga studio, its my first time. I want one page with a big picture on top, then a section with our 6 teachers (photo, name, short text) and then a gallery with 9 photos of the studio. The photos are jpg in the images folder. When I open it on my phone the picture on top shows very late and the page feels slow. I dont know what I do wrong. Can you write the html for these parts?
- role: assistant
  content: |
    Most likely the phone downloads all 16 photos at the same time, even though you only see the top one at first. They compete for the connection, so the big picture comes late. The fix is to load only the top picture right away and let the browser fetch the others when the visitor scrolls near them.

    ```html
    <style>
      img { max-width: 100%; height: auto; display: block; }
      .teachers, .gallery { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    </style>

    <header class="hero">
      <!-- Visible at once: do NOT lazy-load this one -->
      <img src="images/hero.jpg" width="1600" height="900"
           fetchpriority="high"
           alt="Students in a sunny yoga room doing a stretch">
      <h1>Lotus Yoga Studio</h1>
    </header>

    <section class="teachers">
      <h2>Our teachers</h2>
      <article>
        <img src="images/anna.jpg" width="400" height="400" loading="lazy" decoding="async"
             alt="Anna, vinyasa teacher">
        <h3>Anna</h3>
        <p>Vinyasa and morning flow.</p>
      </article>
      <article>
        <img src="images/ben.jpg" width="400" height="400" loading="lazy" decoding="async"
             alt="Ben, yin yoga teacher">
        <h3>Ben</h3>
        <p>Yin yoga and breathing.</p>
      </article>
      <!-- repeat the same <article> for the other 4 teachers -->
    </section>

    <section class="gallery">
      <h2>The studio</h2>
      <img src="images/studio-1.jpg" width="1200" height="800" loading="lazy" decoding="async"
           alt="Main practice room with wooden floor">
      <img src="images/studio-2.jpg" width="1200" height="800" loading="lazy" decoding="async"
           alt="Entrance with shoe shelf">
      <img src="images/studio-3.jpg" width="1200" height="800" loading="lazy" decoding="async"
           alt="Corner with mats and blocks">
      <!-- repeat for studio-4 to studio-9 -->
    </section>
    ```

    Change `width` and `height` to the real pixel size of your files. They let the browser reserve the space, so the page does not jump when a photo appears.

    Also check the file sizes in `images/`. Photos straight from a camera or phone are often much larger than the screen needs. Resize them to about the size they are shown at.

    **Green Notes**
    - **Defer offscreen images** (reduces network and client E): `loading="lazy"` makes the browser download the teacher and gallery photos only when they come near the screen. Visitors who never scroll that far never download them, and the top picture gets the connection to itself.
      Pattern: Defer offscreen images
    - *Not applied:* lazy loading on the top picture. It is visible immediately, so lazy loading it would only make it appear later. That is why it has `fetchpriority="high"` instead.
verify:
  static_only: plain HTML and CSS, no runnable code
