  module: true
  test: |-
    import io, os, tempfile, contextlib
    assert owner_for("tests.api.payments.test_refund.TestRefund") == "team-payments"
    assert owner_for("tests.api.test_orders.TestList") == "team-api"
    assert owner_for("tests.web.checkout.test_cart.T") == "team-checkout"
    assert owner_for("tests.apiv2.test_x.T") == "unowned"
    assert owner_for("") == "unowned"

    d = tempfile.mkdtemp()
    os.makedirs(os.path.join(d, "run1"))
    with open(os.path.join(d, "run1", "junit-api.xml"), "w") as f:
        f.write(
            '<testsuite>'
            '<testcase classname="tests.api.test_orders.T" name="a"/>'
            '<testcase classname="tests.api.test_orders.T" name="b"><failure message="x"/></testcase>'
            '<testcase classname="tests.web.test_home.T" name="c"><error message="y"/></testcase>'
            '<testcase classname="misc.T" name="d"/>'
            '</testsuite>'
        )
    buf = io.StringIO()
    with contextlib.redirect_stdout(buf):
        main(d)
    out = buf.getvalue().splitlines()
    assert out[0].split() == ["team", "tests", "failed", "rate"]
    assert out[1].split()[:3] == ["team-api", "2", "1"]
    assert out[2].split()[:3] == ["team-frontend", "1", "1"]
    assert out[3].split()[:3] == ["unowned", "1", "0"]
    assert len(out) == 4
    assert owner_for.cache_info().hits >= 1
