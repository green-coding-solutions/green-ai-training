id: gen-2-00075-generation
category: generation
language: html
patterns:
- remove-unused-css
facts:
- F-UNUSED-CSS
messages:
- role: user
  content: |
    Hi, I'm pretty new to web stuff, sorry if this is a dumb question. We build a Modbus-to-MQTT gateway and I need a settings page on the box's built-in web UI. Installers open it on their phone when they set up a unit. It needs these fields:

    - broker host
    - broker port (default 1883)
    - username and password (optional, some brokers have no auth)
    - topic prefix (no `#` or `+` allowed)
    - poll interval in seconds (1 to 3600)

    The form should POST to `/api/config`. The backend expects the field names `broker_host`, `broker_port`, `username`, `password`, `topic_prefix`, `poll_interval`.

    A colleague told me to copy the stylesheet from our company website into the firmware and link it like this:

    ```html
    <link rel="stylesheet" href="/static/style.css">
    ```

    It works and looks ok. But another colleague said linking the whole website CSS is "bad" for the gateway. I don't really get what's wrong with it, since the page looks fine? That file has the navbar, pricing tables, blog styles, a carousel and so on. Can you write the page for me?
- role: assistant
  content: |
    Nothing is broken. The website stylesheet just ships lots of rules this page never uses: navbar, pricing, blog, carousel. This version keeps only the CSS the form needs, inline, so the gateway serves one file.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Gateway settings – MQTT</title>
      <style>
        body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #222; background: #f4f5f7; }
        main { max-width: 28rem; margin: 0 auto; padding: 1rem; }
        h1 { font-size: 1.3rem; margin: .5rem 0 1rem; }
        fieldset { margin: 0 0 1rem; padding: .5rem 1rem 1rem; border: 1px solid #ccd; border-radius: 6px; background: #fff; }
        legend { padding: 0 .25rem; font-weight: 600; }
        label { display: block; margin-top: .75rem; }
        input { display: block; box-sizing: border-box; width: 100%; margin-top: .25rem; padding: .5rem;
                font: inherit; border: 1px solid #aab; border-radius: 4px; }
        small { color: #556; }
        button { width: 100%; padding: .7rem; font: inherit; color: #fff; background: #1d5fbf; border: 0; border-radius: 4px; }
      </style>
    </head>
    <body>
      <main>
        <h1>MQTT settings</h1>
        <form method="post" action="/api/config">
          <fieldset>
            <legend>Broker</legend>
            <label>Host
              <input name="broker_host" required autocomplete="off" autocapitalize="none"
                     spellcheck="false" placeholder="mqtt.example.local">
            </label>
            <label>Port
              <input name="broker_port" type="number" inputmode="numeric"
                     min="1" max="65535" value="1883" required>
            </label>
          </fieldset>

          <fieldset>
            <legend>Authentication <small>(optional)</small></legend>
            <label>Username
              <input name="username" autocomplete="off" autocapitalize="none" spellcheck="false">
            </label>
            <label>Password
              <input name="password" type="password" autocomplete="new-password">
            </label>
          </fieldset>

          <fieldset>
            <legend>Data</legend>
            <label>Topic prefix
              <input name="topic_prefix" required pattern="[^#+]+" autocapitalize="none"
                     spellcheck="false" placeholder="site1/gateway" title="Must not contain # or +">
            </label>
            <label>Poll interval (seconds)
              <input name="poll_interval" type="number" inputmode="numeric"
                     min="1" max="3600" step="1" value="10" required>
            </label>
          </fieldset>

          <button type="submit">Save</button>
        </form>
      </main>
    </body>
    </html>
    ```

    The browser checks the port range, the poll interval range and the `#`/`+` rule before it submits the form. Your backend still has to validate the same things, because anyone can POST to `/api/config` directly. If the box only serves plain HTTP, the MQTT password goes over the local network in clear text. Use HTTPS if the gateway supports it.

    **Green Notes**
    - **Remove unused CSS** (reduces network): the page carries only the rules it uses, and the browser doesn't fetch a second file from the gateway. To be clear about the size of the effect: in Green Metrics Tool browser benchmarks, 50 cold page loads with a 16 KB stylesheet of mostly unused rules used ~783 J, and the purged and minified 0.75 KB version ~764 J. That is about 2%, which is within measurement noise. So the gain here is fewer bytes over the installer's phone connection and less space in the firmware, not measurable CPU savings on the phone.
    - Your colleague is right, but mostly for maintenance reasons: the gateway page no longer breaks or grows when someone changes the website's stylesheet.
verify:
  static_only: static HTML form page, no Python/JS logic to execute
