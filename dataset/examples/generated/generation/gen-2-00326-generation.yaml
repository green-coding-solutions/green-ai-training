    import math as _m
    s, m = particle_speeds([3.0, 0.0, 1.0], [4.0, 0.0, 2.0], [0.0, 5.0, 2.0])
    assert s == [5.0, 5.0, 3.0]
    assert abs(m - 13.0 / 3.0) < 1e-12
    s, m = particle_speeds([-1.0], [0.0], [0.0])
    assert s == [1.0] and m == 1.0
    s, m = particle_speeds([1.0, 2.0], [2.0, 3.0], [2.0, 6.0])
    assert s == [3.0, 7.0] and m == 5.0
    for args in (([], [], []), ([1.0], [1.0, 2.0], [1.0])):
        try:
            particle_speeds(*args)
        except ValueError:
            pass
        else:
            raise AssertionError("expected ValueError")
