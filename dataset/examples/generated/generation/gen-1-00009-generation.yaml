messages:
- role: user
  content: |
    js spinner while the model is running, for our image classifier demo page
- role: assistant
  content: |
    CSS runs the spinning. JavaScript only switches it on and off.

    ```css
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid #ddd;
      border-top-color: #3b82f6;
      border-radius: 50%;
    }

    .is-running .spinner {
      display: block;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-running .spinner { animation-duration: 3s; }
    }
    ```

    ```html
    <div id="inference-status" aria-busy="false">
      <div class="spinner" role="presentation"></div>
    </div>
    ```

    ```javascript
    function setRunning(running) {
      const el = document.getElementById('inference-status');
      el.classList.toggle('is-running', running);
      el.setAttribute('aria-busy', String(running));
    }

    async function classify(imageBlob) {
      setRunning(true);
      try {
        const res = await fetch('/api/classify', { method: 'POST', body: imageBlob });
        if (!res.ok) throw new Error(`Classify failed: ${res.status}`);
        return await res.json();
      } finally {
        setRunning(false);
      }
    }
    ```

    **Green Notes**
    - **CSS `@keyframes` does the animation, JS only toggles a class** (reduces E): no `requestAnimationFrame` loop runs while the model works. The browser can animate `transform` on its own. In Green Metrics Tool browser benchmarks, a 20-second animation used about 145 J of CPU energy with CSS `@keyframes` and about 161 J with JavaScript `requestAnimationFrame` style updates (about 10% less).
    - **Only `transform` is animated**, so the spinner causes no layout work.
    - **`display: none` when idle** means nothing animates while the page waits for input.
    - `finally` always turns the spinner off, so an error cannot leave it running forever.
verify:
  test: |-
    const el = {
      cls: new Set(),
      attrs: {},
      classList: { toggle(c, f) { if (f) el.cls.add(c); else el.cls.delete(c); } },
      setAttribute(k, v) { el.attrs[k] = v; },
    };
    globalThis.document = { getElementById: () => el };
    let ok = true;
    globalThis.fetch = async () => ({ ok, status: ok ? 200 : 500, json: async () => ({ label: 'cat' }) });
    (async () => {
      const p = classify('x');
      if (!el.cls.has('is-running') || el.attrs['aria-busy'] !== 'true') throw new Error('not running');
      const r = await p;
      if (r.label !== 'cat') throw new Error('result');
      if (el.cls.has('is-running') || el.attrs['aria-busy'] !== 'false') throw new Error('not stopped');
      ok = false;
      let failed = false;
      try { await classify('x'); } catch (e) { failed = true; }
      if (!failed) throw new Error('no error');
      if (el.cls.has('is-running')) throw new Error('stuck after error');
    })();
