messages:
- role: user
  content: |
    dockerfile for django rest api. gunicorn, requirements.txt, manage.py in root, port 8080
- role: assistant
  content: |
    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONDONTWRITEBYTECODE=1 \
        PYTHONUNBUFFERED=1

    WORKDIR /app

    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY . .

    RUN useradd --no-create-home --uid 10001 app
    USER app

    EXPOSE 8080
    CMD ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2", "config.wsgi:application"]
    ```

    Replace `config.wsgi` with your project's WSGI module. Add a `.dockerignore` with `.git`, `__pycache__`, `*.pyc`, `.venv` and `.env`, so they stay out of the build context and the image.

    **Green Notes**
    - **Slim base image** (reduces E, M): `python:3.12-slim` instead of the full `python:3.12`, with no compilers, git or editors. In Green Metrics Tool micro-benchmarks, building a small Flask app image this way used about 7× less energy than a full base image with dev tools. Serving requests cost the same, so the saving comes from every build, pull and stored copy.
    - **Dependency layer before the source:** `requirements.txt` is copied and installed first. Code changes then reuse the cached dependency layer instead of reinstalling everything.
    - **`pip --no-cache-dir`:** the download cache is not kept in the image layer.
    - *Not applied:* build tools. If a package in `requirements.txt` has no prebuilt wheel, add a compiler only for that package. Don't put one in the base by default.
  verify:
    static_only: Dockerfile, needs a Docker daemon and project files
