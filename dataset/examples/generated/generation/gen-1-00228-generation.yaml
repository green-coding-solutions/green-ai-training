id: gen-1-00228-generation
category: generation
language: javascript
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    Hi, i need one function for our shop admin page. It get the order status like 'pending', 'paid', 'shipped', 'delivered', 'cancelled' or 'refunded' and return the label and the color for the badge. The page show 500 orders in a table and every row call this function. Please write in JavaScript, thx!
- role: assistant
  content: |
    ```javascript
    const UNKNOWN_STATUS = Object.freeze({ label: 'Unknown', color: 'gray' });

    const STATUS_BADGES = new Map([
      ['pending',   Object.freeze({ label: 'Pending',   color: 'yellow' })],
      ['paid',      Object.freeze({ label: 'Paid',      color: 'blue' })],
      ['shipped',   Object.freeze({ label: 'Shipped',   color: 'purple' })],
      ['delivered', Object.freeze({ label: 'Delivered', color: 'green' })],
      ['cancelled', Object.freeze({ label: 'Cancelled', color: 'red' })],
      ['refunded',  Object.freeze({ label: 'Refunded',  color: 'orange' })],
    ]);

    function statusBadge(status) {
      return STATUS_BADGES.get(status) ?? UNKNOWN_STATUS;
    }
    ```

    Use it in the row renderer like this: `const { label, color } = statusBadge(order.status);`

    **Green Notes**
    - **One table lookup instead of a condition chain** (reduces E): each row does a single `Map.get` and no `if`/`else if` or `switch` is checked case by case. In Green Metrics Tool micro-benchmarks (Python), simple equality-style dispatch used about 16% less energy than complex conditions. The gain here is small for 500 rows, but the code is also shorter and easier to extend.
    - The table is built once when the module loads, and the returned objects are shared and frozen. No new object is created per row.
    - `Map` is used instead of a plain object, so a status like `'constructor'` or `'toString'` cannot match an inherited property by mistake.
verify:
  test: |-
    function eq(a, b) { if (a !== b) throw new Error('assert failed: ' + a + ' !== ' + b); }
    eq(statusBadge('pending').label, 'Pending');
    eq(statusBadge('pending').color, 'yellow');
    eq(statusBadge('paid').color, 'blue');
    eq(statusBadge('shipped').label, 'Shipped');
    eq(statusBadge('delivered').color, 'green');
    eq(statusBadge('cancelled').color, 'red');
    eq(statusBadge('refunded').label, 'Refunded');
    eq(statusBadge('nope').label, 'Unknown');
    eq(statusBadge('toString').color, 'gray');
    eq(statusBadge(undefined).label, 'Unknown');
