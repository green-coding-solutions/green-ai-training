    I filled in the empty rules for a run overview page: a table of runs with right-aligned numbers, colored status cells and a log block.

    ```css
    /* etl-dash.css - run overview for nightly ETL (internal) */
    :root {
      --ok: #1a7f37;
      --warn: #9a6700;
      --fail: #cf222e;
      --bg: #ffffff;
      --fg: #1f2328;
      --line: #d0d7de;

      --font-text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    body {
      margin: 0 auto;
      padding: 1.5rem;
      max-width: 72rem;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-text);
      font-size: 1rem;
      line-height: 1.5;
    }

    h1, h2 {
      line-height: 1.25;
      font-weight: 600;
    }

    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    h2 { font-size: 1.125rem; margin: 2rem 0 0.5rem; }

    table.runs {
      width: 100%;
      border-collapse: collapse;
    }

    table.runs th,
    table.runs td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    table.runs th {
      font-weight: 600;
      white-space: nowrap;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .status-ok,
    .status-warn,
    .status-fail {
      font-weight: 600;
    }

    .status-ok   { color: var(--ok); }
    .status-warn { color: var(--warn); }
    .status-fail { color: var(--fail); }

    pre.log {
      margin: 0.5rem 0 0;
      padding: 0.75rem 1rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.4;
    }
    ```

    Use `<td class="num">` for row counts and durations, and put the status class on the status cell. The status text itself ("OK", "FAILED") should stay in the HTML, so color is not the only signal.

    **Green Notes**
    - **System font stack** (reduces E, network): no font files to download or decode, and the page renders in the local font right away. In Green Metrics Tool micro-benchmarks of cold page loads, the system font stack used about 26% less client CPU energy than six local TTF files (~4 MB) and about 16% less than two Latin-subset WOFF2 files.
    - **`tabular-nums`** keeps digits aligned in the number columns, so you don't need a separate monospace web font for the table.
    - *Not applied:* custom web fonts — an internal dashboard gains nothing from them. If you later need a brand font, ship a few WOFF2 subsets, not full TTF sets.
