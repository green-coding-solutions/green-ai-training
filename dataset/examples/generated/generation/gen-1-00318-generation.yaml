id: gen-1-00318-generation
category: generation
language: javascript
patterns:
- minify-assets
- context-tradeoff
messages:
- role: user
  content: |
    We have a small gateway box (ARM, 16 MB flash for the app) that collects readings from LoRa sensors. A tiny Node http server on it serves a config and live-view UI to technicians on tablets over the site Wi-Fi, which is slow.

    I need a `build.mjs` for the UI. Requirements:
    - entry is `src/ui/main.js`, it imports other modules and a `style.css`
    - output goes to `dist/`, wiped on every build
    - `src/ui/index.html` is a template with `{{JS}}` and `{{CSS}}` placeholders, fill them with the real output file names
    - in dev I want readable output I can debug in the browser
    - tablets run Chrome 90+ and Safari 14+
    - we use esbuild already
- role: assistant
  content: |
    ```javascript
    import { build } from 'esbuild';
    import { mkdir, readFile, rm, writeFile } from 'node:fs/promises';
    import path from 'node:path';

    const isProd = process.env.NODE_ENV === 'production';
    const outdir = 'dist';

    await rm(outdir, { recursive: true, force: true });
    await mkdir(outdir, { recursive: true });

    const result = await build({
      entryPoints: ['src/ui/main.js'],
      bundle: true,                       // one JS file and one CSS file
      outdir,
      entryNames: isProd ? '[name]-[hash]' : '[name]',
      format: 'esm',
      target: ['chrome90', 'safari14'],
      minify: isProd,                     // JS and CSS
      sourcemap: !isProd,                 // no .map files in production
      legalComments: 'none',
      metafile: true,
      logLevel: 'info',
    });

    const outputs = Object.keys(result.metafile.outputs).map((f) => path.basename(f));
    const jsFile = outputs.find((f) => f.endsWith('.js'));
    const cssFile = outputs.find((f) => f.endsWith('.css'));
    if (!jsFile || !cssFile) {
      throw new Error(`Expected one JS and one CSS output, got: ${outputs.join(', ')}`);
    }

    const template = await readFile('src/ui/index.html', 'utf8');
    const html = template
      .replaceAll('{{JS}}', jsFile)
      .replaceAll('{{CSS}}', cssFile);

    await writeFile(path.join(outdir, 'index.html'), html);
    console.log(`Built ${isProd ? 'production' : 'development'} UI: ${jsFile}, ${cssFile}`);
    ```

    Run `NODE_ENV=production node build.mjs` for the release build and `node build.mjs` for dev.

    **Green Notes**
    - **Minify JS and CSS in production only** (reduces network and storage): every tablet load over the slow Wi-Fi transfers fewer bytes, and the bundle takes less of the 16 MB flash. Dev output stays readable.
    - **Bundling** (reduces network): the browser makes one JS and one CSS request instead of one per module.
    - **No source maps in production** (reduces network and storage): they would only add files on flash that the browser never needs unless devtools are open. Dev builds keep them for debugging.
    - *Not applied:* HTML minification and stripping `console` calls. The HTML is a single small file, and removing logging would change behavior on a device you may need to debug in the field.
verify:
  static_only: needs the esbuild package, a src/ui tree and a filesystem build
