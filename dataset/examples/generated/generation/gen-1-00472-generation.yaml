id: gen-1-00472-generation
category: generation
language: yaml
patterns:
- minimize-environments
messages:
- role: user
  content: |
    Hello, we are small team who make online shop for shoes (about 6 devs). Now we have one staging only and the testers always wait for each other, its anoying. I want that every pull request get own preview, so tester can just click the link. We use ArgoCD and the helm chart is in charts/shop in repo shoebox-eu/shop on github. Domain for preview can be *.preview.shoebox.example. Can you write the ApplicationSet for this pls? Payment is Stripe, we have test keys.
- role: assistant
  content: |
    This `ApplicationSet` uses the pull request generator. It makes one small preview per labeled PR and removes it when the PR closes.

    ```yaml
    apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata:
      name: shop-previews
      namespace: argocd
    spec:
      goTemplate: true
      goTemplateOptions: ["missingkey=error"]
      generators:
        - pullRequest:
            github:
              owner: shoebox-eu
              repo: shop
              tokenRef:
                secretName: github-token
                key: token
              # only PRs that a dev or tester labels "preview" get an environment
              labels:
                - preview
            requeueAfterSeconds: 180
      template:
        metadata:
          name: 'shop-pr-{{.number}}'
          finalizers:
            # deletes the namespace content when the Application goes away
            - resources-finalizer.argocd.argoproj.io
        spec:
          project: previews
          source:
            repoURL: https://github.com/shoebox-eu/shop.git
            targetRevision: '{{.head_sha}}'
            path: charts/shop
            helm:
              valuesObject:
                replicaCount: 1
                autoscaling:
                  enabled: false
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    memory: 256Mi
                ingress:
                  host: 'pr-{{.number}}.preview.shoebox.example'
                stripe:
                  existingSecret: stripe-test-keys   # test keys only, never live keys
          destination:
            server: https://kubernetes.default.svc
            namespace: 'shop-pr-{{.number}}'
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - CreateNamespace=true
    ```

    The value names under `valuesObject` (`replicaCount`, `autoscaling`, `ingress.host`, `stripe.existingSecret`) are my guess. Change them to match your chart's `values.yaml`. You also need an Argo CD project called `previews`, and the `stripe-test-keys` secret must exist in the preview namespace (or be copied there).

    **Green Notes**
    - **Environments only while needed** (reduces E and M): a preview exists only for a PR with the `preview` label. When the PR is merged, closed or unlabeled, the generator stops matching. Argo CD then removes the Application, and the finalizer cleans up its resources. Nothing is left running after the review.
      Pattern: Minimize deployed environments
    - **Small previews** (reduces M): one replica, no autoscaler and small requests. A preview serves a few testers, so it does not need production sizing.
    - **Label as opt-in:** drafts and docs-only PRs do not get an environment unless somebody asks for one.
    - *Not applied:* a nightly scale-down of previews. PRs are short-lived, so closing the PR is the better cleanup. If some PRs stay open for weeks, add a rule to remove the label after a few days.
verify:
  static_only: Argo CD ApplicationSet manifest, needs a Kubernetes cluster with Argo CD and GitHub access
