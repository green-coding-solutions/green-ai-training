    ```css
    /* classifier-dashboard.css
       internal page: model latency + prediction log for the ONNX inference service
       design notes: calm, readable, numbers must line up in columns */

    :root {
      --bg: #f6f7f9;
      --fg: #1b1f24;
      --muted: #5b6570;
      --accent: #2457d6;
      --warn: #b45309;
      --border: #d8dce2;

      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 1rem;
      line-height: 1.5;
    }

    main { max-width: 72rem; margin: 0 auto; padding: 1.5rem; }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }

    table.predictions { width: 100%; border-collapse: collapse; }
    table.predictions th, table.predictions td {
      padding: .4rem .6rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    h1, h2, h3 {
      font-weight: 600;
      line-height: 1.25;
      margin: 0 0 .5rem;
    }
    h1 { font-size: 1.75rem; }
    h2 { font-size: 1.25rem; }
    h3 { font-size: 1.05rem; color: var(--muted); }

    .metric {
      font-size: 2.5rem;
      font-weight: 600;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .metric small {
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
    }

    table.predictions th { font-weight: 600; color: var(--muted); }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    table.predictions th.num { text-align: right; }

    code, pre {
      font-family: var(--font-mono);
      font-size: .9em;
    }
    pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .6rem .8rem;
      overflow-x: auto;
    }
    ```

    **Green Notes**
    - **System font stacks** (reduces E, network): the page loads no font files. In Green Metrics Tool micro-benchmarks of cold page loads, the system font stack used about 26% less client energy than six local TTF files and about 16% less than two Latin-subset WOFF2 files.
    - **`tabular-nums` instead of a monospace web font** (reduces E): the numbers line up in the `.metric` and `.num` cells with the normal text font, so no extra font is needed. The mono stack is only used for request ids in `code` and `pre`.
    - *Not applied:* custom fonts. If the design later needs a brand font, use one or two WOFF2 Latin subsets with `font-display: swap`, not full TTF sets.
