    **Green Notes**
    - **Modern image formats** (reduces network): the photos use AVIF with the JPG as fallback in `<picture>`. Browsers that support AVIF download the smaller file. The saving comes from fewer transferred bytes, not from cheaper decoding. In Green Metrics Tool browser benchmarks (50 page loads), AVIF cost about 19% more client CPU energy to decode than JPG (~159 J vs ~134 J).
    - **Encode once** (reduces E): create the `.avif` files at build or upload time, never on request. In the same benchmarks, AVIF encoding cost about 7× JPG encoding.
    - **SVG logos stay SVG** (reduces network): small vector logos beat any raster format, so they got no `<picture>`.
    - *Not applied:* PNG or GIF for the photos. For photographic content they were the most expensive formats to encode and render in those measurements.
