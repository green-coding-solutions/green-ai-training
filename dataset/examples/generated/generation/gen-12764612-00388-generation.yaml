messages:
- role: user
  content: |
    Hello, I need javascript for my small shop. When customer click "Add to cart", the little number on the cart icon in the header must do a jump (bump), so he see that it changed. I try with setInterval and change the margin-top every 16 ms but it is not smooth and sometimes it stay in wrong place. The number is in `<span id="cart-count">`. Please write the function updateCartCount(n), I do not have it yet. Thank you!
- role: assistant
  content: |-
    JS only sets the number and starts the animation. CSS does the movement.

    ```javascript
    const cartCount = document.getElementById('cart-count');

    function updateCartCount(n) {
      cartCount.textContent = n;
      // restart the animation if the customer clicks fast
      cartCount.classList.remove('bump');
      void cartCount.offsetWidth;
      cartCount.classList.add('bump');
    }

    cartCount.addEventListener('animationend', () => {
      cartCount.classList.remove('bump');
    });
    ```

    ```css
    #cart-count {
      display: inline-block; /* needed so transform works on a span */
    }

    #cart-count.bump {
      animation: bump 300ms ease-out;
    }

    @keyframes bump {
      0%   { transform: translateY(0) scale(1); }
      40%  { transform: translateY(-6px) scale(1.25); }
      100% { transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #cart-count.bump { animation: none; }
    }
    ```

    Use it like this: `updateCartCount(cart.items.length)` after the add-to-cart request succeeds.

    **Green Notes**
    - **CSS keyframes instead of a JS-driven animation** (reduces E): no `setInterval` or per-frame style writes, so the page runs no JavaScript while the number moves. In Green Metrics Tool browser benchmarks, a 20-second animation used about 10% less CPU energy with CSS `@keyframes` than with `requestAnimationFrame` style updates (~145 J vs ~161 J). For one 300 ms bump the absolute saving is tiny. The real gain is that a timer loop never runs, and it also fixes the "wrong place" bug.
    - **`transform` instead of `margin-top`:** moving with `transform` does not push the other header elements around, and the animation ends at the exact start position.
    - **`prefers-reduced-motion`:** people who turned off motion in their system do not get the bump. They still see the new number.
