id: gen-1-00197-generation
category: generation
language: javascript
patterns:
- modern-image-formats
facts:
- F-IMGENC
- F-IMGRENDER
messages:
- role: user
  content: |
    hi, i have small node api for our shop (no express, just http module). product photos are uploaded as jpg and my endpoint send the same jpg to every user. a friend said webp is better but some browsers is old and i am afraid they show broken image. i dont know what is wrong with my way or what to do. can you write the endpoint GET /api/products/:id/image so it works for all browsers? files are in the folder ./images like 42.jpg
- role: assistant
  content: |
    Nothing is broken in your way. The jpg works everywhere, but it sends more bytes than needed to browsers that could take AVIF or WebP. The browser tells you what it supports in the `Accept` header, so you can pick per request and fall back to jpg for the rest.

    Create `42.avif` and `42.webp` next to `42.jpg` once, when the photo is uploaded. Then the endpoint only picks a file and streams it:

    ```js
    const http = require('node:http');
    const fs = require('node:fs');
    const path = require('node:path');

    const IMAGE_DIR = path.join(__dirname, 'images');
    const TYPES = {
      avif: 'image/avif',
      webp: 'image/webp',
      jpg: 'image/jpeg',
    };

    // Best format the browser accepts. Old browsers get jpg.
    function pickFormat(accept = '') {
      const wanted = accept.toLowerCase();
      if (wanted.includes(TYPES.avif)) return 'avif';
      if (wanted.includes(TYPES.webp)) return 'webp';
      return 'jpg';
    }

    function handler(req, res) {
      const match = /^\/api\/products\/(\d+)\/image$/.exec(req.url.split('?')[0]);
      if (!match) {
        res.writeHead(404);
        return res.end();
      }

      let ext = pickFormat(req.headers.accept);
      let file = path.join(IMAGE_DIR, `${match[1]}.${ext}`);
      if (!fs.existsSync(file)) {
        ext = 'jpg'; // variant not created yet
        file = path.join(IMAGE_DIR, `${match[1]}.jpg`);
      }

      const stream = fs.createReadStream(file);
      stream.on('open', () => {
        res.writeHead(200, {
          'Content-Type': TYPES[ext],
          'Vary': 'Accept',
          'Cache-Control': 'public, max-age=86400',
        });
        stream.pipe(res);
      });
      stream.on('error', () => {
        res.writeHead(404);
        res.end();
      });
    }

    module.exports = { pickFormat, handler };

    if (require.main === module) {
      http.createServer(handler).listen(3000);
    }
    ```

    To create the variants at upload time, you can use the `sharp` package. For example, `sharp(buf).webp({ quality: 80 }).toFile('42.webp')` and the same with `.avif(...)`.

    **Green Notes**
    - **Modern image formats** (reduces network and E): AVIF and WebP files are usually much smaller than the same photo as jpg, so fewer bytes travel on every image request. https://patterns.greensoftware.foundation/development/media-and-code-efficiency/serve-images-in-modern-formats
    - **Encode once, not per request** (reduces E): encoding is the expensive part. In Green Metrics Tool micro-benchmarks, encoding 50 images as AVIF used about 7× the CPU energy of JPG ([measurements](https://metrics.green-coding.io/stats.html?id=81a932bc-04da-443b-93cf-d4d8468de247)). Do it at upload time and only read files when serving.
    - **Decoding costs a bit more on the phone:** in the same benchmarks, 50 page loads with AVIF used about 19% more browser CPU energy than JPG ([measurements](https://metrics.green-coding.io/stats.html?id=b31ca361-1745-4fac-8e6b-a97ec99bf476)). The saving comes from the smaller transfer, so it pays off most for large photos. Tiny icons are better as SVG.
    - **`Vary: Accept`** makes caches and CDNs store one copy per format, so a browser never gets a format it can't show.
    - *Not applied:* converting on the fly per request. It would repeat the costly encoding for every hit.
verify:
  module: true
  test: |-
    const assert = require('node:assert');
    assert.strictEqual(pickFormat('image/avif,image/webp,image/apng,*/*;q=0.8'), 'avif');
    assert.strictEqual(pickFormat('image/webp,*/*'), 'webp');
    assert.strictEqual(pickFormat('image/png,image/*;q=0.8'), 'jpg');
    assert.strictEqual(pickFormat(undefined), 'jpg');
    assert.strictEqual(pickFormat('IMAGE/WEBP'), 'webp');
