messages:
- role: user
  content: |
    Need a TS function for our assembly QC tool: `mountSequenceViewer(host: HTMLElement, seq: string)`. `seq` is one contig, ACGTN only, up to ~5M bases. 60 bases per row, position gutter on the left, each base colored by letter. Plain DOM, no framework. Code only please, I'll wire it in myself.
- role: assistant
  content: |
    ```typescript
    const BASES_PER_ROW = 60;
    const ROW_HEIGHT = 20; // px
    const OVERSCAN = 10;   // extra rows above and below the viewport

    const ESC: Record<string, string> = { "&": "&amp;", "<": "&lt;", ">": "&gt;" };

    function rowHtml(seq: string, row: number): string {
      const start = row * BASES_PER_ROW;
      const slice = seq.slice(start, start + BASES_PER_ROW);
      let cells = "";
      for (const ch of slice) {
        const cls = "ACGT".includes(ch) ? ch.toLowerCase() : "n";
        cells += `<span class="${cls}">${ESC[ch] ?? ch}</span>`;
      }
      return `<div style="height:${ROW_HEIGHT}px"><span class="pos">${start + 1}</span>${cells}</div>`;
    }

    export function mountSequenceViewer(host: HTMLElement, seq: string): () => void {
      const rowCount = Math.ceil(seq.length / BASES_PER_ROW);

      host.style.overflowY = "auto";
      host.style.position = "relative";

      const spacer = document.createElement("div");
      spacer.style.height = `${rowCount * ROW_HEIGHT}px`;

      const rows = document.createElement("div");
      rows.style.position = "absolute";
      rows.style.left = "0";
      rows.style.right = "0";
      rows.style.top = "0";
      rows.style.font = `13px/${ROW_HEIGHT}px monospace`;
      rows.style.whiteSpace = "pre";

      host.replaceChildren(spacer, rows);

      let first = -1;
      let last = -1;
      let queued = false;

      function render(): void {
        queued = false;
        const top = host.scrollTop;
        const from = Math.max(0, Math.floor(top / ROW_HEIGHT) - OVERSCAN);
        const to = Math.min(rowCount, Math.ceil((top + host.clientHeight) / ROW_HEIGHT) + OVERSCAN);
        if (from === first && to === last) return;
        first = from;
        last = to;

        const parts: string[] = [];
        for (let r = from; r < to; r++) parts.push(rowHtml(seq, r));
        rows.style.transform = `translateY(${from * ROW_HEIGHT}px)`;
        rows.innerHTML = parts.join("");
      }

      function onScroll(): void {
        if (queued) return;
        queued = true;
        requestAnimationFrame(render);
      }

      host.addEventListener("scroll", onScroll, { passive: true });
      const ro = new ResizeObserver(onScroll);
      ro.observe(host);
      render();

      return () => {
        host.removeEventListener("scroll", onScroll);
        ro.disconnect();
        host.replaceChildren();
      };
    }
    ```

    ```css
    .pos { display: inline-block; width: 9ch; color: #888; }
    .a { color: #2e7d32; } .c { color: #1565c0; }
    .g { color: #ef6c00; } .t { color: #c62828; } .n { color: #999; }
    ```

    **Green Notes**
    - **Windowed rendering** (reduces E): the DOM holds only the visible rows plus 10 above and below, so about a few dozen rows of 60 spans each. A full render of 5M bases would create 5M span elements, which means a huge style and layout pass and a lot of memory.
    - **Scroll work is throttled:** at most one render per animation frame, and nothing is rebuilt while the visible row range is unchanged.
    - **Trade-off:** rows have a fixed height, and the browser's find-in-page only sees rendered rows. If users need to search the sequence, add your own search box that scrolls to a position.
    - *Not applied:* for sequences of a few thousand bases a plain render is fine, so you could skip the windowing there.
verify:
  static_only: TypeScript code that needs a browser DOM (HTMLElement, ResizeObserver, requestAnimationFrame)
