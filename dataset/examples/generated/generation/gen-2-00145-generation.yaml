messages:
- role: user
  content: |
    node script to minify widget/buy-button.js into dist/ for the cdn, with source map pls
- role: assistant
  content: |
    This uses `terser` (`npm i -D terser`). Run it with `node scripts/minify-widget.mjs`.

    ```javascript
    // scripts/minify-widget.mjs
    import { readFile, writeFile, mkdir } from 'node:fs/promises';
    import { minify } from 'terser';

    const SRC = 'widget/buy-button.js';
    const OUT_DIR = 'dist';
    const OUT_NAME = 'buy-button.min.js';

    const code = await readFile(SRC, 'utf8');

    const result = await minify({ 'buy-button.js': code }, {
      ecma: 2018,
      compress: { drop_debugger: true },
      mangle: true,
      format: { comments: 'some' }, // keeps /*! ... */ and @license comments
      sourceMap: {
        filename: OUT_NAME,
        url: `${OUT_NAME}.map`,
        includeSources: true,
      },
    });

    await mkdir(OUT_DIR, { recursive: true });
    await writeFile(`${OUT_DIR}/${OUT_NAME}`, result.code);
    await writeFile(`${OUT_DIR}/${OUT_NAME}.map`, result.map);

    console.log(
      `${SRC}: ${Buffer.byteLength(code)} B -> ${Buffer.byteLength(result.code)} B`
    );
    ```

    **Green Notes**
    - **Minify web assets** (reduces network): every page that embeds the widget downloads fewer bytes. Don't expect a client CPU saving. In Green Metrics Tool browser benchmarks of a small booking page, a minified build used ~822 J and the unminified sources ~837 J over 50 cold page loads. That is about 2% less, which is within measurement noise.
    - The source map goes in a separate file. Browsers only fetch it when devtools are open, so visitors don't download it.

    *Not applied:* dropping `console` calls. That would remove error logs that partner shops may rely on for debugging.
verify:
  static_only: needs the terser npm package and a widget/buy-button.js file
