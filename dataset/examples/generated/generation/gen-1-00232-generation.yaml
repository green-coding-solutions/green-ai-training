messages:
- role: user
  content: |
    I need a static HTML page for the data-quality report of our nightly ETL run. A Python step already writes the PNGs into `charts/`, so I only need the page layout. Requirements:

    - Title with run id `2026-10-24-nightly` and a status line ("3 warnings, 0 failures")
    - One big chart on top: `charts/row_counts.png` (1200x500), rows loaded per source table
    - Then a short summary table with 3 rows: table name, rows loaded, null rate, status
    - Then a grid of per-table profile charts, one image per table, 12 tables: orders, order_items, customers, payments, refunds, shipments, carriers, products, categories, warehouses, stock_moves, price_history. File names are `charts/profile_<table>.png`, 600x360 each.
    - Plain CSS in the page, no framework. 3 columns on desktop, 1 on phone.
    - Data engineers open this from the Slack link. Mostly they look at the top chart and the summary table, and only scroll down when a status is not OK.

    Please write the whole file.
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Data quality report 2026-10-24-nightly</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1280px; padding: 1rem; }
        .status { color: #8a5a00; font-weight: 600; }
        img { max-width: 100%; height: auto; display: block; }
        table { border-collapse: collapse; width: 100%; margin: 1.5rem 0; }
        th, td { border-bottom: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .grid figure { margin: 0; }
        .grid figcaption { font-size: .9rem; margin-top: .25rem; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
      </style>
    </head>
    <body>
      <h1>Data quality report: 2026-10-24-nightly</h1>
      <p class="status">3 warnings, 0 failures</p>

      <img src="charts/row_counts.png" width="1200" height="500"
           alt="Rows loaded per source table in this run">

      <h2>Summary</h2>
      <table>
        <thead>
          <tr><th>Table</th><th>Rows loaded</th><th>Null rate</th><th>Status</th></tr>
        </thead>
        <tbody>
          <tr><td>orders</td><td>0</td><td>0</td><td>OK</td></tr>
          <tr><td>payments</td><td>0</td><td>0</td><td>Warning</td></tr>
          <tr><td>stock_moves</td><td>0</td><td>0</td><td>Warning</td></tr>
        </tbody>
      </table>

      <h2>Table profiles</h2>
      <div class="grid">
        <figure>
          <img src="charts/profile_orders.png" width="600" height="360" loading="lazy" alt="Profile of orders">
          <figcaption>orders</figcaption>
        </figure>
        <figure>
          <img src="charts/profile_order_items.png" width="600" height="360" loading="lazy" alt="Profile of order_items">
          <figcaption>order_items</figcaption>
        </figure>
        <figure>
          <img src="charts/profile_customers.png" width="600" height="360" loading="lazy" alt="Profile of customers">
          <figcaption>customers</figcaption>
        </figure>
