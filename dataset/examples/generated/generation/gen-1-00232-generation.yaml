id: gen-1-00232-generation
category: generation
language: javascript
patterns:
- minify-assets
messages:
- role: user
  content: |
    hello, i make small web page for our lab where people can look at the spectrum data from our measurments. it is plain javascript, files are src/main.js, src/fft-worker.js and src/styles.css. main.js import d3-scale and d3-axis and some own modules in src/lib. now i just copy the files to the server by hand and its a little slow to load, specialy from the university wifi. can you write me a build script with esbuild, so i can run `node build.mjs` for production and also for developing? thanks!
- role: assistant
  content: |
    ```javascript
    // build.mjs
    import { build } from "esbuild";

    const prod = process.argv.includes("--prod");

    await build({
      entryPoints: [
        "src/main.js",
        "src/fft-worker.js",
        "src/styles.css",
      ],
      bundle: true,
      outdir: "dist",
      format: "esm",
      target: ["es2020"],
      minify: prod,
      sourcemap: prod ? false : "inline",
      legalComments: prod ? "none" : "eof",
      logLevel: "info",
    });
    ```

    ```json
    {
      "scripts": {
        "build": "node build.mjs",
        "build:prod": "node build.mjs --prod"
      }
    }
    ```

    ```html
    <link rel="stylesheet" href="/dist/styles.css">
    <script type="module" src="/dist/main.js"></script>
    ```

    Load the worker with `new Worker("/dist/fft-worker.js", { type: "module" })`. Upload only the `dist/` folder. Do not upload `src/`.

    **Green Notes**
    - **Minify in production** (reduces network): JS and CSS lose whitespace, comments and long names, so every visitor downloads fewer bytes. `bundle: true` also joins your own modules and the d3 parts into one file per entry.
      https://patterns.greensoftware.foundation/development/web-performance/minify-web-assets
    - **No source maps in production** (reduces network): `sourcemap` is off for `--prod`, so no `.map` files are built or served. In dev you get them inline, so debugging stays easy.
    - Import only the d3 modules you use (`d3-scale`, `d3-axis`), as you do now. Bundling then leaves out the rest of d3.
    - Minifying alone does not compress. Make sure your server also sends gzip or brotli for `.js` and `.css`.
verify:
  static_only: needs the esbuild package and a project folder, not stdlib
