    ```

    The summary rows are placeholders. Fill them from your run results.

    **Green Notes**
    - **Lazy-load the 12 profile charts** (reduces network and client E): they sit below the fold, and your readers often stop after the top chart and the table. In Green Metrics Tool micro-benchmarks, an article with 15 photos used about 12% less CPU energy on page loads without scrolling. When visitors scrolled to the end, there was no difference. Your usage pattern is the case where it pays.
    - **Top chart stays eager:** `row_counts.png` is the first thing people see, so it has no `loading="lazy"`. Lazy-loading an image above the fold only delays it.
    - `width` and `height` are set on every image, so the browser reserves the space and the layout doesn't jump when a lazy chart arrives.
verify:
  static_only: Static HTML page, no executable code
