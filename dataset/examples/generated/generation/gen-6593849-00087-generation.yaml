    assert status_text(0) == "ok"
    assert [status_text(c) for c in (1, 2, 3)] == ["warmup"] * 3
    assert status_text(4) == "drift"
    assert status_text(7) == "saturated"
    assert status_text(8) == "low signal"
    assert status_text(9) == "vacuum fault"
    for c in (5, 6, 10, 17, 42, -1, 100):
