id: gen-2-00128-generation
category: generation
language: css
patterns:
- system-fonts-and-deps
facts:
- F-FONTS
messages:
- role: user
  content: |
    Hi, I write the C firmware for our IoT gateway (GW-200). It also has a small web page for setup, and now I have to make it look ok. I am not a web person, so please be patient with me.

    The tablets on the shop floor connect to the gateway wifi and open this page. Opening it is really slow, mostly the first time on a tablet. I don't know if my HTML is wrong or something else is the problem.

    A colleague made `fonts.css` with `@font-face` for Roboto and Roboto Mono. He used all the TTF files from the Google Fonts zip (regular, light, medium, bold, italic...). The fonts folder is about 3 MB and it sits in the firmware image next to the page.

    This is the page:

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>GW-200 Gateway</title>
      <link rel="stylesheet" href="/static/fonts.css">
      <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
      <header class="topbar">
        <h1>GW-200</h1>
        <span class="status status--ok">Online</span>
      </header>
      <main>
        <section class="card">
          <h2>Device</h2>
          <dl class="info">
            <dt>Serial</dt><dd class="mono">GW200-0042-7781</dd>
            <dt>IP address</dt><dd class="mono">192.168.10.24</dd>
            <dt>Uptime</dt><dd>3 d 4 h</dd>
          </dl>
        </section>
        <section class="card">
          <h2>Sensors</h2>
          <table class="sensors">
            <thead><tr><th>ID</th><th>Type</th><th>Last value</th><th>Seen</th></tr></thead>
            <tbody>
              <tr><td class="mono">0x1A</td><td>Temperature</td><td>21.4 °C</td><td>2 s ago</td></tr>
            </tbody>
          </table>
        </section>
        <section class="card">
          <h2>MQTT</h2>
          <form method="post" action="/mqtt">
            <label>Broker <input name="host" value="mqtt.local"></label>
            <label>Port <input name="port" type="number" value="1883"></label>
            <button type="submit">Save</button>
          </form>
        </section>
      </main>
    </body>
    </html>
    ```

    Can you write `style.css` for this? Clean and simple, like a small dashboard. Status can also be offline or warning later.
- role: assistant
  content: |
    Your HTML is fine. The slow first load is most likely the fonts. On every load without a cache, the tablet has to download several MB of TTF files from the gateway's small web server before the text shows correctly. This stylesheet uses fonts the tablets already have, so you can delete `fonts.css`, its `<link>` line, and the font folder.

    ```css
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #d9dee3;
      --accent: #1d5fbf;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body { margin: 0; }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--text);
      color: #fff;
    }
    .topbar h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }

    /* Status badge */
    .status {
      padding: 0.15rem 0.7rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #e5e7eb;
      color: var(--text);
    }
    .status--ok      { background: #dcf5e3; color: #1f7a3d; }
    .status--warn    { background: #fdf0d5; color: #8a4f00; }
    .status--offline { background: #fde2e1; color: #b42318; }

    /* Layout */
    main {
      display: grid;
      gap: 1rem;
      max-width: 60rem;
      margin: 0 auto;
      padding: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      overflow-x: auto; /* wide tables scroll on small tablets */
    }
    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mono { font-family: var(--mono); font-size: 0.95em; }

    /* Device info */
    .info {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.4rem 1.5rem;
      margin: 0;
    }
    .info dt { color: var(--muted); }
    .info dd { margin: 0; }

    /* Sensor table */
    .sensors { width: 100%; border-collapse: collapse; }
    .sensors th,
    .sensors td {
      padding: 0.5rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .sensors th { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .sensors tbody tr:last-child td { border-bottom: 0; }

    /* MQTT form */
    form { display: grid; gap: 0.75rem; max-width: 24rem; }
    label { display: grid; gap: 0.25rem; font-size: 0.9rem; color: var(--muted); }
    input,
    button { font: inherit; } /* form controls don't inherit the font by default */
    input {
      padding: 0.5rem 0.6rem;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    button {
      justify-self: start;
      padding: 0.5rem 1.25rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #174d9c; }
    ```

    **Green Notes**
    - **System font stack** (reduces E and network): the tablets use fonts they already have, so nothing has to come from the gateway before the text renders. In Green Metrics Tool measurements of 30 cold page loads, the system font stack used about 26% less CPU energy than six local TTF font files (~4 MB). On Android tablets `system-ui` is Roboto anyway, so the page looks almost the same.
    - **Drop the font files from the firmware** (reduces network): remove the `fonts.css` link and the TTF folder. The page then needs only two small text files, and the image has more free flash.
    - *Not applied:* web font subsets. If Roboto must look exactly the same on every client, two Latin-subset WOFF2 files (regular and bold) are the next best choice. In the same measurements they used about 12% less than the TTF set, but still more than the system fonts.
verify:
  static_only: CSS stylesheet, no runtime to test
