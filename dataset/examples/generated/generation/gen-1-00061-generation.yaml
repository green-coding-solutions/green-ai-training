id: gen-1-00061-generation
category: generation
language: javascript
patterns:
- hoist-invariants
messages:
- role: user
  content: |
    hi, i need a function for our ETL job. we get a big array of order rows from json, maybe 2 million rows. every row have `placed_at` (ms since epoch), `amount_cents` and some other fields. i need the same rows back but with new field `date` as YYYY-MM-DD in Europe/Berlin timezone, and `amount` as german string like "12,50" (no thousand dots). plz write it, thx
- role: assistant
  content: |
    ```javascript
    const DATE_FORMAT = new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Europe/Berlin',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    });

    const AMOUNT_FORMAT = new Intl.NumberFormat('de-DE', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
      useGrouping: false,
    });

    function normalizeOrders(rows) {
      const out = new Array(rows.length);
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        out[i] = {
          ...row,
          date: DATE_FORMAT.format(row.placed_at),
          amount: AMOUNT_FORMAT.format(row.amount_cents / 100),
        };
      }
      return out;
    }
    ```

    ```javascript
    normalizeOrders([{ id: 1, placed_at: Date.UTC(2024, 2, 15, 23, 30), amount_cents: 1250 }]);
    // [{ id: 1, placed_at: 1710545400000, amount_cents: 1250, date: '2024-03-16', amount: '12,50' }]
    ```

    The `sv-SE` locale is used only because it prints dates as `YYYY-MM-DD`. The timezone is what sets the day, so 23:30 UTC on 15 March is already 16 March in Berlin.

    **Green Notes**
    - **Formatters are built once, outside the loop** (reduces E): `Intl.DateTimeFormat` and `Intl.NumberFormat` load locale and timezone data when they are created. Building them inside the loop would repeat that work 2 million times. `toLocaleDateString(..., options)` in the loop can have the same problem.
    - The loop does only the per-row work: one `format()` call per field and one object copy.
    - If you process the rows in chunks or a stream, keep the two formatters at module level so every chunk reuses them.
verify:
  test: |-
    const assert = require('node:assert');
    const res = normalizeOrders([
      { id: 1, placed_at: Date.UTC(2024, 2, 15, 23, 30), amount_cents: 1250 },
      { id: 2, placed_at: Date.UTC(2024, 6, 1, 12, 0), amount_cents: 5 },
      { id: 3, placed_at: Date.UTC(2024, 11, 31, 23, 30), amount_cents: 123456789 },
    ]);
    assert.strictEqual(res[0].date, '2024-03-16');
    assert.strictEqual(res[0].amount, '12,50');
    assert.strictEqual(res[0].id, 1);
    assert.strictEqual(res[1].date, '2024-07-01');
    assert.strictEqual(res[1].amount, '0,05');
    assert.strictEqual(res[2].date, '2025-01-01');
    assert.strictEqual(res[2].amount, '1234567,89');
    assert.deepStrictEqual(normalizeOrders([]), []);
