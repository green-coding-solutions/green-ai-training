id: gen-1-00137-generation
category: generation
language: yaml
patterns:
- text-compression
- compress-transmitted
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    Ingress for our simulation results service (ingress-nginx, k8s). It serves run summaries as JSON, per-timestep tables as CSV/NDJSON (a few MB each), and NetCDF/HDF5/Parquet downloads. Nothing is compressed right now. Give me the ConfigMap change, diff only.
- role: assistant
  content: |
    ```yaml
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ingress-nginx-controller
      namespace: ingress-nginx
    data:
      use-gzip: "true"
      gzip-level: "4"
      gzip-min-length: "1024"
      gzip-types: "application/json application/x-ndjson text/csv text/plain"
    ```

    Only the types in `gzip-types` are compressed, so NetCDF, HDF5 and Parquet go out untouched.

    **Green Notes**
    - **Compress text responses** (reduces network): JSON, CSV and NDJSON tables are repetitive text and shrink a lot. Fewer bytes leave the cluster on every request.
      https://patterns.greensoftware.foundation/development/web-performance/enable-text-compression
    - **Moderate gzip level** (reduces E): these responses are built per request, so compression runs every time. Level 4 keeps CPU on the ingress low. In Green Metrics Tool micro-benchmarks on 100 MB of text, brotli at its maximum quality (the CLI default) used about 45× the CPU energy of gzip at its default level ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,8e93a8d2-60b0-4831-905b-764b68257bc7)). Don't turn on high-level brotli for dynamic responses.
      https://patterns.greensoftware.foundation/development/data-handling/compress-transmitted-data
    - **Skip binary formats and tiny bodies:** NetCDF/HDF5/Parquet are usually already compressed internally (check your writer settings), and `gzip-min-length` skips small bodies where the overhead isn't worth it.

    *Not applied:* a stronger codec. If the same large CSV files are downloaded many times, compress them once at export time with a strong codec and serve the stored file. That costs less than compressing on every request.
verify:
  static_only: Kubernetes ConfigMap, needs a cluster
