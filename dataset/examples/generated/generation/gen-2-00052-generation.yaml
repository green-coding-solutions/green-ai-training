id: gen-2-00052-generation
category: generation
language: css
patterns:
- remove-unused-css
- system-fonts-and-deps
facts:
- F-UNUSED-CSS
- F-FONTS
messages:
- role: user
  content: |
    Hi, I am new in our data team and I made a data quality report for our ETL. After every run, `dq_runner` renders this Jinja template and writes `dq_report_<run_id>.html` to the shared reports folder. We keep all of them, and people open them when a load fails.

    I don't know CSS well. So I copied the whole Bulma CSS file into the `<style>` tag, and now every report file is over 200 KB. Almost all of that is the CSS. My lead says that is "a lot of CSS for one table" but I don't know what is wrong with it. Can you write CSS for this page so it looks clean? Status can be `pass`, `warn` or `fail`.

    ```html
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>DQ report {{ run.pipeline }} {{ run.date }}</title>
      <style>
        /* whole bulma.css pasted here */
      </style>
    </head>
    <body>
      <div class="report">
        <header class="report-header">
          <h1>{{ run.pipeline }}</h1>
          <span class="badge badge-{{ run.status }}">{{ run.status }}</span>
          <dl class="run-meta">
            <dt>Run</dt><dd>{{ run.id }}</dd>
            <dt>Started</dt><dd>{{ run.started_at }}</dd>
            <dt>Rows loaded</dt><dd>{{ run.rows_loaded }}</dd>
          </dl>
        </header>
        <table class="checks">
          <thead>
            <tr><th>Check</th><th>Table</th><th class="num">Failed rows</th><th>Result</th></tr>
          </thead>
          <tbody>
          {% for c in checks %}
            <tr class="{{ 'failed' if c.status == 'fail' else '' }}">
              <td>{{ c.name }}</td>
              <td><code>{{ c.table }}</code></td>
              <td class="num">{{ c.failed_rows }}</td>
              <td><span class="badge badge-{{ c.status }}">{{ c.status }}</span></td>
            </tr>
          {% endfor %}
          </tbody>
        </table>
        <footer class="report-footer">Generated by dq_runner {{ version }}</footer>
      </div>
    </body>
    </html>
    ```
- role: assistant
  content: |
    Your template is fine. The problem is that Bulma has rules for buttons, forms, navbars, grids and much more, and your page uses about ten classes. This stylesheet covers only what the template uses. Put it in the `<style>` tag in place of Bulma:

    ```css
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2328;
      background: #f6f8fa;
    }

    .report {
      max-width: 60rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .report-header {
      margin-bottom: 1.5rem;
    }

    .report-header h1 {
      display: inline-block;
      vertical-align: middle;
      margin: 0 0.75rem 0 0;
      font-size: 1.5rem;
    }

    .run-meta {
      display: grid;
      grid-template-columns: max-content auto;
      gap: 0.25rem 1rem;
      margin: 0.75rem 0 0;
      font-size: 0.875rem;
    }

    .run-meta dt {
      color: #57606a;
    }

    .run-meta dd {
      margin: 0;
    }

    .checks {
      border-collapse: collapse;
      background: #fff;
      font-size: 0.875rem;
    }

    .checks th,
    .checks td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #d0d7de;
      text-align: left;
    }

    .checks th {
      background: #eaeef2;
      font-weight: 600;
    }

    .checks .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .checks tr.failed {
      background: #fff5f5;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8125rem;
    }

    .badge {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      vertical-align: middle;
    }

    .badge-pass { background: #dafbe1; color: #1a7f37; }
    .badge-warn { background: #fff8c5; color: #9a6700; }
    .badge-fail { background: #ffebe9; color: #cf222e; }

    .report-footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #57606a;
    }
    ```

    **Green Notes**
    - **Only the rules the page uses** (reduces network and storage): the CSS is copied into every report file. So each run stores the whole framework again, and every download sends it again. Be clear about the gain: in Green Metrics Tool page-load benchmarks, cutting a 16 KB stylesheet down to 0.75 KB changed client CPU energy by only about 2%, which is within noise. The saving is bytes on disk and on the network, not faster rendering.
    - **System font stack** (reduces network): no font files to load. In Green Metrics Tool page-load benchmarks, the system font stack used the least client CPU energy of the font setups tested.
    - *Not applied:* PurgeCSS or a minify step. You write the few rules yourself, so a build tool adds work and saves almost nothing.
verify:
  static_only: CSS stylesheet for an HTML template, nothing to execute
