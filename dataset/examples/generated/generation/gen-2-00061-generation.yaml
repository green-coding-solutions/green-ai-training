id: gen-2-00061-generation
category: generation
language: python
patterns:
- avoid-exception-flow
facts:
- F-EXC
messages:
- role: user
  content: |
    need a t(key, lang) helper in python for our landing page build. one translations dict per language, fall back to en, then to the key itself. de and fr are only about half translated so far
- role: assistant
  content: |
    ```python
    TRANSLATIONS: dict[str, dict[str, str]] = {
        "en": {
            "hero.title": "Ship faster",
            "hero.cta": "Start free trial",
            "footer.greeting": "Hi {name}!",
        },
        "de": {"hero.title": "Schneller liefern"},
        "fr": {"hero.cta": "Essai gratuit"},
    }

    DEFAULT_LANG = "en"
    _EMPTY: dict[str, str] = {}


    def t(key: str, lang: str, **params: object) -> str:
        """Text for key in lang, falling back to English, then to the key itself."""
        text = TRANSLATIONS.get(lang, _EMPTY).get(key)
        if not text:  # missing, or left empty by the translation export
            text = TRANSLATIONS[DEFAULT_LANG].get(key, key)
        return text.format(**params) if params else text
    ```

    Usage: `t("hero.cta", "de")` returns `"Start free trial"`. `t("footer.greeting", "fr", name="Ana")` returns `"Hi Ana!"`.

    **Green Notes**
    - **`dict.get` instead of `try/except KeyError`** (reduces E): de and fr are half translated, so a missing key is the normal case and not an error. Raising and catching an exception for every miss costs more than a lookup that returns `None`. In Green Metrics Tool micro-benchmarks with about half of the keys missing, `dict.get` used about 12% less CPU energy than `try/except KeyError`.
    - If the locales become almost fully translated, `try/except` would be cheap too, because the cost is in raising. `get` stays the simpler choice either way.
verify:
  test: |
    assert t("hero.title", "de") == "Schneller liefern"
    assert t("hero.cta", "de") == "Start free trial"
    assert t("hero.cta", "fr") == "Essai gratuit"
    assert t("footer.greeting", "fr", name="Ana") == "Hi Ana!"
    assert t("missing.key", "de") == "missing.key"
    assert t("hero.title", "es") == "Ship faster"
    TRANSLATIONS["de"]["hero.cta"] = ""
    assert t("hero.cta", "de") == "Start free trial"
