    ```python
    def events_newest_first(rows):
        """rows: iterable of dicts, oldest first. Busy accounts can have 100k+ rows.
        Skip rows where row["deleted"] is true.
        Return a list, newest first.
        """
        events = [row for row in rows if not row["deleted"]]
        events.reverse()
        return events
    ```

    The rest of your file stays as it is.

    **Green Notes**
    - **No front insertion** (reduces E): the function collects in one pass and reverses once, so the cost is O(n). Writing `events.insert(0, row)` per row would shift the whole list every time and grow O(n²) with account size. In Green Metrics Tool micro-benchmarks, 1,000,000 `list.insert(0, x)` calls used over 1000× more CPU energy than 1,000,000 `list.append(x)` calls.
    - **In-place reverse:** `events.reverse()` reuses the list. It makes no second copy.

    *Not applied:* `collections.deque` with `appendleft`. You return a list to `jsonify`, so a deque would need a conversion at the end for no gain.
