id: gen-1-00470-generation
category: generation
language: javascript
patterns:
- minify-assets
messages:
- role: user
  content: |
    esbuild build script for report/src/app.js, the page our nightly ETL job publishes with the load stats
- role: assistant
  content: |
    ```javascript
    // build-report.mjs
    import { build } from "esbuild";

    const prod = process.env.NODE_ENV === "production";

    await build({
      entryPoints: ["report/src/app.js", "report/src/styles.css"],
      outdir: "report/dist",
      bundle: true,
      format: "esm",
      target: "es2020",
      minify: prod,
      sourcemap: !prod,
      legalComments: "none",
      logLevel: "info",
    });
    ```

    Run it in the nightly job with `NODE_ENV=production node build-report.mjs`. Locally, `node build-report.mjs` gives readable output with source maps.

    **Green Notes**
    - **Minify JS and CSS in production** (reduces network): esbuild strips whitespace, shortens names and drops comments, so every visitor downloads and parses fewer bytes. [Minify web assets](https://patterns.greensoftware.foundation/development/web-performance/minify-web-assets)
    - **No source maps in production builds**: they are only emitted in dev. Shipping them would add files that the page never needs.
    - **One bundle per type**: the page loads one JS file and one CSS file instead of every module separately.

    *Not applied:* hashed file names and gzip/Brotli pre-compression. Add them if the report is served to many users and your server does not compress responses itself.
verify:
  static_only: needs the esbuild package and project files
