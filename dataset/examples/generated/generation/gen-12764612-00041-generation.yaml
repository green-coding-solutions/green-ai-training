    Replace the placeholder captions and alt texts of samples 2 to 12 with the real species and scores, like in sample 1.

    **Green Notes**
    - **Defer offscreen images** (reduces network and E): the confusion matrix, the bar chart and all 12 samples have `loading="lazy"`, so the browser fetches them only when a reader scrolls near them. In Green Metrics Tool browser benchmarks with an article of 15 photos, page loads without scrolling used about 12% less CPU energy with lazy loading below the fold (~325 J vs ~368 J). When visitors scrolled to the end, the difference was noise. The saving comes from readers who stop reading early.
    - *Not applied:* lazy loading on the architecture diagram. It sits right below the title, in the first screen, and lazy loading it would only delay the first thing readers see. `fetchpriority="high"` asks the browser to load it first.

    `width` and `height` on every image reserve the space, so the layout does not jump while the images load.
