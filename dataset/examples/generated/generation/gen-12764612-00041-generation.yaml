messages:
- role: user
  content: |
    I need the HTML for a model-card page of our wildlife species classifier (ResNet-50 fine-tuned on camera trap images). It is a static page that we host next to the model weights on our internal docs server. Requirements:

    - Title and a short summary of the model (task, input size 224x224, 31 species classes)
    - One big architecture diagram right below the title (`img/architecture.png`, 1600x900)
    - A "Results" section with a confusion matrix image (`img/confusion-matrix.png`, 1400x1400) and a per-class accuracy bar chart (`img/per-class-accuracy.png`, 1400x700)
    - An "Example predictions" section with 12 sample images in a grid (`img/samples/sample-01.jpg` to `sample-12.jpg`, 512x512 each), each with a caption like "red fox, 0.97"
    - A short "Limitations" section with text only
    - Plain semantic HTML, a link to `style.css`, no JavaScript, no frameworks. All images need alt text.

    Just give me the full file.
