id: gen-1-00409-generation
category: generation
language: javascript
patterns:
- builtin-functions
messages:
- role: user
  content: |
    I need a small script for our marketing landing page (plain JS, no framework, no build step). Requirements:

    - On page load, read the UTM params from the URL: utm_source, utm_medium, utm_campaign, utm_term, utm_content. Ignore all other params.
    - Trim the values, drop empty ones, and cut each value to 100 characters.
    - If the URL has UTM params, save them in sessionStorage. If not, use the saved ones, so they survive when the visitor clicks to another page and comes back.
    - Add the params to every CTA link that has `data-utm` (the signup buttons). If a link already has one of the params, keep the link's own value.
    - I want to unit test the parsing and the link building without a browser.
- role: assistant
  content: |
    ```javascript
    const UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
    const MAX_LEN = 100;

    // Pure: takes a query string like "?utm_source=news&x=1"
    function parseUtm(search) {
      const params = new URLSearchParams(search);
      return Object.fromEntries(
        UTM_KEYS
          .map((key) => [key, (params.get(key) ?? '').trim().slice(0, MAX_LEN)])
          .filter(([, value]) => value !== '')
      );
    }

    // Pure: returns a new href, existing params on the link win
    function withUtm(href, utm, base) {
      const url = new URL(href, base);
      for (const [key, value] of Object.entries(utm)) {
        if (!url.searchParams.has(key)) url.searchParams.set(key, value);
      }
      return url.toString();
    }

    function loadUtm() {
      const fresh = parseUtm(location.search);
      if (Object.keys(fresh).length > 0) {
        sessionStorage.setItem('utm', JSON.stringify(fresh));
        return fresh;
      }
      try {
        return JSON.parse(sessionStorage.getItem('utm') ?? '{}');
      } catch {
        return {};
      }
    }

    function initUtm() {
      const utm = loadUtm();
      if (Object.keys(utm).length === 0) return;
      document.querySelectorAll('a[data-utm]').forEach((link) => {
        link.href = withUtm(link.getAttribute('href'), utm, location.href);
      });
    }

    if (typeof document !== 'undefined') {
      document.addEventListener('DOMContentLoaded', initUtm);
    }
    ```

    `parseUtm` and `withUtm` do not touch the DOM or storage, so you can test them in Node or any test runner:

    ```javascript
    console.log(parseUtm('?utm_source=news&utm_medium=%20email%20&utm_term=&foo=1'));
    // { utm_source: 'news', utm_medium: 'email' }
    ```

    **Green Notes**
    - **Built-in URL parsing** (reduces E): `URLSearchParams`, `URL` and `Object.fromEntries` run in the browser's native code. They replace a hand-written `split('&')` / `decodeURIComponent` loop, which is slower and gets edge cases wrong. This code runs on every landing page view.
    - **One DOM query, only for `a[data-utm]`** (reduces E): the script touches just the CTA links, not every `<a>` on the page.
    - No library is added, so the page ships no extra bytes.
verify:
  test: |-
    const assert = require('assert');
    assert.strictEqual(
      JSON.stringify(parseUtm('?utm_source=news&utm_medium=%20email%20&utm_term=&foo=1')),
      JSON.stringify({ utm_source: 'news', utm_medium: 'email' })
    );
    assert.strictEqual(JSON.stringify(parseUtm('')), '{}');
    assert.strictEqual(JSON.stringify(parseUtm('?utm_source=%20%20')), '{}');
    assert.strictEqual(parseUtm('?utm_campaign=' + 'a'.repeat(150)).utm_campaign.length, 100);
    assert.strictEqual(
      withUtm('/signup?plan=pro', { utm_source: 'news' }, 'https://example.com/'),
      'https://example.com/signup?plan=pro&utm_source=news'
    );
    assert.strictEqual(
      withUtm('/signup?utm_source=own', { utm_source: 'news', utm_medium: 'email' }, 'https://example.com/'),
      'https://example.com/signup?utm_source=own&utm_medium=email'
    );
