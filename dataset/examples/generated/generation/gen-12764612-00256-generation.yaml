id: gen-12764612-00256-generation
category: generation
language: bash
patterns:
- bash-builtins
facts:
- F-BASH-SUBPROC
messages:
- role: user
  content: |
    hello, i need small bash script for clean file names in one folder. we get about 15000 photos from the customers by upload and the names are bad, like "IMG 0042 Final.JPG" . i want all lowercase and spaces change to underscore. only files in the folder, not subfolders. if the new name already exist, dont overwrite it. thx
- role: assistant
  content: |-
    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    dir=${1:?'usage: normalize-names.sh DIR'}

    renamed=0
    for path in "$dir"/*; do
      [[ -f $path ]] || continue

      name=${path##*/}
      new=${name,,}
      new=${new// /_}
      [[ $new == "$name" ]] && continue

      if [[ -e $dir/$new ]]; then
        printf 'skip, target exists: %s\n' "$name" >&2
        continue
      fi

      mv -n -- "$path" "$dir/$new"
      renamed=$((renamed + 1))
    done

    printf 'renamed %d files\n' "$renamed"
    ```

    It needs bash 4 or newer for `${name,,}`. The default bash on macOS is 3.2, so install a newer one there. Names that start with a dot are not touched, because `*` does not match them.

    **Green Notes**
    - **Builtins instead of subprocesses in the loop** (reduces E): `${path##*/}`, `${name,,}`, `${new// /_}` and `$(( ))` run inside the shell. The usual `$(basename ...)`, `$(echo ... | tr ...)` and `$(expr ...)` would start several processes per file, so about 15000 files would mean tens of thousands of forks. In Green Metrics Tool micro-benchmarks on a 20,000-line log summary, a builtin-only loop used about 300× less CPU energy than the same loop with `$(echo | cut)` and `$(expr)` per line.
    - **Only one process per renamed file:** `mv` is the only external call. Files whose names are already clean are skipped without starting anything.
    - **Single quotes for fixed text:** the usage and message strings contain no variables, so they use single quotes.
    - **Safety:** `mv -n` and the `-e` check make sure nothing is overwritten. Two files like `A B.jpg` and `a_b.jpg` will not collide silently, and the second one is reported.
