id: gen-1-00147-generation
category: generation
language: python
patterns:
- keep-star-imports
facts:
- F-IMPORT
messages:
- role: user
  content: |
    modbus/poll.py on the gateway starts like this:

    ```python
    from struct import *
    import time
    ```

    Add `regs_to_float32(hi, lo, swap_words=False)`. It turns two 16-bit holding registers into a float32. Some of our meters send the low word first, hence the flag. Diff only, please.
- role: assistant
  content: |
    ```python
    from struct import *
    import time

    def regs_to_float32(hi, lo, swap_words=False):
        if swap_words:
            hi, lo = lo, hi
        return unpack(">f", pack(">HH", hi, lo))[0]
    ```

    Registers outside 0-65535 raise `struct.error`, so bad reads fail loudly.

    **Green Notes**
    - **Star import left as is:** `from struct import *` is unchanged. In Green Metrics Tool micro-benchmarks (1,000 process starts), `from posix import *` and `import posix` both used about 121 J, so there is no measurable energy difference. Changing it would only add diff noise.
verify:
  module: true
  test: |-
    assert regs_to_float32(0x3FC0, 0x0000) == 1.5
    assert regs_to_float32(0x0000, 0x3FC0, swap_words=True) == 1.5
    assert regs_to_float32(0xC0A0, 0x0000) == -5.0
    try:
        regs_to_float32(70000, 0)
        raise SystemExit("expected error")
    except Exception as e:
        assert "SystemExit" not in type(e).__name__
