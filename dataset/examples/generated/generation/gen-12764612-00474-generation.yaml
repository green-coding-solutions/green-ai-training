messages:
- role: user
  content: |
    hello, i need html for product page in our small online shop, we sell handmade ceramic mugs. product is "Morning Blue mug". I have big photo of the mug (mug-main.jpg) and under the page a part "You may also like" with 3 other mugs (mug-green.jpg, mug-sand.jpg, mug-night.jpg). Also price, button "Add to cart" with small cart icon, and short description. Pictures I have only as jpg now but I can make other formats if it is better. Please give me whole page, no framework. Thank you!
- role: assistant
  content: |
    Here is the page. Make the image files once, in your build or upload step. For each photo you need `-800` and `-1600` widths for the main mug and a `-400` width for the small cards, each as `.avif`, `.webp` and `.jpg`.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Morning Blue mug – handmade ceramic</title>
      <style>
        body {
          margin: 0;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          line-height: 1.6;
          color: #222;
        }
        main { max-width: 56rem; margin: 0 auto; padding: 2rem 1.25rem; }
        img { max-width: 100%; height: auto; border-radius: 6px; }
        .price { font-size: 1.5rem; font-weight: 600; }
        button {
          display: inline-flex; align-items: center; gap: .5rem;
          padding: .75rem 1.25rem; border: 0; border-radius: 6px;
          background: #1d4e89; color: #fff; font-size: 1rem; cursor: pointer;
        }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; padding: 0; list-style: none; }
      </style>
    </head>
    <body>
      <main>
        <h1>Morning Blue mug</h1>

        <picture>
          <source type="image/avif"
                  srcset="img/mug-main-800.avif 800w, img/mug-main-1600.avif 1600w"
                  sizes="(min-width: 56rem) 52rem, 100vw">
          <source type="image/webp"
                  srcset="img/mug-main-800.webp 800w, img/mug-main-1600.webp 1600w"
                  sizes="(min-width: 56rem) 52rem, 100vw">
          <img src="img/mug-main-800.jpg"
               srcset="img/mug-main-800.jpg 800w, img/mug-main-1600.jpg 1600w"
               sizes="(min-width: 56rem) 52rem, 100vw"
               width="1600" height="1067"
               alt="Blue handmade ceramic mug on a wooden table"
               fetchpriority="high">
        </picture>

        <p class="price">€24.00</p>
        <p>Handmade stoneware mug, 350 ml. Glazed by hand, so every mug is a little different. Dishwasher safe.</p>

        <button type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
          </svg>
          Add to cart
        </button>

        <h2>You may also like</h2>
        <ul class="cards">
          <li>
            <picture>
              <source type="image/avif" srcset="img/mug-green-400.avif">
              <source type="image/webp" srcset="img/mug-green-400.webp">
              <img src="img/mug-green-400.jpg" width="400" height="400" alt="Green mug" loading="lazy">
            </picture>
            <p>Forest Green mug</p>
          </li>
          <li>
            <picture>
              <source type="image/avif" srcset="img/mug-sand-400.avif">
              <source type="image/webp" srcset="img/mug-sand-400.webp">
              <img src="img/mug-sand-400.jpg" width="400" height="400" alt="Sand coloured mug" loading="lazy">
            </picture>
            <p>Desert Sand mug</p>
          </li>
          <li>
            <picture>
              <source type="image/avif" srcset="img/mug-night-400.avif">
              <source type="image/webp" srcset="img/mug-night-400.webp">
              <img src="img/mug-night-400.jpg" width="400" height="400" alt="Dark blue mug" loading="lazy">
            </picture>
            <p>Midnight mug</p>
          </li>
        </ul>
      </main>
    </body>
    </html>
    ```

    **Green Notes**
    - **Modern image formats with JPG fallback** (reduces network): `<picture>` lets the browser take AVIF or WebP when it can, and the JPG when it can't. The gain is fewer transferred bytes, not faster decoding. In Green Metrics Tool browser benchmarks (50 page loads per format), AVIF decoding cost about 19% more CPU energy than JPG. Encoding is the expensive part: AVIF encoding cost about 7× JPG. So encode once at build or upload time, never per request.
    - **Defer offscreen images** (reduces network): the three "You may also like" cards are below the fold, so they have `loading="lazy"`. In the same kind of benchmarks, a page with images below the fold used about 12% less CPU energy when visitors did not scroll. The main mug photo is above the fold, so it is not lazy and has `fetchpriority="high"`.

    The cart icon is inline SVG, so it needs no image file. `width` and `height` on every image keep the layout stable while the photos load.
