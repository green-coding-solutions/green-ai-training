- role: assistant
  content: |
    Here is the stylesheet. It uses a system font stack, so the browser needs no font download.

    ```css
    :root {
      --text: #222;
      --muted: #6b6b6b;
      --line: #e4e0d8;
      --accent: #2f6f5e;
      --bg: #fbfaf7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }

    .cart {
      max-width: 46rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    .cart h1 {
      font-size: 1.75rem;
      margin: 0 0 1rem;
    }

    .cart-items {
      width: 100%;
      border-collapse: collapse;
    }

    .cart-items th {
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 2px solid var(--line);
      padding: 0.5rem 0.25rem;
    }

    .cart-items td {
      padding: 0.85rem 0.25rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .cart-items .title { font-weight: 600; }

    .cart-items .author {
      display: block;
      font-weight: 400;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .cart-items .price {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .summary {
      margin-top: 1.5rem;
      text-align: right;
    }

    .summary .total { font-size: 1.25rem; margin: 0 0 1rem; }

    .btn {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 0.5rem;
    }

    .btn:hover,
    .btn:focus-visible { background: #255a4c; }

    @media (max-width: 30rem) {
      .cart h1 { font-size: 1.4rem; }
      .btn { display: block; text-align: center; }
    }
    ```

    **Green Notes**
    - **System font stack** (reduces E on the client): no font files are requested, parsed or rendered on first load. In Green Metrics Tool browser benchmarks (30 cold page loads), the system font stack used about 26% less client energy than six local TTF files and about 16% less than two Latin-subset WOFF2 files.

    *Not applied:* a custom brand font. If you need one later, use one or two WOFF2 subsets with `font-display: swap`, not full TTF sets.
