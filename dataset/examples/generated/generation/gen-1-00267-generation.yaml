id: gen-1-00267-generation
category: generation
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    `perfwatch` CLI renders this Jinja template after each benchmark run. Add a "Previous runs" section below the top-functions table. One thumbnail per entry in `runs` (max 12, already sliced in Python). Each item has `r.commit`, `r.total_ms`, `r.thumb` (400x225 png). Diff only please.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>perfwatch – {{ project }} @ {{ commit[:8] }}</title>
      <link rel="stylesheet" href="report.css">
    </head>
    <body>
      <header>
        <h1>{{ project }}</h1>
        <p>commit {{ commit[:8] }}, {{ finished_at }}, {{ total_ms }} ms total</p>
      </header>
      <main>
        <section id="flame">
          <h2>Flame graph</h2>
          <img src="{{ flame_png }}" width="1600" height="900" alt="Flame graph for {{ commit[:8] }}">
        </section>
        <section id="top">
          <h2>Top functions</h2>
          <table>
            <thead><tr><th>Function</th><th>Self ms</th><th>Calls</th></tr></thead>
            <tbody>
            {% for f in top_functions %}
              <tr><td>{{ f.name }}</td><td>{{ f.self_ms }}</td><td>{{ f.calls }}</td></tr>
            {% endfor %}
            </tbody>
          </table>
        </section>
      </main>
    </body>
    </html>
    ```
- role: assistant
  content: |
    ```diff
    @@ -28,6 +28,16 @@
               </tbody>
             </table>
           </section>
    +      {% if runs %}
    +      <section id="history">
    +        <h2>Previous runs</h2>
    +        <ul class="runs">
    +        {% for r in runs %}
    +          <li><img src="{{ r.thumb }}" width="400" height="225" alt="Flame graph thumbnail for {{ r.commit[:8] }}" loading="lazy"><br>{{ r.commit[:8] }}, {{ r.total_ms }} ms</li>
    +        {% endfor %}
    +        </ul>
    +      </section>
    +      {% endif %}
         </main>
       </body>
       </html>
    ```

    **Green Notes**
    - **Defer offscreen images** (reduces network and E): the 12 thumbnails sit below the table, so the browser fetches them only when the reader scrolls near them. In Green Metrics Tool browser benchmarks, an article with 15 photos below the fold used about 12% less CPU energy over page loads without scrolling. When visitors scrolled to the end, there was no difference. Many readers only check the top of this report, so the saving depends on that.
    - `width` and `height` are set, so the layout does not jump when a thumbnail loads.

    *Not applied:* `loading="lazy"` on the flame graph. It is the first thing on the page and lazy loading it would only delay it.
verify:
  static_only: Jinja/HTML template diff
