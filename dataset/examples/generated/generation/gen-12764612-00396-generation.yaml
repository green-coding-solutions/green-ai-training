messages:
- role: user
  content: |
    dockerfile for lorawan packet decoder on our gateway. python 3.12, package decoder/, requirements.txt (paho-mqtt, pydantic, cryptography), run with python -m decoder
- role: assistant
  content: |
    ```dockerfile
    FROM python:3.12-slim

    ENV PYTHONDONTWRITEBYTECODE=1 \
        PYTHONUNBUFFERED=1

    WORKDIR /app

    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY decoder/ ./decoder/

    RUN useradd --system --no-create-home decoder
    USER decoder

    CMD ["python", "-m", "decoder"]
    ```

    **Green Notes**
    - **Slim base image** (reduces E, M): `python:3.12-slim` instead of the full `python:3.12`, with no compilers, git or dev tools. In Green Metrics Tool micro-benchmarks, building a small Flask app image this way used about 7× less energy than a full base with build tools and dev packages. Serving requests afterwards cost the same, so the saving comes with every build, pull and stored copy.
    - **Dependency layer before the source** (reduces E): `requirements.txt` is copied and installed first, so a code change in `decoder/` reuses the cached dependency layer instead of reinstalling everything.
    - **Runtime dependencies only, `--no-cache-dir`** (reduces M): no test or lint packages in the image, and no pip download cache left in the layer.
    - If a dependency has no prebuilt wheel for your gateway's CPU, add the build tools in a separate build stage, not in this image.
