id: gen-1-00459-generation
category: generation
language: javascript
patterns:
- minify-assets
messages:
- role: user
  content: |
    esbuild script for our shop js pls. entries src/shop.js and src/checkout.js
- role: assistant
  content: |
    ```javascript
    // build.mjs
    import { build } from 'esbuild';
    import { writeFile } from 'node:fs/promises';

    const prod = process.env.NODE_ENV === 'production';

    const result = await build({
      entryPoints: {
        shop: 'src/shop.js',
        checkout: 'src/checkout.js',
      },
      outdir: 'dist',
      entryNames: '[name]-[hash]',
      bundle: true,
      splitting: true,
      format: 'esm',
      target: 'es2020',
      minify: prod,
      sourcemap: !prod,
      legalComments: 'none',
      define: {
        'process.env.NODE_ENV': JSON.stringify(prod ? 'production' : 'development'),
      },
      metafile: true,
    });

    // Map entry names to hashed files, so your templates can find them.
    const manifest = {};
    for (const [file, meta] of Object.entries(result.metafile.outputs)) {
      if (meta.entryPoint) manifest[meta.entryPoint] = file.replace(/^dist\//, '');
    }
    await writeFile('dist/manifest.json', JSON.stringify(manifest, null, 2));
    ```

    Run it with `NODE_ENV=production node build.mjs` for releases. Load the output with `<script type="module">`, because `splitting` needs ES modules.

    **Green Notes**
    - **Minify web assets** (reduces network and client E): production builds are minified, so every shopper downloads and parses fewer bytes. Source maps are only built in dev, so they are never shipped to visitors.
      https://patterns.greensoftware.foundation/development/web-performance/minify-web-assets
    - **Shared chunk:** code used by both entries (cart helpers, formatters) goes into one file. It is not duplicated in each bundle.
    - Hashed file names let you set long cache lifetimes on the files. A new release gets new names.
    - If your error tracker needs source maps, upload them there from CI. Don't serve them publicly.
verify:
  static_only: needs the esbuild package; syntax checked
