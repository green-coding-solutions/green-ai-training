id: gen-2-00299-generation
category: generation
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    Need the Jinja template for the page `errclust` writes after each nightly run (it clusters error logs from the last 24h). Layout:

    - header with time range and totals
    - `overview.png` (1200x320, total error volume over 24h)
    - one block per cluster, already sorted by count: signature, count, first seen, one sample log line, and the cluster's 24h histogram `clusters/<id>.png` (720x180)

    50-200 clusters per run. On-call opens it in the morning, reads the first few clusters, closes the tab.
    Context: `report.start`, `report.end`, `report.total_events`, `clusters` (each has `id`, `signature`, `count`, `first_seen`, `sample`). Stylesheet is `report.css` next to the page.

    Template only, skip the walkthrough.
- role: assistant
  content: |
    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Error clusters · {{ report.start }} – {{ report.end }}</title>
      <link rel="stylesheet" href="report.css">
    </head>
    <body>
      <header>
        <h1>Error clusters</h1>
        <p>{{ report.start }} – {{ report.end }} · {{ report.total_events }} events in {{ clusters|length }} clusters</p>
      </header>

      <section id="overview">
        <h2>Error volume, last 24 h</h2>
        <img src="overview.png" width="1200" height="320"
             alt="Total error events over the last 24 hours">
      </section>

      <section id="clusters">
        <h2>Clusters by count</h2>
        {% for c in clusters %}
        <article class="cluster" id="c-{{ c.id }}">
          <h3><a href="#c-{{ c.id }}">#{{ loop.index }}</a> {{ c.signature|e }}</h3>
          <p>{{ c.count }} events · first seen {{ c.first_seen }}</p>
          <pre><code>{{ c.sample|e }}</code></pre>
          <img src="clusters/{{ c.id }}.png" width="720" height="180" loading="lazy"
               alt="Occurrences of cluster {{ loop.index }} over the last 24 hours">
        </article>
        {% endfor %}
      </section>
    </body>
    </html>
    ```

    **Green Notes**
    - **Lazy-load offscreen images** (reduces E, network): with up to 200 histograms and readers who stop after a few clusters, most of them never get fetched or decoded. In Green Metrics Tool browser benchmarks, an article with 15 photos loaded without scrolling used about 12% less CPU energy with `loading="lazy"` below the fold. When visitors scrolled to the end, there was no measurable difference.
    - *Not applied:* lazy loading on `overview.png`. It is above the fold, and deferring it would only delay the first thing on-call looks at.

    `width`/`height` reserve the space, so the page doesn't jump while histograms load. `signature` and `sample` are escaped with `|e` because they come straight from log lines. That keeps them safe even if the Jinja environment has autoescape off.
verify:
  static_only: HTML/Jinja template, needs a browser to check
