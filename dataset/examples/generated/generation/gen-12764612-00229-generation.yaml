messages:
- role: user
  content: |
    I have a small CLI called `printfarm-sync` that writes `report.html` after each overnight run of our 3D printers. For every finished print it saves one 1280x720 JPG from the bed camera into `shots/` (usually 30 to 60 per night). I need the HTML template for that page. Requirements:

    - header with the run date and a line like "42 prints, 3 failed"
    - the failed print with the biggest photo right below the header, if there is one
    - then a grid of all other photos, 4 columns on desktop, 2 on a phone
    - each photo has a caption (printer name + job name) and alt text
    - no JavaScript, no external CSS or fonts, it must open from a local file
    - I fill in the values with Python `string.Template`, so use `$name` placeholders and show me one grid item
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Print run $run_date</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1200px; padding: 1rem; }
        .summary { color: #444; }
        figure { margin: 0; }
        figcaption { font-size: 0.9rem; padding: 0.25rem 0; }
        img { width: 100%; height: auto; display: block; background: #eee; }
        .failed img { border: 3px solid #c0392b; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1.5rem; }
        @media (min-width: 800px) { .grid { grid-template-columns: repeat(4, 1fr); } }
      </style>
    </head>
    <body>
      <h1>Print run $run_date</h1>
      <p class="summary">$total_prints prints, $failed_prints failed</p>

      <!-- Above the fold: loads right away, no lazy attribute -->
      <figure class="failed">
        <img src="shots/$hero_file" width="1280" height="720" alt="$hero_alt">
        <figcaption>$hero_printer: $hero_job (failed)</figcaption>
      </figure>

      <section class="grid">
        <!-- repeat once per remaining print -->
        <figure>
          <img src="shots/$file" width="1280" height="720" loading="lazy" alt="$alt">
          <figcaption>$printer: $job</figcaption>
        </figure>
      </section>
    </body>
    </html>
    ```

    Notes for the CLI:
    - If no print failed, put the first photo of the grid into the hero slot, without `loading="lazy"`. Only the grid items get `loading="lazy"`.
    - If a grid has fewer than 4 photos, all of them may be visible at once. Then drop `loading="lazy"` on them, because it saves nothing.
    - Escape `$job` and `$alt` with `html.escape()` before you fill the template, because job names come from users.

    **Green Notes**
    - **Defer offscreen images** (reduces network, E on the client): the grid photos below the fold are only fetched when someone scrolls near them. The hero photo is left eager, because it is above the fold. In Green Metrics Tool browser benchmarks, an article with 15 photos (about 2 MB) used about 12% less CPU energy on page loads without scrolling. When visitors scrolled to the end, there was no difference.
    - **Fixed `width`/`height`** (reduces E on the client): the browser reserves the space for each photo, so the grid does not jump around when lazy photos arrive.
    - *Not applied:* thumbnails. The CLI could also write smaller JPGs for the grid. That is a separate change in `printfarm-sync` and I did not add it here.
verify:
  static_only: HTML template with string.Template placeholders, no runnable code
