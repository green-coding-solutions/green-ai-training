  content: |
    dirsize.py: add `--top N`. After the total, list the N largest files with their sizes. argparse is fine, stdlib only. Diff only.

    ```python
    #!/usr/bin/env python3
    """Print the total size of a directory tree."""
    import os
    import sys
    from os.path import *


    def human(n):
        for unit in ('B', 'KB', 'MB', 'GB'):
            if n < 1024:
                return f'{n:.1f} {unit}'
            n /= 1024
        return f'{n:.1f} TB'


    def main(argv):
        root = argv[1] if len(argv) > 1 else '.'
        if not isdir(root):
            print(f'not a directory: {root}', file=sys.stderr)
            return 2
        total = 0
        for dirpath, _dirs, files in os.walk(root):
            for name in files:
                path = join(dirpath, name)
                if islink(path):
                    continue
                total += getsize(path)
        print(human(total))
        return 0


    if __name__ == '__main__':
        sys.exit(main(sys.argv))
    ```
