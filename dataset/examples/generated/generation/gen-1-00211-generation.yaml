messages:
- role: user
  content: |
    hi, i am new to typescript. we have 12 servers and each one has a small json file with the count of log lines per level, like http://app1.internal:8080/logs/summary.json (looks like {"INFO": 1200, "ERROR": 4}). i want one script that reads all of them and prints the total per level. i dont know how to do the web requests in a good way, can you write it?
- role: assistant
  content: |
    ```typescript
    type Counts = Record<string, number>;

    const SERVERS: string[] = Array.from(
      { length: 12 },
      (_, i) => `http://app${i + 1}.internal:8080`,
    );

    async function fetchCounts(base: string): Promise<Counts> {
      const res = await fetch(`${base}/logs/summary.json`, {
        signal: AbortSignal.timeout(5000), // do not wait forever for a dead server
      });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return (await res.json()) as Counts;
    }

    async function main(): Promise<void> {
      // All 12 requests start at once, we wait for all of them together.
      const results = await Promise.allSettled(SERVERS.map((s) => fetchCounts(s)));

      const total: Counts = {};
      results.forEach((result, i) => {
        if (result.status === "rejected") {
          console.error(`skipped ${SERVERS[i]}: ${result.reason}`);
          return;
        }
        for (const [level, n] of Object.entries(result.value)) {
          total[level] = (total[level] ?? 0) + n;
        }
      });

      console.log(total);
    }

    main();
    ```

    It needs Node 18 or newer, because `fetch` is built in there. Run it with `npx tsx summary.ts`.

    **Green Notes**
    - **Concurrent requests with `Promise.allSettled`** (reduces E): the 12 requests wait on the network at the same time. A `for` loop with `await` inside would run them one after another, and the process would stay alive for the sum of all response times instead of the slowest one. The link has more on this pattern: https://patterns.greensoftware.foundation/development/use-async-instead-of-sync
    - **`allSettled` instead of `all`:** one dead server does not throw away the other 11 answers. You get a message for the failed one and the rest is still counted.
    - **Timeout of 5 seconds:** a hanging server cannot keep the script running.
    *Not applied:* a limit on parallel requests. With 12 small requests it is not needed. If you ever poll hundreds of servers, send them in groups of 20 to 50 so you do not open too many connections at once.
