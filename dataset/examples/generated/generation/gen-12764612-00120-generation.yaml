id: gen-12764612-00120-generation
category: generation
language: python
patterns:
- set-membership
facts:
- F-MEMB
messages:
- role: user
  content: |
    hi, im pretty new to python. i work on a small web shop and need a function for the "recommended for you" box. our recommender gives me a list of around 200 product ids (strings like "P-10442") in ranking order. i also have the list of product ids the customer already bought, for old customers it can be a few thousand. i need to remove the already bought products from the recommendations and keep the ranking order. also max 8 products should be shown. not sure how to write it in a good way, can you help?
- role: assistant
  content: |
    ```python
    def recommend_unbought(recommended, purchased_ids, limit=8):
        """Return up to `limit` recommended product ids the customer has not bought yet.

        Keeps the ranking order of `recommended`.
        """
        purchased = set(purchased_ids)  # build once, then every check is O(1)
        result = []
        for product_id in recommended:
            if product_id in purchased:
                continue
            result.append(product_id)
            if len(result) == limit:
                break
        return result
    ```

    Example:

    ```python
    recommended = ["P-3", "P-7", "P-1", "P-9", "P-4"]
    bought = ["P-1", "P-4", "P-100"]
    print(recommend_unbought(recommended, bought, limit=3))  # ['P-3', 'P-7', 'P-9']
    ```

    **Green Notes**
    - **Set for repeated membership tests** (reduces E): you check up to 200 products against a list of a few thousand ids. With a list, each `in` scans it, so that is about 200 × thousands of comparisons. The set is built once, so each check is O(1).
    - **Early stop at `limit`:** the loop ends as soon as 8 products are found, so the rest of the recommendations are never checked.

    *Not applied:* the set is only worth it because you look up many times. In Green Metrics Tool micro-benchmarks, converting a 10,000,000-element list to a set and testing once used about 50% more CPU energy than one test on the list. If you only check one product, keep the list.
verify:
  green_block: 0
  test: |-
    assert recommend_unbought(["P-3", "P-7", "P-1", "P-9", "P-4"], ["P-1", "P-4", "P-100"], limit=3) == ["P-3", "P-7", "P-9"]
    assert recommend_unbought(["a", "b", "c"], [], limit=8) == ["a", "b", "c"]
    assert recommend_unbought(["a", "b"], ["a", "b"]) == []
    assert recommend_unbought(iter(["x", "y", "z"]), iter(["y"]), limit=1) == ["x"]
    big = [f"P-{i}" for i in range(200)]
    owned = [f"P-{i}" for i in range(0, 5000, 2)]
    assert recommend_unbought(big, owned) == ["P-1", "P-3", "P-5", "P-7", "P-9", "P-11", "P-13", "P-15"]
