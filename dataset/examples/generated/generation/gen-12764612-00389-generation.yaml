id: gen-12764612-00389-generation
category: generation
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    I need a static HTML page for our runbook "Roll back a failed deploy". It lives on our internal GitLab Pages site and on-call engineers open it during incidents.

    Requirements:
    - Title and a short intro, then a screenshot of the pipeline overview (this is the first thing people should see).
    - 5 numbered steps. Each step has a heading, one or two sentences, and a screenshot of the GitLab UI. The screenshots are WebP files in `img/`, all 1280x720: `step1-open-pipeline.webp`, `step2-find-last-green.webp`, `step3-rerun-job.webp`, `step4-confirm-prod.webp`, `step5-verify-health.webp`. The overview is `img/pipeline-overview.webp`, also 1280x720.
    - Use semantic HTML, proper alt text, a max width of 900px, no JavaScript and no frameworks.
- role: assistant
  content: |
    The width and height attributes let the browser reserve space for each screenshot, so the page doesn't jump while images load.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Runbook: Roll back a failed deploy</title>
      <style>
        body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0 auto; padding: 1rem; max-width: 900px; }
        img { max-width: 100%; height: auto; border: 1px solid #ccc; }
        figure { margin: 1rem 0; }
        figcaption { font-size: 0.9rem; color: #555; }
      </style>
    </head>
    <body>
      <main>
        <h1>Roll back a failed deploy</h1>
        <p>Use this when a production deploy breaks the service and a fix is not quick. A rollback re-runs the last green deploy job.</p>

        <figure>
          <img src="img/pipeline-overview.webp" width="1280" height="720"
               alt="GitLab pipeline overview with the failed deploy job marked red">
          <figcaption>The pipeline overview. The failed job is red.</figcaption>
        </figure>

        <ol>
          <li>
            <h2>Open the failed pipeline</h2>
            <p>Go to <strong>Build &gt; Pipelines</strong> and open the newest pipeline on <code>main</code>.</p>
            <img src="img/step1-open-pipeline.webp" width="1280" height="720" loading="lazy"
                 alt="Pipelines list with the newest pipeline on main highlighted">
          </li>
          <li>
            <h2>Find the last green deploy</h2>
            <p>Scroll the list down to the last pipeline with a green <code>deploy-prod</code> job and open it.</p>
            <img src="img/step2-find-last-green.webp" width="1280" height="720" loading="lazy"
                 alt="Pipelines list with the last green deploy-prod job highlighted">
          </li>
          <li>
            <h2>Re-run the deploy job</h2>
            <p>Click <strong>Run again</strong> on the <code>deploy-prod</code> job.</p>
            <img src="img/step3-rerun-job.webp" width="1280" height="720" loading="lazy"
                 alt="Job page with the Run again button highlighted">
          </li>
          <li>
            <h2>Confirm the production target</h2>
            <p>Check that the environment says <code>production</code> and approve the manual gate.</p>
            <img src="img/step4-confirm-prod.webp" width="1280" height="720" loading="lazy"
                 alt="Manual approval dialog showing the production environment">
          </li>
          <li>
            <h2>Verify health</h2>
            <p>Wait for the job to finish. Then check that the health dashboard is green.</p>
            <img src="img/step5-verify-health.webp" width="1280" height="720" loading="lazy"
                 alt="Health dashboard with all checks green">
          </li>
        </ol>
      </main>
    </body>
    </html>
    ```

    **Green Notes**
    - **Defer offscreen images** (reduces network and E): the five step screenshots sit below the fold, so they carry `loading="lazy"` and are fetched only when the reader scrolls near them. In Green Metrics Tool browser benchmarks of an article with 15 photos (about 2 MB), 20 page loads without scrolling used ~325 J with lazy images and ~368 J with eager ones, about 12% less. When the visitor scrolled to the end, there was no difference (about 1% more, which is noise). So the saving depends on how far readers go.

    *Not applied:* lazy loading on the pipeline overview. It is the first image and sits above the fold. Lazy loading it would only delay the first view during an incident, so it loads normally.
verify:
  static_only: static HTML page, no executable code
