messages:
- role: user
  content: |
    I need a function for our image classifier eval pipeline that writes the submission file for a benchmark server. Requirements:

    - input: `image_ids` (list of str), `probs` (numpy array, shape `(n_images, n_classes)`, softmax output), `labels` (list of class names)
    - output: one TSV text, header `image_id<TAB>top1<TAB>...<TAB>topK`, then one line per image
    - each cell is `label:prob` with 4 decimals, best class first, K is a parameter (default 5)
    - ties are resolved by lower class index
    - n_images is usually 1-2 million for the full test set
    - raise ValueError if the shapes don't match

    Function `build_submission(image_ids, probs, labels, k=5) -> str`. We write it to disk in the caller.
- role: assistant
  content: |
    ```python
    import numpy as np


    def build_submission(image_ids, probs, labels, k=5):
        probs = np.asarray(probs)
        if probs.ndim != 2:
            raise ValueError("probs must be 2-D (n_images, n_classes)")
        if probs.shape[0] != len(image_ids):
            raise ValueError("image_ids and probs have different lengths")
        if probs.shape[1] != len(labels):
            raise ValueError("labels and probs have different class counts")
        if not 1 <= k <= probs.shape[1]:
            raise ValueError("k must be between 1 and n_classes")

        # stable sort: equal probabilities keep the lower class index first
        top = np.argsort(-probs, axis=1, kind="stable")[:, :k]
        top_p = np.take_along_axis(probs, top, axis=1)

        lines = ["image_id\t" + "\t".join(f"top{i}" for i in range(1, k + 1))]
        for image_id, idx_row, p_row in zip(image_ids, top.tolist(), top_p.tolist()):
            cells = [f"{labels[j]}:{p:.4f}" for j, p in zip(idx_row, p_row)]
            lines.append(image_id + "\t" + "\t".join(cells))
        return "\n".join(lines) + "\n"
    ```

    **Green Notes**
    - **Join instead of `+=`** (reduces E): the lines go into a list and are joined once, so the text is built in one pass instead of copying a growing string for each of the millions of lines. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J with `+=` and ~1.8 J with `"".join()`, roughly 260× less CPU energy. An f-string appended in a loop behaves like `+=`, so the f-strings here only build the small per-cell pieces.
    - **One sort for the whole batch** (reduces E): `argsort` and `take_along_axis` run on the full array in NumPy, so the Python loop only formats text.

    For 1-2 million rows the joined text and the list are both in memory at the same time. If memory is tight, write the lines to the file in chunks of some tens of thousands of lines and join each chunk.
