    Dark theme please, monospace font, should look nice on the docs index. Thanks!
- role: assistant
  content: |
    CSS can do all of it. You don't need any JavaScript for this:

    ```css
    .term {
      max-width: 640px;
      margin: 2rem auto;
      border-radius: 8px;
      overflow: hidden;
      background: #1e1f24;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #d6d8de;
    }

    .term-bar {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      background: #2a2c33;
    }

    .term-bar span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff5f57;
    }
    .term-bar span:nth-child(2) { background: #febc2e; }
    .term-bar span:nth-child(3) { background: #28c840; }

    .term-body {
      padding: 14px 16px 18px;
    }

    /* Lines appear one after another */
    .line {
      white-space: pre;
      animation: line-in 0.25s ease-out both;
    }
    .line:nth-child(1) { animation-delay: 0.3s; }
    .line:nth-child(2) { animation-delay: 1.2s; }
    .line:nth-child(3) { animation-delay: 1.6s; }
    .line:nth-child(4) { animation-delay: 2.2s; }
    .line:nth-child(5) { animation-delay: 2.8s; }

    .cmd { color: #ffffff; }
    .ok  { color: #7ee787; }

    /* Block cursor */
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.15em;
      vertical-align: text-bottom;
      background: currentColor;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes line-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .line,
      .cursor {
        animation: none;
      }
    }
    ```

    How it works:
    - `animation-fill-mode: both` (the `both` in the shorthand) keeps each line hidden until its delay is over, then keeps it visible.
    - `steps(1)` makes the cursor switch on and off sharply, like a real terminal, with no fade.
    - If you add more output lines, give each one its own `nth-child` rule with a later delay.
    - Visitors who turn on "reduce motion" in their OS see the finished terminal right away.

    **Green Notes**
    - **CSS keyframes instead of JS-driven animation** (reduces E): the browser runs the reveal and the blink itself, so no timer callbacks write styles while the page is open. In Green Metrics Tool browser benchmarks, a 20-second animation with CSS `@keyframes` used about 10% less CPU energy than the same animation driven by `requestAnimationFrame` with style updates.
    - **Only `opacity` and `transform` are animated**: the browser does not have to recompute the page layout on every frame.
