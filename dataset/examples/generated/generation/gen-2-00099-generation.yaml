      <div class="term-bar"><span></span><span></span><span></span></div>
      <div class="term-body">
        <div class="line cmd">$ kvsync push ./config --env staging</div>
        <div class="line">reading 42 keys from ./config ...</div>
        <div class="line">diff: 3 changed, 1 new, 0 removed</div>
        <div class="line ok">✔ synced to staging (1.4s)</div>
