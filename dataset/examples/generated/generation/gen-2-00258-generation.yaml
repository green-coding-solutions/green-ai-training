id: gen-2-00258-generation
category: generation
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    `schemadoc`, our CLI, dumps a Postgres schema into a single `index.html` and publishes it to the internal docs host. It already renders the overview ER diagram with graphviz. I've extended the generator to also write one diagram per table (`diagrams/<table>.png`, about 180 of them). Sizes are in `t.diagram.w` / `t.diagram.h` (CSS px). People mostly arrive from PR descriptions via `index.html#table-orders` etc., read one table and close the tab.

    Add the per-table diagram under each table's column list. Just the diff, I know the rest of the template.

    ```html
    <header>
      <h1>{{ db_name }} schema</h1>
      <p class="meta">Generated {{ generated_at }} · {{ tables|length }} tables</p>
    </header>

    <figure class="overview">
      <img src="diagrams/_overview.png" alt="ER overview of {{ db_name }}"
           width="{{ overview.w }}" height="{{ overview.h }}">
    </figure>

    {% for t in tables %}
    <section id="table-{{ t.name }}">
      <h2>{{ t.name }}</h2>
      <table class="columns">
        <thead><tr><th>Column</th><th>Type</th><th>Null</th><th>Default</th></tr></thead>
        <tbody>
        {% for c in t.columns %}
          <tr><td>{{ c.name }}</td><td>{{ c.type }}</td><td>{{ "yes" if c.nullable else "no" }}</td><td>{{ c.default or "" }}</td></tr>
        {% endfor %}
        </tbody>
      </table>
    </section>
    {% endfor %}
    ```
- role: assistant
  content: |
    Inside the loop, after `</table>`:

    ```html
        </table>
        <figure class="table-diagram">
          <img src="diagrams/{{ t.name }}.png"
               alt="Relations of {{ t.name }}"
               width="{{ t.diagram.w }}" height="{{ t.diagram.h }}"
               loading="lazy">
        </figure>
      </section>
    ```

    The overview `<img>` stays as it is.

    **Green Notes**
    - **Lazy-load the per-table diagrams** (reduces E and network): readers jump to one anchor and leave. Without `loading="lazy"`, every visit fetches and decodes about 180 PNGs that nobody looks at. With it, the browser loads only the diagrams near the viewport. In Green Metrics Tool page-load benchmarks (an article with 15 photos), lazy loading below the fold used about 12% less CPU energy when visitors didn't scroll to the images. When they scrolled to the end, the difference was about 1%, which is noise. Your readers mostly don't scroll, so this case fits.
    - **Overview stays eager:** it is the first thing anyone sees who opens the page without an anchor. Lazy-loading it would only delay it.
    - **Keep `width`/`height` on every lazy image:** they reserve the space before the image loads. That way the jump to `#table-orders` lands in the right place and doesn't drift while nearby diagrams load.
verify:
  static_only: Jinja/HTML template fragment, no executable code
