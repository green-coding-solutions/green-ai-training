id: gen-1-00125-generation
category: generation
language: yaml
patterns:
- minimize-environments
messages:
- role: user
  content: |
    We build firmware-adjacent software for an IoT gateway: an MQTT bridge that collects readings from field sensors and forwards them to our cloud. I need a GitHub Actions workflow so every pull request gets its own test sandbox on our shared Kubernetes cluster. Requirements:

    - Helm chart is in `./deploy/chart`. Image is built earlier and pushed as `ghcr.io/acme/iot-gateway:<sha>`.
    - Sandbox = our gateway + a small MQTT broker + a device simulator that fakes sensors.
    - Namespace name should be `pr-<number>`.
    - Run `helm test` against it so reviewers see a pass/fail on the PR.
    - Kubeconfig is in the secret `SANDBOX_KUBECONFIG`.
    - PRs from forks should not get a sandbox.

    Thanks!
- role: assistant
  content: |
    ```yaml
    name: PR gateway sandbox

    on:
      pull_request:
        types: [opened, synchronize, reopened, closed]
      schedule:
        - cron: '17 3 * * *'   # nightly sweep of leftover sandboxes

    concurrency:
      group: sandbox-${{ github.event.number || 'sweep' }}
      cancel-in-progress: true

    env:
      NS: pr-${{ github.event.number }}

    jobs:
      deploy:
        if: >
          github.event_name == 'pull_request' &&
          github.event.action != 'closed' &&
          github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
          - uses: actions/checkout@v4

          - name: Configure kubectl
            run: |
              mkdir -p ~/.kube
              printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
              chmod 600 ~/.kube/config
            env:
              KUBECONFIG_DATA: ${{ secrets.SANDBOX_KUBECONFIG }}

          - name: Deploy sandbox
            run: |
              helm upgrade --install gateway ./deploy/chart \
                --namespace "$NS" --create-namespace \
                --atomic --timeout 5m \
                --set image.repository=ghcr.io/acme/iot-gateway \
                --set image.tag="${{ github.event.pull_request.head.sha }}" \
                --set simulator.devices=20 \
                --set broker.persistence.enabled=false \
                --set resources.requests.cpu=50m \
                --set resources.requests.memory=64Mi
              kubectl label namespace "$NS" \
                app.kubernetes.io/part-of=gateway-sandbox --overwrite

          - name: Run chart tests
            run: helm test gateway --namespace "$NS" --timeout 3m

      teardown:
        if: >
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
          - name: Configure kubectl
            run: |
              mkdir -p ~/.kube
              printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
              chmod 600 ~/.kube/config
            env:
              KUBECONFIG_DATA: ${{ secrets.SANDBOX_KUBECONFIG }}

          - name: Remove sandbox
            run: |
              helm uninstall gateway --namespace "$NS" --ignore-not-found || true
              kubectl delete namespace "$NS" --ignore-not-found --wait=false

      sweep:
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
          - name: Configure kubectl
            run: |
              mkdir -p ~/.kube
              printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
              chmod 600 ~/.kube/config
            env:
              KUBECONFIG_DATA: ${{ secrets.SANDBOX_KUBECONFIG }}

          - name: Delete sandboxes older than 48 hours
            run: |
              cutoff=$(date -u -d '48 hours ago' +%s)
              kubectl get ns -l app.kubernetes.io/part-of=gateway-sandbox -o json \
                | jq -r '.items[] | [.metadata.name, .metadata.creationTimestamp] | @tsv' \
                | while IFS=$'\t' read -r name created; do
                    if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then
                      kubectl delete namespace "$name" --wait=false
                    fi
                  done
    ```

    **Green Notes**
    - **Ephemeral sandbox per PR, removed on close** (reduces E and M): the `teardown` job deletes the namespace when the PR is merged or closed, so no test environment keeps running after its purpose is gone.
    - **Nightly sweep** (reduces E and M): sandboxes whose teardown failed or never ran are removed after 48 hours. Without this, orphaned namespaces tend to stay forever.
    - **Small footprint** (reduces M): 20 simulated devices, low resource requests and no persistent volume for the broker. The sandbox needs little capacity on the shared cluster, and nothing is left on disk after deletion.
    - **`concurrency` with `cancel-in-progress`**: a new push to the same PR cancels the older run, so you don't deploy and test a commit that is already outdated.

    *Not applied:* a sandbox for fork PRs, per your requirement. Also, any real hardware-in-the-loop rig should stay one shared instance and not be created per PR.

    Pattern: Minimize deployed environments
verify:
  static_only: GitHub Actions workflow needs GitHub, a Kubernetes cluster and Helm; cannot be executed in the stdlib sandbox
