messages:
- role: user
  content: |
    hi i am making website for my sister bakery. i take photos with my phone and they are very big (like 4000 px, 5 MB each) and the site is slow on mobile. i dont know what is wrong. can you write a python script I run on my laptop on a folder of photos so they are ready for the website? thank you
- role: assistant
  content: |
    The photos are probably too big in pixels and in bytes. This script makes smaller WebP copies in a few widths. You run it once on your laptop, and visitors only download the small files.

    ```python
    #!/usr/bin/env python3
    """Make web-ready WebP copies of photos. Needs: pip install pillow"""
    import argparse
    from pathlib import Path

    from PIL import Image, ImageOps

    WIDTHS = (480, 960, 1600)
    EXTENSIONS = {".jpg", ".jpeg", ".png"}


    def convert(src: Path, out_dir: Path, quality: int) -> int:
        written = 0
        with Image.open(src) as img:
            img = ImageOps.exif_transpose(img)  # fix phone photos that are rotated
            if img.mode == "P":
                img = img.convert("RGBA")
            elif img.mode not in ("RGB", "RGBA"):
                img = img.convert("RGB")

            # never make a photo bigger than it is
            widths = [w for w in WIDTHS if w <= img.width] or [img.width]
            for w in widths:
                dst = out_dir / f"{src.stem}-{w}.webp"
                if dst.exists() and dst.stat().st_mtime >= src.stat().st_mtime:
                    continue  # already done, skip
                h = round(img.height * w / img.width)
                img.resize((w, h), Image.LANCZOS).save(dst, "WEBP", quality=quality)
                written += 1
        return written


    def main() -> None:
        parser = argparse.ArgumentParser(description="Make web-ready WebP images")
        parser.add_argument("folder", type=Path, help="folder with original photos")
        parser.add_argument("-o", "--out", type=Path, default=Path("web-images"))
        parser.add_argument("-q", "--quality", type=int, default=80)
        args = parser.parse_args()

        args.out.mkdir(parents=True, exist_ok=True)
        total = 0
        for src in sorted(args.folder.iterdir()):
            if src.suffix.lower() in EXTENSIONS:
                total += convert(src, args.out, args.quality)
        print(f"Wrote {total} files to {args.out}")


    if __name__ == "__main__":
        main()
    ```

    Run it like this:

    ```bash
    python3 prepare_images.py ~/Pictures/bakery -o site/img
    ```

    In your HTML, let the browser pick the right size:

    ```html
    <img src="img/croissant-960.webp"
         srcset="img/croissant-480.webp 480w, img/croissant-960.webp 960w, img/croissant-1600.webp 1600w"
         sizes="(max-width: 600px) 100vw, 600px"
         width="960" height="640" loading="lazy" alt="Fresh croissants">
    ```

    **Green Notes**
    - **Modern format, WebP** (reduces network): a phone gets a much smaller file than the original JPEG. Almost all current browsers support WebP. Serve images in modern formats
    - **Convert once on your laptop, not per visit** (reduces E): encoding costs far more than decoding. In Green Metrics Tool micro-benchmarks, encoding 50 BMP images used ~290 J as WebP and ~658 J as AVIF. Doing it once at build time means visitors never pay this.
    - **Several widths with `srcset`** (reduces network): a phone loads the 480 px file, not a 4000 px one. This is probably the biggest cause of your slow page.
    - *Not applied:* AVIF. Files can be smaller, but encoding is much slower and the saving for a small bakery site is not worth it. The script also skips files that are already converted, so re-runs are fast.
