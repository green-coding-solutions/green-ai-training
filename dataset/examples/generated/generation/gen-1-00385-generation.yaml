    \ main\n\nimport (\n\t\"bufio\"\n\t\"encoding/json\"\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n\t\"strings\"\n)\n\ntype Line\
    \ struct {\n\tSKU string `json:\"sku\"`\n\tQty int    `json:\"qty\"`\n}\n\nfunc loadBanned(path string) (map[string]struct{},\
    \ error) {\n\tf, err := os.Open(path)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tdefer f.Close()\n\n\tset := make(map[string]struct{})\n\
    \tsc := bufio.NewScanner(f)\n\tfor sc.Scan() {\n\t\tif sku := strings.TrimSpace(sc.Text()); sku != \"\" {\n\t\t\tset[sku]\
    \ = struct{}{}\n\t\t}\n\t}\n\treturn set, sc.Err()\n}\n\nfunc filterHandler(banned map[string]struct{}) http.HandlerFunc\
    \ {\n\treturn func(w http.ResponseWriter, r *http.Request) {\n\t\tvar lines []Line\n\t\tif err := json.NewDecoder(r.Body).Decode(&lines);\
    \ err != nil {\n\t\t\thttp.Error(w, \"invalid JSON\", http.StatusBadRequest)\n\t\t\treturn\n\t\t}\n\n\t\tkept := make([]Line,\
    \ 0, len(lines))\n\t\tfor _, l := range lines {\n\t\t\tif _, isBanned := banned[l.SKU]; !isBanned {\n\t\t\t\tkept = append(kept,\
    \ l)\n\t\t\t}\n\t\t}\n\n\t\tw.Header().Set(\"Content-Type\", \"application/json\")\n\t\tjson.NewEncoder(w).Encode(kept)\n\
    \t}\n}\n\nfunc main() {\n\tbanned, err := loadBanned(\"banned.txt\")\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\t\
    mux := http.NewServeMux()\n\tmux.HandleFunc(\"POST /orders/filter\", filterHandler(banned))\n\tlog.Fatal(http.ListenAndServe(\"\
    :8080\", mux))\n}\n```\n\nThe map is only read after startup, so it is safe to share between requests. If the file must\
    \ reload while the server runs, build a new map and swap it in with `atomic.Pointer`. Do not write to the shared map.\n\
    \n**Green Notes**\n- **Set for repeated lookups** (reduces E): each order line costs one hash lookup instead of a scan\
    \ over up to 30k SKUs. A scan would run on every line of every request, so the cost would be lines × 30k.\n- **Build once,\
    \ not per request:** the file is read and the set is built at startup. Building the set inside the handler would repeat\
    \ that O(n) work on every request.\n- **Preallocated result slice:** `make([]Line, 0, len(lines))` avoids repeated growth\
    \ while appending.\n- *Not applied:* a set only pays off when you look up many times. For a single check against a small\
