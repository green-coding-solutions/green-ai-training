  content: |
    Need `debye_length(te_ev, ne)` in plasma_utils.py. Te in eV, ne in m^-3, SI result. It will get whole radial profiles (a few 1000 points per shot), not single values. Header is below, don't touch it. Diff only.

    ```python
    """plasma_utils.py: helpers for profile post-processing."""
    from scipy.constants import *
    import numpy as np


    def plasma_frequency(ne):
        ne = np.asarray(ne, dtype=float)
        return np.sqrt(ne * e**2 / (epsilon_0 * m_e))
    ```
- role: assistant
  content: |
    ```python
    def debye_length(te_ev, ne):
        """Electron Debye length in m. te_ev in eV, ne in m^-3. Scalars or arrays."""
        te_ev = np.asarray(te_ev, dtype=float)
        ne = np.asarray(ne, dtype=float)
        # k*Te = Te[eV] * e, so one factor of e cancels
        return np.sqrt(epsilon_0 * te_ev / (ne * e))
    ```

    **Green Notes**
    - **Vectorized with NumPy** (reduces E): the whole profile is computed in a few array operations, not one Python-level call per point.
    - **Star import left as is:** in Green Metrics Tool micro-benchmarks, `from x import *` and `import x` showed no measurable energy difference. The new function uses `epsilon_0` and `e` from it, same as `plasma_frequency`.
    - `ne == 0` gives `inf` and a NumPy warning. Mask those points first if your profiles reach the edge.
