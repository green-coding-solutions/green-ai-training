id: gen-1-00149-generation
category: generation
language: python
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    py func: requests per minute for a plan tier (free/pro/business/enterprise), used in our FastAPI rate limit middleware
- role: assistant
  content: |
    ```python
    PLAN_LIMITS = {
        "free": 60,
        "pro": 600,
        "business": 3000,
        "enterprise": 10000,
    }
    DEFAULT_LIMIT = PLAN_LIMITS["free"]


    def requests_per_minute(plan: str) -> int:
        """Return the per-minute request limit for a plan. Unknown plans get the free limit."""
        return PLAN_LIMITS.get(plan, DEFAULT_LIMIT)
    ```

    Change the numbers to your real limits. Use it in the middleware like `limit = requests_per_minute(user.plan)`.

    **Green Notes**
    - **Dict lookup instead of an `if/elif` chain** (reduces E): the middleware runs on every request, and a plain equality lookup is the cheapest way to dispatch. In Green Metrics Tool micro-benchmarks (10,000,000 classifications), simple equality branches used about 16% less CPU energy than complex range/modulo conditions. The lookup also stays the same cost when you add more tiers.
    - **One default in one place:** unknown or missing plans fall back to the free limit, so a new tier can't leave requests without a limit.
    - *Not applied:* `match`/`case`. With the same equality checks it showed no meaningful energy difference to `if/elif`, so the dict is chosen for clarity.
verify:
  module: true
  test: |-
    assert requests_per_minute("free") == 60
    assert requests_per_minute("pro") == 600
    assert requests_per_minute("business") == 3000
    assert requests_per_minute("enterprise") == 10000
    assert requests_per_minute("trial") == 60
    assert requests_per_minute("") == 60
