    Here is `gateway.css` for that page.

    ```css
    :root {
      --bg: #f4f5f7;
      --fg: #1c2330;
      --card: #fff;
      --line: #d9dde3;
      --accent: #0b6bcb;
      --ok: #1a7f37;
      --warn: #9a6700;
      --err: #cf222e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, sans-serif;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--fg);
      color: #fff;
    }

    .top h1 { margin: 0; font-size: 1.1rem; }

    main { max-width: 48rem; margin: 1rem auto; padding: 0 1rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .card h2 { margin: 0 0 0.5rem; font-size: 1rem; }

    .sensors { width: 100%; border-collapse: collapse; }

    .sensors th,
    .sensors td {
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .badge {
      display: inline-block;
      padding: 0 0.5rem;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #fff;
    }

    .badge-ok { background: var(--ok); }
    .badge-warn { background: var(--warn); }
    .badge-err { background: var(--err); }

    .form { display: grid; gap: 0.75rem; max-width: 20rem; }
    .form label { display: grid; gap: 0.25rem; }
    .form input { padding: 0.4rem; border: 1px solid var(--line); border-radius: 4px; font: inherit; }

    .btn {
      padding: 0.5rem 1rem;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    @media (max-width: 30rem) {
      .sensors th:nth-child(3),
      .sensors td:nth-child(3) { display: none; }
    }
    ```

    Keep this file as the readable source. If the device has tight flash, or users reach it over a slow LTE link, add one build step and ship the output:

    ```bash
    npx esbuild gateway.css --minify --outfile=gateway.min.css
    ```

    Then point the `<link>` at `/gateway.min.css`.

    **Green Notes**
    - **Minify assets** (reduces network, storage): minifying saves bytes on the wire and in flash, not CPU. In Green Metrics Tool micro-benchmarks of a small page, a minified build used about 2% less client energy than the unminified sources, which is within measurement noise. For a stylesheet this small it is a Low-priority step.
    - **No dead rules**: every selector matches the markup you sent, so there is nothing to purge. Remove rules when the page changes.
    - **Nothing else to add**: a single small CSS file and a system font stack need no extra requests.
