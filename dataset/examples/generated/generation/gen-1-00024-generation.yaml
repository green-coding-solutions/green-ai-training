- role: assistant
  content: |
    I read this as: fill in the speakers section. Here it is with the first three speakers. Repeat the `<li>` for the other 15.

    ```html
    <header class="hero">
      <img src="/img/devsummit-stage.jpg" alt="Main stage at DevSummit 2026"
           width="1600" height="700" fetchpriority="high">
      <h1>DevSummit 2026</h1>
      <a class="btn" href="/tickets">Get tickets</a>
    </header>

    <main>
      <section id="about">...</section>

      <section id="speakers">
        <h2>Speakers</h2>
        <ul class="speaker-grid">
          <li>
            <img src="/img/speakers/ana-lopez.jpg" alt="Ana Lopez"
                 width="320" height="320" loading="lazy" decoding="async">
            <h3>Ana Lopez</h3>
            <p>Talk title here</p>
          </li>
          <li>
            <img src="/img/speakers/ben-okafor.jpg" alt="Ben Okafor"
                 width="320" height="320" loading="lazy" decoding="async">
            <h3>Ben Okafor</h3>
            <p>Talk title here</p>
          </li>
          <li>
            <img src="/img/speakers/chen-wei.jpg" alt="Chen Wei"
                 width="320" height="320" loading="lazy" decoding="async">
            <h3>Chen Wei</h3>
            <p>Talk title here</p>
          </li>
          <!-- 15 more -->
        </ul>
      </section>

      <section id="venue">...</section>
    </main>
    ```

    ```css
    .speaker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      list-style: none;
      padding: 0;
    }
    .speaker-grid img {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
    }
    ```

    **Green Notes**
    - **Defer offscreen images** (reduces network, E): the 18 speaker photos sit below the fold, so `loading="lazy"` makes the browser fetch them only when the visitor scrolls near them. Visitors who leave after the hero never download them.
    - **Hero stays eager:** the stage photo is visible on load, so it has no `loading="lazy"`. `fetchpriority="high"` loads it first.
    - **`width` and `height` on every image:** the browser reserves the space before the image arrives, so the page does not jump when photos load.

    *Not applied:* modern image formats. I don't know what your build produces, so I kept your `.jpg` files. If you add WebP or AVIF later, encode them once at build time.
verify:
  static_only: Plain HTML/CSS markup; there is no runtime to execute and nothing to test beyond the static output.
