id: gen-2-00227-generation
category: generation
language: python
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    hello, i work on climate station data (daily temperature, ~2000 stations, 1950-2020). I need a python funtion that give me the meteorological season for a date: "DJF", "MAM", "JJA", "SON".

    important: december belong to the winter of the next year. so DJF 1990 is dec 1989 + jan 1990 + feb 1990. the function should return season and the season year.

    my colleage did it with day of year and a leap year check like `if year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)`, then ranges like `60 <= doy < 152` (and other numbers for leap years). it is very long and i am not sure it is correct. it run for every daily value so it should be fast. input is a `datetime.date`.
- role: assistant
  content: |
    `date.month` already accounts for leap years, so you don't need the day of year at all:

    ```python
    from datetime import date

    # Index = month number (1-12). Index 0 is unused.
    _SEASON_BY_MONTH = (
        None,
        "DJF", "DJF",          # Jan, Feb
        "MAM", "MAM", "MAM",   # Mar, Apr, May
        "JJA", "JJA", "JJA",   # Jun, Jul, Aug
        "SON", "SON", "SON",   # Sep, Oct, Nov
        "DJF",                 # Dec
    )


    def season(d: date) -> tuple[str, int]:
        """Return (meteorological season, season year) for a date.

        December belongs to the winter of the following year:
        DJF 1990 = Dec 1989 + Jan 1990 + Feb 1990.
        """
        month = d.month
        if month == 12:
            return "DJF", d.year + 1
        return _SEASON_BY_MONTH[month], d.year
    ```

    Example: `season(date(1989, 12, 31))` returns `("DJF", 1990)`, and `season(date(1992, 2, 29))` returns `("DJF", 1992)`. It also works for `datetime` and pandas `Timestamp` values, because they have `.month` and `.year` too.

    **Green Notes**
    - **Simple equality instead of range and modulo checks** (reduces E): each daily value costs one comparison and one tuple index. The old version ran the leap-year modulo tests and several day-of-year range checks per value. In Green Metrics Tool micro-benchmarks with 10,000,000 classifications, simple equality branches used about 16% less CPU energy than complex range/modulo conditions.
    - **Fewer edge cases:** there are no day-of-year boundaries to shift in leap years, so 29 February and 1 March can't land in the wrong season.
    - *Not applied:* rewriting it as `match`. In the same benchmark, `match` and `if/elif` with the same conditions differed by about 1%, which is noise.
verify:
  test: |-
    from datetime import date, datetime
    assert season(date(1989, 12, 1)) == ("DJF", 1990)
    assert season(date(1989, 12, 31)) == ("DJF", 1990)
    assert season(date(1990, 1, 1)) == ("DJF", 1990)
    assert season(date(1992, 2, 29)) == ("DJF", 1992)
    assert season(date(1992, 3, 1)) == ("MAM", 1992)
    assert season(date(1900, 3, 1)) == ("MAM", 1900)
    assert season(date(2000, 5, 31)) == ("MAM", 2000)
    assert season(date(2000, 6, 1)) == ("JJA", 2000)
    assert season(date(1990, 8, 31)) == ("JJA", 1990)
    assert season(date(1990, 9, 1)) == ("SON", 1990)
    assert season(date(1990, 11, 30)) == ("SON", 1990)
    assert season(datetime(2020, 12, 15, 6, 0)) == ("DJF", 2021)
