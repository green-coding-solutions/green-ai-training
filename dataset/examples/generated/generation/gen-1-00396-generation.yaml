    ```python
    from fastapi import FastAPI
    from fastapi.responses import HTMLResponse
    from starlette.middleware.gzip import GZipMiddleware

    app = FastAPI()

    # Compress only responses of 1 KB or more, at a moderate level.
    app.add_middleware(GZipMiddleware, minimum_size=1024, compresslevel=5)

    INDEX_HTML = """<!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Acme</title>
      <script type="module" src="/static/app.js"></script>
    </head>
    <body>
      <h1>Acme</h1>
      <div id="pricing"></div>
    </body>
    </html>"""

    PLANS = [
        {"name": "Free", "price": 0, "features": ["1 project", "community support"]},
        {"name": "Team", "price": 29, "features": ["10 projects", "email support"]},
        {"name": "Business", "price": 99, "features": ["unlimited projects", "SSO"]},
    ]


    @app.get("/", response_class=HTMLResponse)
    def index():
        return INDEX_HTML


    @app.get("/api/pricing")
    def pricing():
        return PLANS
    ```

    **Green Notes**
    - **Text compression** (reduces network): HTML and JSON compress well, so every visitor downloads far fewer bytes. Enable text compression
    - **Level 5 instead of Starlette's default 9** (reduces E): these responses are compressed on every request, so CPU cost counts. In Green Metrics Tool micro-benchmarks on 100 MB of text, gzip at its default level used ~67 J and brotli at quality 11 used ~3019 J. That is why this code does not use heavy codecs for dynamic responses.
    - **`minimum_size=1024`**: tiny responses are not worth the CPU or the header overhead.
    - *Not applied:* Brotli on the fly. For static files like the JS bundle, pre-compress once at build time (or let your CDN or reverse proxy do it). Also, this middleware does not skip images, so do not serve JPEG, PNG or WebP through the app, because they are already compressed.
