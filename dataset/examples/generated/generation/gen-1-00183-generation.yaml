id: gen-1-00183-generation
category: generation
language: html
patterns:
- remove-unused-css
facts:
- F-UNUSED-CSS
messages:
- role: user
  content: |
    hi, I made a small REST API with FastAPI for a todo list. GET /api/todos gives back a list like [{"id": 1, "title": "buy milk", "done": false}] and POST /api/todos takes {"title": "..."}. now I need one index.html that shows the todos and has a field to add a new one. I never did frontend and I dont know css at all, I just want it to look ok. is there something I should watch out for?
- role: assistant
  content: |
    One thing to watch: put todo titles into the page with `textContent`, never `innerHTML`. Titles come from users, so `innerHTML` would let someone inject a script.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Todos</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
        form { display: flex; gap: .5rem; }
        input { flex: 1; padding: .4rem; }
        button { padding: .4rem .8rem; }
        li.done { text-decoration: line-through; color: #666; }
        #error { color: #b00020; }
      </style>
    </head>
    <body>
      <h1>Todos</h1>

      <form id="add">
        <input id="title" required maxlength="200" placeholder="New todo" aria-label="New todo">
        <button type="submit">Add</button>
      </form>
      <p id="error" role="alert"></p>
      <ul id="list"></ul>

      <script>
        const list = document.getElementById('list');
        const error = document.getElementById('error');
        const input = document.getElementById('title');

        function render(todos) {
          list.replaceChildren(...todos.map((t) => {
            const li = document.createElement('li');
            li.textContent = t.title;
            if (t.done) li.className = 'done';
            return li;
          }));
        }

        async function load() {
          try {
            const res = await fetch('/api/todos');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            render(await res.json());
            error.textContent = '';
          } catch (e) {
            error.textContent = 'Could not load todos.';
          }
        }

        document.getElementById('add').addEventListener('submit', async (ev) => {
          ev.preventDefault();
          try {
            const res = await fetch('/api/todos', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: input.value.trim() }),
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            input.value = '';
            await load();
          } catch (e) {
            error.textContent = 'Could not add the todo.';
          }
        });

        load();
      </script>
    </body>
    </html>
    ```

    Serve it as a static file, for example with `StaticFiles` in FastAPI. It uses the same origin as the API, so you need no CORS setup.

    **Green Notes**
    - **Only the CSS this page uses** (reduces network): the style block has 7 rules and every one matches an element on the page. No framework or copied template stylesheet is needed. In Green Metrics Tool micro-benchmarks, purging a 16 KB stylesheet to 0.75 KB changed client CPU energy by only about 2%, which is within noise. The gain is fewer bytes on real networks, not less CPU. If you add more pages later, keep the same habit: write the rules a page needs, and don't start from a big template.
    - *Not applied:* PurgeCSS or a minify step. For 7 rules, a build step costs more than it saves.
verify:
  static_only: HTML page with inline browser JavaScript and a fetch API; needs a browser and a running backend
