    html for the "our build farm" section on the infra team page. photo is rack.jpg 3200x2133, full width, old browsers must still work
- role: assistant
  content: |
    ```html
    <section class="build-farm">
      <h2>Our build farm</h2>
      <figure>
        <picture>
          <source srcset="/img/rack.avif" type="image/avif">
          <source srcset="/img/rack.webp" type="image/webp">
          <img src="/img/rack.jpg"
               alt="Rack of CI build machines in the server room"
               width="3200" height="2133"
               style="width: 100%; height: auto;">
        </picture>
        <figcaption>The machines that run our pipelines.</figcaption>
      </figure>
    </section>
    ```

    Create the extra files once in your build step, not per request:

    ```bash
    avifenc -q 60 rack.jpg rack.avif
    cwebp -q 80 rack.jpg -o rack.webp
    ```

    **Green Notes**
    - **Modern formats with a JPEG fallback** (reduces network): a photo is mostly bytes, and AVIF or WebP files are usually much smaller than the JPEG. Old browsers ignore the `<source>` tags and load `rack.jpg`.
    - **Encode at build time** (reduces E): in Green Metrics Tool micro-benchmarks, encoding AVIF cost about 7× the energy of encoding JPG. Do it once in CI, never on each request.
    - **Decode cost is small** (E, client): AVIF decoding used about 19% more CPU energy than JPG in the same benchmarks, so the gain is the transferred bytes. The `width` and `height` attributes reserve the space, so the layout does not jump.

    *Not applied:* lazy loading. I don't know where this section sits on the page, and an image above the fold must never be lazy.
