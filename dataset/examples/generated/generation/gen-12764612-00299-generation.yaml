    **Green Notes**
    - **System font stacks** (reduces E): no font files are downloaded or decoded, so there are no extra requests and no font loading step before text shows. In Green Metrics Tool micro-benchmarks (30 cold page loads), the system font stack used about 26% less client CPU energy than six local TTF files, and about 16% less than two Latin-subset WOFF2 files.
    - **Weights 500 and 600:** the system fonts have real bold and semi-bold faces, so `font-weight: 600` and `700` work without extra files.
    - *Not applied:* custom web fonts. If the brand needs Inter, use one or two WOFF2 Latin subsets with `font-display: swap`. In the same benchmark, small WOFF2 subsets used about 12% less than the TTF set. Do not ship the TTF files.
