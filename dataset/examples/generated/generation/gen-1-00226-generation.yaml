messages:
- role: user
  content: |
    html for our weekly infra review page. topology diagram on top, then 8 grafana panel screenshots (png) in a grid
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Weekly infra review</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1200px; padding: 1rem; }
        img { max-width: 100%; height: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
        figure { margin: 0; }
        figcaption { font-size: 0.9rem; color: #555; }
      </style>
    </head>
    <body>
      <h1>Weekly infra review</h1>

      <figure>
        <img src="img/topology.png" width="1200" height="675" alt="Cluster topology diagram">
        <figcaption>Cluster topology</figcaption>
      </figure>

      <h2>Grafana panels</h2>
      <div class="grid">
        <figure>
          <img src="panels/cpu.png" width="800" height="450" loading="lazy" alt="CPU usage per node">
          <figcaption>CPU usage per node</figcaption>
        </figure>
        <figure>
          <img src="panels/memory.png" width="800" height="450" loading="lazy" alt="Memory usage per node">
          <figcaption>Memory usage per node</figcaption>
        </figure>
        <figure>
          <img src="panels/disk-io.png" width="800" height="450" loading="lazy" alt="Disk I/O">
          <figcaption>Disk I/O</figcaption>
        </figure>
        <figure>
          <img src="panels/network.png" width="800" height="450" loading="lazy" alt="Network throughput">
          <figcaption>Network throughput</figcaption>
        </figure>
        <figure>
          <img src="panels/pods.png" width="800" height="450" loading="lazy" alt="Pod restarts">
          <figcaption>Pod restarts</figcaption>
        </figure>
        <figure>
          <img src="panels/latency.png" width="800" height="450" loading="lazy" alt="Request latency p95">
          <figcaption>Request latency p95</figcaption>
        </figure>
        <figure>
          <img src="panels/errors.png" width="800" height="450" loading="lazy" alt="Error rate">
          <figcaption>Error rate</figcaption>
        </figure>
        <figure>
          <img src="panels/cost.png" width="800" height="450" loading="lazy" alt="Cloud cost per day">
          <figcaption>Cloud cost per day</figcaption>
        </figure>
      </div>
    </body>
    </html>
    ```

    **Green Notes**
    - **Lazy loading below the fold** (reduces network, E): the 8 panel screenshots have `loading="lazy"`, so the browser fetches them only when a reader scrolls near them. In Green Metrics Tool micro-benchmarks of an article with 15 photos, this used about 12% less CPU energy on page loads without scrolling. When visitors scrolled to the end, there was no difference. The saving depends on how far people scroll.
    - **Topology diagram stays eager:** it is the image above the fold. Lazy-loading it would delay the first thing people look at.
    - **`width` and `height` on every image** reserve the space, so the layout does not jump when a lazy image arrives.
