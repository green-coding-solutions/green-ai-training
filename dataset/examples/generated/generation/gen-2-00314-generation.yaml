id: gen-2-00314-generation
category: generation
language: css
patterns:
- remove-unused-css
facts:
- F-UNUSED-CSS
messages:
- role: user
  content: |
    New page in logpipe's web UI: `/ingest/errors` lists parse failures from the ingest workers. It's a standalone template and right now it links `vendor/adminkit.min.css` (~90 KB, whole admin theme) like the old pages do. I want it on its own small stylesheet. Write `static/css/ingest-errors.css` and the head change. Diff only, no tour.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Parse failures · logpipe</title>
      <link rel="stylesheet" href="/static/vendor/adminkit.min.css">
    </head>
    <body>
      <header class="topbar">
        <span class="brand">logpipe</span>
        <nav>
          <a href="/ingest">Ingest</a>
          <a href="/ingest/errors" aria-current="page">Parse failures</a>
        </nav>
      </header>
      <main>
        <form class="filters" method="get">
          <select name="source">
            <option value="">All sources</option>
            {% for s in sources %}<option value="{{ s }}" {% if s == source %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
          <input type="search" name="q" value="{{ q }}" placeholder="Filter error message">
          <button type="submit">Apply</button>
        </form>
        <table class="failures">
          <thead>
            <tr><th>Time</th><th>Source</th><th>Worker</th><th>Error</th><th>Raw line</th></tr>
          </thead>
          <tbody>
            {% for f in failures %}
            <tr class="sev-{{ f.severity }}">
              <td><time datetime="{{ f.ts.isoformat() }}">{{ f.ts.strftime('%H:%M:%S') }}</time></td>
              <td>{{ f.source }}</td>
              <td>{{ f.worker }}</td>
              <td class="err">{{ f.error }}</td>
              <td><code class="raw">{{ f.raw }}</code></td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
        <nav class="pager">
          {% if page > 1 %}<a href="?page={{ page - 1 }}&q={{ q }}&source={{ source }}">‹ Prev</a>{% endif %}
          <span>Page {{ page }}</span>
          {% if has_next %}<a href="?page={{ page + 1 }}&q={{ q }}&source={{ source }}">Next ›</a>{% endif %}
        </nav>
      </main>
    </body>
    </html>
    ```

    `f.severity` is `warn` or `error`.
- role: assistant
  content: |
    `ingest-errors.html`, replace the adminkit link:

    ```html
    <link rel="stylesheet" href="/static/css/ingest-errors.css">
    ```

    New `static/css/ingest-errors.css`:

    ```css
    :root {
      --fg: #1d2330;
      --muted: #5d6677;
      --line: #dde1e8;
      --row-alt: #f6f7f9;
      --warn: #b7791f;
      --error: #c53030;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0.6rem 1rem;
      background: var(--fg);
      color: #fff;
    }
    .topbar .brand { font-weight: 600; }
    .topbar nav { display: flex; gap: 1rem; }
    .topbar a { color: #c9d1e0; text-decoration: none; }
    .topbar a[aria-current="page"] { color: #fff; border-bottom: 2px solid currentColor; }

    main { padding: 1rem; }

    .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .filters select,
    .filters input,
    .filters button { font: inherit; padding: 0.3rem 0.5rem; }
    .filters input[type="search"] { flex: 1; max-width: 28rem; }

    .failures { width: 100%; border-collapse: collapse; }
    .failures th,
    .failures td {
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .failures th {
      position: sticky;
      top: 0;
      background: #fff;
      color: var(--muted);
      font-weight: 600;
    }
    .failures tbody tr:nth-child(even) { background: var(--row-alt); }
    .failures tr.sev-warn td:first-child { box-shadow: inset 3px 0 var(--warn); }
    .failures tr.sev-error td:first-child { box-shadow: inset 3px 0 var(--error); }
    .failures tr.sev-error .err { color: var(--error); }
    .failures time { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .raw {
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .pager { display: flex; align-items: center; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem; }
    .pager a {
      padding: 0.2rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: inherit;
      text-decoration: none;
    }
    .pager span { color: var(--muted); }
    ```

    **Green Notes**
    - **Only the rules this page uses** (reduces network): the page no longer downloads the whole admin theme. In Green Metrics Tool measurements over 50 cold page loads, purging a 16 KB stylesheet to 0.75 KB changed client CPU energy by about 2%, which is within noise. So the gain is fewer bytes on each cold load, not CPU. If people always arrive from other logpipe pages, the theme is probably cached already, and the saving is mostly on first visits.
verify:
  static_only: CSS and a Jinja HTML template, nothing to execute
