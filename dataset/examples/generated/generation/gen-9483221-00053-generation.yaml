- role: user
  content: |
    ensemble.css for the static catalog page our lattice QCD group publishes after each gauge ensemble run. Markup: h1/h2/h3, one `table.ens` (columns: ensemble id, beta, L^3xT, trajectories, plaquette), `code` for config paths, `figure.plot` with img + figcaption. Numeric columns right-aligned. Max width ~60rem, light theme. No explanations, just the file.
- role: assistant
  content: |
    ```css
    :root {
      --fg: #1b1f24;
      --muted: #59636e;
      --line: #d1d9e0;
      --bg-alt: #f6f8fa;
    }

    body {
      margin: 0 auto;
      max-width: 60rem;
      padding: 2rem 1.25rem;
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
    }

    h1, h2, h3 { line-height: 1.25; margin: 1.8em 0 0.5em; }
    h1 { font-size: 1.8rem; margin-top: 0; }
    h2 { font-size: 1.35rem; border-bottom: 1px solid var(--line); padding-bottom: 0.25em; }
    h3 { font-size: 1.1rem; }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: var(--bg-alt);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }

    table.ens {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    table.ens th,
    table.ens td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--line);
      text-align: right;
    }
    table.ens th:first-child,
    table.ens td:first-child { text-align: left; }
    table.ens thead th { background: var(--bg-alt); }

    figure.plot { margin: 1.5rem 0; }
    figure.plot img { max-width: 100%; height: auto; }
    figure.plot figcaption { color: var(--muted); font-size: 0.9rem; margin-top: 0.4rem; }
    ```

    **Green Notes**
    - **System font stack** (reduces network and E): no `@font-face` files to download or decode, so a first-time visit has nothing extra to fetch. In Green Metrics Tool browser benchmarks, the system font stack used ~410 J for 30 cold page loads. Six TTF files used ~556 J (about 26% less), and two Latin WOFF2 subsets used ~488 J.
    - If a brand font is required later, use a few WOFF2 subsets, not full TTF sets.
