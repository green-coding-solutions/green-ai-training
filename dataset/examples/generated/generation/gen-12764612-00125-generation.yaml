messages:
- role: user
  content: |
    flask shop, need sitemap.xml from rows of (slug, updated_at), lots of products
- role: assistant
  content: |
    ```python
    from urllib.parse import quote
    from xml.sax.saxutils import escape

    BASE_URL = "https://shop.example.com"


    def build_sitemap(rows):
        """rows: iterable of (slug, updated_at) where updated_at is a date or datetime."""
        parts = [
            '<?xml version="1.0" encoding="UTF-8"?>\n'
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
        ]
        for slug, updated_at in rows:
            loc = escape(f"{BASE_URL}/p/{quote(slug)}")
            parts.append(
                f"<url><loc>{loc}</loc><lastmod>{updated_at:%Y-%m-%d}</lastmod></url>\n"
            )
        parts.append("</urlset>\n")
        return "".join(parts)
    ```

    In your view, return it with `Response(build_sitemap(rows), mimetype="application/xml")`. Slugs are URL-quoted and XML-escaped, so a slug with `&` or a space won't break the file.

    **Green Notes**
    - **String join** (reduces E): each entry goes into a list and one `"".join()` builds the result. Repeated `+=` copies the growing string again and again. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J with `+=` and ~1.8 J with `join`, roughly 260× less CPU energy. An f-string per piece is fine here. Gluing pieces together with f-strings in a loop behaves like `+=`.
verify:
  test: |-
    import datetime
    out = build_sitemap([("a b", datetime.date(2026, 1, 2)), ("x&y", datetime.datetime(2026, 3, 4, 5, 6))])
    assert out.startswith('<?xml version="1.0" encoding="UTF-8"?>\n<urlset')
    assert "<loc>https://shop.example.com/p/a%20b</loc><lastmod>2026-01-02</lastmod>" in out
    assert "<loc>https://shop.example.com/p/x%26y</loc><lastmod>2026-03-04</lastmod>" in out
    assert out.endswith("</urlset>\n")
    assert build_sitemap([]).count("<url>") == 0
