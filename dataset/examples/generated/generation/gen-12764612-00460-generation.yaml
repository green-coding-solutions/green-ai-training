messages:
- role: user
  content: |
    hi, im beginner with web. on my landing page the big headline says "Ship your app faster". I want the word "faster" to change every few seconds to "safer" and then "cheaper", like a little slide effect. I dont know how to do it, tutorial I found use javascript with setInterval. is there easy way? I only know a little html and css
- role: assistant
  content: |-
    Yes, you don't need JavaScript for this. Put all three words in the HTML and let CSS show one at a time.

    ```html
    <h1>
      Ship your app
      <span class="rotator" aria-label="faster, safer or cheaper">
        <span aria-hidden="true">faster</span>
        <span aria-hidden="true">safer</span>
        <span aria-hidden="true">cheaper</span>
      </span>
    </h1>
    ```

    ```css
    .rotator {
      display: inline-grid;      /* all words share one cell, width of the longest */
      vertical-align: bottom;
      overflow: hidden;
    }

    .rotator > span {
      grid-area: 1 / 1;
      opacity: 0;
      transform: translateY(0.5em);
      animation: word-cycle 9s infinite;
    }

    .rotator > span:nth-child(2) { animation-delay: 3s; }
    .rotator > span:nth-child(3) { animation-delay: 6s; }

    @keyframes word-cycle {
      0%        { opacity: 0; transform: translateY(0.5em); }
      5%, 28%   { opacity: 1; transform: translateY(0); }
      33%, 100% { opacity: 0; transform: translateY(-0.5em); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rotator > span { animation: none; }
      .rotator > span:first-child { opacity: 1; transform: none; }
    }
    ```

    Each word gets 3 seconds, so the full loop is 9 seconds. To change the speed, change `9s` and the two delays together (delay = loop time ÷ 3).

    The `@media` block is for visitors who turned off animations in their system settings. They see "faster" only.

    **Green Notes**
    - **CSS keyframes instead of JS-driven animation** (reduces E): the browser runs the whole loop itself, and your page needs no `setInterval` timer or script that keeps waking up. In Green Metrics Tool browser micro-benchmarks, a 20-second animation driven by JavaScript `requestAnimationFrame` used ~161 J CPU energy and the same animation with CSS `@keyframes` used ~145 J, about 10% less. That test used `requestAnimationFrame`, but a timer-driven script also has to run code on every change.
    - **Only `opacity` and `transform` are animated**: the words don't change the layout of the headline, so nothing else on the page has to be re-measured on each step.
