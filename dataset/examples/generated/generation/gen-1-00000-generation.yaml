id: gen-1-00000-generation
category: generation
language: bash
patterns:
- bash-quoting
- bash-builtins
facts:
- F-BASH-QUOTES
- F-BASH-SUBPROC
messages:
- role: user
  content: |
    bash script: run ./classify on every jpg in a folder, write label and score to a csv
- role: assistant
  content: |
    This assumes `./classify FILE` prints `label,score` on one line and exits non-zero on failure.

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail

    dir=${1:?'usage: classify_dir.sh DIR [OUT_CSV]'}
    out=${2:-results.csv}

    printf '%s\n' 'file,label,score' > "$out"

    ok=0
    failed=0
    for img in "$dir"/*.jpg; do
      [[ -e $img ]] || continue
      name=${img##*/}
      if result=$(./classify "$img"); then
        printf '%s,%s\n' "$name" "$result" >> "$out"
        ok=$((ok + 1))
      else
        printf 'skip: %s\n' "$name" >&2
        failed=$((failed + 1))
      fi
    done

    printf 'done: %d ok, %d failed\n' "$ok" "$failed"
    ```

    **Green Notes**
    - **Single quotes for literals** (reduces E): every string without expansion (`'file,label,score'`, `'%s\n'`, the usage text) uses single quotes. Variables stay in double quotes. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop with 1,000,000 iterations used about 24% less CPU energy with single quotes. For short strings like these, the saving is tiny. It is free, though.
    - **Builtins instead of subprocesses** (reduces E): `${img##*/}` and `$(( ))` replace `$(basename ...)` and `$(expr ...)`. That is two fewer process starts per image, and process starts dominate shell loops.
    - `[[ -e $img ]]` skips the case where no jpg matches and the glob stays literal.
verify:
  static_only: bash script that needs an external ./classify program
