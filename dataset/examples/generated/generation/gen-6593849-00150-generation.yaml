    Here are the styles for the `<style>` block. They match your markup and use a system font stack, so the page needs no font files:

    ```css
    :root {
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --text: #1f2933;
      --muted: #52606d;
      --accent: #0b6e8a;
      --accent-dark: #084f63;
      --bg: #ffffff;
      --bg-soft: #f2f7f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1.0625rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    h1, h2, h3 {
      line-height: 1.2;
      font-weight: 700;
    }

    a { color: var(--accent); }

    .site-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #d9e2ec;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
    }

    .site-header nav a {
      margin-left: 1.25rem;
      text-decoration: none;
      font-weight: 600;
    }

    .hero {
      max-width: 42rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 3rem;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      margin: 0 0 1rem;
    }

    .lead {
      font-size: 1.2rem;
      color: var(--muted);
      margin: 0 0 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 0.5rem;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .btn:hover,
    .btn:focus-visible {
      background: var(--accent-dark);
    }

    .courses {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 1.25rem;
      max-width: 56rem;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .courses h2 {
      grid-column: 1 / -1;
      margin: 0;
    }

    .card {
      padding: 1.25rem;
      background: var(--bg-soft);
      border-radius: 0.75rem;
    }

    .card h3 { margin: 0 0 0.5rem; }
    .card p { margin: 0 0 0.5rem; }

    .price {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .site-footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      border-top: 1px solid #d9e2ec;
    }

    code {
      font-family: var(--font-mono);
      font-size: 0.9em;
    }
    ```

    **Green Notes**
    - **System font stack** (reduces E, network): no font files to download, parse or swap in, and no flash of unstyled text. In Green Metrics Tool page-load measurements (cold loads), a system font stack used about 26% less client CPU energy than six local TTF files and about 16% less than two Latin-subset WOFF2 files.
    - *Not applied:* a custom web font. If the brand needs a specific typeface, use one or two WOFF2 Latin subsets with `font-display: swap` instead of full TTF families.
