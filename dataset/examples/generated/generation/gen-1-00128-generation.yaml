messages:
- role: user
  content: |
    Need base.css for the static HTML report that `simrun` writes after each CFD parameter sweep. Content: h1/h2 headings, a summary table of residuals and run times (lots of numbers), figure + caption with inline SVG convergence plots, `<pre>` blocks for solver logs, inline `<code>` for case names. It's opened from a shared drive, often by the whole group after a nightly sweep. Just the CSS, no walkthrough.
- role: assistant
  content: |
    ```css
    :root {
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --fg: #1b1f24;
      --muted: #5b6470;
      --bg: #ffffff;
      --line: #d5d9de;
      --code-bg: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
      max-width: 60rem;
      font: 1rem/1.55 var(--font-body);
      color: var(--fg);
      background: var(--bg);
    }

    h1, h2, h3 { line-height: 1.25; font-weight: 600; }
    h1 { font-size: 1.75rem; margin: 0 0 1.5rem; }
    h2 { font-size: 1.3rem; margin: 2.5rem 0 0.75rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--line); }
    h3 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; }

    code, pre {
      font-family: var(--font-mono);
      font-size: 0.9em;
    }

    code {
      padding: 0.1em 0.35em;
      background: var(--code-bg);
      border-radius: 3px;
    }

    pre {
      margin: 1rem 0;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      background: var(--code-bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      line-height: 1.4;
    }

    pre code { padding: 0; background: none; }

    table {
      width: 100%;
      margin: 1rem 0;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--line);
      text-align: right;
    }

    th:first-child, td:first-child { text-align: left; }
    thead th { font-weight: 600; border-bottom: 2px solid var(--fg); }

    figure { margin: 1.5rem 0; }
    figure svg, figure img { display: block; max-width: 100%; height: auto; }
    figcaption { margin-top: 0.5rem; font-size: 0.9rem; color: var(--muted); }
    ```

    **Green Notes**
    - **System font stack** (reduces E and network): no `@font-face`, so the report downloads no font files and the browser draws text with fonts already on the machine. In Green Metrics Tool browser benchmarks with 30 cold page loads, the system font stack used about 26% less client CPU energy than six local TTF files (~4 MB), and about 16% less than two Latin-subset WOFF2 files (~55 KB).
    - **Monospace stack for logs and case names:** the same idea, so solver logs need no extra font either.
    - *Not applied:* a brand or web font. If the group wants one later, use one or two Latin WOFF2 subsets rather than full TTF sets. In the same benchmarks, WOFF2 subsets used about 12% less than the TTF sets.
verify:
  static_only: CSS stylesheet, no executable code
