- role: assistant
  content: |
    You don't need any `@font-face` here. Use two font stacks, one for text and one for monospace:

    ```css
    /* flakehunt/templates/report.css
     * inlined into flaky-report.html by `flakehunt report`
     * Fonts: system stacks only, no font files shipped.
     */

    :root {
      --bg: #fafafa;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --flaky: #bf8700;
      --failed: #cf222e;
      --passed: #1a7f37;

      --font-text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
    }

    body {
      margin: 0 auto;
      max-width: 1100px;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-text);
      line-height: 1.5;
    }

    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .summary { color: var(--muted); margin-bottom: 24px; }

    table.runs { width: 100%; border-collapse: collapse; }
    table.runs th, table.runs td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    table.runs th { font-weight: 600; }

    .test-id { font-family: var(--font-mono); font-size: 0.85rem; }
    .rate { text-align: right; font-variant-numeric: tabular-nums; }
    .status-flaky { color: var(--flaky); }
    .status-failed { color: var(--failed); }
    .status-passed { color: var(--passed); }

    pre.trace {
      font-family: var(--font-mono);
      background: #f6f8fa;
      border: 1px solid var(--border);
      padding: 12px;
      overflow-x: auto;
      font-size: 0.8rem;
    }
    ```

    You can delete `templates/fonts/` from the package. Roboto is still in the text stack, so systems that have it installed (Android, ChromeOS, many Linux desktops) will use it.

    **Green Notes**
    - **System font stack instead of bundled web fonts** (reduces E and M): the browser renders the report with fonts the OS already has, so there are no font files to load, parse and rasterize on each open. In Green Metrics Tool browser benchmarks with 30 cold page loads, six local TTF files (~4 MB) used ~556 J, two Latin-subset WOFF2 files (~55 KB) ~488 J, and the system font stack ~410 J. That is about 26% less than the TTF set.
    - **Smaller package:** without the TTF directory, the wheel and every install of `flakehunt` get smaller.
    - *Not applied:* bundled Roboto/Fira Code. If the brand font is a hard requirement, ship only regular + bold as Latin-subset WOFF2, not every TTF weight. In the same benchmark that was about 12% less than the TTF set, but still about 16% more than system fonts. Also note: relative `url()`s in CSS that is inlined into the HTML resolve against the report's location, not `templates/`. They break once the report is written to another directory, unless you copy the fonts next to it or base64-embed them, which bloats every report.
