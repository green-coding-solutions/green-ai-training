messages:
- role: user
  content: |
    hi, in our ETL we get every night the smart meter readings of all customers, around 3 millions rows. each row have `meter_id, ts, kwh, voltage, current_a, temp_c`. my colegue trained a small autoencoder in pytorch to find strange readings. it is saved as full model with `torch.save(model, "models/meter_ae.pt")`. input are the 4 floats `kwh, voltage, current_a, temp_c`, normalized with mean/std from `models/meter_stats.json` (looks like `{"mean": [...], "std": [...]}`).

    I need a function who take the pandas dataframe and give back the dataframe with a new column `anomaly_score` = mean squared reconstruction error per row. The ETL server has only CPU, no GPU. thanks!
- role: assistant
  content: |
    ```python
    import json

    import numpy as np
    import pandas as pd
    import torch

    FEATURES = ["kwh", "voltage", "current_a", "temp_c"]


    def load_model(path: str = "models/meter_ae.pt") -> torch.nn.Module:
        # Full pickled model: only load files you trust.
        model = torch.load(path, map_location="cpu", weights_only=False)
        model.eval()  # dropout/batchnorm in inference behavior
        return model


    def load_stats(path: str = "models/meter_stats.json") -> tuple[np.ndarray, np.ndarray]:
        with open(path) as f:
            stats = json.load(f)
        mean = np.asarray(stats["mean"], dtype=np.float32)
        std = np.asarray(stats["std"], dtype=np.float32)
        return mean, std


    def add_anomaly_score(
        df: pd.DataFrame,
        model: torch.nn.Module,
        mean: np.ndarray,
        std: np.ndarray,
        batch_size: int = 8192,
    ) -> pd.DataFrame:
        x = (df[FEATURES].to_numpy(dtype=np.float32) - mean) / std
        scores = np.empty(len(x), dtype=np.float32)

        with torch.inference_mode():
            for start in range(0, len(x), batch_size):
                batch = torch.from_numpy(x[start:start + batch_size])
                recon = model(batch)
                err = ((recon - batch) ** 2).mean(dim=1)
                scores[start:start + len(batch)] = err.numpy()

        out = df.copy()
        out["anomaly_score"] = scores
        return out
    ```

    Usage in the nightly job:

    ```python
    model = load_model()
    mean, std = load_stats()
    readings = add_anomaly_score(readings, model, mean, std)
    ```

    Rows with a missing value in one of the four features get `NaN` as score. Drop or fill them before scoring if the next step can't handle `NaN`.

    **Green Notes**
    - **Inference mode for the forward pass** (reduces E, M): `torch.inference_mode()` stops PyTorch from recording the autograd graph and keeping activations for a backward pass that never happens. Over 3 million rows this is work saved on every batch. In Green Metrics Tool micro-benchmarks, 100,000 PyTorch CPU inferences used about 14% less CPU energy with `torch.no_grad()` than without it.
