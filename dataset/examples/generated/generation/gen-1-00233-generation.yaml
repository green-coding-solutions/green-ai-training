messages:
- role: user
  content: |
    psycopg3 function for the search box dropdown in our shop, top 8 products by name prefix. products has name, slug, price_cents, thumb_url, description, specs (jsonb), ... about 50 cols
- role: assistant
  content: |
    ```python
    import psycopg
    from psycopg.rows import dict_row


    def suggest_products(conn: psycopg.Connection, prefix: str, limit: int = 8) -> list[dict]:
        # Escape LIKE wildcards so user input is treated as plain text.
        escaped = prefix.replace("\\", "\\\\").replace("%", "\\%").replace("_", "\\_")
        with conn.cursor(row_factory=dict_row) as cur:
            cur.execute(
                """
                SELECT name, slug, price_cents, thumb_url
                FROM products
                WHERE active AND name ILIKE %s
                ORDER BY name
                LIMIT %s
                """,
                (escaped + "%", limit),
            )
            return cur.fetchall()
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E and network): the dropdown shows name, link, price and a thumbnail, so only those four are fetched. `description`, `specs` and the other wide columns stay in the database. This query runs on every keystroke, so a `SELECT *` would drag eight full product rows through the driver each time. In Green Metrics Tool micro-benchmarks on a 52-column PostgreSQL table with large text columns, `SELECT *` used about 7× the energy of naming the 10 needed columns. The saving grows with the size of the skipped columns.
    - **`LIMIT`** (reduces E and network): the database returns at most 8 rows, not every match.
  verify:
    static_only: needs a PostgreSQL server and a products table
