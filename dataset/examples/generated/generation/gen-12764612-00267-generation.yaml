messages:
- role: user
  content: |
    js function to show the rejected rows from our etl run in a table. array of {rowNum, source, reason, raw}, usually 20k+
- role: assistant
  content: |
    ```javascript
    export function mountRejects(root, rejects, pageSize = 100) {
      const pages = Math.max(1, Math.ceil(rejects.length / pageSize));
      let page = 0;

      const prev = document.createElement('button');
      prev.type = 'button';
      prev.textContent = 'Prev';
      const next = document.createElement('button');
      next.type = 'button';
      next.textContent = 'Next';
      const label = document.createElement('span');

      const table = document.createElement('table');
      table.innerHTML =
        '<thead><tr><th>Row</th><th>Source</th><th>Reason</th><th>Raw</th></tr></thead>';
      const body = document.createElement('tbody');
      table.append(body);

      function render() {
        const start = page * pageSize;
        const frag = document.createDocumentFragment();
        for (const r of rejects.slice(start, start + pageSize)) {
          const tr = document.createElement('tr');
          for (const value of [r.rowNum, r.source, r.reason, r.raw]) {
            const td = document.createElement('td');
            td.textContent = value;
            tr.append(td);
          }
          frag.append(tr);
        }
        body.replaceChildren(frag);
        label.textContent = ` Page ${page + 1} of ${pages} (${rejects.length} rows) `;
        prev.disabled = page === 0;
        next.disabled = page === pages - 1;
      }

      prev.addEventListener('click', () => { page -= 1; render(); });
      next.addEventListener('click', () => { page += 1; render(); });

      root.replaceChildren(prev, label, next, table);
      render();
    }
    ```

    Usage: `mountRejects(document.querySelector('#rejects'), rejects);`

    `textContent` is used on purpose. The `raw` field holds source data you don't control, so it should never be parsed as HTML.

    **Green Notes**
    - **Paginated DOM** (reduces E on the client): only 100 rows exist in the page at a time, not 20k+. In Green Metrics Tool page-load measurements, a 10,000-row table paginated to 100 rows per page used about 56% less CPU energy than the same data rendered all at once with wrapper elements around every cell.
    - **Plain table, one fragment** (reduces E): each cell is a single `<td>` with no wrapper elements. The rows are built in a `DocumentFragment` and swapped in with one `replaceChildren` call, not appended to the live DOM one by one.

    If people need to search all rejects, filter the `rejects` array first and page the result.
