messages:
- role: user
  content: |
    Hello, I need one simple page for my bike repair shop "Velo Fix" in Linz. I have no website now. Page should have: name and one sentence on top, a button to send me email, 3 prices (flat tire, brake service, full service), opening hours and the adress. No javascript please, and it must look ok on phone. I will put it on my small hosting as index.html. Thank you!
- role: assistant
  content: |
    Here is one self-contained `index.html`. The CSS is inline and has only the rules this page uses.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Velo Fix – Bike repair in Linz</title>
      <meta name="description" content="Fast and fair bike repair in Linz. Flat tire, brake service and full service.">
      <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          line-height: 1.5;
          color: #222;
        }
        header {
          padding: 3rem 1rem;
          text-align: center;
          background: #1f6f50;
          color: #fff;
        }
        h1 { margin: 0 0 .5rem; font-size: 2rem; }
        .button {
          display: inline-block;
          margin-top: 1rem;
          padding: .75rem 1.5rem;
          background: #fff;
          color: #1f6f50;
          font-weight: 700;
          text-decoration: none;
          border-radius: 4px;
        }
        main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
        h2 { margin-top: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: .5rem 0; border-bottom: 1px solid #ddd; }
        td:last-child { text-align: right; font-weight: 700; }
        footer { padding: 1rem; text-align: center; background: #f2f2f2; }
      </style>
    </head>
    <body>
      <header>
        <h1>Velo Fix</h1>
        <p>Bike repair in Linz. Most repairs are ready the same day.</p>
        <a class="button" href="mailto:info@velofix.example?subject=Repair%20request">Send us an email</a>
      </header>

      <main>
        <h2>Prices</h2>
        <table>
          <tr><td>Flat tire</td><td>from € 12</td></tr>
          <tr><td>Brake service</td><td>from € 25</td></tr>
          <tr><td>Full service</td><td>from € 79</td></tr>
        </table>

        <h2>Opening hours</h2>
        <p>Mon–Fri 9:00–18:00<br>Sat 9:00–13:00<br>Sun closed</p>

        <h2>Address</h2>
        <p>Velo Fix<br>Musterstraße 12<br>4020 Linz</p>
