  module: false
  test: |-
    import os
    import tempfile

    with tempfile.NamedTemporaryFile("w", delete=False, suffix=".txt", encoding="utf-8") as f:
        f.write("A1\n\nB2 \nA1\n")
    skus = load_promo_skus(f.name)
    os.unlink(f.name)
    assert skus == frozenset({"A1", "B2"})

    lines = [
        CartLine("A1", 2, Decimal("10.00")),
        CartLine("C3", 1, Decimal("5.50")),
        CartLine("B2", 3, Decimal("1.99")),
    ]
    # A1: 20.00 * 0.9 = 18.00, C3: 5.50, B2: 5.97 * 0.9 = 5.373 -> 28.873 -> 28.87
    assert discounted_total(lines, skus, 10) == Decimal("28.87")
    assert discounted_total(lines, ["A1", "B2"], 10) == Decimal("28.87")
    assert discounted_total(lines, skus, 0) == Decimal("31.47")
    assert discounted_total(lines, skus, 100) == Decimal("5.50")
    assert discounted_total([], skus, 10) == Decimal("0.00")
    try:
        discounted_total(lines, skus, 150)
        raise AssertionError("expected ValueError")
    except ValueError:
        pass
    print("ok")
