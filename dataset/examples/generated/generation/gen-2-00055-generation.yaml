- role: assistant
  content: |
    Here is `discounted_total`. I also changed `load_promo_skus` to build the lookup set once, when the file is loaded:

    ```python
    # checkout/promo.py
    from collections.abc import Container, Iterable
    from dataclasses import dataclass
    from decimal import ROUND_HALF_UP, Decimal

    CENT = Decimal("0.01")


    @dataclass
    class CartLine:
        sku: str
        qty: int
        unit_price: Decimal


    def load_promo_skus(path: str) -> frozenset[str]:
        """promo_skus.txt is exported by marketing every morning, one SKU per line."""
        with open(path, encoding="utf-8") as f:
            return frozenset(line.strip() for line in f if line.strip())


    def discounted_total(
        lines: Iterable[CartLine], promo_skus: Container[str], pct: int
    ) -> Decimal:
        """Total of the cart. Lines whose SKU is in promo_skus get pct % off."""
        if not 0 <= pct <= 100:
            raise ValueError(f"pct must be between 0 and 100, got {pct}")
        factor = (Decimal(100) - pct) / 100
        total = Decimal(0)
        for line in lines:
            line_total = line.unit_price * line.qty
            if line.sku in promo_skus:
                line_total *= factor
            total += line_total
        return total.quantize(CENT, rounding=ROUND_HALF_UP)
    ```

    Load it once at startup as before: `PROMO_SKUS = load_promo_skus("promo_skus.txt")`.

    **Green Notes**
    - **Set for repeated membership tests** (reduces E): every line of every checkout checks `sku in promo_skus`. With a `frozenset` each check is O(1). With the list it scans up to a few thousand SKUs per line.
    - **Build the set once, not per call** (reduces E): the conversion is O(n). Doing it inside `discounted_total` would rebuild it on every checkout for only a handful of lookups. In Green Metrics Tool micro-benchmarks, a single membership test on a 10,000,000-element list was cheaper than converting it to a set first and testing once (about 50% more). A set pays off only because `PROMO_SKUS` is reused for many lookups.

    Behavior notes: duplicate SKUs in the file are dropped, which doesn't change any membership result. The total is rounded to cents (half-up). Remove the `quantize` if you round elsewhere. The function still accepts a plain list, it is just slower.
