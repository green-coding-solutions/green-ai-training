    import os, tempfile, csv
    d = tempfile.mkdtemp()
    src = os.path.join(d, "in.csv")
    dst = os.path.join(d, "out.csv")
    with open(src, "w", newline="", encoding="utf-8") as f:
        f.write("id,name,country\n1,A,Germany\n2,B,\n3,C,Narnia\n4,D, USA \n5,E,narnia\n")
    unknown = add_country_codes(src, dst)
    assert unknown == {"narnia": 2}, unknown
    with open(dst, newline="", encoding="utf-8") as f:
        rows = list(csv.DictReader(f))
    assert [r["country_code"] for r in rows] == ["DE", "", "", "US", ""]
    assert list(rows[0].keys()) == ["id", "name", "country", "country_code"]
