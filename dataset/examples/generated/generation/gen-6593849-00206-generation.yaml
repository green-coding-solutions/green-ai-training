messages:
- role: user
  content: |
    I need the stylesheet for the "prediction panel" of our sentiment model demo. It is a small widget that customers embed on their own pages with one <link> tag, so it must not leak styles outside `.pp-panel`.

    Requirements:
    - Layout: a textarea for the input, a "Classify" button, then a result area with the label (positive / neutral / negative), a confidence bar and a small line with latency in ms.
    - Colors for the three labels through CSS custom properties, so customers can override them.
    - Respect `prefers-color-scheme: dark` and `prefers-reduced-motion`.
    - Loading state while the request runs (class `is-loading`), with a simple bar animation.
    - I will keep the readable file in `src/prediction-panel.css` in the repo. What is the best way to ship it?
- role: assistant
  content: |
    ```css
    /* src/prediction-panel.css */
    .pp-panel {
      --pp-positive: #1a7f4b;
      --pp-neutral: #6b7280;
      --pp-negative: #b42318;
      --pp-bg: #ffffff;
      --pp-fg: #1f2937;
      --pp-border: #d1d5db;

      box-sizing: border-box;
      max-width: 32rem;
      padding: 1rem;
      border: 1px solid var(--pp-border);
      border-radius: 0.5rem;
      background: var(--pp-bg);
      color: var(--pp-fg);
      font: 1rem/1.4 system-ui, sans-serif;
    }

    .pp-panel *,
    .pp-panel *::before,
    .pp-panel *::after {
      box-sizing: inherit;
    }

    .pp-panel textarea {
      display: block;
      width: 100%;
      min-height: 6rem;
      padding: 0.5rem;
      border: 1px solid var(--pp-border);
      border-radius: 0.25rem;
      background: transparent;
      color: inherit;
      font: inherit;
      resize: vertical;
    }

    .pp-panel button {
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      border: 0;
      border-radius: 0.25rem;
      background: var(--pp-fg);
      color: var(--pp-bg);
      font: inherit;
      cursor: pointer;
    }

    .pp-panel button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .pp-result {
      margin-top: 1rem;
    }

    .pp-label {
      font-weight: 600;
      text-transform: capitalize;
    }

    .pp-label[data-label="positive"] { color: var(--pp-positive); }
    .pp-label[data-label="neutral"]  { color: var(--pp-neutral); }
    .pp-label[data-label="negative"] { color: var(--pp-negative); }

    .pp-bar {
      height: 0.5rem;
      margin-top: 0.5rem;
      overflow: hidden;
      border-radius: 999px;
      background: var(--pp-border);
    }

    /* set the width inline, e.g. style="--pp-conf: 87%" */
    .pp-bar > span {
      display: block;
      width: var(--pp-conf, 0%);
      height: 100%;
      background: currentColor;
    }

    .pp-latency {
      margin-top: 0.5rem;
      font-size: 0.8125rem;
      opacity: 0.75;
    }

    .pp-panel.is-loading .pp-bar > span {
      width: 40%;
      animation: pp-slide 1s ease-in-out infinite alternate;
    }

    @keyframes pp-slide {
      from { transform: translateX(0); }
      to   { transform: translateX(150%); }
    }

    @media (prefers-color-scheme: dark) {
      .pp-panel {
        --pp-positive: #4ade80;
        --pp-neutral: #9ca3af;
        --pp-negative: #f87171;
        --pp-bg: #111827;
        --pp-fg: #f3f4f6;
        --pp-border: #374151;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pp-panel.is-loading .pp-bar > span {
        animation: none;
        width: 100%;
        opacity: 0.5;
      }
    }
    ```

    Customers override the colors from their own page, for example `.pp-panel { --pp-positive: teal; }`.

    Keep the readable file in the repo and ship a minified copy. One build step is enough:

    ```bash
    npx esbuild src/prediction-panel.css --minify --outfile=dist/prediction-panel.min.css
    ```

    Link `dist/prediction-panel.min.css` in the embed snippet. Your server or CDN should also send it with gzip or brotli.

    **Green Notes**
    - **Minify web assets** (reduces network): comments and whitespace are removed, so each embedding page downloads fewer bytes. The widget is loaded on many third-party pages, so the bytes add up over all loads. In Green Metrics Tool browser benchmarks of a small booking page, the unminified JS and CSS sources used ~837 J for 50 cold page loads and the minified build ~822 J, about 2%, which is within noise. So expect a saving in transferred bytes, not in client CPU.
    - **Animation** (reduces E on the client): the loading bar uses `transform` in a CSS `@keyframes`, not JavaScript updates, and it stops under `prefers-reduced-motion`.

    *Not applied:* removing unused CSS — the file is small and every rule is used by the widget, so there is nothing to purge.
