    **Green Notes**
    - **Lazy-load offscreen images** (reduces network, E): the snapshots sit below the fold, so they get `loading="lazy"` and are fetched only when someone scrolls to them. This also means fewer requests hit the gateway's small CPU. In Green Metrics Tool browser benchmarks on a 15-photo article, lazy loading used about 12% less CPU energy on page loads without scrolling. When the visitor scrolled to the end, there was no difference.
    - **Above-the-fold images stay eager:** the logo and the site photo have no `loading` attribute, because lazy-loading them delays the first view.
    - *Not applied:* a modern image format. The snapshots are already small JPEGs from the nodes, and converting them on a gateway would cost more CPU than it saves.
