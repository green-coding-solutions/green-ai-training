    </head>
    <body>
      <header>
        <img src="/img/logo.png" alt="Gateway logo" width="48" height="48">
        <h1>LoRa Gateway Status</h1>
      </header>

      <img class="site-photo" src="/img/site.jpg" alt="Gateway install site on the roof"
           width="960" height="540">

      <h2>Latest node snapshots</h2>
      <ul class="grid">
