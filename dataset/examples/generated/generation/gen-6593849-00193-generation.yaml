      <style>
        body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 0 1rem; }
        header { display: flex; align-items: center; gap: 1rem; }
        .site-photo { width: 100%; height: auto; border-radius: 6px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; padding: 0; list-style: none; }
        .grid img { width: 100%; height: auto; display: block; background: #eee; }
        figcaption { font-size: 0.85rem; }
