id: gen-2-00300-generation
category: generation
language: html
patterns:
- modern-image-formats
facts:
- F-IMGENC
- F-IMGRENDER
messages:
- role: user
  content: |
    need html for the terminal wiring photo on our gateway config page. only have wiring.jpg (4000x3000, ~3 MB). techs sometimes open the page over the gateway's LTE modem
- role: assistant
  content: |
    Make the smaller variants once in the firmware build. The gateway then only serves static files:

    ```bash
    #!/usr/bin/env bash
    # Runs in the firmware build, not on the gateway. Needs ImageMagick 7 with AVIF support.
    set -euo pipefail

    src=assets/src/wiring.jpg
    out=rootfs/www/img
    mkdir -p "$out"

    for w in 800 1600; do
        magick "$src" -resize "${w}x" -strip -quality 80 "$out/wiring-$w.jpg"
        magick "$src" -resize "${w}x" -strip -quality 75 "$out/wiring-$w.webp"
        magick "$src" -resize "${w}x" -strip -quality 50 "$out/wiring-$w.avif"
    done
    ```

    ```html
    <figure class="wiring">
      <picture>
        <source type="image/avif"
                srcset="/img/wiring-800.avif 800w, /img/wiring-1600.avif 1600w"
                sizes="(max-width: 900px) 100vw, 900px">
        <source type="image/webp"
                srcset="/img/wiring-800.webp 800w, /img/wiring-1600.webp 1600w"
                sizes="(max-width: 900px) 100vw, 900px">
        <img src="/img/wiring-1600.jpg"
             srcset="/img/wiring-800.jpg 800w, /img/wiring-1600.jpg 1600w"
             sizes="(max-width: 900px) 100vw, 900px"
             width="1600" height="1200"
             alt="Terminal block wiring: power on the left, RS-485 A/B in the middle, relay outputs on the right">
      </picture>
      <figcaption>Terminal block wiring. Check the polarity before you power on.</figcaption>
    </figure>
    ```

    **Green Notes**
    - **Serve images in modern formats** (reduces network): the browser picks AVIF, then WebP, then JPG. Phones get the 800 px file, not the 4000 px original, so the LTE link carries far fewer bytes. The win is the smaller download, not decoding. In Green Metrics Tool page-load benchmarks, decoding AVIF cost about 19% more client CPU than JPG.
    - **Encode once at build time** (reduces E): AVIF is expensive to encode. In Green Metrics Tool measurements of encoding 50 BMP images, AVIF used ~658 J and JPG ~89 J, about 7× more. Keep the encoding in the firmware build. Never convert images on the gateway per request.

    `width` and `height` reserve the space, so the page doesn't jump while the photo loads over a slow link.
verify:
  static_only: HTML markup and a build step that needs ImageMagick with AVIF support
