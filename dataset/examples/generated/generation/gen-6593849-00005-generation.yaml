id: gen-6593849-00005-generation
category: generation
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    Our CI build history page (GitLab Pages, Jinja, rendered by the pipeline after every main build) needs a screenshot thumbnail per build row. The E2E job already drops `shots/{{ b.number }}.png`, 320x180. The page lists the last 50 builds. Current template:

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Build history</title>
      <link rel="stylesheet" href="style.css">
    </head>
    <body>
      <header>
        <img src="logo.svg" alt="Platform CI" width="120" height="32">
        <h1>Build history: main</h1>
      </header>
      <table class="builds">
        <thead>
          <tr><th>#</th><th>Commit</th><th>Status</th><th>Duration</th></tr>
        </thead>
        <tbody>
          {% for b in builds %}
          <tr class="{{ b.status }}">
            <td><a href="{{ b.url }}">{{ b.number }}</a></td>
            <td>{{ b.sha[:8] }}</td>
            <td>{{ b.status }}</td>
            <td>{{ b.duration }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </body>
    </html>
    ```

    Just the diff please.
- role: assistant
  content: |
    Header and row changes only:

    ```html
    <thead>
      <tr><th>#</th><th>Commit</th><th>Status</th><th>Duration</th><th>E2E screenshot</th></tr>
    </thead>
    <tbody>
      {% for b in builds %}
      <tr class="{{ b.status }}">
        <td><a href="{{ b.url }}">{{ b.number }}</a></td>
        <td>{{ b.sha[:8] }}</td>
        <td>{{ b.status }}</td>
        <td>{{ b.duration }}</td>
        <td>
          <img src="shots/{{ b.number }}.png"
               alt="E2E screenshot of build {{ b.number }}"
               width="320" height="180"
               loading="{{ 'eager' if loop.index <= 3 else 'lazy' }}"
               decoding="async">
        </td>
      </tr>
      {% endfor %}
    </tbody>
    ```

    The logo stays as it is. It is above the fold and must not be lazy.

    **Green Notes**
    - **Defer offscreen images** (reduces network, E): the first 3 rows load right away, the other 47 thumbnails load only when someone scrolls to them. In Green Metrics Tool micro-benchmarks on an article with 15 photos, lazy loading below the fold used about 12% less energy on page loads without scrolling. When the visitor scrolled to the end, there was no difference. This page is mostly opened for the latest builds, so the saving should apply here.
    - **`width` and `height`** reserve the space, so lazy images don't shift the layout when they arrive.
    - *Not applied:* no thumbnail sprite or resizing step. The screenshots are already 320x180, so there is nothing to gain there.
verify:
  static_only: HTML/Jinja template, no runnable Python or JavaScript
