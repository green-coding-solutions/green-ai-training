messages:
- role: user
  content: |
    ```sql
    CREATE TABLE case_studies (
      id            bigint primary key,
      slug          text not null unique,
      customer_name text not null,
      headline      text not null,
      summary       text not null,
      body_html     text not null,
      body_markdown text not null,
      pdf_text      text,
      cover_url     text,
      logo_url      text,
      industry      text,
      status        text not null default 'draft',
      featured      boolean not null default false,
      published_at  timestamptz,
      updated_at    timestamptz
    );

    -- landing page "Customer stories" strip
    -- 3 featured + published case studies, newest first
    -- card shows: logo, customer, headline, link to the story
    ```

    ?
- role: assistant
  content: |
    ```sql
    SELECT slug, customer_name, headline, logo_url
    FROM case_studies
    WHERE status = 'published'
      AND featured = true
    ORDER BY published_at DESC, id DESC
    LIMIT 3;
    ```

    The `slug` builds the link to the story. `id DESC` makes the order stable when two stories share a publish time.

    **Green Notes**
    - **Select only needed columns** (reduces E, M, network): the card needs four columns, so the query skips `body_html`, `body_markdown` and `pdf_text`, which hold the large text. `SELECT *` would read and send them for every page view and then drop them. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, naming the 10 needed columns instead of `SELECT *` used about 5.5× to 7× less CPU energy when reading 500 to 10,000 rows. The saving grows with the size of the skipped columns. With only 3 rows per call, the saving per call is small, but this query runs on every landing page load.
