id: gen-2-00168-generation
category: generation
language: python
patterns:
- simple-conditions
facts:
- F-COND
messages:
- role: user
  content: |
    py func: Argo QC flag (0-9) -> "good" / "suspect" / "bad" / "missing". runs on every sample of our float profiles
- role: assistant
  content: |
    ```python
    # Argo reference table 2: measurement QC flags.
    # Flags 6 and 7 are reserved and not used, so they are rejected.
    ARGO_QC_CLASS = {
        0: "suspect",   # no QC performed yet
        1: "good",
        2: "good",      # probably good
        3: "suspect",   # probably bad, potentially correctable
        4: "bad",
        5: "good",      # value changed (corrected)
        8: "good",      # estimated (interpolated)
        9: "missing",
    }


    def classify_qc(flag: int) -> str:
        """Map one Argo QC flag to good / suspect / bad / missing."""
        label = ARGO_QC_CLASS.get(flag)
        if label is None:
            raise ValueError(f"unknown Argo QC flag: {flag!r}")
        return label
    ```

    If your flags come straight from the netCDF file as bytes like `b"1"`, convert them first with `int(flag)`.

    **Green Notes**
    - **Simple equality lookup instead of range guards** (reduces E): each sample costs one dict lookup on the exact flag value. Range checks like `1 <= flag <= 2 or flag in (5, 8)` would run again for every sample. In Green Metrics Tool micro-benchmarks with 10,000,000 classifications, simple equality branches used about 16% less CPU energy than complex range/modulo conditions.
    - *Not applied:* `match`/`case`. With the same conditions, `match` and `if/elif` differed by about 1% in the same benchmark, which is noise. The table is also easier to keep in sync with the Argo manual.
verify:
  test: |-
    assert classify_qc(1) == "good"
    assert classify_qc(2) == "good"
    assert classify_qc(5) == "good"
    assert classify_qc(8) == "good"
    assert classify_qc(0) == "suspect"
    assert classify_qc(3) == "suspect"
    assert classify_qc(4) == "bad"
    assert classify_qc(9) == "missing"
    for bad in (6, 7, 10, -1):
        try:
            classify_qc(bad)
        except ValueError:
            pass
        else:
            raise AssertionError(f"flag {bad} should be rejected")
    print("ok")
