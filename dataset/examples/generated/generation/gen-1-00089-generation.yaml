messages:
- role: user
  content: |
    css for a table of simulation run results. columns: run id, seed, residual, wall time, status. needs dark mode. its for our lab intranet
- role: assistant
  content: |
    ```css
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --head: #f6f8fa;
      --ok: #1a7f37;
      --fail: #cf222e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --head: #161b22;
        --ok: #3fb950;
        --fail: #f85149;
      }
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
    }

    table.runs {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .runs th,
    .runs td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .runs thead th {
      position: sticky;
      top: 0;
      background: var(--head);
      color: var(--muted);
      font-weight: 600;
    }

    /* seed, residual and wall time: right-aligned, fixed-width digits */
    .runs td.num,
    .runs th.num {
      text-align: right;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .runs tbody tr:hover {
      background: var(--head);
    }

    .status-ok { color: var(--ok); }
    .status-failed { color: var(--fail); font-weight: 600; }
    ```

    Use it like this:

    ```html
    <table class="runs">
      <thead>
        <tr>
          <th>Run</th><th class="num">Seed</th><th class="num">Residual</th>
          <th class="num">Wall time</th><th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>run-0042</td><td class="num">1337</td><td class="num">3.2e-7</td>
          <td class="num">412.8 s</td><td class="status-ok">converged</td>
        </tr>
      </tbody>
    </table>
    ```

    **Green Notes**
    - **Minify assets** (reduces network): the stylesheet is small, so I left it readable and added no minify step. In Green Metrics Tool browser benchmarks, 50 cold loads of a small page used ~837 J with unminified JS and CSS and ~822 J with an esbuild minified build, about 2% less, which is within measurement noise. Minifying saves bytes on the network, not measurable client CPU energy.

    *Not applied:* a minification build step. On a lab intranet with a fast network it adds tooling for almost no gain. If the file grows a lot or the page is served over slow links, minify it once at build time.
verify:
  static_only: CSS and HTML only, no runnable code
