    **Green Notes**
    - **Modern formats with fallback** (reduces network and E): these are photos, so PNG is the wrong format. It is lossless and large. In Green Metrics Tool browser benchmarks (50 page loads per format), PNG used ~181 J of client CPU energy and JPG ~134 J. The `<picture>` element lets AVIF and WebP browsers take the small file, and the JPG `<img>` is the fallback for the rest. Most of the gain from AVIF and WebP is fewer transferred bytes.
    - **AVIF is not free on the client:** decoding AVIF cost about 19% more CPU than JPG in the same benchmarks. For the large main photo, the byte saving is worth it.
    - **Encode once, at upload or build time:** AVIF encoding cost about 7× JPG in the measurements. Generate the `.avif`, `.webp` and `.jpg` files when the product is published, never per request.
    - **Thumbnails get WebP and JPG only:** they are tiny, and AVIF is the most expensive format to encode.

    *Not applied:* none of these files need `loading="lazy"` here. The main photo is above the fold, and the thumbnails sit right next to it.

    If any image is a flat graphic or logo with transparency, use SVG, or keep PNG. This change is for the photos.
