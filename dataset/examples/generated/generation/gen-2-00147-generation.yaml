  test: |-
    import contextlib
    import gzip as _gz
    import os
    import tempfile
    from datetime import datetime as _dt, timezone

    class FakeCopy:
        def __init__(self, sink):
            self.sink = sink
        def __enter__(self):
            return self
        def __exit__(self, *a):
            return False
        def write_row(self, row):
            self.sink.append(tuple(row))

    class FakeCursor:
        def __init__(self, conn):
            self.conn = conn
        def __enter__(self):
            return self
        def __exit__(self, *a):
            return False
        def copy(self, sql):
            self.conn.sql.append(sql)
            return FakeCopy(self.conn.rows)
        def execute(self, *a, **k):
            raise AssertionError("row-by-row execute used")
        def executemany(self, *a, **k):
            raise AssertionError("executemany used")

    class FakeConn:
        def __init__(self):
            self.rows = []
            self.sql = []
            self.tx = 0
        def cursor(self):
            return FakeCursor(self)
        @contextlib.contextmanager
        def transaction(self):
            self.tx += 1
            yield

    lines = (
        '203.0.113.7 - - [14/Oct/2026:06:25:01 +0000] "GET /api/orders?page=2 HTTP/1.1" 200 5120 "-" "curl/8.5.0" 0.042\n'
        'garbage line\n'
        '198.51.100.23 - - [14/Oct/2026:06:25:02 +0000] "POST /api/login HTTP/2.0" 401 - "https://shop.example/" "Mozilla/5.0" 0.003\n'
        '\n'
    )

    d = tempfile.mkdtemp()
    plain = os.path.join(d, "access.log")
    gzpath = os.path.join(d, "access.log.1.gz")
    with open(plain, "w", encoding="utf-8") as fh:
        fh.write(lines)
    with _gz.open(gzpath, "wt", encoding="utf-8") as fh:
        fh.write(lines)

    for p in (plain, gzpath):
        conn = FakeConn()
        assert load_file(conn, p) == (2, 2)
        assert conn.tx == 1
        assert len(conn.sql) == 1 and conn.sql[0].startswith("COPY access_log")
        assert conn.rows[0][0] == _dt(2026, 10, 14, 6, 25, 1, tzinfo=timezone.utc)
        assert conn.rows[0][1:6] == ("203.0.113.7", "GET", "/api/orders?page=2", 200, 5120)
        assert conn.rows[1][4] == 401 and conn.rows[1][5] == 0
        assert abs(conn.rows[1][6] - 0.003) < 1e-9
        assert conn.rows[1][7] == "Mozilla/5.0"
    print("ok")
