    Here is `report.css`. Add `class="num"` to the numeric `<th>`/`<td>` cells.

    ```css
    /* report.css: nightly CFD run reports (source, edit this file) */

    :root {
      --fg: #1d1f21;
      --muted: #5f6368;
      --border: #d0d4d9;
      --zebra: #f5f7f9;
      --ok: #1e7b34;
      --fail: #b3261e;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--fg);
      line-height: 1.5;
    }

    body { margin: 0; }

    .report-header,
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .report-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem 1rem;
      padding-top: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .report-header h1 { margin: 0; font-size: 1.5rem; }
    .report-header .run-id { font-family: var(--mono); }
    .report-header time { color: var(--muted); }

    main { padding-bottom: 3rem; }

    .metrics {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.95rem;
    }
    .metrics th,
    .metrics td {
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .metrics .num {
      text-align: right;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .metrics tbody tr:nth-child(even) { background: var(--zebra); }

    figure { margin: 2rem 0; }
    figure img {
      display: block;
      max-width: 100%;
      height: auto;
      border: 1px solid var(--border);
    }
    figcaption { margin-top: 0.5rem; color: var(--muted); font-size: 0.9rem; }

    .status-ok,
    .status-fail {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
    }
    .status-ok { background: var(--ok); }
    .status-fail { background: var(--fail); }

    @media print {
      :root { font-size: 11pt; }
      .report-header, main { max-width: none; padding-left: 0; padding-right: 0; }
      .metrics tbody tr:nth-child(even) { background: none; }
      .metrics tr, figure { break-inside: avoid; }
      .status-ok, .status-fail { color: #000; background: none; border: 1px solid currentColor; }
    }
    ```

    Add the minified copy to the publish step, after `make_report.py`, and link `report.min.css` from `report.html`:

    ```bash
    npx esbuild report.css --minify --outfile=report.min.css
    ```

    **Green Notes**
    - **Minify web assets** (reduces network): comments and whitespace are removed, so every report download has fewer bytes. In Green Metrics Tool browser benchmarks of a small page, the minified build used ~822 J and the unminified sources ~837 J for 50 cold page loads. That is about 2%, which is within noise. For a stylesheet this small, the gain is bytes, not client CPU. It runs once per publish, so it costs almost nothing.
    - **System font stack** (reduces E, network): the page downloads no font files. In Green Metrics Tool page-load benchmarks, the system font stack used about 26% less CPU energy than six local TTF files, and about 16% less than two WOFF2 subsets.
verify:
  static_only: CSS stylesheet plus esbuild CLI command, nothing to execute
