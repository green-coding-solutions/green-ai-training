  content: |
    Here is `fetch_readings`. It keeps its sync signature, so `main` stays as it is. Inside, it runs the station requests concurrently, with at most 10 in flight. Add `import asyncio` to the imports.

    ```python
    import asyncio

    MAX_CONCURRENCY = 10  # API limit per token


    async def _fetch_station(
        client: httpx.AsyncClient,
        sem: asyncio.Semaphore,
        station_id: str,
        day: date,
    ) -> list[Reading]:
        async with sem:
            resp = await client.get(
                f"/stations/{station_id}/readings",
                params={"date": day.isoformat()},
            )
        if resp.status_code == 404:
            log.warning("station %s not found for %s, skipping", station_id, day)
            return []
        resp.raise_for_status()
        return [
            Reading(
                station_id=station_id,
                ts=r["ts"],
                pm25=r.get("pm25"),
                pm10=r.get("pm10"),
                no2=r.get("no2"),
            )
            for r in resp.json()["readings"]
        ]


    async def _fetch_all(station_ids: list[str], day: date, token: str) -> list[Reading]:
        sem = asyncio.Semaphore(MAX_CONCURRENCY)
        # one client for all stations, so connections are reused
        async with httpx.AsyncClient(
            base_url=API_BASE,
            headers={"Authorization": f"Bearer {token}"},
            timeout=30.0,
        ) as client:
            async with asyncio.TaskGroup() as tg:
                tasks = [
                    tg.create_task(_fetch_station(client, sem, sid, day))
                    for sid in station_ids
                ]
        return [reading for task in tasks for reading in task.result()]


    def fetch_readings(station_ids: list[str], day: date, token: str) -> list[Reading]:
        return asyncio.run(_fetch_all(station_ids, day, token))
    ```

    **Green Notes**
    - **Concurrent async requests** (reduces E, mostly wall time): done one after another, the ~350 requests spend almost all their time waiting on the network. With 10 in flight, the run takes about a tenth as many sequential round trips. In Green Metrics Tool micro-benchmarks with 10 HTTP requests, async `httpx` used about 7% less CPU energy and about 17% less wall time than sync `urllib`. Expect a much shorter run and less time holding the job's machine. Do not expect a big CPU saving.

    Behavior:
    - The output order matches `station_ids`, the same as a sequential loop would give.
    - A 404 skips that station with a warning.
    - Any other error cancels the remaining requests and fails the run. It surfaces as an `ExceptionGroup`.
    - `asyncio.TaskGroup` needs Python 3.11+.
