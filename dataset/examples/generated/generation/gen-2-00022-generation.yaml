    def _recv_exact(s, size):
        buf = bytearray()
        while len(buf) < size:
            chunk = s.recv(size - len(buf))
            if not chunk:
                raise ConnectionError("npu socket closed")
            buf += chunk
        return bytes(buf)


    def infer(frame: bytes) -> list[float]:
        with socket.socket(socket.AF_UNIX) as s:
