- role: assistant
  content: |
    Here is a stylesheet that covers exactly the classes in your HTML.

    ```css
    :root {
      --bg: #12151a;
      --bar: #1a1e25;
      --fg: #d7dae0;
      --muted: #8b93a1;
      --line: #232830;
      --error: #ff6b6b;
      --warn: #f5c542;
      --info: #9aa3b2;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .filterbar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }

    .filter-input,
    .level-select,
    .btn {
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 8px;
    }

    .filter-input {
      flex: 1;
      min-width: 0;
    }

    .btn {
      cursor: pointer;
    }

    .btn:hover {
      border-color: var(--muted);
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
    }

    .log-table th {
      text-align: left;
      font-weight: normal;
      color: var(--muted);
      padding: 6px 12px;
      border-bottom: 1px solid var(--line);
    }

    .log-table td {
      padding: 2px 12px;
      vertical-align: top;
    }

    .log-row:nth-child(even) {
      background: rgba(255, 255, 255, 0.03);
    }

    .ts,
    .src {
      white-space: nowrap;
      color: var(--muted);
    }

    .lvl {
      font-weight: bold;
    }

    .msg {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .level-error .lvl { color: var(--error); }
    .level-warn .lvl  { color: var(--warn); }
    .level-info .lvl  { color: var(--info); }
    ```

    The `<main>` tag needs no rule. Long messages wrap instead of making the page scroll sideways.

    **Green Notes**
    - **Only the CSS you need** (reduces network and E): every rule matches a class or tag that exists in your HTML. There is no CSS framework or reset library, so the browser downloads and parses a small file.
      Pattern: Remove unused CSS
    - **System monospace font stack** (reduces network): the page uses fonts already on the device, so there is no web font to download.
    - *Not applied:* purge tooling, minify step or bundling. This is an internal tool with few users and a small file, so a build step would cost more than it saves. If you add a framework later, run a purge step against your HTML and keep only the rules you use.
