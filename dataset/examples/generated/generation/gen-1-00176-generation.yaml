id: gen-1-00176-generation
category: generation
language: javascript
patterns:
- builtin-functions
messages:
- role: user
  content: |
    hi, i am new to javascript and making a small shop for my sister. i need a function that gets the cart and tells me the total price, how many items are in it, and which items are out of stock. every item looks like { name: "Mug", price: 9.99, qty: 2, stock: 5 }. i tried with for loops but sometimes the total looks wrong, like 0.30000000000000004. not sure what i am doing wrong
- role: assistant
  content: |
    The odd total comes from decimal prices. JavaScript stores them as binary floats, so small errors add up. The fix is to add up in cents (whole numbers) and divide once at the end.

    ```javascript
    function summarizeCart(items) {
      const { totalCents, itemCount } = items.reduce(
        (acc, { price, qty }) => {
          acc.totalCents += Math.round(price * 100) * qty;
          acc.itemCount += qty;
          return acc;
        },
        { totalCents: 0, itemCount: 0 }
      );

      const unavailable = items
        .filter(({ qty, stock }) => qty > stock)
        .map(({ name }) => name);

      return { total: totalCents / 100, itemCount, unavailable };
    }

    // Example
    const cart = [
      { name: "Mug", price: 9.99, qty: 2, stock: 5 },
      { name: "Poster", price: 0.1, qty: 3, stock: 10 },
      { name: "Lamp", price: 24.5, qty: 1, stock: 0 },
    ];
    console.log(summarizeCart(cart));
    // { total: 44.78, itemCount: 6, unavailable: [ 'Lamp' ] }
    ```

    **Green Notes**
    - **Built-in `reduce` for total and count in one pass** (reduces E): the cart is walked once for both numbers, not once per number with separate hand-written loops.
    - **Built-in `filter` and `map` for the stock check**: the engine runs these natively, and the code is shorter and harder to get wrong. If you only need a yes/no answer, use `items.some(i => i.qty > i.stock)`, which stops at the first match.
    - Carts are small, so the energy difference is minor here. The main gain is clean, correct code that scales if the lists get long.
verify:
  test: |-
    const assert = require('assert');
    const r = summarizeCart([
      { name: "A", price: 0.1, qty: 3, stock: 5 },
      { name: "B", price: 0.2, qty: 1, stock: 0 },
    ]);
    assert.strictEqual(r.total, 0.5);
    assert.strictEqual(r.itemCount, 4);
    assert.deepStrictEqual(r.unavailable, ["B"]);
    const r2 = summarizeCart([
      { name: "Mug", price: 9.99, qty: 2, stock: 5 },
      { name: "Poster", price: 0.1, qty: 3, stock: 10 },
      { name: "Lamp", price: 24.5, qty: 1, stock: 0 },
    ]);
    assert.strictEqual(r2.total, 44.78);
    assert.strictEqual(r2.itemCount, 6);
    assert.deepStrictEqual(r2.unavailable, ["Lamp"]);
    const r3 = summarizeCart([]);
    assert.strictEqual(r3.total, 0);
    assert.strictEqual(r3.itemCount, 0);
    assert.deepStrictEqual(r3.unavailable, []);
