  test: |-
    lines = [
        '{"trace_id": "a1", "msg": "start"}\n',
        'not json\n',
        '{"msg": "no trace"}\n',
        '{"trace_id": "b2", "msg": "other"}\n',
        '[1, 2]\n',
        '{"trace_id": ["a1"], "msg": "bad type"}\n',
        '\n',
        '{"trace_id": "a1", "msg": "end"}\n',
        '{"trace_id": "c3", "msg": "third"}\n',
    ]
    out = list(records_for_traces(lines, ["c3", "a1"]))
    assert [r["msg"] for r in out] == ["start", "end", "third"]
    assert list(records_for_traces(lines, [])) == []
    assert list(records_for_traces(iter(lines), ["zz"])) == []
    assert list(records_for_traces(iter(lines), ["b2", "b2"])) == [{"trace_id": "b2", "msg": "other"}]
