id: gen-1-00208-refactor
category: refactor
language: dockerfile
patterns:
- small-container-images
facts:
- F-CONTAINER-IMAGE
messages:
- role: user
  content: |
    hi, im new to docker and not sure whats wrong. this is the image for our diffusion simulation (numpy, scipy, pandas, matplotlib). every time i change one line in run_diffusion.py the build takes many minutes and the image is huge. can you make it better?

    ```dockerfile
    FROM python:3.12

    RUN apt-get update && apt-get install -y build-essential git curl vim htop

    WORKDIR /app
    COPY . /app

    RUN pip install -r requirements.txt
    RUN pip install pytest black ipython

    ENV MPLBACKEND=Agg

    CMD ["python", "run_diffusion.py", "--config", "configs/default.yaml"]
    ```

    requirements.txt:
    ```text
    numpy
    scipy
    pandas
    matplotlib
    pyyaml
    ```
- role: assistant
  content: |
    Two things make this slow: the full base image with extra tools, and `COPY . /app` coming before `pip install`. Every code change then invalidates the cache and reinstalls all packages.

    ```dockerfile
    FROM python:3.12-slim

    WORKDIR /app

    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt

    COPY . .

    ENV MPLBACKEND=Agg

    CMD ["python", "run_diffusion.py", "--config", "configs/default.yaml"]
    ```

    **Green Notes**
    - **Slim base image, runtime dependencies only** (reduces E, M): numpy, scipy, pandas and matplotlib ship prebuilt wheels, so the simulation does not need `build-essential`, `git`, `curl`, `vim` or `htop`. The same goes for `pytest`, `black` and `ipython`, which the job never runs. In Green Metrics Tool micro-benchmarks, building a small Flask app from the slim image with only runtime dependencies used about 7× less energy than building it from the full image with dev tools. Serving requests afterwards cost the same with both images. The saving is in every build, pull and stored copy of the image.
    - **Dependency layer before the source** (reduces E): `requirements.txt` is copied and installed first, so changing `run_diffusion.py` only rebuilds the last `COPY` layer. Packages are not downloaded again.
    - **`pip --no-cache-dir`** (reduces M): the pip download cache is not kept in the image.

    Behavior differences:
    - You can no longer open `vim` or use `git` inside the container. Edit on your machine and rebuild, which is now fast.
    - If you run tests in the container, put `pytest` and `black` in a separate `requirements-dev.txt` and use it only for a dev build.
    - If a package ever fails to install with a compiler error, it has no wheel for your platform. Then install the compiler in that same `RUN` step and remove it afterwards.
verify:
  static_only: Dockerfile build needs a Docker daemon and network access to pull images and wheels
