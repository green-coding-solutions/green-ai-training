id: gen-1-00055-refactor
category: refactor
language: bash
patterns:
- bash-quoting
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    fix this

    ```bash
    #!/bin/bash
    # sweep.sh - job list for the pressure-solver parameter sweep
    N=${1:-2000}
    HEADER="# solver=cg tol=1e-8 maxit=5000 precond=ilu0 mesh=wing_v3.msh"
    echo "$HEADER"
    echo "run,alpha,beta"
    for ((i=0; i<N; i++)); do
      alpha=$(( i % 50 ))
      beta=$(( i / 50 ))
      echo "$i,$alpha,$beta"
      echo "  opts: -ksp_type cg -ksp_rtol 1e-8 -pc_type ilu -pc_factor_levels 0 -ksp_max_it 5000 -mat_type aij -log_view"
    done
    ```
- role: assistant
  content: |
    ```bash
    #!/bin/bash
    # sweep.sh - job list for the pressure-solver parameter sweep
    N=${1:-2000}
    HEADER='# solver=cg tol=1e-8 maxit=5000 precond=ilu0 mesh=wing_v3.msh'
    echo "$HEADER"
    echo 'run,alpha,beta'
    for ((i=0; i<N; i++)); do
      alpha=$(( i % 50 ))
      beta=$(( i / 50 ))
      echo "$i,$alpha,$beta"
      echo '  opts: -ksp_type cg -ksp_rtol 1e-8 -pc_type ilu -pc_factor_levels 0 -ksp_max_it 5000 -mat_type aij -log_view'
    done
    ```

    **Green Notes**
    - **Single quotes for literals without expansion** (reduces E): `HEADER`, the CSV header and the `opts:` line contain no `$`, backticks or backslashes. Bash does not need to scan them, so they are now single-quoted. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes. Your `opts:` line is only about 100 characters, so the saving here is much smaller. It grows with literal length and loop count.
    - **Double quotes kept where needed:** `"$HEADER"` and `"$i,$alpha,$beta"` still expand variables, so they stay double-quoted. Output is byte-for-byte the same.

    This is a Low-impact change. It is worth it as a habit, but it will not change the runtime of a script that runs once.
verify:
  static_only: bash script with no function or module interface; output is identical by inspection
