    ```python
    import os
    import sqlite3
    from contextlib import closing

    import numpy as np
    from PIL import Image

    INSERT_SQL = "INSERT INTO frame_stats VALUES (?, ?, ?, ?, ?, ?)"
    BATCH_SIZE = 500


    def process_run(run_id, frames, out_dir, db_path="frames.db"):
        """frames: iterable of 2D float arrays from the detector."""
        os.makedirs(out_dir, exist_ok=True)
        with closing(sqlite3.connect(db_path)) as conn:
            conn.execute(
                "CREATE TABLE IF NOT EXISTS frame_stats "
                "(run_id TEXT, idx INTEGER, mean REAL, std REAL, peak REAL, preview TEXT)"
            )
            rows = []
            for i, frame in enumerate(frames):
                frame = np.asarray(frame, dtype=np.float64)
                lo, hi = frame.min(), frame.max()
                span = (hi - lo) or 1.0  # constant frame: avoid 0/0
                scaled = (frame - lo) / span * 255

                path = os.path.join(out_dir, f"{run_id}_{i:05d}.webp")
                Image.fromarray(scaled.astype(np.uint8)).save(
                    path, "WEBP", quality=80, method=4
                )

                rows.append((run_id, i, float(frame.mean()), float(frame.std()),
                             float(hi), path))
                if len(rows) >= BATCH_SIZE:
                    conn.executemany(INSERT_SQL, rows)
                    conn.commit()
                    rows.clear()

            if rows:
                conn.executemany(INSERT_SQL, rows)
                conn.commit()
    ```

    **Green Notes**
    - **Batched inserts** (reduces E): the old code committed once per frame. Each commit is a separate transaction with its own disk sync. Now it is one `executemany` and one commit per 500 frames. For a run with thousands of frames, that is thousands of commits replaced by a handful. Chunking keeps memory bounded and keeps earlier batches if the run crashes.
    - **Lossy WebP previews instead of PNG** (reduces storage and network): detector frames are noisy, and lossless PNG compresses noise badly. WebP at quality 80 gives much smaller preview files for the portal or any download. Encoding happens once per frame here, which is the right place for it. I did not use AVIF. Its encoder is much more expensive, and measured encoding cost is highest for AVIF among the common web formats.

    **Behavior changes to check**
    - Previews are now lossy and use the `.webp` extension. Update anything that reads the old `.png` paths. Do not use previews for quantitative work. The stats in the DB come from the raw arrays, so those are unchanged. If you need lossless previews, use `save(path, "WEBP", lossless=True)` or keep PNG.
    - A constant frame used to divide by zero and give NaN pixels. It now gives a black image.
