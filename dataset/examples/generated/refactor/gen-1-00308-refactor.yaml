    import os
    import sqlite3

    import numpy as np
    from PIL import Image


    def process_run(run_id, frames, out_dir, db_path="frames.db"):
        """frames: iterable of 2D float arrays from the detector."""
        os.makedirs(out_dir, exist_ok=True)
        conn = sqlite3.connect(db_path)
        conn.execute(
            "CREATE TABLE IF NOT EXISTS frame_stats "
            "(run_id TEXT, idx INTEGER, mean REAL, std REAL, peak REAL, preview TEXT)"
        )
        for i, frame in enumerate(frames):
            frame = np.asarray(frame, dtype=np.float64)
            mean = float(frame.mean())
            std = float(frame.std())
            peak = float(frame.max())

            lo, hi = frame.min(), frame.max()
            scaled = (frame - lo) / (hi - lo) * 255
            img = Image.fromarray(scaled.astype(np.uint8))
            path = os.path.join(out_dir, f"{run_id}_{i:05d}.png")
            img.save(path)

            conn.execute(
                "INSERT INTO frame_stats VALUES (?, ?, ?, ?, ?, ?)",
                (run_id, i, mean, std, peak, path),
            )
            conn.commit()
        conn.close()
