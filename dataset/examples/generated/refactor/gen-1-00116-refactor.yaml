- role: assistant
  content: |
    ```python
    from struct import *
    from math import *

    # frame: sensor id, sequence, temperature in 0.01 C, battery in mV
    FRAME_FMT = "<HHhH"
    FRAME_SIZE = calcsize(FRAME_FMT)


    def parse_frames(blob):
        frames = []
        for off in range(0, len(blob) - FRAME_SIZE + 1, FRAME_SIZE):
            sid, seq, temp, batt = unpack_from(FRAME_FMT, blob, off)
            frames.append((sid, seq, temp / 100.0, batt))
        return frames


    def build_payload(frames):
        return "".join(
            f"{sid},{seq},{round(temp, 2)},{batt}\n"
            for sid, seq, temp, batt in frames
        )


    def rms_temp(frames):
        total = 0
        for f in frames:
            total += f[2] ** 2
        return sqrt(total / len(frames))
    ```

    **Green Notes**
    - **`join` instead of `+=` in `build_payload`** (reduces E): the old loop built a new string for every concatenation and every line. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces with `+=` used ~469 J of CPU energy, and `"".join()` used ~1.8 J (roughly 260× less). A gateway batch is much smaller than that, so expect a smaller gain. It still runs on every upload, and the f-string version is shorter. The output is byte-for-byte the same.
    - **Star imports left as they are:** in the same micro-benchmarks, `from x import *` and `import x` showed no measurable energy difference. Changing them would not save anything, so I did not touch them. If your team wants explicit imports for readability, that is a style choice and not an energy one.
    - `parse_frames` and `rms_temp` are already linear and do no repeated work, so I left them alone.

    To check the real effect on your device, time `build_payload` on a typical batch with `time` or `perf stat` before and after.
