id: gen-1-00202-refactor
category: refactor
language: html
patterns:
- lazy-load-images
- context-tradeoff
messages:
- role: user
  content: |
    Category page for our outdoor shop, 36 product cards, all images load at once. Diff only please.

    ```html
    <body>
    <header class="top">
      <a href="/"><img src="/img/logo.svg" alt="Northfield Outdoor"></a>
      <nav>...</nav>
    </header>

    <section class="hero">
      <img src="/img/hero-autumn-sale.jpg" alt="Autumn sale: up to 30% off jackets" class="hero-img">
    </section>

    <ul class="grid">
      <li><a href="/p/trail-jacket"><img src="/img/p/trail-jacket.jpg" alt="Trail jacket"><h3>Trail jacket</h3><span>129.00</span></a></li>
      <li><a href="/p/rain-shell"><img src="/img/p/rain-shell.jpg" alt="Rain shell"><h3>Rain shell</h3><span>89.00</span></a></li>
      <li><a href="/p/fleece-mid"><img src="/img/p/fleece-mid.jpg" alt="Fleece mid layer"><h3>Fleece mid layer</h3><span>69.00</span></a></li>
      <li><a href="/p/down-vest"><img src="/img/p/down-vest.jpg" alt="Down vest"><h3>Down vest</h3><span>99.00</span></a></li>
      <li><a href="/p/softshell"><img src="/img/p/softshell.jpg" alt="Softshell"><h3>Softshell</h3><span>110.00</span></a></li>
      <li><a href="/p/wind-shirt"><img src="/img/p/wind-shirt.jpg" alt="Wind shirt"><h3>Wind shirt</h3><span>59.00</span></a></li>
      <!-- ... 30 more cards, same markup ... -->
    </ul>

    <footer>
      <img src="/img/pay-badges.png" alt="Accepted payment methods">
      <img src="/img/ratings-banner.jpg" alt="Rated 4.8 by customers">
    </footer>
    </body>
    ```
- role: assistant
  content: |
    ```diff
     <section class="hero">
    -  <img src="/img/hero-autumn-sale.jpg" alt="Autumn sale: up to 30% off jackets" class="hero-img">
    +  <img src="/img/hero-autumn-sale.jpg" alt="Autumn sale: up to 30% off jackets" class="hero-img" width="1600" height="600" fetchpriority="high">
     </section>

     <ul class="grid">
    -  <li><a href="/p/softshell"><img src="/img/p/softshell.jpg" alt="Softshell"><h3>Softshell</h3><span>110.00</span></a></li>
    -  <li><a href="/p/wind-shirt"><img src="/img/p/wind-shirt.jpg" alt="Wind shirt"><h3>Wind shirt</h3><span>59.00</span></a></li>
    +  <li><a href="/p/softshell"><img src="/img/p/softshell.jpg" alt="Softshell" loading="lazy" decoding="async" width="400" height="400"><h3>Softshell</h3><span>110.00</span></a></li>
    +  <li><a href="/p/wind-shirt"><img src="/img/p/wind-shirt.jpg" alt="Wind shirt" loading="lazy" decoding="async" width="400" height="400"><h3>Wind shirt</h3><span>59.00</span></a></li>
       <!-- same change for card 5 to 36 -->
     </ul>

     <footer>
    -  <img src="/img/pay-badges.png" alt="Accepted payment methods">
    -  <img src="/img/ratings-banner.jpg" alt="Rated 4.8 by customers">
    +  <img src="/img/pay-badges.png" alt="Accepted payment methods" loading="lazy" width="320" height="40">
    +  <img src="/img/ratings-banner.jpg" alt="Rated 4.8 by customers" loading="lazy" width="800" height="120">
     </footer>
    ```

    Use your real image sizes for `width` and `height`. The ones above are placeholders.

    **Green Notes**
    - **`loading="lazy"` on cards 5 to 36 and the footer images** (reduces network, E): the browser only fetches them when the visitor scrolls near them. Visitors who leave after the first row never download the rest.
    - **`width` and `height` added:** the browser can reserve space before the file arrives, so lazy images do not make the page jump.
    - **Not applied:** the logo, the hero and cards 1 to 4 stay eager. They are visible on load, and lazy loading would delay the largest image on screen. `fetchpriority="high"` on the hero makes it load first.
    - If the grid is wider on some layouts and more than 4 cards show in the first row, keep those eager too.
    - `decoding="async"` lets the browser decode the images off the critical path. It does not change what gets downloaded.
    - This only helps with images below the fold. If most visitors scroll to the end of the page, the saved bytes are smaller.

    Reference: https://patterns.greensoftware.foundation/development/media-and-code-efficiency/defer-offscreen-images
verify:
  static_only: HTML markup change, needs a real browser to observe lazy loading
