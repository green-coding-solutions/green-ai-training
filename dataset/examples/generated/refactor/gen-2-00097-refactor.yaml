      import random
      import struct as _s
      random.seed(7)
      chans = {
          "vib-01": VibrationChannel("vib-01", 100.0),
          "vib-02": VibrationChannel("vib-02", 10.2, offset_counts=32700),
      }
      frames = []
      for sid in ["vib-01", "vib-02", "vib-01", "vib-02"]:
          vals = [random.randint(0, 65535) for _ in range(2048)]
          frames.append((sid, _s.pack("<%dH" % len(vals), *vals)))
      out = []
      process(frames, chans, out.append)
      for r in out:
          print(r["sensor"], repr(r["rms_g"]), repr(r["peak_g"]), repr(r["crest"]))
      print(repr(chans["vib-02"].decode_frame(frames[1][1])[:5]))
