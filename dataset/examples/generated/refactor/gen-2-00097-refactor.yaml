  test: |
    import struct as _s, math as _m
    ch = VibrationChannel("vib-01", 100.0)
    assert ch.decode_frame(_s.pack("<2H", 32768, 32768)) == [0.0, 0.0]
    f = ch.features([3.0, -4.0])
    assert f["sensor"] == "vib-01"
    assert f["peak_g"] == 4.0
    assert f["rms_g"] == _m.sqrt(12.5)
    assert abs(f["crest"] - 4.0 / _m.sqrt(12.5)) < 1e-12
    out = []
    process([("vib-01", _s.pack("<3H", 32768, 32868, 32668))], {"vib-01": ch}, out.append)
    assert len(out) == 1 and out[0]["peak_g"] > 0
