id: gen-1-00223-refactor
category: refactor
language: html
patterns:
- lazy-load-images
facts:
- F-LAZY-IMG
messages:
- role: user
  content: |
    Our GitHub Actions job `canary-report` writes `canary-report.html` after every canary deploy of the checkout service and uploads it as a build artifact. The on-call opens it from a Slack link. Most of the time they read the summary table and close it. Only when something is red do they scroll down to the screenshots.

    Can you refactor the page so it loads lighter? Requirements:
    - plain HTML, no JavaScript (the artifact viewer blocks scripts)
    - the overall error rate chart must show up immediately, that is the first thing people look at
    - no layout jumps while the screenshots arrive
    - keep all text, alt texts and file names as they are, the job script fills in the values with sed

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Canary report - checkout @VERSION@</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 1rem; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; }
        .shot { margin: 1.5rem 0; }
        .shot img { width: 100%; height: auto; border: 1px solid #ccc; }
        .ok { color: #1a7f37; }
        .fail { color: #cf222e; font-weight: bold; }
      </style>
    </head>
    <body>
      <h1>Canary report - checkout @VERSION@</h1>
      <table>
        <tr><th>Check</th><th>Result</th><th>Threshold</th></tr>
        <tr><td>Error rate</td><td class="@ERR_CLASS@">@ERR_RATE@</td><td>&lt; 1%</td></tr>
        <tr><td>p95 latency</td><td class="@LAT_CLASS@">@P95@</td><td>&lt; 400 ms</td></tr>
        <tr><td>Pod restarts</td><td class="@RST_CLASS@">@RESTARTS@</td><td>0</td></tr>
      </table>

      <section class="shot">
        <h2>Overall error rate</h2>
        <img src="shots/overall-error-rate.png" width="1280" height="720"
             alt="Error rate of the canary versus the stable release">
      </section>

      <section class="shot">
        <h2>Latency: api-gateway</h2>
        <img src="shots/latency-api-gateway.png" width="1280" height="720"
             alt="p95 latency of api-gateway">
      </section>
      <section class="shot">
        <h2>Latency: cart</h2>
        <img src="shots/latency-cart.png" width="1280" height="720"
             alt="p95 latency of cart">
      </section>
      <section class="shot">
        <h2>Latency: payments</h2>
        <img src="shots/latency-payments.png" width="1280" height="720"
             alt="p95 latency of payments">
      </section>
      <section class="shot">
        <h2>Latency: inventory</h2>
        <img src="shots/latency-inventory.png" width="1280" height="720"
             alt="p95 latency of inventory">
      </section>
      <section class="shot">
        <h2>Latency: shipping</h2>
        <img src="shots/latency-shipping.png" width="1280" height="720"
             alt="p95 latency of shipping">
      </section>
      <section class="shot">
        <h2>Latency: notifications</h2>
        <img src="shots/latency-notifications.png" width="1280" height="720"
             alt="p95 latency of notifications">
      </section>
      <section class="shot">
        <h2>Pod restarts</h2>
        <img src="shots/pod-restarts.png" width="1280" height="720"
             alt="Pod restarts during the canary window">
      </section>

      <footer><p>Generated by canary-report, run @RUN_ID@</p></footer>
    </body>
    </html>
    ```
