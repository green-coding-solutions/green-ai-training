    **Green Notes**
    - **Defer offscreen images** (reduces network and client E): the seven screenshots below the fold now carry `loading="lazy"`. The browser fetches and decodes them only when the reader scrolls near them. For someone who reads the summary and leaves, six of the seven latency and restart images are never requested. In Green Metrics Tool micro-benchmarks, an article with 15 photos (about 2 MB) loaded 20 times without scrolling used about 12% less CPU energy with lazy loading below the fold (~368 J vs ~325 J). When the page was scrolled to the end, there was no difference.
    - The saving depends on how people use the page. If most readers scroll to the bottom every time, expect no gain. In that case, leave the page as it was.

    The overall error rate chart has no `loading` attribute on purpose. It is at the top, so it loads right away, as you required. Lazy-loading the image above the fold would only delay it. The `width` and `height` attributes were already there and are unchanged. The browser still reserves the space for each screenshot, so there is no layout jump when one arrives later. Text, alt texts, file names and `@PLACEHOLDER@` tokens are untouched, so your `sed` step works as before.
verify:
  static_only: HTML only, no Python or JavaScript to execute
