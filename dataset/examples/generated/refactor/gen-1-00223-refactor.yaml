id: gen-1-00223-refactor
category: refactor
language: javascript
patterns:
- system-fonts-and-deps
messages:
- role: user
  content: |
    hi, i am new to node. i wrote this for our lab to summarize the temperature sensor readings per hour. it works but npm install takes forever and node_modules is huge for such a small script. is something wrong with my code?

    ```javascript
    const _ = require('lodash');
    const moment = require('moment');

    // readings: [{ ts: 1709301900000, value: 21.4 }, ...]
    function summarize(readings) {
      const values = _.map(readings, 'value');
      const mean = _.mean(values);
      const variance = _.sum(_.map(values, v => Math.pow(v - mean, 2))) / (values.length - 1);
      const sd = Math.sqrt(variance);

      // drop outliers further than 3 standard deviations from the mean
      const clean = _.filter(readings, r => Math.abs(r.value - mean) <= 3 * sd);

      const byHour = _.groupBy(clean, r => moment(r.ts).utc().format('YYYY-MM-DD HH'));
      return _.mapValues(byHour, rs => _.round(_.meanBy(rs, 'value'), 3));
    }

    module.exports = { summarize };
    ```
- role: assistant
  content: |
    Your logic is fine. The problem is that two large packages do jobs that plain JavaScript already does. Here is the same function with no dependencies:

    ```javascript
    function round3(x) {
      return Number(Math.round(x + 'e3') + 'e-3');
    }

    function summarize(readings) {
      const n = readings.length;
      let sum = 0;
      for (const r of readings) sum += r.value;
      const mean = sum / n;

      let sq = 0;
      for (const r of readings) sq += (r.value - mean) ** 2;
      const sd = Math.sqrt(sq / (n - 1));

      // drop outliers further than 3 standard deviations from the mean
      const byHour = {};
      for (const r of readings) {
        if (!(Math.abs(r.value - mean) <= 3 * sd)) continue;
        const iso = new Date(r.ts).toISOString(); // always UTC
        const key = iso.slice(0, 10) + ' ' + iso.slice(11, 13);
        const bucket = byHour[key] || (byHour[key] = { total: 0, count: 0 });
        bucket.total += r.value;
        bucket.count += 1;
      }

      const result = {};
      for (const key of Object.keys(byHour)) {
        result[key] = round3(byHour[key].total / byHour[key].count);
      }
      return result;
    }

    module.exports = { summarize };
    ```

    **Green Notes**
    - **Drop `moment` for one date format** (reduces E, M): you used it only to print `YYYY-MM-DD HH` in UTC. `toISOString()` already gives that in UTC, so the key is a simple slice. `moment` is a large package that loads on every start of the script, and it is in maintenance mode.
    - **Drop `lodash` for `mean`, `sum`, `groupBy`** (reduces E, M): these are short loops. Fewer packages means a smaller install, a smaller image or artifact, and less code to load at startup.
    - **Fewer passes over the data** (reduces E): the old code made several temporary arrays (`map`, `filter`, `groupBy`, `meanBy`). The new code uses plain loops and keeps only a running total and count per hour.
    - The output is the same as before, including the edge cases: an empty list or a single reading gives `{}`. `round3` rounds the way `_.round(x, 3)` does.

    *Not applied:* if `lodash` or `moment` is already used in many other files of your project, keep it there. Removing it only pays off if this was the last place using it. If you later need real time zones or local formatting, use `Intl.DateTimeFormat` first before adding a date library.
verify:
  test: |-
    const assert = require('assert');
    const base = Date.UTC(2026, 2, 1, 14, 5);
    const readings = [];
    for (let i = 0; i < 10; i++) readings.push({ ts: base + i * 1000, value: 10 });
    for (let i = 0; i < 10; i++) readings.push({ ts: base + 65 * 60000 + i * 1000, value: 11 });
    readings.push({ ts: base + 75 * 60000, value: 1000 });
    const out = summarize(readings);
    assert.deepStrictEqual(out, { '2026-03-01 14': 10, '2026-03-01 15': 11 });
    assert.deepStrictEqual(summarize([]), {});
    assert.deepStrictEqual(summarize([{ ts: base, value: 5 }]), {});
    const odd = summarize([
      { ts: base, value: 1.0004 },
      { ts: base + 1000, value: 1.0006 },
      { ts: base + 2000, value: 1.0005 },
    ]);
    assert.deepStrictEqual(odd, { '2026-03-01 14': 1.001 });
