    driver: |
      import os, random, tempfile
      random.seed(3)
      ids = [f"P{i:04d}" for i in range(40)] + ["A", "A_B", "A_S1", "s.1+x", "ctrl-neg"]
      d = tempfile.mkdtemp()
      chosen = random.sample(ids[:40], 25) + ["A", "A_B", "s.1+x", "ctrl-neg"]
      names = []
      for i, sid in enumerate(chosen):
          for lane in (2, 1):
              for r in (2, 1):
                  names.append(f"{sid}_S{i + 1}_L{lane:03d}_R{r}_001.fastq.gz")
      names += [
          "Undetermined_S0_L001_R1_001.fastq.gz",
          "A_S1_S9_L001_R1_001.fastq.gz",
          "A_S2_L001_I1_001.fastq.gz",
          "sX1+x_S5_L001_R1_001.fastq.gz",
          "P9999_S7_L001_R1_001.fastq.gz",
          "SampleSheet.csv",
      ]
      for n in names:
          open(os.path.join(d, n), "w").close()
      groups, orphans = match_fastqs(ids, d)
      for sid, entries in groups.items():
          print(sid, [(l, r, os.path.basename(p)) for l, r, p in entries])
      print(orphans)
