      from datetime import datetime as _dt, timezone as _tz
      for i in range(51000):
          record_event("a" if i % 3 else "b", {"n": i}, _dt(2024, 1, 1, tzinfo=_tz.utc))
      print(len(events))
      print(events_json(5))
      print(events_json(3, "b"))
      print(len(recent_events(100000)))
