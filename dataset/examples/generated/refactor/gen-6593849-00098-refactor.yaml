    from datetime import datetime as _dt, timezone as _tz
    events.clear()
    for i in range(MAX_EVENTS + 10):
        record_event("x", {"n": i}, _dt(2024, 1, 1, tzinfo=_tz.utc))
    assert len(events) == MAX_EVENTS
    assert recent_events(1)[0]["payload"]["n"] == MAX_EVENTS + 9
    assert events[-1]["payload"]["n"] == 10
