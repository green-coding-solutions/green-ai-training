        report = "customer,orders,total\n"
        for cust in sorted(totals):
            report += cust + "," + str(counts[cust]) + "," + "%.2f" % totals[cust] + "\n"
        return report

    def main():
        totals, counts = load_orders(sys.argv[1], date.today())
        sys.stdout.write(build_report(totals, counts))

    if __name__ == "__main__":
        main()
