- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Backpacks | Northtrail Outfitters</title>
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="/css/shop.css">
    </head>
    <body>
      <header class="site-header">
        <a href="/"><img src="/img/logo.svg" alt="Northtrail Outfitters" width="160" height="40"></a>
        <nav><a href="/tents">Tents</a> <a href="/backpacks">Backpacks</a> <a href="/stoves">Stoves</a></nav>
      </header>

      <section class="hero">
        <img src="/img/banners/backpacks-autumn.jpg" alt="Autumn backpack sale" width="1600" height="500">
        <h1>Backpacks</h1>
      </section>

      <ul class="product-grid">
        <li><a href="/p/ridge-30"><img src="/img/p/ridge-30.jpg" alt="Ridge 30L" width="400" height="400"><span>Ridge 30L</span></a></li>
        <li><a href="/p/ridge-45"><img src="/img/p/ridge-45.jpg" alt="Ridge 45L" width="400" height="400"><span>Ridge 45L</span></a></li>
        <li><a href="/p/summit-55"><img src="/img/p/summit-55.jpg" alt="Summit 55L" width="400" height="400"><span>Summit 55L</span></a></li>
        <li><a href="/p/summit-70"><img src="/img/p/summit-70.jpg" alt="Summit 70L" width="400" height="400"><span>Summit 70L</span></a></li>
        <li><a href="/p/day-18"><img src="/img/p/day-18.jpg" alt="Day 18L" width="400" height="400" loading="lazy"><span>Day 18L</span></a></li>
        <li><a href="/p/day-24"><img src="/img/p/day-24.jpg" alt="Day 24L" width="400" height="400" loading="lazy"><span>Day 24L</span></a></li>
        <li><a href="/p/hip-pack"><img src="/img/p/hip-pack.jpg" alt="Trail hip pack" width="400" height="400" loading="lazy"><span>Trail hip pack</span></a></li>
        <li><a href="/p/kids-12"><img src="/img/p/kids-12.jpg" alt="Kids 12L" width="400" height="400" loading="lazy"><span>Kids 12L</span></a></li>
      </ul>

      <footer>
        <img src="/img/payment-methods.png" alt="Accepted payment methods" width="300" height="40" loading="lazy">
        <p>&copy; Northtrail Outfitters</p>
      </footer>
    </body>
    </html>
    ```

    **Green Notes**
    - **Lazy-load offscreen images** (reduces network and client work): the second product row and the footer image now load only when the visitor scrolls near them. In Green Metrics Tool micro-benchmarks with a 15-photo article, loading it without scrolling used about 12% less CPU energy with lazy images. When the visitor scrolled to the end, there was no measurable difference. So the saving depends on how many shoppers stop before the lower rows.
    - **Above the fold stays eager:** the logo, the hero banner and the first row of products have no `loading="lazy"`. Lazy-loading the first thing the visitor sees delays it and makes the page feel slower. The first row is near the fold on most screens, so I left it eager. Move the split if your layout shows more or fewer items.
    - The `width` and `height` attributes were already set. Keep them, so the page does not jump when a lazy image arrives.

    If the page feels slow on the first view, check the hero JPEG size next. That image is on the critical path and lazy loading does not help it.
verify:
  static_only: static HTML needs a browser to observe loading behavior
