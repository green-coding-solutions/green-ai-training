id: gen-1-00369-refactor
category: refactor
language: javascript
patterns:
- system-fonts-and-deps
messages:
- role: user
  content: |
    hello, i make small tool for our team that read the nginx json log and show top 5 pages and how much data we send. it work fine but the npm install is very big for so small script, and it is slow to start on our old server. can you make it more light? thank you

    ```js
    #!/usr/bin/env node
    const fs = require('fs');
    const _ = require('lodash');
    const leftPad = require('left-pad');
    const prettyBytes = require('pretty-bytes');
    const chalk = require('chalk');

    const file = process.argv[2];
    if (!file) {
      console.error('usage: logsum <file>');
      process.exit(1);
    }

    const lines = fs.readFileSync(file, 'utf8').split('\n').filter(Boolean);
    const entries = lines.map(l => JSON.parse(l));

    const byPath = _.countBy(entries, 'path');
    const top = _.take(_.orderBy(_.toPairs(byPath), [1], ['desc']), 5);
    const total = _.sumBy(entries, 'bytes');

    console.log(chalk.bold('Top paths'));
    top.forEach(([p, n]) => console.log(leftPad(n, 6) + '  ' + p));
    console.log(chalk.green('Total sent: ' + prettyBytes(total)));
    ```
- role: assistant
  content: |
    All four packages can go. Node has what this script needs.

    ```js
    #!/usr/bin/env node
    'use strict';
    const fs = require('fs');

    const UNITS = ['B', 'kB', 'MB', 'GB', 'TB'];

    function formatBytes(n) {
      let i = 0;
      let v = n;
      while (v >= 999.5 && i < UNITS.length - 1) {
        v /= 1000;
        i++;
      }
      return `${i === 0 ? v : Number(v.toPrecision(3))} ${UNITS[i]}`;
    }

    function summarize(entries, limit = 5) {
      const counts = new Map();
      let total = 0;
      for (const e of entries) {
        counts.set(e.path, (counts.get(e.path) || 0) + 1);
        total += e.bytes || 0;
      }
      const top = [...counts].sort((a, b) => b[1] - a[1]).slice(0, limit);
      return { top, total };
    }

    function main() {
      const file = process.argv[2];
      if (!file) {
        console.error('usage: logsum <file>');
        process.exit(1);
      }

      const lines = fs.readFileSync(file, 'utf8').split('\n').filter(Boolean);
      const { top, total } = summarize(lines.map((l) => JSON.parse(l)));

      const useColor = process.stdout.isTTY && !process.env.NO_COLOR;
      const paint = (code, s) => (useColor ? `\x1b[${code}m${s}\x1b[0m` : s);

      console.log(paint(1, 'Top paths'));
      for (const [p, n] of top) {
        console.log(String(n).padStart(6) + '  ' + p);
      }
      console.log(paint(32, 'Total sent: ' + formatBytes(total)));
    }

    if (require.main === module) main();
    ```

    **Green Notes**
    - **Removed 4 dependencies** (reduces E and storage): `lodash`, `left-pad`, `pretty-bytes` and `chalk` are gone, with everything they pull in. Install is smaller, and each run loads fewer modules at start, which helps on your old server.
    - **Built-ins instead of packages:** `Map` plus one `sort` replaces `countBy`/`orderBy`/`take`. `padStart` replaces `left-pad`. A small `formatBytes` replaces `pretty-bytes`. Ties in the top list keep first-seen order, same as before.
    - **Colors:** plain ANSI codes now. Like `chalk`, they are off when output is piped, and `NO_COLOR` turns them off too.
    - Byte formatting uses 1000-based units (kB, MB) like `pretty-bytes`. Output for unusual values can differ slightly.
    - *Not applied:* streaming the file line by line. Reading the whole file is fine for logs of this size. Switch to `readline` if the files grow very large.
verify:
  module: true
  test: |-
    const assert = require('assert');
    assert.strictEqual(formatBytes(12), '12 B');
    assert.strictEqual(formatBytes(1500), '1.5 kB');
    assert.strictEqual(formatBytes(999999), '1 MB');
    assert.strictEqual(formatBytes(12345678), '12.3 MB');
    const r = summarize([
      { path: '/a', bytes: 100 },
      { path: '/b', bytes: 200 },
      { path: '/b', bytes: 50 },
      { path: '/c', bytes: 1 },
      { path: '/c', bytes: 1 },
      { path: '/d' },
    ]);
    assert.deepStrictEqual(r.top.map((x) => x[0]), ['/b', '/c', '/a', '/d']);
    assert.strictEqual(r.top[0][1], 2);
    assert.strictEqual(r.total, 352);
    assert.strictEqual(summarize([], 5).total, 0);
