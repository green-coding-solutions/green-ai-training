- role: assistant
  content: |
    The page loads all 11 charts at once, even though you first see only the logo and the top chart. The fix is to load the charts further down only when needed.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Log volume per server</title>
      <style>
        body { font-family: sans-serif; margin: 20px; }
        header { display: flex; align-items: center; gap: 12px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .grid img, .total img { width: 100%; height: auto; }
        figcaption { font-size: 14px; color: #555; }
      </style>
    </head>
    <body>
      <header>
        <img src="img/ops-logo.png" alt="Ops team logo" height="40">
        <h1>Log volume per server</h1>
      </header>

      <p>Lines per day, last 30 days. Updated every Monday 06:00.</p>

      <figure class="total">
        <img src="charts/all-servers-30d.png" alt="Total log lines per day, all servers">
        <figcaption>All servers together</figcaption>
      </figure>

      <h2>Per server</h2>
      <div class="grid">
        <figure><img src="charts/web-01.png" alt="web-01 log lines per day" loading="lazy"><figcaption>web-01</figcaption></figure>
        <figure><img src="charts/web-02.png" alt="web-02 log lines per day" loading="lazy"><figcaption>web-02</figcaption></figure>
        <figure><img src="charts/web-03.png" alt="web-03 log lines per day" loading="lazy"><figcaption>web-03</figcaption></figure>
        <figure><img src="charts/api-01.png" alt="api-01 log lines per day" loading="lazy"><figcaption>api-01</figcaption></figure>
        <figure><img src="charts/api-02.png" alt="api-02 log lines per day" loading="lazy"><figcaption>api-02</figcaption></figure>
        <figure><img src="charts/db-01.png" alt="db-01 log lines per day" loading="lazy"><figcaption>db-01</figcaption></figure>
        <figure><img src="charts/db-02.png" alt="db-02 log lines per day" loading="lazy"><figcaption>db-02</figcaption></figure>
        <figure><img src="charts/queue-01.png" alt="queue-01 log lines per day" loading="lazy"><figcaption>queue-01</figcaption></figure>
        <figure><img src="charts/cache-01.png" alt="cache-01 log lines per day" loading="lazy"><figcaption>cache-01</figcaption></figure>
        <figure><img src="charts/batch-01.png" alt="batch-01 log lines per day" loading="lazy"><figcaption>batch-01</figcaption></figure>
      </div>
    </body>
    </html>
    ```

    The page content and layout are unchanged. The only change is the `loading="lazy"` attribute on the 10 per-server charts.

    **Green Notes**
    - **Lazy-load the charts below the fold** (reduces E and network): the browser now fetches a per-server chart only when you scroll near it. In Green Metrics Tool micro-benchmarks, an article with 15 photos (about 2 MB) used about 12% less CPU energy when loaded without scrolling. When the visitor scrolled to the end, there was no difference (about 1% more, which is noise). So it helps most if you often read only the top of the page.
    - **Logo and total chart stay eager:** lazy-loading an image that is visible on first paint only delays it. If your screen is tall enough to show the first row of the grid, also remove `loading="lazy"` from `web-01` and `web-02`.
    - **Not changed:** the CSS and the chart files themselves. I only changed what the benchmark measured.
verify:
  static_only: Static HTML page, no executable code; behavior depends on browser image loading.
