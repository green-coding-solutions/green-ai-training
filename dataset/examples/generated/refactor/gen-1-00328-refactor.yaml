    ```python
    import numpy as np

    BANDS = 6
    LIGHT_TEXT = "#ffffff"
    DARK_TEXT = "#111111"


    def luminance_bands(img):
        """Average luminance of each vertical band of the hero image."""
        h, w, _ = img.shape
        band_w = w // BANDS
        result = []
        for b in range(BANDS):
            total = 0.0
            count = 0
            for y in range(h):
                for x in range(b * band_w, (b + 1) * band_w):
                    r, g, bl = img[y, x]
                    total += 0.2126 * r + 0.7152 * g + 0.0722 * bl
                    count += 1
            result.append(total / count)
        return result


    def text_colors(img, threshold=140):
        return [DARK_TEXT if lum > threshold else LIGHT_TEXT for lum in luminance_bands(img)]


    def hero_css(img):
        colors = text_colors(img)
        return "\n".join(f"--hero-text-{i}: {c};" for i, c in enumerate(colors))
    ```
- role: assistant
  content: |
    I assume you want it lighter. The slow part is `luminance_bands`: it visits every pixel in a Python loop. Here is the same logic with NumPy doing the work.

    ```python
    import numpy as np

    BANDS = 6
    LIGHT_TEXT = "#ffffff"
    DARK_TEXT = "#111111"
    LUMA_WEIGHTS = np.array([0.2126, 0.7152, 0.0722])


    def luminance_bands(img):
        """Average luminance of each vertical band of the hero image."""
        h, w, _ = img.shape
        band_w = w // BANDS
        # (h, BANDS, band_w, 3) view of the columns that belong to a band
        bands = img[:, : band_w * BANDS, :3].reshape(h, BANDS, band_w, 3)
        channel_means = bands.mean(axis=(0, 2))  # shape (BANDS, 3)
        return (channel_means @ LUMA_WEIGHTS).tolist()


    def text_colors(img, threshold=140):
        return [DARK_TEXT if lum > threshold else LIGHT_TEXT for lum in luminance_bands(img)]


    def hero_css(img):
        colors = text_colors(img)
        return "\n".join(f"--hero-text-{i}: {c};" for i, c in enumerate(colors))
    ```

    **Green Notes**
    - **Vectorized pixel loop** (reduces E): a 2400×1500 hero image meant millions of Python-level iterations, each with a pixel read, three multiplications and two additions. Now it is one reduction pass in compiled NumPy code, with no per-pixel interpreter work.
    - **Mean of channels, then weights** (reduces E): luminance is linear, so the weighted mean equals the weighted sum of the channel means. This avoids building a full-size float luminance array in memory.
    - **No JIT needed:** plain NumPy is enough here, so there is no extra dependency like Numba.
    - **Behavior:** results are the same, except for tiny float differences from a different summation order. A band whose average sits almost exactly on the threshold could flip. Leftover columns when the width is not divisible by 6 are still ignored, as before.
    - If this only runs once per deploy on a few images, the saving is small. It matters when it runs on every upload.
