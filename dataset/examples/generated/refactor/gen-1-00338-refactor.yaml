- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Casa Lago - Apartments at Lake Garda</title>
      <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
      <header>
        <img src="img/logo.png" width="120" height="40" alt="Casa Lago">
        <nav><a href="#rooms">Rooms</a> <a href="#gallery">Gallery</a> <a href="#contact">Contact</a></nav>
      </header>

      <section class="hero">
        <img src="img/hero-lake.jpg" class="hero-img" width="1600" height="900"
             fetchpriority="high" alt="Casa Lago and the lake at sunrise">
        <h1>Wake up at the lake</h1>
        <a class="btn" href="#contact">Book now</a>
      </section>

      <section id="rooms">
        <div class="card"><img src="img/room-studio.jpg" width="600" height="400" loading="lazy" decoding="async" alt="Studio"><h2>Studio</h2></div>
        <div class="card"><img src="img/room-family.jpg" width="600" height="400" loading="lazy" decoding="async" alt="Family room"><h2>Family</h2></div>
        <div class="card"><img src="img/room-attic.jpg" width="600" height="400" loading="lazy" decoding="async" alt="Attic room"><h2>Attic</h2></div>
      </section>

      <section id="gallery">
        <img src="img/g1.jpg" width="800" height="600" loading="lazy" decoding="async" alt="Garden terrace">
        <img src="img/g2.jpg" width="800" height="600" loading="lazy" decoding="async" alt="Lake view from the balcony">
        <img src="img/g3.jpg" width="800" height="600" loading="lazy" decoding="async" alt="Breakfast table">
        <img src="img/g4.jpg" width="800" height="600" loading="lazy" decoding="async" alt="Private jetty">
        <img src="img/g5.jpg" width="800" height="600" loading="lazy" decoding="async" alt="Living room">
        <img src="img/g6.jpg" width="800" height="600" loading="lazy" decoding="async" alt="Kitchen">
        <img src="img/g7.jpg" width="800" height="600" loading="lazy" decoding="async" alt="Bedroom">
        <img src="img/g8.jpg" width="800" height="600" loading="lazy" decoding="async" alt="Evening at the lake">
      </section>

      <section class="reviews">
        <blockquote><img src="img/anna.jpg" width="48" height="48" loading="lazy" decoding="async" alt="Anna"> Very quiet and clean!</blockquote>
        <blockquote><img src="img/marek.jpg" width="48" height="48" loading="lazy" decoding="async" alt="Marek"> Best view of the lake.</blockquote>
      </section>

      <footer id="contact">
        <img src="img/partner-a.png" width="120" height="40" loading="lazy" alt="Partner A">
        <img src="img/partner-b.png" width="120" height="40" loading="lazy" alt="Partner B">
        <img src="img/partner-c.png" width="120" height="40" loading="lazy" alt="Partner C">
      </footer>
    </body>
    </html>
    ```

    **Green Notes**
    - **Lazy-load images below the fold** (reduces network and E): the room photos, gallery, review photos and partner logos now load only when the guest scrolls near them. A guest who leaves after the first screen never downloads them. This matters most on mobile data. Defer offscreen images
    - **Hero and logo stay eager:** images in the first screen must not have `loading="lazy"`, because that delays the first paint. I added `fetchpriority="high"` to the hero so the browser fetches it first.
    - **`width` and `height` on every image:** the browser reserves the space, so the page does not jump when a lazy image arrives. Please set them to the real pixel size of each file. The CSS can still scale the images.
    - **`decoding="async"`** on the lazy images lets the browser decode them off the critical path.
    - **Also fixed:** all images now have `alt` text. Before, screen readers had nothing to read.
    - **Not applied:** converting the photos to WebP or AVIF would save more bytes, but that needs new files in your build. It is a good next step if the photos are large.
    - The page looks the same. Only the load timing changes.
verify:
  static_only: HTML markup only; behavior depends on a browser and image files
