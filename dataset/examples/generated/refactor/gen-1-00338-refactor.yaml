messages:
- role: user
  content: |
    Hello, I make landing page for our small apartments at the lake (Casa Lago). Page is loading slow on phones of the guests, specially when they are on mobile data. Can you optimize it and clean a little? I am not expert in html, sorry for my english.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Casa Lago - Apartments at Lake Garda</title>
      <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
      <header>
        <img src="img/logo.png" width="120" height="40">
        <nav><a href="#rooms">Rooms</a> <a href="#gallery">Gallery</a> <a href="#contact">Contact</a></nav>
