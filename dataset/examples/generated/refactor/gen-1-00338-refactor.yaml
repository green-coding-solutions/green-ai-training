        <div class="card"><img src="img/room-attic.jpg"><h2>Attic</h2></div>
      </section>

      <section id="gallery">
        <img src="img/g1.jpg"><img src="img/g2.jpg"><img src="img/g3.jpg"><img src="img/g4.jpg">
        <img src="img/g5.jpg"><img src="img/g6.jpg"><img src="img/g7.jpg"><img src="img/g8.jpg">
