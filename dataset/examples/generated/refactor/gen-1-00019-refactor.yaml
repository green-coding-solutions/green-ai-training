- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Daily Log Report</title>
      <link rel="stylesheet" href="/css/report.css">
    </head>
    <body>
      <header>
        <img src="/img/logo.svg" alt="LogHub" height="32">
        <h1>Daily Log Report</h1>
      </header>

      <picture>
        <source type="image/avif" srcset="/img/report-banner-800.avif 800w, /img/report-banner-1600.avif 1600w" sizes="100vw">
        <source type="image/webp" srcset="/img/report-banner-800.webp 800w, /img/report-banner-1600.webp 1600w" sizes="100vw">
        <img class="hero" src="/img/report-banner.jpg" width="1600" height="600"
             alt="Server room with blinking lights">
      </picture>

      <section id="errors">
        <h2>Errors per hour</h2>
        <picture>
          <source type="image/avif" srcset="/img/charts/errors-per-hour.avif">
          <source type="image/webp" srcset="/img/charts/errors-per-hour.webp">
          <img src="/img/charts/errors-per-hour.png" width="900" height="450"
               loading="lazy" alt="Bar chart of errors per hour">
        </picture>
      </section>

      <section id="latency">
        <h2>Request latency</h2>
        <picture>
          <source type="image/avif" srcset="/img/charts/latency-p95.avif">
          <source type="image/webp" srcset="/img/charts/latency-p95.webp">
          <img src="/img/charts/latency-p95.png" width="900" height="450"
               loading="lazy" alt="Line chart of p95 latency">
        </picture>
      </section>

      <section id="top-sources">
        <h2>Top log sources</h2>
        <picture>
          <source type="image/avif" srcset="/img/charts/top-sources.avif">
          <source type="image/webp" srcset="/img/charts/top-sources.webp">
          <img src="/img/charts/top-sources.png" width="900" height="450"
               loading="lazy" alt="Pie chart of top log sources">
        </picture>
      </section>

      <footer>Generated by the nightly job</footer>
    </body>
    </html>
    ```

    **Green Notes**
    - **Modern formats with fallback** (reduces network): each image is now offered as AVIF, then WebP, then the original file. The browser takes the first format it supports, so old browsers still work. Fewer bytes go over the mobile connection, and that is where the saving comes from. Pattern
    - **Encode once, in your nightly job** (reduces E): in Green Metrics Tool micro-benchmarks, encoding 50 BMP images to AVIF used about 7× the CPU energy of encoding to JPG. Create the `.avif` and `.webp` files when the report is built. Never convert per request.
    - **Right-sized banner**: `srcset` and `sizes` let a phone download the 800 px banner and not the 1600 px one. You need to create these two sizes in the build step.
    - **Lazy loading for the charts** (reduces network): the three charts are below the first screen, so they now load only when the user scrolls. The banner stays eager because it is the first thing people see. The `width` and `height` attributes also stop the page from jumping while images load.
    - **Unchanged:** the SVG logo is already small and sharp, so a raster format would not help.
    - **Check before shipping:** chart screenshots have thin lines and small text. Look at the AVIF/WebP versions at normal zoom. If text gets blurry, raise the quality setting or use lossless WebP for charts. Also, AVIF decoding costs a bit more CPU on the phone than JPEG, but the smaller download usually wins.
