- role: assistant
  content: "Two things stand out: the label vectors are rebuilt on every request, and the page ships its script with comments\
    \ and indentation.\n\n```go\npackage main\n\nimport (\n\t_ \"embed\"\n\t\"encoding/json\"\n\t\"hash/fnv\"\n\t\"math\"\n\
    \t\"net/http\"\n\t\"strings\"\n\t\"sync\"\n)\n\nconst dim = 256\n\n//go:generate esbuild web/playground.js --minify --outfile=web/playground.min.js\n\
    \n//go:embed web/playground.min.js\nvar playgroundJS []byte\n\nconst page = `<!doctype html>\n<html><body>\n<textarea\
    \ id=\"t\"></textarea>\n<input id=\"l\" value=\"billing, bug, feature\">\n<button id=\"go\">Classify</button>\n<pre id=\"\
    out\"></pre>\n<script src=\"/playground.js\"></script>\n</body></html>`\n\nfunc embed(text string) []float32 {\n\tv :=\
    \ make([]float32, dim)\n\tt := strings.ToLower(text)\n\tfor i := 0; i+3 <= len(t); i++ {\n\t\th := fnv.New32a()\n\t\t\
    h.Write([]byte(t[i : i+3]))\n\t\tv[h.Sum32()%dim] += 1\n\t}\n\tvar norm float64\n\tfor _, x := range v {\n\t\tnorm +=\
    \ float64(x) * float64(x)\n\t}\n\tif norm > 0 {\n\t\tn := float32(math.Sqrt(norm))\n\t\tfor i := range v {\n\t\t\tv[i]\
    \ /= n\n\t\t}\n\t}\n\treturn v\n}\n\n// Label vectors depend only on the label text, and requests reuse a small\n// set\
    \ of labels. The cache is bounded because labels come from the client.\n// Cached slices are shared: callers must only\
    \ read them.\nconst maxCachedLabels = 1024\n\nvar (\n\tlabelMu    sync.RWMutex\n\tlabelCache = map[string][]float32{}\n\
    )\n\nfunc labelVec(label string) []float32 {\n\tlabelMu.RLock()\n\tv, ok := labelCache[label]\n\tlabelMu.RUnlock()\n\t\
    if ok {\n\t\treturn v\n\t}\n\tv = embed(label)\n\tlabelMu.Lock()\n\tif len(labelCache) < maxCachedLabels {\n\t\tlabelCache[label]\
    \ = v\n\t}\n\tlabelMu.Unlock()\n\treturn v\n}\n\nfunc dot(a, b []float32) float64 {\n\tvar s float64\n\tfor i := range\
    \ a {\n\t\ts += float64(a[i]) * float64(b[i])\n\t}\n\treturn s\n}\n\ntype request struct {\n\tText   string   `json:\"\
    text\"`\n\tLabels []string `json:\"labels\"`\n}\n\ntype response struct {\n\tBest   string             `json:\"best\"\
    `\n\tScores map[string]float64 `json:\"scores\"`\n}\n\nfunc classify(w http.ResponseWriter, r *http.Request) {\n\tvar\
    \ in request\n\tif err := json.NewDecoder(r.Body).Decode(&in); err != nil {\n\t\thttp.Error(w, \"bad json\", http.StatusBadRequest)\n\
    \t\treturn\n\t}\n\ttv := embed(in.Text)\n\tout := response{Scores: map[string]float64{}}\n\tbest := math.Inf(-1)\n\tfor\
    \ _, l := range in.Labels {\n\t\ts := dot(tv, labelVec(l))\n\t\tout.Scores[l] = s\n\t\tif s > best {\n\t\t\tbest = s\n\
    \t\t\tout.Best = l\n\t\t}\n\t}\n\tjson.NewEncoder(w).Encode(out)\n}\n\nfunc main() {\n\thttp.HandleFunc(\"/\", func(w\
    \ http.ResponseWriter, r *http.Request) {\n\t\tw.Header().Set(\"Content-Type\", \"text/html; charset=utf-8\")\n\t\tw.Write([]byte(page))\n\
    \t})\n\thttp.HandleFunc(\"/playground.js\", func(w http.ResponseWriter, r *http.Request) {\n\t\tw.Header().Set(\"Content-Type\"\
    , \"text/javascript; charset=utf-8\")\n\t\tw.Write(playgroundJS)\n\t})\n\thttp.HandleFunc(\"/classify\", classify)\n\t\
    http.ListenAndServe(\":8080\", nil)\n}\n```\n\nPut the old `<script>` body, unchanged, into `web/playground.js`. Run `go\
    \ generate ./...` before `go build` (in CI too), or commit the generated `web/playground.min.js`.\n\n**Green Notes**\n\
    - **Memoized label vectors** (reduces E): each request re-hashed every label, although the same few labels come back every\
    \ time. Now each label is embedded once and later requests only do a map read.\n- **Bounded cache:** labels come from\
    \ the client, so the map stops growing at 1024 entries. Extra labels are just computed per request, like before.\n- *Not\
    \ applied:* caching `embed(in.Text)`. Input texts are mostly unique, so a cache would only add locking and memory.\n-\
    \ **Minified script** ([Minify web assets](https://patterns.greensoftware.foundation/development/web-performance/minify-web-assets))\
    \ (reduces network): comments and indentation no longer travel to every visitor. esbuild writes no source map here, so\
    \ none is shipped.\n- The script is now a separate file the browser fetches next to the page, so it costs one extra request.\
    \ It also keeps the Go code free of JS in a string. Behavior and output of `/classify` are unchanged.\n"
