    \ document.getElementById(\"t\").value, labels: labels }),\n    });\n    document.getElementById(\"out\").textContent\
    \ = JSON.stringify(await res.json(), null, 2);\n});\n</script>\n</body></html>`\n\nfunc embed(text string) []float32 {\n\
    \tv := make([]float32, dim)\n\tt := strings.ToLower(text)\n\tfor i := 0; i+3 <= len(t); i++ {\n\t\th := fnv.New32a()\n\
    \t\th.Write([]byte(t[i : i+3]))\n\t\tv[h.Sum32()%dim] += 1\n\t}\n\tvar norm float64\n\tfor _, x := range v {\n\t\tnorm\
    \ += float64(x) * float64(x)\n\t}\n\tif norm > 0 {\n\t\tn := float32(math.Sqrt(norm))\n\t\tfor i := range v {\n\t\t\t\
    v[i] /= n\n\t\t}\n\t}\n\treturn v\n}\n\nfunc dot(a, b []float32) float64 {\n\tvar s float64\n\tfor i := range a {\n\t\t\
