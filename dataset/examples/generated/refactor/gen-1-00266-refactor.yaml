- role: assistant
  content: |
    Yes, make WebP and JPEG files once, and lazy-load only the product pictures below the hero.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Garden Chairs | Gartenwelt</title>
      <link rel="stylesheet" href="/css/shop.css">
    </head>
    <body>
      <header class="top">
        <img src="/img/logo.svg" alt="Gartenwelt" width="140" height="32">
        <nav><a href="/chairs">Chairs</a> <a href="/tables">Tables</a> <a href="/sale">Sale</a></nav>
      </header>

      <section class="hero">
        <picture>
          <source srcset="/img/hero-chairs.webp" type="image/webp">
          <img src="/img/hero-chairs.jpg" alt="Rattan chairs on a sunny terrace" width="1200" height="500">
        </picture>
        <h1>Garden Chairs</h1>
      </section>

      <main class="grid">
        <article class="card">
          <picture>
            <source srcset="/img/products/rattan-lounge.webp" type="image/webp">
            <img src="/img/products/rattan-lounge.jpg" alt="Rattan lounge chair" width="400" height="400" loading="lazy">
          </picture>
          <h2>Rattan Lounge Chair</h2>
          <p class="price">89.00 EUR</p>
        </article>
        <article class="card">
          <picture>
            <source srcset="/img/products/teak-folding.webp" type="image/webp">
            <img src="/img/products/teak-folding.jpg" alt="Teak folding chair" width="400" height="400" loading="lazy">
          </picture>
          <h2>Teak Folding Chair</h2>
          <p class="price">64.00 EUR</p>
        </article>
        <article class="card">
          <picture>
            <source srcset="/img/products/steel-stack.webp" type="image/webp">
            <img src="/img/products/steel-stack.jpg" alt="Steel stacking chair" width="400" height="400" loading="lazy">
          </picture>
          <h2>Steel Stacking Chair</h2>
          <p class="price">39.00 EUR</p>
        </article>
        <article class="card">
          <picture>
            <source srcset="/img/products/hammock-chair.webp" type="image/webp">
            <img src="/img/products/hammock-chair.jpg" alt="Hanging hammock chair" width="400" height="400" loading="lazy">
          </picture>
          <h2>Hammock Chair</h2>
          <p class="price">119.00 EUR</p>
        </article>
        <article class="card">
          <picture>
            <source srcset="/img/products/bistro-set.webp" type="image/webp">
            <img src="/img/products/bistro-set.jpg" alt="Bistro chair" width="400" height="400" loading="lazy">
          </picture>
          <h2>Bistro Chair</h2>
          <p class="price">45.00 EUR</p>
        </article>
        <article class="card">
          <picture>
            <source srcset="/img/products/deck-chair.webp" type="image/webp">
            <img src="/img/products/deck-chair.jpg" alt="Striped deck chair" width="400" height="400" loading="lazy">
          </picture>
          <h2>Striped Deck Chair</h2>
          <p class="price">29.00 EUR</p>
        </article>
      </main>

      <footer>Gartenwelt GmbH</footer>
    </body>
    </html>
    ```

    **Green Notes**
    - **WebP with JPEG fallback instead of PNG** (reduces network, E): PNG is the wrong format for photos. In Green Metrics Tool micro-benchmarks (50 page loads per format), the browser used ~181 J of CPU energy to show PNG, ~150 J for WebP and ~134 J for JPG. Most of the gain is fewer bytes on the phone's network. Make the files once in your build or upload step, not on each request. In the same benchmarks, encoding 50 images cost ~89 J for JPG and ~290 J for WebP.
    - **`loading="lazy"` on the product cards only** (reduces network, E): pictures far down the page are not fetched until the visitor scrolls near them. The hero stays eager because it is the first thing people see, and lazy loading it would delay it. In Green Metrics Tool benchmarks, an article with 15 photos used about 12% less energy when visitors did not scroll, and no difference when they scrolled to the end. So the saving depends on how far your visitors scroll.
    - *Not applied:* AVIF. Decoding it cost about 19% more CPU than JPG in the same benchmarks, and encoding it cost about 7× JPG. WebP is the simpler choice here.

    The page looks the same. Your `width` and `height` attributes are kept, so the layout does not jump when the lazy pictures load.
