    ```python
    import asyncio
    import json
    import urllib.request

    SUPPLIERS = {
        "nordlager": "https://api.nordlager.example/v2/stock",
        "brightparts": "https://stock.brightparts.example/export.json",
        "kessler": "https://b2b.kessler.example/api/inventory",
        "tradepoint": "https://feeds.tradepoint.example/stock",
        "midway": "https://midway.example/api/v1/levels",
    }


    def fetch_stock(url):
        req = urllib.request.Request(url, headers={"Accept": "application/json"})
        with urllib.request.urlopen(req, timeout=20) as resp:
            data = json.load(resp)
        return {item["sku"]: int(item["qty"]) for item in data["items"]}


    async def fetch_all_stock():
        results = await asyncio.gather(
            *(asyncio.to_thread(fetch_stock, url) for url in SUPPLIERS.values()),
            return_exceptions=True,
        )
        stock = {}
        for name, result in zip(SUPPLIERS, results):
            if isinstance(result, OSError):
                print(f"warning: {name} unavailable ({result})")
                continue
            if isinstance(result, BaseException):
                raise result
            for sku, qty in result.items():
                stock[sku] = stock.get(sku, 0) + qty
        return stock


    def build_feed(products):
        stock = asyncio.run(fetch_all_stock())

        lines = ["id\ttitle\tprice\tavailability\tlink\n"]
        for p in products:
            qty = stock.get(p["sku"], 0)
            availability = "in_stock" if qty > 0 else "out_of_stock"
            lines.append(f"{p['sku']}\t{p['title']}\t{p['price_cents'] / 100:.2f} EUR\t{availability}\t{p['url']}\n")
        return "".join(lines)
    ```

    **Green Notes**
    - **`"".join()` instead of `+=`** (reduces E): the feed grows by one line per product, and `+=` keeps rebuilding the whole string. Collecting lines in a list and joining once does the work a single time. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J with `+=` and ~1.8 J with `join`, roughly 260× less. f-strings appended with `+=` behaved the same as plain `+=` (~455 J).
    - **Supplier calls run concurrently** (reduces wall time, slightly E): the five requests now run at the same time. The job waits for the slowest supplier instead of all five in a row. In Green Metrics Tool micro-benchmarks with 10 HTTP requests, async used about 7% less CPU energy and about 17% less wall time. So the main gain here is the shorter run, not CPU.

    Behavior is unchanged. Warnings still print in supplier order. An unexpected error, such as a malformed payload, is still raised, but only after all fetches have finished. If you ever call `build_feed` from code that already runs an event loop, such as an async web handler, use `await fetch_all_stock()` there instead of `asyncio.run`.
