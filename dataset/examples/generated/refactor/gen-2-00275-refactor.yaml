        id INTEGER PRIMARY KEY, sku TEXT, name TEXT, bin_location TEXT, weight_g INTEGER,
        description TEXT, description_html TEXT, specs TEXT, seo_text TEXT, image_urls TEXT,
        created_at TEXT, updated_at TEXT
      );
      CREATE TABLE orders (
        id INTEGER PRIMARY KEY, order_number TEXT, status TEXT, warehouse_id TEXT,
        created_at TEXT, updated_at TEXT, ship_name TEXT, ship_street TEXT, ship_city TEXT,
        ship_zip TEXT, ship_country TEXT, shipping_method TEXT, gift_message TEXT,
        payment_payload TEXT, billing_street TEXT, billing_city TEXT
