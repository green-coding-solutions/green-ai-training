id: gen-2-00275-refactor
category: refactor
language: sql
patterns:
- select-columns
facts:
- F-PG-SELECT
messages:
- role: user
  content: |
    We run the warehouse side of our shop on Postgres. The query below feeds the pick list for our Berlin warehouse. A worker runs it every 2 minutes during shifts. Each picker tablet also runs it on refresh. One run usually returns 300-800 order lines. Our DBA says it is "heavy" and asked us to clean it up.

    Requirements:
    - same rows, same order
    - still one query, no schema changes and no new indexes (we have a migration freeze until the end of the month)
    - rows come from psycopg 3 with `row_factory=dict_row`. The Jinja pick list template reads the keys directly, and I don't want to touch it. It uses `order_number`, `shipping_method`, `gift_message`, `ship_name`, `ship_street`, `ship_city`, `ship_zip`, `ship_country`, `sku`, `name`, `bin_location`, `weight_g` and `quantity`

    Table background: `products` has ~55 columns, including `description`, `description_html`, `specs` (jsonb), `seo_text` and `image_urls`. `orders` has ~40 columns, including `payment_payload` (jsonb, the raw PSP response) and the full billing address. `order_items` has a `product_snapshot` jsonb with the whole product as it was at checkout.

    ```sql
    -- pick_list.sql
    SELECT *
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.id
    JOIN products p ON p.id = oi.product_id
    WHERE o.status = 'ready_to_pick'
      AND o.warehouse_id = 'BER-1'
      AND oi.fulfillment_state = 'open'
    ORDER BY o.created_at, o.id, p.bin_location, oi.id;
    ```
- role: assistant
  content: |
    ```sql
    -- pick_list.sql
    SELECT
        o.order_number,
        o.shipping_method,
        o.gift_message,
        o.ship_name,
        o.ship_street,
        o.ship_city,
        o.ship_zip,
        o.ship_country,
        p.sku,
        p.name,
        p.bin_location,
        p.weight_g,
        oi.quantity
    FROM orders o
    JOIN order_items oi ON oi.order_id = o.id
    JOIN products p ON p.id = oi.product_id
    WHERE o.status = 'ready_to_pick'
      AND o.warehouse_id = 'BER-1'
      AND oi.fulfillment_state = 'open'
    ORDER BY o.created_at, o.id, p.bin_location, oi.id;
    ```

    **Green Notes**
    - **Name only the columns the template prints** (reduces E and network): `SELECT *` across three wide tables read, sent and decoded `description`, `description_html`, `specs`, `seo_text`, `payment_payload`, `product_snapshot` and the billing address. It did this for every order line, on every worker run and every tablet refresh. None of these columns reach the pick list. Postgres stores large text and jsonb values out of line, so a query that doesn't select them also doesn't fetch them. In Green Metrics Tool micro-benchmarks, naming the 10 needed columns of a 52-column products table with large text columns used about 5.5× to 7× less CPU energy than `SELECT *`. For a join of orders and order items with smaller columns, the gap was about 2.3× to 4×.
    - **Same rows, same order, same keys:** the joins, filters and `ORDER BY` are unchanged. `ORDER BY` can use `o.created_at`, `o.id` and `oi.id` without selecting them. The output columns keep their original names, so the template works as is. There are no schema changes and no new indexes.
    - **Duplicate keys are gone:** `SELECT *` returned `id`, `created_at` and `updated_at` once per table, and `dict_row` keeps only the last value for each name. If any code outside the template reads `row["id"]`, it was getting `products.id`, not the order id. If you need the order id, add `o.id AS order_id`.
