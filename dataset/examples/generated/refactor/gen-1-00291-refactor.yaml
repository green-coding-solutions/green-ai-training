    ?

    ```css
    /* gateway ui v2 - status page */
    :root { --bg: #101418; --fg: #e6e9ec; --ok: #3fb950; --warn: #d29922; --err: #f85149; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }

    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
    .topbar h1 { font-size: 1.1rem; margin: 0; }

    .badge { padding: 2px 8px; border-radius: 10px; font-size: .8rem; }
    .badge-ok { background: var(--ok); }
    .badge-warn { background: var(--warn); }
    .badge-err { background: var(--err); }

    main { display: grid; gap: 16px; padding: 16px; }
    .card { background: #1a2027; border-radius: 8px; padding: 16px; }
    .card.wide { grid-column: 1 / -1; }

    .grid { width: 100%; border-collapse: collapse; }
    .grid th, .grid td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a323b; }
    .batt-low { color: var(--warn); }
    .muted { color: #8b949e; }

    .btn { border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: #2f81f7; color: #fff; }
    .btn-secondary { background: transparent; color: var(--fg); border: 1px solid #444c56; }

    /* old layout, from v1 */
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #0d1117; }
    .sidebar a { display: block; padding: 10px 16px; color: var(--fg); text-decoration: none; }
    .tab-bar { display: flex; gap: 4px; }
    .tab { padding: 6px 12px; cursor: pointer; }
    .tab.active { border-bottom: 2px solid #2f81f7; }
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; }
    .modal.open { display: flex; align-items: center; justify-content: center; }
    .spinner { width: 16px; height: 16px; border: 2px solid #444c56; border-top-color: #2f81f7; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (min-width: 900px) {
      main { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .sidebar { display: none; }
      .grid th, .grid td { padding: 4px; }
    }
    ```

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>GW-204</title>
      <link rel="stylesheet" href="/gw.css">
    </head>
    <body>
      <header class="topbar">
        <h1>Gateway GW-204</h1>
        <span class="badge badge-ok" id="link">online</span>
      </header>
      <main>
        <section class="card">
          <h2>Sensors</h2>
          <table class="grid">
            <tr><th>Node</th><th>Temp</th><th>Battery</th></tr>
            <tr><td>n01</td><td>21.4</td><td>87%</td></tr>
            <tr><td>n02</td><td>19.8</td><td class="batt-low">12%</td></tr>
          </table>
        </section>
        <section class="card">
          <h2>Uplink</h2>
          <p class="muted">LTE, signal -87 dBm</p>
          <button class="btn btn-primary" id="reboot">Reboot</button>
        </section>
      </main>
      <script>
        const link = document.getElementById('link');
        function setLink(state) {
          link.className = 'badge badge-' + state; // ok | warn | err
          link.textContent = state === 'ok' ? 'online' : state === 'warn' ? 'degraded' : 'offline';
        }
      </script>
    </body>
    </html>
