    **Green Notes**
    - **Remove unused CSS** (reduces network): I dropped `.card.wide`, `.btn-secondary`, the whole v1 layout (`.sidebar`, tabs, `.modal`, `.spinner` with its `@keyframes`) and the mobile rule that hid the sidebar. Nothing in this page uses them. I kept `badge-warn` and `badge-err` because `setLink()` builds those class names at runtime. Be honest about the size of the win: in Green Metrics Tool micro-benchmarks, purging a mostly unused 16 KB stylesheet down to 0.75 KB changed client energy by about 2% over 50 cold page loads, which is within noise. The gain is fewer bytes to flash, serve and send over a slow uplink, not less CPU in the browser.
    - **Minification** (reduces network): I left the file readable. In the same kind of benchmark, an esbuild minified build of a small page used about 2% less client energy than the unminified one, again within noise. It only saves bytes. Add a minify step only if you already have a build step for the gateway image.

    Check the other pages and scripts on the gateway before you ship this. If any of them uses `.sidebar`, `.modal`, `.tab` or `.spinner`, keep those rules.
