- role: assistant
  content: |
    ```python
    import json
    import sys
    from os.path import *
    from csv import *


    def load_rows(path):
        with open(path, newline="") as f:
            return list(DictReader(f))


    def build_report(rows):
        lines = []
        for row in rows:
            if not row["sku"].strip():
                continue
            rec = {
                "sku": row["sku"].strip().upper(),
                "qty": int(row["qty"] or 0),
                "price": float(row["price"]),
            }
            lines.append(json.dumps(rec))
        return "".join(line + "\n" for line in lines)


    if __name__ == "__main__":
        src, outdir = sys.argv[1], sys.argv[2]
        rows = load_rows(src)
        report = build_report(rows)
        with open(join(outdir, basename(src) + ".ndjson"), "w") as f:
            f.write(report)
    ```

    **Green Notes**
    - **Join instead of `+=` in the row loop** (reduces E): `out += ...` builds the report piece by piece for every row, and the cost grows with the size of the file. Collecting the lines in a list and joining once does the work in one pass. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J with `+=` and ~1.8 J with `"".join()`, roughly 260× less CPU energy. The output is byte-for-byte the same.

    *Not applied:* replacing `from os.path import *` and `from csv import *` with explicit imports. In Green Metrics Tool micro-benchmarks, star imports and `import x` showed no measurable energy difference, so I left them as they are.
