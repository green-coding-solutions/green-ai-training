    Make the WebP files once, in the step that writes your plots, not on every page view. Lossless keeps the exact pixels of the figures:

    ```bash
    for f in img/*.png; do cwebp -lossless "$f" -o "${f%.png}.webp"; done
    ```

    **Green Notes**
    - **WebP with PNG fallback** (reduces network and E): plots and maps are sent as WebP, and old browsers still get the PNG. Lossless WebP is usually much smaller than PNG for this kind of image, so this helps most on slow conference wifi. In Green Metrics Tool browser benchmarks with 50 page loads per format, PNG used ~181 J and WebP ~150 J of client CPU energy.
    - **Unused CSS removed** (reduces network): `.badge-warn`, `.table-striped`, `.btn-danger`, `.alert`, `.alert-warning`, `.nav-tabs`, `.modal`, `.carousel` and `.sidebar` are not used on this page, so I deleted them. This saves bytes only. In Green Metrics Tool browser benchmarks (50 cold loads), a 16 KB stylesheet purged to 0.75 KB changed client energy by about 2%, which is within noise. Your stylesheet is small, so do not expect more than a cleaner file.

    *Not applied:* AVIF. It is smaller for photos, but encoding costs about 7× a JPG in the same benchmarks, and decoding costs more CPU than JPG. For a few plots per run, WebP is the simpler choice. If your plots have thin lines or small text, compare the WebP files with the PNGs by eye. Lossless mode should look the same, but check that you use it.
