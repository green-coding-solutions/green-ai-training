messages:
- role: user
  content: |
    Our CI runs a k6 load test on every merge request against the staging cluster and publishes this report to GitLab Pages. The MR gets a link to it. Below is the rendered output of one run (it comes from a Jinja template). Reviewers say the link is slow to open over the VPN. From the Pages access logs, most people open it, read the verdict and the summary chart, and close the tab. Only when something fails does someone scroll down to the per-endpoint charts.

    Requirements:
    - plain HTML, no JS (the Pages site has a strict CSP)
    - the summary chart must show right away, people screenshot it into the MR
    - PNGs stay PNGs, they come from matplotlib and the archive job picks them up by name
    - keep the anchors, our alerts link to `#ep-checkout` etc.

    Can you refactor it?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>Load test MR !1842 - payments-api</title>
    <link rel="stylesheet" href="../assets/report.css">
    </head>
    <body>
    <header>
      <h1>payments-api load test</h1>
      <p>MR !1842 · pipeline 99317 · commit 4f2c9ab · staging-eu1 · 200 VUs, 10 min</p>
      <p class="verdict pass">PASS - all thresholds met</p>
    </header>

    <section id="summary">
      <img src="charts/summary_rps_p95.png" alt="Requests per second and p95 latency over the run">
      <table>
        <tr><th>Endpoint</th><th>p95</th><th>Threshold</th><th>Errors</th></tr>
        <tr><td><a href="#ep-checkout">POST /checkout</a></td><td>182 ms</td><td>300 ms</td><td>3</td></tr>
        <tr><td><a href="#ep-refund">POST /refund</a></td><td>141 ms</td><td>300 ms</td><td>0</td></tr>
        <tr><td><a href="#ep-methods">GET /payment-methods</a></td><td>38 ms</td><td>100 ms</td><td>0</td></tr>
        <tr><td><a href="#ep-webhooks">POST /webhooks/psp</a></td><td>95 ms</td><td>200 ms</td><td>1</td></tr>
      </table>
    </section>

    <section id="ep-checkout">
      <h2>POST /checkout</h2>
      <img src="charts/checkout_latency.png" alt="Checkout latency percentiles">
      <img src="charts/checkout_status.png" alt="Checkout responses by status code">
    </section>
    <section id="ep-refund">
      <h2>POST /refund</h2>
      <img src="charts/refund_latency.png" alt="Refund latency percentiles">
      <img src="charts/refund_status.png" alt="Refund responses by status code">
    </section>
    <section id="ep-methods">
      <h2>GET /payment-methods</h2>
      <img src="charts/methods_latency.png" alt="Payment methods latency percentiles">
      <img src="charts/methods_status.png" alt="Payment methods responses by status code">
    </section>
    <section id="ep-refund">
      <h2>POST /webhooks/psp</h2>
      <img src="charts/webhooks_latency.png" alt="Webhook latency percentiles">
      <img src="charts/webhooks_status.png" alt="Webhook responses by status code">
    </section>

    <section id="resources">
      <h2>Cluster resources</h2>
      <img src="charts/pods_cpu.png" alt="CPU per pod">
      <img src="charts/pods_memory.png" alt="Memory per pod">
      <img src="charts/db_connections.png" alt="Postgres connections in use">
    </section>
    </body>
    </html>
    ```
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>Load test MR !1842 - payments-api</title>
    <link rel="stylesheet" href="../assets/report.css">
    </head>
    <body>
    <header>
      <h1>payments-api load test</h1>
      <p>MR !1842 · pipeline 99317 · commit 4f2c9ab · staging-eu1 · 200 VUs, 10 min</p>
      <p class="verdict pass">PASS - all thresholds met</p>
    </header>

    <section id="summary">
      <!-- above the fold: loads right away -->
      <img src="charts/summary_rps_p95.png" width="1600" height="600"
           alt="Requests per second and p95 latency over the run">
      <table>
        <tr><th>Endpoint</th><th>p95</th><th>Threshold</th><th>Errors</th></tr>
        <tr><td><a href="#ep-checkout">POST /checkout</a></td><td>182 ms</td><td>300 ms</td><td>3</td></tr>
        <tr><td><a href="#ep-refund">POST /refund</a></td><td>141 ms</td><td>300 ms</td><td>0</td></tr>
        <tr><td><a href="#ep-methods">GET /payment-methods</a></td><td>38 ms</td><td>100 ms</td><td>0</td></tr>
        <tr><td><a href="#ep-webhooks">POST /webhooks/psp</a></td><td>95 ms</td><td>200 ms</td><td>1</td></tr>
      </table>
    </section>

    <!-- below the fold: loaded only when the reader scrolls or jumps here -->
    <section id="ep-checkout">
      <h2>POST /checkout</h2>
      <img src="charts/checkout_latency.png" width="1200" height="450" loading="lazy" alt="Checkout latency percentiles">
      <img src="charts/checkout_status.png" width="1200" height="450" loading="lazy" alt="Checkout responses by status code">
    </section>
    <section id="ep-refund">
      <h2>POST /refund</h2>
      <img src="charts/refund_latency.png" width="1200" height="450" loading="lazy" alt="Refund latency percentiles">
      <img src="charts/refund_status.png" width="1200" height="450" loading="lazy" alt="Refund responses by status code">
    </section>
    <section id="ep-methods">
      <h2>GET /payment-methods</h2>
      <img src="charts/methods_latency.png" width="1200" height="450" loading="lazy" alt="Payment methods latency percentiles">
      <img src="charts/methods_status.png" width="1200" height="450" loading="lazy" alt="Payment methods responses by status code">
    </section>
    <section id="ep-webhooks">
      <h2>POST /webhooks/psp</h2>
      <img src="charts/webhooks_latency.png" width="1200" height="450" loading="lazy" alt="Webhook latency percentiles">
      <img src="charts/webhooks_status.png" width="1200" height="450" loading="lazy" alt="Webhook responses by status code">
    </section>

    <section id="resources">
      <h2>Cluster resources</h2>
      <img src="charts/pods_cpu.png" width="1200" height="450" loading="lazy" alt="CPU per pod">
      <img src="charts/pods_memory.png" width="1200" height="450" loading="lazy" alt="Memory per pod">
      <img src="charts/db_connections.png" width="1200" height="450" loading="lazy" alt="Postgres connections in use">
    </section>
    </body>
    </html>
    ```

    **Green Notes**
    - **Lazy-load the charts below the fold** (reduces E, network): the per-endpoint and resource charts now load only when someone scrolls to them or follows an alert link. In Green Metrics Tool page-load benchmarks of an article with 15 photos, `loading="lazy"` below the fold used about 12% less CPU energy on loads without scrolling. When the visitor scrolled to the end there was no difference (about 1% more, which is noise). Your access pattern is the good case: most reviewers stop at the summary.
    - **Summary chart stays eager**: it is above the fold and is what people screenshot. Lazy loading it would only delay it.
    - **`width`/`height` on every chart**: without them a lazy image has no height until it loads. The browser then sees all the empty charts close together near the viewport and may fetch them anyway. Set the values from your matplotlib output (`figsize` × `dpi`). The numbers above are placeholders. Make sure `report.css` has `img { max-width: 100%; height: auto; }` so the charts still scale down.

    **Bug fixed:** the webhooks section had `id="ep-refund"`, a duplicate of the refund section. The `#ep-webhooks` link in the summary table and any alert pointing there went nowhere. The template probably fills that `id` from the wrong variable. Check it there, or the next render brings the bug back.

    No JS, PNGs and file names are unchanged, and all anchors still work. Lazy charts inside a section that an alert jumps to load as soon as that section is on screen.
verify:
  static_only: rendered HTML report page, no executable code
