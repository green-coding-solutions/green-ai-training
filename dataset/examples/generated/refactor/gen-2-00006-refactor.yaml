- minify-assets
facts:
- F-UNUSED-CSS
- F-MINIFY
messages:
- role: user
  content: |
    clean this up, slick carousel + checkout-v1 are dead since the redesign

    ```css
    /* product.css */
    :root {
      --brand: #1f6feb;
      --sale: #c0392b;
      --muted: #6b7280;
    }

    .product {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product__gallery img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    /* old slick carousel */
    .slick-slider { position: relative; display: block; user-select: none; }
    .slick-list { overflow: hidden; margin: 0; padding: 0; }
    .slick-track { display: flex; }
    .slick-dots { display: flex; justify-content: center; list-style: none; }
    .slick-dots li button { width: 10px; height: 10px; border-radius: 50%; }

    .product__title {
      font-size: 1.75rem;
      margin-bottom: .5rem;
    }

    .price { font-size: 1.5rem; }
    .price--sale { color: var(--sale) font-weight: 700; }
    .price--old { color: var(--muted); text-decoration: line-through; }

    .btn-add {
      background: var(--brand);
      color: #fff;
      padding: .75rem 1.5rem;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-add:hover { background: #1858c4; }

    /* checkout v1 */
    .checkout-v1 .step { float: left; width: 33.33%; }
    .checkout-v1 .step.active { border-bottom: 3px solid var(--brand); }
    .checkout-v1 .summary { clear: both; padding-top: 1rem; }

    @media (max-width: 768px) {
      .product { grid-template-columns: 1fr; }
      .slick-dots { display: none; }
      .checkout-v1 .step { float: none; width: 100%; }
    }
    ```
- role: assistant
  content: |
    ```css
    /* product.css */
    :root {
      --brand: #1f6feb;
      --sale: #c0392b;
      --muted: #6b7280;
    }

    .product {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product__gallery img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .product__title {
      font-size: 1.75rem;
      margin-bottom: .5rem;
    }

    .price { font-size: 1.5rem; }
    .price--sale { color: var(--sale); font-weight: 700; }
    .price--old { color: var(--muted); text-decoration: line-through; }

    .btn-add {
      background: var(--brand);
      color: #fff;
      padding: .75rem 1.5rem;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-add:hover { background: #1858c4; }

    @media (max-width: 768px) {
      .product { grid-template-columns: 1fr; }
    }
    ```

    **Green Notes**
    - **Dead rules removed** (reduces network): all `.slick-*` and `.checkout-v1` rules are gone, including their lines in the media query. All three custom properties are still in use, so they stay. The benefit is fewer bytes per uncached load and a file that's easier to maintain. Don't expect a CPU gain: in Green Metrics Tool page-load benchmarks, purging a 16 KB stylesheet with mostly unused rules changed client CPU energy by about 2%, which is within measurement noise.
    - **Minify in the build, not by hand** (reduces network): keep this readable file as the source and let the build minify it, e.g. `esbuild product.css --minify --outfile=dist/product.css`. For a small bundle this also saves bytes rather than CPU. In Green Metrics Tool benchmarks of a small page, the minified build used about 2% less client energy, again within noise.
    - **Bug fixed:** `.price--sale` was missing a semicolon after `var(--sale)`. Because of that, the browser read `font-weight: 700` as part of the color value, and the whole declaration became invalid when it was computed. Sale prices inherited the normal text color and were never bold. With the fix they show up red and bold. That is a visible change, and the one the rule was written for.
verify:
  static_only: CSS stylesheet, no executable code
