id: gen-1-00111-refactor
category: refactor
language: go
patterns:
- string-join
messages:
- role: user
  content: "fix this, slow on big batches\n\n```go\npackage etl\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\ntype Record struct\
    \ {\n\tID     int64\n\tSource string\n\tValue  float64\n\tTags   []string\n}\n\n// BuildCSV makes the payload we bulk\
    \ load into the warehouse.\nfunc BuildCSV(records []Record) string {\n\tout := \"id,source,value,tags\\n\"\n\tfor _, r\
    \ := range records {\n\t\tif r.Source == \"\" {\n\t\t\tcontinue\n\t\t}\n\t\tline := strconv.FormatInt(r.ID, 10) + \",\"\
    \ + r.Source + \",\" + fmt.Sprintf(\"%.3f\", r.Value) + \",\"\n\t\ttags := \"\"\n\t\tfor i, t := range r.Tags {\n\t\t\t\
    if i > 0 {\n\t\t\t\ttags += \"|\"\n\t\t\t}\n\t\t\ttags += t\n\t\t}\n\t\tline += tags + \"\\n\"\n\t\tout += line\n\t}\n\
    \treturn out\n}\n```\n"
- role: assistant
  content: "```go\npackage etl\n\nimport (\n\t\"strconv\"\n\t\"strings\"\n)\n\ntype Record struct {\n\tID     int64\n\tSource\
    \ string\n\tValue  float64\n\tTags   []string\n}\n\n// BuildCSV makes the payload we bulk load into the warehouse.\nfunc\
    \ BuildCSV(records []Record) string {\n\tconst header = \"id,source,value,tags\\n\"\n\n\tvar b strings.Builder\n\tb.Grow(len(header)\
    \ + len(records)*48) // rough size guess, avoids most regrowth\n\tb.WriteString(header)\n\n\tfor _, r := range records\
    \ {\n\t\tif r.Source == \"\" {\n\t\t\tcontinue\n\t\t}\n\t\tb.WriteString(strconv.FormatInt(r.ID, 10))\n\t\tb.WriteByte(',')\n\
    \t\tb.WriteString(r.Source)\n\t\tb.WriteByte(',')\n\t\tb.WriteString(strconv.FormatFloat(r.Value, 'f', 3, 64))\n\t\tb.WriteByte(',')\n\
    \t\tb.WriteString(strings.Join(r.Tags, \"|\"))\n\t\tb.WriteByte('\\n')\n\t}\n\treturn b.String()\n}\n```\n\n**Green Notes**\n\
    - **`strings.Builder` instead of `out += line`** (reduces E): Go strings are immutable, so every `+=` allocates a new\
    \ string and copies everything written so far. For n records the bytes copied grow roughly with n², and the garbage collector\
    \ has to clean up all the old copies. The builder appends into one buffer, so total copying grows linearly.\n- **`strings.Join`\
    \ for the tags:** the inner `tags +=` loop did the same copying per record. `Join` sizes the result once.\n- **No `fmt.Sprintf`\
    \ per row:** `strconv.FormatFloat(v, 'f', 3, 64)` gives the same text as `%.3f` without format parsing and reflection.\n\
    - Output is byte for byte the same as before. A rough `Grow` guess is enough, the builder still grows if it is too small.\n\
    - *Not applied:* streaming straight to an `io.Writer` (for example `bufio.Writer` or `csv.Writer`). It would avoid holding\
    \ the whole payload in memory, but it changes the function signature, so only do it if the loader accepts a reader.\n"
verify:
  static_only: Go toolchain is not available in the verification harness
