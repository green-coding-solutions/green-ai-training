id: gen-1-00028-refactor
category: refactor
language: html
patterns:
- dom-size
facts:
- F-DOM-SIZE
messages:
- role: user
  content: |
    pipeline history page for our CI dashboard, finished runs only, ~10k rows. tab hangs on load. just give me the diff, no explanations needed

    ```html
    <div id="runs"></div>
    <script>
      async function load() {
        const res = await fetch('/api/pipelines?state=finished');
        const runs = await res.json();
        const root = document.getElementById('runs');
        for (const run of runs) {
          const row = document.createElement('div');
          row.className = 'run-row';
          const cells = [run.id, run.branch, run.status, run.duration_s + 's', run.runner, run.finished_at];
          for (const value of cells) {
            const cell = document.createElement('div');
            cell.className = 'run-cell';
            const span = document.createElement('span');
            span.textContent = value;
            cell.appendChild(span);
            row.appendChild(cell);
          }
          root.appendChild(row);
        }
      }
      load();
    </script>
    ```
- role: assistant
  content: |
    Replace the `#runs` div and the script with this:

    ```html
    <table id="runs">
      <thead>
        <tr><th>ID</th><th>Branch</th><th>Status</th><th>Duration</th><th>Runner</th><th>Finished</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <nav>
      <button id="prev" type="button">Prev</button>
      <span id="page-info"></span>
      <button id="next" type="button">Next</button>
    </nav>
    <script>
      const PAGE_SIZE = 100;
      const body = document.querySelector('#runs tbody');
      const info = document.getElementById('page-info');
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      let runs = [];
      let page = 0;

      function render() {
        const pages = Math.max(1, Math.ceil(runs.length / PAGE_SIZE));
        const frag = document.createDocumentFragment();
        for (const run of runs.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE)) {
          const tr = document.createElement('tr');
          const cells = [run.id, run.branch, run.status, run.duration_s + 's', run.runner, run.finished_at];
          for (const value of cells) {
            const td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          }
          frag.appendChild(tr);
        }
        body.replaceChildren(frag);
        info.textContent = 'Page ' + (page + 1) + ' of ' + pages;
        prev.disabled = page === 0;
        next.disabled = page >= pages - 1;
      }

      prev.addEventListener('click', () => { page--; render(); });
      next.addEventListener('click', () => { page++; render(); });

      async function load() {
        const res = await fetch('/api/pipelines?state=finished');
        runs = await res.json();
        render();
      }
      load();
    </script>
    ```

    **Green Notes**
    - **Avoid excessive DOM size** (reduces E on the client): the page now holds 100 rows instead of 10,000. Each row is 7 elements (`tr` plus six `td`) instead of 13 (a row `div`, six cell `div`s and six `span`s). Rows are built in a `DocumentFragment` and swapped in with one `replaceChildren` call, so the live DOM is touched once per page instead of once per row. In Green Metrics Tool micro-benchmarks, 30 page loads of a 10,000-row table built the old way used about 56% less CPU energy when it was paginated to 100 rows as a plain `<table>` in a fragment.

    Behavior changes:
    - Browser find (Ctrl+F) only sees the current page.
    - Your `.run-row` and `.run-cell` CSS no longer applies, so style `#runs th` and `#runs td` instead.
    - If users need to search across all runs, filter on the server with query parameters. Then the 10k rows never reach the browser at all.
  verify:
    static_only: needs a browser DOM and a fetch endpoint
