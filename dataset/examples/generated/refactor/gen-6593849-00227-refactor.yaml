  content: |
    nginx access log summarizer, runs on ~20M lines per day. diff only, no lecture.

    ```python
    import re
    from collections import Counter

    LINE_RE = r'^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) (\S+) [^"]*" (\d{3}) (\d+|-) "[^"]*" "([^"]*)"$'


    def browser_family(ua):
        if re.search(r"bot|crawler|spider|curl|python-requests", ua, re.I):
            return "bot"
        m = re.search(r"(Edg|Firefox|Chrome|Safari)/(\d+)", ua)
        if not m:
            return "other"
        name = {"Edg": "Edge"}.get(m.group(1), m.group(1))
        return f"{name} {m.group(2)}"


    def summarize(lines):
        by_family = Counter()
        by_class = Counter()
        total_bytes = 0
        for line in lines:
            m = re.match(LINE_RE, line)
            if not m:
                continue
            ip, ts, method, path, status, size, ua = m.groups()
            by_class[status[0] + "xx"] += 1
            if size != "-":
                total_bytes += int(size)
            by_family[browser_family(ua)] += 1
        return by_family, by_class, total_bytes
    ```
