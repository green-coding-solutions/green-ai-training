id: gen-1-00041-refactor
category: refactor
language: dockerfile
patterns:
- small-container-images
messages:
- role: user
  content: |
    hello, my Dockerfile for the nightly ETL job is very big and slow to build, every time I change one python file it install all again. we run it on new nodes every night so it pull the image each time. can you make it better pls?

    ```dockerfile
    FROM python:3.12

    RUN apt-get update
    RUN apt-get install -y build-essential libpq-dev curl vim

    WORKDIR /etl
    COPY . /etl

    RUN pip install -r requirements.txt

    ENV PYTHONUNBUFFERED=1

    CMD ["python", "run_etl.py"]
    ```
- role: assistant
  content: |
    ```dockerfile
    # syntax=docker/dockerfile:1

    FROM python:3.12-slim AS build
    WORKDIR /etl
    RUN python -m venv /opt/venv
    ENV PATH="/opt/venv/bin:$PATH"
    COPY requirements.txt .
    RUN --mount=type=cache,target=/root/.cache/pip \
        pip install -r requirements.txt

    FROM python:3.12-slim AS runtime
    ENV PYTHONUNBUFFERED=1 \
        PYTHONDONTWRITEBYTECODE=1 \
        PATH="/opt/venv/bin:$PATH"
    WORKDIR /etl
    COPY --from=build /opt/venv /opt/venv
    COPY . .
    CMD ["python", "run_etl.py"]
    ```

    Add a `.dockerignore` so the build context stays small:

    ```text
    .git
    __pycache__
    *.pyc
    .venv
    data/
    *.csv
    *.parquet
    ```

    I assumed your packages (pandas, pyarrow, psycopg and so on) come as prebuilt wheels, so no compiler is needed. If one package builds from source, install `build-essential` and `libpq-dev` in the `build` stage only. If you use `psycopg2` (not the binary version), install `libpq5` in the `runtime` stage.

    **Green Notes**
    - **Slim base and multi-stage build** (reduces storage and network): the final image has no compiler, no `-dev` headers, no apt lists, no `curl` or `vim`. The nightly pull on a fresh node moves far fewer bytes. Fewer installed packages also means less to patch.
    - **Dependency layer cached** (reduces E in CI): `requirements.txt` is copied before the source. Changing one `.py` file now rebuilds only the last `COPY` layer, not the full `pip install`. The pip cache mount helps when dependencies do change, and keeps the cache out of the image.
    - **`.dockerignore`:** local data files, `.git` and caches are no longer sent as build context or copied into the image. If the job needs a data file at runtime, mount it or read it from storage instead.
    - **Behavior change:** `curl` and `vim` are gone. If `run_etl.py` calls `curl` through a subprocess, add it back in the `runtime` stage.
verify:
  static_only: Dockerfile; building images needs a container runtime
