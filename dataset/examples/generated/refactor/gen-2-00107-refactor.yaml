messages:
- role: user
  content: |
    hi, this script is our perf gate in the nightly CI. it load the latencies from the k6 load test (around 30M samples, int64 microseconds, -1 when request timed out) and then check p50/p95/p99 against the baseline. the profiler say almost all the job time is in bucketize. can you make it faster? we can add packages to the CI image, numba is ok if it help.

    ```python
    import argparse
    import json
    import sys

    import numpy as np

    STEP_US = 50
    N_BUCKETS = 400  # 0..20 ms, last bucket = overflow


    def bucketize(samples, step_us, n_buckets):
        counts = [0] * (n_buckets + 1)
        for s in samples:
            if s < 0:          # -1 = request timed out
                continue
            idx = int(s // step_us)
            if idx > n_buckets:
                idx = n_buckets
            counts[idx] += 1
        return counts


    def percentile(counts, total, q, step_us):
        target = q * total
        cum = 0
        for i, c in enumerate(counts):
            cum += c
            if cum >= target:
                return (i + 1) * step_us


    def main():
        p = argparse.ArgumentParser()
        p.add_argument("latencies")
        p.add_argument("baseline")
        p.add_argument("--tolerance", type=float, default=0.10)
        args = p.parse_args()

        samples = np.load(args.latencies)
        counts = bucketize(samples, STEP_US, N_BUCKETS)
        total = len(samples)

        with open(args.baseline) as f:
            baseline = json.load(f)

        failed = False
        for name, q in (("p50", 0.50), ("p95", 0.95), ("p99", 0.99)):
            value = percentile(counts, total, q, STEP_US)
            limit = baseline[name] * (1 + args.tolerance)
            status = "OK" if value <= limit else "REGRESSION"
            print(f"{name}: {value} us (baseline {baseline[name]} us, limit {limit:.0f}) {status}")
            if value > limit:
                failed = True

        sys.exit(1 if failed else 0)


    if __name__ == "__main__":
        main()
    ```
