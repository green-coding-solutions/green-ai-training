- role: user
  content: |
    Latency regression detector in our nightly log job. Profiler says `cusum_alerts` is nearly all of the runtime, ~30M samples per night. Just give me the diff.

    ```python
    import sys
    import numpy as np


    def load_latency_ms(path):
        # one float per line, written by the parse step
        return np.loadtxt(path, dtype=np.float64)


    def cusum_alerts(latency_ms, target, slack, threshold):
        """Indices where the upward CUSUM crosses threshold. State resets after an alert."""
        alerts = []
        s = 0.0
        for i in range(len(latency_ms)):
            s = max(0.0, s + latency_ms[i] - target - slack)
            if s > threshold:
                alerts.append(i)
                s = 0.0
        return alerts


    def main(path):
        lat = load_latency_ms(path)
        target = float(np.median(lat))
        alerts = cusum_alerts(lat, target, slack=5.0, threshold=250.0)
        print(f"{len(alerts)} alerts")
        for i in alerts[:20]:
            print(i, lat[i])


    if __name__ == "__main__":
        main(sys.argv[1])
    ```
- role: assistant
  content: |
    Only `cusum_alerts` changes. The rest of the file stays as it is.

    ```python
    import numpy as np
    from numba import njit


    @njit(cache=True)
    def cusum_alerts(latency_ms, target, slack, threshold):
        """Indices where the upward CUSUM crosses threshold. State resets after an alert."""
        out = np.empty(len(latency_ms), dtype=np.int64)
        n = 0
        s = 0.0
        for i in range(len(latency_ms)):
            s = s + latency_ms[i] - target - slack
            if not s > 0.0:  # same as max(0.0, s), including for NaN
                s = 0.0
            if s > threshold:
                out[n] = i
                n += 1
                s = 0.0
        return out[:n]
    ```

    The result is now an `int64` array, not a list. `len(alerts)`, `alerts[:20]` and `lat[i]` in `main` work unchanged. If anything downstream needs a real list, use `.tolist()`.

    **Green Notes**
    - **JIT-compiled hot loop** (reduces E): the CUSUM carries state from one sample to the next, and it resets on every alert. NumPy can't vectorize that, so compiling the loop is the fitting fix. In Green Metrics Tool micro-benchmarks, a sample-by-sample loop over 10,000,000 samples used ~40 J in pure Python and ~9.5 J with Numba `@njit`, about 4× less. Your loop is a different one, so measure it on your own data.
    - **Preallocated output, no `list.append`** (reduces E, M): Numba compiles to plain array writes. The `out[:n]` slice is a view, so nothing is copied.
    - **`cache=True`**: the compile cost is paid once, not on every nightly start. The JIT only pays off because the loop runs over tens of millions of samples. For a few thousand samples, keep the plain loop.
    - Numba is a new dependency, so pin it in the image the job runs in. Check the first nightly run against the old output.
