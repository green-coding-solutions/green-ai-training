    driver: |-
      import random
      import sqlite3

      random.seed(3)
      conn = sqlite3.connect(":memory:")
      conn.execute(
          "CREATE TABLE support_tickets ("
          "id INTEGER PRIMARY KEY, customer_id INTEGER, subject TEXT, body TEXT, "
          "raw_html TEXT, attachments BLOB, embedding BLOB, status TEXT, created_at TEXT)"
      )
      words = ["refund", "invoice", "crash", "error", "login", "thanks", "order", "card"]
      extras = [
          "<p>see https://example.com/a?b=1</p>",
          "mail me at jane.doe@mail.example.org",
          "ref 123456789",
          "   spaced    out   ",
          "",
      ]
      for i in range(1, 301):
          subject = " ".join(random.choice(words) for _ in range(3)).title()
          body = " ".join(
              random.choice(words + extras) for _ in range(random.randint(3, 12))
          )
          status = "open" if i % 3 else "closed"
          conn.execute(
              "INSERT INTO support_tickets VALUES (?,?,?,?,?,?,?,?,?)",
              (i, i % 17, subject, body, "<html>" + body + "</html>",
               b"x" * 50, b"y" * 50, status, "2026-10-01"),
          )


      class FakeModel:
          def predict(self, texts):
              out = []
              for t in texts:
                  if "refund" in t or "invoice" in t:
                      out.append("billing")
                  elif "crash" in t or "error" in t:
                      out.append("bug")
                  else:
                      out.append("other")
              return out


      res = classify_new_tickets(conn, FakeModel(), 20, batch_size=7)
      print(len(res))
      print(res[:10])
      print(res[-5:])
      print(clean_text("<b>Hi</b> visit https://x.io/p now, mail a.b@c.de or call 0123456   please"))
