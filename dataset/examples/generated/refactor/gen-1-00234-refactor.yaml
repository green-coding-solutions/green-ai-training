messages:
- role: user
  content: |
    We run a small ticket triage service. Every few minutes a worker picks up new open support tickets and classifies them (billing / bug / other) with a scikit-learn pipeline. It's CPU-only and runs all day on one VM, so I'd like to cut the cost of the whole job. Requirements:

    - the labels and the order of the results must stay exactly the same
    - the model gets texts in batches, so keep that
    - no new dependencies

    ```python
    import re
    import sqlite3


    def clean_text(text):
        text = re.sub(r'<[^>]+>', ' ', text)
        text = re.sub(r'https?://\S+', ' <url> ', text)
        text = re.sub(r'\b[\w.+-]+@[\w-]+\.[\w.]+\b', ' <email> ', text)
        text = re.sub(r'\d{4,}', ' <num> ', text)
        text = re.sub(r'\s+', ' ', text)
        return text.strip().lower()


    def classify_new_tickets(conn, model, since_id, batch_size=64):
        conn.row_factory = sqlite3.Row
        rows = conn.execute(
            "SELECT * FROM support_tickets WHERE id > ? AND status = 'open' ORDER BY id",
            (since_id,),
        ).fetchall()

        results = []
        for i in range(0, len(rows), batch_size):
            batch = rows[i:i + batch_size]
            texts = [clean_text(r["subject"] + " " + r["body"]) for r in batch]
            labels = model.predict(texts)
            for r, label in zip(batch, labels):
                results.append({"id": r["id"], "label": label})
        return results
    ```

    The support_tickets table has about 30 columns, including raw_html, attachments and an embedding blob.
- role: assistant
  content: |
    ```python
    import re

    _TAG_RE = re.compile(r'<[^>]+>')
    _URL_RE = re.compile(r'https?://\S+')
    _EMAIL_RE = re.compile(r'\b[\w.+-]+@[\w-]+\.[\w.]+\b')
    _LONG_NUM_RE = re.compile(r'\d{4,}')
    _SPACE_RE = re.compile(r'\s+')


    def clean_text(text):
        text = _TAG_RE.sub(' ', text)
        text = _URL_RE.sub(' <url> ', text)
        text = _EMAIL_RE.sub(' <email> ', text)
        text = _LONG_NUM_RE.sub(' <num> ', text)
        text = _SPACE_RE.sub(' ', text)
        return text.strip().lower()


    def classify_new_tickets(conn, model, since_id, batch_size=64):
        cur = conn.execute(
            "SELECT id, subject, body FROM support_tickets "
            "WHERE id > ? AND status = 'open' ORDER BY id",
            (since_id,),
        )

        results = []
        while True:
            batch = cur.fetchmany(batch_size)
            if not batch:
                break
            texts = [clean_text(subject + " " + body) for _, subject, body in batch]
            labels = model.predict(texts)
            results.extend(
                {"id": row[0], "label": label} for row, label in zip(batch, labels)
            )
        return results
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E, network): the model only reads `id`, `subject` and `body`, but `SELECT *` also pulled `raw_html`, `attachments` and the embedding blob for every ticket, then threw them away. In Green Metrics Tool PostgreSQL micro-benchmarks, reading 2,500 rows from a 52-column table with large text columns used about 7× less CPU energy when only 10 columns were named. Your table and database are different, so measure it, but the saving grows with the size of the columns you skip. This is the biggest change here.
    - **Rows are fetched per batch** (reduces E, memory): `fetchmany(batch_size)` replaces `fetchall()`, so only one batch is held in memory. The batches, labels and result order are the same as before.
    - **Regexes compiled once at module level** (reduces E): this is a small win. Python's `re` caches compiled patterns, so the old `re.sub` calls did not recompile every time. In Green Metrics Tool micro-benchmarks a precompiled pattern used about 18% less CPU energy than inline `re.match` over 1,000,000 matches. It is still a cheap change in code that cleans every ticket.
    - **No more `conn.row_factory` change:** the old code switched the caller's connection to `sqlite3.Row` as a side effect. Rows are now plain tuples, so the connection is left as it was.

    *Not applied:* caching `clean_text` results. Tickets are mostly unique texts, so a cache would add memory and overhead without many hits.
