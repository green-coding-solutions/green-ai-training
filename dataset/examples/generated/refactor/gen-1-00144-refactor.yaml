id: gen-1-00144-refactor
category: refactor
language: go
patterns:
- select-columns
facts:
- F-PG-SELECT
sql_dialect: postgres
messages:
- role: user
  content: |
    Titration pipeline, Postgres. Only the diff please.

    ```go
    type Run struct {
        ID           int64
        ExperimentID int64
        SampleID     string
        Operator     string
        StartedAt    time.Time
        TempC        float64
        PH           float64
        Notes        string
        RawTrace     []byte // ~ several MB of detector samples
    }

    func LoadRuns(db *sql.DB, expID int64) ([]Run, error) {
        rows, err := db.Query(
            `SELECT * FROM runs WHERE experiment_id = $1 ORDER BY started_at`, expID)
        if err != nil {
            return nil, err
        }
        defer rows.Close()

        var runs []Run
        for rows.Next() {
            var r Run
            if err := rows.Scan(&r.ID, &r.ExperimentID, &r.SampleID, &r.Operator,
                &r.StartedAt, &r.TempC, &r.PH, &r.Notes, &r.RawTrace); err != nil {
                return nil, err
            }
            runs = append(runs, r)
        }
        return runs, nil
    }

    func SummarizePH(runs []Run) (mean float64, outliers []string) {
        if len(runs) == 0 {
            return 0, nil
        }
        var sum float64
        for _, r := range runs {
            sum += r.PH
        }
        mean = sum / float64(len(runs))
        for _, r := range runs {
            if math.Abs(r.PH-mean) > 0.5 && r.TempC > 20 && r.TempC < 30 {
                outliers = append(outliers, r.SampleID)
            }
        }
        return mean, outliers
    }
    ```
- role: assistant
  content: |
    `SummarizePH` only reads `PH`, `TempC` and `SampleID`, so the loader should fetch only those columns. `SummarizePH` itself is unchanged.

    ```go
    type RunSummary struct {
        SampleID string
        TempC    float64
        PH       float64
    }

    func LoadRunSummaries(db *sql.DB, expID int64) ([]RunSummary, error) {
        rows, err := db.Query(
            `SELECT sample_id, temp_c, ph
               FROM runs
              WHERE experiment_id = $1
              ORDER BY started_at`, expID)
        if err != nil {
            return nil, err
        }
        defer rows.Close()

        var runs []RunSummary
        for rows.Next() {
            var r RunSummary
            if err := rows.Scan(&r.SampleID, &r.TempC, &r.PH); err != nil {
                return nil, err
            }
            runs = append(runs, r)
        }
        return runs, rows.Err()
    }

    // SummarizePH: change the parameter type to []RunSummary, body stays the same.
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E and network): `SELECT *` pulled `raw_trace` and `notes` from Postgres, over the wire and into Go memory for every run, and nothing used them. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, naming the needed columns used about 5.5× to 7× less CPU energy than `SELECT *`. Your gain depends on how big `raw_trace` is compared to the three columns you keep. A multi-MB blob per row should make it large.
    - **Bug fixed:** the old loop never checked `rows.Err()`, so an error in the middle of the result set looked like a short, valid result. It is now returned.
    - The old positional `Scan` also broke silently whenever someone added or reordered a column in `runs`. An explicit column list removes that risk.
    - If another caller needs `raw_trace`, give it its own query. Don't widen this one.
verify:
  static_only: needs a running PostgreSQL server and the database/sql driver, which are not available in the test sandbox
