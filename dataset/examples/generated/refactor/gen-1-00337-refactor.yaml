id: gen-1-00337-refactor
category: refactor
language: javascript
patterns:
- set-membership
messages:
- role: user
  content: |
    diff only. This is the detokenize step in our inference worker. CPU profile shows `decodeBatch` right behind the model call. `SPECIAL_IDS` is about 3k reserved/unused token ids, batches are 64 seqs of up to 512 tokens.

    ```javascript
    const SPECIAL_IDS = Array.from({ length: 3000 }, (_, i) => 50000 + i * 2);

    function decodeBatch(batchTokenIds, tokenizer, stats) {
      const results = [];
      for (const ids of batchTokenIds) {
        const kept = [];
        for (let i = 0; i < ids.length; i++) {
          if (SPECIAL_IDS.indexOf(ids[i]) === -1) {
            kept.push(ids[i]);
          } else {
            stats.dropped++;
          }
        }
        stats.tokens += kept.length;
        results.push(tokenizer.decode(kept));
      }
      return results;
    }
    ```
- role: assistant
  content: |
    ```javascript
    const SPECIAL_IDS = Array.from({ length: 3000 }, (_, i) => 50000 + i * 2);
    const SPECIAL_SET = new Set(SPECIAL_IDS); // built once at load

    function decodeBatch(batchTokenIds, tokenizer, stats) {
      const results = [];
      for (const ids of batchTokenIds) {
        const kept = [];
        for (let i = 0; i < ids.length; i++) {
          if (!SPECIAL_SET.has(ids[i])) {
            kept.push(ids[i]);
          } else {
            stats.dropped++;
          }
        }
        stats.tokens += kept.length;
        results.push(tokenizer.decode(kept));
      }
      return results;
    }
    ```

    **Green Notes**
    - **Set for membership** (reduces E): `indexOf` scans the array on every token, so a batch does up to 64 × 512 scans of 3k entries. `Set.has` is O(1) per token. The set is built once, so the build cost is spread over every token you decode.
    - **Same output:** both compare ids by value. Token ids are plain integers, so the results are identical.
    - **Watch out:** the set is a snapshot. If anything pushes to `SPECIAL_IDS` at runtime, update the set too, or drop the array and keep only the set.
    - *Not applied:* nothing else. The remaining cost is `tokenizer.decode`, which is not in this snippet.
verify:
  equivalence:
    driver: |
      const tok = { decode: (ids) => ids.join(',') };
      const batch = [];
      for (let s = 0; s < 20; s++) {
        const ids = [];
        for (let i = 0; i < 100; i++) {
          ids.push(i % 3 === 0 ? 50000 + ((i * 7 + s) % 3100) : (i * 13 + s) % 49000);
        }
        batch.push(ids);
      }
      const stats = { dropped: 0, tokens: 0 };
      const out = decodeBatch(batch, tok, stats);
      console.log(out.length, stats.dropped, stats.tokens);
      console.log(out[0]);
      console.log(out[19]);
  benchmark:
    driver: |
      const tok = { decode: (ids) => ids.length };
      const batch = [];
      for (let s = 0; s < 64; s++) {
        const ids = [];
        for (let i = 0; i < 512; i++) ids.push((i * 31 + s * 17) % 49000);
        batch.push(ids);
      }
      const stats = { dropped: 0, tokens: 0 };
      for (let r = 0; r < 3; r++) decodeBatch(batch, tok, stats);
      console.log(stats.tokens);
    min_speedup: 1.5
