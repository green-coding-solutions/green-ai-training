      import os
      import random
      import tempfile

      random.seed(7)
      pool = (
          ["10.20.%d.%d" % (random.randint(0, 255), random.randint(1, 254)) for _ in range(15)]
          + ["10.30.%d.%d" % (random.randint(0, 255), random.randint(1, 254)) for _ in range(10)]
          + ["172.20.1.%d" % random.randint(1, 254) for _ in range(5)]
          + ["100.64.3.%d" % random.randint(1, 254) for _ in range(5)]
          + ["192.168.0.%d" % random.randint(1, 254) for _ in range(5)]
          + ["127.0.0.1", "8.8.8.8", "203.0.113.9", "198.51.100.23"]
      )
      lines = []
      for i in range(5000):
          if i % 97 == 0:
              lines.append("garbage line\n")
              continue
          ip = random.choice(pool)
          status = random.choice(["200", "200", "304", "404", "500", "503"])
          size = random.choice(["-", "0", str(random.randint(1, 5_000_000))])
          lines.append(
              '%s - - [23/Oct/2026:10:00:%02d +0000] "GET /api/v1/items HTTP/1.1" %s %s "-" "curl/8.5"\n'
              % (ip, i % 60, status, size)
          )
      fd, path = tempfile.mkstemp(suffix=".log")
      with os.fdopen(fd, "w") as f:
          f.writelines(lines)
      try:
          by_class, bytes_by_class, errors_by_class, size_hist, bad = summarize(path)
      finally:
          os.remove(path)
      print(sorted(by_class.items()))
      print(sorted(bytes_by_class.items()))
      print(sorted(errors_by_class.items()))
      print(sorted(size_hist.items()))
      print(bad)
