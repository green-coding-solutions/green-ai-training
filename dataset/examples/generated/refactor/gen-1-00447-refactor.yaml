id: gen-1-00447-refactor
category: refactor
language: yaml
patterns:
- compress-transmitted
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    hi, i made a landing page for our product and its running on kubernetes with nginx. the page feels slow on phones and the nginx pod uses quite some cpu even when there are not many visitors. i dont know what is wrong, i turned on gzip and set it to the highest level to make files small. can you look at my config?

    ```yaml
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: landing-nginx
      namespace: web
    data:
      default.conf: |
        server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;

          gzip on;
          gzip_comp_level 9;
          gzip_types text/html text/css application/javascript image/jpeg image/png video/mp4;

          location / {
            try_files $uri /index.html;
          }

          location /assets/ {
            expires 30d;
            add_header Cache-Control "public";
          }

          location /api/ {
            proxy_pass http://signup-api:8080;
            proxy_set_header Host $host;
          }
        }
    ```
- role: assistant
  content: |
    The idea is right, but the gzip settings spend CPU on the wrong things.

    ```yaml
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: landing-nginx
      namespace: web
    data:
      default.conf: |
        server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;

          # Dynamic compression: moderate level, text formats only
          gzip on;
          gzip_comp_level 5;
          gzip_min_length 256;
          gzip_vary on;
          gzip_types
            text/css
            text/javascript
            application/javascript
            application/json
            image/svg+xml;

          # Serve files that were compressed once at build time (index.html.gz, app.js.gz, ...)
          gzip_static on;

          location / {
            try_files $uri /index.html;
          }

          location /assets/ {
            expires 30d;
            add_header Cache-Control "public";
          }

          location /api/ {
            proxy_pass http://signup-api:8080;
            proxy_set_header Host $host;
          }
        }
    ```

    To get the full benefit of `gzip_static`, create the `.gz` files once when you build the image. For example, run `gzip -9 -k` over your `.html`, `.css`, `.js` and `.svg` files in the Dockerfile or CI. Without them, nginx falls back to compressing on the fly, so nothing breaks.

    **Green Notes**
    - **No gzip for JPEG, PNG and MP4** (reduces E): these formats are already compressed. Gzip burns CPU on every request and the files do not get smaller. This is likely most of your idle CPU use, and it can make big hero images slightly bigger.
    - **Level 5 for on-the-fly compression** (reduces E): level 9 costs a lot more CPU than level 5 for only a little smaller output. It also repeats for every visitor. Strong compression pays off only when it runs once and the result is served many times. In Green Metrics Tool micro-benchmarks, compressing 100 MB of text took about 67 J with `gzip` at its default level and about 3019 J with `brotli` at quality 11. That energy-only comparison shows how fast the cost grows with effort.
    - **`gzip_static on` with build-time compression** (reduces E, network): your HTML, CSS and JS never change between deploys. You compress them once, with a strong level if you like, and nginx just sends the file.
    - **Missing text types added** (reduces network): SVG and JSON are text but were not in your list, so they went out uncompressed. This includes the `/api/` responses. `text/html` is always compressed by nginx, so it does not need to be listed. I added `text/javascript` because newer nginx versions map `.js` to that type.
    - **`gzip_min_length 256`** (reduces E): tiny responses, like small API replies, do not benefit from compression.
    - **Behavior change:** `gzip_vary on` adds a `Vary: Accept-Encoding` header, so caches and CDNs keep compressed and plain copies apart.

    *Not applied:* Brotli. The stock nginx image does not include the module, and gzip is enough for a small landing page.
verify:
  static_only: nginx ConfigMap YAML, needs a running nginx and Kubernetes to test
