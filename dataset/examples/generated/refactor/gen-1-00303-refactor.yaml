id: gen-1-00303-refactor
category: refactor
language: bash
patterns:
- compress-stored
- avoid-exception-flow
facts:
- F-COMPRESS-CODECS
- F-EXC
messages:
- role: user
  content: |
    hi, im new to scripting. this is my nightly script for loading the shop orders into our database. it works but it is slow and the server fan is loud when it runs. i dont know what is wrong, can you make it better?

    ```bash
    #!/bin/bash
    # nightly orders ETL

    RAW=/data/etl/raw
    STAGE=/data/etl/stage
    ARCHIVE=/data/etl/archive
    DAY=$(date -d yesterday +%F)

    cp "$RAW/orders_$DAY.csv" "$STAGE/orders.csv"

    # add country name to every order
    python3 - <<EOF
    import csv
    codes = {}
    for row in csv.reader(open("/data/etl/country_codes.csv")):
        codes[row[0]] = row[1]
    out = csv.writer(open("$STAGE/orders_enriched.csv", "w"))
    for row in csv.reader(open("$STAGE/orders.csv")):
        try:
            name = codes[row[3]]
        except KeyError:
            name = "unknown"   # old shop orders have no country code
        out.writerow(row + [name])
    EOF

    gzip -9 "$STAGE/orders_enriched.csv"
    gunzip -c "$STAGE/orders_enriched.csv.gz" > "$STAGE/load.csv"
    psql "$DB_URL" -c "\copy orders_enriched FROM '$STAGE/load.csv' CSV"

    # keep a copy for one year
    xz -9 -c "$STAGE/load.csv" > "$ARCHIVE/orders_$DAY.csv.xz"
    rm -f "$STAGE"/*
    ```
- role: assistant
  content: |
    ```bash
    #!/bin/bash
    # nightly orders ETL

    RAW=/data/etl/raw
    STAGE=/data/etl/stage
    ARCHIVE=/data/etl/archive
    DAY=$(date -d yesterday +%F)

    # add country name to every order
    python3 - "$RAW/orders_$DAY.csv" "$STAGE/orders_enriched.csv" <<'PY'
    import csv
    import sys

    src, dst = sys.argv[1], sys.argv[2]

    with open('/data/etl/country_codes.csv', newline='') as f:
        codes = {row[0]: row[1] for row in csv.reader(f)}

    with open(src, newline='') as fin, open(dst, 'w', newline='') as fout:
        out = csv.writer(fout)
        for row in csv.reader(fin):
            # old shop orders have no country code
            out.writerow(row + [codes.get(row[3], 'unknown')])
    PY

    psql "$DB_URL" -c "\copy orders_enriched FROM '$STAGE/orders_enriched.csv' CSV"

    # keep a copy for one year
    zstd -q -o "$ARCHIVE/orders_$DAY.csv.zst" "$STAGE/orders_enriched.csv"
    rm -f "$STAGE"/*
    ```

    **Green Notes**
    - **No compression for the staging file** (reduces E): the old script ran `gzip -9` on the file and `gunzip` on it again a few seconds later. That is CPU work for data that lives for minutes and saves no disk space. The file now goes straight into `\copy`. The extra `cp` is gone too, because Python reads the raw file directly.
    - **`zstd` instead of `xz -9` for the one-year archive** (reduces E): archives are written every night, so compression cost repeats every night. In Green Metrics Tool micro-benchmarks on 100 MB of English text with default settings, `xz` used about 29× more CPU energy than `zstd`. Your script uses `xz -9`, which is even slower than the `xz` default. Compression is still worth it here because you keep the files for a year. Compress stored data
    - **Trade-off:** that benchmark compares energy, not file size. `xz` usually makes smaller files. If disk space is tight, try `zstd -10` or higher, which costs more CPU for smaller files. Old `.xz` archives stay readable. Reading `.zst` files needs `zstd` on the machine, for example `zstd -dc file.csv.zst`.
    - **`dict.get` instead of `try/except KeyError`** (reduces E): you say old orders have no country code, so misses happen often. Raising and catching an exception for each miss costs more than a lookup with a default. In the same micro-benchmarks, `dict.get` used about 12% less CPU energy than `try/except` when about half of the keys were missing. The result is the same.
    - Python's `csv` module and the `with` blocks also close the files properly now. Before, the output file might not be fully written when `gzip` started.
verify:
  static_only: Bash script needs /data paths, python3 and a Postgres database via psql plus zstd; cannot run in the sandbox
