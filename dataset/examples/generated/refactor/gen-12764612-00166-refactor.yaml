    MD post-processing. Each run gives ~200k frames, stored with one INSERT per frame. Slow. Diff only please.

    ```python
    import psycopg

    def store_run(conn, run_id, frames):
        """frames: iterable of (time_ps, potential_kj, temperature_k, pressure_bar)"""
        with conn.cursor() as cur:
            for step, (t, epot, temp, pres) in enumerate(frames):
                cur.execute(
                    "INSERT INTO md_frames "
                    "(run_id, step, time_ps, potential_kj, temperature_k, pressure_bar) "
                    "VALUES (%s, %s, %s, %s, %s, %s)",
                    (run_id, step, t, epot, temp, pres),
                )
        conn.commit()
        return step + 1
    ```
- role: assistant
