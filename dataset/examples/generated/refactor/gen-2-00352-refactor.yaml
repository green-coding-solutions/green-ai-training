messages:
- role: user
  content: |
    tail.css for the live-tail page in our log shipper's admin UI. The histogram strip and the export modal were ripped out last sprint. Export moved to the CLI, and the counts live in Grafana now. Drop the dead rules. Diff only.

    ```css
    :root {
      --bg: #0f1115;
      --fg: #d7dae0;
      --muted: #7d8590;
      --err: #f85149;
      --warn: #d29922;
      --info: #58a6ff;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #222;
    }

    .toolbar input[type="search"] {
      flex: 1;
      background: #161b22;
      color: var(--fg);
      border: 1px solid #30363d;
      padding: 4px 8px;
    }

    .tail {
      height: calc(100vh - 44px);
      overflow-y: auto;
      padding: 4px 12px;
    }

    .line { white-space: pre-wrap; }
    .line .ts { color: var(--muted); margin-right: 8px; }
    .line.error .lvl { color: var(--err); }
    .line.warn .lvl { color: var(--warn); }
    .line.info .lvl { color: var(--info); }

    .histogram {
      display: flex;
      align-items: flex-end;
      height: 60px;
      gap: 1px;
      padding: 4px 12px;
    }

    .histogram-bar {
      flex: 1;
      background: var(--info);
      animation: grow 0.3s ease-out;
    }

    .histogram-bar.has-errors { background: var(--err); }

    @keyframes grow {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }

    .export-modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.6);
    }

    .export-modal .panel {
      background: #161b22;
      padding: 16px;
      min-width: 320px;
    }

    @media (max-width: 600px) {
      .toolbar { flex-wrap: wrap; }
      .histogram { display: none; }
      .tail { height: calc(100vh - 80px); }
    }
    ```
