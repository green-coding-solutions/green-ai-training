    **Green Notes**
    - **Remove unused CSS** (reduces network): this removes the histogram rules, the `grow` keyframes that only the bars used, the export modal and the histogram override inside the mobile media query. `--info` and `--err` stay because `.lvl` still uses them.
    - The gain is bytes, not client CPU. In Green Metrics Tool browser benchmarks, purging a 16 KB stylesheet with mostly unused rules down to 0.75 KB changed client CPU energy by about 2%, which is within measurement noise.

    Before merging, grep the JS for `histogram` and `export-modal`. A selector search won't find class names that are built from strings at runtime.
