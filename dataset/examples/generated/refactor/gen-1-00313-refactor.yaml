id: gen-1-00313-refactor
category: refactor
language: yaml
patterns:
- text-compression
- memoize
facts:
- F-LRU
messages:
- role: user
  content: |
    Run viewer for the reaction-kinetics group. nginx serves the summary JSON and proxies /api to the results app. summarize.py runs on every finished run. Diff only please.

    ```yaml
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: runviewer-config
      namespace: kinetics
    data:
      nginx.conf: |
        events {}
        http {
          include /etc/nginx/mime.types;
          gzip on;
          gzip_comp_level 9;
          gzip_min_length 0;
          gzip_proxied any;
          gzip_types text/plain text/css application/javascript image/png application/zip;
          server {
            listen 8080;
            location /summary/ { root /data; }
            location /api/ { proxy_pass http://127.0.0.1:9000; }
          }
        }
      summarize.py: |
        import csv, json, re, sys

        MASSES = {"H": 1.008, "C": 12.011, "N": 14.007, "O": 15.999, "S": 32.06}

        def molar_mass(formula):
            total = 0.0
            for el, n in re.findall(r"([A-Z][a-z]?)(\d*)", formula):
                total += MASSES[el] * int(n or 1)
            return total

        def main(path, out):
            totals = {}
            with open(path) as f:
                for row in csv.DictReader(f):
                    m = molar_mass(row["species"]) * float(row["moles"])
                    totals[row["step"]] = totals.get(row["step"], 0.0) + m
            with open(out, "w") as f:
                json.dump(totals, f)

        main(sys.argv[1], sys.argv[2])
    ```
- role: assistant
  content: |
    ```yaml
    data:
      nginx.conf: |
        # ...
          gzip on;
          gzip_comp_level 5;
          gzip_min_length 1024;
          gzip_vary on;
          gzip_proxied any;
          gzip_types text/plain text/css text/csv application/javascript application/json;
        # ...
      summarize.py: |
        import csv, json, re, sys
        from functools import lru_cache

        MASSES = {"H": 1.008, "C": 12.011, "N": 14.007, "O": 15.999, "S": 32.06}

        @lru_cache(maxsize=1024)
        def molar_mass(formula):
            total = 0.0
            for el, n in re.findall(r"([A-Z][a-z]?)(\d*)", formula):
                total += MASSES[el] * int(n or 1)
            return total
        # rest unchanged
    ```

    **Green Notes**
    - **`application/json` and `text/csv` added to `gzip_types`** (reduces network): the summary and API responses were going out uncompressed. `image/png` and `application/zip` are already compressed, so gzip only burned CPU on them. I removed both.
    - **Level 9 → 5, `gzip_min_length 1024`** (reduces E): these are dynamic responses, so every request pays the compression cost. Level 9 adds a lot of CPU for a small size gain over the middle levels. Tiny bodies are not worth compressing. `gzip_vary on` keeps shared caches correct.
    - **`lru_cache` on `molar_mass`** (reduces E): the function is pure, and a run has a few dozen distinct species formulas repeated over many rows. The regex parse now runs once per formula. In Green Metrics Tool micro-benchmarks, 1,000,000 repeated computations drawn from 200 distinct inputs used about 9× less CPU energy with `lru_cache` ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=ddf98f50-15ee-48e2-ab38-cc89acc88142,808b9a2c-1abf-4af5-9b04-3a6ce700fcdb)). Your gain depends on how repeated your formulas are. With mostly unique inputs, the cache only adds overhead.
    - **Behavior:** output is identical. `maxsize=1024` bounds memory, and the cache lives only as long as the script process.
    - *Not applied:* a stronger codec such as brotli at max quality. It only makes sense for files compressed once and served many times, not for per-request responses.
verify:
  static_only: Kubernetes ConfigMap with embedded nginx config and Python script; nginx not available
