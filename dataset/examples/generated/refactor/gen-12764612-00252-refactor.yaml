facts:
- F-BASH-SUBPROC
messages:
- role: user
  content: |
    hi, i have script for my REST api timing log. it is very slow when log is big (200k lines on busy day) and it take many minutes. can you make it better pls? the output must stay same, other script read it

    each line in log is like `2024-05-14T10:22:01 GET /v1/orders 200 143` (time, method, path, status, milliseconds)

    ```bash
    #!/bin/bash
    # timing summary for the orders api
    LOG=${1:-/var/log/ordersapi/timing.log}

    total=0
    sum=0
    slow=0
    ok=0
    client_err=0
    server_err=0

    while read line; do
      status=$(echo $line | cut -d' ' -f4)
      ms=$(echo $line | cut -d' ' -f5)
      class=$(echo $status | cut -c1)

      total=$(expr $total + 1)
      sum=$(expr $sum + $ms)

      if [ $ms -ge 1000 ]; then
        slow=$(expr $slow + 1)
      fi

      if [ "$class" = "2" ]; then
        ok=$(expr $ok + 1)
      elif [ "$class" = "4" ]; then
        client_err=$(expr $client_err + 1)
      elif [ "$class" = "5" ]; then
        server_err=$(expr $server_err + 1)
      fi
    done < "$LOG"

    echo "requests: $total"
    echo "2xx: $ok"
    echo "4xx: $client_err"
    echo "5xx: $server_err"
    echo "slow (>=1000ms): $slow"
    echo "avg ms: $(expr $sum / $total)"
    ```
- role: assistant
  content: |
    The loop starts about 6 processes for every log line (`echo`, `cut`, `expr`). The whole file can be done in one `awk` pass:

    ```bash
    #!/bin/bash
    # timing summary for the orders api
    LOG=${1:-/var/log/ordersapi/timing.log}

    awk '
    NF >= 5 {
      total++
      sum += $5
      if ($5 >= 1000) slow++
      class = int($4 / 100)
      if (class == 2) ok++
      else if (class == 4) client_err++
      else if (class == 5) server_err++
    }
    END {
      printf "requests: %d\n", total
      printf "2xx: %d\n", ok
      printf "4xx: %d\n", client_err
      printf "5xx: %d\n", server_err
      printf "slow (>=1000ms): %d\n", slow
      printf "avg ms: %d\n", total ? sum / total : 0
    }' "$LOG"
    ```

    **Green Notes**
    - **Single-pass tool instead of subprocesses in a loop** (reduces E): the old script forked about 6 processes per line, so 200k lines meant over a million process starts. Now there is one `awk` process. In Green Metrics Tool micro-benchmarks on a 20,000-line access log, a `while read` loop with `$(echo | cut)` and `$(expr)` used about 1302 J and 238 s. One `awk` pass over the same file used about 1.0 J and 0.21 s. That is over 1000× less energy. Your log is bigger, but the cause is the same: process starts dominate.

    The output format is the same. The status class now comes from `status / 100` instead of the first character, which gives the same result for normal 3-digit HTTP codes. Three small differences:
    - Lines with fewer than 5 fields (blank or broken lines) are skipped. Before, they were counted and made `expr` print errors.
    - An empty log prints `avg ms: 0`. Before, it failed with a division by zero.
    - A last line without a trailing newline is now counted. `read` used to drop it.
verify:
  static_only: bash script reads a log file path and has no python/js equivalent harness; checked by reasoning about identical
    output format
