- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Partner feed ingest – nightly run</title>
      <link rel="stylesheet" href="report.css">
    </head>
    <body>
      <header class="top">
        <img class="logo" src="assets/logo.png" width="160" height="40" alt="Data Platform">
        <h1>Partner feed ingest</h1>
      </header>

      <table class="kpi">
        <tr><th>Feeds</th><th>Rows loaded</th><th>Rejected</th><th>Duration</th></tr>
        <tr><td>14</td><td>2,481,903</td><td>312</td><td>41 min</td></tr>
      </table>

      <section class="hero">
        <img src="charts/rows_per_hour.png" width="960" height="420" alt="Rows loaded per hour">
      </section>

      <section class="grid">
        <h2>Per feed</h2>
        <img loading="lazy" src="charts/feed_acme.png" width="460" height="260" alt="Acme feed: rows and rejects">
        <img loading="lazy" src="charts/feed_belmont.png" width="460" height="260" alt="Belmont feed: rows and rejects">
        <img loading="lazy" src="charts/feed_cargoline.png" width="460" height="260" alt="Cargoline feed: rows and rejects">
        <img loading="lazy" src="charts/feed_delta.png" width="460" height="260" alt="Delta feed: rows and rejects">
        <img loading="lazy" src="charts/feed_eurotrade.png" width="460" height="260" alt="Eurotrade feed: rows and rejects">
        <img loading="lazy" src="charts/feed_fjord.png" width="460" height="260" alt="Fjord feed: rows and rejects">
        <img loading="lazy" src="charts/feed_gamma.png" width="460" height="260" alt="Gamma feed: rows and rejects">
        <img loading="lazy" src="charts/feed_helix.png" width="460" height="260" alt="Helix feed: rows and rejects">
      </section>

      <footer>Generated by ingest-report</footer>
    </body>
    </html>
    ```

    The only change is `loading="lazy"` on the eight per-feed charts. It needs no JavaScript, and class names, file names and layout stay the same.

    **Green Notes**
    - **Lazy-load the charts below the fold** (reduces network, E): the browser now fetches the per-feed charts only when a reader scrolls near them. In Green Metrics Tool micro-benchmarks with an article of 15 photos (about 2 MB), loading the page without scrolling used about 12% less CPU energy with lazy images. When the reader scrolled to the end, there was no difference (about 1% more, which is noise). So this only pays off if many readers stop reading at the top of the page.
    - **Logo and hero chart stay eager:** they are visible on load. Lazy-loading an image above the fold delays what people look at first.
    - **`width` and `height` were already set:** this keeps the layout stable while the lazy images arrive. Keep them when you add charts.

    If everyone scrolls through all eight feed charts on every run, expect no saving. In that case the change is harmless, but it does nothing. If the page is also printed or saved as PDF, check that the lazy charts appear in the output.
verify:
  static_only: static HTML page, no executable code
