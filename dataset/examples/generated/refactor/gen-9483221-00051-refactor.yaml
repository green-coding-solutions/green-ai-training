messages:
- role: user
  content: |
    Our ingest job writes `partner_feeds.html` after every run and mails the link to the data team. I want to speed the page up a bit. Requirements:

    - no JavaScript, the page is also opened from a file share
    - keep class names and file names, our CSS and the job depend on them
    - keep the layout exactly as it is
    - the logo and the "rows loaded per hour" chart are what people look at first

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Partner feed ingest – nightly run</title>
      <link rel="stylesheet" href="report.css">
    </head>
    <body>
      <header class="top">
        <img class="logo" src="assets/logo.png" width="160" height="40" alt="Data Platform">
        <h1>Partner feed ingest</h1>
      </header>

      <table class="kpi">
        <tr><th>Feeds</th><th>Rows loaded</th><th>Rejected</th><th>Duration</th></tr>
        <tr><td>14</td><td>2,481,903</td><td>312</td><td>41 min</td></tr>
      </table>

      <section class="hero">
        <img src="charts/rows_per_hour.png" width="960" height="420" alt="Rows loaded per hour">
      </section>

      <section class="grid">
        <h2>Per feed</h2>
        <img src="charts/feed_acme.png" width="460" height="260" alt="Acme feed: rows and rejects">
        <img src="charts/feed_belmont.png" width="460" height="260" alt="Belmont feed: rows and rejects">
        <img src="charts/feed_cargoline.png" width="460" height="260" alt="Cargoline feed: rows and rejects">
        <img src="charts/feed_delta.png" width="460" height="260" alt="Delta feed: rows and rejects">
        <img src="charts/feed_eurotrade.png" width="460" height="260" alt="Eurotrade feed: rows and rejects">
        <img src="charts/feed_fjord.png" width="460" height="260" alt="Fjord feed: rows and rejects">
        <img src="charts/feed_gamma.png" width="460" height="260" alt="Gamma feed: rows and rejects">
        <img src="charts/feed_helix.png" width="460" height="260" alt="Helix feed: rows and rejects">
