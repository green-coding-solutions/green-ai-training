- role: assistant
  content: |
    Keep this file as the readable source and let the build produce the `.min.css`. I also fixed two bugs.

    ```css
    /* Cart drawer - source file.
       cart-drawer.min.css is generated by `npm run build:css`. Do not edit it by hand. */

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .cart-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 420px;
      max-width: 100%;
      background: #fff;
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.15);
      transform: translateX(100%);
      transition: transform 0.25s ease-out;
      z-index: 1000;
    }

    .cart-drawer.is-open {
      transform: translateX(0);
    }

    .cart-item {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
    }

    .cart-item__price {
      font-weight: 600;
      color: #111;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      font-size: 1.125rem;
      font-weight: 700;
    }

    .checkout-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #0a7d3b;
      color: #fff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #08662f;
    }

    @media (max-width: 480px) {
      .cart-drawer {
        width: 100%;
      }
    }
    ```

    Add the build step to `package.json`, after `npm i -D esbuild`. Adjust the paths to your layout:

    ```json
    {
      "scripts": {
        "build:css": "esbuild src/css/cart-drawer.css --minify --outfile=dist/css/cart-drawer.min.css"
      }
    }
    ```

    **Green Notes**
    - **Minify in the build, not by hand** (reduces network): the source stays readable, and the shipped file can no longer drift from it. For a stylesheet this small, the gain is fewer bytes on real networks, not client CPU. In Green Metrics Tool browser benchmarks with 50 cold page loads of a small booking page, an esbuild minified build used ~822 J and the unminified sources ~837 J. That is about 2% less, which is within measurement noise.

    **Bugs fixed**
    - `transfrom` was a typo. Browsers dropped the declaration, so `.is-open` never slid the drawer in. It is `transform` now.
    - `@media (max-width: 480)` had no unit, so browsers ignored the whole query. It is `480px` now. Because of `max-width: 100%` the drawer already fit small screens, so this changes little visually.
    - I removed the duplicate `color: #111`. It had no effect.
