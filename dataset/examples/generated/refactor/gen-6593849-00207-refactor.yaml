- role: assistant
  content: |
    ```html
    <section class="hero">
      <picture>
        <source srcset="/img/hero-terrace.avif" type="image/avif">
        <source srcset="/img/hero-terrace.webp" type="image/webp">
        <img src="/img/hero-terrace.jpg" alt="Terrace of Casa Alba at sunset" width="1600" height="900">
      </picture>
      <h1>Casa Alba</h1>
      <p>Family restaurant, Valencia. Open Tue-Sun.</p>
    </section>

    <section class="menu-highlights">
      <h2>From our kitchen</h2>
      <div class="cards">
        <figure>
          <picture>
            <source srcset="/img/paella.avif" type="image/avif">
            <source srcset="/img/paella.webp" type="image/webp">
            <img src="/img/paella.jpg" alt="Seafood paella in a pan" width="600" height="400">
          </picture>
          <figcaption>Paella marinera</figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="/img/croquetas.avif" type="image/avif">
            <source srcset="/img/croquetas.webp" type="image/webp">
            <img src="/img/croquetas.jpg" alt="Plate of ham croquettes" width="600" height="400">
          </picture>
          <figcaption>Croquetas de jamón</figcaption>
        </figure>
        <figure>
          <picture>
            <source srcset="/img/flan.avif" type="image/avif">
            <source srcset="/img/flan.webp" type="image/webp">
            <img src="/img/flan.jpg" alt="Caramel flan with cream" width="600" height="400">
          </picture>
          <figcaption>Flan de la casa</figcaption>
        </figure>
      </div>
    </section>

    <footer>
      <img src="/img/logo.svg" alt="Casa Alba" width="120" height="40">
    </footer>
    ```

    **Green Notes**
    - **Photos as AVIF/WebP with a JPG fallback** (reduces network, and client CPU against PNG): the four food and terrace photos were PNG, which is a poor fit for photos. The `<picture>` element lets each browser take the smallest format it supports. In Green Metrics Tool micro-benchmarks (50 page loads per format), PNG used the most client CPU energy (~181 J), against ~134 J for JPG, ~150 J for WebP and ~159 J for AVIF. The main saving is fewer transferred bytes.
    - **Encode once, at build or upload time:** the `.avif`, `.webp` and `.jpg` files must be made ahead of time, never on request. In the same benchmarks, encoding AVIF cost about 7× the energy of encoding JPG. If you want to skip AVIF, WebP with a JPG fallback is a cheaper encode and still much smaller than PNG.
    - **Logo left as SVG:** a vector logo is already smaller than any raster format. Don't convert it.
    - **Width, height and hero loading unchanged:** the hero image stays eager because it is above the fold. If any image needs transparency, keep that one as PNG or WebP.
