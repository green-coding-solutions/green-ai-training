    ```bash
    #!/usr/bin/env bash
    # nightly rotate for the model server logs (cron 03:10)
    LOG_DIR="/var/log/modelserver"
    KEEP_DAYS=14
    now=$(date +%s)

    cd "$LOG_DIR" || exit 1

    for f in *; do
        [ -f "$f" ] || continue
        mtime=$(stat -c %Y "$f")
        age_h=$(( (now - mtime) / 3600 ))
        ext="${f##*.}"

        if [ "$ext" = "xz" ] && [ "$age_h" -ge $((KEEP_DAYS * 24)) ]; then
            rm -f "$f"
        elif [ "$age_h" -ge 24 ] && { [ "$ext" = "jsonl" ] || [ "$ext" = "log" ] || [ "$ext" = "csv" ]; }; then
            xz -9e -T0 "$f"
        elif [ "$age_h" -ge 24 ] && [ "$ext" != "xz" ] && [ "$ext" != "gz" ] && [ "$ext" != "jpg" ] && [ "$ext" != "png" ] && [ "$ext" != "zip" ]; then
            xz -9e -T0 "$f"
        fi
    done
    ```

