    driver: |
      import math
      import random
      from types import SimpleNamespace

      rng = random.Random(7)
      labels = ["sil", "go", "stop", "yes", "no"]
      n = len(labels)
      trans = [[math.log(rng.random() + 0.05) for _ in range(n)] for _ in range(n)]
      emissions = []
      for _ in range(400):
          raw = [rng.random() if rng.random() > 0.2 else 0.0 for _ in range(n)]
          total = sum(raw) or 1.0
          emissions.append([r / total for r in raw])
      model = SimpleNamespace(labels=labels, trans=trans, floor=1e-9)
      path = viterbi_decode(model, emissions)
      print(len(path), path[:20], path[-20:])
      print(",".join(path))
  test: |-
    import math
    from types import SimpleNamespace
    m = SimpleNamespace(
        labels=["a", "b"],
        trans=[[math.log(0.9), math.log(0.1)], [math.log(0.1), math.log(0.9)]],
        floor=1e-9,
    )
    em = [[0.9, 0.1], [0.8, 0.2], [0.1, 0.9], [0.1, 0.9]]
    assert viterbi_decode(m, em) == ["a", "a", "b", "b"]
    assert viterbi_decode(m, em[:1]) == ["a"]
