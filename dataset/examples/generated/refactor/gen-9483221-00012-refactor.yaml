- role: user
  content: |
    Viterbi decode for our on-device keyword spotter. It also runs on long recordings, and the decode step shows up in the profile. Only the diff please, no explanations of how Viterbi works.

    ```python
    import math

    def viterbi_decode(model, emissions):
        """emissions: list of frames, each a list of per-state probabilities."""
        n_states = len(model.labels)
        score = [math.log(max(p, model.floor)) for p in emissions[0]]
        back = []
        for frame in emissions[1:]:
            new_score = []
            pointers = []
            for j in range(n_states):
                best_i = 0
                best = score[0] + model.trans[0][j]
                for i in range(1, n_states):
                    cand = score[i] + model.trans[i][j]
                    if cand > best:
                        best = cand
                        best_i = i
                new_score.append(best + math.log(max(frame[j], model.floor)))
                pointers.append(best_i)
            score = new_score
            back.append(pointers)

        state = max(range(n_states), key=lambda s: score[s])
        path = [model.labels[state]]
        for pointers in reversed(back):
            state = pointers[state]
            path.insert(0, model.labels[state])
        return path
    ```
- role: assistant
  content: |
    ```python
    import math

    def viterbi_decode(model, emissions):
        """emissions: list of frames, each a list of per-state probabilities."""
        labels = model.labels
        trans = model.trans
        floor = model.floor
        log = math.log

        n_states = len(labels)
        score = [log(max(p, floor)) for p in emissions[0]]
        back = []
        for frame in emissions[1:]:
            new_score = []
            pointers = []
            for j in range(n_states):
                best_i = 0
                best = score[0] + trans[0][j]
                for i in range(1, n_states):
                    cand = score[i] + trans[i][j]
                    if cand > best:
                        best = cand
                        best_i = i
                new_score.append(best + log(max(frame[j], floor)))
                pointers.append(best_i)
            score = new_score
            back.append(pointers)

        state = max(range(n_states), key=lambda s: score[s])
        path = [labels[state]]
        for pointers in reversed(back):
            state = pointers[state]
            path.append(labels[state])
        path.reverse()
        return path
    ```

    **Green Notes**
    - **Append, then reverse once instead of `insert(0)`** (reduces E): every front insert shifts the whole list, so the backtrace cost grows quadratically with recording length. Now it is linear. In Green Metrics Tool micro-benchmarks, 1,000,000 `list.insert(0, x)` calls used ~1515 J, and 1,000,000 `list.append(x)` calls used ~1.2 J. The returned path is identical.
    - **Hoisted `model.trans`, `model.floor` and `math.log`** (reduces E): they are bound once, outside the innermost loops. This is a small win: in Green Metrics Tool micro-benchmarks, caching `math.sqrt` in a local before a 10,000,000-iteration loop saved about 4-5%. I kept it because it sits in the innermost loop and costs no readability.

    The forward pass is unchanged. For short clips the backtrace is a small part of the runtime, so the main gain is on long recordings.
