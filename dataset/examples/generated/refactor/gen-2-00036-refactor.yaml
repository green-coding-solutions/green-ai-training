messages:
- role: user
  content: |
    hi, we have this job in our gitlab ci that check every file in the monorepo has a owner team. it run in every pipeline, the repo has around 70k files and most of the folders dont have a own entry in owners.json, only the service folders on top level. can you make it more fast and clean? output must stay same, other jobs parse it.

    ```python
    #!/usr/bin/env python3
    """Ownership check: every tracked file must have a team in owners.json."""
    import json
    import subprocess
    import sys


    def load_owners(path="ci/owners.json"):
        # {"services/payments": "team-payments", "libs/auth": "team-identity", "infra": "team-platform"}
        with open(path) as f:
            return json.load(f)


    def tracked_files():
        out = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True)
        return out.stdout.splitlines()


    def owner_for(path, owners):
        parts = path.split("/")
        # longest prefix first: services/payments/api/x.py, services/payments/api, services/payments, services
        for i in range(len(parts), 0, -1):
            prefix = "/".join(parts[:i])
            try:
                return owners[prefix]
            except KeyError:
                pass
        try:
            return owners["*"]
        except KeyError:
            return None


    def summarize(files, owners):
        per_team = {}
        unowned = []
        for f in files:
            team = owner_for(f, owners)
            if team is None:
                unowned.append(f)
                continue
            try:
                per_team[team] += 1
            except KeyError:
                per_team[team] = 1
        return per_team, unowned


    if __name__ == "__main__":
        owners = load_owners()
        per_team, unowned = summarize(tracked_files(), owners)
        for team, n in sorted(per_team.items()):
            print(f"{team:25} {n:6d} files")
        if unowned:
            print(f"\n{len(unowned)} files without owner:")
            for f in unowned[:50]:
                print("  " + f)
            sys.exit(1)
    ```
