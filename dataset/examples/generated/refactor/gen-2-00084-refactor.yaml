    import argparse
    import csv
    import sqlite3
    import sys
    from collections import defaultdict

    # builds(id, project, branch, sha, runner_label, started_at, duration_s,
    #        status, log_tail, junit_xml, env_json)  -- filled by the webhook receiver

    # cents per runner-minute for 2 cores
    BASE_RATES = {"linux": 0.8, "windows": 1.6, "macos": 8.0}
    ARCH_FACTOR = {"x64": 1.0, "arm64": 0.85}
    GPU_SURCHARGE = 7.0


    def runner_rate(label):
        """'linux-arm64-8core-gpu' -> cents per minute"""
        parts = label.strip().lower().split("-")
        os_name = parts[0]
        arch = "x64"
        cores = 2
        gpu = False
        for part in parts[1:]:
            if part in ARCH_FACTOR:
                arch = part
            elif part.endswith("core") and part[:-4].isdigit():
                cores = int(part[:-4])
            elif part == "gpu":
                gpu = True
        rate = BASE_RATES[os_name] * ARCH_FACTOR[arch] * cores / 2
        if gpu:
            rate += GPU_SURCHARGE
        return rate


    def costs_by_project(conn, month):
        conn.row_factory = sqlite3.Row
        rows = conn.execute(
            "SELECT * FROM builds WHERE started_at LIKE ? ORDER BY id",
            (month + "%",),
        )
        costs = defaultdict(float)
        minutes = defaultdict(float)
        for row in rows:
            mins = row["duration_s"] / 60
            costs[row["project"]] += runner_rate(row["runner_label"]) * mins
            minutes[row["project"]] += mins
        return costs, minutes


    def main():
        parser = argparse.ArgumentParser(description="Monthly CI runner chargeback")
        parser.add_argument("db")
        parser.add_argument("month", help="YYYY-MM")
        args = parser.parse_args()

        conn = sqlite3.connect(args.db)
        costs, minutes = costs_by_project(conn, args.month)
        writer = csv.writer(sys.stdout)
        writer.writerow(["project", "minutes", "cost_eur"])
        for project in sorted(costs):
            writer.writerow([project, round(minutes[project], 1), round(costs[project] / 100, 2)])


    if __name__ == "__main__":
        main()
    ```
