    ```python
    import argparse
    import csv
    import sqlite3
    import sys
    from collections import defaultdict
    from functools import lru_cache

    # builds(id, project, branch, sha, runner_label, started_at, duration_s,
    #        status, log_tail, junit_xml, env_json)  -- filled by the webhook receiver

    # cents per runner-minute for 2 cores
    BASE_RATES = {"linux": 0.8, "windows": 1.6, "macos": 8.0}
    ARCH_FACTOR = {"x64": 1.0, "arm64": 0.85}
    GPU_SURCHARGE = 7.0


    @lru_cache(maxsize=256)
    def runner_rate(label):
        """'linux-arm64-8core-gpu' -> cents per minute"""
        parts = label.strip().lower().split("-")
        os_name = parts[0]
        arch = "x64"
        cores = 2
        gpu = False
        for part in parts[1:]:
            if part in ARCH_FACTOR:
                arch = part
            elif part.endswith("core") and part[:-4].isdigit():
                cores = int(part[:-4])
            elif part == "gpu":
                gpu = True
        rate = BASE_RATES[os_name] * ARCH_FACTOR[arch] * cores / 2
        if gpu:
            rate += GPU_SURCHARGE
        return rate


    def costs_by_project(conn, month):
        conn.row_factory = sqlite3.Row
        rows = conn.execute(
            "SELECT project, runner_label, duration_s FROM builds "
            "WHERE started_at LIKE ? ORDER BY id",
            (month + "%",),
        )
        costs = defaultdict(float)
        minutes = defaultdict(float)
        for row in rows:
            mins = row["duration_s"] / 60
            costs[row["project"]] += runner_rate(row["runner_label"]) * mins
            minutes[row["project"]] += mins
        return costs, minutes


    def main():
        parser = argparse.ArgumentParser(description="Monthly CI runner chargeback")
        parser.add_argument("db")
        parser.add_argument("month", help="YYYY-MM")
        args = parser.parse_args()

        conn = sqlite3.connect(args.db)
        costs, minutes = costs_by_project(conn, args.month)
        writer = csv.writer(sys.stdout)
        writer.writerow(["project", "minutes", "cost_eur"])
        for project in sorted(costs):
            writer.writerow([project, round(minutes[project], 1), round(costs[project] / 100, 2)])


    if __name__ == "__main__":
        main()
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E): the loop uses three columns. `SELECT *` also read `log_tail`, `junit_xml` and `env_json` for every build of the month, and those text columns are likely most of each row. In Green Metrics Tool micro-benchmarks on PostgreSQL, reading 2,500 rows 1,000 times from a 52-column table with large text columns used about 7× less CPU energy with the 10 needed columns than with `SELECT *`. The saving grows with the size of the columns you skip.
    - **Memoize `runner_rate`** (reduces E): it runs once per build, but you only have a handful of distinct runner labels. Now each label is parsed once per run. In Green Metrics Tool micro-benchmarks, 1,000,000 repeated computations with inputs from only 200 distinct values used about 9× less CPU energy with `lru_cache`. This only pays off because labels repeat. `maxsize` keeps the cache bounded if the label set grows.

    The CSV output is identical. Unknown labels still raise `KeyError`, because exceptions are not cached. The cache assumes the rate tables don't change while the process runs. If a test patches them, call `runner_rate.cache_clear()`.
