    ```bash
    #!/bin/bash
    # archive finished build dirs from the CI box
    SRC=/var/ci/builds
    DEST=/mnt/artifacts
    DAYS=30

    for dir in $(find $SRC -mindepth 1 -maxdepth 1 -type d -mtime +1); do
      name=$(basename $dir)
      tar -cf - -C $SRC $name | bzip2 -9 > $DEST/$name.tar.bz2
      if bzip2 -t $DEST/$name.tar.bz2; then
        rm -rf $dir
      fi
    done

    find $DEST -name "*.tar.bz2" -mtime +$DAYS -delete
    ```

