    import math
    import psycopg


    class ChurnScorer:
        def __init__(self, dsn, weights, bias, threshold=0.5):
            self.conn = psycopg.connect(dsn)
            self.weights = weights
            self.bias = bias
            self.threshold = threshold
            self.model_version = "churn-2024-11"

        def score_all(self, rows):
            """rows: iterable of (customer_id, features) with features a list of floats"""
            cur = self.conn.cursor()
            flagged = 0
            for customer_id, features in rows:
                z = self.bias
                for i in range(len(features)):
                    z += self.weights[i] * features[i]
                p = 1.0 / (1.0 + math.exp(-z))
                is_flagged = p >= self.threshold
                if is_flagged:
                    flagged += 1
                cur.execute(
                    "INSERT INTO predictions (customer_id, model_version, score, flagged) "
                    "VALUES (%s, %s, %s, %s)",
                    (customer_id, self.model_version, p, is_flagged),
                )
                self.conn.commit()
            return flagged
