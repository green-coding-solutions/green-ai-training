    ```python
    import sys
    import numpy as np
    from numba import njit

    RATES = [5.0, 10.0, 20.0]      # tokens per second
    BURSTS = [10, 20, 50]


    def load_requests(path):
        data = np.load(path)
        # ts: float64 unix seconds, sorted; client: int32 index into names
        return data["ts"], data["client"], data["names"]


    @njit(cache=True)
    def simulate_bucket(ts, client, rate, burst, n_clients):
        tokens = np.full(n_clients, burst)
        last_seen = np.zeros(n_clients)
        rejected = np.zeros(n_clients, dtype=np.int64)
        for i in range(len(ts)):
            c = client[i]
            t = ts[i]
            tokens[c] = min(burst, tokens[c] + (t - last_seen[c]) * rate)
            last_seen[c] = t
            if tokens[c] >= 1.0:
                tokens[c] -= 1.0
            else:
                rejected[c] += 1
        return rejected


    def main(path):
        ts, client, names = load_requests(path)
        n_clients = len(names)
        total = np.bincount(client, minlength=n_clients)
        print(f"{len(ts)} requests, {n_clients} clients")
        for rate in RATES:
            for burst in BURSTS:
                rej = simulate_bucket(ts, client, rate, float(burst), n_clients)
                share = rej.sum() / len(ts) * 100
                worst = np.argsort(rej)[::-1][:3]
                top = ", ".join(f"{names[w]}={rej[w]}/{total[w]}" for w in worst)
                print(f"rate={rate:>5} burst={burst:>3}  rejected {share:6.2f}%  top: {top}")


    if __name__ == "__main__":
        main(sys.argv[1])
    ```

    **Green Notes**
    - **JIT-compiled replay loop** (reduces E): the token bucket loop runs once per request for each of the nine grid points. In plain Python, every step reads and writes numpy scalars through the interpreter, and that is where the time goes. With `@njit` the same loop runs as machine code. In Green Metrics Tool micro-benchmarks, a pure Python loop that quantized 10,000,000 samples used ~40 J of CPU energy, and the same loop with Numba `@njit` used ~9.5 J, about 4× less.
    - **Why Numba and not plain numpy:** each client's token count depends on that client's previous request. That kind of loop has no clean vectorized form. A JIT lets you keep the loop you already have.
    - **`cache=True`:** Numba compiles the function on the first call. The cache stores the compiled code next to the script, so later runs on the build box skip that step. All nine grid calls use the same argument types, so the function compiles only once.
    - **Same output:** `burst` is now passed as a float, so Numba sees a single type in `min`. There is no `fastmath`, so the float math and the rejected counts match the old version exactly. Add `numba` to your requirements.
