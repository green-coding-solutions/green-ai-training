messages:
- role: user
  content: |
    Hi, we use this script for replay our API gateway logs and find a good rate limit for each customer tier. The parser before it write the day into a .npz (about 25M requests, sorted by time). Then this script try every rate/burst combination with a token bucket per client. It is very slow, one run of the grid take almost 40 min on the build box. Can you optimize it? We have numpy already, other package is ok if it is needed.

    ```python
    import sys
    import numpy as np

    RATES = [5.0, 10.0, 20.0]      # tokens per second
    BURSTS = [10, 20, 50]


    def load_requests(path):
        data = np.load(path)
        # ts: float64 unix seconds, sorted; client: int32 index into names
        return data["ts"], data["client"], data["names"]


    def simulate_bucket(ts, client, rate, burst, n_clients):
        tokens = np.full(n_clients, float(burst))
        last_seen = np.zeros(n_clients)
        rejected = np.zeros(n_clients, dtype=np.int64)
        for i in range(len(ts)):
            c = client[i]
            t = ts[i]
            tokens[c] = min(burst, tokens[c] + (t - last_seen[c]) * rate)
            last_seen[c] = t
            if tokens[c] >= 1.0:
                tokens[c] -= 1.0
            else:
                rejected[c] += 1
        return rejected


    def main(path):
        ts, client, names = load_requests(path)
        n_clients = len(names)
        total = np.bincount(client, minlength=n_clients)
        print(f"{len(ts)} requests, {n_clients} clients")
        for rate in RATES:
            for burst in BURSTS:
                rej = simulate_bucket(ts, client, rate, burst, n_clients)
                share = rej.sum() / len(ts) * 100
                worst = np.argsort(rej)[::-1][:3]
                top = ", ".join(f"{names[w]}={rej[w]}/{total[w]}" for w in worst)
                print(f"rate={rate:>5} burst={burst:>3}  rejected {share:6.2f}%  top: {top}")


    if __name__ == "__main__":
        main(sys.argv[1])
    ```
