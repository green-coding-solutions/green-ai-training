    ```python
    import csv
    import io

    FEED_COLUMNS = ["id", "title", "link", "price", "availability", "brand", "gtin", "image_link"]
    SHOP_URL = "https://www.kaffeehaus-shop.de"

    FEED_QUERY = """
        SELECT sku, name, slug, price_cents, stock, brand, ean, main_image_url
        FROM products
        WHERE active = true AND price_cents IS NOT NULL
        ORDER BY id
    """


    def availability(stock):
        if stock > 0:
            return "in stock"
        return "out of stock"


    def build_feed(conn):
        cur = conn.cursor()
        cur.execute(FEED_QUERY)
        rows = cur.fetchall()

        out = io.StringIO()
        writer = csv.writer(out, delimiter="\t")
        writer.writerow(FEED_COLUMNS)
        for p in rows:
            price = "%.2f EUR" % (p["price_cents"] / 100)
            writer.writerow([
                p["sku"],
                p["name"],
                f"{SHOP_URL}/p/{p['slug']}",
                price,
                availability(p["stock"]),
                p["brand"],
                p["ean"] or "",
                p["main_image_url"],
            ])
        return out.getvalue()


    def export_feed(conn, path):
        with open(path, "w", encoding="utf-8", newline="") as f:
            f.write(build_feed(conn))
    ```

    **Green Notes**
    - **Name the 8 columns the feed uses instead of `SELECT *`** (reduces E, M, network): the old query read, sent and kept in memory `description_html`, the specs JSON and the SEO texts for every product on every run. The feed never used them. In Green Metrics Tool micro-benchmarks on a 52-column products table with large text columns, naming the 10 needed columns used about 7× less CPU energy than `SELECT *` at 2,500 and 10,000 rows. In a second run on the same kind of table, `SELECT *` cost about 8× an 8-column query.
    - **Rows without a price are filtered in SQL** (reduces E, network): before, they were fetched and then skipped in Python. Now they never leave the database.
    - The output is byte-for-byte the same: same rows, same order, same formatting. If you add a feed field later, add its column to `FEED_QUERY` too, or the lookup will fail.
