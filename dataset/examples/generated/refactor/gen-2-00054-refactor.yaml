messages:
- role: user
  content: |
    Hi, our shop export a product feed for Google Shopping and idealo. A cron job run it every 15 minutes, about 30k active products. The products table is big, around 50 columns, with description_html, specs json, seo texts and so on. The export become slow and the DB server is busy when it run. Can you clean up and make it more efficent? Output must stay exactly same, the feed is validated by the partners.

    ```python
    import csv
    import io

    FEED_COLUMNS = ["id", "title", "link", "price", "availability", "brand", "gtin", "image_link"]
    SHOP_URL = "https://www.kaffeehaus-shop.de"


    def availability(stock):
        if stock > 0:
            return "in stock"
        return "out of stock"


    def build_feed(conn):
        cur = conn.cursor()
        cur.execute("SELECT * FROM products WHERE active = true ORDER BY id")
        rows = cur.fetchall()

        out = io.StringIO()
        writer = csv.writer(out, delimiter="\t")
        writer.writerow(FEED_COLUMNS)
        for p in rows:
            if p["price_cents"] is None:
                continue
            price = "%.2f EUR" % (p["price_cents"] / 100)
            writer.writerow([
                p["sku"],
                p["name"],
                f"{SHOP_URL}/p/{p['slug']}",
                price,
                availability(p["stock"]),
                p["brand"],
                p["ean"] or "",
                p["main_image_url"],
            ])
        return out.getvalue()


    def export_feed(conn, path):
        with open(path, "w", encoding="utf-8", newline="") as f:
            f.write(build_feed(conn))
    ```
