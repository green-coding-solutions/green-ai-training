      import os
      import random
      import tempfile

      random.seed(7)
      lines = []
      for i in range(5000):
          r = random.random()
          if r < 0.3:
              lines.append(f"G1 X{random.uniform(0, 200):.3f} Y{random.uniform(0, 200):.3f} E{random.uniform(0, 5):.4f}\n")
          elif r < 0.45:
              lines.append(f"G0 X{random.uniform(0, 200):.2f} Y{random.uniform(0, 200):.2f} F6000 ; travel\n")
          elif r < 0.5:
              lines.append(f"G1 Z{random.uniform(0, 10):.2f}\n")
          elif r < 0.7:
              lines.append(f"M{random.choice([104, 106, 107, 140])} S{random.randint(0, 255)}\n")
          elif r < 0.85:
              lines.append(f";LAYER:{i}\n")
          elif r < 0.95:
              lines.append("G92 E0\n")
          else:
              lines.append("\n")

      totals, counts = summarize(lines)
      print(repr(totals["travel"]), repr(totals["print"]), counts)

      fd, path = tempfile.mkstemp(suffix=".gcode")
      with os.fdopen(fd, "w") as fh:
          fh.writelines(lines)
      try:
          main([path])
          main([path, "--unit", "m"])
      finally:
          os.remove(path)
