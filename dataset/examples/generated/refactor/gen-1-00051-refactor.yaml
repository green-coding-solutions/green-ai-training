id: gen-1-00051-refactor
category: refactor
language: yaml
patterns:
- minimize-environments
- text-compression
facts:
- F-COMPRESS
messages:
- role: user
  content: |
    Hi, I set up this GitHub workflow for our landing page. It works but the preview server disk is getting full and the team says the site feels heavy on slow connections. I'm not sure what is wrong with it. Can you clean it up?

    ```yaml
    name: Deploy landing page
    on:
      push:
        branches: ['**']

    jobs:
      deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: 20
          - run: npm install
          - run: npm run build
          - name: Set up ssh
            run: |
              mkdir -p ~/.ssh
              echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
              chmod 600 ~/.ssh/id_ed25519
              ssh-keyscan web1.example.com >> ~/.ssh/known_hosts
          - name: Deploy
            run: |
              rsync -az --delete dist/ deploy@web1.example.com:/var/www/previews/${{ github.ref_name }}/
          - name: Deploy main to production
            if: github.ref == 'refs/heads/main'
            run: |
              rsync -az --delete dist/ deploy@web1.example.com:/var/www/landing/
    ```
- role: assistant
  content: |
    There are two problems. Every push to any branch creates a preview folder that is never removed. The HTML, CSS and JS are also uploaded as plain text.

    ```yaml
    name: Deploy landing page
    on:
      push:
        branches: [main]
      pull_request:
        types: [opened, synchronize, reopened, closed]

    concurrency:
      group: landing-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    env:
      HOST: deploy@web1.example.com

    jobs:
      deploy:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: 20
              cache: npm
          - run: npm ci
          - run: npm run build
          - name: Pre-compress text assets once
            run: |
              find dist -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.json' \) \
                -exec gzip -9 -k -f {} +
          - name: Set up ssh
            run: |
              mkdir -p ~/.ssh
              echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
              chmod 600 ~/.ssh/id_ed25519
              ssh-keyscan web1.example.com >> ~/.ssh/known_hosts
          - name: Deploy preview
            if: github.event_name == 'pull_request'
            run: |
              rsync -a --delete dist/ "$HOST:/var/www/previews/pr-${{ github.event.pull_request.number }}/"
          - name: Deploy production
            if: github.event_name == 'push'
            run: |
              rsync -a --delete dist/ "$HOST:/var/www/landing/"

      cleanup:
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        steps:
          - name: Set up ssh
            run: |
              mkdir -p ~/.ssh
              echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
              chmod 600 ~/.ssh/id_ed25519
              ssh-keyscan web1.example.com >> ~/.ssh/known_hosts
          - name: Remove preview
            run: |
              ssh "$HOST" "rm -rf /var/www/previews/pr-${{ github.event.pull_request.number }}"
    ```

    The server must serve the `.gz` files. In nginx, add `gzip_static on;` to the site config. Without it the new files are ignored and visitors still get the plain ones.

    **Green Notes**
    - **One preview per pull request, removed when it closes** (reduces M): before, every push on every branch made a new folder that stayed forever. Now there is one preview per open PR, and the `cleanup` job deletes it on merge or close. Pushes to `main` go to production only. This also fixes a bug: branch names with `/` such as `feature/hero` created nested folders.
    - **Pre-compressed text assets** (reduces network and E): HTML, CSS, JS and SVG are compressed once in CI, not on every request. Level 9 is fine here because the work is done once and the file is served many times. In Green Metrics Tool micro-benchmarks, compressing 100 MB of text with brotli at its default quality 11 used about 45× the CPU energy of gzip ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,8e93a8d2-60b0-4831-905b-764b68257bc7)). That is a good deal for a static file served many times, and wasteful if done per request.
    - **`npm ci` with the npm cache** (reduces E): the install is reproducible and the runner does not download every package on each run.
    - **`concurrency` with `cancel-in-progress`**: if you push twice quickly, the older build is stopped instead of running to the end.
    - *Not applied:* shutting previews down on a schedule. They are static folders on a server that is already running, so they cost only disk space, and the cleanup job handles that.
verify:
  static_only: GitHub Actions workflow needs GitHub runners, ssh and a remote server
