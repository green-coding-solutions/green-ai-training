id: gen-1-00436-refactor
category: refactor
language: javascript
patterns:
- remove-unused-css
- hoist-invariants
messages:
- role: user
  content: |
    Landing page build, Tailwind 3. CSS output is huge and the scroll handler shows up in profiles on mobile. Diff only please.

    tailwind.config.js:
    ```javascript
    /** @type {import('tailwindcss').Config} */
    module.exports = {
      content: ['./**/*.{html,js}'],
      safelist: [{ pattern: /.*/ }],
      theme: {
        extend: {
          colors: { brand: '#0f766e', accent: '#f59e0b' },
          animation: { 'fade-up': 'fadeUp .6s ease-out both' },
          keyframes: {
            fadeUp: {
              from: { opacity: 0, transform: 'translateY(16px)' },
              to: { opacity: 1, transform: 'none' },
            },
          },
        },
      },
      plugins: [],
    };
    ```

    src/js/reveal.js:
    ```javascript
    // fade sections in when they get near the viewport
    window.addEventListener('scroll', () => {
      document.querySelectorAll('.reveal').forEach((el) => {
        const root = document.documentElement;
        const offset =
          parseFloat(getComputedStyle(root).getPropertyValue('--reveal-offset')) || 80;
        const trigger = window.innerHeight - offset;
        if (el.getBoundingClientRect().top < trigger) {
          el.classList.add('is-visible');
        }
      });
    });
    ```
- role: assistant
  content: |
    ```diff
    --- a/tailwind.config.js
    +++ b/tailwind.config.js
    @@
     module.exports = {
    -  content: ['./**/*.{html,js}'],
    -  safelist: [{ pattern: /.*/ }],
    +  content: ['./src/**/*.{html,js}'],
       theme: {
    ```

    ```diff
    --- a/src/js/reveal.js
    +++ b/src/js/reveal.js
    @@
    -window.addEventListener('scroll', () => {
    -  document.querySelectorAll('.reveal').forEach((el) => {
    -    const root = document.documentElement;
    -    const offset =
    -      parseFloat(getComputedStyle(root).getPropertyValue('--reveal-offset')) || 80;
    -    const trigger = window.innerHeight - offset;
    -    if (el.getBoundingClientRect().top < trigger) {
    -      el.classList.add('is-visible');
    -    }
    -  });
    -});
    +const reveals = document.querySelectorAll('.reveal');
    +let trigger = 0;
    +
    +function measure() {
    +  const root = document.documentElement;
    +  const offset =
    +    parseFloat(getComputedStyle(root).getPropertyValue('--reveal-offset')) || 80;
    +  trigger = window.innerHeight - offset;
    +}
    +
    +measure();
    +window.addEventListener('resize', measure);
    +window.addEventListener(
    +  'scroll',
    +  () => {
    +    for (const el of reveals) {
    +      if (el.getBoundingClientRect().top < trigger) {
    +        el.classList.add('is-visible');
    +      }
    +    }
    +  },
    +  { passive: true }
    +);
    ```

    **Green Notes**
    - **Remove unused CSS** (reduces network and E): `safelist: [{ pattern: /.*/ }]` tells Tailwind to emit every utility it knows, so purging did nothing. Without it, the CSS only contains classes your templates use. Every visitor downloads and parses a much smaller stylesheet.
      Pattern: Remove unused CSS
    - **Narrower `content` glob** (reduces E at build time): `./**/*` also scanned `node_modules` and `dist`. That is slow, and it can pull stray strings from built files back into the CSS. If you build class names by string concatenation (`'bg-' + tone`), safelist those exact classes. Don't use a catch-all pattern.
    - **Hoisted invariants** (reduces E on the client): the handler ran `querySelectorAll`, `getComputedStyle` and a `window.innerHeight` read for every element on every scroll event. Now the node list and the trigger line are computed once and refreshed on `resize`. The `getComputedStyle` call forces style recalculation, so it hurts most in a scroll handler. Only the `getBoundingClientRect` read stays per event.
    - **Behavior notes:** `.reveal` elements added to the DOM after load are not picked up. Re-run the query after you insert them. `{ passive: true }` only tells the browser the handler never calls `preventDefault()`, so scrolling doesn't wait for it. If the page can drop `scroll` handlers entirely, an `IntersectionObserver` would remove the per-event work, but that is a larger change.
verify:
  static_only: Needs Tailwind build tooling and a browser DOM; diff-only answer
