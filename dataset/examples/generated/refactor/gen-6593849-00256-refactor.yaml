messages:
- role: user
  content: |
    Landing page backend, Postgres 16. This feeds the "Customer stories" strip on the homepage. The page only renders title, link, customer name, one-line summary, logo and hero image. Diff only please.

    ```sql
    -- homepage: featured case studies
    SELECT *
    FROM case_studies
    WHERE published AND featured
    ORDER BY sort_order
    LIMIT 6;
    ```

    Table has ~30 columns: id, slug, title, customer_name, summary, logo_url, hero_image_url, body_html, body_markdown, seo_json, internal_notes, pdf_export, published, featured, sort_order, created_at, and some more metadata.
- role: assistant
  content: |
    ```sql
    -- homepage: featured case studies
    SELECT slug, title, customer_name, summary, logo_url, hero_image_url
    FROM case_studies
    WHERE published AND featured
    ORDER BY sort_order
    LIMIT 6;
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E, network): the strip never uses `body_html`, `body_markdown`, `seo_json`, `internal_notes` or `pdf_export`, but `SELECT *` reads and ships them on every homepage hit. In Green Metrics Tool micro-benchmarks on a 52-column table with large text columns, naming the 10 needed columns used about 5.5× to 7× less energy than `SELECT *`. The gap was smaller when the skipped columns were small. The saving grows with the size of the columns you skip, so it depends on how big your article bodies and PDF exports are.
    - Make sure the template and any serializer only read the six listed fields. Anything else that reads a skipped column from this row will now get nothing.
    - Rows and order are unchanged. Only the returned columns differ.
