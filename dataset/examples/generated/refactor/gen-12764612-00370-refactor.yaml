messages:
- role: user
  content: |
    Hello, this script run in our pipeline after terraform apply, it make the ansible inventory file from the json what our cloud tool is exporting. We have about 20 thousand hosts now and the step is more slow every month. Can you please clean it up and make it better? I dont know what is the problem.

    ```python
    import json
    import sys


    def load_hosts(path):
        with open(path) as f:
            return json.load(f)


    def build_inventory(hosts):
        out = ""
        groups = {}
        for h in hosts:
            groups.setdefault(h["role"], []).append(h)
        for role in sorted(groups):
            out += "[" + role + "]\n"
            for h in sorted(groups[role], key=lambda x: x["name"]):
                line = h["name"] + " ansible_host=" + h["ip"]
                if h.get("port"):
                    line += " ansible_port=" + str(h["port"])
                out += line + "\n"
            out += "\n"
        return out


    if __name__ == "__main__":
        hosts = load_hosts(sys.argv[1])
        inv = build_inventory(hosts)
        with open(sys.argv[2], "w") as f:
            f.write(inv)
    ```
- role: assistant
  content: |
    ```python
    import json
    import sys


    def load_hosts(path):
        with open(path) as f:
            return json.load(f)


    def build_inventory(hosts):
        groups = {}
        for h in hosts:
            groups.setdefault(h["role"], []).append(h)
        parts = []
        for role in sorted(groups):
            parts.append(f"[{role}]\n")
            for h in sorted(groups[role], key=lambda x: x["name"]):
                line = f"{h['name']} ansible_host={h['ip']}"
                if h.get("port"):
                    line += f" ansible_port={h['port']}"
                parts.append(line + "\n")
            parts.append("\n")
        return "".join(parts)


    if __name__ == "__main__":
        hosts = load_hosts(sys.argv[1])
        inv = build_inventory(hosts)
        with open(sys.argv[2], "w") as f:
            f.write(inv)
    ```

    **Green Notes**
    - **`"".join()` instead of `+=`** (reduces E): `out += ...` runs once per host and once per group header, and the string gets bigger each time. The new code collects the pieces in a list and joins them once at the end. In Green Metrics Tool micro-benchmarks, building a string from 1,000,000 pieces used ~469 J with `+=` and ~1.8 J with `join`, roughly 260× less CPU energy. Your piece count is smaller, so your absolute saving is smaller, but the `+=` cost grows faster than the host count.
    - **Short line built with an f-string** (no change in cost): the `line` string has only 2-3 pieces per host. That is bounded work, so it is fine to build it directly. Only the big output string needs `join`.

    The output is exactly the same text as before. The same roles come first in sorted order, hosts are sorted by name, and there is a blank line after each group.
