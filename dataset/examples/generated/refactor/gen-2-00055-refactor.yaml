    **Green Notes**
    - **Modern formats for the previews** (reduces network): micrographs behave like photos, so lossless PNG makes very large files for them. AVIF and WebP send far fewer bytes, and that is what makes the page slow on mobile data. The browser uses the first `<source>` it supports and falls back to the JPEG. Layout, sizes and alt texts are unchanged.
    - **Encode once, when you publish the dataset** (reduces E): in Green Metrics Tool benchmarks, AVIF encoding cost about 7× as much as JPG. Add the AVIF, WebP and JPEG exports to the script that writes the Fiji previews, and put the files next to the PNGs. Don't use an image service that converts on every request.
    - **Decoding costs a bit more CPU:** in the same benchmarks (page loads in a real browser), AVIF decoding cost about 19% more than JPG. The saving comes from fewer transferred bytes, not from less client CPU. For multi-MB previews on phone networks, that trade is clearly worth it.
    - **Raw data unchanged:** the previews are now lossy, which is fine for looking but not for measuring. The OME-TIFF links are the same, so analysis still uses the original data. Look at a few previews with dim signal on a dark background before you publish, and raise the quality setting if faint structures get lost.

    Bug fixed: the Field 3 link pointed to `raw/field02.ome.tif`. It now points to `raw/field03.ome.tif`. Please check that this file name is correct. The logo is already an SVG, so I left it as it is.
