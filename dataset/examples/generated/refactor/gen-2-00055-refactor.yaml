            <img src="previews/field03_max.png" width="2048" height="2048" alt="Field 3, max projection">
            <figcaption>Field 3 · <a href="raw/field02.ome.tif" download>raw OME-TIFF (3.0 GB)</a></figcaption>
          </figure>
          <figure>
            <img src="previews/field04_max.png" width="2048" height="2048" alt="Field 4, max projection">
