- role: user
  content: |
    Hi, this is the landing page for one dataset of our imaging lab. Colleagues open it on conferences with the phone and it loads forever. The previews are PNG exportet from Fiji, every one is around 6 MB. Can you refactor the html so it is faster? Important: the raw OME-TIFF downloads must stay like they are, people do the analysis with them.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>HeLa H2B-GFP time-lapse dataset | Imaging Core</title>
      <link rel="stylesheet" href="/css/dataset.css">
    </head>
    <body>
      <header>
        <a href="/"><img src="/img/imaging-core-logo.svg" alt="Imaging Core" height="40"></a>
      </header>
      <main>
        <h1>HeLa H2B-GFP mitosis time-lapse</h1>
        <p class="meta">Zeiss LSM 980, 3 min interval, 48 h, 4 fields. DOI: 10.5281/zenodo.1234567</p>

        <figure class="hero">
          <img src="previews/overview_t000.png" width="2048" height="2048"
               alt="Overview of field 1 at frame 0, nuclei in green">
          <figcaption>Field 1, frame 0 (max projection)</figcaption>
        </figure>

        <h2>Fields</h2>
        <div class="gallery">
          <figure>
            <img src="previews/field01_max.png" width="2048" height="2048" alt="Field 1, max projection">
            <figcaption>Field 1 · <a href="raw/field01.ome.tif" download>raw OME-TIFF (3.1 GB)</a></figcaption>
          </figure>
          <figure>
