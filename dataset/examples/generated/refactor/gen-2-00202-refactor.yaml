    ```python
    import sqlite3

    PLACEHOLDER_IMG = "/static/img/no-image.png"

    CAROUSEL_COLUMNS = "id, name, slug, price_cents, currency, thumb_url, rating_avg"


    def format_price(cents, currency):
        symbol = {"EUR": "€", "USD": "$", "GBP": "£"}.get(currency, currency + " ")
        return f"{symbol}{cents / 100:.2f}"


    def related_products(conn, product_id, limit=8):
        """Carousel 'Customers also looked at' on the product detail page."""
        current = conn.execute(
            "SELECT category_id FROM products WHERE id = ?", (product_id,)
        ).fetchone()
        if current is None:
            return []

        rows = conn.execute(
            f"""
            SELECT {CAROUSEL_COLUMNS}
            FROM products
            WHERE category_id = ?
              AND id != ?
              AND is_active = 1
              AND stock_qty > 0
            ORDER BY sales_rank
            LIMIT ?
            """,
            (current["category_id"], product_id, limit),
        ).fetchall()

        return [
            {
                "id": row["id"],
                "name": row["name"],
                "url": "/p/" + row["slug"],
                "price": format_price(row["price_cents"], row["currency"]),
                "image": row["thumb_url"] or PLACEHOLDER_IMG,
                "rating": round(row["rating_avg"] or 0, 1),
            }
            for row in rows
        ]
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E, M): the carousel uses 7 of about 55 columns. With `SELECT *`, every page view read and copied the description HTML, specs JSON and SEO text of up to 8 products, and then threw them away. In Green Metrics Tool micro-benchmarks on PostgreSQL, reading 500 rows from a 52-column products table with large text columns used about 5.5× less CPU energy when the query named the 10 needed columns instead of `SELECT *`. SQLite is a different engine, but the reason is the same: fewer bytes read and copied per row. The saving grows with the size of the columns you skip.
    - **Category lookup:** the first query only needs `category_id`, so it no longer loads the whole product row with its long text columns.
    - The output is the same: same keys, same order, same values. `CAROUSEL_COLUMNS` is a fixed constant, not user input, so the f-string is safe. All values still go through `?` parameters. A side effect: new wide columns added to `products` later won't slow down this query.
