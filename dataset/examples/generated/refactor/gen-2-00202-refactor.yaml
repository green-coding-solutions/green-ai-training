    driver: |-
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.row_factory = sqlite3.Row
      conn.execute("""CREATE TABLE products (
          id INTEGER PRIMARY KEY, sku TEXT, name TEXT, slug TEXT, category_id INTEGER,
          price_cents INTEGER, currency TEXT, thumb_url TEXT, rating_avg REAL,
          sales_rank INTEGER, stock_qty INTEGER, is_active INTEGER,
          description_html TEXT, specs_json TEXT, seo_text TEXT)""")
      rows = []
      for i in range(1, 41):
          rows.append((i, f"SKU{i:04d}", f"Product {i}", f"product-{i}", i % 3,
                       999 + i * 50, ["EUR", "USD", "GBP", "CHF"][i % 4],
                       None if i % 5 == 0 else f"/img/{i}.jpg",
                       None if i % 7 == 0 else 3.0 + (i % 20) / 10,
                       (i * 37) % 41, i % 4, 0 if i % 9 == 0 else 1,
                       "<p>" + "x" * 2000 + "</p>", "{}", "seo " * 100))
      conn.executemany("INSERT INTO products VALUES (" + ",".join("?" * 15) + ")", rows)
      for pid in (1, 2, 3, 10, 999):
          print(pid, related_products(conn, pid))
      print(related_products(conn, 4, limit=3))
