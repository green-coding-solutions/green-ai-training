- role: user
  content: |
    hi, this function build the "Customers also looked at" carousel on our product detail page. it run on every product page view, so it is called a lot. the products table have around 55 columns, also long ones like description html, specs json and seo text for google. we use sqlite3 with the Row factory. can you optimize it a bit and clean up? the output must stay same because frontend use it.

    ```python
    import sqlite3

    PLACEHOLDER_IMG = "/static/img/no-image.png"


    def format_price(cents, currency):
        symbol = {"EUR": "€", "USD": "$", "GBP": "£"}.get(currency, currency + " ")
        return f"{symbol}{cents / 100:.2f}"


    def related_products(conn, product_id, limit=8):
        """Carousel 'Customers also looked at' on the product detail page."""
        cur = conn.execute("SELECT * FROM products WHERE id = ?", (product_id,))
        current = cur.fetchone()
        if current is None:
            return []

        cur = conn.execute(
            """
            SELECT * FROM products
            WHERE category_id = ?
              AND id != ?
              AND is_active = 1
              AND stock_qty > 0
            ORDER BY sales_rank
            LIMIT ?
            """,
            (current["category_id"], product_id, limit),
        )

        items = []
        for row in cur.fetchall():
            items.append({
                "id": row["id"],
                "name": row["name"],
                "url": "/p/" + row["slug"],
                "price": format_price(row["price_cents"], row["currency"]),
                "image": row["thumb_url"] or PLACEHOLDER_IMG,
                "rating": round(row["rating_avg"] or 0, 1),
            })
        return items
    ```
