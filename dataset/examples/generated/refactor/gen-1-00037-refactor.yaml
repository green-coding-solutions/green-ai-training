    ```python
    import math

    EARTH_RADIUS_KM = 6371.0
    _PAD_DEG = 1e-6  # small safety margin so rounding never drops a store at the edge


    def stores_nearby(stores, lat, lon, radius_km, limit=20):
        """stores: list of dicts like {"id": 17, "lat": 52.5, "lon": 13.4, "name": "..."}"""
        # Depends only on the query, so compute it once, not once per store.
        lat_rad = math.radians(lat)
        cos_lat = math.cos(lat_rad)
        ang = radius_km / EARTH_RADIUS_KM  # search radius as an angle (radians)

        # Bounding box: a store outside it cannot be within radius_km.
        max_dlat = math.degrees(ang) + _PAD_DEG
        lat_min, lat_max = lat - max_dlat, lat + max_dlat
        if ang < math.pi / 2 - abs(lat_rad) - _PAD_DEG:
            max_dlon = math.degrees(math.asin(math.sin(ang) / cos_lat)) + _PAD_DEG
        else:
            max_dlon = 180.0  # circle touches a pole: no longitude filter

        result = []
        for s in stores:
            s_lat = s["lat"]
            if s_lat < lat_min or s_lat > lat_max:
                continue
            s_lon = s["lon"]
            # Longitude difference wrapped to [-180, 180), so the date line works.
            if abs((s_lon - lon + 180.0) % 360.0 - 180.0) > max_dlon:
                continue

            dlat = math.radians(s_lat - lat)
            dlon = math.radians(s_lon - lon)
            a = (math.sin(dlat / 2) ** 2
                 + cos_lat * math.cos(math.radians(s_lat)) * math.sin(dlon / 2) ** 2)
            d = 2 * EARTH_RADIUS_KM * math.asin(math.sqrt(a))
            if d <= radius_km:
                result.append({"id": s["id"], "distance_km": round(d, 2)})

        result.sort(key=lambda r: r["distance_km"])
        return result[:limit]
    ```

    **Green Notes**
    - **Bounding-box pre-filter** (reduces E): before, every request ran the full trig formula for all 20 thousand stores. Now two cheap comparisons drop stores that are clearly too far, and only the few left get the exact distance. For a small "near me" radius, most stores never reach the trig math.
    - **Hoisted query-only work** (reduces E): `cos(radians(lat))` was computed again for every store. Now it runs once per request.
    - Behavior is the same: same formula, same rounding, same sort order, the same results. The box is a safe outer bound with a small margin. It also handles the date line, and near the poles it turns off the longitude filter.
    - *Not applied:* NumPy. Converting 20 thousand dicts to arrays on every request would cost a lot of the gain. It only pays off if you keep the coordinates as arrays between requests. A spatial index (grid or KD-tree) is the next step only if the store count grows a lot.
