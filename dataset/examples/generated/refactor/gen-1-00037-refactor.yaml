id: gen-1-00037-refactor
category: refactor
language: python
patterns:
- vectorize-or-jit
messages:
- role: user
  content: |
    Hello, we have a endpoint "stores near me" in our shop backend. Now we have around 20 thousand stores and the request is become slow, CPU of the server is high when many users call it. Can you make it more fast and clean? Sorry for my english.

    ```python
    import math

    EARTH_RADIUS_KM = 6371.0


    def stores_nearby(stores, lat, lon, radius_km, limit=20):
        """stores: list of dicts like {"id": 17, "lat": 52.5, "lon": 13.4, "name": "..."}"""
        result = []
        for s in stores:
            dlat = math.radians(s["lat"] - lat)
            dlon = math.radians(s["lon"] - lon)
            a = (math.sin(dlat / 2) ** 2
                 + math.cos(math.radians(lat)) * math.cos(math.radians(s["lat"]))
                 * math.sin(dlon / 2) ** 2)
            d = 2 * EARTH_RADIUS_KM * math.asin(math.sqrt(a))
            if d <= radius_km:
                result.append({"id": s["id"], "distance_km": round(d, 2)})
        result.sort(key=lambda r: r["distance_km"])
        return result[:limit]
    ```
- role: assistant
  content: |
    ```python
    import numpy as np

    EARTH_RADIUS_KM = 6371.0


    def stores_nearby(stores, lat, lon, radius_km, limit=20):
        """stores: list of dicts like {"id": 17, "lat": 52.5, "lon": 13.4, "name": "..."}"""
        n = len(stores)
        lats = np.fromiter((s["lat"] for s in stores), dtype=float, count=n)
        lons = np.fromiter((s["lon"] for s in stores), dtype=float, count=n)

        dlat = np.radians(lats - lat)
        dlon = np.radians(lons - lon)
        a = (np.sin(dlat / 2) ** 2
             + np.cos(np.radians(lat)) * np.cos(np.radians(lats)) * np.sin(dlon / 2) ** 2)
        dist = 2 * EARTH_RADIUS_KM * np.arcsin(np.sqrt(a))

        idx = np.flatnonzero(dist <= radius_km)
        rounded = np.round(dist[idx], 2)
        order = np.argsort(rounded, kind="stable")[:limit]

        return [
            {"id": stores[i]["id"], "distance_km": float(d)}
            for i, d in zip(idx[order], rounded[order])
        ]
    ```

    **Green Notes**
    - **Vectorized distance math** (reduces E): the old code ran about six trig calls per store in the Python interpreter, for every request. Now NumPy does the whole formula for all stores in compiled loops. CPU time per request drops, so the same server handles more users.
    - **Only the winners become dicts**: before, every store inside the radius got a result dict, and then the list was sorted. Now the filter and the sort work on arrays, and only the top `limit` entries are built.
    - Behavior is the same: same formula, same rounding to 2 digits, same order. Stores with equal rounded distance keep their original order (stable sort). Tiny differences in the last floating point digit are possible, because NumPy and `math` can differ by one ulp.
    - The list-to-array step still loops over all stores in Python on every call. If the store list changes rarely, build `lats` and `lons` once at startup and pass them in. Then this step disappears too.
    - *Not applied:* a spatial index (grid or KD-tree). At 20 thousand stores the vectorized scan is simple and fast enough. An index only makes sense if the store count grows by a large factor.
