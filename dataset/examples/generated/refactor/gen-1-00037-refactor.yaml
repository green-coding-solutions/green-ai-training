- role: user
  content: |
    Hello, we have a endpoint "stores near me" in our shop backend. Now we have around 20 thousand stores and the request is become slow, CPU of the server is high when many users call it. Can you make it more fast and clean? Sorry for my english.

    ```python
    import math

    EARTH_RADIUS_KM = 6371.0


    def stores_nearby(stores, lat, lon, radius_km, limit=20):
        """stores: list of dicts like {"id": 17, "lat": 52.5, "lon": 13.4, "name": "..."}"""
        result = []
        for s in stores:
            dlat = math.radians(s["lat"] - lat)
            dlon = math.radians(s["lon"] - lon)
            a = (math.sin(dlat / 2) ** 2
                 + math.cos(math.radians(lat)) * math.cos(math.radians(s["lat"]))
                 * math.sin(dlon / 2) ** 2)
            d = 2 * EARTH_RADIUS_KM * math.asin(math.sqrt(a))
            if d <= radius_km:
                result.append({"id": s["id"], "distance_km": round(d, 2)})
        result.sort(key=lambda r: r["distance_km"])
        return result[:limit]
    ```
