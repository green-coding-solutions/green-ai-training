- role: assistant
  content: |
    Seven TTF files load on a first visit just for text styling. This version keeps the brand serif for headings only, as one small subset, and uses the system font for everything else.

    ```css
    @font-face {
      font-family: "Playfair Display";
      src: url("/assets/fonts/playfair-display-700-latin.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2018-201F, U+20AC;
    }

    :root {
      --brand: #1f5d4a;
      --sale: #c0392b;
      --bg: #faf8f5;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      color: #222;
      background: var(--bg);
    }

    h1, h2, h3 { font-family: "Playfair Display", Georgia, serif; font-weight: 700; }

    .site-nav a {
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .hero-tagline { font-style: italic; font-size: 1.4rem; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }
    .product-card h3 { font-size: 1.1rem; }

    .price { font-weight: 600; color: var(--brand); }
    .price--old { font-weight: 400; text-decoration: line-through; color: #777; }

    .btn-buy {
      font-family: inherit;
      font-weight: 700;
      background: var(--brand);
      color: #fff;
      padding: 12px 20px;
      border: 0;
      border-radius: 4px;
    }

    .cart-badge {
      font-weight: 600;
      font-size: 12px;
      background: var(--sale);
      color: #fff;
      border-radius: 999px;
      padding: 2px 7px;
    }
    ```

    Create the heading subset once, for example: `pyftsubset PlayfairDisplay-Bold.ttf --unicodes="U+0000-00FF,U+0131,U+0152-0153,U+2018-201F,U+20AC" --flavor=woff2 --output-file=playfair-display-700-latin.woff2`.

    **Green Notes**
    - **System font stack for body, nav, prices and buttons** (reduces network and E): the text shoppers read most needs no font download. In Green Metrics Tool browser benchmarks with 30 cold page loads, six local TTF files used ~556 J, two Latin-subset WOFF2 files ~488 J (about 12% less) and the system font stack ~410 J (about 26% less than the TTF set).
    - **One WOFF2 subset for headings** (reduces network): the brand look stays on `h1`-`h3`, with one small file instead of seven TTFs.
    - **`font-family: inherit` on `.btn-buy`:** buttons do not inherit the page font by default, so without it the button would fall back to the browser's own font.

    The look changes: body text, prices and the tagline now use the visitor's system font, and the tagline is no longer Playfair italic. If the serif tagline matters for the brand, add the italic as a second Latin-subset WOFF2 file. That is still far smaller than the TTF set.
