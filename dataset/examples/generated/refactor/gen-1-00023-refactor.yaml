id: gen-1-00023-refactor
category: refactor
language: html
patterns:
- modern-image-formats
- lazy-load-images
facts:
- F-IMGENC
messages:
- role: user
  content: |
    hello, my small tool wcheck make a html report after every warehouse check and the staff open it on the phone. the page is very slow and the mobile data is finish quick. photos come direct from the phone camera (4032x3024 jpg). can you make the html more better? i dont know whats wrong

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warehouse check report</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; }
      .grid { display: flex; flex-wrap: wrap; gap: 16px; }
      .card { width: 320px; border: 1px solid #ccc; padding: 8px; }
      .card img { width: 100%; height: auto; }
      .meta { font-size: 12px; color: #555; }
      .bad { color: #b00020; font-weight: bold; }
    </style>
    </head>
    <body>
    <h1>Warehouse check - 2026-10-07</h1>
    <p>Generated by wcheck 0.4. 3 photos, 1 problem found.</p>
    <div class="grid">
      <div class="card">
        <a href="photos/rack-A1.jpg"><img src="photos/rack-A1.jpg" alt="Rack A1"></a>
        <div class="meta">Rack A1 - OK</div>
      </div>
      <div class="card">
        <a href="photos/rack-B4.jpg"><img src="photos/rack-B4.jpg" alt="Rack B4"></a>
        <div class="meta bad">Rack B4 - damaged beam</div>
      </div>
      <div class="card">
        <a href="photos/dock-2.jpg"><img src="photos/dock-2.jpg" alt="Loading dock 2"></a>
        <div class="meta">Dock 2 - OK</div>
      </div>
    </div>
    </body>
    </html>
    ```
- role: assistant
  content: |
    The problem: each card shows a photo at about 300 px wide, but the page downloads the full 4032x3024 camera file. A phone loads many times more pixels than it can show.

    The fix has two parts. First, make small copies of each photo once, when wcheck writes the report. Then let the browser pick the best one.

    ```bash
    mkdir -p photos/web
    for f in photos/*.jpg; do
      name=$(basename "$f" .jpg)
      for w in 400 800; do
        magick "$f" -auto-orient -resize "${w}x" -quality 80 "photos/web/$name-$w.jpg"
        magick "$f" -auto-orient -resize "${w}x" -quality 78 "photos/web/$name-$w.webp"
        magick "$f" -auto-orient -resize "${w}x" -quality 55 "photos/web/$name-$w.avif"
      done
    done
    ```

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warehouse check report</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; }
      .grid { display: flex; flex-wrap: wrap; gap: 16px; }
      .card { width: 320px; border: 1px solid #ccc; padding: 8px; }
      .card img { width: 100%; height: auto; }
      .meta { font-size: 12px; color: #555; }
      .bad { color: #b00020; font-weight: bold; }
    </style>
    </head>
    <body>
    <h1>Warehouse check - 2026-10-07</h1>
    <p>Generated by wcheck 0.4. 3 photos, 1 problem found.</p>
    <div class="grid">
      <div class="card">
        <a href="photos/rack-A1.jpg">
          <picture>
            <source type="image/avif" sizes="304px"
                    srcset="photos/web/rack-A1-400.avif 400w, photos/web/rack-A1-800.avif 800w">
            <source type="image/webp" sizes="304px"
                    srcset="photos/web/rack-A1-400.webp 400w, photos/web/rack-A1-800.webp 800w">
            <img src="photos/web/rack-A1-800.jpg" sizes="304px"
                 srcset="photos/web/rack-A1-400.jpg 400w, photos/web/rack-A1-800.jpg 800w"
                 width="800" height="600" alt="Rack A1">
          </picture>
        </a>
        <div class="meta">Rack A1 - OK</div>
      </div>
      <div class="card">
        <a href="photos/rack-B4.jpg">
          <picture>
            <source type="image/avif" sizes="304px"
                    srcset="photos/web/rack-B4-400.avif 400w, photos/web/rack-B4-800.avif 800w">
            <source type="image/webp" sizes="304px"
                    srcset="photos/web/rack-B4-400.webp 400w, photos/web/rack-B4-800.webp 800w">
            <img src="photos/web/rack-B4-800.jpg" sizes="304px"
                 srcset="photos/web/rack-B4-400.jpg 400w, photos/web/rack-B4-800.jpg 800w"
                 width="800" height="600" alt="Rack B4" loading="lazy">
          </picture>
        </a>
        <div class="meta bad">Rack B4 - damaged beam</div>
      </div>
      <div class="card">
        <a href="photos/dock-2.jpg">
          <picture>
            <source type="image/avif" sizes="304px"
                    srcset="photos/web/dock-2-400.avif 400w, photos/web/dock-2-800.avif 800w">
            <source type="image/webp" sizes="304px"
                    srcset="photos/web/dock-2-400.webp 400w, photos/web/dock-2-800.webp 800w">
            <img src="photos/web/dock-2-800.jpg" sizes="304px"
                 srcset="photos/web/dock-2-400.jpg 400w, photos/web/dock-2-800.jpg 800w"
                 width="800" height="600" alt="Loading dock 2" loading="lazy">
          </picture>
        </a>
        <div class="meta">Dock 2 - OK</div>
      </div>
    </div>
    </body>
    </html>
    ```

    The link still opens the original full-size JPG, so staff can zoom in on the damage. The first photo has no `loading="lazy"` because it is visible at the top. Your wcheck should write the `<picture>` block from a small template function instead of by hand.

    **Green Notes**
    - **Right-sized images** (reduces network): a phone gets the 400 px or 800 px file, not the 4032 px original. This is the biggest saving on mobile data.
    - **Modern formats with a JPEG fallback** (reduces network): the browser takes AVIF first, then WebP, then JPEG. Fewer bytes are sent for the same photo. Decoding AVIF costs a little more CPU on the phone, but the saved transfer is usually worth it.
    - **Convert once, in the tool.** In Green Metrics Tool micro-benchmarks, encoding 50 BMP images to AVIF cost about 7× the CPU energy of JPG. Do it when the report is generated, and skip files that already have a copy. Never do it when someone opens the page. If encoding time is a problem, use WebP only and drop the AVIF line.
    - **`loading="lazy"` and `width`/`height`** : photos below the first screen load only when scrolled to, and the page does not jump while loading.
    - *Not applied:* a CDN or server-side image service. For a small internal report, converting files once is enough.
verify:
  static_only: HTML plus a shell snippet that needs ImageMagick with AVIF support and image files; cannot run in the sandbox
