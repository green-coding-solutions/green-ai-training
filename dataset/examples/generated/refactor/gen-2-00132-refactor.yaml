id: gen-2-00132-refactor
category: refactor
language: bash
patterns:
- bash-quoting
facts:
- F-BASH-QUOTES
messages:
- role: user
  content: |
    fix this

    ```bash
    #!/usr/bin/env bash
    # Converts the Modbus poller dump into JSON lines for the MQTT uplink.
    # cron: * * * * * /opt/gw/bin/to-jsonl.sh > /var/spool/gw/uplink/batch-$(date +\%s).jsonl
    # ~3000 readings per run

    IN="${1:-/var/lib/gw/modbus/latest.csv}"
    SITE="plant-7"
    GW_ID="gw-edge-03"
    FW="2.4.1"

    if [ ! -r "$IN" ]; then
        echo "input not readable: $IN" >&2
        exit 1
    fi

    while IFS="," read sensor channel raw ts; do
        case "$channel" in
            temp)  unit="degC"; scale="0.1" ;;
            hum)   unit="pct";  scale="0.1" ;;
            press) unit="hPa";  scale="1" ;;
            *)
                echo "skip: unknown channel '$channel' on sensor $sensor" >&2
                continue
                ;;
        esac
        echo "{\"site\":\"$SITE\",\"gw\":\"$GW_ID\",\"fw\":\"$FW\",\"sensor\":\"$sensor\",\"channel\":\"$channel\",\"raw\":$raw,\"unit\":\"$unit\",\"scale\":$scale,\"ts\":$ts}"
    done < "$IN"
    ```
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    # Converts the Modbus poller dump into JSON lines for the MQTT uplink.
    # cron: * * * * * /opt/gw/bin/to-jsonl.sh > /var/spool/gw/uplink/batch-$(date +\%s).jsonl
    # ~3000 readings per run

    IN="${1:-/var/lib/gw/modbus/latest.csv}"
    SITE='plant-7'
    GW_ID='gw-edge-03'
    FW='2.4.1'

    if [ ! -r "$IN" ]; then
        echo "input not readable: $IN" >&2
        exit 1
    fi

    while IFS=',' read -r sensor channel raw ts || [ -n "$sensor" ]; do
        case "$channel" in
            temp)  unit='degC'; scale='0.1' ;;
            hum)   unit='pct';  scale='0.1' ;;
            press) unit='hPa';  scale='1' ;;
            *)
                echo "skip: unknown channel '$channel' on sensor $sensor" >&2
                continue
                ;;
        esac
        printf '{"site":"%s","gw":"%s","fw":"%s","sensor":"%s","channel":"%s","raw":%s,"unit":"%s","scale":%s,"ts":%s}\n' \
            "$SITE" "$GW_ID" "$FW" "$sensor" "$channel" "$raw" "$unit" "$scale" "$ts"
    done < "$IN"
    ```

    **Green Notes**
    - **Single quotes for fixed text** (reduces E): the JSON layout was one long double-quoted literal full of `\"`, and bash scans it for `$`, backticks and backslashes on every reading. It is now a single-quoted `printf` format, and the values go in as separate arguments. The same applies to the constants and the `unit`/`scale` assignments in the loop. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes (about 14% less with 10,000 iterations). Your literal is shorter, so the absolute saving is small. It still runs ~3000 times every minute, and the escaping is gone.
    - **Double quotes kept where values expand:** `"$IN"`, `"$sensor"`, the stderr message and all `printf` arguments stay double-quoted.
    - **Bug fixes:** `read` without `-r` silently dropped backslashes from fields, and now they are kept as-is. Also, if the poller writes the file without a final newline, the last reading was skipped. `|| [ -n "$sensor" ]` now processes it.

    For normal input the output is byte-for-byte the same as before.
verify:
  lang: bash
  setup: |
    tmp=$(mktemp)
    printf 's1,temp,215,1700000000\ns2,hum,512,1700000001\ns3,press,1013,1700000002\ns4,vib,9,1700000003\ns5,temp,-12,1700000004\n' > "$tmp"
    set -- "$tmp"
  equivalence:
    driver: 'true'
