    import json
    import re
    import sys
    import urllib.request
    from collections import Counter

    LINE_RE = re.compile(r'^(\S+) \S+ \S+ \[[^\]]+\] "(\S+) (\S+)[^"]*" (\d{3}) (\d+|-)')


    def lookup_country(ip):
        url = f"https://ipapi.example.com/json/{ip}"
        with urllib.request.urlopen(url, timeout=5) as resp:
            return json.load(resp).get("country_code", "??")


    def summarize(path):
        hits = Counter()
        errors = Counter()
        with open(path) as f:
            for line in f:
                m = LINE_RE.match(line)
                if not m:
                    continue
                ip, method, url, status, size = m.groups()
                country = lookup_country(ip)
                hits[country] += 1
                if status.startswith("5"):
                    errors[country] += 1
        return hits, errors


    if __name__ == "__main__":
        hits, errors = summarize(sys.argv[1])
        for country, n in hits.most_common(10):
            print(f"{country}\t{n}\t{errors[country]}")
    ```
