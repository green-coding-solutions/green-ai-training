    ```python
    import re
    import requests

    BASE_URL = "https://shop.example.com/p/"


    def check_prices(skus):
        """Fetch competitor product pages, return {sku: (cents, stock)}."""
        results = {}
        for sku in skus:
            url = BASE_URL + sku
            try:
                resp = requests.get(url, timeout=10)
                resp.raise_for_status()
            except requests.RequestException as e:
                print(f"skip {sku}: {e}")
                continue
            html = resp.text
            price_m = re.search(r'<span class="price"[^>]*>\s*([\d.,]+)\s*&euro;', html)
            stock_m = re.search(r'data-stock="(\d+)"', html)
            if not price_m:
                print(f"no price for {sku}")
                continue
            price = price_m.group(1).replace(".", "").replace(",", ".")
            cents = round(float(price) * 100)
            stock = int(stock_m.group(1)) if stock_m else 0
            results[sku] = (cents, stock)
        return results
