id: gen-1-00441-refactor
category: refactor
language: java
patterns:
- select-columns
- efficient-algorithm
facts:
- F-PG-SELECT
messages:
- role: user
  content: |
    hello, we have this method for our shop backend, it make the totals of every order for one day (for the accounting export). it is very slow when day have many orders and the DB is busy too. can you make it more better? thank you

    ```java
    public class DailyTotalsService {
        private final DataSource ds;

        record Product(long id, BigDecimal price) {}

        public DailyTotalsService(DataSource ds) {
            this.ds = ds;
        }

        public Map<Long, BigDecimal> orderTotalsForDay(LocalDate day) throws SQLException {
            Map<Long, BigDecimal> totals = new LinkedHashMap<>();
            try (Connection c = ds.getConnection()) {
                List<Product> products = new ArrayList<>();
                try (Statement st = c.createStatement();
                     ResultSet rs = st.executeQuery("SELECT * FROM products")) {
                    while (rs.next()) {
                        products.add(new Product(rs.getLong("id"), rs.getBigDecimal("price")));
                    }
                }

                String sql = "SELECT * FROM order_items WHERE order_date = ? ORDER BY order_id";
                try (PreparedStatement ps = c.prepareStatement(sql)) {
                    ps.setDate(1, Date.valueOf(day));
                    try (ResultSet rs = ps.executeQuery()) {
                        while (rs.next()) {
                            long orderId = rs.getLong("order_id");
                            long productId = rs.getLong("product_id");
                            int qty = rs.getInt("qty");
                            for (Product p : products) {
                                if (p.id() == productId) {
                                    BigDecimal line = p.price().multiply(BigDecimal.valueOf(qty));
                                    totals.merge(orderId, line, BigDecimal::add);
                                    break;
                                }
                            }
                        }
                    }
                }
            }
            return totals;
        }
    }
    ```
- role: assistant
  content: |
    Let the database do the lookup. One query joins the items to their prices and returns only the three columns you use.

    ```java
    public class DailyTotalsService {
        private static final String SQL = """
            SELECT i.order_id, i.qty, p.price
            FROM order_items i
            JOIN products p ON p.id = i.product_id
            WHERE i.order_date = ?
            ORDER BY i.order_id
            """;

        private final DataSource ds;

        public DailyTotalsService(DataSource ds) {
            this.ds = ds;
        }

        public Map<Long, BigDecimal> orderTotalsForDay(LocalDate day) throws SQLException {
            Map<Long, BigDecimal> totals = new LinkedHashMap<>();
            try (Connection c = ds.getConnection();
                 PreparedStatement ps = c.prepareStatement(SQL)) {
                ps.setDate(1, Date.valueOf(day));
                try (ResultSet rs = ps.executeQuery()) {
                    while (rs.next()) {
                        BigDecimal line = rs.getBigDecimal("price")
                                .multiply(BigDecimal.valueOf(rs.getInt("qty")));
                        totals.merge(rs.getLong("order_id"), line, BigDecimal::add);
                    }
                }
            }
            return totals;
        }
    }
    ```

    **Green Notes**
    - **Better algorithm** (reduces E): the old code scanned the whole product list for every order item. That is items × products comparisons in Java. The join uses the primary key on `products.id`, so each item is one index lookup.
    - **No full product load** (reduces E, network): `SELECT * FROM products` copied the whole catalog from the DB on every call, only to use two columns. Now only the products of that day's items are touched.
    - **Select only needed columns** (reduces E, network): `order_items` is read as `SELECT *`, but you use only `order_id`, `qty` and the price. In Green Metrics Tool micro-benchmarks on PostgreSQL, reading a 52-column table with large text columns with `SELECT *` used about 5.5× to 7× more CPU energy than naming 10 columns ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=b7203ffe-39ae-4e84-bf85-998c9389ea46,4702c2ee-13d5-4d70-bcfe-31e193104a8e)). Your tables are different, so the gain depends on how big the skipped columns are (notes, payloads, etc.).
      https://patterns.greensoftware.foundation/development/data-handling/reduce-transmitted-data
    - Same result as before: the totals are the same and the map keeps the order by `order_id`. Items with an unknown product are still skipped, because the join is an inner join.
    - Check that `order_items` has an index on `order_date`. Without it, the DB still scans the whole table.
verify:
  static_only: needs a JDBC database and a Java toolchain with a DataSource
