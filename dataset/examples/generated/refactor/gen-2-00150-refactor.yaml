id: gen-2-00150-refactor
category: refactor
language: html
patterns:
- lazy-load-images
- system-fonts-and-deps
facts:
- F-LAZY-IMG
- F-FONTS
messages:
- role: user
  content: |
    hi, this is template of our winter sale page in the shop. On mobile it load very slow, and our analytic say most people only look the first products and then they click one or leave. Can you clean it up? We want keep the brand font somewhere if possible, otherwise designer will cry :)

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Winter Sale | Nordpfad Outdoor</title>
      <style>
        @font-face { font-family: "Nordpfad Sans"; src: url("/fonts/NordpfadSans-Light.ttf") format("truetype"); font-weight: 300; }
        @font-face { font-family: "Nordpfad Sans"; src: url("/fonts/NordpfadSans-Regular.ttf") format("truetype"); font-weight: 400; }
        @font-face { font-family: "Nordpfad Sans"; src: url("/fonts/NordpfadSans-Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
        @font-face { font-family: "Nordpfad Sans"; src: url("/fonts/NordpfadSans-Medium.ttf") format("truetype"); font-weight: 500; }
        @font-face { font-family: "Nordpfad Sans"; src: url("/fonts/NordpfadSans-Bold.ttf") format("truetype"); font-weight: 700; }
        @font-face { font-family: "Nordpfad Sans"; src: url("/fonts/NordpfadSans-BoldItalic.ttf") format("truetype"); font-weight: 700; font-style: italic; }

        body { margin: 0; font-family: "Nordpfad Sans", Arial, sans-serif; color: #1d2329; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; }
        h1, h2 { font-weight: 700; }
        .hero { position: relative; }
        .hero img { display: block; width: 100%; height: auto; }
        .hero h1 { position: absolute; left: 24px; bottom: 24px; color: #fff; font-size: 3rem; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 24px; }
        @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; } }
        .card img { display: block; width: 100%; height: auto; }
        .card h2 { font-size: 1rem; margin: 8px 0 4px; }
        .price { font-weight: 500; margin: 0; }
        .price del { font-weight: 300; font-style: italic; color: #777; }
        .badge { font-weight: 700; font-style: italic; color: #c0392b; }
      </style>
    </head>
    <body>
      <header>
        <a href="/"><img src="/img/logo.svg" width="160" height="40" alt="Nordpfad Outdoor"></a>
        <nav><a href="/cart">Cart ({{ cart_count }})</a></nav>
      </header>

      <section class="hero">
        <img src="/img/sale/winter-hero.jpg" width="2400" height="900" alt="Winter sale on jackets and boots">
        <h1>Winter Sale</h1>
      </section>

      <main class="grid">
        {% for p in products %}
        <article class="card">
          <a href="/p/{{ p.slug }}">
            <img src="{{ p.image_url }}" width="800" height="1000" alt="{{ p.name }}">
          </a>
          <h2>{{ p.name }}</h2>
          <p class="price">
            {% if p.old_price %}<del>{{ p.old_price }}</del>{% endif %}
            {{ p.price }}
          </p>
          {% if p.on_sale %}<span class="badge">Sale</span>{% endif %}
        </article>
        {% endfor %}
      </main>

      <footer>
        <p>Free shipping from €80 · <a href="/returns">Returns</a> · <a href="/imprint">Imprint</a></p>
      </footer>
    </body>
    </html>
    ```
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Winter Sale | Nordpfad Outdoor</title>
      <style>
        /* Brand font: one bold Latin subset, used for headings only */
        @font-face {
          font-family: "Nordpfad Sans";
          src: url("/fonts/NordpfadSans-Bold-latin.woff2") format("woff2");
          font-weight: 700;
        }

        :root {
          --font-system: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body { margin: 0; font-family: var(--font-system); color: #1d2329; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; }
        h1, h2 { font-family: "Nordpfad Sans", var(--font-system); font-weight: 700; }
        .hero { position: relative; }
        .hero img { display: block; width: 100%; height: auto; }
        .hero h1 { position: absolute; left: 24px; bottom: 24px; color: #fff; font-size: 3rem; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 24px; }
        @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; } }
        .card img { display: block; width: 100%; height: auto; }
        .card h2 { font-size: 1rem; margin: 8px 0 4px; }
        .price { font-weight: 500; margin: 0; }
        .price del { font-weight: 300; font-style: italic; color: #777; }
        .badge { font-weight: 700; font-style: italic; color: #c0392b; }
      </style>
    </head>
    <body>
      <header>
        <a href="/"><img src="/img/logo.svg" width="160" height="40" alt="Nordpfad Outdoor"></a>
        <nav><a href="/cart">Cart ({{ cart_count }})</a></nav>
      </header>

      <section class="hero">
        <!-- Above the fold: stays eager -->
        <img src="/img/sale/winter-hero.jpg" width="2400" height="900" alt="Winter sale on jackets and boots">
        <h1>Winter Sale</h1>
      </section>

      <main class="grid">
        {% for p in products %}
        <article class="card">
          <a href="/p/{{ p.slug }}">
            <img src="{{ p.image_url }}" width="800" height="1000" alt="{{ p.name }}"{% if loop.index > 4 %} loading="lazy"{% endif %}>
          </a>
          <h2>{{ p.name }}</h2>
          <p class="price">
            {% if p.old_price %}<del>{{ p.old_price }}</del>{% endif %}
            {{ p.price }}
          </p>
          {% if p.on_sale %}<span class="badge">Sale</span>{% endif %}
        </article>
        {% endfor %}
      </main>

      <footer>
        <p>Free shipping from €80 · <a href="/returns">Returns</a> · <a href="/imprint">Imprint</a></p>
      </footer>
    </body>
    </html>
    ```

    **Green Notes**
    - **Lazy-load offscreen product photos** (reduces E, network): product photos from card five on now load only when the visitor scrolls near them. Your visitors mostly stop after the first products, and that is exactly where this helps. In Green Metrics Tool browser benchmarks with a page of 15 photos, 20 loads without scrolling used ~368 J eagerly and ~325 J with `loading="lazy"`, about 12% less. When visitors scrolled to the end, there was no difference.
    - **Above the fold stays eager:** the logo, the hero and the first four cards (the first row on desktop) load right away. Lazy loading them would only make them show up later.
    - **System font stack for text, brand font only on headings** (reduces E, network): the six TTF files are gone. Body text, prices and badges use the system font. `h1`/`h2` keep "Nordpfad Sans" from one bold WOFF2 subset. In Green Metrics Tool page-load benchmarks (30 cold loads), six TTF font files used ~556 J, two Latin-subset WOFF2 files ~488 J (about 12% less), and the system font stack ~410 J (about 26% less than the TTF set).

    Make the subset once, at build time (needs `fonttools` and `brotli`):

    ```bash
    pyftsubset NordpfadSans-Bold.ttf --unicodes='U+0020-007E,U+00A0-00FF,U+20AC' --flavor=woff2 --output-file=NordpfadSans-Bold-latin.woff2
    ```

    What changes visually: body text now uses the phone's or OS's own font (San Francisco, Roboto, Segoe UI). Headings look the same as before. The images already have `width`/`height`, so the grid does not jump when lazy images arrive.
verify:
  static_only: HTML/Jinja template rendered in a browser
