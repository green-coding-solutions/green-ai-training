id: gen-1-00408-refactor
category: refactor
language: java
patterns:
- hoist-invariants
- select-columns
messages:
- role: user
  content: |
    Renders the plan cards on our landing page, called on every page view. Diff only please.

    ```java
    public String renderPlanCards(String lang) throws SQLException {
        StringBuilder html = new StringBuilder();
        try (Connection c = ds.getConnection();
             Statement st = c.createStatement();
             ResultSet rs = st.executeQuery(
                 "SELECT * FROM plans WHERE active = true ORDER BY sort_order")) {
            while (rs.next()) {
                Locale locale = Locale.forLanguageTag(lang);
                NumberFormat money = NumberFormat.getCurrencyInstance(locale);
                money.setCurrency(Currency.getInstance("EUR"));
                Pattern nonSlug = Pattern.compile("[^a-z0-9]+");

                String name = rs.getString("name");
                String slug = nonSlug.matcher(name.toLowerCase()).replaceAll("-");
                String price = money.format(rs.getLong("price_cents") / 100.0);

                html.append("<article class=\"plan\" id=\"plan-").append(slug).append("\">");
                html.append("<h3>").append(name).append("</h3>");
                html.append("<p class=\"tagline\">").append(rs.getString("tagline")).append("</p>");
                html.append("<p class=\"price\">").append(price).append("</p>");
                String badge = rs.getString("badge");
                if (badge != null) {
                    html.append("<span class=\"badge\">").append(badge).append("</span>");
                }
                html.append("</article>");
            }
        }
        return html.toString();
    }
    ```
- role: assistant
  content: |
    ```java
    private static final Pattern NON_SLUG = Pattern.compile("[^a-z0-9]+");
    private static final Currency EUR = Currency.getInstance("EUR");

    public String renderPlanCards(String lang) throws SQLException {
        StringBuilder html = new StringBuilder();
        NumberFormat money = NumberFormat.getCurrencyInstance(Locale.forLanguageTag(lang));
        money.setCurrency(EUR);
        try (Connection c = ds.getConnection();
             Statement st = c.createStatement();
             ResultSet rs = st.executeQuery(
                 "SELECT name, tagline, price_cents, badge FROM plans WHERE active = true ORDER BY sort_order")) {
            while (rs.next()) {
                String name = rs.getString("name");
                String slug = NON_SLUG.matcher(name.toLowerCase()).replaceAll("-");
                String price = money.format(rs.getLong("price_cents") / 100.0);

                html.append("<article class=\"plan\" id=\"plan-").append(slug).append("\">");
                html.append("<h3>").append(name).append("</h3>");
                html.append("<p class=\"tagline\">").append(rs.getString("tagline")).append("</p>");
                html.append("<p class=\"price\">").append(price).append("</p>");
                String badge = rs.getString("badge");
                if (badge != null) {
                    html.append("<span class=\"badge\">").append(badge).append("</span>");
                }
                html.append("</article>");
            }
        }
        return html.toString();
    }
    ```

    **Green Notes**
    - **Named columns instead of `SELECT *`** (reduces E, network): the loop reads only four columns. `SELECT *` also pulls every other column of `plans` from the database on every page view. If the table has large columns such as long descriptions or terms HTML, those bytes were fetched and thrown away. Reduce transmitted data
    - **Hoisted loop invariants** (reduces E): `Pattern.compile` ran once per plan row, and the pattern never changes, so it is now a `static final`. The `NumberFormat` and `Locale` depend only on `lang`, so they are built once per call.
    - `NumberFormat` is not thread-safe, so it stays a local variable. Do not make it a `static` field.
    - Output is identical. If you add columns to the card later, add them to the `SELECT` list too.
    - The bigger win is not rendering this per request. Plan data rarely changes, but caching it needs an invalidation plan, so I left it out.
verify:
  static_only: Java code needs a JDBC DataSource and a database, which the test harness does not have
