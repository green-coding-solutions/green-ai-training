- role: user
  content: |
    We run this every morning on a small box at the test site. It pulls yesterday's raw accelerometer traces from about 40 field loggers through the site gateway and packs them into int16 archive files. Each trace is around 8.6M float32 samples. The whole thing takes ~25 minutes now and it's getting in the way of the morning analysis.

    Can you refactor it? Requirements:
    - CLI stays exactly the same (cron calls it, and so does one other script)
    - the .i16 and .json files must stay byte-identical, the downstream reader is strict
    - the gateway falls over with more than 8 parallel connections
    - httpx and numba are already in the venv, Python 3.11

    ```python
    #!/usr/bin/env python3
    """Pull raw traces from the field loggers and pack them into int16 archive files."""
    import argparse
    import json
    import math
    import pathlib
    import urllib.request

    import numpy as np

    FULL_SCALE_G = 16.0
    LEVELS = 32767


    def fetch_trace(base_url, logger_id, day):
        url = f"{base_url}/loggers/{logger_id}/raw?day={day}"
        with urllib.request.urlopen(url, timeout=60) as resp:
            return np.frombuffer(resp.read(), dtype="<f4")


    def quantize(samples, full_scale):
        step = full_scale / LEVELS
        out = np.empty(len(samples), dtype=np.int16)
        clipped = 0
        for i in range(len(samples)):
            q = math.floor(float(samples[i]) / step + 0.5)
            if q > LEVELS:
                q = LEVELS
                clipped += 1
            elif q < -LEVELS:
                q = -LEVELS
                clipped += 1
            out[i] = q
        return out, clipped


    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--base-url", default="http://gateway.site3.lan:8080")
        ap.add_argument("--day", required=True)
        ap.add_argument("--out", type=pathlib.Path, default=pathlib.Path("archive"))
        ap.add_argument("loggers", nargs="+")
        args = ap.parse_args()
        args.out.mkdir(parents=True, exist_ok=True)

        for logger_id in args.loggers:
            samples = fetch_trace(args.base_url, logger_id, args.day)
            codes, clipped = quantize(samples, FULL_SCALE_G)
            codes.tofile(args.out / f"{logger_id}_{args.day}.i16")
            meta = {
                "logger": logger_id,
                "day": args.day,
                "step_g": FULL_SCALE_G / LEVELS,
                "n": len(codes),
                "clipped": clipped,
            }
            (args.out / f"{logger_id}_{args.day}.json").write_text(json.dumps(meta))
            print(f"{logger_id}: {len(codes)} samples, {clipped} clipped")


    if __name__ == "__main__":
        main()
    ```
