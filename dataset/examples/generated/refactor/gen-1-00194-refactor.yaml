      import tempfile, glob, gzip, lzma, time
      d = tempfile.mkdtemp()
      ARCHIVE_DIR = d
      clock = [1000]
      def fake_time():
          clock[0] += 1
          return clock[0]
      time.time = fake_time
      for i in range(1250):
          on_reading({"id": i, "t": 20 + i % 7, "dev": "s%d" % (i % 5)})
      flush()
      rows = []
      files = sorted(glob.glob(d + "/*"))
      for p in files:
          opener = lzma.open if p.endswith(".xz") else gzip.open
          with opener(p, "rt") as f:
              rows += f.read().split("\n")
      print(len(files), len(rows), rows[0], rows[-1], len(buffer))
