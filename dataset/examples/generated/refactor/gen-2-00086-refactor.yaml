    You can now stop copying the `fonts/` folder into each digest.

    **Green Notes**
    - **System font stacks instead of six TTF files** (reduces network and E): the page no longer downloads any fonts before the text can render. This applies to both the body text and the log excerpts. In Green Metrics Tool browser benchmarks with 30 cold page loads, six local TTF files (~4 MB) used ~556 J, two Latin-subset WOFF2 files ~488 J and the system font stack ~410 J. That is about 26% less than the TTF set.
    - **`loading="lazy"` on the per-service charts** (reduces network and E): people who only look at the summary and the hourly chart no longer load the seven service PNGs. The saving depends on readers not scrolling down. In the same benchmarks, an article with 15 photos loaded without scrolling used ~368 J with eager images and ~325 J with lazy loading below the fold, about 12% less. When visitors scrolled to the end, there was no measurable difference.

    "Errors per hour" stays eager because it is visible right after the page loads. The `width`/`height` attributes were already set, so lazy loading does not shift the layout. The text now uses each reader's OS font (San Francisco, Segoe UI, Roboto and so on) instead of Inter and JetBrains Mono, so the page will look a little different on each system.
