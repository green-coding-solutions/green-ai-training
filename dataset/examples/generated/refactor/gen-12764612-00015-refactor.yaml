messages:
- role: user
  content: |
    Landing page picks the hero block per visitor with a small TorchScript ranker. Endpoint is hit on every page view, CPU only. Optimize, diff only please.

    ```python
    import torch
    from flask import Flask, request, jsonify

    app = Flask(__name__)

    model = torch.jit.load("models/hero_ranker.pt")
    model.eval()

    VARIANTS = ["pricing", "demo", "docs", "case-study"]
    DEVICES = {"desktop": 0, "mobile": 1, "tablet": 2}


    def featurize(args):
        device = DEVICES.get(args.get("device", "desktop"), 0)
        utm_known = 1.0 if args.get("utm_source") else 0.0
        returning = 1.0 if args.get("returning") == "1" else 0.0
        hour = int(args.get("hour", 12)) / 23.0
        return [float(device), utm_known, returning, hour]


    @app.get("/api/hero")
    def hero():
        feats = featurize(request.args)
        x = torch.tensor([feats], dtype=torch.float32)
        scores = torch.softmax(model(x), dim=1)[0]
        best = int(scores.argmax())
        return jsonify(variant=VARIANTS[best], score=float(scores[best]))
    ```
