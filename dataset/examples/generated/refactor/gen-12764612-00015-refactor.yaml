    **Green Notes**
    - **`torch.no_grad()` for inference** (reduces E on every page view): `model.eval()` only changes layer behavior like dropout. It does not stop autograd. The model's weights still require gradients, so each forward pass records a graph that is never used. In Green Metrics Tool micro-benchmarks of 100,000 PyTorch CPU inferences, this cost ~157 J without `torch.no_grad()` and ~135 J with it, about 14% less. Your model is small, so treat that as the direction, not a forecast for your traffic.
    - Output is unchanged. The scores are only read, never back-propagated, so nothing depends on the graph. `torch.inference_mode()` is a stricter alternative, but it makes the result tensors unusable in autograd later.
    - Nothing else in the file needed a change.
