      class FakeBus:
          def __init__(self):
              self.n = 0
              self.log = []

          def write(self, dev, op, data):
              self.n += 1
              if dev == 9 or self.n % 7 == 0:
                  raise IOError("timeout")
              self.log.append((dev, op, len(data)))

      bus = FakeBus()
      d = CommandDispatcher(bus)
      d.submit_firmware(4, bytes(range(256)) * 20, chunk_size=100)
      d.submit({"dev": 2, "op": "estop"})
      d.submit({"dev": 9, "op": "valve_close"})
      d.submit({"dev": 3, "op": "read_cfg"})
      print(len(d.queued_for(4)), len(d.queued_for(9)))
      for _ in range(5):
          d.run_once()
      d.submit({"dev": 5, "op": "relay_off"})
      d.drain()
      print(d.sent, len(bus.log))
      print(bus.log)
      print([(c["dev"], c["op"], c["tries"]) for c in d.failed])
      print(d.run_once())
