    **Green Notes**
    - **AVIF and WebP for the photos** (reduces network): these formats make photo files much smaller than PNG, and smaller files are where the saving comes from. The browser uses the first `<source>` it supports and falls back to the `<img>`. The alt texts and sizes are the same as before.
    - **JPEG instead of PNG as fallback for the photos** (reduces E, network): PNG stores photos without loss, so the files get very big. In Green Metrics Tool page-load benchmarks (50 loads per format), PNG used the most client CPU energy of all tested formats (~181 J), JPG the least (~134 J). AVIF decoding cost about 19% more than JPG there. So AVIF saves bytes, and the decoding is not cheaper.
    - **Encode once, not per request** (reduces E): in Green Metrics Tool benchmarks, encoding 50 images to AVIF used ~658 J and to JPG ~89 J, so AVIF encoding cost about 7× more. You change photos once a month, so convert them when the designer delivers them (Squoosh, `avifenc`, `cwebp`), commit the files and serve them as static files. Don't use a converter that encodes on every request.
    - **Coffee bags keep a PNG fallback:** JPEG has no transparency, so a JPEG bag would get a solid background on the colored cards. AVIF and WebP both support transparency. The logo stays SVG, which is already the best choice for it.

    Check one thing in `main.css`: the images are now inside `<picture>`. A child selector like `.hero > img` no longer matches, so change it to `.hero img`. Also compare the exported files to the PNGs once by eye before you publish them.
verify:
