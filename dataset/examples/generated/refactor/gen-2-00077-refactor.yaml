messages:
- role: user
  content: |
    hi, this is landing page for our small coffee roastery. our designer export all images from figma as png and the page is very heavy, on mobile it take long time until hero is visible. can you make it better pls? the coffee bags have transparent background because they sit on colored cards. we change photos maybe one time per month when new coffee come.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Harbour Roasters – Fresh roasted coffee every week</title>
      <link rel="stylesheet" href="/css/main.css">
    </head>
    <body>
      <header class="site-header">
        <a href="/"><img src="/img/logo.svg" alt="Harbour Roasters" width="160" height="40"></a>
        <nav>
          <a href="#coffees">Coffees</a>
          <a href="#subscription">Subscription</a>
          <a href="#contact">Contact</a>
        </nav>
      </header>

      <section class="hero">
        <img src="/img/hero-roaster.png" alt="Our roaster pouring fresh beans into the cooling tray" width="1920" height="1080">
        <h1>Roasted on Monday. At your door on Wednesday.</h1>
        <a class="btn" href="#subscription">Start subscription</a>
      </section>

      <section id="coffees" class="products">
        <article class="card card--ethiopia">
          <img src="/img/bag-ethiopia-guji.png" alt="Bag of Ethiopia Guji" width="600" height="800">
          <h2>Ethiopia Guji</h2>
          <p>Berries, jasmine, light roast.</p>
        </article>
        <article class="card card--colombia">
          <img src="/img/bag-colombia-huila.png" alt="Bag of Colombia Huila" width="600" height="800">
          <h2>Colombia Huila</h2>
          <p>Caramel, red apple, medium roast.</p>
        </article>
      </section>

      <section class="story">
        <img src="/img/farm-visit.png" alt="Visiting the cooperative in Huila during harvest" width="1600" height="900">
        <p>We buy directly from three cooperatives and visit them every year.</p>
      </section>
    </body>
    </html>
    ```
