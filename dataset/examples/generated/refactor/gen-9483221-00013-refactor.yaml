    **Green Notes**
    - **Removed unused CSS** (reduces network): dropped `.tabs`, `.tab`, `.btn*`, `.alert*`, `.badge`, `.modal*`, `.tooltip`, `.sidebar`, `.no-print` and the two `@media` blocks. None of these selectors match anything in the markup, and the page has no script that could add classes later, so rendering is identical.
    - **Expect bytes, not CPU, to shrink.** In Green Metrics Tool micro-benchmarks (50 cold page loads), a 16 KB mostly unused stylesheet used about 783 J on the client, and the purged version about 764 J. That is about 2% less, within measurement noise. This stylesheet is smaller than that, so the gain is a smaller file on the wire, not measurable energy.
    - If the page is generated from a template, remove the rules there too, so they don't come back in the next run.
