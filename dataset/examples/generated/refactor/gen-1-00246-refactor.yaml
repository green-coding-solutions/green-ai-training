messages:
- role: user
  content: |
    hi, this is the product page of our small coffee shop (hand grinder). I made it from a template. Customers say the big grinder photo shows up late, and the page feels heavy. I dont know what is wrong, can you look?

    ```html
    <body>
      <header class="top">
        <img src="/img/logo.png" alt="Brew & Bean" width="160" height="48">
        <nav>...</nav>
      </header>

      <main class="product">
        <section class="gallery">
          <img class="hero" src="/img/grinder-main.jpg" alt="Hand grinder, front view"
               width="900" height="900" loading="lazy">
          <div class="thumbs">
            <img src="/img/grinder-side.jpg" alt="Side view" width="120" height="120" loading="lazy">
            <img src="/img/grinder-top.jpg" alt="Top view" width="120" height="120" loading="lazy">
          </div>
        </section>
        <section class="buy">
          <h1>Hand Grinder Pro</h1>
          <p class="price">49.00 EUR</p>
          <button id="add">Add to cart</button>
        </section>
      </main>

      <section class="details">
        <h2>Details</h2>
        <img src="/img/grinder-burrs.jpg" alt="Steel burrs" width="800" height="500">
        <img src="/img/grinder-sizes.jpg" alt="Grind sizes" width="800" height="500">
      </section>

      <section class="reviews">
        <h2>Reviews</h2>
        <img src="/img/review-anna.jpg" alt="Photo from Anna" width="400" height="400">
        <img src="/img/review-tom.jpg" alt="Photo from Tom" width="400" height="400">
        <img src="/img/review-li.jpg" alt="Photo from Li" width="400" height="400">
      </section>

      <section class="related">
        <h2>You may also like</h2>
        <img src="/img/filter-paper.jpg" alt="Filter papers" width="300" height="300">
        <img src="/img/kettle.jpg" alt="Gooseneck kettle" width="300" height="300">
        <img src="/img/scale.jpg" alt="Coffee scale" width="300" height="300">
        <img src="/img/dripper.jpg" alt="Ceramic dripper" width="300" height="300">
      </section>
    </body>
    ```
- role: assistant
  content: |
    The lazy loading is on the wrong images. The big photo at the top has `loading="lazy"`, so the browser waits to load it. The images further down have none, so they all load at once.

    ```html
    <body>
      <header class="top">
        <img src="/img/logo.png" alt="Brew & Bean" width="160" height="48">
        <nav>...</nav>
      </header>

      <main class="product">
        <section class="gallery">
          <img class="hero" src="/img/grinder-main.jpg" alt="Hand grinder, front view"
               width="900" height="900">
          <div class="thumbs">
            <img src="/img/grinder-side.jpg" alt="Side view" width="120" height="120">
            <img src="/img/grinder-top.jpg" alt="Top view" width="120" height="120">
          </div>
        </section>
        <section class="buy">
          <h1>Hand Grinder Pro</h1>
          <p class="price">49.00 EUR</p>
          <button id="add">Add to cart</button>
        </section>
      </main>

      <section class="details">
        <h2>Details</h2>
        <img src="/img/grinder-burrs.jpg" alt="Steel burrs" width="800" height="500" loading="lazy">
        <img src="/img/grinder-sizes.jpg" alt="Grind sizes" width="800" height="500" loading="lazy">
      </section>

      <section class="reviews">
        <h2>Reviews</h2>
        <img src="/img/review-anna.jpg" alt="Photo from Anna" width="400" height="400" loading="lazy">
        <img src="/img/review-tom.jpg" alt="Photo from Tom" width="400" height="400" loading="lazy">
        <img src="/img/review-li.jpg" alt="Photo from Li" width="400" height="400" loading="lazy">
      </section>

      <section class="related">
        <h2>You may also like</h2>
        <img src="/img/filter-paper.jpg" alt="Filter papers" width="300" height="300" loading="lazy">
        <img src="/img/kettle.jpg" alt="Gooseneck kettle" width="300" height="300" loading="lazy">
        <img src="/img/scale.jpg" alt="Coffee scale" width="300" height="300" loading="lazy">
        <img src="/img/dripper.jpg" alt="Ceramic dripper" width="300" height="300" loading="lazy">
      </section>
    </body>
    ```

    **Green Notes**
    - **Lazy loading only below the fold** (reduces E, network): I removed `loading="lazy"` from the grinder photo and the two thumbnails. They are the first thing visitors see, so they should load right away. This is also why the photo showed up late. I added it to the detail, review and related images, which most visitors only reach after scrolling. In Green Metrics Tool browser benchmarks, an article with 15 photos loaded 20 times without scrolling used ~368 J with all images eager and ~325 J with lazy loading below the fold, about 12% less. When visitors scrolled to the end, there was no difference (about 1% more, which is noise). So the saving depends on how many visitors stop before the lower sections.

    The `width` and `height` attributes are already set, so the page layout does not jump when lazy images arrive. The logo stays eager as well.
verify:
  static_only: HTML markup, no executable code
