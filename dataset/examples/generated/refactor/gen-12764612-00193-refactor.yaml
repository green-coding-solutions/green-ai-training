    ```python
    import json
    import sys
    import urllib.request

    BASE = "https://api.stationnet.example/v2"
    STATIONS = ["ALP01", "ALP02", "ALP03", "ALP04", "ALP05", "ALP06",
                "BAL01", "BAL02", "BAL03", "BAL04", "BAL05", "BAL06"]


    def fetch_station(station, day):
        url = f"{BASE}/stations/{station}/readings?date={day}"
        with urllib.request.urlopen(url, timeout=20) as resp:
            return json.loads(resp.read())


    def flag_reading(code):
        if code >= 0 and code < 1:
            return "ok"
        elif code >= 1 and code < 2:
            return "suspect"
        elif code >= 2 and code < 3:
            return "interpolated"
        elif code >= 9 and code < 10:
            return "missing"
        return "unknown"


    def daily_summary(day):
        summary = {}
        for station in STATIONS:
            data = fetch_station(station, day)
            counts = {}
            total = 0.0
            n = 0
            for r in data["readings"]:
                flag = flag_reading(r["qc"])
                counts[flag] = counts.get(flag, 0) + 1
                if flag == "ok":
                    total += r["temp_c"]
                    n += 1
            summary[station] = {
                "mean_temp": round(total / n, 2) if n else None,
                "flags": counts,
            }
        return summary


    if __name__ == "__main__":
        print(json.dumps(daily_summary(sys.argv[1]), indent=2))
    ```
