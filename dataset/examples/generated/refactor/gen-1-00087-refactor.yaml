id: gen-1-00087-refactor
category: refactor
language: go
patterns:
- regex-precompile
- keep-star-imports
messages:
- role: user
  content: "Instrument log summarizer for our spectrometer runs. Piped from `zcat`, files are a few million lines. Diff only\
    \ please.\n\n```go\npackage main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n\t\"regexp\"\n\t\"strconv\"\n\n\t. \"\
    math\"\n)\n\nfunc parseSample(line string) (t float64, v float64, ok bool) {\n\tskip := regexp.MustCompile(`^\\s*(#|$)`)\n\
    \tif skip.MatchString(line) {\n\t\treturn 0, 0, false\n\t}\n\tre := regexp.MustCompile(`^t=([0-9.]+)s\\s+ch3\\s+v=(-?[0-9.]+(?:[eE][-+]?[0-9]+)?)`)\n\
    \tm := re.FindStringSubmatch(line)\n\tif m == nil {\n\t\treturn 0, 0, false\n\t}\n\tt, _ = strconv.ParseFloat(m[1], 64)\n\
    \tv, _ = strconv.ParseFloat(m[2], 64)\n\treturn t, v, true\n}\n\nfunc main() {\n\tsc := bufio.NewScanner(os.Stdin)\n\t\
    var n int\n\tvar sum, sq float64\n\tfor sc.Scan() {\n\t\t_, v, ok := parseSample(sc.Text())\n\t\tif !ok || IsNaN(v) {\n\
    \t\t\tcontinue\n\t\t}\n\t\tn++\n\t\tsum += v\n\t\tsq += v * v\n\t}\n\tif n == 0 {\n\t\tfmt.Println(\"no samples\")\n\t\
    \treturn\n\t}\n\tmean := sum / float64(n)\n\tfmt.Printf(\"n=%d mean=%.6g rms=%.6g\\n\", n, mean, Sqrt(sq/float64(n)))\n\
    }\n```\n"
- role: assistant
  content: "```text\n@@ import (\n \t\"strconv\"\n\n \t. \"math\"\n )\n\n+var (\n+\tskipRe   = regexp.MustCompile(`^\\s*(#|$)`)\n\
    +\tsampleRe = regexp.MustCompile(`^t=([0-9.]+)s\\s+ch3\\s+v=(-?[0-9.]+(?:[eE][-+]?[0-9]+)?)`)\n+)\n+\n func parseSample(line\
    \ string) (t float64, v float64, ok bool) {\n-\tskip := regexp.MustCompile(`^\\s*(#|$)`)\n-\tif skip.MatchString(line)\
    \ {\n+\tif skipRe.MatchString(line) {\n \t\treturn 0, 0, false\n \t}\n-\tre := regexp.MustCompile(`^t=([0-9.]+)s\\s+ch3\\\
    s+v=(-?[0-9.]+(?:[eE][-+]?[0-9]+)?)`)\n-\tm := re.FindStringSubmatch(line)\n+\tm := sampleRe.FindStringSubmatch(line)\n\
    \ \tif m == nil {\n \t\treturn 0, 0, false\n \t}\n```\n\nOutput is identical. Nothing else changed.\n\n**Green Notes**\n\
    - **Compile regexes once** (reduces E): Go's `regexp` has no internal cache, so the old code parsed and compiled both\
    \ patterns on every line. That was two compiles per line, millions of times per file. Now it is two compiles per process.\
    \ Package-level `*regexp.Regexp` values are safe to share across goroutines, so this also works if you parallelize later.\n\
    - **Dot import of `math` left as is:** it is a style question, not an efficiency one, so I did not touch it.\n- **Not\
    \ applied:** swapping `skipRe` for `strings.TrimSpace` plus a `#` prefix check would save a little more per line. It is\
    \ a small gain next to the compile fix, so I kept the diff minimal.\n"
verify:
  static_only: Go toolchain not part of the verifier (stdlib only, but no Go runner)
