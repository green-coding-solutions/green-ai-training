id: gen-1-00220-refactor
category: refactor
language: sql
patterns:
- select-columns
facts:
- F-PG-SELECT
sql_dialect: postgres
messages:
- role: user
  content: |
    Chart endpoint for the spectrometer dashboard. Diff only please.

    ```sql
    -- :experiment_id, :since are bound params
    SELECT *
    FROM spectra s
    JOIN runs r ON r.id = s.run_id
    WHERE r.experiment_id = :experiment_id
      AND s.quality_flag = 'ok'
      AND s.taken_at >= :since
    ORDER BY s.taken_at;
    ```

    Frontend only reads taken_at, peak_wavelength_nm, intensity. spectra also has raw_spectrum (big JSON text, a few hundred KB per row) and fit_debug_json. runs has a notes text column.
- role: assistant
  content: |
    ```sql
    -- :experiment_id, :since are bound params
    SELECT s.taken_at,
           s.peak_wavelength_nm,
           s.intensity
    FROM spectra s
    JOIN runs r ON r.id = s.run_id
    WHERE r.experiment_id = :experiment_id
      AND s.quality_flag = 'ok'
      AND s.taken_at >= :since
    ORDER BY s.taken_at;
    ```

    **Green Notes**
    - **Named columns instead of `SELECT *`** (reduces E and network): the old query read and sent `raw_spectrum`, `fit_debug_json` and `runs.notes` for every row, and the client dropped them. Now only three small columns leave the database. In Green Metrics Tool micro-benchmarks on PostgreSQL, naming 10 of 52 columns instead of `SELECT *` used about 5.5× to 7× less CPU energy when the table had large text columns ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=b7203ffe-39ae-4e84-bf85-998c9389ea46,4702c2ee-13d5-4d70-bcfe-31e193104a8e)). Your saving depends on how big the skipped columns are, so measure it on your data.
    - **Side effect fixed:** `SELECT *` over a join returned `id` twice, once from `spectra` and once from `runs`. Some drivers keep only the last one. That no longer matters.
    - **Behavior:** the same rows in the same order. The result now has three columns instead of all of them. Any other consumer of this query that reads other columns will break, so check for those.
verify:
  static_only: Result columns intentionally differ (SELECT * vs named columns), so a row-for-row compare does not apply; schema
    is Postgres-style.
