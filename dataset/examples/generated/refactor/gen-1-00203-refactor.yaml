messages:
- role: user
  content: |
    hello, my inference service is using too much cpu and i dont know why. it save every prediction batch to disk for debuging and for retrain later, we keep files 1 week. i think the saving part is slow maybe? can you clean up and make it better

    ```python
    import json
    import lzma
    import os
    import time
    from pathlib import Path

    LOG_DIR = Path("/var/lib/inference/predictions")
    KEEP_DAYS = 7


    def save_batch(records, out_dir=LOG_DIR):
        out_dir = Path(out_dir)
        out_dir.mkdir(parents=True, exist_ok=True)
        ts = time.strftime("%Y%m%d-%H%M%S")
        path = out_dir / f"pred-{ts}-{os.getpid()}.jsonl.xz"
        with lzma.open(path, "wt", encoding="utf-8",
                       preset=9 | lzma.PRESET_EXTREME) as f:
            for r in records:
                f.write(json.dumps(r) + "\n")
        return path


    def load_batch(path):
        with lzma.open(path, "rt", encoding="utf-8") as f:
            return [json.loads(line) for line in f]


    def cleanup(out_dir=LOG_DIR, keep_days=KEEP_DAYS):
        cutoff = time.time() - keep_days * 86400
        for p in Path(out_dir).glob("pred-*.jsonl.xz"):
            if p.stat().st_mtime < cutoff:
                p.unlink()
    ```
- role: assistant
  content: |
    Yes, the saving part is a likely cause. The `xz` preset 9 with `PRESET_EXTREME` is the most expensive setting, and it runs on every batch in your serving process.

    ```python
    import gzip
    import json
    import lzma
    import os
    import time
    from pathlib import Path

    LOG_DIR = Path("/var/lib/inference/predictions")
    KEEP_DAYS = 7


    def save_batch(records, out_dir=LOG_DIR):
        out_dir = Path(out_dir)
        out_dir.mkdir(parents=True, exist_ok=True)
        ts = time.strftime("%Y%m%d-%H%M%S")
        path = out_dir / f"pred-{ts}-{os.getpid()}.jsonl.gz"
        with gzip.open(path, "wt", encoding="utf-8", compresslevel=6) as f:
            for r in records:
                f.write(json.dumps(r) + "\n")
        return path


    def load_batch(path):
        # old files written as .xz can still be read
        opener = lzma.open if str(path).endswith(".xz") else gzip.open
        with opener(path, "rt", encoding="utf-8") as f:
            return [json.loads(line) for line in f]


    def cleanup(out_dir=LOG_DIR, keep_days=KEEP_DAYS):
        cutoff = time.time() - keep_days * 86400
        for p in Path(out_dir).glob("pred-*.jsonl.*"):
            if p.stat().st_mtime < cutoff:
                p.unlink()
    ```

    **Green Notes**
    - **Fast codec for data you compress often** (reduces E): you compress a new file for every batch, so the codec cost is paid again and again. In Green Metrics Tool micro-benchmarks, compressing 100 MB of English text used about 458 J with xz, about 67 J with gzip and about 16 J with zstd (default levels) ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=2584305c-7a1e-47e2-b6cc-26276962035e,addc5f5e-55da-47f8-956d-240d06304e4e,fb08d3c3-ba41-4f0f-85fd-0b6c34e6c39b,f1479db0-c453-4aaa-9116-e137621fad07,7b3bb87d-3b43-4f82-be99-0327405205b8,905bd408-6b31-4237-a4da-14b8fad90613,7f213a20-8028-4080-9583-6e465c217bb5,8e93a8d2-60b0-4831-905b-764b68257bc7)). Decompression is cheap for all of them. These numbers compare energy, not file size. xz makes smaller files, so if disk space is your real limit, measure both.
    - **Why gzip here:** it is in the Python standard library, and `compresslevel=6` is the level that was measured. If you can add the `zstandard` package, zstd is cheaper again.
    - **Compatibility:** `load_batch` still reads old `.xz` files, and `cleanup` matches both extensions, so the old files expire normally after the switch.
    - Compression still makes sense here. The files stay on disk for a week, and JSON lines compress very well. I kept it and only made it cheaper.
    - To check the effect on your service, compare CPU time of the process with `perf stat` or `time` before and after.
verify:
  equivalence:
    driver: |
      import tempfile
      d = tempfile.mkdtemp()
      recs = [{"id": i, "label": "cat" if i % 2 else "dog", "score": round(i / 7, 4)} for i in range(50)]
      p = save_batch(recs, d)
      loaded = load_batch(p)
      print(loaded == recs)
      print(len(loaded))
      cleanup(d, 7)
      print(len(list(Path(d).iterdir())))
  test: |-
    import tempfile
    d = Path(tempfile.mkdtemp())
    recs = [{"id": 1, "x": "a"}, {"id": 2, "x": "b"}]
    legacy = d / "pred-20200101-000000-1.jsonl.xz"
    with lzma.open(legacy, "wt", encoding="utf-8") as f:
        for r in recs:
            f.write(json.dumps(r) + "\n")
    assert load_batch(legacy) == recs
    new = save_batch(recs, d)
    assert str(new).endswith(".gz")
    assert load_batch(new) == recs
    old = time.time() - 10 * 86400
    os.utime(legacy, (old, old))
    cleanup(d, 7)
    assert not legacy.exists()
    assert new.exists()
