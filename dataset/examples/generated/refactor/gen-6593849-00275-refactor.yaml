messages:
- role: user
  content: |
    Hi, I'm new to this. I set up a small gateway (Raspberry Pi) that collects data from the sensors in our greenhouse. It serves this status page on the local network and my phone loads it a lot. Someone said it feels heavy but I don't know what is wrong. Can you make it better?

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Greenhouse Gateway</title>
      <link rel="stylesheet" href="/static/status.css">
    </head>
    <body>
      <header>
        <img src="/static/logo.png" alt="Greenhouse Gateway" height="40">
        <h1>Greenhouse 2</h1>
      </header>

      <section id="sensors">
        <ul>
          <li><img src="/static/icons/temp.png" alt="" width="16" height="16"> Temperature: <span id="t">--</span></li>
          <li><img src="/static/icons/humidity.png" alt="" width="16" height="16"> Humidity: <span id="h">--</span></li>
          <li><img src="/static/icons/battery.png" alt="" width="16" height="16"> Battery: <span id="b">--</span></li>
        </ul>
      </section>

      <section id="camera">
        <h2>Last camera snapshot</h2>
        <img src="/snapshots/latest.png" alt="Greenhouse camera, latest snapshot" width="1280" height="720">
      </section>

      <section id="site">
        <h2>Where the sensors are</h2>
        <img src="/static/site-photo.png" alt="Photo of the greenhouse with sensor positions" width="1600" height="1000">
      </section>

      <script src="/static/status.js"></script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    The page is fine. The heavy part is that the two big pictures are photos saved as PNG. PNG is made for flat graphics, so photos in it are large and slower to decode on your phone.

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Greenhouse Gateway</title>
      <link rel="stylesheet" href="/static/status.css">
    </head>
    <body>
      <header>
        <img src="/static/logo.svg" alt="Greenhouse Gateway" height="40">
        <h1>Greenhouse 2</h1>
      </header>

      <section id="sensors">
        <ul>
          <li><img src="/static/icons/temp.svg" alt="" width="16" height="16"> Temperature: <span id="t">--</span></li>
          <li><img src="/static/icons/humidity.svg" alt="" width="16" height="16"> Humidity: <span id="h">--</span></li>
          <li><img src="/static/icons/battery.svg" alt="" width="16" height="16"> Battery: <span id="b">--</span></li>
        </ul>
      </section>

      <section id="camera">
        <h2>Last camera snapshot</h2>
        <img src="/snapshots/latest.jpg" alt="Greenhouse camera, latest snapshot" width="1280" height="720">
      </section>

      <section id="site">
        <h2>Where the sensors are</h2>
        <picture>
          <source srcset="/static/site-photo.webp" type="image/webp">
          <img src="/static/site-photo.jpg" alt="Photo of the greenhouse with sensor positions" width="1600" height="1000">
        </picture>
      </section>

      <script src="/static/status.js"></script>
    </body>
    </html>
    ```

    You also need to change the files, not only the HTML:
    - Make `logo.svg` and the three icon SVGs from the original artwork. If the logo is a flat drawing, SVG is the right format.
    - Save the camera snapshot as JPEG (`latest.jpg`) where the gateway writes it. Do this once per snapshot, not when the page is requested.
    - Convert `site-photo.png` to `site-photo.webp` and `site-photo.jpg` once, on your computer. It never changes.

    **Green Notes**
    - **Photos as JPEG or WebP, not PNG** (reduces E): in Green Metrics Tool micro-benchmarks, 50 page loads with a JPEG used about 134 J of browser CPU energy, WebP about 150 J and PNG about 181 J. Smaller files also mean fewer bytes to send from the Pi.
    - **JPEG for the snapshot** (reduces E): it is rewritten all the time, so encoding cost matters. In the same benchmarks, encoding 50 images cost about 89 J for JPEG and about 290 J for WebP. Encode it once when it is saved, never per request.
    - **SVG for logo and icons** (reduces network): 16×16 icons are tiny and flat. A vector file is smaller than a raster one and stays sharp on any screen.
    - *Not applied:* AVIF. Decoding it costs more phone CPU than JPEG, and encoding about 7× more in the benchmark. That is a bad fit for a small gateway, and on a local network the byte savings are small.
verify:
  static_only: HTML markup; image files are not part of the example
