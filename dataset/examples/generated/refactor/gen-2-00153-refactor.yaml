    driver: |-
      import random
      from types import SimpleNamespace as NS

      rng = random.Random(7)
      routes = ["/api/cart", "/api/search", "/login", "/static/app.js", "/unknown"]
      baselines = {
          "/api/cart": NS(mean_log=4.2, std_log=0.5),
          "/api/search": NS(mean_log=5.0, std_log=0.8),
          "/login": NS(mean_log=3.9, std_log=0.0),
          "/static/app.js": NS(mean_log=1.5, std_log=0.3),
      }
      cfg = NS(baselines=baselines, z_limit=2.0)
      rows = [(i, rng.choice(routes), rng.randint(1, 5000)) for i in range(20000)]
      hits = find_slow_requests(rows, cfg)
      print(len(hits))
      for h in hits[:20]:
          print(h)
      print(sum(h[2] for h in hits))
