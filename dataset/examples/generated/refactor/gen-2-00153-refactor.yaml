  test: |
    from types import SimpleNamespace as NS
    _cfg = NS(baselines={"/a": NS(mean_log=1.0, std_log=0.5)}, z_limit=1.0)
    _res = find_slow_requests([(1, "/a", 0), (2, "/a", 100), (3, "/b", 900)], _cfg)
    assert _res == [(2, "/a", 100, round((math.log(100) - 1.0) / 0.5, 2))], _res
