messages:
- role: user
  content: |
    ?

    ```sql
    -- gateway_ui: low battery list (device, site, battery, last seen)
    SELECT *
    FROM readings r
    JOIN devices d ON d.id = r.device_id
    WHERE r.battery_pct < 20
      AND r.recorded_at >= '2026-10-01 00:00:00'
    ORDER BY r.battery_pct ASC, r.recorded_at DESC
    LIMIT 50;
    ```
- role: assistant
  content: |
    ```sql
    -- gateway_ui: low battery list (device, site, battery, last seen)
    SELECT d.name, d.site, r.battery_pct, r.recorded_at
    FROM readings r
    JOIN devices d ON d.id = r.device_id
    WHERE r.battery_pct < 20
      AND r.recorded_at >= '2026-10-01 00:00:00'
    ORDER BY r.battery_pct ASC, r.recorded_at DESC
    LIMIT 50;
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E): the comment says the page shows device, site, battery and last seen, so the query now returns only those four columns. `SELECT *` also pulled every column of both tables, which on a gateway usually includes big ones like raw payloads and diagnostics. Each skipped column is data the database no longer reads, sends and parses. In Green Metrics Tool micro-benchmarks on PostgreSQL, reading 2,500 rows from a 52-column products table with large text columns, `SELECT *` used about 7× more energy than naming 10 columns (~470 J vs ~64 J, repeated 1,000 times). The saving grows with the size of the skipped columns. That was a different table, so treat it as direction, not as your number.

    The rows, filter, order and limit are the same. The result now has 4 columns, and the duplicate `id` columns from the join are gone. If the page also needs something else, such as `rssi`, add it to the list instead of going back to `*`.
