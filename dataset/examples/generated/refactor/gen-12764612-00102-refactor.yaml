- role: assistant
  content: |
    The page loads six TTF font files before it can show text in its final style. A phone on a mobile network waits for them. Here is a version with system fonts:

    ```html
    <!DOCTYPE html>
    <html lang="de">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kettenblatt 42T – Radhaus Berger</title>
      <style>
        :root {
          --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          --font-text: Georgia, "Times New Roman", serif;
        }

        body { margin: 0; font-family: var(--font-text); color: #222; line-height: 1.6; }
        header { background: #1d3b2f; color: #fff; padding: 12px 20px; }
        header a { color: #fff; font-family: var(--font-ui); font-weight: 600; text-decoration: none; }
        main { max-width: 760px; margin: 0 auto; padding: 20px; }
        h1 { font-family: var(--font-ui); font-weight: 700; font-size: 1.8rem; }
        .price { font-family: var(--font-ui); font-weight: 600; font-size: 1.5rem; }
        .buy { background: #c8432b; color: #fff; border: 0; padding: 12px 24px;
               font-family: var(--font-ui); font-weight: 600; font-size: 1rem; }
        .hero { width: 100%; height: auto; }
      </style>
    </head>
    <body>
      <header><a href="/">Radhaus Berger</a></header>
      <main>
        <img class="hero" src="/img/kettenblatt-42t.jpg" width="760" height="507" alt="Kettenblatt 42T, schwarz">
        <h1>Kettenblatt 42T, schwarz</h1>
        <p class="price">34,90 €</p>
        <p>Stabiles Kettenblatt aus Aluminium für 9- bis 11-fach Ketten. Lochkreis 110 mm.</p>
        <p><em>Lieferzeit 2–3 Werktage.</em> <strong>Auf Lager.</strong></p>
        <button class="buy" type="button">In den Warenkorb</button>
      </main>
    </body>
    </html>
    ```

    The layout and colors are unchanged. Only the letter shapes change: Montserrat and Lora become each device's own UI font and Georgia.

    **Green Notes**
    - **System font stack** (reduces E, network): the six `@font-face` rules and both font preloads are gone, so the browser downloads no font files. In Green Metrics Tool micro-benchmarks of 30 cold page loads, the system stack used about 26% less client CPU energy than six local TTF files, and about 16% less than two Latin-subset WOFF2 files.
    - **Fewer requests before first paint** (reduces network): the text is drawn right away, with no wait for font files and no switch from a fallback font.

    *Not applied:* WOFF2 subsets. If the brand needs Montserrat, keep only the weights you really use (probably 400 and 700) as Latin-subset WOFF2 files with `font-display: swap`. In the same benchmark this used about 12% less than the TTF set, but more than the system stack. Drop the italic, since `<em>` is used only once.
