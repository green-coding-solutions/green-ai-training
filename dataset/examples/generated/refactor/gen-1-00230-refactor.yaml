messages:
- role: user
  content: |
    Nightly report page for the mdsim regression run. The CSS was copied from an old dashboard template. Clean it up, diff only, no explanation needed.

    ```html
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>mdsim nightly - run 2291</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
      h1 { font-size: 1.4rem; }
      .navbar { display: flex; align-items: center; padding: .5rem 1rem; background: #1b2a41; }
      .navbar-brand { color: #fff; font-weight: 700; text-decoration: none; }
      .btn { display: inline-block; padding: .4rem .9rem; border: 0; border-radius: 4px; cursor: pointer; }
      .btn-primary { background: #2563eb; color: #fff; }
      .btn-primary:hover { background: #1d4ed8; }
      .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
      .modal.open { display: flex; }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); }
      .carousel { position: relative; overflow: hidden; }
      .carousel-item { display: none; }
      .carousel-item.active { display: block; }
      .badge { padding: .1rem .4rem; border-radius: 3px; font-size: .75rem; }
      .badge-ok { background: #d1fae5; color: #065f46; }
      .alert { padding: .8rem 1rem; border: 1px solid #f59e0b; background: #fffbeb; }
      table.results { border-collapse: collapse; width: 100%; }
      table.results th, table.results td { border-bottom: 1px solid #ddd; padding: .3rem .6rem; text-align: right; }
      table.results th:first-child, table.results td:first-child { text-align: left; }
      tr.fail td { background: #fde8e8; }
      .meta { color: #666; font-size: .9rem; }
      footer { margin-top: 2rem; font-size: .8rem; color: #888; }
    </style>
    </head>
    <body>
    <h1>mdsim nightly - run 2291</h1>
    <p class="meta">commit 9f3ac21, 2026-10-24 02:10 UTC, 64 cores</p>
    <table class="results">
      <tr><th>case</th><th>steps/s</th><th>energy drift</th><th>wall (s)</th></tr>
      <tr><td>lj-fluid-4k</td><td>18250</td><td>2.1e-6</td><td>54.8</td></tr>
      <tr><td>water-tip3p-12k</td><td>6120</td><td>8.4e-6</td><td>163.4</td></tr>
      <tr class="fail"><td>polymer-melt-30k</td><td>2210</td><td>3.9e-3</td><td>452.5</td></tr>
    </table>
    <footer>generated by mdsim-report 0.8</footer>
    </body>
    </html>
    ```
