    **Green Notes**
    - **Unused CSS removed** (reduces network, bytes only): the navbar, button, modal, carousel, badge and alert rules matched nothing in the markup. The page renders the same. The savings are fewer bytes per load and a shorter file to maintain.
    - **Expect no CPU change:** in Green Metrics Tool micro-benchmarks of cold page loads, purging a 16 KB stylesheet down to 0.75 KB gave about 2% less client energy, which is within noise. For a stylesheet this small, treat it as cleanup.
    - **Check generated classes:** I kept every selector used by the markup. If `mdsim-report` adds classes at render time (for example a warning row), keep those rules too.
verify:
