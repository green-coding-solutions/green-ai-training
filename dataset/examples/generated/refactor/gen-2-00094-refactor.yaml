id: gen-2-00094-refactor
category: refactor
language: bash
patterns:
- bash-builtins
- compress-stored
facts:
- F-BASH-SUBPROC
- F-COMPRESS-CODECS
messages:
- role: user
  content: |
    ?

    ```bash
    #!/bin/bash
    # pack-slow-traces.sh <index file> <threshold ms> <out dir>
    # On-call runs this several times a day. The index has ~30k lines:
    #   trace_id|service|duration_ms|bytes|path
    # Archives stay on the shared debug volume for 7 days.
    set -e

    INDEX=$1
    THRESHOLD=$2
    OUT=$3

    mkdir -p "$OUT"
    STAMP=$(date +%Y%m%d-%H%M)
    LIST="$OUT/slow-$STAMP.list"
    SUMMARY="$OUT/slow-$STAMP.summary"
    : > "$LIST"
    : > "$SUMMARY"

    count=0
    total=0
    while read line; do
        id=$(echo $line | cut -d'|' -f1)
        service=$(echo $line | cut -d'|' -f2)
        ms=$(echo $line | cut -d'|' -f3)
        bytes=$(echo $line | cut -d'|' -f4)
        path=$(echo $line | cut -d'|' -f5)
        if [ $ms -ge $THRESHOLD ]; then
            echo "$path" >> "$LIST"
            echo "$id $service ${ms}ms" >> "$SUMMARY"
            count=$(expr $count + 1)
            total=$(expr $total + $bytes)
        fi
    done < "$INDEX"

    echo "$count slow traces, $(expr $total / 1024) KiB raw"

    tar -cf - -T "$LIST" | xz -9 > "$OUT/slow-$STAMP.tar.xz"
    rm "$LIST"
    ```
- role: assistant
  content: |
    ```bash
    #!/bin/bash
    # pack-slow-traces.sh <index file> <threshold ms> <out dir>
    # On-call runs this several times a day. The index has ~30k lines:
    #   trace_id|service|duration_ms|bytes|path
    # Archives stay on the shared debug volume for 7 days.
    set -e

    INDEX=$1
    THRESHOLD=$2
    OUT=$3

    mkdir -p "$OUT"
    STAMP=$(date +%Y%m%d-%H%M)
    LIST="$OUT/slow-$STAMP.list"
    SUMMARY="$OUT/slow-$STAMP.summary"
    : > "$LIST"
    : > "$SUMMARY"

    # One pass: write the path list and summary, and count traces and bytes.
    read -r count total < <(
        awk -F'|' -v t="$THRESHOLD" -v list="$LIST" -v sum="$SUMMARY" -v unit='ms' '
            $3 >= t { print $5 > list; print $1, $2, $3 unit > sum; n++; b += $4 }
            END { printf "%.0f %.0f\n", n, b }
        ' "$INDEX"
    )

    echo "$count slow traces, $((total / 1024)) KiB raw"

    tar -cf - -T "$LIST" | zstd -q > "$OUT/slow-$STAMP.tar.zst"
    rm "$LIST"
    ```

    **Green Notes**
    - **One `awk` pass instead of `cut`/`expr` per line** (reduces E): the old loop started several processes for every line of the index: a subshell and a `cut` for each field, plus `expr` for each match. Now one process reads the whole file. In Green Metrics Tool micro-benchmarks on a 20,000-line log, one `awk` pass used over 1000× less CPU energy than a `while read` loop that ran `$(echo | cut)` and `$(expr)` for each field. The list, summary and count line come out the same as before.
    - **`zstd` instead of `xz -9`** (reduces E): the script builds a new archive several times a day, so the cost of compressing matters more than the final file size. In Green Metrics Tool measurements on 100 MB of text, xz at its default level used about 29× the energy of zstd at its default level, and `-9` is xz's most expensive preset. zstd is also cheaper to decompress when on-call opens the archive. The measurement compared energy, not file size. xz usually makes smaller files, so keep it only if the debug volume is close to full. Archives are now `.tar.zst`. Extract them with `tar --zstd -xf` or `zstd -dc file | tar -xf -`.
    - **Bugs fixed:** with `set -e`, `total=$(expr $total + $bytes)` stopped the script without a message whenever the running total was 0, for example when the first slow trace had 0 bytes. This happens because `expr` exits with status 1 when the result is 0. Also, `while read line` skipped the last line when the index had no trailing newline. Unquoted `echo $line` could expand `*` or `?` in paths, and `read` without `-r` dropped backslashes. awk reads each field exactly as written.
verify:
  static_only: bash script; needs a trace index, trace files and the zstd binary
