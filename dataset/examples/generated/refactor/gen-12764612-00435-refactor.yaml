    ```python
    import torch
    from preprocess import *
    from config import *

    model = load_model(MODEL_PATH)
    model.eval()


    @torch.no_grad()
    def classify_batch(paths):
        results = []
        for p in paths:
            img = load_image(p)
            x = normalize(img).unsqueeze(0)
            logits = model(x)
            probs = torch.softmax(logits, dim=1)
            conf, idx = probs.max(dim=1)
            results.append((p, LABELS[idx.item()], conf.item()))
        return results
    ```

    **Green Notes**
    - **`torch.no_grad()` for inference** (reduces E): without it, PyTorch records a gradient graph for every forward pass, which you never use here. The results are the same. In Green Metrics Tool micro-benchmarks, 100,000 PyTorch CPU inferences used about 14% less energy with it (~157 J vs ~135 J). Since `classify_batch` runs once per image, this is the change that matters.
    - *Not applied:* replacing `from preprocess import *` and `from config import *` with explicit imports. In Green Metrics Tool micro-benchmarks, star imports and namespace imports showed no measurable energy difference, so I left them as they are. Change them only if your team wants them for readability.
