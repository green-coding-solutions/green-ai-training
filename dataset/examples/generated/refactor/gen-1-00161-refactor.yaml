- role: assistant
  content: |
    ```python
    import logging
    import os
    import tarfile
    import time

    log = logging.getLogger("ci.artifacts")

    ARTIFACT_ROOT = "/var/ci/artifacts"
    KEEP_DAYS = 7


    def pack_build(build_id, out_dir):
        src = os.path.join(ARTIFACT_ROOT, build_id)
        dst = os.path.join(out_dir, f"{build_id}.tar.gz")
        with tarfile.open(dst, "w:gz", compresslevel=6) as tar:
            tar.add(src, arcname=build_id)
        log.info("packed %s", dst)
        return dst


    def prune(out_dir):
        now = time.time()
        for name in os.listdir(out_dir):
            path = os.path.join(out_dir, name)
            if now - os.path.getmtime(path) > KEEP_DAYS * 86400:
                os.remove(path)
                log.info("removed %s", path)
    ```

    **Green Notes**
    - **Fast codec instead of `xz` preset 9** (reduces E): this runs on every build, so the compression cost repeats for every build. In Green Metrics Tool micro-benchmarks (English text, default settings), compressing 100 MB used about 458 J with xz and about 67 J with gzip. Those numbers compare energy only, not file size. xz usually gives smaller files, and `preset=9` is even more expensive than the default used in that test.
    - **Why not drop compression:** the archives live for 7 days, so compressing still saves storage. Only the codec is cheaper.
    - **Behavior change:** the files are now named `.tar.gz`. Update anything that downloads or extracts `.tar.xz`. `tarfile.open(path, "r:*")` reads both formats, so old archives stay readable until `prune` removes them.
    - **Not applied:** if your artifacts are mostly already-compressed files (wheels, JARs, images, `.zip`), compression gains little with any codec. Then store them in a plain `.tar`. If you run Python 3.14 or later, zstd (`compression.zstd`) is an even cheaper option.
