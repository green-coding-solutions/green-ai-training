    hi, im new at this job and i make the landing page for our company with a small python script. my lead looked at it and said something is "not great" but did not say what. i dont know what is wrong. can you make it better?

    ```python
    from html import *

    def render_card(f):
        return '<div class="card"><h3>' + escape(f["title"]) + '</h3><p>' + escape(f["body"]) + '</p></div>'

    def build_page(features, testimonials):
        cards = ""
        for f in features:
            cards += render_card(f)

        quotes = ""
        for t in testimonials:
