- role: user
  content: |
    hi, this is the model card page for our landcover segmentation model, it is on our internal model hub. Most people open it, look the metrics and copy the usage snippet, only few scroll down to the example predictions. The css i copied from other project of us, many classes are not used anymore. can you clean it up and make the page more light? thx

    ```html
