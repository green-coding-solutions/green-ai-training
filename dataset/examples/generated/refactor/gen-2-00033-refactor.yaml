      <h2>Validation metrics</h2>
      <table class="metrics">
        <tr><th>Class</th><th>IoU</th><th>F1</th></tr>
        <tr><td>Water</td><td>0.931</td><td>0.964</td></tr>
        <tr><td>Forest</td><td>0.874</td><td>0.933</td></tr>
        <tr><td>Cropland</td><td>0.812</td><td>0.896</td></tr>
        <tr><td>Built-up</td><td>0.768</td><td>0.869</td></tr>
        <tr><td>Grassland</td><td>0.703</td><td>0.826</td></tr>
        <tr><td>Bare soil</td><td>0.655</td><td>0.792</td></tr>
        <tr><td>Wetland</td><td>0.598</td><td>0.748</td></tr>
      </table>

      <h2>Usage</h2>
      <pre><code>from landcover_seg import load_model

    model = load_model("landcover-seg-v3", device="cuda")
    mask = model.predict("tile.tif")</code></pre>

      <h2>Example predictions</h2>
      <div class="gallery">
        <figure><img src="img/pred_rhine_valley.png" width="1024" height="512" alt="Input tile and predicted mask, Rhine valley"><figcaption>Rhine valley: cropland and river</figcaption></figure>
        <figure><img src="img/pred_black_forest.png" width="1024" height="512" alt="Input tile and predicted mask, Black Forest"><figcaption>Black Forest: dense forest, small villages</figcaption></figure>
        <figure><img src="img/pred_berlin.png" width="1024" height="512" alt="Input tile and predicted mask, Berlin"><figcaption>Berlin: built-up with parks</figcaption></figure>
        <figure><img src="img/pred_wadden_sea.png" width="1024" height="512" alt="Input tile and predicted mask, Wadden Sea"><figcaption>Wadden Sea: wetland and tidal flats</figcaption></figure>
        <figure><img src="img/pred_lusatia.png" width="1024" height="512" alt="Input tile and predicted mask, Lusatia"><figcaption>Lusatia: open-pit mine, bare soil</figcaption></figure>
        <figure><img src="img/pred_alps.png" width="1024" height="512" alt="Input tile and predicted mask, Alps"><figcaption>Alps: grassland, forest and snow</figcaption></figure>
