    **Green Notes**
    - **Lazy-load the example predictions** (reduces E and network): the gallery comes after the metrics and the usage snippet, and most of your readers stop before it. Now the browser fetches and decodes these PNGs only when a reader scrolls near them. In Green Metrics Tool page-load benchmarks, an article with 15 photos used about 12% less CPU energy with `loading="lazy"` below the fold when visitors did not scroll. When visitors scrolled to the end, the difference was about 1%, which is noise. So the saving comes from the readers who stop at the usage section, and your page has many of them.
    - **Architecture diagram stays eager:** it is above the fold, and lazy loading it would only make it show up later. Your existing `width`/`height` attributes already keep the layout stable while the lazy images load.
    - **Removed unused CSS** (reduces network): the navbar, button, carousel, modal, pricing, footer-links and badge rules matched nothing on the page. The page has no scripts, so no class gets added at runtime. This saves bytes, not measurable client CPU. In the same benchmarks, purging a 16 KB stylesheet that was mostly unused changed client energy by about 2%, which is within noise. The bigger gain here is a shorter stylesheet that is easier to maintain.

    The page looks the same as before. The only change is that the gallery images load when a reader scrolls to them.
