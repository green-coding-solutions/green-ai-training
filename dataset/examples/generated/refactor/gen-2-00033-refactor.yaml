      .pricing-card h3 { font-size: 1.4rem; }
      .hero img { width: 100%; height: auto; }
      table.metrics { border-collapse: collapse; width: 100%; }
      table.metrics th, table.metrics td { border-bottom: 1px solid #e3e6ea; padding: 6px 10px; text-align: right; }
      table.metrics th:first-child, table.metrics td:first-child { text-align: left; }
      pre { background: #f4f6f8; padding: 12px; overflow-x: auto; }
      .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
