- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Northside Roasters</title>
      <style>
        body { margin: 0; font-family: Georgia, serif; color: #2b2118; background: #faf6f0; }
        header { padding: 24px; text-align: center; }
        header h1 { margin: 0; font-size: 2rem; letter-spacing: 0.05em; }
        .hero img { width: 100%; height: auto; display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; padding: 24px; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
        .card img { width: 100%; height: auto; display: block; }
        .card p { padding: 0 16px 16px; }
        .btn { display: inline-block; padding: 10px 20px; background: #6b3f1d; color: #fff; text-decoration: none; border-radius: 4px; }
        footer { text-align: center; padding: 24px; font-size: .9rem; }
      </style>
    </head>
    <body>
      <header>
        <h1>Northside Roasters</h1>
      </header>

      <section class="hero">
        <picture>
          <source srcset="img/hero.avif" type="image/avif">
          <source srcset="img/hero.webp" type="image/webp">
          <img src="img/hero.jpg" alt="Fresh roasted beans in a copper cooling tray" width="1600" height="800">
        </picture>
      </section>

      <section class="grid">
        <article class="card">
          <picture>
            <source srcset="img/beans.avif" type="image/avif">
            <source srcset="img/beans.webp" type="image/webp">
            <img src="img/beans.jpg" alt="Single-origin beans" width="600" height="400">
          </picture>
          <p>Single-origin beans, roasted every Tuesday.</p>
        </article>
        <article class="card">
          <picture>
            <source srcset="img/roaster.avif" type="image/avif">
            <source srcset="img/roaster.webp" type="image/webp">
            <img src="img/roaster.jpg" alt="Our 15 kg drum roaster" width="600" height="400">
          </picture>
          <p>Small batches on our 15 kg drum roaster.</p>
        </article>
        <article class="card">
          <picture>
            <source srcset="img/shop.avif" type="image/avif">
            <source srcset="img/shop.webp" type="image/webp">
            <img src="img/shop.jpg" alt="The shop front on Elm Street" width="600" height="400">
          </picture>
          <p>Visit us on Elm Street. Open daily from 8 to 17.</p>
        </article>
      </section>

      <p style="text-align:center"><a class="btn" href="/order">Order beans</a></p>

      <footer>&copy; 2026 Northside Roasters</footer>
    </body>
    </html>
    ```

    You need to create the `.avif`, `.webp` and `.jpg` files from your PNGs. Do this once, at build or upload time, not when the page is requested. The browser takes the first format it supports, and old browsers fall back to the JPG.

    **Green Notes**
    - **Photos as AVIF/WebP/JPEG instead of PNG** (reduces network, client E): PNG is a lossless format and is a poor fit for photos. Files are much smaller as lossy AVIF, WebP or JPEG. In Green Metrics Tool micro-benchmarks (50 page loads in a browser) PNG used the most client CPU energy (~181 J), JPG the least (~134 J) and AVIF ~159 J, about 19% more than JPG. So the saving from AVIF comes from the fewer bytes sent, not from cheaper decoding. Encoding is the expensive part: AVIF encoding cost about 7× JPG in the same measurements. That is why it belongs in the build step, never per request.
    - **Unused CSS removed** (reduces network bytes only): I deleted the carousel, modal, popup, sale badge, price table and extra button rules, because nothing in this page uses them. For a stylesheet this small, the measured client energy difference was within noise (about 2% in Green Metrics Tool micro-benchmarks). It saves a few bytes, not measurable CPU. Check that no other page or script adds those classes before you delete them for good.
    - **Behavior change:** AVIF, WebP and JPG are lossy. Check the hero and card images by eye. If one needs exact pixels, keep it as PNG.
    - **Layout kept:** the `width` and `height` attributes stay on the `<img>` tags, so the page does not jump while the images load.
verify:
  static_only: HTML page with picture elements, needs image files and a browser
