    driver: |-
      import hashlib
      import random
      rng = random.Random(42)
      symbols = ["O", "H", "H"] * 20
      frames = []
      for step in range(0, 500, 10):
          frames.append({
              "step": step,
              "energy": -76.4 + rng.random() * 0.01,
              "positions": [
                  (rng.uniform(-5, 40), rng.uniform(-5, 40), rng.uniform(-5, 40))
                  for _ in symbols
              ],
          })
      box = (35.0, 35.0, 35.0)
      for wrap in (True, False):
          s = trajectory_to_xyz(frames, symbols, box, 0.5, wrap=wrap)
          print(type(s).__name__, len(s), hashlib.sha256(s.encode()).hexdigest())
      print(trajectory_to_xyz(frames[:1], symbols[:3], box, 0.5).splitlines())
      print(repr(trajectory_to_xyz([], symbols, box, 0.5)))
