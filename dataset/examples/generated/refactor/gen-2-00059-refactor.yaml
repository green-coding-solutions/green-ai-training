  test: |
    import os, tempfile
    _syms = ["O", "H", "H"]
    _frames = [
        {"step": s, "energy": -17.2 - s * 1e-4,
         "positions": [(1.0 + s, 2.0, 3.0), (70.0, -1.5, 0.2), (0.1, 0.2, -80.0)]}
        for s in range(4)
    ]
    _txt = trajectory_to_xyz(_frames, _syms, (30.0, 30.0, 30.0), 0.5)
    assert isinstance(_txt, str)
    _lines = _txt.splitlines()
    assert len(_lines) == 4 * (3 + 2)
    assert _lines[0] == "3"
    assert _lines[1].startswith('Lattice="15.875316')
    assert "time=0.0000" in _lines[1]
    _d = tempfile.mkdtemp()
    _p = os.path.join(_d, "t.xyz")
    write_xyz(_p, _frames, _syms, (30.0, 30.0, 30.0), 0.5, wrap=False)
    with open(_p) as _fh:
        assert _fh.read() == trajectory_to_xyz(_frames, _syms, (30.0, 30.0, 30.0), 0.5, wrap=False)
    assert trajectory_to_xyz([], _syms, (30.0, 30.0, 30.0), 0.5) == ""
