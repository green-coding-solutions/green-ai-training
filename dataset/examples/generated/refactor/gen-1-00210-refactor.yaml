    ```python
    import sys
    import json
    import zlib
    import torch
    import torch.nn as nn

    LABELS = ["billing", "bug", "feature_request", "account", "other"]
    VOCAB = 20000


    class TicketClassifier(nn.Module):
        def __init__(self, vocab_size, n_classes, dim=64):
            super().__init__()
            self.emb = nn.EmbeddingBag(vocab_size, dim)
            self.drop = nn.Dropout(0.3)
            self.fc = nn.Linear(dim, n_classes)

        def forward(self, ids, offsets):
            return self.fc(self.drop(self.emb(ids, offsets)))


    def tokenize(text):
        words = text.lower().split()
        return [zlib.crc32(w.encode()) % VOCAB for w in words] or [0]


    def load_model(path):
        model = TicketClassifier(VOCAB, len(LABELS))
        model.load_state_dict(torch.load(path))
        model.eval()
        return model


    @torch.inference_mode()
    def classify(model, texts):
        results = []
        offsets = torch.tensor([0])
        for text in texts:
            ids = torch.tensor(tokenize(text))
            logits = model(ids, offsets)
            probs = torch.softmax(logits, dim=1)
            score, idx = probs.max(dim=1)
            results.append({
                "text": text[:40],
                "label": LABELS[int(idx)],
                "score": round(float(score), 3),
            })
        return results


    if __name__ == "__main__":
        model = load_model(sys.argv[1])
        with open(sys.argv[2]) as f:
            texts = [line.strip() for line in f if line.strip()]
        print(json.dumps(classify(model, texts), indent=2))
    ```

    **Green Notes**
    - **`@torch.inference_mode()` on `classify`** (reduces E): the old code built an autograd graph for every ticket and then threw it away. Inference never calls `backward()`, so that work is wasted. In Green Metrics Tool micro-benchmarks, 100,000 PyTorch CPU inferences used about 14% less CPU energy with `torch.no_grad()` than without ([measurements](https://metrics.green-coding.io/compare-simple.html?ids=42de8e68-4536-43f4-a9bd-427ec42affd1,7e6a3886-425a-4992-9f14-180bede2d841)). The gain depends on the model. It is smaller for a tiny model like this one and larger for deeper ones. `inference_mode` is the stricter form of `no_grad`. It is safe here because only plain Python floats leave the function.
    - **Bug fix, `model.eval()` added in `load_model`:** the model was never switched to eval mode, so `Dropout(0.3)` was still active. The same ticket could get different labels on different runs. Scores will now be stable, and they may differ slightly from your old output. The old output was noise.
    - **Small cleanups:** `offsets` is created once instead of per ticket. `probs.max(dim=1)` gives the score and the label index in one call, instead of running `argmax` and `max` separately.
    - Not changed: the model still scores one ticket at a time. That keeps the output identical and the code simple.
