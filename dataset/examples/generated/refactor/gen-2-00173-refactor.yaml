      tpl += "".join(f"<p>{{{{ sec{i}.label }}}}</p><span>{{{{sec{i}.label}}}}</span>\n" for i in range(0, 800, 7))
      tpl += "<a>{{ cta-primary }}</a>{{ missing.key }}<!--\nmulti\nline\n-->{{  hero.dots  }}"
      for page in ["en/index.html", "de/pricing.html"]:
          s = {**strings, "hero.dots": hero_dots(page, count=500)}
          html = strip_comments(fill(tpl, s))
          print(page, len(html), hashlib.sha256(html.encode()).hexdigest())
          print(html[:300])
      print(hero_dots("fr/index.html", count=5))
