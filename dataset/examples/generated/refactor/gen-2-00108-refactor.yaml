messages:
- role: user
  content: |
    strip the dead css out of this, snapcheck's report.html only uses the header, the summary cards and the results table now

    ```css
    /* snapcheck report theme - copied from the old dashboard */
    :root {
      --fg: #1f2328;
      --muted: #656d76;
      --ok: #1a7f37;
      --warn: #9a6700;
      --fail: #cf222e;
      --border: #d0d7de;
      --accent: #0969da;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
    }

    header { padding: 16px 24px; border-bottom: 1px solid var(--border); }
    header h1 { margin: 0; font-size: 20px; }
    header .meta { color: var(--muted); font-size: 12px; }

    .navbar { display: flex; gap: 12px; padding: 8px 24px; background: #f6f8fa; }
    .navbar a { color: var(--accent); text-decoration: none; }
    .navbar a.active { font-weight: 600; }

    .dropdown { position: relative; }
    .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; min-width: 160px; background: #fff; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(140, 149, 159, .2); }
    .dropdown:hover .dropdown-menu { display: block; }

    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 24px; }
    .card { border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
    .card .value { font-size: 24px; font-weight: 600; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); }
    .modal { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 480px; background: #fff; border-radius: 6px; padding: 24px; }

    .btn { display: inline-block; padding: 5px 16px; border: 1px solid var(--border); border-radius: 6px; background: #f6f8fa; cursor: pointer; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

    table.results { width: calc(100% - 48px); margin: 0 24px 24px; border-collapse: collapse; }
    table.results th, table.results td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    table.results th { color: var(--muted); font-weight: 600; }
    table.results td.num { text-align: right; font-variant-numeric: tabular-nums; }

    .status-ok { color: var(--ok); }
    .status-warn { color: var(--warn); }
    .status-fail { color: var(--fail); font-weight: 600; }

    .tooltip { position: absolute; padding: 4px 8px; background: #24292f; color: #fff; font-size: 12px; border-radius: 4px; }

    @media print {
      .navbar, .btn { display: none; }
    }
    ```
