    **Green Notes**
    - **Remove unused CSS** (reduces network, slightly): I removed the navbar, dropdown, modal, button and tooltip rules. I also removed the `@media print` block, because it only hid those elements, and `--accent`, because only the removed rules used it. This is mainly a maintenance cleanup. In Green Metrics Tool page-load benchmarks, cutting a 16 KB stylesheet with mostly unused rules down to 0.75 KB changed client CPU energy by only about 2%, which is within measurement noise. What it saves is bytes. `report.html` is usually opened from disk, so even that saving is small.
    - *Not applied:* PurgeCSS or another build step. This is a small stylesheet you edit by hand inside a CLI. Deleting the rules once is enough, and a purge tool would only add a dependency.

    The header, summary cards and results table look exactly as before. I kept `header .meta`, `.card .value` and `td.num`, assuming the template still uses them. If the template still has a stray `class="btn"` or `navbar` somewhere, that element now shows without styling.
verify:
  static_only: CSS stylesheet, nothing to execute; rules kept for header, .summary/.card and table.results are unchanged
