messages:
- role: user
  content: |
    fix this

    ```python
    from numpy import *
    import asyncio
    import sqlite3
    import json
    import sys

    LABELS = ["cat", "dog", "bird"]


    def softmax(logits):
        z = logits - max(logits)
        e = exp(z)
        return e / sum(e)


    def predict(logits_batch):
        out = []
        for logits in logits_batch:
            p = softmax(array(logits))
            i = int(argmax(p))
            out.append({"label": LABELS[i], "score": round(float(p[i]), 4)})
        return out


    if __name__ == "__main__":
        batch = json.load(sys.stdin)
        print(json.dumps(predict(batch)))
    ```
- role: assistant
  content: |
    ```python
    from numpy import *
    import json
    import sys

    LABELS = ["cat", "dog", "bird"]


    def softmax(logits):
        z = logits - max(logits)
        e = exp(z)
        return e / sum(e)


    def predict(logits_batch):
        out = []
        for logits in logits_batch:
            p = softmax(array(logits))
            i = int(argmax(p))
            out.append({"label": LABELS[i], "score": round(float(p[i]), 4)})
        return out


    if __name__ == "__main__":
        batch = json.load(sys.stdin)
        print(json.dumps(predict(batch)))
    ```

    **Green Notes**
    - **Unused imports removed** (reduces E): `asyncio` and `sqlite3` were never used. Each one is loaded on every process start for nothing. Loading modules is what costs energy at startup. In Green Metrics Tool micro-benchmarks, a start that imported `sympy` used about 25× the energy of a start that imported only a built-in module.
    - **Star import left as is** (no change): `from numpy import *` looks like the problem, but changing it saves nothing. In the same benchmarks, 1,000 process starts with `from sympy import *` used ~3103 J and with `import sympy` ~3093 J. That is no measurable difference. The module is loaded either way.

    The output is the same. If you ever want `max`, `sum` and `round` to be the built-ins again, that is a naming question, not an energy one.
verify:
  test: |
    r = predict([[1.0, 2.0, 3.0], [3.0, 0.5, 0.1]])
    assert [x["label"] for x in r] == ["bird", "cat"]
    assert all(0 < x["score"] <= 1 for x in r)
    assert "asyncio" not in globals() and "sqlite3" not in globals()
  module: true
  equivalence:
