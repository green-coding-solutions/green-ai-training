id: gen-1-00193-refactor
category: refactor
language: dockerfile
patterns:
- small-container-images
messages:
- role: user
  content: |
    Dockerfile for our log forwarder (Rust, tails files and ships to the collector over TLS). Image is huge and every code change rebuilds all crates. Diff only please.

    ```dockerfile
    FROM rust:1.82
    RUN apt-get update && apt-get install -y pkg-config libssl-dev curl vim
    WORKDIR /app
    COPY . .
    RUN cargo build --release
    ENV RUST_LOG=info
    EXPOSE 9000
    CMD ["./target/release/logship"]
    ```
- role: assistant
  content: |
    ```diff
    -FROM rust:1.82
    -RUN apt-get update && apt-get install -y pkg-config libssl-dev curl vim
    -WORKDIR /app
    -COPY . .
    -RUN cargo build --release
    -ENV RUST_LOG=info
    -EXPOSE 9000
    -CMD ["./target/release/logship"]
    +FROM rust:1.82-bookworm AS build
    +RUN apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev \
    + && rm -rf /var/lib/apt/lists/*
    +WORKDIR /app
    +COPY Cargo.toml Cargo.lock ./
    +RUN mkdir src && echo 'fn main() {}' > src/main.rs \
    + && cargo build --release && rm -rf src
    +COPY src ./src
    +RUN touch src/main.rs && cargo build --release
    +
    +FROM debian:bookworm-slim
    +RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates libssl3 \
    + && rm -rf /var/lib/apt/lists/* \
    + && useradd --system --no-create-home logship
    +COPY --from=build /app/target/release/logship /usr/local/bin/logship
    +ENV RUST_LOG=info
    +USER logship
    +EXPOSE 9000
    +CMD ["logship"]
    ```

    New file `.dockerignore`:

    ```diff
    +target
    +.git
    ```

    **Green Notes**
    - **Multi-stage build** (reduces M, network): the Rust toolchain, `libssl-dev`, `vim` and `curl` no longer ship in the final image. Every node that pulls the image now stores and transfers only the runtime base and one binary.
    - **Dependency layer** (reduces E): `Cargo.toml` and `Cargo.lock` are built first against a stub `main.rs`. A change in `src/` now rebuilds only your crate, not all dependencies. The `touch` makes sure cargo rebuilds the real sources.
    - **`.dockerignore`** (reduces E): a local `target/` and `.git` no longer go into the build context, and they no longer invalidate the `COPY` layer.
    - **`--no-install-recommends` and list cleanup** keep the apt layers small.
    - **Behavior changes:** the container now runs as a non-root user, so mounted log directories must be readable by it. `curl` is gone, so a `HEALTHCHECK` or probe that uses it needs another way, for example a built-in health endpoint. The binary name `logship` is taken from your old `CMD`.
verify:
  static_only: Dockerfile build needs Docker and network access
