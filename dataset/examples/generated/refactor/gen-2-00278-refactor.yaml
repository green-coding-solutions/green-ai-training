- role: assistant
  content: |
    The screenshots are converted to AVIF by the artifact API on every page view. Do that conversion once in the pipeline, link the static files, and keep the PNG as a fallback:

    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Run #8812 · visual checks</title>
      <link rel="stylesheet" href="/static/report.css">
    </head>
    <body>
      <header class="run">
        <h1>Run #8812 · release/4.12</h1>
        <p class="meta">commit 3f9c2e1 · triggered by merge · <span class="ok">passed</span></p>
      </header>

      <main>
        <section class="env" id="staging">
          <h2>staging</h2>
          <div class="shots">
            <figure>
              <picture>
                <source srcset="/api/runs/8812/artifacts/staging/login.avif" type="image/avif">
                <img src="/api/runs/8812/artifacts/staging/login.png" width="1440" height="900" alt="Login page on staging">
              </picture>
              <figcaption>login</figcaption>
            </figure>
            <figure>
              <picture>
                <source srcset="/api/runs/8812/artifacts/staging/dashboard.avif" type="image/avif">
                <img src="/api/runs/8812/artifacts/staging/dashboard.png" width="1440" height="900" alt="Dashboard on staging">
              </picture>
              <figcaption>dashboard</figcaption>
            </figure>
            <figure>
              <picture>
                <source srcset="/api/runs/8812/artifacts/staging/billing.avif" type="image/avif">
                <img src="/api/runs/8812/artifacts/staging/billing.png" width="1440" height="900" alt="Billing page on staging">
              </picture>
              <figcaption>billing</figcaption>
            </figure>
          </div>
        </section>

        <section class="env" id="canary">
          <h2>canary</h2>
          <div class="shots">
            <figure>
              <picture>
                <source srcset="/api/runs/8812/artifacts/canary/login.avif" type="image/avif">
                <img src="/api/runs/8812/artifacts/canary/login.png" width="1440" height="900" alt="Login page on canary">
              </picture>
              <figcaption>login</figcaption>
            </figure>
            <figure>
              <picture>
                <source srcset="/api/runs/8812/artifacts/canary/dashboard.avif" type="image/avif">
                <img src="/api/runs/8812/artifacts/canary/dashboard.png" width="1440" height="900" alt="Dashboard on canary">
              </picture>
              <figcaption>dashboard</figcaption>
            </figure>
            <figure>
              <picture>
                <source srcset="/api/runs/8812/artifacts/canary/billing.avif" type="image/avif">
                <img src="/api/runs/8812/artifacts/canary/billing.png" width="1440" height="900" alt="Billing page on canary">
              </picture>
              <figcaption>billing</figcaption>
            </figure>
          </div>
        </section>
      </main>

      <footer>Generated by ci-report 2.3 · <a href="/runs/8812">back to run</a></footer>
    </body>
    </html>
    ```

    This needs one extra step in the job that takes the screenshots. It writes `login.avif` next to `login.png`, using `avifenc` or whatever library the artifact API uses now, with the same quality setting. Then it uploads both files.

    **Green Notes**
    - **Encode once per run, not per view** (reduces E): with the `?as=avif` query, the API re-encodes all six PNGs every time someone opens the page, unless it caches the results. AVIF encoding is expensive. In Green Metrics Tool micro-benchmarks, encoding 50 images cost ~658 J for AVIF vs ~89 J for JPG, about 7× more. Doing it once in the pipeline makes that cost independent of how often the report is opened.
    - **Fallback fixed** (bug): the old markup sent AVIF to every browser. A browser without AVIF support showed six broken images. `<picture>` now falls back to the original PNG, which the pipeline already produces, so it needs no extra encoding.
    - **The gain is bytes, not client CPU** (reduces network): in the same benchmarks, decoding AVIF cost about 19% more CPU than JPG over 50 page loads (~159 J vs ~134 J). Smaller transfers are what make AVIF worth it for full-size screenshots.
    - *Not applied:* a WebP `<source>`. It would be a second encode for every screenshot on every run. Current browsers handle AVIF, and the PNG covers the rest.
