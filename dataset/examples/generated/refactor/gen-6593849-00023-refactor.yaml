    ```

    **Green Notes**
    - **Single quotes for literals without expansion** (reduces E): the three HTML strings in the loop contain no `$`, backticks or backslashes, so they are now single-quoted. Bash no longer scans them on every order, and the `\"` escapes are gone because plain `"` is allowed inside single quotes. In Green Metrics Tool micro-benchmarks, assigning a 6,200-character literal in a loop used about 24% less CPU energy with single quotes than with double quotes. Your strings are much shorter and the file writes dominate, so expect a small absolute saving. It grows with the number of orders.
    - *Not changed:* `"${1:-orders.tsv}"`, `"$out_dir"`, `"$head"` and the `echo` line need expansion, so they keep double quotes. `$'\t'` is needed for the tab.

    The generated files are byte-for-byte the same as before.
verify:
  static_only: bash script that writes files per input line; output is identical by construction (only quoting changed)
