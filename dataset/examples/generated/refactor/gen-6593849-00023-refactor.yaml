messages:
- role: user
  content: |
    ?

    ```bash
    #!/usr/bin/env bash
    # builds one order confirmation mail per line of orders.tsv
    set -euo pipefail

    in_file="${1:-orders.tsv}"
    out_dir="${2:-./mails}"
    mkdir -p "$out_dir"

    while IFS=$'\t' read -r order_id name total; do
      head="<html><head><meta charset=\"utf-8\"><style>body{font-family:Arial,sans-serif;color:#333}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body>"
      intro="<h1>Thanks for your order</h1>"
      foot="<p>Questions? Reply to this mail or visit our help center.</p></body></html>"
      {
        printf '%s\n' "$head"
        printf '%s\n' "$intro"
        printf '<p>Hi %s, your order %s (total %s EUR) is confirmed.</p>\n' "$name" "$order_id" "$total"
        printf '%s\n' "$foot"
      } > "$out_dir/$order_id.html"
    done < "$in_file"

    echo "Wrote mails to $out_dir"
    ```
- role: assistant
  content: |
    ```bash
    #!/usr/bin/env bash
    # builds one order confirmation mail per line of orders.tsv
    set -euo pipefail

    in_file="${1:-orders.tsv}"
    out_dir="${2:-./mails}"
    mkdir -p "$out_dir"

    while IFS=$'\t' read -r order_id name total; do
      head='<html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;color:#333}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px}</style></head><body>'
      intro='<h1>Thanks for your order</h1>'
      foot='<p>Questions? Reply to this mail or visit our help center.</p></body></html>'
      {
        printf '%s\n' "$head"
        printf '%s\n' "$intro"
        printf '<p>Hi %s, your order %s (total %s EUR) is confirmed.</p>\n' "$name" "$order_id" "$total"
        printf '%s\n' "$foot"
      } > "$out_dir/$order_id.html"
    done < "$in_file"

