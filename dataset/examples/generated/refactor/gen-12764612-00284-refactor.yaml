    **Green Notes**
    - **Unused CSS removed** (reduces network): I deleted the rules that no element uses: `.navbar-dark`, `.hero-banner`, `.carousel` and `.carousel-item`, `.btn-secondary`, `.btn-danger`, `.alert` and its variants, and `.badge`. They look like leftovers from a template. The page looks the same.
    - **Rules kept on purpose:** `.modal.is-open` and `.out-of-stock .btn-primary` do not appear in the markup. The script adds those classes later, so they are in use.
    - **Expect bytes, not CPU:** this stylesheet is small. In Green Metrics Tool micro-benchmarks, purging a 16 KB stylesheet down to 0.75 KB changed client energy by about 2% (~783 J vs ~764 J), which is within noise. The gain is fewer bytes on real networks, so don't expect a visible energy change from this edit.

    If you reuse this CSS on other pages, check them for those classes before you delete anything from a shared file.
