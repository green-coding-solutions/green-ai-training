messages:
- role: user
  content: |
    fix this

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linen Shirt – Nordhaus</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; color: #222; }
      a { color: #0a5; text-decoration: none; }
      .container { max-width: 960px; margin: 0 auto; padding: 0 16px; }
      .navbar { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
      .navbar-dark { background: #222; color: #fff; }
      .nav-link { margin-left: 16px; }
      .hero-banner { height: 300px; background: #f4f1ec; }
      .carousel { position: relative; overflow: hidden; }
      .carousel-item { display: none; }
      .carousel-item.active { display: block; }
      .product { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0; }
      .product img { width: 100%; height: auto; }
      .price { font-size: 1.6rem; font-weight: bold; }
      .price-old { text-decoration: line-through; color: #888; }
      .btn { display: inline-block; padding: 10px 20px; border: 0; border-radius: 4px; background: #ddd; cursor: pointer; }
      .btn-primary { background: #0a5; color: #fff; }
      .btn-secondary { background: #eee; }
      .btn-danger { background: #c33; color: #fff; }
      .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
      .modal.is-open { display: flex; }
      .modal-box { background: #fff; padding: 24px; max-width: 420px; }
      .alert { padding: 12px; border-radius: 4px; }
      .alert-success { background: #dfd; }
      .alert-error { background: #fdd; }
      .badge { padding: 2px 8px; border-radius: 10px; background: #c33; color: #fff; font-size: .8rem; }
      .table { width: 100%; border-collapse: collapse; margin-top: 24px; }
      .table td { padding: 8px; border-bottom: 1px solid #eee; }
      .out-of-stock .btn-primary { background: #aaa; pointer-events: none; }
      .footer { padding: 24px 0; color: #666; }
    </style>
    </head>
    <body>
    <header class="container navbar">
      <a href="/">Nordhaus</a>
      <nav>
        <a class="nav-link" href="/women">Women</a>
        <a class="nav-link" href="/men">Men</a>
        <a class="nav-link" href="/cart">Cart</a>
      </nav>
    </header>
    <main class="container">
      <section class="product" id="product" data-stock="12">
        <img src="/img/linen-shirt-sand.jpg" alt="Linen shirt in sand" width="600" height="750">
        <div>
          <h1>Linen Shirt</h1>
          <p><span class="price">€59</span> <span class="price-old">€79</span></p>
          <p>Relaxed fit, 100% European linen.</p>
          <button class="btn btn-primary" id="add">Add to cart</button>
          <button class="btn" id="size-guide">Size guide</button>
          <table class="table">
            <tr><td>Material</td><td>100% linen</td></tr>
            <tr><td>Care</td><td>Machine wash 30°C</td></tr>
          </table>
        </div>
      </section>
    </main>
    <div class="modal" id="size-modal">
      <div class="modal-box">
        <p>S: 36-38 · M: 40-42 · L: 44-46</p>
        <button class="btn" id="size-close">Close</button>
      </div>
    </div>
    <footer class="container footer">© Nordhaus</footer>
    <script>
      const product = document.getElementById('product');
      const modal = document.getElementById('size-modal');
      if (Number(product.dataset.stock) === 0) product.classList.add('out-of-stock');
      document.getElementById('size-guide').onclick = () => modal.classList.add('is-open');
      document.getElementById('size-close').onclick = () => modal.classList.remove('is-open');
    </script>
    </body>
    </html>
    ```
