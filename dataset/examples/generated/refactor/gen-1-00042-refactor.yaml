- role: user
  content: |
    ```python
    #!/usr/bin/env python3
    import sys

    def load_lines(path):
        with open(path) as f:
            return [line.strip().lower() for line in f if line.strip()]

    def main():
        subscribers = load_lines(sys.argv[1])
        unsubscribed = load_lines(sys.argv[2])

        clean = []
        for email in subscribers:
            if email not in unsubscribed and email not in clean:
                clean.append(email)

        domains = {}
        for email in clean:
            domain = email.split("@")[-1]
            if domain in domains:
                domains[domain] = domains[domain] + 1
            else:
                domains[domain] = 1

        top = []
        for d in domains:
            top.append((d, domains[d]))
        top.sort(key=lambda x: x[1], reverse=True)

        for email in clean:
            print(email)
        print("---")
        for d, n in top[:5]:
            print(d, n)

    if __name__ == "__main__":
        main()
    ```

