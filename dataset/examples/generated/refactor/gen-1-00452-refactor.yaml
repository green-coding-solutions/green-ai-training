id: gen-1-00452-refactor
category: refactor
language: css
patterns:
- system-fonts-and-deps
- hoist-invariants
messages:
- role: user
  content: |
    hi, i made the api documentation page for our REST API (the partner developers open it, its served by our Flask app). the page feels slow to show the text and i dont know why. maybe my css is wrong? can you make it better pls

    ```css
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&family=Merriweather:wght@300;400;700;900&display=swap');
    @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

    body {
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      color: #1f2933;
      background: #f7f9fb;
      margin: 0;
    }

    h1, h2, h3 {
      font-family: 'Merriweather', serif;
      color: #1f2933;
    }

    .endpoint {
      font-family: 'Roboto Mono', monospace;
      font-size: 15px;
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 6px;
      padding: 12px 16px;
      margin: 12px 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .method-get {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 8px;
      background: #2b8a3e;
    }

    .method-post {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 8px;
      background: #1c7ed6;
    }

    .method-put {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 8px;
      background: #e8590c;
    }

    .method-delete {
      font-family: 'Roboto Mono', monospace;
      font-weight: 700;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 8px;
      background: #c92a2a;
    }

    pre.example {
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      background: #102a43;
      color: #f0f4f8;
      border-radius: 6px;
      padding: 12px 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      overflow-x: auto;
    }
    ```

    we only use 3 icons from font awesome: fa-lock, fa-copy and fa-arrow-right.
- role: assistant
  content: |
    Your CSS is not wrong, but the page loads too much before it can show text. Two `@import` lines make the browser fetch your CSS first, then the Google Fonts CSS, then the font files, then Font Awesome. Text waits on that chain. Eleven font weights are requested, and you use only a few.

    ```css
    :root {
      --text: #1f2933;
      --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-heading: Georgia, 'Times New Roman', serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    body {
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--text);
      background: #f7f9fb;
      margin: 0;
    }

    h1, h2, h3 {
      font-family: var(--font-heading);
      color: var(--text);
    }

    .endpoint {
      font-family: var(--font-mono);
      font-size: 15px;
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 6px;
      padding: 12px 16px;
      margin: 12px 0;
      box-shadow: var(--shadow);
    }

    .method-get, .method-post, .method-put, .method-delete {
      font-family: var(--font-mono);
      font-weight: 700;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 4px;
      margin-right: 8px;
    }
    .method-get    { background: #2b8a3e; }
    .method-post   { background: #1c7ed6; }
    .method-put    { background: #e8590c; }
    .method-delete { background: #c92a2a; }

    pre.example {
      font-family: var(--font-mono);
      font-size: 14px;
      background: #102a43;
      color: #f0f4f8;
      border-radius: 6px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    /* Replaces Font Awesome for the 3 icons. Same class names, so the HTML stays unchanged. */
    .fa-solid::before { font-style: normal; }
    .fa-lock::before        { content: "\1F512"; }
    .fa-copy::before        { content: "\29C9"; }
    .fa-arrow-right::before { content: "\2192"; }
    ```

    **Green Notes**
    - **System fonts instead of web fonts** (reduces network and E): the page no longer downloads any font files or the Font Awesome stylesheet. It also removes the `@import` chain, so text shows right away. Every partner who opens the docs saves those requests.
    - **Icons without a library** (reduces network): you used 3 icons, but Font Awesome ships its whole set. Plain Unicode characters do the same job. The icons will look a little different from before, and the lock is an emoji on some systems.
    - **Shared rules instead of copy-paste** (reduces network): the four `.method-*` rules repeated the same six declarations. Now they are written once and only the background color differs. The fonts and the shadow are set once in `:root` variables. This gives a smaller CSS file and one place to change things. The effect is small.
    - The look changes: text now uses the user's system fonts. If your brand needs Merriweather, host one `woff2` file yourself with `font-display: swap`. Do not import all the weights.
verify:
  static_only: CSS-only change; needs a browser to render, no stdlib or numpy check possible
