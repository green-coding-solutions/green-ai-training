id: gen-2-00009-refactor
category: refactor
language: sql
patterns:
- select-columns
facts:
- F-PG-SELECT
- F-PG-COLUMNS
messages:
- role: user
  content: |
    cart drawer query, runs on every page load for logged in users. products has ~60 cols incl long descriptions and a specs json. drawer only shows name, thumbnail, price, qty. fix this

    ```sql
    -- cart drawer (header, all pages)
    SELECT *
    FROM cart_items ci
    JOIN products p ON p.id = ci.product_id
    LEFT JOIN product_images pi
           ON pi.product_id = p.id
          AND pi.is_primary = TRUE
    WHERE ci.cart_id = :cart_id
      AND p.status = 'active'
    ORDER BY ci.added_at DESC;
    ```
- role: assistant
  content: |
    ```sql
    -- cart drawer (header, all pages)
    SELECT ci.id           AS cart_item_id,
           ci.quantity,
           p.id            AS product_id,
           p.name,
           p.price,
           pi.thumbnail_url
    FROM cart_items ci
    JOIN products p ON p.id = ci.product_id
    LEFT JOIN product_images pi
           ON pi.product_id = p.id
          AND pi.is_primary = TRUE
    WHERE ci.cart_id = :cart_id
      AND p.status = 'active'
    ORDER BY ci.added_at DESC;
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E and network): `SELECT *` over three tables pulls every product column for each cart line, including the long descriptions and the specs JSON. Then the database, the driver and your app all copy data the drawer never shows. In Green Metrics Tool micro-benchmarks on PostgreSQL, reading 500 rows 1,000 times from a 52-column products table with large text columns used about 5.5× less CPU energy with the 10 needed columns than with `SELECT *`. The cost scales with the data each column carries, so dropping the big text columns matters most. This query runs on every page load, so the saving repeats on every one.
    - **Explicit aliases:** with `SELECT *`, the result has three columns named `id` (and maybe duplicate `created_at` etc.). With dict-style rows, the last one wins, so `row["id"]` may be the image id instead of the cart item id. `cart_item_id` and `product_id` remove that ambiguity. The ids are kept because the remove and quantity buttons usually need them.

    Before you deploy, check the drawer template. If it reads any other column (for example `slug` for the product link), add it to the list. The rows and their order are unchanged.
verify:
  static_only: query takes a :cart_id parameter bound by the application; result columns intentionally differ from SELECT
    *
