- role: user
  content: |
    ```bash
    #!/usr/bin/env bash
    # load_partner_batches.sh - runs every 30 min from cron
    set -euo pipefail

    INBOX="/srv/etl/inbox"
    ARCHIVE="/srv/etl/archive"
    LOCK="/var/run/etl_load.lock"
    KEEP_DAYS=180
    DB="postgresql://etl@db01/warehouse"

    exec 9>"$LOCK"
    flock -n 9 || { echo "already running"; exit 0; }

    mkdir -p "$ARCHIVE"

    for f in "$INBOX"/*.csv; do
        [ -e "$f" ] || continue
        name=$(basename "$f")
        echo "loading $name"
        psql "$DB" -v ON_ERROR_STOP=1 -c "\copy staging.partner_events from '$f' with (format csv, header true)"
        day=$(date +%F)
        mkdir -p "$ARCHIVE/$day"
        7z a -mx=9 -bd -bso0 "$ARCHIVE/$day/$name.7z" "$f"
        rm "$f"
    done

    find "$ARCHIVE" -name '*.7z' -mtime +"$KEEP_DAYS" -delete
    echo "done"
    ```

