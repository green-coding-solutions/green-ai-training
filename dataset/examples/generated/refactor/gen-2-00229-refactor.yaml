- role: assistant
  content: |
    ```html
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>Ingest run {{ run.id }} – {{ run.dag }}</title>
      <style>
        body {
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          margin: 2rem auto; max-width: 1100px; color: #1f2933;
        }
        h1 { font-weight: 700; }
        .status-ok { color: #1b7f3b; font-weight: 600; }
        .status-fail { color: #b42318; font-weight: 600; }
        table { border-collapse: collapse; width: 100%; }
        td, th { padding: .4rem .6rem; border-bottom: 1px solid #e4e7eb; text-align: left; }
        td.num, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
        .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .charts img { width: 100%; height: auto; }
        .note { font-style: italic; color: #616e7c; }
      </style>
    </head>
    <body>
      <h1>{{ run.dag }} · run {{ run.id }}</h1>
      <p>Started {{ run.started }} · finished {{ run.finished }} ·
         <span class="status-{{ run.status }}">{{ run.status | upper }}</span></p>

      <img src="charts/{{ run.id }}/rows_per_table.png" width="1100" height="380" alt="Rows loaded per table">

      <table>
        <tr><th>Table</th><th>Rows</th><th>Rejected</th><th>Duration</th></tr>
        {% for t in tables %}
        <tr><td><code>{{ t.name }}</code></td><td class="num">{{ t.rows }}</td>
            <td class="num">{{ t.rejected }}</td><td class="num">{{ t.duration }}</td></tr>
        {% endfor %}
      </table>

      {% for t in tables %}
      <h2 id="{{ t.name }}">{{ t.name }}</h2>
      <p class="note">{{ t.source }} → {{ t.target }}</p>
      <div class="charts">
        <img src="charts/{{ run.id }}/{{ t.name }}_nulls.png" width="540" height="320" loading="lazy" alt="Null rate per column, {{ t.name }}">
        <img src="charts/{{ run.id }}/{{ t.name }}_volume.png" width="540" height="320" loading="lazy" alt="Daily volume, {{ t.name }}">
      </div>
      {% endfor %}
    </body>
    </html>
    ```

    **Green Notes**
    - **System font stack instead of six TTF files** (reduces E, network): the page no longer downloads and parses five Inter weights and a mono font on every first visit. Bold, semibold and italic now come from the system font. In Green Metrics Tool browser benchmarks with 30 cold page loads, the system font stack used about 26% less CPU energy than six local TTF files (~4 MB).
    - **Lazy-load the per-table charts** (reduces E, network): there are two PNGs per table, and they all sit below the summary table. Readers who check the status and the summary, or who jump to one table via its anchor, now load only the charts they actually see. In Green Metrics Tool browser benchmarks, an article with 15 photos loaded 20 times without scrolling used about 12% less CPU energy with `loading="lazy"` below the fold. When readers scrolled to the end, there was no difference.
    - The top `rows_per_table.png` chart stays eager because it is above the fold. Lazy-loading it would only delay the first thing people look at.

    The text will look slightly different on each OS, but the layout is the same. The charts already have `width`/`height`, so lazy images keep their space and anchor jumps don't shift. You can stop copying `fonts/` into the report output. If Inter is a hard requirement, two Latin-subset WOFF2 files (regular + bold) are the next best choice: in the same benchmark they used about 12% less than the TTF set, and the system stack used about 16% less than WOFF2.
verify:
  static_only: Jinja HTML template, needs a browser to render
