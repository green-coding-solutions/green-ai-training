id: gen-1-00343-refactor
category: refactor
language: python
patterns:
- vectorize-or-jit
messages:
- role: user
  content: |
    diff only please. "similar products" endpoint, called on every product page view, catalog is ~40k items with 128-dim embeddings

    ```python
    import math

    def recommend(query_vec, catalog, k=10):
        """catalog: list of (sku, vector) tuples."""
        qnorm = math.sqrt(sum(q * q for q in query_vec))
        scored = []
        for sku, vec in catalog:
            dot = 0.0
            vnorm = 0.0
            for i in range(len(vec)):
                dot += vec[i] * query_vec[i]
                vnorm += vec[i] * vec[i]
            if vnorm == 0 or qnorm == 0:
                continue
            scored.append((sku, dot / (qnorm * math.sqrt(vnorm))))
        scored.sort(key=lambda s: s[1], reverse=True)
        return [{"sku": s, "score": round(c, 4)} for s, c in scored[:k]]
    ```
- role: assistant
  content: |
    ```python
    import numpy as np

    class CatalogIndex:
        """Build once at catalog load. Rebuild when the catalog changes."""

        def __init__(self, catalog):
            """catalog: list of (sku, vector) tuples."""
            if not catalog:
                self.skus, self.mat, self.norms = [], np.empty((0, 0)), np.empty(0)
                return
            mat = np.array([vec for _, vec in catalog], dtype=np.float64)
            norms = np.linalg.norm(mat, axis=1)
            keep = np.flatnonzero(norms > 0)
            self.skus = [catalog[i][0] for i in keep]
            self.mat = mat[keep]
            self.norms = norms[keep]

    def recommend(query_vec, index, k=10):
        if not index.skus:
            return []
        q = np.asarray(query_vec, dtype=np.float64)
        qnorm = np.sqrt(q @ q)
        if qnorm == 0:
            return []
        scores = (index.mat @ q) / (qnorm * index.norms)
        order = np.argsort(-scores, kind="stable")[:k]
        return [
            {"sku": index.skus[i], "score": round(float(scores[i]), 4)}
            for i in order
        ]
    ```

    Call site: build `index = CatalogIndex(catalog)` when the catalog loads, then call `recommend(query_vec, index)` on each page view.

    **Green Notes**
    - **Vectorized scoring** (reduces E): the old code ran about 40k × 128 multiply-adds in the Python interpreter on every page view. Now one matrix-vector product does that work in compiled code.
    - **Matrix built once:** turning 40k Python lists into an array is expensive. Doing it on every request would eat most of the gain. The index does it once, along with the row norms and the removal of zero vectors, so each request only does the product and the sort.
    - **Same output:** zero-norm vectors are skipped, a zero query returns `[]`, and ties keep catalog order (`kind="stable"`). Scores are rounded to 4 decimals, so a score right on a rounding boundary could differ in the last digit because the sums are added in a different order.
    - **API change:** `recommend` now takes the index instead of the raw list. You must rebuild the index when the catalog changes. This also adds a NumPy dependency.
verify:
  equivalence:
    driver: |
      import random
      _prep = globals().get("CatalogIndex", lambda c: c)
      random.seed(17)
      dim = 64
      catalog = [(f"SKU{i:05d}", [random.uniform(-1, 1) for _ in range(dim)]) for i in range(2000)]
      catalog[5] = ("SKU_ZERO", [0.0] * dim)
      catalog.append(("SKU_DUP_A", [1.0] * dim))
      catalog.append(("SKU_DUP_B", [1.0] * dim))
      query = [random.uniform(-1, 1) for _ in range(dim)]
      idx = _prep(catalog)
      for r in recommend(query, idx):
          print(r["sku"], r["score"])
      print(recommend([1.0] * dim, idx, k=3))
      print(recommend([0.0] * dim, idx))
      print(recommend(query, _prep([])))
      print(recommend(query, _prep([("Z", [0.0] * dim)])))
  benchmark:
    driver: |
      import random, time
      _prep = globals().get("CatalogIndex", lambda c: c)
      random.seed(3)
      dim = 128
      catalog = [(f"S{i}", [random.uniform(-1, 1) for _ in range(dim)]) for i in range(20000)]
      queries = [[random.uniform(-1, 1) for _ in range(dim)] for _ in range(3)]
      idx = _prep(catalog)
      t = time.process_time()
      for query in queries:
          recommend(query, idx)
      print("__CPU__", time.process_time() - t)
    min_speedup: 3
