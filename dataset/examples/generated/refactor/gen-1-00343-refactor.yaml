id: gen-1-00343-refactor
category: refactor
language: python
patterns:
- vectorize-or-jit
messages:
- role: user
  content: |
    diff only please. "similar products" endpoint, called on every product page view, catalog is ~40k items with 128-dim embeddings

    ```python
    import math

    def recommend(query_vec, catalog, k=10):
        """catalog: list of (sku, vector) tuples."""
        qnorm = math.sqrt(sum(q * q for q in query_vec))
        scored = []
        for sku, vec in catalog:
            dot = 0.0
            vnorm = 0.0
            for i in range(len(vec)):
                dot += vec[i] * query_vec[i]
                vnorm += vec[i] * vec[i]
            if vnorm == 0 or qnorm == 0:
                continue
            scored.append((sku, dot / (qnorm * math.sqrt(vnorm))))
        scored.sort(key=lambda s: s[1], reverse=True)
        return [{"sku": s, "score": round(c, 4)} for s, c in scored[:k]]
    ```
- role: assistant
  content: |
    ```python
    import numpy as np

    def recommend(query_vec, catalog, k=10):
        """catalog: list of (sku, vector) tuples."""
        if not catalog:
            return []
        q = np.asarray(query_vec, dtype=np.float64)
        qnorm = np.linalg.norm(q)
        if qnorm == 0:
            return []
        mat = np.asarray([vec for _, vec in catalog], dtype=np.float64)
        vnorms = np.linalg.norm(mat, axis=1)
        idx = np.flatnonzero(vnorms > 0)
        scores = (mat[idx] @ q) / (qnorm * vnorms[idx])
        order = np.argsort(-scores, kind="stable")[:k]
        return [
            {"sku": catalog[idx[i]][0], "score": round(float(scores[i]), 4)}
            for i in order
        ]
    ```

    **Green Notes**
    - **Vectorized scoring** (reduces E): the old code ran about 40k × 128 multiply-adds in the Python interpreter on every page view. Now one matrix-vector product and one norm call do that work in compiled code.
    - **No full sort:** only the score array is ordered, and only the top `k` rows are turned into dicts. `kind="stable"` keeps the old tie order.
    - **Build the matrix once:** `np.asarray` on 40k lists still costs a copy on each request. In the service, build `mat`, `vnorms` and the SKU list at catalog load, and refresh them when the catalog changes. Then each request is only the product and the sort.
    - **Same behavior:** zero-norm vectors are skipped, a zero query returns `[]`, and the output shape is unchanged. Scores are rounded to 4 decimals, so a score on a rounding boundary could differ in the last digit because the summation order differs. This adds a NumPy dependency.
verify:
  equivalence:
    driver: |
      import random
      random.seed(17)
      dim = 64
      catalog = [(f"SKU{i:05d}", [random.uniform(-1, 1) for _ in range(dim)]) for i in range(2000)]
      catalog[5] = ("SKU_ZERO", [0.0] * dim)
      catalog.append(("SKU_DUP_A", [1.0] * dim))
      catalog.append(("SKU_DUP_B", [1.0] * dim))
      query = [random.uniform(-1, 1) for _ in range(dim)]
      for r in recommend(query, catalog):
          print(r["sku"], r["score"])
      print(recommend([1.0] * dim, catalog, k=3))
      print(recommend([0.0] * dim, catalog))
      print(recommend(query, []))
  benchmark:
    driver: |
      import random, time
      random.seed(3)
      dim = 128
      catalog = [(f"S{i}", [random.uniform(-1, 1) for _ in range(dim)]) for i in range(20000)]
      query = [random.uniform(-1, 1) for _ in range(dim)]
      t = time.process_time()
      recommend(query, catalog)
      print("__CPU__", time.process_time() - t)
    min_speedup: 3
