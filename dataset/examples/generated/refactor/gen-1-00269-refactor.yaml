id: gen-1-00269-refactor
category: refactor
language: bash
patterns:
- bash-builtins
messages:
- role: user
  content: |
    Post-processing for our MD sweep. Walks the per-run logs and prints frame and instability counts. Logs are ~2M lines each. Rewrite it, diff only, no explanations of what bash is.

    ```bash
    summarize_runs() {
        dir=${1:-.}
        total=0
        for f in "$dir"/run_*.log; do
            name=$(basename "$f" .log)
            id=$(echo "$name" | sed 's/run_//')
            frames=0
            bad=0
            while read -r line; do
                step=$(echo "$line" | cut -d' ' -f1)
                flag=$(echo "$line" | cut -d' ' -f3)
                frames=$(expr $frames + 1)
                if [ "$flag" = "UNSTABLE" ]; then
                    bad=$(expr $bad + 1)
                fi
                last=$step
            done < "$f"
            printf '%s frames=%s unstable=%s last_step=%s\n' "$id" "$frames" "$bad" "$last"
            total=$(expr $total + $bad)
        done
        echo "total unstable: $total"
    }
    ```
- role: assistant
  content: |
    ```bash
    summarize_runs() {
        local dir=${1:-.} total=0 f name id frames bad last step flag
        for f in "$dir"/run_*.log; do
            name=${f##*/}
            id=${name%.log}
            id=${id/run_/}
            frames=0
            bad=0
            last=''
            while read -r step _ flag _; do
                frames=$((frames + 1))
                if [[ $flag == UNSTABLE ]]; then
                    bad=$((bad + 1))
                fi
                last=$step
            done < "$f"
            printf '%s frames=%s unstable=%s last_step=%s\n' "$id" "$frames" "$bad" "$last"
            total=$((total + bad))
        done
        echo "total unstable: $total"
    }
    ```

    **Green Notes**
    - **Parameter expansion instead of `basename` + `echo | sed`** (reduces E): `${f##*/}`, `${name%.log}` and `${id/run_/}` run inside the shell. No fork per file.
    - **`read -r step _ flag _` instead of `echo | cut` twice** (reduces E): the original started several processes for every line. At 2M lines per log that is millions of forks per run. Now the loop forks nothing.
    - **`$((...))` instead of `expr`** (reduces E): arithmetic is a builtin, `expr` was an external process per increment.
    - **Behavior change:** `last` is reset for each file. Before, an empty log printed the last step of the previous log. Fields are now split on any whitespace, so this is the same for single-space logs.
    - *Not applied:* a pure bash loop still parses 2M lines slowly. If this runs for every sweep, one `awk` pass per file is the better next step. I kept bash here because you asked for the same structure.
verify:
  equivalence:
    driver: |-
      d=$(mktemp -d)
      for i in 1 2 3; do
        : > "$d/run_0$i.log"
        for s in 1 2 3 4 5; do
          if (( (s * i) % 4 == 0 )); then fl=UNSTABLE; else fl=ok; fi
          echo "$((s * 100)) -1.5$s $fl" >> "$d/run_0$i.log"
        done
      done
      summarize_runs "$d"
