    ```python
    import re
    from collections import Counter

    LINE_RE = re.compile(r'^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) (\S+)[^"]*" (\d{3}) (\d+|-)')


    def load_blocklist(path):
        with open(path) as f:
            return {line.strip() for line in f if line.strip() and not line.startswith("#")}


    def summarize(log_path, blocklist_path):
        blocked = load_blocklist(blocklist_path)
        status_counts = Counter()
        bytes_total = 0
        dropped = 0
        with open(log_path) as f:
            for line in f:
                m = LINE_RE.match(line)
                if m is None:
                    continue
                ip, status, size = m.group(1), m.group(5), m.group(6)
                if ip in blocked:
                    dropped += 1
                    continue
                status_counts[status[0] + "xx"] += 1
                if size != "-":
                    bytes_total += int(size)
        return status_counts, bytes_total, dropped
    ```

    **Green Notes**
    - **Set for repeated membership tests** (reduces E): `ip in blocked` runs once per log line. On a list, each test scans the blocklist, so the cost is lines × blocklist size. On a set, each test is O(1), so building the set once is O(n) and the loop stays linear in the log size. In Green Metrics Tool micro-benchmarks, a single lookup on a list was cheaper than converting it to a set first (the set route used about 50% more). The set pays off here only because you look up once per line, over many lines.
    - **Left as is:** the regex is already compiled at module level, and the rest of the loop is fine.

    The counts and byte totals are identical. Duplicate blocklist entries collapse into one, which does not change any result. If the blocklist is tiny and the log is short, the difference is not measurable.
