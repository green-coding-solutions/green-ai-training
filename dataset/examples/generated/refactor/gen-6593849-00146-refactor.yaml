    ```python
    import re
    from os.path import *

    LEVELS = ('ERROR', 'CRITICAL')
    LINE_RE = re.compile(r'^\d{4}-\d{2}-\d{2} ')


    def load_errors(log_dir, names):
        """names are rotated files, oldest first. returns errors, newest first"""
        errors = []
        for name in names:
            path = join(log_dir, name)
            if not isfile(path):
                continue
            with open(path) as f:
                for line in f:
                    if not LINE_RE.match(line):
                        continue
                    parts = line.rstrip('\n').split(' ', 3)
                    if len(parts) < 4:
                        continue
                    date, time, level, msg = parts
                    if level in LEVELS:
                        errors.insert(0, (date + ' ' + time, level, msg))
        return errors
