id: gen-1-00474-refactor
category: refactor
language: yaml
patterns:
- minimize-environments
messages:
- role: user
  content: |
    We run a small ETL platform (Airflow + a Postgres warehouse) on a shared dev Kubernetes cluster. Our GitHub Actions workflow below gives every branch its own environment so people can test new DAGs. The cluster bill keeps growing and the autoscaler never removes nodes.

    Requirements:
    - Every pull request still needs its own isolated environment to run changed DAGs.
    - Prod and the shared staging environment must not be touched.
    - The environment must go away when the PR is merged or closed.
    - Redeploying on new commits must stay automatic.
    - Please also check if the setup itself has problems, we copy-pasted parts of it.

    ```yaml
    name: etl-dev-env

    on:
      push:
        branches: ['**']

    env:
      CHART: ./deploy/etl-chart

    jobs:
      deploy:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - name: Write kubeconfig
            run: |
              mkdir -p ~/.kube
              echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config

          - name: Deploy ETL stack
            run: |
              helm upgrade --install etl-${{ github.ref_name }} $CHART \
                --namespace etl-${{ github.ref_name }} \
                --create-namespace \
                --set airflow.workers=4 \
                --set airflow.scheduler.replicas=2 \
                --set warehouse.snapshot=full \
                --set warehouse.storage=500Gi \
                --set image.tag=${{ github.sha }}

          - name: Smoke test
            run: |
              kubectl -n etl-${{ github.ref_name }} wait --for=condition=ready pod -l app=airflow-webserver --timeout=300s
              kubectl -n etl-${{ github.ref_name }} exec deploy/airflow-scheduler -- airflow dags list
    ```
- role: assistant
  content: |
    There is a real bug and several sources of idle capacity. Nothing ever deletes these environments, and each one is large.

    ```yaml
    name: etl-preview

    on:
      pull_request:
        types: [opened, synchronize, reopened, closed]

    # one environment per PR, a new push replaces the running deploy
    concurrency:
      group: etl-preview-${{ github.event.number }}
      cancel-in-progress: true

    env:
      CHART: ./deploy/etl-chart
      NAMESPACE: etl-pr-${{ github.event.number }}

    jobs:
      deploy:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4

          - name: Write kubeconfig
            run: |
              mkdir -p ~/.kube
              echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config

          - name: Deploy ETL stack
            run: |
              helm upgrade --install "$NAMESPACE" "$CHART" \
                --namespace "$NAMESPACE" \
                --create-namespace \
                --set airflow.workers=1 \
                --set airflow.scheduler.replicas=1 \
                --set warehouse.snapshot=sample \
                --set warehouse.storage=20Gi \
                --set image.tag=${{ github.sha }}
              kubectl label namespace "$NAMESPACE" env=preview --overwrite

          - name: Smoke test
            run: |
              kubectl -n "$NAMESPACE" wait --for=condition=ready pod -l app=airflow-webserver --timeout=300s
              kubectl -n "$NAMESPACE" exec deploy/airflow-scheduler -- airflow dags list

      teardown:
        if: github.event.action == 'closed'
        runs-on: ubuntu-latest
        steps:
          - name: Write kubeconfig
            run: |
              mkdir -p ~/.kube
              echo "${{ secrets.KUBECONFIG_DEV }}" > ~/.kube/config

          - name: Remove preview environment
            run: |
              helm uninstall "$NAMESPACE" --namespace "$NAMESPACE" || true
              kubectl delete namespace "$NAMESPACE" --ignore-not-found --wait=false
    ```

    **Green Notes**
    - **Environments live only as long as the PR** (reduces E and M): the old workflow created an environment for every pushed branch and never removed one. The new `closed` job deletes the namespace and its volumes on merge or close. Idle workers, schedulers and disks no longer pile up, and the autoscaler can finally drop nodes.
    - **Previews only for pull requests:** pushes to branches without a PR no longer create a stack. This matches your requirement and cuts the number of environments.
    - **Right-sized preview:** 1 worker, 1 scheduler and a 20Gi sample snapshot instead of 4 workers, 2 schedulers and a full 500Gi copy. A DAG check does not need production volume.
    - **Concurrency group per PR:** a new commit replaces a running deploy instead of stacking a second one.
    - **Bug fixed:** `github.ref_name` for `feature/new-dag` contains a slash, which is not valid in a namespace or release name, so those deploys failed. `etl-pr-<number>` is always valid and also gives you a stable name to clean up.

    Behavior changes to know about:
    - Previews now hold sample data. If you need a full-volume run before a release, do it in the shared staging environment, not in every PR.
    - Rows the DAG should see must exist in the sample snapshot. Update the sample when you add new source tables.

    The `env=preview` label lets you add a scheduled cleanup for namespaces whose `closed` event was missed, for example after a cancelled run.
verify:
  static_only: GitHub Actions workflow, needs a Kubernetes cluster and Helm chart
