id: gen-1-00022-refactor
category: refactor
language: css
patterns:
- remove-unused-css
facts:
- F-UNUSED-CSS
messages:
- role: user
  content: |
    hi, our CLI `flakehunt` writes a html report (report.html + style.css next to it). the style.css was copied from a bootstrap 3 starter in 2019. i think most of bootstrap is dead, only the table and the badges realy used. can u clean it up, want it smaller. thx

    render.py template (the only place that makes html):

    ```python
    ROW = '<tr class="$cls"><td>$test</td><td>$runs</td><td>$fails</td><td><span class="badge $level">$rate</span></td></tr>'

    PAGE = """<!doctype html>
    <html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
    <body>
    <h1>Flaky tests</h1>
    <table class="results">
    <thead><tr><th>Test</th><th>Runs</th><th>Failures</th><th>Rate</th></tr></thead>
    <tbody>$rows</tbody>
    </table>
    <p class="footer">Generated $generated</p>
    </body></html>"""
    ```

    rows get `cls="row-flaky"` if fails > 0, else empty. level is always `high` or `low`.

    current style.css:

    ```css
    /* from bootstrap 3 starter, copied in 2019 */
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
    }
    h1 { font-size: 24px; margin: 0 0 16px; }
    .container { max-width: 1140px; margin: 0 auto; }
    .btn, .btn-primary, .btn-default { display: inline-block; padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-primary { background: #337ab7; color: #fff; }
    .nav-pills > li > a { padding: 10px 15px; }
    table.results { width: 100%; border-collapse: collapse; }
    table.results th,
    table.results td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    table.results th { background: #f0f0f0; }
    .table-striped tbody tr:nth-of-type(odd) { background: #f9f9f9; }
    .table-responsive { overflow-x: auto; }
    tr.row-flaky td { background: #fff4e5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .badge-high { background: #e53e3e; color: #fff; }
    .badge-low { background: #38a169; color: #fff; }
    .badge-warning { background: #dd6b20; color: #fff; }
    .footer { margin-top: 24px; font-size: 12px; color: #777; }
    .modal, .modal-backdrop { display: none; }
    @media (max-width: 600px) {
      .container { padding: 0; }
    }
    @media print {
      .btn, .nav-pills { display: none; }
    }
    ```
- role: assistant
  content: |
    ```css
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
    }
    h1 { font-size: 24px; margin: 0 0 16px; }
    table.results { width: 100%; border-collapse: collapse; }
    table.results th,
    table.results td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    table.results th { background: #f0f0f0; }
    tr.row-flaky td { background: #fff4e5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .badge-high { background: #e53e3e; color: #fff; }
    .badge-low { background: #38a169; color: #fff; }
    .footer { margin-top: 24px; font-size: 12px; color: #777; }
    ```

    Kept only the selectors that render.py emits: `body`, `h1`, the `results` table, `row-flaky`, the badge levels `high` and `low`, and `footer`.

    Before you ship, run `grep -n "warning\|btn\|nav-pills\|modal\|container" render.py` to check that nothing sets those classes. If you add a `warning` level later, add `.badge-warning` back.

    **Green Notes**
    - **Remove unused CSS** (reduces network, not measurable E): the bootstrap rules for buttons, containers, nav pills, striped tables, modals, the responsive wrapper and both media queries never match anything in the template. In Green Metrics Tool micro-benchmarks, a 16 KB stylesheet with mostly unused rules and a purged 0.75 KB version differed by about 2% in client energy, which is within measurement noise. The gain is fewer bytes to send, not less work for the browser.
    - **Removed `.badge-warning`:** no code path sets the `warning` level. Remove it or restore it, based on the check above.
verify:
  static_only: CSS cleanup needs a browser to confirm rendering. Dead-selector check is done by hand against the template.
