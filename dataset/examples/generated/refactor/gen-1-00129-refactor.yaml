id: gen-1-00129-refactor
category: refactor
language: html
patterns:
- system-fonts-and-deps
- css-animations
facts:
- F-FONTS
- F-ANIM
messages:
- role: user
  content: |
    Hi, I need to clean up the product page template of our outdoor shop "Nordlicht Outdoor". Marketing complains that the page feels slow on mobile. Requirements:

    - Headings (product name, prices) must keep the Fraunces look, this is part of our brand.
    - The promo banner at the top must keep scrolling and must still pause when the mouse is over it.
    - The cart badge must keep its little pulse.
    - No new build tools, it is a plain HTML template.

    Here is the file:

    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Nordlicht Outdoor – Trail Jacket Fjell</title>
      <style>
        @font-face { font-family: "Fraunces"; src: url("/fonts/Fraunces-Regular.ttf"); font-weight: 400; }
        @font-face { font-family: "Fraunces"; src: url("/fonts/Fraunces-Bold.ttf"); font-weight: 700; }
        @font-face { font-family: "Karla"; src: url("/fonts/Karla-Regular.ttf"); font-weight: 400; }
        @font-face { font-family: "Karla"; src: url("/fonts/Karla-Italic.ttf"); font-weight: 400; font-style: italic; }
        @font-face { font-family: "Karla"; src: url("/fonts/Karla-Medium.ttf"); font-weight: 500; }
        @font-face { font-family: "Karla"; src: url("/fonts/Karla-Bold.ttf"); font-weight: 700; }

        body { margin: 0; font-family: "Karla", sans-serif; font-size: 17px; line-height: 1.55; color: #1d2b2a; }
        h1, h2, .price { font-family: "Fraunces", serif; font-weight: 700; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; }
        #cart-badge { display: inline-block; background: #e4572e; color: #fff; border-radius: 12px;
                      padding: 2px 10px; font-weight: 700; transition: transform 0.8s ease; }
        #promo { overflow: hidden; background: #1d2b2a; color: #fff; white-space: nowrap; }
        #promo-track { display: flex; width: max-content; will-change: transform; }
        #promo-track span { padding: 8px 40px; }
        main { max-width: 760px; margin: 0 auto; padding: 24px; }
        .buy { background: #e4572e; color: #fff; border: 0; padding: 12px 28px; font: inherit; font-weight: 700; cursor: pointer; }
      </style>
    </head>
    <body>
      <div id="promo">
        <div id="promo-track">
          <span>Free shipping over 60 EUR</span>
          <span>30 days returns</span>
          <span>New: Winter trail collection</span>
        </div>
      </div>
      <header>
        <strong>Nordlicht Outdoor</strong>
        <a href="/cart">Cart <span id="cart-badge">2</span></a>
      </header>
      <main>
        <h1>Trail Jacket Fjell</h1>
        <p class="price">189,00 EUR</p>
        <p><em>Light, waterproof and packable.</em> Taped seams, two chest pockets and a hood that fits over a helmet.</p>
        <button class="buy">Add to cart</button>
      </main>

      <script>
        const banner = document.getElementById('promo');
        const track = document.getElementById('promo-track');
        track.innerHTML += track.innerHTML;
        let x = 0, paused = false;
        banner.addEventListener('mouseenter', () => paused = true);
        banner.addEventListener('mouseleave', () => paused = false);
        function tick() {
          if (!paused) {
            x -= 0.5;
            if (x <= -track.scrollWidth / 2) x = 0;
            track.style.transform = 'translateX(' + x + 'px)';
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        const badge = document.getElementById('cart-badge');
        let big = false;
        setInterval(() => {
          big = !big;
          badge.style.transform = big ? 'scale(1.15)' : 'scale(1)';
        }, 800);
      </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    ```html
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Nordlicht Outdoor – Trail Jacket Fjell</title>
      <style>
        @font-face {
          font-family: "Fraunces";
          src: url("/fonts/fraunces-700-latin.woff2") format("woff2");
          font-weight: 700;
          font-display: swap;
          unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2018-201F, U+20AC;
        }

        body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
               font-size: 17px; line-height: 1.55; color: #1d2b2a; }
        h1, h2, .price { font-family: "Fraunces", Georgia, serif; font-weight: 700; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; }
        #cart-badge { display: inline-block; background: #e4572e; color: #fff; border-radius: 12px;
                      padding: 2px 10px; font-weight: 700; animation: pulse 1.6s ease-in-out infinite; }
        #promo { overflow: hidden; background: #1d2b2a; color: #fff; white-space: nowrap; }
        #promo-track { display: flex; width: max-content; animation: scroll 30s linear infinite; }
        #promo:hover #promo-track { animation-play-state: paused; }
        #promo-track span { padding: 8px 40px; }
        main { max-width: 760px; margin: 0 auto; padding: 24px; }
        .buy { background: #e4572e; color: #fff; border: 0; padding: 12px 28px; font: inherit; font-weight: 700; cursor: pointer; }

        @keyframes scroll { to { transform: translateX(-50%); } }
        @keyframes pulse { 50% { transform: scale(1.15); } }
      </style>
    </head>
    <body>
      <div id="promo">
        <div id="promo-track">
          <span>Free shipping over 60 EUR</span>
          <span>30 days returns</span>
          <span>New: Winter trail collection</span>
          <span aria-hidden="true">Free shipping over 60 EUR</span>
          <span aria-hidden="true">30 days returns</span>
          <span aria-hidden="true">New: Winter trail collection</span>
        </div>
      </div>
      <header>
        <strong>Nordlicht Outdoor</strong>
        <a href="/cart">Cart <span id="cart-badge">2</span></a>
      </header>
      <main>
        <h1>Trail Jacket Fjell</h1>
        <p class="price">189,00 EUR</p>
        <p><em>Light, waterproof and packable.</em> Taped seams, two chest pockets and a hood that fits over a helmet.</p>
        <button class="buy">Add to cart</button>
      </main>
    </body>
    </html>
    ```

    Make the heading font file once, for example: `pyftsubset Fraunces-Bold.ttf --unicodes="U+0000-00FF,U+0131,U+0152-0153,U+2018-201F,U+20AC" --flavor=woff2 --output-file=fraunces-700-latin.woff2`.

    **Green Notes**
    - **System font stack for body text** (reduces network and E): the page no longer loads five Karla files for the text people read. In Green Metrics Tool browser benchmarks with 30 cold page loads, six TTF files (~4 MB) used ~556 J, two Latin-subset WOFF2 files ~488 J, and the system font stack ~410 J (about 26% less than the TTF set).
    - **One WOFF2 subset for headings** (reduces network): the Fraunces look stays on the product name and prices, with one small file instead of two TTF files. `font-display: swap` shows text right away.
    - **CSS keyframes instead of JavaScript animation** (reduces E): the banner and the badge no longer run script on every frame or on a timer. In a Green Metrics Tool 20-second browser animation benchmark, `requestAnimationFrame` with style updates used ~161 J and CSS `@keyframes` ~145 J (about 10% less). The hover pause is now `animation-play-state: paused`, so the mouse listeners are gone too.

    Behavior changes to know about:
    - Body text now uses the visitor's system font instead of Karla, so it looks a bit different per device. The regular Fraunces weight is dropped, because only bold is used on this page.
    - The banner speed is now set by the `30s` duration, not by frame rate. Change it if your banner text is much longer or shorter.
    - The second set of banner items is in the HTML (hidden from screen readers with `aria-hidden`), because the script that cloned them is removed.
verify:
  static_only: HTML/CSS template, no runtime test; needs a browser to check fonts and animations
