id: gen-2-00072-refactor
category: refactor
language: css
patterns:
- system-fonts-and-deps
facts:
- F-FONTS
messages:
- role: user
  content: |
    Storefront base.css. Lighthouse keeps flagging the font files on product pages and checkout. Make it lighter, weights and italics have to keep working. Diff only please, no essay.

    ```css
    /* storefront/static/css/base.css */
    @font-face {
      font-family: "Montserrat";
      src: url("/static/fonts/Montserrat-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Montserrat";
      src: url("/static/fonts/Montserrat-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: "Montserrat";
      src: url("/static/fonts/Montserrat-Medium.ttf") format("truetype");
      font-weight: 500;
    }
    @font-face {
      font-family: "Montserrat";
      src: url("/static/fonts/Montserrat-SemiBold.ttf") format("truetype");
      font-weight: 600;
    }
    @font-face {
      font-family: "Montserrat";
      src: url("/static/fonts/Montserrat-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Montserrat";
      src: url("/static/fonts/Montserrat-ExtraBold.ttf") format("truetype");
      font-weight: 800;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("/static/fonts/JetBrainsMono-Regular.ttf") format("truetype");
    }

    :root {
      --brand: #e4572e;
      --ink: #1d1d1f;
      --muted: #6e6e73;
    }

    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
    }

    h1, h2, h3 { font-weight: 800; letter-spacing: -0.01em; }
    .product-card__title { font-weight: 600; }
    .badge-sale { font-weight: 500; text-transform: uppercase; color: var(--brand); }
    .review__quote, em { font-style: italic; color: var(--muted); }

    .product-card__price,
    .cart-line__price,
    .order-summary__total {
      font-family: "JetBrains Mono", monospace;
    }

    .btn-primary {
      font-weight: 700;
      background: var(--brand);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 0.75rem 1.25rem;
    }
    ```
- role: assistant
  content: |
    Delete every `@font-face` rule (all Montserrat faces and JetBrains Mono). Then change only these declarations:

    ```css
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .product-card__price,
    .cart-line__price,
    .order-summary__total {
      font-family: inherit;
      font-variant-numeric: tabular-nums;
    }
    ```

    Nothing else changes. The weight and italic rules stay as they are, and system UI fonts ship those weights and italics.

    **Green Notes**
    - **System font stack instead of TTF web fonts** (reduces E, network): every first-time visitor to a product page or checkout downloaded and parsed a set of TTF files before the text was final. Now no font files load. In Green Metrics Tool browser benchmarks over 30 cold page loads, six local TTF files (~4 MB) used ~556 J of CPU energy and the system font stack ~410 J, about 26% less.
    - **Tabular figures instead of a monospace font for prices**: JetBrains Mono was only there to line up the digits. `tabular-nums` does the same with the system font, so one more font file goes away.

    Visible change: the text now looks a bit different on macOS, Windows and Android, and prices lose the monospace look. Digits still line up. Also remove any `<link rel="preload">` tags for these files and delete them from `/static/fonts`.

    *Not applied:* keeping Montserrat. If brand needs it for headings, ship one or two Latin-subset WOFF2 files rather than the TTFs. In the same benchmark, two WOFF2 subsets (~55 KB) used ~488 J, about 12% less than the TTF set but still more than system fonts.
verify:
  static_only: CSS, needs a browser to render
