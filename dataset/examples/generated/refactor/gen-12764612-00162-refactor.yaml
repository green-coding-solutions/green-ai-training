id: gen-12764612-00162-refactor
category: refactor
language: html
patterns:
- dom-size
facts:
- F-DOM-SIZE
messages:
- role: user
  content: |
    Hi, I made this page to look at the access log of our small shop server. The server gives me a JSON list of the requests. It works, but when the log is big the browser is very slow and sometimes freezes. I don't know what is wrong. Can you make it better?

    ```html
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Access log</title>
      <style>
        .row { display: flex; border-bottom: 1px solid #ddd; }
        .cell { width: 140px; padding: 2px 6px; }
        .err { color: #b00; }
      </style>
    </head>
    <body>
      <h1>Access log</h1>
      <select id="filter">
        <option value="all">All requests</option>
        <option value="errors">Errors only</option>
      </select>
      <span id="count"></span>
      <div id="log"></div>

      <script>
        let entries = [];

        async function load() {
          const res = await fetch('/api/access-log');
          entries = await res.json();
          render();
        }

        function render() {
          const box = document.getElementById('log');
          box.innerHTML = '';
          const mode = document.getElementById('filter').value;
          let shown = 0;
          for (const e of entries) {
            if (mode === 'errors' && e.status < 400) continue;
            const row = document.createElement('div');
            row.className = 'row' + (e.status >= 400 ? ' err' : '');
            for (const key of ['time', 'ip', 'method', 'path', 'status', 'ms']) {
              const cell = document.createElement('div');
              cell.className = 'cell';
              const span = document.createElement('span');
              span.textContent = e[key];
              cell.appendChild(span);
              row.appendChild(cell);
            }
            box.appendChild(row);
            shown++;
          }
          document.getElementById('count').textContent = shown + ' lines';
        }

        document.getElementById('filter').addEventListener('change', render);
        load();
      </script>
    </body>
    </html>
    ```
- role: assistant
  content: |
    The page builds every log line as page elements at once. Each line makes 13 elements, so 20,000 lines means about 260,000 elements. The browser has to lay out and paint all of them. This version shows 100 lines per page in a plain table.

    ```html
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Access log</title>
      <style>
        table { border-collapse: collapse; }
        th, td { text-align: left; padding: 2px 6px; border-bottom: 1px solid #ddd; }
        td { width: 140px; }
        .err { color: #b00; }
      </style>
    </head>
    <body>
      <h1>Access log</h1>
      <select id="filter">
        <option value="all">All requests</option>
        <option value="errors">Errors only</option>
      </select>
      <span id="count"></span>

      <table>
        <thead>
          <tr><th>Time</th><th>IP</th><th>Method</th><th>Path</th><th>Status</th><th>ms</th></tr>
        </thead>
        <tbody id="log"></tbody>
      </table>

      <div>
        <button id="prev">Previous</button>
        <span id="page"></span>
        <button id="next">Next</button>
      </div>

      <script>
        const PAGE_SIZE = 100;
        const COLUMNS = ['time', 'ip', 'method', 'path', 'status', 'ms'];
        let entries = [];
        let visible = [];
        let page = 0;

        async function load() {
          const res = await fetch('/api/access-log');
          entries = await res.json();
          applyFilter();
        }

        function applyFilter() {
          const mode = document.getElementById('filter').value;
          visible = mode === 'errors' ? entries.filter(e => e.status >= 400) : entries;
          page = 0;
          render();
        }

        function render() {
          const pages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
          const start = page * PAGE_SIZE;
          const fragment = document.createDocumentFragment();

          for (const e of visible.slice(start, start + PAGE_SIZE)) {
            const tr = document.createElement('tr');
            if (e.status >= 400) tr.className = 'err';
            for (const key of COLUMNS) {
              const td = document.createElement('td');
              td.textContent = e[key];
              tr.appendChild(td);
            }
            fragment.appendChild(tr);
          }

          document.getElementById('log').replaceChildren(fragment);
          document.getElementById('count').textContent = visible.length + ' lines';
          document.getElementById('page').textContent = 'Page ' + (page + 1) + ' of ' + pages;
          document.getElementById('prev').disabled = page === 0;
          document.getElementById('next').disabled = page >= pages - 1;
        }

        document.getElementById('filter').addEventListener('change', applyFilter);
        document.getElementById('prev').addEventListener('click', () => { page--; render(); });
        document.getElementById('next').addEventListener('click', () => { page++; render(); });
        load();
      </script>
    </body>
    </html>
    ```

    **Green Notes**
    - **Smaller DOM with pagination** (reduces E): the page now holds 100 rows instead of all lines, so the browser lays out and paints a few hundred elements, not hundreds of thousands. In Green Metrics Tool browser benchmarks, loading a 10,000-row table built from 14 elements per row used ~1036 J over 30 page loads. The same data paginated to 100 rows per page as a plain `<table>` used ~457 J, about 56% less. That is also why your tab freezes.
    - **Fewer elements per row:** the two wrapper elements around every value are gone. A row is now one `<tr>` with six `<td>`. The columns line up as before.
    - **One DOM update per page:** rows are collected in a `DocumentFragment` and put in with a single `replaceChildren` call, not one `appendChild` per line on the live page.

    The filter still works on the full log, and the line count still shows all matching lines. Browser search (Ctrl+F) now only finds text on the current page. If you often search for a text, add a search box that filters `visible` the same way as the error filter.
verify:
  static_only: browser code (HTML page with fetch and DOM)
