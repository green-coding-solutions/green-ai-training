id: gen-1-00053-refactor
category: refactor
language: python
patterns:
- memoize
- async-concurrent-io
messages:
- role: user
  content: |
    We have a nightly script that adds a country code to every line of our access logs. It's slow now because the files got bigger (a few hundred thousand lines, but only a few thousand different client IPs). Please refactor it to cut the run time and the load on our internal IP-info service.

    Requirements:
    - Same output, same line order
    - If the lookup fails (network error), the country is "unknown", like now
    - No new dependencies, we only have the standard library on the job runner

    ```python
    import json
    import sys
    import urllib.request

    API = "http://ipinfo.internal.example.com/v1/"


    def lookup_ip(ip):
        with urllib.request.urlopen(API + ip, timeout=5) as resp:
            return json.load(resp)


    def enrich(lines):
        enriched = []
        per_country = {}
        for line in lines:
            line = line.rstrip("\n")
            if not line:
                continue
            ip = line.split(" ", 1)[0]
            try:
                info = lookup_ip(ip)
                country = info.get("country", "unknown")
            except OSError:
                country = "unknown"
            enriched.append(f"{line} country={country}")
            per_country[country] = per_country.get(country, 0) + 1
        return enriched, per_country


    if __name__ == "__main__":
        with open(sys.argv[1]) as f:
            rows, stats = enrich(f)
        with open(sys.argv[2], "w") as out:
            out.write("\n".join(rows) + "\n")
        for country, n in sorted(stats.items(), key=lambda kv: -kv[1]):
            print(country, n)
    ```
- role: assistant
  content: |
    ```python
    import json
    import sys
    import urllib.request
    from concurrent.futures import ThreadPoolExecutor

    API = "http://ipinfo.internal.example.com/v1/"


    def lookup_ip(ip):
        with urllib.request.urlopen(API + ip, timeout=5) as resp:
            return json.load(resp)


    def country_of(ip):
        try:
            return lookup_ip(ip).get("country", "unknown")
        except OSError:
            return "unknown"


    def enrich(lines, max_workers=8):
        rows = []
        for line in lines:
            line = line.rstrip("\n")
            if line:
                rows.append((line, line.split(" ", 1)[0]))

        # One lookup per distinct IP, run concurrently.
        unique_ips = list(dict.fromkeys(ip for _, ip in rows))
        with ThreadPoolExecutor(max_workers=max_workers) as pool:
            countries = dict(zip(unique_ips, pool.map(country_of, unique_ips)))

        enriched = []
        per_country = {}
        for line, ip in rows:
            country = countries[ip]
            enriched.append(f"{line} country={country}")
            per_country[country] = per_country.get(country, 0) + 1
        return enriched, per_country


    if __name__ == "__main__":
        with open(sys.argv[1]) as f:
            rows, stats = enrich(f)
        with open(sys.argv[2], "w") as out:
            out.write("\n".join(rows) + "\n")
        for country, n in sorted(stats.items(), key=lambda kv: -kv[1]):
            print(country, n)
    ```

    **Green Notes**
    - **Memoize per run** (reduces E, network): the old code made one HTTP request per log line. Now it makes one per distinct IP. With a few hundred thousand lines and a few thousand IPs, that removes most of the requests, and most of the load on your IP-info service. I used a plain dict that lives for one run instead of `lru_cache`. It is bounded by the number of distinct IPs, and it is gone when the job ends, so there is no stale data.
    - **Concurrent lookups** (reduces idle wall time): the remaining requests run in a small thread pool (8 workers) instead of one after another. The job no longer sits idle for each round trip. For blocking `urllib` this is the simplest stdlib option. `asyncio` would need an async HTTP client, which is a new dependency. Keep the worker count low so you don't overload the service.
    - **Behavior:** output and line order are the same, and failures still give `unknown`. One difference: a failing IP is now tried once per run, not once per line. If it fails because of a short network glitch, all its lines get `unknown`. Before, later lines could succeed on a retry. If that matters, add a retry with a small, fixed limit inside `country_of`.
    - *Not applied:* an on-disk cache across nights. IP-to-country data can change, and you did not ask for it. It would also add a staleness question for little gain.
verify:
  module: true
  test: |-
    calls = []

    def fake_lookup(ip):
        calls.append(ip)
        if ip == "10.0.0.3":
            raise OSError("down")
        return {"country": "DE" if ip.endswith("1") else "FR"}

    # Patch the global that country_of actually uses, wherever the answer code lives.
    enrich.__globals__["lookup_ip"] = fake_lookup
    lines = [
        "10.0.0.1 GET /a 200\n",
        "10.0.0.2 GET /b 200\n",
        "\n",
        "10.0.0.1 GET /c 404\n",
        "10.0.0.3 GET /d 500\n",
        "10.0.0.2 GET /e 200\n",
        "10.0.0.3 GET /f 200\n",
    ]
    out, per = enrich(lines)
    assert out == [
        "10.0.0.1 GET /a 200 country=DE",
        "10.0.0.2 GET /b 200 country=FR",
        "10.0.0.1 GET /c 404 country=DE",
        "10.0.0.3 GET /d 500 country=unknown",
        "10.0.0.2 GET /e 200 country=FR",
        "10.0.0.3 GET /f 200 country=unknown",
    ], out
    assert per == {"DE": 2, "FR": 2, "unknown": 2}, per
    assert sorted(calls) == ["10.0.0.1", "10.0.0.2", "10.0.0.3"], calls
