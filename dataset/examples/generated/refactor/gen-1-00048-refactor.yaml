id: gen-1-00048-refactor
category: refactor
language: bash
patterns:
- bash-builtins
facts:
- F-BASH-SUBPROC
messages:
- role: user
  content: |
    hi, I made this script for our landing page build. it counts the js, css and image files in the dist folder and warns about big files. it works but it feels slow in CI and sometimes gives weird errors, I dont know what is wrong. can you make it better?

    ```bash
    #!/bin/bash
    # check assets of the landing page build
    DIST=$1
    total=0
    js=0
    css=0
    img=0
    other=0

    for f in $(find $DIST -type f); do
      name=$(basename $f)
      ext=$(echo $name | rev | cut -d. -f1 | rev | tr 'A-Z' 'a-z')
      size=$(wc -c < $f)
      total=$(expr $total + $size)

      if [ "$ext" = "js" ]; then
        js=$(expr $js + 1)
      elif [ "$ext" = "css" ]; then
        css=$(expr $css + 1)
      elif [ "$ext" = "png" ] || [ "$ext" = "jpg" ] || [ "$ext" = "jpeg" ] || [ "$ext" = "gif" ] || [ "$ext" = "svg" ] || [ "$ext" = "webp" ]; then
        img=$(expr $img + 1)
      else
        other=$(expr $other + 1)
      fi

      if [ $size -gt 200000 ]; then
        echo "BIG: $f ($size bytes)"
      fi
    done

    echo "js: $js"
    echo "css: $css"
    echo "images: $img"
    echo "other: $other"
    echo "total bytes: $total"
    ```
- role: assistant
  content: |
    ```bash
    #!/bin/bash
    # check assets of the landing page build
    dist=${1:-.}
    total=0
    js=0
    css=0
    img=0
    other=0

    while read -r size path; do
      name=${path##*/}
      ext=${name##*.}
      ext=${ext,,}
      total=$((total + size))

      case $ext in
        js) js=$((js + 1)) ;;
        css) css=$((css + 1)) ;;
        png|jpg|jpeg|gif|svg|webp) img=$((img + 1)) ;;
        *) other=$((other + 1)) ;;
      esac

      if [ "$size" -gt 200000 ]; then
        printf 'BIG: %s (%s bytes)\n' "$path" "$size"
      fi
    done < <(find "$dist" -type f -printf '%s %p\n')

    echo "js: $js"
    echo "css: $css"
    echo "images: $img"
    echo "other: $other"
    echo "total bytes: $total"
    ```

    **Green Notes**
    - **Builtins instead of subprocesses in a loop** (reduces E): the old loop started around ten processes for every file (`basename`, `rev`, `cut`, `tr`, `wc`, two `expr` and the subshells around them). Now the file name, the extension, the lowercase and the counting use only shell features (`${var##*/}`, `${var,,}`, `$(( ))`, `case`). `find` prints the size of each file itself, so there is no `wc` per file. Process starts dominate shell scripts. In Green Metrics Tool micro-benchmarks on a 20,000-line log summary, a loop with `$(echo | cut)` and `$(expr)` per field used ~1302 J, and the same loop with builtins only used ~4.3 J, about 300× less. Your files are not log lines, but the cost per process start is the same kind of cost. This runs on every CI build, so it adds up.

    **Bugs fixed**
    - `for f in $(find $DIST ...)` splits file names at spaces, so a file like `hero image.png` was counted as two broken names. Reading line by line with `read -r` and quoting `"$dist"` fixes this.
    - The `while` loop reads from `< <(find ...)` and not from a pipe. A pipe would run the loop in a subshell and all the counters would stay `0` at the end.

    The output is the same as before. If `$1` is empty, it scans the current folder, like the old script did. `-printf` needs GNU `find`, which CI images have. On macOS, install `findutils` and use `gfind`.
verify:
  static_only: bash script that needs GNU find and a directory tree of build files
