  content: |
    fix this, import of ~40k rows takes forever

    ```python
    import csv
    import sys

    import psycopg


    def load_subscribers(path, dsn):
        conn = psycopg.connect(dsn)
        cur = conn.cursor()
        cur.execute("SELECT email FROM subscribers")
        existing = [r[0] for r in cur.fetchall()]

        added = 0
        skipped = 0
        with open(path, newline="") as f:
            for row in csv.DictReader(f):
                email = row["email"].strip().lower()
                if email in existing:
                    skipped += 1
                    continue
                cur.execute(
                    "INSERT INTO subscribers (email, name, source) VALUES (%s, %s, %s)",
                    (email, row["name"].strip(), row.get("source") or "import"),
                )
                conn.commit()
                existing.append(email)
                added += 1
        conn.close()
        print(f"added {added}, skipped {skipped}")


    if __name__ == "__main__":
        load_subscribers(sys.argv[1], sys.argv[2])
    ```
