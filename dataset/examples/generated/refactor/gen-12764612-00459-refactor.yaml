id: gen-12764612-00459-refactor
category: refactor
language: javascript
patterns:
- dom-size
facts:
- F-DOM-SIZE
messages:
- role: user
  content: |
    Our admin console has an "API usage" page for the platform team. It loads per-client, per-endpoint usage for the last 30 days from our REST API. That is around 9,000 rows now and it grows every month. The tab freezes for a few seconds after the fetch and scrolling is laggy. Please refactor `usage.js` so it stays fast with this many rows.

    Requirements:
    - keep click-to-sort on the headers (`th[data-key]`)
    - keep the client id filter
    - the CSV export must still contain ALL rows that match the filter, not only what is visible
    - plain JS, no framework, no new dependencies

    ```javascript
    const COLUMNS = ['clientId', 'method', 'endpoint', 'calls', 'errors', 'p95Ms'];
    const state = { rows: [], sortKey: 'calls', sortDir: -1, filter: '' };

    async function loadUsage() {
      const res = await fetch('/api/admin/usage?window=30d');
      if (!res.ok) throw new Error('usage request failed: ' + res.status);
      state.rows = await res.json();
      render();
    }

    function visibleRows() {
      const f = state.filter.trim().toLowerCase();
      return state.rows
        .filter(r => !f || r.clientId.toLowerCase().includes(f))
        .sort((a, b) => (a[state.sortKey] > b[state.sortKey] ? 1 : -1) * state.sortDir);
    }

    function format(key, value) {
      if (key === 'calls' || key === 'errors') return value.toLocaleString('en-US');
      if (key === 'p95Ms') return value + ' ms';
      return String(value);
    }

    function render() {
      const rows = visibleRows();
      const tbody = document.querySelector('#usage-table tbody');
      tbody.innerHTML = '';
      for (const r of rows) {
        const tr = document.createElement('tr');
        for (const key of COLUMNS) {
          const td = document.createElement('td');
          const wrap = document.createElement('div');
          wrap.className = 'cell';
          const span = document.createElement('span');
          span.className = 'cell-' + key;
          span.textContent = format(key, r[key]);
          wrap.appendChild(span);
          td.appendChild(wrap);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      document.querySelector('#row-count').textContent = rows.length + ' rows';
    }

    function exportCsv() {
      const lines = visibleRows().map(r =>
        COLUMNS.map(k => JSON.stringify(r[k])).join(',')
      );
      const blob = new Blob([COLUMNS.join(',') + '\n' + lines.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'api-usage.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.querySelectorAll('#usage-table th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        state.sortDir = state.sortKey === key ? -state.sortDir : 1;
        state.sortKey = key;
        render();
      });
    });
    document.querySelector('#filter').addEventListener('input', e => {
      state.filter = e.target.value;
      render();
    });
    document.querySelector('#export-csv').addEventListener('click', exportCsv);

    loadUsage();
    ```
- role: assistant
  content: |
    The page builds one DOM node tree for every row, with a `div` and a `span` inside each cell. With 9,000 rows that is over 170,000 elements, and every sort or filter rebuilds all of them. The fix is to render one page of rows at a time.

    ```javascript
    const COLUMNS = ['clientId', 'method', 'endpoint', 'calls', 'errors', 'p95Ms'];
    const PAGE_SIZE = 100;
    const state = { rows: [], sortKey: 'calls', sortDir: -1, filter: '', page: 0 };

    async function loadUsage() {
      const res = await fetch('/api/admin/usage?window=30d');
      if (!res.ok) throw new Error('usage request failed: ' + res.status);
      state.rows = await res.json();
      render();
    }

    function visibleRows() {
      const f = state.filter.trim().toLowerCase();
      return state.rows
        .filter(r => !f || r.clientId.toLowerCase().includes(f))
        .sort((a, b) => {
          const x = a[state.sortKey];
          const y = b[state.sortKey];
          return (x > y ? 1 : x < y ? -1 : 0) * state.sortDir;
        });
    }

    function format(key, value) {
      if (key === 'calls' || key === 'errors') return value.toLocaleString('en-US');
      if (key === 'p95Ms') return value + ' ms';
      return String(value);
    }

    function render() {
      const rows = visibleRows();
      const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      state.page = Math.min(state.page, pages - 1);

      const start = state.page * PAGE_SIZE;
      const fragment = document.createDocumentFragment();
      for (const r of rows.slice(start, start + PAGE_SIZE)) {
        const tr = document.createElement('tr');
        for (const key of COLUMNS) {
          const td = document.createElement('td');
          td.className = 'cell-' + key;
          td.textContent = format(key, r[key]);
          tr.appendChild(td);
        }
        fragment.appendChild(tr);
      }
      document.querySelector('#usage-table tbody').replaceChildren(fragment);

      document.querySelector('#row-count').textContent = rows.length + ' rows';
      document.querySelector('#page-info').textContent = 'Page ' + (state.page + 1) + ' of ' + pages;
      document.querySelector('#page-prev').disabled = state.page === 0;
      document.querySelector('#page-next').disabled = state.page >= pages - 1;
    }

    function exportCsv() {
      const lines = visibleRows().map(r =>
        COLUMNS.map(k => JSON.stringify(r[k])).join(',')
      );
      const blob = new Blob([COLUMNS.join(',') + '\n' + lines.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'api-usage.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.querySelectorAll('#usage-table th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        state.sortDir = state.sortKey === key ? -state.sortDir : 1;
        state.sortKey = key;
        state.page = 0;
        render();
      });
    });
    document.querySelector('#filter').addEventListener('input', e => {
      state.filter = e.target.value;
      state.page = 0;
      render();
    });
    document.querySelector('#page-prev').addEventListener('click', () => { state.page--; render(); });
    document.querySelector('#page-next').addEventListener('click', () => { state.page++; render(); });
    document.querySelector('#export-csv').addEventListener('click', exportCsv);

    loadUsage();
    ```

    Add the pager next to the table. The ids are the ones the script uses:

    ```html
    <div class="pager">
      <button id="page-prev" type="button">Previous</button>
      <span id="page-info"></span>
      <button id="page-next" type="button">Next</button>
    </div>
    ```

    **Green Notes**
    - **Pagination, 100 rows per page** (reduces E on the client, M): the browser now holds about 700 elements instead of more than 170,000, and a sort or filter rebuilds one page. In Green Metrics Tool browser benchmarks, 30 page loads of a 10,000-row table built from 14 elements per row used ~1036 J. The same data paginated to 100 rows per page as a plain table built in a `DocumentFragment` used ~457 J, about 56% less. Your table has a different shape, so treat that as the direction, not a forecast.
    - **Plain cells, one insert** (reduces E): the `div` and `span` wrappers are gone, so a row is 7 elements instead of 19. The class moved to the `td`, and the page is attached once with `replaceChildren`.

    Behavior notes:
    - Sorting and filtering still run over all rows, and the CSV export still contains every row that matches the filter.
    - Sorting or filtering jumps back to page 1.
    - Browser find (Ctrl+F) only finds text on the current page.
    - If your CSS targets `.cell` or the inner `span`, point those rules at `td.cell-<column>` instead.
    - I also fixed the sort comparator. It never returned 0 for equal values, which can make the order of equal rows inconsistent.
verify:
  static_only: Needs a browser DOM, fetch and Blob APIs; no jsdom available in the stdlib-only checker.
