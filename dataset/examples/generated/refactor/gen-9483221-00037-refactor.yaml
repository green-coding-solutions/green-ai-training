    ```js
    const scanBar = document.getElementById('scan-bar');
    const cursor = document.getElementById('tail-cursor');
    const statusEl = document.getElementById('scan-status');
    const results = document.getElementById('scan-results');

    let rafId = null;
    let scanning = false;

    function animateScan(ts) {
      const phase = (ts % 1600) / 1600;
      scanBar.style.transform = 'translateX(' + (-100 + phase * 400) + '%)';
      rafId = requestAnimationFrame(animateScan);
    }

    function startScan() {
      if (scanning) return;
      scanning = true;
      scanBar.hidden = false;
      statusEl.textContent = 'Scanning archive...';
      rafId = requestAnimationFrame(animateScan);
    }

    function stopScan(message) {
      scanning = false;
      cancelAnimationFrame(rafId);
      scanBar.hidden = true;
      statusEl.textContent = message;
    }

    setInterval(function () {
      cursor.style.opacity = cursor.style.opacity === '0' ? '1' : '0';
    }, 500);

    async function scanArchive(url, pattern) {
      startScan();
      try {
        const res = await fetch(url + '?q=' + encodeURIComponent(pattern));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        results.textContent = data.lines.join('\n');
        stopScan(data.lines.length + ' matching lines');
      } catch (err) {
        stopScan('Scan failed: ' + err.message);
      }
    }
    ```

