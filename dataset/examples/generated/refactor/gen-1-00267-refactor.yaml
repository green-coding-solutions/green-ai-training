id: gen-1-00267-refactor
category: refactor
language: python
patterns:
- builtin-functions
messages:
- role: user
  content: |
    hello, can you make this more clean and faster pls? its the helper for our shiping price endpoint, it run on every cart change. my english is not so good sorry

    ```python
    def total_weight(items):
        total = 0
        for i in range(len(items)):
            total = total + items[i]["weight"] * items[i]["qty"]
        return total


    def has_fragile(items):
        found = False
        for item in items:
            if item.get("fragile"):
                found = True
        return found


    def all_in_stock(items):
        ok = True
        for item in items:
            if item["stock"] < item["qty"]:
                ok = False
        return ok


    def cheapest_item(items):
        cheapest = None
        for item in items:
            if cheapest is None or item["price"] < cheapest["price"]:
                cheapest = item
        return cheapest


    def discounted_count(items):
        n = 0
        for item in items:
            if item.get("discount", 0) > 0:
                n = n + 1
        return n


    def build_summary(items):
        cheapest = cheapest_item(items)
        return {
            "weight": total_weight(items),
            "fragile": has_fragile(items),
            "available": all_in_stock(items),
            "cheapest": cheapest["name"] if cheapest else None,
            "discounted": discounted_count(items),
        }
    ```
- role: assistant
  content: |
    ```python
    def total_weight(items):
        return sum(item["weight"] * item["qty"] for item in items)


    def has_fragile(items):
        return any(item.get("fragile") for item in items)


    def all_in_stock(items):
        return all(item["stock"] >= item["qty"] for item in items)


    def cheapest_item(items):
        return min(items, key=lambda item: item["price"], default=None)


    def discounted_count(items):
        return sum(1 for item in items if item.get("discount", 0) > 0)


    def build_summary(items):
        cheapest = cheapest_item(items)
        return {
            "weight": total_weight(items),
            "fragile": has_fragile(items),
            "available": all_in_stock(items),
            "cheapest": cheapest["name"] if cheapest else None,
            "discounted": discounted_count(items),
        }
    ```

    The output is the same as before. If two items share the lowest price, `min` returns the first one, just like your loop did. An empty cart still gives `None` for `cheapest`.

    **Green Notes**
    - **Built-ins instead of hand-written loops** (reduces E): `sum`, `any`, `all` and `min` do the looping in C. Only the small expression for each item still runs as Python. This code runs on every cart change, so the saving repeats with every request.
    - **Early exit:** `has_fragile` and `all_in_stock` now stop at the first item that decides the answer. Your loops always went through the whole cart, even when the answer was already known. The code has no side effects, so stopping early is safe.
    - **No index loop:** I removed `range(len(items))` with `items[i]`. The code is also shorter and easier to read now.
    - Carts are small, so each call saves only a little. But the change costs nothing, because the code also gets simpler. To see the real effect, run a load test on the endpoint with `perf stat`. I don't have a number for your setup.
verify:
  test: |
    items = [
        {"name": "a", "weight": 1.5, "qty": 2, "price": 10, "stock": 5, "fragile": True, "discount": 0.1},
        {"name": "b", "weight": 0.5, "qty": 1, "price": 4, "stock": 1},
        {"name": "c", "weight": 2, "qty": 3, "price": 4, "stock": 2, "discount": 0},
    ]
    s = build_summary(items)
    assert s == {"weight": 9.5, "fragile": True, "available": False, "cheapest": "b", "discounted": 1}
    assert build_summary([]) == {"weight": 0, "fragile": False, "available": True, "cheapest": None, "discounted": 0}
