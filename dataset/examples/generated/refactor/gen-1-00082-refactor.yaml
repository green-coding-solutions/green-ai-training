    ```python
    import re
    from collections import Counter


    def slow_requests(conn, since, threshold_ms=500):
        cur = conn.execute(
            "SELECT * FROM app_logs WHERE ts >= ? AND level = 'INFO' ORDER BY ts",
            (since,),
        )
        cols = [c[0] for c in cur.description]
        slow = []
        per_route = Counter()
        for row in cur.fetchall():
            rec = dict(zip(cols, row))
            m = re.match(r"(GET|POST|PUT|DELETE) (\S+) .* took=(\d+)ms$", rec["message"])
            if m is None:
                continue
            method, path, ms = m.group(1), m.group(2), int(m.group(3))
            per_route[path] += 1
            if ms >= threshold_ms:
                slow.append((rec["ts"], method, path, ms))
        return slow, per_route.most_common(3)
    ```
