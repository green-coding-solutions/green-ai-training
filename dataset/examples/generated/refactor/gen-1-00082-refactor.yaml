    ```python
    import re
    from collections import Counter

    REQUEST_RE = re.compile(r"(GET|POST|PUT|DELETE) (\S+) .* took=(\d+)ms$")


    def slow_requests(conn, since, threshold_ms=500):
        cur = conn.execute(
            "SELECT ts, message FROM app_logs WHERE ts >= ? AND level = 'INFO' ORDER BY ts",
            (since,),
        )
        slow = []
        per_route = Counter()
        for ts, message in cur.fetchall():
            m = REQUEST_RE.match(message)
            if m is None:
                continue
            method, path, ms = m.group(1), m.group(2), int(m.group(3))
            per_route[path] += 1
            if ms >= threshold_ms:
                slow.append((ts, method, path, ms))
        return slow, per_route.most_common(3)
    ```

    **Green Notes**
    - **Select only the needed columns** (reduces E): the function only reads `ts` and `message`, but `SELECT *` pulls every column of every matching row, including any large ones like payloads or stack traces. In Green Metrics Tool PostgreSQL micro-benchmarks, reading a 52-column table with large text columns used about 5.5× to 7× less energy when the query named the 10 needed columns. The saving grows with the size of the columns you skip. If your log table has only small columns, expect less. The `dict(zip(...))` per row is gone too.
    - **Precompiled regex** (reduces E): the pattern is now built once at module level. This is a small win, because Python's `re` caches compiled patterns (up to 512). In Green Metrics Tool micro-benchmarks, precompiled matching used about 18% less CPU energy than inline `re.match` over 1,000,000 matches. It is mainly cleaner, and it protects you if the pattern ever becomes dynamic.

    The results are the same. Rows, order and matching are unchanged.
