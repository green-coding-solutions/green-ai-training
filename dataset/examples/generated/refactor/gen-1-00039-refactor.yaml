    ```python
    import sys
    import math

    STOPWORDS = frozenset([
        "a", "an", "and", "are", "as", "at", "be", "but", "by", "for", "from",
        "had", "has", "have", "he", "her", "his", "i", "if", "in", "into", "is",
        "it", "its", "of", "on", "or", "she", "that", "the", "their", "them",
        "then", "there", "they", "this", "to", "was", "we", "were", "which",
        "will", "with", "you", "your",
    ])


    def load_words(path):
        words = []
        with open(path, encoding="utf-8") as f:
            for line in f:
                for raw in line.split():
                    w = raw.strip(".,;:!?\"'()").lower()
                    if w and w not in STOPWORDS:
                        words.append(w)
        return words


    def weights(words):
        counts = {}
        for w in words:
            counts[w] = counts.get(w, 0) + 1
        log = math.log
        out = [(w, 1 + log(c)) for w, c in counts.items()]
        out.sort(key=lambda t: (-t[1], t[0]))
        return out


    def main():
        if len(sys.argv) != 2:
            print("usage: keywords.py FILE")
            return 1
        for w, score in weights(load_words(sys.argv[1]))[:20]:
            print(f"{score:6.3f}  {w}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
    ```

    **Green Notes**
    - **Set for repeated membership tests** (reduces E): `w not in STOPWORDS` runs once for every word in the file, and on a list each check scans the whole list for most words. A `frozenset` is built once at import, and each check is then a hash lookup. Building a set only pays off with many lookups: in Green Metrics Tool micro-benchmarks, one test on a 10,000,000-element list (~6.9 J) was cheaper than converting it to a set first (~10.5 J). Here you test every word of the input, so the set wins.
    - **Local alias for `math.log`** (reduces E): the lookup is done once instead of once per unique word. This is a small gain. In Green Metrics Tool micro-benchmarks, caching `math.sqrt` before a 10,000,000-iteration loop saved about 4-5%. It is a cheap change, but it will not change much for this script.

    Output is identical. `load_words` keeps the same order and duplicates, and the ranking sorts the same way.
