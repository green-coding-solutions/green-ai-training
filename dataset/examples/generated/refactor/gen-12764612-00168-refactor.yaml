messages:
- role: user
  content: |
    Please optimize this CLI. We run it on a weekly export of survey comments (a few hundred thousand rows) on a CPU-only build box. Requirements: keep all CLI flags and the output CSV format exactly as they are, no new dependencies, and keep the code readable because the whole team maintains it.

    ```python
    import argparse
    import csv
    import sys

    import torch

    from sentiment_feats import encode  # text -> list[float], length 128

    LABELS = ["negative", "neutral", "positive"]


    def load_model(path):
        model = torch.jit.load(path, map_location="cpu")
        model.eval()
        return model


    def score_batch(model, texts):
        x = torch.tensor([encode(t) for t in texts], dtype=torch.float32)
        logits = model(x)
        probs = torch.softmax(logits, dim=1)
        conf, idx = probs.max(dim=1)
        return [(LABELS[i], float(c)) for i, c in zip(idx.tolist(), conf.tolist())]


    def main():
        ap = argparse.ArgumentParser(description="Score survey comments")
        ap.add_argument("input")
        ap.add_argument("output")
        ap.add_argument("--model", default="models/sentiment.pt")
        ap.add_argument("--batch-size", type=int, default=64)
        ap.add_argument("--text-col", default="comment")
        args = ap.parse_args()

        model = load_model(args.model)

        with open(args.input, newline="", encoding="utf-8") as f:
            rows = list(csv.DictReader(f))

        for start in range(0, len(rows), args.batch_size):
            chunk = rows[start:start + args.batch_size]
            results = score_batch(model, [r[args.text_col] for r in chunk])
            for row, (label, conf) in zip(chunk, results):
                row["sentiment"] = label
                row["confidence"] = f"{conf:.4f}"

        if not rows:
            print("no rows", file=sys.stderr)
            return 1

        with open(args.output, "w", encoding="utf-8") as f:
            writer = csv.DictWriter(f, fieldnames=list(rows[0].keys()))
            writer.writeheader()
            writer.writerows(rows)
        return 0


    if __name__ == "__main__":
        sys.exit(main())
    ```
