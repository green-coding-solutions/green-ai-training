    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Rack C3 - Hardware Runbook</title>
      <link rel="stylesheet" href="/static/runbook.css">
    </head>
    <body>
      <header class="top">
        <img src="/static/logo.svg" alt="Infra team" width="32" height="32">
