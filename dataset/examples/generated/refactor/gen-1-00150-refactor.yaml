    ```

    **Green Notes**
    - **Modern image formats** (reduces network): the three photos are now offered as AVIF and WebP, with the original JPG as fallback. Browsers pick the first format they support, so every visitor gets fewer bytes for the same photo, and old browsers still work. The savings come from the smaller files, not from cheaper decoding: in Green Metrics Tool micro-benchmarks, AVIF decoding cost about 19% more client CPU energy than JPG over 50 page loads.
    - **Encode once, at build time** (reduces E): AVIF encoding is the expensive part. In the same benchmarks, encoding 50 images with AVIF cost about 7× as much as with JPG. Create the `.avif` and `.webp` files in your CI build step, or when a photo is added to the repo. Never convert them per request.
    - **Left as is:** `logo.svg` is already the best format for a small icon. The `width` and `height` attributes stay, so the layout does not jump while images load.

    The `.avif` and `.webp` files must exist next to the JPGs with the same base names. If one is missing, that browser shows a broken image instead of falling back. This is an internal page, so the byte saving is modest. It is cheap to keep once the build step produces the files.
