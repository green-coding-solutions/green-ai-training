        </figure>

        <figure>
          <picture>
            <source type="image/avif" srcset="/media/rack-c3-ups-panel.avif">
            <source type="image/webp" srcset="/media/rack-c3-ups-panel.webp">
            <img src="/media/rack-c3-ups-panel.jpg"
                 alt="UPS display showing battery status" width="1200" height="800">
