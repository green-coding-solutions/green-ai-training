    mkdir -p "$ARCHIVE_DIR"
    echo "=== archive run $(date +%F) ===" >> "$LOG_FILE"

    for dir in "$ARTIFACT_DIR"/build-*; do
      [ -d "$dir" ] || continue
      name=$(basename "$dir")
      target="$ARCHIVE_DIR/$name.tar.xz"
      if [ -f "$target" ]; then
