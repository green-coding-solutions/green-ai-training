    **Green Notes**
    - **Lazy loading was on the wrong image** (reduces network, E): the energy plot is the first thing visitors see, and it had `loading="lazy"`. That only delays it. It is now eager. The RMSD plot and the 13 snapshots are below the fold, so they now carry `loading="lazy"`.
    - **When it pays off:** in Green Metrics Tool micro-benchmarks with a 15-photo article loaded 20 times without scrolling, lazy loading below the fold used about 12% less energy. When the visitor scrolled to the end, there was no difference. If readers of this report usually scroll through all snapshots, expect little saving.
    - Your `width` and `height` attributes stay, so the layout does not jump when lazy images load.
