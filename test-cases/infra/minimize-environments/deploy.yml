name: Deploy

on:
  push:
    branches: ["**"]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t registry.example.com/shop:${{ github.sha }} .

      - name: Push image
        run: docker push registry.example.com/shop:${{ github.sha }}

      # every branch gets its own full environment: app (3 replicas), Postgres, Redis, worker
      - name: Deploy preview environment
        run: |
          helm upgrade --install "shop-${GITHUB_REF_NAME//\//-}" ./chart \
            --namespace previews --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set replicaCount=3 \
            --set postgres.enabled=true \
            --set redis.enabled=true \
            --set worker.enabled=true

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy staging
        run: |
          helm upgrade --install shop-staging ./chart \
            --namespace staging \
            --set image.tag=${{ github.sha }} \
            --set replicaCount=3
