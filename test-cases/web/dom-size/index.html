<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audit Log</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    .row-wrapper { border-bottom: 1px solid #ddd; }
    .row { display: flex; gap: 1rem; padding: 0.25rem 0; }
    .cell-wrapper { flex: 1; }
    .cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Audit Log</h1>
  <div id="log"></div>

  <script>
    const ACTIONS = ["login", "logout", "update_profile", "export_report", "delete_item"];
    const entries = [];
    for (let i = 0; i < 10000; i++) {
      entries.push({
        id: i + 1,
        user: "user" + (i % 250),
        action: ACTIONS[i % ACTIONS.length],
        ts: new Date(Date.UTC(2026, 9, 1, 0, 0, i)).toISOString(),
      });
    }

    const log = document.getElementById("log");
    for (const e of entries) {
      const rowWrapper = document.createElement("div");
      rowWrapper.className = "row-wrapper";
      const row = document.createElement("div");
      row.className = "row";
      for (const value of [e.id, e.ts, e.user, e.action]) {
        const cellWrapper = document.createElement("div");
        cellWrapper.className = "cell-wrapper";
        const cell = document.createElement("div");
        cell.className = "cell";
        const span = document.createElement("span");
        span.textContent = value;
        cell.appendChild(span);
        cellWrapper.appendChild(cell);
        row.appendChild(cellWrapper);
      }
      rowWrapper.appendChild(row);
      log.appendChild(rowWrapper);
    }
  </script>
</body>
</html>
