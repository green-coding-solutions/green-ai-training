<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Animation Benchmark</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    .box {
      position: absolute;
      width: 40px;
      height: 40px;
      will-change: transform;
    }
  </style>
</head>
<body>
  <script>
    const BOXES = 100, RANGE = 300, PERIOD = 2000;
    const boxes = [];
    for (let i = 0; i < BOXES; i++) {
      const box = document.createElement('div');
      box.className = 'box';
      box.style.top = (i * 6) + 'px';
      box.style.background = `hsl(${(i * 37) % 360}, 70%, 55%)`;
      document.body.appendChild(box);
      boxes.push(box);
    }
    window.frameCount = 0;
    function animate(ts) {
      const cycle = (ts % PERIOD) / PERIOD;
      const t = cycle < 0.5 ? cycle * 2 : 2 - cycle * 2;
      const x = t * RANGE;
      for (let i = 0; i < BOXES; i++) boxes[i].style.transform = `translateX(${x}px)`;
      window.frameCount++;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
