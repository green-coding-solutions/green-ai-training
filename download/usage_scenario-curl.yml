---
name: Download Benchmark - curl
author: arne@green-coding.io
description: Measures energy cost of downloading files of various sizes using curl from a local nginx server

custom_metrics:
  downloaded_mb:
    unit: MB
    sci: True

services:
  downloader:
    image: python:3.15.0b1-alpine3.23
    entrypoint: ["sleep", "infinity"]
    setup-commands:
      - command: apk add --no-cache curl coreutils bash

flow:

  - name: Warmup request
    container: downloader
    hidden: true
    commands:
      - type: console
        command: curl -s -o /tmp/myfile http://192.168.178.21:5000/v2/greencoding/gcb_playwright/blobs/sha256:bcd75d43ae9cf5009693665314b8d0fed6be26d86296ffba61c36f70a97d3247
        note: Warmup download to prime connection and server cache

  - name: Download 85 MB
    container: downloader
    commands:
      - type: console
        command: curl -s -o /tmp/myfile http://192.168.178.21:5000/v2/greencoding/gcb_playwright/blobs/sha256:bcd75d43ae9cf5009693665314b8d0fed6be26d86296ffba61c36f70a97d3247
        note: Download 85MB file with curl
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=85"
        shell: bash
        note: Emit SCI metric for 85MB download

  - name: Validate downloaded file size
    container: downloader
    hidden: true
    commands:
      - type: console
        command: SIZE=$(stat -c%s /tmp/myfile); [ "$SIZE" -gt 88080384 ] && [ "$SIZE" -lt 90177536 ] || (echo "File size $SIZE bytes is not between 84 and 86 MB" && exit 1)
        shell: bash
        note: Verify file is between 84 and 86 MB

  - name: Warmup request 756 MB
    container: downloader
    hidden: true
    commands:
      - type: console
        command: curl -s -o /tmp/myfile http://192.168.178.21:5000/v2/greencoding/gcb_playwright/blobs/sha256:e711a7a6610b9e81dbd0fd979e3899dae816284ad1ad8ed29e91c57dfac1fb08
        note: Warmup download to prime connection and server cache

  - name: Download 756 MB
    container: downloader
    commands:
      - type: console
        command: curl -s -o /tmp/myfile http://192.168.178.21:5000/v2/greencoding/gcb_playwright/blobs/sha256:e711a7a6610b9e81dbd0fd979e3899dae816284ad1ad8ed29e91c57dfac1fb08
        note: Download 756MB file with curl
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=756"
        shell: bash
        note: Emit SCI metric for 756MB download

  - name: Validate downloaded file size 756 MB
    container: downloader
    hidden: true
    commands:
      - type: console
        command: SIZE=$(stat -c%s /tmp/myfile); [ "$SIZE" -gt 791674880 ] && [ "$SIZE" -lt 793772032 ] || (echo "File size $SIZE bytes is not between 755 and 757 MB" && exit 1)
        shell: bash
        note: Verify file is between 755 and 757 MB
