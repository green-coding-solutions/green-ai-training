---
name: Download Benchmark - curl
author: arne@green-coding.io
description: Measures energy cost of downloading files of various sizes using curl from a local nginx server

custom_metrics:
  downloaded_mb:
    unit: MB
    sci: True

services:
  downloader:
    image: python:3.14.5-alpine3.23
    entrypoint: ["sleep", "infinity"]
    setup-commands:
      - command: apk add --no-cache curl coreutils bash

flow:

  - name: Download 1 MB
    container: downloader
    commands:
      - type: console
        command: curl -s -o /dev/null http://192.168.178.21:6000/1MB.bin
        note: Download 1 MB file with curl
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=1"
        shell: bash
        note: Emit SCI metric for 1MB download

  - name: Download 10 MB
    container: downloader
    commands:
      - type: console
        command: curl -s -o /dev/null http://192.168.178.21:6000/10MB.bin
        note: Download 10 MB file with curl
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=10"
        shell: bash
        note: Emit SCI metric for 10MB download

  - name: Download 100 MB
    container: downloader
    commands:
      - type: console
        command: curl -s -o /dev/null http://192.168.178.21:6000/100MB.bin
        note: Download 100 MB file with curl
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=100"
        shell: bash
        note: Emit SCI metric for 100 MB download

  - name: Download 1000 MB
    container: downloader
    commands:
      - type: console
        command: curl -s -o /dev/null http://192.168.178.21:6000/1000MB.bin
        note: Download 1000 MB file with curl
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=1000"
        shell: bash
        note: Emit SCI metric for 1000 MB download
