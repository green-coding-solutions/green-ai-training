---
name: Download Benchmark - Python requests
author: arne@green-coding.io
description: Measures energy cost of downloading files of various sizes using the Python requests library from a local nginx server

custom_metrics:
  downloaded_mb:
    unit: MB
    sci: True

services:
  downloader:
    image: python:3.14.5-alpine3.23
    entrypoint: ["sleep", "infinity"]
    setup-commands:
      - command: apk add --no-cache coreutils bash
      - command: pip install requests

flow:

  - name: Download 1 MB
    container: downloader
    commands:
      - type: console
        command: python3 /tmp/repo/download/download.py http://192.168.178.21:6000/1MB.bin
        note: Download 1MB file with Python requests (streaming, saved to /tmp/myfile)
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=1"
        shell: bash
        note: Emit SCI metric for 1MB download

  - name: Validate downloaded file size
    container: downloader
    hidden: true
    commands:
      - type: console
        command: SIZE=$(stat -c%s /tmp/myfile); [ "$SIZE" -gt 943718 ] && [ "$SIZE" -lt 1153433 ] || (echo "File size $SIZE bytes is not between 0.9 and 1.1 MB" && exit 1)
        shell: bash
        note: Verify file is between 0.9 and 1.1 MB

  - name: Download 10 MB
    container: downloader
    commands:
      - type: console
        command: python3 /tmp/repo/download/download.py http://192.168.178.21:6000/10MB.bin
        note: Download 10MB file with Python requests (streaming, saved to /tmp/myfile)
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=10"
        shell: bash
        note: Emit SCI metric for 10MB download

  - name: Validate downloaded file size 10 MB
    container: downloader
    hidden: true
    commands:
      - type: console
        command: SIZE=$(stat -c%s /tmp/myfile); [ "$SIZE" -gt 9437180 ] && [ "$SIZE" -lt 11534330 ] || (echo "File size $SIZE bytes is not between 9 and 11 MB" && exit 1)
        shell: bash
        note: Verify file is between 9 and 11 MB

  - name: Download 100 MB
    container: downloader
    commands:
      - type: console
        command: python3 /tmp/repo/download/download.py http://192.168.178.21:6000/100MB.bin
        note: Download 100MB file with Python requests (streaming, saved to /tmp/myfile)
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=100"
        shell: bash
        note: Emit SCI metric for 100MB download

  - name: Validate downloaded file size 100 MB
    container: downloader
    hidden: true
    commands:
      - type: console
        command: SIZE=$(stat -c%s /tmp/myfile); [ "$SIZE" -gt 103809024 ] && [ "$SIZE" -lt 105906176 ] || (echo "File size $SIZE bytes is not between 99 and 101 MB" && exit 1)
        shell: bash
        note: Verify file is between 99 and 101 MB

  - name: Download 1000 MB
    container: downloader
    commands:
      - type: console
        command: python3 /tmp/repo/download/download.py http://192.168.178.21:6000/1000MB.bin
        note: Download 1000MB file with Python requests (streaming, saved to /tmp/myfile)
      - type: console
        command: echo "$(gdate +%s%N) downloaded_mb=1000"
        shell: bash
        note: Emit SCI metric for 1000 MB download

  - name: Validate downloaded file size 1000 MB
    container: downloader
    hidden: true
    commands:
      - type: console
        command: SIZE=$(stat -c%s /tmp/myfile); [ "$SIZE" -gt 1047527424 ] && [ "$SIZE" -lt 1074000000 ] || (echo "File size $SIZE bytes is not between 999 and 1001 MB" && exit 1)
        shell: bash
        note: Verify file is between 900 and 1100 MB
