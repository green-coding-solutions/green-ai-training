---
name: Compression Benchmark - lz4
author: arne@green-coding.io
description: Measures energy cost of lz4 compression and decompression on text data (enwik8 benchmark corpus)

custom_metrics:
  compressed_mb:
    unit: MB
    sci: True
  uncompressed_mb:
    unit: MB
    sci: True

services:
  fedora:
    image: fedora:44
    setup-commands:
      - command: dnf install -y lz4 curl unzip

flow:
  - name: Prepare
    hidden: True
    container: fedora
    commands:
      - type: console
        command: curl -sS -o /tmp/enwik8.zip https://mattmahoney.net/dc/enwik8.zip
        note: Download enwik8 standard 100MB text compression benchmark (36MB zip)
      - type: console
        command: unzip /tmp/enwik8.zip -d /tmp/
        note: Extract to get 100MB Wikipedia XML text file
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=1 of=/tmp/enwik8_1mb
        note: Create exact 1MB slice for small file test
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=10 of=/tmp/enwik8_10mb
        note: Create exact 10MB slice for medium file test

  - name: Compress 1 MB
    container: fedora
    commands:
      - type: console
        command: lz4 -c /tmp/enwik8_1mb > /tmp/enwik8_1mb.lz4
        shell: bash
        note: Compress 1MB text file with lz4
      - type: console
        command: echo "$(date +%s%N) compressed_mb=1"
        shell: bash
        note: Emit SCI metric for 1MB compression

  - name: Compress 10 MB
    container: fedora
    commands:
      - type: console
        command: lz4 -c /tmp/enwik8_10mb > /tmp/enwik8_10mb.lz4
        shell: bash
        note: Compress 10MB text file with lz4
      - type: console
        command: echo "$(date +%s%N) compressed_mb=10"
        shell: bash
        note: Emit SCI metric for 10MB compression

  - name: Compress 100 MB
    container: fedora
    commands:
      - type: console
        command: lz4 -c /tmp/enwik8 > /tmp/enwik8.lz4
        shell: bash
        note: Compress 100MB enwik8 with lz4
      - type: console
        command: echo "$(date +%s%N) compressed_mb=100"
        shell: bash
        note: Emit SCI metric for 100MB compression

  - name: Uncompress 1 MB
    container: fedora
    commands:
      - type: console
        command: lz4 -dc /tmp/enwik8_1mb.lz4 > /tmp/enwik8_1mb_decompressed
        shell: bash
        note: Decompress 1MB lz4 archive
      - type: console
        command: echo "$(date +%s%N) uncompressed_mb=1"
        shell: bash
        note: Emit SCI metric for 1MB decompression

  - name: Uncompress 10 MB
    container: fedora
    commands:
      - type: console
        command: lz4 -dc /tmp/enwik8_10mb.lz4 > /tmp/enwik8_10mb_decompressed
        shell: bash
        note: Decompress 10MB lz4 archive
      - type: console
        command: echo "$(date +%s%N) uncompressed_mb=10"
        shell: bash
        note: Emit SCI metric for 10MB decompression

  - name: Uncompress 100 MB
    container: fedora
    commands:
      - type: console
        command: lz4 -dc /tmp/enwik8.lz4 > /tmp/enwik8_decompressed
        shell: bash
        note: Decompress 100MB lz4 archive
      - type: console
        command: echo "$(date +%s%N) uncompressed_mb=100"
        shell: bash
        note: Emit SCI metric for 100MB decompression
