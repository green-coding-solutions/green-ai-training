---
name: Compression Benchmark - p7zip
author: arne@green-coding.io
description: Measures energy cost of 7-Zip compression and decompression on text data (enwik8 benchmark corpus)

custom_metrics:
  compressed_mb:
    unit: MB
    sci: True
  uncompressed_mb:
    unit: MB
    sci: True

services:
  fedora:
    image: fedora:44
    setup-commands:
      - command: dnf install -y p7zip curl unzip

flow:
  - name: Prepare
    hidden: True
    container: fedora
    commands:
      - type: console
        command: curl -sS -o /tmp/enwik8.zip https://mattmahoney.net/dc/enwik8.zip
        note: Download enwik8 standard 100MB text compression benchmark (36MB zip)
      - type: console
        command: unzip /tmp/enwik8.zip -d /tmp/
        note: Extract to get 100MB Wikipedia XML text file
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=1 of=/tmp/enwik8_1mb
        note: Create exact 1MB slice for small file test
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=10 of=/tmp/enwik8_10mb
        note: Create exact 10MB slice for medium file test

  - name: Compress 1 MB
    container: fedora
    commands:
      - type: console
        command: 7za a /tmp/enwik8_1mb.7z /tmp/enwik8_1mb
        shell: bash
        note: Compress 1MB text file with 7-Zip
      - type: console
        command: echo "$(date +%s%N) compressed_mb=1"
        shell: bash
        note: Emit SCI metric for 1MB compression

  - name: Compress 10 MB
    container: fedora
    commands:
      - type: console
        command: 7za a /tmp/enwik8_10mb.7z /tmp/enwik8_10mb
        shell: bash
        note: Compress 10MB text file with 7-Zip
      - type: console
        command: echo "$(date +%s%N) compressed_mb=10"
        shell: bash
        note: Emit SCI metric for 10MB compression

  - name: Compress 100 MB
    container: fedora
    commands:
      - type: console
        command: 7za a /tmp/enwik8.7z /tmp/enwik8
        shell: bash
        note: Compress 100MB enwik8 with 7-Zip
      - type: console
        command: echo "$(date +%s%N) compressed_mb=100"
        shell: bash
        note: Emit SCI metric for 100MB compression

  - name: Uncompress 1 MB
    container: fedora
    commands:
      - type: console
        command: 7za e /tmp/enwik8_1mb.7z -o/tmp/decomp_1mb/ -y
        shell: bash
        note: Decompress 1MB 7-Zip archive
      - type: console
        command: echo "$(date +%s%N) uncompressed_mb=1"
        shell: bash
        note: Emit SCI metric for 1MB decompression

  - name: Uncompress 10 MB
    container: fedora
    commands:
      - type: console
        command: 7za e /tmp/enwik8_10mb.7z -o/tmp/decomp_10mb/ -y
        shell: bash
        note: Decompress 10MB 7-Zip archive
      - type: console
        command: echo "$(date +%s%N) uncompressed_mb=10"
        shell: bash
        note: Emit SCI metric for 10MB decompression

  - name: Uncompress 100 MB
    container: fedora
    commands:
      - type: console
        command: 7za e /tmp/enwik8.7z -o/tmp/decomp_100mb/ -y
        shell: bash
        note: Decompress 100MB 7-Zip archive
      - type: console
        command: echo "$(date +%s%N) uncompressed_mb=100"
        shell: bash
        note: Emit SCI metric for 100MB decompression
