---
name: Compression Benchmark - zstd
author: arne@green-coding.io
description: Measures energy cost of zstd compression and decompression on text data (enwik8 benchmark corpus)

services:
  fedora:
    image: fedora:44
    setup-commands:
      - command: dnf install -y zstd curl unzip

flow:
  - name: Prepare
    container: fedora
    commands:
      - type: console
        command: curl -sS -o /tmp/enwik8.zip https://mattmahoney.net/dc/enwik8.zip
        note: Download enwik8 standard 100MB text compression benchmark (36MB zip)
      - type: console
        command: unzip /tmp/enwik8.zip -d /tmp/
        note: Extract to get 100MB Wikipedia XML text file
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=1 of=/tmp/enwik8_1mb
        note: Create exact 1MB slice for small file test

  - name: Compress
    container: fedora
    commands:
      - type: console
        command: zstd -c /tmp/enwik8_1mb > /tmp/enwik8_1mb.zst
        shell: bash
        note: Compress 1MB text file with zstd
      - type: console
        command: zstd -c /tmp/enwik8 > /tmp/enwik8.zst
        shell: bash
        note: Compress 100MB enwik8 with zstd

  - name: Uncompress
    container: fedora
    commands:
      - type: console
        command: zstd -dc /tmp/enwik8_1mb.zst > /tmp/enwik8_1mb_decompressed
        shell: bash
        note: Decompress 1MB zstd archive
      - type: console
        command: zstd -dc /tmp/enwik8.zst > /tmp/enwik8_decompressed
        shell: bash
        note: Decompress 100MB zstd archive
