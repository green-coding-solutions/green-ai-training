---
name: Image Format Rendering Cost - Headful Browser
author: Arne Tarara <arne@green-coding.io>
description: >
  Same as the headless variant but runs Firefox with a real (Xvfb virtual) display,
  measuring any additional rendering cost from compositing and display output.

custom_metrics:
  image_page_load:
    unit: Image Page Loads
    sci: True

services:
  gcb-image-formats-nginx:
    image: nginx:alpine
    folder-destination: /usr/share/nginx/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      start_period: 5s
      start_interval: 1s

  gmt-playwright-nodejs:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    depends_on:
      gcb-image-formats-nginx:
        condition: service_healthy
    setup-commands:
      - command: apt-get install -y xvfb
        shell: bash
      - command: cd /tmp/gmt-utils && npm init -y && npm install playwright@1.59.1
        shell: bash

flow:
  - name: Start virtual display and browser
    container: gmt-playwright-nodejs
    hidden: true
    commands:
      - type: console
        command: Xvfb :99 -screen 0 1920x1080x24
        shell: bash
        detach: true
        note: Start virtual framebuffer
      - type: console
        command: sleep 1
        note: Wait for Xvfb to initialize
      - type: console
        command: DISPLAY=:99 node /tmp/gmt-utils/gmt-playwright-ipc.js --headless false --browser firefox
        shell: bash
        detach: true
        note: Start headful browser via IPC
      - type: console
        command: timeout 30 bash -c 'until [ -p "/tmp/playwright-ipc-ready" ]; do sleep 1; done && echo "Browser ready!"'
        shell: bash
        note: Wait for browser IPC to be ready

  - name: Load AVIF image page
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: page_result = await page.goto("http://gcb-image-formats-nginx/index_avif.html");
      - type: playwright
        command: await page.waitForLoadState('networkidle');
      - type: console
        command: echo $(date +%s%N) image_page_load=1
        shell: sh

  - name: Load GIF image page
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: page_result = await page.goto("http://gcb-image-formats-nginx/index_gif.html");
      - type: playwright
        command: await page.waitForLoadState('networkidle');
      - type: console
        command: echo $(date +%s%N) image_page_load=1
        shell: sh

  - name: Load JPG image page
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: page_result = await page.goto("http://gcb-image-formats-nginx/index_jpg.html");
      - type: playwright
        command: await page.waitForLoadState('networkidle');
      - type: console
        command: echo $(date +%s%N) image_page_load=1
        shell: sh

  - name: Load PNG image page
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: page_result = await page.goto("http://gcb-image-formats-nginx/index_png.html");
      - type: playwright
        command: await page.waitForLoadState('networkidle');
      - type: console
        command: echo $(date +%s%N) image_page_load=1
        shell: sh

  - name: Load TIFF image page
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: page_result = await page.goto("http://gcb-image-formats-nginx/index_tiff.html");
      - type: playwright
        command: await page.waitForLoadState('networkidle');
      - type: console
        command: echo $(date +%s%N) image_page_load=1
        shell: sh

  - name: Load WebP image page
    container: gmt-playwright-nodejs
    commands:
      - type: playwright
        command: page_result = await page.goto("http://gcb-image-formats-nginx/index_webp.html");
      - type: playwright
        command: await page.waitForLoadState('networkidle');
      - type: console
        command: echo $(date +%s%N) image_page_load=1
        shell: sh
